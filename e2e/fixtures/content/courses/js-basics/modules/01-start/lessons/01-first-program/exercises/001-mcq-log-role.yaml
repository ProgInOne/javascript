id: js-basics.start.first-program.mcq-log-role
type: mcq_single
difficulty: 1
concepts:
  - { id: js.basics.console-log, weight: 1 }
estimatedSeconds: 40
prompt: |
  `console.log("완료");`를 실행하면 어떤 일이 일어나나요?
spec:
  options:
    - id: a
      text: 콘솔에 `완료`라는 글자가 보인다
    - id: b
      text: "`완료`라는 값이 저장되어 다음 줄에서 다시 쓸 수 있다"
      misconception: js.mc.log-is-return
      rationale: console.log는 보여 주기만 하고 값을 저장하지 않아요.
    - id: c
      text: 프로그램이 끝난다
      rationale: console.log는 출력만 할 뿐이에요.
  correct: a
misconceptions: [js.mc.log-is-return]
hints:
  - '`log`는 "기록하다"라는 뜻이에요. 어디에 기록할까요?'
  - console.log는 사람이 볼 수 있게 보여 주는 일만 해요.
  - 출력은 저장과 다른 일이에요.
explanation: |
  정답은 **콘솔에 `완료`라는 글자가 보인다**예요. console.log는 값을 콘솔에 보여 줄 뿐 저장하지 않아요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
