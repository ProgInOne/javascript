# JavaScript 오개념

# ── first-program ──

- id: js.mc.expression-prints-itself
  concept: js.basics.statements
  title: 값만 써도 출력된다고 생각함
  statement: "`1 + 2;`처럼 계산식만 문장으로 써 두면 결과가 콘솔에 나온다고 생각한다."
  reality: 프로그램은 계산만 하고 결과를 보여 주지 않는다. 콘솔에 보이게 하려면 console.log(1 + 2)처럼 출력하라고 시켜야 한다.
  diagnosticHint: 개발자 도구 콘솔에 한 줄씩 입력할 때는 결과가 바로 보이지만, 프로그램 파일을 실행할 때는 그렇지 않다.
  remediation:
    lessonSection: js-basics.start.first-program#pitfalls
    exercises: [js-basics.start.first-program.mcq-expression-alone]

- id: js.mc.log-prints-quotes
  concept: js.basics.console-log
  title: 따옴표까지 출력된다고 생각함
  statement: 'console.log("안녕")을 실행하면 콘솔에 따옴표까지 포함한 "안녕"이 나온다고 생각한다.'
  reality: 따옴표는 "여기부터 여기까지가 글자(문자열)"라고 표시하는 기호일 뿐이다. 콘솔에는 따옴표 안의 글자만 나온다.
  remediation:
    lessonSection: js-basics.start.first-program#pitfalls
    exercises: [js-basics.start.first-program.predict-quoted-expression]

- id: js.mc.quoted-expression-evaluates
  concept: js.basics.console-log
  title: 따옴표 안의 식도 계산된다고 생각함
  statement: 'console.log("3 + 4")가 7을 출력한다고 생각한다.'
  reality: 따옴표로 감싸면 글자(문자열)가 되어 계산되지 않고 글자 그대로 3 + 4가 출력된다. 계산하려면 따옴표 없이 console.log(3 + 4)라고 쓴다.
  diagnosticHint: 따옴표가 있으면 "글자", 없으면 "계산할 값"으로 읽는다.
  remediation:
    lessonSection: js-basics.start.first-program#pitfalls
    exercises:
      - js-basics.start.first-program.predict-quoted-expression
      - js-basics.start.first-program.fix-quoted-total

- id: js.mc.log-is-return
  concept: js.basics.console-log
  title: 출력과 결과값을 같은 것으로 봄
  statement: console.log로 출력한 값이 console.log의 결과로 돌아온다고(어딘가에 저장된다고) 생각한다.
  reality: console.log는 콘솔에 보여 주기만 하고, 결과로 돌려주는 값은 "값 없음"을 뜻하는 undefined다. 출력과 결과값은 다르다.
  diagnosticHint: console.log(console.log(1))을 실행하면 1 다음에 undefined가 출력된다.
  remediation:
    lessonSection: js-basics.start.first-program#pitfalls
    exercises: [js-basics.start.first-program.predict-log-of-log]

- id: js.mc.line-comment-multiline
  concept: js.basics.comments
  title: "//가 여러 줄을 주석 처리한다고 생각함"
  statement: "// 한 번이면 그 아래 여러 줄까지 주석이 된다고 생각한다."
  reality: "//는 그 줄의 끝까지만 주석으로 만든다. 여러 줄을 주석으로 만들려면 줄마다 //를 붙이거나 /* */로 감싼다."
  remediation:
    lessonSection: js-basics.start.first-program#pitfalls
    exercises: [js-basics.start.first-program.predict-comment-one-line]

# ── reading-errors ──

- id: js.mc.code-after-error-runs
  concept: js.errors.error-messages
  title: 오류 뒤의 줄도 실행된다고 생각함
  statement: 실행 중에 한 줄에서 오류가 나도, 그 줄만 건너뛰고 나머지 줄은 계속 실행된다고 생각한다.
  reality: 실행 중 오류(ReferenceError, TypeError 등)가 나면 프로그램은 그 자리에서 멈춘다. 오류 앞의 줄은 이미 실행됐지만, 뒤의 줄은 실행되지 않는다.
  diagnosticHint: 오류가 난 줄 다음에 있는 console.log의 출력이 콘솔에 있는지 확인해 본다.
  remediation:
    lessonSection: js-basics.start.reading-errors#pitfalls
    exercises: [js-basics.start.reading-errors.mcq-what-runs-before-error]

- id: js.mc.error-line-is-cause
  concept: js.errors.error-messages
  title: 오류가 표시된 줄만 문제라고 생각함
  statement: 오류 메시지의 줄 번호가 가리키는 줄에만 원인이 있다고 생각하고, 그 줄만 고치려 한다.
  reality: 줄 번호는 JavaScript가 문제를 "알아챈" 곳이다. 원인은 그 앞줄(예를 들어 앞줄 끝의 빠진 세미콜론이나, 앞에서 잘못 만든 이름)에 있을 수 있다.
  diagnosticHint: 표시된 줄이 멀쩡해 보이면 바로 앞줄부터 거슬러 올라가며 읽는다.
  remediation:
    lessonSection: js-basics.start.reading-errors#pitfalls
    exercises: [js-basics.start.reading-errors.mcq-cause-on-previous-line]

- id: js.mc.syntax-error-partial-run
  concept: js.errors.error-types
  title: 문법 오류가 있어도 앞줄은 실행된다고 생각함
  statement: SyntaxError가 셋째 줄에 있으면 첫째·둘째 줄은 실행된 다음 멈춘다고 생각한다.
  reality: JavaScript는 실행하기 전에 코드 전체의 문법을 먼저 검사한다. 어디든 SyntaxError가 있으면 첫 줄부터 아무것도 실행되지 않는다.
  diagnosticHint: SyntaxError일 때 콘솔에 오류 말고 다른 출력이 있는지 확인해 본다.
  remediation:
    lessonSection: js-basics.start.reading-errors#pitfalls
    exercises: [js-basics.start.reading-errors.mcq-syntax-error-runs-nothing]

- id: js.mc.typo-is-syntax-error
  concept: js.errors.error-types
  title: 오타는 모두 SyntaxError라고 생각함
  statement: 무엇이든 잘못 쓰면 SyntaxError(문법 오류)가 난다고 생각한다.
  reality: 괄호·따옴표처럼 문장의 모양이 틀리면 SyntaxError지만, consol처럼 이름을 잘못 쓰면 ReferenceError, console.lg처럼 없는 기능을 부르면 TypeError가 난다.
  diagnosticHint: 오류 메시지 맨 앞의 종류 이름을 먼저 읽는다.
  remediation:
    lessonSection: js-basics.start.reading-errors#pitfalls
    exercises:
      - js-basics.start.reading-errors.predict-error-missing-quotes
      - js-basics.start.reading-errors.predict-error-method-typo

# ── variables ──

- id: js.mc.variable-name-in-quotes
  concept: js.values.let
  title: 변수 이름에 따옴표를 붙임
  statement: '변수 city의 값을 출력하려고 console.log("city")라고 쓴다. 따옴표를 붙여도 변수의 값이 나온다고 생각한다.'
  reality: 따옴표로 감싸면 변수와 상관없는 글자 "city"가 된다. 변수의 값을 꺼내려면 따옴표 없이 console.log(city)라고 쓴다.
  diagnosticHint: 따옴표가 있으면 글자, 없으면 이름(변수)으로 읽는다.
  remediation:
    lessonSection: js-basics.values.variables#pitfalls
    exercises: [js-basics.values.variables.predict-name-vs-string]

- id: js.mc.let-again-to-change
  concept: js.values.let
  title: 값을 바꿀 때도 let을 다시 씀
  statement: 변수의 값을 바꿀 때마다 let 이름 = 새 값; 처럼 let을 다시 써야 한다고 생각한다.
  reality: let은 변수를 처음 만들 때 한 번만 쓴다. 같은 이름으로 let을 다시 쓰면 SyntaxError(Identifier has already been declared)가 난다. 값을 바꿀 때는 이름 = 새 값; 으로 대입만 한다.
  remediation:
    lessonSection: js-basics.values.variables#pitfalls
    exercises: [js-basics.values.variables.fix-let-twice, js-basics.values.variables.impl-change-lives]

- id: js.mc.let-needs-initial-value
  concept: js.values.let
  title: let은 처음에 값이 꼭 있어야 한다고 생각함
  statement: let answer; 처럼 값 없이 변수를 만들면 오류가 난다고 생각한다.
  reality: let은 값 없이 만들 수 있고, 그때 변수에는 "아직 값이 없음"을 뜻하는 undefined가 들어 있다. 값 없이 만들 수 없는 것은 const다.
  remediation:
    lessonSection: js-basics.values.variables#pitfalls
    exercises: [js-basics.values.variables.mcq-let-without-value]

- id: js.mc.assign-is-equality
  concept: js.values.assignment
  title: "=를 수학의 \"같다\"로 읽음"
  statement: "=를 수학의 등호처럼 \"양쪽이 같다\"는 뜻으로 읽어서, x = x + 1 같은 문장은 말이 안 된다고 생각한다."
  reality: "=는 오른쪽을 먼저 계산한 뒤 그 값을 왼쪽 변수에 넣으라는 대입 명령이다. x = x + 1은 \"지금 x에 1을 더한 값을 x에 다시 넣어라\"라는 뜻이다."
  diagnosticHint: "=를 \"같다\" 대신 \"넣는다\" 또는 화살표(←)로 읽어 본다."
  remediation:
    lessonSection: js-basics.values.variables#pitfalls
    exercises: [js-basics.values.variables.mcq-equals-meaning, js-basics.values.variables.predict-reassign-chain]

- id: js.mc.assign-direction
  concept: js.values.assignment
  title: 대입 방향을 거꾸로 씀
  statement: 90 = score; 처럼 값을 왼쪽에, 변수를 오른쪽에 써도 대입된다고 생각한다.
  reality: 대입은 항상 오른쪽 값을 왼쪽 변수에 넣는다. 왼쪽에는 값을 받을 변수가 와야 하고, 90 = score; 는 SyntaxError다(Chrome의 설명은 Invalid left-hand side in assignment).
  remediation:
    lessonSection: js-basics.values.variables#pitfalls
    exercises: [js-basics.values.variables.fix-assign-direction]

- id: js.mc.variable-remembers-formula
  concept: js.values.assignment
  title: 변수가 식이나 다른 변수와 연결된다고 생각함
  statement: total = price * count; 를 한 뒤 count를 바꾸면 total도 저절로 다시 계산되거나, b = a; 뒤에 a를 바꾸면 b도 바뀐다고 생각한다(스프레드시트처럼).
  reality: 대입은 그 순간 계산한 값을 넣을 뿐이고, 식이나 다른 변수를 기억하지 않는다. 나중에 count나 a를 바꿔도 이미 들어간 total, b의 값은 그대로다.
  diagnosticHint: 대입이 실행된 순간의 값을 표에 적어 가며 한 줄씩 따라가 본다.
  remediation:
    lessonSection: js-basics.values.variables#pitfalls
    exercises: [js-basics.values.variables.predict-copy-not-link, js-basics.values.variables.predict-total-not-updated]

- id: js.mc.const-can-reassign
  concept: js.values.const
  title: const에도 다시 대입할 수 있다고 생각함
  statement: const로 만든 이름에도 let처럼 새 값을 대입할 수 있거나, 대입해도 오류 없이 조용히 무시된다고 생각한다.
  reality: const에 다시 대입하면 실행 중에 TypeError(Assignment to constant variable.)가 나고 프로그램이 멈춘다. 값을 바꿔야 하는 변수는 let으로 만든다.
  remediation:
    lessonSection: js-basics.values.variables#pitfalls
    exercises: [js-basics.values.variables.predict-error-const-reassign, js-basics.values.variables.fix-const-counter]

- id: js.mc.const-declare-later
  concept: js.values.const
  title: const를 먼저 만들고 나중에 값을 넣으려 함
  statement: const birthday; 처럼 먼저 이름만 만들고, 다음 줄에서 한 번만 값을 넣으면 된다고 생각한다.
  reality: const는 만드는 그 문장에서 바로 값을 넣어야 한다. 값 없이 쓰면 실행 전에 SyntaxError가 난다(Chrome의 설명은 Missing initializer in const declaration).
  remediation:
    lessonSection: js-basics.values.variables#pitfalls
    exercises: [js-basics.values.variables.mcq-const-without-value]

- id: js.mc.const-is-immutable
  concept: js.values.const
  title: const는 값이 절대 바뀌지 않는다고 생각함
  statement: const로 만들면 그 안의 값이 어떤 방법으로도 절대 바뀌지 않는다고 생각한다.
  reality: const가 막는 것은 이름에 다른 값을 다시 대입하는 것(재할당)뿐이다. 나중에 배울 배열과 객체는 const로 만들어도 안의 내용을 바꿀 수 있다(모듈 9에서 다시 다룸).
  remediation:
    lessonSection: js-basics.values.variables#pitfalls
    exercises: [js-basics.values.variables.mcq-const-prevents]

- id: js.mc.identifier-case-insensitive
  concept: js.values.identifiers
  title: 이름의 대소문자를 구분하지 않는다고 생각함
  statement: score와 Score, itemPrice와 itemprice를 같은 이름으로 생각한다.
  reality: JavaScript는 대문자와 소문자를 다른 글자로 본다. 만든 이름과 한 글자라도 다르면 다른 이름이라 ReferenceError(... is not defined)가 난다.
  diagnosticHint: ReferenceError의 이름과 변수를 만든 줄의 이름을 한 글자씩 비교한다.
  remediation:
    lessonSection: js-basics.values.variables#pitfalls
    exercises: [js-basics.values.variables.predict-error-name-case]

- id: js.mc.identifier-invalid-chars
  concept: js.values.identifiers
  title: 이름에 공백·하이픈을 쓰거나 숫자로 시작함
  statement: total-price, my name, 1st처럼 하이픈·공백이 있거나 숫자로 시작하는 이름도 쓸 수 있다고 생각한다.
  reality: 이름에는 글자·숫자·_·$만 쓸 수 있고 숫자로 시작할 수 없다. 하이픈은 빼기로 읽히고 공백은 이름을 둘로 나눠서 SyntaxError가 난다. 여러 단어는 totalPrice처럼 이어 쓴다.
  remediation:
    lessonSection: js-basics.values.variables#pitfalls
    exercises: [js-basics.values.variables.mcq-valid-name, js-basics.values.variables.fix-hyphen-name]

# ── data-types ──

- id: js.mc.quoted-number-is-number
  concept: js.types.primitives
  title: "\"5\"와 5를 같은 값으로 봄"
  statement: '따옴표는 꾸밈일 뿐이라서 "5"와 5는 같은 값이고, 둘 다 숫자처럼 계산된다고 생각한다.'
  reality: '"5"는 글자 5 하나로 된 문자열(string)이고 5는 숫자(number)다. 자료형이 다르면 같은 연산도 다르게 동작한다. 예를 들어 "5" + 1은 덧셈이 아니라 글자를 이어 붙여 "51"이 된다.'
  diagnosticHint: typeof로 두 값의 자료형을 출력해 비교해 본다.
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.mcq-quoted-number, js-basics.values.data-types.fix-stock-string]

- id: js.mc.type-belongs-to-variable
  concept: js.types.primitives
  title: 변수에 자료형이 정해진다고 생각함
  statement: let age = 10; 처럼 숫자를 넣어 만든 변수에는 앞으로 숫자만 넣을 수 있다고 생각한다.
  reality: JavaScript에서 자료형은 변수가 아니라 값에 붙어 있다. 변수는 이름표일 뿐이라 숫자를 넣었던 변수에 문자열이나 불리언을 다시 대입할 수 있고, 그때 typeof 결과도 바뀐다.
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.tf-type-of-variable, js-basics.values.data-types.impl-typeof-report]

- id: js.mc.same-output-same-type
  concept: js.types.primitives
  title: 콘솔에 같게 보이면 같은 자료형이라고 생각함
  statement: console.log("5")와 console.log(5)의 출력이 둘 다 5로 같으니 두 값은 같은 자료형이라고 생각한다.
  reality: 콘솔은 문자열을 출력할 때 따옴표를 빼고 글자만 보여 준다. 그래서 출력 모양만으로는 자료형을 알 수 없다. 자료형은 typeof로 확인한다.
  diagnosticHint: 출력 옆에 typeof 결과도 함께 출력해 본다.
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.predict-same-output]

- id: js.mc.decimal-separate-type
  concept: js.types.number
  title: 정수와 소수가 다른 자료형이라고 생각함
  statement: 3은 정수 자료형, 3.5는 소수 자료형처럼 둘이 서로 다른 자료형이라고 생각한다.
  reality: JavaScript에는 정수 전용 자료형이 따로 없다. 3, -7, 3.5, 0.1 모두 number 하나다. typeof 3.5도 "number"다.
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.multi-number-values]

- id: js.mc.number-with-comma
  concept: js.types.number
  title: 숫자에 쉼표로 자릿수를 나눔
  statement: 종이에 쓰듯이 1,500이나 12,000처럼 쉼표를 넣어 숫자를 쓸 수 있다고 생각한다.
  reality: 코드에서 쉼표는 "값과 값을 나누는" 기호다. console.log(1,500)은 1과 500 두 값을 출력해 "1 500"이 되고, let price = 1,500; 은 SyntaxError다. 숫자는 1500처럼 쉼표 없이 쓴다.
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.find-bug-comma-number, js-basics.values.data-types.fix-price-comma]

- id: js.mc.quote-kinds-differ
  concept: js.types.string
  title: 작은따옴표와 큰따옴표 문자열이 다르다고 생각함
  statement: "'사과'와 \"사과\"는 따옴표 종류가 다르니 서로 다른 값이거나 다른 자료형이라고 생각한다."
  reality: 작은따옴표와 큰따옴표는 문자열의 시작과 끝을 표시하는 방법이 다를 뿐, 만들어지는 문자열은 똑같다. 둘 다 typeof 결과는 "string"이다.
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.tf-quote-kinds]

- id: js.mc.quotes-mismatch
  concept: js.types.string
  title: 여는 따옴표와 닫는 따옴표를 섞어 씀
  statement: "\"안녕'처럼 큰따옴표로 열고 작은따옴표로 닫거나, 큰따옴표 문자열 안에 큰따옴표를 그대로 넣어도 된다고 생각한다."
  reality: 문자열은 연 따옴표와 같은 종류의 따옴표를 만나면 끝난다. 종류가 다르면 끝을 찾지 못하고, 안에 같은 따옴표를 넣으면 거기서 문자열이 끝나서 둘 다 SyntaxError가 난다. 안에 큰따옴표가 필요하면 바깥을 작은따옴표로 감싼다.
  diagnosticHint: 여는 따옴표에서 시작해 같은 종류의 따옴표가 처음 나오는 곳까지가 문자열이다.
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.fill-quote-choice, js-basics.values.data-types.fix-member-card]

- id: js.mc.quoted-boolean
  concept: js.types.boolean
  title: "\"true\"와 true를 같은 것으로 봄"
  statement: '"true"처럼 따옴표로 감싸도 불리언 true와 같은 값이라고 생각한다.'
  reality: '"true"는 t, r, u, e 네 글자로 된 문자열이고, true는 따옴표 없이 쓰는 불리언 값이다. typeof "true"는 "string", typeof true는 "boolean"이다.'
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.mcq-boolean-literal, js-basics.values.data-types.predict-boolean-reassign]

- id: js.mc.boolean-capitalized
  concept: js.types.boolean
  title: True나 TRUE로 써도 된다고 생각함
  statement: 불리언을 True, TRUE, False처럼 대문자로 시작해 써도 된다고 생각한다(다른 언어의 습관).
  reality: JavaScript의 불리언은 소문자 true와 false뿐이다. True는 그냥 이름으로 읽혀서, 그런 변수가 없으니 ReferenceError(True is not defined)가 난다.
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.fix-boolean-capital]

- id: js.mc.typeof-null-is-null
  concept: js.types.typeof
  title: typeof null이 "null"이라고 생각함
  statement: 다른 값처럼 typeof null의 결과도 자기 이름인 "null"이라고 생각한다.
  reality: typeof null은 "object"다. JavaScript 초기의 설계 실수가 호환성 때문에 그대로 남은 것이다. null은 객체가 아니며, null인지는 typeof로 확인할 수 없다.
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.mcq-typeof-null, js-basics.values.data-types.predict-typeof-typeof]

- id: js.mc.typeof-reads-content
  concept: js.types.typeof
  title: typeof가 글자의 내용을 보고 판단한다고 생각함
  statement: typeof "42"는 안의 글자가 숫자처럼 생겼으니 "number", typeof "true"는 "boolean"이라고 생각한다.
  reality: typeof는 값의 자료형만 본다. 따옴표로 감싼 값은 안에 무엇이 들어 있든 문자열이라서 typeof "42"도 typeof "true"도 "string"이다.
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.predict-value-typeof-string, js-basics.values.data-types.multi-typeof-string]

- id: js.mc.typeof-result-not-string
  concept: js.types.typeof
  title: typeof의 결과가 문자열이라는 것을 모름
  statement: typeof 42의 결과는 따옴표 없는 number라는 특별한 표시라서, typeof typeof 42도 "number"라고 생각한다.
  reality: typeof의 결과는 언제나 "number", "string" 같은 문자열이다. 그래서 typeof typeof 42는 문자열 "number"의 자료형인 "string"이다. 콘솔이 따옴표를 빼고 보여 줄 뿐이다.
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.predict-typeof-typeof]

# ── null-undefined ──

- id: js.mc.undefined-is-error
  concept: js.types.undefined
  title: undefined가 나오면 오류가 났다고 생각함
  statement: 콘솔에 undefined가 출력되면 프로그램에 오류가 나서 멈춘 것이라고 생각한다.
  reality: undefined는 오류가 아니라 "아직 값이 정해지지 않음"을 뜻하는 정상적인 값이다. 프로그램은 멈추지 않고 다음 줄을 계속 실행한다. 다만 값을 넣기 전에 썼다는 신호일 수 있으니 대입이 언제 일어나는지 확인한다.
  remediation:
    lessonSection: js-basics.values.null-undefined#pitfalls
    exercises: [js-basics.values.null-undefined.mcq-undefined-meaning, js-basics.values.null-undefined.find-bug-log-before-assign]

- id: js.mc.not-defined-is-undefined
  concept: js.types.undefined
  title: "\"is not defined\" 오류와 undefined 값을 같은 것으로 봄"
  statement: ReferenceError(x is not defined)는 x에 undefined가 들어 있다는 뜻이라고 생각한다.
  reality: is not defined는 그런 이름의 변수가 아예 없다는 오류이고 프로그램이 멈춘다. undefined는 변수는 있는데 아직 값이 정해지지 않았다는 정상적인 값이다. 이름은 비슷해도 전혀 다른 상황이다.
  diagnosticHint: 오류 종류(ReferenceError)가 붙어 있는지, 그냥 값으로 출력됐는지 본다.
  remediation:
    lessonSection: js-basics.values.null-undefined#pitfalls
    exercises: [js-basics.values.null-undefined.tf-not-defined, js-basics.values.null-undefined.predict-error-typo-vs-undefined]

- id: js.mc.null-undefined-same
  concept: js.types.null
  title: null과 undefined를 완전히 같은 것으로 봄
  statement: null과 undefined는 이름만 다를 뿐 완전히 같은 값이라서, 아무거나 써도 똑같다고 생각한다.
  reality: 둘 다 "값이 없음"을 나타내지만 다른 값이다. undefined는 JavaScript가 "아직 정해지지 않음"으로 자동으로 넣는 값이고, null은 프로그래머가 "없음"을 일부러 넣는 값이다. typeof 결과도 "undefined"와 "object"로 다르다.
  remediation:
    lessonSection: js-basics.values.null-undefined#pitfalls
    exercises: [js-basics.values.null-undefined.multi-null-vs-undefined, js-basics.values.null-undefined.predict-null-seat]

- id: js.mc.empty-value-is-zero
  concept: js.types.null
  title: null을 0이나 빈 문자열과 같은 것으로 봄
  statement: 값이 없다는 뜻으로 0이나 ""(빈 문자열)을 넣어도 null과 같다고 생각한다.
  reality: 0은 "0이라는 숫자가 있음", ""은 "글자가 하나도 없는 문자열이 있음"이다. 둘 다 엄연한 값이라 "값이 없음"과 다르다. 예를 들어 시험 점수 0은 "0점을 받음"이고 null은 "아직 점수가 없음"이다.
  remediation:
    lessonSection: js-basics.values.null-undefined#pitfalls
    exercises: [js-basics.values.null-undefined.mcq-when-null, js-basics.values.null-undefined.fix-score-zero-to-null]

# ── var-and-tdz ──

- id: js.mc.var-hoists-value
  concept: js.values.var
  title: var는 선언 전에도 값이 들어 있다고 생각함
  statement: console.log(x); var x = 5; 처럼 var 선언보다 먼저 쓰면 선언에 적힌 값 5가 나온다고 생각한다.
  reality: 실행 전 준비 단계에서 미리 만들어지는 것은 var 변수의 이름뿐이고, 그 안에는 undefined가 들어 있다. 값 5는 선언 줄이 실행될 때 비로소 들어간다. 그래서 위 코드는 undefined를 출력한다.
  remediation:
    lessonSection: js-basics.values.var-and-tdz#pitfalls
    exercises: [js-basics.values.var-and-tdz.mcq-var-before-declaration, js-basics.values.var-and-tdz.tf-var-before-declaration]

- id: js.mc.var-redeclare-silent
  concept: js.values.var
  title: var도 같은 이름을 다시 선언하면 오류로 알려 준다고 생각함
  statement: let처럼 var도 같은 이름으로 두 번 선언하면 오류가 나서 실수를 막아 준다고 생각한다.
  reality: var는 같은 이름으로 다시 선언해도 오류가 나지 않고, 앞의 값을 조용히 덮어쓴다. 그래서 다른 용도의 변수에 실수로 같은 이름을 쓰면 원래 값이 사라진 줄도 모른다. let과 const는 SyntaxError로 바로 알려 준다.
  remediation:
    lessonSection: js-basics.values.var-and-tdz#pitfalls
    exercises: [js-basics.values.var-and-tdz.predict-error-var-redeclare, js-basics.values.var-and-tdz.fix-var-overwrite]

- id: js.mc.let-before-declaration-undefined
  concept: js.values.tdz
  title: let도 var처럼 선언 전에 undefined라고 생각함
  statement: let이나 const로 만든 변수를 선언 줄보다 먼저 쓰면 var처럼 undefined가 나온다고 생각한다.
  reality: let과 const 변수는 선언 줄이 실행되기 전에는 아예 쓸 수 없다. 그 구간(TDZ)에서 쓰면 ReferenceError(Cannot access 'x' before initialization)가 나고 프로그램이 멈춘다.
  diagnosticHint: 변수를 쓰는 줄이 선언하는 줄보다 위에 있는지 확인한다.
  remediation:
    lessonSection: js-basics.values.var-and-tdz#pitfalls
    exercises: [js-basics.values.var-and-tdz.predict-error-let-before, js-basics.values.var-and-tdz.fix-goal-before-declaration]

- id: js.mc.tdz-means-misspelled
  concept: js.values.tdz
  title: "\"before initialization\" 오류를 없는 이름 오류로 읽음"
  statement: Cannot access 'x' before initialization 오류를 x is not defined처럼 이름을 잘못 썼거나 변수가 없다는 뜻으로 읽고, 이름을 고치거나 let 선언을 하나 더 넣으려 한다.
  reality: 이 오류는 x를 선언하는 줄이 프로그램에 있긴 하지만 아직 실행되지 않았는데 x를 썼다는 뜻이다. 이름은 맞으니 선언 줄을 사용하는 줄보다 위로 옮긴다. 선언을 하나 더 넣으면 이미 선언된 이름이라 SyntaxError가 난다.
  remediation:
    lessonSection: js-basics.values.var-and-tdz#pitfalls
    exercises: [js-basics.values.var-and-tdz.mcq-tdz-message]

# ── 모듈 3. arithmetic ──

- id: js.mc.division-truncates
  concept: js.ops.arithmetic
  title: 나눗셈이 소수점을 버린다고 생각함
  statement: 7 / 2의 결과가 몫만 남은 3이라고 생각한다.
  reality: JavaScript의 /는 소수까지 계산해서 7 / 2는 3.5다. 나머지는 %로 따로 구한다.
  remediation:
    lessonSection: js-basics.operators.arithmetic#pitfalls
    exercises: [js-basics.operators.arithmetic.mcq-division-result, js-basics.operators.arithmetic.predict-power-and-division]

- id: js.mc.caret-is-power
  concept: js.ops.arithmetic
  title: ^를 거듭제곱으로 생각함
  statement: 2 ^ 3이 2의 3제곱인 8이라고 생각한다.
  reality: 거듭제곱 연산자는 **다. ^는 전혀 다른 연산(비트 XOR)이라 2 ^ 3은 1이 된다. 오류가 나지 않아서 알아차리기 어렵다.
  remediation:
    lessonSection: js-basics.operators.arithmetic#pitfalls
    exercises: [js-basics.operators.arithmetic.predict-power-and-division, js-basics.operators.arithmetic.fix-game-score]

- id: js.mc.expression-changes-variable
  concept: js.ops.arithmetic
  title: 계산식만 써도 변수가 바뀐다고 생각함
  statement: score + 10;이나 console.log(score + 10)을 실행하면 score에 10이 더해진다고 생각한다.
  reality: 계산식은 새 값을 만들 뿐 변수를 바꾸지 않는다. 변수를 바꾸려면 score = score + 10;처럼 대입해야 한다.
  diagnosticHint: 대입(=, +=, ++)이 없는 줄은 변수의 값을 바꾸지 않는다.
  remediation:
    lessonSection: js-basics.operators.arithmetic#pitfalls
    exercises: [js-basics.operators.arithmetic.tf-expression-changes-variable, js-basics.operators.arithmetic.fix-game-score]

- id: js.mc.always-left-to-right
  concept: js.ops.precedence
  title: 계산식을 항상 왼쪽부터 계산한다고 생각함
  statement: 2 + 3 * 4를 왼쪽부터 계산해 20이라고 생각한다.
  reality: 곱셈·나눗셈·나머지가 덧셈·뺄셈보다 먼저라서 2 + 3 * 4는 14다. 먼저 더하고 싶으면 (2 + 3) * 4처럼 괄호를 쓴다.
  remediation:
    lessonSection: js-basics.operators.arithmetic#pitfalls
    exercises: [js-basics.operators.arithmetic.impl-topping-total, js-basics.operators.arithmetic.multi-precedence-eighteen]

- id: js.mc.multiply-before-divide
  concept: js.ops.precedence
  title: 곱셈이 나눗셈보다 먼저라고 생각함
  statement: 12 / 2 * 3을 2 * 3부터 계산해 2라고 생각한다.
  reality: "*와 /는 우선순위가 같아서 왼쪽부터 계산한다. 12 / 2 * 3은 6 * 3 = 18이다."
  remediation:
    lessonSection: js-basics.operators.arithmetic#pitfalls
    exercises: [js-basics.operators.arithmetic.multi-precedence-eighteen, js-basics.operators.arithmetic.predict-precedence-steps]

- id: js.mc.remainder-is-percent
  concept: js.ops.remainder
  title: "%를 백분율로 생각함"
  statement: 50 % 10을 "50의 10퍼센트"인 5라고 생각한다.
  reality: "%는 나눗셈의 나머지를 구하는 연산자다. 50 % 10은 50을 10으로 나눈 나머지 0이다. 백분율은 50 * 10 / 100처럼 직접 계산한다."
  remediation:
    lessonSection: js-basics.operators.arithmetic#pitfalls
    exercises: [js-basics.operators.arithmetic.mcq-remainder-meaning, js-basics.operators.arithmetic.impl-split-pizza-bill]

- id: js.mc.remainder-is-quotient
  concept: js.ops.remainder
  title: "%가 몫을 구한다고 생각함"
  statement: 17 % 5가 몫인 3이라고 생각한다.
  reality: 17을 5로 나누면 몫은 3, 나머지는 2다. %는 나머지 2를 돌려준다.
  remediation:
    lessonSection: js-basics.operators.arithmetic#pitfalls
    exercises: [js-basics.operators.arithmetic.mcq-remainder-meaning, js-basics.operators.arithmetic.impl-leftover-eggs]

- id: js.mc.compound-operator-reversed
  concept: js.ops.compound-assignment
  title: "+=를 =+로 씀"
  statement: x =+ 5;가 x += 5;와 같다고 생각한다.
  reality: x =+ 5는 x = +5로 읽혀서 x에 5가 들어갈 뿐 더해지지 않는다. 오류도 나지 않는다. 연산 기호를 = 앞에 붙여 +=로 쓴다.
  remediation:
    lessonSection: js-basics.operators.arithmetic#pitfalls
    exercises: [js-basics.operators.arithmetic.fill-compound-operators, js-basics.operators.arithmetic.tf-compound-right-side]

- id: js.mc.compound-right-side-split
  concept: js.ops.compound-assignment
  title: 복합 대입의 오른쪽을 나눠 계산함
  statement: x *= 2 + 3;을 x = x * 2 + 3;으로 생각한다.
  reality: 복합 대입은 오른쪽 전체를 먼저 계산한다. x *= 2 + 3은 x = x * (2 + 3)이다.
  remediation:
    lessonSection: js-basics.operators.arithmetic#pitfalls
    exercises: [js-basics.operators.arithmetic.tf-compound-right-side, js-basics.operators.arithmetic.predict-compound-chain]

- id: js.mc.postfix-prefix-same
  concept: js.ops.increment
  title: "i++와 ++i의 값이 같다고 생각함"
  statement: let b = a++;와 let b = ++a;에서 b에 들어가는 값이 같다고 생각한다.
  reality: 둘 다 a를 1 늘리지만 식의 값이 다르다. a++는 늘리기 전 값, ++a는 늘린 뒤 값이다. 헷갈리면 a++;를 따로 한 줄에 쓴다.
  remediation:
    lessonSection: js-basics.operators.arithmetic#pitfalls
    exercises: [js-basics.operators.arithmetic.mcq-postfix-prefix, js-basics.operators.arithmetic.fix-ticket-number]

# ── 모듈 3. comparison ──

- id: js.mc.strict-equality-ignores-type
  concept: js.ops.strict-equality
  title: "===가 자료형을 무시한다고 생각함"
  statement: '"5" === 5가 true라고 생각한다.'
  reality: ===는 자료형도 비교한다. 문자열 "5"와 숫자 5는 자료형이 달라서 false다.
  remediation:
    lessonSection: js-basics.operators.comparison#pitfalls
    exercises: [js-basics.operators.comparison.mcq-strict-type, js-basics.operators.comparison.multi-strict-true]

- id: js.mc.nan-equals-nan
  concept: js.ops.strict-equality
  title: "NaN === NaN이 true라고 생각함"
  statement: NaN === NaN이 true라고 생각하고, x === NaN으로 NaN인지 확인한다.
  reality: NaN은 자기 자신을 포함해 어떤 값과도 같지 않아서 NaN === NaN은 false다. NaN인지는 Number.isNaN(x)로 확인한다.
  remediation:
    lessonSection: js-basics.operators.comparison#pitfalls
    exercises: [js-basics.operators.comparison.predict-nan-compare, js-basics.operators.comparison.find-bug-nan-check]

- id: js.mc.assign-as-compare
  concept: js.ops.strict-equality
  title: 비교하려고 =를 씀
  statement: 두 값이 같은지 알아보려고 score = 100처럼 =를 쓴다. if (password = "1234")처럼 조건 괄호 안에 쓰면 =도 비교로 동작한다고 생각하기도 한다.
  reality: =는 어디에 쓰든 대입이라 score에 100을 넣고, 그 값 100이 식의 결과가 된다. 조건 자리에서도 원래 값을 덮어쓰고, 대입한 값의 참·거짓으로 판단하므로 빈 문자열이 아닌 문자열이나 0이 아닌 숫자를 대입하면 if 블록이 늘 실행된다. 같은지 비교하려면 ===를 쓴다.
  diagnosticHint: 비교하려던 자리(조건 괄호 안 등)에 = 가 하나만 있는지 확인한다.
  remediation:
    lessonSection: js-basics.operators.comparison#pitfalls
    exercises: [js-basics.operators.comparison.tf-assign-not-compare, js-basics.operators.comparison.fill-strict-operators, js-basics.control.if-else.tf-assign-in-condition, js-basics.control.if-else.fix-password-check]

- id: js.mc.loose-equals-like-strict
  concept: js.ops.loose-equality
  title: "==도 자료형까지 비교한다고 생각함"
  statement: '==와 ===가 같은 연산자라서 "5" == 5도 false라고 생각한다.'
  reality: ==는 자료형이 다르면 값을 바꿔서 비교한다. "5" == 5는 true다. 이런 변환을 피하려고 보통 ===를 쓴다.
  remediation:
    lessonSection: js-basics.operators.comparison#pitfalls
    exercises: [js-basics.operators.comparison.mcq-loose-vs-strict, js-basics.operators.comparison.multi-loose-true]

- id: js.mc.string-compare-numeric
  concept: js.ops.relational
  title: 숫자 문자열끼리도 숫자 크기로 비교한다고 생각함
  statement: '"10" < "9"가 false라고 생각한다.'
  reality: 문자열끼리는 사전 순서로 첫 글자부터 비교한다. "1"이 "9"보다 앞이라 "10" < "9"는 true다. 숫자로 비교하려면 먼저 숫자로 바꾼다.
  remediation:
    lessonSection: js-basics.operators.comparison#pitfalls
    exercises: [js-basics.operators.comparison.mcq-string-compare, js-basics.operators.comparison.predict-mixed-compare]

- id: js.mc.chained-comparison
  concept: js.ops.relational
  title: 비교를 수학처럼 이어 쓸 수 있다고 생각함
  statement: 3 > 2 > 1이 "3이 2보다 크고 2가 1보다 크다"라서 true라고 생각한다.
  reality: 왼쪽부터 3 > 2를 먼저 계산해 true가 되고, true > 1은 1 > 1로 바뀌어 false다. 두 비교는 &&로 잇는다.
  remediation:
    lessonSection: js-basics.operators.comparison#pitfalls
    exercises: [js-basics.operators.comparison.tf-chained-comparison, js-basics.operators.comparison.fix-chained-temp]

- id: js.mc.mixed-compare-as-string
  concept: js.ops.relational
  title: 문자열과 숫자의 대소 비교도 사전 순서라고 생각함
  statement: '"10" > 9도 문자열끼리처럼 첫 글자 "1"과 "9"를 비교해 false라고 생각한다.'
  reality: 한쪽이 숫자면 문자열을 숫자로 바꿔 비교한다. "10" > 9는 10 > 9라서 true다.
  remediation:
    lessonSection: js-basics.operators.comparison#pitfalls
    exercises: [js-basics.operators.comparison.predict-mixed-compare]

# ── 모듈 3. logical ──

- id: js.mc.or-is-exclusive
  concept: js.ops.logical-and-or-not
  title: "||를 \"둘 중 하나만\"으로 생각함"
  statement: true || true가 "둘 중 하나만 참"이 아니라서 false라고 생각한다.
  reality: "||는 하나 이상 참이면 참이다. 둘 다 참이어도 true다."
  remediation:
    lessonSection: js-basics.operators.logical#pitfalls
    exercises: [js-basics.operators.logical.tf-or-both-true]

- id: js.mc.and-or-same-precedence
  concept: js.ops.logical-and-or-not
  title: "&&와 ||를 왼쪽부터 계산한다고 생각함"
  statement: true || false && false를 왼쪽부터 (true || false) && false로 계산해 false라고 생각한다.
  reality: "&&가 ||보다 먼저 계산된다. true || (false && false)라서 true다. 섞어 쓸 때는 괄호로 의도를 드러낸다."
  remediation:
    lessonSection: js-basics.operators.logical#pitfalls
    exercises: [js-basics.operators.logical.parsons-ride-rule, js-basics.operators.logical.predict-and-or-precedence]

- id: js.mc.not-applies-to-whole
  concept: js.ops.logical-and-or-not
  title: "!가 뒤의 식 전체에 붙는다고 생각함"
  statement: "!a === b가 !(a === b)라고 생각한다."
  reality: "!는 바로 뒤의 값 하나에 먼저 붙어서 (!a) === b로 계산된다. 식 전체를 뒤집으려면 괄호로 감싸거나 !==를 쓴다."
  remediation:
    lessonSection: js-basics.operators.logical#pitfalls
    exercises: [js-basics.operators.logical.predict-and-or-precedence, js-basics.operators.logical.fix-not-precedence]

- id: js.mc.logical-returns-boolean
  concept: js.ops.short-circuit
  title: "&&·||가 항상 true/false를 돌려준다고 생각함"
  statement: '"사과" || "배"의 결과가 true라고 생각한다.'
  reality: '&&와 ||는 왼쪽이나 오른쪽 값 그 자체를 돌려준다. "사과" || "배"는 "사과", 0 && "배"는 0이다.'
  remediation:
    lessonSection: js-basics.operators.logical#pitfalls
    exercises: [js-basics.operators.logical.mcq-or-returns-value, js-basics.operators.logical.mcq-count-or-default]

- id: js.mc.right-side-always-runs
  concept: js.ops.short-circuit
  title: "&&·||의 오른쪽도 항상 실행된다고 생각함"
  statement: false && console.log("실행")에서도 오른쪽의 console.log가 실행된다고 생각한다.
  reality: 왼쪽만으로 결과가 정해지면 오른쪽은 계산하지 않는다. false && …와 true || …의 오른쪽은 실행되지 않는다.
  remediation:
    lessonSection: js-basics.operators.logical#pitfalls
    exercises: [js-basics.operators.logical.multi-short-circuit-facts, js-basics.operators.logical.predict-skip-right]

- id: js.mc.or-default-keeps-zero
  concept: js.ops.short-circuit
  title: "||로 기본값을 줄 때 0과 빈 문자열이 유지된다고 생각함"
  statement: let count = 0;일 때 count || 10이 0이라고 생각한다.
  reality: '||는 왼쪽이 falsy면 오른쪽을 고른다. 0과 ""도 falsy라서 count || 10은 10이 된다. 0을 지키려면 ??를 쓴다.'
  remediation:
    lessonSection: js-basics.operators.logical#pitfalls
    exercises: [js-basics.operators.logical.mcq-count-or-default, js-basics.operators.logical.fix-volume-zero]

- id: js.mc.nullish-same-as-or
  concept: js.ops.nullish
  title: "??와 ||가 같다고 생각함"
  statement: 0 ?? 10과 0 || 10이 둘 다 10이라고 생각한다.
  reality: "??는 왼쪽이 null이나 undefined일 때만 오른쪽을 고른다. 0 ?? 10은 0, 0 || 10은 10이다."
  remediation:
    lessonSection: js-basics.operators.logical#pitfalls
    exercises: [js-basics.operators.logical.tf-nullish-rule, js-basics.operators.logical.mcq-nullish-volume]

# ── 모듈 3. explicit-conversion ──

- id: js.mc.number-parses-prefix
  concept: js.conv.to-number
  title: "Number(\"12px\")가 12라고 생각함"
  statement: Number("12px")가 parseInt처럼 앞의 숫자만 읽어서 12라고 생각한다.
  reality: Number는 문자열 전체가 숫자여야 바꿀 수 있어서 Number("12px")는 NaN이다. 앞부분만 읽으려면 parseInt("12px")나 parseFloat를 쓴다.
  remediation:
    lessonSection: js-basics.operators.explicit-conversion#pitfalls
    exercises: [js-basics.operators.explicit-conversion.mcq-number-12px, js-basics.operators.explicit-conversion.predict-number-vs-parseint]

- id: js.mc.empty-string-to-nan
  concept: js.conv.to-number
  title: 빈 문자열을 숫자로 바꾸면 NaN이라고 생각함
  statement: Number("")나 Number("  ")가 NaN이라고 생각한다.
  reality: 빈 문자열과 공백만 있는 문자열은 0이 된다. 입력이 비었는지는 숫자로 바꾸기 전에 따로 확인해야 한다.
  remediation:
    lessonSection: js-basics.operators.explicit-conversion#pitfalls
    exercises: [js-basics.operators.explicit-conversion.tf-empty-string-zero, js-basics.operators.explicit-conversion.impl-order-form]

- id: js.mc.string-of-null-empty
  concept: js.conv.to-string
  title: "String(null)이 빈 문자열이라고 생각함"
  statement: String(null)이나 String(undefined)가 빈 문자열 ""이라고 생각한다.
  reality: String은 값을 보이는 그대로 글자로 바꾼다. String(null)은 "null", String(undefined)는 "undefined"다.
  remediation:
    lessonSection: js-basics.operators.explicit-conversion#pitfalls
    exercises: [js-basics.operators.explicit-conversion.mcq-string-null, js-basics.operators.explicit-conversion.predict-string-of-null]

- id: js.mc.boolean-reads-string-content
  concept: js.conv.to-boolean
  title: "Boolean(\"false\")가 false라고 생각함"
  statement: 문자열 "false"나 "0"을 Boolean으로 바꾸면 글자의 뜻대로 false가 된다고 생각한다.
  reality: Boolean은 글자의 내용을 읽지 않는다. 빈 문자열 ""만 false이고, 글자가 하나라도 있으면 "false"도 true다.
  remediation:
    lessonSection: js-basics.operators.explicit-conversion#pitfalls
    exercises: [js-basics.operators.explicit-conversion.tf-boolean-false-string, js-basics.operators.explicit-conversion.fix-boolean-string]

- id: js.mc.nan-type-not-number
  concept: js.conv.nan
  title: NaN의 자료형이 number가 아니라고 생각함
  statement: typeof NaN이 "NaN"이나 "undefined"라고 생각한다.
  reality: NaN은 "숫자 계산이 실패했다"를 나타내는 숫자 자료형의 특별한 값이라 typeof NaN은 "number"다.
  remediation:
    lessonSection: js-basics.operators.explicit-conversion#pitfalls
    exercises: [js-basics.operators.explicit-conversion.multi-nan-facts, js-basics.operators.explicit-conversion.impl-nan-detect]

- id: js.mc.failed-conversion-throws
  concept: js.conv.nan
  title: 숫자로 바꿀 수 없으면 오류가 난다고 생각함
  statement: Number("abc")나 "abc" * 2를 실행하면 오류가 나고 프로그램이 멈춘다고 생각한다.
  reality: 오류 없이 NaN이 나오고, NaN과 계산한 결과도 계속 NaN이 된다. 그래서 어디서 NaN이 생겼는지 거슬러 올라가 찾아야 한다.
  remediation:
    lessonSection: js-basics.operators.explicit-conversion#pitfalls
    exercises: [js-basics.operators.explicit-conversion.multi-nan-facts, js-basics.operators.explicit-conversion.find-bug-nan-source]

# ── 모듈 3. implicit-coercion ──

- id: js.mc.string-zero-falsy
  concept: js.conv.truthy-falsy
  title: "문자열 \"0\"이 falsy라고 생각함"
  statement: '"0"이나 "false" 같은 문자열이 falsy라고 생각한다.'
  reality: 문자열은 빈 문자열 ""만 falsy다. "0"과 "false"는 글자가 있어서 truthy다.
  remediation:
    lessonSection: js-basics.operators.implicit-coercion#pitfalls
    exercises: [js-basics.operators.implicit-coercion.tf-string-zero, js-basics.operators.implicit-coercion.multi-falsy-values]

- id: js.mc.empty-array-falsy
  concept: js.conv.truthy-falsy
  title: 빈 배열이 falsy라고 생각함
  statement: 빈 목록(빈 배열 [])은 아무것도 없으니 falsy라고 생각한다.
  reality: falsy 값은 정해진 몇 개뿐이고, 배열과 객체는 비어 있어도 truthy다. 비었는지는 길이(모듈 8에서 배움)로 확인한다.
  remediation:
    lessonSection: js-basics.operators.implicit-coercion#pitfalls
    exercises: [js-basics.operators.implicit-coercion.mcq-empty-list, js-basics.operators.implicit-coercion.multi-falsy-values]

- id: js.mc.space-string-falsy
  concept: js.conv.truthy-falsy
  title: 공백 문자열이 falsy라고 생각함
  statement: '" "처럼 공백만 있는 문자열은 비어 있으니 falsy라고 생각한다.'
  reality: 공백도 글자라서 " "는 truthy다. falsy인 문자열은 길이가 0인 ""뿐이다.
  remediation:
    lessonSection: js-basics.operators.implicit-coercion#pitfalls
    exercises: [js-basics.operators.implicit-coercion.mcq-space-string, js-basics.operators.implicit-coercion.predict-double-not]

- id: js.mc.plus-string-adds
  concept: js.conv.plus-concat
  title: "\"3\" + 1이 4라고 생각함"
  statement: 숫자처럼 보이는 문자열에 +로 숫자를 더하면 덧셈이 된다고 생각한다.
  reality: +는 한쪽이라도 문자열이면 이어 붙인다. "3" + 1은 "31"이다. 더하려면 먼저 Number로 바꾼다.
  remediation:
    lessonSection: js-basics.operators.implicit-coercion#pitfalls
    exercises: [js-basics.operators.implicit-coercion.mcq-string-plus-number, js-basics.operators.implicit-coercion.predict-left-to-right]

- id: js.mc.concat-whole-expression
  concept: js.conv.plus-concat
  title: 문자열이 하나라도 있으면 식 전체가 이어 붙여진다고 생각함
  statement: 1 + 2 + "3"이 "123"이라고 생각한다.
  reality: +는 왼쪽부터 하나씩 계산한다. 1 + 2는 숫자 덧셈 3이고, 그다음 3 + "3"이 "33"이 된다.
  remediation:
    lessonSection: js-basics.operators.implicit-coercion#pitfalls
    exercises: [js-basics.operators.implicit-coercion.predict-left-to-right, js-basics.operators.implicit-coercion.parsons-receipt]

- id: js.mc.minus-string-fails
  concept: js.conv.plus-concat
  title: "-·*·/도 문자열을 이어 붙이거나 실패한다고 생각함"
  statement: '"10" - 3이 오류나 NaN, 또는 이상한 글자가 된다고 생각한다.'
  reality: 이어 붙이기는 +만 한다. - * / %는 문자열을 숫자로 바꿔 계산해서 "10" - 3은 7이다. 숫자로 읽을 수 없는 글자일 때만 NaN이다.
  remediation:
    lessonSection: js-basics.operators.implicit-coercion#pitfalls
    exercises: [js-basics.operators.implicit-coercion.tf-minus-string, js-basics.operators.implicit-coercion.predict-chain-typeof]

- id: js.mc.null-loose-equals-zero
  concept: js.conv.equality-coercion
  title: "null == 0이 true라고 생각함"
  statement: null은 "없음"이니 null == 0이나 null == false가 true라고 생각한다.
  reality: ==에서 null은 숫자로 바뀌지 않고 null·undefined와만 같다. null == 0과 null == false는 false다.
  remediation:
    lessonSection: js-basics.operators.implicit-coercion#pitfalls
    exercises: [js-basics.operators.implicit-coercion.mcq-null-loose-equals, js-basics.operators.implicit-coercion.multi-loose-rules]

- id: js.mc.loose-equality-uses-truthiness
  concept: js.conv.equality-coercion
  title: "==가 truthy·falsy로 비교한다고 생각함"
  statement: '"0"은 truthy이니 "0" == false가 false라고 생각한다.'
  reality: ==는 truthy·falsy를 보지 않고 숫자로 바꿔 비교한다. "0"은 0, false도 0이 되어 "0" == false는 true다. 그래서 ==보다 ===를 쓴다.
  remediation:
    lessonSection: js-basics.operators.implicit-coercion#pitfalls
    exercises: [js-basics.operators.implicit-coercion.multi-loose-rules, js-basics.operators.implicit-coercion.fix-empty-check]

# ── if-else ──

- id: js.mc.false-if-stops-program
  concept: js.control.if
  title: 조건이 거짓이면 뒤의 코드도 실행되지 않는다고 생각함
  statement: if의 조건이 거짓이면 프로그램이 거기서 멈춰서, 조건문 아래에 있는 문장도 실행되지 않는다고 생각한다.
  reality: 조건이 거짓이면 if 블록만 건너뛴다. 조건문이 끝나면 프로그램은 다음 문장으로 넘어가서 계속 실행된다. else가 있으면 else 블록을 실행한 뒤 넘어간다.
  remediation:
    lessonSection: js-basics.control.if-else#pitfalls
    exercises: [js-basics.control.if-else.mcq-false-condition-continues, js-basics.control.if-else.predict-if-else-coins]

- id: js.mc.else-has-condition
  concept: js.control.if
  title: else 뒤에도 조건을 쓸 수 있다고 생각함
  statement: else (temperature < 10) { ... }처럼 else 뒤에 괄호로 조건을 붙이면 그 조건일 때만 실행된다고 생각한다.
  reality: else는 "앞의 조건이 모두 거짓일 때"라는 뜻이라 조건을 받지 않는다. else 뒤에 조건을 쓰면 SyntaxError(Unexpected token '{')가 난다. 조건이 하나 더 필요하면 else if (조건)을 쓴다.
  remediation:
    lessonSection: js-basics.control.if-else#pitfalls
    exercises: [js-basics.control.if-else.fix-else-condition, js-basics.control.if-else.parsons-ticket-price]

- id: js.mc.else-if-runs-all
  concept: js.control.else-if
  title: else if 체인에서 참인 블록이 모두 실행된다고 생각함
  statement: if … else if … else 체인에서 조건이 참인 갈래가 여러 개면, 그 블록들이 모두 차례로 실행된다고 생각한다.
  reality: 체인은 위에서부터 검사하다가 처음으로 참인 조건의 블록 하나만 실행하고, 나머지 조건은 검사하지도 않고 체인을 빠져나간다. 한 체인에서는 많아야 한 블록만 실행된다.
  remediation:
    lessonSection: js-basics.control.if-else#pitfalls
    exercises: [js-basics.control.if-else.predict-first-true-only, js-basics.control.if-else.multi-else-if-facts]

- id: js.mc.else-if-order-irrelevant
  concept: js.control.else-if
  title: else if 조건의 순서는 결과와 상관없다고 생각함
  statement: else if 체인의 조건은 어떤 순서로 적어도 결과가 같다고 생각한다.
  reality: 처음으로 참인 조건 하나만 실행되므로, score >= 60처럼 넓은 조건을 score >= 90보다 먼저 두면 90점 이상도 앞 조건에 걸려서 뒤 갈래는 절대 실행되지 않는다. 범위가 겹치는 조건은 좁은(엄격한) 조건부터 적는다.
  remediation:
    lessonSection: js-basics.control.if-else#pitfalls
    exercises: [js-basics.control.if-else.mcq-unreachable-branch, js-basics.control.if-else.fix-discount-order]

- id: js.mc.separate-ifs-like-chain
  concept: js.control.else-if
  title: if를 여러 개 이어 쓰면 하나만 실행된다고 생각함
  statement: else 없이 if 문을 여러 개 연달아 쓰면 else if 체인처럼 처음 맞는 하나만 실행된다고 생각한다.
  reality: 따로 쓴 if 문은 서로 독립된 문장이라 하나씩 모두 검사된다. 조건이 참인 if가 여러 개면 그 블록이 모두 실행된다. 하나만 고르려면 else if로 이어야 한다.
  remediation:
    lessonSection: js-basics.control.if-else#pitfalls
    exercises: [js-basics.control.if-else.tf-separate-ifs, js-basics.control.if-else.predict-separate-ifs]

- id: js.mc.indent-makes-block
  concept: js.control.block
  title: 들여쓰기만 해도 if에 묶인다고 생각함
  statement: 중괄호 없이 if 아래 두 줄을 들여 쓰면 두 줄 모두 조건에 따라 실행된다고 생각한다.
  reality: 중괄호가 없으면 if 바로 다음의 한 문장만 조건에 딸린다. 두 번째 줄은 들여 써도 if와 관계없이 항상 실행된다. JavaScript는 들여쓰기를 보지 않으므로, 여러 문장을 묶으려면 중괄호로 블록을 만든다.
  remediation:
    lessonSection: js-basics.control.if-else#pitfalls
    exercises: [js-basics.control.if-else.mcq-no-braces, js-basics.control.if-else.fix-coupon-braces]

- id: js.mc.semicolon-after-if
  concept: js.control.block
  title: if (조건) 뒤에 세미콜론을 붙여도 된다고 생각함
  statement: 문장 끝에 세미콜론을 붙이는 습관대로 if (조건); { ... }라고 써도 블록이 조건에 따라 실행된다고 생각한다.
  reality: if (조건) 바로 뒤의 세미콜론은 "아무것도 하지 않는 빈 문장"이 되어, 조건에 딸린 문장이 그 빈 문장이 된다. 뒤의 { ... } 블록은 if와 관계없는 별개의 블록이라 조건과 상관없이 항상 실행된다. 오류도 나지 않아 찾기 어렵다.
  diagnosticHint: if (조건)과 { 사이에 ; 가 있는지 확인한다.
  remediation:
    lessonSection: js-basics.control.if-else#pitfalls
    exercises: [js-basics.control.if-else.find-bug-semicolon-if, js-basics.control.if-else.fix-cafe-order-bugs]

# ── switch ──

- id: js.mc.switch-loose-compare
  concept: js.control.switch
  title: switch가 자료형이 달라도 같은 값으로 본다고 생각함
  statement: switch ("2")에서 case 2:가 실행되는 것처럼, switch가 ==처럼 자료형을 바꿔 가며 비교한다고 생각한다.
  reality: switch는 ===로 비교한다. 문자열 "2"와 숫자 2는 자료형이 달라 같은 case가 아니므로, 맞는 case가 없어 default로 간다. 입력값이 문자열이면 case도 문자열로 쓰거나 값을 숫자로 바꾼 뒤 비교한다.
  remediation:
    lessonSection: js-basics.control.switch#pitfalls
    exercises: [js-basics.control.switch.tf-switch-strict, js-basics.control.switch.predict-string-vs-number]

- id: js.mc.switch-case-condition
  concept: js.control.switch
  title: case에 조건식을 쓰면 그 조건으로 검사한다고 생각함
  statement: 'switch (score) { case score >= 90: ... }처럼 case에 조건식을 쓰면 score가 90 이상일 때 그 case가 실행된다고 생각한다.'
  reality: case 옆의 식은 먼저 계산되어 값이 된다. score >= 90은 true나 false가 되고, switch는 score(숫자)와 그 불리언을 ===로 비교하므로 절대 같지 않다. 범위를 나눌 때는 else if 체인을 쓴다.
  remediation:
    lessonSection: js-basics.control.switch#pitfalls
    exercises: [js-basics.control.switch.fix-case-condition, js-basics.control.switch.fix-vending-machine]

- id: js.mc.switch-no-break-stops
  concept: js.control.fallthrough
  title: break 없이도 맞는 case만 실행된다고 생각함
  statement: switch에서 break를 쓰지 않아도 맞는 case의 코드만 실행되고 switch가 끝난다고 생각한다.
  reality: switch는 맞는 case에서 시작해 break(또는 switch의 끝)를 만날 때까지 아래 case와 default의 코드까지 계속 실행한다(fall-through). 아래 case의 값은 다시 비교하지 않는다. 한 case만 실행하려면 case마다 break를 쓴다.
  remediation:
    lessonSection: js-basics.control.switch#pitfalls
    exercises: [js-basics.control.switch.predict-missing-break, js-basics.control.switch.find-bug-missing-break, js-basics.control.switch.fix-coffee-size]

# ── ternary ──

- id: js.mc.ternary-as-statement
  concept: js.control.ternary
  title: 조건 연산자의 각 자리에 문장을 넣을 수 있다고 생각함
  statement: '조건 연산자를 if-else의 줄임말로 보고, isRaining ? const item = "우산" : const item = "모자";처럼 각 자리에 변수 선언 같은 문장을 넣을 수 있다고 생각한다.'
  reality: '조건 연산자는 값을 만들어 내는 식이라서 ?와 : 뒤에는 값(식)만 올 수 있다. const·let 선언이나 if 같은 문장을 넣으면 SyntaxError가 난다. 값을 골라 const item = isRaining ? "우산" : "모자";처럼 받는다. 실행할 일을 고르는 것이 목적이면 if-else가 더 알맞다.'
  remediation:
    lessonSection: js-basics.control.ternary#pitfalls
    exercises: [js-basics.control.ternary.fix-ternary-const, js-basics.control.ternary.multi-valid-ternary]

- id: js.mc.ternary-result-discarded
  concept: js.control.ternary
  title: 조건 연산자만 써도 결과가 어딘가에 저장된다고 생각함
  statement: 'stock > 0 ? "판매 중" : "품절"; 한 줄만 쓰면 고른 값이 변수에 들어가거나 화면에 보인다고 생각한다.'
  reality: 조건 연산자는 값을 만들기만 한다. 그 값을 변수에 대입하거나 console.log에 넘기지 않으면 만들어진 값은 바로 버려지고 아무 일도 일어나지 않는다.
  remediation:
    lessonSection: js-basics.control.ternary#pitfalls
    exercises: [js-basics.control.ternary.tf-ternary-discarded, js-basics.control.ternary.fix-ternary-discarded]

- id: js.mc.ternary-precedence
  concept: js.control.ternary
  title: 조건 연산자가 앞의 +보다 먼저 계산된다고 생각함
  statement: '"결과: " + score >= 60 ? "합격" : "불합격"이 "결과: " 뒤에 "합격"이나 "불합격"을 붙인다고 생각한다.'
  reality: '조건 연산자는 우선순위가 아주 낮아서 +와 >=가 먼저 계산된다. "결과: " + score가 먼저 이어 붙여지고, 그 문자열 전체로 비교한 결과가 조건이 된다. 조건 연산자를 다른 식 안에 쓸 때는 (score >= 60 ? "합격" : "불합격")처럼 괄호로 감싼다.'
  remediation:
    lessonSection: js-basics.control.ternary#pitfalls
    exercises: [js-basics.control.ternary.predict-ternary-precedence, js-basics.control.ternary.fix-receipt-labels]

# ── while ──

- id: js.mc.while-checks-mid-body
  concept: js.loops.while
  title: 조건이 본문 중간에도 계속 검사된다고 생각함
  statement: while 본문을 실행하는 도중에 조건이 거짓이 되면, 그 순간 반복이 멈추고 본문의 나머지 줄은 실행되지 않는다고 생각한다.
  reality: while은 본문을 시작하기 전에만 조건을 검사한다. 본문 중간에 조건이 거짓이 되어도 그 회차의 본문은 끝까지 실행되고, 다음 회차를 시작하기 전에 조건을 다시 검사해서야 반복이 끝난다.
  remediation:
    lessonSection: js-basics.loops.while#pitfalls
    exercises: [js-basics.loops.while.tf-stops-mid-body, js-basics.loops.while.predict-change-mid-body, js-basics.loops.while.mcq-when-condition-checked]

- id: js.mc.while-runs-at-least-once
  concept: js.loops.while
  title: while 본문이 적어도 한 번은 실행된다고 생각함
  statement: while 반복은 본문을 한 번 실행해 본 다음에 조건을 검사하므로, 조건이 처음부터 거짓이어도 본문이 한 번은 실행된다고 생각한다.
  reality: while은 본문보다 조건을 먼저 검사한다. 조건이 처음부터 거짓이면 본문은 한 번도 실행되지 않고 반복 다음 문장으로 넘어간다. 적어도 한 번 실행해야 하면 do...while을 쓴다.
  remediation:
    lessonSection: js-basics.loops.while#pitfalls
    exercises: [js-basics.loops.while.find-bug-dice-while, js-basics.loops.while.fix-condition-direction]

- id: js.mc.do-while-checks-first
  concept: js.loops.do-while
  title: do...while도 조건을 먼저 검사한다고 생각함
  statement: do...while도 while처럼 조건을 먼저 검사하므로, 조건이 처음부터 거짓이면 본문이 한 번도 실행되지 않는다고 생각한다.
  reality: do...while은 본문을 먼저 실행하고 맨 끝의 while (조건)에서 조건을 검사한다. 그래서 조건이 처음부터 거짓이어도 본문은 정확히 한 번 실행된다.
  remediation:
    lessonSection: js-basics.loops.while#pitfalls
    exercises: [js-basics.loops.while.predict-do-while-once, js-basics.loops.while.mcq-do-while-difference]

- id: js.mc.while-auto-update
  concept: js.loops.infinite
  title: 반복이 조건의 변수를 저절로 바꿔 준다고 생각함
  statement: while (count < 5)처럼 조건에 변수를 쓰면, 반복할 때마다 count가 저절로 늘어나서 언젠가 반복이 끝난다고 생각한다.
  reality: while은 조건을 검사하기만 하고 변수를 바꾸지 않는다. 본문에서 count++처럼 직접 바꾸지 않으면 조건이 계속 참이라 반복이 끝나지 않는다(무한 반복).
  remediation:
    lessonSection: js-basics.loops.while#pitfalls
    exercises: [js-basics.loops.while.fix-forgot-update, js-basics.loops.while.multi-which-infinite, js-basics.loops.while.fill-cups-while]

- id: js.mc.infinite-loop-error
  concept: js.loops.infinite
  title: 무한 반복이면 JavaScript가 바로 오류를 낸다고 생각함
  statement: 반복이 끝나지 않으면 JavaScript가 곧바로 오류를 내서 알려 주거나, 알아서 반복을 멈춰 준다고 생각한다.
  reality: 무한 반복은 문법상 올바른 코드라서 JavaScript는 오류 없이 계속 반복한다. 브라우저에서는 탭이 멈춘 것처럼 응답하지 않게 된다. ProgInOne의 콘솔이 일정 시간 뒤 실행을 멈추는 것은 학습 도구의 안전장치일 뿐이다.
  remediation:
    lessonSection: js-basics.loops.while#pitfalls
    exercises: [js-basics.loops.while.tf-infinite-loop-error]

# ── for ──

- id: js.mc.for-off-by-one
  concept: js.loops.for
  title: 반복 횟수를 하나씩 틀림(off-by-one)
  statement: for (let i = 0; i <= 5; i++)가 5번 반복한다고 생각하는 것처럼, 시작값과 조건의 <, <=에 따라 반복 횟수가 하나 달라지는 것을 놓친다.
  reality: 반복 횟수는 시작값과 조건이 함께 정한다. 0부터 시작해 i < 5이면 0~4로 5번, i <= 5이면 0~5로 6번이다. 1부터 시작하면 i <= 5가 5번이다. 첫 값과 마지막 값을 직접 적어 보면 확인할 수 있다.
  remediation:
    lessonSection: js-basics.loops.for#pitfalls
    exercises: [js-basics.loops.for.multi-five-times, js-basics.loops.for.find-bug-attendance, js-basics.loops.for.fix-off-by-one-stamps]

- id: js.mc.for-update-before-body
  concept: js.loops.for
  title: 갱신식이 본문보다 먼저 실행된다고 생각함
  statement: for (let i = 0; i < 3; i++)에서 i++가 본문보다 먼저 실행되므로, 첫 회차의 i는 1이라고 생각한다.
  reality: 갱신식은 본문을 실행한 뒤에 실행된다. 순서는 초기화 → 조건 → 본문 → 갱신 → 조건 → 본문 → …이다. 그래서 첫 회차의 i는 초기화한 값 0이다.
  remediation:
    lessonSection: js-basics.loops.for#pitfalls
    exercises: [js-basics.loops.for.tf-update-before-body, js-basics.loops.for.predict-for-basic]

- id: js.mc.for-init-every-time
  concept: js.loops.for
  title: 초기화식이 회차마다 다시 실행된다고 생각함
  statement: for 괄호의 첫 부분(let i = 0)이 회차마다 다시 실행되어 i가 매번 0으로 돌아간다고 생각한다.
  reality: 초기화식은 반복을 시작할 때 딱 한 번만 실행된다. 그 뒤로는 조건 검사, 본문, 갱신만 되풀이한다.
  remediation:
    lessonSection: js-basics.loops.for#pitfalls
    exercises: [js-basics.loops.for.mcq-for-parts-order]

- id: js.mc.loop-var-outside-for
  concept: js.loops.loop-variable
  title: for에서 만든 반복 변수를 반복 뒤에도 쓸 수 있다고 생각함
  statement: for (let i = 0; ...)의 i를 반복이 끝난 뒤에도 console.log(i)처럼 쓸 수 있다고 생각한다.
  reality: for 괄호 안에서 let으로 만든 변수는 그 반복 안에서만 쓸 수 있다. 반복 뒤에 쓰면 ReferenceError가 난다. 반복 뒤에도 필요한 값은 반복 바깥(위)에서 만든 변수에 담는다.
  remediation:
    lessonSection: js-basics.loops.for#pitfalls
    exercises: [js-basics.loops.for.mcq-loop-var-after-for, js-basics.loops.for.fix-loop-var-outside]

- id: js.mc.loop-var-final-value
  concept: js.loops.loop-variable
  title: 반복이 끝난 뒤 반복 변수는 마지막 회차의 값이라고 생각함
  statement: let i = 0; while (i < 5) { i++; }가 끝나면 i가 마지막으로 본문을 실행한 회차의 값(4)이라고 생각한다.
  reality: 반복은 조건이 거짓이 되어야 끝난다. 그래서 반복이 끝난 뒤의 반복 변수는 조건을 거짓으로 만든 값(5)이다.
  remediation:
    lessonSection: js-basics.loops.for#pitfalls
    exercises: [js-basics.loops.for.predict-final-counter, js-basics.loops.for.tf-counter-after-while]

- id: js.mc.accumulator-reset-in-loop
  concept: js.loops.accumulator-pattern
  title: 누적 변수를 반복 안에서 초기화함
  statement: let total = 0;을 반복 본문 안에 써도 합계가 차곡차곡 쌓인다고 생각한다.
  reality: 본문 안의 let total = 0;은 회차마다 다시 실행되어 total을 0으로 되돌린다. 그래서 마지막 회차의 값만 남는다. 누적 변수는 반복 바깥, 반복 전에 한 번만 만든다.
  remediation:
    lessonSection: js-basics.loops.for#pitfalls
    exercises: [js-basics.loops.for.predict-reset-inside, js-basics.loops.for.find-bug-reset-total]

- id: js.mc.accumulator-overwrite
  concept: js.loops.accumulator-pattern
  title: 누적하지 않고 덮어씀
  statement: 반복 안에서 total = price;처럼 대입하면 값이 total에 더해진다고 생각한다.
  reality: =는 원래 값을 버리고 새 값으로 바꾼다. 그래서 마지막 회차의 값만 남는다. 더해 쌓으려면 total += price;(total = total + price;)를 쓴다.
  remediation:
    lessonSection: js-basics.loops.for#pitfalls
    exercises: [js-basics.loops.for.fix-overwrite-score, js-basics.loops.for.fill-cart-total]

- id: js.mc.accumulator-no-init
  concept: js.loops.accumulator-pattern
  title: 누적 변수의 시작값을 정하지 않아도 0부터 시작한다고 생각함
  statement: let total;처럼 시작값 없이 만든 변수에 total += 3을 하면 0에서부터 더해진다고 생각한다.
  reality: 시작값 없이 만든 변수는 undefined다. undefined + 3은 NaN이 되고, NaN에 무엇을 더해도 NaN이다. 합계는 0, 이어 붙일 글자는 ""처럼 시작값을 꼭 정한다.
  remediation:
    lessonSection: js-basics.loops.for#pitfalls
    exercises: [js-basics.loops.for.mcq-total-without-init]

# ── break-continue ──

- id: js.mc.break-exits-all-loops
  concept: js.loops.break
  title: break가 바깥 반복까지 모두 끝낸다고 생각함
  statement: 반복 안에 반복이 있을 때 안쪽 반복의 break가 바깥 반복까지 한꺼번에 끝낸다고 생각한다.
  reality: break는 자기를 감싼 가장 가까운 반복 하나만 끝낸다. 안쪽 반복의 break 뒤에는 바깥 반복의 다음 회차가 이어진다. 바깥 반복도 끝내려면 바깥에서 따로 검사해야 한다.
  remediation:
    lessonSection: js-basics.loops.break-continue#pitfalls
    exercises: [js-basics.loops.break-continue.tf-break-exits-all, js-basics.loops.nested-loops.predict-break-inner, js-basics.loops.nested-loops.fix-break-only-inner]

- id: js.mc.break-ends-program
  concept: js.loops.break
  title: break가 프로그램 전체를 끝낸다고 생각함
  statement: 반복 안에서 break를 만나면 프로그램이 거기서 끝나서, 반복 아래에 있는 문장도 실행되지 않는다고 생각한다.
  reality: break는 반복만 끝낸다. 실행은 반복 바로 다음 문장으로 이어지고, 그 아래 코드는 평소처럼 실행된다.
  remediation:
    lessonSection: js-basics.loops.break-continue#pitfalls
    exercises: [js-basics.loops.break-continue.predict-break-search]

- id: js.mc.continue-ends-loop
  concept: js.loops.continue
  title: continue가 반복을 끝낸다고 생각함
  statement: continue를 만나면 break처럼 반복 전체가 끝난다고 생각한다.
  reality: continue는 이번 회차의 남은 본문만 건너뛰고 다음 회차로 넘어간다. 반복은 조건이 거짓이 될 때까지 계속된다.
  remediation:
    lessonSection: js-basics.loops.break-continue#pitfalls
    exercises: [js-basics.loops.break-continue.mcq-continue-effect, js-basics.loops.break-continue.predict-continue-boxes]

- id: js.mc.continue-while-update
  concept: js.loops.continue
  title: while에서도 continue가 갱신 줄을 실행해 준다고 생각함
  statement: for에서처럼 while에서도 continue를 쓰면 본문 끝의 i++가 실행된 뒤 다음 회차로 넘어간다고 생각한다.
  reality: for는 continue 뒤에 갱신식을 실행하지만, while에는 갱신식 자리가 없다. continue가 본문 끝의 i++보다 앞에 있으면 i++를 건너뛰어 같은 값으로 계속 반복하게 된다(무한 반복). while에서는 continue 전에 변수를 바꾼다.
  remediation:
    lessonSection: js-basics.loops.break-continue#pitfalls
    exercises: [js-basics.loops.break-continue.mcq-continue-while-forever]

# ── nested-loops ──

- id: js.mc.inner-var-not-reset
  concept: js.loops.nested
  title: 안쪽 반복이 바깥 반복마다 처음부터 다시 돌지 않는다고 생각함
  statement: 안쪽 for의 j가 첫 바깥 회차에서 끝까지 간 뒤로는 그 값에 머물러 있어서, 다음 바깥 회차에서는 안쪽 반복이 실행되지 않는다고 생각한다.
  reality: 안쪽 for 문 전체가 바깥 반복의 본문이라서, 바깥 회차마다 안쪽 for의 초기화(let j = 1)부터 다시 실행된다. 안쪽 반복은 바깥 회차마다 처음부터 끝까지 돈다. 단, 안쪽 반복의 변수를 바깥 반복보다 먼저 만들어 두면(while 등) 다시 초기화되지 않는다.
  remediation:
    lessonSection: js-basics.loops.nested-loops#pitfalls
    exercises: [js-basics.loops.nested-loops.tf-inner-restarts, js-basics.loops.nested-loops.find-bug-inner-counter, js-basics.loops.nested-loops.predict-room-numbers]

- id: js.mc.nested-count-additive
  concept: js.loops.nested
  title: 중첩 반복의 횟수를 곱이 아니라 합으로 셈
  statement: 바깥 3번, 안쪽 4번 도는 중첩 반복에서 안쪽 본문이 3 + 4 = 7번 실행된다고 생각한다.
  reality: 바깥 회차마다 안쪽 반복이 4번 모두 돌기 때문에 안쪽 본문은 3 × 4 = 12번 실행된다.
  remediation:
    lessonSection: js-basics.loops.nested-loops#pitfalls
    exercises: [js-basics.loops.nested-loops.mcq-nested-count]
