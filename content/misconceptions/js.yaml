# JavaScript 오개념

# ── first-program ──

- id: js.mc.expression-prints-itself
  concept: js.basics.statements
  title: 값만 써도 출력된다고 생각함
  statement: "`1 + 2;`처럼 계산식만 문장으로 써 두면 결과가 콘솔에 나온다고 생각한다."
  reality: 프로그램은 계산만 하고 결과를 보여 주지 않는다. 콘솔에 보이게 하려면 console.log(1 + 2)처럼 출력하라고 시켜야 한다.
  diagnosticHint: 개발자 도구 콘솔에 한 줄씩 입력할 때는 결과가 바로 보이지만, 프로그램 파일을 실행할 때는 그렇지 않다.
  remediation:
    lessonSection: js-basics.start.first-program#pitfalls
    exercises: [js-basics.start.first-program.mcq-expression-alone]

- id: js.mc.log-prints-quotes
  concept: js.basics.console-log
  title: 따옴표까지 출력된다고 생각함
  statement: 'console.log("안녕")을 실행하면 콘솔에 따옴표까지 포함한 "안녕"이 나온다고 생각한다.'
  reality: 따옴표는 "여기부터 여기까지가 글자(문자열)"라고 표시하는 기호일 뿐이다. 콘솔에는 따옴표 안의 글자만 나온다.
  remediation:
    lessonSection: js-basics.start.first-program#pitfalls
    exercises: [js-basics.start.first-program.predict-quoted-expression]

- id: js.mc.quoted-expression-evaluates
  concept: js.basics.console-log
  title: 따옴표 안의 식도 계산된다고 생각함
  statement: 'console.log("3 + 4")가 7을 출력한다고 생각한다.'
  reality: 따옴표로 감싸면 글자(문자열)가 되어 계산되지 않고 글자 그대로 3 + 4가 출력된다. 계산하려면 따옴표 없이 console.log(3 + 4)라고 쓴다.
  diagnosticHint: 따옴표가 있으면 "글자", 없으면 "계산할 값"으로 읽는다.
  remediation:
    lessonSection: js-basics.start.first-program#pitfalls
    exercises:
      - js-basics.start.first-program.predict-quoted-expression
      - js-basics.start.first-program.fix-quoted-total

- id: js.mc.log-is-return
  concept: js.basics.console-log
  title: 출력과 결과값을 같은 것으로 봄
  statement: console.log로 출력한 값이 console.log의 결과로 돌아온다고(어딘가에 저장된다고) 생각한다.
  reality: console.log는 콘솔에 보여 주기만 하고, 결과로 돌려주는 값은 "값 없음"을 뜻하는 undefined다. 출력과 결과값은 다르다.
  diagnosticHint: console.log(console.log(1))을 실행하면 1 다음에 undefined가 출력된다.
  remediation:
    lessonSection: js-basics.start.first-program#pitfalls
    exercises: [js-basics.start.first-program.predict-log-of-log]

- id: js.mc.line-comment-multiline
  concept: js.basics.comments
  title: "//가 여러 줄을 주석 처리한다고 생각함"
  statement: "// 한 번이면 그 아래 여러 줄까지 주석이 된다고 생각한다."
  reality: "//는 그 줄의 끝까지만 주석으로 만든다. 여러 줄을 주석으로 만들려면 줄마다 //를 붙이거나 /* */로 감싼다."
  remediation:
    lessonSection: js-basics.start.first-program#pitfalls
    exercises: [js-basics.start.first-program.predict-comment-one-line]

# ── reading-errors ──

- id: js.mc.code-after-error-runs
  concept: js.errors.error-messages
  title: 오류 뒤의 줄도 실행된다고 생각함
  statement: 실행 중에 한 줄에서 오류가 나도, 그 줄만 건너뛰고 나머지 줄은 계속 실행된다고 생각한다.
  reality: 실행 중 오류(ReferenceError, TypeError 등)가 나면 프로그램은 그 자리에서 멈춘다. 오류 앞의 줄은 이미 실행됐지만, 뒤의 줄은 실행되지 않는다.
  diagnosticHint: 오류가 난 줄 다음에 있는 console.log의 출력이 콘솔에 있는지 확인해 본다.
  remediation:
    lessonSection: js-basics.start.reading-errors#pitfalls
    exercises: [js-basics.start.reading-errors.mcq-what-runs-before-error]

- id: js.mc.error-line-is-cause
  concept: js.errors.error-messages
  title: 오류가 표시된 줄만 문제라고 생각함
  statement: 오류 메시지의 줄 번호가 가리키는 줄에만 원인이 있다고 생각하고, 그 줄만 고치려 한다.
  reality: 줄 번호는 JavaScript가 문제를 "알아챈" 곳이다. 원인은 그 앞줄(예를 들어 앞줄 끝의 빠진 세미콜론이나, 앞에서 잘못 만든 이름)에 있을 수 있다.
  diagnosticHint: 표시된 줄이 멀쩡해 보이면 바로 앞줄부터 거슬러 올라가며 읽는다.
  remediation:
    lessonSection: js-basics.start.reading-errors#pitfalls
    exercises: [js-basics.start.reading-errors.mcq-cause-on-previous-line]

- id: js.mc.syntax-error-partial-run
  concept: js.errors.error-types
  title: 문법 오류가 있어도 앞줄은 실행된다고 생각함
  statement: SyntaxError가 셋째 줄에 있으면 첫째·둘째 줄은 실행된 다음 멈춘다고 생각한다.
  reality: JavaScript는 실행하기 전에 코드 전체의 문법을 먼저 검사한다. 어디든 SyntaxError가 있으면 첫 줄부터 아무것도 실행되지 않는다.
  diagnosticHint: SyntaxError일 때 콘솔에 오류 말고 다른 출력이 있는지 확인해 본다.
  remediation:
    lessonSection: js-basics.start.reading-errors#pitfalls
    exercises: [js-basics.start.reading-errors.mcq-syntax-error-runs-nothing]

- id: js.mc.typo-is-syntax-error
  concept: js.errors.error-types
  title: 오타는 모두 SyntaxError라고 생각함
  statement: 무엇이든 잘못 쓰면 SyntaxError(문법 오류)가 난다고 생각한다.
  reality: 괄호·따옴표처럼 문장의 모양이 틀리면 SyntaxError지만, consol처럼 이름을 잘못 쓰면 ReferenceError, console.lg처럼 없는 기능을 부르면 TypeError가 난다.
  diagnosticHint: 오류 메시지 맨 앞의 종류 이름을 먼저 읽는다.
  remediation:
    lessonSection: js-basics.start.reading-errors#pitfalls
    exercises:
      - js-basics.start.reading-errors.predict-error-missing-quotes
      - js-basics.start.reading-errors.predict-error-method-typo

# ── variables ──

- id: js.mc.variable-name-in-quotes
  concept: js.values.let
  title: 변수 이름에 따옴표를 붙임
  statement: '변수 city의 값을 출력하려고 console.log("city")라고 쓴다. 따옴표를 붙여도 변수의 값이 나온다고 생각한다.'
  reality: 따옴표로 감싸면 변수와 상관없는 글자 "city"가 된다. 변수의 값을 꺼내려면 따옴표 없이 console.log(city)라고 쓴다.
  diagnosticHint: 따옴표가 있으면 글자, 없으면 이름(변수)으로 읽는다.
  remediation:
    lessonSection: js-basics.values.variables#pitfalls
    exercises: [js-basics.values.variables.predict-name-vs-string]

- id: js.mc.let-again-to-change
  concept: js.values.let
  title: 값을 바꿀 때도 let을 다시 씀
  statement: 변수의 값을 바꿀 때마다 let 이름 = 새 값; 처럼 let을 다시 써야 한다고 생각한다.
  reality: let은 변수를 처음 만들 때 한 번만 쓴다. 같은 이름으로 let을 다시 쓰면 SyntaxError(Identifier has already been declared)가 난다. 값을 바꿀 때는 이름 = 새 값; 으로 대입만 한다.
  remediation:
    lessonSection: js-basics.values.variables#pitfalls
    exercises: [js-basics.values.variables.fix-let-twice, js-basics.values.variables.impl-change-lives]

- id: js.mc.let-needs-initial-value
  concept: js.values.let
  title: let은 처음에 값이 꼭 있어야 한다고 생각함
  statement: let answer; 처럼 값 없이 변수를 만들면 오류가 난다고 생각한다.
  reality: let은 값 없이 만들 수 있고, 그때 변수에는 "아직 값이 없음"을 뜻하는 undefined가 들어 있다. 값 없이 만들 수 없는 것은 const다.
  remediation:
    lessonSection: js-basics.values.variables#pitfalls
    exercises: [js-basics.values.variables.mcq-let-without-value]

- id: js.mc.assign-is-equality
  concept: js.values.assignment
  title: "=를 수학의 \"같다\"로 읽음"
  statement: "=를 수학의 등호처럼 \"양쪽이 같다\"는 뜻으로 읽어서, x = x + 1 같은 문장은 말이 안 된다고 생각한다."
  reality: "=는 오른쪽을 먼저 계산한 뒤 그 값을 왼쪽 변수에 넣으라는 대입 명령이다. x = x + 1은 \"지금 x에 1을 더한 값을 x에 다시 넣어라\"라는 뜻이다."
  diagnosticHint: "=를 \"같다\" 대신 \"넣는다\" 또는 화살표(←)로 읽어 본다."
  remediation:
    lessonSection: js-basics.values.variables#pitfalls
    exercises: [js-basics.values.variables.mcq-equals-meaning, js-basics.values.variables.predict-reassign-chain]

- id: js.mc.assign-direction
  concept: js.values.assignment
  title: 대입 방향을 거꾸로 씀
  statement: 90 = score; 처럼 값을 왼쪽에, 변수를 오른쪽에 써도 대입된다고 생각한다.
  reality: 대입은 항상 오른쪽 값을 왼쪽 변수에 넣는다. 왼쪽에는 값을 받을 변수가 와야 하고, 90 = score; 는 SyntaxError다(Chrome의 설명은 Invalid left-hand side in assignment).
  remediation:
    lessonSection: js-basics.values.variables#pitfalls
    exercises: [js-basics.values.variables.fix-assign-direction]

- id: js.mc.variable-remembers-formula
  concept: js.values.assignment
  title: 변수가 식이나 다른 변수와 연결된다고 생각함
  statement: total = price * count; 를 한 뒤 count를 바꾸면 total도 저절로 다시 계산되거나, b = a; 뒤에 a를 바꾸면 b도 바뀐다고 생각한다(스프레드시트처럼).
  reality: 대입은 그 순간 계산한 값을 넣을 뿐이고, 식이나 다른 변수를 기억하지 않는다. 나중에 count나 a를 바꿔도 이미 들어간 total, b의 값은 그대로다.
  diagnosticHint: 대입이 실행된 순간의 값을 표에 적어 가며 한 줄씩 따라가 본다.
  remediation:
    lessonSection: js-basics.values.variables#pitfalls
    exercises: [js-basics.values.variables.predict-copy-not-link, js-basics.values.variables.predict-total-not-updated]

- id: js.mc.const-can-reassign
  concept: js.values.const
  title: const에도 다시 대입할 수 있다고 생각함
  statement: const로 만든 이름에도 let처럼 새 값을 대입할 수 있거나, 대입해도 오류 없이 조용히 무시된다고 생각한다.
  reality: const에 다시 대입하면 실행 중에 TypeError(Assignment to constant variable.)가 나고 프로그램이 멈춘다. 값을 바꿔야 하는 변수는 let으로 만든다.
  remediation:
    lessonSection: js-basics.values.variables#pitfalls
    exercises: [js-basics.values.variables.predict-error-const-reassign, js-basics.values.variables.fix-const-counter]

- id: js.mc.const-declare-later
  concept: js.values.const
  title: const를 먼저 만들고 나중에 값을 넣으려 함
  statement: const birthday; 처럼 먼저 이름만 만들고, 다음 줄에서 한 번만 값을 넣으면 된다고 생각한다.
  reality: const는 만드는 그 문장에서 바로 값을 넣어야 한다. 값 없이 쓰면 실행 전에 SyntaxError가 난다(Chrome의 설명은 Missing initializer in const declaration).
  remediation:
    lessonSection: js-basics.values.variables#pitfalls
    exercises: [js-basics.values.variables.mcq-const-without-value]

- id: js.mc.const-is-immutable
  concept: js.values.const
  title: const는 값이 절대 바뀌지 않는다고 생각함
  statement: const로 만들면 그 안의 값이 어떤 방법으로도 절대 바뀌지 않는다고 생각한다.
  reality: const가 막는 것은 이름에 다른 값을 다시 대입하는 것(재할당)뿐이다. 나중에 배울 배열과 객체는 const로 만들어도 안의 내용을 바꿀 수 있다(모듈 9에서 다시 다룸).
  remediation:
    lessonSection: js-basics.values.variables#pitfalls
    exercises: [js-basics.values.variables.mcq-const-prevents]

- id: js.mc.identifier-case-insensitive
  concept: js.values.identifiers
  title: 이름의 대소문자를 구분하지 않는다고 생각함
  statement: score와 Score, itemPrice와 itemprice를 같은 이름으로 생각한다.
  reality: JavaScript는 대문자와 소문자를 다른 글자로 본다. 만든 이름과 한 글자라도 다르면 다른 이름이라 ReferenceError(... is not defined)가 난다.
  diagnosticHint: ReferenceError의 이름과 변수를 만든 줄의 이름을 한 글자씩 비교한다.
  remediation:
    lessonSection: js-basics.values.variables#pitfalls
    exercises: [js-basics.values.variables.predict-error-name-case]

- id: js.mc.identifier-invalid-chars
  concept: js.values.identifiers
  title: 이름에 공백·하이픈을 쓰거나 숫자로 시작함
  statement: total-price, my name, 1st처럼 하이픈·공백이 있거나 숫자로 시작하는 이름도 쓸 수 있다고 생각한다.
  reality: 이름에는 글자·숫자·_·$만 쓸 수 있고 숫자로 시작할 수 없다. 하이픈은 빼기로 읽히고 공백은 이름을 둘로 나눠서 SyntaxError가 난다. 여러 단어는 totalPrice처럼 이어 쓴다.
  remediation:
    lessonSection: js-basics.values.variables#pitfalls
    exercises: [js-basics.values.variables.mcq-valid-name, js-basics.values.variables.fix-hyphen-name]

# ── data-types ──

- id: js.mc.quoted-number-is-number
  concept: js.types.primitives
  title: "\"5\"와 5를 같은 값으로 봄"
  statement: '따옴표는 꾸밈일 뿐이라서 "5"와 5는 같은 값이고, 둘 다 숫자처럼 계산된다고 생각한다.'
  reality: '"5"는 글자 5 하나로 된 문자열(string)이고 5는 숫자(number)다. 자료형이 다르면 같은 연산도 다르게 동작한다. 예를 들어 "5" + 1은 덧셈이 아니라 글자를 이어 붙여 "51"이 된다.'
  diagnosticHint: typeof로 두 값의 자료형을 출력해 비교해 본다.
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.mcq-quoted-number, js-basics.values.data-types.fix-stock-string]

- id: js.mc.type-belongs-to-variable
  concept: js.types.primitives
  title: 변수에 자료형이 정해진다고 생각함
  statement: let age = 10; 처럼 숫자를 넣어 만든 변수에는 앞으로 숫자만 넣을 수 있다고 생각한다.
  reality: JavaScript에서 자료형은 변수가 아니라 값에 붙어 있다. 변수는 이름표일 뿐이라 숫자를 넣었던 변수에 문자열이나 불리언을 다시 대입할 수 있고, 그때 typeof 결과도 바뀐다.
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.tf-type-of-variable, js-basics.values.data-types.impl-typeof-report]

- id: js.mc.same-output-same-type
  concept: js.types.primitives
  title: 콘솔에 같게 보이면 같은 자료형이라고 생각함
  statement: console.log("5")와 console.log(5)의 출력이 둘 다 5로 같으니 두 값은 같은 자료형이라고 생각한다.
  reality: 콘솔은 문자열을 출력할 때 따옴표를 빼고 글자만 보여 준다. 그래서 출력 모양만으로는 자료형을 알 수 없다. 자료형은 typeof로 확인한다.
  diagnosticHint: 출력 옆에 typeof 결과도 함께 출력해 본다.
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.predict-same-output]

- id: js.mc.decimal-separate-type
  concept: js.types.number
  title: 정수와 소수가 다른 자료형이라고 생각함
  statement: 3은 정수 자료형, 3.5는 소수 자료형처럼 둘이 서로 다른 자료형이라고 생각한다.
  reality: JavaScript에는 정수 전용 자료형이 따로 없다. 3, -7, 3.5, 0.1 모두 number 하나다. typeof 3.5도 "number"다.
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.multi-number-values]

- id: js.mc.number-with-comma
  concept: js.types.number
  title: 숫자에 쉼표로 자릿수를 나눔
  statement: 종이에 쓰듯이 1,500이나 12,000처럼 쉼표를 넣어 숫자를 쓸 수 있다고 생각한다.
  reality: 코드에서 쉼표는 "값과 값을 나누는" 기호다. console.log(1,500)은 1과 500 두 값을 출력해 "1 500"이 되고, let price = 1,500; 은 SyntaxError다. 숫자는 1500처럼 쉼표 없이 쓴다.
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.find-bug-comma-number, js-basics.values.data-types.fix-price-comma]

- id: js.mc.quote-kinds-differ
  concept: js.types.string
  title: 작은따옴표와 큰따옴표 문자열이 다르다고 생각함
  statement: "'사과'와 \"사과\"는 따옴표 종류가 다르니 서로 다른 값이거나 다른 자료형이라고 생각한다."
  reality: 작은따옴표와 큰따옴표는 문자열의 시작과 끝을 표시하는 방법이 다를 뿐, 만들어지는 문자열은 똑같다. 둘 다 typeof 결과는 "string"이다.
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.tf-quote-kinds]

- id: js.mc.quotes-mismatch
  concept: js.types.string
  title: 여는 따옴표와 닫는 따옴표를 섞어 씀
  statement: "\"안녕'처럼 큰따옴표로 열고 작은따옴표로 닫거나, 큰따옴표 문자열 안에 큰따옴표를 그대로 넣어도 된다고 생각한다."
  reality: 문자열은 연 따옴표와 같은 종류의 따옴표를 만나면 끝난다. 종류가 다르면 끝을 찾지 못하고, 안에 같은 따옴표를 넣으면 거기서 문자열이 끝나서 둘 다 SyntaxError가 난다. 안에 큰따옴표가 필요하면 바깥을 작은따옴표로 감싼다.
  diagnosticHint: 여는 따옴표에서 시작해 같은 종류의 따옴표가 처음 나오는 곳까지가 문자열이다.
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.fill-quote-choice, js-basics.values.data-types.fix-member-card]

- id: js.mc.quoted-boolean
  concept: js.types.boolean
  title: "\"true\"와 true를 같은 것으로 봄"
  statement: '"true"처럼 따옴표로 감싸도 불리언 true와 같은 값이라고 생각한다.'
  reality: '"true"는 t, r, u, e 네 글자로 된 문자열이고, true는 따옴표 없이 쓰는 불리언 값이다. typeof "true"는 "string", typeof true는 "boolean"이다.'
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.mcq-boolean-literal, js-basics.values.data-types.predict-boolean-reassign]

- id: js.mc.boolean-capitalized
  concept: js.types.boolean
  title: True나 TRUE로 써도 된다고 생각함
  statement: 불리언을 True, TRUE, False처럼 대문자로 시작해 써도 된다고 생각한다(다른 언어의 습관).
  reality: JavaScript의 불리언은 소문자 true와 false뿐이다. True는 그냥 이름으로 읽혀서, 그런 변수가 없으니 ReferenceError(True is not defined)가 난다.
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.fix-boolean-capital]

- id: js.mc.typeof-null-is-null
  concept: js.types.typeof
  title: typeof null이 "null"이라고 생각함
  statement: 다른 값처럼 typeof null의 결과도 자기 이름인 "null"이라고 생각한다.
  reality: typeof null은 "object"다. JavaScript 초기의 설계 실수가 호환성 때문에 그대로 남은 것이다. null은 객체가 아니며, null인지는 typeof로 확인할 수 없다.
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.mcq-typeof-null, js-basics.values.data-types.predict-typeof-typeof]

- id: js.mc.typeof-reads-content
  concept: js.types.typeof
  title: typeof가 글자의 내용을 보고 판단한다고 생각함
  statement: typeof "42"는 안의 글자가 숫자처럼 생겼으니 "number", typeof "true"는 "boolean"이라고 생각한다.
  reality: typeof는 값의 자료형만 본다. 따옴표로 감싼 값은 안에 무엇이 들어 있든 문자열이라서 typeof "42"도 typeof "true"도 "string"이다.
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.predict-value-typeof-string, js-basics.values.data-types.multi-typeof-string]

- id: js.mc.typeof-result-not-string
  concept: js.types.typeof
  title: typeof의 결과가 문자열이라는 것을 모름
  statement: typeof 42의 결과는 따옴표 없는 number라는 특별한 표시라서, typeof typeof 42도 "number"라고 생각한다.
  reality: typeof의 결과는 언제나 "number", "string" 같은 문자열이다. 그래서 typeof typeof 42는 문자열 "number"의 자료형인 "string"이다. 콘솔이 따옴표를 빼고 보여 줄 뿐이다.
  remediation:
    lessonSection: js-basics.values.data-types#pitfalls
    exercises: [js-basics.values.data-types.predict-typeof-typeof]

# ── null-undefined ──

- id: js.mc.undefined-is-error
  concept: js.types.undefined
  title: undefined가 나오면 오류가 났다고 생각함
  statement: 콘솔에 undefined가 출력되면 프로그램에 오류가 나서 멈춘 것이라고 생각한다.
  reality: undefined는 오류가 아니라 "아직 값이 정해지지 않음"을 뜻하는 정상적인 값이다. 프로그램은 멈추지 않고 다음 줄을 계속 실행한다. 다만 값을 넣기 전에 썼다는 신호일 수 있으니 대입이 언제 일어나는지 확인한다.
  remediation:
    lessonSection: js-basics.values.null-undefined#pitfalls
    exercises: [js-basics.values.null-undefined.mcq-undefined-meaning, js-basics.values.null-undefined.find-bug-log-before-assign]

- id: js.mc.not-defined-is-undefined
  concept: js.types.undefined
  title: "\"is not defined\" 오류와 undefined 값을 같은 것으로 봄"
  statement: ReferenceError(x is not defined)는 x에 undefined가 들어 있다는 뜻이라고 생각한다.
  reality: is not defined는 그런 이름의 변수가 아예 없다는 오류이고 프로그램이 멈춘다. undefined는 변수는 있는데 아직 값이 정해지지 않았다는 정상적인 값이다. 이름은 비슷해도 전혀 다른 상황이다.
  diagnosticHint: 오류 종류(ReferenceError)가 붙어 있는지, 그냥 값으로 출력됐는지 본다.
  remediation:
    lessonSection: js-basics.values.null-undefined#pitfalls
    exercises: [js-basics.values.null-undefined.tf-not-defined, js-basics.values.null-undefined.predict-error-typo-vs-undefined]

- id: js.mc.null-undefined-same
  concept: js.types.null
  title: null과 undefined를 완전히 같은 것으로 봄
  statement: null과 undefined는 이름만 다를 뿐 완전히 같은 값이라서, 아무거나 써도 똑같다고 생각한다.
  reality: 둘 다 "값이 없음"을 나타내지만 다른 값이다. undefined는 JavaScript가 "아직 정해지지 않음"으로 자동으로 넣는 값이고, null은 프로그래머가 "없음"을 일부러 넣는 값이다. typeof 결과도 "undefined"와 "object"로 다르다.
  remediation:
    lessonSection: js-basics.values.null-undefined#pitfalls
    exercises: [js-basics.values.null-undefined.multi-null-vs-undefined, js-basics.values.null-undefined.predict-null-seat]

- id: js.mc.empty-value-is-zero
  concept: js.types.null
  title: null을 0이나 빈 문자열과 같은 것으로 봄
  statement: 값이 없다는 뜻으로 0이나 ""(빈 문자열)을 넣어도 null과 같다고 생각한다.
  reality: 0은 "0이라는 숫자가 있음", ""은 "글자가 하나도 없는 문자열이 있음"이다. 둘 다 엄연한 값이라 "값이 없음"과 다르다. 예를 들어 시험 점수 0은 "0점을 받음"이고 null은 "아직 점수가 없음"이다.
  remediation:
    lessonSection: js-basics.values.null-undefined#pitfalls
    exercises: [js-basics.values.null-undefined.mcq-when-null, js-basics.values.null-undefined.fix-score-zero-to-null]

# ── var-and-tdz ──

- id: js.mc.var-hoists-value
  concept: js.values.var
  title: var는 선언 전에도 값이 들어 있다고 생각함
  statement: console.log(x); var x = 5; 처럼 var 선언보다 먼저 쓰면 선언에 적힌 값 5가 나온다고 생각한다.
  reality: 실행 전 준비 단계에서 미리 만들어지는 것은 var 변수의 이름뿐이고, 그 안에는 undefined가 들어 있다. 값 5는 선언 줄이 실행될 때 비로소 들어간다. 그래서 위 코드는 undefined를 출력한다.
  remediation:
    lessonSection: js-basics.values.var-and-tdz#pitfalls
    exercises: [js-basics.values.var-and-tdz.mcq-var-before-declaration, js-basics.values.var-and-tdz.tf-var-before-declaration]

- id: js.mc.var-redeclare-silent
  concept: js.values.var
  title: var도 같은 이름을 다시 선언하면 오류로 알려 준다고 생각함
  statement: let처럼 var도 같은 이름으로 두 번 선언하면 오류가 나서 실수를 막아 준다고 생각한다.
  reality: var는 같은 이름으로 다시 선언해도 오류가 나지 않고, 앞의 값을 조용히 덮어쓴다. 그래서 다른 용도의 변수에 실수로 같은 이름을 쓰면 원래 값이 사라진 줄도 모른다. let과 const는 SyntaxError로 바로 알려 준다.
  remediation:
    lessonSection: js-basics.values.var-and-tdz#pitfalls
    exercises: [js-basics.values.var-and-tdz.predict-error-var-redeclare, js-basics.values.var-and-tdz.fix-var-overwrite]

- id: js.mc.let-before-declaration-undefined
  concept: js.values.tdz
  title: let도 var처럼 선언 전에 undefined라고 생각함
  statement: let이나 const로 만든 변수를 선언 줄보다 먼저 쓰면 var처럼 undefined가 나온다고 생각한다.
  reality: let과 const 변수는 선언 줄이 실행되기 전에는 아예 쓸 수 없다. 그 구간(TDZ)에서 쓰면 ReferenceError(Cannot access 'x' before initialization)가 나고 프로그램이 멈춘다.
  diagnosticHint: 변수를 쓰는 줄이 선언하는 줄보다 위에 있는지 확인한다.
  remediation:
    lessonSection: js-basics.values.var-and-tdz#pitfalls
    exercises: [js-basics.values.var-and-tdz.predict-error-let-before, js-basics.values.var-and-tdz.fix-goal-before-declaration]

- id: js.mc.tdz-means-misspelled
  concept: js.values.tdz
  title: "\"before initialization\" 오류를 없는 이름 오류로 읽음"
  statement: Cannot access 'x' before initialization 오류를 x is not defined처럼 이름을 잘못 썼거나 변수가 없다는 뜻으로 읽고, 이름을 고치거나 let 선언을 하나 더 넣으려 한다.
  reality: 이 오류는 x를 선언하는 줄이 프로그램에 있긴 하지만 아직 실행되지 않았는데 x를 썼다는 뜻이다. 이름은 맞으니 선언 줄을 사용하는 줄보다 위로 옮긴다. 선언을 하나 더 넣으면 이미 선언된 이름이라 SyntaxError가 난다.
  remediation:
    lessonSection: js-basics.values.var-and-tdz#pitfalls
    exercises: [js-basics.values.var-and-tdz.mcq-tdz-message]

# ── 모듈 3. arithmetic ──

- id: js.mc.division-truncates
  concept: js.ops.arithmetic
  title: 나눗셈이 소수점을 버린다고 생각함
  statement: 7 / 2의 결과가 몫만 남은 3이라고 생각한다.
  reality: JavaScript의 /는 소수까지 계산해서 7 / 2는 3.5다. 나머지는 %로 따로 구한다.
  remediation:
    lessonSection: js-basics.operators.arithmetic#pitfalls
    exercises: [js-basics.operators.arithmetic.mcq-division-result, js-basics.operators.arithmetic.predict-power-and-division]

- id: js.mc.caret-is-power
  concept: js.ops.arithmetic
  title: ^를 거듭제곱으로 생각함
  statement: 2 ^ 3이 2의 3제곱인 8이라고 생각한다.
  reality: 거듭제곱 연산자는 **다. ^는 전혀 다른 연산(비트 XOR)이라 2 ^ 3은 1이 된다. 오류가 나지 않아서 알아차리기 어렵다.
  remediation:
    lessonSection: js-basics.operators.arithmetic#pitfalls
    exercises: [js-basics.operators.arithmetic.predict-power-and-division, js-basics.operators.arithmetic.fix-game-score]

- id: js.mc.expression-changes-variable
  concept: js.ops.arithmetic
  title: 계산식만 써도 변수가 바뀐다고 생각함
  statement: score + 10;이나 console.log(score + 10)을 실행하면 score에 10이 더해진다고 생각한다.
  reality: 계산식은 새 값을 만들 뿐 변수를 바꾸지 않는다. 변수를 바꾸려면 score = score + 10;처럼 대입해야 한다.
  diagnosticHint: 대입(=, +=, ++)이 없는 줄은 변수의 값을 바꾸지 않는다.
  remediation:
    lessonSection: js-basics.operators.arithmetic#pitfalls
    exercises: [js-basics.operators.arithmetic.tf-expression-changes-variable, js-basics.operators.arithmetic.fix-game-score]

- id: js.mc.always-left-to-right
  concept: js.ops.precedence
  title: 계산식을 항상 왼쪽부터 계산한다고 생각함
  statement: 2 + 3 * 4를 왼쪽부터 계산해 20이라고 생각한다.
  reality: 곱셈·나눗셈·나머지가 덧셈·뺄셈보다 먼저라서 2 + 3 * 4는 14다. 먼저 더하고 싶으면 (2 + 3) * 4처럼 괄호를 쓴다.
  remediation:
    lessonSection: js-basics.operators.arithmetic#pitfalls
    exercises: [js-basics.operators.arithmetic.impl-topping-total, js-basics.operators.arithmetic.multi-precedence-eighteen]

- id: js.mc.multiply-before-divide
  concept: js.ops.precedence
  title: 곱셈이 나눗셈보다 먼저라고 생각함
  statement: 12 / 2 * 3을 2 * 3부터 계산해 2라고 생각한다.
  reality: "*와 /는 우선순위가 같아서 왼쪽부터 계산한다. 12 / 2 * 3은 6 * 3 = 18이다."
  remediation:
    lessonSection: js-basics.operators.arithmetic#pitfalls
    exercises: [js-basics.operators.arithmetic.multi-precedence-eighteen, js-basics.operators.arithmetic.predict-precedence-steps]

- id: js.mc.remainder-is-percent
  concept: js.ops.remainder
  title: "%를 백분율로 생각함"
  statement: 50 % 10을 "50의 10퍼센트"인 5라고 생각한다.
  reality: "%는 나눗셈의 나머지를 구하는 연산자다. 50 % 10은 50을 10으로 나눈 나머지 0이다. 백분율은 50 * 10 / 100처럼 직접 계산한다."
  remediation:
    lessonSection: js-basics.operators.arithmetic#pitfalls
    exercises: [js-basics.operators.arithmetic.mcq-remainder-meaning, js-basics.operators.arithmetic.impl-split-pizza-bill]

- id: js.mc.remainder-is-quotient
  concept: js.ops.remainder
  title: "%가 몫을 구한다고 생각함"
  statement: 17 % 5가 몫인 3이라고 생각한다.
  reality: 17을 5로 나누면 몫은 3, 나머지는 2다. %는 나머지 2를 돌려준다.
  remediation:
    lessonSection: js-basics.operators.arithmetic#pitfalls
    exercises: [js-basics.operators.arithmetic.mcq-remainder-meaning, js-basics.operators.arithmetic.impl-leftover-eggs]

- id: js.mc.compound-operator-reversed
  concept: js.ops.compound-assignment
  title: "+=를 =+로 씀"
  statement: x =+ 5;가 x += 5;와 같다고 생각한다.
  reality: x =+ 5는 x = +5로 읽혀서 x에 5가 들어갈 뿐 더해지지 않는다. 오류도 나지 않는다. 연산 기호를 = 앞에 붙여 +=로 쓴다.
  remediation:
    lessonSection: js-basics.operators.arithmetic#pitfalls
    exercises: [js-basics.operators.arithmetic.fill-compound-operators, js-basics.operators.arithmetic.tf-compound-right-side]

- id: js.mc.compound-right-side-split
  concept: js.ops.compound-assignment
  title: 복합 대입의 오른쪽을 나눠 계산함
  statement: x *= 2 + 3;을 x = x * 2 + 3;으로 생각한다.
  reality: 복합 대입은 오른쪽 전체를 먼저 계산한다. x *= 2 + 3은 x = x * (2 + 3)이다.
  remediation:
    lessonSection: js-basics.operators.arithmetic#pitfalls
    exercises: [js-basics.operators.arithmetic.tf-compound-right-side, js-basics.operators.arithmetic.predict-compound-chain]

- id: js.mc.postfix-prefix-same
  concept: js.ops.increment
  title: "i++와 ++i의 값이 같다고 생각함"
  statement: let b = a++;와 let b = ++a;에서 b에 들어가는 값이 같다고 생각한다.
  reality: 둘 다 a를 1 늘리지만 식의 값이 다르다. a++는 늘리기 전 값, ++a는 늘린 뒤 값이다. 헷갈리면 a++;를 따로 한 줄에 쓴다.
  remediation:
    lessonSection: js-basics.operators.arithmetic#pitfalls
    exercises: [js-basics.operators.arithmetic.mcq-postfix-prefix, js-basics.operators.arithmetic.fix-ticket-number]

# ── 모듈 3. comparison ──

- id: js.mc.strict-equality-ignores-type
  concept: js.ops.strict-equality
  title: "===가 자료형을 무시한다고 생각함"
  statement: '"5" === 5가 true라고 생각한다.'
  reality: ===는 자료형도 비교한다. 문자열 "5"와 숫자 5는 자료형이 달라서 false다.
  remediation:
    lessonSection: js-basics.operators.comparison#pitfalls
    exercises: [js-basics.operators.comparison.mcq-strict-type, js-basics.operators.comparison.multi-strict-true]

- id: js.mc.nan-equals-nan
  concept: js.ops.strict-equality
  title: "NaN === NaN이 true라고 생각함"
  statement: NaN === NaN이 true라고 생각하고, x === NaN으로 NaN인지 확인한다.
  reality: NaN은 자기 자신을 포함해 어떤 값과도 같지 않아서 NaN === NaN은 false다. NaN인지는 Number.isNaN(x)로 확인한다.
  remediation:
    lessonSection: js-basics.operators.comparison#pitfalls
    exercises: [js-basics.operators.comparison.predict-nan-compare, js-basics.operators.comparison.find-bug-nan-check]

- id: js.mc.assign-as-compare
  concept: js.ops.strict-equality
  title: 비교하려고 =를 씀
  statement: 두 값이 같은지 알아보려고 score = 100처럼 =를 쓴다. if (password = "1234")처럼 조건 괄호 안에 쓰면 =도 비교로 동작한다고 생각하기도 한다.
  reality: =는 어디에 쓰든 대입이라 score에 100을 넣고, 그 값 100이 식의 결과가 된다. 조건 자리에서도 원래 값을 덮어쓰고, 대입한 값의 참·거짓으로 판단하므로 빈 문자열이 아닌 문자열이나 0이 아닌 숫자를 대입하면 if 블록이 늘 실행된다. 같은지 비교하려면 ===를 쓴다.
  diagnosticHint: 비교하려던 자리(조건 괄호 안 등)에 = 가 하나만 있는지 확인한다.
  remediation:
    lessonSection: js-basics.operators.comparison#pitfalls
    exercises: [js-basics.operators.comparison.tf-assign-not-compare, js-basics.operators.comparison.fill-strict-operators, js-basics.control.if-else.tf-assign-in-condition, js-basics.control.if-else.fix-password-check]

- id: js.mc.loose-equals-like-strict
  concept: js.ops.loose-equality
  title: "==도 자료형까지 비교한다고 생각함"
  statement: '==와 ===가 같은 연산자라서 "5" == 5도 false라고 생각한다.'
  reality: ==는 자료형이 다르면 값을 바꿔서 비교한다. "5" == 5는 true다. 이런 변환을 피하려고 보통 ===를 쓴다.
  remediation:
    lessonSection: js-basics.operators.comparison#pitfalls
    exercises: [js-basics.operators.comparison.mcq-loose-vs-strict, js-basics.operators.comparison.multi-loose-true]

- id: js.mc.string-compare-numeric
  concept: js.ops.relational
  title: 숫자 문자열끼리도 숫자 크기로 비교한다고 생각함
  statement: '"10" < "9"가 false라고 생각한다.'
  reality: 문자열끼리는 사전 순서로 첫 글자부터 비교한다. "1"이 "9"보다 앞이라 "10" < "9"는 true다. 숫자로 비교하려면 먼저 숫자로 바꾼다.
  remediation:
    lessonSection: js-basics.operators.comparison#pitfalls
    exercises: [js-basics.operators.comparison.mcq-string-compare, js-basics.operators.comparison.predict-mixed-compare]

- id: js.mc.chained-comparison
  concept: js.ops.relational
  title: 비교를 수학처럼 이어 쓸 수 있다고 생각함
  statement: 3 > 2 > 1이 "3이 2보다 크고 2가 1보다 크다"라서 true라고 생각한다.
  reality: 왼쪽부터 3 > 2를 먼저 계산해 true가 되고, true > 1은 1 > 1로 바뀌어 false다. 두 비교는 &&로 잇는다.
  remediation:
    lessonSection: js-basics.operators.comparison#pitfalls
    exercises: [js-basics.operators.comparison.tf-chained-comparison, js-basics.operators.comparison.fix-chained-temp]

- id: js.mc.mixed-compare-as-string
  concept: js.ops.relational
  title: 문자열과 숫자의 대소 비교도 사전 순서라고 생각함
  statement: '"10" > 9도 문자열끼리처럼 첫 글자 "1"과 "9"를 비교해 false라고 생각한다.'
  reality: 한쪽이 숫자면 문자열을 숫자로 바꿔 비교한다. "10" > 9는 10 > 9라서 true다.
  remediation:
    lessonSection: js-basics.operators.comparison#pitfalls
    exercises: [js-basics.operators.comparison.predict-mixed-compare]

# ── 모듈 3. logical ──

- id: js.mc.or-is-exclusive
  concept: js.ops.logical-and-or-not
  title: "||를 \"둘 중 하나만\"으로 생각함"
  statement: true || true가 "둘 중 하나만 참"이 아니라서 false라고 생각한다.
  reality: "||는 하나 이상 참이면 참이다. 둘 다 참이어도 true다."
  remediation:
    lessonSection: js-basics.operators.logical#pitfalls
    exercises: [js-basics.operators.logical.tf-or-both-true]

- id: js.mc.and-or-same-precedence
  concept: js.ops.logical-and-or-not
  title: "&&와 ||를 왼쪽부터 계산한다고 생각함"
  statement: true || false && false를 왼쪽부터 (true || false) && false로 계산해 false라고 생각한다.
  reality: "&&가 ||보다 먼저 계산된다. true || (false && false)라서 true다. 섞어 쓸 때는 괄호로 의도를 드러낸다."
  remediation:
    lessonSection: js-basics.operators.logical#pitfalls
    exercises: [js-basics.operators.logical.parsons-ride-rule, js-basics.operators.logical.predict-and-or-precedence]

- id: js.mc.not-applies-to-whole
  concept: js.ops.logical-and-or-not
  title: "!가 뒤의 식 전체에 붙는다고 생각함"
  statement: "!a === b가 !(a === b)라고 생각한다."
  reality: "!는 바로 뒤의 값 하나에 먼저 붙어서 (!a) === b로 계산된다. 식 전체를 뒤집으려면 괄호로 감싸거나 !==를 쓴다."
  remediation:
    lessonSection: js-basics.operators.logical#pitfalls
    exercises: [js-basics.operators.logical.predict-and-or-precedence, js-basics.operators.logical.fix-not-precedence]

- id: js.mc.logical-returns-boolean
  concept: js.ops.short-circuit
  title: "&&·||가 항상 true/false를 돌려준다고 생각함"
  statement: '"사과" || "배"의 결과가 true라고 생각한다.'
  reality: '&&와 ||는 왼쪽이나 오른쪽 값 그 자체를 돌려준다. "사과" || "배"는 "사과", 0 && "배"는 0이다.'
  remediation:
    lessonSection: js-basics.operators.logical#pitfalls
    exercises: [js-basics.operators.logical.mcq-or-returns-value, js-basics.operators.logical.mcq-count-or-default]

- id: js.mc.right-side-always-runs
  concept: js.ops.short-circuit
  title: "&&·||의 오른쪽도 항상 실행된다고 생각함"
  statement: false && console.log("실행")에서도 오른쪽의 console.log가 실행된다고 생각한다.
  reality: 왼쪽만으로 결과가 정해지면 오른쪽은 계산하지 않는다. false && …와 true || …의 오른쪽은 실행되지 않는다.
  remediation:
    lessonSection: js-basics.operators.logical#pitfalls
    exercises: [js-basics.operators.logical.multi-short-circuit-facts, js-basics.operators.logical.predict-skip-right]

- id: js.mc.or-default-keeps-zero
  concept: js.ops.short-circuit
  title: "||로 기본값을 줄 때 0과 빈 문자열이 유지된다고 생각함"
  statement: let count = 0;일 때 count || 10이 0이라고 생각한다.
  reality: '||는 왼쪽이 falsy면 오른쪽을 고른다. 0과 ""도 falsy라서 count || 10은 10이 된다. 0을 지키려면 ??를 쓴다.'
  remediation:
    lessonSection: js-basics.operators.logical#pitfalls
    exercises: [js-basics.operators.logical.mcq-count-or-default, js-basics.operators.logical.fix-volume-zero]

- id: js.mc.nullish-same-as-or
  concept: js.ops.nullish
  title: "??와 ||가 같다고 생각함"
  statement: 0 ?? 10과 0 || 10이 둘 다 10이라고 생각한다.
  reality: "??는 왼쪽이 null이나 undefined일 때만 오른쪽을 고른다. 0 ?? 10은 0, 0 || 10은 10이다."
  remediation:
    lessonSection: js-basics.operators.logical#pitfalls
    exercises: [js-basics.operators.logical.tf-nullish-rule, js-basics.operators.logical.mcq-nullish-volume]

# ── 모듈 3. explicit-conversion ──

- id: js.mc.number-parses-prefix
  concept: js.conv.to-number
  title: "Number(\"12px\")가 12라고 생각함"
  statement: Number("12px")가 parseInt처럼 앞의 숫자만 읽어서 12라고 생각한다.
  reality: Number는 문자열 전체가 숫자여야 바꿀 수 있어서 Number("12px")는 NaN이다. 앞부분만 읽으려면 parseInt("12px")나 parseFloat를 쓴다.
  remediation:
    lessonSection: js-basics.operators.explicit-conversion#pitfalls
    exercises: [js-basics.operators.explicit-conversion.mcq-number-12px, js-basics.operators.explicit-conversion.predict-number-vs-parseint]

- id: js.mc.empty-string-to-nan
  concept: js.conv.to-number
  title: 빈 문자열을 숫자로 바꾸면 NaN이라고 생각함
  statement: Number("")나 Number("  ")가 NaN이라고 생각한다.
  reality: 빈 문자열과 공백만 있는 문자열은 0이 된다. 입력이 비었는지는 숫자로 바꾸기 전에 따로 확인해야 한다.
  remediation:
    lessonSection: js-basics.operators.explicit-conversion#pitfalls
    exercises: [js-basics.operators.explicit-conversion.tf-empty-string-zero, js-basics.operators.explicit-conversion.impl-order-form]

- id: js.mc.string-of-null-empty
  concept: js.conv.to-string
  title: "String(null)이 빈 문자열이라고 생각함"
  statement: String(null)이나 String(undefined)가 빈 문자열 ""이라고 생각한다.
  reality: String은 값을 보이는 그대로 글자로 바꾼다. String(null)은 "null", String(undefined)는 "undefined"다.
  remediation:
    lessonSection: js-basics.operators.explicit-conversion#pitfalls
    exercises: [js-basics.operators.explicit-conversion.mcq-string-null, js-basics.operators.explicit-conversion.predict-string-of-null]

- id: js.mc.boolean-reads-string-content
  concept: js.conv.to-boolean
  title: "Boolean(\"false\")가 false라고 생각함"
  statement: 문자열 "false"나 "0"을 Boolean으로 바꾸면 글자의 뜻대로 false가 된다고 생각한다.
  reality: Boolean은 글자의 내용을 읽지 않는다. 빈 문자열 ""만 false이고, 글자가 하나라도 있으면 "false"도 true다.
  remediation:
    lessonSection: js-basics.operators.explicit-conversion#pitfalls
    exercises: [js-basics.operators.explicit-conversion.tf-boolean-false-string, js-basics.operators.explicit-conversion.fix-boolean-string]

- id: js.mc.nan-type-not-number
  concept: js.conv.nan
  title: NaN의 자료형이 number가 아니라고 생각함
  statement: typeof NaN이 "NaN"이나 "undefined"라고 생각한다.
  reality: NaN은 "숫자 계산이 실패했다"를 나타내는 숫자 자료형의 특별한 값이라 typeof NaN은 "number"다.
  remediation:
    lessonSection: js-basics.operators.explicit-conversion#pitfalls
    exercises: [js-basics.operators.explicit-conversion.multi-nan-facts, js-basics.operators.explicit-conversion.impl-nan-detect]

- id: js.mc.failed-conversion-throws
  concept: js.conv.nan
  title: 숫자로 바꿀 수 없으면 오류가 난다고 생각함
  statement: Number("abc")나 "abc" * 2를 실행하면 오류가 나고 프로그램이 멈춘다고 생각한다.
  reality: 오류 없이 NaN이 나오고, NaN과 계산한 결과도 계속 NaN이 된다. 그래서 어디서 NaN이 생겼는지 거슬러 올라가 찾아야 한다.
  remediation:
    lessonSection: js-basics.operators.explicit-conversion#pitfalls
    exercises: [js-basics.operators.explicit-conversion.multi-nan-facts, js-basics.operators.explicit-conversion.find-bug-nan-source]

# ── 모듈 3. implicit-coercion ──

- id: js.mc.string-zero-falsy
  concept: js.conv.truthy-falsy
  title: "문자열 \"0\"이 falsy라고 생각함"
  statement: '"0"이나 "false" 같은 문자열이 falsy라고 생각한다.'
  reality: 문자열은 빈 문자열 ""만 falsy다. "0"과 "false"는 글자가 있어서 truthy다.
  remediation:
    lessonSection: js-basics.operators.implicit-coercion#pitfalls
    exercises: [js-basics.operators.implicit-coercion.tf-string-zero, js-basics.operators.implicit-coercion.multi-falsy-values]

- id: js.mc.empty-array-falsy
  concept: js.conv.truthy-falsy
  title: 빈 배열이 falsy라고 생각함
  statement: 빈 목록(빈 배열 [])은 아무것도 없으니 falsy라고 생각한다.
  reality: falsy 값은 정해진 몇 개뿐이고, 배열과 객체는 비어 있어도 truthy다. 비었는지는 길이(모듈 8에서 배움)로 확인한다.
  remediation:
    lessonSection: js-basics.operators.implicit-coercion#pitfalls
    exercises: [js-basics.operators.implicit-coercion.mcq-empty-list, js-basics.operators.implicit-coercion.multi-falsy-values]

- id: js.mc.space-string-falsy
  concept: js.conv.truthy-falsy
  title: 공백 문자열이 falsy라고 생각함
  statement: '" "처럼 공백만 있는 문자열은 비어 있으니 falsy라고 생각한다.'
  reality: 공백도 글자라서 " "는 truthy다. falsy인 문자열은 길이가 0인 ""뿐이다.
  remediation:
    lessonSection: js-basics.operators.implicit-coercion#pitfalls
    exercises: [js-basics.operators.implicit-coercion.mcq-space-string, js-basics.operators.implicit-coercion.predict-double-not]

- id: js.mc.plus-string-adds
  concept: js.conv.plus-concat
  title: "\"3\" + 1이 4라고 생각함"
  statement: 숫자처럼 보이는 문자열에 +로 숫자를 더하면 덧셈이 된다고 생각한다.
  reality: +는 한쪽이라도 문자열이면 이어 붙인다. "3" + 1은 "31"이다. 더하려면 먼저 Number로 바꾼다.
  remediation:
    lessonSection: js-basics.operators.implicit-coercion#pitfalls
    exercises: [js-basics.operators.implicit-coercion.mcq-string-plus-number, js-basics.operators.implicit-coercion.predict-left-to-right]

- id: js.mc.concat-whole-expression
  concept: js.conv.plus-concat
  title: 문자열이 하나라도 있으면 식 전체가 이어 붙여진다고 생각함
  statement: 1 + 2 + "3"이 "123"이라고 생각한다.
  reality: +는 왼쪽부터 하나씩 계산한다. 1 + 2는 숫자 덧셈 3이고, 그다음 3 + "3"이 "33"이 된다.
  remediation:
    lessonSection: js-basics.operators.implicit-coercion#pitfalls
    exercises: [js-basics.operators.implicit-coercion.predict-left-to-right, js-basics.operators.implicit-coercion.parsons-receipt]

- id: js.mc.minus-string-fails
  concept: js.conv.plus-concat
  title: "-·*·/도 문자열을 이어 붙이거나 실패한다고 생각함"
  statement: '"10" - 3이 오류나 NaN, 또는 이상한 글자가 된다고 생각한다.'
  reality: 이어 붙이기는 +만 한다. - * / %는 문자열을 숫자로 바꿔 계산해서 "10" - 3은 7이다. 숫자로 읽을 수 없는 글자일 때만 NaN이다.
  remediation:
    lessonSection: js-basics.operators.implicit-coercion#pitfalls
    exercises: [js-basics.operators.implicit-coercion.tf-minus-string, js-basics.operators.implicit-coercion.predict-chain-typeof]

- id: js.mc.null-loose-equals-zero
  concept: js.conv.equality-coercion
  title: "null == 0이 true라고 생각함"
  statement: null은 "없음"이니 null == 0이나 null == false가 true라고 생각한다.
  reality: ==에서 null은 숫자로 바뀌지 않고 null·undefined와만 같다. null == 0과 null == false는 false다.
  remediation:
    lessonSection: js-basics.operators.implicit-coercion#pitfalls
    exercises: [js-basics.operators.implicit-coercion.mcq-null-loose-equals, js-basics.operators.implicit-coercion.multi-loose-rules]

- id: js.mc.loose-equality-uses-truthiness
  concept: js.conv.equality-coercion
  title: "==가 truthy·falsy로 비교한다고 생각함"
  statement: '"0"은 truthy이니 "0" == false가 false라고 생각한다.'
  reality: ==는 truthy·falsy를 보지 않고 숫자로 바꿔 비교한다. "0"은 0, false도 0이 되어 "0" == false는 true다. 그래서 ==보다 ===를 쓴다.
  remediation:
    lessonSection: js-basics.operators.implicit-coercion#pitfalls
    exercises: [js-basics.operators.implicit-coercion.multi-loose-rules, js-basics.operators.implicit-coercion.fix-empty-check]

# ── if-else ──

- id: js.mc.false-if-stops-program
  concept: js.control.if
  title: 조건이 거짓이면 뒤의 코드도 실행되지 않는다고 생각함
  statement: if의 조건이 거짓이면 프로그램이 거기서 멈춰서, 조건문 아래에 있는 문장도 실행되지 않는다고 생각한다.
  reality: 조건이 거짓이면 if 블록만 건너뛴다. 조건문이 끝나면 프로그램은 다음 문장으로 넘어가서 계속 실행된다. else가 있으면 else 블록을 실행한 뒤 넘어간다.
  remediation:
    lessonSection: js-basics.control.if-else#pitfalls
    exercises: [js-basics.control.if-else.mcq-false-condition-continues, js-basics.control.if-else.predict-if-else-coins]

- id: js.mc.else-has-condition
  concept: js.control.if
  title: else 뒤에도 조건을 쓸 수 있다고 생각함
  statement: else (temperature < 10) { ... }처럼 else 뒤에 괄호로 조건을 붙이면 그 조건일 때만 실행된다고 생각한다.
  reality: else는 "앞의 조건이 모두 거짓일 때"라는 뜻이라 조건을 받지 않는다. else 뒤에 조건을 쓰면 SyntaxError(Unexpected token '{')가 난다. 조건이 하나 더 필요하면 else if (조건)을 쓴다.
  remediation:
    lessonSection: js-basics.control.if-else#pitfalls
    exercises: [js-basics.control.if-else.fix-else-condition, js-basics.control.if-else.parsons-ticket-price]

- id: js.mc.else-if-runs-all
  concept: js.control.else-if
  title: else if 체인에서 참인 블록이 모두 실행된다고 생각함
  statement: if … else if … else 체인에서 조건이 참인 갈래가 여러 개면, 그 블록들이 모두 차례로 실행된다고 생각한다.
  reality: 체인은 위에서부터 검사하다가 처음으로 참인 조건의 블록 하나만 실행하고, 나머지 조건은 검사하지도 않고 체인을 빠져나간다. 한 체인에서는 많아야 한 블록만 실행된다.
  remediation:
    lessonSection: js-basics.control.if-else#pitfalls
    exercises: [js-basics.control.if-else.predict-first-true-only, js-basics.control.if-else.multi-else-if-facts]

- id: js.mc.else-if-order-irrelevant
  concept: js.control.else-if
  title: else if 조건의 순서는 결과와 상관없다고 생각함
  statement: else if 체인의 조건은 어떤 순서로 적어도 결과가 같다고 생각한다.
  reality: 처음으로 참인 조건 하나만 실행되므로, score >= 60처럼 넓은 조건을 score >= 90보다 먼저 두면 90점 이상도 앞 조건에 걸려서 뒤 갈래는 절대 실행되지 않는다. 범위가 겹치는 조건은 좁은(엄격한) 조건부터 적는다.
  remediation:
    lessonSection: js-basics.control.if-else#pitfalls
    exercises: [js-basics.control.if-else.mcq-unreachable-branch, js-basics.control.if-else.fix-discount-order]

- id: js.mc.separate-ifs-like-chain
  concept: js.control.else-if
  title: if를 여러 개 이어 쓰면 하나만 실행된다고 생각함
  statement: else 없이 if 문을 여러 개 연달아 쓰면 else if 체인처럼 처음 맞는 하나만 실행된다고 생각한다.
  reality: 따로 쓴 if 문은 서로 독립된 문장이라 하나씩 모두 검사된다. 조건이 참인 if가 여러 개면 그 블록이 모두 실행된다. 하나만 고르려면 else if로 이어야 한다.
  remediation:
    lessonSection: js-basics.control.if-else#pitfalls
    exercises: [js-basics.control.if-else.tf-separate-ifs, js-basics.control.if-else.predict-separate-ifs]

- id: js.mc.indent-makes-block
  concept: js.control.block
  title: 들여쓰기만 해도 if에 묶인다고 생각함
  statement: 중괄호 없이 if 아래 두 줄을 들여 쓰면 두 줄 모두 조건에 따라 실행된다고 생각한다.
  reality: 중괄호가 없으면 if 바로 다음의 한 문장만 조건에 딸린다. 두 번째 줄은 들여 써도 if와 관계없이 항상 실행된다. JavaScript는 들여쓰기를 보지 않으므로, 여러 문장을 묶으려면 중괄호로 블록을 만든다.
  remediation:
    lessonSection: js-basics.control.if-else#pitfalls
    exercises: [js-basics.control.if-else.mcq-no-braces, js-basics.control.if-else.fix-coupon-braces]

- id: js.mc.semicolon-after-if
  concept: js.control.block
  title: if (조건) 뒤에 세미콜론을 붙여도 된다고 생각함
  statement: 문장 끝에 세미콜론을 붙이는 습관대로 if (조건); { ... }라고 써도 블록이 조건에 따라 실행된다고 생각한다.
  reality: if (조건) 바로 뒤의 세미콜론은 "아무것도 하지 않는 빈 문장"이 되어, 조건에 딸린 문장이 그 빈 문장이 된다. 뒤의 { ... } 블록은 if와 관계없는 별개의 블록이라 조건과 상관없이 항상 실행된다. 오류도 나지 않아 찾기 어렵다.
  diagnosticHint: if (조건)과 { 사이에 ; 가 있는지 확인한다.
  remediation:
    lessonSection: js-basics.control.if-else#pitfalls
    exercises: [js-basics.control.if-else.find-bug-semicolon-if, js-basics.control.if-else.fix-cafe-order-bugs]

# ── switch ──

- id: js.mc.switch-loose-compare
  concept: js.control.switch
  title: switch가 자료형이 달라도 같은 값으로 본다고 생각함
  statement: switch ("2")에서 case 2:가 실행되는 것처럼, switch가 ==처럼 자료형을 바꿔 가며 비교한다고 생각한다.
  reality: switch는 ===로 비교한다. 문자열 "2"와 숫자 2는 자료형이 달라 같은 case가 아니므로, 맞는 case가 없어 default로 간다. 입력값이 문자열이면 case도 문자열로 쓰거나 값을 숫자로 바꾼 뒤 비교한다.
  remediation:
    lessonSection: js-basics.control.switch#pitfalls
    exercises: [js-basics.control.switch.tf-switch-strict, js-basics.control.switch.predict-string-vs-number]

- id: js.mc.switch-case-condition
  concept: js.control.switch
  title: case에 조건식을 쓰면 그 조건으로 검사한다고 생각함
  statement: 'switch (score) { case score >= 90: ... }처럼 case에 조건식을 쓰면 score가 90 이상일 때 그 case가 실행된다고 생각한다.'
  reality: case 옆의 식은 먼저 계산되어 값이 된다. score >= 90은 true나 false가 되고, switch는 score(숫자)와 그 불리언을 ===로 비교하므로 절대 같지 않다. 범위를 나눌 때는 else if 체인을 쓴다.
  remediation:
    lessonSection: js-basics.control.switch#pitfalls
    exercises: [js-basics.control.switch.fix-case-condition, js-basics.control.switch.fix-vending-machine]

- id: js.mc.switch-no-break-stops
  concept: js.control.fallthrough
  title: break 없이도 맞는 case만 실행된다고 생각함
  statement: switch에서 break를 쓰지 않아도 맞는 case의 코드만 실행되고 switch가 끝난다고 생각한다.
  reality: switch는 맞는 case에서 시작해 break(또는 switch의 끝)를 만날 때까지 아래 case와 default의 코드까지 계속 실행한다(fall-through). 아래 case의 값은 다시 비교하지 않는다. 한 case만 실행하려면 case마다 break를 쓴다.
  remediation:
    lessonSection: js-basics.control.switch#pitfalls
    exercises: [js-basics.control.switch.predict-missing-break, js-basics.control.switch.find-bug-missing-break, js-basics.control.switch.fix-coffee-size]

# ── ternary ──

- id: js.mc.ternary-as-statement
  concept: js.control.ternary
  title: 조건 연산자의 각 자리에 문장을 넣을 수 있다고 생각함
  statement: '조건 연산자를 if-else의 줄임말로 보고, isRaining ? const item = "우산" : const item = "모자";처럼 각 자리에 변수 선언 같은 문장을 넣을 수 있다고 생각한다.'
  reality: '조건 연산자는 값을 만들어 내는 식이라서 ?와 : 뒤에는 값(식)만 올 수 있다. const·let 선언이나 if 같은 문장을 넣으면 SyntaxError가 난다. 값을 골라 const item = isRaining ? "우산" : "모자";처럼 받는다. 실행할 일을 고르는 것이 목적이면 if-else가 더 알맞다.'
  remediation:
    lessonSection: js-basics.control.ternary#pitfalls
    exercises: [js-basics.control.ternary.fix-ternary-const, js-basics.control.ternary.multi-valid-ternary]

- id: js.mc.ternary-result-discarded
  concept: js.control.ternary
  title: 조건 연산자만 써도 결과가 어딘가에 저장된다고 생각함
  statement: 'stock > 0 ? "판매 중" : "품절"; 한 줄만 쓰면 고른 값이 변수에 들어가거나 화면에 보인다고 생각한다.'
  reality: 조건 연산자는 값을 만들기만 한다. 그 값을 변수에 대입하거나 console.log에 넘기지 않으면 만들어진 값은 바로 버려지고 아무 일도 일어나지 않는다.
  remediation:
    lessonSection: js-basics.control.ternary#pitfalls
    exercises: [js-basics.control.ternary.tf-ternary-discarded, js-basics.control.ternary.fix-ternary-discarded]

- id: js.mc.ternary-precedence
  concept: js.control.ternary
  title: 조건 연산자가 앞의 +보다 먼저 계산된다고 생각함
  statement: '"결과: " + score >= 60 ? "합격" : "불합격"이 "결과: " 뒤에 "합격"이나 "불합격"을 붙인다고 생각한다.'
  reality: '조건 연산자는 우선순위가 아주 낮아서 +와 >=가 먼저 계산된다. "결과: " + score가 먼저 이어 붙여지고, 그 문자열 전체로 비교한 결과가 조건이 된다. 조건 연산자를 다른 식 안에 쓸 때는 (score >= 60 ? "합격" : "불합격")처럼 괄호로 감싼다.'
  remediation:
    lessonSection: js-basics.control.ternary#pitfalls
    exercises: [js-basics.control.ternary.predict-ternary-precedence, js-basics.control.ternary.fix-receipt-labels]

# ── while ──

- id: js.mc.while-checks-mid-body
  concept: js.loops.while
  title: 조건이 본문 중간에도 계속 검사된다고 생각함
  statement: while 본문을 실행하는 도중에 조건이 거짓이 되면, 그 순간 반복이 멈추고 본문의 나머지 줄은 실행되지 않는다고 생각한다.
  reality: while은 본문을 시작하기 전에만 조건을 검사한다. 본문 중간에 조건이 거짓이 되어도 그 회차의 본문은 끝까지 실행되고, 다음 회차를 시작하기 전에 조건을 다시 검사해서야 반복이 끝난다.
  remediation:
    lessonSection: js-basics.loops.while#pitfalls
    exercises: [js-basics.loops.while.tf-stops-mid-body, js-basics.loops.while.predict-change-mid-body, js-basics.loops.while.mcq-when-condition-checked]

- id: js.mc.while-runs-at-least-once
  concept: js.loops.while
  title: while 본문이 적어도 한 번은 실행된다고 생각함
  statement: while 반복은 본문을 한 번 실행해 본 다음에 조건을 검사하므로, 조건이 처음부터 거짓이어도 본문이 한 번은 실행된다고 생각한다.
  reality: while은 본문보다 조건을 먼저 검사한다. 조건이 처음부터 거짓이면 본문은 한 번도 실행되지 않고 반복 다음 문장으로 넘어간다. 적어도 한 번 실행해야 하면 do...while을 쓴다.
  remediation:
    lessonSection: js-basics.loops.while#pitfalls
    exercises: [js-basics.loops.while.find-bug-dice-while, js-basics.loops.while.fix-condition-direction]

- id: js.mc.do-while-checks-first
  concept: js.loops.do-while
  title: do...while도 조건을 먼저 검사한다고 생각함
  statement: do...while도 while처럼 조건을 먼저 검사하므로, 조건이 처음부터 거짓이면 본문이 한 번도 실행되지 않는다고 생각한다.
  reality: do...while은 본문을 먼저 실행하고 맨 끝의 while (조건)에서 조건을 검사한다. 그래서 조건이 처음부터 거짓이어도 본문은 정확히 한 번 실행된다.
  remediation:
    lessonSection: js-basics.loops.while#pitfalls
    exercises: [js-basics.loops.while.predict-do-while-once, js-basics.loops.while.mcq-do-while-difference]

- id: js.mc.while-auto-update
  concept: js.loops.infinite
  title: 반복이 조건의 변수를 저절로 바꿔 준다고 생각함
  statement: while (count < 5)처럼 조건에 변수를 쓰면, 반복할 때마다 count가 저절로 늘어나서 언젠가 반복이 끝난다고 생각한다.
  reality: while은 조건을 검사하기만 하고 변수를 바꾸지 않는다. 본문에서 count++처럼 직접 바꾸지 않으면 조건이 계속 참이라 반복이 끝나지 않는다(무한 반복).
  remediation:
    lessonSection: js-basics.loops.while#pitfalls
    exercises: [js-basics.loops.while.fix-forgot-update, js-basics.loops.while.multi-which-infinite, js-basics.loops.while.fill-cups-while]

- id: js.mc.infinite-loop-error
  concept: js.loops.infinite
  title: 무한 반복이면 JavaScript가 바로 오류를 낸다고 생각함
  statement: 반복이 끝나지 않으면 JavaScript가 곧바로 오류를 내서 알려 주거나, 알아서 반복을 멈춰 준다고 생각한다.
  reality: 무한 반복은 문법상 올바른 코드라서 JavaScript는 오류 없이 계속 반복한다. 브라우저에서는 탭이 멈춘 것처럼 응답하지 않게 된다. ProgInOne의 콘솔이 일정 시간 뒤 실행을 멈추는 것은 학습 도구의 안전장치일 뿐이다.
  remediation:
    lessonSection: js-basics.loops.while#pitfalls
    exercises: [js-basics.loops.while.tf-infinite-loop-error]

# ── for ──

- id: js.mc.for-off-by-one
  concept: js.loops.for
  title: 반복 횟수를 하나씩 틀림(off-by-one)
  statement: for (let i = 0; i <= 5; i++)가 5번 반복한다고 생각하는 것처럼, 시작값과 조건의 <, <=에 따라 반복 횟수가 하나 달라지는 것을 놓친다.
  reality: 반복 횟수는 시작값과 조건이 함께 정한다. 0부터 시작해 i < 5이면 0~4로 5번, i <= 5이면 0~5로 6번이다. 1부터 시작하면 i <= 5가 5번이다. 첫 값과 마지막 값을 직접 적어 보면 확인할 수 있다.
  remediation:
    lessonSection: js-basics.loops.for#pitfalls
    exercises: [js-basics.loops.for.multi-five-times, js-basics.loops.for.find-bug-attendance, js-basics.loops.for.fix-off-by-one-stamps]

- id: js.mc.for-update-before-body
  concept: js.loops.for
  title: 갱신식이 본문보다 먼저 실행된다고 생각함
  statement: for (let i = 0; i < 3; i++)에서 i++가 본문보다 먼저 실행되므로, 첫 회차의 i는 1이라고 생각한다.
  reality: 갱신식은 본문을 실행한 뒤에 실행된다. 순서는 초기화 → 조건 → 본문 → 갱신 → 조건 → 본문 → …이다. 그래서 첫 회차의 i는 초기화한 값 0이다.
  remediation:
    lessonSection: js-basics.loops.for#pitfalls
    exercises: [js-basics.loops.for.tf-update-before-body, js-basics.loops.for.predict-for-basic]

- id: js.mc.for-init-every-time
  concept: js.loops.for
  title: 초기화식이 회차마다 다시 실행된다고 생각함
  statement: for 괄호의 첫 부분(let i = 0)이 회차마다 다시 실행되어 i가 매번 0으로 돌아간다고 생각한다.
  reality: 초기화식은 반복을 시작할 때 딱 한 번만 실행된다. 그 뒤로는 조건 검사, 본문, 갱신만 되풀이한다.
  remediation:
    lessonSection: js-basics.loops.for#pitfalls
    exercises: [js-basics.loops.for.mcq-for-parts-order]

- id: js.mc.loop-var-outside-for
  concept: js.loops.loop-variable
  title: for에서 만든 반복 변수를 반복 뒤에도 쓸 수 있다고 생각함
  statement: for (let i = 0; ...)의 i를 반복이 끝난 뒤에도 console.log(i)처럼 쓸 수 있다고 생각한다.
  reality: for 괄호 안에서 let으로 만든 변수는 그 반복 안에서만 쓸 수 있다. 반복 뒤에 쓰면 ReferenceError가 난다. 반복 뒤에도 필요한 값은 반복 바깥(위)에서 만든 변수에 담는다.
  remediation:
    lessonSection: js-basics.loops.for#pitfalls
    exercises: [js-basics.loops.for.mcq-loop-var-after-for, js-basics.loops.for.fix-loop-var-outside]

- id: js.mc.loop-var-final-value
  concept: js.loops.loop-variable
  title: 반복이 끝난 뒤 반복 변수는 마지막 회차의 값이라고 생각함
  statement: let i = 0; while (i < 5) { i++; }가 끝나면 i가 마지막으로 본문을 실행한 회차의 값(4)이라고 생각한다.
  reality: 반복은 조건이 거짓이 되어야 끝난다. 그래서 반복이 끝난 뒤의 반복 변수는 조건을 거짓으로 만든 값(5)이다.
  remediation:
    lessonSection: js-basics.loops.for#pitfalls
    exercises: [js-basics.loops.for.predict-final-counter, js-basics.loops.for.tf-counter-after-while]

- id: js.mc.accumulator-reset-in-loop
  concept: js.loops.accumulator-pattern
  title: 누적 변수를 반복 안에서 초기화함
  statement: let total = 0;을 반복 본문 안에 써도 합계가 차곡차곡 쌓인다고 생각한다.
  reality: 본문 안의 let total = 0;은 회차마다 다시 실행되어 total을 0으로 되돌린다. 그래서 마지막 회차의 값만 남는다. 누적 변수는 반복 바깥, 반복 전에 한 번만 만든다.
  remediation:
    lessonSection: js-basics.loops.for#pitfalls
    exercises: [js-basics.loops.for.predict-reset-inside, js-basics.loops.for.find-bug-reset-total]

- id: js.mc.accumulator-overwrite
  concept: js.loops.accumulator-pattern
  title: 누적하지 않고 덮어씀
  statement: 반복 안에서 total = price;처럼 대입하면 값이 total에 더해진다고 생각한다.
  reality: =는 원래 값을 버리고 새 값으로 바꾼다. 그래서 마지막 회차의 값만 남는다. 더해 쌓으려면 total += price;(total = total + price;)를 쓴다.
  remediation:
    lessonSection: js-basics.loops.for#pitfalls
    exercises: [js-basics.loops.for.fix-overwrite-score, js-basics.loops.for.fill-cart-total]

- id: js.mc.accumulator-no-init
  concept: js.loops.accumulator-pattern
  title: 누적 변수의 시작값을 정하지 않아도 0부터 시작한다고 생각함
  statement: let total;처럼 시작값 없이 만든 변수에 total += 3을 하면 0에서부터 더해진다고 생각한다.
  reality: 시작값 없이 만든 변수는 undefined다. undefined + 3은 NaN이 되고, NaN에 무엇을 더해도 NaN이다. 합계는 0, 이어 붙일 글자는 ""처럼 시작값을 꼭 정한다.
  remediation:
    lessonSection: js-basics.loops.for#pitfalls
    exercises: [js-basics.loops.for.mcq-total-without-init]

# ── break-continue ──

- id: js.mc.break-exits-all-loops
  concept: js.loops.break
  title: break가 바깥 반복까지 모두 끝낸다고 생각함
  statement: 반복 안에 반복이 있을 때 안쪽 반복의 break가 바깥 반복까지 한꺼번에 끝낸다고 생각한다.
  reality: break는 자기를 감싼 가장 가까운 반복 하나만 끝낸다. 안쪽 반복의 break 뒤에는 바깥 반복의 다음 회차가 이어진다. 바깥 반복도 끝내려면 바깥에서 따로 검사해야 한다.
  remediation:
    lessonSection: js-basics.loops.break-continue#pitfalls
    exercises: [js-basics.loops.break-continue.tf-break-exits-all, js-basics.loops.nested-loops.predict-break-inner, js-basics.loops.nested-loops.fix-break-only-inner]

- id: js.mc.break-ends-program
  concept: js.loops.break
  title: break가 프로그램 전체를 끝낸다고 생각함
  statement: 반복 안에서 break를 만나면 프로그램이 거기서 끝나서, 반복 아래에 있는 문장도 실행되지 않는다고 생각한다.
  reality: break는 반복만 끝낸다. 실행은 반복 바로 다음 문장으로 이어지고, 그 아래 코드는 평소처럼 실행된다.
  remediation:
    lessonSection: js-basics.loops.break-continue#pitfalls
    exercises: [js-basics.loops.break-continue.predict-break-search]

- id: js.mc.continue-ends-loop
  concept: js.loops.continue
  title: continue가 반복을 끝낸다고 생각함
  statement: continue를 만나면 break처럼 반복 전체가 끝난다고 생각한다.
  reality: continue는 이번 회차의 남은 본문만 건너뛰고 다음 회차로 넘어간다. 반복은 조건이 거짓이 될 때까지 계속된다.
  remediation:
    lessonSection: js-basics.loops.break-continue#pitfalls
    exercises: [js-basics.loops.break-continue.mcq-continue-effect, js-basics.loops.break-continue.predict-continue-boxes]

- id: js.mc.continue-while-update
  concept: js.loops.continue
  title: while에서도 continue가 갱신 줄을 실행해 준다고 생각함
  statement: for에서처럼 while에서도 continue를 쓰면 본문 끝의 i++가 실행된 뒤 다음 회차로 넘어간다고 생각한다.
  reality: for는 continue 뒤에 갱신식을 실행하지만, while에는 갱신식 자리가 없다. continue가 본문 끝의 i++보다 앞에 있으면 i++를 건너뛰어 같은 값으로 계속 반복하게 된다(무한 반복). while에서는 continue 전에 변수를 바꾼다.
  remediation:
    lessonSection: js-basics.loops.break-continue#pitfalls
    exercises: [js-basics.loops.break-continue.mcq-continue-while-forever]

# ── nested-loops ──

- id: js.mc.inner-var-not-reset
  concept: js.loops.nested
  title: 안쪽 반복이 바깥 반복마다 처음부터 다시 돌지 않는다고 생각함
  statement: 안쪽 for의 j가 첫 바깥 회차에서 끝까지 간 뒤로는 그 값에 머물러 있어서, 다음 바깥 회차에서는 안쪽 반복이 실행되지 않는다고 생각한다.
  reality: 안쪽 for 문 전체가 바깥 반복의 본문이라서, 바깥 회차마다 안쪽 for의 초기화(let j = 1)부터 다시 실행된다. 안쪽 반복은 바깥 회차마다 처음부터 끝까지 돈다. 단, 안쪽 반복의 변수를 바깥 반복보다 먼저 만들어 두면(while 등) 다시 초기화되지 않는다.
  remediation:
    lessonSection: js-basics.loops.nested-loops#pitfalls
    exercises: [js-basics.loops.nested-loops.tf-inner-restarts, js-basics.loops.nested-loops.find-bug-inner-counter, js-basics.loops.nested-loops.predict-room-numbers]

- id: js.mc.nested-count-additive
  concept: js.loops.nested
  title: 중첩 반복의 횟수를 곱이 아니라 합으로 셈
  statement: 바깥 3번, 안쪽 4번 도는 중첩 반복에서 안쪽 본문이 3 + 4 = 7번 실행된다고 생각한다.
  reality: 바깥 회차마다 안쪽 반복이 4번 모두 돌기 때문에 안쪽 본문은 3 × 4 = 12번 실행된다.
  remediation:
    lessonSection: js-basics.loops.nested-loops#pitfalls
    exercises: [js-basics.loops.nested-loops.mcq-nested-count]

# ── 모듈 6. function-basics ──

- id: js.mc.declaration-runs-function
  concept: js.fn.declaration
  title: 함수를 선언하면 실행된다고 생각함
  statement: function greet() { console.log("안녕"); }을 쓰기만 해도 그 자리에서 본문이 실행되어 "안녕"이 출력된다고 생각한다.
  reality: 함수 선언은 본문에 이름을 붙여 만들어 두기만 한다. 본문은 greet()처럼 호출할 때 비로소 실행되고, 호출한 횟수만큼 실행된다.
  remediation:
    lessonSection: js-basics.functions.function-basics#pitfalls
    exercises: [js-basics.functions.function-basics.mcq-declare-not-run, js-basics.functions.function-basics.tf-declaration-runs, js-basics.functions.function-basics.fix-missing-call]

- id: js.mc.call-without-parens
  concept: js.fn.call
  title: 괄호 없이 함수 이름만 써도 호출된다고 생각함
  statement: greet;처럼 함수 이름만 쓴 줄도 greet()와 같이 함수를 실행한다고 생각한다.
  reality: 함수를 실행하는 것은 이름 뒤의 괄호다. greet;는 함수 값을 가리키기만 하고 아무 일도 하지 않는다(오류도 나지 않아 알아차리기 어렵다).
  remediation:
    lessonSection: js-basics.functions.function-basics#pitfalls
    exercises: [js-basics.functions.function-basics.mcq-call-without-parens, js-basics.functions.function-basics.find-bug-missing-parens, js-basics.functions.function-basics.parsons-declare-and-call]

- id: js.mc.function-runs-once
  concept: js.fn.call
  title: 함수는 한 번만 실행된다고 생각함
  statement: 함수를 한 번 호출하면 다 써 버려서 다시 호출해도 실행되지 않거나, 처음 결과가 저장되어 그대로 나온다고 생각한다.
  reality: 함수는 호출할 때마다 본문을 처음부터 다시 실행한다. 인수가 다르면 결과도 달라지고, 몇 번이든 다시 부를 수 있다.
  remediation:
    lessonSection: js-basics.functions.function-basics#pitfalls
    exercises: [js-basics.functions.function-basics.tf-declaration-runs, js-basics.functions.function-basics.find-bug-missing-parens]

- id: js.mc.params-match-by-name
  concept: js.fn.params-args
  title: 인수가 이름이 같은 매개변수로 들어간다고 생각함
  statement: intro(age, name)처럼 호출하면 변수 이름이 같은 매개변수 name에 name이, age에 age가 들어간다고 생각한다.
  reality: 인수는 이름과 상관없이 순서대로 매개변수에 들어간다. 첫 번째 인수는 첫 번째 매개변수에, 두 번째 인수는 두 번째 매개변수에 들어간다.
  remediation:
    lessonSection: js-basics.functions.function-basics#pitfalls
    exercises: [js-basics.functions.function-basics.predict-args-by-order, js-basics.functions.function-basics.fix-swapped-args]

- id: js.mc.param-redeclare-with-let
  concept: js.fn.params-args
  title: 매개변수도 함수 안에서 let으로 다시 만들어야 한다고 생각함
  statement: 매개변수 price를 쓰려면 함수 본문에서 let price = price;처럼 다시 선언해야 한다고 생각한다.
  reality: 매개변수는 이미 함수 안의 변수다. 본문에서 같은 이름을 let으로 다시 선언하면 SyntaxError(Identifier 'price' has already been declared)가 나서 프로그램 전체가 실행되지 않는다.
  remediation:
    lessonSection: js-basics.functions.function-basics#pitfalls
    exercises: [js-basics.functions.function-basics.tf-param-let-redeclare]

- id: js.mc.return-is-log
  concept: js.fn.return
  title: 함수 안의 console.log를 return과 같은 것으로 봄
  statement: 함수 안에서 console.log(결과)를 하면 그 값이 함수의 결과로 돌아와 변수에 담긴다고 생각한다.
  reality: console.log는 콘솔에 보여 주기만 한다. 값을 호출한 자리로 돌려주는 것은 return뿐이고, return이 없으면 함수의 결과는 undefined다.
  remediation:
    lessonSection: js-basics.functions.function-basics#pitfalls
    exercises: [js-basics.functions.function-basics.mcq-return-vs-log, js-basics.functions.function-basics.fix-log-instead-of-return]

- id: js.mc.return-value-auto-printed
  concept: js.fn.return
  title: 반환값이 저절로 출력된다고 생각함
  statement: add(2, 3);처럼 호출만 해도 반환값 5가 콘솔에 출력된다고 생각한다.
  reality: return은 값을 돌려줄 뿐 출력하지 않는다. 돌려받은 값을 보려면 console.log(add(2, 3))처럼 직접 출력해야 하고, 받아서 쓰지 않은 반환값은 그냥 버려진다.
  remediation:
    lessonSection: js-basics.functions.function-basics#pitfalls
    exercises: [js-basics.functions.function-basics.predict-call-flow, js-basics.functions.function-basics.multi-return-facts]

- id: js.mc.return-changes-outer-variable
  concept: js.fn.return
  title: return하면 바깥의 같은 이름 변수에 값이 들어간다고 생각함
  statement: 함수 안에서 return result;를 하면 함수 밖에 있는 같은 이름의 변수 result에 그 값이 들어간다고 생각한다.
  reality: return은 값을 호출한 자리로 돌려줄 뿐 어떤 변수에도 넣지 않는다. 바깥 변수에 담으려면 result = calc();처럼 호출 결과를 직접 대입해야 한다.
  remediation:
    lessonSection: js-basics.functions.function-basics#pitfalls
    exercises: [js-basics.functions.function-basics.fix-return-outer-variable, js-basics.functions.function-basics.multi-return-facts]

- id: js.mc.code-after-return-runs
  concept: js.fn.return
  title: return 뒤의 코드도 실행된다고 생각함
  statement: 함수 본문에서 return 다음 줄에 있는 console.log나 계산도 이어서 실행된다고 생각한다.
  reality: return을 만나면 함수는 그 자리에서 끝난다. 같은 함수 안에서 return보다 뒤에 있는 코드는 실행되지 않고, 반복 안의 return은 반복과 함수를 함께 끝낸다.
  remediation:
    lessonSection: js-basics.functions.return-and-side-effects#pitfalls
    exercises: [js-basics.functions.return-and-side-effects.fix-unreachable-log, js-basics.functions.function-basics.find-bug-return-in-loop, js-basics.functions.function-basics.multi-return-facts]

# ── 모듈 6. return-and-side-effects ──

- id: js.mc.function-cant-change-outer
  concept: js.fn.side-effects
  title: 함수는 바깥 변수를 바꿀 수 없다고 생각함
  statement: 함수 안에서 바깥에 있는 변수에 새 값을 대입해도 함수가 끝나면 원래대로 돌아간다고 생각한다.
  reality: 같은 이름을 함수 안에서 새로 만들지 않았다면, 함수 안의 대입은 바깥 변수를 실제로 바꾼다. 이렇게 바깥에 남는 변화가 부수 효과다.
  remediation:
    lessonSection: js-basics.functions.return-and-side-effects#pitfalls
    exercises: [js-basics.functions.return-and-side-effects.tf-function-changes-outer, js-basics.functions.return-and-side-effects.mcq-what-is-side-effect, js-basics.functions.return-and-side-effects.impl-sell-stock]

- id: js.mc.side-effect-repeats-on-reuse
  concept: js.fn.side-effects
  title: 반환값을 담은 변수를 쓸 때마다 함수가 다시 실행된다고 생각함
  statement: const r = greet();로 받아 둔 r을 여러 번 출력하면 greet 안의 console.log도 그때마다 다시 실행된다고 생각한다.
  reality: 함수는 greet()라고 쓴 그 순간에 한 번 실행되고, r에는 반환값만 담긴다. r을 쓰는 것은 담긴 값을 읽는 것이라 함수의 부수 효과는 다시 일어나지 않는다.
  remediation:
    lessonSection: js-basics.functions.return-and-side-effects#pitfalls
    exercises: [js-basics.functions.return-and-side-effects.predict-side-effect-once]

- id: js.mc.no-return-is-null
  concept: js.fn.undefined-return
  title: 반환문이 없으면 null을 반환한다고 생각함
  statement: return이 없는 함수를 호출한 결과가 null(또는 0이나 빈 문자열)이라고 생각한다.
  reality: return이 없거나 return 뒤에 값이 없으면 함수는 undefined를 반환한다. null은 프로그래머가 일부러 "비어 있음"을 표시할 때 쓰는 다른 값이다.
  remediation:
    lessonSection: js-basics.functions.return-and-side-effects#pitfalls
    exercises: [js-basics.functions.return-and-side-effects.multi-what-returns-undefined, js-basics.functions.return-and-side-effects.impl-first-even]

- id: js.mc.return-in-if-covers-all
  concept: js.fn.undefined-return
  title: if 안에만 return이 있어도 모든 경우에 값이 반환된다고 생각함
  statement: if (score >= 60) { return "합격"; }만 있는 함수도 다른 경우에 무언가(빈 값이나 false)를 알아서 돌려준다고 생각한다.
  reality: 실행된 갈래에 return이 없으면 함수는 끝까지 내려가 undefined를 반환한다. 모든 경우에 값이 필요하면 모든 갈래(또는 함수 끝)에 return을 써야 한다.
  remediation:
    lessonSection: js-basics.functions.return-and-side-effects#pitfalls
    exercises: [js-basics.functions.return-and-side-effects.predict-missing-return-nan, js-basics.functions.return-and-side-effects.fix-missing-return-path, js-basics.functions.return-and-side-effects.fill-return-all-paths]

- id: js.mc.same-args-same-result-always
  concept: js.fn.pure
  title: 어떤 함수든 같은 인수면 같은 결과를 낸다고 생각함
  statement: 함수에 같은 인수를 넣으면 언제 호출하든 항상 같은 값이 돌아온다고 생각한다.
  reality: 그것은 순수 함수만의 성질이다. 바깥 변수를 읽거나 바꾸는 함수는 바깥 값이 달라지면 같은 인수로도 다른 결과를 낸다.
  remediation:
    lessonSection: js-basics.functions.return-and-side-effects#pitfalls
    exercises: [js-basics.functions.return-and-side-effects.tf-pure-same-result, js-basics.functions.return-and-side-effects.mcq-which-is-pure, js-basics.functions.return-and-side-effects.fix-impure-total]

# ── 모듈 6. expressions-and-arrows ──

- id: js.mc.fn-expression-stores-result
  concept: js.fn.expression
  title: 함수 표현식을 쓰면 실행 결과가 변수에 담긴다고 생각함
  statement: const add = function (a, b) { return a + b; };를 실행하면 함수가 그 자리에서 실행되어 결과값이 add에 담긴다고 생각한다.
  reality: 함수 표현식은 함수 자체를 값으로 만들어 변수에 담을 뿐 실행하지 않는다. add에는 함수가 들어 있고, add(1, 2)처럼 호출해야 결과가 나온다.
  remediation:
    lessonSection: js-basics.functions.expressions-and-arrows#pitfalls
    exercises: [js-basics.functions.expressions-and-arrows.mcq-expression-stores-function, js-basics.functions.expressions-and-arrows.predict-function-in-variable, js-basics.functions.expressions-and-arrows.tf-expression-vs-declaration]

- id: js.mc.arrow-is-comparison
  concept: js.fn.arrow
  title: 화살표 =>를 비교 연산자로 읽음
  statement: (n) => n * 2의 =>를 >=(크거나 같다)처럼 비교하는 연산자로 읽는다.
  reality: =>는 "이 매개변수를 받아 오른쪽을 계산한다"는 화살표 함수의 기호다. 비교 연산자 >=와는 글자 순서도 뜻도 다르다.
  remediation:
    lessonSection: js-basics.functions.expressions-and-arrows#pitfalls
    exercises: [js-basics.functions.expressions-and-arrows.mcq-arrow-read, js-basics.functions.expressions-and-arrows.parsons-arrow-convert]

- id: js.mc.arrow-braces-implicit-return
  concept: js.fn.arrow
  title: 화살표 함수 본문에 중괄호를 써도 값이 저절로 반환된다고 생각함
  statement: (n) => { n * 2 }처럼 중괄호를 쓴 화살표 함수도 n * 2를 반환한다고 생각한다.
  reality: 값이 자동으로 반환되는 것은 중괄호 없이 식 하나만 쓴 경우뿐이다. 중괄호를 쓰면 일반 함수 본문이 되어 return을 직접 써야 하고, 없으면 undefined를 반환한다.
  remediation:
    lessonSection: js-basics.functions.expressions-and-arrows#pitfalls
    exercises: [js-basics.functions.expressions-and-arrows.tf-arrow-braces-return, js-basics.functions.expressions-and-arrows.predict-arrow-braces-undefined, js-basics.functions.expressions-and-arrows.fix-arrow-braces-no-return, js-basics.functions.expressions-and-arrows.multi-arrow-equivalents]

- id: js.mc.arrow-concise-with-return
  concept: js.fn.arrow
  title: 중괄호 없는 화살표 본문에도 return을 쓸 수 있다고 생각함
  statement: (a, b) => return a + b처럼 중괄호 없이 return을 써도 된다고 생각한다.
  reality: 중괄호 없는 본문은 식 하나만 올 수 있는 자리라서 return 문을 쓸 수 없다. SyntaxError(Unexpected token 'return')가 나서 프로그램 전체가 실행되지 않는다. return을 쓰려면 중괄호로 감싼다.
  remediation:
    lessonSection: js-basics.functions.expressions-and-arrows#pitfalls
    exercises: [js-basics.functions.expressions-and-arrows.fix-arrow-return-keyword, js-basics.functions.expressions-and-arrows.multi-arrow-equivalents]

- id: js.mc.expression-hoisted
  concept: js.fn.hoisting
  title: 함수 표현식도 선언 전에 호출할 수 있다고 생각함
  statement: 함수 선언처럼 const greet = () => ...로 만든 함수도 그 줄보다 위에서 호출할 수 있다고 생각한다.
  reality: 미리 만들어지는 것은 함수 선언뿐이다. const로 만든 함수 표현식은 그 줄이 실행되기 전에 쓰면 ReferenceError(Cannot access 'greet' before initialization)가 난다.
  remediation:
    lessonSection: js-basics.functions.expressions-and-arrows#pitfalls
    exercises: [js-basics.functions.expressions-and-arrows.fix-expression-hoisting, js-basics.functions.expressions-and-arrows.find-bug-call-too-early, js-basics.functions.expressions-and-arrows.fix-mixed-function-bugs]

- id: js.mc.declaration-not-hoisted
  concept: js.fn.hoisting
  title: 함수 선언도 선언보다 위에서 부르면 오류가 난다고 생각함
  statement: 코드는 위에서 아래로 실행되므로, function으로 선언한 함수도 선언보다 위에서 호출하면 오류가 난다고 생각한다.
  reality: 함수 선언은 코드를 실행하기 전에 미리 만들어지므로 선언보다 위에서 호출해도 동작한다(호이스팅). 다만 읽기 쉽게 선언을 먼저 두는 경우가 많다.
  remediation:
    lessonSection: js-basics.functions.expressions-and-arrows#pitfalls
    exercises: [js-basics.functions.expressions-and-arrows.mcq-call-before-declaration, js-basics.functions.expressions-and-arrows.predict-hoisting-mixed]

# ── 모듈 6. default-and-rest ──

- id: js.mc.missing-arg-error
  concept: js.fn.default-params
  title: 인수를 덜 넘기면 오류가 난다고 생각함
  statement: 매개변수가 두 개인 함수에 인수를 하나만 넘기면 오류가 나서 함수가 실행되지 않는다고 생각한다.
  reality: JavaScript는 인수 개수를 검사하지 않는다. 받지 못한 매개변수는 undefined가 되고 함수는 그대로 실행된다. 그래서 계산 결과가 NaN이나 "undefined" 글자로 조용히 틀어질 수 있다.
  remediation:
    lessonSection: js-basics.functions.default-and-rest#pitfalls
    exercises: [js-basics.functions.default-and-rest.mcq-missing-arg-undefined, js-basics.functions.default-and-rest.impl-greet-default]

- id: js.mc.default-on-null
  concept: js.fn.default-params
  title: null이나 0을 넘겨도 기본값이 쓰인다고 생각함
  statement: function f(count = 1)에 null이나 0을 넘기면 "값이 없다"고 보고 기본값 1이 쓰인다고 생각한다.
  reality: 기본값은 인수가 없거나 undefined일 때만 쓰인다. null, 0, 빈 문자열은 넘긴 값 그대로 매개변수에 들어간다.
  remediation:
    lessonSection: js-basics.functions.default-and-rest#pitfalls
    exercises: [js-basics.functions.default-and-rest.tf-default-on-null, js-basics.functions.default-and-rest.fix-default-on-null, js-basics.functions.default-and-rest.impl-delivery-fee]

- id: js.mc.rest-not-last
  concept: js.fn.rest-params
  title: 나머지 매개변수를 아무 위치에나 둘 수 있다고 생각함
  statement: function f(...items, label)처럼 나머지 매개변수 뒤에 다른 매개변수를 둘 수 있다고 생각한다.
  reality: 나머지 매개변수는 남은 인수를 모두 모으므로 반드시 맨 끝에 하나만 둘 수 있다. 뒤에 매개변수가 있으면 SyntaxError(Rest parameter must be last formal parameter)가 난다.
  remediation:
    lessonSection: js-basics.functions.default-and-rest#pitfalls
    exercises: [js-basics.functions.default-and-rest.fix-rest-position, js-basics.functions.default-and-rest.multi-rest-rules]

- id: js.mc.rest-includes-named
  concept: js.fn.rest-params
  title: 나머지 매개변수가 앞 매개변수의 인수까지 모은다고 생각함
  statement: function order(name, ...menus)를 order("민수", "김밥", "라면")으로 부르면 menus에 세 값이 모두 들어간다고 생각한다.
  reality: 앞 매개변수가 먼저 인수를 받고, 나머지 매개변수는 그 뒤에 남은 인수만 모은다. 위 예에서 menus에는 "김밥"과 "라면" 두 값만 들어간다.
  remediation:
    lessonSection: js-basics.functions.default-and-rest#pitfalls
    exercises: [js-basics.functions.default-and-rest.predict-rest-length, js-basics.functions.default-and-rest.multi-rest-rules, js-basics.functions.default-and-rest.impl-average-score]

# ── 모듈 6. scope-basics ──

- id: js.mc.block-let-visible-outside
  concept: js.scope.block
  title: 블록 안에서 만든 let 변수를 블록 밖에서 쓸 수 있다고 생각함
  statement: if 블록 안에서 let message = "..."로 만든 변수를 블록이 끝난 뒤에도 쓸 수 있다고 생각한다.
  reality: 블록 안에서 let이나 const로 만든 변수는 그 블록 안에서만 있다. 블록 밖에서 쓰면 ReferenceError(message is not defined)가 난다. 밖에서도 쓸 값은 블록 바깥에서 먼저 만든다.
  remediation:
    lessonSection: js-basics.functions.scope-basics#pitfalls
    exercises: [js-basics.functions.scope-basics.mcq-block-let-outside, js-basics.functions.scope-basics.predict-block-scope-error, js-basics.functions.scope-basics.fix-let-in-if, js-basics.functions.scope-basics.multi-var-vs-let]

- id: js.mc.var-is-block-scoped
  concept: js.scope.block
  title: var도 let처럼 블록 안에서만 쓸 수 있다고 생각함
  statement: if 블록 안에서 var로 만든 변수도 블록이 끝나면 쓸 수 없다고 생각한다.
  reality: var는 블록을 무시하고 자기를 감싼 함수 전체(함수 밖이면 프로그램 전체)에서 쓸 수 있다. 블록 스코프를 따르는 것은 let과 const다. 그래서 새 코드에서는 var 대신 let과 const를 쓴다.
  remediation:
    lessonSection: js-basics.functions.scope-basics#pitfalls
    exercises: [js-basics.functions.scope-basics.multi-var-vs-let]

- id: js.mc.sibling-blocks-name-conflict
  concept: js.scope.block
  title: 다른 블록에서 같은 이름의 let을 만들면 부딪힌다고 생각함
  statement: if 블록과 else 블록에서 각각 let message를 만들면 "이미 선언되었다"는 오류가 난다고 생각한다.
  reality: 블록마다 스코프가 따로라서 서로 다른 블록에서 같은 이름의 변수를 만들어도 부딪히지 않는다. 같은 블록 안에서 두 번 선언할 때만 오류가 난다.
  remediation:
    lessonSection: js-basics.functions.scope-basics#pitfalls
    exercises: [js-basics.functions.scope-basics.tf-sibling-blocks-same-name, js-basics.functions.scope-basics.find-bug-let-in-if]

- id: js.mc.function-local-visible-outside
  concept: js.scope.function
  title: 함수 안에서 만든 변수를 함수 밖에서 쓸 수 있다고 생각함
  statement: 함수를 한 번 호출하고 나면 함수 안에서 만든 변수를 함수 밖에서도 쓸 수 있다고 생각한다.
  reality: 함수 안의 변수와 매개변수는 그 함수 안에서만 있고, 호출이 끝나면 사라진다. 함수 밖에서 쓰면 ReferenceError가 난다. 값이 필요하면 return으로 돌려받는다.
  remediation:
    lessonSection: js-basics.functions.scope-basics#pitfalls
    exercises: [js-basics.functions.scope-basics.mcq-local-visible-outside]

- id: js.mc.function-var-persists
  concept: js.scope.function
  title: 함수 안의 변수 값이 다음 호출까지 남는다고 생각함
  statement: 함수 안에서 let count = 0;을 만들고 count++를 하면, 다음에 호출할 때 count가 1부터 이어진다고 생각한다.
  reality: 함수 안의 변수는 호출할 때마다 새로 만들어진다. 매번 let count = 0;부터 다시 시작하므로 값이 이어지지 않는다. 호출 사이에 기억해야 하는 값은 함수 바깥에 둔다.
  remediation:
    lessonSection: js-basics.functions.scope-basics#pitfalls
    exercises: [js-basics.functions.scope-basics.predict-two-counters, js-basics.functions.scope-basics.fix-counter-local, js-basics.functions.scope-basics.impl-stamp-card]

- id: js.mc.inner-cant-read-outer
  concept: js.scope.global
  title: 함수 안에서는 바깥 변수를 쓸 수 없다고 생각함
  statement: 함수 안에서는 매개변수와 함수 안에서 만든 변수만 쓸 수 있고, 바깥의 변수는 읽을 수 없다고 생각한다.
  reality: 안쪽에서는 바깥 스코프의 변수를 읽고 바꿀 수 있다. 막혀 있는 것은 반대 방향(바깥에서 안쪽 변수를 쓰는 것)이다.
  remediation:
    lessonSection: js-basics.functions.scope-basics#pitfalls
    exercises: [js-basics.functions.scope-basics.tf-inner-reads-outer]

- id: js.mc.undeclared-assign-creates-global
  concept: js.scope.global
  title: let 없이 대입하면 새 전역 변수가 생긴다고 생각함
  statement: 함수 안에서 let 없이 total = 0;처럼 대입하면 total이라는 전역 변수가 새로 만들어진다고 생각한다.
  reality: 엄격 모드에서는 선언하지 않은 이름에 대입하면 ReferenceError(total is not defined)가 난다. ProgInOne은 엄격 모드로 실행한다. 변수는 항상 let이나 const로 먼저 만든다.
  remediation:
    lessonSection: js-basics.functions.scope-basics#pitfalls
    exercises: [js-basics.functions.scope-basics.fix-undeclared-assign, js-basics.functions.scope-basics.impl-visit-counter]

- id: js.mc.param-reassign-changes-outer
  concept: js.scope.shadowing
  title: 매개변수에 새 값을 넣으면 바깥 변수가 바뀐다고 생각함
  statement: addBonus(score)를 호출하고 함수 안에서 매개변수 score에 score += 10을 하면, 인수로 넘긴 바깥 변수 score도 10 늘어난다고 생각한다.
  reality: 매개변수는 인수 값을 받은 함수 안의 새 변수다. 이름이 같아도 바깥 변수와는 별개라서, 매개변수를 바꿔도 바깥 변수는 그대로다. 바깥 값을 바꾸려면 새 값을 return해서 대입한다.
  remediation:
    lessonSection: js-basics.functions.scope-basics#pitfalls
    exercises: [js-basics.functions.scope-basics.mcq-param-reassign-outer, js-basics.functions.scope-basics.predict-shadow-param, js-basics.functions.scope-basics.fix-param-shadow]

- id: js.mc.shadow-changes-outer
  concept: js.scope.shadowing
  title: 안쪽에서 같은 이름으로 만든 변수를 바꾸면 바깥 변수도 바뀐다고 생각함
  statement: 바깥에 let total = 0;이 있을 때 함수나 블록 안에서 let total = 5;로 만들고 바꾸면 바깥 total도 바뀐다고 생각한다.
  reality: 안쪽의 let total은 이름만 같은 새 변수라서 바깥 total을 가린다(섀도잉). 안쪽 변수를 아무리 바꿔도 바깥 total은 그대로다.
  remediation:
    lessonSection: js-basics.functions.scope-basics#pitfalls
    exercises: [js-basics.functions.scope-basics.find-bug-shadow-total, js-basics.functions.scope-basics.fix-scope-bugs, js-basics.functions.scope-basics.web-like-counter]

- id: js.mc.shadow-reads-outer-before-decl
  concept: js.scope.shadowing
  title: 안쪽 선언 전 줄에서는 바깥 변수를 읽는다고 생각함
  statement: 함수 안에서 let price = ...를 선언하기 전 줄에서 price를 쓰면, 아직 안쪽 변수가 없으니 바깥 price를 읽는다고 생각한다.
  reality: 안쪽 스코프에 같은 이름의 let·const 선언이 있으면, 그 스코프 전체에서 그 이름은 안쪽 변수를 가리킨다. 선언 줄보다 위에서 쓰면 바깥 값을 읽지 않고 ReferenceError(Cannot access 'price' before initialization)가 난다.
  remediation:
    lessonSection: js-basics.functions.scope-basics#pitfalls
    exercises: [js-basics.functions.scope-basics.predict-shadow-tdz, js-basics.functions.scope-basics.fix-scope-bugs]

# ── 모듈 6. callbacks-intro ──

- id: js.mc.function-not-a-value
  concept: js.fn.first-class
  title: 함수는 변수에 담거나 인수로 넘길 수 없다고 생각함
  statement: 변수에 담고 인수로 넘길 수 있는 것은 숫자·문자열 같은 값뿐이고, 함수는 이름으로 호출하는 것만 가능하다고 생각한다.
  reality: JavaScript에서 함수도 값이다. 다른 변수에 담아 그 이름으로 호출할 수 있고, 다른 함수의 인수로 넘길 수 있으며, typeof로 확인하면 "function"이다.
  remediation:
    lessonSection: js-basics.functions.callbacks-intro#pitfalls
    exercises: [js-basics.functions.callbacks-intro.mcq-function-is-value, js-basics.functions.callbacks-intro.mcq-typeof-function, js-basics.functions.callbacks-intro.find-bug-assign-call-result]

- id: js.mc.assign-call-result
  concept: js.fn.first-class
  title: 함수를 담으려고 호출 결과를 대입함
  statement: 함수를 다른 이름으로 쓰고 싶어서 const say = greet();처럼 괄호를 붙여 대입하면 say에 함수가 담긴다고 생각한다.
  reality: greet()는 함수를 실행한 결과(반환값)다. 함수 자체를 담으려면 괄호 없이 const say = greet;로 쓴다. 결과를 담은 say를 say()로 부르면 TypeError(say is not a function)가 난다.
  remediation:
    lessonSection: js-basics.functions.callbacks-intro#pitfalls
    exercises: [js-basics.functions.callbacks-intro.tf-assign-call-result, js-basics.functions.callbacks-intro.find-bug-assign-call-result, js-basics.functions.callbacks-intro.fix-assign-call-result]

- id: js.mc.callback-called-when-passed
  concept: js.fn.callback
  title: 콜백을 넘길 때 괄호를 붙여 호출해서 넘김
  statement: repeat(3, sayHi())처럼 콜백 이름 뒤에 괄호를 붙여야 함수가 넘어간다고 생각한다.
  reality: sayHi()는 그 자리에서 sayHi를 한 번 실행하고 그 반환값(대개 undefined)을 넘긴다. 받은 함수가 그 값을 부르려고 하면 TypeError가 난다. 함수 자체를 넘기려면 괄호 없이 repeat(3, sayHi)로 쓴다.
  remediation:
    lessonSection: js-basics.functions.callbacks-intro#pitfalls
    exercises: [js-basics.functions.callbacks-intro.mcq-pass-callback, js-basics.functions.callbacks-intro.fix-callback-called, js-basics.functions.callbacks-intro.parsons-repeat-callback]

- id: js.mc.callback-runs-at-pass-time
  concept: js.fn.callback
  title: 콜백은 넘기는 순간 한 번 실행된다고 생각함
  statement: 함수를 인수로 넘기면 넘기는 그 순간 콜백이 한 번 실행된다고 생각한다.
  reality: 괄호 없이 넘긴 콜백은 넘길 때 실행되지 않는다. 콜백을 받은 함수가 자기 본문에서 부를 때 실행되며, 몇 번 부를지(0번일 수도 있음)와 어떤 인수를 줄지도 받은 함수가 정한다.
  remediation:
    lessonSection: js-basics.functions.callbacks-intro#pitfalls
    exercises: [js-basics.functions.callbacks-intro.predict-callback-order, js-basics.functions.callbacks-intro.multi-callback-facts]

# ── 모듈 7. string-basics ──

- id: js.mc.last-index-is-length
  concept: js.str.index-length
  title: 마지막 글자의 인덱스가 length라고 생각함
  statement: 글자가 5개인 문자열의 마지막 글자는 str[5], 즉 str[str.length]로 읽는다고 생각한다.
  reality: 인덱스는 0부터 세므로 글자가 5개면 인덱스는 0~4이고, 마지막 글자는 str[str.length - 1]이다. str[str.length]는 범위 밖이라 undefined다. 그래서 반복 조건을 i <= str.length로 쓰면 마지막 회차에 undefined가 나온다.
  remediation:
    lessonSection: js-basics.strings.string-basics#pitfalls
    exercises: [js-basics.strings.string-basics.mcq-last-index, js-basics.strings.string-basics.find-bug-loop-boundary]

- id: js.mc.index-starts-at-one
  concept: js.str.index-length
  title: 첫 글자의 인덱스가 1이라고 생각함
  statement: 사람이 첫째, 둘째로 세듯이 문자열의 첫 글자는 str[1]로 읽는다고 생각한다.
  reality: 인덱스는 "맨 앞에서 몇 칸 떨어져 있는가"라서 첫 글자는 0칸 떨어진 str[0]이다. str[1]은 두 번째 글자다.
  remediation:
    lessonSection: js-basics.strings.string-basics#pitfalls
    exercises: [js-basics.strings.string-basics.predict-index-length, js-basics.strings.string-basics.mcq-last-index]

- id: js.mc.out-of-range-index-throws
  concept: js.str.index-length
  title: 범위 밖 인덱스를 읽으면 오류가 난다고 생각함
  statement: 글자가 3개인 문자열에서 str[10]을 읽으면 오류가 나서 프로그램이 멈춘다고 생각한다.
  reality: 범위 밖 인덱스를 읽으면 오류 없이 undefined가 나온다. 오류가 나지 않으니 실수가 조용히 숨어 있다가 "undefined"라는 글자로 출력되거나 계산을 망친다.
  remediation:
    lessonSection: js-basics.strings.string-basics#pitfalls
    exercises: [js-basics.strings.string-basics.tf-out-of-range, js-basics.strings.string-basics.predict-index-length]

- id: js.mc.length-is-method
  concept: js.str.index-length
  title: length를 함수처럼 괄호를 붙여 부른다고 생각함
  statement: 글자 수를 구할 때 str.length()처럼 괄호를 붙여야 한다고 생각한다.
  reality: length는 문자열이 가진 값(속성)이라 괄호 없이 str.length로 읽는다. str.length()라고 쓰면 숫자를 함수처럼 부르게 되어 TypeError(str.length is not a function)가 난다. 반대로 toUpperCase() 같은 메서드는 괄호가 필요하다.
  remediation:
    lessonSection: js-basics.strings.string-basics#pitfalls
    exercises: [js-basics.strings.string-basics.multi-length-facts]

- id: js.mc.string-index-assign
  concept: js.str.immutability
  title: 인덱스에 대입하면 문자열의 글자가 바뀐다고 생각함
  statement: let word = "cat"; word[0] = "b";를 실행하면 word가 "bat"이 된다고 생각한다. let으로 만든 변수라면 글자도 바꿀 수 있다고 생각하기도 한다.
  reality: 문자열은 만든 뒤에 글자를 바꿀 수 없다(불변). 엄격 모드에서는 word[0] = "b"가 TypeError(Cannot assign to read only property '0' of string 'cat')를 내고, 엄격 모드가 아니면 오류 없이 무시되어 word는 그대로 "cat"이다. let은 변수에 다른 값을 다시 대입할 수 있다는 뜻이지 문자열 안의 글자를 바꿀 수 있다는 뜻이 아니다. 새 문자열을 만들어 다시 대입한다.
  remediation:
    lessonSection: js-basics.strings.string-basics#pitfalls
    exercises: [js-basics.strings.string-basics.predict-index-assign, js-basics.strings.string-basics.tf-let-string-mutable, js-basics.strings.string-basics.fix-seat-code]

- id: js.mc.template-in-normal-quotes
  concept: js.str.template-literal
  title: 따옴표 문자열 안에서도 ${...}가 값으로 바뀐다고 생각함
  statement: console.log("안녕, ${name}")처럼 큰따옴표나 작은따옴표 문자열 안에 ${name}을 쓰면 name의 값이 들어간다고 생각한다.
  reality: ${...}가 값으로 바뀌는 것은 백틱(`)으로 감싼 템플릿 리터럴 안에서뿐이다. 따옴표 문자열 안에서는 $, {, }도 그냥 글자라서 ${name}이 글자 그대로 출력된다.
  remediation:
    lessonSection: js-basics.strings.string-basics#pitfalls
    exercises: [js-basics.strings.string-basics.predict-template-quotes, js-basics.strings.string-basics.fix-template-quotes]

- id: js.mc.template-missing-braces
  concept: js.str.template-literal
  title: 템플릿 리터럴에서 중괄호 없이 $이름만 써도 된다고 생각함
  statement: '백틱 문자열 안에 `합계: $total원`처럼 $ 뒤에 변수 이름만 쓰면 값이 들어간다고 생각한다.'
  reality: 값을 끼워 넣으려면 반드시 ${ }로 감싸야 한다. $total처럼 중괄호가 없으면 $와 total은 그냥 글자다. 중괄호 안에는 변수뿐 아니라 price * qty 같은 식도 쓸 수 있다.
  remediation:
    lessonSection: js-basics.strings.string-basics#pitfalls
    exercises: [js-basics.strings.string-basics.mcq-template-syntax, js-basics.strings.string-basics.parsons-receipt]

# ── 모듈 7. string-methods ──

- id: js.mc.indexof-as-boolean
  concept: js.str.search
  title: indexOf 결과를 참·거짓처럼 쓸 수 있다고 생각함
  statement: indexOf는 찾으면 true, 못 찾으면 false나 0을 돌려준다고 생각해서 if (str.indexOf("@"))처럼 결과를 그대로 조건에 쓴다.
  reality: indexOf는 찾은 위치(0 이상의 인덱스)를, 못 찾으면 -1을 돌려준다. -1은 truthy라서 못 찾았는데도 if 블록이 실행되고, 맨 앞(인덱스 0)에서 찾으면 0이 falsy라서 찾았는데도 실행되지 않는다. 있는지만 알고 싶으면 includes를 쓰거나 indexOf(...) !== -1로 비교한다.
  remediation:
    lessonSection: js-basics.strings.string-methods#pitfalls
    exercises: [js-basics.strings.string-methods.mcq-indexof-not-found, js-basics.strings.string-methods.find-bug-indexof-if]

- id: js.mc.includes-ignores-case
  concept: js.str.search
  title: 찾기 메서드가 대소문자를 구별하지 않는다고 생각함
  statement: '"Hello World".includes("world")처럼 대소문자만 다른 글자도 찾아 준다고 생각한다.'
  reality: includes·indexOf·startsWith·endsWith는 모두 대문자와 소문자를 다른 글자로 본다. 대소문자와 관계없이 찾으려면 양쪽을 toLowerCase()로 맞춘 뒤 찾는다.
  remediation:
    lessonSection: js-basics.strings.string-methods#pitfalls
    exercises: [js-basics.strings.string-methods.predict-search-results]

- id: js.mc.slice-end-inclusive
  concept: js.str.slice
  title: slice의 끝 인덱스 글자도 포함된다고 생각함
  statement: '"abcdefg".slice(2, 4)가 인덱스 2, 3, 4의 글자인 "cde"를 돌려준다고 생각한다.'
  reality: slice는 끝 인덱스 바로 앞까지만 자른다. slice(2, 4)는 인덱스 2와 3인 "cd"다. 그래서 끝 - 시작이 잘라 낸 글자 수가 된다.
  remediation:
    lessonSection: js-basics.strings.string-methods#pitfalls
    exercises: [js-basics.strings.string-methods.mcq-slice-range, js-basics.strings.string-methods.multi-slice-world, js-basics.strings.string-methods.fix-format-date]

- id: js.mc.slice-second-arg-length
  concept: js.str.slice
  title: slice의 두 번째 값이 잘라 낼 글자 수라고 생각함
  statement: str.slice(2, 4)를 "인덱스 2부터 4글자"로 읽는다고 생각한다.
  reality: 두 번째 값은 글자 수가 아니라 끝 위치(인덱스)다. 2부터 4글자를 원하면 slice(2, 2 + 4)처럼 끝 위치를 계산한다. 두 번째 값이 시작보다 작거나 같으면 빈 문자열이 나온다.
  remediation:
    lessonSection: js-basics.strings.string-methods#pitfalls
    exercises: [js-basics.strings.string-methods.mcq-slice-range, js-basics.strings.string-methods.multi-slice-world]

- id: js.mc.slice-negative-invalid
  concept: js.str.slice
  title: slice에 음수를 넣으면 오류나 빈 문자열이 된다고 생각함
  statement: 인덱스는 0부터라서 slice(-4)처럼 음수를 넣으면 오류가 나거나 빈 문자열이 나온다고 생각한다.
  reality: slice의 음수는 뒤에서부터 센 위치다. -1은 마지막 글자, slice(-4)는 뒤에서 4글자다. 길이가 달라도 끝부분을 자를 수 있어 편리하다. 단, str[-1]처럼 대괄호 인덱스에 음수를 쓰면 undefined다.
  remediation:
    lessonSection: js-basics.strings.string-methods#pitfalls
    exercises: [js-basics.strings.string-methods.predict-phone-slice, js-basics.strings.string-methods.fill-last-four]

- id: js.mc.string-method-mutates
  concept: js.str.case-trim
  title: 문자열 메서드가 원래 문자열을 바꾼다고 생각함
  statement: name.toUpperCase();나 input.trim();만 실행하면 name과 input 안의 글자가 바뀐다고 생각한다.
  reality: 문자열은 바꿀 수 없으므로 문자열 메서드는 모두 결과를 새 문자열로 돌려줄 뿐이다. 돌려받은 값을 name = name.toUpperCase();처럼 변수에 담거나 바로 써야 한다. 담지 않으면 결과는 버려진다.
  remediation:
    lessonSection: js-basics.strings.string-methods#pitfalls
    exercises: [js-basics.strings.string-methods.tf-method-mutates, js-basics.strings.string-methods.fix-admin-login, js-basics.strings.string-methods.predict-clean-chain]

- id: js.mc.trim-removes-all-spaces
  concept: js.str.case-trim
  title: trim이 가운데 공백까지 모두 지운다고 생각함
  statement: '"  Hello   World  ".trim()이 공백을 모두 지운 "HelloWorld"가 된다고 생각한다.'
  reality: trim은 앞과 뒤의 공백만 지운다. 글자 사이의 공백은 그대로라서 결과는 "Hello   World"다.
  remediation:
    lessonSection: js-basics.strings.string-methods#pitfalls
    exercises: [js-basics.strings.string-methods.mcq-trim-inner]

- id: js.mc.split-result-is-string
  concept: js.str.split-join
  title: split의 결과가 문자열이라고 생각함
  statement: str.split(",")의 결과도 문자열이라서, 결과에 toUpperCase() 같은 문자열 메서드를 바로 쓸 수 있고 length는 글자 수라고 생각한다.
  reality: split은 조각들을 담은 목록(배열)을 돌려준다. 결과의 length는 조각 수이고, 배열에는 toUpperCase가 없어 TypeError(... is not a function)가 난다. 조각 하나는 [0]처럼 인덱스로 꺼내 쓰고, 다시 문자열로 만들려면 join을 쓴다.
  remediation:
    lessonSection: js-basics.strings.string-methods#pitfalls
    exercises: [js-basics.strings.string-methods.mcq-split-count, js-basics.strings.string-methods.fix-split-uppercase]

- id: js.mc.join-default-no-separator
  concept: js.str.split-join
  title: join()이 구분자 없이 이어 붙인다고 생각함
  statement: 목록.join()처럼 괄호를 비우면 조각을 사이에 아무것도 넣지 않고 이어 붙인다고 생각한다.
  reality: join의 구분자를 생략하면 쉼표(,)로 잇는다. 아무것도 넣지 않고 이으려면 join("")처럼 빈 문자열을 구분자로 준다.
  remediation:
    lessonSection: js-basics.strings.string-methods#pitfalls
    exercises: [js-basics.strings.string-methods.parsons-hashtags, js-basics.strings.string-methods.predict-clean-chain]

# ── 모듈 8. array-basics ──

- id: js.mc.array-out-of-range-throws
  concept: js.arr.literal-index
  title: 범위 밖 인덱스를 읽으면 오류가 난다고 생각함
  statement: '요소가 3개인 배열 arr에서 arr[5]를 읽으면 오류가 나서 프로그램이 멈춘다고 생각한다.'
  reality: '범위 밖 인덱스를 읽으면 오류 없이 undefined가 나온다. 그래서 인덱스를 잘못 계산해도 프로그램은 계속 실행되고, 나중에 undefined 때문에 엉뚱한 결과나 다른 오류가 생긴다.'
  remediation:
    lessonSection: js-basics.arrays.array-basics#pitfalls
    exercises: [js-basics.arrays.array-basics.tf-out-of-range, js-basics.arrays.array-basics.predict-read-elements, js-basics.arrays.array-basics.impl-menu-at]

- id: js.mc.array-negative-index-last
  concept: js.arr.literal-index
  title: arr[-1]이 마지막 요소라고 생각함
  statement: 'arr[-1]처럼 음수 인덱스를 쓰면 뒤에서부터 세어 마지막 요소를 읽는다고 생각한다.'
  reality: '대괄호 인덱스에 음수를 쓰면 그런 인덱스의 요소가 없으므로 undefined다. 마지막 요소는 arr[arr.length - 1]로 읽는다. 음수가 뒤에서부터 센 위치가 되는 것은 slice 같은 메서드 안에서다.'
  remediation:
    lessonSection: js-basics.arrays.array-basics#pitfalls
    exercises: [js-basics.arrays.array-basics.find-bug-negative-index, js-basics.arrays.array-basics.mcq-last-element, js-basics.arrays.array-basics.fix-update-latest]

- id: js.mc.array-same-type-only
  concept: js.arr.literal-index
  title: 배열에는 같은 자료형만 담을 수 있다고 생각함
  statement: '배열 하나에는 숫자만, 또는 문자열만 담을 수 있고 [1, "둘", true]처럼 섞으면 오류가 난다고 생각한다.'
  reality: 'JavaScript 배열은 어떤 값이든 섞어 담을 수 있다. 다만 같은 종류의 값을 담아야 반복으로 같은 처리를 하기 쉬워서 보통 한 종류만 담는다.'
  remediation:
    lessonSection: js-basics.arrays.array-basics#pitfalls
    exercises: [js-basics.arrays.array-basics.multi-array-facts, js-basics.arrays.array-basics.predict-read-elements]

- id: js.mc.array-last-index-is-length
  concept: js.arr.length
  title: 마지막 인덱스가 length라고 생각함
  statement: '요소가 4개인 배열의 마지막 요소를 arr[arr.length]나 arr[4]로 읽는다고 생각한다.'
  reality: '인덱스는 0부터 시작하므로 마지막 인덱스는 length - 1이다. arr[arr.length]는 범위 밖이라 undefined다.'
  remediation:
    lessonSection: js-basics.arrays.array-basics#pitfalls
    exercises: [js-basics.arrays.array-basics.mcq-last-element, js-basics.arrays.array-basics.fix-cart-total, js-basics.arrays.array-basics.parsons-average]

- id: js.mc.array-length-counts-filled
  concept: js.arr.length
  title: length가 실제로 값을 넣은 칸의 개수라고 생각함
  statement: '요소가 3개인 배열에 arr[9] = 1을 대입하면 length가 4가 된다고 생각한다.'
  reality: 'length는 가장 큰 인덱스 + 1이다. arr[9]에 대입하면 length는 10이 되고, 값을 넣지 않은 3~8번 칸은 비어 있어 읽으면 undefined다. 그래서 끝에 넣을 때는 인덱스를 직접 정하지 말고 push를 쓴다.'
  remediation:
    lessonSection: js-basics.arrays.array-basics#pitfalls
    exercises: [js-basics.arrays.array-basics.predict-length-gap, js-basics.arrays.array-basics.tf-length-gap]

- id: js.mc.array-immutable-like-string
  concept: js.arr.element-update
  title: 배열 요소도 문자열 글자처럼 바꿀 수 없다고 생각함
  statement: '문자열에서 str[0] = "A"가 안 되었으니, 배열도 arr[0] = 10으로 요소를 바꿀 수 없다고 생각한다. 또는 const로 만든 배열은 요소도 바꿀 수 없다고 생각한다.'
  reality: '배열은 바꿀 수 있는 값이라 arr[0] = 10으로 그 자리의 요소가 바뀐다. const는 변수에 다른 값을 다시 대입하는 것만 막으므로, const로 만든 배열도 요소는 바꿀 수 있다.'
  remediation:
    lessonSection: js-basics.arrays.array-basics#pitfalls
    exercises: [js-basics.arrays.array-basics.mcq-const-update, js-basics.arrays.array-basics.fix-capitalize, js-basics.arrays.array-basics.impl-cap-scores]

# ── 모듈 8. array-mutation ──

- id: js.mc.push-returns-new-array
  concept: js.arr.push-pop
  title: push가 값을 넣은 새 배열을 돌려준다고 생각함
  statement: 'const more = arr.push(4);처럼 쓰면 more에 4가 추가된 배열이 들어가고, arr = arr.push(4);로 배열을 갱신해야 한다고 생각한다.'
  reality: 'push는 원래 배열 끝에 값을 넣고 새 길이(숫자)를 돌려준다. 결과를 arr에 다시 대입하면 arr이 숫자가 되어 버린다. push는 결과를 담지 않고 arr.push(4);처럼 한 줄로 쓴다.'
  remediation:
    lessonSection: js-basics.arrays.array-mutation#pitfalls
    exercises: [js-basics.arrays.array-mutation.mcq-push-returns, js-basics.arrays.array-mutation.fix-push-reassign, js-basics.arrays.array-mutation.impl-countdown-list]

- id: js.mc.pop-removes-given-value
  concept: js.arr.push-pop
  title: pop(값)이 그 값을 지운다고 생각함
  statement: 'arr.pop("우유")처럼 인수를 넘기면 배열에서 "우유"를 찾아 지운다고 생각한다.'
  reality: 'pop은 인수를 받지 않고 항상 마지막 요소를 지운다. 넘긴 인수는 무시된다. 특정 값을 지우려면 indexOf로 위치를 찾아 splice(위치, 1)로 지운다.'
  remediation:
    lessonSection: js-basics.arrays.array-mutation#pitfalls
    exercises: [js-basics.arrays.array-mutation.tf-pop-argument, js-basics.arrays.array-mutation.impl-order-commands]

- id: js.mc.pop-returns-rest
  concept: js.arr.push-pop
  title: pop이 남은 배열을 돌려준다고 생각함
  statement: 'const rest = arr.pop();이면 rest에 마지막 요소가 빠진 나머지 배열이 들어간다고 생각한다.'
  reality: 'pop은 꺼낸 마지막 요소 하나를 돌려준다. 나머지는 원래 배열 arr에 그대로 남는다. 빈 배열에서 pop하면 undefined를 돌려준다.'
  remediation:
    lessonSection: js-basics.arrays.array-mutation#pitfalls
    exercises: [js-basics.arrays.array-mutation.predict-push-pop]

- id: js.mc.shift-unshift-swapped
  concept: js.arr.shift-unshift
  title: shift와 unshift의 방향을 반대로 기억함
  statement: 'shift(값)이 맨 앞에 값을 넣고, unshift()가 맨 앞 요소를 꺼낸다고 생각한다.'
  reality: 'unshift(값)이 맨 앞에 넣고 새 길이를 돌려주며, shift()가 맨 앞 요소를 꺼내 돌려준다. push와 짝인 pop처럼, 이름이 긴 unshift가 넣는 쪽이다.'
  remediation:
    lessonSection: js-basics.arrays.array-mutation#pitfalls
    exercises: [js-basics.arrays.array-mutation.mcq-shift-unshift, js-basics.arrays.array-mutation.parsons-waiting-line, js-basics.arrays.array-mutation.fix-queue-pop, js-basics.arrays.array-mutation.fix-recent-first]

- id: js.mc.splice-slice-same
  concept: js.arr.splice
  title: splice와 slice를 같은 메서드로 생각함
  statement: 'arr.splice(1, 2)와 arr.slice(1, 2)가 같은 일을 하고, 둘 다 원래 배열을 그대로 둔다고 생각한다.'
  reality: 'splice는 원래 배열에서 요소를 지우고(넣고) 지운 요소들을 돌려준다. slice는 원래 배열을 그대로 두고 일부를 복사한 새 배열을 돌려준다. 두 번째 인수도 splice는 지울 개수, slice는 끝 인덱스로 뜻이 다르다.'
  remediation:
    lessonSection: js-basics.arrays.array-mutation#pitfalls
    exercises: [js-basics.arrays.array-mutation.find-bug-slice-remove, js-basics.arrays.array-mutation.multi-mutating-methods]

- id: js.mc.splice-second-arg-end
  concept: js.arr.splice
  title: splice의 두 번째 인수가 끝 인덱스라고 생각함
  statement: 'arr.splice(2, 4)가 2번부터 4번 앞까지(2개)를 지운다고 생각한다.'
  reality: 'splice의 두 번째 인수는 지울 개수다. splice(2, 4)는 2번부터 4개를 지운다. 끝 인덱스를 받는 slice와 헷갈리기 쉽다.'
  remediation:
    lessonSection: js-basics.arrays.array-mutation#pitfalls
    exercises: [js-basics.arrays.array-mutation.mcq-splice-count, js-basics.arrays.array-mutation.fill-insert-splice, js-basics.arrays.array-mutation.predict-splice-steps]

- id: js.mc.mutating-method-keeps-original
  concept: js.arr.mutating-vs-not
  title: 배열을 바꾸는 메서드도 원본을 그대로 둔다고 생각함
  statement: '문자열 메서드처럼 push·pop·splice도 원래 배열은 그대로 두고 바뀐 결과를 돌려준다고 생각해서, 원본을 다시 써도 처음 값이 들어 있다고 생각한다.'
  reality: '배열은 바꿀 수 있는 값이라 push·pop·shift·unshift·splice·sort는 원래 배열을 직접 바꾼다. 메서드를 부른 뒤 원본을 읽으면 바뀐 내용이 보인다.'
  remediation:
    lessonSection: js-basics.arrays.array-mutation#pitfalls
    exercises: [js-basics.arrays.array-mutation.tf-push-new-array, js-basics.arrays.array-mutation.fix-total-empties, js-basics.arrays.array-mutation.predict-push-pop]

- id: js.mc.non-mutating-method-changes-original
  concept: js.arr.mutating-vs-not
  title: 바꾸지 않는 메서드도 원본을 바꾼다고 생각함
  statement: 'arr.slice(0, 2)나 arr.concat([4])나 arr.map(...)을 부르기만 하면 arr이 그 결과로 바뀐다고 생각한다.'
  reality: 'slice·concat·join·map·filter는 원래 배열을 바꾸지 않고 결과를 새 값으로 돌려준다. 결과를 쓰려면 변수에 담거나 바로 써야 한다. 담지 않으면 결과는 버려진다.'
  remediation:
    lessonSection: js-basics.arrays.array-mutation#pitfalls
    exercises: [js-basics.arrays.array-mutation.multi-mutating-methods, js-basics.arrays.array-mutation.fix-join-discarded]

- id: js.mc.function-arg-array-copied
  concept: js.arr.mutating-vs-not
  title: 함수에 넘긴 배열은 복사본이라 함수 안에서 바꿔도 밖은 그대로라고 생각함
  statement: '함수에 배열을 인수로 넘기면 복사본이 넘어가서, 함수 안에서 push나 sort를 해도 바깥 배열은 바뀌지 않는다고 생각한다.'
  reality: '배열을 넘기면 같은 배열이 넘어간다. 함수 안에서 push·splice·sort처럼 배열을 바꾸는 메서드를 쓰면 바깥 배열도 바뀐다. 입력을 지키려면 slice()로 복사하거나 map·filter처럼 새 배열을 만드는 메서드를 쓴다(자세한 원리는 모듈 9에서 배운다).'
  remediation:
    lessonSection: js-basics.arrays.array-mutation#pitfalls
    exercises: [js-basics.arrays.array-mutation.predict-function-arg, js-basics.arrays.array-mutation.fix-total-empties, js-basics.arrays.array-mutation.impl-without-last]

# ── 모듈 8. array-iteration ──

- id: js.mc.for-in-array-values
  concept: js.arr.for-of
  title: for...in으로 배열의 값을 순회할 수 있다고 생각함
  statement: 'for (const x in arr)를 쓰면 x에 배열의 요소가 차례로 들어온다고 생각한다.'
  reality: 'for...in은 요소가 아니라 인덱스를 문자열("0", "1", ...)로 꺼낸다. 그래서 x * 2나 x + 1이 엉뚱한 값이 된다. 배열의 값은 for...of로 꺼낸다.'
  remediation:
    lessonSection: js-basics.arrays.array-iteration#pitfalls
    exercises: [js-basics.arrays.array-iteration.tf-for-in-values, js-basics.arrays.array-iteration.predict-for-in-index, js-basics.arrays.array-iteration.fix-for-in-total]

- id: js.mc.for-of-gives-index
  concept: js.arr.for-of
  title: for...of의 변수에 인덱스가 들어온다고 생각함
  statement: 'for (const i of arr)에서 i가 0, 1, 2처럼 인덱스이고, 요소는 arr[i]로 읽어야 한다고 생각한다.'
  reality: 'for...of의 변수에는 요소 자체가 들어온다. arr[i]로 읽으면 요소를 인덱스로 써서 엉뚱한 값(대개 undefined)이 나온다. 인덱스가 필요하면 for (let i = 0; i < arr.length; i++)를 쓴다.'
  remediation:
    lessonSection: js-basics.arrays.array-iteration#pitfalls
    exercises: [js-basics.arrays.array-iteration.mcq-for-of-element, js-basics.arrays.array-iteration.impl-first-over-index]

- id: js.mc.for-of-var-updates-array
  concept: js.arr.for-of
  title: for...of의 변수에 대입하면 배열 요소가 바뀐다고 생각함
  statement: 'for (let n of nums) { n = n * 2; }을 실행하면 nums의 요소가 모두 두 배가 된다고 생각한다.'
  reality: 'for...of의 변수는 요소의 값을 담은 별도의 변수다. 그 변수에 다른 값을 대입해도 배열은 그대로다. 요소를 바꾸려면 인덱스로 nums[i] = ...처럼 대입하거나, map으로 새 배열을 만든다.'
  remediation:
    lessonSection: js-basics.arrays.array-iteration#pitfalls
    exercises: [js-basics.arrays.array-iteration.find-bug-loop-var-assign]

- id: js.mc.foreach-return-stops
  concept: js.arr.foreach
  title: forEach 콜백에서 return하면 반복이 멈춘다고 생각함
  statement: 'forEach 콜백 안에서 원하는 값을 찾았을 때 return하면 forEach가 멈추고, 그 값이 바깥 함수의 반환값이 된다고 생각한다.'
  reality: '콜백 안의 return은 그 요소에 대한 콜백 한 번만 끝낸다. forEach는 다음 요소로 계속 진행하고, 바깥 함수는 끝나지 않는다. 중간에 멈춰야 하면 for...of와 break(또는 return)를 쓰거나 find·some을 쓴다.'
  remediation:
    lessonSection: js-basics.arrays.array-iteration#pitfalls
    exercises: [js-basics.arrays.array-iteration.predict-foreach-return, js-basics.arrays.array-iteration.fix-has-negative, js-basics.arrays.array-iteration.multi-foreach-facts]

- id: js.mc.foreach-returns-array
  concept: js.arr.foreach
  title: forEach가 결과 배열을 돌려준다고 생각함
  statement: 'const doubled = nums.forEach((n) => n * 2);처럼 쓰면 doubled에 두 배가 된 배열이 들어간다고 생각한다.'
  reality: 'forEach는 콜백을 불러 주기만 하고 항상 undefined를 돌려준다. 콜백의 반환값도 버린다. 바꾼 값으로 새 배열을 만들려면 map을 쓴다.'
  remediation:
    lessonSection: js-basics.arrays.array-iteration#pitfalls
    exercises: [js-basics.arrays.array-iteration.mcq-foreach-return-value, js-basics.arrays.array-iteration.fix-make-labels]

# ── 모듈 8. array-hof ──

- id: js.mc.map-mutates-original
  concept: js.arr.map
  title: map이 원래 배열을 바꾼다고 생각함
  statement: 'nums.map((n) => n * 2);만 실행하면 nums의 요소가 두 배로 바뀐다고 생각한다.'
  reality: 'map은 콜백의 반환값으로 새 배열을 만들어 돌려주고, 원래 배열은 그대로 둔다. 결과를 쓰려면 const doubled = nums.map(...)처럼 변수에 담는다.'
  remediation:
    lessonSection: js-basics.arrays.array-hof#pitfalls
    exercises: [js-basics.arrays.array-hof.predict-map-original, js-basics.arrays.array-hof.impl-price-labels, js-basics.arrays.array-hof.multi-map-facts]

- id: js.mc.map-callback-no-return
  concept: js.arr.map
  title: map 콜백에 중괄호를 쓰고 return을 빠뜨려도 값이 담긴다고 생각함
  statement: 'nums.map((n) => { n * 2; })처럼 중괄호 본문에 return 없이 식만 써도 두 배가 된 배열이 나온다고 생각한다.'
  reality: '화살표 함수에 중괄호를 쓰면 return을 써야 값을 돌려준다. return이 없으면 콜백은 undefined를 돌려주므로 결과는 [undefined, undefined, ...]다. 중괄호를 빼고 (n) => n * 2로 쓰거나 return을 쓴다.'
  remediation:
    lessonSection: js-basics.arrays.array-hof#pitfalls
    exercises: [js-basics.arrays.array-hof.fix-map-no-return, js-basics.arrays.array-hof.multi-map-facts, js-basics.arrays.array-hof.mcq-chain-which]

- id: js.mc.map-can-skip-items
  concept: js.arr.map
  title: map으로 일부 요소를 빼고 새 배열을 만들 수 있다고 생각함
  statement: 'map 콜백에서 조건에 맞지 않는 요소는 아무것도 돌려주지 않으면 그 요소가 결과 배열에서 빠진다고 생각한다.'
  reality: 'map의 결과는 항상 원래 배열과 길이가 같다. 아무것도 돌려주지 않은 자리는 undefined로 채워진다. 요소를 고르려면 filter를 쓰고, 고른 뒤 바꾸려면 filter 다음에 map을 잇는다.'
  remediation:
    lessonSection: js-basics.arrays.array-hof#pitfalls
    exercises: [js-basics.arrays.array-hof.tf-map-skip, js-basics.arrays.array-hof.multi-map-facts]

- id: js.mc.filter-removes-matching
  concept: js.arr.filter
  title: filter가 조건에 맞는 요소를 지운다고 생각함
  statement: 'nums.filter((n) => n > 10)이 10보다 큰 수를 걸러 내서(지워서) 10 이하인 수만 남긴다고 생각한다.'
  reality: 'filter는 콜백이 참을 돌려준 요소를 남긴다(고른다). n > 10이면 10보다 큰 수만 담긴 새 배열이 된다. 빼고 싶은 조건이 있으면 그 반대 조건을 콜백에 쓴다.'
  remediation:
    lessonSection: js-basics.arrays.array-hof#pitfalls
    exercises: [js-basics.arrays.array-hof.mcq-filter-keeps, js-basics.arrays.array-hof.fix-filter-reversed, js-basics.arrays.array-hof.impl-passed-scores]

- id: js.mc.filter-returns-first
  concept: js.arr.filter
  title: filter가 조건에 맞는 첫 요소 하나를 돌려준다고 생각함
  statement: '조건에 맞는 요소가 하나뿐이면 filter가 그 요소 자체(예: 7)를 돌려준다고 생각한다.'
  reality: 'filter는 항상 배열을 돌려준다. 맞는 요소가 하나면 [7]처럼 요소 하나짜리 배열이다. 요소 하나가 필요하면 find를 쓰거나 결과의 [0]을 읽는다.'
  remediation:
    lessonSection: js-basics.arrays.array-hof#pitfalls
    exercises: [js-basics.arrays.array-hof.mcq-filter-keeps, js-basics.arrays.array-hof.predict-filter-one-none]

- id: js.mc.filter-empty-is-undefined
  concept: js.arr.filter
  title: 조건에 맞는 요소가 없으면 filter가 undefined나 null을 돌려준다고 생각함
  statement: 'filter로 고를 요소가 하나도 없으면 결과가 undefined나 null이라서 if (result)로 찾았는지 확인할 수 있다고 생각한다.'
  reality: '고를 요소가 없으면 빈 배열 []을 돌려준다. 빈 배열은 truthy라서 if (result)는 항상 참이다. 결과가 있는지는 result.length > 0으로 확인한다.'
  remediation:
    lessonSection: js-basics.arrays.array-hof#pitfalls
    exercises: [js-basics.arrays.array-hof.predict-filter-one-none, js-basics.arrays.array-hof.find-bug-filter-empty-check]

- id: js.mc.find-returns-all
  concept: js.arr.find
  title: find가 조건에 맞는 요소를 모두 돌려준다고 생각함
  statement: 'nums.find((n) => n > 10)이 10보다 큰 수를 모두 담은 배열을 돌려준다고 생각한다.'
  reality: 'find는 조건에 맞는 첫 번째 요소 하나만 돌려주고, 찾자마자 멈춘다. 맞는 요소를 모두 원하면 filter를 쓴다.'
  remediation:
    lessonSection: js-basics.arrays.array-hof#pitfalls
    exercises: [js-basics.arrays.array-hof.mcq-find-not-found, js-basics.arrays.array-hof.predict-find-vs-filter]

- id: js.mc.find-not-found-minus-one
  concept: js.arr.find
  title: find가 못 찾으면 -1을 돌려준다고 생각함
  statement: 'indexOf처럼 find도 못 찾으면 -1을 돌려준다고 생각해서 if (found !== -1)로 확인한다.'
  reality: 'find는 못 찾으면 undefined를 돌려준다. -1을 돌려주는 것은 인덱스를 찾는 indexOf와 findIndex다. find의 결과는 found !== undefined로 확인한다.'
  remediation:
    lessonSection: js-basics.arrays.array-hof#pitfalls
    exercises: [js-basics.arrays.array-hof.mcq-find-not-found, js-basics.arrays.array-hof.fix-find-minus-one, js-basics.arrays.array-hof.impl-first-vip]

- id: js.mc.every-empty-false
  concept: js.arr.some-every
  title: 빈 배열의 every가 false라고 생각함
  statement: '[].every((n) => n > 0)은 확인할 요소가 없으니 false라고 생각한다.'
  reality: 'every는 조건에 맞지 않는 요소를 하나라도 찾으면 false다. 빈 배열에는 그런 요소가 없으므로 true다. 반대로 some은 맞는 요소를 찾지 못하므로 빈 배열에서 false다. 빈 배열이 따로 의미가 있으면 length를 먼저 확인한다.'
  remediation:
    lessonSection: js-basics.arrays.array-hof#pitfalls
    exercises: [js-basics.arrays.array-hof.tf-every-empty, js-basics.arrays.array-hof.predict-some-every-stop, js-basics.arrays.array-hof.impl-all-passed]

- id: js.mc.some-returns-element
  concept: js.arr.some-every
  title: some이 조건에 맞는 요소를 돌려준다고 생각함
  statement: 'nums.some((n) => n < 0)이 처음 찾은 음수를 돌려준다고 생각한다.'
  reality: 'some과 every는 항상 true나 false만 돌려준다. 찾은 요소가 필요하면 find를 쓴다.'
  remediation:
    lessonSection: js-basics.arrays.array-hof#pitfalls
    exercises: [js-basics.arrays.array-hof.mcq-some-returns, js-basics.arrays.array-hof.predict-some-every-stop]

- id: js.mc.reduce-initial-optional-safe
  concept: js.arr.reduce
  title: reduce의 초기값을 생략해도 결과가 늘 같다고 생각함
  statement: 'nums.reduce((acc, n) => acc + n)처럼 초기값을 빼도 0부터 시작하는 것과 늘 같다고 생각한다.'
  reality: '초기값을 생략하면 첫 요소가 초기값이 되고 두 번째 요소부터 콜백이 불린다. 그래서 빈 배열에서는 TypeError(Reduce of empty array with no initial value)가 나고, 첫 요소를 가공하는 콜백(예: acc + n * 2)은 첫 요소만 가공되지 않은 엉뚱한 결과를 낸다. 초기값은 항상 적는다.'
  remediation:
    lessonSection: js-basics.arrays.array-hof#pitfalls
    exercises: [js-basics.arrays.array-hof.multi-reduce-initial, js-basics.arrays.array-hof.fill-reduce-total, js-basics.arrays.array-hof.impl-best-day]

- id: js.mc.reduce-callback-no-return
  concept: js.arr.reduce
  title: reduce 콜백이 누적값을 return하지 않아도 된다고 생각함
  statement: 'reduce 콜백 안에서 acc + n을 계산하거나 acc에 대입만 하면, 누적값이 알아서 다음 요소로 이어진다고 생각한다.'
  reality: 'reduce는 콜백이 돌려준 값을 다음 누적값으로 쓴다. 중괄호 본문에 return이 없으면 다음 acc는 undefined가 되고, 결과는 undefined나 NaN이 된다.'
  remediation:
    lessonSection: js-basics.arrays.array-hof#pitfalls
    exercises: [js-basics.arrays.array-hof.fix-reduce-no-return, js-basics.arrays.array-hof.parsons-count-long]

- id: js.mc.reduce-params-swapped
  concept: js.arr.reduce
  title: reduce 콜백의 매개변수 순서를 (요소, 누적값)으로 생각함
  statement: 'reduce((n, total) => ...)처럼 첫 번째 매개변수가 현재 요소, 두 번째가 누적값이라고 생각한다.'
  reality: 'reduce 콜백의 첫 번째 매개변수가 누적값, 두 번째가 현재 요소다. 이름은 마음대로 지을 수 있지만 순서가 뜻을 정하므로 (acc, item)처럼 순서에 맞는 이름을 쓴다.'
  remediation:
    lessonSection: js-basics.arrays.array-hof#pitfalls
    exercises: [js-basics.arrays.array-hof.mcq-reduce-params, js-basics.arrays.array-hof.parsons-count-long]

- id: js.mc.chain-order-irrelevant
  concept: js.arr.chaining
  title: 이어 쓴 메서드의 순서를 바꿔도 결과가 같다고 생각함
  statement: 'nums.map((n) => n * 2).filter((n) => n > 5)와 nums.filter((n) => n > 5).map((n) => n * 2)가 늘 같은 결과라고 생각한다.'
  reality: '이어 쓴 메서드는 왼쪽부터 차례로 실행되고, 뒤 메서드는 앞 메서드가 돌려준 배열을 받는다. map 뒤의 filter는 바뀐 값으로 조건을 검사하므로 순서를 바꾸면 결과가 달라질 수 있다.'
  remediation:
    lessonSection: js-basics.arrays.array-hof#pitfalls
    exercises: [js-basics.arrays.array-hof.predict-chain-order, js-basics.arrays.array-hof.impl-coupon-sum, js-basics.arrays.array-hof.mcq-chain-which]

- id: js.mc.chain-after-foreach
  concept: js.arr.chaining
  title: forEach 뒤에도 메서드를 이어 쓸 수 있다고 생각함
  statement: 'nums.forEach(...).filter(...)처럼 forEach 뒤에도 배열 메서드를 이어 쓸 수 있다고 생각한다.'
  reality: 'forEach는 undefined를 돌려주므로 뒤에 메서드를 이으면 TypeError(Cannot read properties of undefined)가 난다. 이어 쓸 수 있는 것은 새 배열을 돌려주는 map·filter·slice 같은 메서드다.'
  remediation:
    lessonSection: js-basics.arrays.array-hof#pitfalls
    exercises: [js-basics.arrays.array-hof.find-bug-foreach-chain, js-basics.arrays.array-hof.mcq-chain-which]

# ── 모듈 8. array-search-sort ──

- id: js.mc.array-includes-partial
  concept: js.arr.includes-indexof
  title: 배열의 includes가 요소의 일부 글자도 찾는다고 생각함
  statement: '["apple", "banana"].includes("app")가 "apple"에 "app"이 들어 있으니 true라고 생각한다.'
  reality: '배열의 includes와 indexOf는 요소 전체가 찾는 값과 같은지 본다. "app"이라는 요소가 없으므로 false다. 글자 일부를 찾는 것은 문자열의 includes다. 요소 안의 글자를 찾으려면 some((s) => s.includes("app"))처럼 쓴다.'
  remediation:
    lessonSection: js-basics.arrays.array-search-sort#pitfalls
    exercises: [js-basics.arrays.array-search-sort.mcq-includes-whole-element, js-basics.arrays.array-search-sort.predict-search-values, js-basics.arrays.array-search-sort.impl-missing-items]

- id: js.mc.includes-loose-match
  concept: js.arr.includes-indexof
  title: includes가 자료형이 달라도 같은 값으로 본다고 생각함
  statement: '[1, 2, 3].includes("2")가 true라고 생각한다.'
  reality: 'includes와 indexOf는 ===처럼 자료형까지 같아야 같은 요소로 본다. 문자열 "2"와 숫자 2는 다르므로 false(indexOf는 -1)다. 입력이 문자열이면 Number()로 바꾼 뒤 찾는다.'
  remediation:
    lessonSection: js-basics.arrays.array-search-sort#pitfalls
    exercises: [js-basics.arrays.array-search-sort.predict-search-values, js-basics.arrays.array-search-sort.fix-seat-number-type]

- id: js.mc.sort-numeric-default
  concept: js.arr.sort
  title: sort()가 숫자를 크기 순으로 정렬한다고 생각함
  statement: '[10, 9, 1, 100].sort()의 결과가 [1, 9, 10, 100]이라고 생각한다.'
  reality: '비교 함수 없이 부른 sort는 요소를 문자열로 바꿔 사전순으로 비교한다. 그래서 결과는 [1, 10, 100, 9]다. 숫자를 크기 순으로 정렬하려면 sort((a, b) => a - b)를 쓴다.'
  remediation:
    lessonSection: js-basics.arrays.array-search-sort#pitfalls
    exercises: [js-basics.arrays.array-search-sort.mcq-default-sort, js-basics.arrays.array-search-sort.fix-price-sort, js-basics.arrays.array-search-sort.fix-median]

- id: js.mc.sort-returns-new-array
  concept: js.arr.sort
  title: sort가 정렬된 새 배열을 돌려주고 원본은 그대로라고 생각함
  statement: 'const sorted = arr.sort();를 실행해도 arr은 원래 순서 그대로라고 생각한다.'
  reality: 'sort는 원래 배열을 직접 정렬하고, 돌려주는 값도 같은 배열이다. sorted와 arr은 같은 배열이라 둘 다 정렬된 순서다. 원본을 지키려면 arr.slice().sort(...)처럼 복사한 뒤 정렬한다.'
  remediation:
    lessonSection: js-basics.arrays.array-search-sort#pitfalls
    exercises: [js-basics.arrays.array-search-sort.multi-sort-facts, js-basics.arrays.array-search-sort.predict-sort-same-array, js-basics.arrays.array-search-sort.impl-top-three]

- id: js.mc.sort-compare-boolean
  concept: js.arr.sort
  title: sort의 비교 함수가 true·false를 돌려주면 된다고 생각함
  statement: 'sort((a, b) => a > b)처럼 비교 결과(true·false)를 돌려주면 오름차순으로 정렬된다고 생각한다.'
  reality: '비교 함수는 a가 앞이면 음수, b가 앞이면 양수, 같으면 0을 돌려줘야 한다. true·false는 숫자 1·0으로 바뀌어 음수가 나오지 않으므로 정렬이 제대로 되지 않는다. 숫자는 a - b(오름차순)나 b - a(내림차순)를 돌려준다.'
  remediation:
    lessonSection: js-basics.arrays.array-search-sort#pitfalls
    exercises: [js-basics.arrays.array-search-sort.tf-compare-boolean, js-basics.arrays.array-search-sort.multi-sort-facts]

- id: js.mc.array-slice-mutates
  concept: js.arr.slice-concat
  title: 배열의 slice가 잘라 낸 부분을 원본에서 지운다고 생각함
  statement: 'arr.slice(0, 2)를 실행하면 앞의 두 요소가 arr에서 빠진다고 생각한다.'
  reality: 'slice는 일부를 복사한 새 배열을 돌려줄 뿐 원래 배열은 그대로다. 원본에서 지우는 것은 splice다.'
  remediation:
    lessonSection: js-basics.arrays.array-search-sort#pitfalls
    exercises: [js-basics.arrays.array-search-sort.predict-copy-or-change, js-basics.arrays.array-search-sort.impl-page, js-basics.arrays.array-search-sort.parsons-playlist]

- id: js.mc.concat-adds-nested
  concept: js.arr.slice-concat
  title: concat이 배열을 통째로 요소 하나로 넣는다고 생각함
  statement: '[1, 2].concat([3, 4])의 결과가 [1, 2, [3, 4]]처럼 배열이 요소 하나로 들어간 모양이라고 생각한다.'
  reality: 'concat은 넘긴 배열의 요소들을 풀어서 이어 붙여 [1, 2, 3, 4]를 만든다. 배열을 요소 하나로 넣는 것은 push([3, 4])다. concat은 원본을 바꾸지 않고 새 배열을 돌려준다.'
  remediation:
    lessonSection: js-basics.arrays.array-search-sort#pitfalls
    exercises: [js-basics.arrays.array-search-sort.mcq-concat-result, js-basics.arrays.array-search-sort.predict-copy-or-change]

# ── 모듈 9. object-basics ──

- id: js.mc.obj-access-by-index
  concept: js.obj.literal
  title: 객체 속성을 순서 번호로 읽으려 함
  statement: '객체도 배열처럼 obj[0]으로 첫 번째 속성을 읽을 수 있다고 생각한다.'
  reality: '객체의 속성은 순서 번호가 아니라 이름(키)으로 찾는다. obj[0]은 이름이 "0"인 속성을 찾으므로, 그런 속성이 없으면 undefined다.'
  remediation:
    lessonSection: js-basics.objects.object-basics#pitfalls
    exercises: [js-basics.objects.object-basics.mcq-index-access]

- id: js.mc.obj-property-semicolon
  concept: js.obj.literal
  title: 객체 리터럴의 속성을 세미콜론으로 나눔
  statement: '{ name: "민지"; age: 20 }처럼 문장을 끝낼 때처럼 속성 사이에 세미콜론을 쓴다고 생각한다.'
  reality: '객체 리터럴 안의 속성은 쉼표로 나눈다. 세미콜론을 쓰면 실행 전에 SyntaxError(Unexpected token '';'')가 나서 프로그램이 아예 시작되지 않는다.'
  remediation:
    lessonSection: js-basics.objects.object-basics#pitfalls
    exercises: [js-basics.objects.object-basics.mcq-literal-syntax, js-basics.objects.object-basics.fix-property-semicolon, js-basics.objects.object-basics.parsons-build-profile]

- id: js.mc.dot-with-variable-key
  concept: js.obj.dot-bracket
  title: obj.key와 obj[key]를 같은 것으로 봄
  statement: 'const key = "price";일 때 obj.key도 obj[key]처럼 price 속성을 읽는다고 생각한다.'
  reality: 'obj.key는 변수와 상관없이 이름이 "key"인 속성을 찾는다. 변수에 든 이름으로 찾으려면 obj[key]처럼 대괄호를 쓴다.'
  remediation:
    lessonSection: js-basics.objects.object-basics#pitfalls
    exercises: [js-basics.objects.object-basics.mcq-dot-variable-key, js-basics.objects.object-basics.find-bug-dot-variable, js-basics.objects.object-basics.impl-describe-field]

- id: js.mc.missing-property-error
  concept: js.obj.dot-bracket
  title: 없는 속성을 읽으면 오류가 난다고 생각함
  statement: '객체에 없는 속성을 읽으면 ReferenceError 같은 오류가 난다고 생각한다.'
  reality: '없는 속성을 읽으면 오류 없이 undefined가 나온다. 오류(TypeError)는 undefined나 null에서 다시 속성을 읽을 때, 예를 들어 obj.missing.name처럼 쓸 때 난다.'
  remediation:
    lessonSection: js-basics.objects.object-basics#pitfalls
    exercises: [js-basics.objects.object-basics.tf-missing-property, js-basics.objects.object-basics.predict-missing-then-error]

- id: js.mc.bracket-key-without-quotes
  concept: js.obj.dot-bracket
  title: 대괄호 안의 키 이름에 따옴표를 빠뜨림
  statement: 'obj[price]처럼 대괄호 안에 속성 이름을 따옴표 없이 쓰면 price 속성을 읽는다고 생각한다.'
  reality: '대괄호 안은 식이라서 따옴표 없는 price는 변수 이름이다. 그런 변수가 없으면 ReferenceError가 나고, 있으면 그 변수의 값을 이름으로 쓴다. 이름 그대로 쓰려면 obj["price"]나 obj.price로 쓴다.'
  remediation:
    lessonSection: js-basics.objects.object-basics#pitfalls
    exercises: [js-basics.objects.object-basics.multi-valid-access, js-basics.objects.object-basics.fix-bracket-quotes]

- id: js.mc.add-property-needs-declare
  concept: js.obj.add-delete
  title: 새 속성은 리터럴에 미리 있어야 한다고 생각함
  statement: '객체 리터럴에 처음부터 적지 않은 속성은 나중에 대입할 수 없거나, 대입하면 오류가 난다고 생각한다.'
  reality: '없는 속성에 obj.key = 값으로 대입하면 그 자리에서 새 속성이 생긴다. let·const 같은 선언도 필요 없다.'
  remediation:
    lessonSection: js-basics.objects.object-basics#pitfalls
    exercises: [js-basics.objects.object-basics.predict-cart-changes, js-basics.objects.object-basics.impl-restock]

- id: js.mc.duplicate-key-error
  concept: js.obj.add-delete
  title: 리터럴의 중복 키가 오류라고 생각함
  statement: '객체 리터럴에 같은 키를 두 번 쓰면 "이미 있는 이름"이라는 오류가 나거나, 앞의 값이 남는다고 생각한다.'
  reality: '같은 키를 두 번 쓰면 오류 없이 뒤에 쓴 값이 앞의 값을 덮어쓴다. 실수로 값이 사라지기 쉬우니 키가 겹치지 않는지 확인한다.'
  remediation:
    lessonSection: js-basics.objects.object-basics#pitfalls
    exercises: [js-basics.objects.object-basics.tf-duplicate-key, js-basics.objects.object-basics.predict-cart-changes]

- id: js.mc.method-reads-props-by-name
  concept: js.obj.methods-intro
  title: 메서드 안에서 자기 속성을 이름만으로 읽으려 함
  statement: '객체 안에 있는 메서드는 같은 객체의 속성을 balance처럼 이름만으로 읽을 수 있다고 생각한다.'
  reality: '속성은 변수가 아니다. 메서드 안에서 balance라고만 쓰면 변수 balance를 찾아 ReferenceError가 난다. obj.method()로 부른 메서드에서는 this.balance나 객체이름.balance로 읽는다.'
  remediation:
    lessonSection: js-basics.objects.object-basics#pitfalls
    exercises: [js-basics.objects.object-basics.mcq-method-this, js-basics.objects.object-basics.fill-method-call, js-basics.objects.object-basics.fix-method-this]


# ── 모듈 9. reference-vs-value ──

- id: js.mc.assign-copies-object
  concept: js.obj.reference
  title: 객체를 대입하면 복사된다고 생각함
  statement: 'const b = a;처럼 객체를 다른 변수에 대입하면 a와 똑같은 새 객체가 하나 더 생긴다고 생각한다.'
  reality: '대입하면 객체가 아니라 참조가 복사되어 a와 b가 같은 객체 하나를 가리킨다. b.x를 바꾸면 a.x도 바뀐 값으로 보인다.'
  remediation:
    lessonSection: js-basics.objects.reference-vs-value#pitfalls
    exercises: [js-basics.objects.reference-vs-value.mcq-assign-shares, js-basics.objects.reference-vs-value.predict-alias-change, js-basics.objects.reference-vs-value.fill-copy-spread, js-basics.objects.reference-vs-value.parsons-backup-clone, js-basics.objects.reference-vs-value.fix-order-template]

- id: js.mc.object-param-copied
  concept: js.obj.reference
  title: 함수에 넘긴 객체는 복사본이라고 생각함
  statement: '원시 값 매개변수처럼, 함수에 넘긴 객체의 속성을 함수 안에서 바꿔도 바깥 객체는 그대로라고 생각한다.'
  reality: '객체를 넘기면 같은 객체의 참조가 매개변수에 들어간다. 함수 안에서 param.x = 1로 속성을 바꾸면 바깥 객체도 바뀐다. 원본을 지키려면 복사본을 만들어 바꾸고 돌려준다.'
  remediation:
    lessonSection: js-basics.objects.reference-vs-value#pitfalls
    exercises: [js-basics.objects.reference-vs-value.tf-param-object-copied, js-basics.objects.reference-vs-value.find-bug-param-mutates, js-basics.objects.reference-vs-value.fix-mutating-discount, js-basics.objects.reference-vs-value.impl-apply-coupon]

- id: js.mc.param-reassign-replaces-object
  concept: js.obj.reference
  title: 매개변수에 새 객체를 대입하면 바깥 객체가 바뀐다고 생각함
  statement: '함수 안에서 param = { ... }처럼 매개변수에 새 객체를 대입하면 바깥 변수도 그 새 객체를 가리키게 된다고 생각한다.'
  reality: '매개변수에 새 값을 대입하면 매개변수만 다른 객체를 가리키게 된다. 바깥 변수는 원래 객체를 그대로 가리킨다. 속성을 바꾸는 것(param.x = 1)과 매개변수 자체를 바꾸는 것(param = {})은 다르다.'
  remediation:
    lessonSection: js-basics.objects.reference-vs-value#pitfalls
    exercises: [js-basics.objects.reference-vs-value.predict-param-reassign, js-basics.objects.reference-vs-value.multi-reassign-vs-mutate, js-basics.objects.reference-vs-value.fix-reset-scores]

- id: js.mc.shallow-copy-is-deep
  concept: js.obj.copy-shallow
  title: 얕은 복사가 중첩 객체까지 복사한다고 생각함
  statement: '{ ...obj }로 복사하면 안에 든 객체와 배열까지 모두 새로 만들어져 원본과 완전히 따로 된다고 생각한다.'
  reality: '전개 구문 복사는 첫 단계 속성만 새로 담는다. 속성 값이 객체나 배열이면 그 참조가 복사되어 원본과 복사본이 같은 안쪽 객체를 함께 쓴다. 중첩까지 따로 만들려면 structuredClone이나 안쪽도 복사한다.'
  remediation:
    lessonSection: js-basics.objects.reference-vs-value#pitfalls
    exercises: [js-basics.objects.reference-vs-value.mcq-shallow-nested, js-basics.objects.reference-vs-value.predict-shallow-nested, js-basics.objects.reference-vs-value.fix-reorder-shallow, js-basics.objects.reference-vs-value.parsons-backup-clone, js-basics.objects.reference-vs-value.impl-move-member]

- id: js.mc.array-assign-copies
  concept: js.obj.copy-shallow
  title: 배열을 대입하면 복사된다고 생각함
  statement: 'const copy = list;로 배열을 대입하면 복사본이 생겨 copy.push가 list에 영향을 주지 않는다고 생각한다.'
  reality: '배열도 객체라서 대입하면 참조가 복사된다. copy와 list는 같은 배열이다. 복사본이 필요하면 [...list]처럼 새 배열을 만든다.'
  remediation:
    lessonSection: js-basics.objects.reference-vs-value#pitfalls
    exercises: [js-basics.objects.reference-vs-value.fix-array-alias, js-basics.objects.reference-vs-value.impl-add-tag, js-basics.objects.reference-vs-value.predict-equality-arrays]

- id: js.mc.same-content-objects-equal
  concept: js.obj.equality
  title: 내용이 같은 두 객체가 ===로 같다고 생각함
  statement: '{ x: 1 } === { x: 1 }처럼 속성과 값이 모두 같은 두 객체는 ===로 비교하면 true라고 생각한다.'
  reality: '객체의 ===는 같은 객체(같은 참조)인지를 본다. 따로 만든 두 객체는 내용이 같아도 false다. 내용을 비교하려면 속성을 하나씩 비교한다.'
  remediation:
    lessonSection: js-basics.objects.reference-vs-value#pitfalls
    exercises: [js-basics.objects.reference-vs-value.tf-same-content-equal, js-basics.objects.reference-vs-value.predict-equality-arrays, js-basics.objects.reference-vs-value.impl-same-seat, js-basics.objects.reference-vs-value.fix-reserved-check]

- id: js.mc.copy-equals-original
  concept: js.obj.equality
  title: 복사본이 원본과 ===로 같다고 생각함
  statement: '{ ...a }로 만든 복사본은 a와 내용이 같으니 copy === a가 true라고 생각한다.'
  reality: '복사는 새 객체를 만들므로 copy === a는 false다. 반대로 const b = a;처럼 대입한 b는 같은 객체라서 b === a가 true다.'
  remediation:
    lessonSection: js-basics.objects.reference-vs-value#pitfalls
    exercises: [js-basics.objects.reference-vs-value.multi-equality-after-change, js-basics.objects.reference-vs-value.predict-shallow-nested]

- id: js.mc.const-object-props-frozen
  concept: js.obj.const-mutation
  title: const 객체의 속성을 바꾸면 오류가 난다고 생각함
  statement: 'const로 만든 객체는 속성을 바꾸거나 추가할 때도 TypeError(Assignment to constant variable.)가 난다고 생각한다.'
  reality: 'const가 막는 것은 변수에 다시 대입하는 것뿐이다. const 객체의 속성 바꾸기·추가·삭제는 오류 없이 된다. 변수 자체에 새 객체를 대입할 때만 TypeError가 난다.'
  remediation:
    lessonSection: js-basics.objects.reference-vs-value#pitfalls
    exercises: [js-basics.objects.reference-vs-value.mcq-const-push, js-basics.objects.reference-vs-value.predict-const-player, js-basics.objects.reference-vs-value.impl-level-up, js-basics.objects.reference-vs-value.web-cart-const]


# ── 모듈 9. object-iteration ──

- id: js.mc.object-has-length
  concept: js.obj.keys-values-entries
  title: 객체에 length가 있다고 생각함
  statement: '배열처럼 객체도 obj.length로 속성 개수를 알 수 있다고 생각한다.'
  reality: '일반 객체에는 length 속성이 없어서 obj.length는 undefined다. 속성 개수는 Object.keys(obj).length로 센다.'
  remediation:
    lessonSection: js-basics.objects.object-iteration#pitfalls
    exercises: [js-basics.objects.object-iteration.mcq-object-length, js-basics.objects.object-iteration.impl-score-lines, js-basics.objects.object-iteration.fix-cart-summary]

- id: js.mc.for-of-object
  concept: js.obj.keys-values-entries
  title: 객체를 for...of로 바로 돌 수 있다고 생각함
  statement: 'for (const x of obj)처럼 객체를 for...of로 돌면 속성이 하나씩 나온다고 생각한다.'
  reality: '일반 객체는 for...of로 돌 수 없어 TypeError(obj is not iterable)가 난다. Object.keys·values·entries로 배열을 만들어 돌거나 for...in을 쓴다.'
  remediation:
    lessonSection: js-basics.objects.object-iteration#pitfalls
    exercises: [js-basics.objects.object-iteration.tf-for-of-object, js-basics.objects.object-iteration.fill-count-filled, js-basics.objects.object-iteration.fix-stock-total]

- id: js.mc.for-in-gives-values
  concept: js.obj.for-in
  title: for...in이 값을 준다고 생각함
  statement: 'for (const x in obj)의 x에 속성 값이 하나씩 들어온다고 생각한다.'
  reality: 'for...in의 변수에는 키(속성 이름 문자열)가 들어온다. 값은 obj[x]로 읽는다.'
  remediation:
    lessonSection: js-basics.objects.object-iteration#pitfalls
    exercises: [js-basics.objects.object-iteration.mcq-for-in-key, js-basics.objects.object-iteration.predict-for-in-dot, js-basics.objects.object-iteration.parsons-for-in-report]

- id: js.mc.undefined-value-means-missing
  concept: js.obj.in-optional-chaining
  title: 값이 undefined인 속성과 없는 속성을 구별하지 못함
  statement: 'obj.key === undefined이면 그 속성이 객체에 없다고 생각한다.'
  reality: '값이 undefined인 속성도 객체에 있는 속성이다. "key" in obj는 true이고 Object.keys에도 나온다. 있는지 확인할 때는 in(또는 Object.hasOwn)을 쓴다.'
  remediation:
    lessonSection: js-basics.objects.object-iteration#pitfalls
    exercises: [js-basics.objects.object-iteration.tf-undefined-means-missing, js-basics.objects.object-iteration.multi-in-checks, js-basics.objects.object-iteration.impl-missing-fields]

- id: js.mc.optional-chaining-guards-rest
  concept: js.obj.in-optional-chaining
  title: ?.를 한 번 쓰면 뒤의 모든 단계가 안전하다고 생각함
  statement: 'user?.address.city처럼 앞에 ?.를 한 번 쓰면 address가 없어도 오류가 나지 않는다고 생각한다.'
  reality: '?.는 바로 앞의 값이 null·undefined인지만 확인한다. user가 있고 address가 없으면 user?.address는 undefined이고, 이어지는 .city에서 TypeError가 난다. 없을 수 있는 단계마다 ?.를 쓴다(user?.address?.city).'
  remediation:
    lessonSection: js-basics.objects.object-iteration#pitfalls
    exercises: [js-basics.objects.object-iteration.find-bug-optional-chain, js-basics.objects.object-iteration.fix-get-city, js-basics.objects.object-iteration.fix-cart-summary]


# ── 모듈 9. destructuring-and-spread ──

- id: js.mc.destructuring-removes-property
  concept: js.obj.destructuring
  title: 구조 분해가 원본에서 속성을 꺼내 없앤다고 생각함
  statement: 'const { name } = user;를 하면 name 속성이 user에서 빠져나와 user에는 남지 않는다고 생각한다.'
  reality: '구조 분해는 속성 값을 읽어 변수에 복사할 뿐 원본 객체를 바꾸지 않는다. user.name은 그대로 있다.'
  remediation:
    lessonSection: js-basics.objects.destructuring-and-spread#pitfalls
    exercises: [js-basics.objects.destructuring-and-spread.mcq-destructure-keeps-original, js-basics.objects.destructuring-and-spread.impl-order-line, js-basics.objects.destructuring-and-spread.multi-destructure-facts, js-basics.objects.destructuring-and-spread.impl-merge-profile]

- id: js.mc.destructuring-rename-direction
  concept: js.obj.destructuring
  title: 구조 분해에서 새 이름의 방향을 거꾸로 씀
  statement: 'const { userName: name } = user;가 user의 name 속성을 userName 변수로 받는다고 생각한다.'
  reality: '{ 속성이름: 새변수이름 } 순서다. { name: userName }이 name 속성을 userName 변수로 받는다. 거꾸로 쓰면 userName 속성을 찾아 undefined가 되고, 변수는 name이 된다.'
  remediation:
    lessonSection: js-basics.objects.destructuring-and-spread#pitfalls
    exercises: [js-basics.objects.destructuring-and-spread.tf-rename-direction, js-basics.objects.destructuring-and-spread.fix-rename-reversed, js-basics.objects.destructuring-and-spread.multi-destructure-facts, js-basics.objects.destructuring-and-spread.fix-receipt-bugs]

- id: js.mc.destructuring-default-on-null
  concept: js.obj.destructuring
  title: 구조 분해 기본값이 null에도 쓰인다고 생각함
  statement: 'const { level = 1 } = obj;에서 obj.level이 null이어도 기본값 1이 들어간다고 생각한다.'
  reality: '기본값은 값이 undefined일 때(속성이 없거나 undefined)만 쓰인다. null은 값이 있는 것으로 봐서 level은 null이다. 함수 기본값 매개변수와 같은 규칙이다.'
  remediation:
    lessonSection: js-basics.objects.destructuring-and-spread#pitfalls
    exercises: [js-basics.objects.destructuring-and-spread.predict-defaults-null, js-basics.objects.destructuring-and-spread.fix-default-on-null, js-basics.objects.destructuring-and-spread.multi-destructure-facts]

- id: js.mc.array-destructuring-by-name
  concept: js.arr.destructuring
  title: 배열 구조 분해가 이름으로 맞춰진다고 생각함
  statement: 'const [price, name] = ["떡볶이", 3000];처럼 쓰면 이름에 맞는 값이 알아서 들어간다고 생각한다.'
  reality: '배열 구조 분해는 위치(순서)대로 넣는다. 첫 변수에 0번 값, 둘째 변수에 1번 값이 들어가므로 price는 "떡볶이", name은 3000이다.'
  remediation:
    lessonSection: js-basics.objects.destructuring-and-spread#pitfalls
    exercises: [js-basics.objects.destructuring-and-spread.mcq-array-by-position, js-basics.objects.destructuring-and-spread.parsons-podium-swap, js-basics.objects.destructuring-and-spread.impl-parse-record]

- id: js.mc.spread-order-irrelevant
  concept: js.obj.spread
  title: 전개 구문에서 순서가 상관없다고 생각함
  statement: '{ ...defaults, ...options }와 { ...options, ...defaults }의 결과가 같거나, 같은 키는 앞에 쓴 값이 남는다고 생각한다.'
  reality: '전개 구문은 왼쪽부터 차례로 속성을 담고, 같은 키는 나중에 담은(오른쪽) 값이 덮어쓴다. 기본값은 앞에, 바꿀 값은 뒤에 쓴다.'
  remediation:
    lessonSection: js-basics.objects.destructuring-and-spread#pitfalls
    exercises: [js-basics.objects.destructuring-and-spread.mcq-spread-order, js-basics.objects.destructuring-and-spread.fix-update-order, js-basics.objects.destructuring-and-spread.predict-spread-trace, js-basics.objects.destructuring-and-spread.fix-receipt-bugs]

- id: js.mc.spread-mutates-original
  concept: js.obj.spread
  title: 전개 구문이 원본을 바꾼다고 생각함
  statement: 'const next = { ...state, count: 1 };을 하면 state의 count도 1로 바뀐다고 생각한다.'
  reality: '전개 구문은 새 객체를 만든다. state는 그대로이고 next만 count가 1이다(단, 안쪽 객체는 얕은 복사라 함께 쓴다).'
  remediation:
    lessonSection: js-basics.objects.destructuring-and-spread#pitfalls
    exercises: [js-basics.objects.destructuring-and-spread.tf-spread-keeps-original, js-basics.objects.destructuring-and-spread.find-bug-shared-sides, js-basics.objects.destructuring-and-spread.fix-add-tag-mutates]


# ── 모듈 9. error-handling ──

- id: js.mc.throw-just-logs
  concept: js.errors.throw
  title: throw가 메시지만 출력하고 계속 실행된다고 생각함
  statement: 'throw new Error("...")는 console.log처럼 메시지를 보여 주기만 하고 다음 줄이 이어서 실행된다고 생각한다.'
  reality: 'throw는 그 자리에서 실행을 멈추고 오류를 던진다. 함수 안이면 함수가 끝나고 return도 되지 않는다. 아무도 잡지 않으면 프로그램 전체가 멈춘다.'
  remediation:
    lessonSection: js-basics.objects.error-handling#pitfalls
    exercises: [js-basics.objects.error-handling.mcq-throw-stops, js-basics.objects.error-handling.predict-throw-in-function, js-basics.objects.error-handling.fix-log-instead-of-throw]

- id: js.mc.try-catch-catches-syntax-error
  concept: js.errors.try-catch
  title: try...catch가 문법 오류까지 잡는다고 생각함
  statement: 'try 블록 안에 괄호를 빠뜨리는 등 문법 오류가 있어도 catch가 잡아 준다고 생각한다.'
  reality: '문법 오류는 실행 전에 코드 전체를 읽을 때 나서 프로그램이 아예 시작되지 않는다. try...catch도 실행되지 않으므로 잡을 수 없다. try...catch는 실행 중 오류(ReferenceError, TypeError, throw로 던진 오류)를 잡는다.'
  remediation:
    lessonSection: js-basics.objects.error-handling#pitfalls
    exercises: [js-basics.objects.error-handling.tf-syntax-error-caught, js-basics.objects.error-handling.multi-catchable-errors]

- id: js.mc.try-resumes-after-catch
  concept: js.errors.try-catch
  title: catch 뒤에 try의 나머지가 이어서 실행된다고 생각함
  statement: 'try 블록 중간에서 오류가 나면 catch가 처리한 뒤 try 블록의 남은 줄로 돌아가 이어서 실행한다고 생각한다.'
  reality: '오류가 난 줄 뒤의 try 블록은 건너뛰고 다시 돌아가지 않는다. catch(와 finally)가 끝나면 try...catch 다음 줄부터 이어진다.'
  remediation:
    lessonSection: js-basics.objects.error-handling#pitfalls
    exercises: [js-basics.objects.error-handling.predict-try-resume, js-basics.objects.error-handling.fix-finally-loading, js-basics.objects.error-handling.fix-orders-loop]

- id: js.mc.caught-error-stops-program
  concept: js.errors.try-catch
  title: 잡은 오류도 프로그램을 멈춘다고 생각함
  statement: 'catch로 오류를 처리해도 오류가 났으니 프로그램은 거기서 끝난다고 생각한다.'
  reality: 'catch로 잡은 오류는 처리된 것이라 프로그램이 멈추지 않고 try...catch 다음 줄부터 계속 실행된다. 잡지 않은 오류만 프로그램을 멈춘다.'
  remediation:
    lessonSection: js-basics.objects.error-handling#pitfalls
    exercises: [js-basics.objects.error-handling.predict-try-resume, js-basics.objects.error-handling.impl-check-orders]

- id: js.mc.finally-only-on-error
  concept: js.errors.finally
  title: finally는 오류가 났을 때만 실행된다고 생각함
  statement: 'finally 블록은 catch처럼 오류가 났을 때만 실행된다고 생각한다.'
  reality: 'finally는 오류가 나든 안 나든, try 안에서 return하든 항상 실행된다.'
  remediation:
    lessonSection: js-basics.objects.error-handling#pitfalls
    exercises: [js-basics.objects.error-handling.mcq-finally-when, js-basics.objects.error-handling.predict-finally-return, js-basics.objects.error-handling.fix-orders-loop]
