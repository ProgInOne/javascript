id: js-basics
title: JavaScript 기초
summary: 값, 연산, 제어 흐름, 함수, 배열, 객체로 문제를 해결하는 프로그램을 작성합니다.
language: javascript
level: basic
depth: full
status: published
objectives:
  - console.log로 프로그램의 결과를 확인하고, 문장이 실행되는 순서를 예측할 수 있다.
  - 오류 메시지의 종류·설명·줄 번호를 읽고 원인을 찾아 고칠 수 있다.
  - 변수와 상수로 값에 이름을 붙이고, 대입으로 값을 바꿀 수 있다.
  - 연산자로 값을 계산·비교·조합하고, 자료형이 바뀌는 결과를 예측할 수 있다.
  - 조건문으로 상황에 따라 다른 코드를 실행하고, 어느 갈래가 실행될지 예측할 수 있다.
  - 반복문으로 같은 일을 여러 번 실행하고, 반복 횟수와 변수 값의 변화를 추적할 수 있다.
  - 함수를 만들어 값을 주고받고, 반환값과 부수 효과, 변수의 스코프를 구분하며, 함수를 값으로 넘길 수 있다.
  - 문자열의 글자를 인덱스로 읽고, 문자열 메서드로 찾기·자르기·다듬기·나누기를 해서 원하는 모양으로 바꿀 수 있다.
  - 배열에 값을 담아 읽고 바꾸며, 반복과 map·filter·reduce 같은 고차 함수로 목록을 변환·검색·정렬할 수 있다.
  - 객체로 관련된 값을 묶어 읽고 바꾸며, 참조와 복사의 차이를 예측하고, 구조 분해·전개 구문과 try...catch로 데이터와 오류를 다룰 수 있다.
