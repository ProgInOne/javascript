id: js-basics.operators.logical.predict-and-or-precedence
type: predict_output
difficulty: 3
concepts:
  - { id: js.ops.logical-and-or-not, weight: 1 }
tags: [precedence, logical-and, logical-or, logical-not]
estimatedSeconds: 120
prompt: |
  다음 프로그램을 실행하면 콘솔에 무엇이 출력되나요? 한 줄에 하나씩 쓰세요.
spec:
  lang: js
  code: |
    const a = true;
    const b = false;
    const c = false;
    console.log(a || b && c);
    console.log((a || b) && c);
    console.log(!b && c);
    console.log(!(b && c));
  answerKind: console
  misconceptionByAnswer:
    "false\nfalse\nfalse\ntrue": js.mc.and-or-same-precedence
    "true\nfalse\ntrue\ntrue": js.mc.not-applies-to-whole
misconceptions: [js.mc.and-or-same-precedence, js.mc.not-applies-to-whole]
hints:
  - 우선순위는 `!` → `&&` → `||`이고, 괄호가 있으면 괄호 안을 먼저 계산해요.
  - 4번 줄은 `a || (b && c)`, 6번 줄은 `(!b) && c`로 묶여요.
  - 각 줄에서 먼저 묶이는 부분을 true/false 하나로 바꾼 뒤, 남은 연산을 계산해 보세요.
explanation: |
  정답은 차례로 **true, false, false, true**예요.

  | 줄 | 묶이는 순서 | 계산 | 결과 |
  |---|---|---|---|
  | `a \|\| b && c` | `a \|\| (b && c)` | `true \|\| false` | true |
  | `(a \|\| b) && c` | 괄호 먼저 | `true && false` | false |
  | `!b && c` | `(!b) && c` | `true && false` | false |
  | `!(b && c)` | 괄호 먼저 | `!false` | true |

  - 4번 줄을 `false`라고 답했다면 왼쪽부터 `(a || b) && c`로 계산한 거예요. `&&`가 `||`보다 먼저 묶여요.
  - 6번 줄을 `true`라고 답했다면 `!`가 `b && c` 전체에 붙는다고 본 거예요. `!`는 바로 뒤의 값 하나(`b`)에만 먼저 붙어요. 7번 줄처럼 괄호로 감싸야 전체가 뒤집혀요.
origin: authored
