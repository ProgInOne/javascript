id: js-basics.operators.logical.impl-discount-rules
type: implement_function
difficulty: 4
concepts:
  - { id: js.ops.logical-and-or-not, weight: 1 }
  - { id: js.ops.relational, weight: 0.5 }
tags: [logical-and, logical-or, precedence, write-code]
estimatedSeconds: 360
prompt: |
  박물관 입장료 할인 규칙이에요.

  - 13세 미만 어린이는 할인돼요.
  - 65세 이상 어르신도 할인돼요.
  - 학생은 **평일에만** 할인돼요.

  손님 네 명의 정보가 주어져 있어요. 손님마다 할인 여부를 `discountA`, `discountB`, `discountC`, `discountD` 상수에 `true`/`false`로 계산해 넣고, 아래처럼 출력하세요. 손님마다 같은 모양의 식 하나로 규칙 세 개를 모두 표현해 보세요.

  ```text
  A 할인: true
  B 할인: false
  C 할인: true
  D 할인: true
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          // 손님 A: 10세, 학생 아님, 주말
          const ageA = 10;
          const isStudentA = false;
          const isWeekdayA = false;
          // 손님 B: 17세, 학생, 주말
          const ageB = 17;
          const isStudentB = true;
          const isWeekdayB = false;
          // 손님 C: 17세, 학생, 평일
          const ageC = 17;
          const isStudentC = true;
          const isWeekdayC = true;
          // 손님 D: 70세, 학생 아님, 평일
          const ageD = 70;
          const isStudentD = false;
          const isWeekdayD = true;

          // 여기에 discountA ~ discountD를 만들고 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          // 손님 A: 10세, 학생 아님, 주말
          const ageA = 10;
          const isStudentA = false;
          const isWeekdayA = false;
          // 손님 B: 17세, 학생, 주말
          const ageB = 17;
          const isStudentB = true;
          const isWeekdayB = false;
          // 손님 C: 17세, 학생, 평일
          const ageC = 17;
          const isStudentC = true;
          const isWeekdayC = true;
          // 손님 D: 70세, 학생 아님, 평일
          const ageD = 70;
          const isStudentD = false;
          const isWeekdayD = true;

          const discountA = ageA < 13 || ageA >= 65 || (isStudentA && isWeekdayA);
          const discountB = ageB < 13 || ageB >= 65 || (isStudentB && isWeekdayB);
          const discountC = ageC < 13 || ageC >= 65 || (isStudentC && isWeekdayC);
          const discountD = ageD < 13 || ageD >= 65 || (isStudentD && isWeekdayD);
          console.log("A 할인:", discountA);
          console.log("B 할인:", discountB);
          console.log("C 할인:", discountC);
          console.log("D 할인:", discountD);
  checks:
    - kind: console
      id: output
      description: 네 손님의 할인 여부가 A, B, C, D 순서로 출력되어야 합니다.
      requirement: 할인 여부 출력
      expect:
        lines: ["A 할인: true", "B 할인: false", "C 할인: true", "D 할인: true"]
    - kind: program
      id: child
      description: 13세 미만인 손님 A는 주말에도 할인되어야 합니다.
      requirement: 어린이 할인
      expect:
        globals:
          discountA: { equals: true }
    - kind: program
      id: student-weekend
      description: 학생이라도 주말에 온 손님 B는 할인되지 않아야 합니다.
      requirement: 학생은 평일에만
      expect:
        globals:
          discountB: { equals: false }
    - kind: program
      id: student-weekday
      description: 평일에 온 학생 C는 할인되어야 합니다.
      requirement: 학생은 평일에만
      expect:
        globals:
          discountC: { equals: true }
    - kind: program
      id: senior
      description: 65세 이상인 손님 D는 할인되어야 하고, 프로그램이 오류 없이 끝나야 합니다.
      requirement: 어르신 할인
      expect:
        globals:
          discountD: { equals: true }
        noError: true
misconceptions: [js.mc.and-or-same-precedence]
hints:
  - 규칙 세 개 중 하나라도 맞으면 할인이에요. 규칙 세 개를 어떤 연산자로 이어야 할까요?
  - "세 번째 규칙 \"학생이면서 평일\"은 그 자체로 조건 두 개가 모두 맞아야 해요. 이 부분을 하나로 묶어 두면 실수가 줄어요."
  - "손님 A의 식은 \"13세 미만\" 또는 \"65세 이상\" 또는 \"(학생 그리고 평일)\" 모양이에요. 괄호를 넣어 세 번째 규칙을 묶은 뒤, B~D도 이름만 바꿔 써 보세요."
explanation: |
  예시 정답이에요(손님 A).

  ```js
  const discountA = ageA < 13 || ageA >= 65 || (isStudentA && isWeekdayA);
  ```

  - 규칙 세 개는 "하나라도 맞으면" 할인이라 `||`로 이어요.
  - 세 번째 규칙 "학생이면서 평일"은 둘 다 맞아야 하니 `&&`로 묶어요.

  `&&`가 `||`보다 먼저 계산되므로 괄호를 빼도 결과는 같아요. 하지만 괄호를 써 두면 "학생 규칙은 한 덩어리"라는 의도가 잘 보여요.

  | 손님 | `age < 13` | `age >= 65` | `학생 && 평일` | 결과 |
  |---|---|---|---|---|
  | A (10세) | true | false | false | true |
  | B (17세, 학생, 주말) | false | false | false | false |
  | C (17세, 학생, 평일) | false | false | true | true |
  | D (70세) | false | true | false | true |

  `(ageB < 13 || ageB >= 65 || isStudentB) && isWeekdayB`처럼 묶으면 "모든 할인이 평일에만"이라는 다른 규칙이 되어, 주말에 온 어린이 A가 할인을 못 받아요. 규칙 문장에서 "평일에만"이 어디에 붙는지 정확히 읽는 것이 핵심이에요.
origin: authored
