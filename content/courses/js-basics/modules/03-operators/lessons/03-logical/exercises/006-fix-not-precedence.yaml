id: js-basics.operators.logical.fix-not-precedence
type: fix_bug
difficulty: 3
concepts:
  - { id: js.ops.logical-and-or-not, weight: 1 }
  - { id: js.ops.relational, weight: 0.3 }
tags: [logical-not, precedence, debugging]
estimatedSeconds: 180
prompt: |
  나이가 19세 미만인지 확인하는 프로그램이에요. 15세인데 미성년자가 아니라고 나와요. 버그를 고쳐서 아래처럼 출력되게 하세요.

  ```text
  미성년자인가요? true
  주류 구매 가능? false
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          const age = 15;
          const isMinor = !age >= 19;
          const canBuyAlcohol = !isMinor;
          console.log("미성년자인가요?", isMinor);
          console.log("주류 구매 가능?", canBuyAlcohol);
  solution:
    files:
      - path: main.js
        content: |
          const age = 15;
          const isMinor = !(age >= 19);
          const canBuyAlcohol = !isMinor;
          console.log("미성년자인가요?", isMinor);
          console.log("주류 구매 가능?", canBuyAlcohol);
  bugDescription: 15세인데 "미성년자인가요? false", "주류 구매 가능? true"가 출력돼요.
  bugMisconception: js.mc.not-applies-to-whole
  maxEditDistance: 4
  checks:
    - kind: console
      id: output
      description: 15세는 미성년자이고 주류를 살 수 없다고 출력되어야 합니다.
      requirement: 출력
      expect:
        lines: ["미성년자인가요? true", "주류 구매 가능? false"]
    - kind: program
      id: values
      description: isMinor는 true, canBuyAlcohol은 false여야 합니다.
      requirement: 판정 값
      expect:
        globals:
          isMinor: { equals: true }
          canBuyAlcohol: { equals: false }
        noError: true
misconceptions: [js.mc.not-applies-to-whole]
hints:
  - 2번 줄의 식을 계산 순서대로 한 단계씩 풀어 보세요. 가장 먼저 계산되는 연산자는 무엇일까요?
  - "`!`는 비교 연산자보다 먼저, 바로 뒤의 값 하나에 붙어요. `!age`는 `!15`예요."
  - "`!`가 비교식 `age >= 19` 전체에 붙도록 바꿔야 해요. 계산 순서를 바꾸는 기호를 떠올려 보세요."
explanation: |
  2번 줄을 `const isMinor = !(age >= 19);`로 고치면 돼요. `const isMinor = age < 19;`도 같은 결과라 정답이에요.

  원래 코드 `!age >= 19`는 이렇게 계산됐어요.

  1. `!`가 먼저 `age`에 붙어요: `!15` → `false` (15는 truthy라서 뒤집으면 false)
  1. `false >= 19` → `false` (비교할 때 `false`는 숫자 0으로 바뀌어 `0 >= 19`가 돼요)

  그래서 `isMinor`가 `false`가 되고, 3번 줄의 `canBuyAlcohol`도 거꾸로 `true`가 됐어요. 오류 메시지가 없어서 찾기 어려운 버그예요.

  `!`는 바로 뒤의 값 하나에만 먼저 붙어요. 비교 전체를 뒤집으려면 괄호로 감싸요. 3번 줄의 `!isMinor`는 변수 하나를 뒤집으니 괄호가 필요 없어요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
