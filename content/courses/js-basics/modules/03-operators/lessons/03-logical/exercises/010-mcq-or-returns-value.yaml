id: js-basics.operators.logical.mcq-or-returns-value
type: mcq_single
difficulty: 1
concepts:
  - { id: js.ops.short-circuit, weight: 1 }
tags: [logical-or, short-circuit]
estimatedSeconds: 45
prompt: |
  다음 코드를 실행하면 콘솔에 무엇이 출력되나요?

  ```js
  console.log("사과" || "배");
  ```
spec:
  options:
    - id: a
      text: "`사과`"
    - id: b
      text: "`true`"
      misconception: js.mc.logical-returns-boolean
      rationale: "||는 true/false를 새로 만들지 않고, 양쪽 값 중 하나를 그대로 돌려줘요."
    - id: c
      text: "`배`"
      rationale: 왼쪽 "사과"가 이미 truthy라서 ||는 오른쪽을 볼 필요가 없어요.
    - id: d
      text: "`사과배`"
      rationale: "||는 글자를 이어 붙이지 않아요. 이어 붙이기는 + 연산자가 해요."
  correct: a
hints:
  - "`||`의 결과가 항상 `true`/`false`인지 레슨의 두 번째 관점을 떠올려 보세요."
  - 빈 문자열이 아닌 글자는 truthy예요.
  - "`||`는 왼쪽이 truthy이면 왼쪽 값을 그대로 돌려줘요."
explanation: |
  정답은 **`사과`**예요.

  `||`는 왼쪽 값이 truthy이면 **왼쪽 값 그대로**, falsy이면 오른쪽 값을 돌려줘요. `"사과"`는 빈 문자열이 아니라 truthy이므로 결과는 `"사과"`이고, 오른쪽 `"배"`는 보지도 않아요.

  - `true`: 논리 연산자의 결과가 항상 `true`/`false`라고 생각하면 고르기 쉬워요. 결과가 `true`/`false`인 건 고른 쪽의 값이 원래 `true`/`false`였을 때예요.
  - `배`: 오른쪽을 고르는 건 왼쪽이 falsy일 때예요(예: `"" || "배"`).
  - `사과배`: 글자를 이어 붙이는 건 `+`예요.
