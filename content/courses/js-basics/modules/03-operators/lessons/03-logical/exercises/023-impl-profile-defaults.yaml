id: js-basics.operators.logical.impl-profile-defaults
type: implement_function
difficulty: 4
concepts:
  - { id: js.ops.nullish, weight: 1 }
  - { id: js.ops.short-circuit, weight: 0.5 }
tags: [nullish, logical-or, default-value, write-code]
estimatedSeconds: 360
prompt: |
  앱의 프로필 설정을 불러오는 프로그램을 작성하세요. 저장된 값(`saved...`)과 아래 규칙으로 실제로 쓸 값을 정해요.

  | 만들 상수 | 규칙 |
  |---|---|
  | `volume` | 저장된 값이 없으면(`null`·`undefined`) 50. 0(음소거)은 올바른 값이라 그대로 써요. |
  | `nickname` | 비어 있으면(`""`, `null`, `undefined` 모두) `"익명"` |
  | `fontSize` | 저장된 값이 없으면 16 |
  | `language` | 저장된 값이 없으면 `"ko"` |

  네 값을 정한 뒤 아래처럼 출력하세요. 값을 직접 쓰지 말고 저장된 값과 연산자로 정해 보세요(기본값만 직접 써요).

  ```text
  음량: 0
  별명: 익명
  글자 크기: 16
  언어: ko
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const savedVolume = 0;
          const savedNickname = "";
          const savedFontSize = undefined;
          const savedLanguage = null;

          // 여기에 volume, nickname, fontSize, language를 만들고 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          const savedVolume = 0;
          const savedNickname = "";
          const savedFontSize = undefined;
          const savedLanguage = null;

          const volume = savedVolume ?? 50;
          const nickname = savedNickname || "익명";
          const fontSize = savedFontSize ?? 16;
          const language = savedLanguage ?? "ko";
          console.log("음량:", volume);
          console.log("별명:", nickname);
          console.log("글자 크기:", fontSize);
          console.log("언어:", language);
  checks:
    - kind: console
      id: output
      description: 네 설정 값이 정해진 순서로 출력되어야 합니다.
      requirement: 설정 출력
      expect:
        lines: ["음량: 0", "별명: 익명", "글자 크기: 16", "언어: ko"]
    - kind: program
      id: volume
      description: 저장된 음량 0이 그대로 volume에 들어 있어야 합니다.
      requirement: 0은 지키기
      expect:
        globals:
          volume: { equals: 0 }
      misconceptionIfFail: js.mc.nullish-same-as-or
    - kind: program
      id: nickname
      description: 빈 별명은 "익명"으로 바뀌어야 합니다.
      requirement: 빈 별명은 익명
      expect:
        globals:
          nickname: { equals: "익명" }
    - kind: program
      id: others
      description: fontSize는 16, language는 "ko"여야 하고, 프로그램이 오류 없이 끝나야 합니다.
      requirement: 없는 값은 기본값
      expect:
        globals:
          fontSize: { equals: 16 }
          language: { equals: "ko" }
        noError: true
misconceptions: [js.mc.nullish-same-as-or]
hints:
  - 규칙마다 "빈 문자열이나 0도 없는 것으로 볼까?"를 먼저 정해 보세요. 그에 따라 쓸 연산자가 달라져요.
  - "`??`는 `null`·`undefined`에만, `||`는 `\"\"`, `0` 같은 falsy 값에도 반응해요."
  - "네 규칙 중 \"비어 있으면\"이라고 빈 문자열까지 포함한 것은 하나뿐이에요. 그것만 `||`, 나머지는 다른 연산자예요."
explanation: |
  예시 정답이에요.

  ```js
  const volume = savedVolume ?? 50;
  const nickname = savedNickname || "익명";
  const fontSize = savedFontSize ?? 16;
  const language = savedLanguage ?? "ko";
  ```

  - `volume`: 0이 올바른 값이라 `??`예요. `||`를 쓰면 0이 50으로 바뀌어요.
  - `nickname`: 빈 문자열도 "비어 있음"으로 봐야 하므로 `||`예요. `??`를 쓰면 `""`가 그대로 남아 "별명: "만 출력돼요.
  - `fontSize`, `language`: 저장된 값이 `undefined`, `null`이라 `??`든 `||`든 기본값이 나와요. 다만 규칙이 "저장된 값이 없으면"이니 `??`가 의도를 정확히 드러내요.

  기본값을 정할 때마다 "0이나 빈 문자열이 올바른 값인가?"를 묻는 습관이 이 문제의 핵심이에요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
