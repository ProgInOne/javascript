id: js-basics.operators.logical.parsons-ride-rule
type: parsons
difficulty: 2
concepts:
  - { id: js.ops.logical-and-or-not, weight: 1 }
tags: [logical-and, logical-or, parentheses]
estimatedSeconds: 120
prompt: |
  어린이 놀이기구 규칙은 "표가 있어야 하고, 7세 이상**이거나** 보호자와 함께 와야 한다"예요. 이 규칙으로 입장 가능 여부를 계산해 출력하도록 코드 조각을 배열하세요.

  이 손님은 표가 없으니 실행 결과는 아래와 같아야 해요.

  ```text
  입장 가능: false
  ```
spec:
  lines:
    - { id: l1, code: "const age = 5;" }
    - { id: l2, code: "const hasTicket = false;" }
    - { id: l3, code: "const withParent = true;" }
    - { id: l4, code: "const canRide = hasTicket && (age >= 7 || withParent);" }
    - { id: l5, code: 'console.log("입장 가능:", canRide);' }
  distractors:
    - id: d1
      code: "const canRide = hasTicket && age >= 7 || withParent;"
      replaces: l4
      misconception: js.mc.and-or-same-precedence
    - id: d2
      code: 'console.log("입장 가능:", "canRide");'
      replaces: l5
  gradeIndent: false
  checks:
    - kind: console
      id: output
      description: '표가 없는 손님은 "입장 가능: false"가 출력되어야 합니다.'
      expect:
        lines: ["입장 가능: false"]
    - kind: program
      id: value
      description: canRide는 규칙대로 계산한 false여야 합니다.
      expect:
        globals:
          canRide: { equals: false }
        noError: true
misconceptions: [js.mc.and-or-same-precedence]
hints:
  - 변수는 쓰기 전에 먼저 만들어야 해요. 값을 넣는 세 줄이 앞에 와요.
  - "규칙에서 \"7세 이상이거나 보호자와 함께\"는 한 덩어리예요. 이 덩어리 전체가 \"표가 있다\"와 함께 맞아야 해요."
  - "괄호가 없는 식은 `&&`가 먼저 묶여서 `(hasTicket && age >= 7) || withParent`가 돼요. 이 손님에게 그 식을 적용하면 어떻게 되는지 계산해 보세요."
explanation: |
  정답 순서는 값 세 줄 → `canRide` 계산 → 출력이에요. 값 세 줄끼리는 순서를 바꿔도 돼요.

  ```js
  const canRide = hasTicket && (age >= 7 || withParent);
  ```

  괄호 안 `age >= 7 || withParent`는 `false || true`라서 `true`이고, `hasTicket && true`는 `false && true`라서 `false`예요. 표가 없으니 탈 수 없어요.

  괄호가 없는 조각 `hasTicket && age >= 7 || withParent`는 `&&`가 먼저 묶여 `(false && false) || true` → `true`가 돼요. 보호자만 있으면 표 없이도 탈 수 있는 엉뚱한 규칙이에요. 따옴표로 감싼 `"canRide"`는 변수가 아니라 글자라서 쓰지 않아요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
