id: js-basics.operators.logical.we-logical-and-or-not-1
type: fill_blank
difficulty: 2
concepts:
  - { id: js.ops.logical-and-or-not, weight: 1 }
tags: [logical, worked-example]
estimatedSeconds: 100
usage: worked_example
workedExampleStage: 1
prompt: |
  **풀이 예제 2단계: 빈칸 채우기**

  앞 단계와 같은 방식의 문제예요. 온라인 쇼핑몰에서 회원이 25000원어치를 샀고, 쿠폰은 없어요.

  풀이의 나머지는 완성되어 있어요. 주석을 읽고 빈칸 두 곳에 **조건식**을 쓰세요(true/false를 직접 쓰지 말고 변수로 계산하세요). 실행하면 아래처럼 나와야 해요.

  ```text
  false true true
  ```
spec:
  mode: code
  lang: js
  template: |
    const isMember = true;
    const total = 25000;
    const hasCoupon = false;
    // 1. 회원이면서 30000원 이상 샀을 때만 무료 배송이에요.
    const freeShipping = {{blank:free}};
    // 2. 쿠폰이 있거나 회원이면 할인이에요.
    const discount = {{blank:discount}};
    // 3. 쿠폰이 없는지 확인해요.
    const noCoupon = !hasCoupon;
    console.log(freeShipping, discount, noCoupon);
  blanks:
    - id: free
      accept: ["isMember && total >= 30000"]
      width: 30
    - id: discount
      accept: ["hasCoupon || isMember"]
      width: 30
  checks:
    - kind: console
      id: output
      description: "\"false true true\"가 출력되어야 합니다."
      requirement: 조건 결과 출력
      expect:
        lines: ["false true true"]
      misconceptionIfFail: js.mc.or-is-exclusive
    - kind: program
      id: values
      description: 프로그램이 오류 없이 끝나고, freeShipping은 false, discount는 true여야 합니다.
      requirement: 조건식의 값
      expect:
        globals:
          freeShipping: { equals: false }
          discount: { equals: true }
        noError: true
misconceptions: [js.mc.or-is-exclusive]
hints:
  - 앞 단계 풀이에서 "~이면서"는 `&&`, "~거나"는 `||`로 썼던 것을 떠올려 보세요.
  - 무료 배송은 회원 여부와 `total >= 30000`을 함께 봐요. 할인은 둘 중 하나만 참이어도 돼요.
  - "첫 빈칸은 `isMember && total >= 30000`, 두 번째 빈칸은 `hasCoupon || isMember`예요."
explanation: |
  예시 정답은 다음과 같아요.

  ```js
  const freeShipping = isMember && total >= 30000;
  const discount = hasCoupon || isMember;
  ```

  - `isMember && total >= 30000`: `true && false`라서 `false`예요. 회원이지만 금액이 모자라요.
  - `hasCoupon || isMember`: `false || true`라서 `true`예요. 하나만 참이어도 돼요.
  - `!hasCoupon`: 쿠폰이 없으니 `true`예요.

  `&&`는 "둘 다", `||`는 "하나라도"라는 앞 단계의 핵심 그대로예요. `||`는 둘 다 참일 때도 참이에요(둘 중 하나만이라는 뜻이 아니에요). 다음 단계에서는 처음부터 직접 써 봐요.
