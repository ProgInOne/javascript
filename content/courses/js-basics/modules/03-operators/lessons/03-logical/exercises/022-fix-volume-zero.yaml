id: js-basics.operators.logical.fix-volume-zero
type: fix_bug
difficulty: 3
concepts:
  - { id: js.ops.nullish, weight: 1 }
  - { id: js.ops.short-circuit, weight: 0.3 }
tags: [nullish, default-value, debugging]
estimatedSeconds: 150
prompt: |
  동영상 플레이어가 저장된 설정을 불러오는 코드예요. 저장된 값이 없으면(`null`) 기본값을 쓰고, 저장된 값이 있으면 그 값을 그대로 써야 해요. 버그를 고쳐서 아래처럼 출력되게 하세요.

  ```text
  음량: 0
  재생 속도: 1
  자막 크기: 20
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          const savedVolume = 0;
          const savedSpeed = null;
          const savedCaptionSize = 20;
          const volume = savedVolume || 50;
          const speed = savedSpeed || 1;
          const captionSize = savedCaptionSize || 16;
          console.log("음량:", volume);
          console.log("재생 속도:", speed);
          console.log("자막 크기:", captionSize);
  solution:
    files:
      - path: main.js
        content: |
          const savedVolume = 0;
          const savedSpeed = null;
          const savedCaptionSize = 20;
          const volume = savedVolume ?? 50;
          const speed = savedSpeed ?? 1;
          const captionSize = savedCaptionSize ?? 16;
          console.log("음량:", volume);
          console.log("재생 속도:", speed);
          console.log("자막 크기:", captionSize);
  bugDescription: 음량을 0(음소거)으로 저장했는데, 불러오면 음량이 50으로 나와요.
  bugMisconception: js.mc.nullish-same-as-or
  checks:
    - kind: console
      id: output
      description: 저장된 음량 0이 그대로 나오고, 저장되지 않은 재생 속도는 기본값 1이어야 합니다.
      requirement: 설정 출력
      expect:
        lines: ["음량: 0", "재생 속도: 1", "자막 크기: 20"]
    - kind: program
      id: values
      description: volume은 0, speed는 1, captionSize는 20이어야 합니다.
      requirement: 설정 값
      expect:
        globals:
          volume: { equals: 0 }
          speed: { equals: 1 }
          captionSize: { equals: 20 }
        noError: true
      misconceptionIfFail: js.mc.or-default-keeps-zero
misconceptions: [js.mc.nullish-same-as-or, js.mc.or-default-keeps-zero]
hints:
  - "`savedVolume || 50`을 계산해 보세요. `0`은 truthy일까요, falsy일까요?"
  - "`||`는 falsy 값을 모두 기본값으로 바꿔요. \"저장된 값이 없을 때(null)만\" 기본값을 쓰는 다른 연산자가 있었어요."
  - "기본값을 정하는 세 줄의 연산자를 `null`과 `undefined`에만 반응하는 연산자로 바꿔 보세요."
explanation: |
  기본값을 정하는 4~6번 줄의 `||`를 `??`로 바꾸면 돼요.

  - `savedVolume || 50`: `0`은 falsy라서 `50`이 됐어요. 사용자가 고른 음소거가 사라진 거예요.
  - `savedVolume ?? 50`: `0`은 `null`도 `undefined`도 아니라서 `0`이 그대로 남아요.
  - `savedSpeed ?? 1`: `null`이라 기본값 `1`을 써요. `||`일 때와 결과가 같아요.

  4번 줄만 고쳐도 체크는 통과하지만, 5·6번 줄도 `??`로 바꾸는 편이 안전해요. 예를 들어 나중에 자막 크기 0(자막 끄기)을 허용하면 `||`는 또 같은 버그를 만들어요. 숫자 설정처럼 0도 올바른 값이면 `??`를 써요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
