id: js-basics.operators.logical.impl-pass-check
type: implement_function
difficulty: 2
concepts:
  - { id: js.ops.logical-and-or-not, weight: 1 }
  - { id: js.ops.relational, weight: 0.3 }
tags: [logical-and, write-code]
estimatedSeconds: 180
prompt: |
  수료 기준은 "점수가 60점 이상**이고** 출석률이 80% 이상"이에요. 두 학생의 수료 여부를 계산하는 코드를 작성하세요.

  - 학생 A의 수료 여부를 `passedA`, 학생 B의 수료 여부를 `passedB`라는 상수에 `true`/`false`로 넣으세요.
  - 직접 `true`나 `false`를 쓰지 말고, 위의 점수·출석률 변수와 비교·논리 연산자로 계산해 보세요.
  - 마지막에 두 값을 출력하세요.

  실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  A 수료: true
  B 수료: false
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const scoreA = 72;
          const attendanceA = 85;
          const scoreB = 90;
          const attendanceB = 70;

          // 여기에 passedA와 passedB를 만들고 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          const scoreA = 72;
          const attendanceA = 85;
          const scoreB = 90;
          const attendanceB = 70;

          const passedA = scoreA >= 60 && attendanceA >= 80;
          const passedB = scoreB >= 60 && attendanceB >= 80;
          console.log("A 수료:", passedA);
          console.log("B 수료:", passedB);
  checks:
    - kind: console
      id: output
      description: 두 학생의 수료 여부가 차례로 출력되어야 합니다.
      requirement: 수료 여부 출력
      expect:
        lines: ["A 수료: true", "B 수료: false"]
    - kind: program
      id: values
      description: passedA는 true, passedB는 false여야 하고 오류 없이 끝나야 합니다.
      requirement: 수료 여부 계산
      expect:
        globals:
          passedA: { equals: true }
          passedB: { equals: false }
        noError: true
hints:
  - 수료 기준을 "점수 조건"과 "출석 조건" 두 개의 비교식으로 나눠 보세요.
  - "\"그리고\"로 두 비교식을 묶는 연산자는 무엇이었나요?"
  - "`scoreA >= 60`과 `attendanceA >= 80`을 하나의 식으로 묶어 `passedA`에 넣고, B도 같은 모양으로 만들어 보세요."
explanation: |
  예시 정답이에요.

  ```js
  const passedA = scoreA >= 60 && attendanceA >= 80;
  const passedB = scoreB >= 60 && attendanceB >= 80;
  ```

  비교 연산자는 `&&`보다 먼저 계산되므로 괄호가 없어도 `(scoreA >= 60) && (attendanceA >= 80)`으로 읽혀요.

  - A: `72 >= 60`은 `true`, `85 >= 80`은 `true` → `true && true` → `true`
  - B: `90 >= 60`은 `true`, `70 >= 80`은 `false` → `true && false` → `false`

  B는 점수가 높아도 출석이 모자라서 수료하지 못해요. `||`를 쓰면 B도 `true`가 되어 "둘 다 만족" 규칙과 달라져요.

  `true`/`false`를 직접 써도 이 체크는 통과하지만, 점수가 바뀌면 다시 고쳐야 해요. 규칙을 식으로 써 두면 값이 바뀌어도 자동으로 맞는 결과가 나와요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
