id: js-basics.operators.logical.fix-settings-bugs
type: fix_bug
difficulty: 4
concepts:
  - { id: js.ops.nullish, weight: 1 }
  - { id: js.ops.short-circuit, weight: 0.5 }
  - { id: js.errors.error-messages, weight: 0.3 }
tags: [nullish, short-circuit, syntax-error, debugging]
estimatedSeconds: 480
prompt: |
  게임의 설정을 불러오는 코드에 버그가 **세 개** 있어요. 하나를 고치면 다음 문제가 드러나요. 오류 메시지와 출력을 보며 하나씩 고쳐서 아래처럼 출력되게 하세요.

  규칙: 저장된 값이 없으면(`null`·`undefined`) 기본값을 쓰고, 0처럼 저장된 값이 있으면 그대로 써요. 이름은 저장된 값이 없을 때 `"익명"`이에요.

  ```text
  효과음: 0
  이름: 익명
  테마: light
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          const savedEffectVolume = 0;
          const savedName = null;
          const savedTheme = undefined;

          const effectVolume = savedEffectVolume || 70;
          const playerName = savedName ?? "익명" || "손님";
          const theme = savedTheme && "light";

          console.log("효과음:", effectVolume);
          console.log("이름:", playerName);
          console.log("테마:", theme);
  solution:
    files:
      - path: main.js
        content: |
          const savedEffectVolume = 0;
          const savedName = null;
          const savedTheme = undefined;

          const effectVolume = savedEffectVolume ?? 70;
          const playerName = savedName ?? "익명";
          const theme = savedTheme ?? "light";

          console.log("효과음:", effectVolume);
          console.log("이름:", playerName);
          console.log("테마:", theme);
  bugDescription: "실행하면 아무것도 출력되지 않고 SyntaxError: Unexpected token '||'가 나요. 고치면 다른 문제가 나타나요."
  bugMisconception: js.mc.nullish-same-as-or
  maxEditDistance: 10
  checks:
    - kind: console
      id: output
      description: 효과음, 이름, 테마가 규칙대로 출력되어야 합니다.
      requirement: 설정 출력
      expect:
        lines: ["효과음: 0", "이름: 익명", "테마: light"]
    - kind: program
      id: effect-volume
      description: 저장된 효과음 0이 그대로 남아야 합니다.
      requirement: 0은 지키기
      expect:
        globals:
          effectVolume: { equals: 0 }
      misconceptionIfFail: js.mc.nullish-same-as-or
    - kind: program
      id: name-theme
      description: playerName은 "익명", theme는 "light"여야 하고, 프로그램이 오류 없이 끝나야 합니다.
      requirement: 없는 값은 기본값
      expect:
        globals:
          playerName: { equals: "익명" }
          theme: { equals: "light" }
        noError: true
      misconceptionIfFail: js.mc.logical-returns-boolean
misconceptions: [js.mc.nullish-same-as-or, js.mc.or-default-keeps-zero]
hints:
  - "처음 오류는 `SyntaxError: Unexpected token '||'`예요. `??`를 `||`와 괄호 없이 섞어 쓴 줄을 찾아, 규칙에 필요한 연산자 하나만 남겨 보세요."
  - "문법 오류를 고치면 효과음이 70으로 나와요. 0도 저장된 값인데 기본값으로 바뀐 이유를 `||`의 동작에서 찾아보세요."
  - "마지막으로 테마가 `undefined`로 나와요. `&&`는 왼쪽이 falsy이면 왼쪽 값을 돌려줘요. \"없으면 기본값\"을 고르는 연산자로 바꿔 보세요."
explanation: |
  버그 세 개가 차례로 드러나요.

  1. **`SyntaxError: Unexpected token '||'` (6번 줄)**: `??`를 `||`와 괄호 없이 섞으면 문법 오류예요. 어느 쪽을 먼저 계산할지 헷갈리기 쉬워서 JavaScript가 막아 둔 거예요. 규칙은 "없으면 익명"이니 `const playerName = savedName ?? "익명";`처럼 하나만 남겨요. 문법 오류라 처음에는 아무것도 출력되지 않았어요.
  1. **효과음이 70으로 나옴 (5번 줄)**: `0 || 70`은 `0`이 falsy라 `70`이에요. 0을 지키려면 `savedEffectVolume ?? 70`이에요.
  1. **테마가 `undefined`로 나옴 (7번 줄)**: `undefined && "light"`는 왼쪽이 falsy라 왼쪽 값 `undefined`를 돌려줘요. 기본값은 `savedTheme ?? "light"`로 정해요(여기서는 `||`도 같은 결과예요).

  `(savedName ?? "익명") || "손님"`처럼 괄호를 넣어도 문법 오류는 사라지고 결과도 `"익명"`이라 통과해요. 다만 "손님"은 쓰일 일이 없으니 지우는 편이 깔끔해요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
