id: js-basics.operators.logical.try-library-rules
type: implement_function
difficulty: 2
usage: try
concepts:
  - { id: js.ops.logical-and-or-not, weight: 1 }
tags: [logical-and, logical-or, logical-not, write-code]
estimatedSeconds: 210
prompt: |
  도서관의 두 가지 규칙을 논리 연산자로 옮겨 보세요. `true`/`false`를 직접 쓰지 말고 시작 코드의 변수와 `&&`, `||`, `!`로 계산해요.

  | 변수 | 규칙 |
  |---|---|
  | `canBorrow` | 회원**이고**, 연체한 책이 **없어야** 빌릴 수 있어요 |
  | `isClosed` | 주말**이거나** 공휴일이면 문을 닫아요 |

  실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  대출 가능: false
  휴관: true
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const isMember = true;
          const hasOverdue = true;   // 연체한 책이 있어요
          const isWeekend = false;
          const isHoliday = true;

          // 1. canBorrow: 회원이고, 연체한 책이 없어야 해요.

          // 2. isClosed: 주말이거나 공휴일이에요.

          console.log("대출 가능:", canBorrow);
          console.log("휴관:", isClosed);
  solution:
    files:
      - path: main.js
        content: |
          const isMember = true;
          const hasOverdue = true;   // 연체한 책이 있어요
          const isWeekend = false;
          const isHoliday = true;

          // 1. canBorrow: 회원이고, 연체한 책이 없어야 해요.
          const canBorrow = isMember && !hasOverdue;
          // 2. isClosed: 주말이거나 공휴일이에요.
          const isClosed = isWeekend || isHoliday;
          console.log("대출 가능:", canBorrow);
          console.log("휴관:", isClosed);
  checks:
    - kind: program
      id: borrow
      description: 연체한 책이 있으므로 canBorrow는 false여야 합니다.
      requirement: 대출 규칙
      expect: { globals: { canBorrow: { equals: false } }, noError: true }
    - kind: program
      id: closed
      description: 공휴일이므로 isClosed는 true여야 합니다.
      requirement: 휴관 규칙
      expect: { globals: { isClosed: { equals: true } }, noError: true }
    - kind: console
      id: output
      description: 대출 가능 여부와 휴관 여부가 정해진 모양으로 두 줄 출력되어야 합니다.
      requirement: 출력
      expect:
        lines: ["대출 가능: false", "휴관: true"]
hints:
  - "\"그리고\"는 `&&`, \"또는\"은 `||`, \"아니다\"는 `!`예요."
  - "\"연체한 책이 없다\"는 `hasOverdue`를 뒤집은 값이에요. `!`는 바로 뒤의 값 하나에 붙어요."
  - "`const canBorrow = isMember && !hasOverdue;`처럼 써요. `isClosed`는 `||`로 두 변수를 묶어요."
explanation: |
  예시 답안은 다음과 같아요.

  ```js
  const canBorrow = isMember && !hasOverdue;   // true && !true → true && false → false
  const isClosed = isWeekend || isHoliday;     // false || true → true
  ```

  - `!`가 `&&`보다 먼저 계산되어 `!hasOverdue`가 `false`가 되고, `&&`는 하나라도 거짓이면 거짓이에요.
  - `||`는 하나라도 참이면 참이에요. 공휴일이니 휴관이에요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
