id: js-basics.operators.implicit-coercion.fix-sum-strings
type: fix_bug
difficulty: 2
concepts:
  - { id: js.conv.plus-concat, weight: 1 }
  - { id: js.conv.to-number, weight: 0.5 }
tags: [plus, concat, to-number]
estimatedSeconds: 120
prompt: |
  이번 주 걸음 수를 합하는 프로그램이에요. 기록 앱에서 받은 값이 문자열이라 합계가 이상하게 나와요. 버그를 고쳐서 아래처럼 출력되게 하세요.

  ```text
  두 날의 걸음 수: 12000
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          const mondaySteps = "5000";
          const tuesdaySteps = "7000";
          const totalSteps = mondaySteps + tuesdaySteps;
          console.log("두 날의 걸음 수:", totalSteps);
  solution:
    files:
      - path: main.js
        content: |
          const mondaySteps = "5000";
          const tuesdaySteps = "7000";
          const totalSteps = Number(mondaySteps) + Number(tuesdaySteps);
          console.log("두 날의 걸음 수:", totalSteps);
  bugDescription: 합계가 12000이 아니라 50007000으로 나와요.
  bugMisconception: js.mc.plus-string-adds
  checks:
    - kind: console
      id: output
      description: 두 날의 걸음 수를 더한 값이 출력되어야 합니다.
      requirement: 합계 출력
      expect:
        lines: ["두 날의 걸음 수: 12000"]
    - kind: program
      id: total-number
      description: totalSteps에는 숫자 12000이 들어 있어야 합니다(문자열이 아님).
      requirement: 숫자 합계
      expect:
        globals:
          totalSteps: { equals: 12000 }
        noError: true
misconceptions: [js.mc.plus-string-adds]
hints:
  - "`mondaySteps`와 `tuesdaySteps`의 자료형은 무엇인가요? 따옴표를 확인해 보세요."
  - 문자열끼리 `+`를 하면 더하지 않고 이어 붙여요.
  - 더하기 전에 지난 단원에서 배운 방법으로 두 값을 숫자로 바꿔 보세요.
explanation: |
  두 값이 모두 문자열이라 3번 줄의 `+`가 더하지 않고 `"5000"`과 `"7000"`을 이어 붙였어요. 그래서 `"50007000"`이 됐어요.

  더하기 전에 숫자로 바꾸면 돼요.

  ```js
  const totalSteps = Number(mondaySteps) + Number(tuesdaySteps);
  ```

  1·2번 줄의 따옴표를 지워도 이 프로그램은 맞게 동작하지만, 실제로는 외부에서 받은 값을 고칠 수 없는 경우가 많아요. 받은 문자열을 `Number`로 바꾸는 습관을 들여요. 한쪽만 바꾸면 `5000 + "7000"`이 되어 여전히 이어 붙여지니 양쪽 모두 바꿔야 해요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
