id: js-basics.operators.implicit-coercion.impl-count-filled
type: implement_function
difficulty: 4
concepts:
  - { id: js.conv.truthy-falsy, weight: 1 }
  - { id: js.conv.to-boolean, weight: 0.5 }
  - { id: js.ops.logical-and-or-not, weight: 0.3 }
tags: [truthy, falsy, write-code]
estimatedSeconds: 300
prompt: |
  회원 정보 입력 화면에 이름(`name`), 이메일(`email`), 전화번호(`phone`) 칸이 있어요. 입력칸의 값은 문자열이고, 이 화면의 규칙은 **"빈 문자열 `""`이 아니면 채운 칸"**이에요.

  시작 코드 아래에 다음 두 변수를 만들고 출력하세요.

  1. `filledCount`: 채운 칸의 개수(숫자)
  1. `allFilled`: 세 칸을 모두 채웠으면 `true`, 아니면 `false`

  실행하면 콘솔에 아래처럼 나와야 해요. 위의 세 값을 바꿔도 맞게 계산되도록, 결과 숫자를 직접 쓰지 말고 변수로 계산해 보세요.

  ```text
  채운 칸: 2
  모두 채움: false
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const name = "코코";
          const email = "";
          const phone = " ";

          // filledCount와 allFilled를 만들고 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          const name = "코코";
          const email = "";
          const phone = " ";

          const filledCount = Number(Boolean(name)) + Number(Boolean(email)) + Number(Boolean(phone));
          const allFilled = Boolean(name) && Boolean(email) && Boolean(phone);

          console.log("채운 칸:", filledCount);
          console.log("모두 채움:", allFilled);
  checks:
    - kind: console
      id: output
      description: 채운 칸의 개수와 모두 채웠는지가 차례로 출력되어야 합니다.
      requirement: 결과 출력
      expect:
        lines: ["채운 칸: 2", "모두 채움: false"]
      misconceptionIfFail: js.mc.space-string-falsy
    - kind: program
      id: values
      description: filledCount는 숫자 2, allFilled는 불리언 false여야 합니다.
      requirement: 계산한 값
      expect:
        globals:
          filledCount: { strictEquals: 2 }
          allFilled: { strictEquals: false }
        noError: true
misconceptions: [js.mc.space-string-falsy]
hints:
  - 세 값이 각각 truthy인지 falsy인지 먼저 표로 정리해 보세요. 공백 한 칸은 글자인가요?
  - "`Boolean(값)`으로 true/false를 만들고, `Number(true)`는 1, `Number(false)`는 0이라는 점을 이용하면 개수를 셀 수 있어요."
  - "`allFilled`는 \"셋 다 참\"이므로 세 불리언을 `&&`로 이어요. `&&`가 값 그대로를 돌려준다는 점도 생각해서, 결과가 불리언이 되게 하세요."
explanation: |
  예시 정답이에요.

  ```js
  const filledCount = Number(Boolean(name)) + Number(Boolean(email)) + Number(Boolean(phone));
  const allFilled = Boolean(name) && Boolean(email) && Boolean(phone);
  ```

  | 변수 | 값 | 채운 칸? |
  |---|---|---|
  | `name` | `"코코"` | truthy → 채움 |
  | `email` | `""` | falsy → 안 채움 |
  | `phone` | `" "` | 공백도 글자라 truthy → 채움 |

  그래서 `filledCount`는 1 + 0 + 1 = 2예요. `phone`을 빈 칸으로 보고 1이라고 계산했다면 공백 문자열을 falsy로 생각한 거예요. 이 화면의 규칙("빈 문자열이 아니면 채운 칸")에서는 공백만 넣어도 채운 칸이에요. 공백을 걸러 내는 방법은 문자열 메서드 단원에서 배워요.

  - `!!name + !!email + !!phone`처럼 써도 돼요. `+`는 양쪽에 문자열이 없으면 불리언을 숫자로 바꿔 더하기 때문이에요.
  - `allFilled`를 `name && email && phone`으로만 쓰면 결과가 불리언이 아니라 `""`(첫 번째 falsy 값)가 돼요. `&&`는 값 그대로를 돌려주기 때문이에요. `Boolean(...)`이나 `!!(...)`으로 감싸야 `false`가 돼요.
origin: authored
