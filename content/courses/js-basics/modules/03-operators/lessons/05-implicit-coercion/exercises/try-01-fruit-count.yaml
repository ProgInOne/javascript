id: js-basics.operators.implicit-coercion.try-fruit-count
type: implement_function
difficulty: 2
usage: try
concepts:
  - { id: js.conv.plus-concat, weight: 1 }
  - { id: js.conv.to-number, weight: 0.3 }
tags: [plus, concat, number, write-code]
estimatedSeconds: 240
prompt: |
  입력칸에서 읽은 사과 개수 `"5"`와 배 개수 `"7"`은 문자열이에요. 두 개수를 **숫자로 더한** 합계를 구하고, 그 합계로 안내 문장을 만들어 출력해 보세요.

  실행하면 콘솔에 아래 한 줄이 나와야 해요.

  ```text
  과일 12개
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const appleText = "5";
          const pearText = "7";

          // 1. 두 값을 숫자로 바꿔 더한 값을 total에 넣으세요.

          // 2. "과일 ", total, "개"를 +로 이어 붙여 message에 넣으세요.

          // 3. message를 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          const appleText = "5";
          const pearText = "7";
          const total = Number(appleText) + Number(pearText);
          const message = "과일 " + total + "개";
          console.log(message);
  checks:
    - kind: program
      id: total
      description: total에는 문자열이 아니라 숫자 12가 들어 있어야 합니다. 문자열끼리 +로 더하면 "57"처럼 이어 붙여져요.
      requirement: 숫자로 더하기
      misconceptionIfFail: js.mc.plus-string-adds
      expect:
        globals:
          total: { equals: 12 }
        noError: true
    - kind: program
      id: message
      description: message에는 문자열 "과일 12개"가 들어 있어야 합니다.
      requirement: 안내 문장 만들기
      expect:
        globals:
          message: { equals: "과일 12개" }
        noError: true
    - kind: console
      id: output
      description: 콘솔에 `과일 12개` 한 줄이 출력되어야 합니다.
      requirement: 출력
      expect:
        lines: ["과일 12개"]
misconceptions: [js.mc.plus-string-adds]
hints:
  - 문자열끼리 `+`를 하면 이어 붙여져요. 더하기 전에 무엇을 해야 할까요?
  - "`Number(appleText)`처럼 각각 숫자로 바꾼 다음 `+`로 더해요."
  - "문장은 `\"과일 \" + total + \"개\"`처럼 써요. 왼쪽부터 문자열이 있으니 이어 붙이기가 돼요."
explanation: |
  예시 답안은 다음과 같아요.

  ```js
  const total = Number(appleText) + Number(pearText);
  const message = "과일 " + total + "개";
  console.log(message);
  ```

  - `appleText + pearText`라고 쓰면 문자열끼리라서 `"57"`이 돼요. `Number`로 먼저 바꿔야 `5 + 7`을 더해 `12`가 나와요.
  - `"과일 " + total + "개"`는 첫 단계부터 문자열이 있어서 끝까지 이어 붙여 `"과일 12개"`가 돼요.
  - 만약 `"과일 " + Number(appleText) + Number(pearText) + "개"`처럼 한 줄에 쓰면 왼쪽부터 이어 붙여 `"과일 57개"`가 돼요. 합계를 먼저 따로 구해 두거나 괄호로 감싸야 해요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
