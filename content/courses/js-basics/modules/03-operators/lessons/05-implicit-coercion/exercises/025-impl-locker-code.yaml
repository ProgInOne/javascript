id: js-basics.operators.implicit-coercion.impl-locker-code
type: implement_function
difficulty: 3
concepts:
  - { id: js.conv.equality-coercion, weight: 1 }
  - { id: js.ops.strict-equality, weight: 0.5 }
tags: [loose-equality, strict-equality, write-code]
estimatedSeconds: 240
prompt: |
  사물함 비밀번호를 확인하는 프로그램이에요. 저장된 비밀번호 `savedCode`는 문자열 `"007"`이고, **앞의 0까지 글자 그대로 똑같아야** 열려요.

  두 사람이 비밀번호를 입력했어요.

  - `typedText`: 화면 입력칸에서 받은 문자열 `"007"`
  - `typedNumber`: 숫자 키패드에서 받은 숫자 `7` (앞의 0이 사라졌어요)

  시작 코드 아래에 `firstOpens`(첫 번째 사람이 열 수 있는가)와 `secondOpens`(두 번째 사람이 열 수 있는가)를 비교 연산으로 만들고 출력하세요. 실행하면 아래처럼 나와야 해요.

  ```text
  첫 번째: true
  두 번째: false
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const savedCode = "007";
          const typedText = "007";
          const typedNumber = 7;

          // firstOpens와 secondOpens를 만들고 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          const savedCode = "007";
          const typedText = "007";
          const typedNumber = 7;

          const firstOpens = typedText === savedCode;
          const secondOpens = typedNumber === savedCode;

          console.log("첫 번째:", firstOpens);
          console.log("두 번째:", secondOpens);
  checks:
    - kind: console
      id: output
      description: 첫 번째 사람은 열 수 있고(true) 두 번째 사람은 열 수 없다고(false) 출력되어야 합니다.
      requirement: 결과 출력
      expect:
        lines: ["첫 번째: true", "두 번째: false"]
      misconceptionIfFail: js.mc.loose-equals-like-strict
    - kind: program
      id: values
      description: firstOpens는 true, secondOpens는 false인 불리언이어야 합니다.
      requirement: 비교 결과
      expect:
        globals:
          firstOpens: { equals: true }
          secondOpens: { equals: false }
        noError: true
misconceptions: [js.mc.loose-equals-like-strict]
hints:
  - 두 번째 사람의 값은 숫자 `7`, 저장된 값은 문자열 `"007"`이에요. 자료형이 같나요?
  - "`7 == \"007\"`을 `==`의 규칙대로 바꿔 보세요. 문자열 `\"007\"`을 숫자로 바꾸면 무엇이 되나요?"
  - 글자 그대로 똑같아야 하므로, 자료형을 바꾸지 않고 비교하는 연산자를 쓰세요.
explanation: |
  예시 정답이에요.

  ```js
  const firstOpens = typedText === savedCode;
  const secondOpens = typedNumber === savedCode;
  ```

  `==`로 비교하면 두 번째도 `true`가 돼요. `7 == "007"`에서 `==`가 문자열 `"007"`을 숫자 `7`로 바꾸기 때문이에요. 앞의 0이 사라진 비밀번호로 사물함이 열려 버리는 버그예요.

  `===`는 자료형을 바꾸지 않으므로 숫자 `7`과 문자열 `"007"`은 다르다고(`false`) 판단해요. `String(typedNumber) === savedCode`처럼 문자열로 바꿔 비교해도 `"7"`과 `"007"`이 달라서 정답이에요.

  값을 비교할 때는 `===`를 기본으로 쓰고, 다른 자료형끼리 비교해야 한다면 직접 변환한 뒤 `===`로 비교해요.
origin: authored
review:
