id: js-basics.operators.implicit-coercion.predict-left-to-right
type: predict_output
difficulty: 2
concepts:
  - { id: js.conv.plus-concat, weight: 1 }
tags: [plus, concat, order]
estimatedSeconds: 60
prompt: |
  다음 코드가 끝났을 때 `result`에 들어 있는 값은 무엇인가요? 문자열이면 `"abc"`처럼 따옴표를 붙여서, 숫자면 따옴표 없이 답하세요.
spec:
  lang: js
  code: |
    const result = 1 + 2 + "3";
  answerKind: value
  expression: result
  misconceptionByAnswer:
    '"123"': js.mc.concat-whole-expression
    "6": js.mc.plus-string-adds
    "33": js.mc.plus-string-adds
misconceptions: [js.mc.concat-whole-expression]
hints:
  - "`+`가 두 개예요. 어느 것부터 계산할까요?"
  - 왼쪽부터 두 값씩 계산하고, 단계마다 양쪽의 자료형을 확인하세요.
  - "첫 단계 `1 + 2`는 양쪽이 모두 숫자예요. 그 결과와 `\"3\"`을 더하면요?"
explanation: |
  정답은 **`"33"`**(문자열)이에요.

  | 단계 | 계산 | 결과 |
  |---|---|---|
  | 1 | `1 + 2` (숫자끼리) | 숫자 `3` |
  | 2 | `3 + "3"` (한쪽이 문자열) | 문자열 `"33"` |

  - `"123"`이라고 답했다면 문자열이 하나라도 있으면 처음부터 전부 이어 붙인다고 생각한 거예요. `+`는 왼쪽부터 한 단계씩 계산하므로, 문자열을 만나기 전의 `1 + 2`는 덧셈이에요.
  - `6`이나 따옴표 없는 `33`이라고 답했다면 `"3"`을 숫자처럼 본 거예요. 마지막 단계에서 문자열과 만났으니 결과는 문자열이에요.
