id: js-basics.operators.implicit-coercion.we-truthy-falsy-2
type: implement_function
difficulty: 2
concepts:
  - { id: js.conv.truthy-falsy, weight: 1 }
tags: [truthy-falsy, worked-example, write-code]
estimatedSeconds: 200
usage: worked_example
workedExampleStage: 2
prompt: |
  **풀이 예제 3단계: 직접 풀기**

  게시글 저장 전에 입력값을 확인하려고 해요. 시작 코드의 변수를 이용해 이어서 쓰세요.

  1. 네 값 `title`, `likes`, `body`, `tag`가 각각 truthy인지 `!!`로 바꿔 **한 줄에** 출력하세요.
  1. 좋아요 수 `likes`가 truthy인지를 변수 `hasLikes`에 담으세요.

  실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  true false true false
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const title = "0";
          const likes = 0;
          const body = "  ";
          const tag = null;

          // 여기에 이어서 쓰세요.
  solution:
    files:
      - path: main.js
        content: |
          const title = "0";
          const likes = 0;
          const body = "  ";
          const tag = null;

          // 여기에 이어서 쓰세요.
          console.log(!!title, !!likes, !!body, !!tag);
          const hasLikes = !!likes;
  checks:
    - kind: console
      id: output
      description: "\"true false true false\"가 출력되어야 합니다."
      requirement: truthy·falsy 출력
      expect:
        lines: ["true false true false"]
      misconceptionIfFail: js.mc.string-zero-falsy
    - kind: program
      id: values
      description: 프로그램이 오류 없이 끝나고, hasLikes에는 false가 들어 있어야 합니다.
      requirement: 판단 결과 담기
      expect:
        globals:
          hasLikes: { equals: false }
        noError: true
misconceptions: [js.mc.string-zero-falsy, js.mc.space-string-falsy]
hints:
  - 앞 단계처럼 값마다 falsy 여섯 개 목록에 있는지 확인하세요.
  - "`\"0\"`과 `\"  \"`는 글자가 든 문자열, `0`과 `null`은 falsy 목록에 있는 값이에요."
  - "`console.log(!!title, !!likes, !!body, !!tag);`를 쓰고, `const hasLikes = !!likes;`를 써요."
explanation: |
  예시 정답은 다음과 같아요.

  ```js
  console.log(!!title, !!likes, !!body, !!tag);
  const hasLikes = !!likes;
  ```

  - `"0"`: 글자 "0"이 든 문자열이라 truthy예요.
  - `0`: falsy예요.
  - `"  "`: 공백도 글자라서 truthy예요. 공백만 있는 입력을 "비었다"고 처리하려면 공백을 지우는 방법이 필요한데, 문자열 메서드에서 배워요.
  - `null`: falsy예요.

  앞 두 단계와 같은 판단 방법이에요. 원래 연습으로 돌아가 다시 풀어 보세요.
origin: authored
review:
