id: js-basics.operators.implicit-coercion.multi-falsy-values
type: mcq_multi
difficulty: 2
concepts:
  - { id: js.conv.truthy-falsy, weight: 1 }
tags: [truthy, falsy]
estimatedSeconds: 60
prompt: |
  다음 중 **falsy**인 값을 모두 고르세요.
spec:
  options:
    - id: a
      text: "`0`"
    - id: b
      text: "`\"\"` (빈 문자열)"
    - id: c
      text: "`NaN`"
    - id: d
      text: "`\"0\"`"
      misconception: js.mc.string-zero-falsy
      rationale: 글자 `0`이 들어 있는 문자열이라 truthy예요.
    - id: e
      text: "`[]` (빈 배열)"
      misconception: js.mc.empty-array-falsy
      rationale: 배열은 비어 있어도 truthy예요.
    - id: f
      text: "`\"false\"`"
      misconception: js.mc.boolean-reads-string-content
      rationale: 글자의 뜻은 보지 않아요. 글자가 있으니 truthy예요.
  correct: [a, b, c]
misconceptions: [js.mc.string-zero-falsy, js.mc.empty-array-falsy, js.mc.boolean-reads-string-content]
hints:
  - 정답이 하나가 아닐 수 있어요. falsy 값 목록과 하나씩 대조해 보세요.
  - 문자열은 따옴표 안에 글자가 있는지만 보면 돼요.
  - 숫자 중 falsy는 두 개, 문자열 중 falsy는 하나뿐이에요. 배열은 falsy 목록에 있었나요?
explanation: |
  정답은 **`0`, `""`, `NaN`**이에요.

  falsy 값은 `false`, `0`, `""`, `null`, `undefined`, `NaN`뿐이에요.

  - `"0"`과 `"false"`: 글자가 들어 있는 문자열이라 truthy예요. JavaScript는 문자열의 뜻을 읽지 않아요.
  - `[]`: 배열은 비어 있어도 truthy예요. "비어 있다"와 "falsy"는 다른 개념이에요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
