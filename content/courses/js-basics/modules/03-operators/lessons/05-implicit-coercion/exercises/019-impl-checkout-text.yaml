id: js-basics.operators.implicit-coercion.impl-checkout-text
type: implement_function
difficulty: 4
concepts:
  - { id: js.conv.plus-concat, weight: 1 }
  - { id: js.conv.to-number, weight: 0.5 }
  - { id: js.ops.precedence, weight: 0.3 }
tags: [plus, concat, to-number, write-code]
estimatedSeconds: 420
prompt: |
  온라인 서점의 결제 화면이에요. 입력칸에서 읽은 값은 모두 문자열이고, 쿠폰 칸은 비어 있어요(`""`). 빈 쿠폰 칸은 할인 0원으로 계산해요.

  시작 코드 아래에 다음을 만드세요.

  1. `goodsPrice`: 책 가격 × 수량 (숫자)
  1. `total`: 상품 금액 − 쿠폰 할인 + 배송비 (숫자)
  1. `points`: 상품 금액(`goodsPrice`)의 1%를 적립 포인트로 (숫자)
  1. 아래 두 줄을 출력하세요.

  ```text
  결제 금액: 15000원
  적립 포인트: 120점
  ```

  쿠폰 값을 `"1000"`처럼 바꿔도 맞게 계산되도록, 결과 숫자를 직접 쓰지 말고 변수로 계산해 보세요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          const priceText = "6000";
          const countText = "2";
          const couponText = "";
          const shippingFee = 3000;

          // goodsPrice, total, points를 만들고 두 줄을 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          const priceText = "6000";
          const countText = "2";
          const couponText = "";
          const shippingFee = 3000;

          const goodsPrice = Number(priceText) * Number(countText);
          const total = goodsPrice - Number(couponText) + shippingFee;
          const points = goodsPrice / 100;

          console.log("결제 금액: " + total + "원");
          console.log("적립 포인트: " + points + "점");
  checks:
    - kind: console
      id: output
      description: 결제 금액과 적립 포인트가 정해진 형태로 두 줄 출력되어야 합니다.
      requirement: 결제 정보 출력
      expect:
        lines: ["결제 금액: 15000원", "적립 포인트: 120점"]
      misconceptionIfFail: js.mc.plus-string-adds
    - kind: program
      id: values
      description: goodsPrice는 12000, total은 15000, points는 120인 숫자여야 합니다.
      requirement: 계산한 값
      expect:
        globals:
          goodsPrice: { equals: 12000 }
          total: { equals: 15000 }
          points: { equals: 120 }
        noError: true
misconceptions: [js.mc.plus-string-adds, js.mc.empty-string-to-nan]
hints:
  - 세 입력값의 자료형을 먼저 확인하세요. 빈 쿠폰 칸 `""`을 숫자로 바꾸면 무엇이 되는지도 떠올려 보세요.
  - "`-`와 `*`는 문자열을 숫자로 바꿔 주지만 `+`는 이어 붙여요. 어떤 연산자를 만날지 매번 따지지 말고, 계산에 쓰는 값은 모두 미리 `Number`로 바꿔 두세요."
  - 1%는 100으로 나눈 값이에요. 출력 줄은 계산이 끝난 변수를 글자와 이어 붙여 만드세요.
explanation: |
  예시 정답이에요.

  ```js
  const goodsPrice = Number(priceText) * Number(countText);
  const total = goodsPrice - Number(couponText) + shippingFee;
  const points = goodsPrice / 100;

  console.log("결제 금액: " + total + "원");
  console.log("적립 포인트: " + points + "점");
  ```

  - 빈 문자열 `""`은 `Number`로 바꾸면 `0`이에요. 그래서 쿠폰이 없으면 할인 0원으로 계산돼요.
  - `goodsPrice - couponText`처럼 바꾸지 않은 문자열을 써도 `-`가 숫자로 바꿔 주어서 이번에는 맞아요. 하지만 나중에 식이 바뀌어 이 문자열이 `+`와 만나면 더하지 않고 이어 붙여져요. 계산 전에 모두 `Number`로 바꾸면 이런 고민이 없어요.
  - `"결제 금액: " + goodsPrice - couponText + shippingFee`처럼 출력 줄에서 바로 계산하면, 왼쪽부터 `"결제 금액: 12000"`이 먼저 만들어지고 거기서 빼기를 하려다 `NaN`이 돼요. 계산은 변수에서 끝내고 이어 붙여요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
