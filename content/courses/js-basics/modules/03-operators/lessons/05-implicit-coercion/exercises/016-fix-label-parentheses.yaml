id: js-basics.operators.implicit-coercion.fix-label-parentheses
type: fix_bug
difficulty: 3
concepts:
  - { id: js.conv.plus-concat, weight: 1 }
  - { id: js.ops.precedence, weight: 0.3 }
tags: [plus, concat, parentheses]
estimatedSeconds: 150
prompt: |
  장바구니에 담은 사과와 배의 개수를 합쳐서 보여 주는 프로그램이에요. 버그를 고쳐서 아래처럼 출력되게 하세요.

  ```text
  사과 2개, 배 3개
  모두 5개
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          const apples = 2;
          const pears = 3;
          console.log("사과 " + apples + "개, 배 " + pears + "개");
          console.log("모두 " + apples + pears + "개");
  solution:
    files:
      - path: main.js
        content: |
          const apples = 2;
          const pears = 3;
          console.log("사과 " + apples + "개, 배 " + pears + "개");
          console.log("모두 " + (apples + pears) + "개");
  bugDescription: 둘째 줄에 "모두 5개"가 아니라 "모두 23개"가 나와요.
  bugMisconception: js.mc.concat-whole-expression
  maxEditDistance: 4
  checks:
    - kind: console
      id: output
      description: 과일별 개수와 합계가 두 줄로 출력되어야 합니다.
      requirement: 개수 출력
      expect:
        lines: ["사과 2개, 배 3개", "모두 5개"]
misconceptions: [js.mc.concat-whole-expression]
hints:
  - "`apples`와 `pears`는 숫자인데도 왜 더해지지 않았을까요? 4번 줄을 왼쪽부터 한 단계씩 계산해 보세요."
  - "첫 단계 `\"모두 \" + apples`의 결과는 문자열이에요. 그다음 `+ pears`는 무엇을 할까요?"
  - 두 숫자를 문자열과 만나기 전에 먼저 더하도록 계산 순서를 바꿔야 해요. 산술 연산 단원에서 계산 순서를 바꾸는 방법을 배웠어요.
explanation: |
  4번 줄은 왼쪽부터 이렇게 계산돼요.

  | 단계 | 계산 | 결과 |
  |---|---|---|
  | 1 | `"모두 " + apples` | `"모두 2"` |
  | 2 | `"모두 2" + pears` | `"모두 23"` |
  | 3 | `"모두 23" + "개"` | `"모두 23개"` |

  `apples`와 `pears`는 숫자지만, 문자열 `"모두 "`과 먼저 만나서 하나씩 이어 붙여졌어요. 괄호로 덧셈을 먼저 하게 고쳐요.

  ```js
  console.log("모두 " + (apples + pears) + "개");
  ```

  `const total = apples + pears;`로 먼저 계산해 두고 `"모두 " + total + "개"`처럼 써도 정답이에요.
origin: authored
review:
