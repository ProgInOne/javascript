id: js-basics.operators.implicit-coercion
title: 암묵적 형 변환
summary: 연산자가 알아서 자료형을 바꾸는 규칙(truthy·falsy, +의 이어 붙이기, ==의 변환)을 익혀 예상 밖의 결과를 예측하고 고칩니다.
kind: lesson
importance: core
estimatedMinutes: { read: 15, practice: 30 }
concepts:
  primary: [js.conv.truthy-falsy, js.conv.plus-concat, js.conv.equality-coercion]
  reviewed: [js.conv.to-number, js.conv.to-boolean, js.ops.short-circuit, js.ops.loose-equality]
objectives:
  - 어떤 값이 falsy이고 어떤 값이 truthy인지 구분하고, 논리 연산의 결과를 예측할 수 있다.
  - "+가 덧셈과 이어 붙이기 중 무엇을 할지 왼쪽부터 따라가며 예측하고, 입력값을 Number로 바꿔 버그를 고칠 수 있다."
  - "==가 값을 바꿔 비교하는 규칙으로 결과를 설명하고, ===로 바꿔 쓸 수 있다."
practice:
  targetCount: 26
