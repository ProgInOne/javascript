id: js-basics.operators.explicit-conversion
title: 명시적 형 변환
summary: Number, parseInt, String, Boolean으로 값의 자료형을 직접 바꾸고, 변환이 실패했을 때 나오는 NaN을 다룹니다.
kind: lesson
importance: standard
estimatedMinutes: { read: 12, practice: 20 }
concepts:
  primary: [js.conv.to-number, js.conv.to-string, js.conv.to-boolean, js.conv.nan]
  reviewed: [js.ops.arithmetic, js.ops.strict-equality, js.ops.logical-and-or-not]
objectives:
  - Number와 parseInt·parseFloat로 문자열을 숫자로 바꾸고, 두 방법의 결과 차이를 예측할 수 있다.
  - String과 Boolean으로 값을 글자나 참·거짓으로 바꾼 결과를 예측할 수 있다.
  - NaN이 생기는 상황을 설명하고, Number.isNaN으로 변환이 실패했는지 확인할 수 있다.
practice:
  targetCount: 20
