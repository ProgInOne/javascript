id: js-basics.operators.explicit-conversion.multi-nan-facts
type: mcq_multi
difficulty: 1
concepts:
  - { id: js.conv.nan, weight: 1 }
tags: [nan]
estimatedSeconds: 60
prompt: |
  `NaN`에 대한 설명으로 맞는 것을 모두 고르세요.
spec:
  options:
    - id: a
      text: "`typeof NaN`의 결과는 `\"number\"`다"
      missedMisconception: js.mc.nan-type-not-number
    - id: b
      text: "`NaN`과 계산한 결과(`NaN * 2` 등)도 `NaN`이다"
    - id: c
      text: "`Number(\"abc\")`처럼 숫자로 바꿀 수 없으면 오류가 나고 프로그램이 멈춘다"
      misconception: js.mc.failed-conversion-throws
      rationale: 오류 없이 NaN이 나오고 프로그램은 계속 실행돼요.
    - id: d
      text: "`x === NaN`으로 `x`가 `NaN`인지 확인할 수 있다"
      misconception: js.mc.nan-equals-nan
      rationale: NaN은 자기 자신과도 같지 않아서 이 식은 항상 false예요. Number.isNaN(x)를 써요.
    - id: e
      text: "`typeof NaN`의 결과는 `\"NaN\"`이다"
      misconception: js.mc.nan-type-not-number
      rationale: NaN은 숫자 자료형의 특별한 값이라 typeof 결과는 "number"예요.
  correct: [a, b]
misconceptions: [js.mc.nan-type-not-number, js.mc.failed-conversion-throws]
hints:
  - 정답이 하나가 아닐 수 있어요. NaN은 "숫자 계산이 실패했다"는 표시라는 점에서 출발해 보세요.
  - 변환에 실패했을 때 프로그램이 멈추는지, 조용히 계속되는지 떠올려 보세요.
  - NaN은 자기 자신과 비교해도 같지 않다는 성질이 있어요. 그렇다면 `===`로 확인할 수 있을까요?
explanation: |
  정답은 **a, b**예요.

  - a: `NaN`은 "숫자 계산이 실패했다"를 나타내는 **숫자 자료형**의 값이라 `typeof NaN`은 `"number"`예요. 그래서 e는 틀렸어요.
  - b: `NaN`은 퍼져요. `NaN`과 무엇을 계산해도 결과는 `NaN`이에요.
  - c는 틀렸어요: 숫자로 바꿀 수 없어도 오류는 나지 않고 `NaN`이 나와요. 그래서 마지막 출력에서 `NaN`을 보면 처음 생긴 곳을 거슬러 올라가 찾아야 해요.
  - d는 틀렸어요: `NaN === NaN`은 `false`라서 `x === NaN`은 언제나 `false`예요. `Number.isNaN(x)`로 확인해요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
