id: js-basics.operators.explicit-conversion.predict-string-of-null
type: predict_output
difficulty: 2
concepts:
  - { id: js.conv.to-string, weight: 1 }
tags: [string, null-value]
estimatedSeconds: 50
prompt: |
  다음 프로그램이 끝났을 때 `label`에 들어 있는 값은 무엇인가요? 문자열이면 따옴표를 붙여서(예: `"안녕"`) 답하세요.
spec:
  lang: js
  code: |
    const memo = null;
    const label = String(memo);
  answerKind: value
  expression: label
  misconceptionByAnswer:
    '""': js.mc.string-of-null-empty
    "null": js.mc.string-of-null-empty
hints:
  - String의 결과는 항상 어떤 자료형인가요? 그러면 답에 따옴표가 필요할까요?
  - String은 값의 뜻이 아니라 보이는 모습을 그대로 글자로 바꿔요.
  - console.log(null)을 하면 콘솔에 보이는 네 글자를 떠올려 보세요.
explanation: |
  정답은 **`"null"`**(네 글자로 된 문자열)이에요.

  `String(값)`은 값을 보이는 그대로 글자로 바꿔요. `null`은 빈 문자열이 아니라 `"null"`이라는 글자가 돼요.

  - `""`라고 답했다면: null이 "없음"을 뜻하니 빈 글자가 될 것 같지만, String은 뜻을 해석하지 않아요. 화면에 `null`이 그대로 찍히는 버그가 여기서 생겨요.
  - 따옴표 없이 `null`이라고 답했다면: 그건 바뀌기 전의 값 null이에요. String의 결과는 항상 문자열이에요.
origin: authored
