id: js-basics.operators.explicit-conversion.impl-convert-inputs
type: implement_function
difficulty: 2
concepts:
  - { id: js.conv.to-number, weight: 1 }
  - { id: js.ops.arithmetic, weight: 0.3 }
tags: [number, write-code]
estimatedSeconds: 180
prompt: |
  회원 정보 폼에서 꺼낸 나이(`ageText`)와 키(`heightText`)는 문자열이에요. 두 값을 **숫자로 바꿔** `age`와 `height` 변수에 넣고, 아래처럼 출력하는 프로그램을 완성하세요.

  ```text
  내년 나이: 18
  키: 172.5
  ```

  내년 나이는 `age`에 1을 더해 계산하세요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          const ageText = "17";
          const heightText = "172.5";
          // 여기에 age와 height를 만들고 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          const ageText = "17";
          const heightText = "172.5";
          const age = Number(ageText);
          const height = Number(heightText);
          console.log("내년 나이:", age + 1);
          console.log("키:", height);
  checks:
    - kind: console
      id: output
      description: '"내년 나이: 18"과 "키: 172.5"가 차례로 출력되어야 합니다.'
      requirement: 출력
      expect:
        lines: ["내년 나이: 18", "키: 172.5"]
    - kind: program
      id: numbers
      description: age에는 숫자 17, height에는 숫자 172.5가 들어 있어야 합니다(문자열이 아니라 숫자).
      requirement: 숫자로 바꾸기
      expect:
        globals:
          age: { equals: 17 }
          height: { equals: 172.5 }
        noError: true
      misconceptionIfFail: js.mc.plus-string-adds
hints:
  - "`\"17\" + 1`은 덧셈이 아니라 글자 이어 붙이기가 돼요. 계산하기 전에 무엇을 해야 할까요?"
  - 문자열 전체가 숫자인 값은 Number(문자열)로 바꿀 수 있어요.
  - "`const age = Number(ageText);`처럼 키도 같은 방법으로 바꾼 뒤, console.log에 쉼표로 글자와 값을 나눠 출력하세요."
explanation: |
  예시 정답이에요.

  ```js
  const age = Number(ageText);
  const height = Number(heightText);
  console.log("내년 나이:", age + 1);
  console.log("키:", height);
  ```

  두 문자열은 전체가 숫자라서 `Number`로 바꾸면 돼요. `Number("172.5")`처럼 소수도 그대로 바뀌어요. `parseInt(heightText)`를 쓰면 소수점에서 멈춰 `172`가 되니 키에는 맞지 않아요(`parseFloat`는 괜찮아요).

  바꾸지 않고 `ageText + 1`을 출력하면 `171`이라는 글자가 나와요. `+`는 한쪽이 문자열이면 이어 붙이기 때문이에요(다음 단원 "암묵적 형 변환"에서 자세히 배워요).
origin: authored
review:
  status: draft
  draftedBy: ai:claude
