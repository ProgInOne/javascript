id: js-basics.operators.explicit-conversion.fill-isnan-check
type: fill_blank
difficulty: 2
concepts:
  - { id: js.conv.nan, weight: 1 }
tags: [nan, number-isnan]
estimatedSeconds: 60
prompt: |
  나이 칸에 숫자 대신 `스물`이라는 글자가 입력됐어요. 숫자로 바꾼 `age`가 변환에 실패했는지를 `isInvalid`에 참·거짓으로 저장하도록 빈칸을 채우세요. 실행하면 `true`가 출력되어야 해요.
spec:
  mode: code
  lang: js
  template: |
    const ageText = "스물";
    const age = Number(ageText);
    const isInvalid = {{blank:check}};
    console.log(isInvalid);
  blanks:
    - id: check
      accept: ["Number.isNaN(age)"]
      width: 22
      misconceptionMap:
        "age === NaN": js.mc.nan-equals-nan
  checks:
    - kind: console
      id: output
      description: 콘솔에 true가 출력되어야 합니다.
      expect:
        lines: ["true"]
    - kind: program
      id: is-invalid
      description: isInvalid에 불리언 true가 들어 있어야 합니다.
      expect:
        globals: { isInvalid: { equals: true } }
        noError: true
misconceptions: [js.mc.nan-equals-nan]
hints:
  - "`Number(\"스물\")`의 결과는 무엇일까요? 그 값인지 확인하는 식을 써야 해요."
  - NaN은 자기 자신과도 같지 않아서 `===`로는 확인할 수 없어요.
  - NaN인지 확인하는 함수는 Number에 딸려 있어요. 레슨의 마지막 예제를 떠올려 보세요.
explanation: |
  예시 정답은 `Number.isNaN(age)`예요.

  `Number("스물")`은 숫자로 읽을 수 없어서 `NaN`이에요. `Number.isNaN(age)`는 `age`가 `NaN`이면 `true`를 돌려줘요.

  `age === NaN`이라고 쓰면 항상 `false`예요. `NaN`은 자기 자신을 포함해 어떤 값과도 같지 않기 때문이에요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
