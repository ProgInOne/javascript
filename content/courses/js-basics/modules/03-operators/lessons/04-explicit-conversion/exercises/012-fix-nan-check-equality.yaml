id: js-basics.operators.explicit-conversion.fix-nan-check-equality
type: fix_bug
difficulty: 3
concepts:
  - { id: js.conv.nan, weight: 1 }
  - { id: js.ops.strict-equality, weight: 0.3 }
tags: [nan, number-isnan, debugging]
estimatedSeconds: 120
prompt: |
  회원 가입 폼에서 나이 칸에 `스물`이라고 입력됐어요. 숫자로 바꿀 수 없는 입력인지 확인하는 프로그램인데, 확인 결과가 틀리게 나와요. 버그를 고쳐서 아래처럼 출력되게 하세요.

  ```text
  나이: NaN
  잘못된 입력: true
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          const ageText = "스물";
          const age = Number(ageText);
          const isInvalid = age === NaN;
          console.log("나이:", age);
          console.log("잘못된 입력:", isInvalid);
  solution:
    files:
      - path: main.js
        content: |
          const ageText = "스물";
          const age = Number(ageText);
          const isInvalid = Number.isNaN(age);
          console.log("나이:", age);
          console.log("잘못된 입력:", isInvalid);
  bugDescription: 나이는 NaN으로 출력되는데 "잘못된 입력"은 false로 나와요.
  bugMisconception: js.mc.nan-equals-nan
  checks:
    - kind: console
      id: output
      description: '나이 NaN과 "잘못된 입력: true"가 차례로 출력되어야 합니다.'
      expect:
        lines: ["나이: NaN", "잘못된 입력: true"]
    - kind: program
      id: is-invalid
      description: isInvalid에 불리언 true가 들어 있어야 합니다.
      expect:
        globals: { isInvalid: { equals: true } }
        noError: true
misconceptions: [js.mc.nan-equals-nan]
hints:
  - "`age`는 분명 NaN인데 `age === NaN`이 false예요. NaN의 특별한 성질을 떠올려 보세요."
  - NaN은 자기 자신과도 같지 않아요. 그래서 `===`로는 NaN인지 알 수 없어요.
  - NaN인지 확인하는 전용 함수를 Number에서 찾아보세요.
explanation: |
  3번 줄을 `const isInvalid = Number.isNaN(age);`로 고쳐요.

  `Number("스물")`은 `NaN`이에요. 그런데 `NaN`은 자기 자신을 포함해 어떤 값과도 같지 않아서 `age === NaN`은 `age`가 무엇이든 항상 `false`예요. `NaN`인지는 `Number.isNaN(age)`로 확인해야 해요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
