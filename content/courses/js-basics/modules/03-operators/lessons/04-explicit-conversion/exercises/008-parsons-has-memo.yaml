id: js-basics.operators.explicit-conversion.parsons-has-memo
type: parsons
difficulty: 2
concepts:
  - { id: js.conv.to-boolean, weight: 1 }
tags: [boolean, parsons]
estimatedSeconds: 75
prompt: |
  배달 주문의 요청 메모 칸에 사용자가 `0`이라고 입력했어요. 메모 칸에 **무언가 입력되었는지**를 참·거짓으로 출력하는 프로그램을 완성하세요.

  ```text
  메모: 0
  메모 있음: true
  ```
spec:
  lines:
    - { id: l1, code: 'const memo = "0";' }
    - { id: l2, code: 'console.log("메모:", memo);' }
    - { id: l3, code: "const hasMemo = Boolean(memo);" }
    - { id: l4, code: 'console.log("메모 있음:", hasMemo);' }
  distractors:
    - { id: d1, code: "const hasMemo = Boolean(Number(memo));", replaces: l3 }
    - { id: d2, code: "const hasMemo = memo === true;", replaces: l3 }
  gradeIndent: false
  checks:
    - kind: console
      id: output
      description: '메모 내용과 "메모 있음: true"가 차례로 출력되어야 합니다.'
      expect:
        lines: ["메모: 0", "메모 있음: true"]
    - kind: program
      id: has-memo
      description: hasMemo에 불리언 true가 들어 있어야 합니다.
      expect:
        globals: { hasMemo: { equals: true } }
        noError: true
hints:
  - 변수는 쓰기 전에 만들어야 해요. 어떤 줄이 먼저 와야 할까요?
  - '"무언가 입력되었는가"는 글자가 하나라도 있는지를 묻는 거예요. 글자 "0"을 숫자로 바꾸면 무엇이 될까요?'
  - 문자열을 그대로 Boolean으로 바꾸면 빈 문자열만 false예요. 숫자로 먼저 바꾸거나 true와 비교하는 조각은 쓰지 않아요.
explanation: |
  예시 정답이에요.

  ```js
  const memo = "0";
  console.log("메모:", memo);
  const hasMemo = Boolean(memo);
  console.log("메모 있음:", hasMemo);
  ```

  `Boolean`은 문자열의 내용을 읽지 않고, 빈 문자열 `""`만 `false`로 바꿔요. `"0"`은 글자가 하나 있으니 `true`예요.

  - `Boolean(Number(memo))`: 먼저 숫자 `0`으로 바꾸면 `Boolean(0)`은 `false`가 돼요. 사용자는 메모를 입력했는데 "없음"으로 처리돼요.
  - `memo === true`: 문자열 `"0"`과 불리언 `true`는 자료형이 달라서 항상 `false`예요.
origin: authored
