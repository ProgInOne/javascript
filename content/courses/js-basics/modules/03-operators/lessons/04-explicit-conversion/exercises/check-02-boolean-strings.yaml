id: js-basics.operators.explicit-conversion.check-boolean-strings
type: mcq_multi
difficulty: 2
usage: check
concepts:
  - { id: js.conv.to-boolean, weight: 1 }
tags: [boolean, conversion]
estimatedSeconds: 70
prompt: |
  다음 중 결과가 `true`인 것을 모두 고르세요.
spec:
  options:
    - id: a
      text: '`Boolean("0")`'
      missedMisconception: js.mc.boolean-reads-string-content
    - id: b
      text: '`Boolean(" ")`'
    - id: c
      text: '`!!"no"`'
      missedMisconception: js.mc.boolean-reads-string-content
    - id: d
      text: '`Boolean("")`'
      rationale: 글자가 하나도 없는 빈 문자열은 `false`예요.
    - id: e
      text: '`Boolean(0)`'
      rationale: 숫자 `0`은 `false`가 되는 값이에요. 따옴표로 감싼 `"0"`과는 달라요.
  correct: [a, b, c]
misconceptions: [js.mc.boolean-reads-string-content]
hints:
  - 문자열을 Boolean으로 바꿀 때 `false`가 되는 문자열은 딱 하나예요.
  - Boolean은 글자의 뜻을 읽지 않아요. 글자가 하나라도 있는지만 봐요. 공백도 글자예요.
  - 숫자 `0`과 문자열 `"0"`은 다른 값이에요. `!!`는 Boolean과 같은 결과를 내요.
explanation: |
  정답은 `Boolean("0")`, `Boolean(" ")`, `!!"no"` 세 개예요.

  - 문자열은 빈 문자열 `""`만 `false`이고, 글자가 하나라도 있으면 `true`예요. `"0"`, `" "`(공백 한 칸), `"no"`는 모두 글자가 있어요.
  - Boolean은 글자의 뜻을 읽지 않아요. `"no"`나 `"0"`이 "아니요"처럼 보여도 `true`예요.
  - `!!값`은 `Boolean(값)`과 같은 결과예요.
  - 숫자 `0`은 `false`가 되는 값 목록에 있어요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
