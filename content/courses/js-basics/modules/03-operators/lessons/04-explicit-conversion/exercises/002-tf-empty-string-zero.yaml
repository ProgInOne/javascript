id: js-basics.operators.explicit-conversion.tf-empty-string-zero
type: true_false
difficulty: 1
concepts:
  - { id: js.conv.to-number, weight: 1 }
tags: [number, empty-string]
estimatedSeconds: 30
prompt: |
  다음 설명이 맞는지 고르세요.
spec:
  statement: '`Number("")`처럼 빈 문자열을 숫자로 바꾸면 `NaN`이 된다.'
  answer: false
  misconceptionIfWrong: js.mc.empty-string-to-nan
misconceptions: [js.mc.empty-string-to-nan]
hints:
  - 빈 문자열은 숫자로 읽을 글자가 하나도 없는 문자열이에요.
  - 레슨의 Number 변환 표에서 빈 문자열 줄을 떠올려 보세요.
  - Number는 빈 문자열을 "실패"가 아니라 특정한 숫자로 바꿔요.
explanation: |
  **거짓**이에요. `Number("")`는 `0`이에요. 공백만 있는 `Number("   ")`도 `0`이에요.

  그래서 빈 입력 칸을 `Number`로 바꾸면 조용히 0으로 계산돼요. 입력이 비었는지는 숫자로 바꾸기 **전에** 따로 확인해야 해요. 참고로 `parseInt("")`는 `NaN`이라서, 두 방법의 결과가 달라요.
origin: authored
