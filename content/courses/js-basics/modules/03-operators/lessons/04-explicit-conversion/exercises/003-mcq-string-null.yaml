id: js-basics.operators.explicit-conversion.mcq-string-null
type: mcq_single
difficulty: 1
concepts:
  - { id: js.conv.to-string, weight: 1 }
tags: [string, null-value]
estimatedSeconds: 40
prompt: |
  `String(null)`의 결과는 무엇인가요?
spec:
  options:
    - id: a
      text: 글자 `"null"`
    - id: b
      text: 빈 문자열 `""`
      misconception: js.mc.string-of-null-empty
      rationale: String은 값을 보이는 그대로 글자로 바꿔요. null도 글자 "null"이 돼요.
    - id: c
      text: "`null` 그대로 (바뀌지 않는다)"
      rationale: String의 결과는 항상 문자열이에요.
    - id: d
      text: 오류가 난다
      rationale: String은 어떤 값이든 오류 없이 글자로 바꿀 수 있어요.
  correct: a
misconceptions: [js.mc.string-of-null-empty]
hints:
  - String의 결과는 어떤 자료형인가요?
  - String은 값을 "보이는 그대로" 글자로 바꿔요.
  - console.log(null)을 하면 콘솔에 무엇이 보이는지 떠올려 보세요. 그 모습이 그대로 글자가 돼요.
explanation: |
  정답은 **글자 `"null"`**이에요.

  `String(값)`은 어떤 값이든 보이는 그대로 글자로 바꿔요. `String(true)`가 `"true"`인 것처럼 `String(null)`은 `"null"`, `String(undefined)`는 `"undefined"`예요.

  - 빈 문자열을 골랐다면: null이 "없음"을 뜻하긴 하지만, String은 뜻이 아니라 모습을 글자로 바꿔요. 그래서 화면에 `null`이 그대로 찍히는 버그가 자주 생겨요.
  - 바뀌지 않는다를 골랐다면: String의 결과는 항상 문자열이에요.
  - 오류를 골랐다면: String은 null과 undefined도 오류 없이 바꿔요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
