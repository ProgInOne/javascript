id: js-basics.operators.explicit-conversion.impl-order-form
type: implement_function
difficulty: 4
concepts:
  - { id: js.conv.to-number, weight: 1 }
  - { id: js.conv.nan, weight: 0.5 }
  - { id: js.ops.arithmetic, weight: 0.3 }
tags: [number, parseint, write-code]
estimatedSeconds: 300
prompt: |
  과자 가게 주문서의 세 칸에서 꺼낸 값은 모두 문자열이에요.

  - 수량 칸(`quantityText`): 사용자가 `"2봉지"`처럼 단위까지 입력해요.
  - 가격 칸(`priceText`): 숫자만 들어 있어요.
  - 쿠폰 할인 칸(`couponText`): 비어 있어요. **빈 칸이면 할인은 0원**이에요.

  세 값을 숫자로 바꿔 `quantity`, `price`, `coupon`에 넣고, 결제 금액 `total`(가격 × 수량 − 쿠폰 할인)을 계산해 아래처럼 출력하세요. 칸마다 어떤 변환 방법이 맞는지 골라야 해요.

  ```text
  수량: 2
  쿠폰 할인: 0
  결제 금액: 9000
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const quantityText = "2봉지";
          const priceText = "4500";
          const couponText = "";
          // 여기에 작성하세요.
  solution:
    files:
      - path: main.js
        content: |
          const quantityText = "2봉지";
          const priceText = "4500";
          const couponText = "";
          const quantity = parseInt(quantityText);
          const price = Number(priceText);
          const coupon = Number(couponText);
          const total = price * quantity - coupon;
          console.log("수량:", quantity);
          console.log("쿠폰 할인:", coupon);
          console.log("결제 금액:", total);
  checks:
    - kind: console
      id: output
      description: 수량, 쿠폰 할인, 결제 금액이 차례로 출력되어야 합니다.
      requirement: 주문 출력
      expect:
        lines: ["수량: 2", "쿠폰 할인: 0", "결제 금액: 9000"]
    - kind: program
      id: quantity
      description: quantity에는 숫자 2가 들어 있어야 합니다.
      requirement: 수량 변환
      expect:
        globals: { quantity: { equals: 2 } }
      misconceptionIfFail: js.mc.number-parses-prefix
    - kind: program
      id: coupon
      description: 빈 쿠폰 칸은 숫자 0(할인 없음)이 되어야 합니다.
      requirement: 쿠폰 변환
      expect:
        globals: { coupon: { equals: 0 } }
    - kind: program
      id: total
      description: price는 숫자 4500, total은 9000이어야 하고 오류 없이 끝나야 합니다.
      requirement: 결제 금액
      expect:
        globals:
          price: { equals: 4500 }
          total: { equals: 9000 }
        noError: true
misconceptions: [js.mc.number-parses-prefix, js.mc.empty-string-to-nan]
hints:
  - 칸마다 따로 생각해 보세요. 단위가 붙은 글자, 숫자만 있는 글자, 빈 글자를 각각 Number와 parseInt로 바꾸면 무엇이 될까요?
  - '"2봉지"는 앞에서부터 숫자만 읽어야 하고, 가격은 전체가 숫자예요. 빈 문자열은 Number로 바꾸면 0, parseInt로 바꾸면 NaN이에요.'
  - 수량은 앞에서부터 읽는 방법, 쿠폰은 빈 칸이 0이 되는 방법이 맞아요. 바꾼 뒤 가격 × 수량 − 쿠폰을 계산하세요.
explanation: |
  예시 정답이에요.

  ```js
  const quantity = parseInt(quantityText);
  const price = Number(priceText);
  const coupon = Number(couponText);
  const total = price * quantity - coupon;
  console.log("수량:", quantity);
  console.log("쿠폰 할인:", coupon);
  console.log("결제 금액:", total);
  ```

  | 칸 | `Number` | `parseInt` | 고를 것 |
  |---|---|---|---|
  | `"2봉지"` | `NaN` | `2` | `parseInt` |
  | `"4500"` | `4500` | `4500` | 어느 쪽이든 |
  | `""` | `0` | `NaN` | `Number` |

  - 수량을 `Number`로 바꾸면 `봉지` 때문에 `NaN`이 되고, 결제 금액까지 `NaN`이 돼요.
  - 쿠폰을 `parseInt`로 바꾸면 빈 칸이 `NaN`이 되어 역시 결제 금액이 `NaN`이에요. "빈 칸이면 0원"이라는 요구사항에는 `Number("")`가 `0`이 되는 성질이 맞아요.

  어느 쪽이 항상 옳은 게 아니라, 입력의 모양과 요구사항에 따라 골라야 해요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
