    - js.conv.to-boolean
    - js.conv.nan
    - js.conv.truthy-falsy
    - js.conv.plus-concat
    - js.conv.equality-coercion
objectives:
  - 산술·비교·논리 연산자를 섞은 식을 우선순위와 형 변환 규칙에 따라 계산할 수 있다.
  - 연산자와 형 변환 때문에 생긴 버그의 원인을 찾아 고칠 수 있다.
  - 요구사항을 읽고 계산·비교·기본값 처리가 들어간 프로그램을 작성할 수 있다.
assessment:
  itemCount: 18                    # 평가 개념 18개를 한 문항씩 모두 확인(커리큘럼 표의 15보다 많음)
  passRatio: 0.8
practice:
  targetCount: 22                  # itemCount보다 4문항 많아 다시 응시하면 다른 문항이 섞임
