id: js-basics.operators.operators-review
title: 연산자와 형 변환 단원 평가
summary: 모듈 3에서 배운 산술·비교·논리 연산과 형 변환을 섞어 풀며 이해도를 확인합니다.
kind: assessment
importance: standard
estimatedMinutes: { read: 2, practice: 30 }
concepts:
  reviewed:
    - js.ops.arithmetic
    - js.ops.precedence
    - js.ops.remainder
    - js.ops.compound-assignment
