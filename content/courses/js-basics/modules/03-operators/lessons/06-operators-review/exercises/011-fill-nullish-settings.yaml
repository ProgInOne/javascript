id: js-basics.operators.operators-review.fill-nullish-settings
type: fill_blank
difficulty: 3
concepts:
  - { id: js.ops.nullish, weight: 1 }
  - { id: js.ops.short-circuit, weight: 0.3 }
tags: [nullish, default-value, review]
estimatedSeconds: 90
usage: assessment
prompt: |
  저장된 설정이 없을 때만 기본값을 쓰려고 해요. 사용자가 음량을 일부러 `0`으로 저장해 둔 경우에는 `0`을 그대로 써야 해요. 두 빈칸에 알맞은 **연산자**를 쓰세요.

  ```text
  음량: 0
  속도: 1
  ```
spec:
  mode: code
  lang: js
  template: |
    const savedVolume = 0;      // 사용자가 0으로 저장함
    const savedSpeed = null;    // 저장한 적 없음

    const volume = savedVolume {{blank:op1}} 50;
    const speed = savedSpeed {{blank:op2}} 1;
    console.log("음량:", volume);
    console.log("속도:", speed);
  blanks:
    - id: op1
      accept: ["??"]
      width: 4
      misconceptionMap:
        "||": js.mc.nullish-same-as-or
    - id: op2
      accept: ["??"]
      width: 4
  checks:
    - kind: console
      id: output
      description: 음량은 저장된 0, 속도는 기본값 1이 출력되어야 합니다.
      expect:
        lines: ["음량: 0", "속도: 1"]
    - kind: program
      id: values
      description: volume에는 0, speed에는 1이 들어 있어야 합니다.
      expect:
        globals:
          volume: { equals: 0 }
          speed: { equals: 1 }
        noError: true
      misconceptionIfFail: js.mc.nullish-same-as-or
misconceptions: [js.mc.nullish-same-as-or, js.mc.or-default-keeps-zero]
hints:
  - "기본값을 정하는 연산자로 `||`와 `??`를 배웠어요. 두 연산자는 언제 오른쪽 값을 고르나요?"
  - "`||`는 왼쪽이 falsy이면 오른쪽을 골라요. 0도 falsy예요."
  - 왼쪽이 null이나 undefined일 때만 오른쪽을 고르는 연산자가 필요해요.
explanation: |
  두 빈칸 모두 **`??`**예요.

  ```js
  const volume = savedVolume ?? 50;   // 0은 null/undefined가 아니므로 0
  const speed = savedSpeed ?? 1;      // null이므로 기본값 1
  ```

  `??`는 왼쪽이 `null`이나 `undefined`일 때만 오른쪽 값을 골라요. 그래서 사용자가 일부러 저장한 0은 그대로 남아요.

  - `||`를 쓰면: 0은 falsy라서 `savedVolume || 50`이 50이 돼요. 사용자가 저장한 음량 0이 사라져요.
  - `&&`를 쓰면: 왼쪽이 falsy이면 왼쪽을 그대로 돌려주므로 `savedSpeed && 1`은 `null`이 돼요. 기본값이 적용되지 않아요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
