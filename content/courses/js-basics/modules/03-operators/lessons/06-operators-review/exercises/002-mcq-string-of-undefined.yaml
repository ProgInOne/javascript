id: js-basics.operators.operators-review.mcq-string-of-undefined
type: mcq_single
difficulty: 1
concepts:
  - { id: js.conv.to-string, weight: 1 }
tags: [to-string, review]
estimatedSeconds: 35
usage: assessment
prompt: |
  `String(undefined)`의 결과는 무엇인가요?
spec:
  options:
    - id: a
      text: '글자 `"undefined"` (문자열)'
    - id: b
      text: '빈 문자열 `""`'
      misconception: js.mc.string-of-null-empty
      rationale: String은 값을 비우지 않고, 보이는 그대로 글자로 바꿔요.
    - id: c
      text: "`undefined` 값 그대로 (문자열이 아님)"
      rationale: String(값)의 결과는 언제나 문자열이에요.
    - id: d
      text: 오류가 나서 프로그램이 멈춘다
      rationale: String은 어떤 값이든 오류 없이 글자로 바꿔요.
  correct: a
misconceptions: [js.mc.string-of-null-empty]
hints:
  - String(값)의 결과는 항상 어떤 자료형인가요?
  - String은 값이 없다고 해서 글자를 비워 두지 않아요.
  - "`String(true)`가 `\"true\"`인 것과 같은 방식이에요."
explanation: |
  정답은 **글자 `"undefined"`**예요.

  `String(값)`은 어떤 값이든 화면에 보이는 그대로 글자(문자열)로 바꿔요. `String(true)`는 `"true"`, `String(null)`은 `"null"`, `String(undefined)`는 `"undefined"`예요.

  - 빈 문자열을 골랐다면: "값이 없음"이 "글자가 없음"이 된다고 생각한 거예요. String은 값을 비우지 않아요.
  - `undefined` 그대로를 골랐다면: String의 결과는 언제나 문자열이에요.
  - 오류를 골랐다면: String은 변환에 실패하는 경우가 없어요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
