id: js-basics.operators.operators-review.fix-cart-receipt
type: fix_bug
difficulty: 5
concepts:
  - { id: js.conv.plus-concat, weight: 1 }
  - { id: js.conv.to-number, weight: 0.5 }
  - { id: js.ops.compound-assignment, weight: 0.3 }
  - { id: js.ops.precedence, weight: 0.3 }
tags: [plus-concat, conversion, debugging, review]
estimatedSeconds: 480
usage: assessment
prompt: |
  쇼핑몰 결제 화면의 계산 코드예요. `priceText`, `countText`, `wrapText`는 입력창에서 읽은 값이라 **문자열**이에요.

  계산 규칙은 이래요.

  - 결제 금액 = 상품 가격 × 수량 + 포장비 − 쿠폰 1000원
  - 포인트 = 결제 금액의 1%
  - 받는 상품 수 = 주문 수량 + 사은품 1개

  버그를 모두 고쳐서 아래처럼 출력되게 하세요. 1~3번 줄의 값은 바꾸지 마세요.

  ```text
  결제 금액: 23500원
  포인트: 235원
  받는 상품 수: 3개
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          const priceText = "12000";
          const countText = "2";
          const wrapText = "500";

          let total = priceText * countText;
          total = total + wrapText;
          total -= 1000;
          console.log("결제 금액: " + total + "원");
          console.log("포인트: " + total / 100 + "원");
          console.log("받는 상품 수: " + countText + 1 + "개");
  solution:
    files:
      - path: main.js
        content: |
          const priceText = "12000";
          const countText = "2";
          const wrapText = "500";

          let total = priceText * countText;
          total = total + Number(wrapText);
          total -= 1000;
          console.log("결제 금액: " + total + "원");
          console.log("포인트: " + total / 100 + "원");
          console.log("받는 상품 수: " + (Number(countText) + 1) + "개");
  bugDescription: 결제 금액이 터무니없이 크게 나오고, 받는 상품 수도 이상해요. 오류는 나지 않아요.
  bugMisconception: js.mc.plus-string-adds
  checks:
    - kind: console
      id: output
      description: 결제 금액, 포인트, 받는 상품 수가 계산 규칙대로 출력되어야 합니다.
      requirement: 영수증 출력
      expect:
        lines: ["결제 금액: 23500원", "포인트: 235원", "받는 상품 수: 3개"]
    - kind: program
      id: total-number
      description: 프로그램이 오류 없이 끝나고, total에는 숫자 23500이 들어 있어야 하며, 입력값 변수는 처음 그대로여야 합니다.
      requirement: 결제 금액 계산
      expect:
        globals:
          total: { equals: 23500 }
          priceText: { equals: "12000" }
          countText: { equals: "2" }
          wrapText: { equals: "500" }
        noError: true
      misconceptionIfFail: js.mc.plus-string-adds
misconceptions:
  - js.mc.plus-string-adds
  - js.mc.concat-whole-expression
  - js.mc.minus-string-fails
hints:
  - 줄마다 total을 `console.log(total, typeof total)`로 출력해 보면서, 값이 처음 이상해지는 줄을 찾아보세요. `*`, `-`, `/`와 `+`는 문자열을 다루는 방식이 달라요.
  - "6번 줄에서 숫자 `24000`과 문자열 `\"500\"`을 `+`로 더하면 이어 붙여져요. 10번 줄도 `+`가 왼쪽부터 하나씩 계산된다는 점을 생각해 보세요: `\"받는 상품 수: \" + \"2\"`가 먼저예요."
  - 문자열을 `+`로 더하기 전에 `Number`로 바꾸고, 10번 줄에서는 숫자 덧셈을 괄호로 묶어 먼저 계산하게 하세요.
explanation: |
  버그는 두 군데예요. 둘 다 `+`가 문자열을 만나 **이어 붙이기**를 해서 생겼어요.

  1. **6번 줄**: `total`(숫자 24000) `+ wrapText`(문자열 `"500"`)는 덧셈이 아니라 이어 붙이기라 `"24000500"`이 됐어요. `total + Number(wrapText)`로 바꿔요.
  1. **10번 줄**: `+`는 왼쪽부터 하나씩 계산해요. `"받는 상품 수: " + countText`가 먼저 글자 `"받는 상품 수: 2"`가 되고, 거기에 `+ 1`이 붙어 `"받는 상품 수: 21"`이 됐어요. `(Number(countText) + 1)`처럼 숫자로 바꾼 덧셈을 괄호로 묶어 먼저 계산해요.

  나머지 줄은 맞아요.

  - 5번 줄 `priceText * countText`: `*`는 문자열을 숫자로 바꿔 계산하므로 24000(숫자)이에요. 이어 붙이기를 하는 연산자는 `+`뿐이에요.
  - 7번 줄 `total -= 1000`: 원래 코드에서는 `"24000500" - 1000`도 숫자로 바뀌어 계산됐어요. 그래서 오류 없이 이상한 숫자(23999500)가 나왔고, 버그를 알아차리기 더 어려웠어요.
  - 9번 줄 `"포인트: " + total / 100`: `/`가 `+`보다 먼저 계산되므로 235가 먼저 계산된 뒤 이어 붙여져요.

  입력창에서 읽은 값은 계산하기 전에 **처음부터 Number로 바꿔 두는 습관**이 가장 안전해요. 예를 들어 `const wrap = Number(wrapText);`처럼 숫자 변수를 따로 만들어도 정답이에요.
origin: authored
review:
