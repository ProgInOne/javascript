id: js-basics.operators.operators-review.impl-score-report
type: implement_function
difficulty: 3
concepts:
  - { id: js.ops.arithmetic, weight: 1 }
  - { id: js.ops.precedence, weight: 0.5 }
tags: [arithmetic, write-code, review]
estimatedSeconds: 240
usage: assessment
prompt: |
  세 과목 점수로 성적표를 만드는 프로그램을 완성하세요. 점수 변수 세 줄은 그대로 두고, 그 아래에 다음 변수를 만들어 출력하세요.

  - `total`: 세 과목 점수의 합
  - `average`: 세 과목의 평균 (합 ÷ 과목 수 3)
  - `gap`: 목표 점수 90점에서 평균을 뺀 값 (평균이 목표보다 몇 점 낮은지)

  실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  총점: 255
  평균: 85
  목표까지: 5
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const korean = 92;
          const math = 85;
          const english = 78;

          // 여기에 total, average, gap을 만들고 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          const korean = 92;
          const math = 85;
          const english = 78;

          const total = korean + math + english;
          const average = total / 3;
          const gap = 90 - average;
          console.log("총점:", total);
          console.log("평균:", average);
          console.log("목표까지:", gap);
  checks:
    - kind: console
      id: output
      description: 총점, 평균, 목표까지 남은 점수가 차례로 출력되어야 합니다.
      requirement: 성적표 출력
      expect:
        lines: ["총점: 255", "평균: 85", "목표까지: 5"]
    - kind: program
      id: values
      description: 프로그램이 오류 없이 끝나고, total·average·gap 변수에 계산 결과가 들어 있어야 합니다.
      requirement: 계산한 변수
      expect:
        globals:
          total: { equals: 255 }
          average: { equals: 85 }
          gap: { equals: 5 }
        noError: true
      misconceptionIfFail: js.mc.always-left-to-right
misconceptions: [js.mc.always-left-to-right]
hints:
  - total을 먼저 만들어 두면 average와 gap을 계산할 때 다시 쓸 수 있어요.
  - "`korean + math + english / 3`이라고 쓰면 나눗셈이 먼저 계산돼요. 합을 먼저 구하려면 어떻게 해야 할까요?"
  - "평균은 `total`을 3으로 나눈 값이고, gap은 90에서 평균을 뺀 값이에요. 빼는 순서(90 - 평균)에 주의하세요."
explanation: |
  예시 정답이에요.

  ```js
  const total = korean + math + english;   // 255
  const average = total / 3;               // 85
  const gap = 90 - average;                // 5
  console.log("총점:", total);
  console.log("평균:", average);
  console.log("목표까지:", gap);
  ```

  - 평균을 한 줄로 쓰려면 `(korean + math + english) / 3`처럼 괄호가 필요해요. 괄호 없이 `korean + math + english / 3`이라고 쓰면 `english / 3`이 먼저 계산되어 203이 돼요.
  - `average - 90`이라고 쓰면 `-5`가 나와요. "목표에서 평균을 뺀 값"이므로 `90 - average`예요.
  - 점수는 바뀌지 않는 값이라 `const`로 만들었어요. `let`으로 만들어도 정답이에요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
