id: js-basics.operators.operators-review.fix-run-distance
type: fix_bug
difficulty: 3
concepts:
  - { id: js.conv.to-number, weight: 1 }
  - { id: js.conv.plus-concat, weight: 0.5 }
  - { id: js.ops.compound-assignment, weight: 0.3 }
tags: [to-number, parseFloat, plus-concat, review]
estimatedSeconds: 180
usage: assessment
prompt: |
  달리기 기록 앱이 이틀 동안 달린 거리를 글자로 받아요(`"3.5km"`, `"4km"`). 두 거리를 더해 총 거리를 보여 주려는데 결과가 이상해요. 버그를 고쳐서 아래처럼 출력되게 하세요. 1·2번 줄의 값은 바꾸지 마세요.

  ```text
  총 거리: 7.5km
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          const firstRun = "3.5km";
          const secondRun = "4km";
          let totalKm = 0;
          totalKm += parseInt(firstRun);
          totalKm += secondRun;
          console.log("총 거리: " + totalKm + "km");
  solution:
    files:
      - path: main.js
        content: |
          const firstRun = "3.5km";
          const secondRun = "4km";
          let totalKm = 0;
          totalKm += parseFloat(firstRun);
          totalKm += parseFloat(secondRun);
          console.log("총 거리: " + totalKm + "km");
  bugDescription: "`총 거리: 7.5km` 대신 `총 거리: 34kmkm`가 출력돼요. 오류 메시지는 없어요."
  bugMisconception: js.mc.plus-string-adds
  maxEditDistance: 10
  checks:
    - kind: console
      id: output
      description: 이틀 동안 달린 총 거리 7.5km가 출력되어야 합니다.
      requirement: 총 거리 출력
      expect:
        lines: ["총 거리: 7.5km"]
    - kind: program
      id: total-number
      description: 프로그램이 오류 없이 끝나고, totalKm에는 숫자 7.5가 들어 있어야 하며, 입력값 변수는 처음 그대로여야 합니다.
      requirement: 총 거리 계산
      misconceptionIfFail: js.mc.plus-string-adds
      expect:
        globals:
          totalKm: { equals: 7.5 }
          firstRun: { equals: "3.5km" }
          secondRun: { equals: "4km" }
        noError: true
misconceptions: [js.mc.plus-string-adds, js.mc.number-parses-prefix]
hints:
  - "4번 줄과 5번 줄이 끝날 때마다 `console.log(totalKm)`으로 값을 확인해 보세요. 버그가 두 줄에 하나씩 있어요."
  - "4번 줄: `parseInt`는 정수 부분까지만 읽어요. 5번 줄: `+=`는 `+`와 같아서, 오른쪽이 문자열이면 이어 붙여요."
  - "두 줄 모두 `\"km\"`가 붙은 글자에서 소수점까지 숫자를 읽어 와야 해요. `Number`는 글자 전체가 숫자여야 하니 다른 함수가 필요해요."
explanation: |
  버그는 두 군데예요. 4·5번 줄을 모두 `parseFloat`로 바꾸면 돼요.

  ```js
  totalKm += parseFloat(firstRun);    // 0 + 3.5 = 3.5
  totalKm += parseFloat(secondRun);   // 3.5 + 4 = 7.5
  ```

  | 줄 | 고치기 전 `totalKm` | 고친 뒤 `totalKm` |
  |---|---|---|
  | 4 | `parseInt("3.5km")` → `3` | `parseFloat("3.5km")` → `3.5` |
  | 5 | `3 + "4km"` → `"34km"` (이어 붙이기) | `3.5 + 4` → `7.5` |
  | 6 | `"총 거리: 34kmkm"` | `"총 거리: 7.5km"` |

  1. **4번 줄**: `parseInt`는 앞에서부터 **정수**만 읽어서 `.5`를 버려요. 소수까지 읽으려면 `parseFloat`를 써요.
  1. **5번 줄**: `totalKm += secondRun`은 `totalKm = totalKm + secondRun`이에요. `+`는 한쪽이 문자열이면 이어 붙이므로 숫자 3과 글자 `"4km"`가 붙어 `"34km"`가 됐어요. 숫자로 바꾼 뒤 더해야 해요.

  `Number(secondRun)`으로 바꾸면 `"4km"` 전체가 숫자가 아니라서 `NaN`이 되고, 총 거리도 `NaN`이 돼요. 단위가 붙은 글자는 `parseFloat`(또는 소수가 없으면 `parseInt`)로 앞부분의 숫자를 읽어요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
