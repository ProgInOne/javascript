id: js-basics.operators.operators-review.multi-falsy-values
type: mcq_multi
difficulty: 3
concepts:
  - { id: js.conv.truthy-falsy, weight: 1 }
  - { id: js.conv.plus-concat, weight: 0.5 }
  - { id: js.conv.to-number, weight: 0.3 }
  - { id: js.conv.to-string, weight: 0.3 }
tags: [truthy-falsy, plus-concat, review]
estimatedSeconds: 100
usage: assessment
prompt: |
  다음 식 중 **결과가 falsy**인 것(참·거짓이 필요한 곳에서 거짓으로 취급되는 값)을 모두 고르세요. 먼저 식의 결과를 계산한 다음 판단해요.
spec:
  options:
    - id: a
      text: '`"5" * 0`'
      missedMisconception: js.mc.minus-string-fails
    - id: b
      text: '`"3" - "1"`'
      misconception: js.mc.minus-string-fails
      rationale: "-는 두 문자열을 숫자로 바꿔 3 - 1을 계산해요. 결과 2는 truthy예요."
    - id: c
      text: '`Number("abc")`'
    - id: d
      text: "`String(0)`"
      misconception: js.mc.string-zero-falsy
      rationale: 결과는 숫자 0이 아니라 글자 "0"이에요. 글자가 있는 문자열이라 truthy예요.
    - id: e
      text: '`"0" + 0`'
      misconception: js.mc.plus-string-adds
      rationale: +는 문자열을 만나면 이어 붙여서 "00"이 돼요. 글자가 있는 문자열이라 truthy예요.
    - id: f
      text: '`" " + ""`'
      misconception: js.mc.space-string-falsy
      rationale: 결과는 공백 하나인 " "예요. 공백도 글자라서 truthy예요.
  correct: [a, c]
misconceptions: [js.mc.minus-string-fails, js.mc.string-zero-falsy, js.mc.plus-string-adds, js.mc.space-string-falsy]
hints:
  - 식마다 결과 값과 그 자료형(숫자인지 문자열인지)을 먼저 적어 보세요.
  - "`+`만 문자열을 이어 붙이고, `-`와 `*`는 숫자로 바꿔 계산해요. 숫자 중 falsy는 `0`과 `NaN`, 문자열 중 falsy는 `\"\"`뿐이에요."
  - "결과가 숫자 `0`이나 `NaN`이 되는 식을 찾아보세요. 결과가 문자열이면 글자가 하나라도 있는지 보세요."
explanation: |
  정답은 **`"5" * 0`**과 **`Number("abc")`**예요.

  | 식 | 결과 | 자료형 | falsy? |
  |---|---|---|---|
  | `"5" * 0` | `0` | 숫자 | falsy |
  | `"3" - "1"` | `2` | 숫자 | truthy |
  | `Number("abc")` | `NaN` | 숫자 | falsy |
  | `String(0)` | `"0"` | 문자열 | truthy |
  | `"0" + 0` | `"00"` | 문자열 | truthy |
  | `" " + ""` | `" "` | 문자열 | truthy |

  - `*`와 `-`는 문자열을 숫자로 바꿔 계산해요. `"5" * 0`은 숫자 `0`이라 falsy, `"3" - "1"`은 `2`라 truthy예요. `*`나 `-`가 실패하거나 이어 붙인다고 생각했다면 다시 확인해 보세요.
  - `Number("abc")`는 변환에 실패해 `NaN`이에요. `NaN`도 falsy예요.
  - `String(0)`과 `"0" + 0`은 결과가 **문자열**이에요. 글자 `"0"`이나 `"00"`은 글자가 있어서 truthy예요. 숫자 0과 글자 "0"을 구별해야 해요.
  - `" " + ""`는 공백 하나짜리 문자열이에요. 길이가 0인 `""`만 falsy예요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
