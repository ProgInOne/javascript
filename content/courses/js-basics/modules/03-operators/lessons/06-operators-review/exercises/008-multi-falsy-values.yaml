id: js-basics.operators.operators-review.multi-falsy-values
type: mcq_multi
difficulty: 2
concepts:
  - { id: js.conv.truthy-falsy, weight: 1 }
tags: [truthy-falsy, review]
estimatedSeconds: 60
usage: assessment
prompt: |
  다음 중 **falsy**인 값(참·거짓이 필요한 곳에서 거짓으로 취급되는 값)을 모두 고르세요.
spec:
  options:
    - id: a
      text: "`0`"
      missedMisconception: js.mc.or-default-keeps-zero
    - id: b
      text: '`""` (빈 문자열)'
    - id: c
      text: "`NaN`"
    - id: d
      text: '`"0"`'
      misconception: js.mc.string-zero-falsy
      rationale: 글자 0이 들어 있는 문자열이라 truthy예요.
    - id: e
      text: '`" "` (공백 하나)'
      misconception: js.mc.space-string-falsy
      rationale: 공백도 글자라서 truthy예요.
    - id: f
      text: '`"false"`'
      misconception: js.mc.string-zero-falsy
      rationale: 글자가 들어 있는 문자열이라 truthy예요. 글자의 뜻은 상관없어요.
  correct: [a, b, c]
misconceptions: [js.mc.string-zero-falsy, js.mc.space-string-falsy]
hints:
  - falsy 값은 정해진 몇 개뿐이에요. 목록을 떠올려 보세요.
  - "falsy 목록은 `false`, `0`, `\"\"`, `null`, `undefined`, `NaN`이에요."
  - 문자열은 길이가 0일 때만 falsy예요. 따옴표 안에 무엇이든 들어 있으면 truthy예요.
explanation: |
  정답은 **`0`, `""`, `NaN`**이에요.

  falsy 값은 `false`, `0`, `""`, `null`, `undefined`, `NaN`처럼 정해진 몇 개뿐이고, 나머지는 모두 truthy예요.

  - `"0"`, `"false"`: 글자가 들어 있는 문자열이에요. 글자의 뜻은 보지 않아서 truthy예요.
  - `" "`: 공백도 글자 하나예요. 길이가 0인 `""`만 falsy예요.

  `0`을 빠뜨렸다면 `count || 10`처럼 기본값을 줄 때 0이 사라지는 이유를 다시 확인해 보세요. 0은 falsy라서 `||`가 오른쪽 값을 골라요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
