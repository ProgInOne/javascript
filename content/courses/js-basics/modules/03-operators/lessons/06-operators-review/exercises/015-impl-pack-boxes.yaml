id: js-basics.operators.operators-review.impl-pack-boxes
type: implement_function
difficulty: 3
concepts:
  - { id: js.ops.remainder, weight: 1 }
  - { id: js.ops.arithmetic, weight: 0.5 }
tags: [remainder, write-code, review]
estimatedSeconds: 240
usage: assessment
prompt: |
  쿠키 23개를 한 상자에 5개씩 담으려고 해요. 꽉 찬 상자가 몇 개이고 몇 개가 남는지 계산하는 프로그램을 작성하세요.

  - `leftover`: 상자에 담고 남는 쿠키 수
  - `boxes`: 꽉 찬 상자 수
  - 쿠키 수와 상자 크기는 `cookies`, `perBox` 변수로 계산하세요(숫자 23과 5를 계산식에 직접 쓰지 않기).

  실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  상자: 4
  남은 쿠키: 3
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const cookies = 23;
          const perBox = 5;

          // 여기에 leftover와 boxes를 만들고 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          const cookies = 23;
          const perBox = 5;

          const leftover = cookies % perBox;
          const boxes = (cookies - leftover) / perBox;
          console.log("상자:", boxes);
          console.log("남은 쿠키:", leftover);
  checks:
    - kind: console
      id: output
      description: 꽉 찬 상자 수와 남은 쿠키 수가 차례로 출력되어야 합니다.
      requirement: 결과 출력
      expect:
        lines: ["상자: 4", "남은 쿠키: 3"]
    - kind: program
      id: values
      description: 프로그램이 오류 없이 끝나고, boxes에는 4, leftover에는 3이 들어 있어야 합니다.
      requirement: 계산한 변수
      expect:
        globals:
          boxes: { equals: 4 }
          leftover: { equals: 3 }
        noError: true
      misconceptionIfFail: js.mc.remainder-is-quotient
misconceptions: [js.mc.remainder-is-quotient, js.mc.division-truncates]
hints:
  - 남는 쿠키 수는 나머지 연산자 `%` 하나로 구할 수 있어요.
  - "`cookies / perBox`는 4.6이에요. JavaScript의 나눗셈은 소수점을 버리지 않아요."
  - 남는 쿠키를 먼저 빼면 5로 딱 나누어떨어져요. 그 값을 상자 크기로 나눠 보세요.
explanation: |
  예시 정답이에요.

  ```js
  const leftover = cookies % perBox;              // 23 % 5 = 3
  const boxes = (cookies - leftover) / perBox;    // (23 - 3) / 5 = 4
  ```

  - `%`는 나머지를 구해요. 23을 5로 나누면 몫은 4, 나머지는 3이라 `23 % 5`는 3이에요. 몫이 아니에요.
  - `cookies / perBox`는 4.6이에요. JavaScript의 `/`는 소수까지 계산하므로 몫만 남기려면 나머지를 먼저 빼고 나눠요.
  - `(cookies - leftover)`의 괄호를 빼면 `leftover / perBox`가 먼저 계산되어 엉뚱한 값이 돼요.

  나중에 배울 `Math.floor(cookies / perBox)`로도 몫을 구할 수 있어요. 결과가 같으면 정답이에요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
