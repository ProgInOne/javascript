id: js-basics.operators.operators-review.predict-precedence-mix
type: predict_output
difficulty: 2
concepts:
  - { id: js.ops.precedence, weight: 1 }
  - { id: js.ops.arithmetic, weight: 0.3 }
tags: [precedence, review]
estimatedSeconds: 70
usage: assessment
prompt: |
  다음 프로그램을 실행하면 콘솔에 무엇이 출력되나요?
spec:
  lang: js
  code: |
    console.log(10 - 4 / 2 * 3);
    console.log((10 - 4) / 2 * 3);
  answerKind: console
  misconceptionByAnswer:
    "9\n9": js.mc.always-left-to-right
    "9.333333333333334\n1": js.mc.multiply-before-divide
misconceptions: [js.mc.always-left-to-right, js.mc.multiply-before-divide]
hints:
  - 두 줄 모두 덧셈·뺄셈보다 먼저 계산하는 연산자가 있어요. 무엇일까요?
  - "`/`와 `*`는 우선순위가 같아요. 같을 때는 어느 쪽부터 계산하나요?"
  - "1번 줄은 `4 / 2`를 먼저, 그 결과에 `* 3`을 한 뒤 마지막에 `10 -`를 해요. 2번 줄은 괄호 안부터예요."
explanation: |
  정답은 아래 두 줄이에요.

  ```text
  4
  9
  ```

  | 줄 | 계산 순서 | 결과 |
  |---|---|---|
  | 1 | `4 / 2` = 2 → `2 * 3` = 6 → `10 - 6` | 4 |
  | 2 | `(10 - 4)` = 6 → `6 / 2` = 3 → `3 * 3` | 9 |

  - `*`, `/`가 `-`보다 먼저예요. 그래서 1번 줄에서 `10 - 4`를 먼저 계산하면 안 돼요. 왼쪽부터 차례로 계산해 `9`라고 답했다면 이 규칙을 놓친 거예요.
  - `*`와 `/`는 우선순위가 같아서 **왼쪽부터** 계산해요. 곱셈을 먼저 해서 `2 * 3`부터 계산하면 `4 / 6`이 되어 엉뚱한 값이 나와요.
  - 괄호는 무엇보다 먼저 계산해요. 2번 줄은 괄호 덕분에 `10 - 4`가 먼저예요.
origin: authored
