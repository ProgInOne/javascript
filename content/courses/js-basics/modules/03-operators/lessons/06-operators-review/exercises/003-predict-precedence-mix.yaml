id: js-basics.operators.operators-review.predict-precedence-mix
type: predict_output
difficulty: 3
concepts:
  - { id: js.ops.precedence, weight: 1 }
  - { id: js.ops.arithmetic, weight: 0.3 }
  - { id: js.ops.remainder, weight: 0.3 }
  - { id: js.ops.logical-and-or-not, weight: 0.3 }
tags: [precedence, review]
estimatedSeconds: 90
usage: assessment
prompt: |
  다음 프로그램을 실행하면 콘솔에 무엇이 출력되나요?
spec:
  lang: js
  code: |
    console.log(10 - 4 / 2 * 3);
    console.log(2 + 3 * 4 < 20 && 18 % 4 === 2);
  answerKind: console
  misconceptionByAnswer:
    "9\nfalse": js.mc.always-left-to-right
    "9\ntrue": js.mc.always-left-to-right
    "9.333333333333334\ntrue": js.mc.multiply-before-divide
misconceptions: [js.mc.always-left-to-right, js.mc.multiply-before-divide]
hints:
  - "두 줄 모두 왼쪽부터 차례로 계산하면 안 돼요. 먼저 계산하는 연산자가 있어요."
  - "`*`, `/`, `%`가 `+`, `-`보다 먼저이고, 산술 연산이 비교(`<`, `===`)보다, 비교가 `&&`보다 먼저예요. 우선순위가 같으면 왼쪽부터예요."
  - "1번 줄은 `4 / 2`부터예요. 2번 줄은 `3 * 4`와 `18 % 4`를 먼저 계산한 뒤, 비교 두 개를 하고, 마지막에 `&&`를 해요."
explanation: |
  정답은 아래 두 줄이에요.

  ```text
  4
  true
  ```

  | 줄 | 계산 순서 | 결과 |
  |---|---|---|
  | 1 | `4 / 2` = 2 → `2 * 3` = 6 → `10 - 6` | `4` |
  | 2 | `3 * 4` = 12, `18 % 4` = 2 → `2 + 12` = 14 → `14 < 20` = true, `2 === 2` = true → `true && true` | `true` |

  - 1번 줄을 `9`라고 했다면 왼쪽부터 `10 - 4`를 먼저 계산했어요. `*`, `/`는 `-`보다 먼저예요.
  - `9.333333333333334`라고 했다면 곱셈을 나눗셈보다 먼저 했어요. `/`와 `*`는 우선순위가 같아서 **왼쪽부터** 계산해요.
  - 2번 줄을 왼쪽부터 계산하면 `(2 + 3) * 4`가 20이 되어 `20 < 20`이 `false`가 돼요. `*`가 `+`보다 먼저라서 14예요.
  - `18 % 4`는 18을 4로 나눈 **나머지** 2예요. 산술 연산이 끝난 뒤에 비교를 하고, 비교 결과 두 개를 마지막에 `&&`로 묶어요.

  우선순위가 헷갈리면 `(2 + 3 * 4 < 20) && (18 % 4 === 2)`처럼 괄호로 묶어 읽기 쉽게 써요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
