id: js-basics.operators.operators-review.tf-loose-converts
type: true_false
difficulty: 1
concepts:
  - { id: js.ops.loose-equality, weight: 1 }
tags: [loose-equality, review]
estimatedSeconds: 30
usage: assessment
prompt: |
  다음 설명이 맞는지 고르세요.
spec:
  statement: '`==`는 두 값의 자료형이 다르면 한쪽을 바꿔서 비교하므로, `"7" == 7`의 결과는 `true`다.'
  answer: true
  misconceptionIfWrong: js.mc.loose-equals-like-strict
misconceptions: [js.mc.loose-equals-like-strict]
hints:
  - "`==`와 `===` 중 자료형이 달라도 값을 바꿔서 비교하는 쪽은 어느 것이었나요?"
  - "`==`는 문자열 `\"7\"`을 숫자로 바꾼 다음 비교해요."
  - "바꾼 뒤에는 `7 == 7`을 비교하는 셈이에요."
explanation: |
  **맞아요.** `==`(동등 연산자)는 자료형이 다르면 값을 바꿔서 비교해요. 문자열 `"7"`이 숫자 `7`로 바뀌어 `7 == 7`이 되므로 `true`예요.

  자료형까지 같아야 `true`인 것은 `===`(일치 연산자)예요. `"7" === 7`은 `false`예요. 이런 변환 때문에 결과를 예측하기 어려워서, 실무에서는 보통 `===`를 써요.
origin: authored
