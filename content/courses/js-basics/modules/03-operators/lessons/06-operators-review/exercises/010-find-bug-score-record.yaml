id: js-basics.operators.operators-review.find-bug-score-record
type: find_bug_line
difficulty: 3
concepts:
  - { id: js.ops.relational, weight: 1 }
  - { id: js.conv.plus-concat, weight: 0.5 }
  - { id: js.conv.to-number, weight: 0.3 }
tags: [relational, string-compare, review]
estimatedSeconds: 100
usage: assessment
prompt: |
  게임 기록판이에요. 입력창에서 읽은 점수는 문자열이에요. 점수 차이는 맞게 나오는데 새 기록 여부가 이상해요. 원인이 되는 줄을 찾고, 이유도 고르세요.
spec:
  code: |-
    const myScore = "95";
    const bestScore = "100";
    const gap = bestScore - myScore;
    const isNewRecord = myScore > bestScore;
    console.log("최고 기록과 차이:", gap);
    console.log("새 기록:", isNewRecord);
  bugLines: [4]
  symptom: "`최고 기록과 차이: 5`는 맞게 나오는데, 95점이 100점보다 낮은데도 `새 기록: true`가 출력돼요."
  symptomCheck:
    console: ["최고 기록과 차이: 5", "새 기록: true"]
  fixedCode: |-
    const myScore = "95";
    const bestScore = "100";
    const gap = bestScore - myScore;
    const isNewRecord = Number(myScore) > Number(bestScore);
    console.log("최고 기록과 차이:", gap);
    console.log("새 기록:", isNewRecord);
  causeOptions:
    - id: c1
      text: "`-`와 달리 `>`는 두 값이 모두 문자열이면 숫자로 바꾸지 않고 사전 순서(첫 글자 \"9\"와 \"1\")로 비교한다"
      correct: true
    - id: c2
      text: "`-`는 문자열을 뺄 수 없어서 gap이 잘못 계산되었고, 그 영향으로 비교도 틀렸다"
      misconception: js.mc.minus-string-fails
    - id: c3
      text: "숫자처럼 보이는 문자열은 `>`에서도 자동으로 숫자로 바뀌는데, 95와 100을 비교하는 과정에서 자릿수가 달라 결과가 뒤집혔다"
      misconception: js.mc.string-compare-numeric
misconceptions: [js.mc.string-compare-numeric, js.mc.minus-string-fails]
hints:
  - 3번 줄과 4번 줄은 모두 문자열 두 개를 다뤄요. 3번 줄의 결과는 맞게 나왔다는 점에 주목하세요.
  - "`-`는 문자열을 숫자로 바꿔 계산해요. 그런데 `>`는 두 값이 모두 문자열일 때 어떻게 비교했나요?"
  - 문자열끼리 크기를 비교하면 사전에서 단어를 찾는 순서처럼 첫 글자부터 비교해요. 첫 글자 `"9"`와 `"1"`을 비교해 보세요.
explanation: |
  원인은 **4번 줄**이고, 이유는 **`>`가 문자열끼리 사전 순서로 비교했기 때문**이에요.

  - 3번 줄 `bestScore - myScore`: `-`는 이어 붙이기가 없어서 두 문자열을 숫자로 바꿔 `100 - 95` = 5를 계산해요. 그래서 차이는 맞게 나와요.
  - 4번 줄 `myScore > bestScore`: 두 값이 **모두 문자열**이면 `>`는 숫자로 바꾸지 않고 첫 글자부터 사전 순서로 비교해요. 첫 글자 `"9"`가 `"1"`보다 뒤라서 `"95" > "100"`은 `true`예요.

  고치려면 4번 줄에서 `Number(myScore) > Number(bestScore)`처럼 숫자로 바꾼 뒤 비교해요. 한쪽만 숫자로 바꿔도 다른 쪽이 숫자로 바뀌어 비교되지만, 둘 다 바꿔 두는 편이 읽기 쉬워요.

  - "`-`가 문자열을 뺄 수 없다": 뺄 수 있어요. 차이 5가 맞게 나온 것이 그 증거예요.
  - "`>`에서도 자동으로 숫자로 바뀐다": 한쪽이 숫자일 때만 문자열을 숫자로 바꿔요. 둘 다 문자열이면 바꾸지 않아요.

  1·2번 줄의 값은 입력창에서 읽은 그대로라 문자열인 것이 정상이에요. 문제는 그 값을 숫자로 바꾸지 않고 **크기를 비교한** 4번 줄이에요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
