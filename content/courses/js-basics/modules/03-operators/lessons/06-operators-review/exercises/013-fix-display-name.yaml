id: js-basics.operators.operators-review.fix-display-name
type: fix_bug
difficulty: 3
concepts:
  - { id: js.ops.short-circuit, weight: 1 }
  - { id: js.conv.truthy-falsy, weight: 0.3 }
tags: [short-circuit, default-value, review]
estimatedSeconds: 150
usage: assessment
prompt: |
  이름을 입력하지 않은 사용자(빈 문자열)는 `손님`으로, 이름을 입력한 사용자는 그 이름으로 부르려고 해요. 버그를 고쳐서 아래처럼 출력되게 하세요.

  ```text
  첫 번째 사용자: 손님
  두 번째 사용자: 민지
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          const firstName = "";
          const secondName = "민지";

          const firstDisplay = firstName && "손님";
          const secondDisplay = secondName && "손님";
          console.log("첫 번째 사용자:", firstDisplay);
          console.log("두 번째 사용자:", secondDisplay);
  solution:
    files:
      - path: main.js
        content: |
          const firstName = "";
          const secondName = "민지";

          const firstDisplay = firstName || "손님";
          const secondDisplay = secondName || "손님";
          console.log("첫 번째 사용자:", firstDisplay);
          console.log("두 번째 사용자:", secondDisplay);
  bugDescription: 첫 번째 사용자는 이름 자리가 비어 있고, 두 번째 사용자는 이름 대신 `손님`이 나와요.
  bugMisconception: js.mc.logical-returns-boolean
  maxEditDistance: 4
  checks:
    - kind: console
      id: output
      description: 이름이 없는 사용자는 손님, 이름이 있는 사용자는 그 이름이 출력되어야 합니다.
      expect:
        lines: ["첫 번째 사용자: 손님", "두 번째 사용자: 민지"]
    - kind: program
      id: values
      description: firstDisplay에는 "손님", secondDisplay에는 "민지"가 들어 있어야 합니다.
      expect:
        globals:
          firstDisplay: { equals: "손님" }
          secondDisplay: { equals: "민지" }
misconceptions: [js.mc.logical-returns-boolean]
hints:
  - "`&&`와 `||`는 true/false가 아니라 왼쪽이나 오른쪽 값 그 자체를 돌려줘요. 각각 어떤 값을 돌려주는지 떠올려 보세요."
  - "`&&`는 왼쪽이 falsy이면 왼쪽을, truthy이면 오른쪽을 돌려줘요. 그래서 `\"\" && \"손님\"`은 `\"\"`, `\"민지\" && \"손님\"`은 `\"손님\"`이에요."
  - 왼쪽이 truthy이면 왼쪽을, falsy이면 오른쪽(기본값)을 돌려주는 연산자로 바꿔 보세요.
explanation: |
  4·5번 줄의 `&&`를 `||`로 바꾸면 돼요.

  | 식 | 결과 | 이유 |
  |---|---|---|
  | `"" && "손님"` | `""` | 왼쪽이 falsy라서 왼쪽을 그대로 돌려줘요 |
  | `"민지" && "손님"` | `"손님"` | 왼쪽이 truthy라서 오른쪽을 돌려줘요 |
  | `"" \|\| "손님"` | `"손님"` | 왼쪽이 falsy라서 오른쪽(기본값)을 돌려줘요 |
  | `"민지" \|\| "손님"` | `"민지"` | 왼쪽이 truthy라서 왼쪽을 돌려줘요 |

  "값이 없으면 기본값"은 `||`(또는 `??`)의 일이에요. `&&`는 "왼쪽이 괜찮을 때만 오른쪽"이라는 뜻이라 정반대로 동작해요.

  `??`를 쓰면 어떨까요? `"" ?? "손님"`은 빈 문자열 `""`을 그대로 둬요. `??`는 null·undefined일 때만 기본값을 쓰기 때문이에요. 이 문제처럼 빈 문자열도 "입력 없음"으로 보려면 `||`가 맞아요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
