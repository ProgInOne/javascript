id: js-basics.operators.operators-review.predict-increment-values
type: predict_output
difficulty: 2
concepts:
  - { id: js.ops.increment, weight: 1 }
  - { id: js.ops.strict-equality, weight: 0.3 }
tags: [increment, strict-equality, trace, review]
estimatedSeconds: 90
usage: assessment
prompt: |
  공연장에 남은 좌석 수를 줄이면서 비교하는 프로그램이에요. 실행하면 콘솔에 무엇이 출력되나요?
spec:
  lang: js
  code: |
    let seats = 3;
    const wasThree = seats-- === 3;
    const nowOne = --seats === 1;
    console.log(wasThree, nowOne, seats);
  answerKind: console
  misconceptionByAnswer:
    "false true 1": js.mc.postfix-prefix-same
    "true false 1": js.mc.postfix-prefix-same
misconceptions: [js.mc.postfix-prefix-same]
hints:
  - "\"이름 → 값\" 표를 그려 `seats`가 줄마다 어떻게 바뀌는지 따라가 보세요. `--`는 `===`보다 먼저 계산돼요."
  - "`seats--`는 줄이기 **전** 값이 식의 값이고, `--seats`는 줄인 **뒤** 값이 식의 값이에요."
  - "2번 줄이 끝나면 seats는 2예요. 3번 줄은 그 2에서 시작해요."
explanation: |
  정답은 **`true true 1`**이에요.

  | 실행한 줄 | `--` 식의 값 | 비교 | `seats` |
  |---|---|---|---|
  | `let seats = 3;` | | | 3 |
  | `const wasThree = seats-- === 3;` | 3 (줄이기 전) | `3 === 3` → `true` | 2 |
  | `const nowOne = --seats === 1;` | 1 (줄인 뒤) | `1 === 1` → `true` | 1 |

  `++`·`--`는 앞에 붙이든 뒤에 붙이든 변수를 1씩 바꿔요. 다른 점은 **식의 값**이에요. 뒤에 붙인 `seats--`는 바꾸기 전 값(3)을, 앞에 붙인 `--seats`는 바꾼 뒤 값(1)을 비교에 넘겨요.

  - `false true 1`: `seats--`도 줄인 뒤 값(2)을 돌려준다고 생각했어요. 그러면 `2 === 3`이 되어 `false`예요.
  - `true false 1`: `--seats`도 줄이기 전 값(2)을 돌려준다고 생각했어요. 그러면 `2 === 1`이 되어 `false`예요.

  한 줄에 `--`와 비교를 섞으면 읽기 어려워요. 실무에서는 `seats--;`를 따로 한 줄에 쓰고 그다음 줄에서 비교하는 경우가 많아요.
origin: authored
review:
