id: js-basics.operators.operators-review.find-bug-snack-total
type: find_bug_line
difficulty: 3
concepts:
  - { id: js.conv.nan, weight: 1 }
  - { id: js.ops.compound-assignment, weight: 0.5 }
  - { id: js.types.undefined, weight: 0.3 }
tags: [nan, compound-assignment, review]
estimatedSeconds: 100
usage: assessment
prompt: |
  편의점에서 산 간식값을 더하는 프로그램이에요. 오류 메시지는 없는데 합계가 이상해요. 원인이 되는 줄을 찾고, 이유도 고르세요.
spec:
  code: |-
    const snack = 1500;
    const drink = 2000;
    let total;
    total += snack;
    total += drink;
    console.log("합계:", total);
  bugLines: [3]
  symptom: "`합계: 3500` 대신 `합계: NaN`이 출력돼요."
  symptomCheck:
    console: ["합계: NaN"]
  fixedCode: |-
    const snack = 1500;
    const drink = 2000;
    let total = 0;
    total += snack;
    total += drink;
    console.log("합계:", total);
  causeOptions:
    - id: c1
      text: "total을 값 없이 만들어 `undefined`인 채로 더했고, `undefined`는 숫자로 바꾸면 `NaN`이라 그 뒤 덧셈 결과도 계속 `NaN`이 되었다"
      correct: true
    - id: c2
      text: "값 없이 만든 변수는 0에서 시작하므로 3번 줄은 문제가 없고, `+=`가 숫자를 글자로 이어 붙이다가 `NaN`이 되었다"
      misconception: js.mc.plus-string-adds
    - id: c3
      text: "4번 줄에서 계산에 실패했으니 원래는 오류가 나며 멈춰야 하는데, 오류 대신 `NaN`을 출력하도록 6번 줄이 잘못 쓰였다"
      misconception: js.mc.failed-conversion-throws
misconceptions: [js.mc.failed-conversion-throws, js.mc.plus-string-adds]
hints:
  - 4번 줄이 실행되기 직전에 total에는 어떤 값이 들어 있나요?
  - "`let`으로 값 없이 만든 변수에는 `undefined`가 들어 있어요. `undefined + 1500`은 무엇일까요?"
  - "`undefined`를 숫자로 바꾸면 `NaN`이고, `NaN`에 무엇을 더해도 `NaN`이에요. NaN이 처음 생긴 원인은 4번 줄보다 위에 있어요."
explanation: |
  원인은 **3번 줄**이고, 이유는 **total에 처음 값을 넣지 않아 `undefined`에 더했기 때문**이에요.

  | 줄 | `total` |
  |---|---|
  | 3 `let total;` | `undefined` |
  | 4 `total += snack;` | `undefined + 1500` → `NaN` |
  | 5 `total += drink;` | `NaN + 2000` → `NaN` |

  - `+=`는 `total = total + snack`이에요. `undefined`는 숫자로 바꾸면 `NaN`이라서 4번 줄의 결과가 `NaN`이 돼요.
  - `NaN`은 한 번 생기면 그 뒤의 산술 연산 결과도 모두 `NaN`이에요. 그래서 5번 줄에서 2000을 더해도 그대로예요.
  - 고치려면 3번 줄을 `let total = 0;`으로 바꿔 더하기 시작할 값을 넣어 줘요.

  - "값 없이 만든 변수는 0에서 시작한다": 0이 아니라 `undefined`가 들어 있어요. 또 여기에는 문자열이 없어서 이어 붙이기도 일어나지 않아요.
  - "계산에 실패하면 오류가 나야 한다": JavaScript는 숫자로 바꿀 수 없는 값을 계산해도 멈추지 않고 결과를 `NaN`으로 만들어요. 6번 줄은 받은 값을 출력했을 뿐이에요.

  `NaN`이 보이면 출력한 줄이 아니라 **NaN이 처음 생긴 줄**을 거슬러 올라가 찾아요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
