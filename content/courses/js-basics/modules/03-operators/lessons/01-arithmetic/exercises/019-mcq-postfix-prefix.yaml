id: js-basics.operators.arithmetic.mcq-postfix-prefix
type: mcq_single
difficulty: 2
concepts:
  - { id: js.ops.increment, weight: 1 }
tags: [increment, postfix, prefix]
estimatedSeconds: 75
prompt: |
  다음 코드를 실행한 뒤 `a`, `b`, `c`에 들어 있는 값은 무엇인가요?
code: |
  let a = 3;
  let b = ++a;
  let c = a++;
spec:
  options:
    - id: x1
      text: "`a`는 5, `b`는 4, `c`는 4"
    - id: x2
      text: "`a`는 5, `b`는 4, `c`는 5"
      misconception: js.mc.postfix-prefix-same
      rationale: a++의 값은 늘리기 전 값이에요. 3번 줄을 실행할 때 a는 4라서 c에는 4가 들어가요.
    - id: x3
      text: "`a`는 5, `b`는 3, `c`는 5"
      misconception: js.mc.postfix-prefix-same
      rationale: 앞뒤의 뜻을 거꾸로 생각한 경우예요. ++a는 늘린 뒤 값, a++는 늘리기 전 값이에요.
    - id: x4
      text: "`a`는 4, `b`는 4, `c`는 4"
      rationale: 두 줄 모두 a를 1씩 늘려요. 3번 줄에서 c에 4를 넣은 뒤 a는 5가 돼요.
  correct: x1
hints:
  - "`++a`와 `a++`는 모두 `a`를 1 늘려요. 그렇다면 `a`는 몇 번 늘어나나요?"
  - 차이는 식의 값이에요. 앞에 붙이면 늘린 뒤 값, 뒤에 붙이면 늘리기 전 값이에요.
  - "\"이름 → 값\" 표를 그려 2번 줄 다음과 3번 줄 다음의 a, b, c를 적어 보세요."
explanation: |
  정답은 **`a`는 5, `b`는 4, `c`는 4**예요.

  | 실행한 줄 | 일어나는 일 | `a` | `b` | `c` |
  |---|---|---|---|---|
  | `let a = 3;` | | 3 | | |
  | `let b = ++a;` | a를 4로 늘린 뒤 그 값 4를 b에 넣음 | 4 | 4 | |
  | `let c = a++;` | 늘리기 전 값 4를 c에 넣고 a는 5 | 5 | 4 | 4 |

  - c를 5라고 했다면 `a++`도 늘린 뒤 값을 준다고 생각한 거예요. 뒤에 붙인 `a++`는 늘리기 **전** 값이에요.
  - b를 3, c를 5라고 했다면 앞에 붙일 때와 뒤에 붙일 때의 뜻을 거꾸로 기억한 거예요. "앞에 붙이면 먼저 늘리기"로 기억해요.
  - a를 4라고 했다면 늘어나는 횟수를 한 번 놓친 거예요. 두 줄 모두 a를 늘려요.
