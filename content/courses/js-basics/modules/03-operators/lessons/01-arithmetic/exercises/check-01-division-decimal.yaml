id: js-basics.operators.arithmetic.check-division-decimal
type: predict_output
difficulty: 1
usage: check
concepts:
  - { id: js.ops.arithmetic, weight: 1 }
tags: [division]
estimatedSeconds: 50
prompt: |
  피자 7조각을 두 사람이 똑같이 나눠요. 실행하면 콘솔에 무엇이 출력되나요? 나오는 줄을 모두 순서대로 쓰세요.
spec:
  lang: js
  code: |
    const each = 7 / 2;
    console.log(each);
    console.log(each * 2);
  answerKind: console
  misconceptionByAnswer:
    "3\n6": js.mc.division-truncates
misconceptions: [js.mc.division-truncates]
hints:
  - JavaScript의 `/`는 나머지를 버릴까요, 소수까지 계산할까요?
  - 1번 줄에서 `each`에 들어가는 값을 먼저 정하세요. 7 ÷ 2를 소수로 쓰면 얼마인가요?
  - 3번 줄은 그 값에 다시 2를 곱해요.
explanation: |
  정답은 다음 두 줄이에요.

  ```text
  3.5
  7
  ```

  - JavaScript의 `/`는 나머지를 버리지 않고 소수까지 계산해요. 그래서 `each`에는 `3.5`가 들어가요.
  - `3.5 * 2`는 `7`이에요. 나눈 값을 다시 곱하면 처음 수로 돌아와요.

  `3`과 `6`이라고 답했다면 `/`가 몫만 남긴다고 생각한 거예요. 몫만 필요하다면 레슨에서 본 것처럼 나머지를 먼저 빼고 나누면 돼요: `(7 - 7 % 2) / 2`는 `3`이에요.
