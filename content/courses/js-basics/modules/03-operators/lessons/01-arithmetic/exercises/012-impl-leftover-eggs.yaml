id: js-basics.operators.arithmetic.impl-leftover-eggs
type: implement_function
difficulty: 2
concepts:
  - { id: js.ops.remainder, weight: 1 }
tags: [remainder, write-code]
estimatedSeconds: 120
prompt: |
  달걀 50개를 한 판에 12개씩 담으려고 해요. 판을 꽉 채우고 **남는 달걀 수**를 `leftover`에 계산해 넣고, 아래처럼 출력하세요.

  ```text
  남는 달걀: 2
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const eggs = 50;
          const perTray = 12;

          // 판을 꽉 채우고 남는 달걀 수를 leftover에 넣고 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          const eggs = 50;
          const perTray = 12;

          const leftover = eggs % perTray;
          console.log("남는 달걀:", leftover);
  checks:
    - kind: console
      id: output
      description: 남는 달걀 수가 출력되어야 합니다.
      requirement: 남는 달걀 출력
      expect:
        lines: ["남는 달걀: 2"]
    - kind: program
      id: leftover
      description: leftover에 50을 12로 나눈 나머지가 들어 있어야 합니다.
      requirement: 나머지 계산
      misconceptionIfFail: js.mc.remainder-is-quotient
      expect:
        globals: { leftover: { equals: 2 } }
        noError: true
misconceptions: [js.mc.remainder-is-quotient]
hints:
  - 12개씩 묶고 "남는" 수는 나눗셈의 무엇일까요?
  - 이 단원에서 나머지를 구하는 연산자를 배웠어요.
  - 50 = 12 × 4 + ?예요. 물음표를 구하는 연산자로 `eggs`와 `perTray`를 계산해 보세요.
explanation: |
  예시 정답은 `const leftover = eggs % perTray;`예요.

  50을 12로 나누면 50 = 12 × 4 + 2라서 4판을 채우고 2개가 남아요. 남는 수는 나머지이니 `%`로 구해요.

  - `eggs / perTray`는 4.1666…이에요. 몫도 나머지도 아닌 소수예요.
  - `2`를 직접 쓰면 이번 출력은 맞지만, 달걀 수가 바뀌면 다시 계산해야 해요. 변수로 계산해 두면 `eggs`만 바꿔도 맞는 답이 나와요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
