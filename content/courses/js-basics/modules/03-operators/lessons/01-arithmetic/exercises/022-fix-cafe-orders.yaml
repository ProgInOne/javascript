id: js-basics.operators.arithmetic.fix-cafe-orders
type: fix_bug
difficulty: 5
concepts:
  - { id: js.ops.increment, weight: 1 }
  - { id: js.ops.compound-assignment, weight: 0.5 }
  - { id: js.ops.remainder, weight: 0.5 }
  - { id: js.ops.arithmetic, weight: 0.3 }
tags: [increment, compound-assignment, remainder, debugging]
estimatedSeconds: 480
prompt: |
  카페 주문 정산 프로그램이에요. 커피는 한 잔 4500원이에요.

  - 주문 번호는 1번부터 시작해요. 주문이 들어올 때마다 번호를 1 늘리고, 늘린 번호를 그 주문에 붙여요.
  - 주문마다 합계에 금액을 더해요.
  - 마지막에 합계에서 **10%를 할인**해요.

  오류는 나지 않는데 숫자가 여러 군데 틀려요. 버그를 **세 개** 찾아 고쳐서 아래처럼 출력되게 하세요.

  ```text
  주문 1 합계 9000
  주문 2 합계 22500
  할인 후 20250
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          const coffeePrice = 4500;
          let orderNo = 0;
          let total = 0;

          // 첫 주문: 커피 2잔
          const firstNo = orderNo++;
          total += coffeePrice * 2;
          console.log("주문", firstNo, "합계", total);

          // 두 번째 주문: 커피 3잔
          const secondNo = orderNo++;
          total =+ coffeePrice * 3;
          console.log("주문", secondNo, "합계", total);

          total -= total % 10; // 10% 할인
          console.log("할인 후", total);
  solution:
    files:
      - path: main.js
        content: |
          const coffeePrice = 4500;
          let orderNo = 0;
          let total = 0;

          // 첫 주문: 커피 2잔
          const firstNo = ++orderNo;
          total += coffeePrice * 2;
          console.log("주문", firstNo, "합계", total);

          // 두 번째 주문: 커피 3잔
          const secondNo = ++orderNo;
          total += coffeePrice * 3;
          console.log("주문", secondNo, "합계", total);

          total -= total * 10 / 100; // 10% 할인
          console.log("할인 후", total);
  bugDescription: 주문 번호가 0번부터 나오고, 두 번째 합계와 할인 후 금액이 이상해요. 오류 메시지는 없어요.
  bugMisconception: js.mc.postfix-prefix-same
  maxEditDistance: 10
  checks:
    - kind: console
      id: output
      description: 주문 번호 1·2와 합계, 할인 후 금액이 정해진 순서로 출력되어야 합니다.
      requirement: 정산 출력
      expect:
        lines: ["주문 1 합계 9000", "주문 2 합계 22500", "할인 후 20250"]
    - kind: program
      id: order-numbers
      description: 주문 번호는 늘린 뒤의 값이어야 합니다(firstNo 1, secondNo 2, orderNo 2).
      requirement: 주문 번호
      misconceptionIfFail: js.mc.postfix-prefix-same
      expect:
        globals:
          firstNo: { equals: 1 }
          secondNo: { equals: 2 }
          orderNo: { equals: 2 }
        noError: true
    - kind: program
      id: final-total
      description: total은 두 주문의 합계에서 10%를 할인한 금액이어야 합니다.
      requirement: 할인 후 합계
      misconceptionIfFail: js.mc.remainder-is-percent
      expect:
        globals:
          total: { closeTo: { value: 20250, epsilon: 0.000001 } }
misconceptions: [js.mc.postfix-prefix-same, js.mc.compound-operator-reversed, js.mc.remainder-is-percent]
hints:
  - 출력을 한 줄씩 기대 출력과 비교해 보세요. 주문 번호, 두 번째 합계, 할인 후 금액이 각각 다른 버그 때문에 틀려요.
  - "주문 번호: `orderNo++`의 값은 늘리기 전일까요, 늘린 뒤일까요? 두 번째 합계: 12번 줄의 연산자를 7번 줄과 글자 순서까지 비교해 보세요."
  - "할인: `%`는 이 단원에서 배운 대로 퍼센트가 아니라 나머지예요. 22500원의 10%는 22500 × 10 ÷ 100이에요."
explanation: |
  버그가 세 개이고, 모두 오류 없이 숫자만 틀리게 만들어요.

  1. **6번·11번 줄 `orderNo++`**: 뒤에 붙인 `++`의 값은 늘리기 **전** 값이라 주문 번호가 0, 1이 됐어요. 늘린 번호를 쓰도록 `++orderNo`로 고쳐요(또는 `orderNo++;`를 따로 쓴 뒤 `const firstNo = orderNo;`).
  1. **12번 줄 `total =+ coffeePrice * 3`**: `total = +13500`으로 읽혀서 합계를 13500으로 **덮어썼어요**. `+=`로 고치면 9000 + 13500 = 22500이 돼요.
  1. **15번 줄 `total -= total % 10`**: `22500 % 10`은 나머지 0이라 할인이 안 됐어요. 10%는 `total * 10 / 100`(2250)이에요. 22500 − 2250 = 20250이에요. `total *= 0.9`도 같은 결과예요.

  | 시점 | 고치기 전 | 고친 뒤 |
  |---|---|---|
  | 첫 주문 출력 | 주문 0 합계 9000 | 주문 1 합계 9000 |
  | 두 번째 주문 출력 | 주문 1 합계 13500 | 주문 2 합계 22500 |
  | 할인 후 | 13500 | 20250 |

  오류 메시지가 없는 버그는 기대 출력과 실제 출력을 한 줄씩 비교하고, 틀린 값이 처음 생긴 줄부터 거슬러 올라가며 찾아요.
