id: js-basics.operators.arithmetic.impl-seconds-to-time
type: implement_function
difficulty: 4
concepts:
  - { id: js.ops.remainder, weight: 1 }
  - { id: js.ops.precedence, weight: 0.5 }
  - { id: js.ops.arithmetic, weight: 0.5 }
tags: [remainder, time, write-code]
estimatedSeconds: 480
prompt: |
  운동 기록 앱이 운동 시간을 초 단위로 저장해요. `totalSeconds`(7385초)를 시간·분·초로 나눠 `hours`, `minutes`, `seconds`에 넣고, 아래처럼 출력하세요.

  ```text
  2 시간 3 분 5 초
  ```

  - 1시간은 3600초, 1분은 60초예요.
  - `hours`, `minutes`, `seconds`는 모두 소수가 없는 정수여야 해요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          const totalSeconds = 7385;

          // hours, minutes, seconds를 계산하세요.

          console.log(hours, "시간", minutes, "분", seconds, "초");
  solution:
    files:
      - path: main.js
        content: |
          const totalSeconds = 7385;

          const hours = (totalSeconds - totalSeconds % 3600) / 3600;
          const rest = totalSeconds % 3600;
          const minutes = (rest - rest % 60) / 60;
          const seconds = rest % 60;

          console.log(hours, "시간", minutes, "분", seconds, "초");
  checks:
    - kind: console
      id: output
      description: 시간·분·초가 정해진 형식으로 출력되어야 합니다.
      requirement: 시간 출력
      expect:
        lines: ["2 시간 3 분 5 초"]
    - kind: program
      id: hours
      description: hours에 꽉 찬 시간 수(정수)가 들어 있어야 합니다.
      requirement: 시간 계산
      misconceptionIfFail: js.mc.division-truncates
      expect:
        globals: { hours: { equals: 2 } }
        noError: true
    - kind: program
      id: minutes-seconds
      description: minutes와 seconds에 시간을 빼고 남은 분과 초(정수)가 들어 있어야 합니다.
      requirement: 분·초 계산
      misconceptionIfFail: js.mc.remainder-is-quotient
      expect:
        globals:
          minutes: { equals: 3 }
          seconds: { equals: 5 }
misconceptions: [js.mc.remainder-is-quotient, js.mc.division-truncates]
hints:
  - "`totalSeconds / 3600`은 2.05…처럼 소수가 나와요. 레슨의 실전 사용 사례에서 135초를 분과 초로 바꾼 방법을 떠올려 보세요."
  - 꽉 찬 시간 수는 3600으로 나눈 나머지를 먼저 빼고 나누면 나누어떨어져요. 시간을 채우고 남은 초는 `totalSeconds % 3600`이고, 이 남은 초로 분과 초를 같은 방법으로 구해요.
  - "남은 초가 185라면 분은 (185 - 185 % 60) / 60, 초는 185 % 60이에요. 남은 초를 변수에 넣어 두면 식이 짧아져요."
explanation: |
  예시 정답이에요.

  ```js
  const hours = (totalSeconds - totalSeconds % 3600) / 3600;  // (7385 - 185) / 3600 = 2
  const rest = totalSeconds % 3600;                            // 185
  const minutes = (rest - rest % 60) / 60;                     // (185 - 5) / 60 = 3
  const seconds = rest % 60;                                   // 5
  ```

  | 값 | 계산 | 결과 |
  |---|---|---|
  | `totalSeconds % 3600` | 7385 = 3600 × 2 + 185 | 185 |
  | `hours` | (7385 − 185) ÷ 3600 | 2 |
  | `minutes` | (185 − 5) ÷ 60 | 3 |
  | `seconds` | 185 = 60 × 3 + 5 | 5 |

  - `totalSeconds / 3600`만 쓰면 2.0513…이 돼요. `/`는 소수까지 계산하니까요. 나머지를 빼면 나누어떨어져 정수 몫이 나와요.
  - 괄호가 꼭 필요해요. `totalSeconds - totalSeconds % 3600 / 3600`은 `/`가 먼저 계산돼 엉뚱한 값이 돼요.
  - `seconds`를 `totalSeconds % 60`으로 구해도 5가 나와요. 분은 `totalSeconds % 3600`에서 구해야 시간이 빠진 분이 돼요.
  - 소수점 아래를 버리는 `Math.floor(값)`을 알고 있다면 `Math.floor(totalSeconds / 3600)`처럼 써도 정답이에요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
