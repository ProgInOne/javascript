id: js-basics.operators.arithmetic.we-arithmetic-1
type: fill_blank
difficulty: 2
concepts:
  - { id: js.ops.arithmetic, weight: 1 }
tags: [arithmetic, division, precedence, worked-example]
estimatedSeconds: 90
usage: worked_example
workedExampleStage: 1
prompt: |
  **풀이 예제 2단계: 빈칸 채우기**

  앞 단계와 같은 방식의 문제예요. "4주 동안 걸은 거리(km) 70, 85, 90, 81의 합계와 주 평균을 출력하세요."

  풀이의 나머지는 완성되어 있어요. 주석을 읽고 빈칸 두 곳에 **계산식**을 쓰세요(결과 숫자를 직접 쓰지 말고 변수로 계산하세요). 실행하면 아래처럼 나와야 해요.

  ```text
  합계: 326
  평균: 81.5
  ```
spec:
  mode: code
  lang: js
  template: |
    // 1. 4주 동안 걸은 거리예요.
    const week1 = 70;
    const week2 = 85;
    const week3 = 90;
    const week4 = 81;
    // 2. 네 변수를 모두 더한 합계를 만들어요.
    const total = {{blank:total}};
    // 3. 합계를 4로 나눠 평균을 만들어요. /는 소수까지 계산해요.
    const average = {{blank:average}};
    console.log("합계:", total);
    console.log("평균:", average);
  blanks:
    - id: total
      accept: ["week1 + week2 + week3 + week4"]
      width: 32
    - id: average
      accept: ["total / 4"]
      width: 32
  checks:
    - kind: console
      id: output
      description: "\"합계: 326\"과 \"평균: 81.5\"가 차례로 출력되어야 합니다."
      requirement: 합계와 평균 출력
      expect:
        lines: ["합계: 326", "평균: 81.5"]
      misconceptionIfFail: js.mc.division-truncates
    - kind: program
      id: values
      description: 프로그램이 오류 없이 끝나고, total은 326, average는 81.5여야 합니다.
      requirement: 계산한 값
      expect:
        globals:
          total: { equals: 326 }
          average: { equals: 81.5 }
        noError: true
misconceptions: [js.mc.division-truncates]
hints:
  - 앞 단계 풀이에서는 합계와 나눗셈을 한 줄에 썼어요. 여기서는 두 줄로 나눠 쓰면 돼요.
  - 합계 빈칸은 네 변수를 `+`로 이어요. 평균 빈칸은 이미 만든 total을 쓰면 괄호가 필요 없어요.
  - "합계는 `week1 + week2 + week3 + week4`, 평균은 `total / 4`예요."
explanation: |
  예시 정답은 다음과 같아요.

  ```js
  const total = week1 + week2 + week3 + week4;
  const average = total / 4;
  ```

  합계를 변수 `total`에 먼저 담아 두면, 앞 단계의 `(test1 + test2 + test3 + test4) / 4`처럼 괄호를 쓰지 않아도 계산 순서가 분명해요. 한 줄로 쓰고 싶다면 `(week1 + week2 + week3 + week4) / 4`처럼 괄호가 꼭 필요해요. `week1 + week2 + week3 + week4 / 4`는 `week4 / 4`만 먼저 나눠서 265.25가 돼요.

  `326 / 4`는 소수까지 계산해 81.5예요. 다음 단계에서는 처음부터 직접 써 봐요.
