id: js-basics.operators.arithmetic
title: 산술 연산
summary: 사칙연산과 거듭제곱, 나머지로 숫자를 계산하고, 계산 순서와 변수 값을 바꾸는 줄임 표현(+=, ++)을 배웁니다.
kind: lesson
importance: core
estimatedMinutes: { read: 15, practice: 25 }
concepts:
  primary:
    - js.ops.arithmetic
    - js.ops.precedence
    - js.ops.remainder
    - js.ops.compound-assignment
    - js.ops.increment
  reviewed: [js.values.assignment, js.values.let, js.values.const]
objectives:
  - "+ - * / ** 로 계산식을 쓰고, 나눗셈이 소수까지 계산된다는 점을 고려해 결과를 예측할 수 있다."
  - 우선순위와 괄호에 따라 계산식이 어떤 순서로 계산되는지 단계별로 설명할 수 있다.
  - "%로 나머지를 구해 짝수·홀수나 묶고 남는 개수를 계산할 수 있다."
  - "+=, -= 같은 복합 대입과 ++, --로 변수 값을 바꾸고, a++와 ++a의 값 차이를 예측할 수 있다."
practice:
  targetCount: 22
