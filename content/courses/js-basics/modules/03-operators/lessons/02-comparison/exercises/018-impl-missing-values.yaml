id: js-basics.operators.comparison.impl-missing-values
type: implement_function
difficulty: 3
concepts:
  - { id: js.ops.loose-equality, weight: 1 }
tags: [loose-equality, "null", "undefined", write-code]
estimatedSeconds: 240
prompt: |
  회원 정보 중 아직 채워지지 않은 항목을 찾으려고 해요. 항목의 값이 `null`이거나 `undefined`이면 "비어 있음"이에요.

  - `nicknameEmpty`, `phoneEmpty`, `emailEmpty`: 각 항목이 비어 있으면 `true`, 아니면 `false`인 변수
  - 세 값은 직접 `true`/`false`를 쓰지 말고 **비교 연산자로 계산**하세요. 위의 세 줄은 그대로 두세요.

  실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  닉네임 비어 있음: true
  전화번호 비어 있음: true
  이메일 비어 있음: false
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const nickname = undefined;   // 아직 입력하지 않음
          const phone = null;           // 입력하지 않겠다고 고름
          const email = "coco@example.com";

          // 여기에 세 변수를 만들고 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          const nickname = undefined;   // 아직 입력하지 않음
          const phone = null;           // 입력하지 않겠다고 고름
          const email = "coco@example.com";

          const nicknameEmpty = nickname == null;
          const phoneEmpty = phone == null;
          const emailEmpty = email == null;
          console.log("닉네임 비어 있음:", nicknameEmpty);
          console.log("전화번호 비어 있음:", phoneEmpty);
          console.log("이메일 비어 있음:", emailEmpty);
  checks:
    - kind: console
      id: output
      description: 세 항목의 비어 있음 여부가 정해진 형식으로 차례로 출력되어야 합니다.
      requirement: 결과 출력
      expect:
        lines:
          - "닉네임 비어 있음: true"
          - "전화번호 비어 있음: true"
          - "이메일 비어 있음: false"
    - kind: program
      id: values
      description: 프로그램이 오류 없이 끝나고, nicknameEmpty와 phoneEmpty는 true, emailEmpty는 false여야 합니다.
      requirement: 비교 결과 저장
      expect:
        globals:
          nicknameEmpty: { equals: true }
          phoneEmpty: { equals: true }
          emailEmpty: { equals: false }
        noError: true
hints:
  - "\"null이거나 undefined인가\"를 한 번의 비교로 확인하는 방법을 레슨에서 배웠어요."
  - "`==`는 `null`과 `undefined`를 같다고 봐요. 그러면 `값 == null`은 값이 무엇일 때 true일까요?"
  - "`const nicknameEmpty = nickname == null;`처럼 세 항목을 같은 모양으로 비교하고 출력하세요."
explanation: |
  예시 정답이에요.

  ```js
  const nicknameEmpty = nickname == null;
  const phoneEmpty = phone == null;
  const emailEmpty = email == null;
  ```

  `==`는 `null`과 `undefined`를 서로 같다고 보고, 그 밖의 값과는 같다고 보지 않아요. 그래서 `값 == null` 하나로 "null이거나 undefined인가"를 확인할 수 있어요. 실무에서 `==`를 일부러 쓰는 거의 유일한 경우예요.

  `nickname === undefined`, `phone === null`처럼 항목마다 맞는 값을 `===`로 비교해도 이 문제는 통과해요. 다만 어느 항목이 `null`이고 어느 항목이 `undefined`일지 미리 알아야 하죠. `== null`은 둘 중 무엇이든 한 번에 잡아 줘요. 반대로 `nickname === null`은 `undefined`를 놓쳐서 `false`가 나와요.
origin: authored
