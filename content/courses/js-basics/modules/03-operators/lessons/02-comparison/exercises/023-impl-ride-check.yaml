id: js-basics.operators.comparison.impl-ride-check
type: implement_function
difficulty: 3
concepts:
  - { id: js.ops.relational, weight: 1 }
tags: [relational, boundary, write-code]
estimatedSeconds: 360
prompt: |
  놀이공원 롤러코스터의 탑승 안내문이에요.

  > 키 **120cm 이상**, **190cm 미만**인 분만 탈 수 있어요. **8세부터** 탈 수 있어요. **5세 이하** 어린이는 입장료가 무료예요.

  안내문의 네 조건을 변수로 만들고 출력하는 프로그램을 작성하세요.

  | 변수 | 조건 |
  |---|---|
  | `tallEnough` | 키가 120cm 이상 |
  | `notTooTall` | 키가 190cm 미만 |
  | `oldEnough` | 나이가 8세 이상 |
  | `isFree` | 나이가 5세 이하 |

  - 네 값은 직접 쓰지 말고 `height`, `age`로 **계산**하세요. 위의 두 줄은 그대로 두세요.
  - 키 120cm, 7세인 손님이면 콘솔에 아래처럼 나와야 해요.

  ```text
  키 120 이상: true
  키 190 미만: true
  8세 이상: false
  무료 입장: false
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const height = 120;   // 키(cm)
          const age = 7;        // 나이

          // 여기에 네 조건을 변수로 만들고 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          const height = 120;   // 키(cm)
          const age = 7;        // 나이

          const tallEnough = height >= 120;
          const notTooTall = height < 190;
          const oldEnough = age >= 8;
          const isFree = age <= 5;
          console.log("키 120 이상:", tallEnough);
          console.log("키 190 미만:", notTooTall);
          console.log("8세 이상:", oldEnough);
          console.log("무료 입장:", isFree);
  checks:
    - kind: console
      id: output
      description: 네 조건의 결과가 정해진 형식과 순서로 출력되어야 합니다.
      requirement: 결과 출력
      expect:
        lines:
          - "키 120 이상: true"
          - "키 190 미만: true"
          - "8세 이상: false"
          - "무료 입장: false"
    - kind: program
      id: height-conditions
      description: 키가 기준값 120과 딱 같아도 tallEnough는 true이고, notTooTall도 true여야 합니다.
      requirement: 키 조건
      expect:
        globals:
          tallEnough: { equals: true }
          notTooTall: { equals: true }
        noError: true
    - kind: program
      id: age-conditions
      description: 7세 손님이면 oldEnough와 isFree가 모두 false여야 합니다.
      requirement: 나이 조건
      expect:
        globals:
          oldEnough: { equals: false }
          isFree: { equals: false }
hints:
  - 안내문의 "이상", "미만", "부터", "이하"가 각각 기준값을 포함하는지부터 정하세요.
  - "\"이상\"과 \"이하\"는 기준값을 포함하고, \"미만\"은 포함하지 않아요. \"8세부터\"는 8세를 포함하니 \"8세 이상\"과 같아요."
  - "`tallEnough`는 `height >= 120`이에요. 나머지 세 조건도 `<`, `>=`, `<=` 중에서 골라 같은 모양으로 쓰세요."
explanation: |
  예시 정답이에요.

  ```js
  const tallEnough = height >= 120;   // 이상: 120도 포함
  const notTooTall = height < 190;    // 미만: 190은 포함하지 않음
  const oldEnough = age >= 8;         // 8세부터 = 8세 이상
  const isFree = age <= 5;            // 이하: 5도 포함
  ```

  | 우리말 | 연산자 | 기준값 포함 |
  |---|---|---|
  | 이상, ~부터 | `>=` | 포함 |
  | 초과 | `>` | 포함 안 함 |
  | 이하, ~까지 | `<=` | 포함 |
  | 미만 | `<` | 포함 안 함 |

  키가 딱 120cm인 이 손님은 `height > 120`으로 쓰면 탈 수 없다고 나와요. 요구사항을 연산자로 옮길 때는 **기준값과 같은 경우**를 꼭 따져 보세요.
origin: authored
review:
