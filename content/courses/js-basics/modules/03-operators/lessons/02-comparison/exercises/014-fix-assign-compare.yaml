id: js-basics.operators.comparison.fix-assign-compare
type: fix_bug
difficulty: 3
concepts:
  - { id: js.ops.strict-equality, weight: 1 }
  - { id: js.values.assignment, weight: 0.3 }
tags: [strict-equality, assignment, debugging]
estimatedSeconds: 150
prompt: |
  점수가 만점(100점)인지 확인하는 프로그램이에요. 80점인 학생인데 실행 결과가 이상해요. 버그를 고쳐서 아래처럼 출력되게 하세요.

  ```text
  점수: 80
  만점: false
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          let score = 80;
          const isPerfect = score = 100;
          console.log("점수:", score);
          console.log("만점:", isPerfect);
  solution:
    files:
      - path: main.js
        content: |
          let score = 80;
          const isPerfect = score === 100;
          console.log("점수:", score);
          console.log("만점:", isPerfect);
  bugDescription: 점수가 80이어야 하는데 100으로 바뀌어 출력되고, 만점 여부는 true나 false가 아니라 100으로 나와요.
  bugMisconception: js.mc.assign-as-compare
  maxEditDistance: 3
  checks:
    - kind: console
      id: output
      description: 점수 80과 만점 여부 false가 출력되어야 합니다.
      requirement: 결과 출력
      expect:
        lines: ["점수: 80", "만점: false"]
    - kind: program
      id: values
      description: 끝났을 때 score는 그대로 80이고, isPerfect에는 비교 결과 false가 들어 있어야 합니다.
      requirement: 점수 유지
      expect:
        globals:
          score: { equals: 80 }
          isPerfect: { equals: false }
        noError: true
misconceptions: [js.mc.assign-as-compare]
hints:
  - 점수가 바뀌었다는 것은 어딘가에서 score에 값을 넣었다는 뜻이에요. 어느 줄일까요?
  - "2번 줄의 `score = 100`은 비교일까요, 대입일까요?"
  - 같은지 비교하는 연산자는 `=`가 아니라 기호 세 개짜리예요.
explanation: |
  2번 줄의 `score = 100`이 버그예요. `=`는 비교가 아니라 **대입**이라서 score에 100을 넣고, 넣은 값 100이 `isPerfect`에 들어갔어요. 그래서 두 출력이 모두 100이 됐어요.

  `const isPerfect = score === 100;`으로 고치면 score는 그대로 80이고, `isPerfect`에는 비교 결과 `false`가 들어가요.

  `==`로 고쳐도 이 문제에서는 같은 결과가 나오지만, 자료형까지 비교하는 `===`를 쓰는 습관을 들여요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
