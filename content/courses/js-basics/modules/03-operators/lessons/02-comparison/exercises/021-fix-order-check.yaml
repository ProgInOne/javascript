id: js-basics.operators.comparison.fix-order-check
type: fix_bug
difficulty: 4
concepts:
  - { id: js.ops.strict-equality, weight: 1 }
  - { id: js.values.assignment, weight: 0.3 }
tags: [strict-equality, nan, assignment, debugging]
estimatedSeconds: 300
prompt: |
  주문을 확인하는 프로그램이에요. 가격이 `"8000원"`처럼 글자로 잘못 들어와서 합계 계산이 실패하는 상황을 일부러 넣어 두었어요. 프로그램은 이 실패를 알아채야 하는데, 결과가 모두 이상해요.

  가격과 수량, 결제 금액 값은 바꾸지 말고, **확인하는 부분만** 고쳐서 아래처럼 출력되게 하세요.

  ```text
  가격 오류: true
  결제 완료: false
  수량 있음: true
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          const quantity = 2;
          const total = "8000원" * quantity;
          let paidAmount = 16000;

          const isPriceError = total === NaN;
          const isFullyPaid = paidAmount = total;
          const hasQuantity = quantity !== 0;

          console.log("가격 오류:", isPriceError);
          console.log("결제 완료:", isFullyPaid);
          console.log("수량 있음:", hasQuantity);
  solution:
    files:
      - path: main.js
        content: |
          const quantity = 2;
          const total = "8000원" * quantity;
          let paidAmount = 16000;

          const isPriceError = Number.isNaN(total);
          const isFullyPaid = paidAmount === total;
          const hasQuantity = quantity !== 0;

          console.log("가격 오류:", isPriceError);
          console.log("결제 완료:", isFullyPaid);
          console.log("수량 있음:", hasQuantity);
  bugDescription: 합계 계산이 실패했는데 "가격 오류"가 false로 나오고, "결제 완료"는 true/false가 아니라 NaN으로 나와요.
  bugMisconception: js.mc.nan-equals-nan
  maxEditDistance: 8
  checks:
    - kind: console
      id: output
      description: 가격 오류, 결제 완료, 수량 있음이 차례로 true, false, true로 출력되어야 합니다.
      requirement: 확인 결과 출력
      expect:
        lines: ["가격 오류: true", "결제 완료: false", "수량 있음: true"]
    - kind: program
      id: price-error
      description: isPriceError는 합계가 NaN인 것을 알아채 true여야 합니다.
      requirement: 계산 실패 알아채기
      expect:
        globals:
          isPriceError: { equals: true }
      misconceptionIfFail: js.mc.nan-equals-nan
    - kind: program
      id: paid
      description: 결제 금액 paidAmount는 처음 값 16000 그대로이고, isFullyPaid에는 비교 결과 false가 들어 있어야 합니다.
      requirement: 결제 금액 유지
      expect:
        globals:
          paidAmount: { equals: 16000 }
          isFullyPaid: { equals: false }
        noError: true
      misconceptionIfFail: js.mc.assign-as-compare
misconceptions: [js.mc.nan-equals-nan, js.mc.assign-as-compare]
hints:
  - 확인하는 줄은 5~7번 줄이에요. 세 줄 중 결과가 이상한 두 줄을 각각 따로 살펴보세요.
  - 5번 줄은 NaN을 `===`로 확인하고 있어요. NaN을 비교하면 어떻게 되나요? 6번 줄의 `=`는 비교일까요?
  - 5번 줄은 NaN인지 확인하는 전용 방법으로, 6번 줄은 결제 금액과 합계가 같은지 묻는 비교로 바꾸세요.
explanation: |
  버그는 두 개예요.

  1. **5번 줄 `total === NaN`**: NaN은 자기 자신과도 같지 않아서 이 비교는 항상 `false`예요. `Number.isNaN(total)`로 고치면 `true`가 나와요.
  1. **6번 줄 `paidAmount = total`**: `=`는 대입이라 결제 금액이 NaN으로 덮어써지고, `isFullyPaid`에도 NaN이 들어갔어요. `paidAmount === total`로 고치면 `16000 === NaN`을 비교해 `false`가 나오고, 결제 금액은 16000 그대로예요.

  7번 줄의 `quantity !== 0`은 "수량이 0이 아닌가?"를 올바르게 묻고 있어서 고칠 필요가 없어요. 2번 줄의 `"8000원"`은 문제에서 일부러 넣은 잘못된 입력이에요. 이 프로그램이 할 일은 그 실패를 알아채는 것이라, 값은 그대로 둬요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
