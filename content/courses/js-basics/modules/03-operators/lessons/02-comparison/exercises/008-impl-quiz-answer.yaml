id: js-basics.operators.comparison.impl-quiz-answer
type: implement_function
difficulty: 2
concepts:
  - { id: js.ops.strict-equality, weight: 1 }
tags: [strict-equality, write-code]
estimatedSeconds: 180
prompt: |
  수도 맞히기 퀴즈의 정답은 `"서울"`이에요. 나와 친구의 답을 채점하는 코드를 작성하세요.

  - `myCorrect`: 내 답(`myAnswer`)이 정답과 **같으면** `true`인 변수
  - `friendWrong`: 친구의 답(`friendAnswer`)이 정답과 **다르면** `true`인 변수
  - 두 값은 직접 `true`/`false`를 쓰지 말고 **비교 연산자로 계산**하세요. 위의 세 줄은 그대로 두세요.

  실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  내 답 정답: true
  친구 답 오답: true
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const correctAnswer = "서울";
          const myAnswer = "서울";
          const friendAnswer = "부산";

          // 여기에 myCorrect와 friendWrong을 만들고 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          const correctAnswer = "서울";
          const myAnswer = "서울";
          const friendAnswer = "부산";

          const myCorrect = myAnswer === correctAnswer;
          const friendWrong = friendAnswer !== correctAnswer;
          console.log("내 답 정답:", myCorrect);
          console.log("친구 답 오답:", friendWrong);
  checks:
    - kind: console
      id: output
      description: 채점 결과 두 줄이 차례로 출력되어야 합니다.
      requirement: 채점 결과 출력
      expect:
        lines: ["내 답 정답: true", "친구 답 오답: true"]
    - kind: program
      id: values
      description: 프로그램이 오류 없이 끝나고, myCorrect와 friendWrong에 true가 들어 있어야 합니다.
      requirement: 비교 결과 저장
      expect:
        globals:
          myCorrect: { equals: true }
          friendWrong: { equals: true }
        noError: true
      misconceptionIfFail: js.mc.assign-as-compare
hints:
  - 같은지 묻는 연산자와 다른지 묻는 연산자를 하나씩 써요.
  - 비교식의 결과(true/false)를 그대로 변수에 넣을 수 있어요. 예를 들어 `const isBig = 10 > 3;`처럼요.
  - "`myCorrect`는 내 답과 정답이 같은지, `friendWrong`은 친구 답과 정답이 다른지 묻는 비교식이에요. 비교식을 `=` 오른쪽에 써서 변수에 넣고, console.log로 설명 글자와 함께 출력해요."
explanation: |
  예시 정답이에요.

  ```js
  const myCorrect = myAnswer === correctAnswer;
  const friendWrong = friendAnswer !== correctAnswer;
  console.log("내 답 정답:", myCorrect);
  console.log("친구 답 오답:", friendWrong);
  ```

  - `myAnswer === correctAnswer`는 `"서울" === "서울"`이라 `true`예요.
  - `friendAnswer !== correctAnswer`는 `"부산" !== "서울"`이라 다르므로 `true`예요.

  `=`로 비교하려고 하면 대입이 되어 `TypeError: Assignment to constant variable.`이 나요. `true`를 직접 써도 출력은 같지만, 답이 바뀌면 틀린 결과가 나와요. 비교 연산자를 쓰면 답이 무엇이든 맞게 채점돼요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
