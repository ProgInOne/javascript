id: js-basics.operators.comparison.check-member-id-type
type: predict_output
difficulty: 1
usage: check
concepts:
  - { id: js.ops.strict-equality, weight: 1 }
tags: [strict-equality, type]
estimatedSeconds: 60
prompt: |
  저장된 회원 번호는 글자로, 입력한 회원 번호는 숫자로 들어왔어요. 실행하면 콘솔에 무엇이 출력되나요? 한 줄에 하나씩 쓰세요.
spec:
  lang: js
  code: |
    const savedId = "42";
    const typedId = 42;
    const isSame = savedId === typedId;
    console.log(isSame);
    console.log(savedId === "42");
  answerKind: console
  misconceptionByAnswer:
    "true\ntrue": js.mc.strict-equality-ignores-type
misconceptions: [js.mc.strict-equality-ignores-type]
hints:
  - "`savedId`와 `typedId`의 자료형은 각각 무엇인가요? 따옴표를 보세요."
  - "`===`는 먼저 자료형이 같은지 확인해요. 다르면 값은 보지도 않아요."
  - 마지막 줄은 문자열과 문자열을 비교해요. 글자가 똑같나요?
explanation: |
  정답은 다음 두 줄이에요.

  ```text
  false
  true
  ```

  - `savedId`는 문자열 `"42"`, `typedId`는 숫자 `42`예요. `===`는 자료형부터 비교하므로 `false`예요.
  - `savedId === "42"`는 문자열끼리, 글자도 같아서 `true`예요.

  첫 줄을 `true`라고 답했다면 화면에 똑같이 42로 보이면 같다고 생각한 거예요. `===`는 자료형과 값이 모두 같아야 `true`예요.
origin: authored
