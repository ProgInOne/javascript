id: js-basics.operators.comparison.we-strict-equality-1
type: fill_blank
difficulty: 2
concepts:
  - { id: js.ops.strict-equality, weight: 1 }
tags: [strict-equality, worked-example]
estimatedSeconds: 90
usage: worked_example
workedExampleStage: 1
prompt: |
  **풀이 예제 2단계: 빈칸 채우기**

  앞 단계와 같은 방식의 문제예요. 퀴즈에서 학생이 입력한 답 `"7"`(글자)과 정답 `7`(숫자)을 비교하려고 해요.

  풀이의 나머지는 완성되어 있어요. 주석을 읽고 빈칸 두 곳에 `answer`와 `correct`를 비교하는 **식**을 쓰세요. 실행하면 아래처럼 나와야 해요.

  ```text
  false
  true
  ```
spec:
  mode: code
  lang: js
  template: |
    // 1. 학생이 입력한 답(글자)과 정답(숫자)이에요.
    const answer = "7";
    const correct = 7;
    // 2. 자료형까지 같은지 비교한 결과를 출력해요.
    console.log({{blank:same}});
    // 3. 정답과 "다른지"(자료형 포함) 비교한 결과를 isWrong에 담아 출력해요.
    const isWrong = {{blank:diff}};
    console.log(isWrong);
  blanks:
    - id: same
      accept: ["answer === correct"]
      width: 22
    - id: diff
      accept: ["answer !== correct"]
      width: 22
  checks:
    - kind: console
      id: output
      description: false와 true가 차례로 출력되어야 합니다.
      requirement: 비교 결과 출력
      expect:
        lines: ["false", "true"]
      misconceptionIfFail: js.mc.strict-equality-ignores-type
    - kind: program
      id: values
      description: 프로그램이 오류 없이 끝나고, isWrong에는 true가 들어 있어야 합니다.
      requirement: 다른지 비교한 결과
      expect:
        globals:
          isWrong: { equals: true }
        noError: true
misconceptions: [js.mc.strict-equality-ignores-type, js.mc.assign-as-compare]
hints:
  - "앞 단계 풀이에서 `input === saved`와 `input !== saved`가 무엇을 출력했는지 떠올려 보세요."
  - 같은지는 `===`, 다른지는 `!==`로 비교해요. `=` 하나는 대입이라 비교가 아니에요.
  - "첫 빈칸은 `answer === correct`, 두 번째 빈칸은 `answer !== correct`예요."
explanation: |
  예시 정답은 다음과 같아요.

  ```js
  console.log(answer === correct);
  const isWrong = answer !== correct;
  ```

  - `answer === correct`: `"7"`은 문자열, `7`은 숫자라서 `false`예요.
  - `answer !== correct`: 자료형이 달라 "다르다"가 참이니 `true`예요.

  앞 단계의 비밀번호 비교와 같은 상황이에요. 첫 빈칸에 `answer = correct`처럼 `=` 하나를 쓰면 비교가 아니라 대입이라서, `const`인 answer에 다시 대입하려다 `TypeError`가 나요. 다음 단계에서는 처음부터 직접 써 봐요.
