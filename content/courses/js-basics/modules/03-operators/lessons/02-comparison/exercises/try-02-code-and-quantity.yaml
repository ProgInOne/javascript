id: js-basics.operators.comparison.try-code-and-quantity
type: implement_function
difficulty: 2
usage: try
concepts:
  - { id: js.ops.strict-equality, weight: 1 }
tags: [strict-equality, nan, write-code]
estimatedSeconds: 180
prompt: |
  선물 교환권을 확인하는 프로그램이에요. 두 가지 확인 결과를 직접 계산해 보세요.

  1. 입력한 코드 `typedCode`가 저장된 코드 `savedCode`와 **정확히 같은지**(대소문자까지) 비교해 `isCodeMatch`에 담으세요.
  1. 수량 `quantity`는 글자를 곱하다가 계산이 실패한 값이에요. 이 값이 `NaN`인지 확인해 `isQuantityError`에 담으세요.

  `true`/`false`를 직접 쓰지 말고 계산해요. 실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  코드 일치: false
  수량 오류: true
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const savedCode = "gift2026";
          const typedCode = "GIFT2026";
          const quantity = "세 개" * 1;

          // 1. isCodeMatch: typedCode와 savedCode가 정확히 같은지

          // 2. isQuantityError: quantity가 NaN인지

          console.log("코드 일치:", isCodeMatch);
          console.log("수량 오류:", isQuantityError);
  solution:
    files:
      - path: main.js
        content: |
          const savedCode = "gift2026";
          const typedCode = "GIFT2026";
          const quantity = "세 개" * 1;

          // 1. isCodeMatch: typedCode와 savedCode가 정확히 같은지
          const isCodeMatch = typedCode === savedCode;
          // 2. isQuantityError: quantity가 NaN인지
          const isQuantityError = Number.isNaN(quantity);
          console.log("코드 일치:", isCodeMatch);
          console.log("수량 오류:", isQuantityError);
  checks:
    - kind: program
      id: code
      description: 대소문자가 다르므로 isCodeMatch는 false여야 합니다.
      requirement: 코드 비교
      expect: { globals: { isCodeMatch: { equals: false } }, noError: true }
    - kind: program
      id: nan
      description: quantity는 NaN이므로 isQuantityError는 true여야 합니다. `quantity === NaN`은 항상 false라서 이 방법으로는 알아낼 수 없어요.
      requirement: NaN 확인
      misconceptionIfFail: js.mc.nan-equals-nan
      expect: { globals: { isQuantityError: { equals: true } }, noError: true }
    - kind: console
      id: output
      description: 두 확인 결과가 정해진 모양으로 두 줄 출력되어야 합니다.
      requirement: 출력
      expect:
        lines: ["코드 일치: false", "수량 오류: true"]
misconceptions: [js.mc.nan-equals-nan]
hints:
  - 같은지 비교할 때는 `===`를 써요. 문자열은 대소문자까지 같아야 `true`예요.
  - NaN은 자기 자신과도 같지 않아서 `quantity === NaN`은 항상 `false`예요.
  - "NaN인지는 `Number.isNaN(quantity)`로 확인해요."
explanation: |
  예시 답안은 다음과 같아요.

  ```js
  const isCodeMatch = typedCode === savedCode;     // false (대소문자가 달라요)
  const isQuantityError = Number.isNaN(quantity);  // true
  ```

  - `"GIFT2026"`과 `"gift2026"`은 글자의 대소문자가 달라서 `===`의 결과가 `false`예요.
  - `"세 개" * 1`은 숫자 계산이 실패해서 `NaN`이에요. `quantity === NaN`으로 확인하면 `false`가 나와 실패를 알아채지 못해요. `Number.isNaN`을 써야 해요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
