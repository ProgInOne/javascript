id: js-basics.operators.comparison.we-relational-1
type: fill_blank
difficulty: 2
concepts:
  - { id: js.ops.relational, weight: 1 }
tags: [relational, string-compare, worked-example]
estimatedSeconds: 90
usage: worked_example
workedExampleStage: 1
prompt: |
  **풀이 예제 2단계: 빈칸 채우기**

  앞 단계와 같은 방식의 문제예요. 달리기 기록(초)이 통과 기준 60초 **이하**인지(같아도 통과) 확인하려고 해요.

  풀이의 나머지는 완성되어 있어요. 주석을 읽고 빈칸 두 곳에 **비교식**을 쓰세요. 실행하면 아래처럼 나와야 해요.

  ```text
  true
  true
  false
  ```
spec:
  mode: code
  lang: js
  template: |
    // 1. 내 기록과 통과 기준이에요(숫자).
    const myTime = 60;
    const limit = 60;
    // 2. 기준 시간 "이하"면 통과예요(같아도 통과). 비교 결과를 passed에 담아요.
    const passed = {{blank:passed}};
    console.log(passed);
    // 3. 입력창에서 받은 기록 "100"은 글자예요. 글자끼리 비교하면 사전 순서라 "1" < "6"이 돼요.
    const typedTime = "100";
    console.log(typedTime < "60");
    // 4. 숫자 limit과 비교하면 글자를 숫자로 바꿔 크기로 비교해요. typedTime이 limit보다 작은지 비교해요.
    console.log({{blank:mixed}});
  blanks:
    - id: passed
      accept: ["myTime <= limit"]
      width: 20
    - id: mixed
      accept: ["typedTime < limit"]
      width: 20
  checks:
    - kind: console
      id: output
      description: true, true, false가 차례로 출력되어야 합니다.
      requirement: 비교 결과 출력
      expect:
        lines: ["true", "true", "false"]
      misconceptionIfFail: js.mc.string-compare-numeric
    - kind: program
      id: values
      description: 프로그램이 오류 없이 끝나고, passed에는 true가 들어 있어야 합니다.
      requirement: 이하 비교
      expect:
        globals:
          passed: { equals: true }
        noError: true
misconceptions: [js.mc.string-compare-numeric]
hints:
  - "앞 단계 풀이에서 `\"9\" < \"10\"`과 `\"9\" < best`의 결과가 왜 달랐는지 떠올려 보세요."
  - "\"이하\"는 같은 값도 포함해요. `<`가 아니라 `=`가 붙은 연산자를 써요."
  - "첫 빈칸은 `myTime <= limit`, 두 번째 빈칸은 `typedTime < limit`이에요."
explanation: |
  예시 정답은 다음과 같아요.

  ```js
  const passed = myTime <= limit;
  console.log(typedTime < limit);
  ```

  - `myTime <= limit`: 60은 60보다 작거나 같으니 `true`예요. `<`를 쓰면 같은 기록이 `false`가 돼 통과하지 못해요.
  - `typedTime < "60"`: 문자열끼리라 첫 글자 `"1"`과 `"6"`을 비교해 `true`예요. 100초가 60초보다 짧다는 엉뚱한 결과예요.
  - `typedTime < limit`: 한쪽이 숫자라 `"100"`을 100으로 바꿔 `100 < 60`, `false`예요.

  앞 단계 풀이와 같은 원리예요. 다음 단계에서는 처음부터 직접 써 봐요.
origin: authored
review:
