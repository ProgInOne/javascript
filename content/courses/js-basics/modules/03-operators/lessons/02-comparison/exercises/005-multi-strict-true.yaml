id: js-basics.operators.comparison.multi-strict-true
type: mcq_multi
difficulty: 2
concepts:
  - { id: js.ops.strict-equality, weight: 1 }
tags: [strict-equality]
estimatedSeconds: 70
prompt: |
  다음 식 중 결과가 `true`인 것을 모두 고르세요.
spec:
  options:
    - id: a
      text: "`7 === 7`"
    - id: b
      text: "`\"7\" === 7`"
      misconception: js.mc.strict-equality-ignores-type
      rationale: 문자열 "7"과 숫자 7은 자료형이 달라서 false예요.
    - id: c
      text: "`\"hi\" !== \"Hi\"`"
    - id: d
      text: "`3 !== 3`"
      rationale: 3과 3은 같아요. "다른가?"라는 질문의 답은 false예요.
    - id: e
      text: "`10 === 5 + 5`"
  correct: [a, c, e]
misconceptions: [js.mc.strict-equality-ignores-type]
hints:
  - 식마다 "자료형이 같은가?", "값이 같은가?"를 차례로 확인해 보세요.
  - "`!==`는 \"다른가?\"라는 질문이에요. 다를 때 true예요."
  - 문자열은 대문자와 소문자까지 같아야 같은 문자열이에요. 그리고 `+`는 `===`보다 먼저 계산돼요.
explanation: |
  정답은 **`7 === 7`, `"hi" !== "Hi"`, `10 === 5 + 5`**예요.

  - `7 === 7`: 자료형도 값도 같아서 `true`.
  - `"7" === 7`: 문자열과 숫자라 자료형이 달라서 `false`.
  - `"hi" !== "Hi"`: `h`와 `H`는 다른 글자라 두 문자열은 달라요. "다른가?"의 답이라 `true`.
  - `3 !== 3`: 같은 값이라 "다른가?"의 답은 `false`.
  - `10 === 5 + 5`: 산술 연산이 먼저 계산되어 `10 === 10`이 되므로 `true`.
origin: authored
review:
