id: js-basics.operators.comparison.tf-chained-comparison
type: true_false
difficulty: 2
concepts:
  - { id: js.ops.relational, weight: 1 }
tags: [relational, chained]
estimatedSeconds: 60
prompt: |
  다음 설명이 맞는지 고르고, 그 이유도 고르세요.
spec:
  statement: "`3 > 2 > 1`의 결과는 true다."
  answer: false
  misconceptionIfWrong: js.mc.chained-comparison
  requireReason: true
  reasons:
    - id: r1
      text: 왼쪽부터 3 > 2가 먼저 true가 되고, 그다음 true > 1을 계산하는데 true는 1로 바뀌어 1 > 1은 false다
      correct: true
    - id: r2
      text: 3이 2보다 크고 2가 1보다 크므로 수학처럼 true다
      misconception: js.mc.chained-comparison
    - id: r3
      text: 비교 연산자를 두 번 쓰면 문법 오류가 난다
hints:
  - 비교 연산자도 한 번에 하나씩, 왼쪽부터 계산해요.
  - "`3 > 2`의 결과는 숫자가 아니라 불리언이에요. 그 값을 다음 비교에 넣어 보세요."
  - 불리언을 숫자와 비교하면 true는 1, false는 0으로 바뀌어요.
explanation: |
  정답은 **거짓**이고, 이유는 r1이에요.

  1. 왼쪽부터 `3 > 2`를 계산해 `true`가 돼요.
  1. 이제 `true > 1`을 계산해요. 숫자와 비교하려고 `true`를 1로 바꾸니 `1 > 1`이고, 결과는 `false`예요.

  수학처럼 이어 쓴 비교는 의도대로 동작하지 않아요. 오류도 나지 않아서 더 위험해요. 두 조건은 따로 비교하고, 다음 단원에서 배울 `&&`로 묶어요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
