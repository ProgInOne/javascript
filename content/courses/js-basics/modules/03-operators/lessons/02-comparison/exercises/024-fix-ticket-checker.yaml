id: js-basics.operators.comparison.fix-ticket-checker
type: fix_bug
difficulty: 5
concepts:
  - { id: js.ops.relational, weight: 1 }
  - { id: js.ops.strict-equality, weight: 0.5 }
  - { id: js.errors.error-messages, weight: 0.3 }
tags: [relational, strict-equality, nan, debugging]
estimatedSeconds: 480
prompt: |
  공연 예매 현황을 확인하는 프로그램이에요. 버그가 여러 개 있고, 하나를 고치면 다른 문제가 드러나요. 실행 → 원인 찾기 → 고치기를 반복해서 아래처럼 출력되게 하세요.

  ```text
  매진: false
  VIP: true
  가격 미정: true
  ```

  - 판매 한도는 100장, 지금까지 판매량은 25장이에요. 이 두 값은 크기를 비교하는 **숫자**로 저장되어 있어야 해요.
  - 티켓 가격은 아직 정해지지 않아서 `"미정"`이에요. 이 값은 그대로 두고, 프로그램이 "가격 미정"을 알아채게 하세요.
spec:
  buggy:
    files:
      - path: main.js
        content: |
          const ticketLimit = "100";
          const soldCount = "25";
          const vipLevel = 3;
          const ticketPrice = "미정";

          const totalSales = ticketPrice * soldCount;
          const isSoldOut = soldCount >= ticketLimit;
          const isVip = vipLevel = 3;
          const isPriceUnknown = totalSales === NaN;

          console.log("매진:", isSoldOut);
          console.log("VIP:", isVip);
          console.log("가격 미정:", isPriceUnknown);
  solution:
    files:
      - path: main.js
        content: |
          const ticketLimit = 100;
          const soldCount = 25;
          const vipLevel = 3;
          const ticketPrice = "미정";

          const totalSales = ticketPrice * soldCount;
          const isSoldOut = soldCount >= ticketLimit;
          const isVip = vipLevel === 3;
          const isPriceUnknown = Number.isNaN(totalSales);

          console.log("매진:", isSoldOut);
          console.log("VIP:", isVip);
          console.log("가격 미정:", isPriceUnknown);
  bugDescription: 실행하면 아무것도 출력되지 않고 TypeError가 나요. 그 오류를 고치면 25장밖에 안 팔렸는데 매진이라고 나오고, 가격이 정해지지 않았는데 "가격 미정"이 false로 나와요.
  bugMisconception: js.mc.string-compare-numeric
  maxEditDistance: 12
  checks:
    - kind: console
      id: output
      description: 매진, VIP, 가격 미정이 차례로 false, true, true로 출력되어야 합니다.
      requirement: 예매 현황 출력
      expect:
        lines: ["매진: false", "VIP: true", "가격 미정: true"]
    - kind: program
      id: numbers
      description: 판매 한도 ticketLimit과 판매량 soldCount는 숫자 100과 25여야 합니다.
      requirement: 숫자로 저장
      expect:
        globals:
          ticketLimit: { equals: 100 }
          soldCount: { equals: 25 }
        noError: true
      misconceptionIfFail: js.mc.string-compare-numeric
    - kind: program
      id: flags
      description: isSoldOut은 false, isVip는 true, isPriceUnknown은 true이고, 가격 ticketPrice는 "미정" 그대로여야 합니다.
      requirement: 확인 결과
      expect:
        globals:
          isSoldOut: { equals: false }
          isVip: { equals: true }
          isPriceUnknown: { equals: true }
          ticketPrice: { equals: "미정" }
misconceptions: [js.mc.string-compare-numeric, js.mc.assign-as-compare, js.mc.nan-equals-nan]
hints:
  - "처음 오류는 `TypeError: Assignment to constant variable.`이에요. 오류가 난 줄에서 `=` 하나가 무엇을 하고 있는지 보세요."
  - "다음으로 \"매진\"이 true인 이유를 찾아보세요. `\"25\" >= \"100\"`은 두 값이 모두 문자열이에요. 문자열끼리는 어떻게 비교하나요?"
  - "마지막으로 `totalSales`는 NaN인데 `=== NaN`으로 확인하고 있어요. 한도·판매량은 따옴표를 빼서 숫자로 바꾸고, NaN은 전용 방법으로 확인하세요."
explanation: |
  버그 세 개가 차례로 드러나요.

  1. **`TypeError: Assignment to constant variable.` (8번 줄)**: `vipLevel = 3`은 비교가 아니라 대입이에요. `vipLevel`은 `const`라서 다시 대입할 수 없어 오류가 났어요. `vipLevel === 3`으로 고쳐요.
  1. **매진이 true (1·2번 줄이 원인)**: `"25" >= "100"`은 문자열끼리라 사전 순서로 비교해요. 첫 글자 `"2"`가 `"1"`보다 뒤라서 `true`가 나왔어요. 증상은 7번 줄에서 보이지만 원인은 값을 문자열로 저장한 1·2번 줄이에요. 따옴표를 빼서 숫자 100과 25로 저장하면 `25 >= 100`이 `false`가 돼요.
  1. **가격 미정이 false (9번 줄)**: `"미정" * soldCount`는 NaN이고, NaN은 `===`로 확인할 수 없어요. `Number.isNaN(totalSales)`로 고쳐요.

  7번 줄의 연산자를 `<`로 뒤집어도 우연히 `false`가 나오지만, 문자열 비교라는 원인은 그대로라 판매량이 바뀌면 다시 틀려요. 크기를 비교할 값은 숫자로 저장하는 것이 근본적인 해결이에요.
origin: authored
