id: js-basics.operators.comparison.check-zero-loose-strict
type: true_false
difficulty: 2
usage: check
concepts:
  - { id: js.ops.loose-equality, weight: 1 }
tags: [loose-equality, strict-equality]
estimatedSeconds: 50
prompt: |
  다음 설명이 맞는지 골라 주세요.
spec:
  statement: '`0 == "0"`과 `0 === "0"`은 결과가 같다.'
  answer: false
  misconceptionIfWrong: js.mc.loose-equals-like-strict
misconceptions: [js.mc.loose-equals-like-strict]
hints:
  - 두 식은 같은 값을 비교하지만 연산자가 달라요.
  - "`==`는 자료형이 다르면 한쪽을 바꿔서 비교해요. `===`는 그대로 비교해요."
  - 문자열 `"0"`을 숫자로 바꾸면 `0`이에요. 그러면 `==`의 결과는 무엇일까요?
explanation: |
  정답은 **거짓**이에요.

  - `0 == "0"`: `==`는 문자열 `"0"`을 숫자 `0`으로 바꿔서 비교하므로 `true`예요.
  - `0 === "0"`: 숫자와 문자열, 자료형이 달라서 `false`예요.

  `==`와 `===`는 다른 연산자예요. 예상 밖의 변환을 피하려면 `===`를 써요.
origin: authored
review:
