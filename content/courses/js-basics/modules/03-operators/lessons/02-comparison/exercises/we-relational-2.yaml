id: js-basics.operators.comparison.we-relational-2
type: implement_function
difficulty: 2
concepts:
  - { id: js.ops.relational, weight: 1 }
tags: [relational, string-compare, worked-example, write-code]
estimatedSeconds: 200
usage: worked_example
workedExampleStage: 2
prompt: |
  **풀이 예제 3단계: 직접 풀기**

  시작 코드의 변수를 이용해 이어서 쓰세요.

  1. 점수 `points`가 합격 점수 `pass` **이상**인지(같아도 합격) 비교한 결과를 변수 `isPass`에 담아 출력하세요.
  1. 글자로 저장된 레벨 `levelText`가 글자 `"9"`보다 큰지 비교한 결과를 출력하세요.
  1. `levelText`가 숫자 `9`보다 큰지 비교한 결과를 출력하세요.

  실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  true
  false
  true
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const points = 80;
          const pass = 80;
          const levelText = "10";

          // 여기에 세 가지 비교를 쓰고 결과를 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          const points = 80;
          const pass = 80;
          const levelText = "10";

          // 여기에 세 가지 비교를 쓰고 결과를 출력하세요.
          const isPass = points >= pass;
          console.log(isPass);
          console.log(levelText > "9");
          console.log(levelText > 9);
  checks:
    - kind: console
      id: output
      description: true, false, true가 차례로 출력되어야 합니다.
      requirement: 비교 결과 출력
      expect:
        lines: ["true", "false", "true"]
      misconceptionIfFail: js.mc.string-compare-numeric
    - kind: program
      id: values
      description: 프로그램이 오류 없이 끝나고, isPass에는 true가 들어 있어야 합니다.
      requirement: 이상 비교
      expect:
        globals:
          isPass: { equals: true }
        noError: true
misconceptions: [js.mc.string-compare-numeric]
hints:
  - 앞 단계처럼 줄마다 비교하는 두 값의 자료형을 먼저 확인하세요.
  - "\"이상\"은 `>=`예요. 문자열끼리는 사전 순서, 숫자가 섞이면 크기 비교예요."
  - "`const isPass = points >= pass;`를 출력하고, `levelText > \"9\"`와 `levelText > 9`를 각각 출력해요."
explanation: |
  예시 정답은 다음과 같아요.

  ```js
  const isPass = points >= pass;
  console.log(isPass);
  console.log(levelText > "9");
  console.log(levelText > 9);
  ```

  - `points >= pass`: 80은 80 이상이라 `true`예요.
  - `levelText > "9"`: 문자열끼리라 첫 글자 `"1"`과 `"9"`를 비교해 `false`예요. 레벨 10이 9보다 낮다는 결과가 나와요.
  - `levelText > 9`: 숫자가 섞여 `"10"`을 10으로 바꿔 `10 > 9`, `true`예요.

  앞 두 단계와 같은 원리예요. 원래 연습으로 돌아가 다시 풀어 보세요.
origin: authored
