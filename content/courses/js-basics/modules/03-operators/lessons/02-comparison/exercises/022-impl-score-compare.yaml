id: js-basics.operators.comparison.impl-score-compare
type: implement_function
difficulty: 4
concepts:
  - { id: js.ops.relational, weight: 1 }
  - { id: js.ops.strict-equality, weight: 0.5 }
  - { id: js.ops.arithmetic, weight: 0.3 }
tags: [relational, strict-equality, write-code]
estimatedSeconds: 360
prompt: |
  게임이 끝났어요. 나와 친구의 점수, 지금까지의 최고 기록으로 결과를 정리하는 프로그램을 작성하세요.

  | 변수 | 뜻 |
  |---|---|
  | `iWin` | 내 점수가 친구 점수보다 **높으면** `true` |
  | `isTie` | 두 점수가 **같으면** `true` |
  | `friendRecord` | 친구 점수가 최고 기록 **이상**이면 `true` (최고 기록과 같아도 기록 달성) |
  | `gap` | 친구 점수에서 내 점수를 뺀 값 |

  - 네 값은 직접 쓰지 말고 위의 세 변수로 **계산**하세요. 위의 세 줄은 그대로 두세요.
  - 실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  내가 이김: false
  비김: false
  친구 기록 달성: true
  점수 차이: 5
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const myScore = 87;
          const friendScore = 92;
          const bestScore = 92;

          // 여기에 iWin, isTie, friendRecord, gap을 만들고 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          const myScore = 87;
          const friendScore = 92;
          const bestScore = 92;

          const iWin = myScore > friendScore;
          const isTie = myScore === friendScore;
          const friendRecord = friendScore >= bestScore;
          const gap = friendScore - myScore;
          console.log("내가 이김:", iWin);
          console.log("비김:", isTie);
          console.log("친구 기록 달성:", friendRecord);
          console.log("점수 차이:", gap);
  checks:
    - kind: console
      id: output
      description: 네 줄의 결과가 정해진 형식과 순서로 출력되어야 합니다.
      requirement: 결과 출력
      expect:
        lines:
          - "내가 이김: false"
          - "비김: false"
          - "친구 기록 달성: true"
          - "점수 차이: 5"
    - kind: program
      id: compare-values
      description: iWin과 isTie는 false, friendRecord는 true여야 합니다(최고 기록과 같은 점수도 달성).
      requirement: 비교 결과 저장
      expect:
        globals:
          iWin: { equals: false }
          isTie: { equals: false }
          friendRecord: { equals: true }
        noError: true
    - kind: program
      id: gap-value
      description: gap에는 친구 점수에서 내 점수를 뺀 숫자가 들어 있어야 합니다.
      requirement: 점수 차이 계산
      expect:
        globals:
          gap: { equals: 5 }
hints:
  - 표의 "높으면", "같으면", "이상"을 각각 어떤 연산자로 옮길지 먼저 정하세요.
  - "\"이상\"은 같은 값도 포함해요. 친구 점수 92와 최고 기록 92가 같을 때 true가 나와야 해요."
  - "`iWin`은 `>`, `isTie`는 `===`, `friendRecord`는 `>=`로 비교하고, `gap`은 빼기로 계산한 뒤 네 줄을 출력하세요."
explanation: |
  예시 정답이에요.

  ```js
  const iWin = myScore > friendScore;          // 87 > 92 → false
  const isTie = myScore === friendScore;       // 87 === 92 → false
  const friendRecord = friendScore >= bestScore; // 92 >= 92 → true
  const gap = friendScore - myScore;           // 92 - 87 → 5
  ```

  - 요구사항의 "높으면"은 `>`, "같으면"은 `===`, "이상"은 `>=`예요.
  - `friendRecord`를 `>`로 쓰면 92 > 92가 `false`라서, 최고 기록과 같은 점수를 놓쳐요. 이런 **경계값**에서 연산자 선택이 결과를 바꿔요.
  - `gap`은 비교가 아니라 계산이에요. 비교 연산자와 산술 연산자를 목적에 맞게 골라 써요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
