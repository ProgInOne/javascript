id: js-basics.strings.string-methods.mcq-trim-inner
type: mcq_single
difficulty: 1
concepts:
  - { id: js.str.case-trim, weight: 1 }
tags: [trim, space]
estimatedSeconds: 45
prompt: |
  `"  ice   cream  ".trim()`의 결과는 무엇인가요? (앞에 공백 2개, 가운데 3개, 뒤에 2개가 있어요.)
spec:
  options:
    - id: a
      text: '`"ice   cream"` (가운데 공백 3개는 그대로)'
    - id: b
      text: '`"icecream"`'
      misconception: js.mc.trim-removes-all-spaces
      rationale: "`trim`은 앞과 뒤의 공백만 지워요. 글자 사이의 공백은 남아요."
    - id: c
      text: '`"ice cream"` (가운데 공백 1개)'
      misconception: js.mc.trim-removes-all-spaces
      rationale: "`trim`은 가운데 공백을 줄이지도 않아요. 가운데는 원래대로 3개예요."
    - id: d
      text: '`"ice   cream  "` (뒤 공백은 그대로)'
      rationale: "`trim`은 앞과 뒤를 모두 정리해요."
  correct: a
misconceptions: [js.mc.trim-removes-all-spaces]
hints:
  - "`trim`은 \"가장자리를 다듬다\"라는 뜻이에요."
  - 문자열의 가장자리는 어디와 어디일까요?
  - 글자 사이에 있는 공백은 가장자리일까요?
explanation: |
  정답은 `"ice   cream"`이에요.

  `trim`은 문자열의 **앞과 뒤**에 있는 공백만 지워요. `ice`와 `cream` 사이의 공백 3개는 가장자리가 아니라서 그대로 남아요.

  - 공백을 모두 지운 `"icecream"`이나 가운데를 하나로 줄인 `"ice cream"`은 `trim`이 하지 않는 일이에요.
  - 뒤 공백만 남는 일도 없어요. 앞과 뒤를 함께 정리해요.
origin: authored
review:
