id: js-basics.strings.string-methods.find-bug-indexof-if
type: find_bug_line
difficulty: 3
concepts:
  - { id: js.str.search, weight: 1 }
  - { id: js.conv.truthy-falsy, weight: 0.5 }
tags: [indexof, truthy-falsy, if, debugging]
estimatedSeconds: 120
prompt: |
  입력한 이메일에 `@`가 있는지 검사하는 프로그램이에요. `@`가 없는 주소를 넣었는데 "이메일 형식이에요"가 나와요. 원인이 되는 줄을 찾고, 왜 그런지도 고르세요.
spec:
  code: |-
    const email = "minji.example.com";
    const atPosition = email.indexOf("@");
    console.log("@ 위치: " + atPosition);
    if (atPosition) {
      console.log("이메일 형식이에요");
    } else {
      console.log("@가 없어요");
    }
  bugLines: [4]
  symptom: "`@`가 없는데 `@ 위치: -1` 다음에 `이메일 형식이에요`가 나와요."
  symptomCheck:
    console: ["@ 위치: -1", "이메일 형식이에요"]
  fixedCode: |-
    const email = "minji.example.com";
    const atPosition = email.indexOf("@");
    console.log("@ 위치: " + atPosition);
    if (atPosition !== -1) {
      console.log("이메일 형식이에요");
    } else {
      console.log("@가 없어요");
    }
  causeOptions:
    - id: c1
      text: indexOf는 못 찾으면 -1을 돌려주는데, -1은 0이 아닌 숫자라 조건에서 참(truthy)으로 취급된다
      correct: true
    - id: c2
      text: indexOf는 못 찾으면 false를 돌려주는데, if가 false를 참으로 잘못 읽었다
      misconception: js.mc.indexof-as-boolean
    - id: c3
      text: indexOf는 대소문자를 구별하지 않아서 다른 글자를 @로 찾았다
    - id: c4
      text: 2번 줄에서 "@"를 따옴표로 감싸서 글자 @가 아니라 문자열 전체를 찾았다
hints:
  - 3번 줄이 출력한 `atPosition`의 값을 보세요. 이 숫자가 `if`의 조건에 그대로 들어가요.
  - 모듈 3에서 배운 falsy 값 목록을 떠올려 보세요. `-1`은 그 목록에 있나요?
  - 조건은 "못 찾음을 뜻하는 값과 다른가?"를 물어야 해요. `indexOf`가 못 찾았을 때 돌려주는 값과 비교해 보세요.
explanation: |
  원인은 **4번 줄**의 조건이에요.

  `indexOf("@")`는 `@`를 못 찾아서 `-1`을 돌려줬어요(3번 줄 출력). 그런데 `if (atPosition)`은 숫자를 참·거짓으로 바꿔 판단해요. falsy인 숫자는 `0`과 `NaN`뿐이라 `-1`은 **truthy**예요. 그래서 못 찾았는데도 `if` 블록이 실행됐어요.

  이 조건에는 반대쪽 함정도 있어요. `"@minji"`처럼 `@`가 맨 앞에 있으면 `indexOf`가 `0`을 돌려주고, `0`은 falsy라서 찾았는데도 "@가 없어요"가 나와요.

  고친 조건은 `atPosition !== -1`이에요. 위치가 필요 없다면 `email.includes("@")`가 더 읽기 쉬워요.

  - `indexOf`는 `false`를 돌려주지 않아요. 3번 줄이 `-1`을 출력했어요.
  - 대소문자는 문제가 아니에요. `@`에는 대소문자가 없고, 실제로 아무것도 찾지 못해 `-1`이 나왔어요.
  - `"@"`는 찾을 글자를 문자열로 넘기는 올바른 방법이에요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
