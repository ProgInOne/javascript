id: js-basics.strings.string-methods.predict-search-results
type: predict_output
difficulty: 2
concepts:
  - { id: js.str.search, weight: 1 }
tags: [includes, indexof, startswith, case-sensitive]
estimatedSeconds: 90
prompt: |
  실행하면 콘솔에 무엇이 출력될까요? 네 줄을 차례로 적어 보세요.
spec:
  lang: js
  code: |
    const fileName = "Report_2026.PDF";
    console.log(fileName.endsWith(".pdf"));
    console.log(fileName.includes("2026"));
    console.log(fileName.indexOf("R"));
    console.log(fileName.startsWith("report"));
  answerKind: console
  misconceptionByAnswer:
    "true\ntrue\n0\ntrue": js.mc.includes-ignores-case
    "true\ntrue\n0\nfalse": js.mc.includes-ignores-case
hints:
  - 파일 이름의 대문자와 소문자를 한 글자씩 확인해 보세요.
  - 찾기 메서드는 대문자 `P`와 소문자 `p`를 같은 글자로 볼까요?
  - "`indexOf`는 **처음** 나오는 위치를 알려 줘요. 이 파일 이름에 대문자 `R`은 몇 번 나오나요?"
explanation: |
  출력은 다음과 같아요.

  ```text
  false
  true
  0
  false
  ```

  - `endsWith(".pdf")`: 파일 이름은 대문자 `.PDF`로 끝나요. 찾기 메서드는 대소문자를 구별하므로 `false`예요.
  - `includes("2026")`: 숫자 글자 `2026`이 들어 있어서 `true`예요.
  - `indexOf("R")`: 대문자 `R`은 맨 앞 0번에 하나뿐이라 0이에요. 4번에 있는 소문자 `r`은 다른 글자예요.
  - `startsWith("report")`: 실제로는 대문자 `R`로 시작해서 `false`예요.

  대소문자와 관계없이 확인하려면 `fileName.toLowerCase().endsWith(".pdf")`처럼 먼저 맞춰요.
