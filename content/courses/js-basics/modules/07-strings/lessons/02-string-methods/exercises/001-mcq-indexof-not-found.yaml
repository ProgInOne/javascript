id: js-basics.strings.string-methods.mcq-indexof-not-found
type: mcq_single
difficulty: 1
concepts:
  - { id: js.str.search, weight: 1 }
tags: [indexof, not-found]
estimatedSeconds: 45
prompt: |
  `"apple".indexOf("z")`의 결과는 무엇인가요?
spec:
  options:
    - id: a
      text: "`-1`"
    - id: b
      text: "`0`"
      misconception: js.mc.indexof-as-boolean
      rationale: 0은 "맨 앞(0번)에서 찾았다"는 뜻이에요. 못 찾았을 때와 구별해야 해서 0을 쓰지 않아요.
    - id: c
      text: "`false`"
      misconception: js.mc.indexof-as-boolean
      rationale: "`indexOf`는 참·거짓이 아니라 위치(숫자)를 돌려줘요. `true`·`false`를 돌려주는 것은 `includes`예요."
    - id: d
      text: "`undefined`"
      rationale: "`undefined`는 범위 밖 인덱스를 읽었을 때의 값이에요. `indexOf`는 못 찾은 경우를 정해진 숫자로 알려 줘요."
    - id: e
      text: 오류가 난다
      rationale: 못 찾는 것은 오류가 아니에요. 찾지 못했다는 결과를 값으로 돌려줘요.
  correct: a
misconceptions: [js.mc.indexof-as-boolean]
hints:
  - "`indexOf`는 찾은 글자의 위치를 숫자로 알려 주는 메서드예요."
  - 위치는 0부터 시작해요. 그렇다면 0이라는 결과는 어떤 뜻일까요?
  - 못 찾았다는 것은 어떤 인덱스로도 나올 수 없는 숫자로 알려 줘요.
explanation: |
  정답은 `-1`이에요.

  `indexOf`는 찾은 위치(인덱스)를 돌려주는데, 인덱스는 0부터 시작하므로 0 이상의 숫자는 모두 "찾았다"는 뜻이에요. 그래서 "못 찾음"은 인덱스로 쓰일 수 없는 `-1`로 알려 줘요.

  - `0`: "0번, 즉 맨 앞에서 찾았다"는 뜻이에요. `"apple".indexOf("a")`가 0이에요.
  - `false`: 참·거짓을 돌려주는 것은 `includes`예요. `"apple".includes("z")`가 `false`예요.
  - `undefined`: 범위 밖 인덱스를 `str[10]`처럼 읽을 때 나오는 값이에요.
  - 오류: 못 찾는 것은 정상적인 결과라서 오류가 나지 않아요.
