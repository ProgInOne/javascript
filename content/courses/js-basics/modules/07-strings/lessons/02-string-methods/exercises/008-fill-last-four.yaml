id: js-basics.strings.string-methods.fill-last-four
type: fill_blank
difficulty: 2
concepts:
  - { id: js.str.slice, weight: 1 }
tags: [slice, negative-index, card, function]
estimatedSeconds: 100
prompt: |
  결제 화면에서 카드 번호의 **끝 4자리**만 보여 주는 함수 `lastFour`를 완성하세요. 카드 번호의 길이는 카드마다 달라요. 빈칸을 채워 아래처럼 출력되게 하세요.

  ```text
  **** 3456
  **** 7777
  **** 1004
  ```
spec:
  mode: code
  lang: js
  template: |
    function lastFour(cardNumber) {
      return "**** " + {{blank:expr}};
    }
    console.log(lastFour("1234-5678-9012-3456"));
    console.log(lastFour("4000-1111-2222-7777"));
    console.log(lastFour("9410-001004"));
  blanks:
    - id: expr
      accept: ["cardNumber.slice(-4)"]
      width: 24
  checks:
    - kind: console
      id: output
      description: 세 카드 번호의 끝 4자리가 "**** " 뒤에 붙어 한 줄씩 출력되어야 합니다.
      requirement: 끝 4자리
      expect:
        lines: ["**** 3456", "**** 7777", "**** 1004"]
misconceptions: [js.mc.slice-negative-invalid]
hints:
  - 앞에서부터 센 위치는 카드 번호의 길이마다 달라져요. 길이와 관계없이 "끝에서 몇 글자"를 고를 방법이 필요해요.
  - "`slice`는 음수도 받아요. 음수는 어디서부터 센 위치였나요?"
  - 끝을 생략하면 마지막 글자까지 잘라요. 시작 위치 하나만 정하면 돼요.
explanation: |
  예시 정답은 `cardNumber.slice(-4)`예요.

  - 음수는 뒤에서부터 센 위치라서 `slice(-4)`는 "뒤에서 4번째 글자부터 끝까지", 즉 끝 4자리예요.
  - 길이가 19글자든 11글자든 같은 식으로 맞아요. `slice(15)`처럼 앞에서 센 위치를 쓰면 세 번째 카드(11글자)에서 빈 문자열이 나와요.
  - `cardNumber.slice(cardNumber.length - 4)`처럼 길이로 계산해도 같은 결과예요. 음수를 쓰면 더 짧게 쓸 수 있어요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
