id: js-basics.strings.string-methods.try-area-code
type: implement_function
usage: try
difficulty: 2
concepts:
  - { id: js.str.slice, weight: 1 }
  - { id: js.str.search, weight: 0.5 }
tags: [string, slice, indexOf, write-code]
estimatedSeconds: 240
prompt: |
  전화번호에서 **첫 번째 `-` 앞부분**(지역 번호)을 잘라 돌려주는 함수 `areaCode(phone)`을 완성하세요. 지역 번호의 길이는 번호마다 달라요.

  | 호출 | 돌려줄 값 |
  |---|---|
  | `areaCode("02-123-4567")` | `"02"` |
  | `areaCode("031-987-6543")` | `"031"` |
spec:
  starter:
    files:
      - path: main.js
        content: |
          function areaCode(phone) {
            // 1. 첫 번째 "-"의 위치를 찾으세요.
            // 2. 맨 앞부터 그 위치 바로 앞까지 잘라 돌려주세요.
          }

          console.log(areaCode("02-123-4567"));
          console.log(areaCode("031-987-6543"));
  entry: areaCode
  solution:
    files:
      - path: main.js
        content: |
          function areaCode(phone) {
            const dash = phone.indexOf("-");
            return phone.slice(0, dash);
          }

          console.log(areaCode("02-123-4567"));
          console.log(areaCode("031-987-6543"));
  checks:
    - kind: call
      id: seoul
      description: '"02-123-4567"의 지역 번호는 "02"입니다.'
      requirement: 지역 번호 자르기
      args: ["02-123-4567"]
      expect: { equals: "02" }
      misconceptionIfFail: js.mc.slice-end-inclusive
    - kind: call
      id: three-digits
      description: '"031-987-6543"처럼 지역 번호가 세 자리여도 "031"을 돌려줘야 합니다.'
      requirement: 지역 번호 자르기
      args: ["031-987-6543"]
      expect: { equals: "031" }
    - kind: call
      id: hidden-mobile
      visible: false
      description: '휴대폰 번호 "010-1234-5678"은 "010"을 돌려줘야 합니다.'
      requirement: 지역 번호 자르기
      args: ["010-1234-5678"]
      expect: { equals: "010" }
    - kind: call
      id: hidden-four-digits
      visible: false
      description: 앞부분이 네 자리여도 첫 번째 - 앞까지 잘라야 합니다.
      requirement: 지역 번호 자르기
      args: ["0505-111-2222"]
      expect: { equals: "0505" }
misconceptions: [js.mc.slice-end-inclusive, js.mc.slice-second-arg-length]
hints:
  - 길이가 매번 다르니 숫자를 직접 쓰지 말고, `phone.indexOf("-")`로 첫 번째 `-`의 위치를 찾아요.
  - "`slice(시작, 끝)`은 끝 인덱스의 글자를 넣지 않아요. 그래서 끝에 `-`의 위치를 그대로 넣으면 `-` 바로 앞까지 잘려요."
  - "`const dash = phone.indexOf(\"-\");` 다음에 `return phone.slice(0, dash);`를 써요."
explanation: |
  예시 답안이에요.

  ```js
  function areaCode(phone) {
    const dash = phone.indexOf("-");
    return phone.slice(0, dash);
  }
  ```

  - `indexOf("-")`는 **처음** 나오는 `-`의 위치를 돌려줘요. `"02-123-4567"`이면 2예요.
  - `slice(0, 2)`는 0번과 1번 글자 `02`예요. 끝 인덱스(2번의 `-`)는 들어가지 않아서 `-`를 따로 빼지 않아도 돼요.
  - `slice(0, 3)`처럼 숫자를 직접 쓰면 지역 번호 길이가 다른 번호에서 틀려요.
