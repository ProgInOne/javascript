prompt: |
  블로그 글 주소에 쓸 **슬러그**를 만드는 함수 `toSlug(title)`을 완성하세요. 슬러그는 제목을 주소에 쓰기 좋게 바꾼 문자열이에요.

  - 앞뒤 공백은 없애요.
  - 영문자는 모두 소문자로 바꿔요.
  - 단어 사이의 공백은 하이픈(`-`)으로 바꿔요. 단어 사이에는 공백이 **하나씩만** 있다고 생각해도 돼요.

  | 호출 | 돌려줄 값 |
  |---|---|
  | `toSlug("Hello World")` | `"hello-world"` |
  | `toSlug("  My First Post ")` | `"my-first-post"` |
spec:
