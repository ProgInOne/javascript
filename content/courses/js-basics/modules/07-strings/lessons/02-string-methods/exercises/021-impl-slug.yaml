misconceptions: [js.mc.join-default-no-separator, js.mc.split-result-is-string, js.mc.string-method-mutates]
hints:
  - 할 일을 순서대로 적어 보세요. 공백 정리, 소문자, 공백을 하이픈으로 바꾸기.
  - "\"공백을 하이픈으로 바꾸기\"는 공백에서 잘라 조각을 만든 뒤, 하이픈으로 다시 잇는 두 단계로 할 수 있어요."
  - 메서드는 이어 부를 수 있어요. 앞뒤 공백을 먼저 지우지 않으면 맨 앞과 맨 뒤에 무엇이 생기는지 두 번째 예로 확인해 보세요.
explanation: |
  예시 정답이에요.

  ```js
  function toSlug(title) {
    return title.trim().toLowerCase().split(" ").join("-");
  }
  ```

  | 단계 | `"  My First Post "`의 변화 |
  |---|---|
  | `trim()` | `"My First Post"` |
  | `toLowerCase()` | `"my first post"` |
  | `split(" ")` | 조각 `"my"`, `"first"`, `"post"` |
  | `join("-")` | `"my-first-post"` |

  - **순서**: `trim`을 빼먹으면 `split(" ")`이 앞뒤 공백 자리에 빈 조각을 만들어 `"--my-first-post-"`처럼 하이픈이 붙어요.
  - **구분자**: `join()`처럼 비우면 쉼표로 이어서 `"my,first,post"`가 돼요. `join("-")`처럼 하이픈을 꼭 적어요.
  - **문자열 메서드는 문자열에**: `toLowerCase()`는 `split` 전에 불러요. `split` 뒤에 부르면 목록에 부르는 셈이라 오류가 나요. `join` 뒤에 불러도 결과는 같아요.
  - 한 단어 제목은 조각이 하나라서 `join("-")`을 해도 하이픈이 붙지 않아요.
