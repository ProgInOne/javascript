id: js-basics.strings.string-basics.tf-out-of-range
type: true_false
difficulty: 2
concepts:
  - { id: js.str.index-length, weight: 1 }
tags: [index, undefined, error]
estimatedSeconds: 60
prompt: |
  다음 설명이 맞는지 고르고, 그렇게 판단한 이유도 고르세요.
spec:
  statement: '`const name = "민지";`일 때 `name[10]`을 읽으면 범위를 벗어났다는 오류가 나서 프로그램이 멈춘다.'
  answer: false
  misconceptionIfWrong: js.mc.out-of-range-index-throws
  requireReason: true
  reasons:
    - id: r1
      text: 문자열에 없는 인덱스를 읽으면 오류 없이 undefined가 나오고, 프로그램은 계속 실행된다
      correct: true
    - id: r2
      text: 인덱스가 범위를 넘으면 JavaScript가 RangeError를 내서 알려 준다
      misconception: js.mc.out-of-range-index-throws
    - id: r3
      text: 범위를 넘으면 처음부터 다시 세어서 name[10]은 name[0]과 같은 글자가 된다
    - id: r4
      text: 범위를 넘으면 마지막 글자인 "지"가 나온다
hints:
  - 레슨 첫 번째 예제의 마지막 줄 `city[city.length]`는 무엇을 출력했나요?
  - 없는 칸을 읽는 것은 "값이 아직 없음"과 비슷해요. 모듈 2에서 그런 값을 뭐라고 불렀나요?
  - 출력에 이상한 글자가 섞여 나오는 것은 오류가 나지 않았다는 뜻이에요.
explanation: |
  정답은 **거짓**이에요. 이유는 "문자열에 없는 인덱스를 읽으면 오류 없이 undefined가 나오고, 프로그램은 계속 실행된다"예요.

  `"민지"`의 인덱스는 0과 1뿐이에요. `name[10]`처럼 없는 칸을 읽으면 `undefined`가 나와요. 오류가 나지 않기 때문에 실수가 조용히 숨어 있다가 출력에 `undefined`라는 글자로 나타나요.

  - `RangeError`를 낸다는 이유: 인덱스로 글자를 읽을 때는 어떤 오류도 나지 않아요.
  - 처음부터 다시 센다는 이유: 인덱스는 돌아가며 세지 않아요. 범위 밖은 그냥 "없음"이에요.
  - 마지막 글자가 나온다는 이유: 범위를 넘었다고 가장 가까운 글자를 대신 주지 않아요.
