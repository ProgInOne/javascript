hints:
  - 오류 메시지는 4번 줄이 문자열의 한 칸에 대입하려 했다고 알려 줘요. 문자열의 칸은 바꿀 수 없어요.
  - 기존 문자열을 고치는 대신, 결과를 담을 새 문자열을 만들어 글자를 하나씩 **이어 붙이는** 방식으로 바꿔 보세요. 그 새 문자열은 무엇으로 시작해야 할까요?
  - 반복은 원래 비밀번호의 길이만큼 돌아야 해요. 결과 문자열이 반복 중에 길어지면 반복 조건이 무엇을 기준으로 해야 할지 생각해 보세요.
explanation: |
  예시 정답이에요.

  ```js
  function maskPassword(password) {
    let masked = password[0];
    for (let i = 1; i < password.length; i++) {
      masked += "*";
    }
    return masked;
  }
  ```

  - **원인**: 4번 줄 `masked[i] = "*"`는 문자열의 칸을 바꾸려 해서 `TypeError`가 나요. `masked = password`는 같은 문자열을 가리킬 뿐이라 `masked`도 바꿀 수 없는 문자열이에요.
  - **고치는 방법**: 결과를 첫 글자 `password[0]`에서 시작하는 새 문자열로 만들고, 나머지 글자 수만큼 `"*"`를 `+=`로 이어 붙여요. 문자열 자체는 바뀌지 않고, 한 글자 더 긴 새 문자열이 `masked`에 다시 대입돼요.
  - **반복 조건**: `i < password.length`처럼 원래 비밀번호를 기준으로 해요. `i < masked.length`로 두면 `masked`가 한 글자에서 시작하므로 반복이 한 번도 돌지 않고 첫 글자만 돌려줘요.
  - `masked = "*"`처럼 `=`로 쓰면 덮어쓰기가 되어 마지막 별표 하나만 남아요.
  - 한 글자 비밀번호는 반복이 돌지 않아서 `password[0]` 그대로예요.
