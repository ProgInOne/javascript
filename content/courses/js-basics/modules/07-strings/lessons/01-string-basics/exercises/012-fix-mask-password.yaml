  - { id: js.str.index-length, weight: 0.5 }
  - { id: js.loops.accumulator-pattern, weight: 0.5 }
tags: [immutability, accumulator, loop, mask, function, debugging]
estimatedSeconds: 420
prompt: |
  비밀번호를 화면에 보여 줄 때 **첫 글자만 그대로 두고 나머지는 모두 `*`로** 가리는 함수 `maskPassword(password)`예요. 그런데 호출하면 오류가 나요. 고쳐서 아래처럼 가린 **새 문자열을 돌려주게** 하세요.

  | 호출 | 돌려줄 값 |
  |---|---|
  | `maskPassword("sunny123")` | `"s*******"` |
  | `maskPassword("abc")` | `"a**"` |

  비밀번호의 길이는 매번 달라요. 한 글자짜리 비밀번호는 그대로 돌려줘요.
spec:
  buggy:
    files:
      - path: main.js
        content: |
          function maskPassword(password) {
            let masked = password;
            for (let i = 1; i < masked.length; i++) {
              masked[i] = "*";
            }
            return masked;
          }
  solution:
    files:
      - path: main.js
        content: |
          function maskPassword(password) {
            let masked = password[0];
            for (let i = 1; i < password.length; i++) {
              masked += "*";
            }
            return masked;
          }
  entry: maskPassword
  bugDescription: "`maskPassword(\"sunny123\")`를 부르면 `TypeError: Cannot assign to read only property '1' of string 'sunny123'` 오류가 나요."
  checks:
