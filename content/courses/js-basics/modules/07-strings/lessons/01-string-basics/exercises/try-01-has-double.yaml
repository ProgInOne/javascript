misconceptions: [js.mc.last-index-is-length]
hints:
  - "`for (let i = 0; ...; i++)`로 인덱스를 돌면서 `word[i]`와 `word[i + 1]`을 `===`로 비교해요."
  - "`i`가 마지막 인덱스이면 `word[i + 1]`은 범위 밖이에요. 그래서 반복 조건은 `i < word.length - 1`이면 충분해요."
  - 같은 곳을 찾으면 바로 `return true;`, 반복이 다 끝난 **뒤에** `return false;`를 둬요.
explanation: |
  예시 답안이에요.

  ```js
  function hasDouble(word) {
    for (let i = 0; i < word.length - 1; i++) {
      if (word[i] === word[i + 1]) {
        return true;
      }
    }
    return false;
  }
  ```

  - `word[i]`와 바로 다음 칸 `word[i + 1]`을 비교해요. 마지막 짝은 `length - 2`번과 `length - 1`번이라서 `i < word.length - 1`까지만 돌아요.
  - 조건을 `i < word.length`로 써도 마지막에 `word[length]`(`undefined`)와 비교할 뿐이라 결과는 같아요. 하지만 범위를 정확히 맞추는 습관이 좋아요.
  - `return false;`를 반복 안의 `else`에 두면 첫 짝만 보고 끝나 버려요. 끝까지 살펴본 뒤에 돌려줘야 해요.
