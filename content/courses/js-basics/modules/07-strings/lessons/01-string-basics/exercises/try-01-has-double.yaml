      expect: { equals: true }
    - kind: call
      id: banana
      description: '"banana"는 a가 여러 번 나와도 붙어 있지 않으니 false입니다.'
      requirement: 붙지 않으면 false
      args: ["banana"]
      expect: { equals: false }
    - kind: call
      id: book
      description: '"book"에는 oo가 있으니 true입니다.'
