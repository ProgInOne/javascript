id: js-basics.strings.string-basics.try-has-double
type: implement_function
usage: try
difficulty: 2
concepts:
  - { id: js.str.index-length, weight: 1 }
  - { id: js.loops.for, weight: 0.5 }
tags: [string, index, length, loop, write-code]
estimatedSeconds: 300
prompt: |
  같은 글자가 **바로 붙어서** 두 번 나오는지 검사하는 함수 `hasDouble(word)`를 완성하세요. 그런 곳이 있으면 `true`, 없으면 `false`를 돌려줘요.

  | 호출 | 돌려줄 값 | 이유 |
  |---|---|---|
  | `hasDouble("apple")` | `true` | `pp` |
  | `hasDouble("banana")` | `false` | `a`가 여러 번 나오지만 붙어 있지 않아요 |
  | `hasDouble("book")` | `true` | `oo` |
spec:
  starter:
    files:
      - path: main.js
        content: |
          function hasDouble(word) {
            // 인덱스 i의 글자와 바로 다음 글자(i + 1)를 비교하며 끝까지 살펴보세요.
            // 같은 곳을 찾으면 true, 끝까지 없으면 false를 돌려주세요.
          }

          console.log(hasDouble("apple"));
          console.log(hasDouble("banana"));
  entry: hasDouble
  solution:
    files:
      - path: main.js
        content: |
          function hasDouble(word) {
            for (let i = 0; i < word.length - 1; i++) {
              if (word[i] === word[i + 1]) {
                return true;
              }
            }
            return false;
          }

          console.log(hasDouble("apple"));
          console.log(hasDouble("banana"));
  checks:
