id: js-basics.strings.string-basics.fix-seat-code
type: fix_bug
difficulty: 2
concepts:
  - { id: js.str.immutability, weight: 1 }
  - { id: js.str.index-length, weight: 0.3 }
tags: [immutability, type-error, reassign, debugging]
estimatedSeconds: 180
prompt: |
  공연장 좌석 변경 프로그램이에요. 좌석 코드 `B-7`의 줄(맨 앞 글자)을 `D`로 바꿔 `D-7`을 출력해야 하는데 오류가 나요. 버그를 고쳐서 아래처럼 나오게 하세요.

  ```text
  변경 전: B-7
  변경 후: D-7
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          let seat = "B-7";
          console.log("변경 전: " + seat);
          seat[0] = "D";
          console.log("변경 후: " + seat);
  solution:
    files:
      - path: main.js
        content: |
          let seat = "B-7";
          console.log("변경 전: " + seat);
          seat = "D" + seat[1] + seat[2];
          console.log("변경 후: " + seat);
  bugDescription: "`변경 전: B-7`만 나온 뒤 `TypeError: Cannot assign to read only property '0' of string 'B-7'` 오류가 나요."
  checks:
    - kind: console
      id: output
      description: 변경 전과 변경 후 좌석 코드가 차례로 출력되어야 합니다.
      requirement: 좌석 바꾸기
      expect:
        lines: ["변경 전: B-7", "변경 후: D-7"]
    - kind: program
      id: seat-value
      description: 프로그램이 오류 없이 끝나고, seat 변수에 바뀐 좌석 코드가 들어 있어야 합니다.
      requirement: 좌석 바꾸기
      expect:
        globals: { seat: { equals: "D-7" } }
        noError: true
      misconceptionIfFail: js.mc.string-index-assign
misconceptions: [js.mc.string-index-assign]
hints:
  - 오류 메시지의 `read only`는 "읽기만 할 수 있다"는 뜻이에요. 무엇을 읽기만 할 수 있을까요?
  - 문자열의 글자 한 칸은 바꿀 수 없지만, `let`으로 만든 변수 `seat`에는 새 값을 다시 대입할 수 있어요.
  - "새 좌석 코드는 `D`와 원래 코드의 나머지 두 글자로 만들 수 있어요. 나머지 글자는 인덱스로 꺼내 이어 붙여 보세요."
explanation: |
  3번 줄이 문자열의 0번 칸에 대입하려 해서 `TypeError`가 났어요. 문자열은 바꿀 수 없으므로, 새 문자열을 만들어 변수에 다시 대입해요.

  ```js
  seat = "D" + seat[1] + seat[2];
  ```

  - `seat[1]`은 `-`, `seat[2]`는 `7`이라 새 문자열 `"D-7"`이 만들어지고, 그 문자열이 `seat`에 대입돼요.
  - 원래 문자열 `"B-7"`이 바뀐 게 아니에요. `seat`이 새 문자열을 가리키게 된 거예요. 그래서 `seat`은 `const`가 아니라 `let`이어야 해요.
  - `` seat = `D${seat[1]}${seat[2]}`; ``처럼 템플릿 리터럴로 써도 같아요.
  - `seat = "D-7";`처럼 통째로 써도 이 출력은 맞지만, 좌석 번호가 바뀌면 쓸 수 없어요. 원래 값에서 새 값을 만드는 연습이에요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
