id: js-basics.strings.string-basics.impl-profile-card
type: implement_function
difficulty: 3
concepts:
  - { id: js.str.template-literal, weight: 1 }
  - { id: js.str.index-length, weight: 0.5 }
  - { id: js.ops.arithmetic, weight: 0.3 }
tags: [template-literal, multiline, expression, function, write-code]
estimatedSeconds: 300
prompt: |
  동아리 회원 카드 문구를 만드는 함수 `profileCard(name, age)`를 완성하세요. 템플릿 리터럴로 **세 줄짜리 문자열**을 만들어 돌려주세요(return).

  `profileCard("하린", 15)`는 다음 세 줄을 돌려줘야 해요.

  ```text
  이름: 하린 (2글자)
  나이: 15살
  내년이면 16살이에요
  ```

  - 괄호 안의 글자 수는 이름의 글자 수예요.
  - 줄 사이에는 줄바꿈 하나만 있어요. 각 줄의 앞뒤에 공백을 넣지 마세요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          function profileCard(name, age) {
            // 여기에 작성하세요
          }
  entry: profileCard
  solution:
    files:
      - path: main.js
        content: |
          function profileCard(name, age) {
            return `이름: ${name} (${name.length}글자)
          나이: ${age}살
          내년이면 ${age + 1}살이에요`;
          }
  checks:
    - kind: call
      id: harin
      args: ["하린", 15]
      expect: { equals: "이름: 하린 (2글자)\n나이: 15살\n내년이면 16살이에요" }
      requirement: 세 줄 문구
    - kind: call
      id: long-name
      visible: false
      description: 이름의 글자 수가 달라도 괄호 안에 맞는 글자 수가 들어가야 합니다.
      requirement: 글자 수
      args: ["남궁 민수", 20]
      expect: { equals: "이름: 남궁 민수 (5글자)\n나이: 20살\n내년이면 21살이에요" }
    - kind: call
      id: next-year
      visible: false
      description: 내년 나이는 나이에 1을 더해 계산한 숫자여야 합니다(글자를 이어 붙이면 안 돼요).
      requirement: 내년 나이 계산
      args: ["Jun", 9]
      expect: { equals: "이름: Jun (3글자)\n나이: 9살\n내년이면 10살이에요" }
misconceptions: [js.mc.template-in-normal-quotes, js.mc.template-missing-braces]
hints:
  - 백틱 문자열 안에서 줄을 바꾸면 그 줄바꿈도 문자열에 들어가요. 세 줄을 백틱 하나로 감싸 보세요.
  - 이름의 글자 수와 내년 나이는 `${}` 안에 식을 써서 계산할 수 있어요.
  - 2, 3번째 줄을 코드처럼 들여쓰면 그 공백도 문자열에 들어가요. 줄 앞이 비어 있어야 해요.
explanation: |
  예시 정답이에요.

  ```js
  function profileCard(name, age) {
    return `이름: ${name} (${name.length}글자)
  나이: ${age}살
  내년이면 ${age + 1}살이에요`;
  }
  ```

  - 백틱 문자열 안의 줄바꿈이 그대로 문자열에 들어가서 세 줄이 돼요. `"\n"`을 써서 `` `이름: ${name} (${name.length}글자)\n나이: ...` ``처럼 한 줄로 써도 같아요.
  - `${name.length}`처럼 `${}` 안에 식을 쓰면 계산한 결과가 들어가요.
  - `${age + 1}`은 숫자 덧셈이에요. `"내년이면 " + age + 1 + "살이에요"`처럼 `+`로 이으면 `내년이면 151살이에요`가 돼요.
  - 2, 3번째 줄을 함수 안처럼 들여쓰면 줄 앞에 공백이 들어가서 체크에 실패해요. 그래서 예시 정답은 줄 앞을 비워 뒀어요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
