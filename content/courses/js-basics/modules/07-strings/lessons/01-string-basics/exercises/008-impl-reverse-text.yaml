      description: 첫 글자도 빠짐없이 맨 뒤로 가야 하고, 범위 밖 글자(undefined)가 섞이면 안 됩니다.
      requirement: 처음부터 끝까지
      args: ["ProgInOne"]
      expect: { equals: "enOnIgorP" }
    - kind: call
      id: palindrome
      visible: false
