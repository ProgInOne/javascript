misconceptions: [js.mc.last-index-is-length, js.mc.out-of-range-index-throws, js.mc.accumulator-reset-in-loop]
hints:
  - 결과를 모을 빈 문자열을 반복 앞에 만들고, 글자를 하나씩 이어 붙여요. 어느 글자부터 붙여야 거꾸로가 될까요?
  - 반복 변수가 마지막 인덱스에서 시작해 0까지 줄어들게 해 보세요. 마지막 인덱스는 `length`와 어떤 관계였나요?
  - 결과 앞에 `undefined`라는 글자가 붙으면 반복의 시작값을, 첫 글자가 빠지면 끝 조건을 다시 확인하세요.
explanation: |
  예시 정답이에요.

  ```js
  function reverseText(text) {
    let result = "";
    for (let i = text.length - 1; i >= 0; i--) {
      result += text[i];
    }
    return result;
  }
  ```

  - **시작값**: 마지막 글자는 `text.length - 1`번이에요. `i = text.length`로 시작하면 첫 회차에 `text[text.length]`, 즉 `undefined`를 이어 붙여서 결과 앞에 `undefined`라는 글자가 생겨요. 오류가 나지 않아서 알아채기 어려워요.
  - **끝 조건**: 0번 글자까지 붙여야 하므로 `i >= 0`이에요. `i > 0`이면 첫 글자가 빠져요.
  - **누적**: 빈 문자열 `""`에서 시작해 `+=`로 이어 붙여요. 문자열은 바꿀 수 없으니, 매번 한 글자 더 긴 새 문자열이 `result`에 다시 대입되는 거예요.
  - 빈 문자열이면 `i`가 -1에서 시작해 반복이 한 번도 돌지 않고 `""`를 돌려줘요.
  - 앞에서부터 보면서 `result = text[i] + result;`처럼 글자를 **앞에** 붙여도 같은 결과예요.
