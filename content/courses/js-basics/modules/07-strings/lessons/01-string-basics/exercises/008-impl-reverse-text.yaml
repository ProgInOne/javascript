estimatedSeconds: 420
prompt: |
  앞에서 읽어도 뒤에서 읽어도 같은 말(회문)을 찾는 게임을 만들고 있어요. 그 첫 단계로, 문자열을 거꾸로 뒤집은 **새 문자열**을 돌려주는 함수 `reverseText(text)`를 완성하세요.

  | 호출 | 돌려줄 값 |
  |---|---|
  | `reverseText("abc")` | `"cba"` |
  | `reverseText("기러기 토마토")` | `"토마토 기러기"` |

  - 공백도 한 글자로 다뤄요.
  - 빈 문자열을 뒤집으면 빈 문자열이에요.
  - 다 만들었다면 `reverseText(word) === word`로 회문인지 확인해 보세요. `"level"`은 `true`, `"hello"`는 `false`가 나와야 해요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          function reverseText(text) {
            // 여기에 작성하세요
          }
  entry: reverseText
  solution:
    files:
      - path: main.js
        content: |
          function reverseText(text) {
            let result = "";
            for (let i = text.length - 1; i >= 0; i--) {
              result += text[i];
            }
            return result;
          }
  checks:
