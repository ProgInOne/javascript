id: js-basics.loops.for.mcq-loop-var-after-for
type: mcq_single
difficulty: 2
concepts:
  - { id: js.loops.loop-variable, weight: 1 }
tags: [loop-variable, scope, error]
estimatedSeconds: 70
prompt: |
  아래 코드를 실행하면 4번 줄에서 어떤 일이 일어나나요?
code: |
  for (let i = 1; i <= 3; i++) {
    console.log("연습 " + i);
  }
  console.log("마지막 i: " + i);
spec:
  options:
    - id: a
      text: "`마지막 i: 3`이 출력된다"
      misconception: js.mc.loop-var-outside-for
      rationale: for 괄호에서 let으로 만든 i는 반복이 끝나면 쓸 수 없어요. 값이 남아 있다고 해도 3이 아니라 조건을 거짓으로 만든 4일 거예요.
    - id: b
      text: "`마지막 i: 4`가 출력된다"
      misconception: js.mc.loop-var-outside-for
      rationale: 4는 조건을 거짓으로 만든 값이라 좋은 추론이지만, for (let i …)의 i는 반복 안에서만 쓸 수 있어요.
    - id: c
      text: "`ReferenceError: i is not defined`가 난다"
    - id: d
      text: "`마지막 i: undefined`가 출력된다"
      rationale: 만든 적이 있는 변수라 undefined가 될 것 같지만, 반복 바깥에는 i라는 변수가 아예 없어서 오류가 나요.
  correct: c
misconceptions: [js.mc.loop-var-outside-for]
hints:
  - "`i`는 어디에서 `let`으로 만들어졌나요?"
  - 블록 안에서 `let`으로 만든 변수는 블록 밖에서 쓸 수 없었어요. `for` 괄호에서 만든 변수도 같아요.
  - 반복 바깥에는 `i`라는 이름이 없어요. 없는 이름을 쓰면 어떤 종류의 오류가 났나요?
explanation: |
  정답은 **c**예요. 1~3번 줄의 반복은 `연습 1`, `연습 2`, `연습 3`을 출력하고, 4번 줄에서 `ReferenceError: i is not defined`가 나요.

  `for` 괄호 안에서 `let`으로 만든 반복 변수는 그 반복 안에서만 쓸 수 있어요. 반복이 끝나면 `i`라는 이름이 사라져요.

  반복이 끝난 뒤에도 값이 필요하면 반복 **바깥**에서 만든 변수를 써요.

  ```js
  let last = 0;
  for (let i = 1; i <= 3; i++) {
    console.log("연습 " + i);
    last = i;
  }
  console.log("마지막 연습: " + last); // 3
  ```
origin: authored
