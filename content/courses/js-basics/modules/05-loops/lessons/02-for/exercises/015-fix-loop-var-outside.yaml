id: js-basics.loops.for.fix-loop-var-outside
type: fix_bug
difficulty: 4
concepts:
  - { id: js.loops.loop-variable, weight: 1 }
  - { id: js.loops.accumulator-pattern, weight: 0.3 }
tags: [loop-variable, scope, final-value, error, debugging]
estimatedSeconds: 300
prompt: |
  붕어빵을 하나씩 사다가, 예산 5,000원을 넘지 않을 만큼만 사는 프로그램이에요. 반복 조건 `count * price <= budget`은 "`count`개를 사도 예산 안이면 산다"는 뜻이에요. 산 개수와 합계를 출력해야 하는데 오류가 나요. 버그를 고쳐서 아래처럼 나오게 하세요.

  ```text
  4개를 샀어요
  합계: 4800원
  ```

  - 반복 조건은 그대로 두세요.
  - 붕어빵 가격(`price`)이나 예산(`budget`)이 바뀌어도 맞게 동작하도록, 개수를 `4`처럼 직접 쓰지 말고 반복에서 구해 보세요.
spec:
  buggy:
    files:
      - path: main.js
        content: |
          const price = 1200;  // 붕어빵 하나 가격
          const budget = 5000; // 쓸 수 있는 돈
          let total = 0;

          for (let count = 1; count * price <= budget; count++) {
            total += price;
          }
          console.log(count + "개를 샀어요");
          console.log("합계: " + total + "원");
  solution:
    files:
      - path: main.js
        content: |
          const price = 1200;  // 붕어빵 하나 가격
          const budget = 5000; // 쓸 수 있는 돈
          let total = 0;
          let bought = 0;

          for (let count = 1; count * price <= budget; count++) {
            total += price;
            bought++;
          }
          console.log(bought + "개를 샀어요");
          console.log("합계: " + total + "원");
  bugDescription: "실행하면 `ReferenceError: count is not defined` 오류가 나요."
  bugMisconception: js.mc.loop-var-outside-for
  checks:
    - kind: console
      id: output
      description: 산 개수와 합계가 차례로 출력되어야 합니다.
      requirement: 개수와 합계 출력
      expect:
        lines: ["4개를 샀어요", "합계: 4800원"]
    - kind: program
      id: no-error
      description: 프로그램이 오류 없이 끝나야 합니다.
      requirement: 오류 없이 실행
      expect:
        noError: true
      misconceptionIfFail: js.mc.loop-var-outside-for
misconceptions: [js.mc.loop-var-outside-for, js.mc.loop-var-final-value]
hints:
  - 오류가 난 8번 줄은 반복의 안인가요, 바깥인가요? `count`는 어디에서 만들어졌나요?
  - "`count`를 반복 바깥에서 만들어 반복 뒤에도 쓸 수 있게 해도, 반복이 끝난 뒤의 `count`는 마지막으로 산 개수가 아니에요. 반복이 끝날 때 `count`가 몇인지 추적해 보세요."
  - 반복 바깥(위)에 산 개수를 셀 변수를 따로 0으로 만들고, 붕어빵을 하나 살 때마다 1씩 늘려 보세요. 출력에는 그 변수를 써요.
explanation: |
  `count`는 `for` 괄호에서 `let`으로 만들었기 때문에 반복 안에서만 있어요. 8번 줄은 반복 바깥이라 `ReferenceError: count is not defined`가 나요.

  예시 정답은 산 개수를 반복 **바깥**에서 만든 변수 `bought`에 세요.

  ```js
  let bought = 0;

  for (let count = 1; count * price <= budget; count++) {
    total += price;
    bought++;
  }
  console.log(bought + "개를 샀어요");
  ```

  **함정: `count`만 바깥으로 옮기면 5개가 돼요.** `let count = 1;`을 반복 앞으로 옮기고 반복을 `while (count * price <= budget) { total += price; count++; }`로 바꾸면 오류는 사라지지만 `5개를 샀어요`가 나와요.

  | `count` | `count * price` | 조건 | 일어나는 일 |
  |---|---|---|---|
  | 1 ~ 4 | 1200 ~ 4800 | 참 | 붕어빵 사기 |
  | 5 | 6000 | 거짓 | 반복 끝 |

  반복이 끝난 뒤의 반복 변수는 마지막 회차의 값(4)이 아니라 **조건을 거짓으로 만든 값(5)**이에요. 그래서 이 방법을 쓰려면 `count - 1`을 출력해야 해요. 개수를 따로 세는 변수를 두는 편이 뜻이 분명해요.
