id: js-basics.loops.for.impl-print-squares
type: implement_function
difficulty: 2
concepts:
  - { id: js.loops.loop-variable, weight: 1 }
  - { id: js.loops.for, weight: 0.5 }
tags: [loop-variable, for, write-code]
estimatedSeconds: 180
prompt: |
  1부터 5까지 각 수를 제곱한 값(그 수를 두 번 곱한 값)을 출력하는 프로그램을 작성하세요.

  - `for` 문을 쓰고, 반복 변수를 계산에 쓰세요.
  - 실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  1의 제곱: 1
  2의 제곱: 4
  3의 제곱: 9
  4의 제곱: 16
  5의 제곱: 25
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          // for 문으로 1부터 5까지 각 수의 제곱을 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          // for 문으로 1부터 5까지 각 수의 제곱을 출력하세요.
          for (let n = 1; n <= 5; n++) {
            console.log(n + "의 제곱: " + n * n);
          }
  checks:
    - kind: console
      id: output
      description: 1부터 5까지 각 수와 그 제곱이 한 줄씩 출력되어야 합니다.
      requirement: 제곱 출력
      expect:
        lines:
          - "1의 제곱: 1"
          - "2의 제곱: 4"
          - "3의 제곱: 9"
          - "4의 제곱: 16"
          - "5의 제곱: 25"
hints:
  - 반복 변수가 1, 2, 3, 4, 5를 거치게 하세요.
  - 회차마다 반복 변수의 값이 바로 "그 수"예요. 제곱은 그 값을 두 번 곱하면 돼요.
  - "`console.log(n + \"의 제곱: \" + n * n);`처럼 반복 변수를 출력과 계산에 함께 써요. `*`가 `+`보다 먼저 계산돼요."
explanation: |
  예시 정답이에요.

  ```js
  for (let n = 1; n <= 5; n++) {
    console.log(n + "의 제곱: " + n * n);
  }
  ```

  - 반복 변수 `n`은 횟수를 세는 동시에, 본문에서 계산할 값이 돼요.
  - `n * n`은 `*`가 `+`보다 우선순위가 높아서 먼저 계산돼요. 그래서 괄호가 없어도 `"3의 제곱: " + 9`가 돼요. `(n * n)`처럼 괄호를 써도 좋아요.
  - 줄마다 `console.log`를 다섯 번 쓰지 않고 반복 하나로 끝낼 수 있어요. 10까지로 늘리려면 조건의 5만 바꾸면 돼요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
