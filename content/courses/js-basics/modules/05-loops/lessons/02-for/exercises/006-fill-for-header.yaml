id: js-basics.loops.for.fill-for-header
type: fill_blank
difficulty: 2
concepts:
  - { id: js.loops.for, weight: 1 }
tags: [for, fill]
estimatedSeconds: 100
prompt: |
  대기 번호 1번부터 5번까지 차례로 부르는 프로그램이에요. `for` 문의 세 빈칸을 채워 아래처럼 출력되게 하세요.

  ```text
  1번 손님, 들어오세요
  2번 손님, 들어오세요
  3번 손님, 들어오세요
  4번 손님, 들어오세요
  5번 손님, 들어오세요
  ```
spec:
  mode: code
  lang: js
  template: |
    for ({{blank:init}}; {{blank:cond}}; {{blank:update}}) {
      console.log(i + "번 손님, 들어오세요");
    }
  blanks:
    - id: init
      accept: ["let i = 1"]
      width: 10
    - id: cond
      accept: ["i <= 5", "i < 6"]
      width: 8
    - id: update
      accept: ["i++", "i += 1"]
      width: 6
  checks:
    - kind: console
      id: output
      description: 1번부터 5번 손님까지 차례로 한 줄씩 출력되어야 합니다.
      requirement: 다섯 명 부르기
      expect:
        lines:
          - 1번 손님, 들어오세요
          - 2번 손님, 들어오세요
          - 3번 손님, 들어오세요
          - 4번 손님, 들어오세요
          - 5번 손님, 들어오세요
misconceptions: [js.mc.for-off-by-one]
hints:
  - 첫 번째 빈칸은 반복 변수 `i`를 만들고 시작값을 넣는 곳이에요. 첫 손님 번호는 몇인가요?
  - 두 번째 빈칸은 "언제까지", 세 번째는 "회차마다 `i`를 어떻게 바꿀지"예요.
  - "`i`가 1에서 시작해 5까지(5 포함) 1씩 커지게 해요. 첫 번째 빈칸에는 `let`을 꼭 써요."
explanation: |
  예시 정답은 다음과 같아요.

  ```js
  for (let i = 1; i <= 5; i++) {
    console.log(i + "번 손님, 들어오세요");
  }
  ```

  - 초기화 `let i = 1`: 첫 손님이 1번이라 1부터 시작해요. `let`을 빼면 엄격 모드에서 `ReferenceError`가 나요.
  - 조건 `i <= 5`: 5번 손님까지 불러야 하니 5를 포함해요. `i < 6`도 같은 뜻이라 정답이에요.
  - 갱신 `i++`: 회차마다 1씩 늘려요.

  `let i = 0`으로 시작하면 `0번 손님`부터 나오고, `i < 5`로 끝내면 4번 손님에서 멈춰요. 첫 값과 마지막 값을 적어 보면 이런 실수를 막을 수 있어요.
