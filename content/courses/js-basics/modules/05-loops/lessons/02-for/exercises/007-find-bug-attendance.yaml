id: js-basics.loops.for.find-bug-attendance
type: find_bug_line
difficulty: 2
concepts:
  - { id: js.loops.for, weight: 1 }
tags: [for, off-by-one, debugging]
estimatedSeconds: 110
prompt: |
  1번부터 12번까지 학생의 출석을 부르고, 몇 명을 불렀는지 세는 프로그램이에요. 오류는 없는데 결과가 이상해요. 원인이 되는 줄을 찾고, 왜 그런지도 고르세요.
spec:
  code: |-
    const students = 12; // 반 학생 수
    let called = 0;
    for (let num = 1; num < students; num++) {
      called++;
    }
    console.log("출석 부른 학생: " + called + "명");
  bugLines: [3]
  symptom: "반 학생은 12명인데 `출석 부른 학생: 11명`이 나와요."
  symptomCheck:
    console: ["출석 부른 학생: 11명"]
  fixedCode: |-
    const students = 12; // 반 학생 수
    let called = 0;
    for (let num = 1; num <= students; num++) {
      called++;
    }
    console.log("출석 부른 학생: " + called + "명");
  causeOptions:
    - id: c1
      text: 1부터 시작하는데 조건이 num < students라서, num이 12일 때 반복이 끝나 12번 학생을 부르지 않았다
      correct: true
    - id: c2
      text: 갱신식 num++가 본문보다 먼저 실행되어 1번 학생을 건너뛰었다
      misconception: js.mc.for-update-before-body
    - id: c3
      text: called를 0부터 세기 시작해서 마지막에 1이 모자란다
hints:
  - 반복 변수 `num`이 거치는 첫 값과 마지막 값을 적어 보세요.
  - "`num`이 12일 때 조건 `12 < 12`는 참인가요, 거짓인가요?"
  - 1부터 시작해서 12를 포함하려면 비교 연산자가 무엇이어야 할까요?
explanation: |
  원인은 **3번 줄**의 조건이에요. `num`이 1부터 시작하는데 조건이 `num < students`라서 `num`은 1~11만 거쳐요. `num`이 12가 되면 `12 < 12`가 거짓이라 12번 학생 차례에 반복이 끝나요.

  1부터 12까지(12 포함) 반복하려면 `num <= students`로 써요. 이런 실수를 "하나 차이 오류(off-by-one)"라고 불러요.

  - c2: 갱신은 본문 **뒤에** 실행돼서 첫 회차의 `num`은 1이에요. 1번 학생은 빠지지 않았어요.
  - c3: 누적 변수(개수)를 0부터 세는 것은 올바른 시작값이에요. 한 회차를 돌 때마다 1씩 늘어나니, 반복 횟수와 정확히 같아요.
origin: authored
