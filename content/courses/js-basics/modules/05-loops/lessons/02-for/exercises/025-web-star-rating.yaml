id: js-basics.loops.for.web-star-rating
type: web_task
difficulty: 4
concepts:
  - { id: js.loops.accumulator-pattern, weight: 1 }
  - { id: js.loops.for, weight: 0.5 }
  - { id: js.control.if, weight: 0.3 }
tags: [accumulator, string, for, web]
estimatedSeconds: 420
prompt: |
  가게 리뷰 화면의 별점 표시를 완성하세요. 목록에서 점수를 고르면 별 다섯 칸 중 점수만큼 채운 별(`★`)을, 나머지는 빈 별(`☆`)을 보여 줘야 해요.

  | 고른 점수 | 화면에 보이는 글자 |
  |---|---|
  | 3 | `★★★☆☆ (3점)` |
  | 5 | `★★★★★ (5점)` |
  | 1 | `★☆☆☆☆ (1점)` |

  - 시작 코드에서 점수를 고를 때마다 `{ }` 안의 코드가 실행되도록 이미 연결해 두었어요(화면을 다루는 방법은 모듈 10에서 배워요). 고른 점수는 숫자로 바뀌어 `score`에 들어 있어요.
  - 표시한 자리에 `for` 문을 써서, 다섯 칸을 차례로 보며 `stars`에 별을 하나씩 이어 붙이세요.
  - 나머지 코드는 그대로 두세요.
spec:
  focus: dom
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>별점 남기기</title>
              <style>
                body { font-family: sans-serif; padding: 16px; }
                #stars { margin-top: 12px; font-size: 28px; color: #d97706; }
              </style>
            </head>
            <body>
              <h1>별점 남기기</h1>
              <label>
                점수 고르기
                <select id="score">
                  <option value="1">1점</option>
                  <option value="2">2점</option>
                  <option value="3">3점</option>
                  <option value="4">4점</option>
                  <option value="5">5점</option>
                </select>
              </label>
              <p id="stars"></p>
              <script>
                const scoreSelect = document.querySelector("#score");
                const starsBox = document.querySelector("#stars");

                // 점수를 고를 때마다 아래 { } 안의 코드가 실행돼요(모듈 10에서 배워요).
                scoreSelect.addEventListener("change", () => {
                  const score = Number(scoreSelect.value);
                  let stars = "";

                  // 여기에 for 문을 써서 stars에 별 다섯 칸을 이어 붙이세요.

                  starsBox.textContent = stars + " (" + score + "점)";
                });
              </script>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>별점 남기기</title>
              <style>
                body { font-family: sans-serif; padding: 16px; }
                #stars { margin-top: 12px; font-size: 28px; color: #d97706; }
              </style>
            </head>
            <body>
              <h1>별점 남기기</h1>
              <label>
                점수 고르기
                <select id="score">
                  <option value="1">1점</option>
                  <option value="2">2점</option>
                  <option value="3">3점</option>
                  <option value="4">4점</option>
                  <option value="5">5점</option>
                </select>
              </label>
              <p id="stars"></p>
              <script>
                const scoreSelect = document.querySelector("#score");
                const starsBox = document.querySelector("#stars");

                // 점수를 고를 때마다 아래 { } 안의 코드가 실행돼요(모듈 10에서 배워요).
                scoreSelect.addEventListener("change", () => {
                  const score = Number(scoreSelect.value);
                  let stars = "";

                  // 여기에 for 문을 써서 stars에 별 다섯 칸을 이어 붙이세요.
                  for (let i = 1; i <= 5; i++) {
                    if (i <= score) {
                      stars += "★";
                    } else {
                      stars += "☆";
                    }
                  }

                  starsBox.textContent = stars + " (" + score + "점)";
                });
              </script>
            </body>
          </html>
  checks:
    - kind: event
      id: three
      description: 3점을 고르면 "★★★☆☆ (3점)"이 보여야 합니다.
      requirement: 점수만큼 채운 별
      visible: true
      steps:
        - { action: change, selector: "#score", value: "3" }
      expect:
        - { selector: "#stars", text: { equals: "★★★☆☆ (3점)" } }
    - kind: event
      id: five
      description: 5점을 고르면 별 다섯 개가 모두 채워져야 합니다.
      requirement: 점수만큼 채운 별
      visible: true
      steps:
        - { action: change, selector: "#score", value: "5" }
      expect:
        - { selector: "#stars", text: { equals: "★★★★★ (5점)" } }
    - kind: event
      id: one
      description: 1점을 고르면 첫 칸만 채워지고 나머지 네 칸은 빈 별이어야 합니다.
      requirement: 빈 별 채우기
      steps:
        - { action: change, selector: "#score", value: "1" }
      expect:
        - { selector: "#stars", text: { equals: "★☆☆☆☆ (1점)" } }
    - kind: event
      id: reselect
      description: 점수를 다시 골라도 별이 앞의 결과에 이어 붙지 않고 다섯 칸만 보여야 합니다.
      requirement: 다시 골라도 다섯 칸
      steps:
        - { action: change, selector: "#score", value: "2" }
        - { action: change, selector: "#score", value: "4" }
      expect:
        - { selector: "#stars", text: { equals: "★★★★☆ (4점)" } }
misconceptions: [js.mc.accumulator-overwrite]
hints:
  - "`stars`는 빈 문자열에서 시작하는 누적 변수예요. 다섯 칸을 하나씩 보며 글자를 이어 붙이면 돼요."
  - 반복 변수가 1부터 5까지 칸 번호가 되게 하세요. 칸 번호가 점수 이하이면 채운 별, 아니면 빈 별이에요.
  - "`for (let i = 1; i <= 5; i++)` 안에서 `if (i <= score)`로 나눠 `stars += \"★\";` 또는 `stars += \"☆\";`를 해요."
explanation: |
  예시 정답이에요.

  ```js
  for (let i = 1; i <= 5; i++) {
    if (i <= score) {
      stars += "★";
    } else {
      stars += "☆";
    }
  }
  ```

  - 반복 변수 `i`는 칸 번호(1~5)예요. `i <= score`인 칸은 채운 별이에요. 점수가 3이면 1, 2, 3번 칸이 `★`, 4, 5번 칸이 `☆`이에요.
  - `stars`는 글자를 모으는 누적 변수예요. `""`에서 시작해 `+=`로 한 글자씩 이어 붙여요. `stars = "★"`처럼 `=`로 쓰면 마지막 한 칸만 남아요.
  - `let stars = "";`가 `{ }` 안에 있어서 점수를 고를 때마다 빈 문자열에서 다시 시작해요. 그래서 다시 골라도 별이 이어 붙지 않아요. 여기서는 "회차마다 새로 시작"이 바라는 동작이에요.
  - 채운 별을 세는 반복과 빈 별을 세는 반복을 두 개 써도 정답이에요(`for (let i = 0; i < score; i++)`와 `for (let i = score; i < 5; i++)`).
origin: authored
review:
  status: draft
  draftedBy: ai:claude
