id: js-basics.loops.for.we-for-2
type: implement_function
difficulty: 2
usage: worked_example
workedExampleStage: 2
concepts:
  - { id: js.loops.for, weight: 1 }
  - { id: js.loops.loop-variable, weight: 0.5 }
tags: [for, worked-example, write-code]
estimatedSeconds: 240
prompt: |
  **직접 푸는 단계예요.** 앞 단계의 출석 부르기 풀이와 같은 뼈대로, 구구단 4단의 앞부분을 출력하는 프로그램을 처음부터 작성하세요.

  - `for` 문으로 반복 변수를 1부터 5까지 바꾸면서, 회차마다 `4 x 1 = 4`처럼 한 줄씩 출력해요.
  - 곱한 값은 직접 숫자로 쓰지 말고 반복 변수로 계산하세요.
  - 반복이 끝나면 `4단 끝`을 출력해요. 콘솔에 아래처럼 나와야 해요.

  ```text
  4 x 1 = 4
  4 x 2 = 8
  4 x 3 = 12
  4 x 4 = 16
  4 x 5 = 20
  4단 끝
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          // for 문으로 4 x 1부터 4 x 5까지 출력한 뒤, "4단 끝"을 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          // for 문으로 4 x 1부터 4 x 5까지 출력한 뒤, "4단 끝"을 출력하세요.
          for (let i = 1; i <= 5; i++) {
            console.log("4 x " + i + " = " + 4 * i);
          }
          console.log("4단 끝");
  checks:
    - kind: console
      id: output
      description: 4 x 1부터 4 x 5까지 다섯 줄과 "4단 끝"이 차례로 출력되어야 합니다.
      requirement: 4단 출력
      expect:
        lines: ["4 x 1 = 4", "4 x 2 = 8", "4 x 3 = 12", "4 x 4 = 16", "4 x 5 = 20", "4단 끝"]
      misconceptionIfFail: js.mc.for-off-by-one
    - kind: program
      id: no-error
      description: 프로그램이 오류 없이 끝나야 합니다.
      requirement: 오류 없이 실행
      expect:
        noError: true
misconceptions: [js.mc.for-off-by-one, js.mc.for-update-before-body]
hints:
  - 앞 단계의 출석 부르기 풀이처럼 `for (시작값; 조건; 갱신)`부터 써요. 몇부터 몇까지 반복하나요?
  - 머리는 `for (let i = 1; i <= 5; i++)`예요. 본문에서는 `4 * i`로 곱한 값을 계산해요.
  - "본문은 `console.log(\"4 x \" + i + \" = \" + 4 * i);`예요. `*`가 `+`보다 먼저 계산돼요. 반복 뒤에 `console.log(\"4단 끝\");`을 써요."
explanation: |
  예시 정답이에요.

  ```js
  for (let i = 1; i <= 5; i++) {
    console.log("4 x " + i + " = " + 4 * i);
  }
  console.log("4단 끝");
  ```

  - 앞 단계 풀이와 같은 뼈대예요. 시작값 1, 조건 `i <= 5`로 다섯 번 반복해요.
  - 회차마다 `i`가 1, 2, 3, 4, 5로 바뀌므로 `4 * i`도 4, 8, 12, 16, 20으로 바뀌어요. 곱셈 `*`는 `+`보다 먼저 계산돼서 괄호 없이도 맞아요.
  - `4단 끝`은 반복 **뒤에** 써야 한 번만 출력돼요. 본문 안에 넣으면 다섯 번 출력돼요.
origin: authored
