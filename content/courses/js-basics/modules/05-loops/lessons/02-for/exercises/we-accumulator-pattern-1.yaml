id: js-basics.loops.for.we-accumulator-pattern-1
type: fill_blank
difficulty: 2
usage: worked_example
workedExampleStage: 1
concepts:
  - { id: js.loops.accumulator-pattern, weight: 1 }
  - { id: js.loops.for, weight: 0.3 }
tags: [accumulator, worked-example, fill]
estimatedSeconds: 100
prompt: |
  **일부 빈칸을 채우는 단계예요.** 앞 단계의 저금통 풀이에서 숫자만 바꿨어요. 이번에는 날마다 (날짜 × 500)원을 5일 동안 넣어요.

  누적 변수의 시작값과 본문의 쌓기 줄이 비어 있어요. 빈칸을 채워 아래처럼 출력되게 하세요.

  ```text
  5일 동안 모은 돈: 7500원
  ```
spec:
  mode: code
  lang: js
  template: |
    // 1. 반복 앞에서 누적 변수의 시작값
    let total = {{blank:start}};

    for (let day = 1; day <= 5; day++) {
      // 2. 본문에서 이번 회차의 금액을 더해서 다시 넣기
      {{blank:add}}
    }

    // 3. 반복이 끝난 뒤 한 번만 출력
    console.log("5일 동안 모은 돈: " + total + "원");
  blanks:
    - id: start
      accept: ["0"]
      width: 4
    - id: add
      accept: ["total += day * 500;", "total = total + day * 500;"]
      width: 28
      misconceptionMap:
        "total = day * 500;": js.mc.accumulator-overwrite
  checks:
    - kind: console
      id: output
      description: 5일 동안 모은 돈의 합계 7500원이 한 줄로 출력되어야 합니다.
      requirement: 합계 출력
      expect:
        lines: ["5일 동안 모은 돈: 7500원"]
misconceptions: [js.mc.accumulator-overwrite, js.mc.accumulator-no-init]
hints:
  - 앞 단계 풀이의 `let total = 0;`과 `total += day * 1000;`을 떠올려 보세요.
  - 시작값은 아직 아무것도 모으지 않았을 때의 금액이에요. 쌓기 줄은 이번 회차 금액(`day * 500`)을 이전 합계에 더해요.
  - "첫 번째 빈칸은 `0`, 두 번째 빈칸은 `total += day * 500;`이에요."
explanation: |
  예시 정답이에요.

  ```js
  let total = 0;
  for (let day = 1; day <= 5; day++) {
    total += day * 500;
  }
  ```

  - 앞 단계 풀이와 같은 세 단계에서 금액만 500원 단위로 바꿨어요. 500 + 1000 + 1500 + 2000 + 2500 = 7500이에요.
  - 시작값을 빼고 `let total;`로 두면 `undefined + 500`이 `NaN`이 돼요.
  - `total = day * 500;`으로 쓰면 덮어써서 마지막 금액 `2500`만 남아요. 쌓으려면 `+=`예요.

  다음 단계에서는 새 상황에서 누적 패턴을 처음부터 써 봐요.
origin: authored
