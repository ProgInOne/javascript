id: js-basics.loops.for.tf-update-before-body
type: true_false
difficulty: 2
concepts:
  - { id: js.loops.for, weight: 1 }
tags: [for, order]
estimatedSeconds: 60
prompt: |
  다음 설명이 맞는지 고르고, 그렇게 판단한 이유도 고르세요.
spec:
  statement: "`for (let i = 0; i < 3; i++) { console.log(i); }`에서 갱신식 `i++`는 본문보다 먼저 실행되므로, 처음 출력되는 값은 1이다."
  answer: false
  misconceptionIfWrong: js.mc.for-update-before-body
  requireReason: true
  reasons:
    - id: r1
      text: 갱신식은 회차마다 본문을 실행한 뒤에 실행되므로, 첫 회차의 i는 초기화한 값 0이다
      correct: true
    - id: r2
      text: 괄호 안에서 i++가 조건 바로 뒤에 적혀 있으므로, 조건을 검사하자마자 i가 1이 된다
      misconception: js.mc.for-update-before-body
    - id: r3
      text: i++는 i를 1 늘리지만 그 값을 돌려주지 않으므로, i는 항상 0으로 출력된다
hints:
  - 레슨의 값 추적 표에서 첫 "본문 실행" 줄의 `i`는 몇이었나요?
  - "`for`를 `while`로 펼치면 `i++`는 본문의 어디에 들어가나요?"
  - 실행 순서는 초기화 → 조건 → 본문 → 갱신이에요.
explanation: |
  정답은 **거짓**, 이유는 **갱신식은 회차마다 본문을 실행한 뒤에 실행되므로, 첫 회차의 i는 초기화한 값 0이다**예요.

  같은 코드를 `while`로 펼치면 갱신의 자리가 분명히 보여요.

  ```js
  let i = 0;
  while (i < 3) {
    console.log(i);
    i++; // 본문 맨 끝
  }
  ```

  그래서 0, 1, 2가 출력돼요.

  - r2: 괄호 안의 적힌 위치와 실행 순서는 달라요. 갱신은 본문 뒤예요.
  - r3: `i++`는 `i`를 실제로 1 늘려요. 그래서 다음 회차에는 1, 그다음은 2가 출력돼요.
