id: js-basics.loops.for.fix-receipt-loop-bugs
type: fix_bug
difficulty: 5
concepts:
  - { id: js.loops.accumulator-pattern, weight: 1 }
  - { id: js.loops.for, weight: 0.5 }
  - { id: js.loops.loop-variable, weight: 0.5 }
tags: [accumulator, off-by-one, scope, debugging, multi-bug]
estimatedSeconds: 480
prompt: |
  김밥집 영수증 프로그램이에요. 김밥을 한 줄씩 담을 때마다 누적 금액을 보여 주고, 마지막에 합계를 출력해야 해요. 그런데 버그가 **여러 개** 있어요. 모두 고쳐서 아래처럼 나오게 하세요.

  ```text
  김밥 1줄째, 누적 2500원
  김밥 2줄째, 누적 5000원
  김밥 3줄째, 누적 7500원
  김밥 4줄째, 누적 10000원
  합계: 10000원
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          const price = 2500; // 김밥 한 줄 가격
          const count = 4;    // 주문한 줄 수

          for (let i = 0; i < count; i++) {
            let total = 0;
            total = price;
            console.log("김밥 " + i + "줄째, 누적 " + total + "원");
          }
          console.log("합계: " + total + "원");
  solution:
    files:
      - path: main.js
        content: |
          const price = 2500; // 김밥 한 줄 가격
          const count = 4;    // 주문한 줄 수

          let total = 0;
          for (let i = 1; i <= count; i++) {
            total += price;
            console.log("김밥 " + i + "줄째, 누적 " + total + "원");
          }
          console.log("합계: " + total + "원");
  bugDescription: "줄 번호가 `0줄째`부터 나오고, 누적 금액이 늘지 않고 계속 `2500원`이에요. 마지막에는 `ReferenceError: total is not defined` 오류가 나요."
  checks:
    - kind: console
      id: lines
      description: 김밥을 담을 때마다 1줄째부터 4줄째까지 줄 번호와 누적 금액이 출력되어야 합니다.
      requirement: 줄마다 누적 금액
      expect:
        lines:
          - 김밥 1줄째, 누적 2500원
          - 김밥 2줄째, 누적 5000원
          - 김밥 3줄째, 누적 7500원
          - 김밥 4줄째, 누적 10000원
          - "합계: 10000원"
    - kind: program
      id: no-error
      description: 반복이 끝난 뒤에도 합계를 쓸 수 있어서 프로그램이 오류 없이 끝나야 합니다.
      requirement: 합계 출력
      expect:
        noError: true
      misconceptionIfFail: js.mc.accumulator-reset-in-loop
misconceptions: [js.mc.accumulator-reset-in-loop, js.mc.accumulator-overwrite, js.mc.for-off-by-one]
hints:
  - 증상이 세 가지예요. 줄 번호, 누적 금액, 마지막 오류를 하나씩 따로 고쳐 보세요.
  - "`total`을 만드는 줄은 반복의 안에 있나요, 바깥에 있나요? 그 때문에 생기는 증상이 두 가지예요. 그리고 6번 줄은 더하기인가요, 덮어쓰기인가요?"
  - "누적 변수 `let total = 0;`은 반복 앞으로 옮기고, 본문에서는 `+=`로 더해요. 줄 번호가 1부터 4까지 나오도록 반복 변수의 시작값과 조건을 함께 바꿔요."
explanation: |
  버그는 세 개예요.

  1. **누적 변수가 반복 안에 있어요(5번 줄).** 회차마다 0으로 돌아가고, 반복 블록 안에서만 있어서 9번 줄에서는 `ReferenceError: total is not defined`가 나요. → `let total = 0;`을 반복 앞으로 옮겨요.
  1. **덮어쓰기(6번 줄).** `total = price;`는 매번 2500으로 바꿀 뿐이에요. → `total += price;`
  1. **반복 변수의 범위(4번 줄).** `i`가 0~3이라 줄 번호가 `0줄째`부터 나와요. 횟수(4번)는 맞지만 출력에 쓰는 값이 하나씩 밀렸어요. → `for (let i = 1; i <= count; i++)`

  ```js
  let total = 0;
  for (let i = 1; i <= count; i++) {
    total += price;
    console.log("김밥 " + i + "줄째, 누적 " + total + "원");
  }
  console.log("합계: " + total + "원");
  ```

  `console.log`에 `(i + 1)`을 써서 줄 번호만 고쳐도 출력은 같아요. 하지만 반복 변수 자체가 "몇 번째 줄"을 뜻하게 하면 코드를 읽기가 더 쉬워요.
origin: authored
