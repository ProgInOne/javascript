prompt: |
  21층 건물에 "짝수 층 전용" 엘리베이터가 있어요. 꼭대기에서 출발해 1층까지 내려오는 동안 서는 층을 안내하는 프로그램을 작성하세요.

  - 엘리베이터는 **짝수 층에만** 서요. 꼭대기 층(`topFloor`)은 21층이라 서지 않아요.
  - `for` 문 하나로 높은 층부터 차례로, 서는 층을 `20층에 서요`처럼 한 줄에 하나씩 출력하세요. 2층이 마지막으로 서는 층이에요.
  - 선 횟수는 `stops`라는 변수에 세고, 반복이 끝나면 `모두 (횟수)번 섰어요`와 `1층은 계단을 이용하세요`를 차례로 출력하세요.
  - 실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  20층에 서요
  18층에 서요
  16층에 서요
  14층에 서요
  12층에 서요
  10층에 서요
  8층에 서요
  6층에 서요
  4층에 서요
  2층에 서요
  모두 10번 섰어요
  1층은 계단을 이용하세요
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const topFloor = 21; // 꼭대기 층
          let stops = 0;  // 엘리베이터가 선 횟수

          // for 문 하나로 짝수 층만 높은 층부터 안내하고, 선 횟수를 세세요.
  solution:
    files:
      - path: main.js
        content: |
          const topFloor = 21; // 꼭대기 층
          let stops = 0;  // 엘리베이터가 선 횟수

          // for 문 하나로 짝수 층만 높은 층부터 안내하고, 선 횟수를 세세요.
          for (let floor = topFloor - 1; floor >= 2; floor -= 2) {
            console.log(floor + "층에 서요");
            stops++;
          }
          console.log("모두 " + stops + "번 섰어요");
          console.log("1층은 계단을 이용하세요");
  checks:
    - kind: console
      id: output
      description: 20층부터 2층까지 짝수 층이 높은 층부터 한 줄씩 나오고, 선 횟수와 계단 안내가 출력되어야 합니다.
      requirement: 짝수 층 안내
      expect:
        lines:
          - 20층에 서요
          - 18층에 서요
          - 16층에 서요
          - 14층에 서요
          - 12층에 서요
          - 10층에 서요
          - 8층에 서요
          - 6층에 서요
          - 4층에 서요
          - 2층에 서요
          - 모두 10번 섰어요
          - 1층은 계단을 이용하세요
    - kind: program
      id: stops
      description: 반복이 끝난 뒤 stops에 엘리베이터가 선 횟수가 들어 있어야 합니다. 21층과 1층에서는 서지 않아요.
      requirement: 선 횟수 세기
      expect:
        globals: { stops: { equals: 10 } }
        noError: true
      misconceptionIfFail: js.mc.for-off-by-one
misconceptions: [js.mc.for-off-by-one]
hints:
  - 반복 변수의 시작값·조건·갱신을 하나씩 정해 보세요. 21층은 홀수라서 첫 번째로 서는 층이 아니에요.
  - 마지막으로 서는 층은 2층이에요. 조건이 2층에서는 참이고, 그다음 값에서는 거짓이 되어야 해요. 선 횟수는 층을 출력할 때마다 1씩 늘려요.
  - 시작값은 `topFloor`보다 1 작은 층, 갱신은 2씩 빼기(`-= 2`)예요. 조건은 힌트 2의 기준(2층에서 참, 그다음 값에서 거짓)에 맞춰 직접 정해 보세요. 요약 두 줄은 반복 바깥에 써요.
explanation: |
  예시 정답이에요.

  ```js
  for (let floor = topFloor - 1; floor >= 2; floor -= 2) {
    console.log(floor + "층에 서요");
    stops++;
  }
  console.log("모두 " + stops + "번 섰어요");
  console.log("1층은 계단을 이용하세요");
  ```

  - **시작값**: 꼭대기 21층은 홀수라 서지 않아요. 첫 번째로 서는 층은 `topFloor - 1`인 20층이에요. `let floor = 20`이라고 써도 결과는 같아요.
  - **조건과 갱신**: `floor -= 2`로 20, 18, …, 2를 거치고, 다음 값 0에서 `0 >= 2`가 거짓이 되어 끝나요. `floor > 2`로 쓰면 2층이 빠지고, `floor >= 0`으로 쓰면 `0층에 서요`까지 나와요.
  - **선 횟수**: `stops`는 반복 앞에서 0으로 시작하는 누적 변수예요. 층을 안내할 때마다 1씩 늘려요.
  - `let floor = topFloor`에서 시작해 `-= 2`로 내려가면 21, 19, …처럼 홀수 층만 나와요. 시작값 하나가 모든 회차의 값을 바꿔요.
  - 1씩 내려가며 `if (floor % 2 === 0)`일 때만 안내하고 세는 방법도 정답이에요. 반복 횟수는 늘지만 결과는 같아요.
