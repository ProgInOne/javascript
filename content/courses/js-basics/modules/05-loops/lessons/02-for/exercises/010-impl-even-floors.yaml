id: js-basics.loops.for.impl-even-floors
type: implement_function
difficulty: 3
concepts:
  - { id: js.loops.for, weight: 1 }
  - { id: js.loops.loop-variable, weight: 0.3 }
tags: [for, step, write-code]
estimatedSeconds: 240
prompt: |
  20층 건물의 "짝수 층 전용" 엘리베이터가 꼭대기에서 내려오는 프로그램을 작성하세요.

  - `for` 문 하나로 20층부터 2층까지 **짝수 층만, 높은 층부터** 출력하세요. 반복 변수를 2씩 줄이면 돼요.
  - 반복이 끝나면 `1층으로 가려면 계단을 이용하세요`를 출력하세요.
  - 실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  20층
  18층
  16층
  14층
  12층
  10층
  8층
  6층
  4층
  2층
  1층으로 가려면 계단을 이용하세요
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          // for 문으로 20층부터 2층까지 짝수 층을 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          // for 문으로 20층부터 2층까지 짝수 층을 출력하세요.
          for (let floor = 20; floor >= 2; floor -= 2) {
            console.log(floor + "층");
          }
          console.log("1층으로 가려면 계단을 이용하세요");
  checks:
    - kind: console
      id: output
      description: 20층부터 2층까지 짝수 층이 높은 층부터 한 줄씩 나오고, 마지막에 계단 안내가 출력되어야 합니다.
      requirement: 짝수 층 출력
      expect:
        lines:
          - 20층
          - 18층
          - 16층
          - 14층
          - 12층
          - 10층
          - 8층
          - 6층
          - 4층
          - 2층
          - 1층으로 가려면 계단을 이용하세요
    - kind: program
      id: no-error
      description: 프로그램이 오류 없이 끝나야 합니다.
      requirement: 오류 없이 실행
      expect:
        noError: true
misconceptions: [js.mc.for-off-by-one]
hints:
  - 반복 변수의 시작값, 끝나는 조건, 바꾸는 방법을 하나씩 정해 보세요. 시작은 20층이에요.
  - 회차마다 2층씩 내려가요. 마지막으로 출력할 층은 2층이니 조건이 2층에서도 참이어야 해요.
  - "`for (let floor = 20; floor >= 2; floor -= 2)` 모양이에요. 계단 안내는 반복 바깥에 써요."
explanation: |
  예시 정답이에요.

  ```js
  for (let floor = 20; floor >= 2; floor -= 2) {
    console.log(floor + "층");
  }
  console.log("1층으로 가려면 계단을 이용하세요");
  ```

  - 갱신 `floor -= 2`로 20, 18, …, 2를 거쳐요. 2를 뺀 다음 값 0에서 `0 >= 2`가 거짓이 되어 끝나요.
  - 조건을 `floor > 2`로 쓰면 2층이 빠지고, `floor >= 0`으로 쓰면 `0층`까지 나와요. 마지막으로 출력할 값이 조건을 통과하는지 확인해요.
  - 갱신을 `floor--`로 쓰면 홀수 층까지 모두 나와요. 반복 변수는 1씩만 바꿀 수 있는 게 아니에요.
origin: authored
