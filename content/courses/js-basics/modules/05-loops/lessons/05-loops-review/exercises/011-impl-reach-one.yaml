id: js-basics.loops.loops-review.impl-reach-one
type: implement_function
difficulty: 4
concepts:
  - { id: js.loops.while, weight: 1 }
  - { id: js.control.if, weight: 0.3 }
  - { id: js.ops.remainder, weight: 0.3 }
  - { id: js.loops.accumulator-pattern, weight: 0.3 }
tags: [while, remainder, accumulator, write-code, assessment]
estimatedSeconds: 420
usage: assessment
prompt: |
  어떤 수에 아래 규칙을 되풀이하면 결국 1이 된다고 해요.

  - 짝수면 2로 나눠요.
  - 홀수면 3을 곱하고 1을 더해요.

  6에서 시작해 1이 될 때까지 규칙을 되풀이하는 프로그램을 작성하세요.

  - 몇 번 만에 1이 될지 미리 알 수 없으므로 **`while` 반복**을 쓰세요. 1이 되면 멈춰요.
  - 시작 코드의 `n`(지금 수), `steps`(규칙을 적용한 횟수), `path`(지나온 수를 이어 붙인 글자)를 쓰세요.
  - 규칙을 한 번 적용할 때마다 `path` 끝에 ` → `와 새 수를 이어 붙이세요.
  - 반복이 끝나면 `path`를 출력하고, 이어서 `(횟수)번 만에 1 도착`을 출력하세요.
  - 실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  6 → 3 → 10 → 5 → 16 → 8 → 4 → 2 → 1
  8번 만에 1 도착
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          let n = 6;          // 지금 수
          let steps = 0;      // 규칙을 적용한 횟수
          let path = "" + n;  // 지나온 수를 이어 붙인 글자 (처음에는 "6")

          // while 반복으로 n이 1이 될 때까지 규칙을 적용하세요.
  solution:
    files:
      - path: main.js
        content: |
          let n = 6;          // 지금 수
          let steps = 0;      // 규칙을 적용한 횟수
          let path = "" + n;  // 지나온 수를 이어 붙인 글자 (처음에는 "6")

          // while 반복으로 n이 1이 될 때까지 규칙을 적용하세요.
          while (n !== 1) {
            if (n % 2 === 0) {
              n = n / 2;
            } else {
              n = n * 3 + 1;
            }
            steps++;
            path += " → " + n;
          }
          console.log(path);
          console.log(steps + "번 만에 1 도착");
  checks:
    - kind: console
      id: output
      description: 6부터 1까지 지나온 수가 한 줄로 출력되고, 이어서 규칙을 적용한 횟수가 출력되어야 합니다.
      requirement: 1이 될 때까지 반복
      expect:
        lines: ["6 → 3 → 10 → 5 → 16 → 8 → 4 → 2 → 1", "8번 만에 1 도착"]
    - kind: program
      id: final-state
      description: 반복이 끝난 뒤 n은 1, steps는 규칙을 적용한 횟수여야 하고, 프로그램이 오류 없이 끝나야 합니다.
      requirement: 1이 될 때까지 반복
      visible: false
      expect:
        globals: { n: { equals: 1 }, steps: { equals: 8 } }
        noError: true
hints:
  - 반복 조건은 "아직 1이 아닌 동안"이에요. 조건 안에서 `n`이 끝내 1이 되어야 반복이 끝나요.
  - 짝수인지는 `n % 2 === 0`으로 알 수 있어요. 짝수와 홀수 중 하나만 실행되도록 `if...else`로 나눠요.
  - 본문은 "① 규칙대로 `n` 바꾸기 → ② 횟수 1 늘리기 → ③ `path`에 새 `n` 이어 붙이기" 순서예요. 출력은 반복이 끝난 뒤에 해요.
explanation: |
  예시 정답이에요.

  ```js
  while (n !== 1) {
    if (n % 2 === 0) {
      n = n / 2;
    } else {
      n = n * 3 + 1;
    }
    steps++;
    path += " → " + n;
  }
  console.log(path);
  console.log(steps + "번 만에 1 도착");
  ```

  - 몇 번 반복할지 모르고 "1이 될 때까지"만 알기 때문에 `while (n !== 1)`이 알맞아요. 6 → 3 → 10 → 5 → 16 → 8 → 4 → 2 → 1로 8번 바뀐 뒤 조건이 거짓이 되어 끝나요.
  - `if`와 `else`로 나눠야 해요. `if (n % 2 === 0)`과 `if (n % 2 === 1)`을 따로 쓰면, 6을 3으로 바꾼 뒤 같은 회차에 3을 다시 홀수로 검사해 10으로 만들어 버리는 것처럼 한 회차에 규칙이 두 번 적용돼요. 더 나쁜 것은 2를 1로 바꾼 회차에 1을 다시 홀수로 보고 4로 만든다는 점이에요. 조건을 검사하는 순간에 `n`이 1인 적이 없어서 반복이 끝나지 않아요.
  - `steps`와 `path`는 반복 바깥에서 시작값을 정한 누적 변수예요. `path`는 처음 수 `"6"`으로 시작하고, 규칙을 적용할 때마다 ` → `와 새 수가 붙어요.
  - 출력을 반복 안에 두면 줄이 여러 개 나와요. 다 모은 뒤 반복 밖에서 한 번씩 출력해요.
