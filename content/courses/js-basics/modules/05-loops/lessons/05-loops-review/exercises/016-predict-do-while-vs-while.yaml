id: js-basics.loops.loops-review.predict-do-while-vs-while
type: predict_output
difficulty: 2
concepts:
  - { id: js.loops.do-while, weight: 1 }
  - { id: js.loops.while, weight: 0.5 }
tags: [do-while, while, trace, condition, assessment]
estimatedSeconds: 100
usage: assessment
prompt: |
  주차장에서 차를 3칸씩 띄워 세우는 안내 프로그램이에요. 같은 시작값과 같은 조건을 `do...while`과 `while`에 각각 썼어요. 실행하면 콘솔에 무엇이 출력될까요?
spec:
  lang: js
  code: |
    let a = 5;
    do {
      console.log("do: " + a + "번 칸");
      a += 3;
    } while (a < 5);

    let b = 5;
    while (b < 5) {
      console.log("while: " + b + "번 칸");
      b += 3;
    }

    console.log(a + ", " + b);
  answerKind: console
  misconceptionByAnswer:
    "5, 5": js.mc.do-while-checks-first
    "do: 5번 칸\nwhile: 5번 칸\n8, 8": js.mc.while-runs-at-least-once
misconceptions: [js.mc.do-while-checks-first, js.mc.while-runs-at-least-once]
hints:
  - 두 반복 모두 조건 `< 5`가 시작값 5에서 거짓이에요. 차이는 조건을 **언제** 처음 검사하느냐예요.
  - "`do...while`은 본문을 먼저 한 번 실행하고 나서 조건을 검사해요. `while`은 본문보다 조건을 먼저 검사해요."
  - 본문이 실행된 반복에서만 변수가 3 늘어나요. 마지막 줄에서 `a`와 `b`는 각각 얼마인가요?
explanation: |
  출력은 다음과 같아요.

  ```text
  do: 5번 칸
  8, 5
  ```

  - `do...while`: 본문을 먼저 실행해서 `do: 5번 칸`을 출력하고 `a`는 8이 돼요. 그다음 처음으로 조건 `8 < 5`를 검사하는데 거짓이라 끝나요.
  - `while`: 본문보다 조건 `5 < 5`를 먼저 검사해요. 처음부터 거짓이라 본문은 한 번도 실행되지 않고, `b`는 5 그대로예요.
  - 마지막 줄은 `8, 5`예요.

  `5, 5`만 나온다고 생각했다면 `do...while`도 조건을 먼저 검사한다고 본 거예요. `while`도 한 번은 실행된다고 생각했다면 "적어도 한 번 실행"이 `while`에도 해당한다고 본 거예요. 이 성질은 조건이 본문 뒤에 있는 `do...while`에만 있어요.
