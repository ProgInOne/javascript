id: js-basics.loops.loops-review.mcq-staircase-count
type: mcq_single
difficulty: 3
concepts:
  - { id: js.loops.nested, weight: 1 }
  - { id: js.loops.loop-variable, weight: 0.3 }
  - { id: js.loops.accumulator-pattern, weight: 0.3 }
tags: [nested, count, loop-variable, trace, assessment]
estimatedSeconds: 120
usage: assessment
prompt: |
  블록으로 계단을 쌓는 프로그램이에요. 줄마다 놓는 블록 수가 달라요. 마지막 줄에서 무엇이 출력되나요?
code: |
  let blocks = 0;
  for (let row = 1; row <= 4; row++) {
    for (let col = row; col <= 4; col++) {
      blocks++;
    }
  }
  console.log(blocks);
spec:
  options:
    - id: a
      text: "`10`"
    - id: b
      text: "`16`"
      rationale: 안쪽 반복이 매번 4번 돈다면 4 × 4 = 16이에요. 하지만 안쪽 반복은 col이 row부터 시작하므로 바깥 회차가 진행될수록 짧아져요.
    - id: c
      text: "`8`"
      misconception: js.mc.nested-count-additive
      rationale: 바깥 반복 4번과 안쪽 반복 4번을 더한 수예요. 안쪽 반복은 바깥 회차마다 통째로 다시 돌기 때문에 더하기로 셀 수 없어요.
    - id: d
      text: "`4`"
      misconception: js.mc.inner-var-not-reset
      rationale: 안쪽 반복이 첫 바깥 회차에만 돈다고 본 거예요. 안쪽 반복은 바깥 회차마다 col = row부터 처음부터 다시 돌아요.
  correct: a
misconceptions: [js.mc.nested-count-additive, js.mc.inner-var-not-reset]
hints:
  - 바깥 회차마다 안쪽 반복이 처음부터 다시 돌아요. 그런데 안쪽 반복의 시작값이 `row`라서 회차마다 달라요.
  - "`row`가 1일 때 `col`은 1, 2, 3, 4로 4번 돌아요. `row`가 2일 때는 몇 번인가요?"
  - 바깥 회차마다 안쪽 반복이 도는 횟수를 모두 더해 보세요.
explanation: |
  정답은 `10`이에요.

  안쪽 반복은 바깥 회차마다 `col = row`부터 처음부터 다시 돌아요. 시작값이 `row`라서 회차마다 도는 횟수가 줄어요.

  - `row` 1: `col` 1, 2, 3, 4 → 4번
  - `row` 2: `col` 2, 3, 4 → 3번
  - `row` 3: `col` 3, 4 → 2번
  - `row` 4: `col` 4 → 1번

  모두 4 + 3 + 2 + 1 = 10번 `blocks++`가 실행돼요.

  - `16`: 안쪽 반복이 늘 1부터 4까지 돈다고 보고 4 × 4로 곱한 거예요. 안쪽 시작값이 바깥 반복 변수 `row`에 따라 바뀌는 것을 놓쳤어요.
  - `8`: 바깥 4번과 안쪽 4번을 더했어요. 중첩 반복의 횟수는 더하기가 아니라 "바깥 회차마다 안쪽 횟수"를 모두 모아서 세요.
  - `4`: 안쪽 반복이 첫 바깥 회차에서만 돈다고 본 거예요. 안쪽 반복은 바깥 회차가 바뀔 때마다 새로 시작해요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
