id: js-basics.loops.loops-review.find-bug-count-no-start
type: find_bug_line
difficulty: 3
concepts:
  - { id: js.loops.accumulator-pattern, weight: 1 }
  - { id: js.loops.for, weight: 0.3 }
  - { id: js.ops.remainder, weight: 0.3 }
tags: [accumulator, for, nan, debugging, assessment]
estimatedSeconds: 130
usage: assessment
prompt: |
  1부터 50까지의 수 중에서 7의 배수가 몇 개인지, 그리고 그 합계가 얼마인지 구하는 프로그램이에요. 오류는 없는데 결과 한쪽이 이상해요. 원인이 되는 줄을 찾고, 왜 그런지도 고르세요.
spec:
  code: |-
    let sum = 0;
    let count;
    for (let n = 1; n <= 50; n++) {
      if (n % 7 === 0) {
        sum += n;
        count++;
      }
    }
    console.log("7의 배수: " + count + "개, 합계 " + sum);
  bugLines: [2]
  symptom: "`7의 배수: NaN개, 합계 196`이 나와요. 합계는 맞는데 개수가 숫자가 아니에요."
  symptomCheck:
    console: ["7의 배수: NaN개, 합계 196"]
  fixedCode: |-
    let sum = 0;
    let count = 0;
    for (let n = 1; n <= 50; n++) {
      if (n % 7 === 0) {
        sum += n;
        count++;
      }
    }
    console.log("7의 배수: " + count + "개, 합계 " + sum);
  causeOptions:
    - id: c1
      text: count를 만들 때 시작값을 주지 않아 undefined에서 시작했고, undefined에 1을 더하면 NaN이 된다
      correct: true
    - id: c2
      text: let count;로 만든 count는 0에서 시작하므로 문제없다. ++가 원인이고, count += 1로 바꾸면 0부터 1씩 늘어난다
      misconception: js.mc.accumulator-no-init
    - id: c3
      text: count를 글자와 이어 붙이는 줄에서 숫자가 글자로 바뀌면서 NaN이 되었다
misconceptions: [js.mc.accumulator-no-init]
hints:
  - "`sum`과 `count`는 둘 다 반복 안에서 값을 모으는 누적 변수예요. 둘을 만드는 줄을 비교해 보세요."
  - 시작값 없이 `let`으로 만든 변수에는 어떤 값이 들어 있나요?
  - "`undefined + 1`은 숫자일까요? 첫 번째 7의 배수를 만났을 때 `count++`가 무엇을 만드는지 생각해 보세요."
explanation: |
  원인은 **2번 줄**이에요. `let count;`는 시작값이 없어서 `count`에 `undefined`가 들어 있어요.

  - 첫 번째 7의 배수인 7을 만나면 `count++`가 `undefined + 1`을 계산해요. 결과는 숫자가 아닌 `NaN`이에요.
  - `NaN`에 1을 더해도 계속 `NaN`이라, 이후로 몇 번을 세어도 `NaN`이 남아요.
  - `sum`은 `0`으로 시작했으니 7 + 14 + … + 49 = 196이 바르게 나왔어요.

  `let count = 0;`으로 고치면 `7의 배수: 7개, 합계 196`이 나와요. 누적 변수는 개수든 합계든 반복 바깥에서 시작값을 꼭 정해 줘야 해요.

  - "`let count;`는 0에서 시작하고 `++`가 원인이다"는 틀렸어요. 시작값 없이 만든 변수는 0이 아니라 `undefined`예요. `count += 1`로 바꿔도 `undefined + 1`이라 똑같이 `NaN`이 나와요. 고칠 곳은 `++`가 아니라 시작값이에요.
  - "글자와 이어 붙일 때 NaN이 되었다"도 틀렸어요. 숫자를 글자와 이어 붙이면 `"7"`처럼 숫자가 글자로 바뀔 뿐이에요. 같은 줄의 `sum`은 196으로 잘 나왔어요.
origin: authored
review:
