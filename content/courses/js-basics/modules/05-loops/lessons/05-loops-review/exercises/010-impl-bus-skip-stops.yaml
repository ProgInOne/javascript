          - "1번 정류장 정차, 승객 3명"
          - "3번 정류장 정차, 승객 6명"
          - "5번 정류장 정차, 승객 9명"
          - "7번 정류장 정차, 승객 12명"
          - "9번 정류장 정차, 승객 15명"
          - "종점 도착, 승객 15명"
    - kind: program
      id: final-state
      description: 반복이 끝난 뒤 stop은 마지막으로 지난 정류장 번호, passengers는 탄 승객 수여야 하고, 프로그램이 오류 없이 끝나야 합니다.
      requirement: 끝까지 운행
