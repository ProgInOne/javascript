        globals: { stop: { equals: 10 }, passengers: { equals: 15 } }
        noError: true
      misconceptionIfFail: js.mc.continue-while-update
misconceptions: [js.mc.continue-while-update, js.mc.continue-ends-loop]
hints:
  - 짝수인지는 `stop % 2 === 0`으로 알 수 있어요. 짝수면 승객을 태우거나 출력하지 않고 다음 정류장으로 넘어가요.
  - "`while`에서 `continue`를 만나면 본문의 남은 줄을 건너뛰고 바로 조건을 검사해요. 정류장 번호를 늘리는 줄이 `continue`보다 아래에 있으면 어떻게 될까요?"
  - 본문의 순서를 "① 다음 정류장으로 번호 늘리기 → ② 짝수면 건너뛰기 → ③ 승객 태우고 출력"으로 짜 보세요.
explanation: |
  예시 정답이에요.

  ```js
  while (stop < 10) {
    stop++;
    if (stop % 2 === 0) {
      continue;
    }
    passengers += 3;
    console.log(stop + "번 정류장 정차, 승객 " + passengers + "명");
  }
  console.log("종점 도착, 승객 " + passengers + "명");
  ```

  - `stop++`를 본문 **맨 앞**에 둔 것이 핵심이에요. `while`의 `continue`는 갱신식이 따로 없어서 바로 조건 검사로 넘어가요. `stop++`를 본문 끝에 두면 2번 정류장에서 `continue`가 `stop++`를 건너뛰고, `stop`이 2에 머물러 반복이 끝나지 않아요.
  - 짝수 정류장에서는 `continue`가 아래의 승객 태우기와 출력을 건너뛰어요. 반복 자체는 끝나지 않으므로 3, 5, 7, 9번에서도 계속 정차해요. `continue` 대신 `break`를 쓰면 2번에서 운행이 끝나요.
  - `passengers`는 반복 바깥에서 0으로 시작하는 누적 변수예요. 10번(짝수)을 지나면 `10 < 10`이 거짓이 되어 반복이 끝나고, 종점 안내가 한 번 나와요.
