prompt: |
  1번부터 10번까지 정류장을 차례로 지나는 버스 프로그램을 작성하세요. 규칙은 이래요.

  - 짝수 번호 정류장은 공사 중이라 서지 않고 지나가요. **`while` 반복과 `continue`** 로 건너뛰세요.
  - 서는 정류장마다 승객이 3명씩 타요. 내리는 사람은 없어요.
  - 설 때마다 `(번호)번 정류장 정차, 승객 (지금까지 탄 승객 수)명`을 출력해요.
  - 10번 정류장까지 지나간 뒤 `종점 도착, 승객 (승객 수)명`을 출력해요.
  - 시작 코드의 변수 `stop`(지금 지나는 정류장 번호)과 `passengers`(승객 수)를 쓰세요.
  - 실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  1번 정류장 정차, 승객 3명
  3번 정류장 정차, 승객 6명
  5번 정류장 정차, 승객 9명
  7번 정류장 정차, 승객 12명
  9번 정류장 정차, 승객 15명
  종점 도착, 승객 15명
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          let stop = 0;       // 지금 지나는 정류장 번호 (아직 출발 전)
          let passengers = 0; // 지금까지 탄 승객 수

          // while 반복으로 1번부터 10번 정류장까지 지나가세요.
          // 짝수 번호 정류장은 continue로 건너뛰세요.
  solution:
    files:
      - path: main.js
        content: |
          let stop = 0;       // 지금 지나는 정류장 번호 (아직 출발 전)
          let passengers = 0; // 지금까지 탄 승객 수

          // while 반복으로 1번부터 10번 정류장까지 지나가세요.
          // 짝수 번호 정류장은 continue로 건너뛰세요.
          while (stop < 10) {
            stop++;
            if (stop % 2 === 0) {
              continue;
            }
            passengers += 3;
            console.log(stop + "번 정류장 정차, 승객 " + passengers + "명");
          }
          console.log("종점 도착, 승객 " + passengers + "명");
  checks:
    - kind: console
      id: output
      description: 홀수 번호 정류장 다섯 곳의 정차 안내와 종점 도착 안내가 차례로 출력되어야 합니다.
      requirement: 정차 안내
      expect:
