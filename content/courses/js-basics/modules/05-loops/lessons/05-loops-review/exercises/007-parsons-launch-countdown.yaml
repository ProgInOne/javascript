id: js-basics.loops.loops-review.parsons-launch-countdown
type: parsons
difficulty: 3
concepts:
  - { id: js.loops.for, weight: 1 }
  - { id: js.loops.accumulator-pattern, weight: 0.5 }
tags: [for, countdown, accumulator, string, assessment]
estimatedSeconds: 150
usage: assessment
prompt: |
  로켓 발사 안내를 **한 줄**로 만드는 프로그램이에요. 5부터 1까지 거꾸로 센 숫자를 글자 하나에 이어 붙인 뒤, 끝에 `발사!`를 붙여 한 번만 출력해요. 코드 조각을 순서대로 배열해서 아래처럼 출력되게 하세요.

  ```text
  5 4 3 2 1 발사!
  ```
spec:
  lines:
    - { id: l1, code: 'let text = "";' }
    - { id: l2, code: "for (let n = 5; n >= 1; n--) {" }
    - { id: l3, code: 'text += n + " ";', indent: 1 }
    - { id: l4, code: "}" }
    - { id: l5, code: 'text += "발사!";' }
    - { id: l6, code: "console.log(text);" }
  distractors:
    - { id: d1, code: "for (let n = 5; n > 1; n--) {", replaces: l2, misconception: js.mc.for-off-by-one }
    - { id: d2, code: 'text = n + " ";', replaces: l3, misconception: js.mc.accumulator-overwrite }
  gradeIndent: false
  checks:
    - kind: console
      id: output
      description: 5부터 1까지의 숫자와 "발사!"가 한 줄에 이어져 한 번 출력되어야 합니다.
      requirement: 한 줄 카운트다운
      expect:
        lines: ["5 4 3 2 1 발사!"]
misconceptions: [js.mc.for-off-by-one, js.mc.accumulator-overwrite]
hints:
  - 출력이 한 줄뿐이에요. `console.log`는 반복 안과 밖 중 어디에 있어야 할까요?
  - 이어 붙일 글자 변수는 반복보다 먼저 빈 글자로 만들어 두어야 해요. `발사!`는 숫자를 다 붙인 다음에 한 번만 붙여요.
  - 1도 출력되어야 해요. 조건이 `n`이 1일 때도 참인지 확인하고, 이어 붙이기와 덮어쓰기를 구별하세요.
explanation: |
  정답 순서예요.

  ```js
  let text = "";
  for (let n = 5; n >= 1; n--) {
    text += n + " ";
  }
  text += "발사!";
  console.log(text);
  ```

  - `text`는 누적 변수라서 반복 바깥에서 빈 글자 `""`로 시작해요. 반복 안에 두면 회차마다 빈 글자로 돌아가요.
  - `n`이 5, 4, 3, 2, 1일 때 본문이 실행되고, 0에서 `n >= 1`이 거짓이 되어 끝나요. `n > 1`을 고르면 1이 빠져 `5 4 3 2 발사!`가 돼요.
  - `text = n + " "`는 앞에서 붙인 글자를 지우고 새로 넣는 덮어쓰기라서 마지막 숫자만 남아요(`1 발사!`). 모으려면 `+=`를 써요.
  - `발사!` 붙이기와 출력은 반복이 끝난 뒤에 한 번씩만 해요. 반복 안에 두면 줄이 여러 개 나와요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
