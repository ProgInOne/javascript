id: js-basics.loops.loops-review.mcq-continue-next-step
type: mcq_single
difficulty: 1
concepts:
  - { id: js.loops.continue, weight: 1 }
  - { id: js.loops.for, weight: 0.3 }
tags: [continue, for, order, assessment]
estimatedSeconds: 60
usage: assessment
prompt: |
  아래 코드에서 `n`이 5인 회차에 `continue;`를 만났어요. **바로 다음에** 실행되는 것은 무엇인가요?
code: |
  for (let n = 1; n <= 9; n += 2) {
    if (n === 5) {
      continue;
    }
    console.log(n);
  }
  console.log("끝");
spec:
  options:
    - id: a
      text: 갱신식 `n += 2`가 실행되어 `n`이 7이 된다
    - id: b
      text: "`n`이 5인 채로 조건 `n <= 9`를 다시 검사한다"
      rationale: for에서 continue를 만나면 조건 검사 전에 갱신식부터 실행해요. 갱신 없이 조건만 다시 검사한다면 n이 5에서 바뀌지 않아 반복이 끝나지 않을 거예요.
    - id: c
      text: "`console.log(n);`이 실행되어 5가 출력된다"
      rationale: continue는 이번 회차의 남은 본문을 건너뛰어요. 그래서 5는 출력되지 않아요.
    - id: d
      text: 반복이 끝나고 `console.log("끝");`이 실행된다
      misconception: js.mc.continue-ends-loop
      rationale: 반복 전체를 끝내는 것은 break예요. continue는 다음 회차로 넘어갈 뿐이에요.
  correct: a
misconceptions: [js.mc.continue-ends-loop]
hints:
  - "`continue`는 반복 전체가 아니라 이번 회차만 끝내요."
  - "`for (초기화; 조건; 갱신)`에서 한 회차의 본문이 끝나면 항상 무엇이 실행되나요?"
  - for에서 continue는 "본문이 여기서 끝난 것처럼" 동작해요. 본문이 끝난 뒤의 순서를 그대로 따라가 보세요.
explanation: |
  정답은 "갱신식 `n += 2`가 실행되어 `n`이 7이 된다"예요.

  `for` 반복에서 `continue`를 만나면 이번 회차의 남은 본문을 건너뛰고, 본문이 끝났을 때와 똑같이 **갱신식 → 조건 검사** 순서로 넘어가요. 그래서 `n`은 7이 되고, `7 <= 9`가 참이라 다음 회차가 이어져요. 전체 출력은 `1`, `3`, `7`, `9`, `끝`이에요.

  - "`n`이 5인 채로 조건을 다시 검사한다": `for`에서는 갱신식을 건너뛰지 않아요. 갱신식 없이 조건으로 바로 가는 것은 `while` 반복에서 `continue`를 썼을 때예요(그때는 본문 끝의 증가 문장이 건너뛰어질 수 있어요).
  - "`console.log(n);`이 실행된다": `continue` 아래에 있는 본문 줄은 이번 회차에 실행되지 않아요.
  - "반복이 끝난다": 반복을 끝내는 것은 `break`예요. `continue` 뒤에도 7과 9는 출력돼요.
origin: authored
