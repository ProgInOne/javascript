id: js-basics.loops.loops-review.fix-budget-break-late
type: fix_bug
difficulty: 3
concepts:
  - { id: js.loops.break, weight: 1 }
  - { id: js.loops.accumulator-pattern, weight: 0.5 }
tags: [break, accumulator, order, debugging, assessment]
estimatedSeconds: 200
usage: assessment
prompt: |
  2,700원짜리 공책을 예산 10,000원 안에서 최대한 많이 사는 프로그램이에요. 한 권씩 담다가, 다음 공책을 담으면 예산을 **넘게 될 때** 멈춰야 해요. 그런데 예산을 넘는 금액이 나와요. 버그를 고쳐서 아래처럼 나오게 하세요.

  ```text
  공책 3권, 8100원
  ```

  - `budget`과 `price`가 바뀌어도 맞게 동작하도록, 권수나 금액을 직접 숫자로 쓰지 말고 반복에서 구해요.
spec:
  buggy:
    files:
      - path: main.js
        content: |
          const budget = 10000;
          const price = 2700;
          let total = 0; // 지금까지 담은 금액
          let count = 0; // 지금까지 담은 권수

          for (let i = 1; i <= 10; i++) {
            total += price;
            count++;
            if (total > budget) {
              break;
            }
          }
          console.log("공책 " + count + "권, " + total + "원");
  solution:
    files:
      - path: main.js
        content: |
          const budget = 10000;
          const price = 2700;
          let total = 0; // 지금까지 담은 금액
          let count = 0; // 지금까지 담은 권수

          for (let i = 1; i <= 10; i++) {
            if (total + price > budget) {
              break;
            }
            total += price;
            count++;
          }
          console.log("공책 " + count + "권, " + total + "원");
  bugDescription: 공책 4권, 10800원이 출력돼요. 예산 10,000원을 넘었어요.
  checks:
    - kind: console
      id: output
      description: 예산을 넘지 않는 최대 권수와 그 금액이 출력되어야 합니다.
      requirement: 예산 안에서 멈추기
      expect:
        lines: ["공책 3권, 8100원"]
    - kind: program
      id: totals
      description: 끝난 뒤 total과 count에 실제로 담은 금액과 권수가 들어 있어야 합니다.
      requirement: 예산 안에서 멈추기
      visible: false
      expect:
        globals: { total: { equals: 8100 }, count: { equals: 3 } }
        noError: true
hints:
  - 4권째를 담는 회차를 따라가 보세요. `total`이 예산을 넘었다는 것을 알게 된 시점에 이미 무슨 일이 일어났나요?
  - "`break`는 그 자리에서 반복을 끝낼 뿐, 앞에서 바꾼 `total`과 `count`를 되돌리지 않아요."
  - 담기 **전에** "이번 공책을 담아도 예산 안인가?"를 검사하도록 순서와 조건을 바꿔 보세요.
explanation: |
  원래 코드는 공책을 먼저 담고(`total += price; count++;`) 그다음에 예산을 넘었는지 검사했어요. 4권째 회차에서 `total`이 10800이 된 뒤에야 `break`를 만나므로, 넘친 4권째가 그대로 남았어요. `break`는 반복을 끝낼 뿐 이미 바꾼 값을 되돌리지 않아요.

  예시 정답이에요. 담기 전에 "담으면 넘는가"를 검사해요.

  ```js
  for (let i = 1; i <= 10; i++) {
    if (total + price > budget) {
      break;
    }
    total += price;
    count++;
  }
  ```

  4권째 회차에서 `8100 + 2700 = 10800 > 10000`이 참이라, 담기 전에 멈춰요. `break` 뒤에도 반복 아래의 `console.log`는 실행되어 `공책 3권, 8100원`이 나와요.

  `break`한 뒤에 `total -= price; count--;`로 되돌려도 결과는 같아요. 다만 "담고 나서 빼기"보다 "담기 전에 검사"가 이유를 읽기 쉬워요. 조건만 `total >= budget`으로 바꾸는 것은 고친 것이 아니에요. 여전히 4권째를 담은 뒤에 검사하기 때문이에요.
origin: authored
review:
