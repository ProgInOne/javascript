id: js-basics.loops.loops-review.tf-do-while-false-start
type: true_false
difficulty: 1
concepts:
  - { id: js.loops.do-while, weight: 1 }
tags: [do-while, condition, assessment]
estimatedSeconds: 60
usage: assessment
prompt: |
  다음 설명이 맞는지 고르고, 그렇게 판단한 이유도 고르세요.
code: |
  let tickets = 0;
  do {
    console.log("입장 안내");
    tickets--;
  } while (tickets > 0);
spec:
  statement: "위 코드는 `tickets`가 처음부터 0이라서 `tickets > 0`이 거짓이므로, 콘솔에 아무것도 출력하지 않는다."
  answer: false
  misconceptionIfWrong: js.mc.do-while-checks-first
  requireReason: true
  reasons:
    - id: r1
      text: do...while은 본문을 먼저 한 번 실행한 뒤에 조건을 검사하므로 "입장 안내"가 한 번 출력된다
      correct: true
    - id: r2
      text: do...while도 while처럼 본문보다 조건을 먼저 검사하므로 본문이 실행되지 않는다
      misconception: js.mc.do-while-checks-first
    - id: r3
      text: tickets가 본문에서 계속 줄어들어 조건이 영원히 참이므로 "입장 안내"가 끝없이 출력된다
misconceptions: [js.mc.do-while-checks-first]
hints:
  - "`do { ... } while (조건);`에서 `do` 블록과 `while (조건)` 중 어느 것이 코드에서 먼저 나오나요?"
  - 조건 검사는 본문을 한 번 실행한 다음에 처음으로 일어나요.
  - 첫 회차 본문이 끝난 뒤 `tickets`는 얼마이고, 그때 `tickets > 0`은 참인가요?
explanation: |
  설명은 **틀렸어요**. 이 코드는 `입장 안내`를 **한 번** 출력해요.

  `do...while`은 본문을 먼저 실행하고, 본문이 끝난 뒤에 조건을 검사해요.

  1. 본문 실행: `입장 안내` 출력, `tickets`는 0 → -1
  1. 조건 검사: `-1 > 0`은 거짓 → 반복 끝

  그래서 조건이 처음부터 거짓이어도 본문은 적어도 한 번 실행돼요.

  - "do...while도 while처럼 조건을 먼저 검사한다"는 이유는 틀렸어요. 조건을 먼저 검사하는 것은 `while`이고, `do...while`은 조건이 맨 끝에 있어요.
  - "`입장 안내`가 끝없이 출력된다"도 틀렸어요. `tickets`가 줄어들수록 `tickets > 0`은 더 확실히 거짓이 되므로, 첫 검사에서 바로 끝나요.
