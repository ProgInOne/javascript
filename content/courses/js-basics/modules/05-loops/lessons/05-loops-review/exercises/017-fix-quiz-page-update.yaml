prompt: |
  10쪽짜리 문제집에서 3의 배수 쪽마다 퀴즈가 있어요. 1쪽부터 10쪽까지 넘기며 퀴즈가 있는 쪽을 알려 주고, 마지막에 퀴즈 개수를 출력하는 프로그램이에요. 그런데 실행하면 아무것도 나오지 않다가 실행이 멈춰요. 버그를 고쳐서 아래처럼 나오게 하세요.

  ```text
  3쪽: 퀴즈
  6쪽: 퀴즈
  9쪽: 퀴즈
  퀴즈 3개
  ```
