misconceptions: [js.mc.while-auto-update]
hints:
  - 1쪽에서 시작하는 첫 회차를 따라가 보세요. `1 % 3 === 0`은 참인가요? 그 회차에 `page`는 바뀌나요?
  - "`page++`는 퀴즈가 있는 쪽에서만 실행돼요. 퀴즈가 없는 1쪽에서는 `page`가 영원히 1에 머물러요."
  - 쪽을 넘기는 일은 퀴즈가 있든 없든 회차마다 해야 해요. `page++`를 `if` 블록 바깥, 반복 본문의 끝으로 옮겨 보세요.
explanation: |
  원래 코드는 쪽을 넘기는 `page++`가 `if` 블록 **안**에 있었어요. 첫 회차의 `page`는 1이고 `1 % 3`은 1이라 `if`가 거짓이에요. 그래서 `page++`가 실행되지 않고, 다음 회차에도 `page`는 1, 조건 `1 <= 10`은 계속 참이에요. 반복이 저절로 `page`를 늘려 주지 않으므로 끝나지 않아요.

  예시 정답이에요.

  ```js
  while (page <= 10) {
    if (page % 3 === 0) {
      console.log(page + "쪽: 퀴즈");
      quizzes++;
    }
    page++;
  }
  ```

  - `page++`를 `if` 바깥으로 옮기면 회차마다 1쪽씩 넘어가요. 10쪽까지 본 뒤 `page`가 11이 되어 `11 <= 10`이 거짓이 되고 반복이 끝나요.
  - `if` 안의 `page++`를 그대로 두고 바깥에 하나를 더 쓰면, 3쪽에서 두 쪽을 넘겨 4쪽을 건너뛰어요. 6쪽과 9쪽은 그래도 나오지만 `page` 증가가 두 군데라 흐름을 읽기 어려워요. 쪽 넘기기는 한 곳에서만 해요.
  - `for (let page = 1; page <= 10; page++)`로 바꿔도 출력은 같아요. 다만 그러면 반복 안에서 새 `page`가 생겨 위쪽 `page`는 1로 남고, 끝난 뒤의 값 체크에 실패해요.
