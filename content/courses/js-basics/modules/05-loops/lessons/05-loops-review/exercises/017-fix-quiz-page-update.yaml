  solution:
    files:
      - path: main.js
        content: |
          let page = 1;    // 지금 보는 쪽
          let quizzes = 0; // 지금까지 찾은 퀴즈 개수

          while (page <= 10) {
            if (page % 3 === 0) {
              console.log(page + "쪽: 퀴즈");
              quizzes++;
            }
            page++;
          }
          console.log("퀴즈 " + quizzes + "개");
  bugDescription: 실행하면 콘솔에 아무것도 나오지 않고, 약 1초 뒤 반복이 너무 오래 실행되어 멈췄다는 안내가 나와요.
  bugMisconception: js.mc.while-auto-update
  checks:
