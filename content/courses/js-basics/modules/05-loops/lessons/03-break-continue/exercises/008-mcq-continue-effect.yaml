id: js-basics.loops.break-continue.mcq-continue-effect
type: mcq_single
difficulty: 1
concepts:
  - { id: js.loops.continue, weight: 1 }
tags: [continue]
estimatedSeconds: 45
prompt: |
  `for` 반복의 본문에서 `continue;`를 만나면 어떻게 되나요?
spec:
  options:
    - id: a
      text: 이번 회차의 남은 본문을 건너뛰고, 갱신식을 실행한 뒤 다음 회차로 넘어간다
    - id: b
      text: 반복 전체를 끝내고 반복 다음 문장으로 넘어간다
      misconception: js.mc.continue-ends-loop
      rationale: 그건 break예요. continue는 반복을 끝내지 않아요.
    - id: c
      text: 아무 일도 하지 않고 다음 줄을 계속 실행한다
      rationale: continue 아래의 본문은 이번 회차에서 실행되지 않아요.
    - id: d
      text: 같은 회차를 처음부터 다시 실행한다
      rationale: 같은 회차를 반복하지 않아요. 갱신식이 실행되어 다음 회차로 가요.
  correct: a
misconceptions: [js.mc.continue-ends-loop]
hints:
  - "`continue`는 영어로 \"계속하다\"라는 뜻이에요. 무엇을 계속할까요?"
  - 레슨의 휴무일 예제에서 3일을 건너뛴 뒤 4일, 5일은 출력됐나요?
  - "`for`에서 다음 회차로 가기 전에는 항상 갱신식이 실행돼요."
explanation: |
  정답은 **a**예요. `continue`는 이번 회차의 아래쪽 본문만 건너뛰고 다음 회차로 넘어가요. `for`에서는 다음 회차로 가기 전에 갱신식(`i++` 등)을 실행하고 조건을 검사해요.

  - b: 반복을 끝내는 것은 `break`예요.
  - c: `continue` 아래 줄은 이번 회차에서 실행되지 않아요.
  - d: 같은 회차를 다시 하지 않아요. 갱신식으로 반복 변수가 바뀐 다음 회차예요.
origin: authored
review:
