id: js-basics.loops.break-continue.mcq-continue-while-forever
type: mcq_single
difficulty: 3
concepts:
  - { id: js.loops.continue, weight: 1 }
  - { id: js.loops.infinite, weight: 0.5 }
tags: [continue, while, infinite-loop, trace]
estimatedSeconds: 110
prompt: |
  책을 읽다가 광고가 있는 3쪽은 건너뛰려는 프로그램이에요. 이 코드를 실행하면 어떻게 되나요?
code: |
  let page = 1;
  while (page <= 4) {
    if (page === 3) {
      continue; // 3쪽은 광고라서 건너뛰기
    }
    console.log(page + "쪽 읽기");
    page++;
  }
  console.log("다 읽었어요");
spec:
  options:
    - id: a
      text: "`1쪽 읽기`, `2쪽 읽기`, `4쪽 읽기`, `다 읽었어요`가 차례로 출력된다"
      misconception: js.mc.continue-while-update
      rationale: while에는 따로 실행되는 갱신 자리가 없어요. continue가 7번 줄의 page++까지 건너뛰어요.
    - id: b
      text: "`1쪽 읽기`, `2쪽 읽기`가 출력된 뒤 반복이 끝나지 않는다"
    - id: c
      text: "`1쪽 읽기`, `2쪽 읽기`, `다 읽었어요`가 차례로 출력된다"
      misconception: js.mc.continue-ends-loop
      rationale: continue는 반복을 끝내지 않아요. 이번 회차만 건너뛰고 조건 검사로 돌아가요.
    - id: d
      text: "`1쪽 읽기`부터 `4쪽 읽기`까지 네 줄과 `다 읽었어요`가 출력된다"
      rationale: page가 3일 때 continue가 6번 줄의 출력을 건너뛰므로 `3쪽 읽기`는 나올 수 없어요.
  correct: b
misconceptions: [js.mc.continue-while-update, js.mc.continue-ends-loop]
hints:
  - "`page`가 3일 때 `continue`를 만나면, 그 아래의 6번 줄과 7번 줄은 실행되나요?"
  - "`while`에서 `continue` 다음에는 바로 조건 검사로 가요. 그때 `page`는 얼마인가요?"
  - "`page`가 3에서 바뀌지 않으면 `page <= 4`와 `page === 3`은 매번 어떻게 될까요?"
explanation: |
  정답은 **b**예요.

  - `page`가 1, 2일 때는 출력하고 `page++`를 해요.
  - `page`가 3이 되면 `continue`가 6번 줄(출력)과 **7번 줄(`page++`)까지** 건너뛰고 바로 조건 검사로 가요.
  - `page`는 3 그대로라 `3 <= 4`도 참, `page === 3`도 참이에요. 다시 `continue` … 이것이 끝없이 되풀이돼요(무한 반복). ProgInOne에서는 약 1초 뒤 실행이 멈춰요.

  `while`에는 `for`처럼 자동으로 실행되는 갱신 자리가 없어요. `page++`를 `if`보다 **먼저** 두거나(이때는 검사할 값이 달라지니 조건도 함께 고쳐요), 갱신이 자동으로 실행되는 `for`로 바꿔요.

  ```js
  for (let page = 1; page <= 4; page++) {
    if (page === 3) {
      continue;
    }
    console.log(page + "쪽 읽기");
  }
  ```
