id: js-basics.loops.break-continue.parsons-password-tries
type: parsons
difficulty: 3
concepts:
  - { id: js.loops.break, weight: 1 }
  - { id: js.control.if, weight: 0.3 }
tags: [break, parsons, search]
estimatedSeconds: 150
prompt: |
  1부터 9까지 차례로 대 보며 숨겨 둔 번호를 맞히는 게임이에요. 맞히면 더 대 보지 않고 멈춰요. 코드 조각을 순서대로 배열해서 아래처럼 출력되게 하세요.

  ```text
  1번: 틀림
  2번: 틀림
  3번: 틀림
  4번: 정답!
  게임 끝
  ```
spec:
  lines:
    - { id: l1, code: "const answer = 4;" }
    - { id: l2, code: "for (let guess = 1; guess <= 9; guess++) {" }
    - { id: l3, code: "if (guess === answer) {", indent: 1 }
    - { id: l4, code: 'console.log(guess + "번: 정답!");', indent: 2 }
    - { id: l5, code: "break;", indent: 2 }
    - { id: l6, code: "}", indent: 1 }
    - { id: l7, code: 'console.log(guess + "번: 틀림");', indent: 1 }
    - { id: l8, code: "}" }
    - { id: l9, code: 'console.log("게임 끝");' }
  distractors:
    - { id: d1, code: "continue;", replaces: l5, misconception: js.mc.continue-ends-loop }
  gradeIndent: false
  checks:
    - kind: console
      id: output
      description: 1~3번은 틀림, 4번은 정답이 출력되고 더 대 보지 않은 채 "게임 끝"이 출력되어야 합니다.
      requirement: 맞히면 멈추기
      expect:
        lines: ["1번: 틀림", "2번: 틀림", "3번: 틀림", "4번: 정답!", "게임 끝"]
misconceptions: [js.mc.continue-ends-loop]
hints:
  - 반복 안에서 먼저 "정답인지"를 검사하고, 아니면 `틀림`을 출력하는 모양이에요.
  - "`정답!`을 출력한 뒤 반복을 끝내는 조각이 필요해요. `틀림`이 출력되면 안 되니까요."
  - "`게임 끝`은 반복이 끝난 뒤 한 번만 나와야 해요. 맨 마지막 `}` 다음에 두세요."
explanation: |
  정답 순서는 다음과 같아요.

  ```js
  const answer = 4;
  for (let guess = 1; guess <= 9; guess++) {
    if (guess === answer) {
      console.log(guess + "번: 정답!");
      break;
    }
    console.log(guess + "번: 틀림");
  }
  console.log("게임 끝");
  ```

  - 4번에서 `정답!`을 출력하고 `break`로 반복을 끝내요. 그래서 `4번: 틀림`도, 5~9번도 출력되지 않아요.
  - `break` 대신 `continue`를 쓰면 4번 회차의 `틀림`만 건너뛰고 5번부터 9번까지 계속 `틀림`이 출력돼요. `continue`는 반복을 끝내지 않아요.
  - `틀림` 줄을 `if` 블록 앞에 두면 `4번: 틀림`이 먼저 나와요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
