id: js-basics.loops.break-continue.impl-skip-and-stop
type: implement_function
difficulty: 4
concepts:
  - { id: js.loops.continue, weight: 1 }
  - { id: js.loops.break, weight: 0.5 }
  - { id: js.loops.accumulator-pattern, weight: 0.3 }
tags: [continue, break, count, write-code]
estimatedSeconds: 360
prompt: |
  3·6·9 게임처럼 3의 배수에서는 숫자를 말하지 않는 놀이를 해요. 1부터 차례로 숫자를 출력하되 다음 규칙을 지키는 프로그램을 작성하세요.

  - 3의 배수는 출력하지 않고 건너뛰어요(`continue`).
  - 출력한 숫자가 **7개**가 되면 그 자리에서 멈춰요(`break`).
  - 멈춘 뒤 `7개 출력 완료`를 출력해요.
  - 출력한 개수는 `said`라는 변수에 세세요.
  - 실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  1
  2
  4
  5
  7
  8
  10
  7개 출력 완료
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          let said = 0; // 지금까지 출력한 숫자의 개수

          // 1부터 차례로 출력하되, 3의 배수는 건너뛰고 7개를 출력하면 멈추세요.
  solution:
    files:
      - path: main.js
        content: |
          let said = 0; // 지금까지 출력한 숫자의 개수

          // 1부터 차례로 출력하되, 3의 배수는 건너뛰고 7개를 출력하면 멈추세요.
          for (let n = 1; n <= 100; n++) {
            if (n % 3 === 0) {
              continue;
            }
            console.log(n);
            said++;
            if (said === 7) {
              break;
            }
          }
          console.log(said + "개 출력 완료");
  checks:
    - kind: console
      id: output
      description: 3의 배수를 뺀 숫자 7개가 차례로 출력된 뒤 "7개 출력 완료"가 출력되어야 합니다.
      requirement: 건너뛰며 7개 출력
      expect:
        lines: ["1", "2", "4", "5", "7", "8", "10", "7개 출력 완료"]
    - kind: program
      id: said
      description: 끝난 뒤 said에 출력한 개수 7이 들어 있어야 합니다. 3의 배수는 세지 않아요.
      requirement: 출력한 개수 세기
      expect:
        globals: { said: { equals: 7 } }
        noError: true
      misconceptionIfFail: js.mc.continue-ends-loop
misconceptions: [js.mc.continue-ends-loop, js.mc.break-ends-program]
hints:
  - 몇까지 돌아야 할지 모르니 조건은 넉넉하게(예를 들어 100까지) 두고, 멈추는 일은 `break`에 맡겨요.
  - "본문의 순서가 중요해요: ① 3의 배수면 건너뛰기 → ② 출력하고 개수 세기 → ③ 7개가 되었으면 멈추기."
  - "`said++`는 출력한 다음에 해야 3의 배수를 세지 않아요. `if (said === 7) { break; }`는 `said++` 바로 아래에 둬요."
explanation: |
  예시 정답이에요.

  ```js
  for (let n = 1; n <= 100; n++) {
    if (n % 3 === 0) {
      continue;
    }
    console.log(n);
    said++;
    if (said === 7) {
      break;
    }
  }
  console.log(said + "개 출력 완료");
  ```

  - `continue`가 맨 앞에서 3의 배수를 걸러서, 아래의 출력과 개수 세기가 모두 건너뛰어져요.
  - `said`는 반복 바깥에서 0으로 시작하는 누적 변수예요. 출력할 때만 늘어나요.
  - 7개를 출력한 직후 `break`로 멈춰요. 세 줄(출력, 개수 세기, 멈추기 검사)의 순서가 어긋나면 개수가 틀려요. 출력 → 검사 → 개수 세기 순서면 8개가 나오고, 개수 세기 → 검사 → 출력 순서면 6개에서 멈춰요.
  - 반복이 끝난 뒤에도 `said`를 쓸 수 있도록 반복 바깥에서 만들어 두었어요.
