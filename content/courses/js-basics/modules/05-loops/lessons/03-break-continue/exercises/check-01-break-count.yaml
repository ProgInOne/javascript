id: js-basics.loops.break-continue.check-break-count
type: predict_output
difficulty: 2
usage: check
concepts:
  - { id: js.loops.break, weight: 1 }
  - { id: js.loops.accumulator-pattern, weight: 0.3 }
tags: [break, trace]
estimatedSeconds: 75
prompt: |
  실행하면 콘솔에 무엇이 출력될까요?
spec:
  lang: js
  code: |
    let count = 0;
    for (let n = 10; n <= 20; n++) {
      if (n % 4 === 0) {
        break;
      }
      count++;
    }
    console.log("센 수: " + count);
  answerKind: console
hints:
  - "`n`이 10부터 하나씩 늘 때, `n % 4 === 0`이 처음으로 참이 되는 `n`은 몇인가요?"
  - "`break`는 아래의 `count++`보다 먼저 있어요. 그 회차에는 `count`가 늘어날까요?"
  - "`break` 뒤에는 반복 다음 문장으로 가요. 마지막 줄은 실행될까요?"
explanation: |
  정답은 다음 한 줄이에요.

  ```text
  센 수: 2
  ```

  | `n` | `n % 4 === 0` | 일어나는 일 | `count` |
  |---|---|---|---|
  | 10 | 거짓 | `count++` | 1 |
  | 11 | 거짓 | `count++` | 2 |
  | 12 | 참 | `break`로 반복 끝 | 2 |

  - 12에서 `break`를 만나 그 회차의 남은 본문(`count++`)과 13~20 회차를 모두 건너뛰어요.
  - `break`는 반복만 끝내므로 반복 다음 줄의 `console.log`는 실행돼요.
origin: authored
