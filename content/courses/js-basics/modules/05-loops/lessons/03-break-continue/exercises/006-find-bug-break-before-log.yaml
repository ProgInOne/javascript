id: js-basics.loops.break-continue.find-bug-break-before-log
type: find_bug_line
difficulty: 3
concepts:
  - { id: js.loops.break, weight: 1 }
tags: [break, debugging, order]
estimatedSeconds: 110
prompt: |
  4로도 나누어떨어지고 6으로도 나누어떨어지는 가장 작은 수를 찾는 프로그램이에요. 오류는 없는데 찾은 수가 출력되지 않아요. 원인이 되는 줄을 찾고, 왜 그런지도 고르세요.
spec:
  code: |-
    for (let n = 1; n <= 50; n++) {
      if (n % 4 === 0 && n % 6 === 0) {
        break;
        console.log("찾았다: " + n);
      }
    }
    console.log("찾기 끝");
  bugLines: [3]
  acceptLines: [4]
  symptom: 찾은 수는 나오지 않고 `찾기 끝`만 나와요.
  symptomCheck:
    console: ["찾기 끝"]
  fixedCode: |-
    for (let n = 1; n <= 50; n++) {
      if (n % 4 === 0 && n % 6 === 0) {
        console.log("찾았다: " + n);
        break;
      }
    }
    console.log("찾기 끝");
  causeOptions:
    - id: c1
      text: break가 출력하는 줄보다 먼저 있어서, 수를 찾자마자 출력하기 전에 반복을 끝냈다
      correct: true
    - id: c2
      text: break가 프로그램 전체를 끝내서 찾은 수를 출력할 기회가 없었다
      misconception: js.mc.break-ends-program
    - id: c3
      text: 1부터 50 사이에는 4와 6으로 모두 나누어떨어지는 수가 없다
hints:
  - "`찾기 끝`이 나왔다는 것은 반복이 끝났다는 뜻이에요. 반복은 어떻게 끝났을까요?"
  - n이 12일 때 `if` 블록 안으로 들어가요. 블록 안의 첫 줄을 실행하면 무슨 일이 일어나나요?
  - "`break`를 만나면 그 회차의 남은 본문도 건너뛰어요. 블록 안의 두 줄 순서를 보세요."
explanation: |
  원인은 **3번 줄**의 `break`가 4번 줄의 출력보다 **먼저** 있는 것이에요. `n`이 12일 때 조건이 참이 되어 `if` 블록으로 들어가지만, 첫 줄에서 `break`를 만나 남은 본문(4번 줄)을 건너뛰고 반복이 끝나요.

  두 줄의 순서를 바꾸면 `찾았다: 12`를 출력한 뒤 멈춰요. `break`는 "할 일을 다 한 뒤" 마지막에 둬요. (4번 줄을 골라도 정답으로 인정해요.)

  - c2: `break`는 반복만 끝내요. 반복 다음의 `찾기 끝`이 출력된 것이 그 증거예요.
  - c3: 12, 24, 36, 48이 4와 6으로 모두 나누어떨어져요.
origin: authored
review:
