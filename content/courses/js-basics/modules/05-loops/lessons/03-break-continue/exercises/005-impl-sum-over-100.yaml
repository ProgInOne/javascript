id: js-basics.loops.break-continue.impl-sum-over-100
type: implement_function
difficulty: 3
concepts:
  - { id: js.loops.break, weight: 1 }
  - { id: js.loops.accumulator-pattern, weight: 0.3 }
tags: [break, accumulator, write-code]
estimatedSeconds: 270
prompt: |
  1, 2, 3, …을 차례로 더해 갈 때, 합계가 **처음으로 100을 넘는** 순간을 찾는 프로그램을 작성하세요.

  - `for` 문으로 1부터 100까지 차례로 더하다가, 합계가 100을 넘으면 그때 마지막으로 더한 수와 합계를 출력하고 `break`로 멈추세요.
  - 합계는 `sum`이라는 변수에 모으세요.
  - 실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  14까지 더하면 105
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          let sum = 0;

          // 1부터 차례로 더하다가 sum이 처음으로 100을 넘으면 출력하고 멈추세요.
  solution:
    files:
      - path: main.js
        content: |
          let sum = 0;

          // 1부터 차례로 더하다가 sum이 처음으로 100을 넘으면 출력하고 멈추세요.
          for (let i = 1; i <= 100; i++) {
            sum += i;
            if (sum > 100) {
              console.log(i + "까지 더하면 " + sum);
              break;
            }
          }
  checks:
    - kind: console
      id: output
      description: 합계가 처음으로 100을 넘었을 때 마지막으로 더한 수와 합계가 한 줄만 출력되어야 합니다.
      requirement: 처음 넘는 순간만 출력
      expect:
        lines: ["14까지 더하면 105"]
    - kind: program
      id: stopped
      description: 처음으로 100을 넘은 순간 멈춰서, 끝난 뒤 sum에 그때의 합계가 남아 있어야 합니다.
      requirement: 넘으면 멈추기
      expect:
        globals: { sum: { equals: 105 } }
        noError: true
misconceptions: [js.mc.break-ends-program]
hints:
  - 누적 패턴으로 `sum`에 `i`를 더해 가요. 더한 **다음에** 100을 넘었는지 검사해요.
  - 처음 넘은 순간에만 출력해야 해요. 출력한 뒤에 더 더하지 않으려면 무엇이 필요할까요?
  - 더하는 줄 바로 아래에 "100을 넘었는지" 검사하는 `if`를 두고, 그 블록 안에서 출력한 **다음** 반복을 끝내요.
explanation: |
  예시 정답이에요.

  ```js
  for (let i = 1; i <= 100; i++) {
    sum += i;
    if (sum > 100) {
      console.log(i + "까지 더하면 " + sum);
      break;
    }
  }
  ```

  - 1부터 13까지 더하면 91, 14를 더하면 105가 되어 처음으로 100을 넘어요.
  - `break`가 없으면 15, 16, …을 더할 때마다 계속 100을 넘으므로 출력이 여러 줄 나오고 `sum`도 5050까지 커져요.
  - 검사를 `sum += i;`보다 **먼저** 하면 한 회차 늦게 알아차려서 `15까지 더하면 105`처럼 잘못된 수가 나와요.
  - 반복이 끝나는 수를 미리 몰라서 조건에는 넉넉하게 100을 두고, 실제로 멈추는 일은 `break`가 맡아요.
