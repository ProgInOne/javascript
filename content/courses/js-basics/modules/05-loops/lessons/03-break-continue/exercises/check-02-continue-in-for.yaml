id: js-basics.loops.break-continue.check-continue-in-for
type: true_false
difficulty: 2
usage: check
concepts:
  - { id: js.loops.continue, weight: 1 }
tags: [continue, for, update]
estimatedSeconds: 60
prompt: |
  다음 코드에 대한 설명이 맞는지 골라 주세요.
code: |
  for (let i = 1; i <= 4; i++) {
    if (i === 2) {
      continue;
    }
    console.log(i);
  }
spec:
  statement: '`i`가 2일 때 `continue`가 `i++`도 건너뛰어서 `i`가 2에 멈추고, 반복이 끝나지 않는다.'
  answer: false
  misconceptionIfWrong: js.mc.continue-while-update
misconceptions: [js.mc.continue-while-update]
hints:
  - "`for`에서 `continue`를 만나면 그다음에 무엇이 실행된다고 했나요?"
  - "`for`의 갱신 `i++`는 본문 안이 아니라 괄호 안에 따로 있어요."
  - "`continue` 다음에는 갱신 → 조건 검사 → 다음 회차 순서로 이어져요. 출력되는 값을 적어 보세요."
explanation: |
  정답은 **거짓**이에요.

  `for`에서 `continue`를 만나면 이번 회차의 남은 본문만 건너뛰고, **갱신 `i++`를 실행한 뒤** 조건을 검사해요. 그래서 `i`는 3, 4로 계속 늘어나고, 콘솔에는 `1`, `3`, `4`가 나와요.

  갱신을 건너뛰어 무한 반복이 되는 것은 갱신 줄을 본문 끝에 직접 쓰는 `while`에서 생기는 일이에요. `for`는 갱신 자리가 따로 있어서 `continue`가 갱신까지 건너뛰지 않아요.
origin: authored
review:
