id: js-basics.loops.break-continue.web-smallest-divisor
type: web_task
difficulty: 4
concepts:
  - { id: js.loops.break, weight: 1 }
  - { id: js.ops.remainder, weight: 0.3 }
  - { id: js.loops.for, weight: 0.3 }
tags: [break, search, web, prime]
estimatedSeconds: 480
prompt: |
  수를 입력하면 그 수가 **소수**(1과 자기 자신으로만 나누어떨어지는 수)인지 알려 주는 화면을 완성하세요. 소수가 아니면, 나누어떨어지게 하는 수 중 **가장 작은 수**(2 이상)도 함께 보여 줘요.

  | 입력 | 화면에 보이는 글자 |
  |---|---|
  | 9 | `9 → 소수 아님, 가장 작은 약수 3` |
  | 12 | `12 → 소수 아님, 가장 작은 약수 2` |
  | 7 | `7 → 소수` |

  - 시작 코드에서 **검사하기** 버튼을 누를 때마다 `{ }` 안의 코드가 실행되도록 이미 연결해 두었어요(화면을 다루는 방법은 모듈 10에서 배워요). 입력한 수는 숫자로 바뀌어 `n`에 들어 있어요. 2 이상의 수만 입력한다고 생각하세요.
  - 표시한 자리에 `for` 문을 써서 2부터 차례로 나눠 보세요. 나누어떨어지는 수를 찾으면 `divisor`에 넣고, **더 찾지 말고** 멈추세요.
  - 나머지 코드는 그대로 두세요.
