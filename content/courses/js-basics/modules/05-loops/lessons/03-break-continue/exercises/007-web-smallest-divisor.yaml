  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>소수 검사기</title>
              <style>
                body { font-family: sans-serif; padding: 16px; }
                #result { margin-top: 12px; font-weight: bold; }
              </style>
            </head>
            <body>
              <h1>소수 검사기</h1>
              <label>
                검사할 수
                <input id="num" type="number" min="2" value="9" />
              </label>
              <button id="check" type="button">검사하기</button>
              <p id="result"></p>
              <script>
                const input = document.querySelector("#num");
                const button = document.querySelector("#check");
                const result = document.querySelector("#result");

                // 버튼을 누를 때마다 아래 { } 안의 코드가 실행돼요(모듈 10에서 배워요).
                button.addEventListener("click", () => {
                  const n = Number(input.value);
                  let divisor = 0; // n을 나누어떨어지게 하는 가장 작은 수(2 이상). 없으면 0

                  // 여기에 for 문을 써서 divisor를 찾으세요. 찾으면 바로 멈추세요.
                  for (let d = 2; d < n; d++) {
                    if (n % d === 0) {
                      divisor = d;
                      break;
                    }
                  }

                  if (divisor === 0) {
                    result.textContent = n + " → 소수";
                  } else {
                    result.textContent = n + " → 소수 아님, 가장 작은 약수 " + divisor;
                  }
                });
              </script>
            </body>
          </html>
