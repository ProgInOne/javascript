    - kind: event
      id: twelve
      description: 약수가 여러 개인 수(12)는 그중 가장 작은 약수를 보여야 합니다. 찾자마자 멈춰야 합니다.
      requirement: 가장 작은 약수
      steps:
        - { action: type, selector: "#num", value: "12" }
        - { action: click, selector: "#check" }
      expect:
        - { selector: "#result", text: { equals: "12 → 소수 아님, 가장 작은 약수 2" } }
    - kind: event
      id: two
      description: 가장 작은 소수 2도 소수라고 보여야 합니다. 자기 자신으로 나누는 것은 세지 않아요.
      requirement: 소수
      steps:
        - { action: type, selector: "#num", value: "2" }
        - { action: click, selector: "#check" }
      expect:
        - { selector: "#result", text: { equals: "2 → 소수" } }
    - kind: event
      id: square
      description: 제곱수(49)처럼 약수가 하나뿐인 수도 그 약수를 찾아야 합니다.
      requirement: 가장 작은 약수
      steps:
        - { action: type, selector: "#num", value: "49" }
        - { action: click, selector: "#check" }
      expect:
        - { selector: "#result", text: { equals: "49 → 소수 아님, 가장 작은 약수 7" } }
misconceptions: [js.mc.break-ends-program]
hints:
  - 2부터 `n`보다 작은 수까지 하나씩 나눠 보면 돼요. 나누어떨어지는지는 나머지(`%`)로 알 수 있어요.
  - 나누어떨어지는 수를 찾으면 `divisor`에 넣어요. 그런데 12는 2, 3, 4, 6으로 모두 나누어떨어져요. 계속 돌면 `divisor`에는 무엇이 남을까요?
  - 처음 찾은 수가 가장 작은 약수예요. 찾으면 `divisor`에 넣고 그 자리에서 반복을 끝내요. 반복 조건은 `n` 자신을 나누지 않도록 `n`보다 작은 수까지만 돌게 해요.
explanation: |
  예시 정답이에요.

  ```js
  for (let d = 2; d < n; d++) {
    if (n % d === 0) {
      divisor = d;
      break;
    }
  }
  ```

  - 2부터 차례로 나누므로 처음 찾은 수가 곧 **가장 작은** 약수예요. 찾자마자 `break`해야 그 값이 남아요. `break`가 없으면 12에서 2, 3, 4, 6을 차례로 덮어써서 `6`이 보여요.
  - `d < n`이라서 자기 자신(`n % n === 0`)은 검사하지 않아요. `d <= n`으로 쓰면 7도 `가장 작은 약수 7`이 되어 소수를 알아보지 못해요.
  - 아무것도 찾지 못하면 `divisor`는 시작값 0 그대로라, 아래 `if`가 소수라고 보여 줘요.
  - 반복이 끝나는 곳을 미리 정해 두고(`d < n`), 일찍 끝내는 일은 `break`가 맡는 모양은 "찾기" 반복에서 아주 흔해요.
