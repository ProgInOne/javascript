              </label>
              <button id="check" type="button">검사하기</button>
              <p id="result"></p>
              <script>
                const input = document.querySelector("#num");
                const button = document.querySelector("#check");
                const result = document.querySelector("#result");

                // 버튼을 누를 때마다 아래 { } 안의 코드가 실행돼요(모듈 10에서 배워요).
                button.addEventListener("click", () => {
                  const n = Number(input.value);
                  let divisor = 0; // n을 나누어떨어지게 하는 가장 작은 수(2 이상). 없으면 0

                  // 여기에 for 문을 써서 divisor를 찾으세요. 찾으면 바로 멈추세요.

