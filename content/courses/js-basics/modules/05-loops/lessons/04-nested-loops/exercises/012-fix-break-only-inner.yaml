id: js-basics.loops.nested-loops.fix-break-only-inner
type: fix_bug
difficulty: 4
concepts:
  - { id: js.loops.break, weight: 1 }
  - { id: js.loops.nested, weight: 0.5 }
tags: [break, nested, flag, debugging]
estimatedSeconds: 360
prompt: |
  주사위 두 개를 던졌을 때 눈의 합이 10이 되는 조합 중 **처음 찾은 하나만** 출력하는 프로그램이에요. 그런데 조합이 여러 개 출력돼요. 버그를 고쳐서 아래처럼 나오게 하세요.

  ```text
  처음 찾은 조합: 4 + 6
  찾기 끝
  ```

  - 첫 번째 주사위(`a`)와 두 번째 주사위(`b`)를 1부터 6까지 차례로 살펴보는 지금 방식은 그대로 두세요.
  - 조합을 찾으면 두 반복을 모두 멈춰야 해요.
spec:
  buggy:
    files:
      - path: main.js
        content: |
          for (let a = 1; a <= 6; a++) {
            for (let b = 1; b <= 6; b++) {
              if (a + b === 10) {
                console.log("처음 찾은 조합: " + a + " + " + b);
                break;
              }
            }
          }
          console.log("찾기 끝");
  solution:
    files:
      - path: main.js
        content: |
          let found = false;
          for (let a = 1; a <= 6; a++) {
            for (let b = 1; b <= 6; b++) {
              if (a + b === 10) {
                console.log("처음 찾은 조합: " + a + " + " + b);
                found = true;
                break;
              }
            }
            if (found) {
              break;
            }
          }
          console.log("찾기 끝");
  bugDescription: "`처음 찾은 조합: 4 + 6` 다음에 `5 + 5`, `6 + 4` 조합도 출력돼요."
  bugMisconception: js.mc.break-exits-all-loops
  checks:
    - kind: console
      id: output
      description: 처음 찾은 조합 하나만 출력하고, 두 반복을 모두 멈춘 뒤 "찾기 끝"이 출력되어야 합니다.
      requirement: 처음 하나만 찾고 멈추기
      expect:
        lines: ["처음 찾은 조합: 4 + 6", "찾기 끝"]
    - kind: program
      id: no-error
      description: 프로그램이 오류 없이 끝나야 합니다.
      requirement: 오류 없이 실행
      expect:
        noError: true
misconceptions: [js.mc.break-exits-all-loops]
hints:
  - 5번 줄의 `break`는 어느 반복을 끝내나요? 그다음에는 어디로 가나요?
  - 안쪽 반복이 끝나도 바깥 반복은 `a`를 늘려 계속 돌아요. 바깥 반복도 멈추려면 바깥에서 "찾았는지"를 알 수 있어야 해요.
  - 두 반복보다 먼저 "찾았는지"를 기억할 변수(플래그)를 `false`로 만들고, 찾으면 `true`로 바꿔요. 안쪽 반복이 끝난 바로 다음 줄(바깥 본문)에서 그 변수를 검사해 바깥 반복도 끝내요.
explanation: |
  5번 줄의 `break`는 가장 가까운 반복, 즉 **안쪽 반복만** 끝내요. 바깥 반복은 계속 돌아서 `a`가 5, 6일 때 `5 + 5`, `6 + 4`도 찾아 출력했어요.

  "찾았다"는 표시(플래그)를 두고 바깥 반복에서도 확인해요.

  ```js
  let found = false;
  for (let a = 1; a <= 6; a++) {
    for (let b = 1; b <= 6; b++) {
      if (a + b === 10) {
        console.log("처음 찾은 조합: " + a + " + " + b);
        found = true;
        break;    // 안쪽 반복 끝
      }
    }
    if (found) {
      break;      // 바깥 반복도 끝
    }
  }
  ```

  - `found`는 두 반복보다 먼저 만들어야 바깥 반복에서도 쓸 수 있어요.
  - 바깥 반복의 조건에 `!found`를 함께 쓰는 방법(`a <= 6 && !found`)도 있어요. 이때는 안쪽 `break` 뒤 바깥 조건 검사에서 반복이 끝나요.
