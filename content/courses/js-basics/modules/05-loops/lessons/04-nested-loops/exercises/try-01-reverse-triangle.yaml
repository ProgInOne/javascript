id: js-basics.loops.nested-loops.try-reverse-triangle
type: implement_function
difficulty: 3
usage: try
concepts:
  - { id: js.loops.nested, weight: 1 }
  - { id: js.loops.accumulator-pattern, weight: 0.3 }
tags: [nested, triangle, write-code]
estimatedSeconds: 300
prompt: |
  별(`*`)로 **거꾸로 선 삼각형**을 만들어 보세요. 첫 줄에 별 4개, 그다음 줄부터 하나씩 줄어들어요.

  ```text
  ****
  ***
  **
  *
  ```

  바깥 반복은 줄, 안쪽 반복은 그 줄에 붙일 별을 맡는 **중첩 반복**으로 쓰세요. 줄마다 별을 문자열에 이어 붙인 다음 한 번에 출력해요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          // 바깥 반복: 줄을 하나씩 만들어요. (모두 4줄)
          //   1. 줄마다 빈 문자열에서 시작하는 변수 stars를 만드세요.
          //   2. 안쪽 반복: 이 줄에 필요한 개수만큼 stars에 "*"를 이어 붙이세요.
          //      첫 줄은 4개, 다음 줄은 3개, … 바깥 반복 변수로 개수를 정해 보세요.
          //   3. stars를 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          for (let line = 4; line >= 1; line--) {
            let stars = "";
            for (let k = 1; k <= line; k++) {
              stars += "*";
            }
            console.log(stars);
          }
  checks:
    - kind: console
      id: first-line
      description: 첫 줄에 별 4개 `****`가 출력되어야 합니다.
      requirement: 첫 줄 별 4개
      expect:
        lines: ["****"]
        mode: contains
    - kind: console
      id: shape
      description: "별이 4개, 3개, 2개, 1개인 네 줄이 차례로 출력되어야 합니다. 모든 줄이 같다면 안쪽 반복의 조건에 바깥 반복 변수를 썼는지, 별이 계속 길어진다면 stars를 줄마다 새로 시작했는지 확인하세요."
      requirement: 거꾸로 선 삼각형
      expect:
        lines: ["****", "***", "**", "*"]
misconceptions: [js.mc.accumulator-reset-in-loop]
hints:
  - 줄마다 별의 개수는 4, 3, 2, 1이에요. 바깥 반복 변수가 이 값을 그대로 거치게 하면 편해요. 4에서 시작해 1씩 줄이는 `for`를 떠올려 보세요.
  - "`let stars = \"\";`는 바깥 반복의 본문 맨 앞에 두어야 줄마다 새로 시작해요. 안쪽 반복은 `k`가 1부터 바깥 반복 변수까지 돌게 해요."
  - "`for (let line = 4; line >= 1; line--)` 안에 `let stars = \"\";`, 안쪽 `for (let k = 1; k <= line; k++) { stars += \"*\"; }`, 그리고 `console.log(stars);`를 차례로 써요."
explanation: |
  예시 답안은 다음과 같아요.

  ```js
  for (let line = 4; line >= 1; line--) {
    let stars = "";
    for (let k = 1; k <= line; k++) {
      stars += "*";
    }
    console.log(stars);
  }
  ```

  | `line` | 안쪽 반복에서 `k` | `stars` |
  |---|---|---|
  | 4 | 1, 2, 3, 4 | `****` |
  | 3 | 1, 2, 3 | `***` |
  | 2 | 1, 2 | `**` |
  | 1 | 1 | `*` |

  - 안쪽 조건 `k <= line`에 바깥 반복 변수를 써서 줄마다 별의 개수가 달라져요.
  - `stars`는 바깥 본문에서 만들어 줄마다 빈 문자열부터 다시 모아요. 바깥 반복 앞에서 만들면 별이 계속 길어져요.
  - 바깥 반복을 1부터 4까지 올리고 안쪽 조건을 `k <= 5 - line`으로 써도 같은 모양이 나와요.
origin: authored
review:
