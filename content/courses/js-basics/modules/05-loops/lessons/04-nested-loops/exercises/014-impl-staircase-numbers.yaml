id: js-basics.loops.nested-loops.impl-staircase-numbers
type: implement_function
difficulty: 3
concepts:
  - { id: js.loops.nested, weight: 1 }
  - { id: js.loops.accumulator-pattern, weight: 0.3 }
tags: [nested, triangle, write-code]
estimatedSeconds: 300
prompt: |
  숫자로 계단을 만드는 프로그램을 작성하세요. n번째 줄에는 숫자 n을 n개 이어 붙여요.

  - 바깥 반복은 줄(1~5), 안쪽 반복은 한 줄에 붙일 숫자를 맡는 **중첩 반복**으로 쓰세요.
  - 실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  1
  22
  333
  4444
  55555
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          // 중첩 반복으로 숫자 계단을 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          // 중첩 반복으로 숫자 계단을 출력하세요.
          for (let line = 1; line <= 5; line++) {
            let text = "";
            for (let k = 1; k <= line; k++) {
              text += line;
            }
            console.log(text);
          }
  checks:
    - kind: console
      id: output
      description: n번째 줄에 숫자 n이 n개 이어 붙은 다섯 줄이 출력되어야 합니다.
      requirement: 숫자 계단
      expect:
        lines: ["1", "22", "333", "4444", "55555"]
misconceptions: [js.mc.inner-var-not-reset]
hints:
  - 레슨의 세 번째 예제(`1`, `12`, `123`, …)와 비슷해요. 다른 점은 이어 붙이는 숫자가 무엇인지예요.
  - 줄마다 빈 문자열에서 시작하는 변수에 숫자를 이어 붙여요. 안쪽 반복은 줄 번호만큼 돌아요.
  - "안쪽 반복에서 붙일 값은 안쪽 반복 변수(`k`)가 아니라 바깥 반복 변수(`line`)예요. `text += line;`"
explanation: |
  예시 정답이에요.

  ```js
  for (let line = 1; line <= 5; line++) {
    let text = "";
    for (let k = 1; k <= line; k++) {
      text += line;
    }
    console.log(text);
  }
  ```

  - 안쪽 조건 `k <= line`으로 줄마다 `line`번 반복해요.
  - 붙이는 값은 `line`이에요. `text += k`로 쓰면 `1`, `12`, `123`처럼 나와요. 안쪽 반복 변수는 "몇 번째 칸인지", 바깥 반복 변수는 "몇 번째 줄인지"를 뜻해요.
  - `text`가 빈 문자열 `""`에서 시작하므로 `text += line`은 숫자를 더하지 않고 글자로 이어 붙여요. `let text = 0;`으로 시작하면 숫자 덧셈이 되어 `1`, `4`, `9`, …가 나와요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
