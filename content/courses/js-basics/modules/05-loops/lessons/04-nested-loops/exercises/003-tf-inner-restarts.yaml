id: js-basics.loops.nested-loops.tf-inner-restarts
type: true_false
difficulty: 2
concepts:
  - { id: js.loops.nested, weight: 1 }
tags: [nested, inner-loop]
estimatedSeconds: 60
prompt: |
  다음 설명이 맞는지 고르고, 그렇게 판단한 이유도 고르세요.
spec:
  statement: "`for` 안에 `for`가 있으면, 바깥 반복이 한 번 돌 때마다 안쪽 `for`의 반복 변수는 처음 값부터 다시 시작한다."
  answer: true
  misconceptionIfWrong: js.mc.inner-var-not-reset
  requireReason: true
  reasons:
    - id: r1
      text: 안쪽 for 문 전체가 바깥 반복의 본문이라서, 바깥 회차마다 안쪽 for의 초기화부터 다시 실행된다
      correct: true
    - id: r2
      text: 바깥 반복의 갱신식이 실행될 때 안쪽 반복 변수도 함께 0으로 바뀐다
    - id: r3
      text: 안쪽 반복 변수는 첫 바깥 회차가 끝난 값에 머물러 있지만, JavaScript가 알아서 처음 값으로 되돌려 준다
      misconception: js.mc.inner-var-not-reset
hints:
  - 레슨의 첫 번째 예제에서 2열이 시작될 때 `seat`는 몇이었나요?
  - 바깥 반복의 본문에는 어떤 문장들이 있나요? 안쪽 `for` 문의 첫 줄도 본문의 한 문장이에요.
  - 본문은 회차마다 처음부터 실행돼요. 안쪽 `for` 문의 초기화(`let j = 1`)도 마찬가지예요.
explanation: |
  정답은 **참**, 이유는 **안쪽 for 문 전체가 바깥 반복의 본문이라서, 바깥 회차마다 안쪽 for의 초기화부터 다시 실행된다**예요.

  ```js
  for (let i = 1; i <= 2; i++) {
    for (let j = 1; j <= 3; j++) { // 바깥 회차마다 let j = 1부터
      console.log(i, j);
    }
  }
  ```

  - r2: 바깥 반복의 갱신식(`i++`)은 `i`만 바꿔요. `j`를 되돌리는 것은 안쪽 `for`의 초기화예요.
  - r3: JavaScript가 몰래 되돌려 주는 것이 아니라, 초기화 문장이 다시 실행되는 거예요. 그래서 안쪽 반복의 변수를 바깥 반복보다 먼저 만들어 두면(`while` 등) 다시 시작되지 않아요.
