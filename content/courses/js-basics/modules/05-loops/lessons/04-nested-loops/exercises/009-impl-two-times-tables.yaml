id: js-basics.loops.nested-loops.impl-two-times-tables
type: implement_function
difficulty: 3
concepts:
  - { id: js.loops.nested, weight: 1 }
  - { id: js.loops.loop-variable, weight: 0.3 }
tags: [nested, times-table, write-code]
estimatedSeconds: 300
prompt: |
  구구단 2단과 3단을 출력하는 프로그램을 작성하세요.

  - 바깥 반복은 단(2, 3), 안쪽 반복은 곱하는 수(1~9)를 맡는 **중첩 반복**으로 쓰세요.
  - 각 단을 시작할 때 `[2단]`처럼 제목을 한 줄 출력하세요.
  - 실행하면 콘솔에 모두 20줄이 아래 모양으로 나와야 해요.

  ```text
  [2단]
  2 x 1 = 2
  2 x 2 = 4
  …
  2 x 9 = 18
  [3단]
  3 x 1 = 3
  …
  3 x 9 = 27
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          // 중첩 반복으로 구구단 2단과 3단을 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          // 중첩 반복으로 구구단 2단과 3단을 출력하세요.
          for (let dan = 2; dan <= 3; dan++) {
            console.log("[" + dan + "단]");
            for (let i = 1; i <= 9; i++) {
              console.log(dan + " x " + i + " = " + dan * i);
            }
          }
  checks:
    - kind: console
      id: output
      description: 2단 제목과 2 x 1부터 2 x 9까지, 3단 제목과 3 x 1부터 3 x 9까지가 차례로 출력되어야 합니다.
      requirement: 2단과 3단 출력
      expect:
        lines:
          - "[2단]"
          - 2 x 1 = 2
          - 2 x 2 = 4
          - 2 x 3 = 6
          - 2 x 4 = 8
          - 2 x 5 = 10
          - 2 x 6 = 12
          - 2 x 7 = 14
          - 2 x 8 = 16
          - 2 x 9 = 18
          - "[3단]"
          - 3 x 1 = 3
          - 3 x 2 = 6
          - 3 x 3 = 9
          - 3 x 4 = 12
          - 3 x 5 = 15
          - 3 x 6 = 18
          - 3 x 7 = 21
          - 3 x 8 = 24
          - 3 x 9 = 27
      misconceptionIfFail: js.mc.inner-var-not-reset
misconceptions: [js.mc.inner-var-not-reset]
hints:
  - 먼저 2단 하나만 `for`로 출력해 보세요. 그다음 그 반복을 "단마다" 반복하는 바깥 반복으로 감싸요.
  - 제목 `[2단]`은 단마다 한 번만 나와야 해요. 바깥 반복의 본문에서, 안쪽 반복 **앞**에 써요.
  - "바깥은 `for (let dan = 2; dan <= 3; dan++)`, 안쪽은 `for (let i = 1; i <= 9; i++)`이고, 안쪽에서 `dan + \" x \" + i + \" = \" + dan * i`를 출력해요."
explanation: |
  예시 정답이에요.

  ```js
  for (let dan = 2; dan <= 3; dan++) {
    console.log("[" + dan + "단]");
    for (let i = 1; i <= 9; i++) {
      console.log(dan + " x " + i + " = " + dan * i);
    }
  }
  ```

  - 바깥 반복이 단을, 안쪽 반복이 곱하는 수를 맡아요. 안쪽 반복은 단마다 `i = 1`부터 다시 시작해요.
  - 제목은 바깥 본문에서 안쪽 반복 앞에 있어서 단마다 한 번씩 나와요. 안쪽 반복 안에 두면 줄마다 제목이 붙어요.
  - 바깥 조건의 `3`을 `9`로 바꾸기만 하면 구구단 전체(8단 × 9줄 + 제목 8줄)가 나와요. 반복을 겹치면 코드는 그대로인데 할 수 있는 일이 크게 늘어요.
origin: authored
review:
