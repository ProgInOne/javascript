id: js-basics.loops.nested-loops.find-bug-inner-counter
type: find_bug_line
difficulty: 3
concepts:
  - { id: js.loops.nested, weight: 1 }
  - { id: js.loops.while, weight: 0.3 }
tags: [nested, while, debugging]
estimatedSeconds: 130
prompt: |
  학생 3명이 문제를 2개씩 푸는 과정을 출력하는 프로그램이에요. 오류는 없는데 1번 학생만 문제를 풀어요. 원인이 되는 줄을 찾고, 왜 그런지도 고르세요.
spec:
  code: |-
    let problem = 1;
    for (let student = 1; student <= 3; student++) {
      while (problem <= 2) {
        console.log(student + "번 학생: " + problem + "번 문제 풀기");
        problem++;
      }
    }
    console.log("수업 끝");
  bugLines: [1]
  acceptLines: [3]
  symptom: 1번 학생이 문제 2개를 푼 뒤, 2번·3번 학생은 아무 문제도 풀지 않고 `수업 끝`이 나와요.
  symptomCheck:
    console: ["1번 학생: 1번 문제 풀기", "1번 학생: 2번 문제 풀기", "수업 끝"]
  fixedCode: |-
    for (let student = 1; student <= 3; student++) {
      for (let problem = 1; problem <= 2; problem++) {
        console.log(student + "번 학생: " + problem + "번 문제 풀기");
      }
    }
    console.log("수업 끝");
  causeOptions:
    - id: c1
      text: problem을 바깥 반복보다 먼저 한 번만 만들어서, 2번 학생 차례에도 problem이 3인 채로 남아 안쪽 반복이 돌지 않았다
      correct: true
    - id: c2
      text: 바깥 for 반복이 한 번만 돌고 끝났다
    - id: c3
      text: 안쪽 while의 problem++가 바깥 반복의 student까지 함께 늘렸다
hints:
  - 바깥 반복은 3번 모두 돌았을까요? `수업 끝`이 나오기 전에 무슨 일이 있었는지 생각해 보세요.
  - 1번 학생 차례가 끝났을 때 `problem`은 얼마인가요? 2번 학생 차례에 그 값은 다시 1이 되나요?
  - 안쪽 반복의 시작값을 정하는 줄이 바깥 반복보다 바깥에 있어요. 바깥 회차마다 다시 실행되는 곳이 아니에요.
explanation: |
  원인은 **1번 줄**이에요. `let problem = 1;`이 바깥 반복보다 먼저 있어서 프로그램 전체에서 딱 한 번만 실행돼요.

  - 1번 학생: `problem`이 1, 2일 때 풀고 3이 되어 안쪽 반복이 끝나요.
  - 2번 학생: `problem`이 여전히 3이라 `3 <= 2`가 거짓이에요. 안쪽 `while`이 한 번도 돌지 않아요. 3번 학생도 마찬가지예요.

  바깥 반복은 3번 모두 돌았지만, 안쪽 반복이 처음부터 다시 시작할 수 없었어요. 안쪽 반복을 `for (let problem = 1; ...)`로 바꾸면(3번 줄) 바깥 회차마다 초기화부터 다시 실행돼요. `let problem = 1;`을 바깥 반복 본문 첫 줄로 옮겨도 돼요. 그래서 3번 줄을 골라도 정답으로 인정해요.

  - c2: 바깥 반복은 3번 돌았어요. 안쪽 반복이 아무것도 출력하지 않았을 뿐이에요.
  - c3: `problem++`는 `problem`만 바꿔요.
origin: authored
