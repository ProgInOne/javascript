                document.querySelector("#make").addEventListener("click", () => {
                  const floors = Number(floorSelect.value);
                  const rooms = Number(roomSelect.value);
                  let text = "";

                  // 여기에 중첩 반복을 써서 text에 안내판 글자를 이어 붙이세요.

