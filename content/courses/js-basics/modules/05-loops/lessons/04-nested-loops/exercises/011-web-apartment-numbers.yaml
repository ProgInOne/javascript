id: js-basics.loops.nested-loops.web-apartment-numbers
type: web_task
difficulty: 4
concepts:
  - { id: js.loops.nested, weight: 1 }
  - { id: js.loops.accumulator-pattern, weight: 0.5 }
tags: [nested, accumulator, string, web]
estimatedSeconds: 480
prompt: |
  건물 관리 화면에서 층 수와 층마다 집 수를 고르면, 모든 집의 호수 안내판을 만들어 주는 기능을 완성하세요. 호수는 `층 × 100 + 집 번호`예요(2층 3번째 집은 203호).

  층 수 2, 층마다 집 3을 고르고 **만들기**를 누르면 화면에 아래처럼 보여야 해요.

  ```text
  1층: 101 102 103
  2층: 201 202 203
  ```

  - 시작 코드에서 **만들기** 버튼을 누를 때마다 `{ }` 안의 코드가 실행되도록 이미 연결해 두었어요(화면을 다루는 방법은 모듈 10에서 배워요). 고른 층 수는 `floors`, 층마다 집 수는 `rooms`에 숫자로 들어 있어요.
  - 표시한 자리에 **중첩 반복**을 써서 `text`에 안내판 글자를 이어 붙이세요. 층마다 `1층:`으로 시작하고, 호수 앞에는 빈칸을 하나씩 두고, 층이 끝나면 줄바꿈(`"\n"`)을 붙여요.
  - 나머지 코드는 그대로 두세요.
spec:
  focus: dom
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
