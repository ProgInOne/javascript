            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>호수 안내판 만들기</title>
              <style>
                body { font-family: sans-serif; padding: 16px; }
                label { margin-right: 12px; }
                #board { margin-top: 12px; padding: 12px; background: #f3f4f6; font-size: 18px; }
              </style>
            </head>
            <body>
              <h1>호수 안내판 만들기</h1>
              <label>
                층 수
                <select id="floors">
                  <option value="1">1</option>
                  <option value="2" selected>2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                </select>
              </label>
              <label>
                층마다 집
                <select id="rooms">
                  <option value="2">2</option>
                  <option value="3" selected>3</option>
                  <option value="4">4</option>
                </select>
              </label>
              <button id="make" type="button">만들기</button>
              <pre id="board"></pre>
              <script>
                const floorSelect = document.querySelector("#floors");
                const roomSelect = document.querySelector("#rooms");
                const board = document.querySelector("#board");

                // 버튼을 누를 때마다 아래 { } 안의 코드가 실행돼요(모듈 10에서 배워요).
                document.querySelector("#make").addEventListener("click", () => {
                  const floors = Number(floorSelect.value);
                  const rooms = Number(roomSelect.value);
                  let text = "";

                  // 여기에 중첩 반복을 써서 text에 안내판 글자를 이어 붙이세요.
                  for (let floor = 1; floor <= floors; floor++) {
                    text += floor + "층:";
                    for (let room = 1; room <= rooms; room++) {
                      text += " " + (floor * 100 + room);
                    }
                    text += "\n";
                  }

                  board.textContent = text;
                });
              </script>
            </body>
          </html>
  checks:
    - kind: event
      id: two-by-three
      description: 층 수 2, 층마다 집 3이면 1층과 2층의 호수 세 개씩이 보여야 합니다.
      requirement: 층마다 호수 출력
      visible: true
      steps:
        - { action: change, selector: "#floors", value: "2" }
        - { action: change, selector: "#rooms", value: "3" }
        - { action: click, selector: "#make" }
      expect:
        - { selector: "#board", text: { equals: "1층: 101 102 103 2층: 201 202 203" } }
    - kind: event
      id: three-by-two
      description: 층 수 3, 층마다 집 2이면 1층부터 3층까지 호수 두 개씩이 보여야 합니다.
      requirement: 고른 수만큼 반복
      visible: true
      steps:
        - { action: change, selector: "#floors", value: "3" }
        - { action: change, selector: "#rooms", value: "2" }
        - { action: click, selector: "#make" }
      expect:
        - { selector: "#board", text: { equals: "1층: 101 102 2층: 201 202 3층: 301 302" } }
      misconceptionIfFail: js.mc.inner-var-not-reset
    - kind: event
      id: one-by-four
      description: 층이 하나뿐이어도(1층, 집 4) 호수 네 개가 모두 보여야 합니다.
      requirement: 고른 수만큼 반복
      steps:
        - { action: change, selector: "#floors", value: "1" }
        - { action: change, selector: "#rooms", value: "4" }
        - { action: click, selector: "#make" }
      expect:
        - { selector: "#board", text: { equals: "1층: 101 102 103 104" } }
    - kind: event
      id: four-by-four
      description: 가장 큰 건물(4층, 집 4)에서는 마지막 줄이 401부터 404까지여야 합니다.
      requirement: 고른 수만큼 반복
      steps:
        - { action: change, selector: "#floors", value: "4" }
        - { action: change, selector: "#rooms", value: "4" }
        - { action: click, selector: "#make" }
      expect:
        - { selector: "#board", text: { includes: "4층: 401 402 403 404" } }
misconceptions: [js.mc.inner-var-not-reset, js.mc.nested-count-additive]
hints:
  - 바깥 반복은 층(1부터 `floors`까지), 안쪽 반복은 집(1부터 `rooms`까지)이에요.
  - "층마다 할 일의 순서: ① `text`에 `\"1층:\"` 같은 제목 붙이기 → ② 안쪽 반복으로 호수 붙이기 → ③ 줄바꿈 붙이기."
  - "안쪽 반복에서는 `text += \" \" + (floor * 100 + room);`처럼 괄호로 호수를 먼저 계산해요. 괄호가 없으면 문자열 뒤에 숫자가 따로 이어 붙어요."
explanation: |
  예시 정답이에요.

  ```js
  for (let floor = 1; floor <= floors; floor++) {
    text += floor + "층:";
    for (let room = 1; room <= rooms; room++) {
      text += " " + (floor * 100 + room);
    }
    text += "\n";
  }
  ```

  - 바깥 반복은 층(줄), 안쪽 반복은 집(칸)이에요. 안쪽 반복은 층마다 `room = 1`부터 다시 시작해요.
  - 반복 횟수를 고정된 숫자가 아니라 고른 값 `floors`, `rooms`로 정해서, 어떤 크기의 건물이든 같은 코드로 만들어요.
  - `" " + floor * 100 + room`처럼 괄호 없이 쓰면 `" " + 100`이 먼저 문자열 `" 100"`이 되고 뒤에 `1`이 이어 붙어 `" 1001"`이 돼요. 모듈 3에서 본 문자열 연결 순서예요.
  - `text`는 바깥 반복보다 먼저(버튼을 누를 때마다) 빈 문자열에서 시작해서, 모든 층의 글자를 이어서 모아요. 층이 바뀌어도 다시 비우지 않아요.
origin: authored
