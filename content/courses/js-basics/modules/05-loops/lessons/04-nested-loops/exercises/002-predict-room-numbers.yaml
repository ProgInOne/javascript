id: js-basics.loops.nested-loops.predict-room-numbers
type: predict_output
difficulty: 2
concepts:
  - { id: js.loops.nested, weight: 1 }
tags: [nested, trace, order]
estimatedSeconds: 90
prompt: |
  호텔 방 번호를 출력하는 프로그램이에요. 실행하면 콘솔에 무엇이 어떤 순서로 출력될까요?
spec:
  lang: js
  code: |
    for (let floor = 1; floor <= 2; floor++) {
      for (let room = 1; room <= 3; room++) {
        console.log(floor * 100 + room);
      }
    }
  answerKind: console
  misconceptionByAnswer:
    "101\n102\n103": js.mc.inner-var-not-reset
    "101\n102\n103\n201": js.mc.inner-var-not-reset
hints:
  - 바깥 반복 변수 `floor`가 1일 때, 안쪽 반복의 `room`은 어떤 값을 거치나요?
  - 안쪽 반복이 끝나면 `floor`가 2가 되고, 안쪽 반복이 `let room = 1`부터 다시 시작해요.
  - "`floor * 100 + room`은 `floor`가 2, `room`이 3이면 203이에요."
explanation: |
  출력은 다음과 같아요.

  ```text
  101
  102
  103
  201
  202
  203
  ```

  | `floor` | 안쪽 반복의 `room` | 출력 |
  |---|---|---|
  | 1 | 1, 2, 3 | 101, 102, 103 |
  | 2 | 1, 2, 3 (다시 1부터) | 201, 202, 203 |

  바깥 회차 하나 동안 안쪽 반복이 끝까지 돌고 나서야 다음 층으로 넘어가요. 그래서 101, 201, 102, …처럼 번갈아 나오지 않아요. 2층이 시작될 때 안쪽 `for`는 초기화부터 다시 실행되어 `room`이 1로 돌아와요.
origin: authored
