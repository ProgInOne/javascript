id: js-basics.loops.while.multi-which-infinite
type: mcq_multi
difficulty: 3
concepts:
  - { id: js.loops.infinite, weight: 1 }
  - { id: js.loops.while, weight: 0.3 }
tags: [infinite-loop, while, trace]
estimatedSeconds: 120
prompt: |
  다음 중 **끝나지 않는** 반복(무한 반복)을 모두 고르세요.
spec:
  options:
    - id: a
      text: "`let i = 0; while (i < 5) { i--; }`"
    - id: b
      text: "`let i = 10; while (i > 0) { i -= 3; }`"
      rationale: i가 10 → 7 → 4 → 1 → -2로 줄다가 -2에서 `i > 0`이 거짓이 되어 끝나요. 0을 정확히 지나지 않아도 조건이 거짓이 되면 돼요.
    - id: c
      text: "`let i = 0; while (i !== 5) { i += 2; }`"
      missedMisconception: js.mc.while-auto-update
    - id: d
      text: "`let i = 0; while (i < 5) { console.log(i); }`"
      missedMisconception: js.mc.while-auto-update
    - id: e
      text: "`let i = 1; while (i < 100) { i *= 2; }`"
      rationale: i가 1, 2, 4, …, 64, 128로 커지다가 128에서 `i < 100`이 거짓이 되어 끝나요.
  correct: [a, c, d]
misconceptions: [js.mc.while-auto-update]
hints:
  - 반복마다 `i`가 어떻게 바뀌는지 처음 몇 회차만 적어 보세요.
  - "`i`가 바뀌는 방향이 조건을 거짓으로 만드는 쪽인가요? 그리고 `!==`처럼 딱 한 값에서만 거짓이 되는 조건은, 그 값을 정확히 지나가나요?"
  - 본문에서 `i`를 아예 바꾸지 않는 반복도 있어요. `console.log`는 값을 보여 주기만 해요.
explanation: |
  정답은 **a, c, d**예요.

  - a: `i`가 0, -1, -2, …로 계속 작아져요. `i < 5`는 영원히 참이에요. 반대 방향으로 바꾼 경우예요.
  - c: `i`가 0, 2, 4, 6, …으로 늘어요. 5가 되는 순간이 없어서 `i !== 5`는 영원히 참이에요. 목표값을 건너뛴 경우예요. `i < 5`로 쓰면 끝나요.
  - d: 본문이 `i`를 바꾸지 않아요. `console.log(i)`는 0을 보여 주기만 하므로 0이 끝없이 출력돼요.
  - b (끝남): 10 → 7 → 4 → 1 → -2. `-2 > 0`이 거짓이라 끝나요.
  - e (끝남): 1 → 2 → 4 → … → 64 → 128. `128 < 100`이 거짓이라 끝나요.

  반복이 끝나는지 확인하려면 **조건 변수가 바뀌는지, 그 방향이 맞는지, 목표값을 건너뛰지 않는지** 세 가지를 봐요.
