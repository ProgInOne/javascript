id: js-basics.loops.while.predict-change-mid-body
type: predict_output
difficulty: 3
concepts:
  - { id: js.loops.while, weight: 1 }
tags: [while, trace, condition]
estimatedSeconds: 100
prompt: |
  게임 캐릭터가 포션을 마시는 프로그램이에요. 실행하면 콘솔에 무엇이 출력될까요?
spec:
  lang: js
  code: |
    let hp = 70;
    while (hp < 100) {
      hp += 20;
      console.log("포션! 체력: " + hp);
    }
    console.log("최종 체력: " + hp);
  answerKind: console
  misconceptionByAnswer:
    "포션! 체력: 90\n최종 체력: 110": js.mc.while-checks-mid-body
hints:
  - 회차마다 3번 줄을 실행한 뒤의 `hp`를 적어 보세요.
  - 2회차의 3번 줄에서 `hp`가 110이 되면 조건 `hp < 100`은 거짓이 돼요. 그래도 4번 줄은 실행될까요?
  - 조건은 회차를 시작할 때만 검사해요. 110이 된 뒤의 `console.log`도 실행되고, 다음 검사에서 반복이 끝나요.
explanation: |
  출력은 다음과 같아요.

  ```text
  포션! 체력: 90
  포션! 체력: 110
  최종 체력: 110
  ```

  | 회차 | 검사할 때 `hp` | 3번 줄 뒤 `hp` | 출력 |
  |---|---|---|---|
  | 1 | 70 → 참 | 90 | `포션! 체력: 90` |
  | 2 | 90 → 참 | 110 | `포션! 체력: 110` |
  | — | 110 → 거짓 | | (반복 끝) |

  2회차에서 `hp`가 110이 되어 조건이 거짓이 됐지만, 그 회차의 4번 줄은 실행돼요. 조건은 다음 회차를 시작하기 전에야 다시 검사해요. 그래서 체력이 100을 넘은 110으로 끝나요.
