id: js-basics.loops.while.check-do-while-once
type: true_false
difficulty: 2
usage: check
concepts:
  - { id: js.loops.do-while, weight: 1 }
tags: [do-while]
estimatedSeconds: 50
prompt: |
  다음 코드에 대한 설명이 맞는지 골라 주세요.
code: |
  let tries = 3;
  do {
    console.log("비밀번호를 입력하세요");
    tries++;
  } while (tries < 3);
spec:
  statement: 조건 `tries < 3`이 처음부터 거짓이므로, 이 코드는 콘솔에 아무것도 출력하지 않는다.
  answer: false
  misconceptionIfWrong: js.mc.do-while-checks-first
misconceptions: [js.mc.do-while-checks-first]
hints:
  - 이 반복에서 조건은 코드의 어디에 적혀 있나요? 본문보다 위인가요, 아래인가요?
  - do...while은 `do` 블록을 먼저 실행하고, 맨 끝에서 조건을 검사해요.
  - 조건이 처음부터 거짓이어도 본문은 한 번 실행돼요. 그다음 `4 < 3`을 검사하고 끝나요.
explanation: |
  정답은 **거짓**이에요.

  `do...while`은 본문을 먼저 실행하고 맨 끝의 `while (tries < 3)`에서 조건을 검사해요. 그래서 `비밀번호를 입력하세요`가 한 번 출력되고, `tries`가 4가 된 뒤 `4 < 3`이 거짓이라 반복이 끝나요.

  같은 조건을 `while (tries < 3) { ... }`로 썼다면 본문은 한 번도 실행되지 않았을 거예요. 조건을 검사하는 시점이 다르기 때문이에요.
origin: authored
