id: js-basics.start.first-program.predict-statement-order
type: predict_output
difficulty: 1
concepts:
  - { id: js.basics.statements, weight: 1 }
tags: [statements, order]
estimatedSeconds: 45
prompt: |
  다음 프로그램을 실행하면 콘솔에 무엇이 출력되나요? 한 줄에 하나씩 적어 주세요.
spec:
  lang: js
  code: |
    console.log("일어나기");
    console.log("세수하기");
    console.log("아침 먹기");
  answerKind: console
hints:
  - 프로그램은 어느 쪽부터 문장을 실행할까요?
  - 문장은 맨 위부터 한 번에 하나씩 실행되고, console.log 한 번이 콘솔의 한 줄이 돼요.
  - 코드에 적힌 순서와 출력 순서를 비교해 보세요. 따옴표는 출력되지 않아요.
explanation: |
  정답은 다음 세 줄이에요.

  ```text
  일어나기
  세수하기
  아침 먹기
  ```

  프로그램은 문장을 위에서 아래로 하나씩 실행해요. console.log 한 번이 콘솔의 한 줄이 되므로, 코드에 적힌 순서 그대로 세 줄이 출력돼요. 글자를 감싼 따옴표는 출력되지 않아요.
origin: authored
review:
