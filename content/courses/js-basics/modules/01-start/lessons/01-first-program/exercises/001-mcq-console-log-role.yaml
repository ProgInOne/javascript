id: js-basics.start.first-program.mcq-console-log-role
type: mcq_single
difficulty: 1
concepts:
  - { id: js.basics.console-log, weight: 1 }
tags: [console-log]
estimatedSeconds: 40
prompt: |
  `console.log("완료");`를 실행하면 어떤 일이 일어나나요?
spec:
  options:
    - id: a
      text: 콘솔에 `완료`라는 글자가 보인다
    - id: b
      text: "`완료`라는 값이 저장되어, 다음 줄에서 다시 꺼내 쓸 수 있다"
      misconception: js.mc.log-is-return
      rationale: console.log는 보여 주기만 하고 값을 저장하지 않아요. 저장은 변수가 하는 일이에요.
    - id: c
      text: 콘솔에 따옴표까지 붙은 `"완료"`가 보인다
      misconception: js.mc.log-prints-quotes
      rationale: 따옴표는 글자의 시작과 끝을 표시하는 기호예요. 콘솔에는 따옴표 안의 글자만 나와요.
    - id: d
      text: 프로그램이 `완료` 상태가 되어 실행을 끝낸다
      rationale: console.log는 출력만 할 뿐이에요. 다음 문장이 있으면 계속 실행돼요.
  correct: a
misconceptions: [js.mc.log-is-return, js.mc.log-prints-quotes]
hints:
  - "`log`는 \"기록하다\"라는 뜻이에요. 어디에 기록할까요?"
  - console.log는 사람이 볼 수 있게 보여 주는 일만 해요. 따옴표는 출력될까요?
  - 따옴표는 글자의 범위를 표시할 뿐이고, 출력은 저장과 다른 일이에요.
explanation: |
  정답은 **콘솔에 `완료`라는 글자가 보인다**예요.

  `console.log(값)`은 괄호 안의 값을 콘솔에 보여 주는 명령이에요. `"완료"`처럼 따옴표로 감싼 글자는 따옴표를 뺀 `완료`만 나와요.

  - 값이 저장된다고 고른 경우: console.log는 보여 주기만 하고, 값을 다시 쓸 수 있게 저장하지는 않아요. 값을 저장하는 방법은 "변수와 상수" 단원에서 배워요.
  - 따옴표까지 나온다고 고른 경우: 따옴표는 "여기부터 여기까지가 글자"라는 표시예요.
  - 프로그램이 끝난다고 고른 경우: 다음 문장이 있으면 그대로 이어서 실행돼요.
