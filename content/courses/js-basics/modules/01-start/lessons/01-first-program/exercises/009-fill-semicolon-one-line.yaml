id: js-basics.start.first-program.fill-semicolon-one-line
type: fill_blank
difficulty: 3
concepts:
  - { id: js.basics.statements, weight: 1 }
tags: [statements, semicolon]
estimatedSeconds: 60
prompt: |
  한 줄에 문장 두 개를 쓰려고 해요. 두 문장이 차례로 실행되어 `하나`, `둘`이 출력되려면 빈칸에 어떤 기호 하나가 들어가야 하나요?
spec:
  mode: text
  template: |
    console.log("하나"){{blank:sep}} console.log("둘");
  blanks:
    - id: sep
      accept: [";"]
      width: 3
hints:
  - 빈칸이 없으면 JavaScript는 두 문장의 경계를 알 수 없어요.
  - 레슨에서 "문장이 여기서 끝나요"라는 표시로 쓰는 기호가 있었어요.
  - 각 문장의 끝에 붙이는 기호예요. 둘째 문장 끝을 보세요.
explanation: |
  정답은 세미콜론 **`;`**이에요.

  세미콜론은 "문장이 여기서 끝나요"라는 표시예요. `console.log("하나"); console.log("둘");`처럼 쓰면 JavaScript가 두 문장을 구분해서 차례로 실행해요. 빈칸을 비워 두면 두 문장이 붙어 버려서 `SyntaxError`(문법 오류)가 나요.

  한 줄에 두 문장을 쓸 수는 있지만, 읽기 쉽도록 보통은 **한 줄에 문장 하나**를 쓰고 끝에 세미콜론을 붙여요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
