id: js-basics.start.first-program.fix-quoted-total
type: fix_bug
difficulty: 3
concepts:
  - { id: js.basics.console-log, weight: 1 }
tags: [console-log, quotes, debugging]
estimatedSeconds: 150
prompt: |
  김밥 두 줄(1줄에 3500원)의 가격을 계산해 출력하는 프로그램이에요. 그런데 가격이 계산되지 않고 이상하게 나와요. 버그를 고쳐서 아래처럼 출력되게 하세요.

  ```text
  김밥 2줄
  7000
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          console.log("김밥 2줄");
          console.log("3500 * 2");
  solution:
    files:
      - path: main.js
        content: |
          console.log("김밥 2줄");
          console.log(3500 * 2);
  bugDescription: 둘째 줄에 7000 대신 계산식이 글자 그대로 출력돼요.
  bugMisconception: js.mc.quoted-expression-evaluates
  maxEditDistance: 6
  checks:
    - kind: console
      id: output
      description: "\"김밥 2줄\"과 계산 결과 7000이 차례로 출력되어야 합니다."
      requirement: 가격 계산 출력
      expect:
        lines: ["김밥 2줄", "7000"]
misconceptions: [js.mc.quoted-expression-evaluates]
hints:
  - 콘솔에 실제로 무엇이 나오는지 먼저 확인해 보세요. 둘째 줄은 왜 계산되지 않았을까요?
  - JavaScript에서 `*`는 곱하기예요. 그런데 둘째 줄의 식은 무엇으로 감싸여 있나요?
  - 따옴표로 감싸면 글자가 되어 계산하지 않아요. 계산하고 싶은 식에서 무엇을 빼야 할까요?
explanation: |
  둘째 줄 `console.log("3500 * 2");`는 식을 따옴표로 감싸서 글자가 되었어요. 그래서 계산하지 않고 `3500 * 2`라는 글자 그대로 출력돼요.

  따옴표를 빼서 `console.log(3500 * 2);`로 고치면 계산한 결과 `7000`이 나와요. 첫 줄의 `"김밥 2줄"`은 글자로 보여 주려는 것이니 따옴표를 그대로 둬요.

  따옴표가 있으면 글자, 없으면 계산할 값이라는 규칙을 기억하세요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
