id: js-basics.start.first-program.impl-laundry-order
type: implement_function
difficulty: 2
concepts:
  - { id: js.basics.statements, weight: 1 }
  - { id: js.basics.console-log, weight: 0.3 }
tags: [statements, order, write-code]
estimatedSeconds: 210
prompt: |
  세탁기로 빨래하는 순서를 콘솔에 한 줄에 한 단계씩 출력하는 프로그램을 **처음부터** 작성하세요.

  단계는 아래 네 가지예요. 글자는 그대로 써 주세요.

  - `세제 넣기`
  - `빨래 말리기`
  - `빨래 넣기`
  - `시작 버튼 누르기`

  위 목록은 순서가 섞여 있어요. 아래 설명을 읽고 **실제로 하는 순서**를 알아내서 출력하세요.

  1. "시작 버튼 누르기" 바로 앞에 "세제 넣기"를 해요.
  1. "빨래 넣기"는 "세제 넣기"보다 먼저 해요.
  1. "빨래 말리기"는 시작 버튼을 누른 다음에 해요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          // 빨래하는 순서대로 한 줄에 한 단계씩 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          console.log("빨래 넣기");
          console.log("세제 넣기");
          console.log("시작 버튼 누르기");
          console.log("빨래 말리기");
  checks:
    - kind: console
      id: steps-in-order
      description: 네 단계가 실제로 하는 순서대로 한 줄에 하나씩 출력되어야 합니다.
      requirement: 단계 순서
      visible: false
      expect:
        lines: ["빨래 넣기", "세제 넣기", "시작 버튼 누르기", "빨래 말리기"]
hints:
  - 먼저 종이에 순서를 정해 보세요. 설명 세 개를 모두 만족하는 순서는 하나뿐이에요. 코드는 순서를 정한 다음에 써요.
  - 설명 1과 2를 합치면 세 단계의 순서가 정해져요. "빨래 말리기"는 그중 어디에 들어갈까요?
  - 프로그램은 문장을 위에서 아래로 실행해요. 첫 번째로 하는 단계를 출력하는 문장을 맨 위에 쓰고, 나머지도 하는 순서대로 아래에 이어 써요.
explanation: |
  실제 순서는 **빨래 넣기 → 세제 넣기 → 시작 버튼 누르기 → 빨래 말리기**예요.

  - 설명 1: "세제 넣기" 바로 다음이 "시작 버튼 누르기"예요.
  - 설명 2: "빨래 넣기"가 "세제 넣기"보다 앞이니, 여기까지 빨래 넣기 → 세제 넣기 → 시작 버튼 누르기예요.
  - 설명 3: "빨래 말리기"는 시작 버튼 다음이니 맨 끝이에요.

  ```js
  console.log("빨래 넣기");
  console.log("세제 넣기");
  console.log("시작 버튼 누르기");
  console.log("빨래 말리기");
  ```

  출력 순서는 문장을 쓴 순서가 정해요. 프로그램은 문장을 위에서 아래로, 한 번에 하나씩 실행하기 때문이에요. 그래서 하는 순서대로 위에서부터 문장을 쓰면 돼요.
origin: authored
