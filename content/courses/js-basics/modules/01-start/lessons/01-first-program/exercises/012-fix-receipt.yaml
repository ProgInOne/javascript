id: js-basics.start.first-program.fix-receipt
type: fix_bug
difficulty: 4
concepts:
  - { id: js.basics.comments, weight: 1 }
  - { id: js.basics.console-log, weight: 0.5 }
  - { id: js.basics.statements, weight: 0.5 }
tags: [comments, console-log, statements, debugging]
estimatedSeconds: 300
prompt: |
  분식집 영수증을 출력하는 프로그램이에요. 버그가 **여러 개** 있어요. 고쳐서 정확히 아래 다섯 줄이 이 순서대로 출력되게 하세요.

  ```text
  === 영수증 ===
  김밥 2줄: 7000
  라면 1개: 4000
  합계: 11000
  감사합니다
  ```

  가격 숫자는 직접 계산해서 적지 말고, 지금처럼 계산식으로 두세요.
spec:
  buggy:
    files:
      - path: main.js
        content: |
          console.log("=== 영수증 ===");
          // 메뉴별 가격
          // 김밥은 한 줄에 3500원
          console.log("김밥 2줄:", "3500 * 2");
          // 라면은 한 개에 4000원 console.log("라면 1개:", 4000);
          console.log("감사합니다");
          console.log("합계:", 3500 * 2 + 4000);
  solution:
    files:
      - path: main.js
        content: |
          console.log("=== 영수증 ===");
          // 메뉴별 가격
          // 김밥은 한 줄에 3500원
          console.log("김밥 2줄:", 3500 * 2);
          // 라면은 한 개에 4000원
          console.log("라면 1개:", 4000);
          console.log("합계:", 3500 * 2 + 4000);
          console.log("감사합니다");
  bugDescription: 김밥 가격이 계산되지 않고, 라면 줄이 출력되지 않으며, "감사합니다"가 합계보다 먼저 나와요.
  checks:
    - kind: console
      id: output
      description: 영수증 다섯 줄이 정해진 순서와 내용으로 출력되어야 합니다.
      requirement: 영수증 출력
      expect:
        lines: ["=== 영수증 ===", "김밥 2줄: 7000", "라면 1개: 4000", "합계: 11000", "감사합니다"]
misconceptions: [js.mc.line-comment-multiline, js.mc.quoted-expression-evaluates]
hints:
  - 지금 출력되는 줄과 원하는 줄을 한 줄씩 비교해서, 다른 곳을 세 군데 찾아보세요.
  - 김밥 줄은 따옴표, 라면 줄은 주석, "감사합니다"는 문장의 위치를 살펴보세요.
  - 라면을 출력하는 문장이 주석과 같은 줄에 붙어 있어요. 주석 뒤에 있는 코드는 실행될까요? 그리고 마지막 두 문장의 순서도 확인하세요.
explanation: |
  버그는 세 개예요.

  1. **김밥 가격이 글자로 나와요.** `"3500 * 2"`를 따옴표로 감싸서 계산하지 않았어요. 따옴표를 빼서 `3500 * 2`로 고쳐요.
  1. **라면 줄이 출력되지 않아요.** `console.log("라면 1개:", 4000);`가 `//` 주석과 같은 줄 뒤에 붙어 있어서 주석의 일부가 되었어요. 주석과 코드를 다른 줄로 나눠요.
  1. **"감사합니다"가 합계보다 먼저 나와요.** 문장은 위에서 아래로 실행되니, 합계를 출력하는 문장을 "감사합니다" 위로 옮겨요.

  쉼표로 나눈 값은 한 칸 띄어서 나오므로 `"김밥 2줄:", 3500 * 2`는 `김밥 2줄: 7000`이 돼요. 버그가 여러 개일 때는 출력과 기대 결과를 한 줄씩 비교하면 어디를 고쳐야 할지 보여요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
