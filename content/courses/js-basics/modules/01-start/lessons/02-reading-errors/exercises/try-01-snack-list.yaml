id: js-basics.start.reading-errors.try-snack-list
type: fix_bug
difficulty: 2
usage: try
concepts:
  - { id: js.errors.error-messages, weight: 1 }
  - { id: js.errors.error-types, weight: 0.5 }
tags: [type-error, reference-error, debugging]
estimatedSeconds: 240
prompt: |
  오늘의 간식을 출력하는 프로그램인데, 실행하면 오류가 나요. 먼저 **실행**해서 오류 메시지의 종류와 줄 번호를 읽고, 그 줄을 고친 뒤 다시 실행해 보세요. 오류가 더 있으면 같은 방법으로 하나씩 고쳐요.

  다 고치면 콘솔에 아래 네 줄이 나와야 해요.

  ```text
  오늘의 간식
  귤
  사과
  간식 개수: 2
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          console.log("오늘의 간식");
          console.Log("귤");
          console.log(사과);
          console.log("간식 개수:", 2);
  solution:
    files:
      - path: main.js
        content: |
          console.log("오늘의 간식");
          console.log("귤");
          console.log("사과");
          console.log("간식 개수:", 2);
  bugDescription: 첫 줄만 출력되고 오류가 나요.
  maxEditDistance: 3
  checks:
    - kind: console
      id: output
      description: 간식 안내 네 줄이 모두 순서대로 출력되어야 합니다.
      requirement: 네 줄 출력
      expect:
        lines: ["오늘의 간식", "귤", "사과", "간식 개수: 2"]
    - kind: program
      id: no-error
      description: 오류 없이 끝까지 실행되어야 합니다.
      requirement: 오류 없이 실행
      expect: { noError: true }
misconceptions: [js.mc.typo-is-syntax-error]
hints:
  - 실행 버튼을 눌러 오류 메시지를 읽어 보세요. 오류 종류와 몇 번째 줄인지가 단서예요.
  - "`TypeError`는 점(`.`) 뒤의 기능 이름을, `ReferenceError`는 이름의 철자와 따옴표를 확인해요."
  - 2번 줄은 `log`의 대소문자, 3번 줄은 글자를 감싸는 따옴표를 살펴보세요. 하나 고칠 때마다 다시 실행해요.
explanation: |
  버그는 두 개이고, 실행할 때마다 하나씩 보여요.

  1. 처음 실행하면 `TypeError: console.Log is not a function (2번째 줄)`이 나와요. `console` 안에는 소문자 `log`만 있어서 `Log`는 함수가 아니에요. `console.log`로 고쳐요.
  1. 다시 실행하면 `ReferenceError: 사과 is not defined (3번째 줄)`이 나와요. 따옴표가 없어서 `사과`를 글자가 아니라 이름으로 읽었어요. `"사과"`로 감싸요.

  ```js
  console.log("오늘의 간식");
  console.log("귤");
  console.log("사과");
  console.log("간식 개수:", 2);
  ```

  둘 다 오타지만 `SyntaxError`가 아니에요. 오류 종류를 먼저 읽으면 어디를 볼지 바로 정할 수 있어요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
