id: js-basics.start.reading-errors.fill-read-error-parts
type: fill_blank
difficulty: 2
concepts:
  - { id: js.errors.error-messages, weight: 1 }
tags: [error-message, line-number]
estimatedSeconds: 60
prompt: |
  아래 오류 메시지에서 **오류 종류**와 **줄 번호**를 찾아 적어 주세요. 오류 종류는 영어 이름 그대로, 줄 번호는 숫자만 쓰세요.

  ```text
  Uncaught ReferenceError: prnt is not defined
      at main.js:7:3
  ```
spec:
  mode: text
  template: |
    오류 종류: {{blank:kind}}
    줄 번호: {{blank:line}}
  blanks:
    - id: kind
      accept: ["ReferenceError"]
      caseSensitive: false
      width: 16
    - id: line
      accept: ["7"]
      acceptRegex: "7 ?(?:번)? ?(?:줄)?"
      width: 4
hints:
  - 오류 종류는 메시지 첫 줄에서 콜론(:) 바로 앞에 있는 단어예요.
  - 위치는 `at` 뒤에 `파일 이름:숫자:숫자` 모양으로 나와요.
  - 위치의 숫자 두 개 중 앞의 것이 줄 번호예요.
explanation: |
  정답은 오류 종류 **`ReferenceError`**, 줄 번호 **7**이에요.

  - 오류 종류는 첫 줄에서 콜론 앞의 단어예요. 맨 앞의 `Uncaught`는 "처리되지 않은"이라는 뜻의 꾸밈말이라 종류가 아니에요.
  - 위치 `main.js:7:3`은 main.js 파일의 7번 줄, 3번째 글자라는 뜻이에요. 그래서 줄 번호는 7이에요.

  설명 `prnt is not defined`는 `prnt`라는 이름을 찾을 수 없다는 뜻이에요. 7번 줄에서 `prnt`라는 철자를 찾아보면 원인을 바로 찾을 수 있어요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
