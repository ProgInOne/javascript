id: js-basics.start.reading-errors.check-message-description
type: mcq_single
difficulty: 1
usage: check
concepts:
  - { id: js.errors.error-messages, weight: 1 }
tags: [error-message]
estimatedSeconds: 45
prompt: |
  Chrome 개발자 도구에 아래 오류 메시지가 나왔어요. 이 중에서 **무엇이 문제인지** 영어 문장으로 알려 주는 부분은 어디인가요?

  ```text
  Uncaught ReferenceError: pirce is not defined
      at main.js:3:13
  ```
spec:
  options:
    - id: a
      text: '`pirce is not defined`'
    - id: b
      text: '`ReferenceError`'
      rationale: 콜론 앞의 단어는 오류의 종류예요. 어떤 이름이 문제인지까지는 알려 주지 않아요.
    - id: c
      text: '`main.js:3:13`'
      rationale: 이 부분은 위치예요. 3번 줄 13번째 글자라는 뜻이에요.
    - id: d
      text: '`Uncaught`'
      rationale: 아무도 처리하지 않은 오류라는 뜻일 뿐, 무엇이 문제인지는 알려 주지 않아요.
  correct: a
hints:
  - 오류 메시지는 종류, 설명, 위치 세 부분으로 되어 있어요.
  - 종류는 콜론 앞의 한 단어, 위치는 `at` 뒤에 있어요.
  - 콜론 뒤의 영어 문장이 "pirce가 정의되지 않았어요"라고 말하고 있어요.
explanation: |
  정답은 `pirce is not defined`예요. "pirce라는 이름이 정의되지 않았어요"라는 설명이에요. 아마 `price`를 잘못 쓴 것 같지요.

  - `ReferenceError`는 오류의 **종류**예요.
  - `main.js:3:13`은 **위치**예요. 3번 줄 13번째 글자예요.
  - `Uncaught`는 처리하지 않은 오류라는 표시예요.

  종류와 위치로 어디를 볼지 정하고, 설명으로 무엇이 틀렸는지 알아내요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
