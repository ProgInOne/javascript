id: js-basics.start.reading-errors.predict-error-missing-quotes
type: predict_output
difficulty: 2
concepts:
  - { id: js.errors.error-types, weight: 1 }
  - { id: js.basics.console-log, weight: 0.3 }
tags: [reference-error, quotes]
estimatedSeconds: 60
prompt: |
  다음 프로그램을 실행하면 오류가 날까요? 오류가 난다면 어떤 종류의 오류인가요?
spec:
  lang: js
  code: |
    console.log(반가워요);
  answerKind: error
  misconceptionByAnswer:
    SyntaxError: js.mc.typo-is-syntax-error
misconceptions: [js.mc.typo-is-syntax-error]
hints:
  - 글자를 출력할 때 꼭 필요한 것이 빠져 있어요.
  - 따옴표가 없으면 JavaScript는 `반가워요`를 글자가 아니라 무엇으로 읽을까요?
  - 괄호와 세미콜론은 모두 제자리에 있어요. 문장의 모양은 맞지만, 찾을 수 없는 이름을 쓴 경우의 오류 종류를 떠올려 보세요.
explanation: |
  정답은 **오류가 난다, `ReferenceError`**예요.

  따옴표가 없으니 JavaScript는 `반가워요`를 글자가 아니라 **이름**으로 읽어요. 그런 이름은 만든 적이 없으므로 `ReferenceError: 반가워요 is not defined`가 나요. 글자로 출력하려면 `console.log("반가워요");`처럼 따옴표로 감싸야 해요.

  `SyntaxError`라고 생각했다면: 괄호와 세미콜론이 제자리에 있어서 문장의 모양(문법)은 맞아요. 문법은 맞는데 없는 이름을 쓴 것이라 `ReferenceError`예요. 오타나 실수라고 모두 `SyntaxError`는 아니에요.
