id: js-basics.start.reading-errors.mcq-what-runs-before-error
type: mcq_single
difficulty: 2
concepts:
  - { id: js.errors.error-messages, weight: 1 }
  - { id: js.basics.statements, weight: 0.3 }
tags: [runtime-error, execution-order]
estimatedSeconds: 60
prompt: |
  다음 프로그램을 실행하면 콘솔에 무엇이 나오나요?
code: |
  console.log("A");
  console.log("B");
  console.log(C);
  console.log("D");
spec:
  options:
    - id: a
      text: "`A`, `B`가 출력된 다음 오류 메시지가 나온다"
    - id: b
      text: "`A`, `B`, `D`가 출력되고 오류 메시지가 나온다"
      misconception: js.mc.code-after-error-runs
      rationale: 실행 중 오류가 나면 그 줄에서 멈춰요. 4번 줄은 실행되지 않아요.
    - id: c
      text: 오류 메시지만 나오고 아무것도 출력되지 않는다
      rationale: 문법 오류(SyntaxError)라면 그렇지만, 이 오류는 실행 중에 3번 줄에서 나요. 1·2번 줄은 이미 실행됐어요.
    - id: d
      text: "`A`, `B`, `C`, `D`가 모두 출력된다"
      rationale: 3번 줄의 `C`에는 따옴표가 없어서 글자가 아니라 이름으로 읽혀요. 그런 이름은 없어요.
  correct: a
misconceptions: [js.mc.code-after-error-runs]
hints:
  - 3번 줄의 `C`는 다른 줄과 무엇이 다른가요?
  - 따옴표가 없는 `C`는 이름으로 읽혀요. 그런 이름이 없으면 어떤 오류가 날까요? 그 오류는 실행 전에 날까요, 실행 중에 날까요?
  - 실행 중에 오류가 나면 앞 줄까지는 이미 실행됐고, 오류 난 줄에서 멈춰요.
explanation: |
  정답은 **`A`, `B`가 출력된 다음 오류 메시지가 나온다**예요.

  3번 줄 `console.log(C)`의 `C`에는 따옴표가 없어서 JavaScript는 이것을 `C`라는 **이름**으로 읽어요. 그런 이름이 없으니 실행 중에 `ReferenceError: C is not defined`가 나요.

  - 1·2번 줄은 오류보다 먼저 실행되어 `A`, `B`가 출력돼요.
  - 3번 줄에서 오류가 나면 프로그램이 멈추므로, 4번 줄의 `D`는 출력되지 않아요.

  `D`까지 출력된다고 생각했다면 오류 난 줄만 건너뛴다고 본 거예요. 아무것도 출력되지 않는 것은 실행 전에 걸리는 `SyntaxError`일 때예요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
