id: js-basics.start.reading-errors.fill-error-unclosed-quote
type: fill_blank
difficulty: 2
concepts:
  - { id: js.errors.error-types, weight: 1 }
tags: [syntax-error, quotes]
estimatedSeconds: 75
prompt: |
  둘째 줄에서 따옴표 하나를 빠뜨렸어요.

  ```js
  console.log("시작");
  console.log("끝);
  ```

  실행하면 어떤 종류의 오류가 나고, 콘솔에 `시작`은 출력될까요? 오류 종류는 영어 이름 그대로, 출력 여부는 `예` 또는 `아니요`로 적어 주세요.
spec:
  mode: text
  template: |
    오류 종류: {{blank:kind}}
    "시작"이 출력되나요? {{blank:runs}}
  blanks:
    - id: kind
      accept: ["SyntaxError"]
      caseSensitive: false
      width: 16
    - id: runs
      accept: ["아니요", "아니오", "아니"]
      width: 5
      misconceptionMap:
        "예": js.mc.syntax-error-partial-run
        "네": js.mc.syntax-error-partial-run
misconceptions: [js.mc.syntax-error-partial-run]
hints:
  - 여는 따옴표와 닫는 따옴표의 짝이 맞는지 세어 보세요. 글자가 어디서 끝나는지 알 수 있나요?
  - 짝이 맞지 않는 따옴표는 이름이나 값의 문제가 아니라 문장 모양의 문제예요. JavaScript는 이런 문제를 언제 발견할까요?
  - 문법 오류는 실행을 시작하기 전, 코드 전체를 검사할 때 발견돼요.
explanation: |
  정답은 **`SyntaxError`**, 그리고 `시작`은 **출력되지 않아요(아니요)**.

  둘째 줄은 `"끝`에서 따옴표를 열었지만 닫지 않았어요. 글자가 어디서 끝나는지 알 수 없으니 문장의 모양이 깨졌고, `SyntaxError`가 나요. 설명은 ProgInOne에서 `Unterminated string constant`(끝나지 않은 문자열), Chrome 개발자 도구에서 `Invalid or unexpected token`이에요.

  JavaScript는 실행하기 전에 코드 전체의 문법을 먼저 검사해요. 문법 검사에서 걸리면 한 줄도 실행하지 않으므로, 문제가 없는 첫 줄의 `시작`도 출력되지 않아요.

  - `ReferenceError`라고 답했다면: 그건 문법은 맞는데 없는 이름을 쓸 때예요. 따옴표·괄호의 짝이 틀리면 `SyntaxError`예요.
  - `시작`이 출력된다고 답했다면: 실행 중 오류(`ReferenceError`, `TypeError`)일 때만 앞 줄이 실행돼요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
