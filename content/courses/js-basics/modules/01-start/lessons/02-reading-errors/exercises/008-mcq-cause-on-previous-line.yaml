id: js-basics.start.reading-errors.mcq-cause-on-previous-line
type: mcq_single
difficulty: 3
concepts:
  - { id: js.errors.error-messages, weight: 1 }
  - { id: js.basics.statements, weight: 0.5 }
tags: [error-message, line-number, semicolon]
estimatedSeconds: 90
prompt: |
  다음 프로그램을 실행했더니 `시작`이 출력된 뒤 오류 메시지가 나왔어요. **원인**은 어디에 있나요?

  ```text
  시작
  Uncaught TypeError: console.log(...) is not a function
      at main.js:2:1
  ```
code: |
  console.log("시작")
  (5 + 5)
spec:
  options:
    - id: a
      text: 1번 줄 끝에 세미콜론이 없어서 두 줄이 한 문장으로 이어졌다
    - id: b
      text: 2번 줄의 괄호가 잘못 쓰였다. 메시지가 2번 줄을 가리키니까
      misconception: js.mc.error-line-is-cause
      rationale: "`(5 + 5)` 자체는 올바른 식이에요. 줄 번호는 문제를 알아챈 곳일 뿐, 원인은 앞 줄에 있어요."
    - id: c
      text: console.log가 고장 나서 함수가 아니게 되었다
      rationale: 1번 줄에서 `시작`이 정상 출력됐어요. console.log는 멀쩡해요.
    - id: d
      text: 1번 줄의 `"시작"`에 따옴표를 잘못 썼다
      rationale: 따옴표가 틀렸다면 `시작`이 출력되지 못하고 SyntaxError가 났을 거예요.
  correct: a
misconceptions: [js.mc.error-line-is-cause]
hints:
  - 2번 줄의 `(5 + 5)`만 따로 떼어 보면 틀린 곳이 있나요?
  - 메시지의 `console.log(...)`라는 표현에 주목하세요. JavaScript는 2번 줄을 어떤 코드와 함께 읽은 걸까요?
  - 문장의 끝을 알려 주는 기호가 1번 줄에 있는지 확인해 보세요.
explanation: |
  정답은 **1번 줄 끝에 세미콜론이 없어서 두 줄이 한 문장으로 이어졌다**예요.

  1번 줄 끝에 세미콜론이 없으니, JavaScript는 다음 줄의 `(`를 앞 문장의 연속으로 읽었어요. 즉 두 줄을 `console.log("시작")(5 + 5)`라는 한 문장으로 본 거예요.

  1. `console.log("시작")`이 실행되어 `시작`이 출력되고, 결과로 `undefined`를 돌려줘요.
  1. 그 결과에 `(5 + 5)`를 붙여 함수처럼 부르려 하니 `TypeError: console.log(...) is not a function`이 나요.

  메시지는 2번 줄을 가리키지만, 2번 줄을 고쳐서는 해결되지 않아요. 줄 번호는 문제를 **알아챈** 곳이고, 원인은 앞 줄에 있을 수 있어요. 1번 줄 끝에 `;`를 붙이면 오류가 사라져요. 문장 끝에 세미콜론을 붙이는 습관이 이런 문제를 막아 줘요.
origin: authored
review:
