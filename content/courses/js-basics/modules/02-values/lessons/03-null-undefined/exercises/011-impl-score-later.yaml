id: js-basics.values.null-undefined.impl-score-later
type: implement_function
difficulty: 2
concepts:
  - { id: js.types.undefined, weight: 1 }
  - { id: js.values.let, weight: 0.3 }
tags: [undefined, let, write-code]
estimatedSeconds: 150
prompt: |
  퀴즈 점수를 기록하는 프로그램을 작성하세요.

  1. `quizScore` 변수를 **값 없이** 만들고, 변수를 써서 출력해요.
  1. 퀴즈를 풀었더니 90점이 나왔어요. `quizScore`에 `90`을 대입하고, 다시 변수를 써서 출력해요.

  실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  퀴즈 점수: undefined
  퀴즈 점수: 90
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          // 1. quizScore를 값 없이 만들고 출력하세요.

          // 2. quizScore에 90을 대입하고 다시 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          // 1. quizScore를 값 없이 만들고 출력하세요.
          let quizScore;
          console.log("퀴즈 점수:", quizScore);
          // 2. quizScore에 90을 대입하고 다시 출력하세요.
          quizScore = 90;
          console.log("퀴즈 점수:", quizScore);
  checks:
    - kind: console
      id: output
      description: 값을 넣기 전과 넣은 뒤의 퀴즈 점수가 차례로 출력되어야 합니다.
      requirement: 점수 출력
      expect:
        lines: ["퀴즈 점수: undefined", "퀴즈 점수: 90"]
    - kind: program
      id: final-score
      description: 프로그램이 오류 없이 끝나고, 끝났을 때 quizScore에는 90이 들어 있어야 합니다.
      requirement: 같은 변수에 대입하기
      expect:
        globals:
          quizScore: { equals: 90 }
        noError: true
misconceptions: [js.mc.undefined-is-error]
hints:
  - 변수를 값 없이 만들려면 `let` 문장에서 무엇을 빼면 될까요?
  - 값 없이 만든 변수를 출력하면 무엇이 나오는지 떠올려 보세요. 그 값은 오류가 아니에요.
  - "`let quizScore;`처럼 `= 값` 부분을 빼고 만들어요. 나중에 값을 넣을 때는 `let` 없이 대입만 해요."
explanation: |
  예시 정답은 다음과 같아요.

  ```js
  let quizScore;
  console.log("퀴즈 점수:", quizScore);
  quizScore = 90;
  console.log("퀴즈 점수:", quizScore);
  ```

  - `let quizScore;`처럼 값 없이 만들면 JavaScript가 `undefined`를 넣어 둬요. 그래서 첫 출력은 `퀴즈 점수: undefined`예요. 오류가 아니라서 프로그램은 계속 실행돼요.
  - 값을 넣을 때는 `let` 없이 `quizScore = 90;`이라고 대입만 해요. 같은 이름으로 `let`을 다시 쓰면 `SyntaxError`가 나요.
  - `const`로는 값 없이 만들 수 없어요. 나중에 값을 넣어야 하는 변수는 `let`으로 만들어요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
