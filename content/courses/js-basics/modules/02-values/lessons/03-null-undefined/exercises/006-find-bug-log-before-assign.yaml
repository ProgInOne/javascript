id: js-basics.values.null-undefined.find-bug-log-before-assign
type: find_bug_line
difficulty: 3
concepts:
  - { id: js.types.undefined, weight: 1 }
  - { id: js.basics.statements, weight: 0.3 }
tags: [undefined, statement-order, debugging]
estimatedSeconds: 90
prompt: |
  회원 정보를 출력하는 프로그램이에요. 회원 이름 자리에 이름 대신 이상한 값이 나와요. 원인이 되는 줄을 찾고, 왜 그런지도 고르세요.
spec:
  code: |-
    let userName;
    let point = 500;
    console.log("회원:", userName);
    console.log("포인트:", point);
    userName = "하늘";
  bugLines: [5]
  acceptLines: [1]
  symptom: "`회원: 하늘` 대신 `회원: undefined`가 나와요. 오류 메시지는 없어요."
  symptomCheck:
    console: ["회원: undefined", "포인트: 500"]
  fixedCode: |-
    let userName = "하늘";
    let point = 500;
    console.log("회원:", userName);
    console.log("포인트:", point);
  causeOptions:
    - id: c1
      text: 이름을 넣는 대입이 출력보다 나중에 실행되어서, 출력할 때는 아직 값이 정해지지 않았다
      correct: true
    - id: c2
      text: userName이라는 변수가 만들어지지 않았다
      misconception: js.mc.not-defined-is-undefined
    - id: c3
      text: 3번 줄에서 오류가 나서 userName에 넣은 이름이 지워졌다
      misconception: js.mc.undefined-is-error
misconceptions: [js.mc.undefined-is-error, js.mc.not-defined-is-undefined]
hints:
  - 오류 메시지가 없고 `undefined`가 출력됐어요. 변수가 없는 걸까요, 값이 아직 없는 걸까요?
  - 문장은 위에서 아래로 실행돼요. 3번 줄이 실행되는 순간 `userName`에는 무엇이 들어 있나요?
  - "`userName`에 이름이 들어가는 줄은 몇 번 줄인가요? 그 줄은 출력보다 먼저 실행되나요?"
explanation: |
  원인은 **5번 줄**이에요. 이름을 넣는 대입이 출력보다 나중에 실행돼요.

  | 실행한 줄 | `userName`의 값 |
  |---|---|
  | 1. `let userName;` | `undefined` |
  | 3. `console.log("회원:", userName);` | `undefined` 출력 |
  | 5. `userName = "하늘";` | `"하늘"` (이미 출력이 끝난 뒤) |

  문장은 위에서 아래로 실행되므로, 3번 줄이 실행될 때 `userName`에는 아직 `undefined`가 들어 있어요. 이름을 먼저 넣고 출력해야 해요. 예를 들어 1번 줄을 `let userName = "하늘";`로 바꾸고 5번 줄을 지우면 돼요. 그래서 1번 줄을 골라도 정답으로 인정해요.

  - "변수가 만들어지지 않았다"를 고른 경우: 변수가 없으면 `ReferenceError: userName is not defined`가 나요. 1번 줄에서 만들었어요.
  - "오류가 나서 지워졌다"를 고른 경우: 오류 메시지가 없었어요. `undefined`는 오류가 아니라 값이에요.
origin: authored
review:
