id: js-basics.values.null-undefined.fix-score-zero-to-null
type: fix_bug
difficulty: 2
concepts:
  - { id: js.types.null, weight: 1 }
tags: ["null", debugging]
estimatedSeconds: 120
prompt: |
  학생 성적표 프로그램이에요. 이 학생은 아직 과학 시험을 보지 않았는데, 성적표에는 과학 0점을 받은 것처럼 나와요.

  지금 실행하면 이렇게 나와요.

  ```text
  수학: 85
  과학: 0
  ```

  "아직 점수가 없음"을 일부러 표시하는 값을 써서, 아래처럼 나오게 고치세요.

  ```text
  수학: 85
  과학: null
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          let mathScore = 85;
          let scienceScore = 0; // 아직 시험을 보지 않았어요
          console.log("수학:", mathScore);
          console.log("과학:", scienceScore);
  solution:
    files:
      - path: main.js
        content: |
          let mathScore = 85;
          let scienceScore = null; // 아직 시험을 보지 않았어요
          console.log("수학:", mathScore);
          console.log("과학:", scienceScore);
  bugDescription: 아직 시험을 보지 않은 과학 점수가 0점으로 나와서, 0점을 받은 것처럼 보여요.
  bugMisconception: js.mc.empty-value-is-zero
  maxEditDistance: 2
  checks:
    - kind: console
      id: output
      description: 수학 점수와, 아직 없는 과학 점수가 차례로 출력되어야 합니다.
      requirement: 성적표 출력
      expect:
        lines: ["수학: 85", "과학: null"]
    - kind: program
      id: science-null
      description: 프로그램이 끝났을 때 scienceScore에는 "값이 없음"을 일부러 표시하는 값이 들어 있어야 합니다.
      requirement: 점수 없음 표시
      expect:
        globals:
          scienceScore: { equalsLiteral: "null" }
      misconceptionIfFail: js.mc.null-undefined-same
misconceptions: [js.mc.empty-value-is-zero]
hints:
  - 0점을 받은 학생과 시험을 보지 않은 학생은 같은 상황인가요?
  - "`0`은 숫자 0이 \"있다\"는 뜻이에요. \"값이 없음\"을 나타내는 값 중 프로그래머가 일부러 넣는 것은 무엇이었나요?"
  - 2번 줄의 `0`을 따옴표 없는 그 값으로 바꿔요.
explanation: |
  2번 줄 `let scienceScore = 0;`이 문제예요. `0`은 "0점을 받았다"는 뜻이라, 시험을 안 본 학생이 0점을 받은 학생처럼 보여요. 나중에 평균을 내면 0점이 섞여 계산까지 틀려져요.

  "아직 점수가 없음"을 일부러 표시할 때는 `null`을 써요.

  ```js
  let scienceScore = null;
  ```

  - `"null"`처럼 따옴표를 붙이면 출력은 같아 보여도 네 글자로 된 문자열이라 두 번째 요구사항을 통과하지 못해요.
  - `let scienceScore;`로 두면 `undefined`가 출력돼요. `undefined`는 "아직 아무도 값을 넣지 않음"이라는 뜻이라, "점수가 없다고 일부러 표시함"을 나타내려면 `null`이 알맞아요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
