id: js-basics.values.null-undefined.try-message-states
type: implement_function
difficulty: 2
usage: try
concepts:
  - { id: js.types.null, weight: 1 }
  - { id: js.types.undefined, weight: 0.5 }
  - { id: js.types.typeof, weight: 0.3 }
tags: ["null", undefined, typeof, write-code]
estimatedSeconds: 240
prompt: |
  메신저 앱의 "마지막 메시지"를 변수 `lastMessage` 하나로 기록해 보세요. 메시지의 상태가 바뀔 때마다 `typeof`로 자료형을 출력해요. 주석의 순서대로 코드를 직접 써요.

  실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  undefined
  object
  string
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          // 1. lastMessage 변수를 값 없이 만들고, typeof로 자료형을 출력하세요.

          // 2. 사용자가 메시지를 지웠어요. "없음"을 일부러 표시하는 값을 대입하고, 자료형을 출력하세요.

          // 3. 새 메시지 "안녕"이 왔어요. 이 글자를 대입하고, 자료형을 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          // 1. lastMessage 변수를 값 없이 만들고, typeof로 자료형을 출력하세요.
          let lastMessage;
          console.log(typeof lastMessage);
          // 2. 사용자가 메시지를 지웠어요. "없음"을 일부러 표시하는 값을 대입하고, 자료형을 출력하세요.
          lastMessage = null;
          console.log(typeof lastMessage);
          // 3. 새 메시지 "안녕"이 왔어요. 이 글자를 대입하고, 자료형을 출력하세요.
          lastMessage = "안녕";
          console.log(typeof lastMessage);
  checks:
    - kind: console
      id: output
      description: "세 상태의 자료형이 `undefined`, `object`, `string` 순서로 출력되어야 합니다."
      requirement: 자료형 세 줄
      expect:
        lines: ["undefined", "object", "string"]
    - kind: program
      id: final-value
      description: 프로그램이 끝났을 때 `lastMessage`에 글자 "안녕"이 들어 있어야 합니다.
      requirement: lastMessage의 마지막 값
      expect: { globals: { lastMessage: { equals: "안녕" } }, noError: true }
misconceptions: [js.mc.null-undefined-same, js.mc.typeof-null-is-null]
hints:
  - 값이 바뀌는 변수이니 `let`으로 만들어요. 값 없이 만들면 무엇이 자동으로 들어가나요?
  - "\"없음\"을 일부러 표시하는 값은 따옴표 없이 쓰는 `null`이에요. `\"null\"`이라고 쓰면 문자열이 돼요."
  - "자료형은 `console.log(typeof lastMessage);`로 출력해요. 대입할 때마다 이 줄을 한 번씩 써요."
explanation: |
  예시 답안은 다음과 같아요.

  ```js
  let lastMessage;
  console.log(typeof lastMessage);
  lastMessage = null;
  console.log(typeof lastMessage);
  lastMessage = "안녕";
  console.log(typeof lastMessage);
  ```

  - 값 없이 만든 변수에는 JavaScript가 자동으로 `undefined`를 넣어요. `typeof`도 `undefined`예요.
  - "없음"을 일부러 표시할 때는 `null`을 직접 넣어요. `typeof null`은 설계 실수로 남은 `object`예요.
  - 글자를 넣으면 `string`이 돼요. 자료형은 그 순간 들어 있는 값을 따라가요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
