id: js-basics.values.null-undefined.impl-seat-reservation
type: implement_function
difficulty: 3
concepts:
  - { id: js.types.null, weight: 1 }
  - { id: js.values.assignment, weight: 0.3 }
  - { id: js.types.typeof, weight: 0.3 }
tags: ["null", assignment, typeof, write-code]
estimatedSeconds: 210
prompt: |
  기차 좌석 예약 프로그램을 작성하세요. 예약 좌석은 `reservedSeat` 변수 하나에 담아요.

  1. 처음에는 예약한 좌석이 없어요. "없음"을 **일부러 표시하는 값**을 넣고 출력해요.
  1. 좌석 `B7`을 예약했어요. 값을 바꾸고 출력해요.
  1. 예약을 취소했어요. 다시 "없음"을 표시하고 출력해요.
  1. 마지막으로 `reservedSeat`의 자료형을 `typeof`로 출력해요.

  실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  예약 좌석: null
  예약 좌석: B7
  예약 좌석: null
  object
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          // 좌석 예약 → 취소 과정을 reservedSeat 변수 하나로 표현하세요.
  solution:
    files:
      - path: main.js
        content: |
          let reservedSeat = null;
          console.log("예약 좌석:", reservedSeat);

          reservedSeat = "B7";
          console.log("예약 좌석:", reservedSeat);

          reservedSeat = null;
          console.log("예약 좌석:", reservedSeat);

          console.log(typeof reservedSeat);
  checks:
    - kind: console
      id: output
      description: 예약 없음 → B7 → 예약 없음 순서로 출력되고, 마지막에 자료형이 출력되어야 합니다.
      requirement: 예약 과정 출력
      expect:
        lines: ["예약 좌석: null", "예약 좌석: B7", "예약 좌석: null", "object"]
      misconceptionIfFail: js.mc.null-undefined-same
    - kind: program
      id: final-null
      description: 프로그램이 오류 없이 끝나고, 끝났을 때 reservedSeat에는 "없음"을 일부러 표시하는 값이 들어 있어야 합니다.
      requirement: 취소 후 없음 표시
      expect:
        globals:
          reservedSeat: { equalsLiteral: "null" }
        noError: true
misconceptions: [js.mc.null-undefined-same, js.mc.typeof-null-is-null]
hints:
  - "\"없음\"을 프로그래머가 일부러 표시할 때 쓰는 값은 무엇이었나요? 따옴표를 붙이나요?"
  - 값이 계속 바뀌는 변수는 `let`과 `const` 중 무엇으로 만들어야 할까요? 값을 바꿀 때는 `let`을 다시 쓰지 않아요.
  - 마지막 줄은 `typeof reservedSeat`를 출력하면 돼요. 그 결과가 왜 `object`인지는 지난 단원의 typeof 표를 떠올려 보세요.
explanation: |
  예시 정답은 다음과 같아요.

  ```js
  let reservedSeat = null;
  console.log("예약 좌석:", reservedSeat);

  reservedSeat = "B7";
  console.log("예약 좌석:", reservedSeat);

  reservedSeat = null;
  console.log("예약 좌석:", reservedSeat);

  console.log(typeof reservedSeat);
  ```

  - 예약이 없다는 것을 일부러 표시하므로 `null`을 넣어요. `let reservedSeat;`로 만들면 첫 줄이 `undefined`로 나와요.
  - 값이 바뀌니 `let`으로 만들어요. `const`로 만들면 `reservedSeat = "B7";`에서 `TypeError`가 나요.
  - 취소할 때도 다시 `null`을 대입해요. `null`은 "없음" 자리 표시라서 언제든 다른 값과 바꿔 넣을 수 있어요.
  - `typeof null`은 설계 실수 때문에 `"object"`라서 마지막 줄은 `object`예요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
