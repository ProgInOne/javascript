id: js-basics.values.variables.predict-copy-not-link
type: predict_output
difficulty: 3
concepts:
  - { id: js.values.assignment, weight: 1 }
  - { id: js.values.let, weight: 0.3 }
tags: [assignment, copy]
estimatedSeconds: 75
prompt: |
  다음 프로그램을 실행하면 콘솔에 무엇이 출력되나요?
spec:
  lang: js
  code: |
    let myScore = 70;
    let friendScore = myScore;
    myScore = 95;
    console.log(myScore, friendScore);
  answerKind: console
  misconceptionByAnswer:
    "95 95": js.mc.variable-remembers-formula
misconceptions: [js.mc.variable-remembers-formula]
hints:
  - 2번 줄이 실행되는 순간 `friendScore`에는 무엇이 들어가나요? 이름일까요, 값일까요?
  - 3번 줄은 어느 변수의 상자를 바꾸나요? 다른 변수의 상자도 함께 바뀔까요?
  - 두 변수의 값을 표로 적으면서 줄마다 바뀌는 칸만 고쳐 보세요.
explanation: |
  정답은 **`95 70`**이에요.

  | 실행한 줄 | `myScore` | `friendScore` |
  |---|---|---|
  | `let myScore = 70;` | 70 | (아직 없음) |
  | `let friendScore = myScore;` | 70 | 70 |
  | `myScore = 95;` | 95 | 70 |

  2번 줄은 "friendScore는 앞으로 myScore와 같다"가 아니라, **그 순간** `myScore`의 값 70을 `friendScore`에 복사해 넣는 거예요. 3번 줄은 `myScore`의 상자만 바꾸므로 `friendScore`는 70 그대로예요.

  `95 95`라고 답했다면 대입이 두 변수를 연결한다고 생각한 거예요. 지금까지 배운 숫자·글자 값은 대입할 때 값이 복사돼요. (나중에 배울 객체와 배열은 조금 다르게 동작하는데, "참조와 복사" 단원에서 다뤄요.)
