id: js-basics.values.variables.fill-swap-values
type: fill_blank
difficulty: 4
concepts:
  - { id: js.values.assignment, weight: 1 }
  - { id: js.values.let, weight: 0.3 }
tags: [assignment, swap, write-code]
estimatedSeconds: 240
prompt: |
  왼손에는 사과, 오른손에는 배를 들고 있어요. 두 손의 과일을 서로 바꾸는 프로그램을 완성하세요. 빈칸 두 곳에 **대입문을 하나씩** 써서, 실행하면 아래처럼 출력되게 하세요.

  ```text
  배 사과
  ```

  `temp`는 잠깐 맡겨 두는 빈 접시 같은 변수예요.
spec:
  mode: code
  lang: js
  template: |
    let left = "사과";
    let right = "배";
    let temp = left;
    {{blank:first}}
    {{blank:second}}
    console.log(left, right);
  blanks:
    - id: first
      accept: ["left = right;"]
      width: 24
    - id: second
      accept: ["right = temp;"]
      width: 24
      misconceptionMap:
        "right = left;": js.mc.variable-remembers-formula
  checks:
    - kind: console
      id: output
      description: "\"배 사과\"가 출력되어야 합니다."
      requirement: 두 값 바꾸기
      expect:
        lines: ["배 사과"]
    - kind: program
      id: swapped
      description: 끝났을 때 left에는 "배", right에는 "사과"가 들어 있어야 합니다.
      requirement: 변수 값 바꾸기
      expect:
        globals:
          left: { equals: "배" }
          right: { equals: "사과" }
misconceptions: [js.mc.variable-remembers-formula]
hints:
  - 3번 줄이 끝났을 때 세 변수 `left`, `right`, `temp`에는 각각 무엇이 들어 있나요? 표로 적어 보세요.
  - "`left`에 배를 먼저 넣으면 원래 있던 사과는 `left`에서 사라져요. 하지만 사과를 미리 어딘가에 맡겨 두었어요."
  - 첫 빈칸에서 `left`가 오른손의 과일을 받고, 둘째 빈칸에서 `right`가 맡겨 둔 과일을 받게 해 보세요.
explanation: |
  예시 정답은 첫 빈칸 `left = right;`, 둘째 빈칸 `right = temp;`예요.

  | 실행한 줄 | `left` | `right` | `temp` |
  |---|---|---|---|
  | `let temp = left;` | 사과 | 배 | 사과 |
  | `left = right;` | 배 | 배 | 사과 |
  | `right = temp;` | 배 | 사과 | 사과 |

  `left = right;`를 실행하면 `left`에 있던 사과는 덮어써져서 사라져요. 그래서 미리 `temp`에 사과를 맡겨 둔 거예요. 마지막으로 `temp`에 맡긴 사과를 `right`에 넣으면 두 값이 바뀌어요.

  둘째 빈칸에 `right = left;`를 쓰면 `left`는 이미 배로 바뀐 뒤라서 둘 다 `배`가 돼요. 대입은 그 순간의 값을 복사한다는 점을 표로 확인해 보세요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
