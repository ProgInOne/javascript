id: js-basics.values.variables.impl-change-lives
type: implement_function
difficulty: 2
concepts:
  - { id: js.values.let, weight: 1 }
  - { id: js.values.assignment, weight: 0.3 }
tags: [let, reassignment, write-code]
estimatedSeconds: 150
prompt: |
  게임 캐릭터의 목숨을 기록하는 프로그램을 작성하세요.

  1. `lives`라는 변수를 만들어 `3`을 넣고, 변수를 써서 `목숨: 3`을 출력해요.
  1. 캐릭터가 함정에 빠졌어요. **같은 변수** `lives`의 값을 `2`로 바꾸고, 다시 변수를 써서 출력해요.

  실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  목숨: 3
  목숨: 2
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          // 1. lives 변수를 만들고 출력하세요.

          // 2. 같은 변수 lives의 값을 2로 바꾸고 다시 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          // 1. lives 변수를 만들고 출력하세요.
          let lives = 3;
          console.log("목숨:", lives);
          // 2. 같은 변수 lives의 값을 2로 바꾸고 다시 출력하세요.
          lives = 2;
          console.log("목숨:", lives);
  checks:
    - kind: console
      id: output
      description: "\"목숨: 3\"과 \"목숨: 2\"가 차례로 출력되어야 합니다."
      requirement: 목숨 출력
      expect:
        lines: ["목숨: 3", "목숨: 2"]
    - kind: program
      id: final-lives
      description: 프로그램이 오류 없이 끝나고, 끝났을 때 lives에는 2가 들어 있어야 합니다.
      requirement: 같은 변수의 값 바꾸기
      expect:
        globals:
          lives: { equals: 2 }
        noError: true
misconceptions: [js.mc.let-again-to-change]
hints:
  - 필요한 문장은 네 개예요. 변수 만들기 → 출력 → 값 바꾸기 → 출력 순서로 써 보세요.
  - 변수를 처음 만들 때와 값을 바꿀 때는 쓰는 모양이 달라요. `let`은 언제 쓰나요?
  - "`let`은 처음 만들 때 한 번만 써요. 값을 바꿀 때는 `let` 없이 `lives = ...;`처럼 대입만 하고, 출력할 때는 글자 `\"목숨:\"`과 변수 `lives`를 쉼표로 나눠 넣어요."
explanation: |
  예시 정답은 다음과 같아요.

  ```js
  let lives = 3;
  console.log("목숨:", lives);
  lives = 2;
  console.log("목숨:", lives);
  ```

  - 처음에는 `let lives = 3;`으로 변수를 만들어요.
  - 값을 바꿀 때는 `let` 없이 `lives = 2;`라고 대입만 해요. 같은 이름으로 `let`을 다시 쓰면 `SyntaxError: Identifier 'lives' has already been declared`가 나고, 문법 오류라 한 줄도 실행되지 않아요.
  - 두 console.log는 같은 모양이지만, 실행되는 순간의 `lives` 값이 달라서 3과 2가 차례로 나와요.

  `lives = lives - 1;`처럼 지금 값에서 1을 빼도 정답이에요. 오른쪽을 먼저 계산하므로 3 − 1 = 2가 `lives`에 들어가요. `let`을 빼먹고 `lives = 3;`으로 시작하면 `ReferenceError: lives is not defined`가 나요. 만든 적 없는 변수에는 값을 넣을 수 없어요.
origin: authored
review:
