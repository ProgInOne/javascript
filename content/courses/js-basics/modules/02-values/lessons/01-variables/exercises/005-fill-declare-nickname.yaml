id: js-basics.values.variables.fill-declare-nickname
type: fill_blank
difficulty: 2
concepts:
  - { id: js.values.let, weight: 1 }
tags: [let, write-code]
estimatedSeconds: 90
prompt: |
  빈칸에 **변수를 만드는 문장 한 줄**을 써서, 프로그램을 실행하면 아래처럼 출력되게 하세요. 변수 이름은 아래 코드에 쓰인 이름을 그대로 써야 해요.

  ```text
  내 별명: 코딩왕
  ```
spec:
  mode: code
  lang: js
  template: |
    {{blank:decl}}
    console.log("내 별명:", nickname);
  blanks:
    - id: decl
      accept: ['let nickname = "코딩왕";']
      width: 40
      misconceptionMap:
        'let "nickname" = "코딩왕";': js.mc.variable-name-in-quotes
  checks:
    - kind: console
      id: output
      description: "\"내 별명: 코딩왕\"이 출력되어야 합니다."
      requirement: 별명 출력
      expect:
        lines: ["내 별명: 코딩왕"]
    - kind: program
      id: has-nickname
      description: nickname이라는 변수에 "코딩왕"이 들어 있어야 합니다.
      requirement: nickname 변수 만들기
      expect:
        globals:
          nickname: { equals: "코딩왕" }
hints:
  - 둘째 줄이 어떤 이름의 변수를 쓰고 있는지 확인하세요.
  - 변수를 만드는 문장은 `let` + 이름 + `=` + 값 + `;` 모양이에요.
  - 넣을 값은 글자이므로 따옴표로 감싸야 해요. 변수 이름에는 따옴표를 붙이지 않아요.
explanation: |
  예시 정답은 `let nickname = "코딩왕";`이에요.

  - 둘째 줄이 `nickname`이라는 이름을 쓰므로, 그 이름으로 변수를 만들어야 해요. 대소문자까지 같아야 해요.
  - 넣을 값 `코딩왕`은 글자라서 따옴표로 감싸요. 반대로 변수 이름 `nickname`에는 따옴표를 붙이지 않아요.

  `const nickname = "코딩왕";`도 정답이에요. 이 프로그램에서는 별명을 바꾸지 않으니 오히려 `const`가 더 알맞아요(`const`는 이 단원 뒤쪽에서 배워요).
origin: authored
review:
  status: draft
  draftedBy: ai:claude
