id: js-basics.values.variables.try-start-score
type: implement_function
difficulty: 2
usage: try
concepts:
  - { id: js.values.const, weight: 1 }
  - { id: js.values.assignment, weight: 0.5 }
tags: [const, let, copy, write-code]
estimatedSeconds: 240
prompt: |
  게임 점수가 바뀌기 전에, 처음 점수를 따로 기억해 두는 프로그램을 써 보세요.

  - 바뀌는 점수 `score`는 `let`으로, 기억해 둘 처음 점수 `startScore`는 `const`로 만들어요.
  - `startScore`에는 `50`을 직접 쓰지 말고 **`score`를 대입**해서 그 순간의 값을 복사하세요.

  실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  처음: 50
  지금: 80
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          // 1. 바뀌는 점수 score를 만들어 50을 넣으세요.

          // 2. 상수 startScore를 만들고, 지금 score의 값을 대입해 복사해 두세요.

          // 3. 코인을 먹었어요. score의 지금 값에 30을 더해 다시 넣으세요.

          // 4. "처음:"과 startScore, "지금:"과 score를 한 줄씩 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          // 1. 바뀌는 점수 score를 만들어 50을 넣으세요.
          let score = 50;
          // 2. 상수 startScore를 만들고, 지금 score의 값을 대입해 복사해 두세요.
          const startScore = score;
          // 3. 코인을 먹었어요. score의 지금 값에 30을 더해 다시 넣으세요.
          score = score + 30;
          // 4. "처음:"과 startScore, "지금:"과 score를 한 줄씩 출력하세요.
          console.log("처음:", startScore);
          console.log("지금:", score);
  checks:
    - kind: program
      id: values
      description: 프로그램이 끝났을 때 `startScore`에는 50, `score`에는 80이 들어 있어야 합니다.
      requirement: 두 변수의 값
      expect: { globals: { startScore: { equals: 50 }, score: { equals: 80 } }, noError: true }
    - kind: console
      id: output
      description: 처음 점수와 지금 점수가 두 줄로 출력되어야 합니다.
      requirement: 두 줄 출력
      expect:
        lines: ["처음: 50", "지금: 80"]
misconceptions: [js.mc.variable-remembers-formula]
hints:
  - "`startScore`는 다시 대입하지 않으니 `const`, `score`는 나중에 바뀌니 `let`이에요."
  - "`const startScore = score;`는 그 순간 `score`에 들어 있는 값을 복사해요. 나중에 `score`가 바뀌어도 따라 바뀌지 않아요."
  - 3번은 `score = score + 30;`이에요. 출력은 맨 마지막에 해요.
explanation: |
  예시 답안은 다음과 같아요.

  ```js
  let score = 50;
  const startScore = score;
  score = score + 30;
  console.log("처음:", startScore);
  console.log("지금:", score);
  ```

  `const startScore = score;`는 "startScore는 앞으로 score와 같다"가 아니라 "**지금** score의 값(50)을 넣어라"예요. 그래서 3번에서 `score`를 80으로 바꿔도 `startScore`는 50 그대로예요.

  `startScore`를 `let`이 아니라 `const`로 만든 덕분에, 처음 점수를 실수로 바꾸려 하면 `TypeError`로 바로 알 수 있어요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
