id: js-basics.values.variables.we-assignment-1
type: fill_blank
difficulty: 2
concepts:
  - { id: js.values.assignment, weight: 1 }
tags: [assignment, worked-example]
estimatedSeconds: 90
usage: worked_example
workedExampleStage: 1
prompt: |
  **풀이 예제 2단계: 빈칸 채우기**

  앞 단계와 같은 방식의 문제예요. "도장 3개가 있어요. 도장 2개를 더 받고, 4개를 쓴 뒤 남은 개수를 출력하세요."

  풀이의 나머지는 완성되어 있어요. 주석을 읽고, `stamps`의 **지금 값**을 이용해 다시 대입하는 줄 두 개를 채우세요. 실행하면 아래처럼 나와야 해요.

  ```text
  도장: 1
  ```
spec:
  mode: code
  lang: js
  template: |
    // 1. 처음 도장 개수를 stamps에 넣어요.
    let stamps = 3;
    // 2. 도장 2개를 더 받았어요. 지금 값에 2를 더한 결과를 다시 stamps에 넣어요.
    {{blank:add}}
    // 3. 도장 4개를 썼어요. 지금 값에서 4를 뺀 결과를 다시 stamps에 넣어요.
    {{blank:use}}
    // 4. 남은 개수를 출력해요.
    console.log("도장:", stamps);
  blanks:
    - id: add
      accept: ["stamps = stamps + 2;"]
      width: 24
    - id: use
      accept: ["stamps = stamps - 4;"]
      width: 24
  checks:
    - kind: console
      id: output
      description: "\"도장: 1\"이 출력되어야 합니다."
      requirement: 남은 도장 출력
      expect:
        lines: ["도장: 1"]
      misconceptionIfFail: js.mc.assign-direction
    - kind: program
      id: final
      description: 프로그램이 오류 없이 끝나고, 끝났을 때 stamps에는 1이 들어 있어야 합니다.
      requirement: 지금 값으로 다시 대입하기
      expect:
        globals:
          stamps: { equals: 1 }
        noError: true
misconceptions: [js.mc.assign-direction]
hints:
  - "앞 단계 풀이의 `money = money + 500;`이 어떤 순서로 실행됐는지 떠올려 보세요."
  - 바뀔 변수는 `=` 왼쪽에, 지금 값으로 하는 계산은 `=` 오른쪽에 써요.
  - "첫 빈칸은 `stamps = stamps + 2;`예요. 두 번째 빈칸도 같은 모양으로, 이번에는 4를 빼요."
explanation: |
  예시 정답은 다음과 같아요.

  ```js
  stamps = stamps + 2;
  stamps = stamps - 4;
  ```

  | 실행한 줄 | 오른쪽 계산 | 대입 후 `stamps` |
  |---|---|---|
  | `let stamps = 3;` | 3 | 3 |
  | `stamps = stamps + 2;` | 3 + 2 | 5 |
  | `stamps = stamps - 4;` | 5 − 4 | 1 |

  앞 단계 풀이와 같은 모양이에요. 오른쪽을 지금 값으로 계산하고, 결과를 왼쪽 변수에 넣어요. `stamps + 2 = stamps;`처럼 방향을 바꿔 쓰면 왼쪽에 변수가 아니라 계산식이 있어서 `SyntaxError`가 나요. 다음 단계에서는 처음부터 직접 써 봐요.
origin: authored
