id: js-basics.values.variables.we-let-1
type: fill_blank
difficulty: 2
concepts:
  - { id: js.values.let, weight: 1 }
  - { id: js.values.assignment, weight: 0.3 }
tags: [let, worked-example]
estimatedSeconds: 90
usage: worked_example
workedExampleStage: 1
prompt: |
  **풀이 예제 2단계: 빈칸 채우기**

  앞 단계와 같은 방식의 문제예요. "동전 개수를 담을 변수 `coins`를 만들어 5를 넣고 출력한 뒤, 8로 바꿔 다시 출력하세요."

  풀이의 나머지는 완성되어 있어요. 주석을 읽고 빈칸 두 줄을 채우세요. 실행하면 아래처럼 나와야 해요.

  ```text
  동전: 5
  동전: 8
  ```
spec:
  mode: code
  lang: js
  template: |
    // 1. 동전 개수를 담을 변수를 let으로 만들고, 처음 값 5를 넣어요.
    {{blank:declare}}
    console.log("동전:", coins);
    // 2. coins는 이미 만든 변수예요. let 없이 새 값 8을 대입해요.
    {{blank:change}}
    console.log("동전:", coins);
  blanks:
    - id: declare
      accept: ["let coins = 5;"]
      width: 18
    - id: change
      accept: ["coins = 8;"]
      width: 18
  checks:
    - kind: console
      id: output
      description: "\"동전: 5\"와 \"동전: 8\"이 차례로 출력되어야 합니다."
      requirement: 동전 출력
      expect:
        lines: ["동전: 5", "동전: 8"]
      misconceptionIfFail: js.mc.let-again-to-change
    - kind: program
      id: final
      description: 프로그램이 오류 없이 끝나고, 끝났을 때 coins에는 8이 들어 있어야 합니다.
      requirement: 같은 변수의 값 바꾸기
      expect:
        globals:
          coins: { equals: 8 }
        noError: true
misconceptions: [js.mc.let-again-to-change]
hints:
  - "앞 단계 풀이에서 `let score = 0;`과 `score = 10;`이 각각 무슨 일을 했는지 떠올려 보세요."
  - 첫 빈칸은 변수를 새로 만드는 줄, 두 번째 빈칸은 이미 있는 변수의 값을 바꾸는 줄이에요.
  - "첫 빈칸은 `let coins = 5;`예요. 두 번째 빈칸에는 `let`을 쓰지 않고 이름과 `=`와 새 값만 써요."
explanation: |
  예시 정답은 다음과 같아요.

  ```js
  let coins = 5;
  console.log("동전:", coins);
  coins = 8;
  console.log("동전:", coins);
  ```

  앞 단계 풀이와 같은 모양이에요. 변수를 만들 때 한 번만 `let`을 쓰고, 값을 바꿀 때는 `coins = 8;`처럼 대입만 해요.

  두 번째 빈칸에 `let coins = 8;`을 쓰면 이미 있는 이름을 또 만들려는 것이라 `SyntaxError`가 나서 아무것도 출력되지 않아요. 다음 단계에서는 처음부터 직접 써 봐요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
