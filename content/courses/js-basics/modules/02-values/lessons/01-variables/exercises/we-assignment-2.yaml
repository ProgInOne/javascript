id: js-basics.values.variables.we-assignment-2
type: implement_function
difficulty: 2
concepts:
  - { id: js.values.assignment, weight: 1 }
tags: [assignment, worked-example, write-code]
estimatedSeconds: 180
usage: worked_example
workedExampleStage: 2
prompt: |
  **풀이 예제 3단계: 직접 풀기**

  게임 캐릭터의 체력 `hp`가 100에서 시작해요. 시작 코드 아래에 이어서 쓰세요.

  1. 공격을 받아 체력이 30 줄었어요. `hp`의 지금 값에서 30을 빼서 다시 넣고 출력하세요.
  1. 물약을 먹어 체력이 20 늘었어요. `hp`의 지금 값에 20을 더해서 다시 넣고 출력하세요.

  `70`, `90` 같은 결과 숫자를 직접 쓰지 말고, 지금 값으로 계산하는 대입을 쓰세요. 실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  체력: 100
  체력: 70
  체력: 90
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          let hp = 100;
          console.log("체력:", hp);

          // 1. 공격: hp에서 30을 빼서 다시 넣고 출력하세요.

          // 2. 물약: hp에 20을 더해서 다시 넣고 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          let hp = 100;
          console.log("체력:", hp);

          // 1. 공격: hp에서 30을 빼서 다시 넣고 출력하세요.
          hp = hp - 30;
          console.log("체력:", hp);
          // 2. 물약: hp에 20을 더해서 다시 넣고 출력하세요.
          hp = hp + 20;
          console.log("체력:", hp);
  checks:
    - kind: console
      id: output
      description: "\"체력: 100\", \"체력: 70\", \"체력: 90\"이 차례로 출력되어야 합니다."
      requirement: 체력 변화 출력
      expect:
        lines: ["체력: 100", "체력: 70", "체력: 90"]
      misconceptionIfFail: js.mc.assign-is-equality
    - kind: program
      id: final
      description: 프로그램이 오류 없이 끝나고, 끝났을 때 hp에는 90이 들어 있어야 합니다.
      requirement: 지금 값으로 다시 대입하기
      expect:
        globals:
          hp: { equals: 90 }
        noError: true
misconceptions: [js.mc.assign-is-equality]
hints:
  - 앞 단계의 도장 문제처럼 "계산 → 다시 넣기 → 출력"을 두 번 하면 돼요.
  - 대입 줄은 `hp = hp - 30;`처럼 왼쪽에 바뀔 변수, 오른쪽에 지금 값으로 하는 계산을 써요.
  - "공격 줄 다음에 `console.log(\"체력:\", hp);`로 출력하고, 물약도 같은 모양으로 `hp = hp + 20;`을 쓴 뒤 출력해요."
explanation: |
  예시 정답은 다음과 같아요.

  ```js
  hp = hp - 30;
  console.log("체력:", hp);
  hp = hp + 20;
  console.log("체력:", hp);
  ```

  | 실행한 줄 | 오른쪽 계산 | 대입 후 `hp` |
  |---|---|---|
  | `let hp = 100;` | 100 | 100 |
  | `hp = hp - 30;` | 100 − 30 | 70 |
  | `hp = hp + 20;` | 70 + 20 | 90 |

  앞 두 단계에서 본 풀이와 같은 모양이에요. 결과 숫자를 직접 쓰지 않고 지금 값으로 계산해야, 처음 체력이 바뀌어도 프로그램이 맞게 동작해요. 원래 연습으로 돌아가 다시 풀어 보세요.
origin: authored
