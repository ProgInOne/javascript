id: js-basics.values.variables.fix-hyphen-name
type: fix_bug
difficulty: 3
concepts:
  - { id: js.values.identifiers, weight: 1 }
  - { id: js.errors.error-messages, weight: 0.3 }
tags: [identifiers, syntax-error, debugging]
estimatedSeconds: 240
prompt: |
  배달 주문의 총액을 계산하는 프로그램인데, 실행하면 아무것도 출력되지 않고 오류가 나요. 변수 이름을 규칙에 맞게 고쳐서 아래처럼 출력되게 하세요.

  ```text
  음식값: 18000
  총액: 21000
  ```

  ProgInOne에서 실행했을 때의 오류 메시지는 다음과 같아요. Chrome 개발자 도구에서는 `Unexpected token '-'`처럼 어떤 기호가 문제인지까지 알려 줘요.

  ```text
  SyntaxError: Unexpected token (1번째 줄)
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          let food-price = 18000;
          const deliveryFee = 3000;
          console.log("음식값:", food-price);
          console.log("총액:", food-price + deliveryFee);
  solution:
    files:
      - path: main.js
        content: |
          let foodPrice = 18000;
          const deliveryFee = 3000;
          console.log("음식값:", foodPrice);
          console.log("총액:", foodPrice + deliveryFee);
  bugDescription: 실행하면 아무것도 출력되지 않고 SyntaxError가 나요.
  bugMisconception: js.mc.identifier-invalid-chars
  checks:
    - kind: console
      id: output
      description: 음식값 18000과 총액 21000이 차례로 출력되어야 합니다.
      requirement: 금액 출력
      expect:
        lines: ["음식값: 18000", "총액: 21000"]
misconceptions: [js.mc.identifier-invalid-chars]
hints:
  - "`Unexpected token`은 \"여기에 이게 올 줄 몰랐어요\"라는 뜻이에요. Chrome은 그 기호가 `-`라고 알려 줘요. 1번째 줄의 어느 이름에 `-`가 들어 있나요?"
  - 이름 안의 하이픈은 빼기 기호로 읽혀요. 여러 단어로 된 이름은 어떤 관례로 이어 쓴다고 했나요?
  - 이름을 바꿀 때는 그 이름을 쓰는 **모든 줄**을 똑같이 바꿔야 해요. 몇 군데인지 세어 보세요.
explanation: |
  `food-price`의 하이픈(`-`)은 빼기 기호로 읽혀요. 그래서 1번 줄 `let food-price = 18000;`은 "let food 빼기 price"라는 이상한 문장이 되어 `SyntaxError: Unexpected token`(Chrome에서는 `Unexpected token '-'`)이 났어요. 문법 오류라 아무 줄도 실행되지 않았어요.

  여러 단어는 camelCase로 이어 써서 `foodPrice`로 바꿔요. 이때 **이름을 쓰는 세 곳(1, 3, 4번 줄)을 모두** 똑같이 바꿔야 해요. 1번 줄만 고치면 3번 줄의 `food-price`가 `food - price`라는 계산으로 읽혀 이번에는 `ReferenceError: food is not defined`가 나요.

  `food_price`처럼 밑줄을 써도 규칙에는 맞지만, JavaScript에서는 camelCase가 관례예요.
origin: authored
review:
