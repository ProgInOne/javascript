id: js-basics.values.variables.impl-swap-values
type: implement_function
difficulty: 3
concepts:
  - { id: js.values.assignment, weight: 1 }
  - { id: js.values.let, weight: 0.3 }
tags: [assignment, swap, write-code]
estimatedSeconds: 300
prompt: |
  왼손(`left`)에는 사과, 오른손(`right`)에는 배를 들고 있어요. 두 손의 과일을 서로 바꾸는 코드를 가운데 빈 곳에 작성하세요.

  - 위의 두 줄(변수 만들기)과 두 console.log는 그대로 두세요.
  - `"사과"`, `"배"` 글자를 다시 쓰지 말고, **변수와 대입만으로** 바꿔야 해요. 필요하면 새 변수를 만들어도 돼요.

  실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  사과 배
  배 사과
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          let left = "사과";
          let right = "배";
          console.log(left, right);

          // 여기에 두 변수의 값을 서로 바꾸는 코드를 쓰세요.

          console.log(left, right);
  solution:
    files:
      - path: main.js
        content: |
          let left = "사과";
          let right = "배";
          console.log(left, right);

          let temp = left;
          left = right;
          right = temp;

          console.log(left, right);
  checks:
    - kind: console
      id: output
      description: 바꾸기 전 "사과 배", 바꾼 뒤 "배 사과"가 차례로 출력되어야 합니다.
      requirement: 두 값 바꾸기
      expect:
        lines: ["사과 배", "배 사과"]
      misconceptionIfFail: js.mc.variable-remembers-formula
    - kind: program
      id: swapped
      description: 프로그램이 오류 없이 끝나고, 끝났을 때 left에는 "배", right에는 "사과"가 들어 있어야 합니다.
      requirement: 변수 값 바꾸기
      expect:
        globals:
          left: { equals: "배" }
          right: { equals: "사과" }
        noError: true
misconceptions: [js.mc.variable-remembers-formula]
hints:
  - "`left = right;`부터 쓰면 어떻게 될지 \"이름 → 값\" 표로 따라가 보세요. 원래 `left`에 있던 사과는 어디로 갈까요?"
  - 대입하면 원래 값은 덮어써져서 사라져요. 한쪽 값이 사라지기 전에 잠깐 맡겨 둘 세 번째 변수가 필요해요.
  - 사과를 맡겨 둘 변수(예를 들어 `temp`)를 먼저 만들어 `left`의 값을 넣어 두세요. 그다음 대입 두 번으로 과일을 옮기는데, 어느 변수를 먼저 덮어써도 안전한지 표로 확인해 보세요.
explanation: |
  예시 정답은 세 줄이에요.

  ```js
  let temp = left;
  left = right;
  right = temp;
  ```

  | 실행한 줄 | `left` | `right` | `temp` |
  |---|---|---|---|
  | 시작 | 사과 | 배 | (아직 없음) |
  | `let temp = left;` | 사과 | 배 | 사과 |
  | `left = right;` | 배 | 배 | 사과 |
  | `right = temp;` | 배 | 사과 | 사과 |

  `left = right;`를 실행하면 `left`에 있던 사과는 덮어써져서 사라져요. 그래서 그 전에 `temp`에 사과를 맡겨 두는 거예요.

  `left = "배";`처럼 글자를 다시 써도 출력은 같지만, 값을 미리 모르는 실제 프로그램에서는 쓸 수 없어요. 이 문제의 목표는 대입만으로 바꾸는 거예요.

  `left = right;` 다음에 바로 `right = left;`를 쓰면 둘 다 `배`가 돼요. 두 번째 대입이 실행될 때 `left`는 이미 배로 바뀌었기 때문이에요. 대입은 식이나 다른 변수를 기억하지 않고, **그 순간의 값**을 복사한다는 점을 표로 확인해 보세요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
