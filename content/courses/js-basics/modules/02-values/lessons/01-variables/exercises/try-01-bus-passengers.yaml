id: js-basics.values.variables.try-bus-passengers
type: implement_function
difficulty: 2
usage: try
concepts:
  - { id: js.values.assignment, weight: 1 }
  - { id: js.values.let, weight: 0.5 }
tags: [let, assignment, reassignment, write-code]
estimatedSeconds: 240
prompt: |
  버스의 승객 수를 변수 하나로 기록해 보세요. 주석의 순서대로 직접 코드를 써요.

  `7`, `14` 같은 결과 숫자를 직접 쓰지 말고, `passengers`의 **지금 값**으로 계산해서 다시 대입하세요. 실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  승객 수: 12
  승객 수: 7
  승객 수: 14
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          // 1. passengers 변수를 만들어 12를 넣고, "승객 수:"와 함께 출력하세요.

          // 2. 정류장에서 5명이 내렸어요. passengers의 지금 값에서 5를 뺀 값을 다시 넣고 출력하세요.

          // 3. 7명이 탔어요. passengers의 지금 값에 7을 더한 값을 다시 넣고 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          // 1. passengers 변수를 만들어 12를 넣고, "승객 수:"와 함께 출력하세요.
          let passengers = 12;
          console.log("승객 수:", passengers);
          // 2. 정류장에서 5명이 내렸어요. passengers의 지금 값에서 5를 뺀 값을 다시 넣고 출력하세요.
          passengers = passengers - 5;
          console.log("승객 수:", passengers);
          // 3. 7명이 탔어요. passengers의 지금 값에 7을 더한 값을 다시 넣고 출력하세요.
          passengers = passengers + 7;
          console.log("승객 수:", passengers);
  checks:
    - kind: console
      id: output
      description: 승객 수가 12, 7, 14 순서로 세 줄 출력되어야 합니다.
      requirement: 세 줄 출력
      expect:
        lines: ["승객 수: 12", "승객 수: 7", "승객 수: 14"]
    - kind: program
      id: final-value
      description: 프로그램이 끝났을 때 변수 `passengers`에 14가 들어 있어야 합니다.
      requirement: passengers의 마지막 값
      expect: { globals: { passengers: { equals: 14 } }, noError: true }
misconceptions: [js.mc.let-again-to-change]
hints:
  - 1번은 `let`으로 변수를 만드는 문장과 `console.log` 문장, 두 줄이에요.
  - 값을 바꿀 때는 `let`을 다시 쓰지 않아요. `passengers = ...;`처럼 대입만 해요.
  - "2번은 `passengers = passengers - 5;`처럼 써요. 오른쪽의 `passengers`는 그 순간의 값으로 바뀌어 계산돼요."
explanation: |
  예시 답안은 다음과 같아요.

  ```js
  let passengers = 12;
  console.log("승객 수:", passengers);
  passengers = passengers - 5;
  console.log("승객 수:", passengers);
  passengers = passengers + 7;
  console.log("승객 수:", passengers);
  ```

  - `let`은 처음 만들 때 한 번만 써요. 다시 쓰면 `SyntaxError`가 나요.
  - `passengers = passengers - 5;`는 오른쪽(12 - 5 = 7)을 먼저 계산한 뒤 그 값을 `passengers`에 넣어요.
  - 다음 줄의 `passengers + 7`에서 쓰는 값은 처음 값 12가 아니라 지금 값 7이에요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
