id: js-basics.values.variables.fix-let-twice
type: fix_bug
difficulty: 3
concepts:
  - { id: js.values.let, weight: 1 }
  - { id: js.errors.error-types, weight: 0.3 }
tags: [let, syntax-error, debugging]
estimatedSeconds: 150
prompt: |
  걸음 수를 기록하는 프로그램인데, 실행하면 아무것도 출력되지 않고 오류가 나요. 고쳐서 아래처럼 출력되게 하세요.

  ```text
  아침 걸음 수: 3000
  저녁 걸음 수: 8000
  ```

  실행했을 때의 오류 메시지는 다음과 같아요.

  ```text
  Uncaught SyntaxError: Identifier 'steps' has already been declared
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          let steps = 3000;
          console.log("아침 걸음 수:", steps);
          let steps = 8000;
          console.log("저녁 걸음 수:", steps);
  solution:
    files:
      - path: main.js
        content: |
          let steps = 3000;
          console.log("아침 걸음 수:", steps);
          steps = 8000;
          console.log("저녁 걸음 수:", steps);
  bugDescription: 실행하면 아무것도 출력되지 않고 SyntaxError가 나요.
  bugMisconception: js.mc.let-again-to-change
  maxEditDistance: 2
  checks:
    - kind: console
      id: output
      description: 아침과 저녁 걸음 수가 차례로 출력되어야 합니다.
      requirement: 두 줄 출력
      expect:
        lines: ["아침 걸음 수: 3000", "저녁 걸음 수: 8000"]
    - kind: program
      id: final-steps
      description: 프로그램이 끝났을 때 steps에는 8000이 들어 있어야 합니다.
      requirement: steps 값 바꾸기
      expect:
        globals:
          steps: { equals: 8000 }
misconceptions: [js.mc.let-again-to-change]
hints:
  - "`Identifier 'steps' has already been declared`는 \"steps라는 이름은 이미 만들어졌어요\"라는 뜻이에요. 어디서 처음 만들었고, 어디서 또 만들려 했나요?"
  - 변수는 처음 만들 때와 값을 바꿀 때 쓰는 모양이 달라요. 3번 줄은 둘 중 무엇을 하려는 문장인가요?
  - "`let`은 변수를 처음 만들 때 한 번만 써요."
explanation: |
  3번 줄 `let steps = 8000;`이 문제예요. `let`은 새 변수를 만드는 선언인데, `steps`는 1번 줄에서 이미 만들었어요. 같은 이름으로 두 번 만들 수 없어서 `SyntaxError: Identifier 'steps' has already been declared`가 났어요. 문법 오류라 1~2번 줄도 실행되지 않았어요.

  3번 줄은 값을 바꾸려는 문장이므로 `let`을 빼고 `steps = 8000;`이라고 대입만 하면 돼요.

  다른 이름(`let eveningSteps = 8000;`)을 새로 만들어도 출력은 맞출 수 있지만, 이 문제의 목표는 같은 변수의 값을 바꾸는 거예요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
