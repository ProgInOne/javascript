id: js-basics.values.variables.fill-choose-const-let
type: fill_blank
difficulty: 3
concepts:
  - { id: js.values.const, weight: 1 }
  - { id: js.values.let, weight: 0.5 }
tags: [const, let]
estimatedSeconds: 75
prompt: |
  "바뀌지 않는 값은 `const`, 다시 대입해야 하는 값은 `let`" 규칙에 따라 빈칸에 `const` 또는 `let`을 쓰세요. 코드 전체가 오류 없이 실행되어야 해요.
spec:
  mode: text
  template: |
    {{blank:k1}} birthYear = 2001;
    {{blank:k2}} level = 1;
    {{blank:k3}} maxLevel = 50;
    level = level + 1;
    console.log(birthYear, level, maxLevel);
  blanks:
    - id: k1
      accept: ["const"]
      width: 6
    - id: k2
      accept: ["let"]
      width: 6
      misconceptionMap:
        const: js.mc.const-can-reassign
    - id: k3
      accept: ["const"]
      width: 6
hints:
  - 셋 중 아래에서 다시 대입되는 변수가 있는지 찾아보세요.
  - 다시 대입되는 변수를 const로 만들면 실행할 때 어떤 오류가 날까요?
  - 4번 줄에서 값이 바뀌는 변수 하나만 let이고, 나머지는 규칙대로 const예요.
explanation: |
  정답은 `const birthYear`, `let level`, `const maxLevel`이에요.

  - `birthYear`(태어난 해)와 `maxLevel`(최대 레벨)은 프로그램에서 다시 대입하지 않아요. 바뀌면 안 되는 값이니 `const`로 만들어 실수를 막아요.
  - `level`은 4번 줄에서 `level = level + 1;`로 다시 대입해요. `const`로 만들면 그 줄에서 `TypeError: Assignment to constant variable.`이 나므로 `let`이어야 해요.

  `birthYear`나 `maxLevel`에 `let`을 써도 프로그램은 실행되지만, 이 문제는 "바뀌지 않는 값은 const" 규칙을 연습하는 문제예요. 먼저 `const`로 쓰고, 다시 대입해야 할 때만 `let`으로 바꾸는 습관을 들여요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
