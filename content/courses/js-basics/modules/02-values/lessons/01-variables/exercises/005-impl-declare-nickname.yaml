id: js-basics.values.variables.impl-declare-nickname
type: implement_function
difficulty: 2
concepts:
  - { id: js.values.let, weight: 1 }
  - { id: js.basics.console-log, weight: 0.3 }
tags: [let, write-code]
estimatedSeconds: 120
prompt: |
  `nickname`이라는 변수를 만들어 글자 `코딩왕`을 넣고, 그 **변수를 써서** 콘솔에 아래처럼 출력하는 프로그램을 작성하세요.

  ```text
  내 별명: 코딩왕
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          // 1. nickname 변수를 만드세요.

          // 2. nickname을 써서 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          // 1. nickname 변수를 만드세요.
          let nickname = "코딩왕";
          // 2. nickname을 써서 출력하세요.
          console.log("내 별명:", nickname);
  checks:
    - kind: console
      id: output
      description: "\"내 별명: 코딩왕\"이 출력되어야 합니다."
      requirement: 별명 출력
      expect:
        lines: ["내 별명: 코딩왕"]
    - kind: program
      id: has-nickname
      description: 프로그램이 오류 없이 끝나고, nickname이라는 변수에 "코딩왕"이 들어 있어야 합니다.
      requirement: nickname 변수 만들기
      expect:
        globals:
          nickname: { equals: "코딩왕" }
        noError: true
misconceptions: [js.mc.variable-name-in-quotes]
hints:
  - 문장이 두 개 필요해요. 변수를 만드는 문장과 출력하는 문장이에요.
  - 변수를 만드는 문장은 `let` + 이름 + `=` + 값 + `;` 모양이에요. 넣을 값은 글자이니 따옴표로 감싸고, 변수 이름에는 따옴표를 붙이지 않아요.
  - 출력할 때는 글자 `"내 별명:"`과 변수 `nickname`을 쉼표로 나눠 console.log의 괄호 안에 넣어요. 변수 이름에 따옴표를 붙이면 어떻게 될지 생각해 보세요.
explanation: |
  예시 정답은 다음과 같아요.

  ```js
  let nickname = "코딩왕";
  console.log("내 별명:", nickname);
  ```

  - 넣을 값 `코딩왕`은 글자라서 따옴표로 감싸요. 반대로 변수 이름 `nickname`에는 따옴표를 붙이지 않아요. `console.log("내 별명:", "nickname");`이라고 쓰면 변수와 상관없는 글자 `nickname`이 나와요.
  - 쉼표로 나눈 두 값은 한 칸 띄어서 나오므로 `내 별명: 코딩왕`이 돼요.
  - `let`을 빼고 `nickname = "코딩왕";`이라고 쓰면 `ReferenceError: nickname is not defined`가 나요. 변수는 꼭 `let`(또는 `const`)으로 먼저 만들어요.

  `const nickname = "코딩왕";`도 정답이에요. 이 프로그램에서는 별명을 다시 대입하지 않으니 오히려 `const`가 더 알맞아요.
origin: authored
