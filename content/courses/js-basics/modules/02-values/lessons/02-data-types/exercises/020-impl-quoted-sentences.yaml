id: js-basics.values.data-types.impl-quoted-sentences
type: implement_function
difficulty: 3
concepts:
  - { id: js.types.string, weight: 1 }
  - { id: js.basics.console-log, weight: 0.3 }
tags: [string, quotes, write-code]
estimatedSeconds: 210
prompt: |
  만화의 말풍선 대사를 출력하는 프로그램을 작성하세요.

  1. 아래 세 문장을 각각 `first`, `second`, `third` 변수에 문자열로 담아요. 문장 안의 따옴표도 문자열의 일부예요.
  1. 세 변수를 차례로 출력해요.

  실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  민수가 "같이 놀자!"라고 말했어요
  지아는 '좋아'라고 답했어요
  ""는 글자가 없는 문자열이에요
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          // 세 문장을 first, second, third 변수에 담고 차례로 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          const first = '민수가 "같이 놀자!"라고 말했어요';
          const second = "지아는 '좋아'라고 답했어요";
          const third = '""는 글자가 없는 문자열이에요';
          console.log(first);
          console.log(second);
          console.log(third);
  checks:
    - kind: console
      id: output
      description: 세 문장이 안의 따옴표까지 그대로 차례로 출력되어야 합니다.
      requirement: 세 문장 출력
      expect:
        lines:
          - 민수가 "같이 놀자!"라고 말했어요
          - 지아는 '좋아'라고 답했어요
          - '""는 글자가 없는 문자열이에요'
      misconceptionIfFail: js.mc.quotes-mismatch
    - kind: program
      id: variables
      description: 프로그램이 오류 없이 끝나고, first, second, third에 세 문장이 차례로 들어 있어야 합니다.
      requirement: 변수에 담기
      expect:
        globals:
          first: { equals: '민수가 "같이 놀자!"라고 말했어요' }
          second: { equals: "지아는 '좋아'라고 답했어요" }
          third: { equals: '""는 글자가 없는 문자열이에요' }
        noError: true
misconceptions: [js.mc.quotes-mismatch]
hints:
  - 문장마다 안에 어떤 따옴표가 들어 있는지 먼저 확인하세요.
  - 문자열은 연 따옴표와 같은 종류의 따옴표를 만나면 끝나요. 바깥 따옴표는 안에 있는 따옴표와 어떤 관계여야 할까요?
  - 안에 큰따옴표가 있는 문장은 작은따옴표로, 안에 작은따옴표가 있는 문장은 큰따옴표로 감싸요. 세 번째 문장 맨 앞의 `""`도 큰따옴표 두 개예요.
explanation: |
  예시 정답은 다음과 같아요.

  ```js
  const first = '민수가 "같이 놀자!"라고 말했어요';
  const second = "지아는 '좋아'라고 답했어요";
  const third = '""는 글자가 없는 문자열이에요';
  console.log(first);
  console.log(second);
  console.log(third);
  ```

  - `first`와 `third`는 안에 큰따옴표가 있으니 바깥을 작은따옴표로 감싸요. 바깥도 큰따옴표면 안쪽 첫 큰따옴표에서 문자열이 끝나서 `SyntaxError`가 나요.
  - `second`는 안에 작은따옴표가 있으니 바깥을 큰따옴표로 감싸요.
  - 바깥 따옴표는 값의 일부가 아니라서 출력되지 않고, 안쪽 따옴표만 글자로 출력돼요.

  `let`으로 만들어도 정답이에요. 백틱(`` ` ``)으로 감싸도 세 문장 모두 담을 수 있는데, 백틱은 모듈 7에서 자세히 배워요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
