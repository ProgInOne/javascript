id: js-basics.values.data-types.impl-typeof-report
type: implement_function
difficulty: 3
concepts:
  - { id: js.types.typeof, weight: 1 }
  - { id: js.types.primitives, weight: 0.5 }
  - { id: js.values.assignment, weight: 0.3 }
tags: [typeof, primitives, assignment, write-code]
estimatedSeconds: 200
prompt: |
  한 변수에 자료형이 다른 값을 차례로 넣으면서, 그때마다 `typeof`로 자료형을 확인하는 프로그램을 완성하세요.

  1. `value`의 자료형을 출력해요.
  1. `value`에 문자열 `"2024"`를 대입하고, 자료형을 다시 출력해요.
  1. `value`에 불리언 `true`를 대입하고, 자료형을 다시 출력해요.

  실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  number
  string
  boolean
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          let value = 2024;
          // 1. value의 자료형을 출력하세요.

          // 2. value에 문자열 "2024"를 대입하고, 자료형을 출력하세요.

          // 3. value에 불리언 true를 대입하고, 자료형을 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          let value = 2024;
          // 1. value의 자료형을 출력하세요.
          console.log(typeof value);
          // 2. value에 문자열 "2024"를 대입하고, 자료형을 출력하세요.
          value = "2024";
          console.log(typeof value);
          // 3. value에 불리언 true를 대입하고, 자료형을 출력하세요.
          value = true;
          console.log(typeof value);
  checks:
    - kind: console
      id: output
      description: 대입할 때마다 value의 자료형이 number, string, boolean 순서로 출력되어야 합니다.
      requirement: 자료형 출력
      expect:
        lines: ["number", "string", "boolean"]
    - kind: program
      id: final-value
      description: 프로그램이 오류 없이 끝나고, 끝났을 때 value에는 불리언 true가 들어 있어야 합니다.
      requirement: 같은 변수에 대입하기
      expect:
        globals:
          value: { equals: true }
        noError: true
      misconceptionIfFail: js.mc.type-belongs-to-variable
misconceptions: [js.mc.type-belongs-to-variable]
hints:
  - 자료형을 출력하려면 `console.log` 안에 무엇을 넣어야 할까요?
  - 같은 변수에 새 값을 넣을 때는 `let`을 다시 쓰지 않고 대입만 해요. 숫자를 넣었던 변수에 문자열을 넣어도 될까요?
  - "`console.log(typeof value);`를 세 번 쓰되, 두 번째와 세 번째 앞에는 각각 `value = ...;` 대입을 한 줄씩 넣어요."
explanation: |
  예시 정답은 다음과 같아요.

  ```js
  let value = 2024;
  console.log(typeof value);
  value = "2024";
  console.log(typeof value);
  value = true;
  console.log(typeof value);
  ```

  - `typeof value`는 변수 `value` 자체가 아니라 **그 순간 들어 있는 값**의 자료형을 알려 줘요. 그래서 같은 코드가 세 번 다른 결과를 내요.
  - 숫자를 넣었던 변수에 문자열과 불리언을 대입해도 오류가 나지 않아요. 자료형은 변수가 아니라 값에 붙어 있기 때문이에요.
  - 값을 바꿀 때 `let value = "2024";`처럼 `let`을 다시 쓰면 `SyntaxError: Identifier 'value' has already been declared`가 나요.

  `console.log("number");`처럼 결과를 직접 적어도 출력은 같지만, 이 문제의 목표는 typeof로 확인하는 연습이에요. 값을 미리 알 수 없는 실제 프로그램에서는 typeof로 확인해야 해요.
origin: authored
