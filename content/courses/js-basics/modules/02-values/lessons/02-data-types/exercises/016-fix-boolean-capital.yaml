id: js-basics.values.data-types.fix-boolean-capital
type: fix_bug
difficulty: 2
concepts:
  - { id: js.types.boolean, weight: 1 }
  - { id: js.errors.error-types, weight: 0.3 }
tags: [boolean, reference-error, debugging]
estimatedSeconds: 100
prompt: |
  다른 프로그래밍 언어를 쓰던 친구가 만든 로그인 상태 프로그램이에요. 실행하면 오류가 나요.

  ```text
  ReferenceError: True is not defined (1번째 줄)
  ```

  고쳐서 아래처럼 나오게 하세요. `isLoggedIn`과 `hasCoupon`에는 불리언 값이 들어 있어야 해요.

  ```text
  로그인: true
  쿠폰 있음: false
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          let isLoggedIn = True;
          let hasCoupon = False;
          console.log("로그인:", isLoggedIn);
          console.log("쿠폰 있음:", hasCoupon);
  solution:
    files:
      - path: main.js
        content: |
          let isLoggedIn = true;
          let hasCoupon = false;
          console.log("로그인:", isLoggedIn);
          console.log("쿠폰 있음:", hasCoupon);
  bugDescription: 실행하면 첫 줄에서 ReferenceError가 나요.
  bugMisconception: js.mc.boolean-capitalized
  maxEditDistance: 4
  checks:
    - kind: console
      id: output
      description: 로그인 상태와 쿠폰 상태가 차례로 출력되어야 합니다.
      requirement: 상태 출력
      expect:
        lines: ["로그인: true", "쿠폰 있음: false"]
    - kind: program
      id: booleans
      description: 프로그램이 끝났을 때 isLoggedIn에는 불리언 true, hasCoupon에는 불리언 false가 들어 있어야 합니다.
      requirement: 불리언으로 담기
      expect:
        globals:
          isLoggedIn: { equals: true }
          hasCoupon: { equals: false }
      misconceptionIfFail: js.mc.quoted-boolean
misconceptions: [js.mc.boolean-capitalized, js.mc.quoted-boolean]
hints:
  - "`True is not defined`는 \"True라는 이름이 없어요\"라는 뜻이에요. JavaScript는 `True`를 무엇으로 읽었을까요?"
  - JavaScript는 대문자와 소문자를 다른 글자로 봐요. 불리언 값은 어떻게 썼었나요?
  - 불리언은 소문자이고 따옴표가 없어요. 1번 줄을 고치고 다시 실행하면 다음 줄에서도 같은 종류의 오류가 나는지 확인하세요.
explanation: |
  1번과 2번 줄이 문제예요. JavaScript의 불리언은 소문자 `true`, `false`뿐이에요.

  `True`라고 쓰면 JavaScript는 불리언이 아니라 **이름**으로 읽어요. 그런 변수는 없으니 `ReferenceError: True is not defined`가 나요. 1번 줄을 고치면 2번 줄의 `False`에서 같은 오류가 나요. 둘 다 소문자로 고쳐요.

  ```js
  let isLoggedIn = true;
  let hasCoupon = false;
  ```

  `"true"`, `"false"`처럼 따옴표를 붙여도 출력 모양은 같지만, 그러면 불리언이 아니라 문자열이 들어가서 두 번째 요구사항을 통과하지 못해요. Python 같은 다른 언어에서는 `True`, `False`라고 써서 헷갈리기 쉬워요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
