id: js-basics.values.data-types.check-typeof-null-string
type: predict_output
difficulty: 2
usage: check
concepts:
  - { id: js.types.typeof, weight: 1 }
tags: [typeof, "null"]
estimatedSeconds: 60
prompt: |
  다음 프로그램을 실행하면 콘솔에 무엇이 출력되나요? 콘솔에 보이는 그대로 적어 주세요.
spec:
  lang: js
  code: |
    console.log(typeof "null", typeof null);
  answerKind: console
  misconceptionByAnswer:
    "string null": js.mc.typeof-null-is-null
    "null null": js.mc.typeof-reads-content
    "null object": js.mc.typeof-reads-content
misconceptions: [js.mc.typeof-null-is-null, js.mc.typeof-reads-content]
hints:
  - 두 값의 차이는 따옴표뿐이에요. 따옴표로 감싼 값은 어떤 자료형인가요?
  - "`typeof`는 안의 글자가 아니라 값의 자료형을 봐요."
  - 따옴표 없는 `null`의 `typeof` 결과는 설계 실수로 남은 특별한 예외예요.
explanation: |
  정답은 `string object`예요.

  - `"null"`은 따옴표로 감싼 네 글자 문자열이라 `string`이에요. 내용이 `null`처럼 보여도 상관없어요.
  - 따옴표 없는 `null`의 `typeof`는 `"object"`예요. JavaScript를 처음 만들 때의 설계 실수가 남은 것일 뿐, `null`이 객체라는 뜻은 아니에요.
