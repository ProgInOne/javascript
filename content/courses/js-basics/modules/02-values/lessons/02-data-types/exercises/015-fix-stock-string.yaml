id: js-basics.values.data-types.fix-stock-string
type: fix_bug
difficulty: 3
concepts:
  - { id: js.types.primitives, weight: 1 }
  - { id: js.types.number, weight: 0.3 }
tags: [primitives, number, string, debugging]
estimatedSeconds: 150
prompt: |
  문구점의 공책 재고를 관리하는 프로그램이에요. 공책 3권이 새로 들어왔는데 재고가 이상하게 나와요. 오류 메시지는 없어요.

  지금 실행하면 이렇게 나와요.

  ```text
  처음 재고: 12
  입고 후 재고: 123
  ```

  고쳐서 아래처럼 나오게 하세요.

  ```text
  처음 재고: 12
  입고 후 재고: 15
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          let stock = "12";
          console.log("처음 재고:", stock);
          stock = stock + 3;
          console.log("입고 후 재고:", stock);
  solution:
    files:
      - path: main.js
        content: |
          let stock = 12;
          console.log("처음 재고:", stock);
          stock = stock + 3;
          console.log("입고 후 재고:", stock);
  bugDescription: 공책 3권이 들어왔는데 재고가 15가 아니라 123으로 나와요.
  bugMisconception: js.mc.quoted-number-is-number
  maxEditDistance: 3
  checks:
    - kind: console
      id: output
      description: 처음 재고 12와 입고 후 재고 15가 차례로 출력되어야 합니다.
      requirement: 재고 출력
      expect:
        lines: ["처음 재고: 12", "입고 후 재고: 15"]
    - kind: program
      id: stock-is-number
      description: 프로그램이 끝났을 때 stock에는 숫자 15가 들어 있어야 합니다.
      requirement: 재고를 숫자로 계산
      expect:
        globals:
          stock: { equals: 15 }
misconceptions: [js.mc.quoted-number-is-number]
hints:
  - "`12`에 `3`을 더했는데 `123`이 됐어요. 더한 게 아니라 무엇을 한 것 같나요?"
  - 숫자와 문자열 중 어느 쪽이 끼면 `+`가 글자를 이어 붙였나요? `stock`에 처음 넣은 값의 자료형을 확인해 보세요.
  - 1번 줄의 `"12"`는 따옴표 때문에 문자열이에요. 재고처럼 계산할 값은 어떤 자료형이어야 할까요?
explanation: |
  1번 줄 `let stock = "12";`가 원인이에요. 따옴표 때문에 `stock`에는 숫자가 아니라 문자열 `"12"`가 들어 있어요.

  문자열에 `+`를 쓰면 더하기 대신 글자를 이어 붙여서, 3번 줄의 `stock + 3`은 `"12"` 뒤에 `3`을 붙인 `"123"`이 돼요. 2번 줄에서는 콘솔이 따옴표를 보여 주지 않아 숫자처럼 보였기 때문에 알아채기 어려웠어요.

  따옴표를 빼고 `let stock = 12;`로 고치면 `12 + 3`이 계산되어 15가 나와요.

  3번 줄을 `stock = 15;`로 바꿔도 출력은 맞지만, 재고가 문자열인 한 다음 입고 때 같은 버그가 또 생겨요. 계산할 값은 처음부터 숫자로 담아요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
