id: js-basics.values.data-types.fix-price-comma
type: fix_bug
difficulty: 2
concepts:
  - { id: js.types.number, weight: 1 }
  - { id: js.errors.error-types, weight: 0.3 }
tags: [number, comma, syntax-error, debugging]
estimatedSeconds: 100
prompt: |
  치킨 두 마리 값을 계산하는 프로그램인데, 실행하면 아무것도 출력되지 않고 오류가 나요.

  ```text
  SyntaxError: Unexpected number (1번째 줄)
  ```

  고쳐서 아래처럼 나오게 하세요. 가격은 계산할 수 있게 숫자로 두어야 해요.

  ```text
  한 마리: 18000
  두 마리: 36000
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          const chickenPrice = 18,000;
          console.log("한 마리:", chickenPrice);
          console.log("두 마리:", chickenPrice * 2);
  solution:
    files:
      - path: main.js
        content: |
          const chickenPrice = 18000;
          console.log("한 마리:", chickenPrice);
          console.log("두 마리:", chickenPrice * 2);
  bugDescription: 실행하면 아무것도 출력되지 않고 SyntaxError가 나요.
  bugMisconception: js.mc.number-with-comma
  maxEditDistance: 3
  checks:
    - kind: console
      id: output
      description: 한 마리 값과 두 마리 값이 차례로 출력되어야 합니다.
      requirement: 가격 출력
      expect:
        lines: ["한 마리: 18000", "두 마리: 36000"]
    - kind: program
      id: price-number
      description: 프로그램이 끝났을 때 chickenPrice에는 숫자 18000이 들어 있어야 합니다.
      requirement: 가격을 숫자로
      expect:
        globals:
          chickenPrice: { equals: 18000 }
misconceptions: [js.mc.number-with-comma]
hints:
  - "`Unexpected number`는 \"여기에 숫자가 올 줄 몰랐어요\"라는 뜻이에요. 1번 줄에서 숫자가 두 번 나오는 곳이 있나요?"
  - 코드에서 쉼표는 어떤 역할을 하는 기호였나요?
  - 쉼표는 값과 값을 나누는 기호라서, `18,000`은 한 숫자가 아니라 `18`과 `000`으로 나뉘어 읽혀요.
explanation: |
  1번 줄의 `18,000`이 문제예요. 종이에 쓰듯 쉼표로 자릿수를 나눴지만, 코드에서 쉼표는 값과 값을 나누는 기호예요.

  JavaScript는 `const chickenPrice = 18`까지 읽은 뒤 쉼표 다음에 또 숫자 `000`이 나오자 "여기에 숫자가 올 줄 몰랐어요"라며 `SyntaxError: Unexpected number`를 내요. 문법 오류라서 아무 줄도 실행되지 않았어요.

  쉼표를 빼고 `18000`으로 쓰면 돼요. 자릿수를 꼭 나누고 싶다면 `18_000`처럼 밑줄을 쓸 수 있어요.

  `"18,000"`처럼 따옴표로 감싸면 오류는 사라지지만 문자열이 되어 `chickenPrice * 2`를 제대로 계산할 수 없어요. 가격은 숫자로 둬요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
