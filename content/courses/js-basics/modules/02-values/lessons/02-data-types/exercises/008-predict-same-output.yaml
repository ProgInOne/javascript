id: js-basics.values.data-types.predict-same-output
type: predict_output
difficulty: 2
concepts:
  - { id: js.types.primitives, weight: 1 }
  - { id: js.types.typeof, weight: 0.3 }
tags: [primitives, typeof, console]
estimatedSeconds: 70
prompt: |
  다음 프로그램을 실행하면 콘솔에 무엇이 출력되나요? 콘솔에 보이는 그대로 한 줄에 하나씩 적어 주세요.
spec:
  lang: js
  code: |
    let price = 900;
    let code = "900";
    console.log(price);
    console.log(code);
    console.log(typeof price);
    console.log(typeof code);
  answerKind: console
  misconceptionByAnswer:
    "900\n900\nnumber\nnumber": js.mc.same-output-same-type
misconceptions: [js.mc.same-output-same-type]
hints:
  - "`price`와 `code`에 들어 있는 값은 따옴표가 있나요, 없나요?"
  - 콘솔은 문자열을 출력할 때 따옴표를 보여 줄까요? 3번 줄과 4번 줄의 출력 모양을 비교해 보세요.
  - 출력 모양이 같아도 자료형은 다를 수 있어요. typeof는 값의 자료형 이름을 알려 줘요.
explanation: |
  정답은 다음 네 줄이에요.

  ```text
  900
  900
  number
  string
  ```

  - 3~4번 줄: 콘솔은 문자열의 따옴표를 빼고 보여 줘서, 숫자 `900`과 문자열 `"900"`이 **똑같이** `900`으로 보여요.
  - 5~6번 줄: typeof로 확인하면 차이가 드러나요. `price`는 number, `code`는 따옴표로 감쌌으니 string이에요.

  6번 줄을 `number`라고 답했다면 출력 모양이 같으니 자료형도 같다고 생각한 거예요. 출력 모양만으로는 자료형을 알 수 없어요. 4번 줄을 `"900"`이라고 따옴표까지 적었다면, 콘솔은 문자열의 따옴표를 보여 주지 않는다는 점을 기억해 두세요.
origin: authored
review:
