id: js-basics.values.data-types.we-primitives-1
type: fill_blank
difficulty: 2
concepts:
  - { id: js.types.primitives, weight: 1 }
  - { id: js.types.typeof, weight: 0.3 }
tags: [primitives, typeof, worked-example]
estimatedSeconds: 90
usage: worked_example
workedExampleStage: 1
prompt: |
  **풀이 예제 2단계: 빈칸 채우기**

  앞 단계와 같은 방식의 문제예요. 회원 정보를 담는데, 나이는 계산에 쓸 **숫자**로, 전화번호 뒷자리 0420은 계산하지 않는 **글자**로 담으려고 해요.

  풀이의 나머지는 완성되어 있어요. 주석을 읽고 빈칸에 알맞은 **값**을 쓰세요. 실행하면 아래처럼 나와야 해요.

  ```text
  20 0420
  number string boolean
  string
  ```
spec:
  mode: code
  lang: js
  template: |
    // 1. 나이는 계산에 쓸 숫자 값 20이에요.
    let age = {{blank:age}};
    // 2. 전화번호 뒷자리는 계산하지 않는 글자 0420이에요(앞의 0도 그대로 남아야 해요).
    let phone = {{blank:phone}};
    // 3. 회원 여부는 참/거짓 값이에요.
    let member = true;
    console.log(age, phone);
    console.log(typeof age, typeof phone, typeof member);
    // 4. age에 글자 값을 다시 넣으면, 자료형은 값을 따라 바뀌어요.
    age = "스무 살";
    console.log(typeof age);
  blanks:
    - id: age
      accept: ["20"]
      width: 8
    - id: phone
      accept: ['"0420"', "'0420'"]
      width: 8
  checks:
    - kind: console
      id: output
      description: 값, 세 자료형, 바뀐 자료형이 차례로 출력되어야 합니다.
      requirement: 자료형 출력
      expect:
        lines: ["20 0420", "number string boolean", "string"]
      misconceptionIfFail: js.mc.quoted-number-is-number
    - kind: program
      id: values
      description: 프로그램이 오류 없이 끝나고, phone에는 문자열 "0420"이 들어 있어야 합니다.
      requirement: 알맞은 자료형의 값
      expect:
        globals:
          phone: { equals: "0420" }
        noError: true
misconceptions: [js.mc.quoted-number-is-number]
hints:
  - 앞 단계 풀이에서 "7"과 7의 자료형을 가른 것이 무엇이었는지 떠올려 보세요.
  - 숫자 값에는 따옴표를 쓰지 않고, 글자 값은 따옴표로 감싸요.
  - "나이 빈칸은 `20`, 전화번호 빈칸은 `\"0420\"`이에요. 따옴표 없이 0420을 쓰면 글자가 아니라 숫자로 읽히는데, 0으로 시작하는 이런 숫자는 오류가 나요."
explanation: |
  예시 정답은 `20`과 `"0420"`이에요.

  - 나이는 계산에 쓸 값이니 따옴표 없이 `20`(number)으로 써요.
  - 전화번호 뒷자리는 계산하지 않고, 앞의 0도 그대로 남아야 하니 따옴표로 감싼 `"0420"`(string)으로 써요.
  - 마지막 줄에서 `age`에 `"스무 살"`을 넣었으니 `typeof age`는 `string`이에요. 앞 단계처럼 자료형은 변수가 아니라 값에 붙어 있어요.

  `"20"`처럼 나이를 따옴표로 감싸면 출력 첫 줄은 같아 보이지만 `typeof age`가 `string`이 되어 둘째 줄이 달라져요. 다음 단계에서는 처음부터 직접 써 봐요.
origin: authored
review:
