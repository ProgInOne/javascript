id: js-basics.values.var-and-tdz.impl-declare-before-use
type: implement_function
difficulty: 3
concepts:
  - { id: js.values.tdz, weight: 1 }
  - { id: js.values.let, weight: 0.5 }
  - { id: js.values.const, weight: 0.3 }
tags: [tdz, let, const, write-code]
estimatedSeconds: 200
prompt: |
  반려견 소개 프로그램이에요. 아래쪽의 출력 코드(네 줄)는 이미 있고, **고치지 않아요.** 이 코드가 오류 없이 실행되도록, 필요한 변수를 알맞은 자리에 만드세요.

  - 반려견 이름은 `보리`이고, 바뀌지 않아요.
  - 반려견 나이는 `3`살이고, 프로그램 안에서 한 살 늘어나요.

  실행하면 콘솔에 아래처럼 나와야 해요.

  ```text
  반려견 이름: 보리
  나이: 3
  내년 나이: 4
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          // 필요한 변수를 알맞은 자리에 만드세요.

          console.log("반려견 이름:", petName);
          console.log("나이:", petAge);
          petAge = petAge + 1;
          console.log("내년 나이:", petAge);
  solution:
    files:
      - path: main.js
        content: |
          // 필요한 변수를 알맞은 자리에 만드세요.
          const petName = "보리";
          let petAge = 3;
          console.log("반려견 이름:", petName);
          console.log("나이:", petAge);
          petAge = petAge + 1;
          console.log("내년 나이:", petAge);
  checks:
    - kind: console
      id: output
      description: 반려견 이름, 나이, 내년 나이가 차례로 출력되어야 합니다.
      requirement: 소개 출력
      expect:
        lines: ["반려견 이름: 보리", "나이: 3", "내년 나이: 4"]
    - kind: program
      id: values
      description: 프로그램이 오류 없이 끝나고, petName에는 "보리", petAge에는 4가 들어 있어야 합니다.
      requirement: 오류 없이 실행
      expect:
        globals:
          petName: { equals: "보리" }
          petAge: { equals: 4 }
        noError: true
      misconceptionIfFail: js.mc.let-before-declaration-undefined
misconceptions: [js.mc.let-before-declaration-undefined, js.mc.const-can-reassign]
hints:
  - 변수를 쓰는 줄보다 선언하는 줄이 먼저 실행되어야 해요. 출력 코드의 위와 아래 중 어디에 만들어야 할까요?
  - 나이는 5번 줄에서 다시 대입돼요. 다시 대입하는 변수를 `const`로 만들면 어떤 오류가 날까요?
  - 맨 위 주석 아래에 이름은 `const`로, 나이는 `let`으로 만들어요.
explanation: |
  예시 정답은 다음과 같아요.

  ```js
  const petName = "보리";
  let petAge = 3;
  console.log("반려견 이름:", petName);
  console.log("나이:", petAge);
  petAge = petAge + 1;
  console.log("내년 나이:", petAge);
  ```

  - **자리**: 변수는 쓰는 줄보다 위에서 선언해야 해요. 출력 코드 아래에 `let petAge = 3;`을 쓰면 `ReferenceError: Cannot access 'petAge' before initialization`이 나요(TDZ).
  - **let과 const**: 이름은 바뀌지 않으니 `const`, 나이는 5번 줄에서 다시 대입하니 `let`이에요. 나이를 `const`로 만들면 5번 줄에서 `TypeError: Assignment to constant variable.`이 나요.
  - `var`로 아래에 선언하면 오류는 피하지만 `undefined`가 출력되고 나이 계산도 틀려져요. 쓰기 전에 선언하는 것이 기본이에요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
