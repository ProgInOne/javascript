id: js-basics.values.var-and-tdz.fix-game-start
type: fix_bug
difficulty: 4
concepts:
  - { id: js.values.tdz, weight: 1 }
  - { id: js.values.var, weight: 0.5 }
  - { id: js.values.let, weight: 0.3 }
  - { id: js.errors.error-messages, weight: 0.3 }
tags: [tdz, var, strict-mode, debugging]
estimatedSeconds: 380
prompt: |
  게임 시작 화면의 프로그램이에요. 문제가 **세 군데** 있어요. 하나를 고치면 다음 문제가 드러나요. 실행 → 오류나 출력 확인 → 고치기를 반복해서 아래처럼 나오게 하세요.

  ```text
  게임 시작! 목숨: 3
  시작 보너스: 100
  아이템 점수: 60
  시작 보너스 다시 확인: 100
  ```

  아이템 점수는 아이템 보너스(30)의 두 배예요.
spec:
  buggy:
    files:
      - path: main.js
        content: |
          console.log("게임 시작! 목숨:", lives);
          let lives = 3;

          var bonus = 100;
          console.log("시작 보너스:", bonus);

          var bonus = 30; // 아이템 보너스
          score = bonus * 2;
          console.log("아이템 점수:", score);
          console.log("시작 보너스 다시 확인:", bonus);
  solution:
    files:
      - path: main.js
        content: |
          let lives = 3;
          console.log("게임 시작! 목숨:", lives);

          const bonus = 100;
          console.log("시작 보너스:", bonus);

          const itemBonus = 30; // 아이템 보너스
          let score = itemBonus * 2;
          console.log("아이템 점수:", score);
          console.log("시작 보너스 다시 확인:", bonus);
  bugDescription: 실행하면 첫 줄에서 ReferenceError가 나요. 고치면 다른 문제가 차례로 드러나요.
  checks:
    - kind: console
      id: output
      description: 목숨, 시작 보너스, 아이템 점수, 시작 보너스가 차례로 맞게 출력되어야 합니다.
      requirement: 게임 시작 화면 출력
      expect:
        lines:
          - "게임 시작! 목숨: 3"
          - "시작 보너스: 100"
          - "아이템 점수: 60"
          - "시작 보너스 다시 확인: 100"
    - kind: program
      id: final-values
      description: 프로그램이 오류 없이 끝나고, lives는 3, bonus는 시작 보너스 100, score는 60이어야 합니다.
      requirement: 최종 값
      expect:
        globals:
          lives: { equals: 3 }
          bonus: { equals: 100 }
          score: { equals: 60 }
        noError: true
misconceptions:
  - js.mc.let-before-declaration-undefined
  - js.mc.tdz-means-misspelled
  - js.mc.var-redeclare-silent
hints:
  - "처음 오류는 `ReferenceError: Cannot access 'lives' before initialization (1번째 줄)`이에요. 이름은 맞아요. 선언과 사용의 순서를 확인하세요."
  - "고치면 `ReferenceError: score is not defined (8번째 줄)`이 나요. ProgInOne은 엄격 모드로 실행해요. 선언 없이 대입하면 어떻게 되나요?"
  - "마지막에는 오류 없이 `시작 보너스 다시 확인: 30`이 나와요. 시작 보너스와 아이템 보너스가 같은 이름을 쓰고 있지 않은지 보세요. 이름을 바꿨다면 그 값을 쓰는 곳도 바꿔요."
explanation: |
  문제 세 개가 차례로 드러나요.

  1. **`ReferenceError: Cannot access 'lives' before initialization` (1번 줄)**: `let lives`의 선언보다 먼저 `lives`를 썼어요(TDZ). 1번과 2번 줄의 순서를 바꿔요. 이름은 맞으니 오타를 찾을 필요는 없어요.
  1. **`ReferenceError: score is not defined` (8번 줄)**: `score`를 선언 없이 대입했어요. 오래된 비엄격 모드였다면 몰래 변수가 만들어졌겠지만, 엄격 모드에서는 오류예요. `let score = ...`로 선언해요.
  1. **오류 없이 `시작 보너스 다시 확인: 30`**: 7번 줄에서 아이템 보너스를 담으려고 `var bonus`를 **다시** 선언해서, 시작 보너스 100이 조용히 30으로 덮어써졌어요. 아이템 보너스에 다른 이름(예: `itemBonus`)을 붙이고 8번 줄도 그 이름을 쓰게 바꿔요.

  예시 정답처럼 `var`를 `let`·`const`로 바꾸면 세 번째 문제는 처음부터 `SyntaxError: Identifier 'bonus' has already been declared`로 드러났을 거예요. `var`가 실수를 숨긴다는 것, 그리고 오류 메시지마다 고치는 방법이 다르다는 것을 기억해 두세요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
