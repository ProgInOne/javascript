id: js-basics.values.var-and-tdz.try-library-const
type: fix_bug
difficulty: 2
usage: try
concepts:
  - { id: js.values.tdz, weight: 1 }
  - { id: js.values.var, weight: 0.5 }
  - { id: js.values.const, weight: 0.3 }
tags: [var, tdz, const, debugging]
estimatedSeconds: 240
prompt: |
  도서관 이용 안내를 출력하는 오래된 프로그램이에요. 오류는 없는데 대출 가능 권수가 `undefined`로 나와요.

  1. 먼저 `var`를 모두 `const`로 바꾸고 실행해 보세요. 이번에는 어떤 오류가 나나요?
  1. 오류 메시지를 단서로 고쳐서, 아래처럼 나오게 하세요. 고친 코드에서도 `const`를 그대로 써요.

  ```text
  도서관 이용 안내
  대출 가능: 5 권
  대출 기간: 14 일
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          console.log("도서관 이용 안내");
          console.log("대출 가능:", maxBooks, "권");
          var maxBooks = 5;
          var days = 14;
          console.log("대출 기간:", days, "일");
  solution:
    files:
      - path: main.js
        content: |
          const maxBooks = 5;
          const days = 14;
          console.log("도서관 이용 안내");
          console.log("대출 가능:", maxBooks, "권");
          console.log("대출 기간:", days, "일");
  bugDescription: 대출 가능 권수가 5 대신 undefined로 나와요.
  bugMisconception: js.mc.var-hoists-value
  checks:
    - kind: console
      id: output
      description: 안내 세 줄이 순서대로 나오고, 대출 가능 권수가 5로 출력되어야 합니다.
      requirement: 세 줄 출력
      expect:
        lines: ["도서관 이용 안내", "대출 가능: 5 권", "대출 기간: 14 일"]
    - kind: program
      id: values
      description: 오류 없이 끝나고, `maxBooks`에 5, `days`에 14가 들어 있어야 합니다.
      requirement: 변수 값
      expect: { globals: { maxBooks: { equals: 5 }, days: { equals: 14 } }, noError: true }
misconceptions: [js.mc.var-hoists-value, js.mc.let-before-declaration-undefined]
hints:
  - "`var`를 `const`로 바꾸면 `Cannot access 'maxBooks' before initialization`이 나요. 이름이 틀렸다는 뜻일까요?"
  - 이 오류는 선언 줄보다 위에서 변수를 썼다는 뜻이에요. `maxBooks`는 몇 번 줄에서 쓰이고, 몇 번 줄에서 선언되나요?
  - 변수를 선언하는 두 줄을 맨 위로 옮겨서, 출력하는 줄보다 먼저 실행되게 해요.
explanation: |
  예시 답안은 다음과 같아요.

  ```js
  const maxBooks = 5;
  const days = 14;
  console.log("도서관 이용 안내");
  console.log("대출 가능:", maxBooks, "권");
  console.log("대출 기간:", days, "일");
  ```

  - 처음 코드는 `var` 때문에 선언 전인 2번 줄에서 `maxBooks`에 미리 넣어 둔 `undefined`가 조용히 출력됐어요.
  - `const`로 바꾸면 같은 실수가 `ReferenceError: Cannot access 'maxBooks' before initialization`으로 드러나요. 이름은 맞으니 선언 줄을 쓰는 줄보다 위로 옮기면 돼요.

  `var`였다면 넘어갔을 실수를 `let`·`const`는 오류로 바로 알려 줘요. 변수는 쓰기 전에, 되도록 위쪽에서 선언해요.
