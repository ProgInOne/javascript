id: js-basics.values.var-and-tdz.fix-goal-before-declaration
type: fix_bug
difficulty: 2
concepts:
  - { id: js.values.tdz, weight: 1 }
  - { id: js.errors.error-messages, weight: 0.3 }
tags: [tdz, const, reference-error, debugging]
estimatedSeconds: 110
prompt: |
  걸음 수 앱의 프로그램인데, 실행하면 오류가 나요.

  ```text
  ReferenceError: Cannot access 'goal' before initialization (1번째 줄)
  ```

  고쳐서 아래처럼 나오게 하세요.

  ```text
  목표 걸음 수: 10000
  오늘 걸음 수: 6500
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          console.log("목표 걸음 수:", goal);
          const goal = 10000;
          let steps = 6500;
          console.log("오늘 걸음 수:", steps);
  solution:
    files:
      - path: main.js
        content: |
          const goal = 10000;
          console.log("목표 걸음 수:", goal);
          let steps = 6500;
          console.log("오늘 걸음 수:", steps);
  bugDescription: 실행하면 첫 줄에서 ReferenceError가 나요.
  bugMisconception: js.mc.tdz-means-misspelled
  checks:
    - kind: console
      id: output
      description: 목표 걸음 수와 오늘 걸음 수가 차례로 출력되어야 합니다.
      requirement: 걸음 수 출력
      expect:
        lines: ["목표 걸음 수: 10000", "오늘 걸음 수: 6500"]
    - kind: program
      id: values
      description: 프로그램이 오류 없이 끝나고, goal에는 10000이 들어 있어야 합니다.
      requirement: 오류 없이 실행
      expect:
        globals:
          goal: { equals: 10000 }
        noError: true
misconceptions: [js.mc.tdz-means-misspelled, js.mc.let-before-declaration-undefined]
hints:
  - 오류 메시지는 `goal is not defined`가 아니에요. `before initialization`은 무슨 뜻이었나요?
  - "`goal`이라는 이름은 맞게 썼어요. `goal`을 쓰는 줄과 선언하는 줄 중 어느 쪽이 먼저 실행되나요?"
  - 이름을 바꾸거나 선언을 하나 더 넣지 말고, 선언 줄의 위치를 바꿔 보세요.
explanation: |
  1번 줄이 2번 줄의 `const goal` 선언보다 먼저 실행돼서 오류가 났어요. `const`·`let` 변수는 선언 줄이 실행되기 전(TDZ)에는 쓸 수 없어요.

  이름은 맞으니 오타를 찾을 필요가 없어요. 두 줄의 순서를 바꿔서 선언을 먼저 하면 돼요.

  ```js
  const goal = 10000;
  console.log("목표 걸음 수:", goal);
  ```

  1번 줄 위에 `const goal = 10000;`을 하나 더 넣으면 이번에는 `SyntaxError: Identifier 'goal' has already been declared`가 나요. 같은 이름은 한 번만 선언해요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
