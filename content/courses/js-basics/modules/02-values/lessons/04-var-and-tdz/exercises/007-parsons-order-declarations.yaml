id: js-basics.values.var-and-tdz.parsons-order-declarations
type: parsons
difficulty: 3
concepts:
  - { id: js.values.tdz, weight: 1 }
  - { id: js.values.const, weight: 0.3 }
tags: [tdz, const, statement-order, parsons]
estimatedSeconds: 100
prompt: |
  카페 주문 금액을 계산하는 프로그램이에요. 코드 조각을 배열해서, 오류 없이 아래처럼 출력되게 하세요.

  ```text
  아메리카노 2잔: 9000
  ```
spec:
  lines:
    - { id: l1, code: "const price = 4500;" }
    - { id: l2, code: "const count = 2;" }
    - { id: l3, code: "const total = price * count;" }
    - { id: l4, code: 'console.log("아메리카노 2잔:", total);' }
  distractors:
    - { id: d1, code: "total = price * count;", replaces: l3 }
  gradeIndent: false
  checks:
    - kind: console
      id: output
      description: 주문 금액이 계산되어 출력되어야 합니다.
      requirement: 주문 금액 출력
      expect:
        lines: ["아메리카노 2잔: 9000"]
    - kind: program
      id: no-error
      description: 프로그램이 오류 없이 끝나야 합니다.
      requirement: 오류 없이 실행
      expect:
        noError: true
      misconceptionIfFail: js.mc.let-before-declaration-undefined
misconceptions: [js.mc.let-before-declaration-undefined]
hints:
  - 어떤 변수를 쓰려면, 그 변수를 선언하는 줄이 먼저 실행되어야 해요.
  - "`total`을 계산하려면 무엇이 먼저 준비되어 있어야 하나요? 출력하려면요?"
  - 선언 없이 대입만 하는 조각은 엄격 모드에서 오류가 나요. 쓰이는 변수의 선언이 항상 위에 오도록 배열하세요.
explanation: |
  예시 정답은 다음과 같아요.

  ```js
  const price = 4500;
  const count = 2;
  const total = price * count;
  console.log("아메리카노 2잔:", total);
  ```

  - `const` 변수는 선언 줄이 실행된 뒤에만 쓸 수 있어요. `total`을 계산하는 줄이 `price`나 `count`의 선언보다 위에 있으면 `ReferenceError: Cannot access 'price' before initialization` 같은 오류가 나요. 출력 줄도 `total`의 선언보다 아래에 있어야 해요.
  - `price`와 `count`는 서로를 쓰지 않으니 둘의 순서는 바뀌어도 정답이에요.
  - `total = price * count;`는 선언 없이 대입만 해서, 엄격 모드에서는 `ReferenceError: total is not defined`가 나요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
