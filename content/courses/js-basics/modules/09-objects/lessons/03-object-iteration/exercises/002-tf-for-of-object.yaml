id: js-basics.objects.object-iteration.tf-for-of-object
type: true_false
difficulty: 2
concepts:
  - { id: js.obj.keys-values-entries, weight: 1 }
tags: [object, for-of, iterable]
estimatedSeconds: 70
prompt: |
  아래 코드를 보고, 설명이 맞는지 고른 뒤 그렇게 판단한 이유도 고르세요.
code: |
  const stock = { 사과: 12, 배: 5, 귤: 30 };
  let total = 0;
  for (const count of stock) {
    total += count;
  }
  console.log(total);
spec:
  statement: "이 코드는 `stock`의 값을 하나씩 `count`에 넣으며 반복하므로 `47`을 출력한다."
  answer: false
  misconceptionIfWrong: js.mc.for-of-object
  requireReason: true
  reasons:
    - id: r1
      text: 일반 객체는 for...of로 돌 수 없어서 3번 줄에서 TypeError(stock is not iterable)가 난다
      correct: true
    - id: r2
      text: for...of는 객체의 키를 넣어 주므로 total에 글자가 이어 붙는다
      misconception: js.mc.for-in-gives-values
    - id: r3
      text: 객체는 순서가 없어서 반복할 때마다 다른 합계가 나온다
hints:
  - "`for...of`로 돌 수 있었던 값은 무엇이었나요? 객체도 그중 하나일까요?"
  - 객체의 값을 하나씩 돌려면 먼저 값만 모은 배열을 만들어야 했어요.
  - 이 코드를 실행하면 반복 본문이 한 번이라도 실행될지, 아니면 반복을 시작하는 줄에서 멈출지 생각해 보세요.
explanation: |
  설명은 **거짓**이에요. 이유는 "일반 객체는 for...of로 돌 수 없어서 3번 줄에서 TypeError(stock is not iterable)가 난다"예요.

  `for...of`는 배열이나 문자열처럼 "반복할 수 있는(iterable)" 값만 돌 수 있어요. 일반 객체는 여기에 들어가지 않아서 3번 줄에서 `TypeError: stock is not iterable`이 나고 아무것도 출력되지 않아요.

  값을 더하려면 `for (const count of Object.values(stock))`처럼 값 배열을 만들어 돌아요. 그러면 `47`이 나와요.

  - "키를 넣어 준다"는 `for...in`의 동작이에요. `for...of`는 객체에서 아예 시작하지 못해요.
  - 객체의 속성 순서는 정해져 있고, 덧셈은 순서와 상관없이 합이 같아요. 문제는 순서가 아니라 반복 자체가 안 된다는 점이에요.
