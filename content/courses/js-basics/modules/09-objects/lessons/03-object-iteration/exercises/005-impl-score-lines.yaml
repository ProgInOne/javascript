id: js-basics.objects.object-iteration.impl-score-lines
type: implement_function
difficulty: 3
concepts:
  - { id: js.obj.keys-values-entries, weight: 1 }
  - { id: js.str.template-literal, weight: 0.3 }
  - { id: js.loops.accumulator-pattern, weight: 0.3 }
tags: [object, entries, array, write-code]
estimatedSeconds: 300
prompt: |
  함수 `scoreLines(scores)`를 만드세요. 과목별 점수 객체를 받아, 과목마다 `"과목: 점수점"` 문자열을 하나씩 담은 **배열**을 돌려줘요. 순서는 객체에 들어 있는 순서 그대로예요. 마지막에는 `"평균: 평균점"`을 하나 더 담아요.

  ```js
  scoreLines({ 국어: 90, 영어: 84, 수학: 72 });
  // ["국어: 90점", "영어: 84점", "수학: 72점", "평균: 82점"]
  ```

  과목이 하나도 없으면 빈 배열 `[]`을 돌려줘요(평균 줄도 없음). 채점은 다른 과목과 점수로도 해요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          function scoreLines(scores) {
          }
  entry: scoreLines
  solution:
    files:
      - path: main.js
        content: |
          function scoreLines(scores) {
            const lines = [];
            let total = 0;
            for (const entry of Object.entries(scores)) {
              lines.push(`${entry[0]}: ${entry[1]}점`);
              total += entry[1];
            }
            const count = Object.keys(scores).length;
            if (count === 0) {
              return lines;
            }
            lines.push(`평균: ${total / count}점`);
            return lines;
          }
  checks:
    - kind: call
      id: basic
      requirement: 과목별 줄과 평균
      args: [{ "국어": 90, "영어": 84, "수학": 72 }]
      expect: { equals: ["국어: 90점", "영어: 84점", "수학: 72점", "평균: 82점"] }
    - kind: call
      id: empty
      requirement: 과목이 없으면 빈 배열
      args: [{}]
      expect: { equals: [] }
    - kind: call
      id: two-subjects
      visible: false
      description: 과목이 둘이고 이름이 달라도 객체 순서대로 줄을 만들고 평균을 내야 합니다.
      requirement: 과목별 줄과 평균
      args: [{ "과학": 100, "음악": 70 }]
      expect: { equals: ["과학: 100점", "음악: 70점", "평균: 85점"] }
    - kind: call
      id: one-subject
      visible: false
      description: 과목이 하나여도 그 과목 줄과 평균 줄이 있어야 합니다.
      requirement: 과목별 줄과 평균
      args: [{ "체육": 95 }]
      expect: { equals: ["체육: 95점", "평균: 95점"] }
misconceptions: [js.mc.for-of-object, js.mc.object-has-length]
hints:
  - 과목 이름과 점수를 함께 써야 해요. 객체에서 `[키, 값]` 짝을 배열로 뽑아 주는 함수는 무엇이었나요?
  - 짝 하나(`entry`)에서 과목은 `entry[0]`, 점수는 `entry[1]`이에요. 결과를 담을 빈 배열과 합계 변수를 반복 전에 만들어 두세요.
  - 평균의 나눗셈에 쓸 과목 수는 객체의 `length`가 아니라 키 배열의 길이로 세요. 과목이 0개일 때는 평균 줄을 넣기 전에 돌려주어야 0으로 나누지 않아요.
explanation: |
  예시 정답이에요.

  ```js
  function scoreLines(scores) {
    const lines = [];
    let total = 0;
    for (const entry of Object.entries(scores)) {
      lines.push(`${entry[0]}: ${entry[1]}점`);
      total += entry[1];
    }
    const count = Object.keys(scores).length;
    if (count === 0) {
      return lines;
    }
    lines.push(`평균: ${total / count}점`);
    return lines;
  }
  ```

  - `Object.entries(scores)`가 `[["국어", 90], ["영어", 84], ...]`을 만들어 주므로, 과목 이름을 코드에 적지 않고도 모든 과목을 돌 수 있어요.
  - 과목 수는 `Object.keys(scores).length`예요. `scores.length`는 `undefined`라서 평균이 `NaN점`이 돼요.
  - 빈 객체는 `count`가 0이에요. 평균 줄을 그대로 넣으면 `0 / 0`이 `NaN`이라 `"평균: NaN점"`이 들어가요. 그 전에 돌려줘야 해요.
  - `for (const subject in scores)`로 돌며 `scores[subject]`를 읽어도 정답이에요.
origin: authored
