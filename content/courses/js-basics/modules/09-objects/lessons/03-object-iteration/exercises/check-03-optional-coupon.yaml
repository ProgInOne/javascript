id: js-basics.objects.object-iteration.check-optional-coupon
type: mcq_single
usage: check
difficulty: 2
concepts:
  - { id: js.obj.in-optional-chaining, weight: 1 }
  - { id: js.ops.nullish, weight: 0.3 }
tags: [object, optional-chaining, nullish]
estimatedSeconds: 70
prompt: |
  쿠폰을 쓰지 않은 주문에는 `coupon` 객체가 아예 없어요. `const order = { id: 5 };`일 때, **오류 없이** `"없음"`이 나오는 식은 어느 것인가요?
spec:
  options:
    - id: a
      text: '`order.coupon?.code ?? "없음"`'
    - id: b
      text: '`order.coupon.code ?? "없음"`'
      rationale: "`order.coupon`이 `undefined`라서 `.code`를 읽는 순간 `TypeError`가 나요. `??`까지 가지 못해요."
    - id: c
      text: '`order?.coupon.code ?? "없음"`'
      misconception: js.mc.optional-chaining-guards-rest
      rationale: "`?.`는 바로 앞의 `order`만 확인해요. `order`는 있으니 그대로 진행하고, `undefined`의 `.code`에서 `TypeError`가 나요."
    - id: d
      text: '`order.coupon?.code`'
      rationale: 오류는 나지 않지만 결과가 `undefined`예요. `"없음"`을 얻으려면 기본값이 필요해요.
  correct: a
misconceptions: [js.mc.optional-chaining-guards-rest]
hints:
  - 없을 수 있는 단계는 `order`와 `order.coupon` 중 어느 것인가요?
  - "`?.`는 바로 앞의 값이 `null`이나 `undefined`인지만 확인해요. 없을 수 있는 단계 바로 뒤에 붙여야 해요."
  - "`?.`로 `undefined`를 얻은 뒤, 기본값 `\"없음\"`은 `??`로 정해요."
explanation: |
  정답은 `order.coupon?.code ?? "없음"`이에요.

  - `order.coupon`은 `undefined`예요. 바로 뒤의 `?.`가 거기서 멈추고 `undefined`를 돌려줘요.
  - `??`는 왼쪽이 `undefined`라서 오른쪽 `"없음"`을 골라요.
  - `?.` 위치가 `order` 뒤에 있으면 `order`만 확인하므로 `coupon.code`에서 `TypeError`가 나요.
origin: authored
review:
