id: js-basics.objects.object-iteration.multi-in-checks
type: mcq_multi
difficulty: 3
concepts:
  - { id: js.obj.in-optional-chaining, weight: 1 }
  - { id: js.obj.keys-values-entries, weight: 0.3 }
tags: [object, in, undefined, keys]
estimatedSeconds: 120
prompt: |
  아래 객체가 있을 때, 결과가 `true`인 식을 모두 고르세요.
code: |
  const member = { name: "서연", nickname: undefined, points: 0 };
spec:
  options:
    - id: a
      text: '`"nickname" in member`'
      missedMisconception: js.mc.undefined-value-means-missing
    - id: b
      text: '`"points" in member`'
    - id: c
      text: "`Object.keys(member).length === 3`"
      missedMisconception: js.mc.undefined-value-means-missing
    - id: d
      text: '`"email" in member`'
      rationale: member에는 email 속성이 없어서 false예요.
    - id: e
      text: "`member.nickname !== undefined`"
      misconception: js.mc.undefined-value-means-missing
      rationale: nickname 속성은 있지만 값이 undefined라서 이 식은 false예요. 값을 묻는 식과 속성이 있는지 묻는 식은 달라요.
    - id: f
      text: '`"name" in member.name`'
      rationale: in의 오른쪽은 객체여야 해요. member.name은 문자열 "서연"이라 TypeError가 나요.
  correct: [a, b, c]
misconceptions: [js.mc.undefined-value-means-missing]
hints:
  - 각 식이 "속성이 있는가"를 묻는지, "값이 무엇인가"를 묻는지 나눠 보세요.
  - 값이 `undefined`이거나 `0`인 속성도 객체에 들어 있는 속성이에요. 키 목록에도 들어갈까요?
  - "`in`의 오른쪽에 무엇이 와야 하는지도 확인하세요. 문자열도 될까요?"
explanation: |
  `true`인 식은 `"nickname" in member`, `"points" in member`, `Object.keys(member).length === 3`이에요.

  - `"nickname" in member`: 값이 `undefined`여도 속성은 **있어요**. `true`예요.
  - `"points" in member`: 값 0도 있는 값이에요. `in`은 값이 무엇인지 보지 않아요. `true`예요.
  - `Object.keys(member).length === 3`: 키 목록은 `["name", "nickname", "points"]`로 3개예요. `nickname`도 들어가요.
  - `"email" in member`: 없는 속성이라 `false`예요.
  - `member.nickname !== undefined`: 값이 `undefined`이므로 `false`예요. 이 식으로 "있는지"를 판단하면 `nickname`을 없는 속성으로 잘못 보게 돼요.
  - `"name" in member.name`: `in`의 오른쪽은 객체여야 해요. 문자열 `"서연"`에 쓰면 `TypeError: Cannot use 'in' operator to search for 'name' in 서연`이 나요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
