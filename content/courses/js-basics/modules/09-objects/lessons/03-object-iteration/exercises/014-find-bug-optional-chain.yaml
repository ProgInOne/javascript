id: js-basics.objects.object-iteration.find-bug-optional-chain
type: find_bug_line
difficulty: 3
concepts:
  - { id: js.obj.in-optional-chaining, weight: 1 }
  - { id: js.errors.error-messages, weight: 0.3 }
tags: [object, optional-chaining, type-error, debugging]
estimatedSeconds: 120
prompt: |
  주문마다 배송 메모를 출력하는 프로그램이에요. 메모를 적지 않은 주문은 `delivery` 객체가 아예 없을 수 있어서, 그때는 `메모 없음`이 나와야 해요. 그런데 실행하면 오류가 나요. 오류의 **원인**이 되는 줄을 찾고, 왜 그런지도 고르세요.
spec:
  code: |-
    const order1 = { id: 101, delivery: { memo: "문 앞에 놔 주세요" } };
    const order2 = { id: 102 };
    function memoOf(order) {
      const memo = order?.delivery.memo;
      return memo ?? "메모 없음";
    }
    console.log(order1.id + ": " + memoOf(order1));
    console.log(order2.id + ": " + memoOf(order2));
  bugLines: [4]
  symptom: "첫 주문의 메모는 출력되지만, 두 번째 주문에서 `TypeError: Cannot read properties of undefined (reading 'memo')` 오류가 나요."
  symptomCheck:
    error: TypeError
  fixedCode: |-
    const order1 = { id: 101, delivery: { memo: "문 앞에 놔 주세요" } };
    const order2 = { id: 102 };
    function memoOf(order) {
      const memo = order.delivery?.memo;
      return memo ?? "메모 없음";
    }
    console.log(order1.id + ": " + memoOf(order1));
    console.log(order2.id + ": " + memoOf(order2));
  causeOptions:
    - id: c1
      text: "?.가 order만 확인하고, 없는 delivery(undefined)에서 memo를 읽는다"
      correct: true
    - id: c2
      text: "??는 문자열을 기본값으로 쓸 수 없다"
    - id: c3
      text: 두 번째 주문 객체에 memo 속성이 없어서, 없는 속성을 읽는 순간 오류가 난다
      misconception: js.mc.missing-property-error
hints:
  - 오류 메시지의 `reading 'memo'`는 무엇을 읽다가 실패했다는 뜻인가요? 그때 `memo` 앞의 값은 무엇이었을까요?
  - 두 번째 주문에서 없을 수 있는 것은 `order`인가요, `delivery`인가요?
  - "`?.`는 바로 앞의 값만 확인해요. 지금 코드에서 `?.`는 어느 값 뒤에 붙어 있나요?"
explanation: |
  원인은 **4번 줄**이에요. `order?.delivery.memo`의 `?.`는 `order`가 없을 때만 멈춰요.

  두 번째 주문에서 `order`는 있으니 그대로 `order.delivery`를 읽고, 그 값이 `undefined`예요. 이어서 `undefined.memo`를 읽으려다 `TypeError: Cannot read properties of undefined (reading 'memo')`가 나요. `?.`가 붙어 있어도 그 뒤의 모든 단계를 지켜 주지는 않아요.

  없을 수 있는 값은 `delivery`이므로 그 **바로 뒤**에 `?.`를 붙여요.

  ```js
  const memo = order.delivery?.memo;
  ```

  - "`??`는 문자열을 기본값으로 쓸 수 없다": `??`의 오른쪽에는 어떤 값이든 올 수 있어요. 오류는 `??`까지 가기 전에 났어요.
  - "없는 속성을 읽는 순간 오류가 난다": 없는 속성을 읽으면 오류가 아니라 `undefined`예요. `order2.delivery`도 `undefined`일 뿐이에요. 오류는 `undefined`에서 **다시** 속성을 읽을 때 나요.
origin: authored
review:
