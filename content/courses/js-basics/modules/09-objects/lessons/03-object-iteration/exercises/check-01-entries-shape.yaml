id: js-basics.objects.object-iteration.check-entries-shape
type: mcq_single
usage: check
difficulty: 1
concepts:
  - { id: js.obj.keys-values-entries, weight: 1 }
tags: [object, entries, keys, values]
estimatedSeconds: 50
prompt: |
  `const votes = { 짜장: 7, 짬뽕: 5 };`일 때 `Object.entries(votes)`의 결과는 무엇인가요?
spec:
  options:
    - id: a
      text: '`[["짜장", 7], ["짬뽕", 5]]`'
    - id: b
      text: '`["짜장", "짬뽕"]`'
      rationale: 키만 담은 배열은 `Object.keys(votes)`의 결과예요.
    - id: c
      text: '`[7, 5]`'
      rationale: 값만 담은 배열은 `Object.values(votes)`의 결과예요.
    - id: d
      text: '`[["짜장", "짬뽕"], [7, 5]]`'
      rationale: 키 목록과 값 목록으로 나누지 않아요. 속성 하나마다 `[키, 값]` 짝을 하나씩 만들어요.
  correct: a
hints:
  - "`entries`는 \"항목들\"이라는 뜻이에요. 속성 하나가 항목 하나예요."
  - 항목 하나는 키와 값을 함께 담은 작은 배열이에요.
  - 속성이 두 개이니 `[키, 값]` 짝도 두 개예요. 그 짝들을 다시 배열에 담아요.
explanation: |
  정답은 `[["짜장", 7], ["짬뽕", 5]]`예요.

  - `Object.entries`는 속성마다 `[키, 값]` 짝을 만들고, 그 짝들을 넣은 순서대로 배열에 담아요. 그래서 대괄호가 두 겹이에요.
  - `Object.keys`는 키 목록, `Object.values`는 값 목록을 돌려줘요.
origin: authored
review:
