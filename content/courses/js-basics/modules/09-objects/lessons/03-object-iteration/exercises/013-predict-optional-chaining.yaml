id: js-basics.objects.object-iteration.predict-optional-chaining
type: predict_output
difficulty: 3
concepts:
  - { id: js.obj.in-optional-chaining, weight: 1 }
  - { id: js.ops.nullish, weight: 0.5 }
tags: [object, optional-chaining, nullish, trace]
estimatedSeconds: 140
prompt: |
  회원 두 명의 배송 정보를 출력하는 프로그램이에요. 실행하면 콘솔에 무엇이 출력될까요? 다섯 줄을 모두 쓰세요.
spec:
  lang: js
  code: |
    const minji = { name: "민지", address: { city: "부산", floor: 0 } };
    const junho = { name: "준호" };

    console.log(minji.address?.city ?? "미입력");
    console.log(junho.address?.city ?? "미입력");
    console.log(minji.address?.floor ?? "층 없음");
    console.log(junho.address?.floor || "층 없음");
    console.log("address" in junho);
  answerKind: console
  misconceptionByAnswer:
    "부산\n미입력\n층 없음\n층 없음\nfalse": js.mc.nullish-same-as-or
misconceptions: [js.mc.nullish-same-as-or]
hints:
  - "`?.`는 바로 앞의 값이 무엇일 때 멈추고 `undefined`를 돌려줬나요? 준호에게는 `address`가 있나요?"
  - "`??`는 왼쪽이 `null`·`undefined`일 때만 오른쪽을 골라요. 민지의 `floor`는 0이에요."
  - 6번 줄과 7번 줄은 `??`와 `||`로 연산자가 달라요. 0은 `undefined`와 다르지만 거짓 같은 값(falsy)이라는 점을 떠올려 보세요.
explanation: |
  출력은 다음과 같아요.

  ```text
  부산
  미입력
  0
  층 없음
  false
  ```

  - 4번 줄: 민지는 `address`가 있으니 `city`인 `"부산"`이에요.
  - 5번 줄: 준호는 `address`가 없어서 `junho.address`가 `undefined`예요. `?.`가 멈추고 `undefined`를 돌려주니 `??`가 `"미입력"`을 골라요. 오류는 나지 않아요.
  - 6번 줄: 민지의 `floor`는 0이에요. 0은 `null`·`undefined`가 아니므로 `??`는 0을 그대로 써요.
  - 7번 줄: 준호는 `address`가 없어 왼쪽이 `undefined`이고, `||`가 `"층 없음"`을 골라요. (`||`는 0일 때도 오른쪽을 골라서, 민지에게 썼다면 `층 없음`이 나왔을 거예요.)
  - 8번 줄: 준호에게는 `address` 속성이 없으니 `false`예요.

  3번째 줄을 `층 없음`이라고 답했다면 `??`를 `||`처럼 본 거예요. 0층(지상층)처럼 0이 의미 있는 값일 때는 `??`를 써요.
