id: js-basics.objects.object-iteration.mcq-object-length
type: mcq_single
difficulty: 1
concepts:
  - { id: js.obj.keys-values-entries, weight: 1 }
tags: [object, keys, length]
estimatedSeconds: 50
prompt: |
  아래 객체에 메뉴가 몇 개 들어 있는지 숫자 `3`을 얻고 싶어요. 어떤 식을 써야 하나요?
code: |
  const menu = { 떡볶이: 4000, 김밥: 3000, 순대: 5000 };
spec:
  options:
    - id: a
      text: "`Object.keys(menu).length`"
    - id: b
      text: "`menu.length`"
      misconception: js.mc.object-has-length
      rationale: 일반 객체에는 length 속성이 없어서 menu.length는 undefined예요.
    - id: c
      text: "`menu.keys().length`"
      rationale: keys는 객체마다 들어 있는 메서드가 아니라 Object.keys(객체)처럼 불러요. menu.keys()는 menu에 keys라는 함수가 없어서 TypeError가 나요.
    - id: d
      text: "`Object.keys(menu)`"
      rationale: Object.keys(menu)는 키 목록 배열 ["떡볶이", "김밥", "순대"]이에요. 개수를 얻으려면 그 배열의 length를 읽어야 해요.
  correct: a
misconceptions: [js.mc.object-has-length]
hints:
  - 객체에는 배열처럼 개수를 알려 주는 속성이 있을까요?
  - 객체의 키를 배열로 뽑아 주는 함수가 있어요. 배열이 되면 무엇을 쓸 수 있나요?
  - 키 배열을 만든 뒤, 배열의 개수를 읽는 속성을 그 뒤에 이어 붙여 보세요.
explanation: |
  정답은 `Object.keys(menu).length`예요.

  `Object.keys(menu)`는 키 목록 `["떡볶이", "김밥", "순대"]`을 배열로 돌려주고, 그 배열의 `length`가 3이에요.

  - `menu.length`: 일반 객체에는 `length`가 없어서 `undefined`예요. 오류가 나지 않아서 실수를 알아차리기 어려워요.
  - `menu.keys().length`: `keys`는 `Object.keys(객체)`처럼 `Object`에 붙여 불러요. `menu`에는 `keys`라는 메서드가 없어서 `TypeError: menu.keys is not a function`이 나요.
  - `Object.keys(menu)`: 개수가 아니라 키 배열 자체예요.
origin: authored
review:
