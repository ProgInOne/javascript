id: js-basics.objects.object-iteration
title: 객체 순회
summary: Object.keys·values·entries와 for...in으로 객체의 속성을 하나씩 돌고, in 연산자와 옵셔널 체이닝(?.)으로 속성이 있는지 확인하며 안전하게 읽는 방법을 배웁니다.
kind: lesson
importance: standard
estimatedMinutes: { read: 13, practice: 24 }
concepts:
  primary: [js.obj.keys-values-entries, js.obj.for-in, js.obj.in-optional-chaining]
  reviewed: [js.obj.dot-bracket, js.loops.accumulator-pattern, js.ops.nullish, js.types.undefined, js.arr.literal-index, js.arr.push-pop, js.arr.for-of]
objectives:
  - Object.keys·values·entries로 키·값 목록을 만들어 개수를 세고 반복할 수 있다.
  - for...in으로 키를 돌며 대괄호 표기법으로 값을 읽을 수 있다.
  - 값이 undefined인 속성과 없는 속성을 in 연산자로 구별할 수 있다.
  - 옵셔널 체이닝과 ??로 없을 수 있는 중첩 속성을 오류 없이 읽을 수 있다.
practice:
  targetCount: 18
