id: js-basics.objects.destructuring-and-spread.check-rename-default
type: mcq_single
usage: check
difficulty: 2
concepts:
  - { id: js.obj.destructuring, weight: 1 }
tags: [destructuring, rename, default]
estimatedSeconds: 70
prompt: |
  배송지 객체에서 값을 꺼냈어요. 2번 줄을 실행한 뒤 변수 `home`과 `zip`에는 각각 무엇이 들어 있나요?
code: |
  const address = { city: "부산", street: "해운대로" };
  const { city: home = "서울", zip } = address;
spec:
  options:
    - id: a
      text: '`home`은 `"부산"`, `zip`은 `undefined`'
    - id: b
      text: '`home`은 `"서울"`, `zip`은 `undefined`'
      rationale: 기본값은 속성이 없거나 `undefined`일 때만 쓰여요. `city`는 `"부산"`으로 들어 있어요.
    - id: c
      text: '`home`이라는 변수는 생기지 않고 `city`에 `"부산"`이 들어간다'
      misconception: js.mc.destructuring-rename-direction
      rationale: "`속성: 새이름`에서 변수가 되는 것은 콜론 오른쪽이에요. `city`가 아니라 `home` 변수가 생겨요."
    - id: d
      text: '`address`에 `zip`이 없으므로 `TypeError`가 난다'
      rationale: 없는 속성을 꺼내면 오류가 아니라 `undefined`가 들어가요.
  correct: a
misconceptions: [js.mc.destructuring-rename-direction]
hints:
  - "`city: home`에서 콜론 왼쪽은 읽을 속성, 오른쪽은 만들 변수예요."
  - "`= \"서울\"`은 기본값이에요. 기본값은 언제 쓰였나요?"
  - "`address`에 `city`는 있고 `zip`은 없어요. 없는 속성을 꺼내면 어떤 값이 들어가나요?"
explanation: |
  정답은 `home`은 `"부산"`, `zip`은 `undefined`예요.

  - `city: home = "서울"`은 "`city` 속성을 읽어 `home` 변수에 넣고, 값이 없으면 `"서울"`을 넣어라"라는 뜻이에요. `city`가 `"부산"`이라 기본값은 쓰이지 않아요.
  - `zip`은 `address`에 없는 속성이에요. 기본값을 주지 않았으니 `undefined`가 들어가요. 오류는 나지 않아요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
