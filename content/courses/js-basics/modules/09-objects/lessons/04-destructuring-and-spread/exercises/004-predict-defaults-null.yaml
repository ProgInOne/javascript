id: js-basics.objects.destructuring-and-spread.predict-defaults-null
type: predict_output
difficulty: 3
concepts:
  - { id: js.obj.destructuring, weight: 1 }
  - { id: js.types.null, weight: 0.3 }
tags: [destructuring, default, null-value, undefined]
estimatedSeconds: 120
prompt: |
  게임 설정 세 개를 같은 함수로 읽어요. 실행하면 콘솔에 무엇이 출력될까요? 세 줄을 모두 쓰세요.
spec:
  lang: js
  code: |
    function describe({ volume = 50, lang = "ko", hint = true }) {
      return volume + " / " + lang + " / " + hint;
    }

    console.log(describe({ volume: 0, lang: "en" }));
    console.log(describe({ volume: null, hint: false }));
    console.log(describe({ lang: undefined, hint: undefined }));
  answerKind: console
  misconceptionByAnswer:
    "0 / en / true\n50 / ko / false\n50 / ko / true": js.mc.destructuring-default-on-null
    "50 / en / true\n50 / ko / false\n50 / ko / true": js.mc.destructuring-default-on-null
misconceptions: [js.mc.destructuring-default-on-null]
hints:
  - 호출마다 넘긴 객체에 어떤 속성이 있고, 그 값이 무엇인지 표로 적어 보세요.
  - 기본값은 속성이 없거나 값이 `undefined`일 때만 들어가요. `0`, `false`, `null`은 어떨까요?
  - "`0`과 `null`은 거짓 같은 값이지만 `undefined`는 아니에요. 두 번째 줄의 `volume`을 다시 확인하세요."
explanation: |
  출력은 다음과 같아요.

  ```text
  0 / en / true
  null / ko / false
  50 / ko / true
  ```

  | 호출 | `volume` | `lang` | `hint` |
  |---|---|---|---|
  | 1번째 | `0` (넘긴 값) | `"en"` | 없음 → `true` |
  | 2번째 | `null` (넘긴 값) | 없음 → `"ko"` | `false` (넘긴 값) |
  | 3번째 | 없음 → `50` | `undefined` → `"ko"` | `undefined` → `true` |

  구조 분해 기본값은 값이 **없거나 `undefined`일 때만** 쓰여요. `0`, `false`, `null`은 모두 "값이 있다"로 봐서 그대로 들어가요. `||`로 기본값을 줄 때(모듈 3)와 다른 점이에요.

  두 번째 줄을 `50 / ko / false`라고 답했다면 `null`에도 기본값이 쓰인다고 본 거예요. `null`도 바꾸고 싶다면 `volume ?? 50`처럼 `??`를 써야 해요.
origin: authored
