id: js-basics.objects.destructuring-and-spread.web-drink-options
type: web_task
difficulty: 3
concepts:
  - { id: js.obj.spread, weight: 1 }
  - { id: js.obj.reference, weight: 0.5 }
  - { id: js.fn.callback, weight: 0.3 }
tags: [spread, object, state, web, event]
estimatedSeconds: 420
prompt: |
  카페 앱의 음료 주문 화면을 완성하세요. 주문 상태는 객체 하나(`state`)에 들어 있고, `render()`가 그 객체와 기본 주문 `DEFAULT`를 화면에 보여 줘요. 버튼 네 개의 함수를 채우면 돼요.

  - **L 사이즈**(`makeLarge`): 사이즈를 `"L"`로 바꿔요.
  - **샷 추가**(`addShot`): 샷 수를 1 늘려요.
  - **시럽 넣기·빼기**(`toggleSyrup`): 시럽이 없으면 넣고, 있으면 빼요.
  - **처음으로**(`resetOrder`): 기본 주문 `DEFAULT`로 되돌려요.

  처음에는 `state`와 `DEFAULT`가 **같은 객체**예요. 그래서 `state.size = "L";`처럼 `state`를 직접 고치면 `DEFAULT`도 바뀌어 버려요. 화면 아래의 "기본 주문"은 어떤 버튼을 눌러도 `M / 1샷 / 시럽 없음` 그대로여야 해요. 함수마다 `{ ...state, ... }`처럼 **바뀐 새 객체**를 만들어 `state`에 넣고, `render()`를 부르세요. 버튼 연결은 이미 되어 있어요.
