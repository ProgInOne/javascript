id: js-basics.objects.destructuring-and-spread.impl-order-line
type: implement_function
difficulty: 3
concepts:
  - { id: js.obj.destructuring, weight: 1 }
  - { id: js.control.if, weight: 0.3 }
tags: [destructuring, default, parameter, write-code]
estimatedSeconds: 300
prompt: |
  주문 객체 하나를 받아 영수증 한 줄을 돌려주는 함수 `orderLine(order)`를 만드세요. 주문 객체에는 `menu`(메뉴 이름), `price`(1개 가격)가 꼭 있고, `qty`(수량)와 `memo`(요청 사항)는 없을 수도 있어요.

  - 기본 모양: `(메뉴) x(수량) = (가격 × 수량)원`
  - `qty`가 없으면 수량은 1이에요.
  - `memo`가 있으면 끝에 ` (요청: (요청 사항))`을 붙여요.

  ```js
  orderLine({ menu: "떡볶이", qty: 2, price: 4000 });             // "떡볶이 x2 = 8000원"
  orderLine({ menu: "김밥", price: 3000, memo: "단무지 빼기" });  // "김밥 x1 = 3000원 (요청: 단무지 빼기)"
  ```

  매개변수 자리나 함수 첫 줄에서 구조 분해를 써 보세요. 받은 주문 객체는 바꾸지 않아요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          function orderLine(order) {
          }
  entry: orderLine
  solution:
    files:
      - path: main.js
        content: |
          function orderLine({ menu, qty = 1, price, memo }) {
            let line = menu + " x" + qty + " = " + price * qty + "원";
            if (memo !== undefined) {
              line += " (요청: " + memo + ")";
            }
            return line;
          }
  checks:
    - kind: call
      id: basic
      args: [{ menu: "떡볶이", qty: 2, price: 4000 }]
      requirement: 영수증 한 줄
      expect: { equals: "떡볶이 x2 = 8000원" }
    - kind: call
      id: memo-default
      args: [{ menu: "김밥", price: 3000, memo: "단무지 빼기" }]
      requirement: 요청 사항
      expect: { equals: "김밥 x1 = 3000원 (요청: 단무지 빼기)" }
    - kind: call
      id: qty-memo
      visible: false
      description: 수량과 요청 사항이 모두 있으면 둘 다 반영해야 합니다.
      requirement: 요청 사항
      args: [{ memo: "덜 맵게", price: 4500, menu: "라면", qty: 3 }]
      expect: { equals: "라면 x3 = 13500원 (요청: 덜 맵게)" }
    - kind: call
      id: no-qty
      visible: false
      description: 수량이 없고 요청 사항도 없으면 수량 1로 계산하고 끝에 아무것도 붙이지 않아야 합니다.
      requirement: 수량이 없으면 1
      args: [{ menu: "순대", price: 5000 }]
      expect: { equals: "순대 x1 = 5000원" }
    - kind: call
      id: no-change
      visible: false
      description: 받은 주문 객체를 바꾸면 안 됩니다(수량이 없을 때 order에 qty를 넣지 않기).
      requirement: 원본 유지
      args: [{ menu: "어묵", price: 1000 }]
      expect: { argsUnchanged: true }
misconceptions: [js.mc.destructuring-removes-property]
hints:
  - 먼저 `order`에서 쓸 속성 네 개를 변수로 꺼내 보세요. 꺼낼 때 수량의 기본값도 정할 수 있어요.
  - 문장의 기본 모양을 먼저 만들고, 요청 사항이 있을 때만 뒤에 덧붙여요. 없는 속성을 꺼내면 어떤 값이 되는지 떠올려 보세요.
  - 수량이 없을 때 `order.qty = 1;`처럼 객체에 넣으면 원본이 바뀌어요. 기본값은 꺼낸 변수 쪽에서 정하세요.
explanation: |
  예시 정답이에요.

  ```js
  function orderLine({ menu, qty = 1, price, memo }) {
    let line = menu + " x" + qty + " = " + price * qty + "원";
    if (memo !== undefined) {
      line += " (요청: " + memo + ")";
    }
    return line;
  }
  ```

  - 매개변수 자리에서 주문 객체를 풀어서 `menu`, `qty`, `price`, `memo`를 바로 변수로 받아요. 속성 순서가 달라도(숨긴 테스트) 이름으로 꺼내니 상관없어요.
  - `qty = 1`은 수량이 없을 때만 1이 돼요.
  - 없는 속성 `memo`는 `undefined`가 되므로 `memo !== undefined`로 확인해요. `if (memo)`로 확인해도 이 문제의 테스트는 통과해요.
  - `price * qty`는 `+`로 이어 붙이는 식 안에 있지만, 곱셈이 덧셈보다 먼저 계산돼서 숫자로 곱해진 뒤 붙어요.
  - 함수 안에서 `const { menu, qty = 1, price, memo } = order;`로 꺼내도 같아요. 구조 분해는 `order`를 바꾸지 않아요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
