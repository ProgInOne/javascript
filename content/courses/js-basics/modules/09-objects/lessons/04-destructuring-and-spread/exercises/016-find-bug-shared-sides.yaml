id: js-basics.objects.destructuring-and-spread.find-bug-shared-sides
type: find_bug_line
difficulty: 3
concepts:
  - { id: js.obj.spread, weight: 1 }
  - { id: js.obj.copy-shallow, weight: 0.5 }
tags: [spread, shallow-copy, array, debugging]
estimatedSeconds: 130
prompt: |
  민지의 도시락을 본떠서 준호의 도시락을 만들고, 준호 도시락에만 소시지를 더하려는 코드예요. 그런데 결과가 이상해요. 원인이 되는 줄을 찾고, 왜 그런지도 고르세요.
spec:
  code: |-
    const lunchbox = { owner: "민지", sides: ["김치", "계란말이"] };
    const friendBox = { ...lunchbox, owner: "준호" };
    friendBox.sides.push("소시지");
    console.log(lunchbox.owner + ": " + lunchbox.sides.join(", "));
    console.log(friendBox.owner + ": " + friendBox.sides.join(", "));
  bugLines: [2]
  acceptLines: [3]
  symptom: 이름은 각자 맞게 나오는데, 민지의 도시락에도 소시지가 들어가 있어요.
  symptomCheck:
    console: ["민지: 김치, 계란말이, 소시지", "준호: 김치, 계란말이, 소시지"]
  fixedCode: |-
    const lunchbox = { owner: "민지", sides: ["김치", "계란말이"] };
    const friendBox = { ...lunchbox, owner: "준호", sides: [...lunchbox.sides] };
    friendBox.sides.push("소시지");
    console.log(lunchbox.owner + ": " + lunchbox.sides.join(", "));
    console.log(friendBox.owner + ": " + friendBox.sides.join(", "));
  causeOptions:
    - id: c1
      text: 전개는 얕은 복사라서 두 도시락이 sides 배열 하나를 함께 쓴다
      correct: true
    - id: c2
      text: owner를 덮어쓸 때 원래 도시락의 속성도 함께 바뀌었다
      misconception: js.mc.spread-mutates-original
    - id: c3
      text: 전개로 만든 friendBox는 lunchbox와 같은 객체다
      misconception: js.mc.copy-equals-original
hints:
  - 이름(`owner`)은 각자 맞게 나와요. 이상한 것은 어떤 속성인가요?
  - 2번 줄이 새로 만든 것은 무엇이고, `sides` 속성에는 무엇이 복사되었나요?
  - 전개로 복사한 객체 안의 배열은 원본 배열과 같은 배열일까요, 새 배열일까요?
explanation: |
  원인은 **2번 줄**이에요(소시지를 더하는 3번 줄도 정답으로 인정해요).

  `{ ...lunchbox, owner: "준호" }`는 새 객체를 만들지만 **얕은 복사**예요. `owner` 같은 문자열은 값이 복사되지만, `sides`에는 배열 자체가 아니라 그 배열을 가리키는 참조가 복사돼요. 그래서 두 도시락이 배열 하나를 함께 쓰고, 3번 줄의 `push`가 민지의 도시락에도 보여요.

  고치는 방법은 안쪽 배열도 새로 만드는 거예요.

  ```js
  const friendBox = { ...lunchbox, owner: "준호", sides: [...lunchbox.sides] };
  ```

  3번 줄을 `friendBox.sides = [...friendBox.sides, "소시지"];`로 바꿔 새 배열을 대입해도 돼요.

  - "owner를 덮어쓸 때 원래 도시락도 바뀌었다": 출력에서 민지의 이름은 그대로예요. 덮어쓴 것은 새 객체의 `owner`뿐이에요.
  - "friendBox는 lunchbox와 같은 객체다": 같은 객체였다면 이름도 둘 다 `준호`로 나왔을 거예요. 객체는 다르고, 안쪽 배열만 함께 써요.
origin: authored
