id: js-basics.objects.objects-review.impl-humidity-text
type: implement_function
difficulty: 4
concepts:
  - { id: js.obj.in-optional-chaining, weight: 1 }
  - { id: js.ops.nullish, weight: 0.5 }
  - { id: js.obj.dot-bracket, weight: 0.3 }
tags: [object, optional-chaining, nullish, nested, write-code, assessment]
estimatedSeconds: 360
usage: assessment
prompt: |
  날씨 측정소에서 받은 정보로 습도 안내 문장을 만드는 함수 `humidityText(station)`를 완성하세요. 측정소 객체는 이런 모양이지만, 고장 난 측정소는 일부 정보가 **아예 없을 수 있어요**.

  ```js
  const station = {
    name: "한빛",
    sensors: {
      humidity: { value: 45 },
      wind: { value: 3 },
    },
  };
  humidityText(station);  // "한빛: 습도 45%"
  ```

  - `name`이 없으면 이름 자리에 `"이름 없음"`을 써요.
  - `sensors`가 없거나, `sensors`는 있는데 `humidity`가 없거나, `humidity`에 `value`가 없으면 `"한빛: 습도 정보 없음"`처럼 써요.
  - 습도가 `0`이면 정보가 있는 거예요: `"한빛: 습도 0%"`
  - 어떤 경우에도 오류가 나면 안 되고, 받은 객체를 바꾸면 안 돼요. 숨겨진 테스트는 여러 모양의 측정소로 확인해요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          function humidityText(station) {
            // 없을 수 있는 정보를 오류 없이 읽어 문장을 만들어 돌려주세요.
          }
  entry: humidityText
  solution:
    files:
      - path: main.js
        content: |
          function humidityText(station) {
            const name = station.name ?? "이름 없음";
            const value = station.sensors?.humidity?.value;
            if (value === undefined) {
              return name + ": 습도 정보 없음";
            }
            return name + ": 습도 " + value + "%";
          }
  checks:
    - kind: call
      id: full
      description: 정보가 모두 있으면 이름과 습도를 담은 문장을 돌려줘야 합니다.
      requirement: 습도 문장
      args: [{ name: "한빛", sensors: { humidity: { value: 45 }, wind: { value: 3 } } }]
      expect: { equals: "한빛: 습도 45%" }
    - kind: call
      id: no-sensors
      description: sensors가 없으면 오류 없이 "습도 정보 없음"이어야 합니다.
      requirement: 없는 정보
      args: [{ name: "누리" }]
      expect: { equals: "누리: 습도 정보 없음" }
    - kind: call
      id: no-humidity
      visible: false
      description: sensors는 있지만 humidity가 없어도 오류 없이 "습도 정보 없음"이어야 합니다.
      requirement: 없는 정보
      args: [{ name: "바름", sensors: { wind: { value: 7 } } }]
      expect: { equals: "바름: 습도 정보 없음" }
      misconceptionIfFail: js.mc.optional-chaining-guards-rest
    - kind: call
      id: no-value
      visible: false
      description: humidity 객체에 value가 없으면 "습도 정보 없음"이어야 합니다.
      requirement: 없는 정보
      args: [{ name: "솔빛", sensors: { humidity: {} } }]
      expect: { equals: "솔빛: 습도 정보 없음" }
    - kind: call
      id: zero
      visible: false
      description: 습도 0은 정보가 있는 것이므로 "습도 0%"여야 합니다.
      requirement: 습도 문장
      args: [{ name: "가온", sensors: { humidity: { value: 0 } } }]
      expect: { equals: "가온: 습도 0%" }
    - kind: call
      id: no-name
      visible: false
      description: 이름이 없으면 "이름 없음"을 써야 합니다.
      requirement: 이름 없음
      args: [{ sensors: { humidity: { value: 62 } } }]
      expect: { equals: "이름 없음: 습도 62%" }
    - kind: call
      id: empty-station
      visible: false
      description: 아무 정보도 없는 측정소도 오류 없이 처리해야 합니다.
      requirement: 이름 없음
      args: [{}]
      expect: { equals: "이름 없음: 습도 정보 없음" }
    - kind: call
      id: keep-station
      visible: false
      description: 받은 측정소 객체를 바꾸면 안 됩니다.
      requirement: 습도 문장
      args: [{ name: "바름", sensors: { wind: { value: 7 } } }]
      expect: { argsUnchanged: true }
misconceptions: [js.mc.optional-chaining-guards-rest, js.mc.missing-property-error, js.mc.undefined-value-means-missing]
hints:
  - 비어 있을 수 있는 단계를 모두 찾아보세요. `station.sensors`, `station.sensors.humidity` 중 어느 것이 없을 수 있나요?
  - "`?.`는 바로 앞의 값만 확인해요. 없을 수 있는 단계마다 `?.`가 필요한지 확인해 보세요. 기본값을 정할 때 `||`와 `??` 중 어느 쪽이 0을 지켜 줄까요?"
  - 습도 값을 먼저 변수에 담고, 그 값이 비어 있는지에 따라 두 가지 문장 중 하나를 돌려주면 돼요.
explanation: |
  예시 정답이에요.

  ```js
  function humidityText(station) {
    const name = station.name ?? "이름 없음";
    const value = station.sensors?.humidity?.value;
    if (value === undefined) {
      return name + ": 습도 정보 없음";
    }
    return name + ": 습도 " + value + "%";
  }
  ```

  - 없을 수 있는 단계는 `sensors`와 `humidity` 두 곳이라 **둘 다 바로 뒤에** `?.`를 붙여요. 중간에 비어 있는 단계가 있으면 식 전체가 `undefined`가 돼요. `value`가 없을 때도 `undefined`예요.
  - `station.sensors?.humidity.value`처럼 한 번만 쓰면, `sensors`는 있는데 `humidity`가 없을 때 `.value`에서 `TypeError: Cannot read properties of undefined (reading 'value')`가 나요. `?.`는 바로 앞의 값만 확인해요.
  - `?.` 없이 `station.sensors.humidity.value`로 읽으면 `sensors`가 없는 측정소에서 바로 `TypeError`가 나요.
  - 습도 0을 지키는 것이 함정이에요. `value === undefined`나 `??`로 확인하면 0이 그대로 남지만, `||`나 `if (!value)`로 확인하면 0도 비어 있는 것으로 처리해서 `습도 정보 없음`이 돼요.
  - 이름도 `??`로 기본값을 정해요. `name`이 없는 측정소만 `"이름 없음"`이 돼요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
