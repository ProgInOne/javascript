      expect: { returnsNewReference: true }
      misconceptionIfFail: js.mc.array-assign-copies
misconceptions: [js.mc.dot-with-variable-key, js.mc.array-assign-copies]
hints:
  - 증상이 두 가지예요. "모두 괄호로 나옴"과 "넘긴 배열이 바뀜"의 원인을 따로 찾아보세요.
  - "`dict.word`는 변수 `word`에 든 단어를 찾나요, 이름이 `word`인 속성을 찾나요? 그리고 `const result = words;`를 하면 배열이 하나 더 생기나요?"
  - 반복 안에서 `result[i] = ...`로 덮어쓰는 배열이 실제로 어떤 배열인지 생각해 보세요. 결과를 담을 배열은 어디서 새로 만들어야 할까요?
explanation: |
  예시 정답이에요.

  ```js
  function translate(dict, words) {
    const result = [];
    for (let i = 0; i < words.length; i++) {
      const word = words[i];
      if (dict[word] !== undefined) {
        result.push(dict[word]);
      } else {
        result.push("(" + word + ")");
      }
    }
    return result;
  }
  ```

  버그는 두 개예요.

  1. **`dict.word`**: 점 뒤의 `word`는 변수가 아니라 속성 이름이에요. 단어장에 `word`라는 속성은 없으니 늘 `undefined`이고, 모든 단어가 괄호로 감싸졌어요. 변수에 든 이름으로 찾으려면 `dict[word]`처럼 대괄호를 써요.
  1. **`const result = words;`**: 배열을 대입하면 복사되지 않고, `result`와 `words`가 같은 배열을 가리켜요. 그래서 `result[i] = ...`가 넘긴 배열의 내용을 바꿨어요. 결과는 새 빈 배열 `[]`에 담아야 해요.

  - 첫 번째 버그만 고치면 결과는 맞지만, 숨겨진 테스트가 넘긴 배열이 바뀐 것과 같은 배열을 돌려준 것을 잡아요.
  - `const result = [...words];`로 복사본을 만든 뒤 그 안을 바꾸는 풀이도 정답이에요.
  - `if (dict[word])`처럼 써도 이번 테스트는 통과해요. 다만 뜻이 빈 문자열처럼 falsy인 값이면 없는 단어로 처리되므로, "없음"을 `undefined`로 확인하는 편이 정확해요.
