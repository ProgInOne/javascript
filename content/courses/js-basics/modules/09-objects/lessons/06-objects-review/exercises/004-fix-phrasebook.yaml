usage: assessment
prompt: |
  여행용 단어장 함수 `translate(dict, words)`예요. 단어장 객체 `dict`(한국어 → 영어)와 단어 배열 `words`를 받아, 단어마다 영어 뜻을 담은 **새 배열**을 돌려줘요. 단어장에 없는 단어는 괄호로 감싸 그대로 둬요.

  ```js
  const dict = { 물: "water", 역: "station" };
  const words = ["역", "버스", "물"];
  translate(dict, words);  // ["station", "(버스)", "water"]
  console.log(words);      // ["역", "버스", "물"] (그대로)
  ```

  지금은 결과가 이상하고, 넘긴 `words` 배열까지 바뀌어요. 버그를 모두 고치세요. 버그는 하나가 아닐 수 있어요. 숨겨진 테스트는 다른 단어장과 단어로 확인해요.
spec:
  buggy:
    files:
      - path: main.js
        content: |
          function translate(dict, words) {
            const result = words;
            for (let i = 0; i < result.length; i++) {
              const word = result[i];
              if (dict.word !== undefined) {
                result[i] = dict.word;
              } else {
                result[i] = "(" + word + ")";
              }
            }
            return result;
          }
  entry: translate
  solution:
    files:
      - path: main.js
        content: |
          function translate(dict, words) {
            const result = [];
            for (let i = 0; i < words.length; i++) {
              const word = words[i];
              if (dict[word] !== undefined) {
                result.push(dict[word]);
              } else {
                result.push("(" + word + ")");
              }
            }
            return result;
          }
  bugDescription: 단어장에 있는 단어도 모두 괄호로 감싸져 나오고, 함수를 부른 뒤 넘긴 단어 배열의 내용까지 바뀌어 있어요.
  bugMisconception: js.mc.dot-with-variable-key
  checks:
    - kind: call
      id: basic
      description: 단어장에 있는 단어는 영어 뜻으로, 없는 단어는 괄호로 감싸야 합니다.
      requirement: 단어 찾기
      args: [{ "물": "water", "역": "station" }, ["역", "버스", "물"]]
      expect: { equals: ["station", "(버스)", "water"] }
      misconceptionIfFail: js.mc.dot-with-variable-key
    - kind: call
      id: other-dict
      visible: false
      description: 처음 보는 단어장과 단어도 같은 규칙으로 바꿔야 합니다.
      requirement: 단어 찾기
      args: [{ "왼쪽": "left", "오른쪽": "right", "출구": "exit" }, ["출구", "왼쪽", "화장실", "출구"]]
      expect: { equals: ["exit", "left", "(화장실)", "exit"] }
      misconceptionIfFail: js.mc.dot-with-variable-key
    - kind: call
      id: word-key
      visible: false
      description: 단어장에 이름이 word인 속성이 있어도, 단어마다 그 단어의 뜻을 찾아야 합니다.
      requirement: 단어 찾기
      args: [{ "word": "?!", "표": "ticket" }, ["표", "지도"]]
      expect: { equals: ["ticket", "(지도)"] }
      misconceptionIfFail: js.mc.dot-with-variable-key
    - kind: call
      id: empty
      visible: false
      description: 단어가 하나도 없으면 빈 배열을 돌려줘야 합니다.
      requirement: 단어 찾기
      args: [{ "물": "water" }, []]
      expect: { equals: [] }
    - kind: call
      id: keep-words
      visible: false
      description: 넘긴 단어장과 단어 배열이 바뀌면 안 됩니다.
      requirement: 원래 배열 지키기
      args: [{ "물": "water", "역": "station" }, ["역", "버스", "물"]]
      expect: { argsUnchanged: true }
      misconceptionIfFail: js.mc.array-assign-copies
    - kind: call
      id: new-array
      visible: false
      description: 받은 배열을 그대로 돌려주지 말고 새 배열을 돌려줘야 합니다.
      requirement: 원래 배열 지키기
