id: js-basics.objects.objects-review.mcq-sensor-rest
type: mcq_single
difficulty: 2
concepts:
  - { id: js.obj.destructuring, weight: 1 }
  - { id: js.obj.reference, weight: 0.3 }
tags: [object, destructuring, rest, new-object, assessment]
estimatedSeconds: 90
usage: assessment
prompt: |
  온도 센서의 정보에서 배터리 값만 따로 꺼내고, 나머지를 측정값 객체 `reading`으로 모아요. 그다음 `reading`의 온도를 고쳐요. 아래 코드를 실행하면 무엇이 출력되나요?
code: |
  const sensor = { id: "T-01", temp: 21.5, battery: 80 };
  const { battery, ...reading } = sensor;
  reading.temp = 30;
  console.log(sensor.temp, reading.battery, battery);
spec:
  options:
    - id: a
      text: "`21.5 undefined 80`"
    - id: b
      text: "`30 undefined 80`"
      misconception: js.mc.spread-mutates-original
      rationale: "...reading은 남은 속성을 담은 새 객체를 만들어요. reading.temp를 바꿔도 sensor.temp는 그대로 21.5예요."
    - id: c
      text: "`21.5 80 80`"
      misconception: js.mc.rest-includes-named
      rationale: 나머지(...reading)에는 앞에서 이미 꺼낸 battery를 뺀 속성만 모여요. reading에는 battery가 없어요.
    - id: d
      text: "`undefined undefined 80`"
      misconception: js.mc.destructuring-removes-property
      rationale: 구조 분해는 값을 읽어서 담을 뿐 sensor에서 속성을 빼내지 않아요. sensor.temp는 그대로 있어요.
  correct: a
misconceptions: [js.mc.destructuring-removes-property, js.mc.rest-includes-named, js.mc.spread-mutates-original]
hints:
  - "2번 줄이 실행된 뒤 `battery`, `reading`, `sensor`에 각각 무엇이 들어 있는지 적어 보세요."
  - "`...reading`은 값을 받는 자리의 `...`예요. 어떤 속성들이 모이고, 모인 결과는 `sensor`와 같은 객체인가요, 새 객체인가요?"
  - 3번 줄은 `reading`의 속성을 바꿔요. 이 변경이 `sensor`에도 보이는지, `reading`에 `battery` 속성이 있는지 따져 보세요.
explanation: |
  `21.5 undefined 80`이 출력돼요.

  - `const { battery, ...reading } = sensor;`는 `sensor.battery`의 값 80을 변수 `battery`에 담고, 남은 속성 `id`, `temp`를 모은 **새 객체**를 `reading`에 담아요. `reading`은 `{ id: "T-01", temp: 21.5 }`예요.
  - `reading`은 `sensor`와 다른 객체라서 3번 줄에서 `reading.temp`를 30으로 바꿔도 `sensor.temp`는 21.5 그대로예요.
  - 앞에서 꺼낸 `battery`는 나머지에 들어가지 않으므로 `reading.battery`는 없는 속성이라 `undefined`예요.
  - 구조 분해는 원본을 읽기만 해요. `sensor`에는 여전히 `id`, `temp`, `battery`가 모두 있어요.

  - `30 undefined 80`을 골랐다면 `reading`이 `sensor`와 같은 객체를 가리킨다고 본 거예요. 나머지로 모은 것은 새 객체예요.
  - `21.5 80 80`을 골랐다면 나머지에 모든 속성이 다시 들어간다고 본 거예요.
  - `undefined undefined 80`을 골랐다면 구조 분해가 원본에서 속성을 꺼내 없앤다고 본 거예요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
