id: js-basics.objects.objects-review.impl-to-minutes
type: implement_function
difficulty: 4
concepts:
  - { id: js.errors.throw, weight: 1 }
  - { id: js.str.split-join, weight: 0.3 }
  - { id: js.conv.nan, weight: 0.3 }
tags: [throw, error, validation, string, write-code, assessment]
estimatedSeconds: 360
usage: assessment
prompt: |
  운동 기록 앱에서 `"시:분"` 모양의 문자열을 분 단위 숫자로 바꾸는 함수 `toMinutes(text)`를 완성하세요.

  ```js
  toMinutes("1:30");   // 90
  toMinutes("0:45");   // 45
  ```

  처리할 수 없는 입력은 숫자를 돌려주지 말고 **오류를 던져요**. 메시지는 정확히 아래와 같아요.

  - `:`로 나눈 조각이 두 개가 아니거나, 시나 분이 숫자가 아니면 `"형식은 시:분이에요"`
  - 형식은 맞지만 분이 0보다 작거나 60 이상이면 `"분은 0부터 59까지예요"`

  ```js
  toMinutes("90분");   // 오류: 형식은 시:분이에요
  toMinutes("1:75");   // 오류: 분은 0부터 59까지예요
  ```

  숨겨진 테스트는 다른 시간과 잘못된 입력으로 확인해요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          function toMinutes(text) {
            // "시:분"을 나눠 분 단위 숫자로 바꿔 돌려주세요.
            // 처리할 수 없는 입력은 오류를 던져요.
          }
  entry: toMinutes
  solution:
    files:
      - path: main.js
        content: |
          function toMinutes(text) {
            const parts = text.split(":");
            if (parts.length !== 2) {
              throw new Error("형식은 시:분이에요");
            }
            const hours = Number(parts[0]);
            const minutes = Number(parts[1]);
            if (Number.isNaN(hours) || Number.isNaN(minutes)) {
              throw new Error("형식은 시:분이에요");
            }
            if (minutes < 0 || minutes >= 60) {
              throw new Error("분은 0부터 59까지예요");
            }
            return hours * 60 + minutes;
          }
  checks:
    - kind: call
      id: basic
      description: '"1:30"은 90분이어야 합니다.'
      requirement: 분으로 바꾸기
      args: ["1:30"]
      expect: { strictEquals: 90 }
    - kind: call
      id: no-colon
      description: ':가 없으면 "형식은 시:분이에요" 오류를 던져야 합니다.'
      requirement: 형식 오류
      args: ["90분"]
      expect: { throws: { name: Error, messageIncludes: "형식은 시:분이에요" } }
      misconceptionIfFail: js.mc.throw-just-logs
    - kind: call
      id: two-hours
      visible: false
      description: 처음 보는 시간도 시 × 60 + 분으로 바꿔 숫자로 돌려줘야 합니다.
      requirement: 분으로 바꾸기
      args: ["2:05"]
      expect: { strictEquals: 125 }
    - kind: call
      id: zero
      visible: false
      description: '"0:00"은 0분이어야 합니다.'
      requirement: 분으로 바꾸기
      args: ["0:00"]
      expect: { strictEquals: 0 }
    - kind: call
      id: not-number
      visible: false
      description: 시나 분이 숫자가 아니면 "형식은 시:분이에요" 오류를 던져야 합니다.
      requirement: 형식 오류
      args: ["한:10"]
      expect: { throws: { name: Error, messageIncludes: "형식은 시:분이에요" } }
      misconceptionIfFail: js.mc.throw-just-logs
    - kind: call
      id: too-many-parts
      visible: false
      description: 조각이 세 개면 "형식은 시:분이에요" 오류를 던져야 합니다.
      requirement: 형식 오류
      args: ["1:20:30"]
      expect: { throws: { name: Error, messageIncludes: "형식은 시:분이에요" } }
    - kind: call
      id: minutes-too-big
      visible: false
      description: 분이 60 이상이면 "분은 0부터 59까지예요" 오류를 던져야 합니다.
      requirement: 범위 오류
      args: ["1:75"]
      expect: { throws: { name: Error, messageIncludes: "분은 0부터 59까지예요" } }
      misconceptionIfFail: js.mc.throw-just-logs
    - kind: call
      id: minutes-sixty
      visible: false
      description: 분이 정확히 60이어도 범위 오류여야 합니다.
      requirement: 범위 오류
      args: ["0:60"]
      expect: { throws: { name: Error, messageIncludes: "분은 0부터 59까지예요" } }
    - kind: call
      id: minutes-59
      visible: false
      description: 분이 59면 정상 입력입니다.
      requirement: 범위 오류
      args: ["3:59"]
      expect: { strictEquals: 239 }
misconceptions: [js.mc.throw-just-logs]
hints:
  - 할 일을 순서대로 나눠 보세요. 나누기 → 조각 수 확인 → 숫자로 바꾸고 확인 → 분 범위 확인 → 계산이에요.
  - 오류를 알릴 때는 메시지를 출력하거나 문자열을 돌려주는 게 아니라 오류 객체를 던져야 해요. 숫자로 바꿀 수 없는 문자열을 `Number`로 바꾸면 무엇이 되고, 그것은 어떻게 확인했나요?
  - 분 범위의 경계를 확인해 보세요. 59는 괜찮고 60은 안 돼요. 그리고 계산 결과는 문자열이 아니라 숫자여야 해요.
explanation: |
  예시 정답이에요.

  ```js
  function toMinutes(text) {
    const parts = text.split(":");
    if (parts.length !== 2) {
      throw new Error("형식은 시:분이에요");
    }
    const hours = Number(parts[0]);
    const minutes = Number(parts[1]);
    if (Number.isNaN(hours) || Number.isNaN(minutes)) {
      throw new Error("형식은 시:분이에요");
    }
    if (minutes < 0 || minutes >= 60) {
      throw new Error("분은 0부터 59까지예요");
    }
    return hours * 60 + minutes;
  }
  ```

  - `throw new Error("...")`는 그 자리에서 함수를 끝내고 부른 쪽으로 오류를 보내요. 그래서 오류를 던진 뒤의 계산은 실행되지 않아요.
  - `console.log("형식은 시:분이에요")`나 `return "형식은 시:분이에요"`는 오류가 아니에요. 출력하고 나서 계산을 계속하거나 문자열을 돌려줄 뿐이라, 부른 쪽은 잘못된 입력이었다는 것을 `try...catch`로 알 수 없어요.
  - `"90분".split(":")`은 조각이 1개, `"1:20:30"`은 3개예요. `Number("한")`은 `NaN`이라 `Number.isNaN`으로 걸러요(`NaN === NaN`은 `false`라서 `===`로는 확인할 수 없어요).
  - 분은 `minutes >= 60`이어야 60에서 오류가 나요. `> 60`으로 쓰면 `"0:60"`을 60분으로 받아들여요.
  - `parts[0] * 60 + parts[1]`처럼 숫자로 바꾸지 않고 더하면 `"1:30"`이 `"6030"` 같은 문자열이 돼요. `Number`로 바꾼 값으로 계산해요.
origin: authored
review:
