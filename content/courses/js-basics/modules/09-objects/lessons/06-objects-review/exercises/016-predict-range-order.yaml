id: js-basics.objects.objects-review.predict-range-order
type: predict_output
difficulty: 2
concepts:
  - { id: js.arr.destructuring, weight: 1 }
  - { id: js.fn.return, weight: 0.3 }
tags: [array, destructuring, position, trace, assessment]
estimatedSeconds: 100
usage: assessment
prompt: |
  기온 기록에서 가장 낮은 값과 가장 높은 값을 찾는 함수예요. 결과를 배열 구조 분해로 받아 출력해요. 실행하면 콘솔에 무엇이 출력될까요? 두 줄을 모두 쓰세요.
spec:
  lang: js
  code: |
    function range(list) {
      let low = list[0];
      let high = list[0];
      for (const n of list) {
        if (n < low) {
          low = n;
        }
        if (n > high) {
          high = n;
        }
      }
      return [low, high];
    }

    const [high, low] = range([7, 3, 9, 5]);
    console.log("최고 " + high);
    console.log("최저 " + low);
  answerKind: console
  misconceptionByAnswer:
    "최고 9\n최저 3": js.mc.array-destructuring-by-name
misconceptions: [js.mc.array-destructuring-by-name]
hints:
  - 먼저 `range([7, 3, 9, 5])`가 돌려주는 배열을 구해 보세요. 0번과 1번에 각각 무엇이 있나요?
  - 배열 구조 분해는 변수 이름과 함수 안의 변수 이름을 맞춰 보나요, 아니면 다른 기준으로 값을 넣나요?
  - 15번 줄의 대괄호 안 첫 번째 자리에 있는 변수가 받는 값이 무엇인지 생각해 보세요.
explanation: |
  출력은 다음과 같아요.

  ```text
  최고 3
  최저 9
  ```

  - `range([7, 3, 9, 5])`는 가장 낮은 값 3과 가장 높은 값 9를 찾아 `[3, 9]`를 돌려줘요.
  - 배열 구조 분해는 **이름이 아니라 위치**로 값을 넣어요. `const [high, low] = [3, 9];`에서 첫 자리의 `high`에 0번 요소 3이, 둘째 자리의 `low`에 1번 요소 9가 들어가요.
  - 함수 안의 변수 이름이 `low`, `high`였다는 것은 바깥에서 아무 의미가 없어요. 돌려준 것은 이름 없는 배열 `[3, 9]`일 뿐이에요.

  `최고 9`, `최저 3`이라고 생각했다면 배열 구조 분해가 이름으로 맞춰진다고 본 거예요. 의도대로 받으려면 `const [low, high] = range(...)`처럼 돌려주는 순서에 맞춰 써야 해요.
