id: js-basics.objects.objects-review.fix-workout-summary
type: fix_bug
difficulty: 3
concepts:
  - { id: js.obj.keys-values-entries, weight: 1 }
  - { id: js.arr.for-of, weight: 0.3 }
  - { id: js.loops.accumulator-pattern, weight: 0.3 }
tags: [object, object-keys, object-values, length, accumulator, debugging, assessment]
estimatedSeconds: 240
usage: assessment
prompt: |
  운동 기록 앱의 함수 `weekSummary(log)`예요. `log`는 요일 이름을 키로, 그날 운동한 시간(분)을 값으로 담은 객체예요. 운동한 날 수와 총 운동 시간을 문자열로 돌려줘요.

  | 호출 | 돌려줄 값 |
  |---|---|
  | `weekSummary({ mon: 30, wed: 45, fri: 20 })` | `"3일 · 총 95분"` |
  | `weekSummary({})` | `"0일 · 총 0분"` |

  지금은 결과가 이상해요. 버그를 모두 고치세요. 버그는 하나가 아닐 수 있어요. 받은 객체는 바꾸지 마세요.
spec:
  buggy:
    files:
      - path: main.js
        content: |
          function weekSummary(log) {
            const days = log.length;
            let total = 0;
            for (const minutes of Object.keys(log)) {
              total += minutes;
            }
            return days + "일 · 총 " + total + "분";
          }
  solution:
    files:
      - path: main.js
        content: |
          function weekSummary(log) {
            const days = Object.keys(log).length;
            let total = 0;
            for (const minutes of Object.values(log)) {
              total += minutes;
            }
            return days + "일 · 총 " + total + "분";
          }
  entry: weekSummary
  bugDescription: "`weekSummary({ mon: 30, wed: 45, fri: 20 })`가 `\"undefined일 · 총 0monwedfri분\"`을 돌려줘요."
  bugMisconception: js.mc.object-has-length
  checks:
    - kind: call
      id: basic
      description: 운동한 날 3일과 총 95분이 담긴 문자열을 돌려줘야 합니다.
      requirement: 날 수와 총 시간
      args: [{ "mon": 30, "wed": 45, "fri": 20 }]
      expect: { equals: "3일 · 총 95분" }
      misconceptionIfFail: js.mc.object-has-length
    - kind: call
      id: empty
      description: 기록이 없으면 0일, 총 0분이어야 합니다.
      requirement: 날 수와 총 시간
      args: [{}]
      expect: { equals: "0일 · 총 0분" }
      misconceptionIfFail: js.mc.object-has-length
    - kind: call
      id: one-day
      visible: false
      description: 하루만 운동했으면 그날의 시간이 총 시간이어야 합니다.
      requirement: 날 수와 총 시간
      args: [{ "sun": 60 }]
      expect: { equals: "1일 · 총 60분" }
    - kind: call
      id: many-days
      visible: false
      description: 처음 보는 요일과 시간도 모두 세고 더해야 합니다.
      requirement: 날 수와 총 시간
      args: [{ "tue": 15, "thu": 25, "sat": 40, "sun": 10, "mon": 5 }]
      expect: { equals: "5일 · 총 95분" }
    - kind: call
      id: keep-log
      visible: false
      description: 받은 객체를 바꾸면 안 됩니다.
      requirement: 원래 객체 지키기
      args: [{ "mon": 30, "wed": 45 }]
      expect: { argsUnchanged: true }
misconceptions: [js.mc.object-has-length]
hints:
  - "`days`와 `total`이 각각 어떤 값이 되는지 따로 확인해 보세요. 결과의 `undefined`와 `monwedfri`는 어디서 왔을까요?"
  - 일반 객체에도 배열처럼 `length` 속성이 있나요? `Object.keys(log)`가 돌려주는 배열에는 무엇이 들어 있나요?
  - 속성 개수는 키 배열의 길이로 셀 수 있어요. 더해야 하는 것은 키가 아니라 값이에요. 값만 담은 배열을 돌려주는 메서드를 떠올려 보세요.
explanation: |
  예시 정답이에요.

  ```js
  function weekSummary(log) {
    const days = Object.keys(log).length;
    let total = 0;
    for (const minutes of Object.values(log)) {
      total += minutes;
    }
    return days + "일 · 총 " + total + "분";
  }
  ```

  버그는 두 개예요.

  1. **`log.length`**: 일반 객체에는 `length` 속성이 없어서 `undefined`예요. 속성 개수는 `Object.keys(log).length`로 세요.
  1. **`Object.keys(log)`로 더하기**: `Object.keys`는 키 이름 배열 `["mon", "wed", "fri"]`를 돌려줘요. `0 + "mon"`은 문자열 이어 붙이기가 되어 `"0monwedfri"`가 나왔어요. 운동 시간은 값이므로 `Object.values(log)`로 `[30, 45, 20]`을 돌아야 해요.

  - 첫 번째 버그만 고치면 `"3일 · 총 0monwedfri분"`, 두 번째만 고치면 `"undefined일 · 총 95분"`이에요.
  - `Object.values(log).length`로 날 수를 세도 정답이에요. 키와 값의 개수는 같아요.
  - `for (const day in log) { total += log[day]; }`처럼 `for...in`으로 키를 받아 값을 읽어도 돼요.
