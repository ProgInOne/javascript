id: js-basics.objects.objects-review.impl-combine-print
type: implement_function
difficulty: 4
concepts:
  - { id: js.obj.spread, weight: 1 }
  - { id: js.fn.rest-params, weight: 0.5 }
  - { id: js.obj.copy-shallow, weight: 0.3 }
tags: [object, spread, rest, no-mutation, write-code, assessment]
estimatedSeconds: 300
usage: assessment
prompt: |
  프린터의 인쇄 설정을 합치는 함수 `combine(base, ...patches)`를 완성하세요. 기본 설정 `base` 뒤에 바꿀 내용 객체를 **몇 개든** 받아, 앞에서부터 차례로 반영한 **새 설정 객체**를 돌려줘요.

  ```js
  const base = { copies: 1, color: false, side: "단면" };
  combine(base, { copies: 3 }, { side: "양면", copies: 2 });
  // { copies: 2, color: false, side: "양면" }
  combine(base);
  // { copies: 1, color: false, side: "단면" } (base와 내용은 같은 새 객체)
  ```

  - 같은 설정이 여러 번 나오면 **나중에 받은 값**이 이겨요.
  - 바꿀 내용에 `base`에 없는 설정이 있으면 결과에 더해요.
  - 바꿀 내용이 하나도 없어도 `base`가 아닌 새 객체를 돌려줘요.
  - 받은 객체는 하나도 바뀌면 안 돼요. 숨겨진 테스트는 다른 설정으로 확인해요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          function combine(base, ...patches) {
            // base에 patches를 차례로 반영한 새 객체를 돌려주세요.
          }
  entry: combine
  solution:
    files:
      - path: main.js
        content: |
          function combine(base, ...patches) {
            let result = { ...base };
            for (const patch of patches) {
              result = { ...result, ...patch };
            }
            return result;
          }
  checks:
    - kind: call
      id: two-patches
      description: 바꿀 내용 두 개를 차례로 반영해야 합니다(나중 값이 이김).
      requirement: 차례로 반영
      args: [{ copies: 1, color: false, side: "단면" }, { copies: 3 }, { side: "양면", copies: 2 }]
      expect: { equals: { copies: 2, color: false, side: "양면" } }
      misconceptionIfFail: js.mc.spread-order-irrelevant
    - kind: call
      id: no-patch
      description: 바꿀 내용이 없으면 base와 내용이 같은 객체를 돌려줘야 합니다.
      requirement: 바꿀 내용 없음
      args: [{ copies: 1, color: false, side: "단면" }]
      expect: { equals: { copies: 1, color: false, side: "단면" } }
    - kind: call
      id: no-patch-new
      visible: false
      description: 바꿀 내용이 없어도 base 자체가 아닌 새 객체를 돌려줘야 합니다.
      requirement: 바꿀 내용 없음
      args: [{ copies: 4, color: true }]
      expect: { returnsNewReference: true }
      misconceptionIfFail: js.mc.assign-copies-object
    - kind: call
      id: three-patches
      visible: false
      description: 바꿀 내용이 세 개여도 앞에서부터 차례로 반영해야 합니다.
      requirement: 차례로 반영
      args: [{ copies: 1, color: false }, { color: true }, { copies: 5 }, { color: false }]
      expect: { equals: { copies: 5, color: false } }
      misconceptionIfFail: js.mc.spread-order-irrelevant
    - kind: call
      id: new-setting
      visible: false
      description: base에 없던 설정도 결과에 더해야 합니다.
      requirement: 새 설정 더하기
      args: [{ copies: 1 }, { paper: "A3" }]
      expect: { equals: { copies: 1, paper: "A3" } }
    - kind: call
      id: keep-inputs
      visible: false
      description: base와 바꿀 내용 객체가 바뀌면 안 됩니다.
      requirement: 원본 지키기
      args: [{ copies: 1, color: false, side: "단면" }, { copies: 3 }, { side: "양면" }]
      expect: { argsUnchanged: true }
      misconceptionIfFail: js.mc.spread-mutates-original
misconceptions: [js.mc.spread-order-irrelevant, js.mc.spread-mutates-original, js.mc.assign-copies-object]
hints:
  - "`...patches`는 받은 나머지 인수를 배열로 모아요. 바꿀 내용 객체를 하나씩 꺼내려면 무엇을 쓰면 될까요?"
  - 결과 객체를 하나 두고, 바꿀 내용마다 "지금까지의 결과"와 "이번 내용"을 합친 새 객체로 바꿔 가세요. 둘 중 어느 쪽을 나중에 펼쳐야 할까요?
  - 결과 객체를 처음에 어떻게 만들어야 바꿀 내용이 없을 때도 `base`가 아닌 새 객체가 될지 생각해 보세요.
explanation: |
  예시 정답이에요.

  ```js
  function combine(base, ...patches) {
    let result = { ...base };
    for (const patch of patches) {
      result = { ...result, ...patch };
    }
    return result;
  }
  ```

  - 매개변수의 `...patches`는 **나머지 매개변수**라서 두 번째 인수부터 모두 배열로 모아요. 바꿀 내용이 없으면 빈 배열이에요.
  - 객체 안의 `...result`, `...patch`는 **전개 구문**이에요. `{ ...result, ...patch }`처럼 이번 내용을 나중에 펼쳐야 같은 키에서 새 값이 이겨요. `{ ...patch, ...result }`로 쓰면 바꿀 내용이 무시돼요.
  - 처음에 `let result = { ...base };`로 복사해 두므로 바꿀 내용이 없어도 새 객체를 돌려줘요. `let result = base;`로 시작하면 바꿀 내용이 없을 때 `base` 자체를 돌려줘서 숨겨진 테스트가 실패해요.
  - `result[key] = patch[key]`처럼 `base`에 직접 대입하면 넘긴 기본 설정이 바뀌어요. 전개 구문으로 새 객체를 만들면 원본은 그대로예요.
  - 설정 값은 모두 원시 값이라 얕은 복사로 충분해요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
