id: js-basics.objects.objects-review.predict-camp-copy
type: predict_output
difficulty: 3
concepts:
  - { id: js.obj.copy-shallow, weight: 1 }
  - { id: js.obj.equality, weight: 0.3 }
  - { id: js.arr.element-update, weight: 0.3 }
tags: [object, shallow-copy, array-of-objects, spread, trace, assessment]
estimatedSeconds: 150
usage: assessment
prompt: |
  여름 캠프의 반 목록을 복사해 두고, 원래 목록을 고치는 프로그램이에요. 목록의 요소는 반마다 하나씩인 객체예요. 실행하면 콘솔에 무엇이 출력될까요? 두 줄을 모두 쓰세요.
spec:
  lang: js
  code: |
    const groups = [
      { name: "다람쥐반", kids: 8 },
      { name: "고래반", kids: 6 },
    ];
    const plan = [...groups];

    groups[0].kids = 10;
    groups[1] = { name: "고래반", kids: 9 };
    groups.push({ name: "펭귄반", kids: 5 });

    console.log(plan.length, plan[0].kids, plan[1].kids);
    console.log(plan[0] === groups[0], plan[1] === groups[1]);
  answerKind: console
  misconceptionByAnswer:
    "2 8 6\nfalse false": js.mc.shallow-copy-is-deep
    "3 10 9\ntrue true": js.mc.copy-equals-original
misconceptions: [js.mc.shallow-copy-is-deep, js.mc.copy-equals-original]
hints:
  - "`[...groups]`는 배열을 새로 만들어요. 새 배열의 칸에 담기는 반 객체도 새로 만들어질까요?"
  - 7~9번 줄이 각각 "두 배열이 함께 가리키는 객체를 고치는지", "`groups`의 칸에 다른 객체를 넣는지", "`groups`에만 칸을 더하는지" 구별해 보세요.
  - 두 배열의 칸이 각각 어떤 객체를 가리키는지 화살표로 그려 보세요. 8번 줄 뒤에 `plan[1]`과 `groups[1]`은 같은 객체인가요?
explanation: |
  출력은 다음과 같아요.

  ```text
  2 10 6
  true false
  ```

  `[...groups]`는 **얕은 복사**예요. 배열은 새로 만들지만, 칸에 든 반 객체는 원본과 같은 것을 가리켜요.

  - 7번 줄 `groups[0].kids = 10`: `groups[0]`과 `plan[0]`은 같은 객체라서 `plan[0].kids`도 10이에요.
  - 8번 줄 `groups[1] = { ... }`: 함께 쓰던 객체를 고친 게 아니라, `groups`의 1번 칸에 **새 객체**를 넣었어요. `plan[1]`은 원래 객체(`kids: 6`)를 그대로 가리켜요.
  - 9번 줄 `push`: `groups` 배열에만 칸을 더해요. `plan`은 다른 배열이라 길이가 2 그대로예요.
  - 마지막 줄: 0번 칸은 여전히 같은 객체라서 `true`, 1번 칸은 8번 줄 뒤로 서로 다른 객체라서 `false`예요.

  `2 8 6`이라고 생각했다면 얕은 복사가 안쪽 객체까지 새로 만든다고 본 거예요. `3 10 9`라고 생각했다면 `plan`이 `groups`와 같은 배열이라고 본 거예요. 안쪽 객체까지 따로 두려면 `structuredClone(groups)`로 깊은 복사본을 만들어요.
origin: authored
review:
