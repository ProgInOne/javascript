id: js-basics.objects.objects-review.tf-alarm-throw
type: true_false
difficulty: 2
concepts:
  - { id: js.errors.throw, weight: 1 }
  - { id: js.errors.try-catch, weight: 0.5 }
tags: [throw, try-catch, error-message, assessment]
estimatedSeconds: 90
usage: assessment
prompt: |
  알람 시각을 확인하는 함수예요. 다음 설명이 맞는지 고르고, 그렇게 판단한 이유도 고르세요.
code: |
  function setAlarm(hour) {
    if (hour < 0 || hour > 23) {
      throw new Error("시각은 0~23이어야 해요");
      console.log("잘못된 시각을 고칩니다");
    }
    return hour + "시 알람";
  }

  try {
    console.log(setAlarm(25));
  } catch (err) {
    console.log(err.message);
  }
spec:
  statement: "이 코드를 실행하면 콘솔에 `잘못된 시각을 고칩니다`가 먼저 출력되고, 그다음 `시각은 0~23이어야 해요`가 출력된다."
  answer: false
  misconceptionIfWrong: js.mc.throw-just-logs
  requireReason: true
  reasons:
    - id: r1
      text: throw는 그 자리에서 함수 실행을 멈추고 오류를 던진다. 다음 줄과 return은 실행되지 않고, catch가 오류를 받아 메시지 한 줄만 출력한다
      correct: true
    - id: r2
      text: throw는 오류 메시지를 남길 뿐이라 함수 안의 다음 줄까지 실행된 뒤에 catch로 넘어간다
      misconception: js.mc.throw-just-logs
    - id: r3
      text: 오류가 나면 catch가 있어도 프로그램이 거기서 멈추므로 콘솔에는 아무것도 출력되지 않는다
      misconception: js.mc.caught-error-stops-program
misconceptions: [js.mc.throw-just-logs, js.mc.caught-error-stops-program]
hints:
  - "`setAlarm(25)`를 부르면 `if` 조건은 참인가요, 거짓인가요?"
  - "`throw`를 만나면 함수는 다음 줄로 넘어가나요, 그 자리에서 끝나나요? `return`까지 갈 수 있을까요?"
  - 던진 오류는 `try`를 감싼 `catch`가 받아요. `catch` 안에서 출력하는 것은 무엇인지 확인해 보세요.
explanation: |
  설명은 **틀렸어요**. 콘솔에는 `시각은 0~23이어야 해요` 한 줄만 나와요.

  - `25`는 23보다 커서 `if` 블록에 들어가요. `throw new Error(...)`를 만나면 그 자리에서 함수 실행이 멈추고 오류가 던져져요. 바로 다음 줄의 `console.log("잘못된 시각을 고칩니다")`와 `return`은 실행되지 않아요.
  - `setAlarm(25)`가 값을 돌려주지 못했으므로 `try` 안의 `console.log(...)`도 출력하지 못하고, 곧바로 `catch`로 넘어가요. `err.message`는 `Error`를 만들 때 넣은 문자열이에요.

  - "`throw`는 메시지만 남기고 다음 줄이 실행된다"는 이유는 `throw`를 `console.log`처럼 본 거예요. `throw`는 실행 흐름을 끊어요.
  - "catch가 있어도 프로그램이 멈춘다"도 틀렸어요. `catch`로 잡은 오류는 처리된 것이라, `catch` 블록이 실행되고 프로그램은 그다음 줄부터 이어 가요.
origin: authored
