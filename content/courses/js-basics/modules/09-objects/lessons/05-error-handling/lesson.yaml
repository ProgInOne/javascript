id: js-basics.objects.error-handling
title: 오류 처리 기초
summary: throw로 오류를 던지고, try...catch로 실행 중 오류를 잡아 오류 객체의 name과 message를 읽으며, finally로 항상 실행할 정리 코드를 쓰는 방법을 배웁니다.
kind: lesson
importance: standard
estimatedMinutes: { read: 14, practice: 24 }
concepts:
  primary: [js.errors.throw, js.errors.try-catch, js.errors.finally]
  reviewed: [js.errors.error-messages, js.errors.error-types, js.obj.dot-bracket, js.fn.return]
objectives:
  - 처리할 수 없는 입력을 받았을 때 throw new Error로 알리는 함수를 만들 수 있다.
  - try...catch가 실행되는 순서를 예측하고, catch에서 오류 객체의 name과 message를 읽을 수 있다.
  - try...catch로 잡을 수 있는 오류와 잡을 수 없는 문법 오류를 구별할 수 있다.
  - finally가 언제 실행되는지 예측할 수 있다.
practice:
  targetCount: 16
