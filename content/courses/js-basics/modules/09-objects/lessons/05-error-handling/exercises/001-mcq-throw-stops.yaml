id: js-basics.objects.error-handling.mcq-throw-stops
type: mcq_single
difficulty: 1
concepts:
  - { id: js.errors.throw, weight: 1 }
tags: [throw, error]
estimatedSeconds: 60
prompt: |
  아래 코드를 실행하면 콘솔에 무엇이 출력되나요?
code: |
  function checkStock(count) {
    if (count === 0) {
      throw new Error("품절이에요");
    }
    console.log("재고 확인 완료");
    return count;
  }

  console.log("주문 시작");
  checkStock(0);
  console.log("주문 끝");
spec:
  options:
    - id: a
      text: "`주문 시작`이 출력된 뒤 프로그램이 멈추고 `Error: 품절이에요` 오류가 나온다"
    - id: b
      text: "`주문 시작`, `품절이에요`, `재고 확인 완료`, `주문 끝`이 차례로 출력된다"
      misconception: js.mc.throw-just-logs
      rationale: throw는 메시지를 출력하고 넘어가는 문장이 아니에요. 그 자리에서 실행을 멈춰요.
    - id: c
      text: "`주문 시작`, `품절이에요`, `주문 끝`이 차례로 출력된다"
      misconception: js.mc.throw-just-logs
      rationale: 함수는 거기서 끝나지만, 잡는 곳이 없으니 프로그램 전체도 멈춰요. 11번 줄은 실행되지 않아요.
    - id: d
      text: 아무것도 출력되지 않는다. throw가 있으면 프로그램이 시작되지 않는다
      rationale: throw는 문법 오류가 아니라 실행 중에 던지는 오류예요. 9번 줄은 먼저 실행돼요.
  correct: a
misconceptions: [js.mc.throw-just-logs]
hints:
  - "`throw`는 출력하는 문장일까요, 실행을 멈추는 문장일까요?"
  - 이 코드에는 `try...catch`가 없어요. 아무도 잡지 않은 오류는 어떻게 되나요?
  - 10번 줄에서 던진 오류가 잡히지 않으면 모듈 1에서 본 실행 중 오류와 같은 일이 일어나요. 그 앞 줄과 뒤 줄은 각각 어떻게 될까요?
explanation: |
  `주문 시작`이 출력된 뒤, 10번 줄의 호출에서 3번 줄의 `throw`가 실행되어 오류가 던져져요. 이 오류를 잡는 `try...catch`가 없으니 프로그램 전체가 멈추고, 콘솔에 `Error: 품절이에요`가 줄 번호와 함께 나와요.

  - `throw`는 `console.log`처럼 메시지를 출력하고 넘어가는 문장이 아니에요. 5~6번 줄도, 11번 줄도 실행되지 않아요.
  - `throw`는 문법 오류가 아니에요. 문법 검사는 통과하므로 프로그램은 시작되고, 9번 줄은 실행돼요.
origin: authored
review:
