id: js-basics.objects.error-handling.fix-finally-loading
type: fix_bug
difficulty: 3
concepts:
  - { id: js.errors.finally, weight: 1 }
  - { id: js.errors.try-catch, weight: 0.5 }
  - { id: js.scope.global, weight: 0.3 }
tags: [finally, try-catch, cleanup, debugging]
estimatedSeconds: 200
prompt: |
  상품 가격을 보여 주는 동안 "불러오는 중" 상태를 켜 두는 프로그램이에요. 상태는 바깥 변수 `loading`에 있어요. 가격을 보여 주는 데 **성공하든 실패하든**, 함수가 끝나면 `loading`은 다시 `false`가 되어야 해요.

  지금은 가격 정보가 없는 상품에서 실패한 뒤 `loading`이 `true`로 남아요. 버그를 고쳐서 아래처럼 출력되게 하세요. 정리 작업을 어디에 두면 성공·실패 모두에서 실행될지 생각해 보세요.

  ```text
  불러오는 중...
  김밥: 3000원
  로딩 중: false
  불러오는 중...
  가격을 불러오지 못했어요
  로딩 중: false
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          let loading = false;

          function showPrice(product) {
            loading = true;
            console.log("불러오는 중...");
            try {
              console.log(product.name + ": " + product.price.won + "원");
              loading = false;
            } catch (err) {
              console.log("가격을 불러오지 못했어요");
            }
          }

          showPrice({ name: "김밥", price: { won: 3000 } });
          console.log("로딩 중: " + loading);
          showPrice({ name: "라면" });
          console.log("로딩 중: " + loading);
  solution:
    files:
      - path: main.js
        content: |
          let loading = false;

          function showPrice(product) {
            loading = true;
            console.log("불러오는 중...");
            try {
              console.log(product.name + ": " + product.price.won + "원");
            } catch (err) {
              console.log("가격을 불러오지 못했어요");
            } finally {
              loading = false;
            }
          }

          showPrice({ name: "김밥", price: { won: 3000 } });
          console.log("로딩 중: " + loading);
          showPrice({ name: "라면" });
          console.log("로딩 중: " + loading);
  bugDescription: "두 번째 상품에서 실패한 뒤 `로딩 중: true`가 출력돼요."
  checks:
    - kind: console
      id: output
      description: '두 상품 모두 함수가 끝난 뒤 "로딩 중: false"가 출력되어야 합니다.'
      requirement: 성공·실패 모두 로딩 끄기
      expect:
        lines: ["불러오는 중...", "김밥: 3000원", "로딩 중: false", "불러오는 중...", "가격을 불러오지 못했어요", "로딩 중: false"]
    - kind: program
      id: loading-off
      description: 프로그램이 오류 없이 끝나고 loading이 false여야 합니다.
      requirement: 성공·실패 모두 로딩 끄기
      expect:
        globals: { loading: { equals: false } }
        noError: true
misconceptions: [js.mc.try-resumes-after-catch]
hints:
  - "`라면`에는 `price`가 없어요. 7번 줄에서 오류가 나면 8번 줄은 실행되나요?"
  - 오류가 난 뒤 `try`의 남은 줄로는 돌아가지 않아요. `loading = false;`가 성공한 경우에만 실행되는 자리에 있어요.
  - 성공하든 실패하든 항상 마지막에 실행되는 블록이 있어요. 그 블록을 `catch` 뒤에 붙이고 정리 작업을 옮겨 보세요.
explanation: |
  `loading = false;`를 `try`에서 빼서 `finally` 블록으로 옮겨요.

  ```js
  try {
    console.log(product.name + ": " + product.price.won + "원");
  } catch (err) {
    console.log("가격을 불러오지 못했어요");
  } finally {
    loading = false;
  }
  ```

  - `라면`에는 `price`가 없어서 `product.price`가 `undefined`이고, `.won`을 읽는 7번 줄에서 `TypeError`가 나요. 오류가 난 뒤 `try`의 나머지(8번 줄)는 건너뛰고 다시 돌아가지 않아요. 그래서 원래 코드에서는 실패할 때 `loading`이 `true`로 남았어요.
  - `finally`는 성공해도, 실패해서 `catch`가 실행돼도 항상 실행돼요. 성공·실패와 상관없이 해야 하는 정리 작업의 자리예요.
  - `catch` 안에도 `loading = false;`를 한 줄 더 써도 출력은 같아요. 하지만 같은 줄을 두 곳에 두면 나중에 한쪽만 고치는 실수가 생기기 쉬워요. 한 곳(`finally`)에 두는 편이 안전해요.
