prompt: |
  시작 코드의 `toQuantity(text)`는 수량 문자열을 숫자로 바꿔 돌려주고, 숫자가 아니면 오류를 던져요. 이 함수를 써서 `checkOrders(texts)`를 만드세요. `texts`는 수량 문자열의 배열이에요.

  - 입력을 차례로 `toQuantity`로 확인해요.
  - 성공하면 `(수량)개 확인`, 실패하면 `수량 오류: (오류 메시지)`를 결과 배열에 넣어요. 실패해도 **다음 입력은 계속 확인**해야 해요.
  - 마지막에 `확인된 주문: (성공한 수)건`을 넣고, 결과 배열을 돌려줘요.

  ```js
  checkOrders(["3", "열", "2"]);
  // ["3개 확인", "수량 오류: 수량은 숫자로 입력해 주세요", "2개 확인", "확인된 주문: 2건"]
  ```

  채점은 다른 입력 목록으로도 해요.
