  entry: checkOrders
  solution:
    files:
      - path: main.js
        content: |
          function toQuantity(text) {
            const qty = Number(text);
            if (Number.isNaN(qty)) {
              throw new Error("수량은 숫자로 입력해 주세요");
            }
            return qty;
          }

          function checkOrders(texts) {
            const lines = [];
            let okCount = 0;
            for (const text of texts) {
              try {
                lines.push(toQuantity(text) + "개 확인");
                okCount++;
              } catch (err) {
                lines.push("수량 오류: " + err.message);
              }
            }
            lines.push("확인된 주문: " + okCount + "건");
            return lines;
          }
  checks:
    - kind: call
      id: example
      args: [["3", "열", "2"]]
