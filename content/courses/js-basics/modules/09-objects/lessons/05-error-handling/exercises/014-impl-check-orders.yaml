id: js-basics.objects.error-handling.impl-check-orders
type: implement_function
difficulty: 2
concepts:
  - { id: js.errors.try-catch, weight: 1 }
  - { id: js.errors.throw, weight: 0.3 }
tags: [try-catch, program, write-code]
estimatedSeconds: 240
prompt: |
  시작 코드의 `toQuantity(text)`는 수량 문자열을 숫자로 바꿔 돌려주고, 숫자가 아니면 오류를 던져요. 이 함수는 고치지 말고, 아래에 프로그램을 쓰세요.

  1. `"3"`, `"열"`, `"2"`를 차례로 `toQuantity`로 확인해요.
  1. 성공하면 `(수량)개 확인`을 출력하고, 확인된 주문 수를 세는 변수 `okCount`를 1 늘려요.
  1. 실패하면 `수량 오류: (오류 메시지)`를 출력해요. 실패해도 **다음 입력은 계속 확인**해야 해요.
  1. 마지막에 `확인된 주문: (okCount)건`을 출력해요.

  ```text
  3개 확인
  수량 오류: 수량은 숫자로 입력해 주세요
  2개 확인
  확인된 주문: 2건
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          function toQuantity(text) {
            const qty = Number(text);
            if (Number.isNaN(qty)) {
              throw new Error("수량은 숫자로 입력해 주세요");
            }
            return qty;
          }

          // 여기에 프로그램을 쓰세요. 확인된 주문 수는 okCount 변수에 세요.
  solution:
    files:
      - path: main.js
        content: |
          function toQuantity(text) {
            const qty = Number(text);
            if (Number.isNaN(qty)) {
              throw new Error("수량은 숫자로 입력해 주세요");
            }
            return qty;
          }

          // 여기에 프로그램을 쓰세요. 확인된 주문 수는 okCount 변수에 세요.
          let okCount = 0;

          try {
            console.log(toQuantity("3") + "개 확인");
            okCount++;
          } catch (err) {
            console.log("수량 오류: " + err.message);
          }

          try {
            console.log(toQuantity("열") + "개 확인");
            okCount++;
          } catch (err) {
            console.log("수량 오류: " + err.message);
          }

          try {
            console.log(toQuantity("2") + "개 확인");
            okCount++;
          } catch (err) {
            console.log("수량 오류: " + err.message);
          }

          console.log("확인된 주문: " + okCount + "건");
  checks:
    - kind: console
      id: output
      description: 세 입력의 확인 결과와 확인된 주문 수가 차례로 출력되어야 합니다.
      requirement: 하나씩 확인하고 계속 진행
      expect:
        lines: ["3개 확인", "수량 오류: 수량은 숫자로 입력해 주세요", "2개 확인", "확인된 주문: 2건"]
    - kind: program
      id: ok-count
      description: 프로그램이 오류 없이 끝나고 okCount에 2가 들어 있어야 합니다.
      requirement: 확인된 주문 세기
      expect:
        globals: { okCount: { equals: 2 } }
        noError: true
misconceptions: [js.mc.try-resumes-after-catch, js.mc.caught-error-stops-program]
hints:
  - 세 입력을 모두 한 `try` 블록에 넣으면 어떻게 될지 먼저 생각해 보세요. `"열"`에서 오류가 난 뒤 `"2"`는 확인될까요?
  - 오류가 난 줄 뒤의 `try`로는 돌아가지 않아요. 입력마다 따로 오류를 잡아야 다음 입력으로 넘어갈 수 있어요.
  - "`okCount`는 맨 위에서 0으로 만들고, 성공했을 때만 늘려요. 오류가 나면 그 `try` 안에서 오류 난 줄 뒤에 있는 코드는 실행되지 않는다는 점을 이용해 보세요."
explanation: |
  예시 정답의 핵심이에요. 입력마다 `try...catch`를 따로 써요.

  ```js
  let okCount = 0;

  try {
    console.log(toQuantity("3") + "개 확인");
    okCount++;
  } catch (err) {
    console.log("수량 오류: " + err.message);
  }
  // "열"과 "2"도 같은 모양으로 한 번씩
  console.log("확인된 주문: " + okCount + "건");
  ```

  - **따로 감싸기**: 세 입력을 한 `try`에 넣으면 `"열"`에서 오류가 난 뒤 `try`의 나머지를 건너뛰어서 `"2"`는 확인되지 않아요. `catch` 뒤에 `try`로 돌아가지 않기 때문이에요.
  - **성공했을 때만 세기**: `okCount++`를 `toQuantity` 호출 **뒤**, 같은 `try` 안에 두면 오류가 난 입력에서는 실행되지 않아요. `catch` 뒤나 `try...catch` 밖에 두면 실패한 입력까지 세어 3건이 돼요.
  - **잡힌 오류는 프로그램을 멈추지 않아요**: 그래서 마지막 줄 `확인된 주문: 2건`까지 출력돼요.

  반복문(`for...of`)과 배열을 쓰면 같은 `try...catch`를 한 번만 써서 더 짧게 만들 수 있어요. 반복 **안에** `try...catch`를 두면 돼요.
