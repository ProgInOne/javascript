hints:
  - 반복 전체를 하나의 `try`로 감싸면 어떻게 될지 먼저 생각해 보세요. `"열"`에서 오류가 난 뒤 `"2"`는 확인될까요?
  - 오류가 난 줄 뒤의 `try`로는 돌아가지 않아요. 입력마다 따로 오류를 잡으려면 `try...catch`를 반복의 바깥과 안쪽 중 어디에 둬야 할까요?
  - 성공한 수는 반복 앞에서 0으로 만들고, 성공했을 때만 늘려요. 오류가 나면 같은 `try` 안에서 오류 난 줄 뒤의 코드는 실행되지 않는다는 점을 이용해 보세요.
explanation: |
  예시 정답이에요.

  ```js
  function checkOrders(texts) {
    const lines = [];
    let okCount = 0;
    for (const text of texts) {
      try {
        lines.push(toQuantity(text) + "개 확인");
        okCount++;
      } catch (err) {
        lines.push("수량 오류: " + err.message);
      }
    }
    lines.push("확인된 주문: " + okCount + "건");
    return lines;
  }
  ```

  - **반복 안에서 잡기**: `try...catch`를 반복 **바깥**에 두면 `"열"`에서 오류가 난 뒤 `try`의 나머지, 즉 반복 전체를 건너뛰어서 `"2"`는 확인되지 않아요. `catch` 뒤에 `try`로 돌아가지 않기 때문이에요. 반복 **안**에 두면 입력마다 따로 잡혀요.
  - **성공했을 때만 세기**: `okCount++`를 `toQuantity` 호출 **뒤**, 같은 `try` 안에 두면 오류가 난 입력에서는 실행되지 않아요. `catch` 뒤나 `try...catch` 밖에 두면 실패한 입력까지 세어요.
  - **잡힌 오류는 함수를 멈추지 않아요**: 그래서 반복이 끝까지 돌고 마지막 줄 `확인된 주문: ...건`까지 들어가요.
  - `toQuantity`를 고쳐서 오류 대신 다른 값을 돌려주게 해도 결과를 맞출 수는 있지만, 이 문제는 던져진 오류를 잡아 처리하는 연습이에요.
