  entry: checkout
  solution:
    files:
      - path: main.js
        content: |
          function charge(wallet, price) {
            if (typeof price !== "number" || price <= 0) {
              throw new Error("가격이 올바르지 않아요");
            }
            if (price > wallet.balance) {
              throw new Error("잔액이 부족해요");
            }
            wallet.balance -= price;
          }

          function checkout(wallet, price) {
            wallet.tries++;
            const label = "[" + wallet.tries + "번째 시도] ";
            try {
              charge(wallet, price);
              return label + "결제 완료 (남은 잔액 " + wallet.balance + "원)";
            } catch (err) {
              return label + "결제 실패: " + err.message;
            }
          }
  checks:
    - kind: call
      id: success
      args: [{ balance: 10000, tries: 0 }, 3000]
      requirement: 결제 완료 안내
      expect: { equals: "[1번째 시도] 결제 완료 (남은 잔액 7000원)" }
    - kind: call
      id: not-enough
      args: [{ balance: 2000, tries: 0 }, 5000]
      requirement: 결제 실패 안내
      expect: { equals: "[1번째 시도] 결제 실패: 잔액이 부족해요" }
    - kind: call
      id: exact-balance
      visible: false
      description: 이미 2번 시도한 지갑에서 잔액을 딱 맞게 쓰면 3번째 시도로 완료되고 남은 잔액이 0원이어야 합니다.
      requirement: 결제 완료 안내
      args: [{ balance: 5000, tries: 2 }, 5000]
      expect: { equals: "[3번째 시도] 결제 완료 (남은 잔액 0원)" }
    - kind: call
      id: failed-try-counts
      visible: false
      description: 실패한 결제도 시도 횟수에 들어가야 합니다(1번 시도한 지갑에서 실패하면 2번째 시도).
      requirement: 실패해도 시도 횟수 세기
      args: [{ balance: 1000, tries: 1 }, 1500]
      expect: { equals: "[2번째 시도] 결제 실패: 잔액이 부족해요" }
    - kind: call
      id: negative-price
      visible: false
      description: 가격이 0 이하이면 charge가 던진 메시지로 실패를 알려야 합니다.
      requirement: 결제 실패 안내
      args: [{ balance: 5000, tries: 4 }, -100]
      expect: { equals: "[5번째 시도] 결제 실패: 가격이 올바르지 않아요" }
    - kind: call
      id: text-price
      visible: false
      description: 가격을 문자열로 넘겨도 오류가 밖으로 나가지 않고 실패 안내를 돌려줘야 합니다.
      requirement: 결제 실패 안내
      args: [{ balance: 5000, tries: 0 }, "3000"]
      expect: { equals: "[1번째 시도] 결제 실패: 가격이 올바르지 않아요" }
misconceptions: [js.mc.try-resumes-after-catch, js.mc.object-param-copied]
hints:
  - "`charge`가 오류를 던지면 `checkout`도 그 자리에서 끝나 버려요. 오류를 밖으로 내보내지 않으려면 `charge` 호출을 어떻게 감싸야 할까요?"
  - "`charge`는 넘겨받은 지갑 객체의 `balance`를 직접 바꿔요. 같은 객체를 함께 쓰므로 `charge`가 끝난 뒤 `wallet.balance`를 읽으면 남은 잔액이에요."
  - 시도 횟수를 늘리는 줄의 위치가 중요해요. `try` 안에서 `charge` 호출 **뒤**에 두면 실패했을 때 그 줄은 어떻게 될까요? 문장을 만들기 전에 횟수가 이미 늘어 있어야 해요.
explanation: |
  예시 정답이에요.

  ```js
  function checkout(wallet, price) {
    wallet.tries++;
    const label = "[" + wallet.tries + "번째 시도] ";
    try {
      charge(wallet, price);
      return label + "결제 완료 (남은 잔액 " + wallet.balance + "원)";
    } catch (err) {
      return label + "결제 실패: " + err.message;
    }
  }
  ```

  - **오류를 안내로 바꾸기**: `charge`를 `try`로 감싸고, `catch`에서 `err.message`로 문장을 만들어 돌려줘요. `charge`가 던진 오류가 `checkout` 밖으로 나가지 않아요.
  - **시도 횟수는 먼저**: `wallet.tries++`를 `try` 안의 `charge` 호출 뒤에 두면, 실패할 때 오류가 난 줄 뒤의 `try`는 건너뛰므로 횟수가 늘지 않아요. 숨긴 검사 "실패해도 시도 횟수 세기"에서 틀려요. 맨 앞에서 늘리면 성공·실패 모두 세져요.
  - **`finally`에 두면?** 성공·실패 모두 실행되지만, `finally`는 `return`할 값이 이미 만들어진 **뒤**에 실행돼요. 문장에 들어갈 횟수가 하나 모자라게 나와요. 문장을 만들기 전에 해야 하는 일은 앞에 둬요.
  - **같은 객체**: `charge`는 넘겨받은 `wallet`의 `balance`를 직접 빼요. 객체는 참조로 넘어가므로, `checkout`에서 `wallet.balance`를 읽으면 결제 뒤의 잔액이에요. 실패하면 `charge`가 잔액을 바꾸기 전에 던지므로 잔액은 그대로예요.
