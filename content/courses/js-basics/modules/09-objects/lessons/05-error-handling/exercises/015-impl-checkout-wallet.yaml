  - { id: js.errors.try-catch, weight: 1 }
  - { id: js.errors.throw, weight: 0.5 }
  - { id: js.obj.reference, weight: 0.3 }
tags: [try-catch, throw, object, state, write-code, boundary]
estimatedSeconds: 540
prompt: |
  간편 결제 지갑이에요. 지갑은 `{ balance: 잔액, tries: 지금까지 결제를 시도한 횟수 }` 모양의 객체예요. 시작 코드의 `charge(wallet, price)`는 지갑에서 가격만큼 잔액을 빼고, 결제할 수 없으면 잔액을 바꾸지 않고 오류를 던져요. `charge`는 고치지 마세요.

  `charge`를 써서 `checkout(wallet, price)`를 만드세요.

  - 부를 때마다 결제 시도이므로, **성공하든 실패하든** `wallet.tries`를 1 늘려요.
  - 결제에 성공하면 `[(시도 횟수)번째 시도] 결제 완료 (남은 잔액 (잔액)원)`을 돌려줘요.
  - `charge`가 오류를 던지면 오류를 밖으로 내보내지 말고 `[(시도 횟수)번째 시도] 결제 실패: (오류 메시지)`를 돌려줘요.

  ```js
  checkout({ balance: 10000, tries: 0 }, 3000);
  // "[1번째 시도] 결제 완료 (남은 잔액 7000원)"
  checkout({ balance: 2000, tries: 0 }, 5000);
  // "[1번째 시도] 결제 실패: 잔액이 부족해요"
  ```

  채점은 시도 횟수가 이미 있는 지갑, 잔액을 딱 맞게 쓰는 경우, 잘못된 가격도 넣어 봐요.
