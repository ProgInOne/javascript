id: js-basics.objects.error-handling.mcq-finally-when
type: mcq_single
difficulty: 1
concepts:
  - { id: js.errors.finally, weight: 1 }
tags: [finally]
estimatedSeconds: 50
prompt: |
  `try...catch...finally`에서 `finally` 블록은 언제 실행되나요?
spec:
  options:
    - id: a
      text: "`try`가 오류 없이 끝나든, 오류가 나서 `catch`가 실행되든 항상 마지막에 실행된다"
    - id: b
      text: "`try`에서 오류가 났을 때만 `catch` 다음에 실행된다"
      misconception: js.mc.finally-only-on-error
      rationale: 오류가 났을 때만 실행할 일은 catch에 써요. finally는 오류가 없어도 실행돼요.
    - id: c
      text: "`try`가 오류 없이 끝났을 때만 실행된다"
      rationale: 오류 없이 끝났을 때만 할 일은 try 블록 끝에 쓰면 돼요. finally는 오류가 나도 실행돼요.
    - id: d
      text: "`try` 안에서 `return`하지 않았을 때만 실행된다"
      rationale: try 안에서 return해도 함수가 끝나기 직전에 finally가 실행돼요.
  correct: a
misconceptions: [js.mc.finally-only-on-error]
hints:
  - "`finally`라는 영어 단어는 \"마지막으로\"라는 뜻이에요."
  - 오류일 때만 할 일은 이미 `catch`에 쓸 수 있어요. 그렇다면 `finally`는 어떤 일을 위해 있을까요?
  - 레슨의 세 번째 예제에서 오류가 없던 첫 호출에도 `로딩 표시 끄기`가 나왔는지 떠올려 보세요.
explanation: |
  `finally`는 **항상** 마지막에 실행돼요. `try`가 오류 없이 끝나도, 오류가 나서 `catch`가 실행돼도, `try`나 `catch` 안에서 `return`해도 실행돼요.

  그래서 "불러오는 중" 표시 끄기처럼 성공하든 실패하든 꼭 해야 하는 정리 작업을 `finally`에 둬요.

  - "오류가 났을 때만": 그건 `catch`가 하는 일이에요.
  - "오류 없이 끝났을 때만": 그런 일은 `try` 블록 끝에 쓰면 돼요.
  - "`return`하지 않았을 때만": `return`이 있어도 함수가 끝나기 직전에 `finally`가 먼저 실행돼요.
