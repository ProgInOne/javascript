id: js-basics.objects.error-handling.predict-try-resume
type: predict_output
difficulty: 3
concepts:
  - { id: js.errors.try-catch, weight: 1 }
  - { id: js.obj.dot-bracket, weight: 0.3 }
tags: [try-catch, trace, type-error]
estimatedSeconds: 130
prompt: |
  주문 정보를 출력하는 프로그램이에요. `order`에는 `customer` 속성이 없어요. 실행하면 콘솔에 무엇이 출력될까요? 출력되는 줄을 모두 쓰세요.
spec:
  lang: js
  code: |
    const order = { menu: "라면", price: 4500 };

    console.log("주문 확인");
    try {
      console.log("메뉴: " + order.menu);
      console.log("손님: " + order.customer.name);
      console.log("가격: " + order.price);
    } catch (err) {
      console.log("손님 정보 없음 (" + err.name + ")");
    }
    console.log("주문 확인 끝");
  answerKind: console
  misconceptionByAnswer:
    "주문 확인\n메뉴: 라면\n손님 정보 없음 (TypeError)\n가격: 4500\n주문 확인 끝": js.mc.try-resumes-after-catch
    "주문 확인\n메뉴: 라면\n손님 정보 없음 (TypeError)": js.mc.caught-error-stops-program
    "주문 확인\n메뉴: 라면\n손님: undefined\n가격: 4500\n주문 확인 끝": js.mc.missing-property-error
misconceptions: [js.mc.try-resumes-after-catch, js.mc.caught-error-stops-program]
hints:
  - "`order.customer`는 어떤 값인가요? 그 값에서 다시 `.name`을 읽으면 어떻게 되나요?"
  - 6번 줄에서 오류가 나면 7번 줄은 어떻게 될까요? `catch`가 끝난 뒤에는 어디로 가나요?
  - 오류가 난 줄 뒤의 `try` 블록으로는 돌아가지 않아요. 잡힌 오류가 프로그램 전체를 멈추는지도 생각해 보세요.
explanation: |
  출력은 다음과 같아요.

  ```text
  주문 확인
  메뉴: 라면
  손님 정보 없음 (TypeError)
  주문 확인 끝
  ```

  - 5번 줄은 문제없이 `메뉴: 라면`을 출력해요.
  - 6번 줄의 `order.customer`는 없는 속성이라 `undefined`예요. 여기까지는 오류가 아니지만, `undefined`에서 `.name`을 읽는 순간 `TypeError`가 나요.
  - 오류가 났으니 `try`의 나머지인 7번 줄은 **건너뛰어요**. `catch`가 끝나도 `try`로 돌아가지 않으므로 `가격: 4500`은 끝까지 나오지 않아요.
  - 오류는 잡혔으니 프로그램은 멈추지 않고 11번 줄 `주문 확인 끝`이 출력돼요.

  가격까지 출력된다고 답했다면 `catch` 뒤에 `try`의 남은 줄이 이어진다고 본 거예요. 마지막 줄을 뺐다면 잡힌 오류도 프로그램을 멈춘다고 본 거예요. 가격도 꼭 보여 줘야 한다면 그 줄을 `try...catch` 다음으로 옮겨요.
origin: authored
