hints:
  - "`makeUsername`에서는 `if (name.length < 2)`로 확인하고, 그때 `throw new Error(\"...\")`로 오류를 던져요. `console.log`로 출력하는 것과 달라요."
  - "`safeUsername`에서는 `try { ... } catch (err) { ... }` 안에서 `makeUsername(name)`의 결과를 `return`해요."
  - "`catch` 쪽에서는 `return \"가입 실패: \" + err.message;`처럼 오류 객체의 `message`를 읽어요."
explanation: |
  예시 답안이에요.

  ```js
  function makeUsername(name) {
    if (name.length < 2) {
      throw new Error("이름은 두 글자 이상이어야 해요");
    }
    return "@" + name;
  }

  function safeUsername(name) {
    try {
      return makeUsername(name);
    } catch (err) {
      return "가입 실패: " + err.message;
    }
  }
  ```

  - `throw`를 만나면 `makeUsername`은 그 자리에서 끝나고, 오류가 부른 쪽으로 전달돼요. 그래서 `"@" + name`까지 가지 않아요.
  - `safeUsername`의 `catch`가 그 오류를 `err`로 받아요. 오류의 설명은 `err.message`에 있어요.
  - 오류를 잡았기 때문에 짧은 이름이 들어와도 프로그램은 멈추지 않아요.
