      description: 빈 문자열도 두 글자보다 짧으니 실패 안내를 돌려줘야 합니다.
      requirement: 짧은 이름은 실패 안내
      args: [""]
      expect: { equals: "가입 실패: 이름은 두 글자 이상이어야 해요" }
    - kind: call
      id: two-letters
      visible: false
      description: 딱 두 글자인 이름은 올바른 이름입니다.
      requirement: 올바른 이름
      args: ["JS"]
      expect: { equals: "@JS" }
    - kind: call
      id: make-throws
      visible: false
      description: makeUsername은 짧은 이름에서 값을 돌려주지 말고 Error를 던져야 합니다.
      requirement: 짧은 이름은 오류 던지기
      argsExpr: '(() => { try { makeUsername("J"); return ["안던짐"]; } catch (err) { return [err instanceof Error && err.message === "이름은 두 글자 이상이어야 해요" ? "OK" : "다른오류"]; } })()'
      expect: { equals: "@OK" }
