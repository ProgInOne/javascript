            // name이 두 글자보다 짧으면 오류를 던지고, 아니면 "@" + name을 돌려주세요.
          }

          function safeUsername(name) {
            // try...catch로 makeUsername을 부르세요.
          }

          console.log(safeUsername("민지"));
          console.log(safeUsername("J"));
  entry: safeUsername
  solution:
    files:
      - path: main.js
        content: |
          function makeUsername(name) {
            if (name.length < 2) {
              throw new Error("이름은 두 글자 이상이어야 해요");
            }
            return "@" + name;
          }

          function safeUsername(name) {
            try {
              return makeUsername(name);
            } catch (err) {
              return "가입 실패: " + err.message;
            }
          }

          console.log(safeUsername("민지"));
          console.log(safeUsername("J"));
  checks:
    - { kind: call, id: ok, args: ["민지"], expect: { equals: "@민지" }, requirement: 올바른 이름 }
    - { kind: call, id: too-short, args: ["J"], expect: { equals: "가입 실패: 이름은 두 글자 이상이어야 해요" }, requirement: 짧은 이름은 실패 안내, misconceptionIfFail: js.mc.throw-just-logs }
    - kind: call
      id: empty
