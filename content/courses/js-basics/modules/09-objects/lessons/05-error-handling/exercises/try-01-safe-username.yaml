id: js-basics.objects.error-handling.try-safe-username
type: implement_function
usage: try
difficulty: 2
concepts:
  - { id: js.errors.try-catch, weight: 1 }
  - { id: js.errors.throw, weight: 0.5 }
tags: [throw, try-catch, write-code]
estimatedSeconds: 270
prompt: |
  회원 가입 화면의 아이디를 만드는 함수 두 개를 직접 써 보세요.

  1. `makeUsername(name)`: `name`이 **두 글자보다 짧으면** 메시지가 `이름은 두 글자 이상이어야 해요`인 `Error`를 던져요. 아니면 `"@" + name`을 돌려줘요.
  2. `safeUsername(name)`: `try...catch`로 `makeUsername(name)`을 불러요. 성공하면 그 결과를, 오류가 나면 `"가입 실패: (오류 메시지)"`를 돌려줘요.

  채점은 `safeUsername`을 불러 보고, `makeUsername`이 짧은 이름에서 오류를 던지는지도 확인해요.

  | 호출 | 돌려줄 값 |
  |---|---|
  | `safeUsername("민지")` | `"@민지"` |
  | `safeUsername("J")` | `"가입 실패: 이름은 두 글자 이상이어야 해요"` |
