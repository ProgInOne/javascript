id: js-basics.objects.reference-vs-value.check-shared-lunch
type: predict_output
usage: check
difficulty: 1
concepts:
  - { id: js.obj.reference, weight: 1 }
tags: [object, reference, assignment]
estimatedSeconds: 60
prompt: |
  점심 메뉴 객체를 다른 변수에 대입한 뒤, 그 변수로 가격을 바꿨어요. 실행하면 콘솔에 무엇이 출력될까요? 두 줄을 차례로 적어 보세요.
spec:
  lang: js
  code: |
    const lunch = { menu: "비빔밥", price: 8000 };
    const dinner = lunch;
    dinner.price = 9000;
    console.log(lunch.price);
    console.log(dinner.price);
  answerKind: console
  misconceptionByAnswer:
    "8000\n9000": js.mc.assign-copies-object
misconceptions: [js.mc.assign-copies-object]
hints:
  - "`const dinner = lunch;`를 하면 새 객체가 생길까요, 아니면 같은 객체를 함께 가리킬까요?"
  - 객체를 대입하면 객체 자체가 아니라 "어느 객체인지"를 가리키는 참조가 복사돼요.
  - 객체는 하나뿐이에요. `dinner`로 바꾼 가격을 `lunch`로 읽으면 어떻게 될까요?
explanation: |
  출력은 다음과 같아요.

  ```text
  9000
  9000
  ```

  - 2번 줄은 새 객체를 만들지 않아요. `dinner`에는 `lunch`와 **같은 객체**의 참조가 들어가요.
  - 3번 줄은 그 객체 하나의 `price`를 바꿔요. 그래서 어느 변수로 읽어도 `9000`이에요.
  - 따로 바꾸고 싶다면 `const dinner = { ...lunch };`처럼 새 객체를 만들어야 해요.
origin: authored
review:
