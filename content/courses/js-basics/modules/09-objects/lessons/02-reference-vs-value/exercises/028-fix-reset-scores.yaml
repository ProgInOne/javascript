id: js-basics.objects.reference-vs-value.fix-reset-scores
type: fix_bug
difficulty: 3
concepts:
  - { id: js.obj.reference, weight: 1 }
  - { id: js.fn.params-args, weight: 0.3 }
  - { id: js.loops.for, weight: 0.3 }
tags: [reference, parameter, reassign, debugging]
estimatedSeconds: 180
prompt: |
  새 시즌이 시작되어 모든 선수의 점수를 0으로 만들려고 해요. `resetScore(player)`는 받은 선수의 점수를 0으로 만드는 함수예요. 그런데 실행해 보면 점수가 그대로예요. 버그를 고쳐서 아래처럼 출력되게 하세요.

  ```text
  0 0
  ```

  선수의 이름은 바뀌면 안 돼요.
spec:
  buggy:
    files:
      - path: main.js
        content: |
          function resetScore(player) {
            player = { name: player.name, score: 0 };
          }

          const players = [
            { name: "민지", score: 80 },
            { name: "준호", score: 65 },
          ];

          for (const p of players) {
            resetScore(p);
          }

          console.log(players[0].score, players[1].score);
  solution:
    files:
      - path: main.js
        content: |
          function resetScore(player) {
            player.score = 0;
          }

          const players = [
            { name: "민지", score: 80 },
            { name: "준호", score: 65 },
          ];

          for (const p of players) {
            resetScore(p);
          }

          console.log(players[0].score, players[1].score);
  bugDescription: "오류는 없지만 `80 65`가 출력돼요. 점수가 하나도 바뀌지 않았어요."
  bugMisconception: js.mc.param-reassign-replaces-object
  checks:
    - kind: console
      id: output
      description: 두 선수의 점수가 모두 0으로 출력되어야 합니다.
      requirement: 점수 초기화
      expect:
        lines: ["0 0"]
    - kind: program
      id: players-reset
      description: 프로그램이 끝난 뒤 players의 두 선수는 이름은 그대로, 점수는 0이어야 합니다.
      requirement: 점수 초기화
      expect:
        globals:
          players: { equals: [{ name: "민지", score: 0 }, { name: "준호", score: 0 }] }
        noError: true
      misconceptionIfFail: js.mc.param-reassign-replaces-object
misconceptions: [js.mc.param-reassign-replaces-object]
hints:
  - "`resetScore(p)`를 부르면 `player`는 어떤 객체를 가리키나요? 2번 줄이 끝나면 `player`는 어떤 객체를 가리키나요?"
  - 2번 줄은 새 객체를 만들어 매개변수에 대입해요. 이것이 배열 안의 선수 객체에 영향을 주나요?
  - 배열 안의 선수 객체를 바꾸려면 매개변수가 가리키는 그 객체의 속성을 바꿔야 해요.
explanation: |
  2번 줄을 속성 바꾸기로 고쳐요.

  ```js
  function resetScore(player) {
    player.score = 0;
  }
  ```

  - `resetScore(p)`를 부르면 `player`에는 배열 안 선수 객체의 참조가 들어와요.
  - 원래 2번 줄은 **매개변수에 새 객체를 대입**해요. `player`의 화살표만 새 객체로 옮겨질 뿐, 배열 안의 선수 객체는 손대지 않아요. 새 객체는 함수가 끝나면 사라져요.
  - `player.score = 0;`은 매개변수가 가리키는 객체, 즉 배열 안의 선수 객체를 바꿔요. 그래서 `players`에서도 점수가 0으로 보여요.
  - 함수가 새 객체를 `return`하게 하고 반복을 `for (let i = 0; i < players.length; i++) { players[i] = resetScore(players[i]); }`처럼 바꿔도 결과는 같아요. 단, `for (const p of players) { p = resetScore(p); }`는 `const` 변수에 대입해서 오류가 나고, `let`으로 바꿔도 반복 변수만 바뀌어 배열은 그대로예요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
