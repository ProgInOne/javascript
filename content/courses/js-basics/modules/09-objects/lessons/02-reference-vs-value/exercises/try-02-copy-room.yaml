id: js-basics.objects.reference-vs-value.try-copy-room
type: implement_function
usage: try
difficulty: 2
concepts:
  - { id: js.obj.copy-shallow, weight: 1 }
  - { id: js.obj.reference, weight: 0.3 }
tags: [object, copy, spread, nested, write-code]
estimatedSeconds: 240
prompt: |
  반 좌석표 `room`을 복사해서 연습용 좌석표 `practice`를 만들어 보세요.

  - `practice`의 `title`과 `seats`를 바꿔도 `room`은 **처음 그대로** 남아야 해요.
  - 그러려면 객체뿐 아니라 안쪽 `seats` 배열도 새로 만들어야 해요.

  시작 코드의 주석 자리에 `practice`를 만드는 한 줄을 쓰면, 아래처럼 출력돼요.

  ```text
  { title: "1반", seats: ["민지", "준호"] }
  { title: "연습반", seats: ["민지", "준호", "서연"] }
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const room = { title: "1반", seats: ["민지", "준호"] };

          // 여기에 room을 복사한 practice를 만드세요.

          practice.title = "연습반";
          practice.seats.push("서연");
          console.log(room);
          console.log(practice);
  solution:
    files:
      - path: main.js
        content: |
          const room = { title: "1반", seats: ["민지", "준호"] };

          // 여기에 room을 복사한 practice를 만드세요.
          const practice = { ...room, seats: [...room.seats] };

          practice.title = "연습반";
          practice.seats.push("서연");
          console.log(room);
          console.log(practice);
  checks:
    - kind: console
      id: output
      description: room은 처음 그대로, practice는 바뀐 제목과 서연이 더해진 좌석으로 출력되어야 합니다.
      requirement: 따로 바뀌는 복사본
      expect:
        lines:
          - '{ title: "1반", seats: ["민지", "준호"] }'
          - '{ title: "연습반", seats: ["민지", "준호", "서연"] }'
      misconceptionIfFail: js.mc.shallow-copy-is-deep
    - kind: program
      id: room-kept
      description: 프로그램이 끝났을 때 room의 seats에는 민지와 준호 두 명만 있어야 합니다.
      requirement: 따로 바뀌는 복사본
      expect:
        globals:
          room: { equals: { title: "1반", seats: ["민지", "준호"] } }
        noError: true
      misconceptionIfFail: js.mc.shallow-copy-is-deep
misconceptions: [js.mc.shallow-copy-is-deep, js.mc.assign-copies-object]
hints:
  - "`const practice = room;`은 같은 객체를 가리킬 뿐이라 복사가 아니에요. 새 객체는 `{ ...room }`처럼 펼쳐서 만들어요."
  - "`{ ...room }`만 쓰면 `seats` 칸에는 같은 배열의 참조가 복사돼요. `push`가 `room`에도 보이게 돼요."
  - "펼친 뒤 `seats`만 새 배열로 덮어써요: `{ ...room, seats: [...room.seats] }`. `structuredClone(room)`도 돼요."
explanation: |
  예시 답안이에요.

  ```js
  const practice = { ...room, seats: [...room.seats] };
  ```

  - `{ ...room }`은 새 객체를 만들지만 얕은 복사라서, `seats`는 `room`과 같은 배열이에요. 그대로 두면 `push("서연")`이 `room`에서도 보여요.
  - 뒤에 쓴 `seats: [...room.seats]`가 복사해 온 `seats`를 대신해서, 안쪽 배열까지 따로 생겨요.
  - `const practice = structuredClone(room);`도 안쪽까지 모두 새로 만들어서 같은 결과예요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
