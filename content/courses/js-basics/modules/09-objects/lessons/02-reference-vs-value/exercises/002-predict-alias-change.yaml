id: js-basics.objects.reference-vs-value.predict-alias-change
type: predict_output
difficulty: 2
concepts:
  - { id: js.obj.reference, weight: 1 }
  - { id: js.values.assignment, weight: 0.3 }
tags: [reference, primitive, assignment, trace]
estimatedSeconds: 90
prompt: |
  게임 캐릭터의 레벨과 장비를 다루는 코드예요. 실행하면 콘솔에 무엇이 출력될까요? 두 줄을 모두 쓰세요.
spec:
  lang: js
  code: |
    let level = 3;
    let nextLevel = level;
    nextLevel = 4;

    const hero = { weapon: "나무 검" };
    const sidekick = hero;
    sidekick.weapon = "강철 검";

    console.log(level, nextLevel);
    console.log(hero.weapon, sidekick.weapon);
  answerKind: console
  misconceptionByAnswer:
    "3 4\n나무 검 강철 검": js.mc.assign-copies-object
hints:
  - 숫자를 대입할 때와 객체를 대입할 때 각각 무엇이 복사되는지 나눠 생각해 보세요.
  - "`level`과 `nextLevel`은 각자 값을 가져요. `hero`와 `sidekick`은 객체를 몇 개 가리키나요?"
  - 7번 줄이 바꾼 객체를 `hero`로 읽으면 무엇이 보일지, 3번 줄이 `level`에 영향을 주는지 따로 따져 보세요.
explanation: |
  출력은 다음과 같아요.

  ```text
  3 4
  강철 검 강철 검
  ```

  - 숫자는 원시 값이라 2번 줄에서 **값** 3이 복사돼요. 3번 줄은 `nextLevel`만 4로 바꾸고 `level`은 3 그대로예요.
  - 객체는 6번 줄에서 **참조**가 복사돼요. `hero`와 `sidekick`은 같은 객체를 가리키므로, 7번 줄에서 바꾼 `weapon`이 두 변수 모두에서 `강철 검`으로 보여요.

  둘째 줄을 `나무 검 강철 검`이라고 썼다면 객체도 숫자처럼 복사된다고 본 거예요. 첫째 줄을 `4 4`라고 썼다면 반대로 숫자도 함께 바뀐다고 본 거예요. 원시 값과 객체의 대입은 다르게 움직여요.
