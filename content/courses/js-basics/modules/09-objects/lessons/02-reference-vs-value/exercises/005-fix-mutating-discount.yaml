id: js-basics.objects.reference-vs-value.fix-mutating-discount
type: fix_bug
difficulty: 3
concepts:
  - { id: js.obj.reference, weight: 1 }
  - { id: js.obj.copy-shallow, weight: 0.5 }
tags: [reference, function, copy, debugging]
estimatedSeconds: 180
prompt: |
  `applySale(product, rate)`는 상품에 할인율을 적용한 **할인 상품**을 돌려주는 함수예요. 정가 상품 `shirt`는 그대로 남아 있어야 해요. 버그를 고쳐서 아래처럼 출력되게 하세요.

  ```text
  티셔츠 정가: 20000원
  티셔츠 할인가: 18000원
  ```

  할인 상품에는 `onSale: true`가 붙고, 정가 상품에는 붙지 않아야 해요.
spec:
  buggy:
    files:
      - path: main.js
        content: |
          function applySale(product, rate) {
            product.price = product.price * (1 - rate);
            product.onSale = true;
            return product;
          }

          const shirt = { name: "티셔츠", price: 20000 };
          const saleShirt = applySale(shirt, 0.1);

          console.log(shirt.name + " 정가: " + shirt.price + "원");
          console.log(saleShirt.name + " 할인가: " + saleShirt.price + "원");
  solution:
    files:
      - path: main.js
        content: |
          function applySale(product, rate) {
            const result = { ...product };
            result.price = product.price * (1 - rate);
            result.onSale = true;
            return result;
          }

          const shirt = { name: "티셔츠", price: 20000 };
          const saleShirt = applySale(shirt, 0.1);

          console.log(shirt.name + " 정가: " + shirt.price + "원");
          console.log(saleShirt.name + " 할인가: " + saleShirt.price + "원");
  bugDescription: "할인가는 맞게 나오지만 정가도 `18000원`으로 나와요."
  bugMisconception: js.mc.object-param-copied
  checks:
    - kind: console
      id: output
      description: 정가와 할인가가 차례로 출력되어야 합니다.
      requirement: 가격 출력
      expect:
        lines: ["티셔츠 정가: 20000원", "티셔츠 할인가: 18000원"]
    - kind: program
      id: original-kept
      description: 프로그램이 끝난 뒤 shirt는 처음 그대로(정가 20000원, onSale 없음)여야 합니다.
      requirement: 정가 상품은 그대로
      expect:
        globals:
          shirt: { equals: { name: "티셔츠", price: 20000 } }
        noError: true
      misconceptionIfFail: js.mc.object-param-copied
    - kind: program
      id: sale-product
      description: saleShirt는 할인가 18000원과 onSale true를 가진 객체여야 합니다.
      requirement: 할인 상품 만들기
      expect:
        globals:
          saleShirt: { equals: { name: "티셔츠", price: 18000, onSale: true } }
misconceptions: [js.mc.object-param-copied, js.mc.assign-copies-object]
hints:
  - "`applySale(shirt, 0.1)`을 부르면 `product`는 어떤 객체를 가리키나요?"
  - 함수 안에서 `product`의 속성을 바꾸면 `shirt`가 가리키는 객체가 바뀌어요. 바꿀 객체를 따로 만들어야 해요.
  - 함수 맨 앞에서 `product`의 속성을 모두 담은 새 객체를 만들고, 그 새 객체의 속성만 바꿔서 돌려주세요. `const result = product;`는 새 객체가 아니에요.
explanation: |
  예시 정답이에요.

  ```js
  function applySale(product, rate) {
    const result = { ...product };
    result.price = product.price * (1 - rate);
    result.onSale = true;
    return result;
  }
  ```

  - 원래 코드에서 `product`에는 `shirt`의 참조가 들어와요. 2~3번 줄은 그 객체를 직접 바꾸고, 4번 줄은 같은 객체를 돌려줘요. 그래서 `shirt`와 `saleShirt`가 같은 객체가 되어 정가도 18000원으로 보였어요.
  - `{ ...product }`로 새 객체를 만들어 바꾸면 `shirt`는 그대로 남고, `saleShirt`만 할인가와 `onSale: true`를 가져요.
  - `const result = product;`로 바꾸면 이름만 다를 뿐 같은 객체라서 버그가 그대로예요.
  - `{ name: product.name, price: product.price * (1 - rate), onSale: true }`처럼 새 객체를 직접 만들어 돌려줘도 정답이에요. 다만 상품에 속성이 더 생기면 빠뜨리기 쉬워서 복사하는 방법을 더 많이 써요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
