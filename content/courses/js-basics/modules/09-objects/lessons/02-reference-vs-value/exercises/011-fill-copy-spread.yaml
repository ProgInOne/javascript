id: js-basics.objects.reference-vs-value.fill-copy-spread
type: fill_blank
difficulty: 2
concepts:
  - { id: js.obj.copy-shallow, weight: 1 }
tags: [copy, spread, fill]
estimatedSeconds: 80
prompt: |
  설정 화면에서 "미리 보기"를 누르면 설정을 바꿔 보되, 저장된 설정 `settings`는 그대로 두려고 해요. 빈칸을 채워서 아래처럼 출력되게 하세요.

  ```text
  light
  dark 16
  ```
spec:
  mode: code
  lang: js
  template: |
    const settings = { theme: "light", fontSize: 16 };
    const preview = {{blank:copy}};
    preview.theme = "dark";
    console.log(settings.theme);
    console.log(preview.theme, preview.fontSize);
  blanks:
    - id: copy
      accept: ["{ ...settings }"]
      width: 18
      misconceptionMap:
        "settings": js.mc.assign-copies-object
  checks:
    - kind: console
      id: output
      description: 저장된 테마와 미리 보기의 테마·글자 크기가 차례로 출력되어야 합니다.
      requirement: 미리 보기 출력
      expect:
        lines: ["light", "dark 16"]
    - kind: program
      id: settings-kept
      description: 프로그램이 끝난 뒤 settings는 처음 그대로여야 합니다.
      requirement: 저장된 설정은 그대로
      expect:
        globals:
          settings: { equals: { theme: "light", fontSize: 16 } }
        noError: true
      misconceptionIfFail: js.mc.assign-copies-object
misconceptions: [js.mc.assign-copies-object]
hints:
  - "`preview`를 바꿔도 `settings`가 그대로이려면 두 변수가 같은 객체를 가리키면 안 돼요."
  - "`settings`의 속성을 모두 담은 새 객체를 만들어야 해요. 레슨에서 복사할 때 쓴 문법을 떠올려 보세요."
  - 중괄호 안에 점 세 개와 복사할 객체 이름을 쓰는 문법이었어요.
explanation: |
  빈칸에는 `{ ...settings }`가 들어가요.

  `{ ...settings }`는 `settings`의 속성을 모두 담은 **새 객체**를 만들어요. 그래서 3번 줄에서 `preview.theme`을 바꿔도 `settings.theme`은 `light` 그대로예요. `fontSize`는 복사되어 `preview.fontSize`도 16이에요.

  빈칸에 `settings`만 쓰면 참조가 복사되어 두 변수가 같은 객체를 가리켜요. 그러면 첫 줄도 `dark`가 나와요.

  `structuredClone(settings)`를 써도 새 객체가 만들어지므로 정답이에요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
