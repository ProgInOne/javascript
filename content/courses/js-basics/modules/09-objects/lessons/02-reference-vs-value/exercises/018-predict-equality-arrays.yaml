id: js-basics.objects.reference-vs-value.predict-equality-arrays
type: predict_output
difficulty: 2
concepts:
  - { id: js.obj.equality, weight: 1 }
  - { id: js.obj.reference, weight: 0.5 }
tags: [equality, array, reference]
estimatedSeconds: 100
prompt: |
  장바구니 배열을 비교하는 프로그램이에요. 실행하면 콘솔에 무엇이 출력될까요? 세 줄을 모두 쓰세요.
spec:
  lang: js
  code: |
    function same(a, b) {
      return a === b;
    }

    const cartA = ["사과"];
    const cartB = ["사과"];
    const cartC = cartA;
    cartC.push("배");

    console.log(same(cartA, cartB), same(cartA, cartC));
    console.log(cartA.length, cartB.length);
    console.log(cartA[0] === cartB[0]);
  answerKind: console
  misconceptionByAnswer:
    "true true\n2 1\ntrue": js.mc.same-content-objects-equal
    "false false\n1 1\ntrue": js.mc.array-assign-copies
hints:
  - 배열도 객체예요. `[ ]`로 배열이 몇 개 만들어졌나요?
  - "`cartC = cartA`는 새 배열을 만드나요? 8번 줄의 `push`는 어느 배열에 들어가나요?"
  - 배열끼리의 `===`와, 문자열 `"사과"`끼리의 `===`가 각각 무엇을 비교하는지 나눠 보세요.
explanation: |
  출력은 다음과 같아요.

  ```text
  false true
  2 1
  true
  ```

  - `cartA`와 `cartB`는 내용이 같아도 따로 만든 배열이라 `===`가 `false`예요. 함수에 넘겨도 참조가 그대로 전달되므로 결과는 같아요.
  - `cartC = cartA`는 참조 복사라서 같은 배열이에요(`true`). 8번 줄의 `push`도 그 배열에 들어가서 `cartA.length`는 2예요. `cartB`는 따로라서 1이에요.
  - `cartA[0]`과 `cartB[0]`은 둘 다 문자열 `"사과"`예요. 원시 값은 값을 비교하므로 `true`예요.

  첫 줄을 `true true`라고 썼다면 내용이 같은 배열은 `===`로 같다고 본 거예요. 길이를 `1 1`이라고 썼다면 배열을 대입하면 복사된다고 본 거예요.
