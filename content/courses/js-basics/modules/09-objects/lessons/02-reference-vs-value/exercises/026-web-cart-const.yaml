id: js-basics.objects.reference-vs-value.web-cart-const
type: web_task
difficulty: 4
concepts:
  - { id: js.obj.const-mutation, weight: 1 }
  - { id: js.obj.dot-bracket, weight: 0.3 }
  - { id: js.fn.callback, weight: 0.3 }
tags: [const, mutation, web, event, write-code]
estimatedSeconds: 480
prompt: |
  분식집 장바구니 화면을 완성하세요. 장바구니는 `const cart = { items: [], total: 0 };`로 만들어져 있고, 화면을 그리는 `show()`와 버튼 연결은 시작 코드에 이미 있어요. 화면 객체 `view`는 처음 만든 장바구니 객체를 기억해 두고, `show()`는 그 객체의 내용을 그려요.

  할 일은 함수 두 개를 만드는 거예요.

  1. `addItem(name, price)`: 메뉴 이름을 `cart.items` 끝에 더하고, 가격을 `cart.total`에 더한 뒤 `show()`를 불러요.
  1. `clearCart()`: 장바구니를 비워요(담은 메뉴 없음, 합계 0). 그다음 `show()`를 불러요. **비운 뒤에도 다시 담을 수 있어야 해요.**
spec:
  focus: dom
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>분식 장바구니</title>
              <style>
                body { font-family: sans-serif; padding: 16px; }
                button { font-size: 16px; margin: 0 8px 8px 0; }
                .num { font-weight: bold; }
              </style>
            </head>
            <body>
              <h1>분식 장바구니</h1>
              <button id="add-tteok">떡볶이 담기 (4000원)</button>
              <button id="add-gimbap">김밥 담기 (3000원)</button>
              <button id="clear">비우기</button>
              <p>담은 개수: <span id="count" class="num">0</span>개</p>
              <p>합계: <span id="total" class="num">0</span>원</p>
              <p>담은 메뉴: <span id="list"></span></p>
              <script>
                // 버튼(selector)을 누를 때마다 callback을 불러 주는 도우미예요(모듈 10에서 배워요).
                function whenClicked(selector, callback) {
                  document.querySelector(selector).addEventListener("click", callback);
                }

                const cart = { items: [], total: 0 };

                // 화면은 처음 만든 장바구니 객체를 기억해 두고, show()가 그 객체의 내용을 그려요.
                const view = { cart: cart };
                function show() {
                  document.querySelector("#count").textContent = view.cart.items.length;
                  document.querySelector("#total").textContent = view.cart.total;
                  document.querySelector("#list").textContent = view.cart.items.join(", ");
                }

                // 1) addItem(name, price): 메뉴 이름을 cart.items 끝에 더하고, 가격을 cart.total에 더한 뒤 show()를 불러요.

                // 2) clearCart(): cart를 비운 뒤(담은 메뉴 없음, 합계 0) show()를 불러요.

                whenClicked("#add-tteok", () => addItem("떡볶이", 4000));
                whenClicked("#add-gimbap", () => addItem("김밥", 3000));
                whenClicked("#clear", () => clearCart());
              </script>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>분식 장바구니</title>
              <style>
                body { font-family: sans-serif; padding: 16px; }
                button { font-size: 16px; margin: 0 8px 8px 0; }
                .num { font-weight: bold; }
              </style>
            </head>
            <body>
              <h1>분식 장바구니</h1>
              <button id="add-tteok">떡볶이 담기 (4000원)</button>
              <button id="add-gimbap">김밥 담기 (3000원)</button>
              <button id="clear">비우기</button>
              <p>담은 개수: <span id="count" class="num">0</span>개</p>
              <p>합계: <span id="total" class="num">0</span>원</p>
              <p>담은 메뉴: <span id="list"></span></p>
              <script>
                // 버튼(selector)을 누를 때마다 callback을 불러 주는 도우미예요(모듈 10에서 배워요).
                function whenClicked(selector, callback) {
                  document.querySelector(selector).addEventListener("click", callback);
                }

                const cart = { items: [], total: 0 };

                // 화면은 처음 만든 장바구니 객체를 기억해 두고, show()가 그 객체의 내용을 그려요.
                const view = { cart: cart };
                function show() {
                  document.querySelector("#count").textContent = view.cart.items.length;
                  document.querySelector("#total").textContent = view.cart.total;
                  document.querySelector("#list").textContent = view.cart.items.join(", ");
                }

                // 1) addItem(name, price): 메뉴 이름을 cart.items 끝에 더하고, 가격을 cart.total에 더한 뒤 show()를 불러요.
                function addItem(name, price) {
                  cart.items.push(name);
                  cart.total += price;
                  show();
                }

                // 2) clearCart(): cart를 비운 뒤(담은 메뉴 없음, 합계 0) show()를 불러요.
                function clearCart() {
                  cart.items = [];
                  cart.total = 0;
                  show();
                }

                whenClicked("#add-tteok", () => addItem("떡볶이", 4000));
                whenClicked("#add-gimbap", () => addItem("김밥", 3000));
                whenClicked("#clear", () => clearCart());
              </script>
            </body>
          </html>
  checks:
    - kind: event
      id: add-two
      description: 떡볶이를 두 번 담으면 개수 2, 합계 8000, 메뉴 "떡볶이, 떡볶이"가 보여야 합니다.
      requirement: 메뉴 담기
      visible: true
      steps:
        - { action: click, selector: "#add-tteok" }
        - { action: click, selector: "#add-tteok" }
      expect:
        - { selector: "#count", text: { equals: "2" } }
        - { selector: "#total", text: { equals: "8000" } }
        - { selector: "#list", text: { equals: "떡볶이, 떡볶이" } }
    - kind: event
      id: clear
      description: 비우기를 누르면 개수 0, 합계 0, 담은 메뉴 없음이 보여야 합니다.
      requirement: 장바구니 비우기
      visible: true
      steps:
        - { action: click, selector: "#add-gimbap" }
        - { action: click, selector: "#clear" }
      expect:
        - { selector: "#count", text: { equals: "0" } }
        - { selector: "#total", text: { equals: "0" } }
        - { selector: "#list", text: { equals: "" } }
      misconceptionIfFail: js.mc.const-can-reassign
    - kind: event
      id: add-after-clear
      description: 비운 뒤 김밥을 담으면 개수 1, 합계 3000, 메뉴 "김밥"만 보여야 합니다.
      requirement: 비운 뒤 다시 담기
      steps:
        - { action: click, selector: "#add-tteok" }
        - { action: click, selector: "#clear" }
        - { action: click, selector: "#add-gimbap" }
      expect:
        - { selector: "#count", text: { equals: "1" } }
        - { selector: "#total", text: { equals: "3000" } }
        - { selector: "#list", text: { equals: "김밥" } }
      misconceptionIfFail: js.mc.const-can-reassign
    - kind: event
      id: mixed
      description: 비운 뒤 김밥, 떡볶이, 김밥을 차례로 담으면 개수 3, 합계 10000, 메뉴가 담은 순서대로 보여야 합니다.
      requirement: 메뉴 담기
      steps:
        - { action: click, selector: "#clear" }
        - { action: click, selector: "#add-gimbap" }
        - { action: click, selector: "#add-tteok" }
        - { action: click, selector: "#add-gimbap" }
      expect:
        - { selector: "#count", text: { equals: "3" } }
        - { selector: "#total", text: { equals: "10000" } }
        - { selector: "#list", text: { equals: "김밥, 떡볶이, 김밥" } }
misconceptions: [js.mc.const-object-props-frozen, js.mc.const-can-reassign]
hints:
  - 먼저 `addItem`만 만들고 떡볶이 버튼을 눌러 보세요. `cart`가 `const`여도 그 안의 배열과 숫자는 바꿀 수 있어요.
  - "`clearCart`에서 `cart = { items: [], total: 0 };`처럼 쓰면 어떻게 될까요? `cart`는 `const`예요."
  - 장바구니를 새 객체로 바꾸지 말고, 지금 객체의 `items`와 `total`을 빈 값으로 바꾼 뒤 화면을 다시 그려 보세요.
explanation: |
  예시 정답의 핵심이에요.

  ```js
  function addItem(name, price) {
    cart.items.push(name);
    cart.total += price;
    show();
  }

  function clearCart() {
    cart.items = [];
    cart.total = 0;
    show();
  }
  ```

  - **`const` 객체 바꾸기**: `cart`는 `const`지만 `cart.items.push(...)`, `cart.total += ...`, `cart.items = []`는 모두 속성을 바꾸는 일이라 돼요.
  - **함정**: `clearCart`에서 `cart = { items: [], total: 0 };`라고 쓰면 버튼을 누를 때 `TypeError: Assignment to constant variable.`이 나서 장바구니가 비워지지 않아요. `const`가 막는 것은 변수에 새 객체를 대입하는 것뿐이에요.
  - **화면이 기억하는 객체**: `show()`는 `view.cart`, 즉 처음 만든 장바구니 객체를 그려요. `cart`를 `let`으로 바꿔 새 객체를 대입하면 오류는 사라지지만, `view.cart`는 여전히 원래 객체를 가리켜서 화면이 비워지지 않아요. 같은 객체의 속성을 바꿔야 그 객체를 기억하는 모든 곳에 바뀐 내용이 보여요.
  - `cart.items.length = 0;`으로 배열을 비워도 정답이에요.
