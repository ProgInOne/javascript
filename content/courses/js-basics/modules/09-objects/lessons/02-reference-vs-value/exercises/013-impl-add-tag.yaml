id: js-basics.objects.reference-vs-value.impl-add-tag
type: implement_function
difficulty: 3
concepts:
  - { id: js.obj.copy-shallow, weight: 1 }
  - { id: js.obj.reference, weight: 0.5 }
tags: [copy, shallow, nested, array, write-code, no-mutation]
estimatedSeconds: 300
prompt: |
  블로그 글에 태그를 하나 더하는 함수 `addTag(post, tag)`를 만드세요.

  - 받은 글 `post`의 속성을 모두 가진 **새 글 객체**를 돌려줘요.
  - 새 글의 `tags`는 원래 태그들 끝에 `tag`를 더한 배열이에요.
  - 받은 `post`와 그 안의 `tags` 배열은 **바꾸지 않아요**.

  ```text
  addTag({ title: "첫 글", tags: ["일상"] }, "여행")
  → { title: "첫 글", tags: ["일상", "여행"] }
  ```

  채점은 숨긴 글로도 하고, 받은 글이 바뀌었는지도 확인해요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          function addTag(post, tag) {
          }
  entry: addTag
  solution:
    files:
      - path: main.js
        content: |
          function addTag(post, tag) {
            const result = { ...post, tags: [...post.tags] };
            result.tags.push(tag);
            return result;
          }
  checks:
    - kind: call
      id: basic
      args: [{ title: "첫 글", tags: ["일상"] }, "여행"]
      requirement: 태그 더하기
      expect: { equals: { title: "첫 글", tags: ["일상", "여행"] } }
    - kind: call
      id: more-props
      visible: false
      description: 속성이 더 많은 글도 모든 속성을 유지하고, 태그가 없던 글에도 태그를 더해야 합니다.
      requirement: 태그 더하기
      args: [{ id: 5, title: "레시피", likes: 12, tags: [] }, "요리"]
      expect: { equals: { id: 5, title: "레시피", likes: 12, tags: ["요리"] } }
    - kind: call
      id: input-unchanged
      visible: false
      description: 받은 글 객체와 그 안의 tags 배열을 바꾸면 안 됩니다.
      requirement: 원래 글은 그대로
      args: [{ title: "첫 글", tags: ["일상", "산책"] }, "여행"]
      expect: { argsUnchanged: true }
      misconceptionIfFail: js.mc.shallow-copy-is-deep
    - kind: call
      id: new-object
      visible: false
      description: 받은 글과 다른 새 객체를 돌려줘야 합니다.
      requirement: 원래 글은 그대로
      args: [{ title: "첫 글", tags: ["일상"] }, "여행"]
      expect: { returnsNewReference: true }
      misconceptionIfFail: js.mc.assign-copies-object
misconceptions: [js.mc.shallow-copy-is-deep, js.mc.array-assign-copies]
hints:
  - 돌려줄 글은 새 객체여야 하고, 그 안의 `tags`도 원래 배열과 다른 배열이어야 해요. 왜 둘 다 필요할까요?
  - "`{ ...post }`만 만들고 `tags`에 `push`하면, 새 글의 `tags`는 여전히 원래 글과 같은 배열이에요."
  - 새 글을 만든 뒤 `tags` 칸에 원래 태그를 복사한 새 배열을 넣고, 그 새 배열에 태그를 더해 보세요.
explanation: |
  예시 정답이에요.

  ```js
  function addTag(post, tag) {
    const result = { ...post, tags: [...post.tags] };
    result.tags.push(tag);
    return result;
  }
  ```

  - `{ ...post }`는 얕은 복사라서 `tags` 칸에는 원래 배열의 참조가 담겨요. 여기서 바로 `result.tags.push(tag)`를 하면 돌려주는 값은 맞아 보이지만 원래 글의 `tags`도 바뀌어서 "받은 글을 바꾸면 안 됩니다" 검사에서 실패해요.
  - 그래서 `tags: [...post.tags]`로 새 배열을 만들어 `tags` 칸을 바꿔 넣고, 그 새 배열에 더해요.
  - `const result = { ...post, tags: [...post.tags, tag] };` 한 줄로 써도 정답이에요. 배열 전개는 "구조 분해와 전개" 단원에서 더 배워요.
  - `structuredClone(post)`로 복사한 뒤 `push`해도 원래 글이 바뀌지 않아 정답이에요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
