id: js-basics.objects.object-basics.fix-method-this
type: fix_bug
difficulty: 3
concepts:
  - { id: js.obj.methods-intro, weight: 1 }
  - { id: js.obj.add-delete, weight: 0.3 }
tags: [object, method, this, reference-error, debugging]
estimatedSeconds: 180
prompt: |
  교통카드 객체예요. `charge(amount)`는 잔액을 늘리고, `ride()`는 1,500원을 내고 남은 잔액을 문장으로 돌려줘요. 실행하면 오류가 나요. 버그를 고쳐서 아래처럼 출력되게 하세요.

  ```text
  충전 후 잔액: 5000원
  탑승! 남은 잔액: 3500원
  탑승! 남은 잔액: 2000원
  카드에 남은 돈: 2000원
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          const card = {
            balance: 0,
            charge(amount) {
              balance += amount;
              return "충전 후 잔액: " + balance + "원";
            },
            ride() {
              balance -= 1500;
              return "탑승! 남은 잔액: " + balance + "원";
            },
          };

          console.log(card.charge(5000));
          console.log(card.ride());
          console.log(card.ride());
          console.log("카드에 남은 돈: " + card.balance + "원");
  solution:
    files:
      - path: main.js
        content: |
          const card = {
            balance: 0,
            charge(amount) {
              this.balance += amount;
              return "충전 후 잔액: " + this.balance + "원";
            },
            ride() {
              this.balance -= 1500;
              return "탑승! 남은 잔액: " + this.balance + "원";
            },
          };

          console.log(card.charge(5000));
          console.log(card.ride());
          console.log(card.ride());
          console.log("카드에 남은 돈: " + card.balance + "원");
  bugDescription: "실행하면 아무것도 출력되지 않고 `ReferenceError: balance is not defined` 오류가 나요."
  bugMisconception: js.mc.method-reads-props-by-name
  checks:
    - kind: console
      id: output
      description: 충전 결과, 두 번의 탑승 결과, 카드 객체에 남은 잔액이 차례로 출력되어야 합니다.
      requirement: 잔액 계산
      expect:
        lines: ["충전 후 잔액: 5000원", "탑승! 남은 잔액: 3500원", "탑승! 남은 잔액: 2000원", "카드에 남은 돈: 2000원"]
    - kind: program
      id: no-error
      description: 프로그램이 오류 없이 끝나야 합니다.
      requirement: 잔액 계산
      expect:
        noError: true
      misconceptionIfFail: js.mc.method-reads-props-by-name
misconceptions: [js.mc.method-reads-props-by-name, js.mc.undeclared-assign-creates-global]
hints:
  - 오류는 `balance`라는 **변수**가 없다고 말해요. `balance`는 변수인가요, 객체의 속성인가요?
  - 메서드는 객체 안에 있지만, 속성 이름만 쓰면 속성이 아니라 변수를 찾아요.
  - "`card.charge(5000)`처럼 불렀을 때 메서드 안에서 `card`를 가리키는 말이 있었어요. `balance`가 나오는 곳을 모두 확인해 보세요."
explanation: |
  `balance`가 나오는 네 곳을 모두 `this.balance`로 바꿔요.

  ```js
  charge(amount) {
    this.balance += amount;
    return "충전 후 잔액: " + this.balance + "원";
  },
  ride() {
    this.balance -= 1500;
    return "탑승! 남은 잔액: " + this.balance + "원";
  },
  ```

  - 속성은 변수가 아니에요. 메서드 안에서 `balance`라고 쓰면 JavaScript는 변수 `balance`를 찾고, 어디에도 없으니 `ReferenceError`를 내요.
  - `card.charge(5000)`처럼 점을 찍어 부르면 메서드 안의 `this`는 `card`예요. `this.balance`를 바꾸면 객체의 속성이 바뀐 채로 남아서 다음 `ride()`가 이어서 계산해요.
  - '맨 위에 `let balance = 0;`을 만들면 오류는 사라지지만, 바깥 변수만 바뀌고 `card.balance`는 계속 `0`이라 마지막 줄이 `카드에 남은 돈: 0원`이 돼요. 카드의 잔액은 카드 객체 안에 있어야 해요.'
origin: authored
review:
  status: draft
  draftedBy: ai:claude
