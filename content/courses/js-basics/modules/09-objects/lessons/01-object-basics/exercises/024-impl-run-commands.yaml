id: js-basics.objects.object-basics.impl-run-commands
type: implement_function
difficulty: 5
concepts:
  - { id: js.obj.add-delete, weight: 1 }
  - { id: js.obj.dot-bracket, weight: 0.5 }
  - { id: js.str.split-join, weight: 0.3 }
  - { id: js.conv.to-number, weight: 0.3 }
tags: [object, add, delete, bracket, split, parsing, write-code, boundary]
estimatedSeconds: 900
prompt: |
  창고 관리 프로그램을 만들어요. 명령 문자열 목록 `commands`를 차례로 처리하는 함수 `runCommands(commands)`를 만드세요. 창고는 빈 재고 객체(상품 이름 → 개수)에서 시작해요.

  명령은 단어를 공백 하나로 나눈 모양이에요. 명령마다 결과 문장을 하나씩 만들어요.

  | 명령 | 하는 일 | 결과 문장 |
  |---|---|---|
  | `add 상품 개수` | 상품을 개수만큼 늘려요(없던 상품은 0개에서 시작) | `상품: 개수` (늘린 뒤 개수) |
  | `take 상품 개수` | 상품을 개수만큼 꺼내요 | `상품: 개수` (꺼낸 뒤 개수) |
  | `check 상품` | 개수를 확인해요 | `상품: 개수` |
  | 그 밖의 명령 | 아무것도 하지 않아요 | `알 수 없는 명령` |

  `take`와 `check`에는 규칙이 더 있어요.

  - 창고에 없는 상품이면 `없는 상품: 상품`이에요.
  - 꺼낼 개수가 남은 개수보다 많으면 꺼내지 않고 `부족: 상품 (남은 개수)개`예요.
  - 꺼낸 뒤 0개가 되면 그 상품을 재고에서 **지우고** `상품: 품절`이에요.

  모든 명령을 처리한 뒤 `{ messages: 결과 문장 배열, stock: 재고 객체 }`를 돌려줘요.

  ```js
  runCommands(["add milk 3", "take milk 1", "check milk", "check egg"]);
  // { messages: ["milk: 3", "milk: 2", "milk: 2", "없는 상품: egg"], stock: { milk: 2 } }
  ```

  문자열을 나누는 `split`(모듈 7), 숫자로 바꾸는 `Number`(모듈 3), 배열 끝에 값을 넣는 `push`(모듈 8)가 쓸모 있어요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          function runCommands(commands) {
          }
  entry: runCommands
  solution:
    files:
      - path: main.js
        content: |
          function runCommands(commands) {
            const stock = {};
            const messages = [];
            for (const command of commands) {
              const parts = command.split(" ");
              const action = parts[0];
              const item = parts[1];
              const count = Number(parts[2]);
              if (action === "add") {
                if (stock[item] === undefined) {
                  stock[item] = 0;
                }
                stock[item] += count;
                messages.push(item + ": " + stock[item]);
              } else if (action === "take" || action === "check") {
                if (stock[item] === undefined) {
                  messages.push("없는 상품: " + item);
                } else if (action === "check") {
                  messages.push(item + ": " + stock[item]);
                } else if (count > stock[item]) {
                  messages.push("부족: " + item + " " + stock[item] + "개");
                } else {
                  stock[item] -= count;
                  if (stock[item] === 0) {
                    delete stock[item];
                    messages.push(item + ": 품절");
                  } else {
                    messages.push(item + ": " + stock[item]);
                  }
                }
              } else {
                messages.push("알 수 없는 명령");
              }
            }
            return { messages: messages, stock: stock };
          }
  checks:
    - kind: call
      id: example
      args: [["add milk 3", "take milk 1", "check milk", "check egg"]]
      requirement: add·take·check
      expect:
        equals: { messages: ["milk: 3", "milk: 2", "milk: 2", "없는 상품: egg"], stock: { milk: 2 } }
    - kind: call
      id: empty
      args: [[]]
      requirement: add·take·check
      expect: { equals: { messages: [], stock: {} } }
    - kind: call
      id: add-twice
      visible: false
      description: 같은 상품을 두 번 add하면 개수가 더해지고, 개수가 숫자로 계산되어야 합니다(문자열 이어 붙이기가 아님).
      requirement: add·take·check
      args: [["add pen 2", "add pen 10", "add cup 1"]]
      expect: { equals: { messages: ["pen: 2", "pen: 12", "cup: 1"], stock: { pen: 12, cup: 1 } } }
    - kind: call
      id: sold-out
      visible: false
      description: 꺼낸 뒤 0개가 되면 "품절"을 알리고 그 상품을 재고에서 지워야 합니다. 지운 뒤 check하면 없는 상품입니다.
      requirement: 품절이면 지우기
      args: [["add tea 2", "take tea 2", "check tea"]]
      expect: { equals: { messages: ["tea: 2", "tea: 품절", "없는 상품: tea"], stock: {} } }
    - kind: call
      id: not-enough
      visible: false
      description: 남은 개수보다 많이 꺼내려 하면 꺼내지 않고 부족 안내를 해야 합니다.
      requirement: 부족하면 꺼내지 않기
      args: [["add gum 3", "take gum 5", "take gum 3"]]
      expect: { equals: { messages: ["gum: 3", "부족: gum 3개", "gum: 품절"], stock: {} } }
    - kind: call
      id: take-missing
      visible: false
      description: 없는 상품을 take하면 없는 상품 안내를 하고 재고는 그대로여야 합니다.
      requirement: add·take·check
      args: [["take bread 1", "add egg 6"]]
      expect: { equals: { messages: ["없는 상품: bread", "egg: 6"], stock: { egg: 6 } } }
    - kind: call
      id: unknown
      visible: false
      description: add·take·check가 아닌 명령은 알 수 없는 명령으로 처리하고 재고를 바꾸지 않아야 합니다.
      requirement: 알 수 없는 명령
      args: [["sell milk 1", "add milk 1", "remove milk 1"]]
      expect: { equals: { messages: ["알 수 없는 명령", "milk: 1", "알 수 없는 명령"], stock: { milk: 1 } } }
    - kind: call
      id: item-named-item
      visible: false
      description: 상품 이름이 item이나 count여도 그 이름의 속성을 다뤄야 합니다.
      requirement: add·take·check
      args: [["add item 1", "add count 4", "take count 1"]]
      expect: { equals: { messages: ["item: 1", "count: 4", "count: 3"], stock: { item: 1, count: 3 } } }
      misconceptionIfFail: js.mc.dot-with-variable-key
misconceptions: [js.mc.dot-with-variable-key, js.mc.add-property-needs-declare, js.mc.plus-string-adds]
hints:
  - 창고 객체와 결과 배열은 반복 앞에서 한 번씩 만들어요. 명령 하나는 `split(" ")`로 나누면 명령·상품·개수를 인덱스로 꺼낼 수 있어요.
  - 상품 이름은 변수에 있으니 대괄호로 읽고 써요. `split`이 만든 개수는 문자열이라 `Number`로 바꾸지 않으면 `"2" + "10"`처럼 이어 붙여져요.
  - "`take`는 확인할 순서가 중요해요: 상품이 있는지 → 개수가 충분한지 → 빼고 0이면 지우기. 확인에 걸리면 재고를 바꾸지 말고 안내 문장만 넣으세요."
explanation: |
  예시 정답의 핵심이에요.

  ```js
  function runCommands(commands) {
    const stock = {};
    const messages = [];
    for (const command of commands) {
      const parts = command.split(" ");
      const action = parts[0];
      const item = parts[1];
      const count = Number(parts[2]);
      if (action === "add") {
        if (stock[item] === undefined) {
          stock[item] = 0;
        }
        stock[item] += count;
        messages.push(item + ": " + stock[item]);
      } else if (action === "take" || action === "check") {
        if (stock[item] === undefined) {
          messages.push("없는 상품: " + item);
        } else if (action === "check") {
          messages.push(item + ": " + stock[item]);
        } else if (count > stock[item]) {
          messages.push("부족: " + item + " " + stock[item] + "개");
        } else {
          stock[item] -= count;
          if (stock[item] === 0) {
            delete stock[item];
            messages.push(item + ": 품절");
          } else {
            messages.push(item + ": " + stock[item]);
          }
        }
      } else {
        messages.push("알 수 없는 명령");
      }
    }
    return { messages: messages, stock: stock };
  }
  ```

  - **명령 나누기**: `"add milk 3".split(" ")`은 `["add", "milk", "3"]`이에요. 개수 `"3"`은 문자열이라 `Number`로 바꿔요. 바꾸지 않으면 `0 + "2"`가 `"02"`, 이어서 `"0210"`처럼 이어 붙여져요.
  - **대괄호로 읽고 쓰기**: 상품 이름은 매번 달라서 `stock[item]`이에요. 숨긴 검사 `item-named-item`은 `stock.item`처럼 쓴 답을 걸러요.
  - **추가와 삭제**: 없던 상품은 0을 넣어 속성을 만든 뒤 더하고, 0개가 되면 `delete`로 지워요. 값만 0으로 두면 `{ tea: 0 }`이 남고 다음 `check`도 `tea: 0`이 돼요.
  - **확인 순서**: 없는 상품을 먼저 걸러야 `undefined`와 비교하는 일이 없어요. 부족할 때는 재고를 바꾸지 않고 안내만 넣어요.
  - 결과 객체는 `{ messages, stock }`처럼 짧게 써도 같아요. 이 줄임 문법은 단원 "구조 분해와 전개"에서 배워요.
