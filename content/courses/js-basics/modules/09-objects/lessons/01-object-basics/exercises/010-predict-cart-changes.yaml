id: js-basics.objects.object-basics.predict-cart-changes
type: predict_output
difficulty: 4
concepts:
  - { id: js.obj.add-delete, weight: 1 }
  - { id: js.obj.dot-bracket, weight: 0.5 }
  - { id: js.obj.literal, weight: 0.3 }
tags: [object, add, delete, duplicate-key, trace, console-format]
estimatedSeconds: 180
prompt: |
  장바구니 객체를 여러 번 고친 뒤 출력해요. 마지막 줄에 출력되는 객체를 쓰세요. 어떤 속성이 남고 각각 어떤 값인지가 중요해요(속성의 순서는 채점하지 않아요).
spec:
  lang: js
  code: |
    const cart = { apple: 2, milk: 1, apple: 3 };
    const item = "bread";

    cart[item] = 1;
    cart.item = 5;
    cart.milk += 2;
    delete cart.apple;
    cart.apple = cart.banana;

    console.log(cart);
  answerKind: console
  misconceptionByAnswer:
    "{ milk: 3, bread: 5, apple: undefined }": js.mc.dot-with-variable-key
    "{ milk: 3, item: 5, apple: undefined }": js.mc.bracket-key-without-quotes
    "{ milk: 3, bread: 1, item: 5 }": js.mc.undefined-value-means-missing
hints:
  - 줄마다 `cart`가 어떻게 바뀌는지 표로 적어 보세요. 1번 줄에서 이미 함정이 하나 있어요.
  - "`cart[item]`과 `cart.item`은 각각 어떤 이름의 속성을 만드나요? 새 속성은 객체의 어느 자리에 붙나요?"
  - 지운 속성에 다시 대입하면 원래 자리로 돌아갈까요, 새 속성처럼 붙을까요? 그리고 `cart.banana`는 어떤 값인가요?
explanation: |
  출력은 `{ milk: 3, bread: 1, item: 5, apple: undefined }`예요.

  | 줄 | 한 일 | `cart` |
  |---|---|---|
  | 1 | 같은 키 `apple`을 두 번 씀 → 뒤의 값 | `{ apple: 3, milk: 1 }` |
  | 4 | `cart[item]` → 변수 `item`의 값 `"bread"`가 이름 | `{ apple: 3, milk: 1, bread: 1 }` |
  | 5 | `cart.item` → 이름 그대로 `item` | `{ apple: 3, milk: 1, bread: 1, item: 5 }` |
  | 6 | `milk` 수정 | `{ apple: 3, milk: 3, bread: 1, item: 5 }` |
  | 7 | `apple` 삭제 | `{ milk: 3, bread: 1, item: 5 }` |
  | 8 | 없는 `banana`를 읽으면 `undefined`, 그 값으로 `apple`을 새로 만듦 | `{ milk: 3, bread: 1, item: 5, apple: undefined }` |

  - 1번 줄: 같은 키가 다시 나오면 오류 없이 값을 덮어쓰고, 자리는 처음 나온 곳 그대로예요.
  - 4·5번 줄: 대괄호는 변수의 값으로, 점은 글자 그대로 이름을 정해서 서로 다른 속성 두 개가 생겨요.
  - 8번 줄: 삭제한 뒤 다시 만든 `apple`은 새 속성이라 **맨 끝**에 붙어요. 값은 없는 속성 `cart.banana`를 읽은 `undefined`예요. 속성은 있고 값이 `undefined`인 상태라 출력에도 `apple: undefined`가 보여요.
origin: authored
