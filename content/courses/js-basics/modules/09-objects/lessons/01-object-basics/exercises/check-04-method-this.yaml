id: js-basics.objects.object-basics.check-method-this
type: true_false
usage: check
difficulty: 2
concepts:
  - { id: js.obj.methods-intro, weight: 1 }
tags: [object, method, this]
estimatedSeconds: 60
prompt: |
  아래 코드를 보고, 설명이 맞는지 고르세요.
code: |
  const counter = {
    clicks: 0,
    press() {
      clicks += 1;
      return clicks;
    },
  };
  console.log(counter.press());
spec:
  statement: '`press`는 `counter` 안에 있는 메서드이므로, 마지막 줄은 오류 없이 `1`을 출력한다.'
  answer: false
  misconceptionIfWrong: js.mc.method-reads-props-by-name
misconceptions: [js.mc.method-reads-props-by-name]
hints:
  - 메서드 안의 `clicks`는 속성일까요, 변수일까요?
  - 속성은 변수가 아니에요. `clicks`라는 변수를 만든 적이 있나요?
  - 자기 객체의 속성은 `this.속성`으로 읽고 바꿔요.
explanation: |
  정답은 **거짓**이에요.

  메서드 안에서 `clicks`라고만 쓰면 JavaScript는 **변수** `clicks`를 찾아요. 그런 변수가 없으니 `ReferenceError: clicks is not defined`가 나요. 메서드가 객체 안에 있다고 해서 속성 이름을 변수처럼 쓸 수 있는 것은 아니에요.

  `this.clicks += 1;`과 `return this.clicks;`로 고치면 `counter.press()`로 불렀을 때 `this`가 `counter`가 되어 `1`이 출력돼요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
