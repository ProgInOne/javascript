id: js-basics.objects.object-basics.web-profile-field
type: web_task
difficulty: 4
concepts:
  - { id: js.obj.dot-bracket, weight: 1 }
  - { id: js.obj.add-delete, weight: 0.5 }
tags: [object, bracket, variable-key, add, web, event]
estimatedSeconds: 480
prompt: |
  프로필 카드 화면을 완성하세요. 목록에서 항목(이름, 사는 곳, 좋아하는 음식, 이메일)을 고르고 **보기**를 누르면 그 항목이 보이고, 새 값을 입력하고 **바꾸기**를 누르면 그 항목이 바뀌어야 해요.

  화면을 다루는 코드는 시작 코드에 모두 있어요. 목록에서 고른 항목의 **키**(`"name"`, `"city"`, `"favorite-food"`, `"email"` 중 하나)가 함수의 `key`로 들어와요. 할 일은 두 함수를 채우는 것이에요.

  1. `describeField(key)`: `"(key): (값)"`을 돌려줘요. `profile`에 그 항목이 없으면 `"(key): 등록되지 않았어요"`를 돌려줘요.
  1. `updateField(key, value)`: `profile`의 그 항목을 `value`로 바꿔요. 없던 항목이면 새로 생겨요.

  예: 사는 곳을 고르고 보기 → `city: 대전`, 이메일을 고르고 보기 → `email: 등록되지 않았어요`
spec:
  focus: dom
