                //    값이 없으면 "(key): 등록되지 않았어요"를 돌려주세요.
                function describeField(key) {
                }

                // 2) key 속성의 값을 value로 바꾸세요(없던 항목이면 새로 생겨요).
                function updateField(key, value) {
                }

                whenClicked("#show", function () {
                  show(describeField(selectedKey()));
                });
                whenClicked("#save", function () {
