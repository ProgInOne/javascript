id: js-basics.objects.object-basics.mcq-literal-syntax
type: mcq_single
difficulty: 1
concepts:
  - { id: js.obj.literal, weight: 1 }
tags: [object, literal, syntax]
estimatedSeconds: 50
prompt: |
  김밥 메뉴를 이름 `"참치김밥"`, 가격 `3500`인 객체로 만들려고 해요. 오류 없이 실행되는 코드는 어느 것인가요?
spec:
  codeOptions: true
  options:
    - id: a
      text: 'const menu = { name: "참치김밥", price: 3500 };'
    - id: b
      text: 'const menu = { name: "참치김밥"; price: 3500 };'
      misconception: js.mc.obj-property-semicolon
      rationale: 객체 리터럴 안의 속성은 쉼표로 나눠요. 세미콜론을 쓰면 실행 전에 SyntaxError가 나요.
    - id: c
      text: 'const menu = { name = "참치김밥", price = 3500 };'
      rationale: 키와 값 사이에는 대입 기호 =가 아니라 콜론 :을 써요.
    - id: d
      text: 'const menu = ( name: "참치김밥", price: 3500 );'
      rationale: 객체는 소괄호가 아니라 중괄호 { }로 감싸요.
  correct: a
misconceptions: [js.mc.obj-property-semicolon]
hints:
  - 객체는 어떤 괄호로 감싸나요?
  - 키와 값 사이에 쓰는 기호와, 속성과 속성 사이에 쓰는 기호를 구별해 보세요.
  - 키와 값 사이에는 콜론, 속성 사이에는 쉼표를 써요. 네 코드에서 괄호·콜론·쉼표가 모두 맞는 것을 찾아보세요.
explanation: |
  정답은 `const menu = { name: "참치김밥", price: 3500 };`예요.

  객체 리터럴은 **중괄호**로 감싸고, 속성마다 `키: 값`으로 쓰며, 속성 사이를 **쉼표**로 나눠요. 문장 끝의 세미콜론은 닫는 중괄호 뒤에 한 번만 써요.

  - '속성 사이에 세미콜론을 쓴 코드는 실행 전에 `SyntaxError: Unexpected token '';''`가 나요. 문장을 끝내는 습관대로 쓰기 쉬운 실수예요.'
  - `name = "참치김밥"`처럼 `=`을 쓰면 객체 리터럴의 문법이 아니라서 `SyntaxError`예요.
  - 소괄호로 감싼 코드도 `SyntaxError`예요. 소괄호는 객체를 만들지 않아요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
