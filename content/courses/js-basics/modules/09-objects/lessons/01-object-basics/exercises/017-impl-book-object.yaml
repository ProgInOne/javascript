id: js-basics.objects.object-basics.impl-book-object
type: implement_function
difficulty: 1
concepts:
  - { id: js.obj.literal, weight: 1 }
tags: [object, literal, write-code]
estimatedSeconds: 120
prompt: |
  책 한 권의 정보를 객체로 만들어 보세요.

  - 변수 이름은 `book`이에요.
  - 속성은 `title`(제목) `"어린 왕자"`, `author`(지은이) `"생텍쥐페리"`, `pages`(쪽수) `120`(숫자) 세 개예요.
  - 객체를 만든 뒤 `book.title`을 출력하세요.

  ```text
  어린 왕자
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          // book 객체를 만들고 제목을 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          // book 객체를 만들고 제목을 출력하세요.
          const book = {
            title: "어린 왕자",
            author: "생텍쥐페리",
            pages: 120,
          };
          console.log(book.title);
  checks:
    - kind: console
      id: output
      description: 책 제목이 출력되어야 합니다.
      requirement: 제목 출력
      expect:
        lines: ["어린 왕자"]
    - kind: program
      id: book-object
      description: book 변수에 title, author, pages 세 속성을 가진 객체가 들어 있어야 합니다(pages는 숫자 120).
      requirement: book 객체
      expect:
        globals:
          book: { equals: { title: "어린 왕자", author: "생텍쥐페리", pages: 120 } }
        noError: true
      misconceptionIfFail: js.mc.obj-property-semicolon
misconceptions: [js.mc.obj-property-semicolon]
hints:
  - 여러 값을 이름표와 함께 묶을 때는 중괄호로 객체를 만들어요.
  - '속성마다 `키: 값`으로 쓰고, 속성 사이는 쉼표로 나눠요. 쪽수는 숫자라서 따옴표를 붙이지 않아요.'
  - 객체를 만든 다음 줄에서 점 표기법으로 제목 속성을 읽어 출력해 보세요.
explanation: |
  예시 정답이에요.

  ```js
  const book = {
    title: "어린 왕자",
    author: "생텍쥐페리",
    pages: 120,
  };
  console.log(book.title);
  ```

  - 객체 리터럴은 중괄호로 감싸고, `키: 값` 짝을 쉼표로 나눠요.
  - `pages: "120"`처럼 따옴표를 붙이면 숫자가 아니라 문자열이 되어 `book-object` 검사를 통과하지 못해요.
  - 속성의 순서는 바꿔 써도 돼요. 객체는 순서가 아니라 이름으로 값을 찾으니까요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
