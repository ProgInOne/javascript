id: js-basics.browser-intro.final-project
title: "최종 프로젝트: 할 일 목록"
summary: 지금까지 배운 함수·조건문·문자열과 DOM·이벤트를 조합해 할 일을 추가하고, 완료 표시하고, 지우고, 남은 개수를 보여 주는 할 일 목록을 단계별로 만들어요.
kind: project
importance: standard
estimatedMinutes: { read: 8, practice: 60 }
concepts:
  practiced: [js.dom.document-tree, js.dom.query-selector, js.dom.text-content, js.dom.class-style, js.dom.add-event-listener, js.dom.event-object, js.dom.input-value]
  reviewed: [js.fn.declaration, js.fn.callback, js.control.if, js.str.case-trim, js.str.template-literal]
objectives:
  - 할 일 목록을 입력·추가·완료·삭제·개수 표시 단계로 나누고, 한 단계씩 만들어 확인할 수 있다.
  - 폼 제출 이벤트로 입력을 받아, 새 요소를 만들어 목록에 붙이고 입력창을 비울 수 있다.
  - 나중에 만든 요소에도 이벤트를 연결하고, 화면이 바뀔 때마다 남은 개수와 안내 문구를 다시 계산할 수 있다.
practice:
  targetCount: 8
