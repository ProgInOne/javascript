id: js-basics.browser-intro.final-project.check-typed-tags
type: mcq_single
usage: check
difficulty: 2
concepts:
  - { id: js.dom.text-content, weight: 1 }
tags: [project, textcontent, check]
estimatedSeconds: 60
prompt: |
  할 일을 추가하는 함수에서 새 `li`를 만들고 `li.textContent = text;`로 입력한 글자를 넣어요. 사용자가 입력창에 `<b>우유</b>`라고 쓰고 추가하면 목록에는 무엇이 보일까요?
spec:
  options:
    - id: a
      text: "`<b>우유</b>`라는 글자가 그대로 보인다"
    - id: b
      text: 굵은 글씨로 된 `우유`가 보인다
      misconception: js.mc.textcontent-parses-html
      rationale: "`textContent`는 넣은 문자열을 글자로만 보여 줘요. `<b>`도 태그가 아니라 글자예요."
    - id: c
      text: 태그가 섞인 글자는 넣을 수 없어서 빈 항목이 추가된다
      rationale: "`textContent`에는 어떤 문자열이든 넣을 수 있어요. 비워 두지 않아요."
    - id: d
      text: 오류가 나서 할 일이 추가되지 않는다
      rationale: 글자에 꺾쇠괄호가 있어도 오류는 나지 않아요. 문자열일 뿐이에요.
  correct: a
misconceptions: [js.mc.textcontent-parses-html]
hints:
  - "`textContent`는 요소 안을 무엇으로 채우나요? 글자인가요, 태그인가요?"
  - 사용자가 친 `<b>`와 `</b>`도 문자열 속의 글자예요.
  - 글자로 넣은 꺾쇠괄호는 화면에도 꺾쇠괄호로 보여요.
explanation: |
  정답은 "`<b>우유</b>`라는 글자가 그대로 보인다"예요.

  `textContent`는 넣은 문자열을 **글자**로 채워요. 사용자가 친 `<b>`도 태그가 되지 않고 화면에 그대로 보여요. 그래서 할 일 목록처럼 사용자가 쓴 글자를 화면에 옮길 때는 `textContent`가 알맞아요. 사용자가 쓴 글자가 페이지의 구조를 바꾸지 못하니까요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
