id: js-basics.browser-intro.final-project.web-fix-todo-bugs
type: web_task
difficulty: 4
concepts:
  - { id: js.dom.input-value, weight: 1 }
  - { id: js.dom.query-selector, weight: 0.5 }
  - { id: js.dom.class-style, weight: 0.5 }
  - { id: js.dom.add-event-listener, weight: 0.3 }
tags: [project, debugging, value-timing, queryselector, classlist, web]
estimatedSeconds: 600
prompt: |
  친구가 만든 할 일 목록에 버그가 **세 개** 있어요. 하나를 고치면 다음 버그가 드러나니, 고칠 때마다 실행해 보며 차례로 찾으세요.

  기대하는 동작은 다음과 같아요.

  - 할 일을 쓰고 제출하면 목록에 추가되고 입력창이 비어요(공백뿐이면 추가하지 않아요).
  - `#todo-count`에 완료하지 않은 할 일 수가 `남은 할 일 2개`처럼 보여요.
  - 할 일 글자를 누르면 줄이 그어지고(`done` 클래스) 남은 개수가 줄어요.

  HTML과 CSS에는 문제가 없어요. 스크립트만 고치세요.
spec:
  focus: project
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>할 일 목록</title>
              <style>
                body { font-family: sans-serif; padding: 16px; max-width: 420px; }
                #todo-form { display: flex; gap: 8px; }
                #todo-input { flex: 1; font-size: 16px; padding: 4px 6px; }
                #todo-list { padding-left: 0; list-style: none; }
                .todo { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #e5e7eb; }
                .todo-text { cursor: pointer; }
                .done .todo-text { text-decoration: line-through; color: #9ca3af; }
                .delete { font-size: 12px; }
                .hidden { display: none; }
              </style>
            </head>
            <body>
              <h1>할 일 목록</h1>
              <form id="todo-form">
                <input id="todo-input" type="text" placeholder="할 일을 쓰세요" />
                <button type="submit">추가</button>
              </form>
              <p id="todo-count">남은 할 일 0개</p>
              <p id="empty-message">할 일이 없어요</p>
              <ul id="todo-list"></ul>
              <script>
                const form = document.querySelector("#todo-form");
                const input = document.querySelector("#todo-input");
                const list = document.querySelector("#todo-list");
                const countText = document.querySelector("#todo-count");
                const emptyMessage = document.querySelector("#empty-message");

                function updateStatus() {
                  const total = list.querySelectorAll(".todo").length;
                  const done = list.querySelector(".todo.done").length;
                  countText.textContent = `남은 할 일 ${total - done}개`;
                  if (total === 0) {
                    emptyMessage.classList.remove("hidden");
                  } else {
                    emptyMessage.classList.add("hidden");
                  }
                }

                function addTodo(text) {
                  const item = document.createElement("li");
                  item.classList.add("todo");

                  const textSpan = document.createElement("span");
                  textSpan.classList.add("todo-text");
                  textSpan.textContent = text;
                  textSpan.addEventListener("click", () => {
                    item.classList.toggle(".done");
                    updateStatus();
                  });

                  const deleteButton = document.createElement("button");
                  deleteButton.classList.add("delete");
                  deleteButton.textContent = "삭제";
                  deleteButton.addEventListener("click", () => {
                    item.remove();
                    updateStatus();
                  });

                  item.append(textSpan);
                  item.append(deleteButton);
                  list.append(item);
                }

                const text = input.value.trim();

                form.addEventListener("submit", (event) => {
                  event.preventDefault();
                  if (text === "") {
                    return;
                  }
                  addTodo(text);
                  input.value = "";
                  updateStatus();
                });

                updateStatus();
              </script>
            </body>
          </html>
