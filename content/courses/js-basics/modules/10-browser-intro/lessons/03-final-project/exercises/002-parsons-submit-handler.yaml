hints:
  - 함수의 맨 처음과 맨 끝 줄은 이벤트 등록이에요. 이벤트 이름에는 `on`이 붙지 않아요.
  - "`return`으로 함수를 끝내기 **전에** 기본 동작을 막아야, 공백만 쓴 제출에서도 페이지가 새로 열리지 않아요."
  - 입력창을 비우는 것은 비교(`===`)가 아니라 대입이에요. 그리고 비우기 전에 글자를 이미 읽어 두었는지 확인하세요.
explanation: |
  정답 순서의 한 예는 다음과 같아요.

  ```js
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (text === "") {
      return;
    }
    addTodo(text);
    input.value = "";
  });
  ```

  - `preventDefault()`는 `return`보다 앞에 있어야 해요. 뒤에 두면 공백만 쓴 제출에서는 함수가 먼저 끝나 기본 동작을 막지 못해요. 글자를 읽는 줄과의 순서는 바뀌어도 돼요.
  - 글자는 `text`에 이미 담았으니 `addTodo(text)`와 `input.value = ""`의 순서는 바뀌어도 같아요.
  - `input.value === ""`는 비교만 하고 결과를 버리는 식이라 입력창이 비지 않아요.
  - 이벤트 이름은 `"submit"`이에요.
