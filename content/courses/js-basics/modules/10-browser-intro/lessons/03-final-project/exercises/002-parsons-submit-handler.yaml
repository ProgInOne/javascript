prompt: |
  할 일 목록의 제출 함수를 완성하려고 해요. `addTodo(text)`는 할 일을 목록에 붙이는 함수로 이미 만들어 두었어요. 코드 조각을 순서대로 배열하고 들여쓰기도 맞추세요.

  - 폼 제출의 기본 동작을 막아요. 공백만 쓴 경우에도 막아야 해요.
  - 입력한 글자의 앞뒤 공백을 지우고, 비어 있으면 아무것도 하지 않아요.
  - 추가한 뒤에는 입력창을 비워요.
