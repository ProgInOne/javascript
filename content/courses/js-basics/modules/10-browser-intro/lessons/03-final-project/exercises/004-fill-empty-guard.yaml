id: js-basics.browser-intro.final-project.fill-empty-guard
type: fill_blank
difficulty: 2
concepts:
  - { id: js.dom.input-value, weight: 1 }
  - { id: js.str.case-trim, weight: 0.5 }
tags: [project, input, trim, guard, fill]
estimatedSeconds: 120
prompt: |
  할 일 추가 코드에서, 공백만 쓴 할 일은 추가하지 않고 앞뒤 공백은 지워서 추가하려고 해요. 빈칸을 채우세요.
spec:
  mode: code
  lang: html
  template: |
    <form id="todo-form">
      <input id="todo-input" type="text" />
      <button type="submit">추가</button>
    </form>
    <ul id="todo-list"></ul>
    <script>
      const form = document.querySelector("#todo-form");
      const input = document.querySelector("#todo-input");
      const list = document.querySelector("#todo-list");
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = input.{{blank:value}}.{{blank:trim}}();
        if (text === {{blank:empty}}) {
          return;
        }
        const item = document.createElement("li");
        item.textContent = text;
        list.append(item);
        input.value = "";
      });
    </script>
  blanks:
    - id: value
      accept: ["value"]
      width: 8
    - id: trim
      accept: ["trim"]
      width: 8
    - id: empty
      accept: ['""', "''"]
      width: 6
  checks:
    - kind: event
      id: blank
      description: 공백만 쓰고 제출하면 할 일이 추가되지 않아야 합니다.
      requirement: 빈 할 일 막기
      visible: true
      steps:
        - { action: type, selector: "#todo-input", value: "   " }
        - { action: submit, selector: "#todo-form" }
      expect:
        - { selector: "#todo-list li", count: 0 }
    - kind: event
      id: trimmed
      description: "\" 우유 사기 \"를 제출하면 공백을 지운 \"우유 사기\"가 추가되어야 합니다."
      requirement: 공백 지우고 추가
      visible: true
      steps:
        - { action: type, selector: "#todo-input", value: " 우유 사기 " }
        - { action: submit, selector: "#todo-form" }
      expect:
        - { selector: "#todo-list li", count: 1 }
        - { selector: "#todo-list li", text: { equals: "우유 사기", trim: false } }
misconceptions: [js.mc.input-value-read-once]
hints:
  - 첫 번째 빈칸은 입력창에 들어 있는 글자를 읽는 속성이에요.
  - 두 번째 빈칸은 앞뒤 공백만 지운 새 문자열을 돌려주는 문자열 메서드예요(모듈 7).
  - 공백을 지운 뒤에 아무 글자도 남지 않으면 어떤 문자열이 될까요? 그 값과 비교해요.
explanation: |
  예시 정답이에요.

  ```js
  const text = input.value.trim();
  if (text === "") {
    return;
  }
  ```

  - `input.value`는 제출한 순간 입력창에 든 글자예요.
  - `trim()`은 앞뒤 공백만 지운 새 문자열을 돌려줘요. `"   "`는 `""`가 되고, `" 우유 사기 "`는 `"우유 사기"`가 돼요. 가운데 공백은 그대로예요.
  - 빈 문자열과 비교해 비어 있으면 `return`으로 함수를 끝내요. 그러면 아래의 추가 코드가 실행되지 않아요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
