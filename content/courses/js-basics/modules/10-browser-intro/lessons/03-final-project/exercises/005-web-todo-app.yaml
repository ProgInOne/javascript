                const form = document.querySelector("#todo-form");
                const input = document.querySelector("#todo-input");
                const list = document.querySelector("#todo-list");
                const countText = document.querySelector("#todo-count");
                const emptyMessage = document.querySelector("#empty-message");

                // 1단계: 폼이 제출되면 입력한 글자로 할 일을 하나 추가하세요.
                //        할 일 하나의 모양: <li class="todo"><span class="todo-text">글자</span><button class="delete">삭제</button></li>
                // 2단계: 추가한 뒤 입력창을 비우고, 앞뒤 공백은 지우고, 빈 글자는 추가하지 마세요.
                // 3단계: #todo-count에 "남은 할 일 N개"를 보여 주세요.
                // 4단계: 할 일 글자(.todo-text)를 누르면 그 li에 done 클래스를 넣었다 뺐다 하세요.
                // 5단계: 삭제 버튼을 누르면 그 할 일을 지우세요.
                // 6단계: 할 일이 하나도 없을 때만 #empty-message가 보이게 하세요(.hidden 클래스).
              </script>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>할 일 목록</title>
              <style>
                body { font-family: sans-serif; padding: 16px; max-width: 420px; }
                #todo-form { display: flex; gap: 8px; }
                #todo-input { flex: 1; font-size: 16px; padding: 4px 6px; }
                #todo-list { padding-left: 0; list-style: none; }
                .todo { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #e5e7eb; }
                .todo-text { cursor: pointer; }
                .done .todo-text { text-decoration: line-through; color: #9ca3af; }
                .delete { font-size: 12px; }
                .hidden { display: none; }
              </style>
            </head>
            <body>
              <h1>할 일 목록</h1>
              <form id="todo-form">
                <input id="todo-input" type="text" placeholder="할 일을 쓰세요" />
                <button type="submit">추가</button>
              </form>
              <p id="todo-count">남은 할 일 0개</p>
              <p id="empty-message">할 일이 없어요</p>
              <ul id="todo-list"></ul>
              <script>
                const form = document.querySelector("#todo-form");
                const input = document.querySelector("#todo-input");
                const list = document.querySelector("#todo-list");
                const countText = document.querySelector("#todo-count");
                const emptyMessage = document.querySelector("#empty-message");

                function updateStatus() {
                  const total = list.querySelectorAll(".todo").length;
                  const done = list.querySelectorAll(".todo.done").length;
                  countText.textContent = `남은 할 일 ${total - done}개`;
                  if (total === 0) {
                    emptyMessage.classList.remove("hidden");
                  } else {
                    emptyMessage.classList.add("hidden");
                  }
                }

                function addTodo(text) {
                  const item = document.createElement("li");
                  item.classList.add("todo");

                  const textSpan = document.createElement("span");
                  textSpan.classList.add("todo-text");
                  textSpan.textContent = text;
                  textSpan.addEventListener("click", () => {
                    item.classList.toggle("done");
                    updateStatus();
                  });

                  const deleteButton = document.createElement("button");
                  deleteButton.classList.add("delete");
                  deleteButton.textContent = "삭제";
                  deleteButton.addEventListener("click", () => {
                    item.remove();
                    updateStatus();
                  });

                  item.append(textSpan);
                  item.append(deleteButton);
                  list.append(item);
                }

                form.addEventListener("submit", (event) => {
                  event.preventDefault();
                  const text = input.value.trim();
                  if (text === "") {
                    return;
                  }
                  addTodo(text);
                  input.value = "";
                  updateStatus();
                });

                updateStatus();
              </script>
            </body>
          </html>
  checks:
    - kind: event
      id: add-first
      description: "\"우유 사기\"를 쓰고 제출하면 todo 항목 하나가 생기고, 그 안에 글자(.todo-text)와 삭제 버튼(.delete)이 있어야 합니다."
      requirement: 할 일 추가
      visible: true
      steps:
        - { action: type, selector: "#todo-input", value: "우유 사기" }
        - { action: submit, selector: "#todo-form" }
      expect:
        - { selector: "#todo-list li.todo", count: 1 }
        - { selector: "#todo-list li.todo .todo-text", text: { equals: "우유 사기" } }
        - { selector: "#todo-list li.todo button.delete", count: 1 }
    - kind: event
      id: add-second
      description: "이어서 \"운동하기\"를 제출하면 목록의 두 번째 항목으로 붙어야 합니다."
      requirement: 할 일 추가
      visible: true
      steps:
        - { action: type, selector: "#todo-input", value: "운동하기" }
        - { action: submit, selector: "#todo-form" }
      expect:
        - { selector: "#todo-list li.todo", count: 2 }
        - { selector: "#todo-list li.todo:nth-child(2) .todo-text", text: { equals: "운동하기" } }
    - kind: event
      id: clear-input
      description: 할 일을 추가하면 입력창이 비어야 합니다.
      requirement: 입력 다듬기
      visible: true
      steps:
        - { action: type, selector: "#todo-input", value: "책 읽기" }
        - { action: submit, selector: "#todo-form" }
      expect:
        - { selector: "#todo-list li.todo", count: 3 }
        - { selector: "#todo-input", value: "" }
    - kind: event
      id: ignore-blank
      description: 공백만 쓰고 제출하면 추가되지 않아야 합니다.
      requirement: 입력 다듬기
      steps:
        - { action: type, selector: "#todo-input", value: "   " }
        - { action: submit, selector: "#todo-form" }
      expect:
        - { selector: "#todo-list li.todo", count: 3 }
    - kind: event
      id: trim
      description: "앞뒤 공백이 있는 \"  물 마시기 \"는 공백을 지운 \"물 마시기\"로 추가되어야 합니다."
      requirement: 입력 다듬기
      steps:
        - { action: type, selector: "#todo-input", value: "  물 마시기 " }
        - { action: submit, selector: "#todo-form" }
      expect:
        - { selector: "#todo-list li.todo", count: 4 }
        - { selector: "#todo-list li.todo:nth-child(4) .todo-text", text: { equals: "물 마시기" } }
    - kind: event
      id: count-after-add
      description: "다섯 번째 할 일을 추가하면 \"남은 할 일 5개\"가 보여야 합니다."
      requirement: 남은 개수
      visible: true
      steps:
        - { action: type, selector: "#todo-input", value: "산책하기" }
        - { action: submit, selector: "#todo-form" }
      expect:
        - { selector: "#todo-list li.todo", count: 5 }
        - { selector: "#todo-count", text: { equals: "남은 할 일 5개" } }
    - kind: event
      id: toggle-done
      description: "두 번째 할 일의 글자를 누르면 그 항목에 done 클래스가 생기고 \"남은 할 일 4개\"가 되어야 합니다."
      requirement: 완료 표시
      visible: true
      steps:
        - { action: click, selector: "#todo-list li.todo:nth-child(2) .todo-text" }
      expect:
        - { selector: "#todo-list li.todo:nth-child(2).done", count: 1 }
        - { selector: "#todo-list li.done", count: 1 }
        - { selector: "#todo-count", text: { equals: "남은 할 일 4개" } }
    - kind: event
      id: toggle-back
      description: "같은 글자를 다시 누르면 done이 빠지고 \"남은 할 일 5개\"로 돌아와야 합니다."
      requirement: 완료 표시
      steps:
        - { action: click, selector: "#todo-list li.todo:nth-child(2) .todo-text" }
      expect:
        - { selector: "#todo-list li.done", count: 0 }
        - { selector: "#todo-count", text: { equals: "남은 할 일 5개" } }
    - kind: event
      id: done-first
      description: "첫 번째 할 일을 완료하면 그 항목만 done이고 \"남은 할 일 4개\"여야 합니다."
      requirement: 완료 표시
      steps:
        - { action: click, selector: "#todo-list li.todo:nth-child(1) .todo-text" }
      expect:
        - { selector: "#todo-list li.todo:nth-child(1).done", count: 1 }
        - { selector: "#todo-list li.done", count: 1 }
        - { selector: "#todo-count", text: { equals: "남은 할 일 4개" } }
    - kind: event
      id: delete-undone
      description: "세 번째 할 일(책 읽기)을 삭제하면 항목이 4개가 되고, 그 자리에 다음 항목이 오며, \"남은 할 일 3개\"가 되어야 합니다."
      requirement: 삭제
      visible: true
      steps:
        - { action: click, selector: "#todo-list li.todo:nth-child(3) .delete" }
      expect:
        - { selector: "#todo-list li.todo", count: 4 }
        - { selector: "#todo-list li.todo:nth-child(3) .todo-text", text: { equals: "물 마시기" } }
        - { selector: "#todo-count", text: { equals: "남은 할 일 3개" } }
    - kind: event
      id: delete-done
      description: 완료한 항목을 삭제하면 남은 개수는 그대로(3개)여야 합니다.
      requirement: 삭제
      steps:
        - { action: click, selector: "#todo-list li.todo:nth-child(1) .delete" }
      expect:
        - { selector: "#todo-list li.todo", count: 3 }
        - { selector: "#todo-list li.done", count: 0 }
        - { selector: "#todo-count", text: { equals: "남은 할 일 3개" } }
    - kind: event
      id: empty-hidden
      description: '할 일이 있는 동안에는 #empty-message에 hidden 클래스가 있어야 합니다.'
      requirement: 빈 목록 안내
      visible: true
      steps:
        - { action: wait, ms: 0 }
      expect:
        - { selector: "#empty-message.hidden", count: 1 }
    - kind: event
      id: empty-shown
      description: "할 일을 모두 삭제하면 #empty-message가 다시 보이고(hidden 없음) \"남은 할 일 0개\"여야 합니다."
      requirement: 빈 목록 안내
      visible: true
      steps:
        - { action: click, selector: "#todo-list li.todo:nth-child(1) .delete" }
        - { action: click, selector: "#todo-list li.todo:nth-child(1) .delete" }
        - { action: click, selector: "#todo-list li.todo:nth-child(1) .delete" }
      expect:
        - { selector: "#todo-list li", count: 0 }
        - { selector: "#empty-message.hidden", count: 0 }
        - { selector: "#todo-count", text: { equals: "남은 할 일 0개" } }
    - kind: event
      id: empty-hidden-again
      description: '빈 목록에 다시 추가하면 #empty-message가 숨겨지고 "남은 할 일 1개"여야 합니다.'
      requirement: 빈 목록 안내
      steps:
        - { action: type, selector: "#todo-input", value: "새 할 일" }
        - { action: submit, selector: "#todo-form" }
      expect:
        - { selector: "#empty-message.hidden", count: 1 }
        - { selector: "#todo-count", text: { equals: "남은 할 일 1개" } }
  milestones:
    - { id: m1, title: 할 일 추가하기, checks: [add-first, add-second] }
    - { id: m2, title: 입력 다듬기, checks: [clear-input, ignore-blank, trim] }
    - { id: m3, title: 남은 개수 보여 주기, checks: [count-after-add] }
    - { id: m4, title: 완료 표시하기, checks: [toggle-done, toggle-back, done-first] }
    - { id: m5, title: 삭제하기, checks: [delete-undone, delete-done] }
    - { id: m6, title: 빈 목록 안내, checks: [empty-hidden, empty-shown, empty-hidden-again] }
misconceptions: [js.mc.form-submit-no-default, js.mc.created-element-auto-shown, js.mc.input-value-read-once, js.mc.listener-handler-called]
hints:
  - "한 단계씩 해요. 1단계는 \"폼의 submit 등록 → 기본 동작 막기 → 입력창 값 읽기 → li·span·button 만들기 → 조립해서 목록에 붙이기\"예요. 할 일을 만드는 부분은 `addTodo(text)` 같은 함수로 따로 빼 두면 다음 단계가 쉬워요."
  - 4·5단계의 버튼과 글자는 나중에 만들어지는 요소예요. 페이지가 열릴 때는 아직 없으니, 요소를 만드는 함수 안에서 바로 `addEventListener`를 하고, 그 안에서 같은 함수 안의 `li` 변수를 쓰세요.
  - 남은 개수와 안내 문구는 추가·완료·삭제 때마다 바뀌어요. 목록에서 `.todo`와 `.todo.done`의 개수를 세어 다시 쓰는 함수를 하나 만들고, 목록이 바뀌는 세 곳 모두에서 부르세요.
explanation: |
  예시 정답의 뼈대예요(요소를 찾는 코드는 시작 코드 그대로).

  ```js
  function updateStatus() {
    const total = list.querySelectorAll(".todo").length;
    const done = list.querySelectorAll(".todo.done").length;
    countText.textContent = `남은 할 일 ${total - done}개`;
    if (total === 0) {
      emptyMessage.classList.remove("hidden");
    } else {
      emptyMessage.classList.add("hidden");
    }
  }

  function addTodo(text) {
    const item = document.createElement("li");
    item.classList.add("todo");

    const textSpan = document.createElement("span");
    textSpan.classList.add("todo-text");
    textSpan.textContent = text;
    textSpan.addEventListener("click", () => {
      item.classList.toggle("done");
      updateStatus();
    });

    const deleteButton = document.createElement("button");
    deleteButton.classList.add("delete");
    deleteButton.textContent = "삭제";
    deleteButton.addEventListener("click", () => {
      item.remove();
      updateStatus();
    });

    item.append(textSpan);
    item.append(deleteButton);
    list.append(item);
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (text === "") {
      return;
    }
    addTodo(text);
    input.value = "";
    updateStatus();
  });

  updateStatus();
  ```

  단계별로 짚어 볼게요.

  1. **추가**: `submit`은 버튼을 눌러도, 입력창에서 Enter 키를 눌러도 폼에서 일어나요. `preventDefault()`로 페이지가 새로 열리는 것을 막아요. 만든 요소는 `append`해야 화면에 보여요.
  1. **입력 다듬기**: `value`는 제출한 그 순간 함수 안에서 읽고, `trim()`한 뒤 빈 글자면 `return`해요. 입력창은 `value = ""`로 비워요.
  1. **남은 개수**: 개수를 변수로 따로 세면 추가·완료·삭제마다 더하고 빼다 틀리기 쉬워요. 화면의 `.todo`와 `.todo.done`을 그때그때 세면 항상 화면과 맞아요.
  1. **완료 표시**: `textSpan`에 등록한 함수는 바깥의 `item`을 기억해요. 그래서 함수가 나중에 불려도 자기 항목의 `li`에 `done`을 넣고 뺄 수 있어요. `toggle`이 넣기·빼기를 한 번에 해요.
  1. **삭제**: `item.remove()`로 트리에서 떼어 내요. 지운 뒤에는 `updateStatus()`로 개수를 다시 써요.
  1. **빈 목록 안내**: 전체 수가 0일 때만 `hidden`을 빼요. 페이지가 열릴 때도 한 번 불러 두면 처음 상태도 맞아요.

  - 페이지가 열릴 때 `document.querySelectorAll(".delete")`로 찾아 이벤트를 등록하면, 그때는 항목이 하나도 없어서 아무것도 등록되지 않아요. 이 프로젝트의 핵심은 "만드는 자리에서 등록하기"예요.
  - 이벤트 위임(`#todo-list`에 하나만 등록하고 `event.target`으로 무엇을 눌렀는지 구별하기)으로 풀어도 체크는 똑같이 통과해요. 브라우저 JavaScript 과정에서 자세히 배워요.
