id: js-basics.browser-intro.final-project.web-todo-app
type: web_task
difficulty: 5
concepts:
  - { id: js.dom.add-event-listener, weight: 1 }
  - { id: js.dom.event-object, weight: 0.5 }
  - { id: js.dom.input-value, weight: 0.5 }
  - { id: js.dom.document-tree, weight: 0.5 }
  - { id: js.dom.class-style, weight: 0.5 }
  - { id: js.dom.text-content, weight: 0.5 }
  - { id: js.dom.query-selector, weight: 0.5 }
  - { id: js.fn.declaration, weight: 0.3 }
tags: [project, todo, milestones, submit, createelement, classlist, web]
estimatedSeconds: 2400
prompt: |
  **할 일 목록**을 여섯 단계로 만들어요. 단계마다 체크가 묶여 있어서, 한 단계를 완성할 때마다 실행해 확인하면서 다음 단계로 넘어가면 돼요. HTML과 CSS는 준비되어 있고, `<script>`에는 요소를 찾아 둔 코드와 단계별 안내 주석이 있어요.

  할 일 하나는 반드시 이 모양으로 만들어 `#todo-list`에 붙여요. 체크가 이 클래스 이름으로 요소를 찾아요.

  ```html
  <li class="todo">
    <span class="todo-text">우유 사기</span>
    <button class="delete">삭제</button>
  </li>
  ```

  | 단계 | 할 일 |
  |---|---|
  | 1. 할 일 추가 | 폼(`#todo-form`)이 제출되면 입력한 글자로 할 일을 만들어 목록 끝에 붙여요. 폼 제출의 기본 동작은 막아요. |
  | 2. 입력 다듬기 | 추가한 뒤 입력창을 비워요. 앞뒤 공백은 지우고 붙이며, 공백뿐이면 추가하지 않아요. |
  | 3. 남은 개수 | `#todo-count`에 `남은 할 일 3개`처럼 **완료하지 않은** 할 일 수를 보여 줘요. |
  | 4. 완료 표시 | 할 일 글자(`.todo-text`)를 누르면 그 `li`에 `done` 클래스를 넣고, 다시 누르면 빼요. 남은 개수도 바뀌어요. |
  | 5. 삭제 | **삭제** 버튼을 누르면 그 할 일을 지워요. 남은 개수도 바뀌어요. |
  | 6. 빈 목록 안내 | 할 일이 하나도 없을 때만 `#empty-message`가 보여요. 숨길 때는 `hidden` 클래스를 넣어요(CSS에 `.hidden { display: none; }`이 있어요). |

  도움이 되는 것들:

  - 요소를 지울 때는 `요소.remove()`를 써요.
  - 개수나 안내 문구처럼 여러 곳에서 다시 계산해야 하는 일은 함수 하나(예: `updateStatus()`)로 만들어 두고, 목록이 바뀔 때마다 부르면 편해요.
  - 나중에 만든 요소에도 이벤트가 필요해요. 요소를 만드는 그 자리에서 바로 이벤트를 등록하세요.
spec:
  focus: project
