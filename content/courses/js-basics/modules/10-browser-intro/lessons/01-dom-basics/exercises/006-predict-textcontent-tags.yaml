id: js-basics.browser-intro.dom-basics.predict-textcontent-tags
type: predict_output
difficulty: 2
concepts:
  - { id: js.dom.text-content, weight: 1 }
  - { id: js.dom.query-selector, weight: 0.3 }
tags: [textcontent, html-string]
estimatedSeconds: 90
prompt: |
  다음 문서를 열면 콘솔에 무엇이 출력될까요? 한 줄에 하나씩 쓰세요.
spec:
  lang: web
  code: |
    <p id="memo">메모</p>
    <script>
      const memo = document.querySelector("#memo");
      memo.textContent = "<b>중요</b> 회의";
      console.log(memo.textContent);
      console.log(memo.querySelectorAll("b").length);
    </script>
  answerKind: console
  misconceptionByAnswer:
    "중요 회의\n1": js.mc.textcontent-parses-html
    "<b>중요</b> 회의\n1": js.mc.textcontent-parses-html
hints:
  - "`textContent`는 이름 그대로 무엇을 다루는 속성인가요?"
  - 대입한 문자열 속 `<b>`는 태그로 해석될까요, 글자로 남을까요?
  - "`memo` 안에 `b` 요소가 실제로 생겼다면 두 번째 줄은 1이에요. 생기지 않았다면요?"
explanation: |
  출력은 다음과 같아요.

  ```text
  <b>중요</b> 회의
  0
  ```

  - `textContent`는 **글자만** 다뤄요. 대입한 문자열은 꺾쇠까지 그대로 글자로 들어가서, 화면에도 `<b>중요</b> 회의`가 보여요.
  - 그래서 `memo` 안에 `b` 요소는 생기지 않아요. `querySelectorAll("b")`의 개수는 0이에요.

  굵은 글자처럼 새 요소가 필요하면 `document.createElement("b")`로 요소를 만들어 붙여요.
origin: authored
