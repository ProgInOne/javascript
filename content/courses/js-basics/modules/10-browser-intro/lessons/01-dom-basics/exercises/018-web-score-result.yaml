id: js-basics.browser-intro.dom-basics.web-score-result
type: web_task
difficulty: 4
concepts:
  - { id: js.dom.text-content, weight: 1 }
  - { id: js.dom.class-style, weight: 0.5 }
  - { id: js.control.else-if, weight: 0.5 }
  - { id: js.str.template-literal, weight: 0.3 }
tags: [textcontent, classlist, else-if, boundary, state, web]
estimatedSeconds: 480
prompt: |
  점수를 넣고 **결과 보기**를 누르면 결과를 보여 주는 화면이에요. 버튼을 누를 때마다 입력한 점수(숫자)로 `showResult(score)`가 불리도록 이미 연결해 두었어요(이벤트는 다음 단원에서 배워요). `showResult`의 본문을 완성하세요.

  | 점수 | `#score-text` | `#grade` 글자 | `#grade`의 클래스 |
  |---|---|---|---|
  | 90 이상 | 예: `95점` | `우수` | `pass` |
  | 60 이상 90 미만 | 예: `72점` | `합격` | `pass` |
  | 60 미만 | 예: `41점` | `불합격` | `fail` |

  - 버튼은 여러 번 누를 수 있어요. 결과가 바뀌면 `#grade`에는 `pass`와 `fail` 중 **지금 결과에 맞는 클래스 하나만** 있어야 해요.
  - `#grade`가 원래 가진 `grade` 클래스는 그대로 두세요.
  - `showResult` 밖의 코드는 고치지 마세요.
