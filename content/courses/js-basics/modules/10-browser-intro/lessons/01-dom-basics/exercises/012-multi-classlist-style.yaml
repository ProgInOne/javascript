id: js-basics.browser-intro.dom-basics.multi-classlist-style
type: mcq_multi
difficulty: 2
concepts:
  - { id: js.dom.class-style, weight: 1 }
tags: [classlist, style, camelcase]
estimatedSeconds: 110
prompt: |
  `const box = document.querySelector("#box");`로 요소를 찾았어요. CSS에는 `.active { border-color: red; }` 규칙이 있어요. 맞는 설명을 모두 고르세요.
spec:
  options:
    - id: a
      text: "`box.classList.add(\"active\")`를 실행하면 `.active` 규칙이 적용된다"
      missedMisconception: js.mc.classlist-dot-prefix
    - id: b
      text: "`box.classList.toggle(\"active\")`는 `active`가 없으면 넣고, 있으면 뺀다"
    - id: c
      text: "`box.style.fontSize = \"20px\"`는 글자 크기를 20px로 바꾼다"
      missedMisconception: js.mc.style-hyphen-name
    - id: d
      text: "`box.classList.add(\".active\")`처럼 점을 붙여야 `.active` 규칙이 적용된다"
      misconception: js.mc.classlist-dot-prefix
      rationale: 점은 선택자에서 "클래스"를 뜻하는 기호예요. 점을 붙이면 이름이 `.active`인 다른 클래스가 들어가서 규칙이 적용되지 않아요.
    - id: e
      text: "`box.style.font-size = \"20px\"`도 같은 일을 한다"
      misconception: js.mc.style-hyphen-name
      rationale: JavaScript에서 `-`는 빼기예요. `box.style.font - size = ...`로 읽혀 `SyntaxError`가 나요.
  correct: [a, b, c]
misconceptions: [js.mc.classlist-dot-prefix, js.mc.style-hyphen-name]
hints:
  - "`classList`에는 선택자가 아니라 클래스 **이름**을 넣어요. 이름에 점이 들어 있나요?"
  - "`toggle`은 전등 스위치처럼 동작해요."
  - JavaScript에서 `-` 기호는 어떤 연산자인가요? 이름 안에 쓸 수 있을까요?
explanation: |
  정답은 `classList.add("active")`, `toggle`의 설명, `style.fontSize` 세 가지예요.

  - `classList.add("active")`는 `class` 속성에 `active`를 더해요. 그러면 CSS의 `.active` 규칙이 이 요소에 적용돼요.
  - `toggle("active")`는 없으면 넣고 있으면 빼요. 켰다 껐다 하는 버튼에 자주 써요.
  - `style`의 속성 이름은 CSS 이름에서 하이픈을 빼고 다음 글자를 대문자로 써요. `font-size` → `fontSize`, `background-color` → `backgroundColor`.
  - `add(".active")`는 오류 없이 이름이 `.active`인 클래스를 넣어요. `.active` 규칙은 이름이 `active`인 클래스를 찾으므로 적용되지 않아요.
  - `box.style.font-size`는 `box.style.font - size`라는 빼기로 읽혀서 대입할 수 없는 자리가 되고, 실행 전에 `SyntaxError`가 나요.
