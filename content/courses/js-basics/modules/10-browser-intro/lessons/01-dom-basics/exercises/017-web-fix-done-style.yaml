id: js-basics.browser-intro.dom-basics.web-fix-done-style
type: web_task
difficulty: 3
concepts:
  - { id: js.dom.class-style, weight: 1 }
tags: [classlist, style, camelcase, debugging, web]
estimatedSeconds: 300
prompt: |
  오늘의 할 일 페이지예요. 스크립트는 두 가지 일을 해야 해요.

  - 첫 번째 할 일(`#task-1`)에 `done` 클래스를 넣어 줄이 그어지게 한다(CSS의 `.done` 규칙).
  - 제목(`#title`)의 글자 크기를 `style`로 `28px`로 키운다.

  그런데 오류도 나지 않는데 화면이 하나도 바뀌지 않아요. 두 곳의 버그를 찾아 고치세요. HTML과 CSS는 고치지 마세요.
spec:
  focus: dom
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>오늘의 할 일</title>
              <style>
                body { font-family: sans-serif; padding: 16px; }
                #title { font-size: 20px; }
                .done { text-decoration: line-through; color: #9ca3af; }
              </style>
            </head>
            <body>
              <h1 id="title">오늘의 할 일</h1>
              <ul>
                <li id="task-1">물 마시기</li>
                <li id="task-2">산책하기</li>
              </ul>
              <script>
                const task = document.querySelector("#task-1");
                task.classList.add(".done");

                const title = document.querySelector("#title");
                title.style.fontsize = "28px";
              </script>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>오늘의 할 일</title>
              <style>
                body { font-family: sans-serif; padding: 16px; }
                #title { font-size: 20px; }
                .done { text-decoration: line-through; color: #9ca3af; }
              </style>
            </head>
            <body>
              <h1 id="title">오늘의 할 일</h1>
              <ul>
                <li id="task-1">물 마시기</li>
                <li id="task-2">산책하기</li>
              </ul>
              <script>
                const task = document.querySelector("#task-1");
                task.classList.add("done");

                const title = document.querySelector("#title");
                title.style.fontSize = "28px";
              </script>
            </body>
          </html>
  checks:
    - kind: dom
      id: done-class
      description: "첫 번째 할 일에 done 클래스가 있어야 합니다."
      requirement: 완료 표시
      visible: true
      selector: "#task-1.done"
      expect:
        count: 1
    - kind: css
      id: done-line
      description: 첫 번째 할 일에 가운데 줄이 그어져야 합니다.
      requirement: 완료 표시
      selector: "#task-1"
      expect:
        computed:
          text-decoration-line: { equals: line-through }
    - kind: css
      id: second-untouched
      description: 두 번째 할 일은 줄이 그어지지 않아야 합니다.
      requirement: 완료 표시
      selector: "#task-2"
      expect:
        computed:
          text-decoration-line: { equals: none }
    - kind: css
      id: title-size
      description: 제목의 글자 크기가 28px이어야 합니다.
      requirement: 제목 크기
      visible: true
      selector: "#title"
      expect:
        computed:
          font-size: { px: { value: 28 } }
misconceptions: [js.mc.classlist-dot-prefix, js.mc.style-hyphen-name]
hints:
  - 두 줄 모두 오류 없이 실행되지만, 브라우저가 기대와 다른 이름을 받아요. `console.log(task.className)`을 넣어 클래스가 실제로 어떻게 들어갔는지 찍어 보세요.
  - 클래스 이름과 선택자는 달라요. `.done` 규칙이 찾는 클래스의 **이름**은 무엇인가요?
  - "`style`의 속성 이름은 대소문자를 구별해요. CSS의 `font-size`를 낙타 표기로 바꾸면 어느 글자가 대문자가 될까요?"
explanation: |
  버그는 두 곳이에요.

  ```js
  task.classList.add("done");          // ".done" → "done"
  title.style.fontSize = "28px";       // fontsize → fontSize
  ```

  - `classList.add(".done")`은 오류 없이 이름이 `.done`인 클래스를 넣어요(`class="done"`이 아니라 `class=".done"`). CSS의 `.done` 규칙은 이름이 `done`인 클래스를 찾으므로 적용되지 않아요. 점은 선택자에서만 쓰는 기호예요.
  - `style`의 속성 이름은 `font-size`에서 하이픈을 빼고 다음 글자를 대문자로 쓴 `fontSize`예요. `fontsize`는 스타일 속성이 아니라서, 대입해도 그냥 이름이 `fontsize`인 값이 하나 생길 뿐 글자 크기는 그대로예요.
  - 두 버그 모두 오류가 나지 않아서 찾기 어려워요. 화면이 그대로일 때는 `console.log`로 실제로 들어간 값을 확인하는 습관이 도움이 돼요.
