id: js-basics.browser-intro.dom-basics.try-number-steps
type: web_task
usage: try
difficulty: 2
concepts:
  - { id: js.dom.query-selector, weight: 1 }
  - { id: js.dom.text-content, weight: 0.5 }
  - { id: js.loops.for, weight: 0.3 }
tags: [query-selector-all, textcontent, loop, web, write-code]
estimatedSeconds: 240
prompt: |
  라면 끓이는 순서를 보여 주는 화면이에요. `<script>` 안에 코드를 써서 아래처럼 바꿔 보세요.

  1. 클래스가 `step`인 요소를 **모두** 찾아, 글자 앞에 순서 번호를 붙이세요.

     | 지금 | 바꾼 뒤 |
     |---|---|
     | `물 끓이기` | `1단계: 물 끓이기` |
     | `면 넣기` | `2단계: 면 넣기` |
     | `4분 기다리기` | `3단계: 4분 기다리기` |

  1. `#count`에 단계 수를 `모두 3단계`처럼 보여 주세요. 숫자는 직접 적지 말고 찾은 목록의 개수로 쓰세요.

  HTML은 고치지 마세요.
spec:
  focus: dom
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>라면 끓이기</title>
              <style>
                body { font-family: sans-serif; padding: 16px; }
                .step { padding: 4px 0; }
                #count { color: #6b7280; }
              </style>
            </head>
            <body>
              <h1>라면 끓이기</h1>
              <ul>
                <li class="step">물 끓이기</li>
                <li class="step">면 넣기</li>
                <li class="step">4분 기다리기</li>
              </ul>
              <p id="count"></p>
              <script>
                // 1. querySelectorAll로 .step을 모두 찾아 변수에 담으세요.
                // 2. for 반복으로 각 요소의 글자 앞에 "1단계: "처럼 번호를 붙이세요.
                //    (인덱스는 0부터, 단계 번호는 1부터예요.)
                // 3. #count에 "모두 3단계"를 보여 주세요. 3은 목록의 length로 쓰세요.
              </script>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>라면 끓이기</title>
              <style>
                body { font-family: sans-serif; padding: 16px; }
                .step { padding: 4px 0; }
                #count { color: #6b7280; }
              </style>
            </head>
            <body>
              <h1>라면 끓이기</h1>
              <ul>
                <li class="step">물 끓이기</li>
                <li class="step">면 넣기</li>
                <li class="step">4분 기다리기</li>
              </ul>
              <p id="count"></p>
              <script>
                const steps = document.querySelectorAll(".step");
                for (let i = 0; i < steps.length; i++) {
                  steps[i].textContent = `${i + 1}단계: ${steps[i].textContent}`;
                }
                document.querySelector("#count").textContent = `모두 ${steps.length}단계`;
              </script>
            </body>
          </html>
  checks:
    - kind: dom
      id: step-1
      description: '첫 번째 단계가 "1단계: 물 끓이기"로 보여야 합니다.'
      requirement: 모든 단계에 번호 붙이기
      visible: true
      selector: ".step:nth-child(1)"
      expect:
        text: { equals: "1단계: 물 끓이기" }
    - kind: dom
      id: step-2
      description: '두 번째 단계가 "2단계: 면 넣기"로 보여야 합니다.'
      requirement: 모든 단계에 번호 붙이기
      visible: true
      selector: ".step:nth-child(2)"
      expect:
        text: { equals: "2단계: 면 넣기" }
      misconceptionIfFail: js.mc.queryselector-returns-all
    - kind: dom
      id: step-3
      description: '세 번째 단계가 "3단계: 4분 기다리기"로 보여야 합니다.'
      requirement: 모든 단계에 번호 붙이기
      visible: true
      selector: ".step:nth-child(3)"
      expect:
        text: { equals: "3단계: 4분 기다리기" }
    - kind: dom
      id: count
      description: '#count에 "모두 3단계"가 보여야 합니다.'
      requirement: 단계 수 보여 주기
      visible: true
      selector: "#count"
      expect:
        text: { equals: "모두 3단계" }
    - kind: dom
      id: steps-kept
      description: 단계 항목 세 개는 그대로 남아 있어야 합니다.
      requirement: 모든 단계에 번호 붙이기
      selector: ".step"
      expect:
        count: 3
misconceptions: [js.mc.queryselector-returns-all]
hints:
  - 단원의 두 번째 예제(가격에 `원` 붙이기)와 같은 모양이에요. 이번에는 글자 **앞에** 붙이고, 붙이는 글자에 번호가 들어가요.
  - "반복 변수 `i`는 0, 1, 2예요. 단계 번호는 `i + 1`로 만들 수 있어요. 새 글자는 `${i + 1}단계: ` 뒤에 원래 글자를 이어 붙여 만들어요."
  - "`#count`에는 `\"모두 \" + steps.length + \"단계\"`처럼 목록의 `length`를 넣으세요."
explanation: |
  예시 답안이에요.

  ```js
  const steps = document.querySelectorAll(".step");
  for (let i = 0; i < steps.length; i++) {
    steps[i].textContent = `${i + 1}단계: ${steps[i].textContent}`;
  }
  document.querySelector("#count").textContent = `모두 ${steps.length}단계`;
  ```

  - `querySelectorAll`은 맞는 요소를 모두 담은 목록이에요. `querySelector`로 찾으면 첫 단계만 바뀌어요.
  - 인덱스는 0부터지만 사람이 읽는 번호는 1부터라서 `i + 1`을 써요.
  - 원래 글자를 읽어(`steps[i].textContent`) 앞에 번호를 붙인 새 문자열을 다시 대입해요. 대입하면 글자 전체가 바뀌므로 원래 글자를 빠뜨리면 사라져요.
  - 단계 수를 `steps.length`로 쓰면 단계가 늘어도 코드를 고칠 필요가 없어요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
