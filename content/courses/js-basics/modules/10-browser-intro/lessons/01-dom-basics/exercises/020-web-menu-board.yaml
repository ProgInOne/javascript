              </style>
            </head>
            <body>
              <h1>오늘의 메뉴</h1>
              <p id="count">메뉴 0가지</p>
              <ul id="menu"></ul>
              <button id="season">계절 메뉴로 바꾸기</button>
              <script>
                const menu = document.querySelector("#menu");
