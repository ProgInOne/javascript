id: js-basics.browser-intro.dom-basics.web-menu-board
type: web_task
difficulty: 4
concepts:
  - { id: js.dom.document-tree, weight: 1 }
  - { id: js.str.split-join, weight: 0.5 }
  - { id: js.dom.text-content, weight: 0.5 }
  - { id: js.dom.class-style, weight: 0.3 }
tags: [createelement, append, split, loop, web]
estimatedSeconds: 540
prompt: |
  카페 메뉴판을 그리는 `renderMenu(menuText)`의 본문을 완성하세요. `menuText`는 `"아메리카노,카페라테,바닐라라테,녹차"`처럼 메뉴 이름을 쉼표로 이어 쓴 문자열이에요.

  1. 메뉴 이름마다 `li`를 만들어 글자를 넣고, `menu-item` 클래스를 붙여 `#menu`에 차례로 붙이세요.
  1. **첫 번째** 메뉴의 `li`에는 `best` 클래스도 붙이세요(추천 표시).
  1. `#count`에 `메뉴 4가지`처럼 메뉴 수를 보여 주세요.

  **계절 메뉴로 바꾸기** 버튼은 `renderMenu("딸기라테,레몬에이드")`를 다시 불러요. 그때 메뉴판에는 계절 메뉴 **두 개만** 있어야 해요. `renderMenu` 밖의 코드는 고치지 마세요.
