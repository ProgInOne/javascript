prompt: |
  좋아요 버튼(`#like`)을 누를 때마다 숫자(`#like-count`)가 1씩 늘어나는 코드를 만들려고 해요. 코드 조각을 순서대로 배열하고 들여쓰기도 맞추세요.
spec:
  lines:
    - { id: l1, code: 'const likeButton = document.querySelector("#like");' }
    - { id: l2, code: 'const likeCount = document.querySelector("#like-count");' }
    - { id: l3, code: 'let count = 0;' }
    - { id: l4, code: 'likeButton.addEventListener("click", () => {' }
    - { id: l5, code: 'count++;', indent: 1 }
    - { id: l6, code: 'likeCount.textContent = count;', indent: 1 }
    - { id: l7, code: '});' }
  distractors:
    - { id: d1, code: 'likeButton.addEventListener("onclick", () => {', misconception: js.mc.event-name-on-prefix }
    - { id: d2, code: 'const count = 0;' }
  gradeIndent: true
  alternatives:
    - [l1, l3, l2, l4, l5, l6, l7]
    - [l2, l1, l3, l4, l5, l6, l7]
    - [l2, l3, l1, l4, l5, l6, l7]
