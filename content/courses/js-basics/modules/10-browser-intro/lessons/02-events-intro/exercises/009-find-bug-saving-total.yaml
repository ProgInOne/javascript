id: js-basics.browser-intro.events-intro.find-bug-saving-total
type: find_bug_line
difficulty: 2
concepts:
  - { id: js.dom.input-value, weight: 1 }
  - { id: js.conv.plus-concat, weight: 0.5 }
tags: [input, value, string, concat, debugging]
estimatedSeconds: 100
prompt: |
  저금통 앱이에요. 입력창 두 개에서 읽은 `value`로 모은 돈을 계산해요(입력창 대신 2, 3번 줄에 그 값을 적어 두었어요). 12000원에 3000원을 더하면 15000원이어야 하는데 결과가 이상해요. 원인이 되는 줄을 찾고, 왜 그런지도 고르세요.
spec:
  code: |-
    // 2, 3번 줄은 입력창의 value를 읽은 값이에요.
    const savedText = "12000";
    const addText = "3000";
    const total = savedText + addText;
    console.log("모은 돈: " + total + "원");
    console.log("목표까지: " + (20000 - total) + "원");
  bugLines: [4]
  symptom: "`모은 돈: 120003000원`이 나오고, 목표까지 남은 돈은 음수예요."
  symptomCheck:
    console: ["모은 돈: 120003000원", "목표까지: -119983000원"]
  fixedCode: |-
    // 2, 3번 줄은 입력창의 value를 읽은 값이에요.
    const savedText = "12000";
    const addText = "3000";
    const total = Number(savedText) + Number(addText);
    console.log("모은 돈: " + total + "원");
    console.log("목표까지: " + (20000 - total) + "원");
  causeOptions:
    - id: c1
      text: "`value`는 문자열이라서 `+`가 두 글자를 이어 붙였다"
      correct: true
    - id: c2
      text: 2번 줄의 값이 너무 커서 계산이 넘쳤다
    - id: c3
      text: 6번 줄의 빼기가 `total`을 문자열로 바꿨다
    - id: c4
      text: 입력창의 `value`는 숫자인데, `console.log`가 숫자를 이어서 출력했다
      misconception: js.mc.input-value-is-number
misconceptions: [js.mc.input-value-is-number]
hints:
  - 입력창의 `value`는 어떤 자료형이었나요? 2, 3번 줄을 보세요.
  - "`\"12000\" + \"3000\"`을 계산해 보세요. 문자열끼리의 `+`는 무슨 일을 하나요?"
  - 6번 줄의 빼기는 문자열을 숫자로 바꿔서 계산해요. 문제가 처음 생긴 곳은 그보다 앞이에요.
explanation: |
  원인은 **4번 줄**이에요.

  입력창의 `value`는 항상 문자열이라 `savedText`는 `"12000"`, `addText`는 `"3000"`이에요. 문자열끼리 `+`를 하면 덧셈이 아니라 **이어 붙이기**라서 `total`은 `"120003000"`이 돼요.

  6번 줄의 `20000 - total`은 빼기라서 `total`을 숫자로 바꿔 계산해요. 그래서 오류 없이 `-119983000`이 나와요. 이 줄은 4번 줄의 잘못된 값을 받았을 뿐이에요.

  고치려면 더하기 전에 숫자로 바꿔요.

  ```js
  const total = Number(savedText) + Number(addText);
  ```

  - 값이 큰 것은 문제가 아니에요. JavaScript는 이보다 훨씬 큰 수도 정확히 더해요.
  - `console.log`는 받은 값을 그대로 출력할 뿐이에요. 이어 붙은 것은 4번 줄의 `+`예요.
origin: authored
review:
