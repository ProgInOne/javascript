id: js-basics.browser-intro.events-intro.web-fix-like-reset
type: web_task
difficulty: 3
concepts:
  - { id: js.dom.add-event-listener, weight: 1 }
  - { id: js.fn.callback, weight: 0.3 }
tags: [addeventlistener, handler-call, event-name, debugging, web]
estimatedSeconds: 300
prompt: |
  좋아요 카운터가 이상해요.

  - 페이지를 열자마자 아무것도 누르지 않았는데 숫자가 `1`이에요.
  - **♥ 좋아요**를 눌러도 숫자가 늘지 않아요.
  - **처음으로**를 눌러도 0으로 돌아가지 않아요.

  `addLike`와 `resetLikes` 함수의 본문은 맞게 썼어요. 버그를 찾아 고치세요.
spec:
  focus: dom
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>좋아요</title>
              <style>
                body { font-family: sans-serif; padding: 16px; }
                button { font-size: 16px; margin-right: 8px; }
                #count { font-size: 32px; font-weight: bold; }
              </style>
            </head>
            <body>
              <p>좋아요 <span id="count">0</span></p>
              <button id="like">♥ 좋아요</button>
              <button id="reset">처음으로</button>
              <script>
                const countText = document.querySelector("#count");
                const likeButton = document.querySelector("#like");
                const resetButton = document.querySelector("#reset");
                let count = 0;

                function addLike() {
                  count++;
                  countText.textContent = count;
                }

                function resetLikes() {
                  count = 0;
                  countText.textContent = count;
                }

                likeButton.addEventListener("click", addLike());
                resetButton.addEventListener("onclick", resetLikes);
              </script>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>좋아요</title>
              <style>
                body { font-family: sans-serif; padding: 16px; }
                button { font-size: 16px; margin-right: 8px; }
                #count { font-size: 32px; font-weight: bold; }
              </style>
            </head>
            <body>
              <p>좋아요 <span id="count">0</span></p>
              <button id="like">♥ 좋아요</button>
              <button id="reset">처음으로</button>
              <script>
                const countText = document.querySelector("#count");
                const likeButton = document.querySelector("#like");
                const resetButton = document.querySelector("#reset");
                let count = 0;

                function addLike() {
                  count++;
                  countText.textContent = count;
                }

                function resetLikes() {
                  count = 0;
                  countText.textContent = count;
                }

                likeButton.addEventListener("click", addLike);
                resetButton.addEventListener("click", resetLikes);
              </script>
            </body>
          </html>
  checks:
    - kind: dom
      id: starts-zero
      description: 페이지를 열면 숫자가 0이어야 합니다.
      requirement: 처음에는 0
      visible: true
      selector: "#count"
      expect:
        text: { equals: "0" }
    - kind: event
      id: like-twice
      description: 좋아요를 두 번 누르면 2가 되어야 합니다.
      requirement: 좋아요로 1씩 늘리기
      visible: true
      steps:
        - { action: click, selector: "#like" }
        - { action: click, selector: "#like" }
      expect:
        - { selector: "#count", text: { equals: "2" } }
    - kind: event
      id: reset
      description: 처음으로를 누르면 0으로 돌아가야 합니다.
      requirement: 처음으로 되돌리기
      visible: true
      steps:
        - { action: click, selector: "#reset" }
      expect:
        - { selector: "#count", text: { equals: "0" } }
    - kind: event
      id: like-after-reset
      description: 되돌린 뒤 좋아요를 누르면 1이 되어야 합니다.
      requirement: 좋아요로 1씩 늘리기
      steps:
        - { action: click, selector: "#like" }
      expect:
        - { selector: "#count", text: { equals: "1" } }
misconceptions: [js.mc.listener-handler-called, js.mc.event-name-on-prefix]
hints:
  - 아무것도 누르지 않았는데 숫자가 1이라면, `addLike`가 이미 한 번 실행된 거예요. 어느 줄에서 실행됐을까요?
  - 함수를 맡겨 둘 때와 부를 때의 차이는 괄호예요.
  - 처음으로 버튼의 등록 줄에서 이벤트 이름을 다른 줄과 비교해 보세요.
explanation: |
  버그는 마지막 두 줄에 하나씩 있어요.

  ```js
  likeButton.addEventListener("click", addLike);      // addLike() → addLike
  resetButton.addEventListener("click", resetLikes);  // "onclick" → "click"
  ```

  - `addLike()`는 등록하는 순간 함수를 불러요. 그래서 페이지를 열자마자 숫자가 1이 되고, 정작 클릭에는 `undefined`가 등록되어 눌러도 늘지 않았어요. 괄호 없이 함수 자체를 넘겨요.
  - `"onclick"`이라는 이벤트는 없어요. 오류 없이 등록되지만 절대 불리지 않아요. 이벤트 이름은 `"click"`이에요.
  - 두 버그 모두 오류 메시지가 나지 않아요. "열자마자 한 번 실행됨"은 괄호를, "눌러도 아무 일 없음"은 이벤트 이름과 괄호를 먼저 의심해요.
origin: authored
