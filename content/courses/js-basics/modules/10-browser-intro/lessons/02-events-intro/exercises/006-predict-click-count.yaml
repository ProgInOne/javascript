id: js-basics.browser-intro.events-intro.predict-click-count
type: predict_output
difficulty: 3
concepts:
  - { id: js.dom.add-event-listener, weight: 1 }
  - { id: js.fn.callback, weight: 0.3 }
tags: [addeventlistener, order, trace]
estimatedSeconds: 120
prompt: |
  다음 문서를 열면 콘솔에 무엇이 출력될까요? 한 줄에 하나씩 쓰세요. `btn.click()`은 코드로 버튼을 한 번 누르는 메서드예요.
spec:
  lang: web
  code: |
    <button id="btn">눌러 보세요</button>
    <script>
      const btn = document.querySelector("#btn");
      let count = 0;
      console.log("시작: " + count);
      btn.addEventListener("click", () => {
        count++;
        console.log("클릭 " + count);
      });
      console.log("등록 뒤: " + count);
      btn.click();
      btn.click();
      console.log("끝: " + count);
    </script>
  answerKind: console
  misconceptionByAnswer:
    "시작: 0\n클릭 1\n등록 뒤: 1\n클릭 2\n클릭 3\n끝: 3": js.mc.callback-runs-at-pass-time
hints:
  - "`addEventListener` 줄이 실행될 때 화살표 함수의 본문도 함께 실행될까요, 맡겨 두기만 할까요?"
  - 맡겨 둔 함수는 언제 실행되나요? `btn.click()`이 두 번 있어요.
  - "`count`는 함수 밖에 있는 변수라서, 함수가 실행될 때마다 같은 변수가 1씩 늘어요."
explanation: |
  출력은 다음과 같아요.

  ```text
  시작: 0
  등록 뒤: 0
  클릭 1
  클릭 2
  끝: 2
  ```

  - `addEventListener`는 함수를 **맡겨 두기만** 해요. 등록하는 줄에서는 본문이 실행되지 않아서 `등록 뒤: 0`이에요.
  - `btn.click()`이 버튼을 누를 때마다 맡겨 둔 함수가 실행돼요. 두 번 눌렀으니 두 번 실행돼요.
  - `count`는 함수 밖에서 `let`으로 만든 변수라서, 함수가 실행될 때마다 같은 변수가 1, 2로 늘어요. 그래서 마지막 줄은 `끝: 2`예요.
