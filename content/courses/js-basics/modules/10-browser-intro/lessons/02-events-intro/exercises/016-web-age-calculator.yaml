id: js-basics.browser-intro.events-intro.web-age-calculator
type: web_task
difficulty: 4
concepts:
  - { id: js.dom.input-value, weight: 1 }
  - { id: js.conv.to-number, weight: 0.5 }
  - { id: js.conv.nan, weight: 0.5 }
  - { id: js.dom.add-event-listener, weight: 0.3 }
tags: [input, value, number, nan, validation, web]
estimatedSeconds: 540
prompt: |
  지금 나이와 몇 년 뒤인지를 넣고 **계산하기**를 누르면 그때의 나이를 알려 주는 페이지를 완성하세요. 요소는 이미 찾아 두었어요. 이벤트 등록부터 직접 쓰세요.

  | 입력 (지금 나이, 몇 년 뒤) | `#result`에 보일 글자 |
  |---|---|
  | `15`, `10` | `10년 뒤에는 25살이에요` |
  | ` 20 `, `1` (앞뒤 공백) | `1년 뒤에는 21살이에요` |
  | 둘 중 하나라도 비어 있음 | `숫자를 입력해 주세요` |
  | 둘 중 하나라도 숫자가 아님 (예: `열다섯`) | `숫자를 입력해 주세요` |

  입력창의 `value`는 문자열이라는 점, 그리고 `Number("")`가 무엇이 되는지 꼭 생각해 보세요.
spec:
  focus: dom
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>몇 년 뒤 내 나이</title>
