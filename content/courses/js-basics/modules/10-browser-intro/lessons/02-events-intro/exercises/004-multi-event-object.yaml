id: js-basics.browser-intro.events-intro.multi-event-object
type: mcq_multi
difficulty: 2
concepts:
  - { id: js.dom.event-object, weight: 1 }
tags: [event-object, target, preventdefault]
estimatedSeconds: 110
prompt: |
  아래 코드의 `event`에 대해 맞는 설명을 모두 고르세요.
code: |
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    message.textContent = "보냈어요";
  });
spec:
  options:
    - id: a
      text: "`event`는 브라우저가 함수를 부를 때 넘겨주는 이벤트 객체다"
    - id: b
      text: "`event.preventDefault()`는 폼을 제출하며 페이지를 새로 여는 기본 동작을 막는다"
      missedMisconception: js.mc.form-submit-no-default
    - id: c
      text: "`event.target`은 이벤트가 일어난 요소(여기서는 폼)다"
    - id: d
      text: "`event.preventDefault()`가 실행되면 함수가 그 자리에서 끝나서 `보냈어요`는 보이지 않는다"
      misconception: js.mc.preventdefault-stops-handler
      rationale: "`preventDefault`는 브라우저의 기본 동작만 취소해요. 함수의 나머지 줄은 그대로 실행돼서 `보냈어요`가 보여요."
    - id: e
      text: "`event`라는 이름으로 써야만 이벤트 객체가 들어오고, `e`처럼 다른 이름을 쓰면 들어오지 않는다"
      rationale: 매개변수 이름은 자유예요. 브라우저는 첫 번째 인수로 이벤트 객체를 넘기므로 `e`라고 이름 붙여도 똑같이 들어와요.
  correct: [a, b, c]
misconceptions: [js.mc.preventdefault-stops-handler, js.mc.form-submit-no-default]
hints:
  - "`event`는 매개변수예요. 이 함수를 부르는 쪽은 누구이고, 무엇을 인수로 넘길까요?"
  - "`preventDefault`의 default는 '기본 동작'이에요. 폼 제출의 기본 동작은 무엇이었나요?"
  - "함수를 그 자리에서 끝내는 문장은 `return`이에요. `preventDefault`가 같은 일을 할까요?"
explanation: |
  정답은 "이벤트 객체다", "기본 동작을 막는다", "`target`은 이벤트가 일어난 요소다" 세 가지예요.

  - 우리가 함수를 부르지 않아요. 이벤트가 일어나면 **브라우저가** 함수를 부르면서, 무슨 일이 일어났는지 담은 이벤트 객체를 첫 번째 인수로 넘겨요.
  - 폼 제출의 기본 동작은 입력값을 보내며 페이지를 새로 여는 것이에요. `preventDefault()`가 이것을 막아서, 함수가 바꾼 화면이 그대로 남아요.
  - `event.target`은 이벤트가 일어난 요소예요. `submit` 이벤트는 폼에서 일어나므로 여기서는 `form`이에요.
  - `preventDefault()` 다음 줄도 실행돼요. 함수를 끝내려면 `return`을 써요.
  - 매개변수 이름은 `event`, `e`, `evt` 무엇이든 돼요. 들어오는 값은 같아요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
