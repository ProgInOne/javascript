id: js-basics.browser-intro.events-intro.web-signup-form
type: web_task
difficulty: 4
concepts:
  - { id: js.dom.event-object, weight: 1 }
  - { id: js.dom.input-value, weight: 0.5 }
  - { id: js.str.case-trim, weight: 0.5 }
  - { id: js.dom.class-style, weight: 0.3 }
tags: [submit, preventdefault, validation, trim, classlist, web]
estimatedSeconds: 600
prompt: |
  회원 가입 폼의 닉네임 검사를 완성하세요. 폼(`#signup`)이 제출될 때 검사하도록 `submit` 이벤트를 쓰세요. 그러면 버튼을 눌러도, 입력창에서 Enter 키를 눌러도 똑같이 동작해요.

  1. 폼 제출의 기본 동작(페이지 새로 열기)을 막으세요.
  1. 닉네임은 **앞뒤 공백을 뺀** 글자 수가 2~10글자여야 해요.
  1. 규칙에 맞지 않으면: `#feedback`에 `닉네임은 2~10글자로 써 주세요`를 보여 주고, 입력창에 `invalid` 클래스를 넣으세요.
  1. 규칙에 맞으면: `#feedback`에 `코딩곰님, 가입을 환영해요!`처럼 보여 주고, 입력창의 `invalid` 클래스를 빼고, 입력창을 비우세요.
spec:
  focus: dom
  starter:
    files:
      - path: index.html
        content: |
