id: js-basics.browser-intro.events-intro.web-enter-memo
type: web_task
difficulty: 4
concepts:
  - { id: js.dom.event-object, weight: 1 }
  - { id: js.dom.input-value, weight: 0.5 }
  - { id: js.dom.document-tree, weight: 0.5 }
  - { id: js.dom.text-content, weight: 0.3 }
tags: [keydown, event-key, createelement, append, web]
estimatedSeconds: 600
prompt: |
  입력창에 메모를 쓰고 Enter 키를 누르면 아래 목록에 붙는 **빠른 메모**를 만드세요. 폼은 쓰지 않고, 입력창의 `keydown` 이벤트로 만들어요.

  1. 입력창에서 Enter 키를 눌렀을 때만 메모를 추가해요. 다른 키를 누를 때는 아무 일도 없어야 해요.
  1. 메모는 앞뒤 공백을 뺀 글자로 `li`를 만들어 `#memo-list` 끝에 붙여요. 공백만 있으면 추가하지 않아요.
  1. 추가한 뒤에는 입력창을 비우고, `#memo-count`에 `메모 2개`처럼 지금 메모 수를 보여 줘요.

  누른 키의 이름은 이벤트 객체의 `key`에 들어 있어요(Enter 키는 `"Enter"`). 요소 안의 자식 요소 수는 `요소.children.length`로 셀 수 있어요.
spec:
  focus: dom
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
