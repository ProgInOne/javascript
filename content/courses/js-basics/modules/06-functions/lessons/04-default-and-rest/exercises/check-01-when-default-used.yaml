id: js-basics.functions.default-and-rest.check-when-default-used
type: mcq_multi
usage: check
difficulty: 2
concepts:
  - { id: js.fn.default-params, weight: 1 }
tags: [function, default-parameter, undefined]
estimatedSeconds: 75
prompt: |
  조명 밝기를 정하는 함수예요. 아래 호출 중 결과가 `"밝기 5"`인 것을 모두 고르세요.
code: |
  function lamp(level = 5) {
    return "밝기 " + level;
  }
spec:
  codeOptions: true
  options:
    - id: a
      text: "lamp()"
    - id: b
      text: "lamp(undefined)"
    - id: c
      text: "lamp(5)"
    - id: d
      text: "lamp(0)"
      misconception: js.mc.default-on-null
      rationale: "`0`은 `undefined`가 아니라서 기본값이 쓰이지 않아요. 결과는 `\"밝기 0\"`이에요."
    - id: e
      text: "lamp(null)"
      misconception: js.mc.default-on-null
      rationale: "`null`도 넘긴 값이라 그대로 들어가요. 결과는 `\"밝기 null\"`이에요."
  correct: [a, b, c]
misconceptions: [js.mc.default-on-null]
hints:
  - 기본값은 매개변수 값이 무엇일 때만 쓰이나요?
  - 인수를 안 넘기면 매개변수는 `undefined`가 돼요. `undefined`를 직접 넘겨도 마찬가지예요.
  - "`0`과 `null`은 \"없어 보이는\" 값이지만 `undefined`는 아니에요. 그리고 5를 직접 넘겨도 결과는 같아요."
explanation: |
  정답은 `lamp()`, `lamp(undefined)`, `lamp(5)`예요.

  | 호출 | `level` | 결과 |
  |---|---|---|
  | `lamp()` | 인수 없음 → `undefined` → 기본값 `5` | `밝기 5` |
  | `lamp(undefined)` | `undefined` → 기본값 `5` | `밝기 5` |
  | `lamp(5)` | 넘긴 `5` | `밝기 5` |
  | `lamp(0)` | 넘긴 `0` | `밝기 0` |
  | `lamp(null)` | 넘긴 `null` | `밝기 null` |

  기본값은 **매개변수가 `undefined`일 때만** 쓰여요. `0`이나 `null`은 넘긴 이상 그 값이 그대로 들어가요.
origin: authored
review:
