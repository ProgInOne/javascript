id: js-basics.functions.default-and-rest.tf-default-on-null
type: true_false
difficulty: 2
concepts:
  - { id: js.fn.default-params, weight: 1 }
  - { id: js.types.null, weight: 0.3 }
tags: [default-params, "null"]
estimatedSeconds: 60
prompt: |
  다음 설명이 맞는지 고르고, 그렇게 판단한 이유도 고르세요.
spec:
  statement: "`function cups(count = 1) { return count; }`가 있을 때, `cups(null)`은 값을 주지 않은 것과 같으므로 `1`을 반환한다."
  answer: false
  misconceptionIfWrong: js.mc.default-on-null
  requireReason: true
  reasons:
    - id: r1
      text: 기본값은 매개변수가 undefined일 때만 쓰이므로, null을 넘기면 count는 null이다
      correct: true
    - id: r2
      text: null은 "값이 없음"을 뜻하므로 기본값 1로 바뀐다
      misconception: js.mc.default-on-null
    - id: r3
      text: 기본값이 있는 매개변수에 인수를 넘기면 항상 오류가 난다
hints:
  - 기본값은 매개변수가 어떤 값일 때 쓰였나요?
  - "`null`과 `undefined`는 같은 값인가요? 모듈 2에서 배운 두 값을 떠올려 보세요."
  - 인수를 아예 빼고 부른 `cups()`와, `null`을 넘긴 `cups(null)`에서 `count`에 처음 들어가는 값을 각각 생각해 보세요.
explanation: |
  정답은 **거짓**이에요. `cups(null)`은 `null`을 반환해요.

  기본값은 매개변수 값이 **`undefined`일 때만** 쓰여요. `cups()`나 `cups(undefined)`는 `1`이지만, `null`은 `undefined`와 다른 값이라 그대로 들어가요. `0`이나 빈 문자열도 마찬가지예요.

  - "null은 값이 없음을 뜻하니 기본값으로 바뀐다"는 이유는 `null`과 `undefined`를 같은 것으로 본 생각이에요. 기본값 규칙은 `undefined`만 봐요.
  - "인수를 넘기면 오류가 난다"는 틀려요. 기본값이 있어도 인수를 넘길 수 있고, 그러면 넘긴 값을 써요.
origin: authored
