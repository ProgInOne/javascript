id: js-basics.functions.default-and-rest.predict-default-values
type: predict_output
difficulty: 1
concepts:
  - { id: js.fn.default-params, weight: 1 }
tags: [default-params, predict]
estimatedSeconds: 60
prompt: |
  음료를 주문하는 함수예요. 실행하면 콘솔에 무엇이 출력될까요?
spec:
  lang: js
  code: |
    function drink(menu, size = "보통") {
      return menu + " (" + size + ")";
    }

    console.log(drink("레몬에이드"));
    console.log(drink("녹차", "큰 컵"));
  answerKind: console
hints:
  - 첫 번째 호출에서는 인수를 몇 개 넘겼나요?
  - 인수를 받지 못한 `size`는 `undefined`가 되는데, 기본값이 있으면 어떻게 되나요?
  - 두 번째 호출에서는 `size`에도 인수를 넘겼어요. 이때도 기본값이 쓰일까요?
explanation: |
  출력은 다음과 같아요.

  ```text
  레몬에이드 (보통)
  녹차 (큰 컵)
  ```

  - 첫 번째 호출은 인수가 하나라 `size`가 `undefined`예요. 기본값 `"보통"`이 대신 쓰여요. 기본값이 없었다면 `레몬에이드 (undefined)`가 나왔을 거예요.
  - 두 번째 호출은 `"큰 컵"`을 넘겼으니 기본값은 쓰이지 않아요. 기본값은 값이 빠졌을 때만 쓰는 예비 값이에요.
origin: authored
