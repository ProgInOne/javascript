id: js-basics.functions.default-and-rest
title: 기본값과 나머지 매개변수
summary: 인수를 덜 넘겼을 때 매개변수가 undefined가 되는 규칙과 이를 채우는 기본값 매개변수, 개수가 정해지지 않은 인수를 한데 모으는 나머지 매개변수를 배웁니다.
kind: lesson
importance: standard
estimatedMinutes: { read: 11, practice: 20 }
concepts:
  primary: [js.fn.default-params, js.fn.rest-params]
  reviewed: [js.fn.params-args, js.types.undefined, js.types.null, js.loops.for, js.loops.accumulator-pattern]
objectives:
  - 인수를 덜 넘기면 매개변수가 undefined가 된다는 것을 알고, 기본값 매개변수로 빠진 인수를 채울 수 있다.
  - 기본값이 undefined일 때만 쓰이고 null이나 0을 넘기면 쓰이지 않는다는 것을 예측할 수 있다.
  - 나머지 매개변수로 개수가 정해지지 않은 인수를 모으고, length와 위치 번호로 하나씩 꺼내 계산할 수 있다.
practice:
  targetCount: 14
