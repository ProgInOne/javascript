id: js-basics.functions.scope-basics
title: 스코프 기초
summary: 변수를 쓸 수 있는 범위인 스코프를 배웁니다. 블록 스코프와 함수 스코프, 어디서나 읽을 수 있는 전역 변수, 안쪽에서 같은 이름의 변수를 만들 때 바깥 변수가 가려지는 섀도잉을 다룹니다.
kind: lesson
importance: core
estimatedMinutes: { read: 16, practice: 32 }
concepts:
  primary: [js.scope.block, js.scope.function, js.scope.global, js.scope.shadowing]
  reviewed: [js.control.block, js.loops.loop-variable, js.values.tdz, js.values.var, js.fn.params-args, js.fn.return]
objectives:
  - 블록과 함수 안에서 만든 변수를 어디까지 쓸 수 있는지 예측하고, 범위 밖에서 쓸 때 나는 ReferenceError를 고칠 수 있다.
  - 함수 안의 변수는 호출할 때마다 새로 만들어지고, 바깥 변수는 함수 안에서 읽고 바꿀 수 있다는 것을 실행 결과로 설명할 수 있다.
  - 같은 이름의 변수나 매개변수가 바깥 변수를 가리는 섀도잉을 알아보고, 매개변수를 바꿔도 바깥 변수가 바뀌지 않는 결과를 예측할 수 있다.
  - 상태를 기억해야 하는 값은 바깥에, 계산에만 쓰는 값은 안쪽에 두어 스코프 버그를 고칠 수 있다.
practice:
  targetCount: 24
