id: js-basics.functions.scope-basics.mcq-param-reassign-outer
type: mcq_single
difficulty: 2
concepts:
  - { id: js.scope.shadowing, weight: 1 }
  - { id: js.fn.params-args, weight: 0.3 }
tags: [scope, shadowing, parameter]
estimatedSeconds: 70
prompt: |
  아래 코드를 실행하면 마지막 줄에서 무엇이 출력되나요?
code: |
  let coins = 100;

  function spend(coins) {
    coins -= 30;
    return coins;
  }

  spend(coins);
  console.log(coins);
spec:
  options:
    - id: a
      text: "`100`"
    - id: b
      text: "`70`"
      misconception: js.mc.param-reassign-changes-outer
      rationale: 함수 안의 coins는 매개변수예요. 바깥 coins의 값 100을 받은 별개의 변수라서, 매개변수를 바꿔도 바깥 coins는 그대로예요.
    - id: c
      text: "`30`"
      rationale: 30은 뺀 금액일 뿐 어떤 변수에도 담기지 않아요.
    - id: d
      text: "`undefined`"
      rationale: 바깥 coins는 처음에 100으로 만들어졌고, 아무도 바꾸지 않았어요.
  correct: a
misconceptions: [js.mc.param-reassign-changes-outer]
hints:
  - 함수 안의 `coins`는 어디에서 만들어진 변수인가요? 괄호 안의 매개변수를 보세요.
  - 같은 이름이라도 매개변수는 함수 안의 새 변수예요. 호출할 때 바깥 `coins`의 **값**이 들어갈 뿐이에요.
  - 8번 줄은 반환값을 어디에 담고 있나요? 바깥 `coins`에 새 값을 대입하는 줄이 있는지 찾아보세요.
explanation: |
  `100`이 출력돼요.

  - `spend(coins)`를 부르면 바깥 `coins`의 값 100이 매개변수 `coins`에 들어가요. 매개변수는 이름만 같은 함수 안의 새 변수라서 바깥 `coins`를 가려요(섀도잉).
  - 4번 줄은 매개변수만 70으로 바꿔요. 바깥 `coins`는 손대지 않아요.
  - 반환값 70은 8번 줄에서 아무도 받지 않아 버려져요.

  `70`이라고 생각했다면 매개변수를 바꾸면 인수로 넘긴 바깥 변수도 바뀐다고 본 거예요. 바깥 변수를 바꾸려면 `coins = spend(coins);`처럼 반환값을 직접 대입해야 해요.
origin: authored
review:
