id: js-basics.functions.scope-basics.web-like-counter
type: web_task
difficulty: 4
concepts:
  - { id: js.scope.global, weight: 1 }
  - { id: js.scope.function, weight: 0.5 }
  - { id: js.control.if, weight: 0.3 }
tags: [scope, global, state, web, event]
estimatedSeconds: 480
prompt: |
  게시글의 좋아요 버튼을 완성하세요. 버튼이 세 개 있어요.

  - **좋아요**: 좋아요 수를 1 늘려요.
  - **취소**: 좋아요 수를 1 줄여요. 단, 0보다 작아지지는 않아요.
  - **초기화**: 좋아요 수를 0으로 돌려요. 초기화한 뒤 좋아요를 누르면 1부터 다시 세야 해요.

  누를 때마다 화면에 `좋아요 (개수)개`가 보여야 해요. 예를 들어 좋아요를 세 번 누르면 `좋아요 3개`예요.

  - 버튼을 누르면 `addLike`, `cancelLike`, `resetLikes` 함수가 실행되도록 이미 연결해 두었어요(화면을 다루는 방법은 모듈 10에서 배워요).
  - 화면에 개수를 보여 주는 `showLikes(n)` 함수도 준비되어 있어요. 세 함수의 본문을 채우고, 좋아요 수를 담을 변수를 알맞은 곳에 만드세요.
