id: js-basics.functions.scope-basics.check-param-copy
type: fill_blank
usage: check
difficulty: 2
concepts:
  - { id: js.scope.shadowing, weight: 1 }
  - { id: js.fn.params-args, weight: 0.3 }
tags: [scope, shadowing, parameter]
estimatedSeconds: 70
prompt: |
  게임 캐릭터의 체력을 회복시키는 코드예요.

  ```js
  let hp = 30;

  function heal(hp) {
    hp = hp + 20;
    return hp;
  }

  const after = heal(hp);
  ```

  마지막 줄까지 실행한 뒤 두 변수에 들어 있는 값을 숫자로 쓰세요.
spec:
  mode: text
  template: |
    after: {{blank:after}}
    바깥 hp: {{blank:outer}}
  blanks:
    - id: after
      accept: ["50"]
      width: 4
    - id: outer
      accept: ["30"]
      width: 4
      misconceptionMap:
        "50": js.mc.param-reassign-changes-outer
misconceptions: [js.mc.param-reassign-changes-outer]
hints:
  - "`heal` 안의 `hp`는 바깥의 `hp`와 같은 변수인가요, 매개변수인가요?"
  - "`heal(hp)`를 부르면 바깥 `hp`의 **값** 30이 매개변수 `hp`에 들어가요."
  - 4번 줄은 매개변수만 바꿔요. 바깥 `hp`에 새 값을 넣는 줄이 있나요?
explanation: |
  정답은 `after`가 `50`, 바깥 `hp`가 `30`이에요.

  - 매개변수 `hp`는 함수 안의 새 변수라서 바깥 `hp`를 가려요. `heal(hp)`를 부르면 값 30이 매개변수에 들어가요.
  - 4번 줄은 매개변수만 50으로 바꾸고, 그 값을 돌려줘서 `after`에 50이 담겨요.
  - 바깥 `hp`에 대입하는 줄은 없으니 30 그대로예요. 바깥 체력을 바꾸려면 `hp = heal(hp);`처럼 돌려받아 대입해요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
