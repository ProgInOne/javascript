id: js-basics.functions.scope-basics.fix-param-shadow
type: fix_bug
difficulty: 3
concepts:
  - { id: js.scope.shadowing, weight: 1 }
  - { id: js.fn.return, weight: 0.3 }
tags: [scope, shadowing, parameter, return, debugging]
estimatedSeconds: 200
prompt: |
  게임 캐릭터의 체력을 회복시키는 프로그램이에요. 체력은 최대 100까지예요. 회복 함수를 두 번 불렀는데 체력이 그대로예요. 버그를 고쳐서 아래처럼 출력되게 하세요.

  ```text
  체력: 80
  체력: 100
  ```

  체력이 100을 넘지 않게 하는 규칙은 그대로 지켜야 해요.
spec:
  buggy:
    files:
      - path: main.js
        content: |
          let hp = 50;

          function heal(hp, amount) {
            hp += amount;
            if (hp > 100) {
              hp = 100;
            }
          }

          heal(hp, 30);
          console.log("체력: " + hp);
          heal(hp, 40);
          console.log("체력: " + hp);
  solution:
    files:
      - path: main.js
        content: |
          let hp = 50;

          function heal(hp, amount) {
            hp += amount;
            if (hp > 100) {
              hp = 100;
            }
            return hp;
          }

          hp = heal(hp, 30);
          console.log("체력: " + hp);
          hp = heal(hp, 40);
          console.log("체력: " + hp);
  bugDescription: "`heal`을 두 번 불렀는데 두 번 모두 `체력: 50`이 나와요."
  bugMisconception: js.mc.param-reassign-changes-outer
  checks:
    - kind: console
      id: output
      description: 첫 회복 뒤 80, 두 번째 회복 뒤 최대치 100이 출력되어야 합니다.
      requirement: 체력 회복
      expect:
        lines: ["체력: 80", "체력: 100"]
    - kind: program
      id: final-hp
      description: 프로그램이 끝난 뒤 바깥 변수 hp에 100이 들어 있어야 합니다.
      requirement: 체력 회복
      expect:
        globals: { hp: { equals: 100 } }
        noError: true
misconceptions: [js.mc.param-reassign-changes-outer]
hints:
  - 함수 안의 `hp`는 바깥 `hp`와 같은 변수인가요? 괄호 안의 매개변수 목록을 보세요.
  - 매개변수 `hp`를 아무리 바꿔도 바깥 `hp`는 그대로예요. 함수가 계산한 새 체력을 바깥으로 전달할 방법이 필요해요.
  - 함수가 새 체력을 돌려주게 하고, 부르는 쪽에서 그 값을 받아 바깥 변수에 넣어 보세요.
explanation: |
  `heal(hp, amount)`의 `hp`는 **매개변수**예요. 바깥 `hp`의 값 50을 받은 함수 안의 새 변수라서 바깥 `hp`를 가려요. 함수 안에서 80으로 바꿔도 바깥 `hp`는 50 그대로이고, 함수가 끝나면 매개변수는 사라져요.

  예시 정답은 새 체력을 돌려주고, 부르는 쪽에서 대입해요.

  ```js
  function heal(hp, amount) {
    hp += amount;
    if (hp > 100) {
      hp = 100;
    }
    return hp;
  }

  hp = heal(hp, 30);
  console.log("체력: " + hp);
  hp = heal(hp, 40);
  console.log("체력: " + hp);
  ```

  - `return hp;`만 추가하고 `heal(hp, 30);`을 그대로 두면 반환값이 버려져서 여전히 50이에요. 받아서 대입하는 것까지 해야 해요.
  - 매개변수 `hp`를 지우고 `function heal(amount)`로 바꿔 함수 안에서 바깥 `hp`를 직접 바꾸는 방법도 체크를 통과해요. 다만 값을 돌려주는 방식이 어떤 값이 바뀌는지 부르는 쪽에서 분명히 보여서 더 읽기 쉬워요.
origin: authored
