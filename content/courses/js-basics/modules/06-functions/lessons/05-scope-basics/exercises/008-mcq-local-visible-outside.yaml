id: js-basics.functions.scope-basics.mcq-local-visible-outside
type: mcq_single
difficulty: 1
concepts:
  - { id: js.scope.function, weight: 1 }
tags: [scope, function, reference-error]
estimatedSeconds: 50
prompt: |
  아래 코드를 실행하면 콘솔에 무엇이 나오나요?
code: |
  function makeCoupon() {
    const code = "WELCOME10";
    return "쿠폰 준비 완료";
  }
  console.log(makeCoupon());
  console.log(code);
spec:
  options:
    - id: a
      text: "`쿠폰 준비 완료`가 나온 뒤 `ReferenceError: code is not defined`가 난다"
    - id: b
      text: "`쿠폰 준비 완료`와 `WELCOME10`이 차례로 나온다"
      misconception: js.mc.function-local-visible-outside
      rationale: code는 함수 안에서 만든 변수라 호출이 끝나면 사라져요. 함수를 먼저 호출했어도 밖에서는 쓸 수 없어요.
    - id: c
      text: 아무것도 나오지 않고 처음부터 `ReferenceError`가 난다
      rationale: 5번 줄은 문제없이 실행돼요. 오류는 6번 줄에 다다랐을 때 나요.
    - id: d
      text: "`쿠폰 준비 완료`와 `undefined`가 차례로 나온다"
      rationale: 함수 밖에는 code라는 변수가 아예 없어서 undefined가 아니라 오류가 나요.
  correct: a
misconceptions: [js.mc.function-local-visible-outside]
hints:
  - "`code`는 어디에서 만들어졌나요?"
  - 함수 안에서 만든 변수는 호출이 끝나면 어떻게 될까요?
  - 5번 줄과 6번 줄을 나눠서 생각해 보세요. 5번 줄은 함수를 호출해 반환값을 출력하고, 6번 줄은 함수 밖에서 이름을 찾아요.
explanation: |
  `쿠폰 준비 완료`가 출력된 뒤 6번 줄에서 `ReferenceError: code is not defined`가 나요.

  - 5번 줄: `makeCoupon()`이 `"쿠폰 준비 완료"`를 돌려주고, 그 값이 출력돼요.
  - 6번 줄: `code`는 함수 안에서 만든 변수라 그 함수 안에서만 있어요. 호출이 끝나면 사라지므로 함수 밖에서는 찾을 수 없어요.

  `WELCOME10`도 나온다고 생각했다면, 함수를 한 번 호출하면 안의 변수가 밖에 남는다고 본 거예요. 함수 안의 값이 밖에서 필요하면 `return code;`처럼 돌려줘야 해요.
origin: authored
review:
