id: js-basics.functions.callbacks-intro.impl-count-if
type: implement_function
difficulty: 3
concepts:
  - { id: js.fn.callback, weight: 1 }
  - { id: js.loops.accumulator-pattern, weight: 0.3 }
  - { id: js.control.if, weight: 0.3 }
tags: [callback, accumulator, write-code]
estimatedSeconds: 300
prompt: |
  `start`부터 `end`까지(둘 다 포함)의 정수 중에서 콜백 `test`가 `true`를 돌려주는 수가 몇 개인지 세어 돌려주는 함수 `countIf(start, end, test)`를 완성하세요.

  ```js
  countIf(1, 10, (n) => n % 2 === 0);  // 5 (짝수 2, 4, 6, 8, 10)
  countIf(1, 20, (n) => n % 5 === 0);  // 4 (5, 10, 15, 20)
  ```

  - 무엇을 셀지는 `countIf`가 아니라 `test`가 정해요. `countIf` 안에 특정 조건(짝수 등)을 직접 쓰지 마세요.
  - 숨겨진 테스트는 다른 범위와 다른 조건으로 확인해요. `start`가 `end`보다 크면 셀 수가 없으니 0이에요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          function countIf(start, end, test) {
            // start부터 end까지의 수 n마다 test(n)을 불러 보고,
            // true인 수의 개수를 돌려주세요.
          }
  entry: countIf
  solution:
    files:
      - path: main.js
        content: |
          function countIf(start, end, test) {
            let count = 0;
            for (let n = start; n <= end; n++) {
              if (test(n)) {
                count++;
              }
            }
            return count;
          }
  checks:
    - kind: call
      id: evens
      description: 1부터 10까지 짝수는 5개입니다.
      requirement: 조건에 맞는 수 세기
      argsExpr: "[1, 10, (n) => n % 2 === 0]"
      expect: { equals: 5 }
    - kind: call
      id: fives
      description: 1부터 20까지 5의 배수는 4개입니다.
      requirement: 조건에 맞는 수 세기
      argsExpr: "[1, 20, (n) => n % 5 === 0]"
      expect: { equals: 4 }
    - kind: call
      id: single-number
      visible: false
      description: 시작과 끝이 같으면 그 수 하나만 살펴봐야 합니다(끝 수 포함).
      requirement: 범위의 끝 포함
      argsExpr: "[3, 3, (n) => n > 2]"
      expect: { equals: 1 }
    - kind: call
      id: none-match
      visible: false
      description: 조건에 맞는 수가 하나도 없으면 0을 돌려줘야 합니다.
      requirement: 조건에 맞는 수 세기
      argsExpr: "[1, 10, (n) => n > 100]"
      expect: { equals: 0 }
    - kind: call
      id: empty-range
      visible: false
      description: start가 end보다 크면 살펴볼 수가 없으므로 0이어야 합니다.
      requirement: 범위의 끝 포함
      argsExpr: "[5, 1, (n) => true]"
      expect: { equals: 0 }
    - kind: call
      id: other-rule
      visible: false
      description: 처음 보는 조건(7로 나눈 나머지가 3)도 test가 정하는 대로 세야 합니다.
      requirement: 조건은 콜백이 정함
      argsExpr: "[1, 100, (n) => n % 7 === 3]"
      expect: { equals: 14 }
misconceptions: [js.mc.call-without-parens, js.mc.accumulator-reset-in-loop]
hints:
  - 개수를 세는 누적 변수가 필요해요. 반복 앞에서 0으로 만들어 두세요.
  - "`start`부터 `end`까지(끝 포함) 반복하면서, 수마다 `test`에 그 수를 넣어 불러 보세요."
  - "`test(n)`이 돌려준 값이 참일 때만 개수를 1 늘리고, 반복이 끝난 뒤 개수를 돌려줘요."
explanation: |
  예시 정답이에요.

  ```js
  function countIf(start, end, test) {
    let count = 0;
    for (let n = start; n <= end; n++) {
      if (test(n)) {
        count++;
      }
    }
    return count;
  }
  ```

  - `countIf`는 반복하며 세는 일만 해요. 어떤 수를 셀지는 콜백 `test`가 `true`/`false`로 알려 줘요. 그래서 짝수, 5의 배수, 처음 보는 조건까지 함수 하나로 셀 수 있어요.
  - `n <= end`로 끝 수를 포함해야 해요. `n < end`로 쓰면 `countIf(3, 3, ...)`이 0이 되고, 1부터 20까지의 5의 배수가 3개가 돼요.
  - `start`가 `end`보다 크면 조건 `n <= end`가 처음부터 거짓이라 반복이 돌지 않고 0이 그대로 반환돼요. 따로 처리하지 않아도 돼요.
  - 짝수 조건을 `countIf` 안에 직접 쓰면 보이는 테스트 하나는 통과해도 다른 조건의 테스트는 실패해요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
