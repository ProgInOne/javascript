estimatedSeconds: 150
prompt: |
  학생 수만큼 콜백을 불러 주는 함수 `forEachStudent`와, 학생 한 명의 출석을 부르는 콜백 `check`를 만들어 쓰는 프로그램이에요. 코드 조각을 순서대로 배열해서 아래처럼 출력되게 하세요.

  ```text
  1번 학생 출석
  2번 학생 출석
  3번 학생 출석
  출석 확인 끝
  ```
spec:
  lines:
    - { id: l1, code: "function forEachStudent(count, callback) {" }
    - { id: l2, code: "for (let i = 1; i <= count; i++) {", indent: 1 }
    - { id: l3, code: "callback(i);", indent: 2 }
    - { id: l4, code: "}", indent: 1 }
    - { id: l5, code: "}" }
    - { id: l6, code: "function check(num) {" }
    - { id: l7, code: 'console.log(num + "번 학생 출석");', indent: 1 }
    - { id: l8, code: "}" }
    - { id: l9, code: "forEachStudent(3, check);" }
    - { id: l10, code: 'console.log("출석 확인 끝");' }
  distractors:
    - { id: d1, code: "forEachStudent(3, check());", replaces: l9, misconception: js.mc.callback-called-when-passed }
    - { id: d2, code: "callback;", replaces: l3, misconception: js.mc.call-without-parens }
  gradeIndent: false
  checks:
