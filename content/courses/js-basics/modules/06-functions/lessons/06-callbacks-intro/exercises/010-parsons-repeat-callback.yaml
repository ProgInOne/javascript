      id: output
      description: "1번부터 3번 학생까지 출석을 부르고, 마지막에 \"출석 확인 끝\"이 출력되어야 합니다."
      requirement: 출석 부르기
      expect:
        lines: ["1번 학생 출석", "2번 학생 출석", "3번 학생 출석", "출석 확인 끝"]
    - kind: program
      id: no-error
