misconceptions: [js.mc.callback-called-when-passed, js.mc.call-without-parens]
hints:
  - 함수 두 개를 먼저 완성하고, 그다음 호출하는 줄과 마지막 안내 줄을 놓아 보세요.
  - "`forEachStudent`의 반복 안에서는 받은 콜백을 학생 번호와 함께 불러야 해요. 부르려면 괄호가 필요해요."
  - "`check`를 넘기는 줄이 두 개 보여요. 넘길 때 괄호를 붙이면 그 자리에서 실행된다는 점을 떠올려 보세요."
explanation: |
  정답 순서의 예예요.

  ```js
  function forEachStudent(count, callback) {
    for (let i = 1; i <= count; i++) {
      callback(i);
    }
  }
  function check(num) {
    console.log(num + "번 학생 출석");
  }
  forEachStudent(3, check);
  console.log("출석 확인 끝");
  ```

  - `forEachStudent`는 반복하며 `callback(i)`로 콜백을 불러요. 몇 번, 어떤 번호로 부를지는 이 함수가 정해요.
  - `forEachStudent(3, check);`는 `check`를 괄호 없이 넘겨요. `forEachStudent(3, check());`는 `check`를 먼저 한 번 실행하고(`undefined번 학생 출석`) 그 반환값 `undefined`를 넘겨서 오류가 나요.
  - `callback;`은 함수를 가리키기만 하고 부르지 않아서 출석이 하나도 나오지 않아요.
  - 함수 선언은 미리 만들어지므로 `check` 선언을 `forEachStudent` 선언보다 먼저 놓아도 정답이에요.
