tags: [callback, trace, side-effects, return]
estimatedSeconds: 200
prompt: |
  카페 방문 도장을 찍는 프로그램이에요. 홀수 날에 오면 도장 2개, 짝수 날에 오면 1개를 찍어요. 실행하면 콘솔에 무엇이 출력될까요? 줄마다 적어 보세요.
spec:
  lang: js
  code: |
    let stamps = 0;

    function visit(times, onVisit) {
      for (let day = 1; day <= times; day++) {
        onVisit(day);
      }
      return stamps;
    }

    const addStamp = (day) => {
      if (day % 2 === 1) {
        stamps += 2;
      } else {
        stamps += 1;
      }
      console.log(day + "일차: " + stamps);
    };

    console.log(visit(3, addStamp));
    console.log(visit(2, addStamp));
  answerKind: console
  misconceptionByAnswer:
    "1일차: 2\n2일차: 3\n3일차: 5\n5\n1일차: 2\n2일차: 3\n3": js.mc.function-cant-change-outer
hints:
  - "`visit(3, addStamp)`는 `addStamp`를 몇 번, 어떤 `day`로 부르나요? `console.log(visit(...))`의 출력은 언제 나올까요?"
  - "`stamps`는 맨 바깥에서 한 번만 만든 변수예요. 콜백이 바꾼 값은 다음 호출에도 남아 있을까요?"
  - 두 번째 `visit`의 `day`는 다시 1부터 시작하지만, `stamps`는 첫 번째 `visit`이 끝났을 때의 값에서 이어져요. 표로 적어 보세요.
explanation: |
  출력은 다음과 같아요.

  ```text
  1일차: 2
  2일차: 3
  3일차: 5
  5
  1일차: 7
  2일차: 8
  8
  ```

  | 호출 | `day` | 찍는 도장 | `stamps` |
  |---|---|---|---|
  | 첫 번째 `visit` | 1 | 2 | 2 |
  | | 2 | 1 | 3 |
  | | 3 | 2 | 5 |
  | 두 번째 `visit` | 1 | 2 | 7 |
  | | 2 | 1 | 8 |

  - `visit`는 반복하며 콜백 `onVisit(day)`를 부르고, 콜백 `addStamp`는 바깥 변수 `stamps`를 바꾸고 출력해요.
  - `console.log(visit(3, addStamp))`는 `visit`가 **끝나야** 반환값을 출력할 수 있어요. 그래서 `1일차`~`3일차` 세 줄이 먼저 나오고, 그다음 반환값 `5`가 나와요.
  - `day`는 `for` 안에서 만든 변수라서 두 번째 `visit`에서 1부터 다시 시작해요. 하지만 `stamps`는 바깥 변수라 5에서 이어져 7, 8이 돼요.

  두 번째 `visit`의 도장 수를 2, 3으로 적었다면, 함수가 바꾼 바깥 변수가 호출이 끝나면 원래대로 돌아간다고 본 거예요.
