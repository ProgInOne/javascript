id: js-basics.functions.callbacks-intro.fill-callback-arg
type: fill_blank
difficulty: 2
concepts:
  - { id: js.fn.callback, weight: 1 }
  - { id: js.fn.return, weight: 0.3 }
tags: [callback, fill]
estimatedSeconds: 90
prompt: |
  `applyToPrice(price, rule)`는 가격과 가격 규칙(`rule`)을 받아, 규칙을 적용한 가격 뒤에 `"원"`을 붙여 돌려줘요. `rule`은 가격을 받아 새 가격을 돌려주는 **함수**예요.

  ```js
  applyToPrice(10000, (p) => p * 0.9);   // "9000원"
  applyToPrice(5000, (p) => p - 1000);   // "4000원"
  ```

  빈칸을 채워 함수를 완성하세요.
spec:
  mode: code
  lang: js
  entry: applyToPrice
  template: |
    function applyToPrice(price, rule) {
      const newPrice = {{blank:call}};
      return newPrice + "원";
    }
  blanks:
    - id: call
      accept: ["rule(price)"]
      width: 14
      misconceptionMap:
        "rule": js.mc.call-without-parens
  checks:
    - kind: call
      id: ten-percent
      description: 10% 할인 규칙이면 10000원이 "9000원"이 되어야 합니다.
      requirement: 규칙 적용
      argsExpr: "[10000, (p) => p * 0.9]"
      expect: { equals: "9000원" }
    - kind: call
      id: minus-1000
      description: 1000원 빼기 규칙이면 5000원이 "4000원"이 되어야 합니다.
      requirement: 규칙 적용
      argsExpr: "[5000, (p) => p - 1000]"
      expect: { equals: "4000원" }
    - kind: call
      id: same-price
      visible: false
      description: 가격을 그대로 돌려주는 규칙이면 가격이 바뀌지 않아야 합니다.
      requirement: 규칙 적용
      argsExpr: "[3000, (p) => p]"
      expect: { equals: "3000원" }
misconceptions: [js.mc.call-without-parens]
hints:
  - 새 가격은 `rule`이 정해 줘요. `rule`은 함수예요.
  - 함수를 실행하려면 이름 뒤에 괄호를 붙이고, 괄호 안에 넘길 값을 써요.
  - "`rule`에게 넘겨야 할 값은 원래 가격이에요. 매개변수 이름을 확인해 보세요."
explanation: |
  빈칸에는 `rule(price)`가 들어가요.

  ```js
  function applyToPrice(price, rule) {
    const newPrice = rule(price);
    return newPrice + "원";
  }
  ```

  - `rule`은 호출하는 쪽이 넘겨 준 콜백이에요. `rule(price)`로 원래 가격을 넣어 부르면 규칙이 계산한 새 가격을 돌려받아요.
  - 괄호 없이 `rule`만 쓰면 함수를 부르지 않고 함수 자체에 `"원"`을 붙이게 되어, 숫자가 아닌 이상한 글자가 나와요.
  - `applyToPrice`는 가격을 어떻게 바꿀지 몰라도 돼요. 그 일은 콜백이 맡아요.
origin: authored
review:
