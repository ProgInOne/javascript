id: js-basics.functions.callbacks-intro.impl-each-number
type: implement_function
difficulty: 2
concepts:
  - { id: js.fn.callback, weight: 1 }
  - { id: js.fn.arrow, weight: 0.3 }
tags: [callback, arrow, write-code]
estimatedSeconds: 240
prompt: |
  시작 코드의 `repeatFor(start, end, callback)`는 `start`부터 `end`까지의 수를 하나씩 `callback`에 넣어 불러 줘요. `repeatFor`는 고치지 말고, **콜백을 만들어 넘겨서** 아래처럼 출력되게 하세요.

  ```text
  3 x 1 = 3
  3 x 2 = 6
  3 x 3 = 9
  3 x 4 = 12
  카운트: 7
  카운트: 8
  카운트: 9
  ```

  - 처음 네 줄: 함수 선언으로 `timesThree(n)`를 만들고, `repeatFor`에 넘기세요.
  - 마지막 세 줄: 이름 없이 화살표 함수를 `repeatFor`를 부르는 자리에서 바로 만들어 넘기세요.
  - `console.log`를 일곱 번 직접 쓰지 말고 `repeatFor`가 콜백을 부르게 해 보세요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          function repeatFor(start, end, callback) {
            for (let n = start; n <= end; n++) {
              callback(n);
            }
          }

          // 아래에 timesThree를 만들고, repeatFor를 두 번 부르세요.
  solution:
    files:
      - path: main.js
        content: |
          function repeatFor(start, end, callback) {
            for (let n = start; n <= end; n++) {
              callback(n);
            }
          }

          // 아래에 timesThree를 만들고, repeatFor를 두 번 부르세요.
          function timesThree(n) {
            console.log("3 x " + n + " = " + 3 * n);
          }

          repeatFor(1, 4, timesThree);
          repeatFor(7, 9, (n) => {
            console.log("카운트: " + n);
          });
  checks:
    - kind: console
      id: output
      description: 3단 네 줄과 카운트 세 줄이 차례로 출력되어야 합니다.
      requirement: 콜백으로 출력
      expect:
        lines: ["3 x 1 = 3", "3 x 2 = 6", "3 x 3 = 9", "3 x 4 = 12", "카운트: 7", "카운트: 8", "카운트: 9"]
    - kind: program
      id: no-error
      description: 프로그램이 오류 없이 끝나야 합니다.
      requirement: 오류 없이 실행
      expect:
        noError: true
      misconceptionIfFail: js.mc.callback-called-when-passed
misconceptions: [js.mc.callback-called-when-passed]
hints:
  - "`repeatFor`는 수를 하나씩 콜백에 넣어 불러 줘요. 콜백은 받은 수 하나로 한 줄만 출력하면 돼요."
  - "`timesThree`는 매개변수 `n`을 받아 한 줄을 출력하는 함수예요. `repeatFor`를 부를 때 시작 수와 끝 수를 출력에 맞게 고르세요."
  - "두 번째 호출의 세 번째 인수 자리에 `(n) => { ... }` 모양의 함수를 바로 써요. 어느 쪽이든 넘길 때 괄호를 붙여 실행하지 않도록 조심하세요."
explanation: |
  예시 정답이에요.

  ```js
  function timesThree(n) {
    console.log("3 x " + n + " = " + 3 * n);
  }

  repeatFor(1, 4, timesThree);
  repeatFor(7, 9, (n) => {
    console.log("카운트: " + n);
  });
  ```

  - `repeatFor(1, 4, timesThree)`: `timesThree`를 괄호 없이 넘기면 `repeatFor`가 1, 2, 3, 4를 넣어 네 번 불러요.
  - `repeatFor(7, 9, (n) => { ... })`: 한 번만 쓸 콜백은 이름을 붙이지 않고 그 자리에서 화살표 함수로 만들어 넘길 수 있어요.
  - `repeatFor(1, 4, timesThree())`처럼 괄호를 붙이면 `timesThree`가 `n` 없이 한 번 실행되고(`3 x undefined = NaN`), `undefined`가 넘어가서 `TypeError: callback is not a function`이 나요.
  - 이 문제는 출력만 확인해서 `console.log`를 일곱 번 써도 통과해요. 그래도 콜백으로 써 보는 것이 이 문제의 목적이에요.
