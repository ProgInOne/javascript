id: js-basics.functions.callbacks-intro.predict-callback-order
type: predict_output
difficulty: 3
concepts:
  - { id: js.fn.callback, weight: 1 }
  - { id: js.fn.params-args, weight: 0.3 }
tags: [callback, flow, trace]
estimatedSeconds: 110
prompt: |
  분식집 주문 프로그램이에요. 조리가 끝나면 부를 함수(`onDone`)를 받아 두었다가 불러 줘요. 실행하면 콘솔에 무엇이 어떤 순서로 출력될까요?
spec:
  lang: js
  code: |
    function processOrder(menu, onDone) {
      console.log(menu + " 조리 중");
      onDone(menu);
      console.log(menu + " 정리");
    }

    function serve(food) {
      console.log(food + " 나왔습니다");
    }

    console.log("주문 받음");
    processOrder("라면", serve);
    console.log("다음 손님");
  answerKind: console
  misconceptionByAnswer:
    "주문 받음\n라면 나왔습니다\n라면 조리 중\n라면 정리\n다음 손님": js.mc.callback-runs-at-pass-time
hints:
  - 12번 줄에서 `serve`를 넘길 때 `serve`가 실행되나요? 괄호가 있는지 보세요.
  - "`processOrder`의 본문을 위에서부터 따라가세요. `onDone(menu)`는 본문의 몇 번째 줄인가요?"
  - "`onDone(menu)`가 불리면 `serve`가 실행되고, 끝나면 `processOrder`의 다음 줄로 돌아와요. `food`에는 무엇이 들어갈까요?"
explanation: |
  출력은 다음과 같아요.

  ```text
  주문 받음
  라면 조리 중
  라면 나왔습니다
  라면 정리
  다음 손님
  ```

  - 12번 줄은 `serve`를 실행하지 않고 함수째로 넘겨요. `processOrder` 안에서 `menu`는 `"라면"`, `onDone`은 `serve`예요.
  - `processOrder`가 먼저 `라면 조리 중`을 출력해요.
  - 3번 줄의 `onDone(menu)`가 `serve("라면")`을 부르는 것과 같아요. 그래서 `라면 나왔습니다`가 나오고, `serve`가 끝나면 4번 줄로 돌아와 `라면 정리`를 출력해요.
  - `processOrder`가 끝나면 13번 줄로 돌아와 `다음 손님`이 나와요.

  `라면 나왔습니다`를 `라면 조리 중`보다 먼저 썼다면, 콜백이 넘기는 순간 실행된다고 본 거예요. 콜백은 받은 함수가 부르는 자리에서 실행돼요.
