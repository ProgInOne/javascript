id: js-basics.functions.callbacks-intro.web-click-handlers
type: web_task
difficulty: 4
concepts:
  - { id: js.fn.callback, weight: 1 }
  - { id: js.scope.global, weight: 0.3 }
  - { id: js.control.if, weight: 0.3 }
tags: [callback, web, event, boundary]
estimatedSeconds: 480
prompt: |
  장바구니의 수량 조절 버튼을 완성하세요. 버튼이 세 개 있어요.

  - **+1**: 수량을 1 늘려요. 단, 한 번에 **최대 10개**까지만 담을 수 있어요(10에서 더 누르면 10 그대로).
  - **-1**: 수량을 1 줄여요. 단, **0보다 작아지지 않아요**(0에서 더 누르면 0 그대로).
  - **처음으로**: 수량을 0으로 되돌려요.

  시작 코드에는 버튼을 누를 때마다 콜백을 불러 주는 도우미 함수 `whenClicked(selector, callback)`이 있어요(안의 코드는 모듈 10에서 배워요). 할 일은 두 가지예요.

  1. 수량을 바꾸는 함수 `addOne`, `removeOne`, `resetQty`를 만드세요. 수량은 바깥 변수 `qty`에 있고, 바꾼 뒤에는 `show()`를 불러야 화면에 보여요.
  1. `whenClicked`로 세 버튼(`#plus`, `#minus`, `#reset`)에 각 함수를 연결하세요.
