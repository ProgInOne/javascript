id: js-basics.functions.expressions-and-arrows.mcq-expression-stores-function
type: mcq_single
difficulty: 1
concepts:
  - { id: js.fn.expression, weight: 1 }
tags: [function-expression, value]
estimatedSeconds: 50
prompt: |
  아래 코드에서 1~3번 줄이 실행된 직후, 변수 `add`에는 무엇이 들어 있나요?
code: |
  const add = function (a, b) {
    return a + b;
  };
  console.log(add(2, 3));
spec:
  options:
    - id: a
      text: 두 수를 받아 더한 값을 돌려주는 함수 자체
    - id: b
      text: "`5` (아래에서 `add(2, 3)`을 부를 것이므로)"
      misconception: js.mc.fn-expression-stores-result
      rationale: 1~3번 줄은 함수를 담기만 해요. 2와 3은 4번 줄에서 호출할 때 처음 넘겨져요.
    - id: c
      text: "`NaN` (`a`와 `b` 없이 본문을 실행한 결과)"
      misconception: js.mc.fn-expression-stores-result
      rationale: 함수 표현식은 담는 순간 본문을 실행하지 않아요. 그래서 계산 결과는 아직 없어요.
    - id: d
      text: "`undefined` (아직 값을 계산하지 않았으므로)"
      rationale: 계산하지 않은 것은 맞지만 비어 있는 것은 아니에요. 함수라는 값이 들어 있어요.
  correct: a
misconceptions: [js.mc.fn-expression-stores-result]
hints:
  - "`const price = 3000;`에서 `price`에는 `=` 오른쪽의 값이 들어가요. 이 코드에서 `=` 오른쪽은 무엇인가요?"
  - "`function (a, b) { ... }`는 함수를 **만드는** 식이에요. 함수 본문은 언제 실행되나요?"
  - 1~3번 줄에서는 인수를 하나도 넘기지 않았어요. 넘긴 값이 없으면 계산도 할 수 없어요.
explanation: |
  `add`에는 **함수 자체**가 들어 있어요.

  함수 표현식 `function (a, b) { ... }`는 함수라는 값을 만들고, `const add =`는 그 값을 담기만 해요. 본문 `return a + b;`는 4번 줄에서 `add(2, 3)`으로 호출할 때 처음 실행되고, 그때 `5`가 나와요.

  - `5`라고 답했다면: 2와 3은 4번 줄의 호출에서 넘겨요. 담는 순간에는 아직 알 수 없는 값이에요.
  - `NaN`이라고 답했다면: 담는 순간 본문이 실행된다고 생각한 거예요. 본문은 호출할 때만 실행돼요.
  - `undefined`라고 답했다면: 변수가 비어 있지는 않아요. `typeof add`를 출력하면 `"function"`이 나와요.
