id: js-basics.functions.expressions-and-arrows.tf-expression-vs-declaration
type: true_false
difficulty: 2
concepts:
  - { id: js.fn.expression, weight: 1 }
tags: [function-expression, call]
estimatedSeconds: 60
prompt: |
  다음 설명이 맞는지 고르고, 그렇게 판단한 이유도 고르세요.
spec:
  statement: "`const square = function (n) { return n * n; };`로 만든 함수는 함수 선언으로 만든 함수와 똑같이 `square(4)`처럼 괄호를 붙여 호출하고, 그 결과는 `16`이다."
  answer: true
  misconceptionIfWrong: js.mc.fn-expression-stores-result
  requireReason: true
  reasons:
    - id: r1
      text: 함수 표현식은 함수를 값으로 만들어 변수에 담으므로, 변수 이름 뒤에 괄호를 붙이면 담긴 함수가 실행된다
      correct: true
    - id: r2
      text: 함수 표현식은 담는 순간 이미 실행되어 결과가 들어 있으므로, 괄호 없이 square만 써야 결과를 읽을 수 있다
      misconception: js.mc.fn-expression-stores-result
    - id: r3
      text: 함수 표현식으로 만든 함수에는 이름이 없으므로 square(4)처럼 이름으로 부를 수 없다
hints:
  - 함수 표현식에서 `square`라는 변수에는 무엇이 담기나요?
  - "`function (n) { ... }`에는 `function` 뒤에 이름이 없어요. 그럼 이 함수를 부를 때는 어떤 이름을 쓸까요?"
  - 변수에 담긴 것이 함수라면, 그 함수를 실행하는 방법은 함수 선언과 같아요.
explanation: |
  정답은 **참**, 이유는 "함수 표현식은 함수를 값으로 만들어 변수에 담으므로, 변수 이름 뒤에 괄호를 붙이면 담긴 함수가 실행된다"예요.

  ```js
  const square = function (n) {
    return n * n;
  };
  console.log(square(4)); // 16
  ```

  - 담는 순간 실행된다는 이유를 골랐다면: 1~3번 줄은 함수를 담기만 해요. `square`만 쓰면 결과가 아니라 함수 자체예요.
  - 이름이 없어서 부를 수 없다는 이유를 골랐다면: `function` 뒤에 이름은 없지만, 함수를 담은 변수 이름 `square`로 불러요.
origin: authored
