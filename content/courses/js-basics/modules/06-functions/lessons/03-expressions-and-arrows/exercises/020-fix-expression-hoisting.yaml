id: js-basics.functions.expressions-and-arrows.fix-expression-hoisting
type: fix_bug
difficulty: 3
concepts:
  - { id: js.fn.hoisting, weight: 1 }
  - { id: js.fn.expression, weight: 0.3 }
tags: [hoisting, function-expression, tdz, debugging]
estimatedSeconds: 150
prompt: |
  영화표 가격을 계산하는 프로그램이에요. 4장 이상 사면 5000원을 깎아 줘요. 실행하면 오류가 나요. 버그를 고쳐서 아래처럼 나오게 하세요.

  ```text
  영화표 2장: 24000원
  영화표 5장: 55000원
  ```

  `ticketPrice`의 계산 내용은 바꾸지 마세요.
spec:
  buggy:
    files:
      - path: main.js
        content: |
          console.log("영화표 2장: " + ticketPrice(2) + "원");
          console.log("영화표 5장: " + ticketPrice(5) + "원");

          const ticketPrice = function (count) {
            if (count >= 4) {
              return count * 12000 - 5000;
            }
            return count * 12000;
          };
  solution:
    files:
      - path: main.js
        content: |
          const ticketPrice = function (count) {
            if (count >= 4) {
              return count * 12000 - 5000;
            }
            return count * 12000;
          };

          console.log("영화표 2장: " + ticketPrice(2) + "원");
          console.log("영화표 5장: " + ticketPrice(5) + "원");
  bugDescription: "실행하면 `ReferenceError: Cannot access 'ticketPrice' before initialization` 오류가 나고 아무것도 출력되지 않아요."
  bugMisconception: js.mc.expression-hoisted
  checks:
    - kind: console
      id: output
      description: 2장과 5장의 가격이 차례로 출력되어야 합니다.
      requirement: 영화표 가격 출력
      expect:
        lines: ["영화표 2장: 24000원", "영화표 5장: 55000원"]
    - kind: program
      id: no-error
      description: 프로그램이 오류 없이 끝나야 합니다.
      requirement: 오류 없이 실행
      expect:
        noError: true
      misconceptionIfFail: js.mc.expression-hoisted
misconceptions: [js.mc.expression-hoisted]
hints:
  - "`ticketPrice`는 `const`로 만든 함수 표현식이에요. 함수가 변수에 담기는 것은 몇 번 줄이 실행될 때인가요?"
  - 1번 줄은 그 줄보다 먼저 실행돼요. 오류 메시지의 "before initialization"과 연결해 보세요.
  - 함수를 쓰기 전에 함수가 준비되어 있도록 만드는 방법이 두 가지 있어요. 줄의 순서를 바꾸거나, 미리 만들어지는 방식의 함수로 바꾸는 것이에요.
explanation: |
  `ticketPrice`는 `const`로 만든 함수 표현식이에요. 4번 줄이 실행되어야 함수가 담기는데, 1번 줄에서 먼저 호출해서 `ReferenceError: Cannot access 'ticketPrice' before initialization`이 나요.

  고치는 방법은 두 가지예요.

  1. 함수 표현식을 호출보다 **위로** 옮겨요(예시 정답).
  1. 함수 **선언**으로 바꿔요. 함수 선언은 미리 만들어지므로 아래에 있어도 돼요.

  ```js
  function ticketPrice(count) {
    if (count >= 4) {
      return count * 12000 - 5000;
    }
    return count * 12000;
  }
  ```

  계산: 2장은 `2 * 12000` = `24000`, 5장은 `5 * 12000 - 5000` = `55000`이에요.
origin: authored
review:
