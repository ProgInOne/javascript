id: js-basics.functions.function-basics.tf-param-let-redeclare
type: true_false
difficulty: 2
concepts:
  - { id: js.fn.params-args, weight: 1 }
tags: [function, parameter, let, syntax-error]
estimatedSeconds: 70
prompt: |
  다음 설명이 맞는지 고르고, 그렇게 판단한 이유도 고르세요.
code: |
  function addTax(price) {
    let price = price * 1.1;
    return price;
  }

  console.log(addTax(1000));
spec:
  statement: 위 코드처럼 매개변수 `price`를 함수 안에서 `let`으로 다시 만들어야 그 값을 쓸 수 있으므로, 이 코드는 문제없이 실행된다.
  answer: false
  misconceptionIfWrong: js.mc.param-redeclare-with-let
  requireReason: true
  reasons:
    - id: r1
      text: 매개변수는 이미 함수 안의 변수라서, 같은 이름을 let으로 다시 만들면 SyntaxError가 난다
      correct: true
    - id: r2
      text: let으로 다시 만들어도 되지만, 그러면 인수로 받은 값이 사라져 undefined가 출력된다
      misconception: js.mc.param-redeclare-with-let
    - id: r3
      text: 매개변수는 함수 밖의 변수라서 함수 안에서는 쓸 수 없고, 그래서 ReferenceError가 난다
hints:
  - 매개변수는 함수 안에서 어떤 것처럼 동작한다고 배웠나요?
  - 같은 블록 안에서 같은 이름을 `let`으로 두 번 만들면 어떻게 되었나요?
  - 이 오류는 실행 중에 날까요, 실행 전에 문법 검사에서 날까요? 오류 종류를 떠올려 보세요.
explanation: |
  정답은 **거짓**, 이유는 "매개변수는 이미 함수 안의 변수라서, 같은 이름을 let으로 다시 만들면 SyntaxError가 난다"예요.

  이 코드를 실행하면 아무것도 출력되지 않고 이런 오류가 나요.

  ```text
  SyntaxError: Identifier 'price' has already been declared
  ```

  매개변수 `price`는 호출할 때 인수 값을 받은 함수 안의 변수예요. 다시 만들 필요 없이 바로 쓰면 돼요.

  ```js
  function addTax(price) {
    return price * 1.1;
  }
  ```

  - "인수 값이 사라져 `undefined`가 된다"는 생각은 틀렸어요. 실행되기 전에 문법 오류로 막혀요.
  - 매개변수는 함수 **안**에서 쓰는 변수예요. 함수 밖에서 쓸 수 없는 것이지, 안에서 못 쓰는 것이 아니에요.
