id: js-basics.functions.function-basics.mcq-declare-not-run
type: mcq_single
difficulty: 1
concepts:
  - { id: js.fn.declaration, weight: 1 }
tags: [function, declaration]
estimatedSeconds: 45
prompt: |
  아래 프로그램 전체를 실행하면 콘솔에 무엇이 출력되나요?
code: |
  function welcome() {
    console.log("어서 오세요");
  }
  console.log("문을 열었어요");
spec:
  options:
    - id: a
      text: "`문을 열었어요` 한 줄"
    - id: b
      text: "`어서 오세요`와 `문을 열었어요` 두 줄"
      misconception: js.mc.declaration-runs-function
      rationale: 함수 선언은 함수를 만들어 두기만 해요. welcome()처럼 호출한 곳이 없으니 본문은 실행되지 않아요.
    - id: c
      text: "`문을 열었어요`와 `어서 오세요` 두 줄"
      misconception: js.mc.declaration-runs-function
      rationale: 선언이 아래로 미뤄져 실행되는 것도 아니에요. 호출이 없으면 본문은 한 번도 실행되지 않아요.
    - id: d
      text: 함수를 호출하지 않아서 오류가 난다
      rationale: 만들어 두고 쓰지 않은 함수가 있어도 오류는 나지 않아요.
  correct: a
misconceptions: [js.mc.declaration-runs-function]
hints:
  - 1~3번 줄은 함수를 만드는 코드예요. 만드는 것과 실행하는 것은 같은 일일까요?
  - 함수 본문이 실행되려면 어떤 코드가 있어야 하나요? 이 프로그램에 그런 코드가 있는지 찾아보세요.
  - "`welcome()`처럼 이름 뒤에 괄호를 붙인 줄이 있는지 살펴보세요."
explanation: |
  출력은 `문을 열었어요` 한 줄이에요.

  1~3번 줄은 함수 **선언**이에요. `welcome`이라는 이름으로 본문을 만들어 두기만 하고, 그 자리에서 실행하지 않아요. 본문은 `welcome()`처럼 **호출**할 때 실행되는데, 이 프로그램에는 호출이 없어요.

  - 두 줄이 나온다고 생각했다면 선언과 호출을 같은 일로 본 거예요. 4번 줄 다음에 `welcome();`을 추가하면 그때 `어서 오세요`가 나와요.
  - 쓰지 않는 함수가 있어도 오류는 나지 않아요. 만들어 두기만 한 함수일 뿐이에요.
origin: authored
