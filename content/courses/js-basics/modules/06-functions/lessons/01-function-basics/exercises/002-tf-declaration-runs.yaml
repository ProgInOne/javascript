id: js-basics.functions.function-basics.tf-declaration-runs
type: true_false
difficulty: 1
concepts:
  - { id: js.fn.declaration, weight: 1 }
tags: [function, declaration, call]
estimatedSeconds: 50
prompt: |
  다음 설명이 맞는지 고르고, 그렇게 판단한 이유도 고르세요.
spec:
  statement: "`function bell() { console.log(\"딩동\"); }`을 쓰고 아래에서 `bell();`을 두 번 쓰면, `딩동`은 모두 세 번 출력된다."
  answer: false
  misconceptionIfWrong: js.mc.declaration-runs-function
  requireReason: true
  reasons:
    - id: r1
      text: 선언은 함수를 만들어 두기만 하고, 본문은 호출한 횟수만큼만 실행되므로 두 번 출력된다
      correct: true
    - id: r2
      text: 선언할 때 한 번 실행되고 호출할 때마다 한 번씩 더 실행되므로 세 번 출력된다
      misconception: js.mc.declaration-runs-function
    - id: r3
      text: 함수는 한 번만 실행할 수 있어서 두 번째 호출은 무시되므로 한 번 출력된다
      misconception: js.mc.function-runs-once
hints:
  - 선언하는 순간 본문이 실행될까요, 아니면 만들어 두기만 할까요?
  - 본문이 실행되는 때는 이름 뒤에 괄호를 붙여 호출할 때예요. 호출은 몇 번 있나요?
  - 같은 함수를 두 번 부르면 본문도 두 번 실행될지 생각해 보세요.
explanation: |
  정답은 **거짓**, 이유는 "선언은 함수를 만들어 두기만 하고, 본문은 호출한 횟수만큼만 실행되므로 두 번 출력된다"예요.

  ```js
  function bell() {
    console.log("딩동");
  }
  bell();
  bell();
  ```

  출력은 `딩동` 두 줄이에요. 선언은 요리법을 적어 두는 것과 같아서 적는 순간에는 아무것도 만들어지지 않아요.

  - "선언할 때 한 번 실행된다"는 생각이 이 설명의 함정이에요. 선언만으로는 본문이 실행되지 않아요.
  - "두 번째 호출은 무시된다"도 틀렸어요. 함수는 부를 때마다 본문을 처음부터 다시 실행해요.
origin: authored
review:
