id: js-basics.functions.function-basics.parsons-declare-and-call
type: parsons
difficulty: 2
concepts:
  - { id: js.fn.declaration, weight: 1 }
  - { id: js.fn.call, weight: 0.5 }
tags: [function, declaration, call, parsons]
estimatedSeconds: 120
prompt: |
  출석 도장을 찍는 함수 `stamp`를 만들고 두 번 불러서 아래처럼 출력되게 하세요. 코드 조각을 순서대로 배열하세요.

  ```text
  출석 체크 시작
  1일차 출석 완료
  2일차 출석 완료
  출석 체크 끝
  ```
spec:
  lines:
    - { id: l1, code: "function stamp(day) {" }
    - { id: l2, code: 'console.log(day + "일차 출석 완료");', indent: 1 }
    - { id: l3, code: "}" }
    - { id: l4, code: 'console.log("출석 체크 시작");' }
    - { id: l5, code: "stamp(1);" }
    - { id: l6, code: "stamp(2);" }
    - { id: l7, code: 'console.log("출석 체크 끝");' }
  distractors:
    - { id: d1, code: "stamp;", replaces: l5, misconception: js.mc.call-without-parens }
    - { id: d2, code: "stamp(day);", replaces: l6 }
  gradeIndent: false
  checks:
    - kind: console
      id: output
      description: 시작 안내, 1일차·2일차 출석, 끝 안내가 차례로 출력되어야 합니다.
      requirement: 출석 출력
      expect:
        lines: ["출석 체크 시작", "1일차 출석 완료", "2일차 출석 완료", "출석 체크 끝"]
misconceptions: [js.mc.declaration-runs-function, js.mc.call-without-parens]
hints:
  - 함수 선언은 세 줄(`function` 줄, 본문, 닫는 중괄호)로 이루어져 있어요. 본문은 중괄호 안에 들어가요.
  - 선언은 출력을 만들지 않아요. 출력 순서는 호출과 `console.log` 줄의 순서로 정해져요.
  - 함수를 실행하려면 이름 뒤에 괄호와 인수가 필요해요. 인수로는 몇 일차인지 숫자를 넘겨요.
explanation: |
  정답 순서의 예예요.

  ```js
  function stamp(day) {
    console.log(day + "일차 출석 완료");
  }
  console.log("출석 체크 시작");
  stamp(1);
  stamp(2);
  console.log("출석 체크 끝");
  ```

  - 선언(1~3번 줄)은 맨 위에 있어도 아무것도 출력하지 않아요. 그래서 첫 출력은 `출석 체크 시작`이에요.
  - `stamp(1)`을 부르면 매개변수 `day`에 1이 들어가 `1일차 출석 완료`가 나와요. `stamp(2)`도 같은 본문을 다시 실행해요.
  - `stamp;`는 괄호가 없어서 호출이 아니에요. 오류 없이 지나가서 한 줄이 빠져요.
  - `stamp(day);`는 함수 밖에서 `day`를 쓰려고 해서 `ReferenceError: day is not defined`가 나요. `day`는 함수 안에서만 쓰는 매개변수예요.
