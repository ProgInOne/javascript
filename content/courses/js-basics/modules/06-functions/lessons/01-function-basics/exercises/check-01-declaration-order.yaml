id: js-basics.functions.function-basics.check-declaration-order
type: predict_output
usage: check
difficulty: 1
concepts:
  - { id: js.fn.declaration, weight: 1 }
  - { id: js.fn.call, weight: 0.3 }
tags: [function, declaration, call]
estimatedSeconds: 60
prompt: |
  함수 선언이 프로그램 **가운데**에 있어요. 실행하면 콘솔에 무엇이 어떤 순서로 출력될까요? 줄마다 하나씩 쓰세요.
spec:
  lang: js
  code: |
    console.log("1교시 시작");

    function bellRing() {
      console.log("종이 울려요");
    }

    console.log("1교시 끝");
    bellRing();
  answerKind: console
  misconceptionByAnswer:
    "1교시 시작\n종이 울려요\n1교시 끝": js.mc.declaration-runs-function
    "1교시 시작\n종이 울려요\n1교시 끝\n종이 울려요": js.mc.declaration-runs-function
misconceptions: [js.mc.declaration-runs-function]
hints:
  - 3~5번 줄의 함수 선언은 그 자리에서 무엇을 하나요?
  - 선언은 함수를 만들어 두기만 해요. 본문이 실행되는 것은 이름 뒤에 괄호를 붙여 부를 때예요.
  - "`bellRing()`을 부르는 줄은 몇 번째 줄인가요? 그 줄보다 위에 있는 출력부터 차례로 적어 보세요."
explanation: |
  출력은 다음과 같아요.

  ```text
  1교시 시작
  1교시 끝
  종이 울려요
  ```

  - 3~5번 줄은 함수 선언이라 `bellRing`을 만들어 두기만 해요. 선언이 프로그램 가운데에 있어도 그 자리에서 `종이 울려요`가 나오지 않아요.
  - 8번 줄에서 `bellRing()`을 부를 때 비로소 본문이 실행돼요. 그래서 `종이 울려요`는 맨 마지막에 한 번 나와요.

  `종이 울려요`가 `1교시 끝`보다 먼저 나온다고 생각했다면, 선언하는 순간 본문이 실행된다고 본 거예요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
