id: js-basics.functions.function-basics.fix-log-instead-of-return
type: fix_bug
difficulty: 3
concepts:
  - { id: js.fn.return, weight: 1 }
  - { id: js.basics.console-log, weight: 0.3 }
tags: [return, console, debugging]
estimatedSeconds: 180
prompt: |
  옷 가게의 할인가를 계산하는 함수 `salePrice(price, percent)`예요. 정가 `price`에서 `percent`퍼센트를 깎은 값을 **돌려줘야** 다른 코드가 그 값을 쓸 수 있어요. 지금은 아래처럼 이상하게 출력돼요. 버그를 고쳐서 출력이 `코트 할인가: 40000원` 한 줄만 나오게 하세요.

  ```text
  40000
  코트 할인가: undefined원
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          function salePrice(price, percent) {
            console.log(price - price * percent / 100);
          }

          const coat = salePrice(50000, 20);
          console.log("코트 할인가: " + coat + "원");
  entry: salePrice
  solution:
    files:
      - path: main.js
        content: |
          function salePrice(price, percent) {
            return price - price * percent / 100;
          }

          const coat = salePrice(50000, 20);
          console.log("코트 할인가: " + coat + "원");
  bugDescription: "`40000`이 따로 한 줄 나오고, 할인가 자리에는 `undefined원`이 나와요."
  bugMisconception: js.mc.return-is-log
  checks:
    - kind: console
      id: output
      description: "콘솔에는 `코트 할인가: 40000원` 한 줄만 출력되어야 합니다."
      requirement: 할인가 출력
      expect:
        lines: ["코트 할인가: 40000원"]
    - kind: call
      id: coat
      args: [50000, 20]
      expect: { equals: 40000 }
      requirement: 할인가 돌려주기
      misconceptionIfFail: js.mc.return-is-log
    - kind: call
      id: half
      args: [12000, 50]
      expect: { equals: 6000 }
      requirement: 할인가 돌려주기
    - kind: call
      id: hidden-ten
      visible: false
      description: 다른 정가와 할인율로 불러도 할인가를 돌려줘야 합니다.
      args: [9900, 10]
      expect: { equals: 8910 }
      requirement: 할인가 돌려주기
misconceptions: [js.mc.return-is-log]
hints:
  - "`coat`에 `undefined`가 담긴 이유를 생각해 보세요. `salePrice`는 무엇을 돌려주고 있나요?"
  - 2번 줄은 값을 화면에 보여 주기만 해요. 값을 호출한 자리로 돌려주는 키워드는 따로 있어요.
  - 함수 안에서는 계산한 값을 돌려주기만 하고, 출력은 6번 줄에서 한 번만 해요.
explanation: |
  2번 줄이 값을 **보여 주기만** 하고 돌려주지 않았어요. 그래서 `40000`이 따로 출력되고, 함수의 결과는 `undefined`가 되어 `coat`에 `undefined`가 담겼어요.

  ```js
  function salePrice(price, percent) {
    return price - price * percent / 100;
  }
  ```

  - `return`으로 바꾸면 `salePrice(50000, 20)` 자리가 `40000`이 되어 `coat`에 담기고, 6번 줄이 한 번만 출력해요.
  - `console.log`를 남겨 둔 채 `return`을 추가하면 값은 돌아오지만 `40000`이 한 줄 더 출력되어 출력 검사를 통과하지 못해요. 계산 함수는 돌려주기만 하고, 출력은 쓰는 쪽에서 하는 것이 좋아요.
  - 50000에서 20퍼센트를 깎으면 `50000 - 50000 * 20 / 100` = `50000 - 10000` = `40000`이에요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
