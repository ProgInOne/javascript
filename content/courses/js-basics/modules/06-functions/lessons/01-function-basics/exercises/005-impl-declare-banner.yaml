id: js-basics.functions.function-basics.impl-declare-banner
type: implement_function
difficulty: 2
concepts:
  - { id: js.fn.declaration, weight: 1 }
  - { id: js.fn.call, weight: 0.5 }
  - { id: js.fn.params-args, weight: 0.3 }
tags: [function, declaration, call, write-code]
estimatedSeconds: 240
prompt: |
  가게 입구 화면에 띄울 안내판을 출력하는 프로그램을 작성하세요.

  - 가게 이름을 매개변수 `shop`으로 받아 안내판 세 줄을 출력하는 함수 `printBanner`를 선언하세요.
  - 함수를 두 번 불러서, 처음에는 `분식나라`, 다음에는 `행복빵집` 안내판을 출력하세요.
  - 안내판 세 줄을 두 번 직접 쓰지 말고, 함수 한 곳에만 써 보세요.

  ```text
  ==========
  어서 오세요, 분식나라
  ==========
  ==========
  어서 오세요, 행복빵집
  ==========
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          // printBanner 함수를 선언하고, 두 번 불러 보세요.
  solution:
    files:
      - path: main.js
        content: |
          // printBanner 함수를 선언하고, 두 번 불러 보세요.
          function printBanner(shop) {
            console.log("==========");
            console.log("어서 오세요, " + shop);
            console.log("==========");
          }

          printBanner("분식나라");
          printBanner("행복빵집");
  checks:
    - kind: console
      id: output
      description: 분식나라와 행복빵집 안내판이 차례로 세 줄씩 출력되어야 합니다.
      requirement: 안내판 두 개
      expect:
        lines:
          - "=========="
          - "어서 오세요, 분식나라"
          - "=========="
          - "=========="
          - "어서 오세요, 행복빵집"
          - "=========="
misconceptions: [js.mc.declaration-runs-function]
hints:
  - 먼저 `function printBanner(shop) { }` 모양으로 함수를 만들어 두세요. 이 단계에서는 아직 아무것도 출력되지 않아요.
  - 본문에는 `console.log` 세 줄이 들어가요. 가운데 줄에서는 매개변수 `shop`을 글자와 `+`로 이어 붙여요.
  - 선언 아래에서 이름 뒤에 괄호를 붙이고 가게 이름을 인수로 넘겨 두 번 호출해요.
explanation: |
  예시 정답이에요.

  ```js
  function printBanner(shop) {
    console.log("==========");
    console.log("어서 오세요, " + shop);
    console.log("==========");
  }

  printBanner("분식나라");
  printBanner("행복빵집");
  ```

  - 선언만 하면 아무것도 출력되지 않아요. 아래의 두 호출이 각각 본문 세 줄을 실행해요.
  - 첫 호출에서는 `shop`이 `"분식나라"`, 두 번째 호출에서는 `"행복빵집"`이에요. 같은 본문이 인수에 따라 다른 결과를 내요.
  - 안내판 모양을 바꾸고 싶으면 함수 본문 한 곳만 고치면 돼요. 여섯 줄을 직접 써도 출력은 같지만, 함수를 쓰는 연습이 되지 않아요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
