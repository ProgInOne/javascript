id: js-basics.functions.function-basics.find-bug-return-in-loop
type: find_bug_line
difficulty: 3
concepts:
  - { id: js.fn.return, weight: 1 }
  - { id: js.loops.accumulator-pattern, weight: 0.3 }
  - { id: js.loops.for, weight: 0.3 }
tags: [return, loop, accumulator, debugging]
estimatedSeconds: 180
prompt: |
  1부터 `n`까지 더한 값을 돌려주는 함수 `sumUpTo`예요. 오류는 나지 않는데 결과가 이상해요. 원인이 되는 줄을 찾고, 왜 그런지도 고르세요.
spec:
  code: |-
    function sumUpTo(n) {
      let total = 0;
      for (let i = 1; i <= n; i++) {
        total += i;
        return total;
      }
    }

    console.log("1부터 4까지 합: " + sumUpTo(4));
    console.log("1부터 10까지 합: " + sumUpTo(10));
  bugLines: [5]
  symptom: "합이 10과 55로 나와야 하는데, 둘 다 `1`이 나와요."
  symptomCheck:
    console: ["1부터 4까지 합: 1", "1부터 10까지 합: 1"]
  fixedCode: |-
    function sumUpTo(n) {
      let total = 0;
      for (let i = 1; i <= n; i++) {
        total += i;
        if (i === n) return total;
      }
    }

    console.log("1부터 4까지 합: " + sumUpTo(4));
    console.log("1부터 10까지 합: " + sumUpTo(10));
  causeOptions:
    - id: c1
      text: 반복 안의 return이 첫 회차에 함수를 끝내서, 1만 더한 값이 돌아왔다
      correct: true
    - id: c2
      text: return이 값을 돌려준 뒤에도 반복은 계속되지만, 처음 돌려준 값만 결과로 남았다
      misconception: js.mc.code-after-return-runs
    - id: c3
      text: 4번 줄의 +=가 이전 합계를 버리고 i로 덮어써서 마지막 값만 남았다
      misconception: js.mc.accumulator-overwrite
hints:
  - 반복이 실제로 몇 회차까지 돌았는지 생각해 보세요. 결과 `1`은 몇 회차까지 더한 값인가요?
  - 첫 회차에서 4번 줄 다음에 5번 줄이 실행되면 함수는 어떻게 되나요?
  - "`return`은 반복만 끝내는 것이 아니에요. 합계를 다 모은 **뒤에** 돌려주려면 그 줄이 어디에 있어야 할까요?"
explanation: |
  원인은 **5번 줄** `return total;`이 반복 **안**에 있는 거예요.

  첫 회차에서 `total`이 1이 된 직후 `return`을 만나요. `return`은 함수를 그 자리에서 끝내기 때문에 반복도 함께 끝나고, `1`이 돌아와요. `n`이 4든 10이든 첫 회차는 똑같아서 둘 다 `1`이에요.

  `return`을 반복이 끝난 **뒤**로 옮기면 돼요.

  ```js
  for (let i = 1; i <= n; i++) {
    total += i;
  }
  return total;
  ```

  - "반복은 계속되지만 처음 값만 남는다"는 틀렸어요. `return` 뒤로는 반복을 포함해 함수 안의 어떤 코드도 실행되지 않아요.
  - `total += i`는 덮어쓰기가 아니라 이전 값에 더하기예요. 덮어썼다면 마지막 값(4나 10)이 나왔을 거예요.
  - 고칠 때는 5번 줄을 반복의 닫는 중괄호(6번 줄) 아래로 옮겨요. 6번 줄 자체에는 잘못이 없으니 원인 줄은 5번 줄이에요.
origin: authored
