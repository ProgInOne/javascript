id: js-basics.functions.function-basics.fix-missing-call
type: fix_bug
difficulty: 2
concepts:
  - { id: js.fn.call, weight: 1 }
  - { id: js.fn.declaration, weight: 0.5 }
tags: [function, call, debugging]
estimatedSeconds: 100
prompt: |
  아침 9시에 가게 문을 여는 안내를 출력하는 프로그램이에요. 함수 `openShop`을 만들어 두었는데, 실행하면 한 줄만 나와요. 버그를 고쳐서 아래처럼 출력되게 하세요.

  ```text
  아침 9시
  가게 문을 열어요
  오늘도 힘내요!
  ```

  함수 본문은 고치지 않아도 돼요.
spec:
  buggy:
    files:
      - path: main.js
        content: |
          function openShop() {
            console.log("가게 문을 열어요");
            console.log("오늘도 힘내요!");
          }

          console.log("아침 9시");
  solution:
    files:
      - path: main.js
        content: |
          function openShop() {
            console.log("가게 문을 열어요");
            console.log("오늘도 힘내요!");
          }

          console.log("아침 9시");
          openShop();
  bugDescription: "`아침 9시` 한 줄만 출력되고, 함수 안의 두 줄은 나오지 않아요."
  bugMisconception: js.mc.declaration-runs-function
  checks:
    - kind: console
      id: output
      description: "`아침 9시` 다음에 가게 안내 두 줄이 출력되어야 합니다."
      requirement: 안내 세 줄
      expect:
        lines: ["아침 9시", "가게 문을 열어요", "오늘도 힘내요!"]
      misconceptionIfFail: js.mc.declaration-runs-function
misconceptions: [js.mc.declaration-runs-function]
hints:
  - 함수 안의 두 줄은 언제 실행될까요? 함수를 만들어 둔 것만으로 실행될까요?
  - 이 프로그램에서 `openShop`을 부르는 줄이 있는지 찾아보세요.
  - "`아침 9시` 다음에 안내가 나와야 하니, 함수를 부르는 줄이 들어갈 자리는 6번 줄의 앞일까요, 뒤일까요?"
explanation: |
  `openShop`을 **선언만 하고 호출하지 않았어요.** 선언은 함수를 만들어 두기만 하니 본문이 실행되지 않아요.

  ```js
  console.log("아침 9시");
  openShop();
  ```

  - 호출을 `console.log("아침 9시");` **다음에** 둬야 출력 순서가 맞아요. 앞에 두면 안내 두 줄이 `아침 9시`보다 먼저 나와요.
  - 이름만 쓴 `openShop;`은 호출이 아니에요. 괄호까지 써야 해요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
