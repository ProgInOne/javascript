id: js-basics.functions.function-basics.check-args-order
type: mcq_single
usage: check
difficulty: 2
concepts:
  - { id: js.fn.params-args, weight: 1 }
  - { id: js.fn.return, weight: 0.3 }
tags: [function, parameter, argument, order]
estimatedSeconds: 60
prompt: |
  두 수의 차이를 구하려고 만든 함수예요. 마지막 줄은 무엇을 출력하나요?
code: |
  function gap(big, small) {
    return big - small;
  }

  console.log(gap(3, 10));
spec:
  options:
    - id: a
      text: "`-7`"
    - id: b
      text: "`7`"
      misconception: js.mc.params-match-by-name
      rationale: 매개변수 이름이 `big`이라고 큰 수가 알아서 들어가지 않아요. 첫 번째 인수 3이 `big`에 들어가요.
    - id: c
      text: "`13`"
      rationale: 본문은 더하기가 아니라 빼기 `big - small`이에요.
    - id: d
      text: "오류가 난다"
      rationale: 인수가 매개변수의 뜻과 맞지 않아도 오류는 나지 않아요. 순서대로 들어가 계산될 뿐이에요.
  correct: a
misconceptions: [js.mc.params-match-by-name]
hints:
  - 인수는 이름이나 뜻이 아니라 무엇에 따라 매개변수에 들어가나요?
  - 첫 번째 인수 `3`은 첫 번째 매개변수에, 두 번째 인수 `10`은 두 번째 매개변수에 들어가요.
  - "`big`이 3, `small`이 10일 때 `big - small`을 계산해 보세요."
explanation: |
  정답은 `-7`이에요.

  `gap(3, 10)`을 부르면 인수가 **순서대로** 들어가요.

  - 첫 번째 인수 `3` → 매개변수 `big`
  - 두 번째 인수 `10` → 매개변수 `small`

  그래서 `big - small`은 `3 - 10`, 곧 `-7`이에요. 매개변수 이름이 `big`이어도 JavaScript는 이름의 뜻을 보지 않아요. 원하는 결과(7)를 얻으려면 `gap(10, 3)`처럼 순서를 맞춰 불러야 해요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
