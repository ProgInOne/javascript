id: js-basics.functions.function-basics.fill-rect-area
type: fill_blank
difficulty: 2
concepts:
  - { id: js.fn.params-args, weight: 1 }
  - { id: js.fn.return, weight: 0.3 }
tags: [function, parameter, return, fill]
estimatedSeconds: 90
prompt: |
  직사각형의 가로와 세로를 받아 넓이를 돌려주는 함수 `rectArea`를 완성하세요.

  - 가로는 `width`, 세로는 `height`라는 매개변수로 받아요.
  - 예: `rectArea(3, 4)`는 `12`를 돌려줘요.
spec:
  mode: code
  lang: js
  entry: rectArea
  template: |
    function rectArea({{blank:params}}) {
      return {{blank:expr}};
    }
  blanks:
    - id: params
      accept: ["width, height"]
      width: 16
    - id: expr
      accept: ["width * height"]
      width: 16
  checks:
    - kind: call
      id: three-four
      args: [3, 4]
      expect: { equals: 12 }
      requirement: 넓이 계산
    - kind: call
      id: square
      args: [5, 5]
      expect: { equals: 25 }
      requirement: 넓이 계산
    - kind: call
      id: hidden-wide
      visible: false
      description: 다른 가로·세로 값으로 불러도 넓이를 돌려줘야 합니다.
      args: [10, 2]
      expect: { equals: 20 }
      requirement: 넓이 계산
misconceptions: [js.mc.param-redeclare-with-let]
hints:
  - 첫 번째 빈칸은 함수를 만들 때 괄호 안에 적는 이름들이에요. 두 개를 쉼표로 나눠 써요.
  - 두 번째 빈칸에서는 매개변수를 그대로 계산에 써요. 따로 `let`으로 만들 필요가 없어요.
  - 넓이는 가로와 세로를 곱한 값이에요. 숫자 `3`이나 `4`를 직접 쓰면 다른 인수로 불렀을 때 틀려요.
explanation: |
  예시 정답이에요.

  ```js
  function rectArea(width, height) {
    return width * height;
  }
  ```

  - `rectArea(3, 4)`를 부르면 `width`에 3, `height`에 4가 들어가고 `12`를 돌려줘요.
  - 매개변수를 쓰기 때문에 `rectArea(10, 2)`처럼 다른 인수로 불러도 맞는 넓이(20)를 돌려줘요. `return 12;`처럼 숫자를 직접 쓰면 숨김 검사에서 틀려요.
  - `height * width`처럼 곱하는 순서를 바꿔도 결과가 같아 정답이에요.
origin: authored
