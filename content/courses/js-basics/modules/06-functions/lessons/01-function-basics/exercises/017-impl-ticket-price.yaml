misconceptions: [js.mc.params-match-by-name, js.mc.code-after-return-runs]
hints:
  - 먼저 요일에 따른 기본 요금을 정해 두면 나머지 규칙을 쓰기 쉬워요. 기본 요금을 담을 변수를 하나 만들어 보세요.
  - 나이 조건을 `if`·`else if`로 나눠요. 각 규칙의 경계(7세, 8세, 18세, 65세)가 포함인지 아닌지를 요금표에서 다시 확인하세요.
  - 65세 규칙은 나이와 요일을 **함께** 따져야 해요. 어느 갈래에도 해당하지 않는 사람은 기본 요금을 내요.
explanation: |
  예시 정답이에요.

  ```js
  function ticketPrice(age, isWeekend) {
    let base = 10000;
    if (isWeekend) {
      base = 12000;
    }

    if (age <= 7) {
      return 0;
    } else if (age <= 18) {
      return base - 4000;
    } else if (age >= 65 && !isWeekend) {
      return 5000;
    }
    return base;
  }
  ```

  - **기본 요금을 먼저**: 주말·평일 기본 요금을 `base`에 정해 두면 청소년 할인과 마지막 기본 요금에서 같이 쓸 수 있어요.
  - **경계값**: "7세 이하"는 `age <= 7`, "8세 이상 18세 이하"는 앞 조건이 거짓일 때(8세 이상) `age <= 18`이에요. 18세를 `age < 18`로 쓰면 18세가 할인을 못 받아요.
  - **두 조건을 함께**: 65세 규칙은 `age >= 65 && !isWeekend`예요. 나이만 보면 70세 주말 손님이 5000원이 되어 틀려요.
  - **`return`은 함수를 끝내요**: 맞는 갈래에서 `return`하면 아래 줄은 실행되지 않아요. 그래서 마지막 `return base;`는 어느 갈래에도 해당하지 않을 때만 실행돼요.
  - 인수 순서는 `(age, isWeekend)`예요. `ticketPrice(12, true)`는 12세가 주말에 온 경우예요.
