id: js-basics.functions.function-basics.impl-ticket-price
type: implement_function
difficulty: 4
concepts:
  - { id: js.fn.params-args, weight: 1 }
  - { id: js.fn.return, weight: 0.5 }
  - { id: js.control.else-if, weight: 0.3 }
  - { id: js.ops.logical-and-or-not, weight: 0.3 }
tags: [function, parameter, return, if, boundary, write-code]
estimatedSeconds: 480
prompt: |
  수영장 입장료를 계산하는 함수 `ticketPrice(age, isWeekend)`를 완성하세요. `age`는 나이(숫자), `isWeekend`는 주말이면 `true`, 평일이면 `false`예요. 아래 요금표대로 입장료(숫자)를 **돌려주세요**.

  - 기본 요금은 평일 10000원, 주말 12000원이에요.
  - 7세 이하는 요일과 관계없이 무료(0원)예요.
  - 8세 이상 18세 이하는 기본 요금에서 4000원을 깎아 줘요.
  - 65세 이상은 **평일에만** 5000원이에요. 주말에는 기본 요금을 내요.
  - 나이는 0 이상의 정수만 들어온다고 생각해도 돼요.

  예: `ticketPrice(30, false)` → `10000`, `ticketPrice(12, true)` → `8000`
spec:
  starter:
    files:
      - path: main.js
        content: |
          function ticketPrice(age, isWeekend) {
            // 여기에 작성하세요
          }
  entry: ticketPrice
  solution:
    files:
      - path: main.js
        content: |
          function ticketPrice(age, isWeekend) {
            let base = 10000;
            if (isWeekend) {
              base = 12000;
            }

            if (age <= 7) {
              return 0;
            } else if (age <= 18) {
              return base - 4000;
            } else if (age >= 65 && !isWeekend) {
              return 5000;
            }
            return base;
          }
  checks:
    - kind: call
      id: adult-weekday
      args: [30, false]
      expect: { equals: 10000 }
      requirement: 기본 요금
    - kind: call
      id: teen-weekend
      args: [12, true]
      expect: { equals: 8000 }
      requirement: 청소년 할인
    - kind: call
      id: adult-weekend
      visible: false
      description: 어른이 주말에 오면 주말 기본 요금이어야 합니다.
      args: [40, true]
      expect: { equals: 12000 }
      requirement: 기본 요금
    - kind: call
      id: age-7
      visible: false
      description: 7세는 무료 나이에 들어갑니다(경계값).
      args: [7, true]
      expect: { equals: 0 }
      requirement: 무료 나이
    - kind: call
      id: age-8
      visible: false
      description: 8세는 청소년 할인 나이의 시작입니다(경계값).
      args: [8, false]
      expect: { equals: 6000 }
      requirement: 청소년 할인
    - kind: call
      id: age-18
      visible: false
      description: 18세까지 청소년 할인을 받습니다(경계값).
      args: [18, true]
      expect: { equals: 8000 }
      requirement: 청소년 할인
    - kind: call
      id: age-19
      visible: false
      description: 19세는 기본 요금입니다(경계값).
      args: [19, false]
      expect: { equals: 10000 }
      requirement: 기본 요금
    - kind: call
      id: senior-weekday
      visible: false
