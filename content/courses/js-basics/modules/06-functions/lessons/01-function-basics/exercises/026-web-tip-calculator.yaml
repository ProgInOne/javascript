id: js-basics.functions.function-basics.web-tip-calculator
type: web_task
difficulty: 4
concepts:
  - { id: js.fn.return, weight: 1 }
  - { id: js.fn.params-args, weight: 0.5 }
  - { id: js.control.if, weight: 0.3 }
tags: [return, function, boundary, web]
estimatedSeconds: 480
prompt: |
  식당 계산서의 팁 계산기를 완성하세요. 금액을 넣고 팁 비율을 고른 뒤 **계산하기** 버튼을 누르면 `팁 5000원 · 합계 55000원`처럼 보여야 해요.

  시작 코드에서 버튼을 누르면 입력값을 숫자로 바꿔 함수 `calcTip(amount, percent)`를 부르고, 그 **반환값**으로 팁과 합계를 화면에 보여 주도록 이미 연결해 두었어요(화면을 다루는 방법은 모듈 10에서 배워요). 여러분은 `calcTip` 함수의 본문만 작성하면 돼요.

  `calcTip`이 돌려줄 팁(숫자)은 이렇게 정해요.

  - 팁은 `금액 × 비율 ÷ 100`이에요. 예: 50000원의 10%는 5000원.
  - 단, 계산한 팁이 1000원보다 적으면 팁은 **1000원**이에요(최소 팁).
  - 비율이 0%이면 팁을 주지 않으므로 0원이에요. 이때는 최소 팁을 적용하지 않아요.

  미리보기에서 6000원·10%, 8000원·0%처럼 규칙의 경계에 있는 값도 직접 넣어 확인해 보세요.
