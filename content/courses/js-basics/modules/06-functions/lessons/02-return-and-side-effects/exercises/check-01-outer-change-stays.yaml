id: js-basics.functions.return-and-side-effects.check-outer-change-stays
type: predict_output
usage: check
difficulty: 2
concepts:
  - { id: js.fn.side-effects, weight: 1 }
  - { id: js.fn.return, weight: 0.3 }
tags: [function, side-effect, outer-variable, return]
estimatedSeconds: 70
prompt: |
  게임을 하면 휴대폰 배터리가 닳아요. 함수 `play`는 배터리를 줄이고 남은 양을 돌려줘요. 실행하면 콘솔에 무엇이 출력될까요? 줄마다 하나씩 쓰세요.
spec:
  lang: js
  code: |
    let battery = 80;

    function play(minutes) {
      battery = battery - minutes;
      return battery;
    }

    play(20);
    console.log(play(10));
    console.log(battery);
  answerKind: console
  misconceptionByAnswer:
    "70\n80": js.mc.function-cant-change-outer
    "70\n70": js.mc.function-cant-change-outer
misconceptions: [js.mc.function-cant-change-outer]
hints:
  - "`play(20);`은 돌려받은 값을 아무 데도 쓰지 않아요. 그래도 함수 본문은 실행될까요?"
  - "`play` 안의 `battery = battery - minutes;`는 바깥 변수 `battery`를 바꿔요. 이 변화는 함수가 끝나도 남아요."
  - "`play(20)` 뒤의 `battery`는 60이에요. 거기서 `play(10)`을 부르면요?"
explanation: |
  출력은 다음과 같아요.

  ```text
  50
  50
  ```

  - `play(20);`은 돌려받은 값을 버리지만, 본문은 실행돼서 바깥 `battery`가 80 → 60으로 바뀌어요. 이런 변화가 **부수 효과**예요.
  - `play(10)`은 60 → 50으로 바꾸고 50을 돌려줘요. 그 뒤 `battery`도 50이에요.

  `70`으로 시작했다면 반환값을 쓰지 않은 호출 `play(20);`은 아무 일도 하지 않는다고 본 거예요. 반환값을 버려도 바깥 변수를 바꾼 부수 효과는 그대로 남아요. 마지막 줄을 `80`으로 썼다면 함수가 바깥 변수를 바꿀 수 없다고 본 거예요.
