misconceptions: [js.mc.return-is-log]
hints:
  - 함수는 `function` 줄로 시작해서 `}`로 끝나요. 할인 금액을 먼저 구해야 그 값을 쓸 수 있어요.
  - 할인된 가격을 함수 밖으로 내보내는 방법은 출력도, 대입도 아니에요.
  - 남은 조각 중 값을 호출한 자리로 돌려주는 줄을 고르세요.
explanation: |
  정답 순서는 다음과 같아요.

  ```js
  function discounted(price, percent) {
    const off = price * percent / 100;
    return price - off;
  }
  ```

  이 함수는 매개변수만 보고 계산해서 돌려주기만 해요. 그래서 `discounted(10000, 10)`은 언제 불러도 9000이에요. 순수 함수예요.

  - `console.log(price - off);`를 쓰면 화면에는 보이지만 돌려주는 값이 없어 결과가 `undefined`가 돼요.
  - `salePrice = price - off;`는 선언하지 않은 이름에 대입해서 엄격 모드에서 `ReferenceError: salePrice is not defined`가 나요. 바깥 변수를 미리 만들어 두었더라도, 바깥을 바꾸는 것은 부수 효과라서 순수 함수가 아니게 돼요.
