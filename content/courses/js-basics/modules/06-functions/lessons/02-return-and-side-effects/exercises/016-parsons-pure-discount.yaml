prompt: |
  할인된 가격을 돌려주는 **순수 함수** `discounted(price, percent)`를 만드세요. 코드 조각을 순서대로 배열하면 돼요.

  - 할인 금액은 `price * percent / 100`이에요.
  - 할인된 가격을 **돌려줘야** 해요. 출력하거나 바깥 변수에 넣지 마세요.
  - 예: `discounted(10000, 10)` → `9000`, `discounted(5000, 20)` → `4000`
spec:
  lines:
    - { id: l1, code: "function discounted(price, percent) {" }
    - { id: l2, code: "const off = price * percent / 100;", indent: 1 }
    - { id: l3, code: "return price - off;", indent: 1 }
    - { id: l4, code: "}" }
  distractors:
    - { id: d1, code: "console.log(price - off);", replaces: l3, misconception: js.mc.return-is-log }
    - { id: d2, code: "salePrice = price - off;", replaces: l3 }
  gradeIndent: false
