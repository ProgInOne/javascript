id: js-basics.functions.return-and-side-effects.fill-return-all-paths
type: fill_blank
difficulty: 2
concepts:
  - { id: js.fn.undefined-return, weight: 1 }
tags: [undefined-return, return, fill]
estimatedSeconds: 70
prompt: |
  주차 요금을 계산하는 함수 `parkingFee(hours)`예요. 1시간까지는 무료이고, 그다음부터는 1시간마다 1000원이에요. 지금은 1시간이 넘으면 요금이 `undefined`로 나와요. 빈칸을 채워 모든 경우에 요금을 돌려주게 하세요.

  - `parkingFee(1)` → `0`
  - `parkingFee(3)` → `2000`
spec:
  mode: code
  lang: js
  entry: parkingFee
  template: |
    function parkingFee(hours) {
      if (hours <= 1) {
        return 0;
      }
      {{blank:rest}} (hours - 1) * 1000;
    }
  blanks:
    - id: rest
      accept: ["return"]
      width: 12
      misconceptionMap:
        "console.log": js.mc.return-is-log
  checks:
    - kind: call
      id: free
      description: 1시간이면 무료(0)여야 합니다.
      requirement: 요금 돌려주기
      args: [1]
      expect: { equals: 0 }
    - kind: call
      id: three
      description: 3시간이면 2000원이어야 합니다.
      requirement: 요금 돌려주기
      args: [3]
      expect: { equals: 2000 }
    - kind: call
      id: long
      visible: false
      description: 더 오래 세워도 1시간을 뺀 시간만큼 요금을 돌려줘야 합니다.
      requirement: 요금 돌려주기
      args: [6]
      expect: { equals: 5000 }
      misconceptionIfFail: js.mc.return-in-if-covers-all
misconceptions: [js.mc.return-in-if-covers-all, js.mc.return-is-log]
hints:
  - 1시간이 넘을 때 함수는 어느 줄까지 내려가나요? 그 줄은 계산만 하고 있어요.
  - 계산한 값을 호출한 자리에 돌려주려면 계산 앞에 무엇이 필요할까요?
  - 빈칸에는 낱말 하나가 들어가요. 값을 콘솔에 보여 주는 낱말이 아니라, 호출한 자리로 값을 보내고 함수를 끝내는 낱말이에요.
explanation: |
  빈칸에는 `return`이 들어가요.

  ```js
  function parkingFee(hours) {
    if (hours <= 1) {
      return 0;
    }
    return (hours - 1) * 1000;
  }
  ```

  빈칸이 비어 있으면 5번 줄은 `(hours - 1) * 1000;`처럼 계산만 하고 결과를 버리는 문장이 돼요. 1시간이 넘으면 `if` 블록을 건너뛰고 함수 끝까지 가는데, 만난 `return`이 없으니 `undefined`를 돌려줘요.

  `console.log`를 넣으면 요금이 콘솔에 보이기만 할 뿐 돌려주지는 않아요. 모든 갈래에서 `return`을 만나야 함수가 항상 값을 돌려줘요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
