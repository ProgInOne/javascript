id: js-basics.functions.return-and-side-effects.fill-return-all-paths
type: fill_blank
difficulty: 2
concepts:
  - { id: js.fn.undefined-return, weight: 1 }
tags: [undefined-return, return, fill]
estimatedSeconds: 70
prompt: |
  주차 요금을 계산하는 함수 `parkingFee(hours)`예요. 1시간까지는 무료이고, 그다음부터는 1시간마다 1000원이에요. 빈칸이 비어 있으면 1시간이 넘을 때 요금이 `undefined`로 나와요. 빈칸에 문장 하나를 채워 모든 경우에 요금을 돌려주게 하세요.

  - `parkingFee(1)` → `0`
  - `parkingFee(3)` → `2000`
spec:
  mode: code
  lang: js
  entry: parkingFee
  template: |
    function parkingFee(hours) {
      if (hours <= 1) {
        return 0;
      }
      {{blank:rest}}
    }
  blanks:
    - id: rest
      accept: ["return (hours - 1) * 1000;"]
      width: 28
      misconceptionMap:
        "console.log((hours - 1) * 1000);": js.mc.return-is-log
        "console.log((hours - 1) * 1000)": js.mc.return-is-log
        "console.log((hours-1)*1000);": js.mc.return-is-log
        "console.log((hours-1)*1000)": js.mc.return-is-log
  checks:
    - kind: call
      id: free
      description: 1시간이면 무료(0)여야 합니다.
      requirement: 요금 돌려주기
      args: [1]
      expect: { equals: 0 }
    - kind: call
      id: three
      description: 3시간이면 2000원이어야 합니다.
      requirement: 요금 돌려주기
      args: [3]
      expect: { equals: 2000 }
    - kind: call
      id: long
      visible: false
      description: 더 오래 세워도 1시간을 뺀 시간만큼 요금을 돌려줘야 합니다.
      requirement: 요금 돌려주기
      args: [6]
      expect: { equals: 5000 }
      misconceptionIfFail: js.mc.return-in-if-covers-all
misconceptions: [js.mc.return-in-if-covers-all, js.mc.return-is-log]
hints:
  - "`parkingFee(3)`을 따라가 보세요. `if` 블록을 건너뛴 뒤 함수가 끝날 때까지 만나는 `return`이 있나요?"
  - 1시간까지는 무료라서, 요금을 매기는 시간은 `hours`에서 1을 뺀 값이에요. 그 시간에 1000을 곱하면 요금이에요.
  - 3번 줄은 1시간 이하일 때 요금을 돌려주는 문장이에요. 빈칸에도 같은 모양으로, 1시간이 넘을 때의 요금을 계산해 돌려주는 문장을 쓰세요.
explanation: |
  빈칸에는 `return (hours - 1) * 1000;`이 들어가요.

  ```js
  function parkingFee(hours) {
    if (hours <= 1) {
      return 0;
    }
    return (hours - 1) * 1000;
  }
  ```

  빈칸이 비어 있으면 1시간이 넘을 때 `if` 블록을 건너뛰고 함수 끝까지 가는데, 만난 `return`이 없으니 `undefined`를 돌려줘요. `(hours - 1) * 1000;`처럼 계산만 쓰고 `return`을 빠뜨려도 결과는 버려지고 똑같이 `undefined`예요.

  - `console.log((hours - 1) * 1000);`을 넣으면 요금이 콘솔에 보이기만 할 뿐 돌려주지는 않아요.
  - `return hours * 1000 - 1000;`처럼 같은 값을 다르게 계산해도 정답이에요.
  - 모든 갈래에서 `return`을 만나야 함수가 항상 값을 돌려줘요.
origin: authored
