id: js-basics.functions.return-and-side-effects.predict-side-effect-once
type: predict_output
difficulty: 3
concepts:
  - { id: js.fn.side-effects, weight: 1 }
  - { id: js.fn.return, weight: 0.3 }
tags: [side-effects, return, trace]
estimatedSeconds: 100
prompt: |
  주문 번호를 매기는 프로그램이에요. 실행하면 콘솔에 무엇이 출력될까요? `order`를 출력하는 두 줄에서 무슨 일이 일어나는지 잘 생각해 보세요.
spec:
  lang: js
  code: |
    let orderCount = 0;

    function takeOrder(menu) {
      orderCount++;
      console.log("주문 접수: " + menu);
      return orderCount + "번 " + menu;
    }

    const order = takeOrder("떡볶이");
    console.log(order);
    console.log(order);
    console.log(takeOrder("김밥"));
    console.log("받은 주문 수: " + orderCount);
  answerKind: console
  misconceptionByAnswer:
    "주문 접수: 떡볶이\n주문 접수: 떡볶이\n2번 떡볶이\n주문 접수: 떡볶이\n3번 떡볶이\n주문 접수: 김밥\n4번 김밥\n받은 주문 수: 4": js.mc.side-effect-repeats-on-reuse
    "주문 접수: 떡볶이\n1번 떡볶이\n1번 떡볶이\n주문 접수: 김밥\n1번 김밥\n받은 주문 수: 0": js.mc.function-cant-change-outer
hints:
  - 함수가 실행되는 것은 `takeOrder(...)`처럼 괄호를 붙여 호출할 때예요. 이 코드에서 그런 곳은 몇 군데인가요?
  - 9번 줄이 끝났을 때 `order`에는 함수가 담겼나요, 반환값이 담겼나요?
  - "`orderCount`는 바깥 변수예요. 첫 번째 호출에서 바꾼 값이 두 번째 호출 때까지 남아 있는지 생각해 보세요."
explanation: |
  출력은 다음과 같아요.

  ```text
  주문 접수: 떡볶이
  1번 떡볶이
  1번 떡볶이
  주문 접수: 김밥
  2번 김밥
  받은 주문 수: 2
  ```

  - 9번 줄의 `takeOrder("떡볶이")`가 함수를 실행해요. `orderCount`가 1이 되고 `주문 접수: 떡볶이`가 출력되며, 반환값 `"1번 떡볶이"`가 `order`에 담겨요.
  - 10~11번 줄은 `order`에 담긴 문자열을 읽기만 해요. 함수가 다시 실행되지 않으니 `주문 접수`도 나오지 않고 번호도 그대로예요.
  - 12번 줄은 `takeOrder("김밥")`을 **다시 호출**해요. 그래서 이번에는 부수 효과가 또 일어나 `주문 접수: 김밥`이 나오고, `orderCount`가 2가 되어 `2번 김밥`을 돌려받아 출력해요.
  - `orderCount`는 바깥 변수라서 함수가 끝나도 늘린 값이 남아요. 그래서 마지막 줄은 2예요.

  함수는 괄호를 붙여 호출할 때마다 실행되고, 반환값을 담은 변수를 쓰는 것은 값을 읽을 뿐이에요.
