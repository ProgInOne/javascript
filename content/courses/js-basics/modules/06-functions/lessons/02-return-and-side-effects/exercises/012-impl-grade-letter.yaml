misconceptions: [js.mc.return-in-if-covers-all, js.mc.return-is-log]
hints:
  - 먼저 "잘못된 점수"인지부터 검사해 보세요. 걸러 낸 뒤에는 0~100점만 남아요.
  - 등급은 높은 기준부터 차례로 검사하는 `else if` 체인으로 나눌 수 있어요. "이상"은 경계 점수를 포함한다는 것을 비교 연산자로 나타내세요.
  - 모든 조건이 거짓일 때 함수가 어디로 가는지 따라가 보세요. 그 경우에 돌려줄 값이 정해져 있어야 `undefined`가 나오지 않아요.
explanation: |
  예시 정답이에요.

  ```js
  function gradeLetter(score) {
    if (score < 0 || score > 100) {
      return "잘못된 점수";
    }
    if (score >= 90) {
      return "A";
    } else if (score >= 80) {
      return "B";
    } else if (score >= 70) {
      return "C";
    }
    return "F";
  }
  ```

  - **잘못된 점수 먼저 걸러내기**: 첫 `if`의 `return`이 함수를 바로 끝내요. 그래서 그 아래는 0~100점만 생각하면 돼요. 이 검사를 등급 검사 뒤에 두면 101점이 `"A"`가 돼요.
  - **경계 포함**: "90점 이상"은 `>= 90`이에요. `> 90`으로 쓰면 90점이 `"B"`가 돼요.
  - **모든 갈래에서 돌려주기**: 마지막 `return "F";`가 없으면 69점 이하에서 함수가 끝까지 내려가 `undefined`를 돌려줘요. 마지막 갈래는 조건 없는 `else`나 함수 끝 `return`으로 마무리해요.
  - `console.log("A")`처럼 출력하면 화면에는 보이지만 함수의 결과는 `undefined`예요.
origin: authored
review:
