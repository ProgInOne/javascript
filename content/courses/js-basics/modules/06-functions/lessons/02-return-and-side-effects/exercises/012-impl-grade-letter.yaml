id: js-basics.functions.return-and-side-effects.impl-grade-letter
type: implement_function
difficulty: 4
concepts:
  - { id: js.fn.undefined-return, weight: 1 }
  - { id: js.control.else-if, weight: 0.5 }
  - { id: js.ops.logical-and-or-not, weight: 0.3 }
tags: [undefined-return, else-if, boundary, validation, write-code]
estimatedSeconds: 420
prompt: |
  성적표 앱에서 점수를 받아 등급을 돌려주는 함수 `gradeLetter(score)`를 작성하세요.

  - 90점 이상은 `"A"`, 80점 이상은 `"B"`, 70점 이상은 `"C"`, 그보다 낮으면 `"F"`를 돌려줘요.
  - 점수는 0점부터 100점까지만 있어요. 0보다 작거나 100보다 큰 점수가 들어오면 `"잘못된 점수"`를 돌려줘요.
  - **어떤 점수가 들어와도** 문자열 하나를 돌려줘야 해요. `undefined`가 나오는 경우가 있으면 안 돼요.
  - 출력하지 말고 돌려주세요.

  예: `gradeLetter(95)` → `"A"`, `gradeLetter(85)` → `"B"`, `gradeLetter(50)` → `"F"`
spec:
  starter:
    files:
      - path: main.js
        content: |
          function gradeLetter(score) {
            // 여기에 작성하세요
          }

          console.log(gradeLetter(95));
          console.log(gradeLetter(85));
          console.log(gradeLetter(50));
  entry: gradeLetter
  solution:
    files:
      - path: main.js
        content: |
          function gradeLetter(score) {
            if (score < 0 || score > 100) {
              return "잘못된 점수";
            }
            if (score >= 90) {
              return "A";
            } else if (score >= 80) {
              return "B";
            } else if (score >= 70) {
              return "C";
            }
            return "F";
          }

          console.log(gradeLetter(95));
          console.log(gradeLetter(85));
          console.log(gradeLetter(50));
  checks:
