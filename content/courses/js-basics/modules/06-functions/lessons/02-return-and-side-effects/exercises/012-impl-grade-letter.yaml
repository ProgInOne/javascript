      id: a
      description: 95점은 "A"여야 합니다.
      requirement: 등급 나누기
      args: [95]
      expect: { equals: "A" }
    - kind: call
      id: b
      description: 85점은 "B"여야 합니다.
      requirement: 등급 나누기
