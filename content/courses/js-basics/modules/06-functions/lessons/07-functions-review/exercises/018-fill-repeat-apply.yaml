id: js-basics.functions.functions-review.fill-repeat-apply
type: fill_blank
difficulty: 3
concepts:
  - { id: js.fn.callback, weight: 1 }
  - { id: js.fn.arrow, weight: 0.3 }
  - { id: js.loops.for, weight: 0.3 }
tags: [callback, arrow, for, fill, assessment]
estimatedSeconds: 180
usage: assessment
prompt: |
  `repeatApply(value, times, step)`는 `value`에 콜백 `step`을 `times`번 거듭 적용한 결과를 돌려줘요. 앞 회차의 결과가 다음 회차 `step`의 인수가 돼요.

  - 예: `repeatApply(3, 2, (n) => n + 4)`는 3 → 7 → 11이라 `11`을 돌려줘요.

  빈칸 두 개를 채우세요. 첫 번째 빈칸은 콜백으로 이번 회차의 결과를 만드는 식이고, 두 번째 빈칸은 마지막 줄이 `8`을 출력하도록 넘길 **화살표 함수**예요(1을 세 번 거듭해서 8이 되는 규칙).
spec:
  mode: code
  lang: js
  entry: repeatApply
  template: |
    function repeatApply(value, times, step) {
      let result = value;
      for (let i = 0; i < times; i++) {
        result = {{blank:call}};
      }
      return result;
    }

    console.log(repeatApply(1, 3, {{blank:rule}}));
  blanks:
    - id: call
      accept: ["step(result)"]
      width: 16
    - id: rule
      accept: ["(n) => n * 2"]
      width: 16
  checks:
    - kind: console
      id: output
      description: 마지막 줄이 8을 출력해야 합니다.
      requirement: 두 배 규칙 넘기기
      expect:
        lines: ["8"]
    - kind: call
      id: plus-ten
      description: repeatApply(5, 2, (n) => n + 10)은 25를 돌려줘야 합니다.
      requirement: 콜백을 거듭 적용
      argsExpr: "[5, 2, (n) => n + 10]"
      expect: { equals: 25 }
    - kind: call
      id: zero-times
      visible: false
      description: 0번 적용하면 처음 값을 그대로 돌려줘야 합니다.
      requirement: 콜백을 거듭 적용
      argsExpr: "[7, 0, (n) => n * 100]"
      expect: { equals: 7 }
    - kind: call
      id: square-rule
      visible: false
      description: 처음 보는 규칙(제곱)도 앞 회차의 결과에 거듭 적용해야 합니다.
      requirement: 콜백을 거듭 적용
      argsExpr: "[2, 3, (n) => n * n]"
      expect: { equals: 256 }
misconceptions: [js.mc.callback-called-when-passed, js.mc.callback-runs-at-pass-time]
hints:
  - 첫 번째 빈칸에서 할 일은 "콜백 `step`을 불러 이번 결과를 만들기"예요. 콜백에 무엇을 넘겨야 앞 회차의 결과가 이어질까요?
  - "`result * 2`처럼 규칙을 직접 쓰면 다른 콜백으로 부를 때 틀려요. 규칙은 `step`이 정해요."
  - 두 번째 빈칸은 함수 자체를 넘기는 자리예요. 1 → ? → ? → 8이 되려면 매 회차 어떤 계산을 해야 할까요?
explanation: |
  예시 정답이에요.

  ```js
  function repeatApply(value, times, step) {
    let result = value;
    for (let i = 0; i < times; i++) {
      result = step(result);
    }
    return result;
  }

  console.log(repeatApply(1, 3, (n) => n * 2));
  ```

  - `step(result)`는 콜백을 지금 결과로 불러 다음 결과를 받아요. 반환값을 다시 `result`에 넣으므로 다음 회차에는 바뀐 값이 인수가 돼요. `step(value)`로 쓰면 매번 처음 값으로 불러서 거듭 적용되지 않아요(제곱 규칙에서 256 대신 4).
  - `result * 2`처럼 규칙을 직접 쓰면 마지막 줄은 맞아도, `(n) => n + 10` 같은 다른 콜백을 넘긴 호출이 틀려요. `repeatApply`는 반복만 하고, 무엇을 할지는 콜백이 정해요.
  - 1 → 2 → 4 → 8이므로 넘길 규칙은 "두 배"예요. `(n) => n * 2`나 `(n) => n + n`처럼 함수 자체를 넘겨요. 넘길 때는 괄호를 붙여 부르지 않아요. 콜백은 넘기는 순간이 아니라 `repeatApply`가 반복 안에서 부를 때마다 실행돼요.
  - `times`가 0이면 반복이 한 번도 돌지 않아 처음 값이 그대로 반환돼요.
