id: js-basics.functions.functions-review.predict-block-greeting
type: predict_output
difficulty: 3
concepts:
  - { id: js.scope.block, weight: 1 }
  - { id: js.scope.shadowing, weight: 0.3 }
  - { id: js.loops.for, weight: 0.3 }
  - { id: js.types.undefined, weight: 0.3 }
tags: [scope, block, shadowing, loop, assessment]
estimatedSeconds: 130
usage: assessment
prompt: |
  시간마다 인사말을 정하는 프로그램이에요. 반복 본문 안에서 `let greeting;`으로 변수를 만들고, 오전일 때만 값을 넣어요. 실행하면 콘솔에 무엇이 출력될까요? 네 줄을 모두 쓰세요.
spec:
  lang: js
  code: |
    let greeting = "안녕하세요";

    for (let hour = 9; hour <= 15; hour += 3) {
      let greeting;
      if (hour < 12) {
        greeting = "좋은 아침이에요";
      }
      console.log(hour + "시: " + greeting);
    }

    console.log(greeting);
  answerKind: console
  misconceptionByAnswer:
    "9시: 좋은 아침이에요\n12시: undefined\n15시: undefined\n좋은 아침이에요": js.mc.shadow-changes-outer
misconceptions: [js.mc.shadow-changes-outer]
hints:
  - "`hour`는 9, 12, 15를 차례로 거쳐요. 회차마다 `if` 블록이 실행되는지 먼저 정해 보세요."
  - 4번 줄의 `let greeting;`은 몇 번 실행되나요? 값 없이 만든 변수에는 처음에 무엇이 들어 있었는지 떠올려 보세요.
  - 블록이 끝나면 그 안에서 만든 변수는 사라져요. 다음 회차에 앞 회차의 값이 남아 있을까요? 그리고 11번 줄의 `greeting`은 몇 번 줄에서 만든 변수인가요?
explanation: |
  출력은 다음과 같아요.

  ```text
  9시: 좋은 아침이에요
  12시: undefined
  15시: undefined
  안녕하세요
  ```

  - 반복 본문 `{ }`도 블록이에요. 4번 줄의 `let greeting;`은 이 블록 안에서만 쓰는 **새 변수**를 만들고, 바깥 `greeting`을 가려요. 값 없이 만들었으므로 처음 값은 `undefined`예요.
  - 9시: `hour < 12`가 참이라 블록 안의 `greeting`에 `"좋은 아침이에요"`가 들어가요.
  - 회차가 끝나면 블록도 끝나서 그 회차의 `greeting`은 사라져요. 다음 회차에는 4번 줄이 다시 실행되어 `undefined`에서 시작하는 새 변수가 생겨요. 12시와 15시는 `if`에 들어가지 않으므로 `undefined`가 그대로 출력돼요. 앞 회차의 `좋은 아침이에요`는 남아 있지 않아요.
  - 11번 줄은 블록 밖이라 1번 줄의 바깥 `greeting`을 읽어요. 블록 안의 대입은 모두 안쪽 변수에 한 것이라 바깥 값은 처음 그대로 `안녕하세요`예요.

  마지막 줄을 `좋은 아침이에요`로 예상했다면, 안쪽에서 같은 이름으로 만든 변수를 바꾸면 바깥 변수도 바뀐다고 본 거예요. 바깥 값을 바꾸려면 4번 줄의 `let greeting;`을 지우고 바깥 변수에 대입해야 해요.
origin: authored
