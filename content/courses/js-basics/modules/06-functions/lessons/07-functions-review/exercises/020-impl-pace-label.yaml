      id: bike
      description: 10km를 30분에 가면(시속 20) "자전거"입니다.
      requirement: 시속에 따른 이동 방법
      args: [10, 30]
      expect: { equals: "자전거" }
    - kind: call
      id: run
      description: 5km를 30분에 가면(시속 10) "달리기"입니다.
      requirement: 시속에 따른 이동 방법
      args: [5, 30]
      expect: { equals: "달리기" }
    - kind: call
      id: walk
      description: 3km를 60분에 가면(시속 3) "걷기"입니다.
      requirement: 시속에 따른 이동 방법
      args: [3, 60]
      expect: { equals: "걷기" }
    - kind: call
      id: zero-distance
