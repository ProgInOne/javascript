misconceptions: [js.mc.return-is-log, js.mc.return-in-if-covers-all, js.mc.code-after-return-runs]
hints:
  - 먼저 계산할 수 없는 경우를 걸러 내세요. 걸러 낸 뒤에는 나머지 코드가 실행되면 안 돼요.
  - "`return`을 만나면 함수가 바로 끝나요. 이 성질을 쓰면 \"기록 없음\" 뒤에 `else`를 길게 쓰지 않아도 돼요."
  - 시속을 변수에 담은 뒤 빠른 기준부터 차례로 비교하세요. 어느 조건에도 맞지 않을 때도 무언가를 돌려주는지 확인하세요.
explanation: |
  예시 정답이에요.

  ```js
  function paceLabel(distance, minutes) {
    if (distance <= 0 || minutes <= 0) {
      return "기록 없음";
    }
    const speed = distance / minutes * 60;
    if (speed >= 20) {
      return "자전거";
    } else if (speed >= 8) {
      return "달리기";
    }
    return "걷기";
  }
  ```

  - 첫 `if`가 0 이하인 값을 먼저 걸러 내요. `return`을 만나면 함수가 바로 끝나므로 아래의 나누기는 실행되지 않아요. 이 검사가 없으면 `paceLabel(4, 0)`은 `4 / 0 * 60`이 `Infinity`가 되어 `"자전거"`를 돌려줘요.
  - 둘 중 하나만 0 이하여도 기록 없음이므로 `||`로 묶어요. `&&`로 묶으면 둘 다 0 이하일 때만 걸러져요.
  - 빠른 기준(20)부터 비교해야 해요. `speed >= 8`을 먼저 쓰면 시속 20도 `"달리기"`가 돼요. 경계값(정확히 8, 정확히 20)은 `>=`로 포함해요.
  - 마지막 `return "걷기";`가 없으면 느린 기록에서 어느 `return`도 만나지 못해 `undefined`가 돼요. 모든 갈래에서 값을 돌려줘야 해요.
  - `console.log("자전거")`처럼 출력만 하면 반환값은 `undefined`라서 테스트를 통과하지 못해요.
