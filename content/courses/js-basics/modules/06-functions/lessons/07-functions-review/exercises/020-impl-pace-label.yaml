usage: assessment
prompt: |
  운동 기록 앱에서 이동 거리(km)와 걸린 시간(분)으로 이동 방법을 짐작해 돌려주는 함수 `paceLabel(distance, minutes)`를 완성하세요.

  1. `distance`나 `minutes`가 0 이하이면 계산하지 않고 `"기록 없음"`을 돌려줘요.
  1. 그 밖에는 시속(km/h)을 `distance / minutes * 60`으로 구해요.
  1. 시속이 20 이상이면 `"자전거"`, 8 이상이면 `"달리기"`, 그보다 느리면 `"걷기"`를 돌려줘요.

  ```js
  paceLabel(10, 30);  // "자전거" (시속 20)
  paceLabel(5, 30);   // "달리기" (시속 10)
  paceLabel(3, 60);   // "걷기" (시속 3)
  ```

  - 출력이 아니라 **반환**해야 해요. 숨겨진 테스트는 다른 기록과 경계값으로도 확인해요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          function paceLabel(distance, minutes) {
            // 여기에 작성하세요
          }
  entry: paceLabel
  solution:
    files:
      - path: main.js
        content: |
          function paceLabel(distance, minutes) {
            if (distance <= 0 || minutes <= 0) {
              return "기록 없음";
            }
            const speed = distance / minutes * 60;
            if (speed >= 20) {
              return "자전거";
            } else if (speed >= 8) {
              return "달리기";
            }
            return "걷기";
          }
  checks:
