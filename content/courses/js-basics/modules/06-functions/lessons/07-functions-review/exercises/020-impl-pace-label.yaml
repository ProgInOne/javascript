      description: 거리가 0이면 "기록 없음"이어야 합니다.
      requirement: 기록 없음 처리
      args: [0, 25]
      expect: { equals: "기록 없음" }
    - kind: call
      id: zero-minutes
      visible: false
      description: 시간이 0분이면 나누기 전에 "기록 없음"을 돌려줘야 합니다.
      requirement: 기록 없음 처리
      args: [4, 0]
      expect: { equals: "기록 없음" }
    - kind: call
      id: negative-minutes
      visible: false
      description: 시간이 음수여도 "기록 없음"이어야 합니다.
      requirement: 기록 없음 처리
      args: [6, -30]
      expect: { equals: "기록 없음" }
    - kind: call
      id: edge-run
      visible: false
      description: 시속이 정확히 8이면 "달리기"여야 합니다.
      requirement: 경계값
