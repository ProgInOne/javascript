prompt: |
  도시의 섭씨 기온을 화씨로 바꿔 알려 주는 날씨 프로그램이에요. `printReport`는 바꾸는 함수(`convert`)를 콜백으로 받아요. 버그가 **세 군데** 있어요. 모두 고쳐서 아래처럼 출력되게 하세요.

  ```text
  서울 25도 = 화씨 77도
  부산 30도 = 화씨 86도
  ```

  - 화씨는 `섭씨 * 9 / 5 + 32`예요. 계산식과 `printReport`의 출력 문장은 맞게 쓰여 있어요.
  - 하나를 고치면 다른 증상이 나타날 수 있어요. 실행해 보며 차례로 고치세요.
