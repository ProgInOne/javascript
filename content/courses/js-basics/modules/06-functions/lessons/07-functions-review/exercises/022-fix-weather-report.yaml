  solution:
    files:
      - path: main.js
        content: |
          function printReport(city, celsius, convert) {
            console.log(city + " " + celsius + "도 = 화씨 " + convert(celsius) + "도");
          }

          const toFahrenheit = (c) => {
            return c * 9 / 5 + 32;
          };

          printReport("서울", 25, toFahrenheit);
          printReport("부산", 30, toFahrenheit);
  bugDescription: "실행하면 아무것도 출력되지 않고 `ReferenceError: Cannot access 'toFahrenheit' before initialization` 오류가 나요(1번째 줄)."
  bugMisconception: js.mc.expression-hoisted
  checks:
    - kind: console
      id: output
      description: 두 도시의 섭씨·화씨 기온이 차례로 출력되어야 합니다.
      requirement: 두 도시 보고
      expect:
        lines: ["서울 25도 = 화씨 77도", "부산 30도 = 화씨 86도"]
