id: js-basics.functions.functions-review.predict-declared-not-called
type: predict_output
difficulty: 2
concepts:
  - { id: js.fn.declaration, weight: 1 }
  - { id: js.fn.call, weight: 0.3 }
tags: [declaration, call, trace, assessment]
estimatedSeconds: 90
usage: assessment
prompt: |
  화분에 물을 주는 아침 일과 프로그램이에요. 실행하면 콘솔에 무엇이 어떤 순서로 출력될까요? 줄마다 하나씩 쓰세요.
spec:
  lang: js
  code: |
    function waterPlant(name) {
      console.log(name + "에 물 주기");
    }

    function morningRoutine() {
      console.log("창문 열기");
      waterPlant("선인장");
    }

    console.log("아침 시작");
    waterPlant("고무나무");
    console.log("아침 끝");
  answerKind: console
  misconceptionByAnswer:
    "창문 열기\n선인장에 물 주기\n아침 시작\n고무나무에 물 주기\n아침 끝": js.mc.declaration-runs-function
    "아침 시작\n창문 열기\n선인장에 물 주기\n고무나무에 물 주기\n아침 끝": js.mc.declaration-runs-function
misconceptions: [js.mc.declaration-runs-function]
hints:
  - 프로그램은 위에서 아래로 실행되지만, 함수 선언은 함수를 "만들어 두기만" 해요.
  - 이 프로그램에서 괄호를 붙여 **호출**하는 줄을 모두 찾아보세요. 그중 함수 선언 바깥에 있는 줄은 몇 개인가요?
  - "`morningRoutine` 안에도 호출이 있지만, `morningRoutine` 자체는 어디에서 불리나요?"
explanation: |
  출력은 세 줄이에요.

  ```text
  아침 시작
  고무나무에 물 주기
  아침 끝
  ```

  - 1~3번 줄과 5~8번 줄은 함수 선언이에요. 함수를 만들어 두기만 하고 본문은 실행하지 않아요.
  - 실제로 실행되는 것은 10~12번 줄이에요. 11번 줄이 `waterPlant("고무나무")`를 호출해서 `고무나무에 물 주기`가 나와요.
  - `morningRoutine`은 어디에서도 호출되지 않아요. 그래서 그 안의 `창문 열기`와 `waterPlant("선인장")`은 한 번도 실행되지 않아요. 본문 안에 호출이 들어 있어도, 그 본문을 가진 함수가 불려야 실행돼요.

  선언한 순서대로 본문이 실행된다고 생각하면 `창문 열기`, `선인장에 물 주기`가 출력에 들어가요.
