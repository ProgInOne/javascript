id: js-basics.functions.functions-review.multi-which-return-ten
type: mcq_multi
difficulty: 3
concepts:
  - { id: js.fn.return, weight: 1 }
  - { id: js.fn.undefined-return, weight: 0.3 }
tags: [return, undefined, assessment]
estimatedSeconds: 150
usage: assessment
prompt: |
  각 선택지는 함수 `f`를 하나씩 선언한 코드예요. `const r = f(5);`를 실행했을 때 `r`에 **`10`이 들어가는** 것을 모두 고르세요.
spec:
  options:
    - id: a
      text: "`function f(n) { return n * 2; }`"
    - id: b
      text: "`function f(n) { return n + 5; console.log(\"끝\"); }`"
      missedMisconception: js.mc.code-after-return-runs
    - id: c
      text: "`function f(n) { if (n > 3) { return 10; } return 0; }`"
    - id: d
      text: "`function f(n) { console.log(n * 2); }`"
      misconception: js.mc.return-is-log
      rationale: 10을 출력하지만 돌려주지 않아요. return이 없으니 r에는 undefined가 들어가요.
    - id: e
      text: "`function f(n) { return; n * 2; }`"
      misconception: js.mc.code-after-return-runs
      rationale: 값 없는 return;을 만나면 그 자리에서 함수가 끝나요. 뒤의 n * 2는 실행되지 않고 r은 undefined예요.
    - id: f
      text: "`function f(n) { let result = n * 2; }`"
      rationale: 계산한 값을 함수 안의 변수에 담기만 했어요. return이 없으니 r은 undefined예요.
  correct: [a, b, c]
misconceptions: [js.mc.return-is-log, js.mc.code-after-return-runs]
hints:
  - "`r`에 값이 들어가려면 함수가 그 값을 **돌려줘야** 해요. 출력이나 변수에 담기는 돌려주기가 아니에요."
  - "`return`을 만나면 함수는 그 자리에서 끝나요. `return` 뒤에 무엇이 있는지, `return` 옆에 값이 있는지 확인해 보세요."
  - 갈래가 있는 함수는 `n`이 5일 때 어느 `return`을 먼저 만나는지 따라가 보세요.
explanation: |
  `r`이 `10`인 것은 다음 세 개예요.

  - `return n * 2;`: 5 × 2 = 10을 돌려줘요.
  - `return n + 5; console.log("끝");`: 5 + 5 = 10을 돌려주고 함수가 끝나요. `return` 뒤의 `console.log`는 실행되지 않지만, 반환값에는 영향이 없어요.
  - `if (n > 3) { return 10; } return 0;`: 5 > 3이 참이라 `return 10;`을 먼저 만나 10을 돌려주고 끝나요. 아래의 `return 0;`은 실행되지 않아요.

  `undefined`가 되는 것:

  - `console.log(n * 2);`만 있는 함수: 콘솔에 10이 보이지만 돌려주지 않아요. 출력과 반환은 다른 일이에요.
  - `return; n * 2;`: 값 없는 `return;`을 만나 바로 끝나요. 뒤의 계산은 실행되지 않아요.
  - `let result = n * 2;`만 있는 함수: 함수 안의 변수에 담기만 했어요. `result`는 함수가 끝나면 사라지고, 반환값은 `undefined`예요.
origin: authored
