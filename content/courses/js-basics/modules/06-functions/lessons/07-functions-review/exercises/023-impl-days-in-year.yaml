id: js-basics.functions.functions-review.impl-days-in-year
type: implement_function
difficulty: 4
concepts:
  - { id: js.fn.declaration, weight: 1 }
  - { id: js.fn.call, weight: 0.5 }
  - { id: js.fn.return, weight: 0.5 }
  - { id: js.ops.remainder, weight: 0.3 }
  - { id: js.ops.logical-and-or-not, weight: 0.3 }
tags: [declaration, call, return, helper-function, write-code, assessment]
estimatedSeconds: 420
usage: assessment
prompt: |
  달력 앱에 쓸 함수 두 개를 **선언**하세요.

  1. `isLeapYear(year)`: 윤년이면 `true`, 아니면 `false`를 돌려줘요. 윤년 규칙은 이래요.
     - 4로 나누어떨어지면 윤년이에요.
     - 그중 100으로 나누어떨어지는 해는 윤년이 아니에요.
     - 하지만 400으로 나누어떨어지는 해는 다시 윤년이에요.
  1. `daysInYear(year)`: 그해의 날수(윤년이면 `366`, 아니면 `365`)를 돌려줘요. 안에서 `isLeapYear`를 **불러서** 정하세요.

  ```js
  daysInYear(2024);  // 366
  daysInYear(2023);  // 365
  ```

  - 채점은 `daysInYear`를 여러 해로 불러서 해요. 숨겨진 테스트에는 100과 400으로 나누어떨어지는 해도 있어요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          // isLeapYear(year)와 daysInYear(year)를 선언하세요.
  entry: daysInYear
  solution:
    files:
      - path: main.js
        content: |
          function isLeapYear(year) {
            if (year % 400 === 0) {
              return true;
            }
            if (year % 100 === 0) {
              return false;
            }
            return year % 4 === 0;
          }

          function daysInYear(year) {
            if (isLeapYear(year)) {
              return 366;
            }
            return 365;
          }
  checks:
    - kind: call
      id: leap
      description: 2024년은 윤년이라 366일입니다.
      requirement: 4로 나누어떨어지는 해
      args: [2024]
      expect: { equals: 366 }
    - kind: call
      id: common
      description: 2023년은 윤년이 아니라 365일입니다.
      requirement: 4로 나누어떨어지는 해
      args: [2023]
      expect: { equals: 365 }
    - kind: call
      id: century
      visible: false
      description: 100으로 나누어떨어지지만 400으로는 나누어떨어지지 않는 해는 365일이어야 합니다.
      requirement: 100년 규칙
      args: [1900]
      expect: { equals: 365 }
    - kind: call
      id: century-2100
      visible: false
      description: 다른 100년 단위의 해(400의 배수가 아님)도 365일이어야 합니다.
      requirement: 100년 규칙
      args: [2100]
      expect: { equals: 365 }
    - kind: call
      id: four-hundred
      visible: false
      description: 400으로 나누어떨어지는 해는 366일이어야 합니다.
      requirement: 400년 규칙
      args: [2000]
      expect: { equals: 366 }
    - kind: call
      id: other-leap
      visible: false
      description: 처음 보는 윤년(1996년)도 366일이어야 합니다.
      requirement: 4로 나누어떨어지는 해
      args: [1996]
      expect: { equals: 366 }
    - kind: call
      id: other-common
      visible: false
      description: 처음 보는 평년(2030년)도 365일이어야 합니다.
      requirement: 4로 나누어떨어지는 해
      args: [2030]
      expect: { equals: 365 }
misconceptions: [js.mc.declaration-runs-function, js.mc.call-without-parens, js.mc.return-is-log]
hints:
  - "`function 이름(매개변수) { ... }`로 함수 두 개를 따로 선언해요. 두 함수 모두 값을 **돌려줘야** 해요."
  - 윤년 규칙은 예외가 겹쳐 있어요. 가장 좁은 규칙(400)부터 검사하면 `return`으로 하나씩 걸러 낼 수 있어요.
  - "`daysInYear` 안에서는 윤년 규칙을 다시 쓰지 말고, 앞에서 만든 함수를 불러 그 반환값으로 갈래를 나눠요. 함수 이름만 쓰면 부른 것이 아니에요."
explanation: |
  예시 정답이에요.

  ```js
  function isLeapYear(year) {
    if (year % 400 === 0) {
      return true;
    }
    if (year % 100 === 0) {
      return false;
    }
    return year % 4 === 0;
  }

  function daysInYear(year) {
    if (isLeapYear(year)) {
      return 366;
    }
    return 365;
  }
  ```

  - 윤년 규칙은 400 → 100 → 4 순서로 검사하면 간단해요. 400의 배수(2000)는 바로 `true`, 그 밖의 100의 배수(1900, 2100)는 `false`, 나머지는 4의 배수인지가 답이에요. `return year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);`처럼 한 줄로 써도 돼요.
  - 4의 배수만 확인하면 1900과 2100이 366일이 되어 숨겨진 테스트에서 틀려요.
  - `daysInYear`는 `isLeapYear(year)`를 **괄호를 붙여** 불러 그 반환값으로 갈래를 정해요. `if (isLeapYear)`처럼 이름만 쓰면 함수 자체가 truthy라서 늘 366이 돼요.
  - 함수 선언은 프로그램이 시작되기 전에 만들어지므로 두 함수의 순서는 상관없어요. 선언만으로는 본문이 실행되지 않고, 채점이 `daysInYear`를 부를 때 실행돼요.
  - `console.log(366)`처럼 출력만 하면 반환값은 `undefined`예요.
