id: js-basics.functions.functions-review.predict-pick-style
type: predict_output
difficulty: 4
concepts:
  - { id: js.fn.first-class, weight: 1 }
  - { id: js.fn.arrow, weight: 0.3 }
  - { id: js.control.ternary, weight: 0.3 }
  - { id: js.types.typeof, weight: 0.3 }
tags: [first-class, arrow, ternary, typeof, trace, assessment]
estimatedSeconds: 180
usage: assessment
prompt: |
  메시지 말투를 바꾸는 프로그램이에요. 함수를 변수에 담고, 조건에 따라 함수를 골라 쓰기도 해요. 실행하면 콘솔에 무엇이 출력될까요? 네 줄을 모두 쓰세요.
spec:
  lang: js
  code: |
    const loud = (word) => word + "!!!";
    const quiet = (word) => "(" + word + ")";

    let style = loud;
    console.log(style("안녕"));

    style = quiet;
    console.log(style("안녕"));

    const pick = (isNight) => isNight ? quiet : loud;
    console.log(pick(false)("잘 자"));
    console.log(typeof pick(true));
  answerKind: console
  misconceptionByAnswer:
    "안녕!!!\n안녕!!!\n잘 자!!!\nfunction": js.mc.assign-call-result
    "안녕!!!\n(안녕)\n잘 자!!!\nstring": js.mc.assign-call-result
misconceptions: [js.mc.assign-call-result, js.mc.function-not-a-value]
hints:
  - "`style`에는 함수가 담겨요. 7번 줄 뒤에는 어떤 함수가 담겨 있나요?"
  - "`pick`은 문자열이 아니라 함수 `quiet`나 `loud` 자체를 돌려줘요. `pick(false)`가 돌려준 것에 바로 괄호를 붙이면 무슨 일이 일어날까요?"
  - "`pick(true)`의 결과에는 괄호를 한 번 더 붙이지 않았어요. 그 결과는 어떤 자료형인가요?"
explanation: |
  출력은 다음과 같아요.

  ```text
  안녕!!!
  (안녕)
  잘 자!!!
  function
  ```

  - 4~5번 줄: `style`에 함수 `loud` 자체가 담겨요(괄호 없음). `style("안녕")`은 `loud("안녕")`과 같아서 `안녕!!!`이에요.
  - 7~8번 줄: `style`에 다른 함수 `quiet`를 다시 대입했어요. 같은 `style("안녕")`이 이번에는 `(안녕)`이에요. 함수는 값이라 변수에 담고 바꿔 담을 수 있어요.
  - 11번 줄: `pick(false)`는 조건 연산자로 `loud` **함수 자체**를 돌려줘요. 바로 뒤의 `("잘 자")`가 그 함수를 불러서 `잘 자!!!`예요. 왼쪽 호출부터 차례로 실행돼요.
  - 12번 줄: `pick(true)`는 함수 `quiet`를 돌려주고, 여기서는 부르지 않았어요. 함수의 `typeof`는 `function`이에요. 만약 `pick(true)("밤")`처럼 불렀다면 결과는 문자열이었을 거예요.
