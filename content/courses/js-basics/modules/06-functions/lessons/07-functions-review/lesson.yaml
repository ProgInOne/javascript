id: js-basics.functions.functions-review
title: 함수 단원 평가
summary: 모듈 6에서 배운 함수 선언과 호출, 반환값과 부수 효과, 함수 표현식과 화살표 함수, 기본값·나머지 매개변수, 스코프, 콜백을 섞어 풀며 이해도를 확인합니다.
kind: assessment
importance: standard
estimatedMinutes: { read: 2, practice: 45 }
concepts:
  reviewed:
    - js.fn.declaration
    - js.fn.call
    - js.fn.params-args
    - js.fn.return
    - js.fn.side-effects
    - js.fn.undefined-return
    - js.fn.pure
    - js.fn.expression
    - js.fn.arrow
    - js.fn.hoisting
    - js.fn.default-params
    - js.fn.rest-params
    - js.scope.block
    - js.scope.function
    - js.scope.global
    - js.scope.shadowing
    - js.fn.first-class
    - js.fn.callback
objectives:
  - 함수가 언제 호출되고 무엇을 돌려주는지, 실행 뒤 변수에 어떤 값이 남는지 추적해 실행 결과를 예측할 수 있다.
  - 빠진 return, 괄호 실수, 선언 전 호출, 스코프와 섀도잉 때문에 생긴 버그를 찾아 고칠 수 있다.
  - 요구사항을 읽고 매개변수·기본값·나머지 매개변수·콜백을 써서 값을 돌려주는 함수를 작성할 수 있다.
assessment:
  itemCount: 20                    # 평가 개념 18개를 한 문항씩 모두 확인하고 2문항을 더 냄
  passRatio: 0.8
practice:
  targetCount: 27                  # itemCount보다 7문항 많아 다시 응시하면 다른 문항이 섞임
