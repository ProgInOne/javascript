id: js-basics.control.if-else.impl-two-subjects
type: implement_function
difficulty: 2
concepts:
  - { id: js.control.if, weight: 1 }
tags: [if, else, write-code]
estimatedSeconds: 240
prompt: |
  두 과목의 점수로 통과 여부를 출력하는 프로그램을 작성하세요.

  - 점수가 **60점 이상**이면 `통과`, 아니면 `재시험`이에요.
  - 과목마다 `if … else`를 하나씩 써서 판단하세요. 시작 코드의 두 줄은 그대로 두세요.
  - 수학 72점, 과학 48점이면 콘솔에 아래처럼 나와야 해요.

  ```text
  수학: 통과
  과학: 재시험
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const mathScore = 72;
          const scienceScore = 48;

          // 수학 점수로 통과 여부를 출력하세요.

          // 과학 점수로 통과 여부를 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          const mathScore = 72;
          const scienceScore = 48;

          // 수학 점수로 통과 여부를 출력하세요.
          if (mathScore >= 60) {
            console.log("수학: 통과");
          } else {
            console.log("수학: 재시험");
          }
          // 과학 점수로 통과 여부를 출력하세요.
          if (scienceScore >= 60) {
            console.log("과학: 통과");
          } else {
            console.log("과학: 재시험");
          }
  checks:
    - kind: console
      id: output
      description: 수학은 통과, 과학은 재시험이 차례로 출력되어야 합니다.
      requirement: 과목별 결과 출력
      expect:
        lines: ["수학: 통과", "과학: 재시험"]
    - kind: program
      id: no-error
      description: 프로그램이 오류 없이 끝나야 합니다.
      requirement: 오류 없이 실행
      expect:
        noError: true
hints:
  - 과목 하나를 먼저 완성해 보세요. "60점 이상"을 비교식으로 쓰면 어떻게 되나요?
  - "\"이상\"은 기준값을 포함해요. `mathScore >= 60`이 참이면 통과, 거짓이면 재시험이에요."
  - "`if (mathScore >= 60) { ... } else { ... }`를 만든 뒤, 같은 모양으로 과학도 하나 더 쓰세요."
explanation: |
  예시 정답이에요.

  ```js
  if (mathScore >= 60) {
    console.log("수학: 통과");
  } else {
    console.log("수학: 재시험");
  }
  if (scienceScore >= 60) {
    console.log("과학: 통과");
  } else {
    console.log("과학: 재시험");
  }
  ```

  - 두 과목은 서로 관계없이 각각 판단해야 하므로, `if … else`를 **따로** 두 개 써요. 과목마다 if 블록과 else 블록 중 하나만 실행돼서 한 줄씩 나와요.
  - "60점 이상"은 60점을 포함하니 `>=`를 써요. `> 60`으로 쓰면 딱 60점인 학생이 재시험이 돼요.

  `console.log("수학: 통과")`처럼 결과를 직접 써도 이 점수에서는 출력이 같지만, 그러면 점수가 바뀌었을 때 맞지 않아요. 시작 코드의 점수를 바꿔 실행해 보며 조건문이 제대로 판단하는지 확인해 보세요.
origin: authored
