id: js-basics.control.if-else.predict-separate-ifs
type: predict_output
difficulty: 2
concepts:
  - { id: js.control.else-if, weight: 1 }
  - { id: js.control.if, weight: 0.3 }
tags: [if, independent, predict]
estimatedSeconds: 90
prompt: |
  휴대폰 배터리 알림을 정하는 코드예요. 실행하면 콘솔에 무엇이 나올까요? 나오는 줄을 모두 순서대로 쓰세요.
spec:
  lang: js
  code: |
    const battery = 8;
    if (battery <= 20) {
      console.log("배터리가 부족해요");
    }
    if (battery <= 10) {
      console.log("절전 모드를 켰어요");
    }
    if (battery <= 5) {
      console.log("곧 꺼져요");
    }
    console.log("남은 배터리:", battery);
  answerKind: console
  misconceptionByAnswer:
    "배터리가 부족해요\n남은 배터리: 8": js.mc.separate-ifs-like-chain
    "절전 모드를 켰어요\n남은 배터리: 8": js.mc.separate-ifs-like-chain
misconceptions: [js.mc.separate-ifs-like-chain]
hints:
  - 이 코드에는 `else`가 하나도 없어요. 각 `if`는 서로 이어져 있나요?
  - 세 조건 `8 <= 20`, `8 <= 10`, `8 <= 5`를 각각 따로 계산해 보세요.
  - 따로 쓴 `if`는 모두 검사하고, 참인 것은 모두 실행해요. 마지막 줄은 항상 실행돼요.
explanation: |
  ```text
  배터리가 부족해요
  절전 모드를 켰어요
  남은 배터리: 8
  ```

  | 줄 | 조건 | 결과 |
  |---|---|---|
  | 2 | `8 <= 20` | `true` → `배터리가 부족해요` |
  | 5 | `8 <= 10` | `true` → `절전 모드를 켰어요` |
  | 8 | `8 <= 5` | `false` → 건너뜀 |

  `else`가 없는 `if` 세 개는 서로 독립된 문장이라 하나씩 모두 검사해요. 참인 조건이 둘이라 두 알림이 모두 나왔어요.

  이 경우에는 이 동작이 원하는 것이에요. 배터리가 8%면 "부족" 알림과 "절전 모드" 알림이 둘 다 필요하니까요. 상황에 맞는 것을 **모두** 실행하려면 `if`를 따로, **하나만** 고르려면 `else if` 체인을 써요.
origin: authored
