id: js-basics.control.if-else.we-else-if-1
type: fill_blank
difficulty: 2
usage: worked_example
workedExampleStage: 1
concepts:
  - { id: js.control.else-if, weight: 1 }
  - { id: js.ops.relational, weight: 0.3 }
tags: [else-if, worked-example, fill]
estimatedSeconds: 100
prompt: |
  **일부 빈칸을 채우는 단계예요.** 앞 단계의 미세먼지 풀이에서 농도만 120으로 바꿨어요. 세 번째 갈래("나쁨")의 조건이 비어 있어요.

  빈칸을 채워 아래처럼 출력되게 하세요. 등급 기준은 앞 단계와 같아요(30 이하 좋음, 80 이하 보통, 150 이하 나쁨, 그보다 크면 매우 나쁨).

  ```text
  나쁨
  확인 끝
  ```
spec:
  mode: code
  lang: js
  template: |
    const dust = 120; // 오늘의 미세먼지 농도

    if (dust <= 30) {
      // 1. 가장 좁은 범위부터 검사
      console.log("좋음");
    } else if (dust <= 80) {
      // 2. 여기까지 왔다면 30보다 커요
      console.log("보통");
    } else if ({{blank:cond}}) {
      // 3. 여기까지 왔다면 80보다 커요
      console.log("나쁨");
    } else {
      // 4. 앞의 조건이 모두 거짓일 때
      console.log("매우 나쁨");
    }

    // 5. 체인이 끝나면 다음 줄로
    console.log("확인 끝");
  blanks:
    - id: cond
      accept: ["dust <= 150", "dust < 151", "150 >= dust"]
      width: 14
  checks:
    - kind: console
      id: output
      description: 등급 "나쁨"과 "확인 끝"이 차례로 출력되어야 합니다.
      requirement: 등급 출력
      expect:
        lines: ["나쁨", "확인 끝"]
misconceptions: [js.mc.else-if-runs-all]
hints:
  - 앞 단계 풀이의 세 번째 갈래 조건을 떠올려 보세요.
  - 이 갈래에 도착했다면 이미 80보다 크다는 것이 확인됐어요. 남은 것은 "150 이하인가?"예요.
  - "빈칸에는 `dust <= 150`을 써요. `120 <= 150`은 참이라 \"나쁨\"이 출력되고 나머지 갈래는 건너뛰어요."
explanation: |
  예시 정답은 `dust <= 150`이에요.

  - 앞 단계 풀이와 같은 체인이에요. `120 <= 30`, `120 <= 80`이 차례로 거짓이라 세 번째 갈래까지 내려와요.
  - 여기에 도착했다는 것은 이미 80보다 크다는 뜻이라, `dust > 80 && dust <= 150`처럼 다시 쓰지 않고 `dust <= 150`만 확인해도 돼요. 체인의 순서가 앞의 범위를 걸러 주기 때문이에요.
  - `120 <= 150`이 참이라 `"나쁨"`을 출력하고 `else`는 건너뛰어요.

  다음 단계에서는 새 상황에서 이런 체인을 처음부터 써 봐요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
