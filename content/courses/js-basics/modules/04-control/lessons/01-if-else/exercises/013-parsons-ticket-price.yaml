id: js-basics.control.if-else.parsons-ticket-price
type: parsons
difficulty: 3
concepts:
  - { id: js.control.else-if, weight: 1 }
  - { id: js.control.if, weight: 0.3 }
tags: [else-if, chain, parsons]
estimatedSeconds: 150
prompt: |
  박물관 입장료를 안내하는 프로그램이에요. 요금 규칙은 다음과 같아요.

  - 8세 미만: `무료`
  - 65세 이상: `경로 우대: 1000원`
  - 그 밖의 나이: `일반: 3000원`

  코드 조각을 순서대로 배열해 **하나의** `if … else if … else` 체인을 만드세요. 들여쓰기도 맞춰야 해요. 70세 손님이면 `경로 우대: 1000원` 한 줄만 나와야 해요.
spec:
  lines:
    - { id: l1, code: "const age = 70;" }
    - { id: l2, code: "if (age < 8) {" }
    - { id: l3, code: 'console.log("무료");', indent: 1 }
    - { id: l4, code: "} else if (age >= 65) {" }
    - { id: l5, code: 'console.log("경로 우대: 1000원");', indent: 1 }
    - { id: l6, code: "} else {" }
    - { id: l7, code: 'console.log("일반: 3000원");', indent: 1 }
    - { id: l8, code: "}" }
  distractors:
    - { id: d1, code: "} else (age >= 65) {", misconception: js.mc.else-has-condition }
    - { id: d2, code: "if (age >= 65) {", misconception: js.mc.separate-ifs-like-chain }
  gradeIndent: true
misconceptions: [js.mc.else-has-condition, js.mc.separate-ifs-like-chain]
hints:
  - 맨 위에는 나이를 정하는 줄이 오고, 체인은 `if`로 시작해서 `else`로 끝나요.
  - 체인의 두 번째 갈래는 조건이 필요해요. `else` 뒤에 바로 조건 괄호를 쓸 수 있을까요? 그리고 `}` 없이 새 `if`를 시작하면 하나의 체인이 될까요?
  - "조건이 있는 두 번째 갈래는 `} else if (...) {` 모양이에요. 각 `console.log` 줄은 자기 갈래 안으로 한 칸 들여 써요."
explanation: |
  정답 순서는 다음과 같아요.

  ```js
  const age = 70;
  if (age < 8) {
    console.log("무료");
  } else if (age >= 65) {
    console.log("경로 우대: 1000원");
  } else {
    console.log("일반: 3000원");
  }
  ```

  - `} else (age >= 65) {`: `else`는 조건을 받지 않아요. 이 줄을 쓰면 `SyntaxError`가 나요.
  - `if (age >= 65) {`: 앞의 체인에 이어지지 않고 새 조건문을 시작하는 줄이에요. 이 조각을 쓰면 앞 `if` 블록을 닫는 `}`가 없어 중괄호 짝이 맞지 않아요. 블록을 닫고 `if`를 따로 쓰더라도 앞의 `if`와는 독립된 조건문이 되어, 마지막 `else`는 이 `if`에만 짝지어져요. 그러면 5세 손님에게 `무료`와 `일반: 3000원`이 둘 다 나오는 버그가 생겨요.

  `age`를 3, 30, 70으로 바꿔 실행해 보며 갈래마다 한 줄씩만 나오는지 확인해 보세요.
