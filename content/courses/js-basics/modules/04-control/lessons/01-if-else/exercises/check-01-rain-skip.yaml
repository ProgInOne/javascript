id: js-basics.control.if-else.check-rain-skip
type: predict_output
difficulty: 1
usage: check
concepts:
  - { id: js.control.if, weight: 1 }
tags: [if, false-condition]
estimatedSeconds: 60
prompt: |
  다음 프로그램을 실행하면 콘솔에 무엇이 출력되나요? 나오는 줄을 모두 순서대로 쓰세요. 아무것도 나오지 않으면 빈칸으로 두세요.
spec:
  lang: js
  code: |
    let isRaining = false;
    if (isRaining) {
      console.log("우산을 챙겨요");
    }
    isRaining = true;
    console.log("버스를 타요");
  answerKind: console
  misconceptionByAnswer:
    "": js.mc.false-if-stops-program
misconceptions: [js.mc.false-if-stops-program]
hints:
  - 문장은 위에서 아래로 한 번씩 실행돼요. 2번 줄에 도착했을 때 `isRaining`의 값은 무엇인가요?
  - 조건은 `if` 줄에 도착한 그 순간에 한 번만 확인해요. 5번 줄에서 값이 바뀌면 위의 `if`로 돌아갈까요?
  - 조건이 거짓이면 블록만 건너뛰고, 조건문 다음 문장은 항상 실행돼요.
explanation: |
  정답은 `버스를 타요` 한 줄이에요.

  - 2번 줄에 도착한 순간 `isRaining`은 `false`라서 2~4번 줄의 블록을 건너뛰어요.
  - 5번 줄에서 `isRaining`이 `true`로 바뀌지만, 실행은 위로 돌아가지 않아요. 조건은 `if` 줄을 지날 때 한 번만 확인해요.
  - 6번 줄은 조건문 다음 문장이라 항상 실행돼요.

  `우산을 챙겨요`도 나온다고 답했다면, 변수가 바뀌면 조건을 다시 확인한다고 생각한 거예요. 이미 지나간 `if`는 다시 실행되지 않아요.

  아무것도 나오지 않는다고 답했다면, 조건이 거짓일 때 프로그램이 멈춘다고 생각한 거예요. 거짓이면 블록만 건너뛰고 다음 문장으로 이어져요.
