id: js-basics.control.if-else.fix-password-check
type: fix_bug
difficulty: 3
concepts:
  - { id: js.control.if, weight: 1 }
  - { id: js.values.assignment, weight: 0.3 }
tags: [if, assignment, condition, debugging]
estimatedSeconds: 180
prompt: |
  도어락 프로그램이에요. 저장된 비밀번호는 `"7429"`이고, 방금 누른 번호(`entered`)는 `"1234"`예요.

  번호가 틀렸으니 아래처럼 나와야 하는데, 실행하면 문이 열렸다고 나와요. 버그를 고치세요.

  ```text
  비밀번호가 틀렸어요
  누른 번호: 1234
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          const savedCode = "7429";
          let entered = "1234";

          if (entered = savedCode) {
            console.log("문이 열렸어요");
          } else {
            console.log("비밀번호가 틀렸어요");
          }
          console.log("누른 번호:", entered);
  solution:
    files:
      - path: main.js
        content: |
          const savedCode = "7429";
          let entered = "1234";

          if (entered === savedCode) {
            console.log("문이 열렸어요");
          } else {
            console.log("비밀번호가 틀렸어요");
          }
          console.log("누른 번호:", entered);
  bugDescription: 틀린 번호를 눌렀는데 "문이 열렸어요"가 나오고, 누른 번호도 1234가 아니라 7429로 바뀌어 출력돼요.
  bugMisconception: js.mc.assign-as-compare
  maxEditDistance: 4
  checks:
    - kind: console
      id: output
      description: 틀린 번호이므로 "비밀번호가 틀렸어요"와 누른 번호 1234가 출력되어야 합니다.
      requirement: 틀린 번호 안내
      expect:
        lines: ["비밀번호가 틀렸어요", "누른 번호: 1234"]
    - kind: program
      id: entered-unchanged
      description: 확인하는 동안 누른 번호 entered가 바뀌면 안 됩니다.
      requirement: 누른 번호 유지
      expect:
        globals:
          entered: { equals: "1234" }
        noError: true
      misconceptionIfFail: js.mc.assign-as-compare
misconceptions: [js.mc.assign-as-compare]
hints:
  - 누른 번호가 7429로 바뀌어 출력됐어요. 프로그램 어디에서 `entered`에 값이 들어갔을까요?
  - "4번 줄 조건 안의 `=`는 비교가 아니라 대입이에요. 대입한 값 \"7429\"는 조건에서 참으로 판단돼요."
  - 두 값이 같은지 비교하는 연산자로 바꾸세요. 등호가 세 개예요.
explanation: |
  원인은 4번 줄의 `entered = savedCode`예요. `=`는 대입이라서 두 가지 일이 함께 일어났어요.

  1. `entered`에 `savedCode`의 값 `"7429"`가 들어가요. 그래서 마지막 줄에 `누른 번호: 7429`가 나왔어요.
  1. 대입식의 값 `"7429"`는 비어 있지 않은 문자열이라 참으로 판단돼요. 그래서 누른 번호와 상관없이 항상 "문이 열렸어요"가 나왔어요.

  `entered === savedCode`로 고치면 두 값을 비교만 하고, `"1234" === "7429"`는 `false`라서 else 블록이 실행돼요.

  `entered`를 `const`로 만들었다면 4번 줄에서 `TypeError: Assignment to constant variable.`이 나서 바로 알아챘을 거예요. 바뀌지 않을 값은 `const`로 만들면 이런 실수를 일찍 발견할 수 있어요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
