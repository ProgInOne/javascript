id: js-basics.control.if-else.predict-first-true-only
type: predict_output
difficulty: 2
concepts:
  - { id: js.control.else-if, weight: 1 }
tags: [else-if, chain, predict]
estimatedSeconds: 80
prompt: |
  편의점 포인트 등급을 정하는 코드예요. 실행하면 콘솔에 무엇이 나올까요? 나오는 줄을 모두 순서대로 쓰세요.
spec:
  lang: js
  code: |
    const points = 1200;
    if (points >= 1000) {
      console.log("골드");
    } else if (points >= 500) {
      console.log("실버");
    } else if (points >= 100) {
      console.log("브론즈");
    } else {
      console.log("일반");
    }
    console.log("등급 확인 완료");
  answerKind: console
  misconceptionByAnswer:
    "골드\n실버\n브론즈\n등급 확인 완료": js.mc.else-if-runs-all
    "골드\n실버\n브론즈\n일반\n등급 확인 완료": js.mc.else-if-runs-all
    "브론즈\n등급 확인 완료": js.mc.else-if-order-irrelevant
misconceptions: [js.mc.else-if-runs-all]
hints:
  - 1200점이면 세 조건 `>= 1000`, `>= 500`, `>= 100`이 각각 참인지 따져 보세요.
  - 세 조건이 모두 참이에요. 체인에서는 참인 갈래를 몇 개 실행하나요?
  - 처음으로 참인 갈래 하나만 실행하고 빠져나가요. 그다음은 체인 아래의 문장이에요.
explanation: |
  ```text
  골드
  등급 확인 완료
  ```

  | 순서 | 조건 | 결과 | 일어나는 일 |
  |---|---|---|---|
  | 1 | `1200 >= 1000` | `true` | `골드` 출력, 체인을 빠져나감 |
  | 2 | `1200 >= 500` | 검사 안 함 | |
  | 3 | `1200 >= 100` | 검사 안 함 | |

  1200점은 세 조건을 모두 만족하지만, 체인은 **처음으로 참인 갈래 하나만** 실행해요. 그래서 `실버`와 `브론즈`는 나오지 않아요. 그다음 체인 밖의 `등급 확인 완료`가 나와요.

  조건을 큰 기준(1000)부터 적었기 때문에, 각 갈래가 정확한 범위를 맡게 돼요. 예를 들어 `실버` 갈래에 도착했다면 이미 1000 미만이라는 뜻이에요.
