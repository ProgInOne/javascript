id: js-basics.control.if-else.check-no-braces-hat
type: predict_output
difficulty: 2
usage: check
concepts:
  - { id: js.control.block, weight: 1 }
tags: [block, braces, indent]
estimatedSeconds: 70
prompt: |
  중괄호 없이 쓴 조건문이에요. 실행하면 콘솔에 무엇이 출력되나요?
spec:
  lang: js
  code: |
    let stars = 5;
    const isBonus = false;
    if (isBonus)
      stars = stars + 10;
      stars = stars * 2;
    console.log(stars);
  answerKind: console
  misconceptionByAnswer:
    "5": js.mc.indent-makes-block
misconceptions: [js.mc.indent-makes-block]
hints:
  - "`isBonus`의 값은 무엇인가요? 조건이 거짓이면 어느 문장을 건너뛰나요?"
  - 중괄호가 없으면 조건에 딸리는 문장은 바로 다음 한 문장뿐이에요.
  - 들여쓰기는 실행에 영향을 주지 않아요. 5번 줄은 조건과 관계없이 실행될까요?
explanation: |
  정답은 `10`이에요.

  - `isBonus`는 `false`라서 조건에 딸린 4번 줄 `stars = stars + 10;`만 건너뛰어요.
  - 중괄호가 없으면 조건에 딸리는 것은 바로 다음 한 문장뿐이에요. 5번 줄은 들여 썼어도 조건문 밖의 문장이라 항상 실행돼요. 그래서 `stars`는 `5 * 2`인 `10`이 돼요.
  - 6번 줄이 `10`을 출력해요.

  `5`라고 답했다면 들여쓰기가 블록을 만든다고 생각한 거예요. 두 줄을 묶으려면 중괄호 `{ }`를 써야 해요.
origin: authored
