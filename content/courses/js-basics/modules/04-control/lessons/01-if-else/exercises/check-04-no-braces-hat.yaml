id: js-basics.control.if-else.check-no-braces-hat
type: predict_output
difficulty: 2
usage: check
concepts:
  - { id: js.control.block, weight: 1 }
tags: [block, braces, indent]
estimatedSeconds: 70
prompt: |
  중괄호 없이 쓴 조건문이에요. 실행하면 콘솔에 무엇이 출력되나요? 나오는 줄을 모두 순서대로 쓰세요.
spec:
  lang: js
  code: |
    const isSunny = true;
    if (!isSunny)
      console.log("우산 챙기기");
      console.log("모자 챙기기");
    console.log("출발");
  answerKind: console
  misconceptionByAnswer:
    "출발": js.mc.indent-makes-block
misconceptions: [js.mc.indent-makes-block]
hints:
  - "`!isSunny`의 값은 무엇인가요?"
  - 중괄호가 없으면 조건에 딸리는 문장은 바로 다음 한 문장뿐이에요.
  - 들여쓰기는 실행에 영향을 주지 않아요. 4번 줄은 조건과 관계없이 실행될까요?
explanation: |
  정답은 다음 두 줄이에요.

  ```text
  모자 챙기기
  출발
  ```

  - `!isSunny`는 `false`라서 조건에 딸린 3번 줄 `우산 챙기기`만 건너뛰어요.
  - 중괄호가 없으면 조건에 딸리는 것은 바로 다음 한 문장뿐이에요. 4번 줄은 들여 썼어도 조건문 밖의 문장이라 항상 실행돼요.
  - 5번 줄도 실행돼요.

  `출발`만 나온다고 답했다면 들여쓰기가 블록을 만든다고 생각한 거예요. 두 줄을 묶으려면 중괄호 `{ }`를 써야 해요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
