id: js-basics.control.if-else.predict-if-else-coins
type: predict_output
difficulty: 1
concepts:
  - { id: js.control.if, weight: 1 }
tags: [if, else, predict]
estimatedSeconds: 50
prompt: |
  다음 코드를 실행하면 콘솔에 무엇이 나올까요? 나오는 줄을 모두 순서대로 쓰세요.
spec:
  lang: js
  code: |
    const coins = 3;
    if (coins >= 5) {
      console.log("뽑기를 2번 할 수 있어요");
    } else {
      console.log("뽑기를 1번 할 수 있어요");
    }
    console.log("남은 동전:", coins);
  answerKind: console
  misconceptionByAnswer:
    "남은 동전: 3": js.mc.false-if-stops-program
    "뽑기를 1번 할 수 있어요": js.mc.false-if-stops-program
    "뽑기를 2번 할 수 있어요\n뽑기를 1번 할 수 있어요\n남은 동전: 3": js.mc.else-if-runs-all
misconceptions: [js.mc.false-if-stops-program]
hints:
  - 2번 줄의 조건 `coins >= 5`는 true인가요, false인가요?
  - 조건이 거짓이면 if 블록과 else 블록 중 어느 쪽을 실행하나요?
  - else 블록을 실행한 뒤에는 조건문 다음 줄(7번 줄)도 실행돼요.
explanation: |
  ```text
  뽑기를 1번 할 수 있어요
  남은 동전: 3
  ```

  - 2번 줄: `3 >= 5`는 `false`라서 if 블록(3번 줄)을 건너뛰어요.
  - 4~5번 줄: 조건이 거짓이니 else 블록을 실행해요.
  - 7번 줄: 조건문이 끝난 다음 문장이라 조건과 상관없이 실행돼요.

  if 블록과 else 블록 중 **정확히 하나만** 실행되고, 조건문 뒤의 문장은 항상 실행돼요.
origin: authored
