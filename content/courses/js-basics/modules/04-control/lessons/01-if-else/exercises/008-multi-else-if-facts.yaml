id: js-basics.control.if-else.multi-else-if-facts
type: mcq_multi
difficulty: 2
concepts:
  - { id: js.control.else-if, weight: 1 }
tags: [else-if, chain]
estimatedSeconds: 70
prompt: |
  `if … else if … else if … else`로 이어진 체인 하나에 대한 설명으로 옳은 것을 모두 고르세요.
spec:
  options:
    - id: a
      text: 조건을 위에서부터 차례로 검사한다
    - id: b
      text: 처음으로 참인 조건의 블록 하나만 실행하고 체인을 빠져나간다
      missedMisconception: js.mc.else-if-runs-all
    - id: c
      text: 모든 조건이 거짓이면 마지막 else 블록을 실행한다
    - id: d
      text: 조건이 참인 갈래가 여러 개면 그 블록들을 모두 차례로 실행한다
      misconception: js.mc.else-if-runs-all
      rationale: 처음 참인 갈래를 실행하면 체인을 빠져나가서, 아래 조건은 검사하지도 않아요.
    - id: e
      text: 조건을 어떤 순서로 적어도 실행 결과는 같다
      misconception: js.mc.else-if-order-irrelevant
      rationale: 처음 참인 갈래만 실행되므로, 넓은 조건을 앞에 두면 뒤 갈래가 가려져요.
  correct: [a, b, c]
misconceptions: [js.mc.else-if-runs-all, js.mc.else-if-order-irrelevant]
hints:
  - 레슨의 등급 예제에서 85점일 때 어떤 조건까지 검사했는지 떠올려 보세요.
  - "`85 >= 70`도 참이었는데 `C`가 나왔나요?"
  - 처음 참인 갈래만 실행된다면, 조건의 순서를 바꿨을 때 결과가 달라질 수 있을까요?
explanation: |
  정답은 **a, b, c**예요.

  - a: 체인은 맨 위 `if`부터 아래로 내려가며 조건을 검사해요.
  - b: 처음으로 참인 조건을 만나면 그 블록만 실행하고 체인을 빠져나가요. 아래 조건은 검사하지 않아요.
  - c: 모든 조건이 거짓이면 마지막 `else`를 실행해요. `else`가 없으면 아무 블록도 실행하지 않아요.
  - d (오답): 참인 조건이 여러 개여도 가장 위의 하나만 실행돼요. 참인 것을 모두 실행하려면 체인 대신 `if`를 따로따로 써야 해요.
  - e (오답): 순서가 결과를 바꿔요. `score >= 60`을 `score >= 90`보다 먼저 쓰면 95점도 앞 갈래에 걸려서 "90점 이상" 갈래는 영영 실행되지 않아요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
