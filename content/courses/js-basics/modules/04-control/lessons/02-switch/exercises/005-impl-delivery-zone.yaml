id: js-basics.control.switch.impl-delivery-zone
type: implement_function
difficulty: 2
concepts:
  - { id: js.control.switch, weight: 1 }
tags: [switch, default, write-code]
estimatedSeconds: 240
prompt: |
  배송 구역 코드로 도착 예정일을 안내하는 프로그램을 작성하세요.

  | 구역 코드 | 안내 |
  |---|---|
  | `"A"` | `내일 도착` |
  | `"B"` | `2일 후 도착` |
  | `"C"` | `3일 후 도착` |
  | 그 밖의 코드 | `배송할 수 없는 지역이에요` |

  - 두 주문에 대해 `switch`를 하나씩 써서 안내하세요. 시작 코드의 두 줄은 그대로 두세요.
  - 구역이 `"B"`, `"Z"`이면 콘솔에 아래처럼 나와야 해요.

  ```text
  첫 번째 주문: 2일 후 도착
  두 번째 주문: 배송할 수 없는 지역이에요
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const firstZone = "B";
          const secondZone = "Z";

          // 첫 번째 주문의 안내를 출력하세요.

          // 두 번째 주문의 안내를 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          const firstZone = "B";
          const secondZone = "Z";

          // 첫 번째 주문의 안내를 출력하세요.
          switch (firstZone) {
            case "A":
              console.log("첫 번째 주문: 내일 도착");
              break;
            case "B":
              console.log("첫 번째 주문: 2일 후 도착");
              break;
            case "C":
              console.log("첫 번째 주문: 3일 후 도착");
              break;
            default:
              console.log("첫 번째 주문: 배송할 수 없는 지역이에요");
          }
          // 두 번째 주문의 안내를 출력하세요.
          switch (secondZone) {
            case "A":
              console.log("두 번째 주문: 내일 도착");
              break;
            case "B":
              console.log("두 번째 주문: 2일 후 도착");
              break;
            case "C":
              console.log("두 번째 주문: 3일 후 도착");
              break;
            default:
              console.log("두 번째 주문: 배송할 수 없는 지역이에요");
          }
  checks:
    - kind: console
      id: output
      description: 두 주문의 안내가 한 줄씩 차례로 출력되어야 합니다. 주문마다 한 줄만 나와야 합니다.
      requirement: 도착 안내 출력
      expect:
        lines: ["첫 번째 주문: 2일 후 도착", "두 번째 주문: 배송할 수 없는 지역이에요"]
      misconceptionIfFail: js.mc.switch-no-break-stops
    - kind: program
      id: no-error
      description: 프로그램이 오류 없이 끝나야 합니다.
      requirement: 오류 없이 실행
      expect:
        noError: true
misconceptions: [js.mc.switch-no-break-stops]
hints:
  - "`switch (firstZone) { ... }` 안에 구역 코드마다 `case \"A\":`처럼 case를 하나씩 만들어요. 그 밖의 코드는 무엇으로 받나요?"
  - 구역 코드는 문자열이라 case에도 따옴표를 붙여요. 각 case의 끝에는 무엇이 있어야 한 줄만 나올까요?
  - "case 하나는 `case \"B\":` → `console.log(...)` → `break;` 세 줄이에요. 마지막에 `default:`를 두고, 같은 모양으로 두 번째 주문도 써요."
explanation: |
  한 주문의 switch는 이렇게 써요.

  ```js
  switch (firstZone) {
    case "A":
      console.log("첫 번째 주문: 내일 도착");
      break;
    case "B":
      console.log("첫 번째 주문: 2일 후 도착");
      break;
    case "C":
      console.log("첫 번째 주문: 3일 후 도착");
      break;
    default:
      console.log("첫 번째 주문: 배송할 수 없는 지역이에요");
  }
  ```

  - 구역 코드는 문자열이라 `case "B":`처럼 따옴표를 붙여요. `case B:`라고 쓰면 `B`라는 변수를 찾다가 `ReferenceError`가 나요.
  - case마다 `break;`가 있어야 그 아래 case로 흘러가지 않아요. break를 빼면 `"B"`일 때 `3일 후 도착`과 default 안내까지 나와요.
  - 표에 없는 코드(`"Z"`)는 `default`가 받아요.

  모듈 5에서 반복문을 배우면, 같은 switch를 두 번 쓰지 않고 여러 주문을 차례로 처리할 수 있어요.
