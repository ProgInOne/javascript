id: js-basics.control.switch.predict-missing-break
type: predict_output
difficulty: 2
concepts:
  - { id: js.control.fallthrough, weight: 1 }
tags: [switch, break, fallthrough, predict]
estimatedSeconds: 80
prompt: |
  게임 캐릭터가 레벨에 따라 받는 보상을 출력하는 코드예요. 실행하면 콘솔에 무엇이 나올까요? 나오는 줄을 모두 순서대로 쓰세요.
spec:
  lang: js
  code: |
    const level = 2;
    switch (level) {
      case 1:
        console.log("나무 칼");
        break;
      case 2:
        console.log("철 방패");
      case 3:
        console.log("마법 물약");
        break;
      case 4:
        console.log("황금 갑옷");
    }
    console.log("보상 지급 끝");
  answerKind: console
  misconceptionByAnswer:
    "철 방패\n보상 지급 끝": js.mc.switch-no-break-stops
    "철 방패\n마법 물약\n황금 갑옷\n보상 지급 끝": js.mc.switch-no-break-stops
misconceptions: [js.mc.switch-no-break-stops]
hints:
  - 실행은 어느 case에서 시작하나요?
  - "`case 2:`의 코드 끝에 break가 있나요? 없다면 어디까지 이어서 실행될까요?"
  - 흘러내리다가 `break`를 만나면 switch를 빠져나가요. 그다음은 switch 아래의 문장이에요.
explanation: |
  ```text
  철 방패
  마법 물약
  보상 지급 끝
  ```

  - `level`이 2라서 `case 2:`에서 실행을 시작해 `철 방패`를 출력해요.
  - `case 2:`에는 break가 없어서, `case 3:`의 값은 비교하지 않고 그 아래 `마법 물약`도 출력해요.
  - `case 3:`의 끝에 있는 `break`를 만나 switch를 빠져나가요. 그래서 `황금 갑옷`은 나오지 않아요.
  - switch 다음 문장인 `보상 지급 끝`이 나와요.

  break가 없으면 **다음 break나 switch의 끝까지** 흘러가요. 끝까지 모두 실행되는 것도, 맞는 case만 실행되는 것도 아니에요.
