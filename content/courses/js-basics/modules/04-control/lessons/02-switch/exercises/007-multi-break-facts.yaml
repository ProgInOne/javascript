id: js-basics.control.switch.multi-break-facts
type: mcq_multi
difficulty: 1
concepts:
  - { id: js.control.fallthrough, weight: 1 }
  - { id: js.control.switch, weight: 0.3 }
tags: [switch, break, fallthrough]
estimatedSeconds: 60
prompt: |
  `switch` 문의 `break`에 대한 설명으로 옳은 것을 모두 고르세요.
spec:
  options:
    - id: a
      text: break를 만나면 switch 전체를 빠져나간다
    - id: b
      text: case 끝에 break가 없으면 아래 case의 코드까지 이어서 실행된다
      missedMisconception: js.mc.switch-no-break-stops
    - id: c
      text: 여러 case가 같은 일을 할 때는 일부러 break를 빼서 case를 묶을 수 있다
    - id: d
      text: break가 없어도 아래 case에 도착하면 값을 다시 비교해서 다르면 건너뛴다
      misconception: js.mc.switch-no-break-stops
      rationale: 실행이 시작된 뒤에는 아래 case의 값을 비교하지 않고 코드를 계속 실행해요.
    - id: e
      text: break는 맞는 case를 찾을 때까지 위의 case들을 건너뛰게 하는 표시다
      rationale: 맞는 case를 찾는 것은 switch가 비교로 하는 일이에요. break는 실행을 멈추고 빠져나가는 표시예요.
  correct: [a, b, c]
misconceptions: [js.mc.switch-no-break-stops]
hints:
  - 레슨의 쿠폰 예제에서 break가 없을 때 몇 줄이 나왔는지 떠올려 보세요.
  - case는 실행의 입구일까요, 출구일까요? 그렇다면 출구 역할은 무엇이 할까요?
  - "`case \"토\": case \"일\":`처럼 case를 묶을 수 있었던 것은 무엇이 없기 때문이었나요?"
explanation: |
  정답은 **a, b, c**예요.

  - a: `break`는 switch를 빠져나가는 출구예요.
  - b: case는 실행을 **시작**하는 입구일 뿐이라, break가 없으면 아래 case의 코드까지 흘러가요(fall-through).
  - c: fall-through를 이용하면 `case "토": case "일":`처럼 여러 값을 한 묶음으로 처리할 수 있어요.
  - d (오답): 한 번 실행이 시작되면 아래 case의 값은 다시 비교하지 않아요. 그래서 break를 빠뜨리면 상관없는 case의 코드까지 실행돼요.
  - e (오답): 맞는 case를 찾는 일은 switch가 값을 비교해서 해요. break와 관계없어요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
