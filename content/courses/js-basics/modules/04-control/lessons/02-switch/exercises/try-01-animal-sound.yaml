id: js-basics.control.switch.try-animal-sound
type: implement_function
difficulty: 2
usage: try
concepts:
  - { id: js.control.switch, weight: 1 }
  - { id: js.control.fallthrough, weight: 0.3 }
tags: [switch, break, default, write-code]
estimatedSeconds: 240
prompt: |
  동물 이름에 따라 울음소리를 고르는 `switch`를 직접 써 보세요.

  | `animal` | `sound`에 넣을 값 |
  |---|---|
  | `"강아지"` | `"멍멍"` |
  | `"고양이"` | `"야옹"` |
  | `"오리"` | `"꽥꽥"` |
  | 그 밖의 동물 | `"???"` |

  시작 코드의 `animal`은 `"고양이"`예요. 실행하면 콘솔에 `고양이: 야옹`이 나와야 해요. 다 쓰면 `animal`을 다른 동물로 바꿔서도 실행해 보세요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          const animal = "고양이";
          let sound = "";

          // switch로 animal을 비교해서 sound에 울음소리를 넣으세요.
          // case마다 break를 잊지 마세요. 표에 없는 동물은 default에서 처리해요.

          console.log(animal + ": " + sound);
  solution:
    files:
      - path: main.js
        content: |
          const animal = "고양이";
          let sound = "";

          // switch로 animal을 비교해서 sound에 울음소리를 넣으세요.
          // case마다 break를 잊지 마세요. 표에 없는 동물은 default에서 처리해요.
          switch (animal) {
            case "강아지":
              sound = "멍멍";
              break;
            case "고양이":
              sound = "야옹";
              break;
            case "오리":
              sound = "꽥꽥";
              break;
            default:
              sound = "???";
          }

          console.log(animal + ": " + sound);
  checks:
    - kind: program
      id: sound-value
      description: "`animal`이 `\"고양이\"`이면 `sound`에 `\"야옹\"`이 들어 있어야 합니다. 다른 값이 들어 있다면 `case \"고양이\":` 끝에 break가 있는지 확인해 보세요."
      requirement: 고양이 울음소리 고르기
      expect:
        globals:
          sound: { equals: "야옹" }
        noError: true
      misconceptionIfFail: js.mc.switch-no-break-stops
    - kind: console
      id: output
      description: "콘솔에 `고양이: 야옹` 한 줄이 출력되어야 합니다."
      requirement: 결과 출력
      expect:
        lines: ["고양이: 야옹"]
misconceptions: [js.mc.switch-no-break-stops]
hints:
  - "`switch (animal) { ... }` 안에 `case \"강아지\":`처럼 표의 동물마다 case를 하나씩 써요."
  - 각 case에서는 `sound = "멍멍";`처럼 대입하고, 그 아래에 `break;`를 써요. 표에 없는 동물은 `default:`에서 `"???"`를 넣어요.
  - "`case \"고양이\":` 다음 줄은 `sound = \"야옹\";`, 그다음 줄은 `break;`예요. break가 없으면 아래 case의 대입까지 실행돼서 `sound`가 덮어써져요."
explanation: |
  예시 답안은 다음과 같아요.

  ```js
  switch (animal) {
    case "강아지":
      sound = "멍멍";
      break;
    case "고양이":
      sound = "야옹";
      break;
    case "오리":
      sound = "꽥꽥";
      break;
    default:
      sound = "???";
  }
  ```

  - switch는 `animal`과 case 옆의 값을 `===`로 비교해서 같은 case부터 실행해요.
  - `break`가 없으면 아래 case의 대입까지 실행돼서, 고양이인데 `sound`가 `"꽥꽥"`이나 `"???"`로 덮어써져요.
  - 각 case에서는 대입만 하고 출력은 switch 뒤에서 한 번만 하니, 출력 모양을 바꿀 때 한 곳만 고치면 돼요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
