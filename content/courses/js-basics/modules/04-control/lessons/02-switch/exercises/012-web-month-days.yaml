id: js-basics.control.switch.web-month-days
type: web_task
difficulty: 4
concepts:
  - { id: js.control.fallthrough, weight: 1 }
  - { id: js.control.switch, weight: 0.5 }
tags: [switch, fallthrough, grouping, web]
estimatedSeconds: 480
prompt: |
  달력 앱의 "이번 달은 며칠까지?" 기능을 완성하세요. 목록에서 달을 고르면 그달의 날 수가 나와야 해요.

  | 달 | 날 수 |
  |---|---|
  | 1, 3, 5, 7, 8, 10, 12월 | 31일 |
  | 4, 6, 9, 11월 | 30일 |
  | 2월 | 28일 (윤년은 생각하지 않아요) |

  - 시작 코드에서 달을 고를 때마다 `{ }` 안의 코드가 실행되도록 이미 연결해 두었어요(화면을 다루는 방법은 모듈 10에서 배워요). 고른 달은 숫자로 바뀌어 `month`에 들어 있어요.
  - 표시한 자리에 `switch`를 써서 `days`에 날 수를 넣으세요. 같은 날 수인 달은 **case를 묶어서** 쓰세요.
  - 화면에는 `3월은 31일까지 있어요`처럼 나와요. 나머지 코드는 그대로 두세요.
