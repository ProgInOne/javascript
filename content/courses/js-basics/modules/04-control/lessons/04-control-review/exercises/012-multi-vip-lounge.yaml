id: js-basics.control.control-review.multi-vip-lounge
type: mcq_multi
difficulty: 3
concepts:
  - { id: js.control.if, weight: 1 }
  - { id: js.ops.strict-equality, weight: 0.5 }
tags: [if, assignment, trace]
estimatedSeconds: 150
usage: assessment
prompt: |
  공항 라운지 입장을 안내하는 코드예요. 실행 결과에 대한 설명으로 옳은 것을 모두 고르세요.
code: |
  const points = 4200;
  let isVip = false;
  if (points >= 5000) {
    isVip = true;
    console.log("VIP 승급");
  }
  if (isVip = true) {
    console.log("라운지 입장 가능");
  } else {
    console.log("일반 대기실로 가세요");
  }
  console.log("안내 끝");
spec:
  options:
    - id: a
      text: "`VIP 승급`은 출력되지 않는다"
    - id: b
      text: "`라운지 입장 가능`이 출력된다"
      missedMisconception: js.mc.assign-as-compare
    - id: c
      text: "`안내 끝`이 출력된다"
      missedMisconception: js.mc.false-if-stops-program
    - id: d
      text: 첫 번째 if의 조건이 거짓이라 프로그램이 거기서 멈추고, 그 아래 줄은 하나도 실행되지 않는다
      misconception: js.mc.false-if-stops-program
      rationale: 조건이 거짓이면 그 블록만 건너뛰고 다음 문장으로 넘어가요.
    - id: e
      text: "두 번째 if는 `isVip`가 `true`인지 비교하므로 `일반 대기실로 가세요`가 출력된다"
      misconception: js.mc.assign-as-compare
      rationale: 조건 안의 =도 대입이에요. isVip에 true를 넣고, 그 값 true로 판단해요.
    - id: f
      text: "프로그램이 끝난 뒤 `isVip`에는 `false`가 들어 있다"
      misconception: js.mc.assign-as-compare
      rationale: 두 번째 if의 조건에서 isVip에 true가 대입돼요.
  correct: [a, b, c]
hints:
  - 위에서부터 한 줄씩 실행하며 `isVip`의 값과 출력되는 줄을 적어 보세요.
  - "`4200 >= 5000`이 거짓이면 첫 번째 if 블록만 건너뛰어요. 그다음에는 어디로 가나요?"
  - 두 번째 if의 괄호 안에 있는 것은 `===`일까요, `=`일까요? `=`는 어디에 쓰든 같은 일을 해요.
explanation: |
  정답은 "`VIP 승급`은 출력되지 않는다", "`라운지 입장 가능`이 출력된다", "`안내 끝`이 출력된다" 세 개예요. 실제 출력은 이래요.

  ```text
  라운지 입장 가능
  안내 끝
  ```

  1. `4200 >= 5000`은 거짓이라 첫 번째 if 블록을 건너뛰어요. `VIP 승급`은 나오지 않고 `isVip`는 아직 `false`예요.
  1. 두 번째 if의 `isVip = true`는 비교가 아니라 **대입**이에요. `isVip`에 `true`를 넣고, 대입한 값 `true`가 조건이 되므로 `라운지 입장 가능`이 나와요. 포인트가 부족한데도 입장이 허락되는 버그예요. 비교하려면 `isVip === true`나 그냥 `isVip`를 써요.
  1. 조건문이 끝나면 다음 문장으로 넘어가 `안내 끝`이 나와요.

  - "프로그램이 거기서 멈춘다": 조건이 거짓이면 그 블록만 건너뛸 뿐, 프로그램은 계속 실행돼요.
  - "`일반 대기실로 가세요`가 출력된다": 조건 안의 `=`도 대입이라, 원래 값과 상관없이 `true`가 되어 if 블록이 실행돼요.
  - "`isVip`에는 `false`가 들어 있다": 두 번째 if의 조건에서 `true`가 대입되었으므로 끝난 뒤 `isVip`는 `true`예요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
