id: js-basics.control.control-review.tf-if-string-zero
type: true_false
difficulty: 2
concepts:
  - { id: js.control.if, weight: 1 }
  - { id: js.conv.truthy-falsy, weight: 0.5 }
tags: [if, truthy-falsy, review]
estimatedSeconds: 60
usage: assessment
prompt: |
  다음 설명이 맞는지 고르고, 그렇게 판단한 이유도 고르세요.
code: |
  const couponCode = "0";
  if (couponCode) {
    console.log("쿠폰을 확인합니다");
  }
  console.log("주문 완료");
spec:
  statement: "`couponCode`에 문자열 `\"0\"`이 들어 있으므로 if 블록은 실행되지 않고, 콘솔에는 `주문 완료`만 나온다."
  answer: false
  misconceptionIfWrong: js.mc.string-zero-falsy
  requireReason: true
  reasons:
    - id: r1
      text: if는 조건 값을 참·거짓으로 바꿔 판단하는데, 글자가 하나라도 있는 문자열 "0"은 truthy라서 블록이 실행된다
      correct: true
    - id: r2
      text: 문자열 "0"은 숫자 0으로 바뀌어 falsy가 되므로 블록을 건너뛴다
      misconception: js.mc.string-zero-falsy
    - id: r3
      text: if의 조건 자리에는 true나 false만 올 수 있어서, 문자열이 오면 블록을 건너뛴다
    - id: r4
      text: 조건이 문자열이면 if 블록과 그 아래 문장을 모두 건너뛰어 아무것도 나오지 않는다
      misconception: js.mc.false-if-stops-program
misconceptions: [js.mc.string-zero-falsy, js.mc.false-if-stops-program]
hints:
  - if의 조건 자리에 불리언이 아닌 값이 오면, 그 값을 참·거짓 중 무엇으로 취급하는지 떠올려 보세요.
  - "falsy인 값은 `false`, `0`, `\"\"`, `null`, `undefined`, `NaN`뿐이에요. `\"0\"`은 숫자일까요, 문자열일까요?"
  - "`\"0\"`은 글자 하나가 들어 있는 문자열이에요. 빈 문자열 `\"\"`만 falsy예요."
explanation: |
  **틀린 설명이에요.** 콘솔에는 두 줄이 나와요.

  ```text
  쿠폰을 확인합니다
  주문 완료
  ```

  if는 조건 자리의 값을 참·거짓으로 바꿔서 판단해요. `"0"`은 숫자 0이 아니라 글자 `0` 하나가 들어 있는 **문자열**이라 truthy예요. 그래서 블록이 실행돼요.

  - "숫자 0으로 바뀌어 falsy가 된다": if는 숫자로 바꾸지 않고 참·거짓으로 바꿔요. 문자열 중 falsy는 빈 문자열 `""`뿐이에요.
  - "조건 자리에는 true나 false만 올 수 있다": 어떤 값이든 쓸 수 있어요. truthy이면 참, falsy이면 거짓으로 취급해요.
  - "아래 문장까지 모두 건너뛴다": 조건이 거짓이어도 건너뛰는 것은 그 블록뿐이고, `주문 완료`는 언제나 출력돼요.

  입력창에서 읽은 값은 문자열이라 `"0"`처럼 보여도 truthy예요. 숫자 0인지 확인하려면 `Number(couponCode) === 0`처럼 바꾼 뒤 비교해요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
