prompt: |
  영화관 매표 프로그램을 작성하세요. 요금 규칙은 이래요.

  1. **요일별 기본 요금**: 토·일은 15000원, 화요일은 "문화의 날"이라 7000원, 그 밖의 요일(월·수·목·금)은 12000원
  1. **나이 할인**: 13세 미만은 4000원, 65세 이상은 5000원을 기본 요금에서 빼요. 단, **화요일에는 나이 할인을 하지 않아요.**
  1. **적립**: 회원이면 `500점`, 회원이 아니면 `없음`

  두 손님의 결제 금액을 계산해 `priceA`, `priceB`에 넣고, 적립 안내와 함께 출력하세요. 요일별 기본 요금은 `switch`로 정하세요. 시작 코드의 변수 선언은 그대로 두세요. 지금 값이면 콘솔에 아래처럼 나와야 해요.

  ```text
  A 결제: 10000
  A 적립: 없음
  B 결제: 7000
  B 적립: 500점
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const dayA = "일";
          const ageA = 70;
          const memberA = false;

          const dayB = "화";
          const ageB = 10;
          const memberB = true;

          // A의 결제 금액(priceA)과 적립을 계산해 출력하세요.

          // B의 결제 금액(priceB)과 적립을 계산해 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          const dayA = "일";
          const ageA = 70;
          const memberA = false;

          const dayB = "화";
          const ageB = 10;
          const memberB = true;

          // A의 결제 금액(priceA)과 적립을 계산해 출력하세요.
          let priceA = 0;
          switch (dayA) {
            case "토":
            case "일":
              priceA = 15000;
              break;
            case "화":
              priceA = 7000;
              break;
            default:
              priceA = 12000;
          }
          if (dayA !== "화") {
            if (ageA < 13) {
              priceA = priceA - 4000;
            } else if (ageA >= 65) {
              priceA = priceA - 5000;
            }
          }
          console.log("A 결제:", priceA);
          console.log("A 적립:", memberA ? "500점" : "없음");

          // B의 결제 금액(priceB)과 적립을 계산해 출력하세요.
          let priceB = 0;
          switch (dayB) {
            case "토":
            case "일":
              priceB = 15000;
              break;
            case "화":
              priceB = 7000;
              break;
            default:
              priceB = 12000;
          }
          if (dayB !== "화") {
            if (ageB < 13) {
              priceB = priceB - 4000;
            } else if (ageB >= 65) {
              priceB = priceB - 5000;
            }
          }
          console.log("B 결제:", priceB);
          console.log("B 적립:", memberB ? "500점" : "없음");
  checks:
    - kind: console
      id: output
      description: 두 손님의 결제 금액과 적립 안내가 차례로 출력되어야 합니다.
      requirement: 결제 안내 출력
      expect:
        lines: ["A 결제: 10000", "A 적립: 없음", "B 결제: 7000", "B 적립: 500점"]
    - kind: program
      id: prices
      visible: false
      description: priceA, priceB 변수에 요일·나이 규칙을 모두 적용한 결제 금액이 들어 있어야 합니다.
      requirement: 결제 안내 출력
      expect:
        globals:
          priceA: { equals: 10000 }
          priceB: { equals: 7000 }
        noError: true
hints:
  - 한 손님에 대해 할 일을 순서대로 나눠 보세요. 기본 요금 정하기 → 나이 할인 빼기 → 출력하기예요. 결제 금액 변수는 switch와 if 블록 밖에서도 써야 해요.
  - 토요일과 일요일은 같은 요금이에요. 여러 값이 같은 일을 할 때 `case`를 어떻게 쓰는지, 그리고 각 요금 갈래 끝에 무엇이 필요한지 떠올려 보세요.
  - 나이 할인은 "화요일이 아닐 때"만 해요. 그 조건의 블록 안에 나이를 확인하는 `if … else if`를 넣을 수 있어요. 13세 미만과 65세 이상은 겹치지 않아요.
explanation: |
  한 손님의 계산은 이렇게 쓸 수 있어요.

  ```js
  let priceA = 0;
  switch (dayA) {
    case "토":
    case "일":
      priceA = 15000;
      break;
    case "화":
      priceA = 7000;
      break;
    default:
      priceA = 12000;
  }
  if (dayA !== "화") {
    if (ageA < 13) {
      priceA = priceA - 4000;
    } else if (ageA >= 65) {
      priceA = priceA - 5000;
    }
  }
  console.log("A 결제:", priceA);
  console.log("A 적립:", memberA ? "500점" : "없음");
  ```

  - **변수 위치**: `priceA`는 switch와 if 블록 밖에서 출력해야 하므로 블록 바깥에서 `let`으로 먼저 만들고, 블록 안에서는 대입만 해요. 블록 안에서 `let priceA = …`로 만들면 블록 밖에서 `ReferenceError`가 나요.
  - **switch**: 토·일은 `case "토":` 바로 아래에 `case "일":`을 이어 써서 같은 줄을 실행해요(일부러 쓴 fall-through). 요금을 정한 갈래 끝에는 `break`가 있어야 아래 갈래의 요금으로 덮어쓰이지 않아요. 월·수·목·금은 `default`가 맡아요.
  - **화요일 예외**: 나이 할인을 `if (dayA !== "화") { … }` 블록 안에 넣어요. 이 블록이 없으면 B(화요일, 10세)도 4000원이 빠져 3000원이 되어 실패해요.
  - **나이 할인**: `ageA < 13`과 `ageA >= 65`는 겹치지 않으므로 순서는 상관없고, 둘 다 아니면 할인 없이 그대로예요. A는 70세라 15000 − 5000 = 10000원이에요.
  - **적립**: 두 값 중 하나를 골라 바로 출력하므로 조건 연산자가 알맞아요.

  나이 할인을 `if (dayA !== "화" && ageA < 13)`처럼 `&&`로 묶어 써도, 출력과 결제 금액 변수가 맞으면 정답이에요.
