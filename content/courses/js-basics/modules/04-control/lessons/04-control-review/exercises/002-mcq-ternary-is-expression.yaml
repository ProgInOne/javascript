id: js-basics.control.control-review.mcq-ternary-is-expression
type: mcq_single
difficulty: 1
concepts:
  - { id: js.control.ternary, weight: 1 }
tags: [ternary]
estimatedSeconds: 50
usage: assessment
prompt: |
  조건 연산자(`조건 ? 값1 : 값2`)에 대한 설명으로 옳은 것은 무엇인가요?
spec:
  options:
    - id: a
      text: 값 하나를 만들어 내는 식이라서, 결과를 변수에 넣거나 console.log의 괄호 안에 바로 쓸 수 있다
    - id: b
      text: "`?`와 `:` 뒤에는 `const` 선언 같은 문장도 넣을 수 있어서, if-else를 그대로 줄여 쓸 수 있다"
      misconception: js.mc.ternary-as-statement
      rationale: "`?`와 `:` 뒤에는 값(식)만 와요. 선언을 넣으면 SyntaxError예요."
    - id: c
      text: 조건 연산자만 한 줄 써 두면 고른 값이 자동으로 콘솔에 출력된다
      misconception: js.mc.ternary-result-discarded
      rationale: 고른 값은 대입하거나 넘기지 않으면 바로 버려져요.
    - id: d
      text: 우선순위가 아주 높아서, 앞에 있는 `+`보다 먼저 계산된다
      misconception: js.mc.ternary-precedence
      rationale: 조건 연산자는 우선순위가 아주 낮아서 `+`가 먼저 계산돼요.
  correct: a
hints:
  - 조건 연산자는 "문장"일까요, "값을 만드는 식"일까요?
  - 식이 만든 값은 누군가 받아 주지 않으면 어디에도 남지 않아요.
  - 다른 연산자와 섞어 쓸 때 괄호를 감싸라고 배운 이유를 떠올려 보세요. 조건 연산자는 늦게 계산될까요, 먼저 계산될까요?
explanation: |
  정답은 "값 하나를 만들어 내는 식이라서, 결과를 변수에 넣거나 console.log의 괄호 안에 바로 쓸 수 있다"예요. `const ticket = age >= 13 ? "청소년" : "어린이";`나 `console.log(isOpen ? "영업 중" : "준비 중");`처럼 써요.

  - "`const` 선언 같은 문장도 넣을 수 있다": `?`와 `:` 뒤에는 값(식)만 와요. `ok ? const a = 1 : const a = 2;`는 `SyntaxError`예요. 실행할 일을 고르려면 if-else를 써요.
  - "한 줄 써 두면 자동으로 출력된다": `stock > 0 ? "판매 중" : "품절";`은 값을 만들기만 하고 버려요. 아무것도 출력되지 않아요.
  - "우선순위가 아주 높다": 반대예요. 우선순위가 아주 낮아서 `"결과: " + ok ? "예" : "아니요"`는 `"결과: " + ok`가 먼저 계산돼요. 그래서 다른 식 안에서는 괄호로 감싸요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
