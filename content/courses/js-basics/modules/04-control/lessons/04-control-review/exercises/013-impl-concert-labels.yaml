id: js-basics.control.control-review.impl-concert-labels
type: implement_function
difficulty: 2
concepts:
  - { id: js.control.ternary, weight: 1 }
  - { id: js.conv.plus-concat, weight: 0.3 }
tags: [ternary, write-code]
estimatedSeconds: 240
usage: assessment
prompt: |
  공연 예매 앱의 안내 문구 세 개를 만드는 프로그램을 작성하세요.

  - `statusA`: A 공연의 남은 좌석(`seatsA`)이 0보다 많으면 `"<남은 좌석 수>석 남음"`(예: `"12석 남음"`), 아니면 `"매진"`
  - `statusB`: B 공연의 남은 좌석(`seatsB`)으로 같은 규칙
  - `button`: 회원(`isMember`가 `true`)이면 `"선예매 신청"`, 아니면 `"회원 가입하기"`

  세 변수는 각각 **조건 연산자** 하나로 값을 정해 `const`로 만들고, 아래처럼 출력하세요. 시작 코드의 세 줄은 그대로 두세요.

  ```text
  A 공연: 매진
  B 공연: 35석 남음
  버튼: 선예매 신청
  ```
spec:
  starter:
    files:
      - path: main.js
        content: |
          const seatsA = 0;
          const seatsB = 35;
          const isMember = true;

          // statusA, statusB, button을 조건 연산자로 만들고 출력하세요.
  solution:
    files:
      - path: main.js
        content: |
          const seatsA = 0;
          const seatsB = 35;
          const isMember = true;

          // statusA, statusB, button을 조건 연산자로 만들고 출력하세요.
          const statusA = seatsA > 0 ? seatsA + "석 남음" : "매진";
          const statusB = seatsB > 0 ? seatsB + "석 남음" : "매진";
          const button = isMember ? "선예매 신청" : "회원 가입하기";
          console.log("A 공연:", statusA);
          console.log("B 공연:", statusB);
          console.log("버튼:", button);
  checks:
    - kind: console
      id: output
      description: 두 공연의 좌석 안내와 버튼 문구가 차례로 출력되어야 합니다.
      requirement: 안내 문구 출력
      expect:
        lines: ["A 공연: 매진", "B 공연: 35석 남음", "버튼: 선예매 신청"]
    - kind: program
      id: values
      description: statusA, statusB, button 변수에 규칙에 맞는 문구가 들어 있어야 합니다.
      requirement: 세 변수의 값
      expect:
        globals:
          statusA: { equals: "매진" }
          statusB: { equals: "35석 남음" }
          button: { equals: "선예매 신청" }
        noError: true
hints:
  - '조건 연산자는 `조건 ? 참일 때 값 : 거짓일 때 값` 모양이에요. 각 변수에 들어갈 두 값과 조건을 먼저 정해 보세요.'
  - 좌석 안내의 "참일 때 값"은 숫자와 글자를 이어 붙인 문자열이에요. `+`로 만들 수 있어요.
  - "`isMember`는 이미 `true`/`false`라서 비교 없이 그대로 조건 자리에 쓸 수 있어요."
explanation: |
  세 변수는 이렇게 만들 수 있어요.

  ```js
  const statusA = seatsA > 0 ? seatsA + "석 남음" : "매진";
  const statusB = seatsB > 0 ? seatsB + "석 남음" : "매진";
  const button = isMember ? "선예매 신청" : "회원 가입하기";
  ```

  - `seatsA`는 0이라 `0 > 0`이 거짓이고, `:` 뒤의 `"매진"`이 `statusA`에 들어가요.
  - `seatsB`는 35라 조건이 참이고, `35 + "석 남음"`은 문자열 이어 붙이기라 `"35석 남음"`이 돼요.
  - `isMember`는 `true`라 `"선예매 신청"`이 골라져요.

  조건 연산자가 만든 값을 `const`로 받아야 나중에 출력할 수 있어요. 값을 받지 않고 `seatsA > 0 ? … : "매진";`만 쓰면 만든 값이 바로 버려져요. `console.log("A 공연:", statusA)`처럼 쉼표로 넘기면 사이에 공백이 하나 들어가요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
