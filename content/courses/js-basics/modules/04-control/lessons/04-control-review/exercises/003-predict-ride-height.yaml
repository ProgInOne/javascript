id: js-basics.control.control-review.predict-ride-height
type: predict_output
difficulty: 2
concepts:
  - { id: js.control.else-if, weight: 1 }
  - { id: js.ops.logical-and-or-not, weight: 0.3 }
tags: [else-if, logical]
estimatedSeconds: 90
usage: assessment
prompt: |
  놀이기구 탑승 안내 코드예요. 실행하면 콘솔에 무엇이 나올까요? 나오는 줄을 모두 순서대로 쓰세요.
spec:
  lang: js
  code: |
    const height = 125;
    const withParent = true;
    if (height >= 140) {
      console.log("혼자 탈 수 있어요");
    } else if (height >= 120 && withParent) {
      console.log("보호자와 함께 탈 수 있어요");
    } else if (height >= 120) {
      console.log("보호자가 있어야 탈 수 있어요");
    } else {
      console.log("키가 더 자라면 와요");
    }
    console.log("안전바를 확인하세요");
  answerKind: console
  misconceptionByAnswer:
    "보호자와 함께 탈 수 있어요\n보호자가 있어야 탈 수 있어요\n안전바를 확인하세요": js.mc.else-if-runs-all
    "보호자와 함께 탈 수 있어요\n보호자가 있어야 탈 수 있어요\n키가 더 자라면 와요\n안전바를 확인하세요": js.mc.else-if-runs-all
    "보호자와 함께 탈 수 있어요": js.mc.false-if-stops-program
hints:
  - 조건을 위에서부터 하나씩 계산해 보세요. 처음으로 참이 되는 조건은 몇 번째인가요?
  - 체인에서 한 갈래를 실행하고 나면 아래 `else if`의 조건은 검사할까요?
  - 마지막 `console.log`는 체인 밖에 있어요. 체인이 끝난 뒤에 무슨 일이 일어날까요?
explanation: |
  콘솔에는 두 줄이 나와요.

  ```text
  보호자와 함께 탈 수 있어요
  안전바를 확인하세요
  ```

  1. `125 >= 140`은 거짓이라 첫 갈래는 건너뛰어요.
  1. `125 >= 120 && true`는 참이라 `보호자와 함께 탈 수 있어요`를 출력하고 **체인을 빠져나가요.**
  1. 세 번째 조건 `height >= 120`도 참이지만, 체인은 처음으로 참인 갈래 하나만 실행하므로 검사하지도 않아요.
  1. 마지막 `console.log`는 체인 밖에 있어서 어느 갈래를 실행했든 항상 실행돼요.

  참인 조건이 여러 개라고 해서 그 블록이 모두 실행되지는 않아요. 그렇게 동작하게 하려면 `else` 없이 `if`를 따로따로 써야 해요.
origin: authored
