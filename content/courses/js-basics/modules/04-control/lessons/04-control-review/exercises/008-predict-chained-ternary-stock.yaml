id: js-basics.control.control-review.predict-chained-ternary-stock
type: predict_output
difficulty: 2
concepts:
  - { id: js.control.ternary, weight: 1 }
  - { id: js.conv.plus-concat, weight: 0.3 }
tags: [ternary, chained]
estimatedSeconds: 90
usage: assessment
prompt: |
  한정판 운동화의 구매 버튼 문구를 정하는 코드예요. 실행하면 콘솔에 무엇이 나올까요? 나오는 줄을 모두 순서대로 쓰세요.
spec:
  lang: js
  code: |
    const stock = 0;
    const waiting = 2;
    const button = stock > 0 ? "바로 구매" : waiting > 0 ? "대기 " + waiting + "명" : "알림 신청";
    console.log(button);
    console.log(stock > 0 ? "재고 있음" : "재고 없음");
  answerKind: console
hints:
  - '이어 쓴 조건 연산자는 뒤쪽부터 묶여요. `stock > 0 ? "바로 구매" : ( … )`처럼 괄호를 쳐서 읽어 보세요.'
  - "`stock > 0`이 거짓이면 `:` 뒤의 식 전체가 값이 돼요. 그 식 안에서도 다시 조건을 확인해요."
  - "`\"대기 \" + waiting + \"명\"`은 문자열 이어 붙이기예요. 숫자 2가 글자로 붙어요."
explanation: |
  콘솔에는 두 줄이 나와요.

  ```text
  대기 2명
  재고 없음
  ```

  - 세 번째 줄은 `stock > 0 ? "바로 구매" : (waiting > 0 ? "대기 " + waiting + "명" : "알림 신청")`으로 읽혀요. `0 > 0`은 거짓이라 `:` 뒤의 식으로 가고, `2 > 0`은 참이라 `"대기 " + 2 + "명"`, 곧 `"대기 2명"`이 `button`에 들어가요. `else if` 체인과 같은 방식이에요.
  - 다섯 번째 줄은 조건 연산자가 만든 값을 바로 `console.log`에 넘겨요. `0 > 0`이 거짓이라 `재고 없음`이 나와요.

  `stock`이 `0`이라 `stock > 0`은 두 번 모두 거짓이에요. 첫 번째 조건만 보고 `바로 구매`를 고르면 안 돼요.
