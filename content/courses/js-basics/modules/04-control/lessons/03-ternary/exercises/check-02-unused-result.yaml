id: js-basics.control.ternary.check-unused-result
type: mcq_single
difficulty: 2
usage: check
concepts:
  - { id: js.control.ternary, weight: 1 }
tags: [ternary, expression]
estimatedSeconds: 60
prompt: |
  다음 코드를 실행하면 콘솔에 무엇이 나오나요?
code: |
  const online = true;
  let message = "대기";
  online ? "접속 중" : "자리 비움";
  console.log(message);
spec:
  options:
    - id: a
      text: '`대기`'
    - id: b
      text: '`접속 중`'
      misconception: js.mc.ternary-result-discarded
      rationale: 3번 줄은 `"접속 중"`이라는 값을 만들기만 하고 아무 데도 넣지 않아요. `message`는 그대로예요.
    - id: c
      text: '`true`'
      rationale: 출력하는 것은 `message`예요. `online`의 값이 출력되지 않아요.
    - id: d
      text: 결과를 받는 변수가 없어서 SyntaxError가 난다
      rationale: 값만 있는 문장도 올바른 문법이에요. 오류 없이 값이 버려질 뿐이에요.
  correct: a
misconceptions: [js.mc.ternary-result-discarded]
hints:
  - 4번 줄이 출력하는 변수는 무엇인가요? 그 변수에 마지막으로 대입한 곳을 찾아보세요.
  - 3번 줄의 조건 연산자는 값을 하나 만들어요. 그 값을 받는 `=`가 있나요?
  - 받는 곳이 없으면 고른 값은 바로 버려져요. `message`는 처음 값 그대로예요.
explanation: |
  정답은 `대기`예요.

  3번 줄의 조건 연산자는 `online`이 참이라 `"접속 중"`이라는 값을 만들어요. 하지만 그 값을 대입하거나 출력하는 곳이 없어서 바로 버려지고, 오류도 나지 않아요. `message`는 2번 줄에서 넣은 `"대기"` 그대로예요.

  고른 값을 쓰려면 `message = online ? "접속 중" : "자리 비움";`처럼 받아야 해요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
