id: js-basics.control.ternary.check-empty-nickname
type: predict_output
difficulty: 2
usage: check
concepts:
  - { id: js.control.ternary, weight: 1 }
tags: [ternary, truthy-falsy]
estimatedSeconds: 60
prompt: |
  닉네임이 있으면 닉네임을, 없으면 `손님`을 보여 주는 코드예요. 실행하면 콘솔에 무엇이 출력되나요?
spec:
  lang: js
  code: |
    const nickname = "";
    const shown = nickname ? nickname + "님" : "손님";
    console.log(shown);
  answerKind: console
hints:
  - 2번 줄의 조건 자리에는 비교식이 아니라 `nickname`이라는 값이 그대로 있어요.
  - 조건 자리에 불리언이 아닌 값이 오면 truthy·falsy 규칙으로 참·거짓을 정해요. 빈 문자열 `""`은 어느 쪽인가요?
  - 조건이 거짓이면 `:` 뒤의 값이 식 전체의 결과가 돼요.
explanation: |
  정답은 `손님`이에요.

  1. 조건 자리의 `nickname`은 빈 문자열 `""`이에요.
  1. 빈 문자열은 falsy라서 거짓으로 봐요. (`0`, `""`, `null`, `undefined`, `NaN`이 falsy예요.)
  1. 조건이 거짓이니 `:` 뒤의 `"손님"`이 식 전체의 값이 되고, 그 값이 `shown`에 들어가요.

  `님`이라고 답했다면 빈 문자열도 값이 있으니 참이라고 본 거예요. 글자가 하나도 없는 `""`은 거짓으로 봐요. 반대로 `" "`처럼 공백 하나라도 있으면 참이에요.
