id: js-basics.control.ternary.fix-receipt-labels
type: fix_bug
difficulty: 4
concepts:
  - { id: js.control.ternary, weight: 1 }
  - { id: js.errors.error-messages, weight: 0.3 }
tags: [ternary, precedence, debugging]
estimatedSeconds: 420
prompt: |
  영수증 아래에 붙는 안내 문구를 만드는 프로그램이에요. 규칙은 이래요.

  - 회원이면 `회원 적립: 450점`처럼 결제 금액의 1%를 적립 점수로 보여 주고, 아니면 `회원 가입하고 적립 받기`
  - 결제 금액이 30000원 이상이면 `배송: 무료`, 아니면 `배송: 3000원`
  - 포장을 요청했으면 `포장: 요청함`, 아니면 `포장: 요청 안 함`

  버그가 여러 개 있고, 하나를 고치면 다음 문제가 드러나요. 조건 연산자는 그대로 쓰면서 고쳐서 아래처럼 나오게 하세요.

  ```text
  회원 적립: 450점
  배송: 무료
  포장: 요청 안 함
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          const total = 45000;
          const isMember = true;
          const wantsWrapping = false;

          const pointText = isMember ? "회원 적립: " + total / 100 + "점" : const guide = "회원 가입하고 적립 받기";
          const shippingText = "배송: " + total >= 30000 ? "무료" : "3000원";
          let wrappingText = "포장: 확인 중";
          wantsWrapping ? "포장: 요청함" : "포장: 요청 안 함";

          console.log(pointText);
          console.log(shippingText);
          console.log(wrappingText);
  solution:
    files:
      - path: main.js
        content: |
          const total = 45000;
          const isMember = true;
          const wantsWrapping = false;

          const pointText = isMember ? "회원 적립: " + total / 100 + "점" : "회원 가입하고 적립 받기";
          const shippingText = "배송: " + (total >= 30000 ? "무료" : "3000원");
          let wrappingText = "포장: 확인 중";
          wrappingText = wantsWrapping ? "포장: 요청함" : "포장: 요청 안 함";

          console.log(pointText);
          console.log(shippingText);
          console.log(wrappingText);
  bugDescription: "실행하면 SyntaxError: Unexpected token 'const'가 나요. 그 오류를 고치면 배송 안내가 \"배송: \" 없이 \"3000원\"으로 나오고, 포장 안내는 \"포장: 확인 중\" 그대로예요."
  bugMisconception: js.mc.ternary-precedence
  maxEditDistance: 10
  checks:
    - kind: console
      id: output
      description: 적립, 배송, 포장 안내가 정해진 문구로 차례로 출력되어야 합니다.
      requirement: 안내 문구 출력
      expect:
        lines: ["회원 적립: 450점", "배송: 무료", "포장: 요청 안 함"]
    - kind: program
      id: texts
      description: 'shippingText에는 "배송: 무료", wrappingText에는 "포장: 요청 안 함"이 들어 있어야 합니다.'
      requirement: 안내 값 저장
      expect:
        globals:
          shippingText: { equals: "배송: 무료" }
          wrappingText: { equals: "포장: 요청 안 함" }
        noError: true
misconceptions: [js.mc.ternary-as-statement, js.mc.ternary-precedence, js.mc.ternary-result-discarded]
hints:
  - "처음 오류는 `SyntaxError: Unexpected token 'const'`예요. 조건 연산자의 `:` 뒤에 무엇이 들어 있나요?"
  - "다음으로 배송 안내에서 `\"배송: \"`이 사라진 이유를 찾아보세요. `+`, `>=`, `? :` 중 무엇이 먼저 계산될까요?"
  - 마지막으로 포장 안내가 바뀌지 않는 이유를 보세요. 조건 연산자가 고른 값은 어디로 가나요?
explanation: |
  버그 세 개가 차례로 드러나요.

  1. **`SyntaxError: Unexpected token 'const'` (5번 줄)**: 조건 연산자의 `:` 뒤에 `const guide = ...` 선언이 들어 있어요. `?`와 `:` 뒤에는 값만 올 수 있으니 `"회원 가입하고 적립 받기"`만 남겨요.
  1. **배송 안내가 `3000원` (6번 줄)**: 조건 연산자는 우선순위가 낮아서 `"배송: " + total`이 먼저 계산되고, `"배송: 45000" >= 30000`(NaN 비교라 `false`)이 조건이 됐어요. 그래서 `"3000원"`만 남았어요. `"배송: " + (total >= 30000 ? "무료" : "3000원")`처럼 괄호로 감싸요.
  1. **포장 안내가 `확인 중` (8번 줄)**: 조건 연산자가 고른 값을 받는 곳이 없어 버려졌어요. `wrappingText = ...`로 대입해요.

  5번 줄의 `"회원 적립: " + total / 100 + "점"`은 `/`가 `+`보다 먼저라서 `450`이 이어 붙여져요. 조건 연산자 안쪽의 식은 조건 연산자보다 먼저 계산되므로 괄호가 없어도 괜찮아요. 헷갈리면 `isMember ? ("회원 적립: " + total / 100 + "점") : ...`처럼 괄호를 쳐도 돼요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
