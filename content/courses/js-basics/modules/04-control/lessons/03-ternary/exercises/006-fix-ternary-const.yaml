id: js-basics.control.ternary.fix-ternary-const
type: fix_bug
difficulty: 2
concepts:
  - { id: js.control.ternary, weight: 1 }
  - { id: js.errors.error-messages, weight: 0.3 }
tags: [ternary, syntax-error, debugging]
estimatedSeconds: 150
prompt: |
  비가 오면 `우산`, 아니면 `모자`를 챙기라고 알려 주는 프로그램이에요. 실행하면 오류가 나요. 조건 연산자를 바르게 써서 고치세요. 고른 준비물은 `item`에 들어 있어야 해요.

  ```text
  오늘의 준비물: 우산
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          const isRaining = true;
          isRaining ? const item = "우산" : const item = "모자";
          console.log("오늘의 준비물:", item);
  solution:
    files:
      - path: main.js
        content: |
          const isRaining = true;
          const item = isRaining ? "우산" : "모자";
          console.log("오늘의 준비물:", item);
  bugDescription: "실행하면 아무것도 출력되지 않고 SyntaxError: Unexpected token 'const' 오류가 나요."
  bugMisconception: js.mc.ternary-as-statement
  checks:
    - kind: console
      id: output
      description: '비가 오므로 "오늘의 준비물: 우산"이 출력되어야 합니다.'
      requirement: 준비물 출력
      expect:
        lines: ["오늘의 준비물: 우산"]
    - kind: program
      id: item-value
      description: item에 "우산"이 들어 있어야 합니다.
      requirement: 준비물 저장
      expect:
        globals:
          item: { equals: "우산" }
        noError: true
misconceptions: [js.mc.ternary-as-statement]
hints:
  - 오류 메시지가 `const`를 가리켜요. 조건 연산자의 `?`와 `:` 뒤에는 무엇이 올 수 있나요?
  - 조건 연산자는 값을 고르는 식이에요. 변수 선언 같은 문장은 그 안에 넣을 수 없어요.
  - 값을 먼저 고르고, 고른 값을 한 번에 `const item = ...`으로 받으세요.
explanation: |
  원인은 2번 줄에서 조건 연산자의 각 자리에 `const` 선언을 넣은 것이에요. 조건 연산자는 값을 고르는 **식**이라서 `?`와 `:` 뒤에는 값만 올 수 있어요. 선언은 문장이라 `SyntaxError: Unexpected token 'const'`가 나고, 문법 오류라서 프로그램 전체가 실행되지 않았어요.

  값을 고른 뒤 한 번에 받아요.

  ```js
  const item = isRaining ? "우산" : "모자";
  ```

  이렇게 쓰면 `item`을 처음부터 `const`로 만들 수 있다는 것도 조건 연산자의 장점이에요. if-else로 쓰려면 `let item;`을 먼저 만들고 두 블록에서 각각 대입해야 해요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
