id: js-basics.control.ternary.fix-ternary-discarded
type: fix_bug
difficulty: 2
concepts:
  - { id: js.control.ternary, weight: 1 }
  - { id: js.values.assignment, weight: 0.3 }
tags: [ternary, assignment, debugging]
estimatedSeconds: 200
prompt: |
  공연장 좌석 안내 프로그램이에요. 남은 좌석이 0석이니 상태는 `매진`, 버튼은 `대기 신청`이어야 해요.

  오류는 없는데 처음 값 그대로 나와요. 버그를 고쳐서 아래처럼 나오게 하세요.

  ```text
  상태: 매진
  버튼: 대기 신청
  ```
spec:
  buggy:
    files:
      - path: main.js
        content: |
          const seats = 0;
          let status = "확인 중";
          let buttonText = "확인 중";

          seats > 0 ? "예매 가능" : "매진";
          seats > 0 ? "예매하기" : "대기 신청";

          console.log("상태:", status);
          console.log("버튼:", buttonText);
  solution:
    files:
      - path: main.js
        content: |
          const seats = 0;
          let status = "확인 중";
          let buttonText = "확인 중";

          status = seats > 0 ? "예매 가능" : "매진";
          buttonText = seats > 0 ? "예매하기" : "대기 신청";

          console.log("상태:", status);
          console.log("버튼:", buttonText);
  bugDescription: 남은 좌석이 0석인데 상태와 버튼이 모두 "확인 중"으로 나와요. 오류 메시지는 없어요.
  bugMisconception: js.mc.ternary-result-discarded
  checks:
    - kind: console
      id: output
      description: 상태 "매진"과 버튼 "대기 신청"이 차례로 출력되어야 합니다.
      requirement: 좌석 안내 출력
      expect:
        lines: ["상태: 매진", "버튼: 대기 신청"]
    - kind: program
      id: values
      description: status에는 "매진", buttonText에는 "대기 신청"이 들어 있어야 합니다.
      requirement: 안내 값 저장
      expect:
        globals:
          status: { equals: "매진" }
          buttonText: { equals: "대기 신청" }
        noError: true
      misconceptionIfFail: js.mc.ternary-result-discarded
misconceptions: [js.mc.ternary-result-discarded]
hints:
  - "`status`와 `buttonText`의 값이 바뀌는 줄이 있나요? `=`로 대입하는 줄을 찾아보세요."
  - 5~6번 줄의 조건 연산자는 값을 고르기만 해요. 고른 값은 어디로 가나요?
  - '고른 값을 변수에 대입하세요. `status = 조건 ? 값1 : 값2;` 모양이에요.'
explanation: |
  원인은 5~6번 줄이에요. 조건 연산자는 값을 **만들기만** 하는데, 그 값을 받는 곳이 없어서 만들어지자마자 버려졌어요. `status`와 `buttonText`에는 대입한 적이 없으니 처음 값 `"확인 중"` 그대로예요. 문법상 문제가 없어 오류 메시지도 나지 않았어요.

  고른 값을 변수에 대입해요.

  ```js
  status = seats > 0 ? "예매 가능" : "매진";
  buttonText = seats > 0 ? "예매하기" : "대기 신청";
  ```

  `let status = "확인 중";`처럼 미리 만든 변수가 있으니 `let`을 다시 붙이지 않고 대입만 해요. `let status = ...`라고 쓰면 같은 이름을 다시 선언해서 `SyntaxError`가 나요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
