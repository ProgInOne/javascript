id: js-basics.arrays.array-basics.mcq-first-index
type: mcq_single
difficulty: 1
concepts:
  - { id: js.arr.literal-index, weight: 1 }
tags: [index, literal]
estimatedSeconds: 45
prompt: |
  `const fruits = ["사과", "배", "귤"];`일 때 `fruits[1]`의 값은 무엇인가요?
spec:
  options:
    - id: a
      text: '`"배"`'
    - id: b
      text: '`"사과"`'
      misconception: js.mc.index-starts-at-one
      rationale: 인덱스는 0부터 시작해요. `"사과"`는 `fruits[0]`이에요.
    - id: c
      text: '`"귤"`'
      rationale: '`"귤"`은 세 번째 요소라 인덱스는 2예요.'
    - id: d
      text: '`undefined`'
      misconception: js.mc.array-out-of-range-throws
      rationale: 인덱스 1은 범위 안이에요. 요소가 3개면 인덱스 0, 1, 2에 모두 요소가 있어요.
  correct: a
misconceptions: [js.mc.index-starts-at-one]
hints:
  - 배열의 인덱스는 문자열의 인덱스와 같은 규칙을 따라요.
  - 첫 번째 요소의 인덱스는 몇 번일까요?
  - 0번이 첫 번째라면, 1번은 몇 번째 요소일까요?
explanation: |
  정답은 `"배"`예요.

  배열의 인덱스는 0부터 시작해요. `fruits[0]`이 `"사과"`, `fruits[1]`이 `"배"`, `fruits[2]`가 `"귤"`이에요.

  - `"사과"`: 1번째 요소라 인덱스는 0이에요. "1번째"와 "인덱스 1"을 같다고 보면 생기는 실수예요.
  - `"귤"`: 인덱스 2의 요소예요.
  - `undefined`: 범위 밖 인덱스를 읽었을 때의 값이에요. 인덱스 1은 범위 안이에요.
origin: authored
