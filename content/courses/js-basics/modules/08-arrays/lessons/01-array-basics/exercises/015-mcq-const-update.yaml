id: js-basics.arrays.array-basics.mcq-const-update
type: mcq_single
difficulty: 2
concepts:
  - { id: js.arr.element-update, weight: 1 }
  - { id: js.values.const, weight: 0.3 }
tags: [element-update, const]
estimatedSeconds: 60
prompt: |
  다음 코드를 실행하면 콘솔에 무엇이 나오나요?
code: |
  const seats = ["빈자리", "빈자리", "빈자리"];
  seats[1] = "민지";
  console.log(seats);
spec:
  options:
    - id: a
      text: '`["빈자리", "민지", "빈자리"]`'
    - id: b
      text: '`TypeError: Assignment to constant variable.`'
      misconception: js.mc.array-immutable-like-string
      rationale: const는 변수에 다른 값을 다시 대입하는 것만 막아요. 배열의 요소를 바꾸는 것은 막지 않아요.
    - id: c
      text: '`["빈자리", "빈자리", "빈자리"]`'
      misconception: js.mc.array-immutable-like-string
      rationale: 문자열과 달리 배열은 바꿀 수 있어요. 대입이 조용히 무시되지 않아요.
    - id: d
      text: '`["민지", "빈자리", "빈자리"]`'
      misconception: js.mc.index-starts-at-one
      rationale: 인덱스 1은 두 번째 자리예요. 첫 번째 자리는 인덱스 0이에요.
  correct: a
misconceptions: [js.mc.array-immutable-like-string, js.mc.const-is-immutable]
hints:
  - 배열은 문자열처럼 바꿀 수 없는 값일까요, 바꿀 수 있는 값일까요?
  - "`const`가 막는 것은 \"변수에 다시 대입하기\"예요. 2번 줄은 변수 `seats`에 새 값을 대입하나요, 배열 안의 한 자리에 대입하나요?"
  - 대입이 된다면 인덱스 1은 몇 번째 자리인지 세어 보세요.
explanation: |
  정답은 `["빈자리", "민지", "빈자리"]`예요.

  - 배열은 바꿀 수 있는 값이라 `seats[1] = "민지"`는 두 번째 자리(인덱스 1)의 요소를 바꿔요.
  - `seats`는 `const`지만, `const`는 `seats = [...]`처럼 **변수에 다른 값을 다시 대입하는 것**만 막아요. 배열 안의 요소를 바꾸는 것은 막지 않아서 `TypeError`가 나지 않아요.
  - 대입이 무시되어 그대로 남는 일도 없어요. 그건 바꿀 수 없는 문자열에서 생각할 만한 결과예요.
  - 인덱스 1은 첫 번째가 아니라 두 번째 자리예요.
origin: authored
review:
