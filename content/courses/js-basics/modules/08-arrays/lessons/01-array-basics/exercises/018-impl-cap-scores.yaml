id: js-basics.arrays.array-basics.impl-cap-scores
type: implement_function
difficulty: 3
concepts:
  - { id: js.arr.element-update, weight: 1 }
  - { id: js.arr.length, weight: 0.3 }
  - { id: js.control.if, weight: 0.3 }
tags: [element-update, loop, in-place, function, write-code]
estimatedSeconds: 300
prompt: |
  보너스 점수 때문에 100점을 넘은 점수가 생겼어요. 점수 배열과 최고 점수 `max`를 받아, **배열 안에서 직접** `max`보다 큰 점수를 `max`로 바꾸고, 바꾼 점수가 몇 개인지 돌려주는 함수 `capScores(scores, max)`를 완성하세요.

  ```js
  const myScores = [95, 120, 101, 80];
  capScores(myScores, 100); // 2를 돌려줌
  // 이제 myScores는 [95, 100, 100, 80]
  ```

  시작 코드 아래쪽의 확인용 세 줄은 그대로 두세요. 채점이 이 줄의 결과(`myScores`, `changed`)도 확인해요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          function capScores(scores, max) {
            // max보다 큰 점수를 배열 안에서 max로 바꾸고,
            // 바꾼 점수의 개수를 돌려주세요.
          }

          // 확인용 (그대로 두세요)
          const myScores = [95, 120, 101, 80];
          const changed = capScores(myScores, 100);
          console.log(myScores, changed);
  entry: capScores
  solution:
    files:
      - path: main.js
        content: |
          function capScores(scores, max) {
            let count = 0;
            for (let i = 0; i < scores.length; i++) {
              if (scores[i] > max) {
                scores[i] = max;
                count++;
              }
            }
            return count;
          }

          // 확인용 (그대로 두세요)
          const myScores = [95, 120, 101, 80];
          const changed = capScores(myScores, 100);
          console.log(myScores, changed);
  checks:
    - kind: program
      id: in-place
      description: capScores(myScores, 100)을 부른 뒤 myScores가 [95, 100, 100, 80]으로 바뀌고, 돌려준 값이 2여야 합니다.
      requirement: 배열 안에서 바꾸기
      expect:
        globals:
          myScores: { equals: [95, 100, 100, 80] }
          changed: { equals: 2 }
        noError: true
    - kind: call
      id: one-over
      description: "[50, 150]에서 max가 100이면 1개를 바꿉니다."
      requirement: 바꾼 개수
      args: [[50, 150], 100]
      expect: { equals: 1 }
    - kind: call
      id: none-over
      visible: false
      description: max보다 큰 점수가 없으면 0을 돌려줘야 합니다(max와 같은 점수는 바꾸지 않아요).
      requirement: 바꾼 개수
      args: [[10, 20, 100], 100]
      expect: { equals: 0 }
    - kind: call
      id: all-over
      visible: false
      description: 모든 점수가 max보다 크면 모두 바꾸고 그 개수를 돌려줘야 합니다.
      requirement: 바꾼 개수
      args: [[7, 8, 9], 5]
      expect: { equals: 3 }
    - kind: call
      id: empty
      visible: false
      description: 빈 배열이면 0입니다.
      requirement: 바꾼 개수
      args: [[], 100]
      expect: { equals: 0 }
misconceptions: [js.mc.array-immutable-like-string, js.mc.array-last-index-is-length]
hints:
  - 모든 점수를 하나씩 보려면 인덱스로 반복해요. 바꾼 개수를 셀 변수도 반복 앞에 필요해요.
  - 점수를 바꾸려면 그 점수가 있는 자리, 즉 인덱스를 알아야 해요. 그 자리에 무엇을 대입하면 될까요?
  - "`max`보다 클 때만 두 가지 일을 해요. 그 자리의 점수를 바꾸는 일과 개수를 하나 늘리는 일이에요. 반복이 끝난 뒤 개수를 돌려줘요."
explanation: |
  예시 정답이에요.

  ```js
  function capScores(scores, max) {
    let count = 0;
    for (let i = 0; i < scores.length; i++) {
      if (scores[i] > max) {
        scores[i] = max;
        count++;
      }
    }
    return count;
  }
  ```

  - **자리에 대입하기**: `scores[i] = max`가 배열 안의 요소를 직접 바꿔요. 배열은 바꿀 수 있는 값이라 함수 밖의 `myScores`에도 바뀐 값이 보여요(같은 배열이기 때문이에요. 원리는 모듈 9에서 배워요).
  - **경계**: 조건은 `>`예요. `>=`로 쓰면 이미 `100`인 점수도 "바꾼 것"으로 세어 개수가 틀려요.
  - 인덱스 없이 값만 꺼내 비교하면 어느 자리를 바꿔야 할지 알 수 없어요. 그래서 이 문제에서는 `for`의 인덱스가 필요해요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
