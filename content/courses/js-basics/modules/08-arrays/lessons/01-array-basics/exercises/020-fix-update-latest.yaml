id: js-basics.arrays.array-basics.fix-update-latest
type: fix_bug
difficulty: 4
concepts:
  - { id: js.arr.length, weight: 1 }
  - { id: js.arr.element-update, weight: 0.5 }
  - { id: js.arr.literal-index, weight: 0.3 }
tags: [length, last-element, negative-index, element-update, debugging]
estimatedSeconds: 300
prompt: |
  몸무게 기록 앱에서 오늘 기록을 잘못 입력했을 때 고치는 함수 `updateLatest(records, value)`예요. 기록 배열의 **마지막 기록**을 `value`로 바꾸고, 바꾸기 전의 마지막 기록을 돌려줘야 해요. 그런데 결과가 이상해요. 고쳐 보세요.

  ```js
  const weights = [61, 60, 62];
  updateLatest(weights, 59); // 62를 돌려줌
  // 이제 weights는 [61, 60, 59]
  ```

  시작 코드 아래쪽의 확인용 줄은 그대로 두세요.
spec:
  buggy:
    files:
      - path: main.js
        content: |
          function updateLatest(records, value) {
            const previous = records[-1];
            records[records.length] = value;
            return previous;
          }

          // 확인용 (그대로 두세요)
          const weights = [61, 60, 62];
          const old = updateLatest(weights, 59);
          console.log(weights, old);
  solution:
    files:
      - path: main.js
        content: |
          function updateLatest(records, value) {
            const previous = records[records.length - 1];
            records[records.length - 1] = value;
            return previous;
          }

          // 확인용 (그대로 두세요)
          const weights = [61, 60, 62];
          const old = updateLatest(weights, 59);
          console.log(weights, old);
  entry: updateLatest
  bugDescription: '`updateLatest(weights, 59)`가 `62`가 아니라 `undefined`를 돌려주고, 마지막 기록이 고쳐지지 않은 채 기록이 하나 늘어나요.'
  checks:
    - kind: program
      id: weights
      description: 확인용 줄을 실행한 뒤 weights는 [61, 60, 59], old는 62여야 합니다.
      requirement: 마지막 기록 고치기
      expect:
        globals:
          weights: { equals: [61, 60, 59] }
          old: { equals: 62 }
        noError: true
    - { kind: call, id: returns-previous, args: [[10, 12, 15], 14], expect: { equals: 15 }, requirement: 바꾸기 전 기록 돌려주기, misconceptionIfFail: js.mc.array-negative-index-last }
    - kind: call
      id: single
      visible: false
      description: 기록이 하나뿐이어도 그 기록을 돌려줘야 합니다.
      requirement: 바꾸기 전 기록 돌려주기
      args: [[5], 7]
      expect: { equals: 5 }
misconceptions: [js.mc.array-negative-index-last, js.mc.array-last-index-is-length]
hints:
  - 증상이 두 가지예요. 돌려주는 값이 `undefined`인 것과, 기록이 고쳐지지 않고 늘어나는 것이에요. 각각 어느 줄과 관련 있을까요?
  - 대괄호 안의 `-1`과 `records.length`는 각각 어떤 자리를 가리키나요? 그 자리에 요소가 있나요?
  - 두 줄 모두 "마지막 기록의 자리"를 써야 해요. 마지막 인덱스를 `length`로 나타내 보세요.
explanation: |
  버그는 두 줄에 있어요. 둘 다 "마지막 자리"를 잘못 가리켜요.

  | 줄 | 버그 코드 | 실제로 가리키는 자리 | 고친 코드 |
  |---|---|---|---|
  | 2번 | `records[-1]` | 인덱스 `-1`, 요소 없음 → `undefined` | `records[records.length - 1]` |
  | 3번 | `records[records.length] = value` | 마지막 다음 자리 → 기록이 하나 늘어남 | `records[records.length - 1] = value` |

  - 음수 인덱스는 "뒤에서부터"가 아니에요. 그래서 `previous`에 `undefined`가 들어가 그대로 반환됐어요.
  - `records.length`번 자리는 마지막 요소의 **다음** 자리예요. 그 자리에 대입하면 요소가 덧붙어서 `weights`가 `[61, 60, 62, 59]`가 됐어요.
  - 마지막 요소는 언제나 `length - 1`번이에요. 고친 뒤 `weights`는 `[61, 60, 59]`, 돌려준 값은 `62`예요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
