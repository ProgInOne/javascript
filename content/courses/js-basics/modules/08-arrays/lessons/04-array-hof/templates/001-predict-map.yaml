id: js-basics.arrays.array-hof.t.predict-map
type: predict_output
difficulty: 2
concepts:
  - { id: js.arr.map, weight: 1 }
  - { id: js.arr.mutating-vs-not, weight: 0.3 }
tags: [map, original-unchanged, template]
estimatedSeconds: 90
params:
  nums: { kind: intArray, length: 3, min: 1, max: 9 }
  k: { kind: int, min: 2, max: 5 }
  op: { kind: choice, values: ["*", "+"] }
  arr: { kind: identifier, pool: [nums, prices, scores, points] }
  out: { kind: identifier, pool: [result, changed, mapped, updated] }
  # map이 돌려줄 새 배열. 해설과 오답 키에만 쓴다 (정답 키는 실행으로 계산)
  mappedValues:
    kind: derived
    expr: "op === '*' ? [nums[0] * k, nums[1] * k, nums[2] * k] : [nums[0] + k, nums[1] + k, nums[2] + k]"
render:
  prompt: |
    다음 코드를 실행하면 콘솔에 무엇이 출력될까요? 두 줄을 차례로 적어 보세요. 배열은 콘솔에 `[1, 2]`처럼 보여요.
spec:
  lang: js
  code: |
    const {{arr}} = {{nums}};
    const {{out}} = {{arr}}.map((n) => n {{op}} {{k}});
    console.log({{arr}});
    console.log({{out}});
  answerKind: console
  misconceptionByAnswer:
    # map이 원래 배열도 바꾼다고 생각한 오답: 두 줄 모두 새 배열
    "{{mappedValues}}\n{{mappedValues}}": js.mc.map-mutates-original
# 배열·숫자 바로 뒤에는 받침에 따라 달라지는 조사를 쓰지 않는다.
hints:
  - "`map`은 `{{arr}}`를 직접 바꿀까요, 새 배열을 만들어 돌려줄까요?"
  - "3번 줄은 `{{arr}}`, 4번 줄은 `map`이 돌려준 `{{out}}`를 출력해요."
  - "`map`은 요소마다 콜백을 한 번씩 불러 `n {{op}} {{k}}`의 값으로 새 배열을 채워요."
explanation: |
  `map`은 원래 배열을 바꾸지 않고, 콜백이 돌려준 값으로 **새 배열**을 만들어 돌려줘요.

  - 3번 줄: `{{arr}}`는 바뀌지 않았으므로 처음 값 `{{nums}}` 그대로 출력돼요.
  - 4번 줄: `{{out}}`에는 요소마다 `n {{op}} {{k}}`의 값을 계산한 새 배열이 들어 있어요. `{{nums}}` → `{{mappedValues}}`

  두 줄이 모두 바뀐 배열이라고 답했다면 `map`이 원래 배열을 바꾼다고 생각한 거예요. 원래 배열 `{{arr}}`는 그대로이고, 바뀐 값은 `map`이 돌려준 새 배열 `{{out}}`에만 있어요.
misconceptions: [js.mc.map-mutates-original]
variantPolicy:
  sampleSize: 30
  minDistinctFromRecent: 3
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
