id: js-basics.arrays.array-hof.fix-map-no-return
type: fix_bug
difficulty: 3
concepts:
  - { id: js.arr.map, weight: 1 }
  - { id: js.fn.arrow, weight: 0.5 }
tags: [map, arrow-function, return, debugging]
estimatedSeconds: 240
prompt: |
  상품 가격 목록을 받아 가격마다 배송비 2500원을 더한 새 목록을 돌려주는 함수 `addShipping(prices)`예요. 그런데 배열 대신 `undefined`가 돌아와요. 버그가 두 군데 있어요. 모두 고쳐 보세요.

  | 호출 | 돌려줄 값 |
  |---|---|
  | `addShipping([10000, 3000])` | `[12500, 5500]` |
  | `addShipping([])` | `[]` |
spec:
  buggy:
    files:
      - path: main.js
        content: |
          function addShipping(prices) {
            prices.map((price) => {
              price + 2500;
            });
          }
  solution:
    files:
      - path: main.js
        content: |
          function addShipping(prices) {
            return prices.map((price) => {
              return price + 2500;
            });
          }
  entry: addShipping
  bugDescription: "`addShipping([10000, 3000])`가 `[12500, 5500]`이 아니라 `undefined`를 돌려줘요."
  checks:
    - kind: call
      id: returns-array
      description: addShipping은 map이 만든 새 배열을 돌려줘야 합니다.
      requirement: 배송비 더하기
      args: [[10000, 3000]]
      expect: { matches: { type: array, length: 2 } }
      misconceptionIfFail: js.mc.map-mutates-original
    - { kind: call, id: two, args: [[10000, 3000]], expect: { equals: [12500, 5500] }, requirement: 배송비 더하기, misconceptionIfFail: js.mc.map-callback-no-return }
    - { kind: call, id: empty, args: [[]], expect: { equals: [] }, requirement: 배송비 더하기 }
    - kind: call
      id: three
      visible: false
      description: 가격이 세 개여도 각각 2500원씩 더한 값이 같은 순서로 들어 있어야 합니다.
      requirement: 배송비 더하기
      args: [[0, 7500, 100]]
      expect: { equals: [2500, 10000, 2600] }
    - kind: call
      id: keep-input
      visible: false
      description: 받은 가격 목록은 바꾸지 않아야 합니다.
      requirement: 원래 목록 지키기
      args: [[10000, 3000]]
      expect: { argsUnchanged: true }
misconceptions: [js.mc.map-callback-no-return, js.mc.map-mutates-original, js.mc.arrow-braces-implicit-return]
hints:
  - 함수가 배열이 아니라 `undefined`를 돌려줘요. `addShipping` 안에 값을 돌려주는 문장이 있나요? `map`이 만든 새 배열은 어디로 가나요?
  - 함수가 `map`의 결과를 돌려주게 고치면 이번에는 `[undefined, undefined]`가 나와요. `map`은 각 자리에 무엇을 담나요?
  - 콜백은 중괄호 본문을 가진 화살표 함수라서, 안의 식은 계산만 되고 버려지고 있어요. 값을 밖으로 내보내야 하는 곳이 함수와 콜백 두 군데예요.
explanation: |
  값을 **돌려주지 않는** 곳이 두 군데 있어요.

  1. **함수가 `map`의 결과를 돌려주지 않아요.** `map`은 원래 배열을 바꾸지 않고 새 배열을 돌려주는데, 버그 코드는 그 새 배열을 버려요. `return`이 없는 함수는 `undefined`를 돌려줘요.
  1. **콜백이 새 값을 돌려주지 않아요.** 함수에 `return`만 더하면 `[undefined, undefined]`가 나와요.

  `map`은 콜백이 돌려준 값을 새 배열의 각 자리에 담아요. 화살표 함수에 중괄호를 쓰면 `return`을 써야 값을 돌려주는데, 버그 코드는 `price + 2500;`을 계산만 하고 버려요. 그래서 콜백이 `undefined`를 돌려주고, 결과는 `[undefined, undefined]`예요.

  콜백을 고치는 방법은 두 가지예요. 두 방법 모두 `map` 앞에 `return`이 있어야 해요.

  ```js
  // 1) return 쓰기
  return prices.map((price) => {
    return price + 2500;
  });

  // 2) 중괄호 빼기 (식 하나를 바로 돌려줌)
  return prices.map((price) => price + 2500);
  ```

  `map` 앞의 `return`은 `addShipping`이 결과 배열을 돌려주는 것이고, 콜백 안의 `return`은 요소 하나의 새 값을 돌려주는 거예요. 둘 다 필요해요.
