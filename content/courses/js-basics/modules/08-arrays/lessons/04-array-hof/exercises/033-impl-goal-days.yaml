id: js-basics.arrays.array-hof.impl-goal-days
type: implement_function
difficulty: 3
concepts:
  - { id: js.arr.reduce, weight: 1 }
  - { id: js.control.ternary, weight: 0.3 }
tags: [reduce, initial-value, count, write-code]
estimatedSeconds: 240
prompt: |
  줄넘기 앱이 날마다 넘은 횟수를 기록해요. 기록 목록 `records`와 목표 횟수 `goal`을 받아 **목표를 채운 날의 수**를 돌려주는 함수 `goalDays(records, goal)`를 완성하세요. 목표와 같은 횟수를 넘은 날도 목표를 채운 날이에요. 이 단원에서 배운 `reduce`로 풀어 보세요(`filter`나 반복으로 만들어도 채점은 통과해요).

  | 호출 | 돌려줄 값 |
  |---|---|
  | `goalDays([120, 80, 150, 100], 100)` | `3` |
  | `goalDays([50, 70], 100)` | `0` |
  | `goalDays([], 100)` | `0` |

  받은 `records` 배열은 바꾸지 마세요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          function goalDays(records, goal) {
            // 여기에 작성하세요
          }
  entry: goalDays
  solution:
    files:
      - path: main.js
        content: |
          function goalDays(records, goal) {
            return records.reduce((count, n) => (n >= goal ? count + 1 : count), 0);
          }
  checks:
    - { kind: call, id: basic, args: [[120, 80, 150, 100], 100], expect: { equals: 3 }, requirement: 목표를 채운 날 세기 }
    - { kind: call, id: none, args: [[50, 70], 100], expect: { equals: 0 }, requirement: 목표를 채운 날 세기 }
    - { kind: call, id: empty, args: [[], 100], expect: { equals: 0 }, requirement: 빈 목록 }
    - kind: call
      id: one-equal
      visible: false
      description: 기록이 하루뿐이고 목표와 같은 횟수여도 1일로 세어야 합니다.
      requirement: 목표를 채운 날 세기
      args: [[100], 100]
      expect: { equals: 1 }
      misconceptionIfFail: js.mc.reduce-initial-optional-safe
    - kind: call
      id: many
      visible: false
      description: 처음 보는 기록과 목표로도 목표를 채운 날을 모두 세어야 합니다.
      requirement: 목표를 채운 날 세기
      args: [[30, 200, 150, 10, 200], 150]
      expect: { equals: 3 }
      misconceptionIfFail: js.mc.reduce-initial-optional-safe
    - kind: call
      id: keep-input
      visible: false
      description: 받은 기록 배열을 바꾸지 않아야 합니다.
      requirement: 원래 배열 지키기
      args: [[120, 80], 100]
      expect: { argsUnchanged: true }
misconceptions: [js.mc.reduce-initial-optional-safe]
hints:
  - 여러 값을 하나로 모으는 메서드는 `reduce`예요. 여기서는 날의 수(숫자 하나)로 모아요.
  - 누적값은 지금까지 센 날의 수예요. 콜백은 이번 기록이 목표 이상이면 누적값에 1을 더한 값을, 아니면 누적값을 그대로 돌려줘야 해요.
  - 초기값을 생략하면 첫 기록(예를 들어 120)이 그대로 누적값이 되고, 빈 목록에서는 오류가 나요. 센 날이 없는 0에서 시작하게 하세요.
explanation: |
  예시 정답이에요.

  ```js
  function goalDays(records, goal) {
    return records.reduce((count, n) => (n >= goal ? count + 1 : count), 0);
  }
  ```

  - 누적값 `count`는 `0`에서 시작해 `[120, 80, 150, 100]`을 돌며 `1`, `1`, `2`, `3`으로 바뀌어요. 콜백이 돌려준 값이 다음 누적값이 되므로, 목표를 못 채운 날에도 `count`를 **그대로 돌려줘야** 해요.
  - **초기값 `0`이 꼭 필요해요.** 초기값을 생략하면 첫 기록 `120`이 그대로 누적값이 되어 `120`, `121`, `122`로 바뀌고 `122`가 나와요. `[100]`은 콜백이 한 번도 불리지 않아 `100`이 나오고, 빈 배열에서는 `TypeError: Reduce of empty array with no initial value`가 나요.
  - `records.filter((n) => n >= goal).length`나, 반복문에서 `let count = 0;`을 두고 조건에 맞을 때 `count++`해도 같은 결과예요.
origin: authored
