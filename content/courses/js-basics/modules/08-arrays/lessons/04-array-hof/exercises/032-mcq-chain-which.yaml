id: js-basics.arrays.array-hof.mcq-chain-which
type: mcq_single
difficulty: 2
concepts:
  - { id: js.arr.chaining, weight: 1 }
tags: [chaining, foreach, order]
estimatedSeconds: 90
prompt: |
  `const nums = [1, 2, 3];`일 때, 오류 없이 `[4, 6]`을 돌려주는 식은 무엇인가요?
spec:
  codeOptions: true
  options:
    - id: a
      text: "nums.map((n) => n * 2).filter((n) => n > 2)"
    - id: b
      text: "nums.forEach((n) => n * 2).filter((n) => n > 2)"
      misconception: js.mc.chain-after-foreach
      rationale: "`forEach`는 `undefined`를 돌려줘서 뒤의 `filter`에서 `TypeError`가 나요."
    - id: c
      text: "nums.filter((n) => n > 2).map((n) => n * 2)"
      misconception: js.mc.chain-order-irrelevant
      rationale: 먼저 고르면 원래 값 중 2보다 큰 3만 남아서 결과는 `[6]`이에요. 순서를 바꾸면 결과가 달라져요.
    - id: d
      text: "nums.map((n) => { n * 2; }).filter((n) => n > 2)"
      misconception: js.mc.map-callback-no-return
      rationale: 중괄호 본문에 `return`이 없어서 `map`의 결과가 `[undefined, undefined, undefined]`이고, 고를 요소가 없어 `[]`이에요.
  correct: a
misconceptions: [js.mc.chain-after-foreach, js.mc.chain-order-irrelevant]
hints:
  - 이어 쓴 메서드는 왼쪽부터 실행되고, 뒤 메서드는 앞 메서드가 돌려준 값을 받아요. 선택지마다 중간 결과를 적어 보세요.
  - 앞 메서드가 배열을 돌려주지 않으면 뒤에 `filter`를 이을 수 없어요. 어떤 메서드가 배열을 돌려주지 않나요?
  - "`[4, 6]`의 4는 원래 배열의 2를 두 배한 값이에요. 2가 두 배가 되기 전에 걸러지면 안 돼요."
explanation: |
  정답은 `nums.map((n) => n * 2).filter((n) => n > 2)`예요.

  `map`이 `[2, 4, 6]`을 돌려주고, `filter`가 그중 2보다 큰 `[4, 6]`을 골라요.

  - `forEach`를 쓴 식: `forEach`는 `undefined`를 돌려주므로 `undefined.filter(...)`가 되어 `TypeError`가 나요.
  - `filter`를 먼저 쓴 식: 원래 값 1, 2, 3 중 2보다 큰 3만 남고, 두 배하면 `[6]`이에요.
  - 중괄호 본문의 `map`을 쓴 식: 콜백이 값을 돌려주지 않아 `[undefined, undefined, undefined]`가 되고, `undefined > 2`는 거짓이라 `[]`이에요.
