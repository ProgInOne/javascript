id: js-basics.arrays.array-hof.fill-reduce-total
type: fill_blank
difficulty: 2
concepts:
  - { id: js.arr.reduce, weight: 1 }
tags: [reduce, sum, initial-value]
estimatedSeconds: 120
prompt: |
  장바구니 가격 목록의 합계를 `reduce`로 구하는 함수 `cartTotal`을 완성하세요. 빈칸 두 개를 채워 아래처럼 출력되게 하세요. 장바구니가 비어 있으면 합계는 0이에요.

  ```text
  19500
  0
  ```
spec:
  mode: code
  lang: js
  template: |
    function cartTotal(prices) {
      return prices.reduce({{blank:callback}}, {{blank:init}});
    }
    console.log(cartTotal([3000, 12000, 4500]));
    console.log(cartTotal([]));
  blanks:
    - id: callback
      accept: ["(acc, price) => acc + price"]
      width: 30
    - id: init
      accept: ["0"]
      width: 6
  checks:
    - kind: console
      id: output
      description: 장바구니 합계 19500과 빈 장바구니의 합계 0이 차례로 출력되어야 합니다.
      requirement: 합계 구하기
      expect:
        lines: ["19500", "0"]
misconceptions: [js.mc.reduce-initial-optional-safe, js.mc.reduce-params-swapped]
hints:
  - 첫 번째 빈칸에는 콜백 함수가, 두 번째 빈칸에는 처음 누적값이 들어가요.
  - 콜백은 지금까지의 합계와 이번 가격을 받아 **새 합계**를 돌려줘야 해요. 매개변수의 순서도 떠올려 보세요.
  - 아무것도 더하지 않은 상태의 합계는 얼마인가요? 이 값이 없으면 빈 장바구니에서 무슨 일이 생길까요?
explanation: |
  예시 정답은 `(acc, price) => acc + price`와 `0`이에요.

  ```js
  return prices.reduce((acc, price) => acc + price, 0);
  ```

  - 콜백은 누적값 `acc`와 현재 가격 `price`를 받아 `acc + price`를 돌려줘요. 돌려준 값이 다음 누적값이 돼요. 매개변수 이름은 `(sum, p)`처럼 달라도 순서만 맞으면 돼요.
  - 초기값 `0`은 "아직 아무것도 더하지 않은 합계"예요. 빈 장바구니에서는 콜백이 한 번도 불리지 않고 `0`이 그대로 결과가 돼요.
  - 초기값을 빼면 3000 + 12000 + 4500은 그대로 19500이지만, 빈 배열에서 `TypeError: Reduce of empty array with no initial value`가 나요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
