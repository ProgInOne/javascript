id: js-basics.arrays.array-hof.check-map-lengths
type: mcq_single
difficulty: 1
usage: check
concepts:
  - { id: js.arr.map, weight: 1 }
tags: [map, check]
estimatedSeconds: 45
prompt: |
  다음 코드를 실행한 뒤 `lengths`에 들어 있는 값은 무엇인가요?
code: |
  const words = ["봄", "여름", "가을비"];
  const lengths = words.map((w) => w.length);
spec:
  options:
    - id: a
      text: '`[1, 2, 3]`'
    - id: b
      text: '`6`'
      rationale: 길이를 모두 더해 하나로 만드는 것은 `reduce`가 할 일이에요. `map`은 요소마다 바꾼 값을 배열에 담아요.
    - id: c
      text: '`["봄", "여름", "가을비"]`'
      rationale: '`map`은 콜백이 돌려준 값으로 새 배열을 만들어요. 여기서는 각 단어의 길이가 담겨요.'
    - id: d
      text: '`3`'
      rationale: '`3`은 `words.length`, 즉 단어의 개수예요. `map`은 단어마다 콜백을 불러요.'
  correct: a
hints:
  - "`map`은 요소마다 콜백을 불러요. 콜백은 `\"봄\"`을 받으면 무엇을 돌려주나요?"
  - 콜백이 돌려준 값들이 새 배열에 차례로 담겨요.
  - 결과 배열의 길이는 원래 배열의 길이와 같아요.
explanation: |
  정답은 `[1, 2, 3]`이에요.

  `map`은 요소마다 콜백을 불러 돌려받은 값을 **같은 순서, 같은 개수**로 새 배열에 담아요. `"봄".length`는 1, `"여름".length`는 2, `"가을비".length`는 3이에요.

  - `6`: 하나로 모으는 일은 `reduce`예요.
  - `["봄", "여름", "가을비"]`: 원래 배열 `words`는 그대로지만, `lengths`에는 콜백의 결과가 담겨요.
  - `3`: 단어 개수 `words.length`예요.
origin: authored
review:
