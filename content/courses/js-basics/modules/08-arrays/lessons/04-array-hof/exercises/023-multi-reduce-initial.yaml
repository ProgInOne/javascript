id: js-basics.arrays.array-hof.multi-reduce-initial
type: mcq_multi
difficulty: 4
concepts:
  - { id: js.arr.reduce, weight: 1 }
tags: [reduce, initial-value, empty-array, typeerror]
estimatedSeconds: 220
prompt: |
  `reduce`의 초기값에 대한 설명으로 맞는 것을 모두 고르세요.
spec:
  options:
    - id: a
      text: "`[].reduce((acc, n) => acc + n, 0)`의 결과는 `0`이다"
    - id: b
      text: "`[].reduce((acc, n) => acc + n)`을 실행하면 `TypeError`가 난다"
      missedMisconception: js.mc.reduce-initial-optional-safe
    - id: c
      text: "`[7].reduce((acc, n) => acc + n)`은 콜백을 한 번도 부르지 않고 `7`을 돌려준다"
      missedMisconception: js.mc.reduce-initial-optional-safe
    - id: d
      text: "`[1, 2, 3].reduce((acc, n) => acc + n * 2)`의 결과는 `12`다"
      misconception: js.mc.reduce-initial-optional-safe
      rationale: 초기값이 없으면 첫 요소 1이 그대로 누적값이 되고 2와 3만 두 배가 돼요. 1 + 4 + 6 = 11이에요.
    - id: e
      text: "`[1, 2, 3].reduce((acc, n) => acc + n)`은 초기값이 없어서 `NaN`이다"
      rationale: 초기값이 없으면 첫 요소 1이 초기값이 되어 1 + 2 + 3 = 6이에요. 합계는 우연히 초기값 0일 때와 같아요.
    - id: f
      text: 초기값을 생략하면 첫 콜백의 누적값은 `0`이다
      misconception: js.mc.reduce-initial-optional-safe
      rationale: 초기값을 생략하면 0이 아니라 배열의 첫 요소가 누적값이 되고, 콜백은 두 번째 요소부터 불려요.
  correct: [a, b, c]
misconceptions: [js.mc.reduce-initial-optional-safe]
hints:
  - 초기값을 생략하면 무엇이 첫 누적값이 되고, 콜백은 몇 번째 요소부터 불리나요?
  - 요소가 하나뿐이거나 하나도 없으면, 초기값이 없을 때 누적값으로 쓸 것이 남아 있나요?
  - 콜백이 요소를 가공(두 배 등)한다면, 초기값으로 쓰인 첫 요소도 가공될까요? 계산해서 비교해 보세요.
explanation: |
  맞는 설명은 세 가지예요.

  - **`[]`에 초기값 `0`**: 콜백이 한 번도 불리지 않고 초기값 `0`이 그대로 결과예요.
  - **`[]`에 초기값 없음**: 첫 누적값으로 쓸 요소가 없어서 `TypeError: Reduce of empty array with no initial value`가 나요.
  - **`[7]`에 초기값 없음**: 첫 요소 `7`이 초기값이 되고, 콜백을 부를 두 번째 요소가 없어서 `7`을 그대로 돌려줘요.

  틀린 설명:

  - `[1, 2, 3].reduce((acc, n) => acc + n * 2)`는 `12`가 아니라 `11`이에요. 첫 요소 1은 초기값으로 쓰여서 두 배가 되지 않아요. 초기값 `0`을 적으면 `12`예요.
  - `[1, 2, 3].reduce((acc, n) => acc + n)`은 `6`이에요. `NaN`이 아니에요.
  - 초기값을 생략하면 첫 누적값은 `0`이 아니라 배열의 첫 요소예요.

  그래서 초기값은 항상 적는 것이 안전해요.
