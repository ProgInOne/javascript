id: js-basics.arrays.array-hof.find-bug-filter-empty-check
type: find_bug_line
difficulty: 3
concepts:
  - { id: js.arr.filter, weight: 1 }
  - { id: js.conv.truthy-falsy, weight: 0.5 }
tags: [filter, empty-array, truthy, debugging]
estimatedSeconds: 130
prompt: |
  분식집 메뉴에서 검색어가 들어 있는 메뉴를 찾는 프로그램이에요. 메뉴에 없는 `피자`를 검색했는데 "검색 결과가 없어요"가 나오지 않아요. 원인이 되는 줄을 찾고, 왜 그런지도 고르세요.
spec:
  code: |-
    const menu = ["김밥", "라면", "떡볶이", "순대"];
    const keyword = "피자";
    const results = menu.filter((food) => food.includes(keyword));
    if (results) {
      console.log(`검색 결과: [${results.join(", ")}]`);
    } else {
      console.log("검색 결과가 없어요");
    }
  bugLines: [4]
  symptom: "`피자`는 메뉴에 없는데 `검색 결과: []`가 나와요."
  symptomCheck:
    console: ["검색 결과: []"]
  fixedCode: |-
    const menu = ["김밥", "라면", "떡볶이", "순대"];
    const keyword = "피자";
    const results = menu.filter((food) => food.includes(keyword));
    if (results.length > 0) {
      console.log(`검색 결과: [${results.join(", ")}]`);
    } else {
      console.log("검색 결과가 없어요");
    }
  causeOptions:
    - id: c1
      text: filter는 맞는 요소가 없으면 빈 배열을 돌려주는데, 빈 배열은 truthy라서 조건이 늘 참이 된다
      correct: true
    - id: c2
      text: filter는 맞는 요소가 없으면 undefined를 돌려주는데, if가 undefined를 참으로 읽었다
      misconception: js.mc.filter-empty-is-undefined
    - id: c3
      text: filter는 조건에 맞는 요소를 지우므로, 피자가 아닌 메뉴가 모두 지워졌다
      misconception: js.mc.filter-removes-matching
    - id: c4
      text: 3번 줄의 includes는 배열에만 쓸 수 있어서 food에서는 동작하지 않는다
hints:
  - 출력된 `[]`를 보세요. `results`에는 무엇이 들어 있나요?
  - "`if`는 조건의 값을 참·거짓으로 바꿔 판단해요. 모듈 3의 falsy 값 목록에 빈 배열이 있었나요?"
  - 조건은 "결과가 하나 이상 있는가?"를 물어야 해요. 배열에 요소가 몇 개 있는지 알려 주는 속성을 떠올려 보세요.
explanation: |
  원인은 **4번 줄**의 조건이에요.

  `filter`는 맞는 요소가 없으면 `undefined`가 아니라 빈 배열 `[]`을 돌려줘요(출력의 `[]`). 그런데 빈 배열은 **truthy**예요. falsy인 값은 `false`, `0`, `""`, `null`, `undefined`, `NaN`뿐이에요. 그래서 `if (results)`는 결과가 있든 없든 늘 참이에요.

  고친 조건은 `results.length > 0`이에요. 빈 배열의 길이는 0이라 거짓이 되고, "검색 결과가 없어요"가 나와요.

  - `filter`는 `undefined`를 돌려주지 않아요. 출력에 `[]`가 보였어요.
  - `filter`는 콜백이 참인 요소를 **남겨요.** 피자가 들어 있는 메뉴가 없어서 남은 것이 없을 뿐이에요.
  - 3번 줄의 `food.includes(keyword)`는 모듈 7에서 배운 문자열의 `includes`예요. 문자열에도 `includes`가 있어요.
origin: authored
review:
