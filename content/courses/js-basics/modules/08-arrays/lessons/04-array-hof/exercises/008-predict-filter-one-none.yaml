id: js-basics.arrays.array-hof.predict-filter-one-none
type: predict_output
difficulty: 3
concepts:
  - { id: js.arr.filter, weight: 1 }
  - { id: js.conv.truthy-falsy, weight: 0.5 }
tags: [filter, empty-array, truthy, length]
estimatedSeconds: 140
prompt: |
  예약 목록에서 이름을 찾는 코드예요. 실행하면 콘솔에 무엇이 출력될까요? 네 줄을 차례로 적어 보세요. 배열은 콘솔에 `["a", "b"]`처럼 보여요.
spec:
  lang: js
  code: |
    const bookings = ["민지", "서준", "하린"];
    const found = bookings.filter((name) => name === "서준");
    const missing = bookings.filter((name) => name === "지우");
    console.log(found);
    console.log(missing);
    console.log(missing.length);
    if (missing) {
      console.log("지우님 예약 있음");
    } else {
      console.log("지우님 예약 없음");
    }
  answerKind: console
  misconceptionByAnswer:
    "서준\nundefined\n0\n지우님 예약 없음": js.mc.filter-empty-is-undefined
    "[\"서준\"]\nundefined\n0\n지우님 예약 없음": js.mc.filter-empty-is-undefined
    "서준\n[]\n0\n지우님 예약 있음": js.mc.filter-returns-first
    "[\"서준\"]\n[]\n0\n지우님 예약 없음": js.mc.filter-empty-is-undefined
hints:
  - "`filter`는 맞는 요소가 하나여도, 하나도 없어도 같은 종류의 값을 돌려줘요. 그 종류가 무엇인가요?"
  - 빈 배열의 길이는 얼마인가요?
  - 모듈 3에서 배운 falsy 값 목록을 떠올려 보세요. 빈 배열은 그 목록에 있나요?
explanation: |
  출력은 다음과 같아요.

  ```text
  ["서준"]
  []
  0
  지우님 예약 있음
  ```

  - `found`: 맞는 요소가 하나뿐이어도 `filter`는 배열을 돌려줘요. `"서준"`이 아니라 `["서준"]`이에요.
  - `missing`: 맞는 요소가 없으면 `undefined`가 아니라 빈 배열 `[]`이에요. 길이는 0이에요.
  - `if (missing)`: 빈 배열은 **truthy**예요(falsy는 `false`, `0`, `""`, `null`, `undefined`, `NaN`뿐). 그래서 예약이 없는데도 "예약 있음"이 나와요.

  찾았는지는 `if (missing.length > 0)`처럼 길이로 확인해요.
