id: js-basics.arrays.array-hof.predict-map-original
type: predict_output
difficulty: 2
concepts:
  - { id: js.arr.map, weight: 1 }
  - { id: js.arr.mutating-vs-not, weight: 0.3 }
tags: [map, original-unchanged, index-param]
estimatedSeconds: 90
prompt: |
  실행하면 콘솔에 무엇이 출력될까요? 세 줄을 차례로 적어 보세요. 배열은 콘솔에 `[1, 2]`, `["a", "b"]`처럼 보여요.
spec:
  lang: js
  code: |
    const sizes = ["s", "m", "l"];
    const upper = sizes.map((size) => size.toUpperCase());
    console.log(sizes);
    console.log(upper);
    console.log(sizes.map((size, i) => i + size));
  answerKind: console
  misconceptionByAnswer:
    "[\"S\", \"M\", \"L\"]\n[\"S\", \"M\", \"L\"]\n[\"0S\", \"1M\", \"2L\"]": js.mc.map-mutates-original
    "[\"S\", \"M\", \"L\"]\n[\"S\", \"M\", \"L\"]\n[\"0s\", \"1m\", \"2l\"]": js.mc.map-mutates-original
hints:
  - 2번 줄의 `map`은 `sizes`를 직접 바꿀까요, 새 배열을 만들까요?
  - 콜백의 두 번째 매개변수 `i`에는 무엇이 들어오나요? 몇부터 시작하나요?
  - 숫자와 문자열을 `+`로 이으면 문자열이 돼요. 5번 줄의 `map`이 다루는 배열은 `sizes`예요.
explanation: |
  출력은 다음과 같아요.

  ```text
  ["s", "m", "l"]
  ["S", "M", "L"]
  ["0s", "1m", "2l"]
  ```

  - `map`은 원래 배열을 바꾸지 않아요. 그래서 3번 줄의 `sizes`는 처음 그대로 소문자예요. 대문자 배열은 `upper`에만 들어 있어요.
  - 5번 줄의 콜백은 `(size, i)`로 요소와 인덱스를 받아요. 인덱스는 0부터라서 `0 + "s"` → `"0s"`처럼 숫자가 문자열 앞에 붙어요.
  - 5번 줄도 `sizes`(소문자)를 바탕으로 해요. `upper`가 아니에요.
