prompt: |
  블로그 글에 붙인 태그를 사용자가 쉼표로 이어 입력해요. 입력은 대소문자와 공백이 뒤섞여 있고, 쉼표를 실수로 두 번 넣기도 해요. 입력 문자열 `input`과 찾을 태그 `tag`를 받아 요약 문자열을 돌려주는 함수 `tagSummary(input, tag)`를 완성하세요.

  - 태그는 쉼표(`,`)로 나뉘어요. 각 태그의 **앞뒤 공백은 무시**하고, **대소문자는 구별하지 않아요**(모두 소문자로 맞춰요).
  - 공백만 있거나 비어 있는 조각은 태그가 아니에요.
  - 찾을 태그 `tag`도 같은 방식으로 정리해서 비교해요. `tag`에는 비어 있지 않은 글자가 들어와요.
  - 돌려줄 값은 `"<정리한 tag> <일치하는 태그 수>개 / 전체 <태그 수>개"`예요.

  | 호출 | 돌려줄 값 |
  |---|---|
  | `tagSummary("JS, html ,js,, CSS ,Js", "js")` | `"js 3개 / 전체 5개"` |
  | `tagSummary("react,vue,", " VUE ")` | `"vue 1개 / 전체 2개"` |

  숨겨진 테스트는 다른 입력으로 확인해요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          function tagSummary(input, tag) {
            // 여기에 작성하세요
          }
  entry: tagSummary
  solution:
    files:
      - path: main.js
        content: |
          function tagSummary(input, tag) {
            const target = tag.trim().toLowerCase();
            const tags = input
              .split(",")
              .map((piece) => piece.trim().toLowerCase())
              .filter((piece) => piece !== "");
            const count = tags.reduce((acc, t) => {
              if (t === target) {
                return acc + 1;
              }
              return acc;
            }, 0);
            return `${target} ${count}개 / 전체 ${tags.length}개`;
          }
  checks:
    - { kind: call, id: basic, args: ["JS, html ,js,, CSS ,Js", "js"], expect: { equals: "js 3개 / 전체 5개" }, requirement: 태그 세기 }
    - { kind: call, id: messy-tag, args: ["react,vue,", " VUE "], expect: { equals: "vue 1개 / 전체 2개" }, requirement: 찾을 태그 정리 }
