misconceptions: [js.mc.chain-order-irrelevant, js.mc.filter-removes-matching, js.mc.split-result-is-string, js.mc.trim-removes-all-spaces]
hints:
  - 문자열을 조각 배열로 나누고, 조각마다 정리하고, 빈 조각을 빼고, 일치하는 것을 세는 순서로 단계를 나눠 보세요.
  - 빈 조각인지는 정리한 **뒤에** 확인해야 해요. `" "`는 정리하기 전에는 빈 문자열이 아니에요. 찾을 태그도 같은 정리를 거쳐야 비교할 수 있어요.
  - 전체 태그 수는 정리하고 빈 조각을 뺀 배열의 길이예요. 일치하는 수는 그 배열에서 따로 세요. 마지막에 템플릿 리터럴로 문장을 만들어요.
explanation: |
  예시 정답이에요.

  ```js
  function tagSummary(input, tag) {
    const target = tag.trim().toLowerCase();
    const tags = input
      .split(",")
      .map((piece) => piece.trim().toLowerCase())
      .filter((piece) => piece !== "");
    const count = tags.reduce((acc, t) => {
      if (t === target) {
        return acc + 1;
      }
      return acc;
    }, 0);
    return `${target} ${count}개 / 전체 ${tags.length}개`;
  }
  ```

  - **나누고 정리하기**: `split(",")`의 결과는 조각 배열이에요. 조각마다 `trim().toLowerCase()`로 정리하는 일은 "요소마다 바꾸기"라서 `map`이에요.
  - **순서**: 빈 조각 빼기(`filter`)는 정리한 **뒤에** 해요. 먼저 거르면 `"  "`처럼 공백만 있는 조각이 빈 문자열이 아니라서 남고, 정리한 뒤 `""`가 되어 전체 수에 섞여요.
  - **빈 입력**: `"".split(",")`는 빈 배열이 아니라 `[""]`예요. 빈 조각을 빼는 단계 덕분에 전체 0개가 돼요.
  - **세기**: `reduce`로 일치할 때만 1 늘린 값을 돌려줘요. `tags.filter((t) => t === target).length`로 세도 같아요. 태그 전체가 같아야 하므로 `includes`가 아니라 `===`로 비교해요. 그래서 `"ab"`와 `"a b"`는 `"a"`와 다른 태그예요.
  - **찾을 태그**: `tag`도 `trim().toLowerCase()`로 정리해야 `" VUE "`가 `"vue"`와 같아져요. 결과 문장에도 정리한 태그를 써요.
