id: js-basics.arrays.array-hof.fix-find-minus-one
type: fix_bug
difficulty: 3
concepts:
  - { id: js.arr.find, weight: 1 }
  - { id: js.control.if, weight: 0.3 }
tags: [find, undefined, not-found, debugging]
estimatedSeconds: 180
prompt: |
  오늘 들어온 주문 수량 목록에서 `limit`개 이상인 첫 대량 주문을 알려 주는 함수 `describeFirstBig(orders, limit)`예요. 대량 주문이 없을 때 결과가 이상해요. 고쳐 보세요.

  | 호출 | 돌려줄 값 |
  |---|---|
  | `describeFirstBig([3, 12, 20], 10)` | `"첫 대량 주문: 12개"` |
  | `describeFirstBig([3, 5], 10)` | `"대량 주문 없음"` |
spec:
  buggy:
    files:
      - path: main.js
        content: |
          function describeFirstBig(orders, limit) {
            const found = orders.find((count) => count >= limit);
            if (found !== -1) {
              return `첫 대량 주문: ${found}개`;
            }
            return "대량 주문 없음";
          }
  solution:
    files:
      - path: main.js
        content: |
          function describeFirstBig(orders, limit) {
            const found = orders.find((count) => count >= limit);
            if (found !== undefined) {
              return `첫 대량 주문: ${found}개`;
            }
            return "대량 주문 없음";
          }
  entry: describeFirstBig
  bugDescription: "`describeFirstBig([3, 5], 10)`가 `\"대량 주문 없음\"`이 아니라 `\"첫 대량 주문: undefined개\"`를 돌려줘요."
  checks:
    - { kind: call, id: found, args: [[3, 12, 20], 10], expect: { equals: "첫 대량 주문: 12개" }, requirement: 첫 대량 주문 알려 주기 }
    - { kind: call, id: not-found, args: [[3, 5], 10], expect: { equals: "대량 주문 없음" }, requirement: 없을 때 알려 주기, misconceptionIfFail: js.mc.find-not-found-minus-one }
    - kind: call
      id: empty
      visible: false
      description: 주문이 하나도 없으면 "대량 주문 없음"이어야 합니다.
      requirement: 없을 때 알려 주기
      args: [[], 5]
      expect: { equals: "대량 주문 없음" }
    - kind: call
      id: exact-limit
      visible: false
      description: 정확히 limit개인 주문도 대량 주문이고, 그중 첫 주문을 알려 줘야 합니다.
      requirement: 첫 대량 주문 알려 주기
      args: [[7, 30, 50], 30]
      expect: { equals: "첫 대량 주문: 30개" }
misconceptions: [js.mc.find-not-found-minus-one]
hints:
  - 대량 주문이 없을 때 `found`에는 어떤 값이 들어 있을까요? 결과 문자열 안에 힌트가 있어요.
  - "`find`가 못 찾았을 때 돌려주는 값과 `indexOf`가 못 찾았을 때 돌려주는 값은 같을까요?"
  - 3번 줄의 조건은 "못 찾음을 뜻하는 값과 다른가?"를 물어야 해요. 그 값을 `find`에 맞게 바꿔 보세요.
explanation: |
  `find`가 못 찾았을 때 `-1`을 돌려준다고 생각하고 쓴 코드예요.

  `-1`을 돌려주는 것은 인덱스를 찾는 `indexOf`와 `findIndex`예요. `find`는 요소를 돌려주는 메서드라서, 못 찾으면 `undefined`를 돌려줘요. 그래서 대량 주문이 없을 때 `found`는 `undefined`이고, `undefined !== -1`은 참이라 `"첫 대량 주문: undefined개"`가 만들어졌어요.

  고친 조건은 `found !== undefined`예요.

  `if (found)`로 써도 이 문제의 테스트는 통과해요. 다만 찾은 값이 `0`처럼 falsy인 수일 수 있는 상황에서는 찾았는데도 못 찾은 것으로 처리되므로, `undefined`와 직접 비교하는 습관을 권해요.
