id: js-basics.arrays.array-hof.predict-some-every-stop
type: predict_output
difficulty: 4
concepts:
  - { id: js.arr.some-every, weight: 1 }
  - { id: js.fn.callback, weight: 0.3 }
tags: [some, every, short-circuit, empty-array, trace]
estimatedSeconds: 220
prompt: |
  콜백 안에서 `console.log`로 어떤 요소를 확인하는지 출력하게 했어요. 실행하면 콘솔에 무엇이 출력될까요? 모든 줄을 차례로 적어 보세요.
spec:
  lang: js
  code: |
    const temps = [22, 35, 18, 40];
    const hot = temps.some((t) => {
      console.log(`some: ${t}`);
      return t >= 30;
    });
    console.log(hot);
    const allWarm = temps.every((t) => {
      console.log(`every: ${t}`);
      return t >= 20;
    });
    console.log(allWarm);
    console.log([].some((t) => t >= 30), [].every((t) => t >= 30));
  answerKind: console
  misconceptionByAnswer:
    "some: 22\nsome: 35\nsome: 18\nsome: 40\ntrue\nevery: 22\nevery: 35\nevery: 18\nevery: 40\nfalse\nfalse true": js.mc.every-empty-false
    "some: 22\nsome: 35\ntrue\nevery: 22\nevery: 35\nevery: 18\nfalse\nfalse false": js.mc.every-empty-false
    "some: 22\nsome: 35\n35\nevery: 22\nevery: 35\nevery: 18\nfalse\nfalse true": js.mc.some-returns-element
hints:
  - "`some`은 결과가 `true`로 정해지는 순간 멈춰요. 어느 요소에서 정해지나요?"
  - "`every`는 결과가 `false`로 정해지는 순간 멈춰요. 20보다 작은 첫 요소는 무엇인가요?"
  - 빈 배열에서는 콜백이 한 번도 불리지 않아요. 그때 `some`은 "맞는 요소를 찾았나?", `every`는 "틀린 요소를 찾았나?"를 기준으로 답해요.
explanation: |
  출력은 다음과 같아요.

  ```text
  some: 22
  some: 35
  true
  every: 22
  every: 35
  every: 18
  false
  false true
  ```

  - `some`: 22는 30 미만이라 계속, 35에서 참이 나와 결과가 `true`로 정해져요. 그래서 18과 40에는 콜백을 부르지 않아요.
  - `every`: 22와 35는 20 이상이라 계속, 18에서 거짓이 나와 결과가 `false`로 정해져요. 40에는 콜백을 부르지 않아요.
  - `some`과 `every`는 찾은 요소가 아니라 `true`/`false`를 돌려줘요.
  - 빈 배열: 콜백이 한 번도 불리지 않아요. `some`은 맞는 요소를 못 찾았으니 `false`, `every`는 틀린 요소를 못 찾았으니 `true`예요.
origin: authored
