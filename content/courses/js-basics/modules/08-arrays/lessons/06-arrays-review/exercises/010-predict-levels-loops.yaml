id: js-basics.arrays.arrays-review.predict-levels-loops
type: predict_output
difficulty: 3
concepts:
  - { id: js.arr.for-of, weight: 1 }
  - { id: js.loops.accumulator-pattern, weight: 0.3 }
tags: [for-of, for-in, loop-variable, trace, assessment]
estimatedSeconds: 140
usage: assessment
prompt: |
  게임 단계별 별 개수 배열을 두 가지 반복으로 다뤄요. 실행하면 콘솔에 무엇이 출력될까요? 세 줄을 차례로 적어 보세요. 배열은 콘솔에 `[1, 2]`처럼 보여요.
spec:
  lang: js
  code: |
    const levels = [3, 5, 8];
    let text = "";
    for (const i in levels) {
      text += i + ",";
    }
    let sum = 0;
    for (let n of levels) {
      n = n * 2;
      sum += n;
    }
    console.log(text);
    console.log(sum);
    console.log(levels);
  answerKind: console
  misconceptionByAnswer:
    "3,5,8,\n32\n[6, 10, 16]": js.mc.for-in-array-values
    "3,5,8,\n32\n[3, 5, 8]": js.mc.for-in-array-values
    "0,1,2,\n32\n[6, 10, 16]": js.mc.for-of-var-updates-array
    "0,1,2,\n6\n[3, 5, 8]": js.mc.for-of-gives-index
misconceptions: [js.mc.for-in-array-values, js.mc.for-of-var-updates-array, js.mc.for-of-gives-index]
hints:
  - 두 반복이 꺼내 주는 것이 다르다는 점에 주의하세요. 하나는 `in`, 하나는 `of`예요.
  - 회차마다 `i`와 `n`에 무엇이 들어오는지 표로 적어 보세요. `n = n * 2`가 바꾸는 것은 변수인가요, 배열의 칸인가요?
  - "`for...in`이 배열에서 꺼내는 값의 자료형도 생각해 보세요. 그 값에 `\",\"`를 이으면 어떻게 되나요?"
explanation: |
  출력은 다음과 같아요.

  ```text
  0,1,2,
  32
  [3, 5, 8]
  ```

  - 첫 번째 반복은 `for...in`이에요. 배열에서 `for...in`은 요소가 아니라 인덱스를 문자열(`"0"`, `"1"`, `"2"`)로 꺼내요. 그래서 `text`는 `"0,1,2,"`예요. 값 `3,5,8,`이 나온다고 봤다면 `for...in`으로 배열의 값을 돈다고 생각한 거예요.
  - 두 번째 반복은 `for...of`예요. `n`에는 요소 3, 5, 8이 차례로 들어오고, 두 배 한 값 6, 10, 16을 더해 `sum`은 32예요. 인덱스 0, 1, 2가 들어온다고 봤다면 합을 0 + 2 + 4 = 6으로 계산했을 거예요. `for...of`는 인덱스가 아니라 요소를 꺼내요.
  - `n = n * 2`는 반복 변수 `n`에만 새 값을 넣어요. 배열의 칸은 바뀌지 않으므로 `levels`는 `[3, 5, 8]` 그대로예요. 배열의 요소를 바꾸려면 `levels[i] = …`처럼 인덱스로 대입해야 해요.
