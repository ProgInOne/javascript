id: js-basics.arrays.arrays-review.find-bug-shipping-copy
type: find_bug_line
difficulty: 3
concepts:
  - { id: js.arr.mutating-vs-not, weight: 1 }
  - { id: js.arr.element-update, weight: 0.3 }
  - { id: js.fn.params-args, weight: 0.3 }
tags: [mutation, function-argument, element-update, debugging, assessment]
estimatedSeconds: 120
usage: assessment
prompt: |
  온라인 꽃집에서 배송비 3000원을 더한 가격을 보여 주고, 아래에 원래 가격도 함께 보여 주려는 프로그램이에요. 그런데 원래 가격까지 3000원씩 올라가 있어요. 원인이 되는 줄을 찾고, 왜 그런지도 고르세요.
spec:
  code: |-
    const base = [12000, 8000, 5000];
    function withShipping(list) {
      for (let i = 0; i < list.length; i++) {
        list[i] = list[i] + 3000;
      }
      return list;
    }
    const shipped = withShipping(base);
    console.log("배송비 포함: " + shipped.join(", "));
    console.log("원래 가격: " + base.join(", "));
  bugLines: [4]
  symptom: "두 번째 줄이 `원래 가격: 12000, 8000, 5000`이 아니라 `원래 가격: 15000, 11000, 8000`으로 나와요."
  symptomCheck:
    console: ["배송비 포함: 15000, 11000, 8000", "원래 가격: 15000, 11000, 8000"]
  fixedCode: |-
    const base = [12000, 8000, 5000];
    function withShipping(list) {
      return list.map((price) => price + 3000);
    }
    const shipped = withShipping(base);
    console.log("배송비 포함: " + shipped.join(", "));
    console.log("원래 가격: " + base.join(", "));
  causeOptions:
    - id: c1
      text: list는 base와 같은 배열이라서, list[i]에 대입하면 base의 요소가 바뀐다
      correct: true
    - id: c2
      text: join이 배열을 문자열로 바꾸면서 각 요소에 3000을 더한다
      misconception: js.mc.non-mutating-method-changes-original
    - id: c3
      text: 함수 안의 list는 복사본이지만, return list를 만나면 바뀐 값이 base로 다시 복사된다
      misconception: js.mc.function-arg-array-copied
misconceptions: [js.mc.function-arg-array-copied, js.mc.non-mutating-method-changes-original]
hints:
  - "`withShipping(base)`를 부르면 매개변수 `list`에는 무엇이 들어오나요? 새 배열인가요, `base` 그 자체인가요?"
  - 함수 안에서 원래 배열을 바꾸는 코드가 있는 줄을 찾아보세요. `join`은 배열을 바꾸는 메서드였나요?
  - 원래 배열은 그대로 두고 새 배열을 돌려주려면, 바꾼 값을 어디에 담아야 하는지 생각해 보세요.
explanation: |
  원인은 **4번 줄** `list[i] = list[i] + 3000;`이에요.

  - 배열을 함수에 넘기면 복사본이 아니라 **같은 배열**이 넘어가요. `list`와 `base`는 이름만 다르고 같은 배열을 가리켜요.
  - 4번 줄은 인덱스에 대입해서 그 배열의 요소를 직접 바꿔요. 그래서 함수가 끝난 뒤 `base`도 `[15000, 11000, 8000]`이 돼요. `shipped`와 `base`가 같은 배열이라 두 줄이 똑같이 나와요.
  - 원본을 지키려면 바꾼 값을 새 배열에 담아 돌려줘요. 예를 들어 `return list.map((price) => price + 3000);`은 새 배열을 만들고 `base`는 그대로 둬요.

  - `join`은 원래 배열을 바꾸지 않고 문자열을 새로 만들 뿐이에요.
  - "`list`는 복사본인데 `return` 때 다시 복사된다"는 이유도 틀렸어요. 처음부터 같은 배열이라 4번 줄이 실행되는 순간 `base`가 바뀌어요. `return`은 값을 돌려줄 뿐 무엇을 복사하지 않아요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
