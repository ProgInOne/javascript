id: js-basics.arrays.arrays-review.impl-longest-word
type: implement_function
difficulty: 2
concepts:
  - { id: js.arr.for-of, weight: 1 }
  - { id: js.loops.accumulator-pattern, weight: 0.3 }
tags: [for-of, max, string-length, write-code, assessment]
estimatedSeconds: 240
usage: assessment
prompt: |
  영어 단어장 앱이 오늘 외운 단어 중 가장 긴 단어를 보여 줘요. 단어 배열 `words`를 받아 **글자 수가 가장 많은 단어**를 돌려주는 함수 `longestWord(words)`를 완성하세요. `for...of`로 단어를 하나씩 꺼내 보면 쉽게 풀 수 있어요. 채점은 돌려준 값으로만 해요.

  ```js
  longestWord(["cat", "banana", "kiwi"]);  // "banana"
  longestWord(["red", "blue", "pink"]);    // "blue"
  ```

  - 글자 수가 같은 단어가 여럿이면 **먼저 나온** 단어를 돌려줘요.
  - 단어가 하나도 없으면 빈 문자열 `""`을 돌려줘요.
  - 받은 배열은 바꾸지 마세요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          function longestWord(words) {
            // for...of로 단어를 하나씩 꺼내 가장 긴 단어를 찾아 돌려주세요.
          }
  entry: longestWord
  solution:
    files:
      - path: main.js
        content: |
          function longestWord(words) {
            let longest = "";
            for (const word of words) {
              if (word.length > longest.length) {
                longest = word;
              }
            }
            return longest;
          }
  checks:
    - kind: call
      id: basic
      description: 가장 긴 단어 "banana"를 돌려줍니다.
      requirement: 가장 긴 단어
      args: [["cat", "banana", "kiwi"]]
      expect: { equals: "banana" }
    - kind: call
      id: tie-first
      description: 글자 수가 같으면 먼저 나온 단어를 돌려줍니다.
      requirement: 같으면 먼저 나온 단어
      args: [["red", "blue", "pink"]]
      expect: { equals: "blue" }
    - kind: call
      id: longest-last
      visible: false
      description: 가장 긴 단어가 맨 끝에 있어도 찾아야 합니다.
      requirement: 가장 긴 단어
      args: [["a", "to", "sun", "moon", "river"]]
      expect: { equals: "river" }
    - kind: call
      id: longest-first
      visible: false
      description: 가장 긴 단어가 맨 앞에 있어도 찾아야 합니다.
      requirement: 가장 긴 단어
      args: [["umbrella", "pen", "book"]]
      expect: { equals: "umbrella" }
    - kind: call
      id: tie-later
      visible: false
      description: 뒤에 같은 길이의 단어가 나와도 처음 찾은 단어를 지켜야 합니다.
      requirement: 같으면 먼저 나온 단어
      args: [["dog", "lemon", "grape", "melon"]]
      expect: { equals: "lemon" }
    - kind: call
      id: single
      visible: false
      description: 단어가 하나면 그 단어를 돌려줘야 합니다.
      requirement: 가장 긴 단어
      args: [["owl"]]
      expect: { equals: "owl" }
    - kind: call
      id: empty
      visible: false
      description: 단어가 없으면 빈 문자열을 돌려줘야 합니다.
      requirement: 빈 단어장
      args: [[]]
      expect: { equals: "" }
    - kind: call
      id: keep-input
      visible: false
      description: 받은 단어 배열을 바꾸면 안 됩니다.
      requirement: 원래 배열 지키기
      args: [["sky", "ocean", "sea"]]
      expect: { argsUnchanged: true }
misconceptions: [js.mc.for-of-gives-index, js.mc.accumulator-reset-in-loop]
hints:
  - 지금까지 찾은 가장 긴 단어를 기억할 변수가 필요해요. 반복 바깥에서, 단어가 없을 때 돌려줄 값으로 시작하세요.
  - "`for...of`의 변수에는 단어 자체가 들어와요. 그 단어의 길이를 기억해 둔 단어의 길이와 비교하세요."
  - 길이가 같을 때 바꾸면 나중에 나온 단어가 남아요. 비교 연산자를 무엇으로 써야 먼저 나온 단어가 지켜질지 생각해 보세요.
explanation: |
  예시 정답이에요.

  ```js
  function longestWord(words) {
    let longest = "";
    for (const word of words) {
      if (word.length > longest.length) {
        longest = word;
      }
    }
    return longest;
  }
  ```

  - `longest`를 반복 바깥에서 `""`로 시작하면, 단어가 없을 때 그대로 `""`이 반환되고, 첫 단어는 길이가 1 이상이라 바로 `longest`가 돼요.
  - `for...of`는 단어 자체를 꺼내 주므로 `word.length`로 바로 길이를 비교할 수 있어요.
  - `>`로 비교해야 길이가 같을 때 바꾸지 않아서 먼저 나온 단어가 남아요. `>=`로 쓰면 `["red", "blue", "pink"]`에서 `"pink"`가 나와요.
  - `let longest = "";`를 반복 안에 쓰면 회차마다 새로 만들어져 앞에서 찾은 단어를 잊고, 반복 밖의 `return longest;`에서는 그 변수를 쓸 수도 없어요(`ReferenceError`).
  - 인덱스를 쓰는 `for` 반복이나 `forEach`로 풀어도 결과가 같으면 통과해요. `for...of`는 인덱스가 필요 없을 때 가장 짧게 쓸 수 있어요.
