id: js-basics.arrays.arrays-review.impl-tank-check
type: implement_function
difficulty: 4
concepts:
  - { id: js.arr.some-every, weight: 1 }
  - { id: js.arr.filter, weight: 0.3 }
  - { id: js.control.else-if, weight: 0.3 }
tags: [every, some, filter, empty-array, boundary, write-code, assessment]
estimatedSeconds: 360
usage: assessment
prompt: |
  수족관의 수조 온도 점검 함수 `checkTanks(temps, min, max)`를 완성하세요. `temps`는 수조마다 잰 온도(정수) 배열이고, 알맞은 온도는 `min` 이상 `max` 이하예요. 다음 문자열 중 하나를 돌려줘요.

  | 상황 | 돌려줄 값 |
  |---|---|
  | 수조가 하나도 없음(빈 배열) | `"수조 없음"` |
  | 모든 수조가 알맞은 온도 | `"정상"` |
  | 알맞지 않은 수조가 있음 | `"점검 필요: N개"` (N은 알맞지 않은 수조 수) |

  ```js
  checkTanks([24, 25, 26], 24, 26);  // "정상"
  checkTanks([23, 25, 28], 24, 26);  // "점검 필요: 2개"
  ```

  - 받은 배열은 바꾸지 마세요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          function checkTanks(temps, min, max) {
            // 표의 세 가지 상황 중 하나를 문자열로 돌려주세요.
          }
  entry: checkTanks
  solution:
    files:
      - path: main.js
        content: |
          function checkTanks(temps, min, max) {
            if (temps.length === 0) {
              return "수조 없음";
            }
            if (temps.every((t) => t >= min && t <= max)) {
              return "정상";
            }
            const bad = temps.filter((t) => t < min || t > max);
            return "점검 필요: " + bad.length + "개";
          }
  checks:
    - kind: call
      id: all-ok
      description: 경계값을 포함해 모두 알맞으면 "정상"입니다.
      requirement: 모두 알맞으면 정상
      args: [[24, 25, 26], 24, 26]
      expect: { equals: "정상" }
    - kind: call
      id: two-bad
      description: '낮은 수조와 높은 수조가 하나씩 있으면 "점검 필요: 2개"입니다.'
      requirement: 알맞지 않은 수조 세기
      args: [[23, 25, 28], 24, 26]
      expect: { equals: "점검 필요: 2개" }
    - kind: call
      id: empty
      visible: false
      description: 수조가 없으면 "정상"이 아니라 "수조 없음"이어야 합니다.
      requirement: 빈 수조 목록
      args: [[], 20, 30]
      expect: { equals: "수조 없음" }
      misconceptionIfFail: js.mc.every-empty-false
    - kind: call
      id: boundary-ok
      visible: false
      description: 온도가 min이나 max와 같으면 알맞은 온도로 봐야 합니다.
      requirement: 모두 알맞으면 정상
      args: [[18, 22, 22, 18], 18, 22]
      expect: { equals: "정상" }
    - kind: call
      id: one-bad-last
      visible: false
      description: 마지막 수조 하나만 알맞지 않아도 찾아내야 합니다.
      requirement: 알맞지 않은 수조 세기
      args: [[27, 27, 27, 31], 26, 30]
      expect: { equals: "점검 필요: 1개" }
    - kind: call
      id: all-bad
      visible: false
      description: 모든 수조가 알맞지 않으면 전체 수를 세어야 합니다.
      requirement: 알맞지 않은 수조 세기
      args: [[10, 40, 5], 20, 25]
      expect: { equals: "점검 필요: 3개" }
    - kind: call
      id: single-ok
      visible: false
      description: 수조가 하나뿐이어도 알맞으면 "정상"이어야 합니다.
      requirement: 모두 알맞으면 정상
      args: [[15], 15, 15]
      expect: { equals: "정상" }
    - kind: call
      id: keep-input
      visible: false
      description: 받은 온도 배열을 바꾸면 안 됩니다.
      requirement: 원래 배열 지키기
      args: [[19, 26, 21], 20, 25]
      expect: { argsUnchanged: true }
misconceptions: [js.mc.every-empty-false, js.mc.some-returns-element]
hints:
  - 세 가지 상황을 어떤 순서로 확인할지 먼저 정하세요. 빈 배열은 다른 규칙에도 걸릴 수 있어요.
  - "\"모든 수조가 알맞은가\"는 배열 메서드 하나로 `true`/`false`를 얻을 수 있어요. 그 메서드가 빈 배열에서 무엇을 돌려주는지도 떠올려 보세요."
  - 알맞지 않은 수조의 **개수**가 필요해요. 그런 수조만 모은 새 배열을 만들면 개수는 어디서 얻을 수 있나요?
explanation: |
  예시 정답이에요.

  ```js
  function checkTanks(temps, min, max) {
    if (temps.length === 0) {
      return "수조 없음";
    }
    if (temps.every((t) => t >= min && t <= max)) {
      return "정상";
    }
    const bad = temps.filter((t) => t < min || t > max);
    return "점검 필요: " + bad.length + "개";
  }
  ```

  - 빈 배열을 **먼저** 확인해야 해요. 빈 배열의 `every`는 검사할 요소가 없어서 `true`를 돌려주므로, 순서를 바꾸면 수조가 없는데도 `"정상"`이 나와요.
  - `every`는 모든 요소가 조건을 만족할 때만 `true`예요. 경계값을 포함하려고 `>=`, `<=`를 써요.
  - 개수는 `filter`로 알맞지 않은 온도만 모은 뒤 `length`로 세요. `some`은 하나라도 있는지 `true`/`false`만 알려 주고 요소나 개수를 돌려주지 않아요.
  - `every`·`filter` 모두 원래 배열을 바꾸지 않아요.

  `every` 대신 `bad.length === 0`으로 "정상"을 판단해도 정답이에요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
