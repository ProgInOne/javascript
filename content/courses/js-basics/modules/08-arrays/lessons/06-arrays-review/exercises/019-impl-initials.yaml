id: js-basics.arrays.arrays-review.impl-initials
type: implement_function
difficulty: 3
concepts:
  - { id: js.arr.reduce, weight: 1 }
  - { id: js.str.case-trim, weight: 0.3 }
  - { id: js.str.index-length, weight: 0.3 }
tags: [reduce, initial-value, string, write-code, assessment]
estimatedSeconds: 240
usage: assessment
prompt: |
  동아리 이름표에 팀원 이름의 첫 글자를 모은 팀 약자를 새겨요. 영어 이름 배열 `names`를 받아 **이름마다 첫 글자를 대문자로 바꿔 순서대로 이은 문자열**을 돌려주는 함수 `teamCode(names)`를 `reduce`로 완성하세요.

  ```js
  teamCode(["kim", "lee", "park"]);  // "KLP"
  teamCode([]);                      // ""
  ```

  - 이름은 대문자로 시작할 수도, 소문자로 시작할 수도 있어요.
  - 이름이 하나도 없으면 빈 문자열 `""`을 돌려줘요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          function teamCode(names) {
            // reduce로 이름마다 첫 글자를 대문자로 바꿔 이어 붙여 돌려주세요.
          }
  entry: teamCode
  solution:
    files:
      - path: main.js
        content: |
          function teamCode(names) {
            return names.reduce((code, name) => code + name[0].toUpperCase(), "");
          }
  checks:
    - kind: call
      id: basic
      description: 세 이름의 첫 글자를 대문자로 이어 "KLP"를 돌려줍니다.
      requirement: 첫 글자 모으기
      args: [["kim", "lee", "park"]]
      expect: { equals: "KLP" }
    - kind: call
      id: empty
      description: 이름이 없으면 빈 문자열입니다.
      requirement: 빈 명단
      args: [[]]
      expect: { equals: "" }
      misconceptionIfFail: js.mc.reduce-initial-optional-safe
    - kind: call
      id: single
      visible: false
      description: 이름이 하나면 그 이름의 첫 글자 하나만 대문자로 돌려줘야 합니다(이름 전체가 아님).
      requirement: 첫 글자 모으기
      args: [["ocean"]]
      expect: { equals: "O" }
      misconceptionIfFail: js.mc.reduce-initial-optional-safe
    - kind: call
      id: mixed-case
      visible: false
      description: 대문자로 시작하는 이름과 소문자로 시작하는 이름이 섞여 있어도 모두 대문자 첫 글자가 되어야 합니다.
      requirement: 첫 글자 모으기
      args: [["Jin", "soo", "Han", "yu"]]
      expect: { equals: "JSHY" }
    - kind: call
      id: keep-input
      visible: false
      description: 받은 이름 배열을 바꾸면 안 됩니다.
      requirement: 원래 배열 지키기
      args: [["mina", "dan"]]
      expect: { argsUnchanged: true }
misconceptions: [js.mc.reduce-initial-optional-safe, js.mc.reduce-callback-no-return]
hints:
  - 누적값은 지금까지 모은 약자(문자열)예요. 이름이 없을 때 돌려줄 값이 무엇인지 생각해 초기값을 정하세요.
  - 콜백은 (누적값, 이름)을 받아 **다음 누적값**을 돌려줘요. 이름의 첫 글자는 인덱스로 꺼낼 수 있어요.
  - 초기값을 빼면 첫 회차의 누적값이 무엇이 되는지 따져 보세요. 이름이 하나뿐일 때 콜백은 몇 번 불리나요?
explanation: |
  예시 정답이에요.

  ```js
  function teamCode(names) {
    return names.reduce((code, name) => code + name[0].toUpperCase(), "");
  }
  ```

  - 누적값 `code`는 지금까지 모은 약자예요. 초기값 `""`에서 시작해, 이름마다 `name[0].toUpperCase()`를 이어 붙인 새 문자열을 돌려줘요.
  - 초기값 `""`이 꼭 필요해요. 빼면 첫 이름 전체(`"kim"`)가 처음 누적값이 되어 `"kimLP"`가 나오고, 이름이 하나면 콜백이 한 번도 불리지 않아 `"ocean"`이 그대로 나와요. 빈 배열이면 `TypeError`가 나요.
  - 콜백을 중괄호로 쓴다면 `return code + …;`처럼 누적값을 꼭 돌려줘야 해요. 돌려주지 않으면 다음 회차의 누적값이 `undefined`가 돼요.
  - `reduce`와 `toUpperCase`는 원래 배열과 문자열을 바꾸지 않아요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
