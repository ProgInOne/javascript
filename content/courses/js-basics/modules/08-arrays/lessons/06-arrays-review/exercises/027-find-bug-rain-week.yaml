id: js-basics.arrays.arrays-review.find-bug-rain-week
type: find_bug_line
difficulty: 3
concepts:
  - { id: js.arr.some-every, weight: 1 }
  - { id: js.arr.filter, weight: 0.3 }
tags: [some, every, filter, debugging, assessment]
estimatedSeconds: 120
usage: assessment
prompt: |
  이번 주 요일별 비 올 확률(%)을 보고, 확률이 60% 이상인 날이 **하루라도** 있으면 우산을 챙기라고 알려 주는 프로그램이에요. 그런데 출력이 서로 맞지 않아요. 원인이 되는 줄을 찾고, 왜 그런지도 고르세요.
spec:
  code: |-
    const rainChance = [10, 30, 80, 20, 0];
    const rainyDays = rainChance.filter((p) => p >= 60).length;
    const needUmbrella = rainChance.every((p) => p >= 60);
    console.log("비 올 확률 60% 이상인 날: " + rainyDays + "일");
    if (needUmbrella) {
      console.log("이번 주는 우산을 챙기세요");
    } else {
      console.log("이번 주는 우산이 필요 없어요");
    }
  bugLines: [3]
  symptom: "`비 올 확률 60% 이상인 날: 1일` 다음에 `이번 주는 우산이 필요 없어요`가 출력돼요."
  symptomCheck:
    console: ["비 올 확률 60% 이상인 날: 1일", "이번 주는 우산이 필요 없어요"]
  fixedCode: |-
    const rainChance = [10, 30, 80, 20, 0];
    const rainyDays = rainChance.filter((p) => p >= 60).length;
    const needUmbrella = rainChance.some((p) => p >= 60);
    console.log("비 올 확률 60% 이상인 날: " + rainyDays + "일");
    if (needUmbrella) {
      console.log("이번 주는 우산을 챙기세요");
    } else {
      console.log("이번 주는 우산이 필요 없어요");
    }
  causeOptions:
    - id: c1
      text: every는 모든 요소가 조건에 맞아야 true인데, 60 이상인 날은 하루뿐이라 false가 됐다. 하루라도 맞는지 확인하려면 some을 써야 한다
      correct: true
    - id: c2
      text: 2번 줄의 filter가 rainChance에서 60 이상인 80을 빼 버려서, 3번 줄이 확인할 때는 맞는 요소가 남아 있지 않았다
      misconception: js.mc.non-mutating-method-changes-original
    - id: c3
      text: every는 조건에 맞는 요소 80을 돌려주는데, if 조건에는 true나 false만 쓸 수 있어서 else로 갔다
      misconception: js.mc.some-returns-element
misconceptions: [js.mc.non-mutating-method-changes-original, js.mc.some-returns-element]
hints:
  - 요구사항은 "하루라도 있으면"이에요. 코드가 실제로 확인하는 것은 "하루라도"인가요, "모든 날"인가요?
  - "`every`와 `some`이 각각 언제 `true`를 돌려주는지 떠올려 보세요. `filter`는 원래 배열을 바꾸나요?"
  - 3번 줄의 결과를 직접 계산해 보세요. `10 >= 60`부터 확인하면 `every`는 몇 번째 요소에서 답을 정하나요?
explanation: |
  원인은 **3번 줄**의 `every`예요.

  - `every`는 **모든** 요소가 조건에 맞아야 `true`예요. 첫 요소 `10`이 이미 60 미만이라 바로 `false`가 되고, `else` 쪽 문구가 나와요.
  - 요구사항은 "하루라도 60% 이상"이므로 하나라도 맞으면 `true`인 `some`을 써야 해요. `some`으로 고치면 `80`에서 `true`가 되어 "우산을 챙기세요"가 나와요.

  - "`filter`가 80을 빼 버렸다"는 이유는 틀렸어요. `filter`는 조건에 맞는 요소로 **새 배열**을 만들 뿐, `rainChance`는 그대로예요. 그래서 2번 줄은 `1일`을 맞게 셌어요.
  - "`every`가 요소 80을 돌려준다"도 틀렸어요. `some`과 `every`는 항상 `true`나 `false`만 돌려줘요. 찾은 요소가 필요하면 `find`를 써요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
