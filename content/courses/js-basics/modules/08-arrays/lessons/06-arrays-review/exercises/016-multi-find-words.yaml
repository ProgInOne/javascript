id: js-basics.arrays.arrays-review.multi-find-words
type: mcq_multi
difficulty: 3
concepts:
  - { id: js.arr.find, weight: 1 }
  - { id: js.arr.filter, weight: 0.3 }
  - { id: js.arr.includes-indexof, weight: 0.3 }
tags: [find, filter, findIndex, return-type, assessment]
estimatedSeconds: 150
usage: assessment
prompt: |
  `const words = ["sun", "moon", "star", "sky"];`가 있어요. 아래 식 중 결과가 **문자열 `"moon"`** 인 것을 모두 고르세요.
spec:
  options:
    - id: a
      text: "`words.find((w) => w.length === 4)`"
      missedMisconception: js.mc.find-returns-all
    - id: b
      text: "`words.find((w) => w[0] === \"m\")`"
    - id: c
      text: "`words[words.indexOf(\"moon\")]`"
    - id: d
      text: "`words.filter((w) => w.length === 4)`"
      misconception: js.mc.filter-returns-first
      rationale: filter는 조건에 맞는 요소를 모두 담은 배열 ["moon", "star"]을 돌려줘요.
    - id: e
      text: "`words.findIndex((w) => w === \"moon\")`"
      rationale: findIndex는 요소가 아니라 그 요소의 인덱스 1을 돌려줘요.
    - id: f
      text: "`words.find((w) => w.length > 4)`"
      rationale: 네 글자보다 긴 단어가 없어서 find는 undefined를 돌려줘요.
  correct: [a, b, c]
misconceptions: [js.mc.find-returns-all, js.mc.filter-returns-first]
hints:
  - 식마다 돌려주는 값의 **종류**부터 정해 보세요. 요소 하나인가요, 배열인가요, 수인가요?
  - "`find`는 조건에 맞는 요소를 몇 개 돌려주나요? 네 글자인 단어가 둘일 때는 어느 쪽인가요?"
  - 조건에 맞는 요소가 하나도 없을 때 `find`가 돌려주는 값과, 위치를 돌려주는 메서드의 결과도 확인해 보세요.
explanation: |
  결과가 `"moon"`인 식은 세 개예요.

  - `words.find((w) => w.length === 4)`: 네 글자 단어는 `"moon"`과 `"star"` 둘이지만, `find`는 **처음** 맞는 요소 하나만 돌려줘요. 그래서 `"moon"`이에요. 맞는 요소를 모두 돌려준다고 생각하면 이 식을 놓치기 쉬워요.
  - `words.find((w) => w[0] === "m")`: 첫 글자가 `m`인 첫 단어 `"moon"`이에요.
  - `words[words.indexOf("moon")]`: `indexOf`가 1을 돌려주고, `words[1]`은 `"moon"`이에요.

  나머지는 `"moon"`이 아니에요.

  - `words.filter((w) => w.length === 4)`는 맞는 요소를 **모두** 담은 배열 `["moon", "star"]`이에요. 문자열이 아니에요.
  - `words.findIndex((w) => w === "moon")`은 위치 `1`이에요. 요소가 필요하면 `find`, 위치가 필요하면 `findIndex`·`indexOf`예요.
  - `words.find((w) => w.length > 4)`는 맞는 단어가 없어서 `undefined`예요. `find`는 못 찾아도 `-1`이 아니라 `undefined`를 돌려줘요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
