id: js-basics.arrays.arrays-review.predict-rank-sort
type: predict_output
difficulty: 3
concepts:
  - { id: js.arr.sort, weight: 1 }
  - { id: js.arr.mutating-vs-not, weight: 0.3 }
tags: [sort, default-sort, same-array, trace, assessment]
estimatedSeconds: 140
usage: assessment
prompt: |
  게임 점수를 정렬해 저장하려는 코드예요. 실행하면 콘솔에 무엇이 출력될까요? 세 줄을 차례로 적어 보세요. 배열은 콘솔에 `[1, 2]`처럼 보여요.
spec:
  lang: js
  code: |
    const ranks = [25, 3, 100, 42];
    const sorted = ranks.sort();
    ranks.push(1);
    console.log(sorted);
    console.log(ranks[0]);
    console.log(sorted.length);
  answerKind: console
  misconceptionByAnswer:
    "[3, 25, 42, 100, 1]\n3\n5": js.mc.sort-numeric-default
    "[3, 25, 42, 100]\n25\n4": js.mc.sort-returns-new-array
    "[100, 25, 3, 42]\n25\n4": js.mc.sort-returns-new-array
misconceptions: [js.mc.sort-numeric-default, js.mc.sort-returns-new-array]
hints:
  - "`sort()`에 비교 함수가 없으면 요소를 무엇으로 바꿔서 비교하나요?"
  - "`25`, `3`, `100`, `42`를 글자로 보고 사전에서처럼 첫 글자부터 비교해 보세요."
  - "`sort`가 돌려주는 배열은 새 배열인가요, `ranks` 자신인가요? 3번 줄의 `push`가 `sorted`에도 보일지 생각해 보세요."
explanation: |
  출력은 다음과 같아요.

  ```text
  [100, 25, 3, 42, 1]
  100
  5
  ```

  - `sort()`는 비교 함수가 없으면 요소를 **문자열로 바꿔 사전순**으로 정렬해요. `"100"`, `"25"`, `"3"`, `"42"`의 첫 글자 1 < 2 < 3 < 4 순서라 `[100, 25, 3, 42]`가 돼요. 크기 순 `[3, 25, 42, 100]`이 아니에요. 숫자를 크기 순으로 정렬하려면 `ranks.sort((a, b) => a - b)`처럼 비교 함수를 넘겨요.
  - `sort`는 원래 배열을 직접 정렬하고 **그 배열 자신**을 돌려줘요. `sorted`와 `ranks`는 같은 배열이라, 3번 줄에서 `ranks`에 넣은 `1`이 `sorted`에도 보이고 길이도 5예요.
  - `ranks[0]`도 정렬된 뒤의 첫 요소 `100`이에요. 원래 순서를 지키려면 `ranks.slice().sort(…)`처럼 복사본을 정렬해요.
