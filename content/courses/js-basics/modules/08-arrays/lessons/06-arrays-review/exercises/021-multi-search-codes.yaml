id: js-basics.arrays.arrays-review.multi-search-codes
type: mcq_multi
difficulty: 2
concepts:
  - { id: js.arr.includes-indexof, weight: 1 }
tags: [includes, indexOf, strict-match, assessment]
estimatedSeconds: 120
usage: assessment
prompt: |
  택배 보관함 코드 목록과 보관함 번호 목록이에요. 아래 식 중 결과가 `true`인 것을 모두 고르세요.
code: |
  const codes = ["A12", "B07", "C33"];
  const boxes = [10, 20, 30];
spec:
  options:
    - id: a
      text: '`codes.includes("B07")`'
    - id: b
      text: '`boxes.indexOf(30) === 2`'
    - id: c
      text: '`codes.indexOf("C33") > 0`'
    - id: d
      text: '`codes.includes("B")`'
      misconception: js.mc.array-includes-partial
      rationale: 배열의 includes는 요소 전체가 "B"와 같은지 봐요. "B07"의 일부 글자는 찾지 않아요.
    - id: e
      text: '`boxes.includes("20")`'
      misconception: js.mc.includes-loose-match
      rationale: includes는 자료형까지 같아야 찾아요. 문자열 "20"은 숫자 20과 다른 값이에요.
    - id: f
      text: '`codes.indexOf("A12") > 0`'
      rationale: "\"A12\"는 맨 앞에 있어서 indexOf가 0을 돌려줘요. 0 > 0은 false예요."
  correct: [a, b, c]
misconceptions: [js.mc.array-includes-partial, js.mc.includes-loose-match]
hints:
  - "`includes`는 `true`/`false`를, `indexOf`는 위치(없으면 `-1`)를 돌려줘요. 식마다 먼저 메서드의 결과를 구하세요."
  - 배열에서 찾을 때는 요소 **전체**를 비교해요. 요소의 일부 글자나 자료형이 다른 값도 같다고 볼까요?
  - "`indexOf`의 결과를 `> 0`과 비교하는 식은 맨 앞 요소에서 어떻게 되는지 확인해 보세요."
explanation: |
  `true`인 식은 세 개예요.

  - `codes.includes("B07")`: `"B07"`과 똑같은 요소가 있어서 `true`예요.
  - `boxes.indexOf(30) === 2`: 30은 인덱스 2에 있어서 `true`예요.
  - `codes.indexOf("C33") > 0`: `"C33"`은 인덱스 2라서 `2 > 0`이 `true`예요.

  `false`인 식:

  - `codes.includes("B")`: 배열의 `includes`는 요소 하나하나가 `"B"`와 **통째로** 같은지 봐요. 일부 글자를 찾는 것은 문자열의 `includes`예요(`"B07".includes("B")`는 `true`).
  - `boxes.includes("20")`: `includes`는 `===`처럼 자료형까지 비교해요. 숫자 20과 문자열 `"20"`은 달라서 `false`예요.
  - `codes.indexOf("A12") > 0`: `"A12"`는 인덱스 0이라 `0 > 0`은 `false`예요. 있는지 확인하려면 `> 0`이 아니라 `!== -1`(또는 `>= 0`)로 비교해야 해요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
