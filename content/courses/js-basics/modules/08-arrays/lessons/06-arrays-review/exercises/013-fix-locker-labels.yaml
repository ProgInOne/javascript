id: js-basics.arrays.arrays-review.fix-locker-labels
type: fix_bug
difficulty: 3
concepts:
  - { id: js.arr.map, weight: 1 }
  - { id: js.arr.filter, weight: 0.5 }
  - { id: js.arr.chaining, weight: 0.3 }
tags: [map, filter, chaining, debugging, assessment]
estimatedSeconds: 240
usage: assessment
prompt: |
  헬스장 사물함 사용 기록이에요. 배열에는 사물함 번호가 들어 있고, `0`은 아무도 쓰지 않은 칸이에요. 쓰고 있는 사물함만 골라 안내 문구 배열을 돌려주는 함수 `lockerLabels(nums)`를 만들었는데, 결과가 이상해요. 고쳐 보세요.

  | 호출 | 돌려줄 값 |
  |---|---|
  | `lockerLabels([3, 0, 8])` | `["3번 사물함", "8번 사물함"]` |
  | `lockerLabels([0, 0])` | `[]` |

  받은 배열은 바꾸지 말고, 결과는 새 배열로 돌려줘요.
spec:
  buggy:
    files:
      - path: main.js
        content: |
          function lockerLabels(nums) {
            return nums.map((n) => {
              if (n !== 0) {
                return n + "번 사물함";
              }
            });
          }
  solution:
    files:
      - path: main.js
        content: |
          function lockerLabels(nums) {
            return nums.filter((n) => n !== 0).map((n) => n + "번 사물함");
          }
  entry: lockerLabels
  bugDescription: "`lockerLabels([3, 0, 8])`가 `[\"3번 사물함\", undefined, \"8번 사물함\"]`을 돌려줘요."
  bugMisconception: js.mc.map-can-skip-items
  checks:
    - kind: call
      id: basic
      description: 쓰고 있는 사물함 3번과 8번의 안내 문구만 담겨야 합니다.
      requirement: 쓰는 사물함만 안내
      args: [[3, 0, 8]]
      expect: { equals: ["3번 사물함", "8번 사물함"] }
      misconceptionIfFail: js.mc.map-can-skip-items
    - kind: call
      id: all-empty
      description: 모두 빈 칸이면 빈 배열이어야 합니다.
      requirement: 쓰는 사물함만 안내
      args: [[0, 0]]
      expect: { equals: [] }
      misconceptionIfFail: js.mc.map-can-skip-items
    - kind: call
      id: zeros-around
      visible: false
      description: 앞뒤와 가운데에 빈 칸이 섞여 있어도 쓰는 사물함만 순서대로 담겨야 합니다.
      requirement: 쓰는 사물함만 안내
      args: [[0, 12, 0, 0, 5, 0]]
      expect: { equals: ["12번 사물함", "5번 사물함"] }
    - kind: call
      id: none-empty
      visible: false
      description: 빈 칸이 없으면 모든 사물함의 안내 문구가 담겨야 합니다.
      requirement: 쓰는 사물함만 안내
      args: [[21, 4]]
      expect: { equals: ["21번 사물함", "4번 사물함"] }
    - kind: call
      id: empty-input
      visible: false
      description: 기록이 없으면 빈 배열이어야 합니다.
      requirement: 쓰는 사물함만 안내
      args: [[]]
      expect: { equals: [] }
    - kind: call
      id: keep-input
      visible: false
      description: 받은 배열을 바꾸면 안 됩니다.
      requirement: 원래 배열 지키기
      args: [[7, 0, 9]]
      expect: { argsUnchanged: true }
misconceptions: [js.mc.map-can-skip-items, js.mc.map-callback-no-return]
hints:
  - "`map`이 돌려주는 배열의 길이는 원래 배열의 길이와 어떤 관계인가요?"
  - "`n`이 0인 회차에 콜백은 무엇을 돌려주나요? `return`을 만나지 않고 끝난 함수가 돌려주는 값을 떠올려 보세요."
  - 이 일은 "빈 칸 빼기"와 "문구로 바꾸기" 두 단계예요. 각 단계에 맞는 메서드를 하나씩 골라 이어 써 보세요.
explanation: |
  예시 정답이에요.

  ```js
  function lockerLabels(nums) {
    return nums.filter((n) => n !== 0).map((n) => n + "번 사물함");
  }
  ```

  - `map`은 요소마다 콜백의 반환값을 담아 **항상 원래와 같은 길이**의 새 배열을 만들어요. 요소를 뺄 수는 없어요.
  - 원래 코드에서 `n`이 0인 회차는 `if`에 들어가지 않아 `return`을 만나지 않고 끝나요. 그래서 그 자리에 `undefined`가 담겨 `["3번 사물함", undefined, "8번 사물함"]`이 돼요.
  - 요소를 고르는 일은 `filter`, 바꾸는 일은 `map`이 맡아요. `filter`로 0을 먼저 빼고, 남은 번호만 `map`으로 문구로 바꿔요. 두 메서드 모두 새 배열을 만들어서 `nums`는 그대로예요.
  - `map`을 먼저 하고 `filter`를 나중에 해도 고칠 수 있지만(`undefined`를 걸러 내기), 고르고 나서 바꾸는 순서가 더 읽기 쉬워요.
