id: js-basics.arrays.arrays-review.predict-pack-bag
type: predict_output
difficulty: 2
concepts:
  - { id: js.arr.push-pop, weight: 1 }
  - { id: js.loops.for, weight: 0.3 }
tags: [push, pop, return-value, empty-array, assessment]
estimatedSeconds: 110
usage: assessment
prompt: |
  소풍에서 돌아와 가방을 정리하는 코드예요. 가방에 모자를 넣은 뒤, 맨 위(배열의 끝)의 물건을 꺼내 정리함 `unpacked`에 넣는 일을 **네 번** 해요. 실행하면 콘솔에 무엇이 출력될까요? 두 줄을 차례로 적어 보세요. 배열은 콘솔에 `["a", "b"]`처럼 보여요.
spec:
  lang: js
  code: |
    const bag = ["물", "지도"];
    bag.push("모자");
    const unpacked = [];
    for (let i = 0; i < 4; i++) {
      unpacked.push(bag.pop());
    }
    console.log(unpacked);
    console.log(bag.length);
  answerKind: console
  misconceptionByAnswer:
    "[[\"물\", \"지도\"], [\"물\"], [], []]\n0": js.mc.pop-returns-rest
misconceptions: [js.mc.pop-returns-rest]
hints:
  - "`push`와 `pop`은 배열을 바꾸는 일과 값을 돌려주는 일을 함께 해요. `pop()`이 돌려주는 것은 무엇이고, `bag`은 어떻게 바뀌나요?"
  - 반복이 돌 때마다 `bag`과 `unpacked`가 어떻게 바뀌는지 표로 적어 보세요. 가방에는 물건이 몇 개 있고, 반복은 몇 번 도나요?
  - 네 번째 회차에는 `bag`이 이미 비어 있어요. 빈 배열에서 `pop()`을 부르면 오류가 날까요, 무언가를 돌려줄까요?
explanation: |
  출력은 다음과 같아요.

  ```text
  ["모자", "지도", "물", undefined]
  0
  ```

  - 2번 줄: `push("모자")`가 `bag`을 `["물", "지도", "모자"]`로 바꿔요.
  - 반복: `pop()`은 맨 끝 요소를 꺼내 **돌려주고** `bag`에서 지워요. 그 요소를 `unpacked`에 `push`해요.

  | 회차 | `pop()`이 돌려준 값 | `bag` | `unpacked` |
  |---|---|---|---|
  | 1 | `"모자"` | `["물", "지도"]` | `["모자"]` |
  | 2 | `"지도"` | `["물"]` | `["모자", "지도"]` |
  | 3 | `"물"` | `[]` | `["모자", "지도", "물"]` |
  | 4 | `undefined` | `[]` | `["모자", "지도", "물", undefined]` |

  - 끝에서부터 꺼내 차례로 넣었으므로 `unpacked`의 순서는 원래와 거꾸로예요.
  - 네 번째 회차에는 꺼낼 것이 없어요. 빈 배열에서 `pop()`은 오류 없이 `undefined`를 돌려주고, 그 값이 `unpacked`에 그대로 들어가요. 그래서 `unpacked`는 요소가 4개예요.
  - `bag`은 빈 배열이라 길이가 0이에요.

  `unpacked`에 배열이 쌓인다고 예상했다면 `pop`이 남은 배열을 돌려준다고 본 거예요. `pop`이 돌려주는 것은 꺼낸 요소 하나(없으면 `undefined`)예요.
