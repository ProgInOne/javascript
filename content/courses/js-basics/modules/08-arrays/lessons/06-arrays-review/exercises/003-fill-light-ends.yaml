id: js-basics.arrays.arrays-review.fill-light-ends
type: fill_blank
difficulty: 2
concepts:
  - { id: js.arr.element-update, weight: 1 }
  - { id: js.arr.length, weight: 0.3 }
tags: [element-update, length, last-index, assessment]
estimatedSeconds: 90
usage: assessment
prompt: |
  복도 조명 배열 `lamps`에서 맨 앞 조명과 맨 끝 조명을 켜는 함수 `lightEnds`예요. 맨 앞은 이미 켜고 있어요. 빈칸에 한 줄을 채워 맨 끝 조명도 `"on"`으로 바꾸세요.

  - 조명의 개수가 달라도 동작해야 해요. 아래 프로그램은 조명 4개인 복도와 2개인 방에 함수를 써요.

  ```text
  ["on", "off", "off", "on"]
  ["on", "on"]
  ```
spec:
  mode: code
  lang: js
  template: |
    function lightEnds(lamps) {
      lamps[0] = "on";
      {{blank:last}}
    }

    const hall = ["off", "off", "off", "off"];
    const room = ["off", "off"];
    lightEnds(hall);
    lightEnds(room);
    console.log(hall);
    console.log(room);
  blanks:
    - id: last
      accept: ['lamps[lamps.length - 1] = "on";']
      width: 36
  checks:
    - kind: console
      id: output
      description: 복도는 양 끝 두 개, 방은 두 개 모두 켜진 배열이 출력되어야 합니다(배열 길이는 그대로).
      requirement: 맨 끝 조명 켜기
      expect:
        lines: ['["on", "off", "off", "on"]', '["on", "on"]']
    - kind: program
      id: no-error
      description: 프로그램이 오류 없이 끝나야 합니다.
      requirement: 맨 끝 조명 켜기
      expect:
        noError: true
misconceptions: [js.mc.array-last-index-is-length, js.mc.array-immutable-like-string]
hints:
  - 맨 앞 조명을 바꾼 줄 `lamps[0] = "on";`처럼, 맨 끝 조명도 인덱스에 대입해서 바꿔요.
  - 복도와 방은 조명 수가 달라서, 맨 끝 인덱스를 숫자로 적으면 둘 중 하나에서 틀려요. 배열의 개수를 알려 주는 속성을 쓰세요.
  - 조명이 4개일 때 맨 끝 인덱스는 4가 아니에요. 개수와 맨 끝 인덱스는 얼마나 차이 나나요?
explanation: |
  예시 정답은 `lamps[lamps.length - 1] = "on";`이에요.

  - 배열 요소는 `배열[인덱스] = 값`으로 바꿀 수 있어요. 문자열의 글자와 달리 배열 요소는 바꿀 수 있고, `const`로 만든 `hall`·`room`도 요소는 바꿀 수 있어요.
  - 맨 끝 인덱스는 `length - 1`이에요. 복도는 3, 방은 1이에요.
  - `lamps[3] = "on";`처럼 숫자를 적으면 복도는 맞지만, 방에서는 없는 칸 3에 값을 넣어 배열의 길이가 4로 늘어나요(인덱스 1은 `"off"` 그대로, 2는 빈 칸).
  - `lamps[lamps.length] = "on";`도 마지막 요소를 바꾸지 않고 끝에 새 칸을 하나 더 만들어요. 그래서 복도가 `["on", "off", "off", "off", "on"]`이 돼요.
  - 함수에 넘긴 배열은 복사되지 않으므로, 함수 안에서 `lamps`를 바꾸면 `hall`·`room`이 바뀌어요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
