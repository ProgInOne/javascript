id: js-basics.arrays.arrays-review.predict-foreach-tickets
type: predict_output
difficulty: 3
concepts:
  - { id: js.arr.foreach, weight: 1 }
  - { id: js.fn.undefined-return, weight: 0.3 }
tags: [foreach, return, index-param, trace, assessment]
estimatedSeconds: 130
usage: assessment
prompt: |
  영화관 상영관별 남은 표 수예요. 매진(0장)인 상영관은 건너뛰고 나머지를 출력하려고 해요. 실행하면 콘솔에 무엇이 출력될까요? 모든 줄을 차례로 적어 보세요.
spec:
  lang: js
  code: |
    const tickets = [12, 0, 7, 3];
    let printed = 0;
    const result = tickets.forEach((t, i) => {
      if (t === 0) {
        return;
      }
      printed++;
      console.log(i + "번: " + t + "장");
    });
    console.log(printed);
    console.log(result);
  answerKind: console
  misconceptionByAnswer:
    "0번: 12장\n1\nundefined": js.mc.foreach-return-stops
    "0번: 12장\n2번: 7장\n3번: 3장\n3\n[12, 0, 7, 3]": js.mc.foreach-returns-array
misconceptions: [js.mc.foreach-return-stops, js.mc.foreach-returns-array]
hints:
  - "`forEach`는 요소마다 콜백을 한 번씩 불러요. 콜백의 두 매개변수 `t`와 `i`에는 무엇이 들어오나요?"
  - 콜백 안의 `return`은 어떤 함수를 끝내나요? `forEach` 전체인가요, 이번 회차의 콜백인가요?
  - 마지막 줄은 `forEach`가 돌려준 값이에요. `forEach`는 새 배열을 만드는 메서드였나요?
explanation: |
  출력은 다음과 같아요.

  ```text
  0번: 12장
  2번: 7장
  3번: 3장
  3
  undefined
  ```

  - 콜백의 `i`는 0부터 시작하는 인덱스예요. 그래서 첫 줄은 `0번: 12장`이에요.
  - `t`가 0인 회차(인덱스 1)에서 `return`을 만나면 **그 회차의 콜백만** 끝나요. `forEach`는 다음 요소로 계속 가서 인덱스 2, 3을 처리해요. `printed`는 출력한 3개만큼 늘어 3이에요. `return`에서 반복 전체가 멈춘다고 봤다면 `0번: 12장`과 `1`만 나온다고 생각했을 거예요.
  - `forEach`는 아무것도 돌려주지 않아서 `result`는 `undefined`예요. 결과 배열이 필요하면 `map`이나 `filter`를 써요.
