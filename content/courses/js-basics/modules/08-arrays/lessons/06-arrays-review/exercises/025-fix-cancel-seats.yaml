id: js-basics.arrays.arrays-review.fix-cancel-seats
type: fix_bug
difficulty: 4
concepts:
  - { id: js.arr.splice, weight: 1 }
  - { id: js.arr.length, weight: 0.5 }
  - { id: js.loops.for, weight: 0.3 }
tags: [splice, index-shift, for, trace, debugging, assessment]
estimatedSeconds: 300
usage: assessment
prompt: |
  공연장 좌석 예약 목록이에요. 예약을 취소한 자리는 빈 문자열 `""`로 표시되어 있어요. 반복문으로 빈 자리를 `seats` 배열에서 **직접 지운 뒤** 남은 좌석과 개수를 출력하려고 해요. 기대하는 출력은 다음과 같아요.

  ```text
  A1, B2, C3
  남은 좌석: 3개
  ```

  그런데 빈 자리가 일부 남아요. 버그를 고치세요. `seats`는 `const`로 둔 채, 원래 배열에서 지워야 해요.
spec:
  buggy:
    files:
      - path: main.js
        content: |
          const seats = ["A1", "", "", "B2", "", "C3"];
          for (let i = 0; i < seats.length; i++) {
            if (seats[i] === "") {
              seats.splice(i, 1);
            }
          }
          console.log(seats.join(", "));
          console.log("남은 좌석: " + seats.length + "개");
  solution:
    files:
      - path: main.js
        content: |
          const seats = ["A1", "", "", "B2", "", "C3"];
          for (let i = seats.length - 1; i >= 0; i--) {
            if (seats[i] === "") {
              seats.splice(i, 1);
            }
          }
          console.log(seats.join(", "));
          console.log("남은 좌석: " + seats.length + "개");
  bugDescription: "`A1, , B2, C3`와 `남은 좌석: 4개`가 출력돼요. 빈 자리 하나가 지워지지 않았어요."
  checks:
    - kind: console
      id: output
      description: 빈 자리가 모두 지워진 좌석 목록과 남은 좌석 수 3개가 출력되어야 합니다.
      requirement: 빈 자리 모두 지우기
      expect:
        lines: ["A1, B2, C3", "남은 좌석: 3개"]
    - kind: program
      id: seats-array
      description: 실행이 끝난 뒤 seats 배열에는 빈 자리가 없어야 합니다.
      requirement: 빈 자리 모두 지우기
      expect: { globals: { seats: { equals: ["A1", "B2", "C3"] } }, noError: true }
hints:
  - 반복이 돌 때마다 `i`와 `seats`가 어떻게 바뀌는지 표로 적어 보세요. 특히 `i`가 1일 때 지운 뒤를 보세요.
  - "`splice(i, 1)`로 한 칸을 지우면 그 뒤의 요소들은 한 칸씩 앞으로 당겨져요. 그때 `i + 1` 자리에 있던 요소는 이제 몇 번 인덱스에 있나요?"
  - 지운 자리로 당겨진 요소를 다음 회차가 건너뛰지 않게 하려면, 지운 뒤에 `i`를 한 칸 되돌리거나 배열의 끝에서부터 거꾸로 돌면 돼요.
explanation: |
  예시 정답이에요. 배열의 **끝에서부터** 거꾸로 돌아요.

  ```js
  const seats = ["A1", "", "", "B2", "", "C3"];
  for (let i = seats.length - 1; i >= 0; i--) {
    if (seats[i] === "") {
      seats.splice(i, 1);
    }
  }
  ```

  원래 코드는 빈 자리가 두 칸 붙어 있는 곳에서 하나를 건너뛰어요.

  | `i` | 확인한 요소 | 한 일 | 회차가 끝난 뒤 `seats` |
  |---|---|---|---|
  | 0 | `"A1"` | 그대로 | `["A1", "", "", "B2", "", "C3"]` |
  | 1 | `""` | 지움 | `["A1", "", "B2", "", "C3"]` |
  | 2 | `"B2"` | 그대로 | `["A1", "", "B2", "", "C3"]` |
  | 3 | `""` | 지움 | `["A1", "", "B2", "C3"]` |

  - `splice(i, 1)`은 원래 배열에서 한 칸을 지우고, 뒤의 요소를 한 칸씩 앞으로 당겨요. `i`가 1일 때 지우자 두 번째 `""`가 1번 자리로 왔는데, 다음 회차는 `i`가 2라서 그 칸을 확인하지 않아요.
  - `i`가 4가 되면 `seats.length`가 이미 4라서 반복이 끝나요. 그래서 `A1, , B2, C3`과 `4개`가 출력돼요.
  - 끝에서부터 돌면 지운 칸 뒤쪽은 이미 확인을 마친 요소뿐이라, 당겨져도 건너뛰는 요소가 없어요.
  - 앞에서부터 돌되 지운 뒤 `i--;`를 넣어 같은 자리를 한 번 더 확인해도 정답이에요.
  - `filter`는 새 배열을 만들어서 `const seats`에 다시 대입할 수 없어요. 이 문제는 원래 배열에서 직접 지워야 해요.
origin: authored
review:
