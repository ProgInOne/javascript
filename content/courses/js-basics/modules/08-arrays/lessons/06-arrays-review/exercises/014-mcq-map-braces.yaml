id: js-basics.arrays.arrays-review.mcq-map-braces
type: mcq_single
difficulty: 1
concepts:
  - { id: js.arr.map, weight: 1 }
  - { id: js.fn.arrow, weight: 0.3 }
tags: [map, arrow-braces, return, assessment]
estimatedSeconds: 50
usage: assessment
prompt: |
  다음 코드를 실행한 뒤 `next`에 들어 있는 값은 무엇인가요?
code: |
  const floors = [2, 4, 6];
  const next = floors.map((n) => { n + 1; });
spec:
  options:
    - id: a
      text: "`[undefined, undefined, undefined]`"
    - id: b
      text: "`[3, 5, 7]`"
      misconception: js.mc.map-callback-no-return
      rationale: 화살표 함수 본문에 중괄호를 쓰면 return이 있어야 값을 돌려줘요. 이 콜백은 n + 1을 계산만 하고 버려요.
    - id: c
      text: "`[]`"
      rationale: map은 콜백이 무엇을 돌려주든 원래 배열과 같은 길이의 배열을 만들어요.
    - id: d
      text: "`[2, 4, 6]`"
      rationale: map은 원래 요소가 아니라 콜백이 돌려준 값을 담아요.
  correct: a
misconceptions: [js.mc.map-callback-no-return, js.mc.arrow-braces-implicit-return]
hints:
  - "`map`의 결과 배열에는 콜백이 **돌려준** 값이 담겨요."
  - 이 화살표 함수의 본문은 중괄호로 감싸여 있어요. 중괄호가 있는 본문은 언제 값을 돌려주나요?
  - 콜백이 돌려주는 값과 결과 배열의 길이를 따로 생각해 보세요.
explanation: |
  정답은 `[undefined, undefined, undefined]`예요.

  - 화살표 함수 본문을 `{ }`로 감싸면 `return`을 써야만 값을 돌려줘요. `{ n + 1; }`은 계산만 하고 결과를 버리므로 콜백은 매번 `undefined`를 돌려줘요.
  - `map`은 콜백의 반환값을 모아 **원래와 같은 길이**의 새 배열을 만들어요. 그래서 `undefined` 세 개가 담겨요.

  - `[3, 5, 7]`이 되려면 `(n) => n + 1`처럼 중괄호를 빼거나 `(n) => { return n + 1; }`로 써야 해요.
  - `[]`는 틀렸어요. 반환값이 `undefined`여도 자리는 그대로 남아요.
  - `[2, 4, 6]`도 틀렸어요. `map`은 원래 요소를 그대로 옮기지 않고 콜백이 돌려준 값을 담아요.
origin: authored
