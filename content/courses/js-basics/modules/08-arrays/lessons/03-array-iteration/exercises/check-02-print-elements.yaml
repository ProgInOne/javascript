id: js-basics.arrays.array-iteration.check-print-elements
type: mcq_single
difficulty: 1
usage: check
concepts:
  - { id: js.arr.for-of, weight: 1 }
tags: [for-of, for-in, check]
estimatedSeconds: 50
prompt: |
  `const pets = ["고양이", "강아지"];`의 **요소**를 `고양이`, `강아지` 순서로 한 줄씩 출력하는 코드는 어느 것인가요?
spec:
  codeOptions: true
  options:
    - id: a
      text: 'for (const pet of pets) { console.log(pet); }'
    - id: b
      text: 'for (const pet in pets) { console.log(pet); }'
      misconception: js.mc.for-in-array-values
      rationale: '`for...in`은 인덱스를 문자열로 꺼내서 `0`, `1`이 출력돼요.'
    - id: c
      text: 'for (let i = 0; i <= pets.length; i++) { console.log(pets[i]); }'
      misconception: js.mc.array-last-index-is-length
      rationale: '`<=` 때문에 마지막 바퀴에서 `pets[2]`를 읽어 `undefined`가 한 줄 더 나와요.'
    - id: d
      text: 'for (const pet of pets) { console.log(pets[pet]); }'
      misconception: js.mc.for-of-gives-index
      rationale: '`pet`은 이미 요소예요. `pets["고양이"]`는 없는 자리라 `undefined`가 나와요.'
  correct: a
misconceptions: [js.mc.for-in-array-values, js.mc.for-of-gives-index]
hints:
  - "`of`와 `in` 중 요소를 꺼내 주는 쪽은 어느 것인가요?"
  - 인덱스 반복이라면 조건이 `i < pets.length`여야 해요.
  - "`for...of`의 반복 변수는 요소 그 자체라서, 다시 `pets[...]`로 읽을 필요가 없어요."
explanation: |
  정답은 `for (const pet of pets) { console.log(pet); }`예요.

  - `for...of`는 요소를 차례로 꺼내 `pet`에 넣어 줘요.
  - `for...in`은 인덱스 `"0"`, `"1"`을 문자열로 꺼내요. 배열의 값을 볼 때는 쓰지 않아요.
  - 인덱스 반복에서 `i <= pets.length`이면 범위 밖 `pets[2]`까지 읽어 `undefined`가 출력돼요.
  - `pet`은 이미 요소라서 `pets[pet]`처럼 다시 인덱스로 쓰면 `undefined`가 나와요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
