id: js-basics.arrays.array-iteration.fix-for-in-total
type: fix_bug
difficulty: 2
concepts:
  - { id: js.arr.for-of, weight: 1 }
  - { id: js.conv.plus-concat, weight: 0.3 }
tags: [for-in, for-of, accumulator, debugging]
estimatedSeconds: 150
prompt: |
  장바구니에 담은 상품 가격을 모두 더해 돌려주는 함수 `totalPrice(prices)`예요. 합계가 이상한 값으로 나와요. 고쳐서 바른 합계(숫자)를 돌려주게 하세요.

  | 호출 | 돌려줄 값 |
  |---|---|
  | `totalPrice([3000, 4500, 1200])` | `8700` |
  | `totalPrice([])` | `0` |
spec:
  buggy:
    files:
      - path: main.js
        content: |
          function totalPrice(prices) {
            let total = 0;
            for (const price in prices) {
              total += price;
            }
            return total;
          }
  solution:
    files:
      - path: main.js
        content: |
          function totalPrice(prices) {
            let total = 0;
            for (const price of prices) {
              total += price;
            }
            return total;
          }
  entry: totalPrice
  bugDescription: "`totalPrice([3000, 4500, 1200])`가 `8700`이 아니라 `\"0012\"`를 돌려줘요."
  bugMisconception: js.mc.for-in-array-values
  checks:
    - { kind: call, id: three, args: [[3000, 4500, 1200]], expect: { equals: 8700 }, requirement: 가격 합계 }
    - { kind: call, id: empty, args: [[]], expect: { equals: 0 }, requirement: 빈 장바구니 }
    - kind: call
      id: one
      visible: false
      description: 상품이 하나면 그 가격이 합계여야 합니다.
      requirement: 가격 합계
      args: [[500]]
      expect: { equals: 500 }
      misconceptionIfFail: js.mc.for-in-array-values
    - kind: call
      id: four
      visible: false
      description: 상품이 네 개여도 가격을 모두 더해야 합니다.
      requirement: 가격 합계
      args: [[1000, 2000, 3000, 4000]]
      expect: { equals: 10000 }
misconceptions: [js.mc.for-in-array-values]
hints:
  - "`\"0012\"`를 잘 보세요. 0 뒤에 0, 1, 2가 이어 붙어 있어요. 0, 1, 2는 무엇의 번호일까요?"
  - 반복 변수 `price`에 실제로 들어오는 값을 `console.log`로 찍어 보세요. 가격이 들어오나요?
  - 요소를 꺼내 주는 반복과 인덱스를 꺼내 주는 반복은 머리의 낱말 하나가 달라요.
explanation: |
  3번 줄의 `for...in`이 원인이에요. `for...in`은 배열의 요소가 아니라 인덱스를 **문자열** `"0"`, `"1"`, `"2"`로 꺼내요. 그래서 `total += price`는 `0 + "0"` → `"00"`, `"00" + "1"` → `"001"`, `"001" + "2"` → `"0012"`처럼 글자를 이어 붙였어요.

  `in`을 `of`로 바꾸면 `price`에 3000, 4500, 1200이 차례로 들어와 숫자 합계 8700이 돼요.

  ```js
  for (const price of prices) {
    total += price;
  }
  ```

  인덱스 반복 `for (let i = 0; i < prices.length; i++) { total += prices[i]; }`로 고쳐도 정답이에요. 빈 배열이면 반복이 한 번도 돌지 않아 `0`이 그대로 돌아가요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
