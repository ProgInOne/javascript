id: js-basics.arrays.array-iteration.impl-first-over-index
type: implement_function
difficulty: 3
concepts:
  - { id: js.arr.for-of, weight: 1 }
  - { id: js.fn.return, weight: 0.3 }
  - { id: js.control.if, weight: 0.3 }
tags: [index-loop, early-return, boundary, write-code]
estimatedSeconds: 280
prompt: |
  가격 배열 `prices`와 예산 `budget`을 받아, 예산을 **넘는** 첫 번째 상품이 몇 번 인덱스인지 돌려주는 함수 `firstOverIndex(prices, budget)`를 완성하세요. 예산을 넘는 상품이 없으면 `-1`을 돌려줘요.

  | 호출 | 돌려줄 값 |
  |---|---|
  | `firstOverIndex([3000, 12000, 8000, 15000], 10000)` | `1` |
  | `firstOverIndex([1000, 2000], 5000)` | `-1` |

  - 예산과 가격이 같으면 넘은 것이 아니에요.
  - 첫 번째로 넘는 상품을 찾으면 더 볼 필요가 없어요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          function firstOverIndex(prices, budget) {
            // 여기에 작성하세요
          }
  entry: firstOverIndex
  solution:
    files:
      - path: main.js
        content: |
          function firstOverIndex(prices, budget) {
            for (let i = 0; i < prices.length; i++) {
              if (prices[i] > budget) {
                return i;
              }
            }
            return -1;
          }
  checks:
    - { kind: call, id: basic, args: [[3000, 12000, 8000, 15000], 10000], expect: { equals: 1 }, requirement: 첫 번째 위치 찾기 }
    - { kind: call, id: none, args: [[1000, 2000], 5000], expect: { equals: -1 }, requirement: 없으면 -1 }
    - kind: call
      id: first-element
      visible: false
      description: 맨 앞 상품이 예산을 넘으면 0을 돌려줘야 합니다.
      requirement: 첫 번째 위치 찾기
      args: [[20000, 1000], 10000]
      expect: { equals: 0 }
    - kind: call
      id: equal-not-over
      visible: false
      description: 예산과 같은 가격은 넘은 것이 아니므로 건너뛰어야 합니다.
      requirement: 첫 번째 위치 찾기
      args: [[10000, 9000, 10001], 10000]
      expect: { equals: 2 }
    - kind: call
      id: empty
      visible: false
      description: 상품이 없으면 -1을 돌려줘야 합니다.
      requirement: 없으면 -1
      args: [[], 10000]
      expect: { equals: -1 }
    - kind: call
      id: keep-input
      visible: false
      description: 받은 가격 배열을 바꾸면 안 됩니다.
      requirement: 원래 배열 지키기
      args: [[3000, 12000, 8000], 10000]
      expect: { argsUnchanged: true }
misconceptions: [js.mc.for-of-gives-index]
hints:
  - 돌려줄 것은 가격이 아니라 **위치**예요. 위치를 알 수 있는 반복을 골라야 해요.
  - 인덱스 `i`로 돌면서 `prices[i]`를 예산과 비교해 보세요. "넘는다"는 같은 값을 포함할까요?
  - 찾는 즉시 함수를 끝내면 첫 번째 위치가 돌아가요. 반복이 끝까지 돌았다면 못 찾은 경우예요.
explanation: |
  예시 정답이에요.

  ```js
  function firstOverIndex(prices, budget) {
    for (let i = 0; i < prices.length; i++) {
      if (prices[i] > budget) {
        return i;
      }
    }
    return -1;
  }
  ```

  - **위치가 필요하면 인덱스 반복**: `for...of`는 요소(가격)만 주므로 몇 번째인지 알 수 없어요. 인덱스 반복의 `i`를 돌려줘요.
  - **찾으면 바로 `return`**: 반복 안의 `return`은 함수를 끝내므로 첫 번째 위치가 돌아가요. 반복 끝까지 기억해 두었다가 돌려주면 마지막으로 넘는 위치(위 예에서는 3)가 나오기 쉬워요.
  - **못 찾음은 반복 뒤에서**: 반복이 끝까지 돌았다는 것은 넘는 상품이 없었다는 뜻이라 `-1`을 돌려줘요. `return -1`을 반복 안의 `else`에 쓰면 첫 상품만 보고 끝나요.
  - **경계**: "넘는다"이므로 `>`예요. `>=`로 쓰면 10000원짜리 상품(0번)을 돌려줘요.
