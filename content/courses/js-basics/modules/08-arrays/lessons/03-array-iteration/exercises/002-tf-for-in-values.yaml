id: js-basics.arrays.array-iteration.tf-for-in-values
type: true_false
difficulty: 2
concepts:
  - { id: js.arr.for-of, weight: 1 }
tags: [for-in, for-of, index]
estimatedSeconds: 60
prompt: |
  다음 설명이 맞는지 고르고, 그렇게 판단한 이유도 고르세요.
spec:
  statement: '`const nums = [10, 20];`일 때 `for (const n in nums) { console.log(n); }`는 `10`과 `20`을 차례로 출력한다.'
  answer: false
  misconceptionIfWrong: js.mc.for-in-array-values
  requireReason: true
  reasons:
    - id: r1
      text: for...in은 요소가 아니라 인덱스를 문자열로 꺼내므로 0과 1이 출력된다
      correct: true
    - id: r2
      text: for...in과 for...of는 같은 반복이라서 요소가 출력된다
      misconception: js.mc.for-in-array-values
    - id: r3
      text: for...in은 배열에 쓰면 TypeError가 나서 아무것도 출력되지 않는다
    - id: r4
      text: const로 만든 반복 변수는 바퀴마다 값이 바뀔 수 없어서 10만 출력된다
hints:
  - "`in`과 `of`는 한 글자 차이지만 꺼내 주는 것이 달라요."
  - 배열에서 `for...in`이 꺼내는 것은 요소일까요, 위치일까요?
  - 레슨의 경고 상자에서 `x + 1`이 무엇이 되었는지 다시 확인해 보세요.
explanation: |
  정답은 **거짓**이에요. 이유는 "for...in은 요소가 아니라 인덱스를 문자열로 꺼내므로 0과 1이 출력된다"예요.

  `for...in`은 배열의 인덱스를 `"0"`, `"1"`처럼 문자열로 꺼내요. 그래서 이 코드는 `0`과 `1`을 출력해요. 요소 `10`, `20`을 꺼내려면 `for (const n of nums)`라고 써요.

  - 같은 반복이라는 이유: `in`은 인덱스(문자열), `of`는 요소를 꺼내는 다른 반복이에요.
  - 오류가 난다는 이유: 배열에 `for...in`을 써도 오류는 나지 않아요. 오류 없이 엉뚱한 값을 주니 더 조심해야 해요.
  - `const`라 바뀔 수 없다는 이유: 반복 변수는 바퀴마다 새로 만들어지므로 `const`로 써도 바퀴마다 다른 값이 들어와요.
