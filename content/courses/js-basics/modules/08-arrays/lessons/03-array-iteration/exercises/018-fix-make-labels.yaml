hints:
  - "`labels`에 무엇이 대입되는지 보세요. `forEach`는 무엇을 돌려주는 메서드였나요?"
  - 콜백의 `return`으로 돌려준 문자열은 어디로 갈까요? 아무도 모아 주지 않는다면 직접 모아야 해요.
  - 결과를 담을 빈 배열을 반복 전에 준비하고, 바퀴마다 만든 번호표를 그 배열의 끝에 넣는 방법을 떠올려 보세요.
explanation: |
  2번 줄에서 `forEach`의 결과를 `labels`에 담았는데, `forEach`는 항상 `undefined`를 돌려줘요. 콜백이 `return`한 번호표 문자열도 `forEach`가 버려요. 그래서 `labels`는 `undefined`예요.

  결과를 담을 빈 배열을 직접 만들고, 콜백 안에서 `push`로 하나씩 넣어요.

  ```js
  function makeLabels(names) {
    const labels = [];
    names.forEach((name, i) => {
      labels.push((i + 1) + "번 " + name);
    });
    return labels;
  }
  ```

  - **새 배열**: `labels`는 함수 안에서 새로 만든 배열이라 `names`는 그대로이고, 돌려주는 것도 새 배열이에요.
  - **번호**: 인덱스는 0부터라서 `i + 1`을 써요. `(i + 1) + "번 "`은 숫자를 먼저 더한 뒤 문자열을 이어 붙여요.
  - `names`에 직접 `names[i] = ...`로 대입하면 결과는 맞아 보여도 받은 배열이 바뀌고, 돌려주는 것도 새 배열이 아니라서 숨겨진 테스트를 통과하지 못해요.
  - `for (let i = 0; i < names.length; i++)`와 `push`로 써도 정답이에요. 다음 단원의 `map`은 이 일을 한 줄로 해 줘요.
