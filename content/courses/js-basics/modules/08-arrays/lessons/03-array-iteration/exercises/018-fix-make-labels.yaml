prompt: |
  이름 배열을 받아 번호표 문자열의 **새 배열**을 돌려주는 함수 `makeLabels(names)`예요. 그런데 배열 대신 `undefined`가 돌아와요. 고쳐서 아래처럼 동작하게 하세요.

  | 호출 | 돌려줄 값 |
  |---|---|
  | `makeLabels(["민지", "서준"])` | `["1번 민지", "2번 서준"]` |
  | `makeLabels([])` | `[]` |

  받은 `names` 배열은 바꾸지 말고, 결과는 새 배열로 돌려줘요.
spec:
  buggy:
    files:
      - path: main.js
        content: |
          function makeLabels(names) {
            const labels = names.forEach((name, i) => {
              return (i + 1) + "번 " + name;
            });
            return labels;
          }
  solution:
    files:
      - path: main.js
        content: |
          function makeLabels(names) {
            const labels = [];
            names.forEach((name, i) => {
              labels.push((i + 1) + "번 " + name);
            });
            return labels;
          }
