id: js-basics.arrays.array-iteration.predict-for-in-index
type: predict_output
difficulty: 3
concepts:
  - { id: js.arr.for-of, weight: 1 }
  - { id: js.conv.plus-concat, weight: 0.3 }
tags: [for-in, for-of, plus-concat]
estimatedSeconds: 120
prompt: |
  실행하면 콘솔에 무엇이 출력될까요? 다섯 줄을 차례로 적어 보세요.
spec:
  lang: js
  code: |
    const seats = ["A", "B"];
    for (const x in seats) {
      console.log(x + 1);
    }
    for (const x of seats) {
      console.log(x + 1);
    }
    let count = 0;
    for (const x in seats) {
      count++;
    }
    console.log(count);
  answerKind: console
  misconceptionByAnswer:
    "A1\nB1\nA1\nB1\n2": js.mc.for-in-array-values
    "1\n2\nA1\nB1\n2": js.mc.for-in-array-values
hints:
  - 위의 두 반복은 `in`과 `of`만 달라요. 각각 무엇을 꺼내 주는지부터 정리해 보세요.
  - "`for...in`이 꺼내는 인덱스는 숫자가 아니라 문자열이에요. 문자열에 `+ 1`을 하면 어떻게 될까요?"
  - 마지막 반복은 꺼낸 값을 쓰지 않고 바퀴 수만 세요. 꺼내는 것이 달라도 바퀴 수가 달라질까요?
explanation: |
  출력은 다음과 같아요.

  ```text
  01
  11
  A1
  B1
  2
  ```

  - 첫 번째 반복(`for...in`): `x`는 인덱스 문자열 `"0"`, `"1"`이에요. 문자열에 `+ 1`을 하면 덧셈이 아니라 이어 붙이기라서 `"01"`, `"11"`이에요. 숫자 덧셈이라고 생각하면 `1`, `2`라고 답하게 돼요.
  - 두 번째 반복(`for...of`): `x`는 요소 `"A"`, `"B"`라서 `"A1"`, `"B1"`이에요.
  - 세 번째 반복: 꺼내는 것은 인덱스지만 요소 수만큼 두 바퀴 돌아요. 그래서 `count`는 2예요.

  배열의 값은 `for...of`로 꺼내요. `for...in`은 값 대신 인덱스 문자열을 주므로 배열에 쓰지 않아요.
origin: authored
