id: js-basics.arrays.array-iteration.find-bug-loop-var-assign
type: find_bug_line
difficulty: 3
concepts:
  - { id: js.arr.for-of, weight: 1 }
  - { id: js.arr.element-update, weight: 0.5 }
tags: [for-of, element-update, debugging]
estimatedSeconds: 120
prompt: |
  보충 시험을 본 학생은 60점 미만이어도 60점으로 올려 주기로 했어요. 아래 코드는 60점 미만인 점수를 60으로 바꾼 뒤 배열을 출력하려고 해요. 그런데 점수가 하나도 바뀌지 않아요. 원인이 되는 줄을 찾고, 왜 그런지도 고르세요.
spec:
  code: |-
    const scores = [55, 78, 42, 90];
    for (let score of scores) {
      if (score < 60) {
        score = 60;
      }
    }
    console.log(scores);
  bugLines: [4]
  acceptLines: [2, 3]
  symptom: "`[60, 78, 60, 90]`가 나와야 하는데 `[55, 78, 42, 90]`이 그대로 나와요."
  symptomCheck:
    console: ["[55, 78, 42, 90]"]
  fixedCode: |-
    const scores = [55, 78, 42, 90];
    for (let i = 0; i < scores.length; i++) {
      if (scores[i] < 60) {
        scores[i] = 60;
      }
    }
    console.log(scores);
  causeOptions:
    - id: c1
      text: score는 요소의 값을 담은 별도의 변수라서, score에 대입해도 배열의 칸은 바뀌지 않는다
      correct: true
    - id: c2
      text: scores를 const로 만들어서 배열의 요소를 바꿀 수 없다
      misconception: js.mc.array-immutable-like-string
    - id: c3
      text: for...of의 score에는 인덱스가 들어 있어서 score < 60이 늘 참이 된다
      misconception: js.mc.for-of-gives-index
    - id: c4
      text: let으로 만든 반복 변수는 반복 안에서 값을 바꿀 수 없다
misconceptions: [js.mc.for-of-var-updates-array]
hints:
  - "`if`의 조건은 바르게 동작해요. 55와 42에서는 4번 줄까지 실행돼요. 그런데 왜 배열은 그대로일까요?"
  - 4번 줄이 바꾸는 것은 배열의 칸일까요, 아니면 반복 변수일까요?
  - 배열의 칸을 바꾸려면 그 칸을 가리킬 수단이 필요해요. `for...of`는 그것을 주지 않아요.
explanation: |
  원인은 **4번 줄**이에요.

  `for (let score of scores)`의 `score`는 바퀴마다 요소의 값을 담는 **별도의 변수**예요. 4번 줄 `score = 60;`은 이 변수만 60으로 바꾸고, 배열 `scores`의 칸은 건드리지 않아요. 그래서 출력은 처음 그대로 `[55, 78, 42, 90]`이에요.

  배열의 칸을 바꾸려면 인덱스가 필요해요. 반복을 인덱스 반복으로 바꾸고 칸에 직접 대입해요.

  ```js
  for (let i = 0; i < scores.length; i++) {
    if (scores[i] < 60) {
      scores[i] = 60;
    }
  }
  ```

  그래서 반복을 바꾸는 2번 줄과 조건을 바꾸는 3번 줄을 골라도 정답으로 인정해요.

  - `const`라서 못 바꾼다: `const`는 `scores`에 다른 배열을 다시 대입하는 것만 막아요. `scores[0] = 60`처럼 요소는 바꿀 수 있어요.
  - `score`가 인덱스다: `for...of`의 `score`에는 55, 78처럼 요소가 들어와요. 인덱스라면 0, 1, 2, 3이 모두 60보다 작아 결과가 달랐을 거예요.
  - `let` 반복 변수는 못 바꾼다: `let` 변수는 대입할 수 있어요. 실제로 4번 줄은 오류 없이 `score`를 바꿨어요. 바뀐 것이 배열이 아니었을 뿐이에요.
origin: authored
