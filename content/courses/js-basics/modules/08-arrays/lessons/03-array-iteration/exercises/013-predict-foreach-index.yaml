id: js-basics.arrays.array-iteration.predict-foreach-index
type: predict_output
difficulty: 1
concepts:
  - { id: js.arr.foreach, weight: 1 }
tags: [foreach, index]
estimatedSeconds: 60
prompt: |
  실행하면 콘솔에 무엇이 출력될까요? 세 줄을 차례로 적어 보세요.
spec:
  lang: js
  code: |
    const days = ["월", "화", "수"];
    days.forEach((day, i) => {
      console.log(i + ": " + day);
    });
  answerKind: console
  misconceptionByAnswer:
    "1: 월\n2: 화\n3: 수": js.mc.index-starts-at-one
hints:
  - "`forEach`는 요소마다 콜백을 한 번씩 불러요. 요소가 세 개면 몇 번일까요?"
  - 콜백의 첫 번째 매개변수 `day`에는 요소가, 두 번째 `i`에는 무엇이 들어올까요?
  - 배열의 인덱스는 몇부터 시작했나요?
explanation: |
  출력은 다음과 같아요.

  ```text
  0: 월
  1: 화
  2: 수
  ```

  `forEach`는 요소마다 콜백을 `(요소, 인덱스)`로 불러요. 첫 번째 호출은 `("월", 0)`이에요. 인덱스는 0부터 시작하므로 첫 줄은 `1: 월`이 아니라 `0: 월`이에요. 사람이 읽는 번호로 보여 주려면 `(i + 1) + ": " + day`처럼 1을 더해요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
