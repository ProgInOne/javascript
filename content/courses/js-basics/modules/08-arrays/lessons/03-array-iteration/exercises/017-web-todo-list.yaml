id: js-basics.arrays.array-iteration.web-todo-list
type: web_task
difficulty: 3
concepts:
  - { id: js.arr.foreach, weight: 1 }
  - { id: js.str.search, weight: 0.3 }
  - { id: js.str.slice, weight: 0.3 }
tags: [foreach, web, list, count]
estimatedSeconds: 420
prompt: |
  할 일 배열을 화면의 목록으로 보여 주는 함수 `showTodos(todos)`의 본문을 완성하세요. 시작 코드에는 화면에 줄을 하나 더하는 도우미 `addItem(text)`와, 목록 아래 안내 문장을 바꾸는 `showCount(text)`가 있어요.

  - 받은 배열 `todos`를 `forEach`로 돌면서, 할 일마다 `addItem`으로 한 줄씩 배열 순서대로 보여 줘요.
  - `!`로 시작하는 할 일은 급한 일이에요. 앞의 `!`를 떼고 `[급함] `을 붙여 보여 줘요. 예: `"!숙제 제출"` → `[급함] 숙제 제출`
  - 마지막에 `showCount`로 `급한 일 2개 / 전체 5개`처럼 급한 일의 개수와 전체 개수를 보여 줘요. 개수는 배열을 돌면서 세어 보세요.

  시작 코드는 페이지가 열릴 때 오늘 할 일로 `showTodos`를 한 번 부르고, **내일 할 일 보기** 버튼을 누르면 목록을 비운 뒤 내일 할 일로 다시 불러요(버튼 코드는 모듈 10에서 배워요). 채점도 버튼을 눌러 다른 배열로 확인하니, 받은 배열 `todos`를 돌면서 만들어야 해요.
