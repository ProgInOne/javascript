  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>할 일 목록</title>
              <style>
                body { font-family: sans-serif; padding: 16px; }
                li { margin: 4px 0; }
                #count { color: #555; }
              </style>
            </head>
            <body>
              <h1>할 일 목록</h1>
              <button id="tomorrow" type="button">내일 할 일 보기</button>
              <ul id="list"></ul>
              <p id="count"></p>
              <script>
                // 화면을 다루는 도우미예요(안의 코드는 모듈 10에서 배워요).
                const list = document.querySelector("#list");
                function addItem(text) {
                  const li = document.createElement("li");
                  li.textContent = text;
                  list.appendChild(li);
                }
                function showCount(text) {
                  document.querySelector("#count").textContent = text;
                }
                function clearList() {
                  list.textContent = "";
                }

                const today = ["우유 사기", "!숙제 제출", "운동 30분", "!병원 예약", "책 반납"];
                const tomorrow = ["!시험 공부", "방 청소"];

                function showTodos(todos) {
                  let urgent = 0;
                  todos.forEach((todo) => {
                    if (todo.startsWith("!")) {
                      urgent++;
                      addItem("[급함] " + todo.slice(1));
                    } else {
                      addItem(todo);
                    }
                  });
                  showCount(`급한 일 ${urgent}개 / 전체 ${todos.length}개`);
                }

                // 페이지가 열리면 오늘 할 일을, 버튼을 누르면 내일 할 일을 보여 줘요.
                showTodos(today);
                document.querySelector("#tomorrow").addEventListener("click", () => {
                  clearList();
                  showTodos(tomorrow);
                });
              </script>
            </body>
          </html>
  checks:
    - kind: dom
      id: item-count
      description: 오늘 할 일 다섯 개가 목록에 한 줄씩 있어야 합니다.
      requirement: 할 일 목록
      visible: true
      selector: "#list li"
      expect:
        count: 5
    - kind: dom
      id: first-item
      description: 첫 줄은 급하지 않은 할 일 "우유 사기"가 그대로 보여야 합니다.
      requirement: 할 일 목록
      visible: true
      selector: "#list li:nth-child(1)"
      expect:
        text: { equals: "우유 사기" }
    - kind: dom
      id: urgent-item
      description: 둘째 줄은 "!"를 뗀 급한 일에 "[급함] "이 붙어 보여야 합니다.
      requirement: 급한 일 표시
      visible: true
      selector: "#list li:nth-child(2)"
      expect:
        text: { equals: "[급함] 숙제 제출" }
    - kind: dom
      id: urgent-item-2
      description: 넷째 줄의 급한 일도 같은 규칙으로 보여야 합니다.
      requirement: 급한 일 표시
      selector: "#list li:nth-child(4)"
      expect:
        text: { equals: "[급함] 병원 예약" }
    - kind: dom
      id: last-item
      description: 마지막 줄은 배열의 마지막 할 일이어야 합니다.
      requirement: 할 일 목록
      selector: "#list li:nth-child(5)"
      expect:
        text: { equals: "책 반납" }
    - kind: dom
      id: count-text
      description: 목록 아래에 급한 일 개수와 전체 개수가 보여야 합니다.
      requirement: 개수 안내
      visible: true
      selector: "#count"
      expect:
        text: { equals: "급한 일 2개 / 전체 5개" }
    - kind: event
      id: tomorrow-list
      description: 내일 할 일 보기 버튼을 누르면 받은 배열(내일 할 일 두 개)로 목록과 개수 안내가 새로 만들어져야 합니다(급한 일 개수는 부를 때마다 0부터 다시 세요).
      requirement: 받은 배열로 만들기
      visible: true
      steps:
        - { action: click, selector: "#tomorrow" }
      expect:
        - { selector: "#list li", count: 2 }
        - { selector: "#list li:nth-child(1)", text: { equals: "[급함] 시험 공부" } }
        - { selector: "#list li:nth-child(2)", text: { equals: "방 청소" } }
        - { selector: "#count", text: { equals: "급한 일 1개 / 전체 2개" } }
misconceptions: [js.mc.accumulator-reset-in-loop]
hints:
  - "`todos.forEach((todo) => { ... })` 안에서 할 일 하나를 `todo`로 받아요. 콜백이 요소마다 한 번씩 불리니, 그 안에서 `addItem`을 한 번 부르면 돼요."
  - 급한 일인지는 모듈 7의 `startsWith`로, `!`를 뗀 글자는 `slice`로 만들 수 있어요. 급한 일을 셀 변수는 반복 앞에 만들어 두세요.
  - 전체 개수는 받은 배열이 이미 알고 있어요. 안내 문장은 모든 할 일을 확인한 **뒤에** 한 번만 보여 줘요. 오늘 할 일의 글자를 그대로 적으면 내일 할 일 버튼에서 틀려요.
explanation: |
  예시 정답이에요.

  ```js
  function showTodos(todos) {
    let urgent = 0;
    todos.forEach((todo) => {
      if (todo.startsWith("!")) {
        urgent++;
        addItem("[급함] " + todo.slice(1));
      } else {
        addItem(todo);
      }
    });
    showCount(`급한 일 ${urgent}개 / 전체 ${todos.length}개`);
  }
  ```

  - **요소마다 한 줄**: `forEach`가 할 일마다 콜백을 불러 주므로, 콜백 안에서 `addItem`을 한 번 부르면 할 일 수만큼 줄이 배열 순서대로 생겨요.
  - **받은 배열로**: 함수 안에서는 `today`가 아니라 매개변수 `todos`를 돌아요. 그래야 버튼이 `showTodos(tomorrow)`를 불렀을 때 내일 할 일이 보여요. `addItem("우유 사기")`처럼 다섯 줄을 직접 적으면 첫 화면은 맞아도 버튼을 누른 뒤의 확인을 통과하지 못해요.
  - **급한 일**: `todo.startsWith("!")`로 확인하고, `todo.slice(1)`로 맨 앞 한 글자 `!`를 뗀 문자열을 만들어요. 원래 배열의 문자열은 바뀌지 않아요.
  - **세기**: `urgent`는 콜백 **바깥**, 반복 앞에서 0으로 만들어요. 콜백 안에서 만들면 할 일마다 새로 0이 되어 끝까지 세지 못해요. 함수 안에서 만들었으므로 `showTodos`를 부를 때마다 0부터 다시 세요.
  - **안내는 반복 뒤에**: `showCount`를 콜백 안에서 부르면 안내 문장이 바퀴마다 바뀌다가 마지막 값만 남아요. 결과는 같아 보여도, 다 센 뒤에 한 번 부르는 것이 의도에 맞아요. 전체 개수는 `todos.length`예요.
  - `for (const todo of todos)`로 써도 같은 화면이 나와요.
