id: js-basics.arrays.array-search-sort.multi-sort-facts
type: mcq_multi
difficulty: 2
concepts:
  - { id: js.arr.sort, weight: 1 }
  - { id: js.arr.mutating-vs-not, weight: 0.3 }
tags: [sort, compare-function, mutation, return-value]
estimatedSeconds: 120
prompt: |
  다음 코드를 실행한 뒤의 상태에 대한 설명으로 맞는 것을 모두 고르세요.

  ```js
  const nums = [30, 4, 200];
  const result = nums.sort((a, b) => a - b);
  ```
spec:
  options:
    - id: a
      text: "`nums`는 `[4, 30, 200]`이다"
      missedMisconception: js.mc.sort-returns-new-array
    - id: b
      text: "`result === nums`는 `true`다"
      missedMisconception: js.mc.sort-returns-new-array
    - id: c
      text: "`result`는 정렬된 새 배열이고, `nums`는 `[30, 4, 200]` 그대로다"
      misconception: js.mc.sort-returns-new-array
      rationale: sort는 원래 배열을 직접 정렬하고, 돌려주는 값도 그 배열이에요.
    - id: d
      text: "비교 함수를 `(a, b) => a > b`로 바꿔도 결과는 같다"
      misconception: js.mc.sort-compare-boolean
      rationale: 비교 함수는 음수·0·양수를 돌려줘야 해요. true·false로는 음수가 나오지 않아 제대로 정렬되지 않아요.
    - id: e
      text: "`nums`를 정렬된 순서로 쓰려면 `nums = nums.sort((a, b) => a - b);`처럼 다시 대입해야 한다"
      misconception: js.mc.mutating-method-keeps-original
      rationale: sort가 nums를 이미 바꿨어요. 게다가 nums는 const라 다시 대입하면 TypeError가 나요.
  correct: [a, b]
misconceptions: [js.mc.sort-returns-new-array, js.mc.sort-compare-boolean]
hints:
  - "`sort`는 원래 배열을 바꾸는 메서드일까요, 새 배열을 만드는 메서드일까요?"
  - "`sort`가 돌려주는 값은 새로 만든 배열이 아니에요. 그렇다면 `result`와 `nums`는 어떤 관계일까요?"
  - 비교 함수가 돌려줘야 하는 값은 세 종류(음수·0·양수)예요. `a > b`는 어떤 종류의 값을 돌려주나요?
explanation: |
  정답은 "`nums`는 `[4, 30, 200]`이다"와 "`result === nums`는 `true`다" 두 가지예요.

  - `sort`는 원래 배열 `nums`를 직접 정렬해요. `(a, b) => a - b`는 작은 수부터 정렬하므로 `nums`는 `[4, 30, 200]`이에요.
  - `sort`가 돌려주는 값은 정렬된 **바로 그 배열**이에요. `result`와 `nums`는 같은 배열이라 `===`로 비교하면 `true`예요.
  - "`result`는 새 배열이고 `nums`는 그대로"는 틀렸어요. 원본을 지키려면 `nums.slice().sort(...)`처럼 복사본을 정렬해야 해요.
  - "`a > b`로 바꿔도 같다"는 틀렸어요. `true`·`false`는 `1`·`0`이 되어 음수가 나오지 않아서 제대로 정렬되지 않아요. 실제로 `[30, 4, 200].sort((a, b) => a > b)`는 `[30, 4, 200]` 그대로예요.
  - "다시 대입해야 한다"는 틀렸어요. `sort`가 이미 `nums`를 바꿨고, `const`로 만든 `nums`에 다시 대입하면 `TypeError`가 나요.
