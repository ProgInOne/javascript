id: js-basics.arrays.array-search-sort.impl-missing-items
type: implement_function
difficulty: 3
concepts:
  - { id: js.arr.includes-indexof, weight: 1 }
  - { id: js.arr.filter, weight: 0.5 }
  - { id: js.arr.mutating-vs-not, weight: 0.3 }
tags: [includes, filter, no-mutation, write-code]
estimatedSeconds: 300
prompt: |
  장보기 앱이에요. 장바구니에 담은 물건 목록 `cart`와 살 물건 목록 `shoppingList`를 받아, **아직 담지 않은 물건**만 모은 새 배열을 돌려주는 함수 `missingItems(cart, shoppingList)`를 완성하세요.

  - 결과는 `shoppingList`의 순서를 따라요.
  - 물건 이름이 **완전히 같을 때만** 담은 것으로 봐요. 이름 일부가 같은 것은 다른 물건이에요(`"우유"`와 `"우유식빵"`은 다른 물건).
  - 두 배열은 바꾸지 마세요.

  | 호출 | 돌려줄 값 |
  |---|---|
  | `missingItems(["우유", "달걀"], ["달걀", "두부", "우유", "파"])` | `["두부", "파"]` |
  | `missingItems([], ["사과"])` | `["사과"]` |
spec:
  starter:
    files:
      - path: main.js
        content: |
          function missingItems(cart, shoppingList) {
            // 여기에 작성하세요
          }
  entry: missingItems
  solution:
    files:
      - path: main.js
        content: |
          function missingItems(cart, shoppingList) {
            return shoppingList.filter((item) => !cart.includes(item));
          }
  checks:
    - { kind: call, id: basic, args: [["우유", "달걀"], ["달걀", "두부", "우유", "파"]], expect: { equals: ["두부", "파"] }, requirement: 안 담은 물건 고르기 }
    - { kind: call, id: empty-cart, args: [[], ["사과"]], expect: { equals: ["사과"] }, requirement: 안 담은 물건 고르기 }
    - kind: call
      id: all-bought
      visible: false
      description: 살 물건을 모두 담았으면 빈 배열을 돌려줘야 합니다.
      requirement: 안 담은 물건 고르기
      args: [["파", "두부", "김"], ["김", "파"]]
      expect: { equals: [] }
    - kind: call
      id: whole-name
      visible: false
      description: 이름 일부만 같은 물건은 담은 것으로 보면 안 됩니다(요소 전체가 같아야 함).
      requirement: 이름이 완전히 같을 때만
      args: [["우유식빵", "참치캔"], ["우유", "참치캔", "식빵"]]
      expect: { equals: ["우유", "식빵"] }
      misconceptionIfFail: js.mc.array-includes-partial
    - kind: call
      id: keep-cart
      visible: false
      description: 장바구니 배열을 바꾸면 안 됩니다.
      requirement: 배열을 바꾸지 않기
      args: [["우유", "달걀"], ["달걀", "두부", "우유", "파"]]
      expect: { argsUnchanged: true }
      misconceptionIfFail: js.mc.function-arg-array-copied
misconceptions: [js.mc.array-includes-partial]
hints:
  - "`shoppingList`의 물건을 하나씩 보면서 남길지 말지 정하면 돼요. 조건에 맞는 요소만 고르는 메서드를 떠올려 보세요."
  - 물건 하나가 장바구니에 "있는지"는 배열의 어떤 메서드로 알 수 있을까요? 그 메서드는 요소 전체를 비교해요.
  - 남길 물건은 장바구니에 **없는** 물건이에요. 있는지 확인한 결과를 반대로 뒤집는 연산자를 함께 쓰세요.
explanation: |
  예시 정답이에요.

  ```js
  function missingItems(cart, shoppingList) {
    return shoppingList.filter((item) => !cart.includes(item));
  }
  ```

  - `filter`는 콜백이 참을 돌려준 물건만 모은 **새 배열**을 만들어요. 두 배열 모두 바꾸지 않아요.
  - `cart.includes(item)`은 장바구니에 `item`과 **완전히 같은** 요소가 있는지 알려 줘요. `"우유식빵"`이 담겨 있어도 `"우유"`는 없다고 판단하므로 `"우유"`가 결과에 남아요.
  - `!`로 뒤집어서 "장바구니에 없는 물건"만 남겨요.
  - `cart.join(",").includes(item)`처럼 장바구니를 문자열로 이어 붙인 뒤 찾으면 글자 일부도 찾아 버려서, `"우유식빵"`이 있을 때 `"우유"`를 담은 것으로 잘못 판단해요.
  - 반복과 `push`로 새 배열을 만들어도 정답이에요. 다만 `shoppingList`에서 `splice`로 지우면 입력 배열이 바뀌어요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
