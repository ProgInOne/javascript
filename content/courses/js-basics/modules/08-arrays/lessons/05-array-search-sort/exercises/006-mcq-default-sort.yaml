id: js-basics.arrays.array-search-sort.mcq-default-sort
type: mcq_single
difficulty: 1
concepts:
  - { id: js.arr.sort, weight: 1 }
tags: [sort, default-order]
estimatedSeconds: 50
prompt: |
  다음 코드를 실행하면 콘솔에 무엇이 출력되나요?
code: |
  const nums = [10, 9, 1, 100];
  nums.sort();
  console.log(nums);
spec:
  options:
    - id: a
      text: "`[1, 10, 100, 9]`"
    - id: b
      text: "`[1, 9, 10, 100]`"
      misconception: js.mc.sort-numeric-default
      rationale: 비교 함수가 없으면 숫자를 크기가 아니라 문자열의 사전순으로 비교해요.
    - id: c
      text: "`[10, 9, 1, 100]`"
      misconception: js.mc.sort-returns-new-array
      rationale: sort는 결과를 담지 않아도 원래 배열을 직접 정렬해요.
    - id: d
      text: "`[100, 10, 9, 1]`"
      rationale: 기본 정렬은 큰 것부터가 아니라 작은 것부터(사전순 앞부터)예요.
  correct: a
misconceptions: [js.mc.sort-numeric-default]
hints:
  - "`sort()`를 비교 함수 없이 부르면 요소를 어떤 모양으로 바꿔서 비교한다고 했나요?"
  - 네 숫자를 문자열 `"10"`, `"9"`, `"1"`, `"100"`으로 보고, 사전에서처럼 첫 글자부터 비교해 보세요.
  - 첫 글자가 같은 문자열끼리는 다음 글자로 비교하고, 글자가 먼저 끝난 쪽이 앞이에요.
explanation: |
  정답은 `[1, 10, 100, 9]`예요.

  비교 함수 없이 부른 `sort()`는 요소를 **문자열로 바꿔 사전순**으로 정렬해요. `"1"`, `"10"`, `"100"`은 모두 첫 글자가 `1`이라 앞에 오고(짧은 것부터), 첫 글자가 `9`인 `"9"`가 맨 뒤예요.

  - `[1, 9, 10, 100]`: 숫자 크기 순서예요. 이렇게 정렬하려면 `nums.sort((a, b) => a - b)`처럼 비교 함수를 넘겨야 해요.
  - `[10, 9, 1, 100]`: `sort`는 원래 배열을 직접 바꾸므로 결과를 변수에 담지 않아도 `nums`가 정렬돼요.
  - `[100, 10, 9, 1]`: 기본 정렬은 앞에서부터 커지는 순서(오름차순)예요. 큰 것부터 정렬하려면 `(a, b) => b - a`를 넘겨요.
origin: authored
