id: js-basics.arrays.array-search-sort.impl-top-three
type: implement_function
difficulty: 4
concepts:
  - { id: js.arr.sort, weight: 1 }
  - { id: js.arr.slice-concat, weight: 0.5 }
  - { id: js.arr.mutating-vs-not, weight: 0.5 }
tags: [slice, sort, compare-function, no-mutation, boundary, write-code]
estimatedSeconds: 420
prompt: |
  게임 점수판의 TOP 3를 보여 주는 함수 `topThree(scores)`를 완성하세요.

  - 점수가 **높은 것부터** 최대 3개를 새 배열로 돌려줘요.
  - 점수가 3개보다 적으면 있는 점수를 모두 높은 것부터 돌려줘요.
  - 같은 점수가 여러 번 있으면 모두 따로 세요.
  - `scores`는 **들어온 순서 그대로** 남아 있어야 해요(다른 화면에서 기록 순서대로 보여 줘요).

  | 호출 | 돌려줄 값 |
  |---|---|
  | `topThree([70, 100, 85, 9, 92])` | `[100, 92, 85]` |
  | `topThree([5, 40])` | `[40, 5]` |
spec:
  starter:
    files:
      - path: main.js
        content: |
          function topThree(scores) {
            // 여기에 작성하세요
          }
  entry: topThree
  solution:
    files:
      - path: main.js
        content: |
          function topThree(scores) {
            const sorted = scores.slice().sort((a, b) => b - a);
            return sorted.slice(0, 3);
          }
  checks:
    - { kind: call, id: basic, args: [[70, 100, 85, 9, 92]], expect: { equals: [100, 92, 85] }, requirement: 높은 점수 3개 }
    - { kind: call, id: fewer, args: [[5, 40]], expect: { equals: [40, 5] }, requirement: 3개보다 적을 때 }
    - kind: call
      id: digits
      visible: false
      description: 자릿수가 다른 점수도 크기 순으로 골라야 합니다.
      requirement: 높은 점수 3개
      args: [[9, 10, 100, 25]]
      expect: { equals: [100, 25, 10] }
      misconceptionIfFail: js.mc.sort-numeric-default
    - kind: call
      id: ties
      visible: false
      description: 같은 점수는 따로 세어야 합니다.
      requirement: 높은 점수 3개
      args: [[50, 20, 80, 50]]
      expect: { equals: [80, 50, 50] }
    - kind: call
      id: empty
      visible: false
      description: 점수가 없으면 빈 배열이어야 합니다.
      requirement: 3개보다 적을 때
      args: [[]]
      expect: { equals: [] }
    - kind: call
      id: keep-order
      visible: false
      description: 받은 점수 배열의 순서를 바꾸면 안 됩니다.
      requirement: 기록 순서 지키기
      args: [[70, 100, 85, 9, 92]]
      expect: { argsUnchanged: true }
      misconceptionIfFail: js.mc.sort-returns-new-array
    - kind: call
      id: new-array
      visible: false
      description: 점수가 3개 이하여도 받은 배열이 아닌 새 배열을 돌려줘야 합니다.
      requirement: 기록 순서 지키기
      args: [[30, 10, 20]]
      expect: { returnsNewReference: true }
misconceptions: [js.mc.sort-numeric-default, js.mc.sort-returns-new-array]
hints:
  - 할 일을 순서대로 나눠 보세요. 높은 점수부터 정렬하기, 앞에서 3개만 고르기, 그리고 원래 배열 지키기예요.
  - "`sort`는 받은 배열을 직접 바꿔요. 원래 순서를 지키려면 정렬하기 전에 무엇을 해야 할까요? 숫자 정렬에는 비교 함수도 필요해요."
  - 앞에서 3개를 자르는 메서드는 배열이 3개보다 짧아도 오류 없이 있는 만큼만 돌려줘요.
explanation: |
  예시 정답이에요.

  ```js
  function topThree(scores) {
    const sorted = scores.slice().sort((a, b) => b - a);
    return sorted.slice(0, 3);
  }
  ```

  - **원본 지키기**: `scores.slice()`로 복사본을 만든 뒤 정렬해요. `scores.sort(...)`를 바로 부르면 기록 순서가 바뀌어요.
  - **숫자 정렬**: `(a, b) => b - a`로 큰 점수부터 정렬해요. 비교 함수 없이 `sort()` 후 `reverse()`를 하면 `[9, 10, 100, 25]`가 사전순 `[10, 100, 25, 9]`를 뒤집은 `[9, 25, 100, 10]`이 되어 틀려요.
  - **3개 고르기**: `slice(0, 3)`은 점수가 2개나 0개여도 오류 없이 있는 만큼만 새 배열로 돌려줘요. 그래서 따로 `if`를 쓰지 않아도 돼요.
  - **새 배열**: `slice`는 항상 새 배열을 만들어서, 점수가 3개 이하일 때도 받은 배열과 다른 배열을 돌려줘요.
  - 같은 점수 두 개는 정렬해도 둘 다 남으므로 `[80, 50, 50]`이 돼요.
