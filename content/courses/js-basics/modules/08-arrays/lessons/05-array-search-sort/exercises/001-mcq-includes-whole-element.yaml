id: js-basics.arrays.array-search-sort.mcq-includes-whole-element
type: mcq_single
difficulty: 1
concepts:
  - { id: js.arr.includes-indexof, weight: 1 }
tags: [includes, whole-element]
estimatedSeconds: 45
prompt: |
  `["apple", "banana", "cherry"].includes("app")`의 결과는 무엇인가요?
spec:
  options:
    - id: a
      text: "`false`"
    - id: b
      text: "`true`"
      misconception: js.mc.array-includes-partial
      rationale: 배열의 includes는 글자 일부가 아니라 요소 하나와 통째로 비교해요. "app"이라는 요소는 없어요.
    - id: c
      text: "`0`"
      rationale: 위치(인덱스)를 돌려주는 것은 indexOf예요. includes는 true·false만 돌려줘요.
    - id: d
      text: "`\"apple\"`"
      rationale: 찾은 요소를 돌려주는 메서드가 아니에요. includes는 있는지만 true·false로 알려 줘요.
  correct: a
misconceptions: [js.mc.array-includes-partial]
hints:
  - 배열의 includes는 무엇과 무엇을 비교할까요? 글자일까요, 요소일까요?
  - 이 배열의 요소 세 개를 하나씩 `"app"`과 비교해 보세요. 완전히 같은 요소가 있나요?
  - 글자 일부를 찾는 것은 문자열의 includes예요. 배열의 includes는 요소 전체가 같아야 해요.
explanation: |
  정답은 `false`예요.

  배열의 `includes`는 요소 하나하나를 찾는 값과 **통째로** 비교해요. `"apple"`에 `app`이라는 글자가 들어 있지만, `"app"`이라는 요소는 배열에 없어서 `false`예요.

  - `true`: 문자열의 `includes`라면 맞아요. `"apple".includes("app")`은 `true`예요. 배열과 문자열의 `includes`는 이름이 같아도 비교하는 단위가 달라요.
  - `0`: 인덱스를 돌려주는 것은 `indexOf`예요. 게다가 못 찾았으므로 `indexOf("app")`도 `-1`이에요.
  - `"apple"`: `includes`는 찾은 요소를 돌려주지 않고 `true`·`false`만 돌려줘요.

  요소 안의 글자를 찾고 싶다면 `fruits.some((f) => f.includes("app"))`처럼 요소마다 문자열 `includes`를 불러요.
origin: authored
