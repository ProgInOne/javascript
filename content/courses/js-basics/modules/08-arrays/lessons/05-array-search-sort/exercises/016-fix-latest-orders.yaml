id: js-basics.arrays.array-search-sort.fix-latest-orders
type: fix_bug
difficulty: 3
concepts:
  - { id: js.arr.slice-concat, weight: 1 }
  - { id: js.arr.splice, weight: 0.5 }
  - { id: js.arr.mutating-vs-not, weight: 0.3 }
tags: [slice, splice, negative-index, no-mutation, debugging]
estimatedSeconds: 200
prompt: |
  주문 번호 배열 `orders`에서 가장 최근(배열의 끝) 주문 `n`개를 돌려주는 함수 `latest(orders, n)`예요. 돌려주는 값은 맞는데, 이 함수를 쓰고 나면 문제가 생겨요. 고쳐 보세요.

  | 호출 | 돌려줄 값 |
  |---|---|
  | `latest(["A-1", "A-2", "A-3", "A-4"], 2)` | `["A-3", "A-4"]` |
  | `latest(["B-7", "B-8", "B-9"], 1)` | `["B-9"]` |
spec:
  buggy:
    files:
      - path: main.js
        content: |
          function latest(orders, n) {
            return orders.splice(-n);
          }
  solution:
    files:
      - path: main.js
        content: |
          function latest(orders, n) {
            return orders.slice(-n);
          }
  entry: latest
  bugDescription: 최근 주문은 맞게 돌려주지만, 함수를 부르고 나면 원래 주문 목록에서 그 주문들이 사라져 있어요.
  checks:
    - { kind: call, id: two, args: [["A-1", "A-2", "A-3", "A-4"], 2], expect: { equals: ["A-3", "A-4"] }, requirement: 최근 주문 }
    - { kind: call, id: one, args: [["B-7", "B-8", "B-9"], 1], expect: { equals: ["B-9"] }, requirement: 최근 주문 }
    - kind: call
      id: keep-orders
      visible: false
      description: 함수를 불러도 주문 목록에서 주문이 사라지면 안 됩니다.
      requirement: 주문 목록 지키기
      args: [["A-1", "A-2", "A-3", "A-4"], 2]
      expect: { argsUnchanged: true }
      misconceptionIfFail: js.mc.splice-slice-same
    - kind: call
      id: keep-orders-2
      visible: false
      description: 다른 주문 목록과 개수에서도 목록이 그대로여야 합니다.
      requirement: 주문 목록 지키기
      args: [["C-1", "C-2", "C-3", "C-4", "C-5"], 3]
      expect: { argsUnchanged: true }
misconceptions: [js.mc.splice-slice-same]
hints:
  - 돌려주는 값은 맞으니, 함수가 `orders`에 무슨 일을 하는지 살펴보세요.
  - "`splice`는 원래 배열을 바꾸는 메서드였나요, 바꾸지 않는 메서드였나요?"
  - 이름이 비슷하고, 음수 위치도 받으면서 원래 배열을 그대로 두고 일부를 복사하는 메서드가 있어요.
explanation: |
  `orders.splice(-n)`은 뒤에서 `n`개를 **지우고** 지운 요소들을 돌려줘요. 돌려주는 값은 최근 주문과 같지만, 원래 주문 목록에서 그 주문들이 사라져요.

  ```js
  function latest(orders, n) {
    return orders.slice(-n);
  }
  ```

  - `slice(-n)`은 뒤에서 `n`개를 **복사한** 새 배열을 돌려주고, `orders`는 그대로 둬요. 음수가 뒤에서부터 센 위치인 것은 `splice`와 `slice` 모두 같아요.
  - `splice`와 `slice`는 이름이 비슷하지만, `splice`는 원본에서 지우고 `slice`는 복사만 해요. 화면에 보여 주기만 할 값은 원본을 바꾸지 않는 메서드로 만들어요.
