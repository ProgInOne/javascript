id: js-basics.arrays.array-search-sort.fix-seat-number-type
type: fix_bug
difficulty: 3
concepts:
  - { id: js.arr.includes-indexof, weight: 1 }
  - { id: js.conv.to-number, weight: 0.5 }
tags: [includes, type, number, debugging]
estimatedSeconds: 200
prompt: |
  영화관 좌석 예매 화면이에요. 이미 예약된 좌석 번호는 숫자 배열 `reserved`에 있고, 사용자가 입력창에 적은 좌석 번호는 `input`으로 들어와요. **입력창의 값은 항상 문자열**이에요(예: `"12"`).

  함수 `isReserved(reserved, input)`는 입력한 좌석이 이미 예약되었으면 `true`, 아니면 `false`를 돌려줘야 해요. 고쳐 보세요.

  | 호출 | 돌려줄 값 |
  |---|---|
  | `isReserved([3, 12, 25], "12")` | `true` |
  | `isReserved([3, 12, 25], "4")` | `false` |
spec:
  buggy:
    files:
      - path: main.js
        content: |
          function isReserved(reserved, input) {
            return reserved.includes(input);
          }
  solution:
    files:
      - path: main.js
        content: |
          function isReserved(reserved, input) {
            return reserved.includes(Number(input));
          }
  entry: isReserved
  bugDescription: "예약된 좌석 번호를 입력해도 `isReserved([3, 12, 25], \"12\")`가 `false`를 돌려줘요."
  checks:
    - { kind: call, id: reserved-seat, args: [[3, 12, 25], "12"], expect: { equals: true }, requirement: 예약 확인 }
    - { kind: call, id: free-seat, args: [[3, 12, 25], "4"], expect: { equals: false }, requirement: 예약 확인 }
    - kind: call
      id: first-seat
      visible: false
      description: 배열의 맨 앞에 있는 좌석도 예약된 것으로 찾아야 합니다.
      requirement: 예약 확인
      args: [[7, 8], "7"]
      expect: { equals: true }
      misconceptionIfFail: js.mc.includes-loose-match
    - kind: call
      id: partial-number
      visible: false
      description: 숫자 일부만 같은 좌석(25와 2)은 다른 좌석입니다.
      requirement: 예약 확인
      args: [[3, 12, 25], "2"]
      expect: { equals: false }
misconceptions: [js.mc.includes-loose-match]
hints:
  - "`reserved`의 요소와 `input`의 자료형을 각각 적어 보세요. 같은 자료형인가요?"
  - 배열의 includes는 `===`처럼 자료형까지 같아야 같은 요소로 봐요. 문자열 `"12"`와 숫자 `12`는 같을까요?
  - 비교하기 전에 두 값의 자료형을 맞춰야 해요. 모듈 3에서 배운, 문자열을 숫자로 바꾸는 방법을 떠올려 보세요.
explanation: |
  `reserved`에는 숫자 `12`가 있고, `input`은 문자열 `"12"`예요. 배열의 `includes`는 자료형까지 같아야 같은 요소로 보므로 `false`가 나왔어요.

  ```js
  function isReserved(reserved, input) {
    return reserved.includes(Number(input));
  }
  ```

  - `Number(input)`으로 입력을 숫자로 바꾼 뒤 찾으면 `12`와 `12`를 비교하게 되어 `true`예요.
  - `reserved.indexOf(Number(input)) !== -1`로 써도 같은 결과예요.
  - 예약 번호를 모두 문자열로 바꿔 이어 붙인 뒤 문자열 `includes`로 찾으면, `"2"`를 입력했을 때 `25`의 일부를 찾아 예약됐다고 잘못 판단해요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
