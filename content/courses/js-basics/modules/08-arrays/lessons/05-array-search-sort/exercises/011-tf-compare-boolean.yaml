id: js-basics.arrays.array-search-sort.tf-compare-boolean
type: true_false
difficulty: 2
concepts:
  - { id: js.arr.sort, weight: 1 }
tags: [sort, compare-function, boolean]
estimatedSeconds: 70
prompt: |
  다음 설명이 맞는지 고르고, 그렇게 판단한 이유도 고르세요.
spec:
  statement: "`nums.sort((a, b) => a > b)`처럼 비교 함수가 `a > b`의 결과를 돌려주면 `nums`는 작은 수부터 정렬된다."
  answer: false
  misconceptionIfWrong: js.mc.sort-compare-boolean
  requireReason: true
  reasons:
    - id: r1
      text: 비교 함수는 음수·0·양수로 순서를 알려 줘야 하는데, a > b는 true·false라서 음수가 나오지 않는다
      correct: true
    - id: r2
      text: a > b는 큰 수부터 정렬하는 비교 함수라서 작은 수부터가 아니라 큰 수부터 정렬된다
      misconception: js.mc.sort-compare-boolean
    - id: r3
      text: sort에는 함수를 넘길 수 없어서 오류가 난다
    - id: r4
      text: 비교 함수는 a와 b 중 앞에 올 값을 돌려줘야 하는데 true·false를 돌려줬다
hints:
  - 비교 함수가 돌려주는 값의 **부호**에 따라 순서가 정해진다고 배웠어요. 어떤 부호들이었나요?
  - "`a > b`가 돌려줄 수 있는 값은 두 가지예요. 숫자로 바꾸면 각각 무엇인가요?"
  - 그 두 숫자 중에 "`a`를 앞에" 놓으라는 뜻의 값이 있는지 확인해 보세요.
explanation: |
  정답은 **거짓**이에요. 이유는 "비교 함수는 음수·0·양수로 순서를 알려 줘야 하는데, a > b는 true·false라서 음수가 나오지 않는다"예요.

  `sort`는 비교 함수가 음수를 돌려주면 `a`를 앞에, 양수면 `b`를 앞에 놓아요. `a > b`는 `true`(숫자로 1)나 `false`(숫자로 0)만 돌려주므로 "`a`를 앞에"라는 신호가 나오지 않아서 제대로 정렬되지 않아요. 실제로 `[5, 1, 4, 2, 3].sort((a, b) => a > b)`는 `[5, 1, 4, 2, 3]` 그대로예요.

  - 큰 수부터 정렬된다는 이유: 방향의 문제가 아니라, 정렬 자체가 제대로 되지 않아요.
  - 오류가 난다는 이유: `sort`는 비교 함수를 받는 메서드라 오류는 나지 않아요. 조용히 잘못된 결과를 낼 뿐이에요.
  - 앞에 올 값을 돌려줘야 한다는 이유: 비교 함수는 값 자체가 아니라 순서를 알리는 숫자를 돌려줘요.

  작은 수부터 정렬하려면 `(a, b) => a - b`를 써요.
