id: js-basics.arrays.array-search-sort.tf-compare-boolean
type: true_false
difficulty: 2
concepts:
  - { id: js.arr.sort, weight: 1 }
tags: [sort, compare-function, boolean]
estimatedSeconds: 70
prompt: |
  다음 설명이 맞는지 고르고, 그렇게 판단한 이유도 고르세요.
spec:
  statement: "`nums.sort((a, b) => a > b)`의 비교 함수는 `a`가 `b`보다 작을 때 \"`a`를 앞에 놓아라\"라는 신호를 `sort`에 줄 수 있다."
  answer: false
  misconceptionIfWrong: js.mc.sort-compare-boolean
  requireReason: true
  reasons:
    - id: r1
      text: "\"a를 앞에\"라는 신호는 음수인데, a > b는 true(1)나 false(0)만 돌려줘서 음수가 나오지 않는다"
      correct: true
    - id: r2
      text: a가 작으면 a > b가 false가 되고, sort는 false를 "a를 앞에"라는 뜻으로 읽는다
      misconception: js.mc.sort-compare-boolean
    - id: r3
      text: sort에는 함수를 넘길 수 없어서 오류가 난다
    - id: r4
      text: true·false는 숫자로 바뀌지 않아서 sort가 비교 함수를 무시하고 기본 정렬(사전순)을 한다
hints:
  - 비교 함수가 돌려주는 값의 **부호**에 따라 순서가 정해진다고 배웠어요. "`a`를 앞에"는 어떤 부호였나요?
  - "`a > b`가 돌려줄 수 있는 값은 두 가지예요. 숫자로 바꾸면 각각 무엇인가요?"
  - 그 두 숫자 중에 음수가 있는지 확인해 보세요.
explanation: |
  정답은 **거짓**이에요. 이유는 "\"a를 앞에\"라는 신호는 음수인데, a > b는 true(1)나 false(0)만 돌려줘서 음수가 나오지 않는다"예요.

  `sort`는 비교 함수가 음수를 돌려주면 `a`를 앞에, 양수면 `b`를 앞에 놓고, 0이면 순서를 바꾸지 않아요. `a > b`는 `true`(숫자로 1)나 `false`(숫자로 0)만 돌려줘요. `a`가 `b`보다 작을 때는 `false`, 즉 0이라서 "순서를 바꾸지 않음"이 될 뿐 "`a`를 앞에"라고 말하지 못해요.

  - `false`를 "`a`를 앞에"로 읽는다는 이유: `false`는 0으로 바뀌어 "순서를 바꾸지 않음"이에요. 음수가 아니에요.
  - 오류가 난다는 이유: `sort`는 비교 함수를 받는 메서드라 오류는 나지 않아요. 조용히 믿을 수 없는 결과를 낼 뿐이에요.
  - 기본 정렬을 한다는 이유: 비교 함수가 돌려준 `true`·`false`는 무시되지 않고 `1`·`0`으로 바뀌어 쓰여요. 기본 정렬을 하는 것이 아니라, 어떤 순서가 나올지 브라우저와 배열에 따라 달라져요.

  작은 수부터 정렬하려면 `(a, b) => a - b`를 써요. `a`가 작으면 음수가 나와서 `a`가 앞에 와요.
