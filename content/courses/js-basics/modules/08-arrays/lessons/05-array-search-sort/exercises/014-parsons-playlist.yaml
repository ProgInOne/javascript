id: js-basics.arrays.array-search-sort.parsons-playlist
type: parsons
difficulty: 2
concepts:
  - { id: js.arr.slice-concat, weight: 1 }
  - { id: js.str.split-join, weight: 0.3 }
tags: [concat, slice, join, parsons]
estimatedSeconds: 150
prompt: |
  내 노래 목록과 친구의 노래 목록을 이어 하나의 재생 목록을 만들고, 앞의 세 곡만 미리 듣기로 보여 주는 프로그램이에요. 코드 조각을 순서대로 배열해서 아래처럼 출력되게 하세요. 두 번째 줄은 전체 재생 목록의 곡 수예요.

  ```text
  아침 산책 / 비 오는 날 / 여름 바다
  5
  ```
spec:
  lines:
    - { id: l1, code: 'const myList = ["아침 산책", "비 오는 날"];' }
    - { id: l2, code: 'const friendList = ["여름 바다", "별 헤는 밤", "첫눈"];' }
    - { id: l3, code: "const playlist = myList.concat(friendList);" }
    - { id: l4, code: "const preview = playlist.slice(0, 3);" }
    - { id: l5, code: 'console.log(preview.join(" / "));' }
    - { id: l6, code: "console.log(playlist.length);" }
  distractors:
    - { id: d1, code: "const playlist = myList.push(friendList);", replaces: l3, misconception: js.mc.push-returns-new-array }
    - { id: d2, code: "const preview = playlist.splice(0, 3);", replaces: l4, misconception: js.mc.splice-slice-same }
    - { id: d3, code: "const preview = playlist.slice(0, 2);", replaces: l4, misconception: js.mc.slice-end-inclusive }
  gradeIndent: false
  checks:
    - kind: console
      id: output
      description: 앞의 세 곡이 " / "로 이어져 출력되고, 다음 줄에 전체 곡 수 5가 출력되어야 합니다.
      requirement: 재생 목록 만들기
      expect:
        lines: ["아침 산책 / 비 오는 날 / 여름 바다", "5"]
    - kind: program
      id: no-error
      description: 프로그램이 오류 없이 끝나야 합니다.
      requirement: 재생 목록 만들기
      expect:
        noError: true
misconceptions: [js.mc.splice-slice-same, js.mc.array-slice-mutates]
hints:
  - 두 목록을 만드는 줄을 먼저 놓고, 그다음 두 목록을 잇는 줄, 앞부분을 자르는 줄, 출력하는 줄 순서로 생각해 보세요.
  - 두 배열의 요소를 이어 새 배열을 만드는 메서드와, 배열 끝에 값 하나를 넣고 길이를 돌려주는 메서드를 구별하세요.
  - 앞의 세 곡을 고를 때 원래 재생 목록이 줄어들면 마지막 줄의 곡 수가 달라져요. 끝 인덱스의 요소는 들어가지 않는다는 점도 떠올려 보세요.
explanation: |
  정답 순서의 예예요.

  ```js
  const myList = ["아침 산책", "비 오는 날"];
  const friendList = ["여름 바다", "별 헤는 밤", "첫눈"];
  const playlist = myList.concat(friendList);
  const preview = playlist.slice(0, 3);
  console.log(preview.join(" / "));
  console.log(playlist.length);
  ```

  - `concat`은 두 목록의 요소를 이은 새 배열(5곡)을 만들어요. `myList.push(friendList)`는 배열을 요소 하나로 넣고 새 길이 `3`을 돌려주므로 `playlist`가 숫자가 되어 다음 줄에서 오류가 나요.
  - `slice(0, 3)`은 0번부터 3번 바로 앞까지, 세 곡을 복사해요. `slice(0, 2)`는 두 곡뿐이에요.
  - `splice(0, 3)`도 세 곡을 돌려주지만 `playlist`에서 그 세 곡을 지워서 곡 수가 2가 돼요.
  - 두 목록을 만드는 줄은 서로 순서를 바꿔도 정답이에요.
origin: authored
