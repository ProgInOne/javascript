hints:
  - "`[10, 9, 1]`에 `sort()`를 하면 어떤 순서가 되는지 직접 적어 보세요. 그 가운데 값이 `10`인가요?"
  - "`sort`는 받은 배열을 직접 바꿔요. 함수를 부른 쪽에서도 같은 배열을 쓰고 있다는 점을 떠올려 보세요."
  - 정렬은 원본이 아니라 원본을 복사한 배열에 해야 해요. 그리고 숫자를 크기 순으로 놓는 비교 함수를 넘기세요.
explanation: |
  문제는 2번 줄 `nums.sort();` 하나에 두 가지가 겹쳐 있어요.

  1. **비교 함수가 없어요.** 숫자를 문자열로 바꿔 사전순으로 정렬해서 `[10, 9, 1]`이 `[1, 10, 9]`가 됐어요. 가운데 값이 `10`으로 나온 이유예요.
  1. **받은 배열을 직접 정렬해요.** `sort`는 원본을 바꾸므로, 함수를 부른 쪽의 점수 배열 순서까지 바뀌어요.

  ```js
  function median(nums) {
    const sorted = nums.slice().sort((a, b) => a - b);
    const count = sorted.length;
    if (count % 2 === 1) {
      return sorted[(count - 1) / 2];
    }
    return (sorted[count / 2 - 1] + sorted[count / 2]) / 2;
  }
  ```

  - `nums.slice()`로 복사본을 만들고 그것을 정렬해요. `nums`는 들어온 순서 그대로예요.
  - `(a, b) => a - b`로 작은 수부터 정렬해요. `[9, 100, 80, 10]`은 `[9, 10, 80, 100]`이 되고, 가운데 두 값 `10`과 `80`의 평균은 `45`예요.
  - 비교 함수만 고치면 값은 맞지만 원본이 바뀌고, 복사만 하면 원본은 지키지만 값이 틀려요. 두 가지를 모두 고쳐야 해요.
