  - { id: js.arr.slice-concat, weight: 0.5 }
  - { id: js.arr.mutating-vs-not, weight: 0.5 }
tags: [sort, compare-function, slice, no-mutation, median, debugging]
estimatedSeconds: 360
prompt: |
  반 학생들의 점수 배열을 받아 **중앙값**(크기 순으로 놓았을 때 가운데 값)을 돌려주는 함수 `median(nums)`예요.

  - 점수가 홀수 개면 가운데 값을, 짝수 개면 가운데 두 값의 평균을 돌려줘요.
  - 점수 배열은 다른 화면에서 **들어온 순서대로** 다시 쓰므로, 함수가 받은 배열의 순서를 바꾸면 안 돼요.

  | 호출 | 돌려줄 값 |
  |---|---|
  | `median([10, 9, 1])` | `9` |
  | `median([100, 20, 5, 40])` | `30` |

  이 함수에는 문제가 두 가지 있어요. 모두 고쳐 보세요.
spec:
  buggy:
    files:
      - path: main.js
        content: |
          function median(nums) {
            nums.sort();
            const count = nums.length;
            if (count % 2 === 1) {
              return nums[(count - 1) / 2];
            }
            return (nums[count / 2 - 1] + nums[count / 2]) / 2;
          }
  solution:
    files:
      - path: main.js
        content: |
          function median(nums) {
            const sorted = nums.slice().sort((a, b) => a - b);
            const count = sorted.length;
            if (count % 2 === 1) {
              return sorted[(count - 1) / 2];
            }
            return (sorted[count / 2 - 1] + sorted[count / 2]) / 2;
          }
