id: js-basics.arrays.array-search-sort.predict-sort-same-array
type: predict_output
difficulty: 3
concepts:
  - { id: js.arr.sort, weight: 1 }
  - { id: js.arr.push-pop, weight: 0.3 }
  - { id: js.arr.mutating-vs-not, weight: 0.3 }
tags: [sort, same-array, push, mutation]
estimatedSeconds: 130
prompt: |
  실행하면 콘솔에 무엇이 출력될까요? 세 줄을 차례로 적어 보세요.
spec:
  lang: js
  code: |
    const scores = [80, 100, 95];
    const ranking = scores.sort((a, b) => b - a);
    ranking.push(60);
    console.log(scores);
    console.log(ranking.length);
    console.log(scores[0]);
  answerKind: console
  misconceptionByAnswer:
    "[80, 100, 95]\n4\n80": js.mc.sort-returns-new-array
    "[100, 95, 80]\n4\n100": js.mc.sort-returns-new-array
    "[100, 95, 80, 60]\n4\n80": js.mc.sort-returns-new-array
hints:
  - "`(a, b) => b - a`는 어느 쪽부터 정렬하는 비교 함수였나요?"
  - "`sort`가 돌려준 `ranking`은 새로 만든 배열일까요, `scores`와 같은 배열일까요?"
  - 같은 배열에 이름이 두 개 붙어 있다면, 한쪽 이름으로 `push`한 결과가 다른 이름으로도 보일까요?
explanation: |
  출력은 다음과 같아요.

  ```text
  [100, 95, 80, 60]
  4
  100
  ```

  - 2번 줄의 `sort`는 `scores`를 큰 점수부터 직접 정렬하고, 그 **같은 배열**을 돌려줘요. 그래서 `ranking`과 `scores`는 이름만 다른 같은 배열이에요.
  - 3번 줄에서 `ranking`에 `60`을 넣으면, 같은 배열이므로 `scores`로 봐도 `60`이 들어 있어요. 요소는 4개예요.
  - `scores[0]`은 정렬된 배열의 맨 앞인 `100`이에요.

  `scores`를 들어온 순서 그대로 남기고 싶었다면 `const ranking = scores.slice().sort((a, b) => b - a);`처럼 복사본을 정렬해야 해요.
