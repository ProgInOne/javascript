id: js-basics.arrays.array-search-sort.check-slice-keeps-queue
type: predict_output
difficulty: 2
usage: check
concepts:
  - { id: js.arr.slice-concat, weight: 1 }
  - { id: js.arr.mutating-vs-not, weight: 0.3 }
tags: [slice, non-mutating, check]
estimatedSeconds: 60
prompt: |
  실행하면 콘솔에 무엇이 출력될까요? 두 줄을 차례로 적어 보세요.
spec:
  lang: js
  code: |
    const queue = ["가", "나", "다", "라"];
    const front = queue.slice(1, 3);
    console.log(front);
    console.log(queue.length);
  answerKind: console
  misconceptionByAnswer:
    "[\"나\", \"다\"]\n2": js.mc.array-slice-mutates
misconceptions: [js.mc.array-slice-mutates]
hints:
  - "`slice(1, 3)`은 몇 번부터 몇 번 바로 앞까지인가요?"
  - 끝 인덱스 3의 요소는 결과에 들어가지 않아요.
  - "`slice`는 원래 배열에서 요소를 빼낼까요, 복사해서 새 배열을 만들까요?"
explanation: |
  출력은 다음과 같아요.

  ```text
  ["나", "다"]
  4
  ```

  - `slice(1, 3)`은 1번부터 3번 **바로 앞**(2번)까지를 복사한 새 배열이에요.
  - `slice`는 원래 배열을 바꾸지 않아서 `queue`는 그대로 4개예요. 요소를 실제로 빼내는 것은 `splice`예요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
