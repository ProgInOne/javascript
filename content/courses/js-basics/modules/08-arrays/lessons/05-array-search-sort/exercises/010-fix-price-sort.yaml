id: js-basics.arrays.array-search-sort.fix-price-sort
type: fix_bug
difficulty: 2
concepts:
  - { id: js.arr.sort, weight: 1 }
tags: [sort, default-order, compare-function, debugging]
estimatedSeconds: 150
prompt: |
  가격 배열을 받아 **낮은 가격부터** 정렬해 돌려주는 함수 `cheapestFirst(prices)`예요. 이 문제에서는 받은 배열을 직접 정렬해도 괜찮아요. 그런데 결과가 이상해요. 고쳐 보세요.

  | 호출 | 돌려줄 값 |
  |---|---|
  | `cheapestFirst([5000, 800, 12000])` | `[800, 5000, 12000]` |
  | `cheapestFirst([300, 25, 1000])` | `[25, 300, 1000]` |
spec:
  buggy:
    files:
      - path: main.js
        content: |
          function cheapestFirst(prices) {
            prices.sort();
            return prices;
          }
  solution:
    files:
      - path: main.js
        content: |
          function cheapestFirst(prices) {
            prices.sort((a, b) => a - b);
            return prices;
          }
  entry: cheapestFirst
  bugDescription: "`cheapestFirst([5000, 800, 12000])`가 `[800, 5000, 12000]`이 아니라 `[12000, 5000, 800]`을 돌려줘요."
  checks:
    - { kind: call, id: basic, args: [[5000, 800, 12000]], expect: { equals: [800, 5000, 12000] }, requirement: 낮은 가격부터 }
    - { kind: call, id: second, args: [[300, 25, 1000]], expect: { equals: [25, 300, 1000] }, requirement: 낮은 가격부터 }
    - kind: call
      id: one-digit
      visible: false
      description: 자릿수가 다른 가격도 크기 순으로 정렬해야 합니다.
      requirement: 낮은 가격부터
      args: [[10, 9]]
      expect: { equals: [9, 10] }
      misconceptionIfFail: js.mc.sort-numeric-default
misconceptions: [js.mc.sort-numeric-default]
hints:
  - 결과 `[12000, 5000, 800]`을 문자열 `"12000"`, `"5000"`, `"800"`으로 보면 어떤 순서인가요?
  - 비교 함수 없이 부른 `sort()`는 숫자 크기가 아니라 다른 기준으로 정렬해요.
  - "`sort`에 두 값 `a`, `b`를 받아 작은 수가 앞에 오게 하는 비교 함수를 넘겨 보세요. 음수면 `a`가 앞이에요."
explanation: |
  `prices.sort()`가 비교 함수 없이 불려서 숫자를 문자열로 바꿔 **사전순**으로 정렬했어요. `"12000"`(첫 글자 1) → `"5000"`(5) → `"800"`(8) 순서라 `[12000, 5000, 800]`이 된 거예요.

  ```js
  function cheapestFirst(prices) {
    prices.sort((a, b) => a - b);
    return prices;
  }
  ```

  - `(a, b) => a - b`는 `a`가 작으면 음수를 돌려줘 `a`를 앞에 놓아요. 그래서 작은 수부터 정렬돼요.
  - `return prices.sort((a, b) => a - b);`로 한 줄로 써도 같아요. `sort`는 정렬한 그 배열을 돌려줘요.
