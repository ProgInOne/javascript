id: js-basics.arrays.array-search-sort
title: 찾기와 정렬
summary: includes·indexOf로 배열에서 값을 찾고, sort와 비교 함수로 숫자·문자열을 원하는 순서로 정렬하고, slice·concat으로 원래 배열을 지키면서 새 배열을 만드는 법을 배웁니다.
kind: lesson
importance: standard
estimatedMinutes: { read: 15, practice: 28 }
concepts:
  primary: [js.arr.includes-indexof, js.arr.sort, js.arr.slice-concat]
  practiced: [js.arr.mutating-vs-not, js.arr.splice, js.arr.map, js.arr.filter]
  reviewed: [js.str.search, js.str.slice, js.ops.relational, js.fn.callback]
objectives:
  - includes·indexOf로 배열에 값이 있는지와 위치를 찾고, 요소 전체·자료형까지 같아야 찾는다는 것을 설명할 수 있다.
  - sort가 기본으로 문자열 사전순 정렬을 한다는 것을 알고, 비교 함수로 숫자를 오름차순·내림차순으로 정렬할 수 있다.
  - sort가 원래 배열을 바꾼다는 것을 알고, slice로 복사한 뒤 정렬해 원본을 지킬 수 있다.
  - slice와 concat으로 원래 배열을 바꾸지 않고 일부를 복사하거나 배열을 이을 수 있다.
practice:
  targetCount: 18
