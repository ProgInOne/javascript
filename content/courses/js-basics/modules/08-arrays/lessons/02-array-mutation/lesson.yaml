id: js-basics.arrays.array-mutation
title: 배열 바꾸기
summary: push·pop·shift·unshift로 배열의 끝과 앞에 요소를 넣고 빼고, splice로 중간 요소를 지우고 넣는 법과, 원래 배열을 바꾸는 메서드와 바꾸지 않는 메서드를 구별하고 각각 무엇을 돌려주는지 배웁니다.
kind: lesson
importance: core
estimatedMinutes: { read: 16, practice: 32 }
concepts:
  primary: [js.arr.push-pop, js.arr.shift-unshift, js.arr.splice, js.arr.mutating-vs-not]
  practiced: [js.arr.literal-index, js.arr.length, js.arr.element-update]
  reviewed: [js.str.immutability, js.str.split-join, js.fn.return, js.loops.for]
objectives:
  - push·pop으로 배열 끝에, unshift·shift로 배열 앞에 요소를 넣고 빼며, 각 메서드가 돌려주는 값을 예측할 수 있다.
  - splice(시작, 지울 개수, 넣을 값)으로 중간 요소를 지우거나 넣고, 두 번째 인수가 개수라는 것을 알고 쓸 수 있다.
  - 원래 배열을 바꾸는 메서드와 새 값을 돌려주는 메서드를 구별하고, 결과를 다시 대입해 생기는 버그를 고칠 수 있다.
  - 입력 배열을 바꾸지 말아야 하는 함수와 바꿔야 하는 함수를 요구사항에 맞게 작성할 수 있다.
practice:
  targetCount: 22
