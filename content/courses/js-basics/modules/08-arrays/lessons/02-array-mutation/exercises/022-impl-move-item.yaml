id: js-basics.arrays.array-mutation.impl-move-item
type: implement_function
difficulty: 5
concepts:
  - { id: js.arr.mutating-vs-not, weight: 1 }
  - { id: js.arr.splice, weight: 0.5 }
  - { id: js.control.if, weight: 0.3 }
tags: [splice, non-mutating, copy, index-shift, boundary, write-code]
estimatedSeconds: 600
prompt: |
  할 일 앱에서 항목을 끌어 순서를 바꾸는 기능을 만들어요. 목록 `list`에서 `from` 인덱스의 항목을 꺼내, 결과 목록의 `to` 인덱스에 오도록 옮긴 **새 배열**을 돌려주는 함수 `moveItem(list, from, to)`를 완성하세요.

  - `to`는 옮긴 **뒤의** 목록에서 그 항목이 있을 인덱스예요. 0부터 `list.length - 1` 사이의 값만 들어와요.
  - `from`이 목록에 없는 인덱스(음수이거나 `list.length` 이상)이면 아무것도 옮기지 않은 목록을 새 배열로 돌려줘요.
  - 원래 목록 `list`는 "되돌리기"에 쓰이므로 **바꾸면 안 돼요.**

  | 호출 | 돌려줄 값 |
  |---|---|
  | `moveItem(["a", "b", "c", "d"], 0, 2)` | `["b", "c", "a", "d"]` |
  | `moveItem(["a", "b", "c", "d"], 3, 0)` | `["d", "a", "b", "c"]` |
spec:
  starter:
    files:
      - path: main.js
        content: |
          function moveItem(list, from, to) {
            // 여기에 작성하세요
          }
  entry: moveItem
  solution:
    files:
      - path: main.js
        content: |
          function moveItem(list, from, to) {
            const result = [];
            for (let i = 0; i < list.length; i++) {
              result.push(list[i]);
            }
            if (from < 0 || from >= list.length) {
              return result;
            }
            const removed = result.splice(from, 1);
            result.splice(to, 0, removed[0]);
            return result;
          }
  checks:
    - kind: call
      id: forward
      args: [["a", "b", "c", "d"], 0, 2]
      expect: { equals: ["b", "c", "a", "d"] }
      requirement: 항목 옮기기
    - kind: call
      id: backward
      args: [["a", "b", "c", "d"], 3, 0]
      expect: { equals: ["d", "a", "b", "c"] }
      requirement: 항목 옮기기
    - kind: call
      id: to-last
      visible: false
      description: 가운데 항목을 맨 끝 인덱스로 옮길 수 있어야 합니다.
      requirement: 항목 옮기기
      args: [["빨래", "청소", "요리", "운동"], 1, 3]
      expect: { equals: ["빨래", "요리", "운동", "청소"] }
    - kind: call
      id: no-nesting
      visible: false
      description: 옮긴 항목은 배열에 싸이지 않은 값 그대로 들어가야 합니다.
      requirement: 항목 옮기기
      args: [["x", "y", "z"], 2, 1]
      expect: { equals: ["x", "z", "y"] }
    - kind: call
      id: same-place
      visible: false
      description: from과 to가 같으면 순서가 그대로인 목록이어야 합니다.
      requirement: 항목 옮기기
      args: [["a", "b", "c"], 1, 1]
      expect: { equals: ["a", "b", "c"] }
    - kind: call
      id: from-negative
      visible: false
      description: from이 음수이면 아무것도 옮기지 않아야 합니다.
      requirement: 없는 위치
      args: [["a", "b", "c"], -1, 0]
      expect: { equals: ["a", "b", "c"] }
    - kind: call
      id: from-too-big
      visible: false
      description: from이 목록 길이 이상이면 아무것도 옮기지 않아야 합니다.
      requirement: 없는 위치
      args: [["a", "b", "c"], 3, 0]
      expect: { equals: ["a", "b", "c"] }
    - kind: call
      id: keep-input
      visible: false
      description: 원래 목록을 바꾸면 안 됩니다.
      requirement: 원래 목록 지키기
      args: [["a", "b", "c", "d"], 0, 3]
      expect: { argsUnchanged: true }
      misconceptionIfFail: js.mc.function-arg-array-copied
    - kind: call
      id: new-array
      visible: false
      description: 옮기지 않는 경우에도 원래 목록이 아닌 새 배열을 돌려줘야 합니다.
      requirement: 원래 목록 지키기
      args: [["a", "b"], 5, 0]
      expect: { returnsNewReference: true }
misconceptions: [js.mc.function-arg-array-copied, js.mc.splice-second-arg-end]
hints:
  - 원래 목록은 건드리지 말고, 먼저 똑같은 요소를 담은 새 배열을 만들어 그 배열만 바꾸세요.
  - 옮기기는 "꺼내기"와 "끼워 넣기" 두 번의 `splice`로 나눌 수 있어요. 꺼내는 `splice`가 무엇을 돌려주는지, 그리고 꺼낸 뒤 뒤쪽 요소들의 인덱스가 어떻게 되는지 확인해 보세요.
  - "`from`이 없는 위치일 때를 반복이나 `splice`보다 먼저 확인하세요. `splice`에 음수를 주면 뒤에서부터 센 위치가 되어 버려요."
explanation: |
  예시 정답이에요.

  ```js
  function moveItem(list, from, to) {
    const result = [];
    for (let i = 0; i < list.length; i++) {
      result.push(list[i]);
    }
    if (from < 0 || from >= list.length) {
      return result;
    }
    const removed = result.splice(from, 1);
    result.splice(to, 0, removed[0]);
    return result;
  }
  ```

  이 문제에는 함정이 세 가지 있어요.

  - **원래 목록 지키기**: `list.splice(...)`를 바로 쓰면 함수에 넘긴 목록이 바뀌어요. 같은 배열이기 때문이에요. 그래서 먼저 요소를 옮겨 담은 새 배열 `result`를 만들고 그 배열에만 `splice`를 써요. 옮기지 않는 경우에도 `list`가 아니라 `result`를 돌려줘야 새 배열이에요. 다음 단원들에서 배울 `list.slice()`로도 복사본을 만들 수 있어요.
  - **`splice`는 배열을 돌려줘요**: `result.splice(from, 1)`은 꺼낸 요소 하나가 아니라 `["a"]`처럼 요소 하나짜리 배열이에요. 이것을 그대로 `result.splice(to, 0, removed)`로 넣으면 `["b", "c", ["a"], "d"]`처럼 배열이 통째로 들어가요. `removed[0]`으로 요소를 꺼내 넣어요.
  - **없는 위치**: `from`이 `-1`이면 `splice(-1, 1)`이 마지막 요소를 꺼내 버려요. 그래서 `splice`보다 먼저 범위를 확인해요.

  `to`를 "옮긴 뒤의 인덱스"로 정했기 때문에 순서가 중요해요. 먼저 꺼내면 뒤쪽 요소들이 한 칸씩 당겨진 상태가 되고, 그 상태에서 `to` 자리에 넣으면 결과 목록에서 정확히 `to` 인덱스에 놓여요. `["a", "b", "c", "d"]`에서 0번을 꺼내면 `["b", "c", "d"]`가 되고, 2번 자리에 넣으면 `["b", "c", "a", "d"]`예요.
