id: js-basics.arrays.array-mutation.check-pop-returns
type: mcq_single
difficulty: 1
usage: check
concepts:
  - { id: js.arr.push-pop, weight: 1 }
tags: [pop, return-value, check]
estimatedSeconds: 45
prompt: |
  쌓아 둔 상자 중 맨 위 상자를 내리는 코드예요. 실행한 뒤 `top`에 들어 있는 값은 무엇인가요?
code: |
  const boxes = ["책", "옷", "그릇"];
  const top = boxes.pop();
spec:
  options:
    - id: a
      text: '`"그릇"`'
    - id: b
      text: '`2`'
      rationale: 길이를 돌려주는 것은 `push`·`unshift`예요. `pop`은 꺼낸 요소를 돌려줘요.
    - id: c
      text: '`["책", "옷"]`'
      rationale: 남은 배열은 `boxes` 자체예요. `pop`이 돌려주는 값은 꺼낸 요소 하나예요.
    - id: d
      text: '`"책"`'
      rationale: 맨 앞 요소를 꺼내는 것은 `shift`예요. `pop`은 맨 끝 요소를 꺼내요.
  correct: a
hints:
  - "`pop`은 배열의 앞과 끝 중 어느 쪽에서 요소를 빼나요?"
  - "`pop`은 뺀 것을 버리지 않고 돌려줘요. 무엇을 돌려줄까요?"
  - 배열의 마지막 요소가 무엇인지 보세요.
explanation: |
  정답은 `"그릇"`이에요.

  `pop()`은 배열의 **마지막 요소**를 꺼내 돌려주고, 배열에서는 지워요. 그래서 `top`은 `"그릇"`이고, `boxes`에는 `["책", "옷"]`이 남아요.

  - `2`: 새 길이를 돌려주는 메서드는 `push`와 `unshift`예요.
  - `["책", "옷"]`: 남은 배열은 `top`이 아니라 `boxes`에 있어요.
  - `"책"`: 맨 앞을 꺼내는 메서드는 `shift`예요.
origin: authored
