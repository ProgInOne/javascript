id: js-basics.arrays.array-mutation.multi-mutating-methods
type: mcq_multi
difficulty: 3
concepts:
  - { id: js.arr.mutating-vs-not, weight: 1 }
tags: [mutating, push, splice, shift, join, slice]
estimatedSeconds: 120
prompt: |
  `const nums = [3, 1, 2];`가 있어요. 아래 코드를 한 줄만 실행했을 때 `nums` **자체가 바뀌는** 것을 모두 고르세요.
spec:
  options:
    - id: a
      text: "`nums.push(4);`"
      missedMisconception: js.mc.mutating-method-keeps-original
    - id: b
      text: "`nums.splice(0, 1);`"
      missedMisconception: js.mc.mutating-method-keeps-original
    - id: c
      text: "`nums.shift();`"
      missedMisconception: js.mc.mutating-method-keeps-original
    - id: d
      text: '`nums.join("-");`'
      misconception: js.mc.non-mutating-method-changes-original
      rationale: "`join`은 요소를 이은 새 문자열을 돌려줄 뿐이에요. `nums`는 그대로 배열이에요."
    - id: e
      text: "`nums.indexOf(1);`"
      rationale: "`indexOf`는 위치를 찾아 숫자로 알려 주기만 해요. 배열을 바꾸지 않아요."
    - id: f
      text: "`nums.slice(0, 1);`"
      misconception: js.mc.splice-slice-same
      rationale: "`slice`는 이름이 비슷한 `splice`와 달리 일부를 복사한 새 배열을 돌려줄 뿐이에요."
  correct: [a, b, c]
misconceptions: [js.mc.mutating-method-keeps-original, js.mc.non-mutating-method-changes-original, js.mc.splice-slice-same]
hints:
  - 메서드를 "넣거나 빼는 일"을 하는 것과 "결과를 알려 주기만 하는 것"으로 나눠 보세요.
  - 넣거나 빼는 메서드는 그 결과를 원래 배열에 남겨요. 문자열이나 숫자를 돌려주는 메서드는 어떨까요?
  - 이름이 한 글자 다른 두 메서드 중 하나만 원래 배열을 바꿔요. 레슨의 표에서 각각 어느 무리였는지 확인해 보세요.
explanation: |
  정답은 `nums.push(4);`, `nums.splice(0, 1);`, `nums.shift();`예요.

  | 코드 | `nums` | 돌려주는 값 |
  |---|---|---|
  | `nums.push(4)` | `[3, 1, 2, 4]` | `4` |
  | `nums.splice(0, 1)` | `[1, 2]` | `[3]` |
  | `nums.shift()` | `[1, 2]` | `3` |
  | `nums.join("-")` | `[3, 1, 2]` (그대로) | `"3-1-2"` |
  | `nums.indexOf(1)` | `[3, 1, 2]` (그대로) | `1` |
  | `nums.slice(0, 1)` | `[3, 1, 2]` (그대로) | `[3]` |

  - 넣고 빼는 메서드(`push`, `pop`, `shift`, `unshift`, `splice`)는 원래 배열을 직접 바꿔요.
  - `join`, `indexOf`, `slice`는 결과를 새 값으로 돌려줄 뿐이라, 결과를 담지 않으면 아무것도 남지 않아요.
  - `splice`와 `slice`는 이름이 비슷하지만 `splice`만 원래 배열을 바꿔요.
origin: authored
