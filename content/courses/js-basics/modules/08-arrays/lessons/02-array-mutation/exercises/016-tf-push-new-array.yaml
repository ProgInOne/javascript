id: js-basics.arrays.array-mutation.tf-push-new-array
type: true_false
difficulty: 1
concepts:
  - { id: js.arr.mutating-vs-not, weight: 1 }
tags: [push, mutating, string-methods]
estimatedSeconds: 40
prompt: |
  다음 설명이 맞는지 고르세요.
spec:
  statement: '문자열의 `toUpperCase`처럼, `list.push("x")`도 `list`는 그대로 두고 `"x"`가 붙은 새 배열을 돌려준다.'
  answer: false
  misconceptionIfWrong: js.mc.mutating-method-keeps-original
hints:
  - 문자열은 바꿀 수 없는 값이었어요. 배열도 그럴까요?
  - "`push`를 부른 뒤 원래 배열을 출력하면 무엇이 보였는지 레슨 첫 번째 예제를 떠올려 보세요."
  - "`push`가 돌려주는 값이 배열이었는지도 함께 확인해 보세요."
explanation: |
  정답은 **거짓**이에요.

  문자열은 바꿀 수 없어서 `toUpperCase` 같은 문자열 메서드는 새 문자열을 돌려줘요. 하지만 배열은 바꿀 수 있는 값이라 `push`는 원래 배열 `list`의 끝에 `"x"`를 **직접** 넣어요. 그리고 돌려주는 값도 새 배열이 아니라 넣은 뒤의 길이(숫자)예요.

  ```js
  const list = ["a"];
  const result = list.push("x");
  console.log(list);   // ["a", "x"]
  console.log(result); // 2
  ```

  `join`처럼 원래 배열을 바꾸지 않는 메서드도 있으니, 배열 메서드는 하나씩 어느 쪽인지 기억해 둬요.
