id: js-basics.arrays.array-mutation.impl-order-commands
type: implement_function
difficulty: 4
concepts:
  - { id: js.arr.push-pop, weight: 1 }
  - { id: js.str.slice, weight: 0.3 }
  - { id: js.arr.mutating-vs-not, weight: 0.3 }
tags: [push, pop, string-commands, boundary, write-code]
estimatedSeconds: 420
prompt: |
  분식집 주문 화면에서 손님이 누른 버튼 기록 `commands`(문자열 배열)를 받아, 최종 주문 목록을 돌려주는 함수 `applyOrders(commands)`를 완성하세요.

  - `"+"`로 시작하는 기록은 메뉴 추가예요. `"+김밥"`이면 주문 목록 **끝**에 `"김밥"`을 넣어요(`+`는 빼고).
  - `"-"`는 **가장 최근에 넣은** 메뉴 하나를 취소해요. 취소할 메뉴가 없으면 아무 일도 하지 않아요.
  - 기록 배열 `commands`는 화면에 다시 보여 줘야 하므로 바꾸면 안 돼요.

  | 호출 | 돌려줄 값 |
  |---|---|
  | `applyOrders(["+김밥", "+라면", "-", "+떡볶이"])` | `["김밥", "떡볶이"]` |
  | `applyOrders(["+순대"])` | `["순대"]` |
spec:
  starter:
    files:
      - path: main.js
        content: |
          function applyOrders(commands) {
            // 여기에 작성하세요
          }
  entry: applyOrders
  solution:
    files:
      - path: main.js
        content: |
          function applyOrders(commands) {
            const orders = [];
            for (let i = 0; i < commands.length; i++) {
              const command = commands[i];
              if (command === "-") {
                orders.pop();
              } else if (command.startsWith("+")) {
                orders.push(command.slice(1));
              }
            }
            return orders;
          }
  checks:
    - kind: call
      id: example
      args: [["+김밥", "+라면", "-", "+떡볶이"]]
      expect: { equals: ["김밥", "떡볶이"] }
      requirement: 추가와 취소
    - { kind: call, id: single, args: [["+순대"]], expect: { equals: ["순대"] }, requirement: 추가와 취소 }
    - kind: call
      id: cancel-first
      visible: false
      description: 아무것도 담기 전에 누른 "-"는 무시하고, 그 뒤의 추가는 그대로 담아야 합니다.
      requirement: 취소할 메뉴가 없을 때
      args: [["-", "+만두"]]
      expect: { equals: ["만두"] }
    - kind: call
      id: cancel-all
      visible: false
      description: 담은 수보다 "-"를 더 많이 눌러도 오류 없이 빈 목록이어야 합니다.
      requirement: 취소할 메뉴가 없을 때
      args: [["+어묵", "-", "-", "-"]]
      expect: { equals: [] }
    - kind: call
      id: no-commands
      visible: false
      description: 기록이 없으면 빈 목록을 돌려줘야 합니다.
      requirement: 취소할 메뉴가 없을 때
      args: [[]]
      expect: { equals: [] }
    - kind: call
      id: cancel-latest
      visible: false
      description: "\"-\"는 가장 최근에 넣은 메뉴부터 하나씩 취소해야 합니다."
      requirement: 추가와 취소
      args: [["+김밥", "+라면", "+쫄면", "-", "-", "+튀김", "+김밥"]]
      expect: { equals: ["김밥", "튀김", "김밥"] }
    - kind: call
      id: keep-commands
      visible: false
      description: 받은 기록 배열 commands를 바꾸면 안 됩니다.
      requirement: 기록 지키기
      args: [["+김밥", "-", "+라면"]]
      expect: { argsUnchanged: true }
      misconceptionIfFail: js.mc.function-arg-array-copied
misconceptions: [js.mc.function-arg-array-copied, js.mc.pop-removes-given-value]
hints:
  - 최종 주문을 모을 새 배열을 따로 만들고, 기록을 처음부터 하나씩 살펴보세요.
  - 추가 기록에서 메뉴 이름만 얻으려면 맨 앞 한 글자를 빼야 해요. 모듈 7의 문자열 메서드 중 무엇이 쓸모 있을까요? "가장 최근에 넣은 것"을 빼는 배열 메서드도 떠올려 보세요.
  - 빼는 메서드는 주문 배열에 써야 해요. 기록 배열에 쓰면 기록이 바뀌어 버려요. 그리고 주문이 비어 있을 때 그 메서드가 무엇을 하는지 확인해 보세요.
explanation: |
  예시 정답이에요.

  ```js
  function applyOrders(commands) {
    const orders = [];
    for (let i = 0; i < commands.length; i++) {
      const command = commands[i];
      if (command === "-") {
        orders.pop();
      } else if (command.startsWith("+")) {
        orders.push(command.slice(1));
      }
    }
    return orders;
  }
  ```

  - **새 배열에 모으기**: 결과는 새 배열 `orders`에 모아요. 기록 `commands`는 읽기만 하니까 바뀌지 않아요.
  - **추가**: `command.slice(1)`은 맨 앞 `+`를 뺀 메뉴 이름이에요. `push`로 주문 끝에 넣어요.
  - **취소**: "가장 최근에 넣은 것"은 주문 배열의 마지막 요소라서 `orders.pop()`이에요. 빈 배열에서 `pop()`은 오류 없이 `undefined`를 돌려줄 뿐이라, 취소할 메뉴가 없을 때를 따로 처리하지 않아도 돼요. `if (orders.length > 0)`으로 확인해도 같은 결과예요.
  - `commands.pop()`처럼 기록 배열에서 빼면 취소가 엉뚱하게 되고, 바깥의 기록 배열도 바뀌어요. 함수에 넘긴 배열은 같은 배열이기 때문이에요.
origin: authored
