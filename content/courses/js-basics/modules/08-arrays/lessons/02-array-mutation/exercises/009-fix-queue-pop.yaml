id: js-basics.arrays.array-mutation.fix-queue-pop
type: fix_bug
difficulty: 2
concepts:
  - { id: js.arr.shift-unshift, weight: 1 }
  - { id: js.arr.push-pop, weight: 0.3 }
tags: [shift, pop, queue, debugging]
estimatedSeconds: 150
prompt: |
  번호표 대기열 `queue`(먼저 뽑은 번호가 앞)에서 다음 손님을 부르는 함수 `callNext(queue)`예요. 부른 손님은 대기열에서 빠져야 하고, 안내 문장을 돌려줘요. 그런데 먼저 온 손님이 아니라 엉뚱한 손님을 불러요. 고쳐 보세요.

  | 호출 | 돌려줄 값 |
  |---|---|
  | `callNext([12, 13, 14])` | `"12번 손님 차례예요"` |
  | `callNext([])` | `"기다리는 손님이 없어요"` |
spec:
  buggy:
    files:
      - path: main.js
        content: |
          function callNext(queue) {
            if (queue.length === 0) {
              return "기다리는 손님이 없어요";
            }
            const number = queue.pop();
            return number + "번 손님 차례예요";
          }
  solution:
    files:
      - path: main.js
        content: |
          function callNext(queue) {
            if (queue.length === 0) {
              return "기다리는 손님이 없어요";
            }
            const number = queue.shift();
            return number + "번 손님 차례예요";
          }
  entry: callNext
  bugDescription: "`callNext([12, 13, 14])`가 12번이 아니라 `\"14번 손님 차례예요\"`를 돌려줘요."
  checks:
    - { kind: call, id: first-comes, args: [[12, 13, 14]], expect: { equals: "12번 손님 차례예요" }, requirement: 먼저 온 손님 부르기 }
    - { kind: call, id: empty, args: [[]], expect: { equals: "기다리는 손님이 없어요" }, requirement: 빈 대기열 }
    - kind: call
      id: two-waiting
      visible: false
      description: 두 명이 기다리면 앞에 선 번호를 불러야 합니다.
      requirement: 먼저 온 손님 부르기
      args: [[30, 31]]
      expect: { equals: "30번 손님 차례예요" }
      misconceptionIfFail: js.mc.shift-unshift-swapped
misconceptions: [js.mc.shift-unshift-swapped]
hints:
  - 불린 14번은 대기열의 어느 쪽에 있던 번호인가요?
  - 대기열에서는 먼저 온 사람이 앞(0번)에 있어요. 지금 코드는 어느 쪽에서 꺼내고 있나요?
  - 꺼내는 메서드 두 개 중에서 앞쪽을 담당하는 메서드로 바꿔 보세요.
explanation: |
  5번 줄의 `queue.pop()`이 원인이에요.

  `pop()`은 배열 **끝**의 요소를 꺼내요. 대기열에서는 가장 늦게 뽑은 번호가 끝에 있어서 14번이 불렸어요. 맨 **앞**의 요소를 꺼내는 메서드는 `shift()`예요.

  ```js
  const number = queue.shift();
  ```

  `shift()`도 `pop()`처럼 꺼낸 요소를 돌려주고 원래 배열에서 지워요. 그래서 부른 손님이 대기열에서 빠지는 동작은 그대로예요. 줄 끝에 세우는 `push`와 앞에서 꺼내는 `shift`를 함께 쓰면 먼저 온 사람이 먼저 나가는 줄이 돼요.
