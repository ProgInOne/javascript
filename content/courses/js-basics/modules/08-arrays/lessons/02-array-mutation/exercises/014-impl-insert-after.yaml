id: js-basics.arrays.array-mutation.impl-insert-after
type: implement_function
difficulty: 3
concepts:
  - { id: js.arr.splice, weight: 1 }
  - { id: js.arr.push-pop, weight: 0.3 }
  - { id: js.control.if, weight: 0.3 }
tags: [splice, indexof, insert, write-code]
estimatedSeconds: 300
prompt: |
  여행 일정표 `list`에서 장소 `target` **바로 다음**에 새 장소 `item`을 끼워 넣는 함수 `insertAfter(list, target, item)`을 완성하세요.

  - `target`이 여러 번 있으면 **처음** 나오는 것 바로 다음에 넣어요.
  - `target`이 일정표에 없으면 `item`을 맨 끝에 넣어요.
  - 일정표 `list`를 직접 바꾸고, 바꾼 `list`를 돌려줘요.

  | 호출 | 돌려줄 값 |
  |---|---|
  | `insertAfter(["공항", "호텔"], "공항", "식당")` | `["공항", "식당", "호텔"]` |
  | `insertAfter(["공항", "호텔"], "박물관", "시장")` | `["공항", "호텔", "시장"]` |

  배열에도 문자열처럼 `indexOf`가 있어서, 값이 처음 나오는 인덱스를, 없으면 `-1`을 돌려줘요.
spec:
  starter:
    files:
      - path: main.js
        content: |
          function insertAfter(list, target, item) {
            // 여기에 작성하세요
          }
  entry: insertAfter
  solution:
    files:
      - path: main.js
        content: |
          function insertAfter(list, target, item) {
            const index = list.indexOf(target);
            if (index === -1) {
              list.push(item);
            } else {
              list.splice(index + 1, 0, item);
            }
            return list;
          }
  checks:
    - kind: call
      id: middle
      args: [["공항", "호텔"], "공항", "식당"]
      expect: { equals: ["공항", "식당", "호텔"] }
      requirement: 바로 다음에 넣기
    - kind: call
      id: not-found
      args: [["공항", "호텔"], "박물관", "시장"]
      expect: { equals: ["공항", "호텔", "시장"] }
      requirement: 없으면 맨 끝에
      misconceptionIfFail: js.mc.indexof-as-boolean
    - kind: call
      id: after-last
      visible: false
      description: target이 마지막 장소이면 맨 끝에 넣어야 합니다.
      requirement: 바로 다음에 넣기
      args: [["역", "시장", "공원"], "공원", "카페"]
      expect: { equals: ["역", "시장", "공원", "카페"] }
    - kind: call
      id: first-match
      visible: false
      description: target이 여러 번 있으면 처음 나오는 것 바로 다음에 넣어야 합니다.
      requirement: 바로 다음에 넣기
      args: [["호텔", "해변", "호텔"], "호텔", "조식"]
      expect: { equals: ["호텔", "조식", "해변", "호텔"] }
    - kind: call
      id: empty-list
      visible: false
      description: 빈 일정표에서는 item 하나만 들어 있어야 합니다.
      requirement: 없으면 맨 끝에
      args: [[], "공항", "호텔"]
      expect: { equals: ["호텔"] }
    - kind: call
      id: keep-others
      visible: false
      description: 넣을 때 다른 장소를 지우면 안 됩니다.
      requirement: 바로 다음에 넣기
      args: [["집", "학교", "도서관", "집"], "학교", "편의점"]
      expect: { equals: ["집", "학교", "편의점", "도서관", "집"] }
      misconceptionIfFail: js.mc.splice-second-arg-end
misconceptions: [js.mc.splice-second-arg-end, js.mc.indexof-as-boolean]
hints:
  - 먼저 `target`의 위치를 찾고, 찾았을 때와 못 찾았을 때로 나눠요.
  - "\"바로 다음\" 자리는 찾은 인덱스보다 하나 큰 인덱스예요. 그 자리에 아무것도 지우지 않고 끼워 넣는 메서드가 필요해요."
  - 못 찾은 경우를 `indexOf`의 결과가 어떤 값인지로 확인하세요. 그 경우에는 끝에 넣는 메서드를 써요.
explanation: |
  예시 정답이에요.

  ```js
  function insertAfter(list, target, item) {
    const index = list.indexOf(target);
    if (index === -1) {
      list.push(item);
    } else {
      list.splice(index + 1, 0, item);
    }
    return list;
  }
  ```

  - **위치 찾기**: `indexOf`는 처음 나오는 위치를 돌려줘서 "여러 번 있으면 처음 것"이 저절로 맞아요.
  - **바로 다음에 넣기**: `splice(index + 1, 0, item)`은 `index + 1` 자리에 0개를 지우고 넣어요. `target`이 마지막이면 `index + 1`이 길이와 같아서 맨 끝에 들어가요.
  - **없을 때**: `indexOf`가 `-1`이면 끝에 `push`해요. `if (index)`처럼 쓰면 `-1`은 참, `0`은 거짓이라 거꾸로 동작해요.
  - 두 번째 인수를 1로 쓰면 다음 장소 하나를 지우고 그 자리에 넣어 버려요.
