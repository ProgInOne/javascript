id: js-basics.arrays.array-mutation.tf-pop-argument
type: true_false
difficulty: 2
concepts:
  - { id: js.arr.push-pop, weight: 1 }
tags: [pop, arguments]
estimatedSeconds: 60
prompt: |
  다음 설명이 맞는지 고르고, 그렇게 판단한 이유도 고르세요.
spec:
  statement: '`const cart = ["우유", "빵", "달걀"];` 다음 줄에서 `cart.pop("우유");`를 실행하면 `cart`는 `["빵", "달걀"]`이 된다.'
  answer: false
  misconceptionIfWrong: js.mc.pop-removes-given-value
  requireReason: true
  reasons:
    - id: r1
      text: pop은 인수를 무시하고 항상 마지막 요소를 지우므로 cart는 ["우유", "빵"]이 된다
      correct: true
    - id: r2
      text: pop에 넘긴 값을 찾아 지우므로 "우유"가 빠진다
      misconception: js.mc.pop-removes-given-value
    - id: r3
      text: pop은 원래 배열을 바꾸지 않으므로 cart는 처음 그대로다
      misconception: js.mc.mutating-method-keeps-original
    - id: r4
      text: pop에 인수를 넘기면 TypeError가 난다
hints:
  - "`pop`은 배열의 어느 쪽에서 요소를 꺼내는 메서드였나요?"
  - "`pop`이 몇 개의 인수를 받는지 레슨의 표를 다시 보세요. 받지 않는 인수를 넘기면 JavaScript는 어떻게 할까요?"
  - 넘긴 인수가 쓰이지 않는다면, 지워지는 요소는 항상 같은 자리의 요소예요.
explanation: |
  정답은 **거짓**이에요. 이유는 "pop은 인수를 무시하고 항상 마지막 요소를 지우므로 cart는 ["우유", "빵"]이 된다"예요.

  `pop`은 인수를 받지 않는 메서드예요. 함수에 쓰이지 않는 인수를 넘겨도 오류 없이 무시되므로, `cart.pop("우유")`는 `cart.pop()`과 똑같이 마지막 요소 `"달걀"`을 꺼내요.

  - 넘긴 값을 찾아 지운다는 이유: 특정 값을 지우려면 `cart.indexOf("우유")`로 위치를 찾고 `cart.splice(위치, 1)`을 써야 해요.
  - 원래 배열이 그대로라는 이유: `pop`은 원래 배열을 직접 바꾸는 메서드예요. `"달걀"`이 실제로 빠져요.
  - TypeError라는 이유: 남는 인수는 오류 없이 무시돼요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
