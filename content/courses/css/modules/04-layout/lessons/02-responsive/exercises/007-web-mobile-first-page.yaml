id: css.layout.responsive.web-mobile-first-page
type: web_task
difficulty: 4
concepts:
  - { id: css.responsive.mobile-first, weight: 1 }
  - { id: css.responsive.media-queries, weight: 0.5 }
  - { id: css.units.length, weight: 0.3 }
tags: [responsive, mobile-first, media-query, web-task]
estimatedSeconds: 420
prompt: |
  이 페이지는 데스크톱만 생각하고 만들어서, 본문(`.page`)이 `900px`로 고정되어 있고 본문과 사이드바가 항상 가로로 놓여 있어요. 휴대폰에서는 화면 밖으로 넘치고 너무 좁아져요.

  **모바일 우선** 방식으로 CSS를 고치세요. 미디어 쿼리 밖의 기본 규칙은 좁은 화면용으로 쓰고, `min-width: 960px` 미디어 쿼리 안에 넓은 화면용 규칙을 더해요. 경계가 960px인 이유는 900px짜리 본문과 body의 바깥 여백(양쪽 8px)이 넘치지 않고 들어가는 너비이기 때문이에요.

  채점은 두 화면 너비에서 해요.

  - 너비 `375px`: `.page`가 화면보다 넓지 않고(375px 이하), 사이드바(`.side`)가 본문(`.main`) 아래에 놓여요.
  - 너비 `960px`과 `1280px`: 사이드바가 본문의 오른쪽에 놓이고, `.page`의 너비가 `900px`이에요.

  미리보기 창의 너비는 화면 배치에 따라 정해지고 직접 바꿀 수 없어요. 미리보기가 한 모습만 보여 주더라도, 채점은 각 너비에서 따로 해요. 채점은 화면에 나온 결과만 보기 때문에, 모바일 우선으로 썼는지는 스스로 확인해 보세요.
spec:
  focus: css
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>강의 페이지</title>
              <style>
                .page {
                  display: flex;
                  width: 900px;
                  gap: 16px;
                }
                .main {
                  flex: 3; /* 가로로 놓일 때 본문 3 : 사이드바 1 비율로 너비를 나눠요 */
                  padding: 16px;
                  background: #fef3c7;
                }
                .side {
                  flex: 1;
                  padding: 16px;
                  background: #dbeafe;
                }
              </style>
            </head>
            <body>
              <div class="page">
                <div class="main">강의 본문이 들어가는 곳이에요.</div>
                <div class="side">관련 강의 목록</div>
              </div>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>강의 페이지</title>
              <style>
                .page {
                  display: flex;
                  flex-direction: column;
                  gap: 16px;
                }
                .main {
                  flex: 3; /* 가로로 놓일 때 본문 3 : 사이드바 1 비율로 너비를 나눠요 */
                  padding: 16px;
                  background: #fef3c7;
                }
                .side {
                  flex: 1;
                  padding: 16px;
                  background: #dbeafe;
                }
                @media (min-width: 960px) {
                  .page {
                    flex-direction: row;
                    width: 900px;
                  }
                }
              </style>
            </head>
            <body>
              <div class="page">
                <div class="main">강의 본문이 들어가는 곳이에요.</div>
                <div class="side">관련 강의 목록</div>
              </div>
            </body>
          </html>
  checks:
    - kind: css
      id: fits-phone
      description: 너비 375px 화면에서 .page의 너비가 375px 이하여야 합니다.
      requirement: 좁은 화면에 맞는 너비
      visible: true
      viewport: 375
      selector: .page
      expect:
        computed:
          width: { px: { max: 375 } }
    - kind: layout
      id: side-below-on-phone
      description: 너비 375px 화면에서 사이드바가 본문 아래에 있어야 합니다.
      requirement: 좁은 화면에서는 위아래로
      visible: true
      viewport: 375
      a: .side
      b: .main
      relation: below
      tolerancePx: 1
      misconceptionIfFail: css.mc.mobile-first-means-desktop-override
    - kind: css
      id: wide-width
      description: 너비 1280px 화면에서 .page의 너비가 900px이어야 합니다.
      requirement: 넓은 화면에서는 900px
      visible: true
      viewport: 1280
      selector: .page
      expect:
        computed:
          width: { px: { value: 900 } }
    - kind: css
      id: wide-width-960
      description: 너비 960px 화면에서도 .page의 너비가 900px이어야 합니다.
      requirement: 넓은 화면에서는 900px
      viewport: 960
      selector: .page
      expect:
        computed:
          width: { px: { value: 900 } }
    - kind: layout
      id: side-right-on-desktop
      description: 너비 1280px 화면에서 사이드바가 본문보다 오른쪽에 있어야 합니다.
      requirement: 넓은 화면에서는 가로로
      visible: true
      viewport: 1280
      a: .side
      b: .main
      relation: right-of
      tolerancePx: 1
      misconceptionIfFail: css.mc.max-width-means-above
    - kind: layout
      id: same-row-on-desktop
      description: 너비 1280px 화면에서 본문과 사이드바가 같은 줄에 있어야 합니다.
      requirement: 넓은 화면에서는 가로로
      viewport: 1280
      a: .side
      b: .main
      relation: same-row
      tolerancePx: 1
    - kind: layout
      id: side-right-at-960
      description: 너비가 정확히 960px인 화면에서도 사이드바가 본문보다 오른쪽에 있어야 합니다(960px 이상).
      requirement: 넓은 화면에서는 가로로
      visible: true
      viewport: 960
      a: .side
      b: .main
      relation: right-of
      tolerancePx: 1
      misconceptionIfFail: css.mc.max-width-means-above
misconceptions: [css.mc.mobile-first-means-desktop-override, css.mc.max-width-means-above]
hints:
  - 모바일 우선에서는 미디어 쿼리 밖의 기본 규칙이 좁은 화면용이에요. 좁은 화면에서는 `.page`에 고정 너비가 있으면 안 되고, 본문과 사이드바가 위아래로 쌓여야 해요.
  - "기본 `.page` 규칙에서 `width: 900px`를 빼고 주축을 세로(`column`)로 바꾸세요. 그다음 `@media (min-width: 960px) { ... }`를 기본 규칙 뒤에 추가해요."
  - 기본 규칙에서 빼거나 바꾼 것 중 넓은 화면에서 다시 필요한 것이 무엇인지 떠올려 보세요. 그것만 미디어 쿼리 안의 `.page` 규칙에 넣어요.
explanation: |
  예시 정답은 기본 규칙을 좁은 화면용으로 바꾸고, 넓은 화면용 규칙을 미디어 쿼리로 더하는 거예요.

  ```css
  .page {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  @media (min-width: 960px) {
    .page {
      flex-direction: row;
      width: 900px;
    }
  }
  ```

  - **기본 규칙(좁은 화면)**: 고정 너비를 없애면 블록인 `.page`가 화면 너비에 맞춰져요. `column`으로 본문과 사이드바를 위아래로 쌓아요.
  - **min-width 960px 이상**: 이때만 `row`와 `900px`를 더해요. 미디어 쿼리가 기본 규칙 **뒤**에 있어야 명시도가 같은 규칙 중 뒤의 것이 이겨요.

  기본 규칙을 데스크톱용으로 두고 `@media (max-width: 959px)`로 좁은 화면을 덮어써도 세 너비의 결과가 같아서 채점은 통과해요. 하지만 그건 데스크톱 우선 방식이에요. 모바일 우선으로 쓰면 좁은 화면에서는 단순한 기본 규칙만 읽고, 넓은 화면에서 필요한 것만 덧붙이게 되어 CSS가 덜 엉켜요.

  `@media (max-width: 960px)`로 쓰고 안에 row를 넣으면 방향이 반대가 되어 1280px 체크가 실패해요. max-width는 "이하"예요. 데스크톱 우선으로 쓰면서 `max-width: 960px`로 경계를 잡으면 정확히 960px인 화면에서 세로로 쌓여 960px 체크가 실패해요.
