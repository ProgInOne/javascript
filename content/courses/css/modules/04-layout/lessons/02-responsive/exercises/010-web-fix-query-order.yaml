  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>상품 카드</title>
              <style>
                .card {
                  padding: 12px;
                  border: 1px solid #94a3b8;
                  background: #f8fafc;
                }
                @media (min-width: 768px) {
                  .card {
                    padding: 32px;
                  }
                }
              </style>
            </head>
            <body>
              <div class="card">
                <h2>무선 이어폰</h2>
                <p>89,000원</p>
              </div>
            </body>
          </html>
  checks:
    - kind: css
      id: narrow-padding
      description: 너비 375px 화면에서 카드의 안쪽 여백이 12px이어야 합니다.
      requirement: 좁은 화면에서는 12px
      visible: true
      viewport: 375
      selector: .card
      expect:
        computed:
          padding-top: { px: { value: 12 } }
          padding-left: { px: { value: 12 } }
    - kind: css
      id: wide-padding
      description: 너비 1280px 화면에서 카드의 안쪽 여백이 32px이어야 합니다.
      requirement: 넓은 화면에서는 32px
      visible: true
      viewport: 1280
      selector: .card
      expect:
        computed:
          padding-top: { px: { value: 32 } }
          padding-left: { px: { value: 32 } }
    - kind: css
      id: wide-padding-768
      description: 너비가 정확히 768px인 화면에서도 카드의 안쪽 여백이 32px이어야 합니다(768px 이상).
      requirement: 넓은 화면에서는 32px
      visible: true
      viewport: 768
      selector: .card
      expect:
        computed:
          padding-top: { px: { value: 32 } }
          padding-left: { px: { value: 32 } }
      misconceptionIfFail: css.mc.max-width-means-above
    - kind: css
      id: border-kept
      description: 카드의 테두리(1px)는 그대로여야 합니다.
      requirement: 다른 선언은 그대로
      selector: .card
      expect:
        computed:
          border-top-width: { px: { value: 1 } }
misconceptions: [css.mc.max-width-means-above]
hints:
  - 1280px 화면에서는 미디어 쿼리 조건이 맞아요. 그런데도 32px가 지는 이유는 무엇일까요? 두 `.card` 규칙의 명시도를 비교해 보세요.
  - 미디어 쿼리 안의 규칙도 보통 규칙과 똑같이 캐스케이드를 따라요. 명시도가 같으면 나중에 쓴 규칙이 이겨요.
  - 미디어 쿼리 블록 전체를 기본 `.card` 규칙 **아래로** 옮겨요.
explanation: |
  예시 정답은 **미디어 쿼리 블록을 기본 `.card` 규칙 뒤로 옮기는** 거예요.

  ```css
  .card {
    padding: 12px;
    border: 1px solid #94a3b8;
    background: #f8fafc;
  }
  @media (min-width: 768px) {
    .card {
      padding: 32px;
    }
  }
  ```

  - 넓은 화면에서는 미디어 쿼리 조건이 맞아서 `padding: 32px` 규칙도 적용 후보가 돼요. 하지만 두 규칙 모두 `.card`라 명시도가 (0, 1, 0)으로 같고, 이때는 **나중에 쓴 규칙**이 이겨요. 처음에는 기본 규칙이 뒤에 있어서 12px가 이겼어요.
  - 미디어 쿼리를 뒤로 옮기면 조건이 맞는 화면에서만 32px가 나중 규칙으로 이기고, 좁은 화면에서는 미디어 쿼리가 적용되지 않아 12px가 남아요.

  미디어 쿼리는 "조건이 맞을 때 우선권을 주는 장치"가 아니라 "조건이 맞을 때만 규칙을 켜는 장치"예요. 그래서 덮어쓸 기본 규칙보다 뒤에 써요.
