id: css.layout.responsive.web-fix-query-order
type: web_task
difficulty: 3
concepts:
  - { id: css.responsive.media-queries, weight: 1 }
  - { id: css.cascade.order, weight: 0.5 }
tags: [responsive, media-query, cascade, web-task]
estimatedSeconds: 300
prompt: |
  상품 카드의 안쪽 여백을 좁은 화면에서는 `12px`, 화면 너비가 `768px` 이상일 때는 `32px`로 넓히려고 미디어 쿼리를 썼어요. 그런데 넓은 화면에서도 여백이 `12px` 그대로예요.

  **선택자와 값은 바꾸지 말고** CSS를 고쳐서 아래를 만족시키세요.

  - 너비 `375px`: 카드의 안쪽 여백이 네 방향 모두 `12px`
  - 너비 `768px`과 `1280px`: 카드의 안쪽 여백이 네 방향 모두 `32px`

  미리보기가 한 모습만 보여 주더라도, 채점은 각 너비에서 따로 해요.
spec:
  focus: css
  debugging: true                # 버그가 있는 시작 페이지를 고치는 문제(디버깅으로 셈, D-069)
  starter:
    files:
