id: css.layout.responsive.web-viewport-and-title
type: web_task
difficulty: 2
concepts:
  - { id: css.responsive.viewport-meta, weight: 1 }
  - { id: css.responsive.media-queries, weight: 0.5 }
tags: [responsive, viewport, media-query, web-task]
estimatedSeconds: 300
prompt: |
  휴대폰으로 이 페이지를 열면 전체가 작게 축소되어 보이고, 큰 제목(`40px`)이 좁은 화면을 너무 많이 차지해요. 두 가지를 고치세요.

  1. 휴대폰 브라우저가 페이지를 축소하지 않고 **기기 너비 그대로** 그리도록, `head`에 알맞은 `meta` 태그를 추가하세요.
  1. 제목(`h1`)의 글자 크기를 좁은 화면에서는 `24px`, 화면 너비가 **`600px` 이상**일 때는 지금처럼 `40px`이 되게 하세요.

  채점은 두 화면 너비(`375px`, `1280px`)에서 해요. 미리보기가 한 모습만 보여 주더라도, 채점은 각 너비에서 따로 해요.
spec:
  focus: css
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>오늘의 레시피</title>
              <style>
                h1 {
                  font-size: 40px;
                }
              </style>
            </head>
            <body>
              <h1>오늘의 레시피: 김치볶음밥</h1>
              <p>재료: 밥 한 공기, 김치, 달걀 하나</p>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>오늘의 레시피</title>
              <style>
                h1 {
                  font-size: 24px;
                }
                @media (min-width: 600px) {
                  h1 {
                    font-size: 40px;
                  }
                }
              </style>
            </head>
            <body>
              <h1>오늘의 레시피: 김치볶음밥</h1>
              <p>재료: 밥 한 공기, 김치, 달걀 하나</p>
            </body>
          </html>
  checks:
    - kind: dom
      id: has-viewport-meta
      description: head에 기기 너비로 그리게 하는 viewport meta 태그(width=device-width)가 있어야 합니다.
      requirement: viewport meta 태그
      visible: true
      selector: 'head meta[name="viewport"][content*="width=device-width"]'
      expect:
        count: 1
      misconceptionIfFail: css.mc.viewport-meta-makes-responsive
    - kind: css
      id: small-title-on-phone
      description: 너비 375px 화면에서 제목의 글자 크기가 24px이어야 합니다.
      requirement: 좁은 화면에서는 24px
      visible: true
      viewport: 375
      selector: h1
      expect:
        computed:
          font-size: { px: { value: 24 } }
      misconceptionIfFail: css.mc.viewport-meta-makes-responsive
    - kind: css
      id: big-title-on-desktop
      description: 너비 1280px 화면에서 제목의 글자 크기가 40px이어야 합니다.
      requirement: 넓은 화면에서는 40px
      visible: true
      viewport: 1280
      selector: h1
      expect:
        computed:
          font-size: { px: { value: 40 } }
    - kind: css
      id: big-title-at-600
      description: 너비가 정확히 600px인 화면에서도 제목의 글자 크기가 40px이어야 합니다(600px 이상).
      requirement: 넓은 화면에서는 40px
      visible: true
      viewport: 600
      selector: h1
      expect:
        computed:
          font-size: { px: { value: 40 } }
      misconceptionIfFail: css.mc.max-width-means-above
misconceptions: [css.mc.viewport-meta-makes-responsive, css.mc.max-width-means-above]
hints:
  - 두 가지는 서로 다른 일이에요. meta 태그는 "몇 px 너비로 그릴지"만 정하고, 화면 너비에 따라 글자 크기를 바꾸는 일은 미디어 쿼리가 맡아요.
  - "meta 태그는 `name=\"viewport\"`이고, `content`에 `width=device-width, initial-scale=1`을 써요. 미디어 쿼리는 600px **이상**이므로 `min-width`를 써요."
  - "모바일 우선이라면 미디어 쿼리 밖의 기본 `h1` 규칙이 좁은 화면 값이 되어야 해요. 넓은 화면 값은 미디어 쿼리 안에 넣고, 그 블록을 기본 규칙 **뒤에** 두세요."
explanation: |
  예시 정답은 `head`에 meta 태그를 넣고, 제목 규칙을 모바일 우선으로 바꾸는 거예요.

  ```html
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  ```

  ```css
  h1 {
    font-size: 24px;
  }
  @media (min-width: 600px) {
    h1 {
      font-size: 40px;
    }
  }
  ```

  - **meta 태그**: 휴대폰 브라우저가 페이지를 약 980px로 그린 뒤 축소하는 것을 막고 기기 너비(예: 375px) 그대로 그리게 해요. 이 태그만으로는 글자 크기도 배치도 바뀌지 않아요.
  - **미디어 쿼리**: `min-width: 600px`는 600px **이상**에서만 적용돼요. 기본 규칙(24px)보다 **뒤에** 써야, 명시도가 같은 두 규칙 중 나중 것인 40px가 넓은 화면에서 이겨요.

  채점은 정확히 600px에서도 해요. "600px 이상"은 600px을 포함하므로, `max-width: 600px` 안에 24px를 넣거나 `min-width: 601px`로 쓰면 600px에서 24px이 되어 실패해요. `max-width: 599px` 안에 24px를 넣는 데스크톱 우선 방식은 결과가 같아 통과하지만, 이 단원에서 권하는 방식은 좁은 화면을 기본으로 쓰는 모바일 우선이에요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
