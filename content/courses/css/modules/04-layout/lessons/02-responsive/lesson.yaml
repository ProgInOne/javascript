id: css.layout.responsive
title: 반응형 기초
summary: 뷰포트 메타 태그와 미디어 쿼리로 화면 너비에 따라 배치가 바뀌는 페이지를 만들고, 모바일 우선 방식으로 CSS를 구성합니다.
kind: lesson
importance: standard
estimatedMinutes: { read: 12, practice: 15 }
concepts:
  primary: [css.responsive.viewport-meta, css.responsive.media-queries, css.responsive.mobile-first]
  practiced: [css.flex.axes, css.units.length]
objectives:
  - 뷰포트 메타 태그가 하는 일과 하지 않는 일을 설명할 수 있다.
  - min-width·max-width 미디어 쿼리가 어떤 화면 너비에서 적용되는지 판단할 수 있다.
  - 좁은 화면용 기본 스타일에 min-width 미디어 쿼리를 더하는 모바일 우선 CSS를 쓸 수 있다.
practice:
  targetCount: 10
