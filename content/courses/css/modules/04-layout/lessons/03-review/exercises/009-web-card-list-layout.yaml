id: css.layout.review.web-card-list-layout
type: web_task
difficulty: 4
concepts:
  - { id: css.responsive.mobile-first, weight: 1 }
  - { id: css.responsive.media-queries, weight: 0.5 }
  - { id: css.flex.gap, weight: 0.5 }
  - { id: css.flex.justify-align, weight: 0.5 }
  - { id: css.flex.axes, weight: 0.3 }
tags: [mobile-first, media-query, flexbox, gap, web-task, card-list]
estimatedSeconds: 600
usage: assessment
prompt: |
  동네 도서관의 "이달의 추천 도서" 카드 목록을 만들어요. 지금은 카드 세 장이 아무 배치 없이 붙어서 쌓여 있어요. HTML은 그대로 두고 CSS만 써서 아래 조건을 모두 만족시키세요.

  **좁은 화면(너비 720px 미만)**

  1. 카드 세 장이 위아래로 쌓이고, 카드와 카드 사이는 세로로 `16px`이에요.
  1. 각 카드는 카드 묶음(`.cards`)의 너비를 가득 채워요.

  **넓은 화면(너비 720px 이상)**

  1. 카드 세 장이 한 줄에 나란히 놓이고, 카드와 카드 사이는 가로로 `16px`이에요.
  1. 각 카드의 `width`는 `180px`이에요.
  1. 카드 세 장이 한 덩어리로 카드 묶음의 가로 가운데에 놓여요.

  **모바일 우선**으로 써 주세요. 미디어 쿼리 밖의 기본 규칙은 좁은 화면용으로 쓰고, `min-width: 720px` 미디어 쿼리 안에 넓은 화면에서 달라지는 규칙만 더해요. 카드 사이 간격은 카드의 margin이 아니라 카드 묶음의 `gap`으로 만들어요.

  채점은 너비 `375px`, `719px`, `720px`, `1280px` 네 화면에서 결과를 보고 해요. 미리보기 창은 그중 한 모습만 보여 줄 수 있어요. 채점은 결과만 보므로, 기본 규칙이 좁은 화면용인지는 스스로 확인하세요.
spec:
  focus: css
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>이달의 추천 도서</title>
              <style>
                .card {
                  padding: 16px;
                  border: 2px solid #cbd5e1;
                  background: white;
                }
                .card h2 {
                  margin: 0 0 8px;
                  font-size: 18px;
                }
                .card p {
                  margin: 0;
                }
                /* 여기부터 카드 목록 배치를 써 주세요 */
              </style>
            </head>
            <body>
              <h1>이달의 추천 도서</h1>
              <div class="cards">
                <div class="card" id="c1">
                  <h2>별을 세는 밤</h2>
                  <p>어린이 과학 그림책</p>
                </div>
                <div class="card" id="c2">
                  <h2>바다의 사계절</h2>
                  <p>사진으로 보는 바다 생물</p>
                </div>
                <div class="card" id="c3">
                  <h2>우리 동네 지도</h2>
                  <p>걸어서 만나는 골목 이야기</p>
                </div>
              </div>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>이달의 추천 도서</title>
              <style>
                .card {
                  padding: 16px;
                  border: 2px solid #cbd5e1;
                  background: white;
                }
                .card h2 {
                  margin: 0 0 8px;
                  font-size: 18px;
                }
                .card p {
                  margin: 0;
                }
                .cards {
                  display: flex;
                  flex-direction: column;
                  gap: 16px;
                }
                @media (min-width: 720px) {
                  .cards {
                    flex-direction: row;
                    justify-content: center;
                  }
                  .card {
                    width: 180px;
                  }
                }
              </style>
            </head>
            <body>
              <h1>이달의 추천 도서</h1>
              <div class="cards">
                <div class="card" id="c1">
                  <h2>별을 세는 밤</h2>
                  <p>어린이 과학 그림책</p>
                </div>
                <div class="card" id="c2">
                  <h2>바다의 사계절</h2>
                  <p>사진으로 보는 바다 생물</p>
                </div>
                <div class="card" id="c3">
                  <h2>우리 동네 지도</h2>
                  <p>걸어서 만나는 골목 이야기</p>
                </div>
              </div>
            </body>
          </html>
  checks:
    - kind: layout
      id: phone-stacked
      description: 너비 375px 화면에서 두 번째 카드가 첫 번째 카드 아래에 있어야 합니다.
      requirement: 좁은 화면에서는 위아래로, 사이 16px
      visible: true
      viewport: 375
      a: "#c2"
      b: "#c1"
      relation: below
      tolerancePx: 1
    - kind: layout
      id: phone-gap-1-2
      description: 너비 375px 화면에서 첫 번째와 두 번째 카드 사이가 세로로 16px이어야 합니다.
      requirement: 좁은 화면에서는 위아래로, 사이 16px
      visible: true
      viewport: 375
      a: "#c1"
      b: "#c2"
      gap: { axis: y, min: 16, max: 16 }
      tolerancePx: 1
    - kind: layout
      id: phone-gap-2-3
      description: 너비 375px 화면에서 두 번째와 세 번째 카드 사이가 세로로 16px이어야 합니다.
      requirement: 좁은 화면에서는 위아래로, 사이 16px
      viewport: 375
      a: "#c2"
      b: "#c3"
      gap: { axis: y, min: 16, max: 16 }
      tolerancePx: 1
    - kind: layout
      id: phone-full-width
      description: 너비 375px 화면에서 첫 번째 카드가 카드 묶음의 너비를 가득 채워야 합니다.
      requirement: 좁은 화면에서는 카드가 가로를 가득
      visible: true
      viewport: 375
      a: "#c1"
      container: .cards
      relation: fills-width
      tolerancePx: 1
      misconceptionIfFail: css.mc.mobile-first-means-desktop-override
    - kind: layout
      id: boundary-719-stacked
      description: 너비 719px 화면에서는 아직 두 번째 카드가 첫 번째 카드 아래에 있어야 합니다(720px 미만).
      requirement: 경계 720px
      visible: true
      viewport: 719
      a: "#c2"
      b: "#c1"
      relation: below
      tolerancePx: 1
    - kind: layout
      id: boundary-720-row
      description: 너비가 정확히 720px인 화면에서 두 번째 카드가 첫 번째 카드보다 오른쪽에 있어야 합니다(720px 이상).
      requirement: 경계 720px
      visible: true
      viewport: 720
      a: "#c2"
      b: "#c1"
      relation: right-of
      tolerancePx: 1
      misconceptionIfFail: css.mc.max-width-means-above
    - kind: layout
      id: boundary-720-same-row
      description: 너비 720px 화면에서 세 번째 카드가 두 번째 카드와 같은 줄에 있어야 합니다.
      requirement: 경계 720px
      viewport: 720
      a: "#c3"
      b: "#c2"
      relation: same-row
      tolerancePx: 1
    - kind: layout
      id: wide-row
      description: 너비 1280px 화면에서 세 번째 카드가 첫 번째 카드와 같은 줄에 있어야 합니다.
      requirement: 넓은 화면에서는 한 줄로, 사이 16px
      visible: true
      viewport: 1280
      a: "#c3"
      b: "#c1"
      relation: same-row
      tolerancePx: 1
      misconceptionIfFail: css.mc.max-width-means-above
    - kind: layout
      id: wide-gap-1-2
      description: 너비 1280px 화면에서 첫 번째와 두 번째 카드 사이가 가로로 16px이어야 합니다.
      requirement: 넓은 화면에서는 한 줄로, 사이 16px
      visible: true
      viewport: 1280
      a: "#c1"
      b: "#c2"
      gap: { axis: x, min: 16, max: 16 }
      tolerancePx: 1
    - kind: layout
      id: wide-gap-2-3
      description: 너비 1280px 화면에서 두 번째와 세 번째 카드 사이가 가로로 16px이어야 합니다.
      requirement: 넓은 화면에서는 한 줄로, 사이 16px
      viewport: 1280
      a: "#c2"
      b: "#c3"
      gap: { axis: x, min: 16, max: 16 }
      tolerancePx: 1
    - kind: css
      id: wide-card-width
      description: 너비 1280px 화면에서 모든 카드의 width가 180px이어야 합니다.
      requirement: 넓은 화면에서는 카드 너비 180px
      visible: true
      viewport: 1280
      selector: .card
      all: true
      expect:
        computed:
          width: { px: { value: 180 } }
    - kind: layout
      id: wide-centered
      description: 너비 1280px 화면에서 가운데 카드가 카드 묶음의 가로 가운데에 있어야 합니다(세 카드가 한 덩어리로 가운데에 모임).
      requirement: 넓은 화면에서는 가운데 정렬
      visible: true
      viewport: 1280
      a: "#c2"
      container: .cards
      relation: centered-horizontally
      tolerancePx: 2
      misconceptionIfFail: css.mc.justify-align-swap
    - kind: css
      id: no-card-margin
      description: 카드 사이 간격을 gap으로 만들어야 합니다(카드에 margin이 없어야 합니다).
      requirement: 간격은 gap으로
      selector: .card
      all: true
      expect:
        computed:
          margin-top: { px: { value: 0 } }
          margin-right: { px: { value: 0 } }
          margin-bottom: { px: { value: 0 } }
          margin-left: { px: { value: 0 } }
misconceptions:
  - css.mc.mobile-first-means-desktop-override
  - css.mc.max-width-means-above
  - css.mc.justify-align-swap
hints:
  - 먼저 미디어 쿼리 없이 좁은 화면 모습(위아래로 쌓기, 사이 16px)을 완성하고, 그다음 넓은 화면에서 달라지는 점만 미디어 쿼리에 더해 보세요.
  - 카드들을 감싼 `.cards`를 플렉스 컨테이너로 만들면 주축 방향과 `gap`을 한곳에서 정할 수 있어요. gap은 주축 방향으로 생기니, 좁은 화면의 주축이 세로가 되게 하세요.
  - "넓은 화면에서는 세 가지가 달라져요. 주축 방향, 주축 방향의 정렬, 그리고 카드의 너비예요. 이 셋을 `min-width: 720px` 미디어 쿼리 안에 써요."
explanation: |
  예시 정답은 기본 규칙에 좁은 화면 배치를 쓰고, 미디어 쿼리에 넓은 화면에서 달라지는 점만 더하는 거예요.

  ```css
  .cards {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  @media (min-width: 720px) {
    .cards {
      flex-direction: row;
      justify-content: center;
    }
    .card {
      width: 180px;
    }
  }
  ```

  - 기본 규칙: `.cards`를 플렉스 컨테이너로 만들고 주축을 세로(`column`)로 둬요. `gap: 16px`는 주축 방향, 즉 세로로 카드 사이에만 생겨요. column의 교차축 정렬 기본값(`stretch`)이 카드를 가로로 가득 채워요.
  - 미디어 쿼리: 720px **이상**에서 주축을 가로(`row`)로 바꾸면 같은 `gap`이 이번에는 가로 간격이 돼요. 주축이 가로이니 가운데 모으기는 `justify-content: center`가 맡아요. 카드 너비 180px도 넓은 화면에서만 필요하니 미디어 쿼리 안에 써요.

  자주 하는 실수:

  - `.card { width: 180px; }`를 기본 규칙에 쓰면 좁은 화면에서도 카드가 180px로 좁아져 가로를 채우지 못해요. 넓은 화면에서만 필요한 규칙은 미디어 쿼리 안에 둬요.
  - `max-width: 720px`로 쓰면 반대로 좁은 화면이 가로 배치가 돼요. `min-width: 721px`로 쓰면 정확히 720px에서 아직 세로라 경계 체크가 실패해요.
  - 가운데 정렬에 `align-items: center`를 쓰면 row에서는 세로(교차축) 정렬이라 카드 묶음이 왼쪽에 그대로 있어요.
  - 카드에 `margin`을 주어 간격을 만들면 첫·마지막 카드 바깥에도 여백이 생기거나 방향마다 다시 고쳐야 해요. `gap`은 방향이 바뀌어도 사이에만 생겨요.

  `max-width: 719px` 미디어 쿼리로 좁은 화면을 덮어쓰는 데스크톱 우선 방식도 결과는 같아서 채점을 통과해요. 하지만 이 문제가 요구한 방식은 기본 규칙이 좁은 화면용인 모바일 우선이에요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
