id: css.layout.flex-basics.mcq-vertical-center-row
type: mcq_single
difficulty: 2
concepts:
  - { id: css.flex.justify-align, weight: 1 }
tags: [flexbox, align-items, justify-content]
estimatedSeconds: 50
prompt: |
  높이가 `80px`인 헤더 막대에 로고와 버튼이 가로로 나란히(기본값 `row`) 놓여 있어요. 둘 다 막대의 위쪽에 붙어 있는데, 이것을 **세로 가운데**로 맞추려면 `.header`에 어떤 선언을 추가해야 할까요?
code: |
  .header {
    display: flex;
    height: 80px;
  }
spec:
  options:
    - id: a
      text: "`align-items: center;`"
    - id: b
      text: "`justify-content: center;`"
      misconception: css.mc.justify-align-swap
      rationale: row에서 justify-content는 주축인 가로 방향으로 아이템을 옮겨요. 세로 위치는 바뀌지 않아요.
    - id: c
      text: "`text-align: center;`"
      rationale: text-align은 글자 같은 인라인 내용을 가로로 정렬하는 속성이라 플렉스 아이템의 세로 위치를 바꾸지 못해요.
    - id: d
      text: "`flex-direction: center;`"
      rationale: flex-direction은 row·column 같은 방향 값만 받아요. center는 잘못된 값이라 무시돼요.
  correct: a
misconceptions: [css.mc.justify-align-swap]
hints:
  - 기본값 row에서 주축과 교차축은 각각 어느 방향인지 먼저 정해 보세요.
  - row에서 세로는 교차축이에요. 교차축 정렬을 맡는 속성은 무엇일까요?
  - justify-content는 주축, align-items는 교차축을 맡아요.
explanation: |
  정답은 **`align-items: center;`**예요.

  기본값 `row`에서 주축은 가로, 교차축은 세로예요. 세로 위치를 바꾸는 것은 **교차축** 정렬이므로 `align-items`가 맡아요.

  - `justify-content: center`는 주축(가로) 방향으로 가운데에 모아요. 로고와 버튼이 가로 가운데로 이동할 뿐 여전히 위쪽에 붙어 있어요.
  - `text-align`은 블록 안의 글자를 정렬하는 속성이라 플렉스 아이템의 위치와 상관없어요.
  - `flex-direction`에는 center라는 값이 없어요.
origin: authored
review:
