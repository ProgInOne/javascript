id: css.styling.units-colors.fill-nested-em
type: fill_blank
difficulty: 3
concepts:
  - { id: css.units.rem-em, weight: 1 }
  - { id: css.cascade.inheritance, weight: 0.3 }
tags: [units, em, rem]
estimatedSeconds: 90
prompt: |
  루트(`html`)의 글자 크기는 `16px`이에요. `.menu` 안에 `.item`이 있고, `.item` 안에 `.label`이 있어요. 각 요소의 글자 크기는 몇 px인가요? 숫자만 써도 돼요.
code: |
  .menu {
    font-size: 1.5em;   /* 부모는 body(16px) */
  }
  .item {
    font-size: 1.5em;   /* .menu 안 */
  }
  .label {
    font-size: 1.5rem;  /* .item 안 */
  }
spec:
  mode: text
  template: |
    .menu: {{blank:menu}}
    .item: {{blank:item}}
    .label: {{blank:label}}
  blanks:
    - id: menu
      accept: ["24px", "24"]
      acceptRegex: "24 ?(?:px)?"
      caseSensitive: false
      width: 8
    - id: item
      accept: ["36px", "36"]
      acceptRegex: "36 ?(?:px)?"
      caseSensitive: false
      width: 8
      misconceptionMap:
        "24": css.mc.em-same-as-rem
        "24px": css.mc.em-same-as-rem
    - id: label
      accept: ["24px", "24"]
      acceptRegex: "24 ?(?:px)?"
      caseSensitive: false
      width: 8
misconceptions: [css.mc.em-same-as-rem]
hints:
  - "`font-size`에 쓴 `em`은 부모의 글자 크기를, `rem`은 루트의 글자 크기를 기준으로 해요."
  - "`.menu`부터 바깥에서 안쪽으로 차례로 계산하세요. `.item`의 부모는 `.menu`예요."
  - "`.item`은 `.menu`의 크기에 1.5를 곱하고, `.label`은 부모와 상관없이 16에 1.5를 곱해요."
explanation: |
  정답은 **`.menu` 24px, `.item` 36px, `.label` 24px**이에요.

  - `.menu`: 부모 `body`가 16px이니 `16 × 1.5 = 24px`.
  - `.item`: 부모 `.menu`가 24px이니 `24 × 1.5 = 36px`. `em`은 중첩되면 계속 곱해져요.
  - `.label`: `rem`은 부모가 아니라 루트(16px)를 기준으로 하니 `16 × 1.5 = 24px`.

  `.item`을 24px이라고 답했다면 `em`도 `rem`처럼 루트를 기준으로 한다고 생각한 거예요. `.label`을 54px(`36 × 1.5`)이라고 답했다면 반대로 `rem`을 `em`처럼 계산한 거예요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
