id: css.styling.units-colors.fill-rgb-from-hex
type: fill_blank
difficulty: 2
concepts:
  - { id: css.colors.notation, weight: 1 }
tags: [color, rgb, hex]
estimatedSeconds: 100
prompt: |
  디자이너가 배지 색을 16진수 `#ff8000`(주황)으로 정해 줬어요. 같은 색을 `rgb()`로 쓰려고 해요. 빈칸에 **빨강 초록 파랑 세 숫자**를 공백으로 나눠 채우세요.

  참고: 16진수 `00`은 0, `80`은 128, `ff`는 255예요.
spec:
  mode: code
  lang: html
  template: |
    <style>
      .badge {
        display: inline-block;
        padding: 4px 12px;
        background-color: rgb({{blank:c}});
      }
    </style>
    <span class="badge">새 글</span>
  blanks:
    - id: c
      accept: ["255 128 0", "255, 128, 0"]
      width: 16
      misconceptionMap:
        "100 50 0": css.mc.rgb-max-100
  checks:
    - kind: css
      id: same-color
      description: 배지의 배경색이 "#ff8000"과 같은 색이어야 합니다.
      requirement: 디자이너가 정한 색
      visible: true
      selector: .badge
      expect:
        computed:
          background-color: { color: "#ff8000", deltaE: 3 }
      misconceptionIfFail: css.mc.rgb-max-100
misconceptions: [css.mc.rgb-max-100]
hints:
  - "16진수 `#ff8000`을 두 자리씩 나누면 빨강·초록·파랑 순서예요: `ff`, `80`, `00`."
  - 문제 아래의 참고를 보고 세 조각을 각각 10진수로 바꿔 보세요.
  - "`rgb()`에는 빨강, 초록, 파랑 순서로 0부터 255까지 숫자를 써요. `ff`는 최댓값이에요."
explanation: |
  정답은 **`255 128 0`**이에요. 그래서 `rgb(255 128 0)`이 돼요.

  `#ff8000`은 두 자리씩 빨강(`ff`), 초록(`80`), 파랑(`00`)이에요. 10진수로 바꾸면 255, 128, 0이에요. 쉼표를 써서 `255, 128, 0`으로 채워도 같은 색이라 정답이에요.

  `100 50 0`처럼 0부터 100까지 범위로 생각해 채우면 훨씬 어두운 갈색이 돼요. rgb의 값은 0부터 255까지이고, 16진수 두 자리(`00`부터 `ff`까지)와 같은 범위예요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
