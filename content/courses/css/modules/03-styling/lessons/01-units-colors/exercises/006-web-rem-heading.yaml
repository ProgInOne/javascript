id: css.styling.units-colors.web-rem-heading
type: web_task
difficulty: 2
concepts:
  - { id: css.units.rem-em, weight: 1 }
tags: [units, rem, em, font-size, web-task]
estimatedSeconds: 200
prompt: |
  카드 두 개의 본문 글자 크기가 서로 달라요(`.big`은 20px, `.small`은 14px). 그런데 카드 제목(`h2`)도 본문을 따라 크기가 제각각이 됐어요.

  `h2` 규칙의 `font-size`를 고쳐서, 두 카드의 제목이 모두 **루트 글자 크기(16px)의 2배인 32px**이 되게 하세요. 카드 본문의 글자 크기는 그대로 두세요.
spec:
  focus: css
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>카드 제목</title>
              <style>
                .card {
                  border: 1px solid #9ca3af;
                  padding: 12px;
                  margin-bottom: 12px;
                }
                .big {
                  font-size: 20px;
                }
                .small {
                  font-size: 14px;
                }
                h2 {
                  font-size: 2em;
                  margin: 0 0 8px;
                }
              </style>
            </head>
            <body>
              <div class="card big">
                <h2>공지</h2>
                <p>본문 글자가 큰 카드예요.</p>
              </div>
              <div class="card small">
                <h2>소식</h2>
                <p>본문 글자가 작은 카드예요.</p>
              </div>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>카드 제목</title>
              <style>
                .card {
                  border: 1px solid #9ca3af;
                  padding: 12px;
                  margin-bottom: 12px;
                }
                .big {
                  font-size: 20px;
                }
                .small {
                  font-size: 14px;
                }
                h2 {
                  font-size: 2rem;
                  margin: 0 0 8px;
                }
              </style>
            </head>
            <body>
              <div class="card big">
                <h2>공지</h2>
                <p>본문 글자가 큰 카드예요.</p>
              </div>
              <div class="card small">
                <h2>소식</h2>
                <p>본문 글자가 작은 카드예요.</p>
              </div>
            </body>
          </html>
  checks:
    - kind: css
      id: heading-32
      description: 두 카드의 제목(h2) 글자 크기가 모두 32px이어야 합니다.
      requirement: 제목 32px
      visible: true
      selector: h2
      all: true
      expect:
        computed:
          font-size: { px: { value: 32 } }
      misconceptionIfFail: css.mc.em-same-as-rem
    - kind: css
      id: big-body-kept
      description: 큰 카드의 본문 글자 크기는 20px 그대로여야 합니다.
      requirement: 본문 크기 유지
      selector: .big p
      expect:
        computed:
          font-size: { px: { value: 20 } }
    - kind: css
      id: small-body-kept
      description: 작은 카드의 본문 글자 크기는 14px 그대로여야 합니다.
      requirement: 본문 크기 유지
      selector: .small p
      expect:
        computed:
          font-size: { px: { value: 14 } }
misconceptions: [css.mc.em-same-as-rem]
hints:
  - 지금 두 제목은 각각 몇 px일까요? `2em`이 무엇을 기준으로 하는지 떠올려 보세요.
  - "`font-size`의 `em`은 부모(카드)의 글자 크기를 기준으로 해서 `20 × 2 = 40px`, `14 × 2 = 28px`이 돼요."
  - 부모와 상관없이 루트(`html`)를 기준으로 하는 단위로 바꾸면 두 제목이 같은 크기가 돼요.
explanation: |
  예시 정답은 `h2`의 `font-size`를 **`2rem`**으로 바꾸는 거예요.

  처음 코드의 `2em`은 부모인 카드의 글자 크기를 기준으로 해요. 그래서 큰 카드의 제목은 `20 × 2 = 40px`, 작은 카드의 제목은 `14 × 2 = 28px`로 달랐어요.

  `rem`은 부모와 상관없이 루트의 글자 크기(16px)를 기준으로 하니 `2rem`은 어느 카드에서나 32px이에요.

  `font-size: 32px`로 써도 체크는 통과해요. 다만 `rem`으로 쓰면 학습자가 브라우저의 기본 글자 크기를 키웠을 때 제목도 같은 비율로 커져서, 실제 사이트에서는 `rem`을 더 많이 써요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
