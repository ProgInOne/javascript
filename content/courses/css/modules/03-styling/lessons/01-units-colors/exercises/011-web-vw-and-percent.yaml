id: css.styling.units-colors.web-vw-and-percent
type: web_task
difficulty: 3
concepts:
  - { id: css.units.length, weight: 1 }
tags: [units, percent, vw, web-task]
estimatedSeconds: 300
prompt: |
  페이지의 본문 상자(`.layout`)는 좁은 화면에서는 `300px`, 넓은 화면(900px 이상)에서는 `800px`이에요. 그 안에 막대 두 개가 있어요. `.screen-bar`와 `.layout-bar` 규칙에 `width`를 추가해 아래 두 가지를 만족시키세요.

  1. 파란 막대(`.screen-bar`)는 본문 상자와 상관없이 언제나 **화면(뷰포트) 너비의 절반**이에요.
  2. 주황 막대(`.layout-bar`)는 화면과 상관없이 언제나 **본문 상자(`.layout`) 너비의 절반**이에요.

  채점은 두 화면 너비에서 해요.

  | 화면 너비 | `.layout` | 파란 막대 | 주황 막대 |
  |---|---|---|---|
  | `375px` | 300px | 187.5px | 150px |
  | `1280px` | 800px | 640px | 400px |

  `.layout` 규칙은 그대로 두세요. `@media`로 시작하는 부분은 화면 너비에 따라 규칙을 바꾸는 미디어 쿼리예요. 레이아웃 모듈에서 배우니 지금은 "넓은 화면에서는 본문 상자가 800px"이라고만 읽으면 돼요.
spec:
  focus: css
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>두 가지 막대</title>
              <style>
                body {
                  margin: 0;
                }
                .layout {
                  width: 300px;
                  background: #f3f4f6;
                }
                /* 넓은 화면(900px 이상)에서는 본문 상자를 800px로 */
                @media (min-width: 900px) {
                  .layout {
                    width: 800px;
                  }
                }
                .screen-bar {
                  height: 16px;
                  margin-bottom: 8px;
                  background: #2563eb;
                  /* 1. 화면 너비의 절반 */
                }
                .layout-bar {
                  height: 16px;
                  background: #f97316;
                  /* 2. 본문 상자 너비의 절반 */
                }
              </style>
            </head>
            <body>
              <div class="layout">
                <div class="screen-bar"></div>
                <div class="layout-bar"></div>
              </div>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>두 가지 막대</title>
              <style>
                body {
                  margin: 0;
                }
                .layout {
                  width: 300px;
                  background: #f3f4f6;
                }
                /* 넓은 화면(900px 이상)에서는 본문 상자를 800px로 */
                @media (min-width: 900px) {
                  .layout {
                    width: 800px;
                  }
                }
                .screen-bar {
                  height: 16px;
                  margin-bottom: 8px;
                  background: #2563eb;
                  width: 50vw;
                }
                .layout-bar {
                  height: 16px;
                  background: #f97316;
                  width: 50%;
                }
              </style>
            </head>
            <body>
              <div class="layout">
                <div class="screen-bar"></div>
                <div class="layout-bar"></div>
              </div>
            </body>
          </html>
  checks:
    - kind: css
      id: screen-bar-narrow
      description: 너비 375px 화면에서 파란 막대의 width가 화면의 절반(187.5px)이어야 합니다.
      requirement: 파란 막대는 화면의 절반
      visible: true
      viewport: 375
      selector: .screen-bar
      expect:
        computed:
          width: { px: { value: 187.5 } }
      misconceptionIfFail: css.mc.percent-of-screen
    - kind: css
      id: screen-bar-wide
      description: 너비 1280px 화면에서 파란 막대의 width가 화면의 절반(640px)이어야 합니다.
      requirement: 파란 막대는 화면의 절반
      visible: true
      viewport: 1280
      selector: .screen-bar
      expect:
        computed:
          width: { px: { value: 640 } }
      misconceptionIfFail: css.mc.percent-of-screen
    - kind: css
      id: layout-bar-narrow
      description: 너비 375px 화면에서 주황 막대의 width가 본문 상자의 절반(150px)이어야 합니다.
      requirement: 주황 막대는 본문 상자의 절반
      visible: true
      viewport: 375
      selector: .layout-bar
      expect:
        computed:
          width: { px: { value: 150 } }
    - kind: css
      id: layout-bar-wide
      description: 너비 1280px 화면에서 주황 막대의 width가 본문 상자의 절반(400px)이어야 합니다.
      requirement: 주황 막대는 본문 상자의 절반
      visible: true
      viewport: 1280
      selector: .layout-bar
      expect:
        computed:
          width: { px: { value: 400 } }
    - kind: css
      id: layout-kept-narrow
      description: 너비 375px 화면에서 본문 상자의 width는 300px 그대로여야 합니다.
      requirement: 본문 상자 유지
      viewport: 375
      selector: .layout
      expect:
        computed:
          width: { px: { value: 300 } }
    - kind: css
      id: layout-kept-wide
      description: 너비 1280px 화면에서 본문 상자의 width는 800px 그대로여야 합니다.
      requirement: 본문 상자 유지
      viewport: 1280
      selector: .layout
      expect:
        computed:
          width: { px: { value: 800 } }
misconceptions: [css.mc.percent-of-screen]
hints:
  - 두 막대는 "무엇의 절반"인지가 달라요. 하나는 화면, 하나는 부모 상자를 기준으로 하는 단위가 필요해요.
  - 레슨의 길이 단위 표에서 "기준" 칸을 보세요. 부모 요소를 기준으로 하는 단위와 화면(뷰포트)을 기준으로 하는 단위가 따로 있어요. `px`로 쓰면 두 화면 중 한쪽에서 맞지 않아요.
  - 파란 막대는 화면 너비의 50/100, 주황 막대는 부모(`.layout`) 너비의 50/100이에요. 각각 알맞은 단위를 숫자 50 뒤에 붙여 보세요.
explanation: |
  예시 정답은 `.screen-bar`에 **`width: 50vw;`**, `.layout-bar`에 **`width: 50%;`**를 추가하는 거예요.

  - `vw`는 화면(뷰포트) 너비의 1/100이에요. `50vw`는 화면이 375px이면 187.5px, 1280px이면 640px로, 부모 상자와 상관없이 언제나 화면의 절반이에요.
  - `%`는 부모의 content 너비를 기준으로 해요. `50%`는 `.layout`이 300px이면 150px, 800px이면 400px로, 언제나 본문 상자의 절반이에요.

  자주 틀리는 경우는 이래요.

  - 두 막대 모두 `50%`로 쓰면 파란 막대도 본문 상자의 절반이 돼요. `%`는 화면이 아니라 부모를 기준으로 하기 때문이에요.
  - 두 막대를 바꿔 쓰면 두 화면 모두에서 기대와 다른 값이 나와요.
  - 주황 막대에 `width: 150px`처럼 `px`로 쓰면 375px 화면에서는 맞지만 1280px 화면에서 틀려요. `px`는 화면이나 부모가 바뀌어도 그대로인 고정 크기예요.
