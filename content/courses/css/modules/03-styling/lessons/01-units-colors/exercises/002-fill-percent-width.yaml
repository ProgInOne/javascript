id: css.styling.units-colors.fill-percent-width
type: fill_blank
difficulty: 2
concepts:
  - { id: css.units.length, weight: 1 }
  - { id: css.box.size, weight: 0.3 }
tags: [units, percent, vw]
estimatedSeconds: 70
prompt: |
  화면(뷰포트) 너비가 `1000px`일 때, 아래 두 상자의 `width`는 각각 몇 px인가요? `box-sizing`은 기본값이고, 숫자만 써도 돼요.
code: |
  .wrap {
    width: 600px;
  }
  .a {        /* .wrap 안에 있어요 */
    width: 25%;
  }
  .b {        /* .wrap 안에 있어요 */
    width: 25vw;
  }
spec:
  mode: text
  template: |
    .a의 width: {{blank:a}}
    .b의 width: {{blank:b}}
  blanks:
    - id: a
      accept: ["150px", "150"]
      acceptRegex: "150 ?(?:px)?"
      caseSensitive: false
      width: 8
      misconceptionMap:
        "250": css.mc.percent-of-screen
        "250px": css.mc.percent-of-screen
    - id: b
      accept: ["250px", "250"]
      acceptRegex: "250 ?(?:px)?"
      caseSensitive: false
      width: 8
misconceptions: [css.mc.percent-of-screen]
hints:
  - 두 단위의 기준이 서로 달라요. 하나는 부모, 하나는 화면이에요.
  - "`%`는 부모 `.wrap`(600px)을, `vw`는 화면 너비(1000px)를 기준으로 해요."
  - "`.a`는 600의 25%, `.b`는 1000의 25%(1vw는 화면 너비의 1/100)예요."
explanation: |
  정답은 **`.a`는 150px, `.b`는 250px**이에요.

  - `.a`: `%`는 부모 `.wrap`의 content 너비가 기준이에요. `600 × 0.25 = 150px`.
  - `.b`: `1vw`는 화면 너비의 1/100(10px)이에요. `25vw = 25 × 10 = 250px`. 부모가 얼마든 상관없어요.

  `.a`를 250이라고 답했다면 `%`도 화면을 기준으로 한다고 생각한 거예요. 화면 기준은 `vw`뿐이에요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
