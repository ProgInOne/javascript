id: css.styling.typography.fill-generic-font
type: fill_blank
difficulty: 1
concepts:
  - { id: css.type.font-properties, weight: 1 }
tags: [font-family, fallback]
estimatedSeconds: 60
prompt: |
  본문을 `"Noto Sans KR"` 글꼴로 보여 주고 싶어요. 그런데 이 글꼴이 없는 기기에서도 **명조가 아닌 고딕 계열** 글꼴로 보이게 하려고 해요.

  목록의 마지막 빈칸에 어느 기기에나 있는 **일반 글꼴 이름**을 채우세요.
spec:
  mode: text
  template: |
    body {
      font-family: "Noto Sans KR", {{blank:g}};
    }
  blanks:
    - id: g
      accept: ["sans-serif", "sans-serif;"]
      caseSensitive: false
      width: 14
      misconceptionMap:
        "serif": css.mc.font-family-guaranteed
misconceptions: [css.mc.font-family-guaranteed]
hints:
  - 글꼴이 없을 때를 대비해 목록 끝에는 특정 글꼴이 아니라 "글꼴의 계열"을 적어요.
  - 일반 글꼴 이름에는 명조 계열과 고딕 계열이 있어요. 프랑스어 sans는 "없이"라는 뜻이에요.
  - 명조 계열은 `serif`예요. 고딕 계열은 그 앞에 "없이"를 붙인 이름이에요.
explanation: |
  정답은 **`sans-serif`**예요.

  `font-family`는 앞에서부터 쓸 수 있는 글꼴을 찾아요. `"Noto Sans KR"`이 없는 기기에서는 다음 이름으로 넘어가는데, 일반 글꼴 이름 `sans-serif`는 어느 기기에나 있어서 최소한 고딕 계열로 보이게 해 줘요.

  - `serif`는 명조 계열(획 끝에 작은 삐침이 있는 글꼴)이라 문제의 조건에 맞지 않아요.
  - 일반 글꼴 이름은 따옴표로 감싸지 않아요. `"sans-serif"`처럼 감싸면 "sans-serif라는 이름의 글꼴"을 찾게 돼요.
  - 대안 없이 `"Noto Sans KR"`만 쓰면, 글꼴이 없는 기기에서는 브라우저 기본 글꼴(명조일 수도 있음)로 보여요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
