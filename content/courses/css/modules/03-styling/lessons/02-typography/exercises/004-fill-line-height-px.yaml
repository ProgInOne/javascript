id: css.styling.typography.fill-line-height-px
type: fill_blank
difficulty: 1
concepts:
  - { id: css.type.line-height, weight: 1 }
tags: [line-height]
estimatedSeconds: 60
prompt: |
  아래 문단에서 글자 한 줄이 차지하는 높이(줄 높이)는 몇 px인가요? 숫자만 써도 돼요.
code: |
  p {
    font-size: 20px;
    line-height: 1.5;
  }
spec:
  mode: text
  template: |
    한 줄의 높이: {{blank:h}}
  blanks:
    - id: h
      accept: ["30px", "30"]
      acceptRegex: "30 ?(?:px)?"
      caseSensitive: false
      width: 8
      misconceptionMap:
        "1.5": css.mc.line-height-unitless-px
        "1.5px": css.mc.line-height-unitless-px
misconceptions: [css.mc.line-height-unitless-px]
hints:
  - "`1.5` 뒤에 단위가 없어요. 단위 없는 `line-height`는 무엇을 뜻할까요?"
  - 단위 없는 `line-height`는 글자 크기에 곱하는 배수예요.
  - 이 문단의 글자 크기가 몇 px인지 보고, 거기에 `line-height`의 숫자를 곱해 보세요.
explanation: |
  정답은 **30px**이에요.

  단위 없는 `line-height`는 글자 크기에 곱하는 **배수**예요. `20 × 1.5 = 30px`이에요. 글자(20px)는 30px 높이의 가운데에 놓이고, 남는 10px이 위아래로 5px씩 나뉘어 줄 사이 여백이 돼요.

  `1.5`나 `1.5px`이라고 답했다면 숫자를 px 값으로 읽은 거예요. 줄 높이가 정말 1.5px이면 줄들이 겹쳐서 글을 읽을 수 없어요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
