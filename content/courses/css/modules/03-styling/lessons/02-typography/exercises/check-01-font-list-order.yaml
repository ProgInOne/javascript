id: css.styling.typography.check-font-list-order
type: mcq_single
difficulty: 1
usage: check
concepts:
  - { id: css.type.font-properties, weight: 1 }
tags: [font-family, fallback, generic-font]
estimatedSeconds: 60
prompt: |
  제목을 `Nanum Myeongjo` 글꼴로 보여 주고, 이 글꼴이 없는 기기에서는 명조 계열로 보이게 하려고 해요. `font-family` 값을 가장 알맞게 쓴 것은 무엇인가요?
spec:
  options:
    - id: a
      text: "`\"Nanum Myeongjo\", serif`"
    - id: b
      text: "`serif, \"Nanum Myeongjo\"`"
      rationale: 목록은 앞에서부터 찾아요. serif는 어느 기기에나 있어서 늘 첫 번째에서 멈추고, Nanum Myeongjo는 쓰이지 않아요.
    - id: c
      text: "`\"Nanum Myeongjo\"`"
      misconception: css.mc.font-family-guaranteed
      rationale: 이 글꼴이 없는 기기에서는 브라우저 기본 글꼴로 보여서 고딕 계열이 될 수도 있어요. 대안이 없어요.
    - id: d
      text: "`Nanum Myeongjo serif`"
      rationale: 글꼴 사이를 쉼표로 나누지 않으면 하나의 긴 글꼴 이름으로 읽혀요. 띄어쓰기 있는 이름은 따옴표로 감싸요.
  correct: a
misconceptions: [css.mc.font-family-guaranteed]
hints:
  - "`font-family` 목록은 어느 쪽부터 차례로 찾나요?"
  - 원하는 글꼴을 먼저, 어느 기기에나 있는 일반 글꼴 이름을 맨 끝에 둬요.
  - 글꼴 사이는 쉼표로 나누고, 띄어쓰기 있는 글꼴 이름은 따옴표로 감싸요.
explanation: |
  정답은 **`"Nanum Myeongjo", serif`** 예요.

  브라우저는 목록을 **앞에서부터** 찾아서 기기에 있는 첫 글꼴을 써요. 원하는 글꼴을 먼저 두고, 맨 끝에 어느 기기에나 있는 일반 글꼴 이름(`serif`)을 둬야 글꼴이 없을 때도 명조 계열이 지켜져요.

  - 일반 글꼴 이름을 맨 앞에 두면 거기서 바로 멈춰서 원하는 글꼴이 쓰이지 않아요.
  - 대안 없이 한 글꼴만 쓰면, 그 글꼴이 없는 기기에서 어떤 계열로 보일지 알 수 없어요.
  - 띄어쓰기가 있는 이름은 따옴표로 감싸고, 글꼴 사이는 쉼표로 나눠요.
origin: authored
review:
