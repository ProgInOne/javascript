id: css.styling.typography.mcq-font-fallback
type: mcq_single
difficulty: 1
concepts:
  - { id: css.type.font-properties, weight: 1 }
tags: [font-family, fallback]
estimatedSeconds: 50
prompt: |
  학습자의 컴퓨터에 `"Pretendard"` 글꼴은 **없고**, `Arial`은 **있어요**. 아래 규칙이 적용된 글자는 어떤 글꼴로 보이나요?
code: |
  p {
    font-family: "Pretendard", Arial, sans-serif;
  }
spec:
  options:
    - id: a
      text: "`Arial`"
    - id: b
      text: "`Pretendard`"
      misconception: css.mc.font-family-guaranteed
      rationale: font-family에 적었다고 해서 그 글꼴이 생기지는 않아요. 기기에 없으면 다음 글꼴로 넘어가요.
    - id: c
      text: 기기의 기본 고딕 계열 글꼴(`sans-serif`)
      rationale: "`sans-serif`는 앞의 글꼴을 모두 쓸 수 없을 때의 마지막 대안이에요. `Arial`이 있으니 거기까지 가지 않아요."
    - id: d
      text: 글꼴 하나를 찾지 못했으니 규칙 전체가 무시되고 기본 글꼴로 보인다
      rationale: 목록에서 없는 글꼴은 건너뛸 뿐, 규칙이 무시되지는 않아요.
  correct: a
misconceptions: [css.mc.font-family-guaranteed]
hints:
  - "`font-family` 목록은 어느 쪽부터 차례로 살펴볼까요?"
  - 브라우저는 목록에서 기기에 있는 첫 번째 글꼴을 골라요. 없는 글꼴은 건너뛰어요.
  - 첫 번째 글꼴은 없으니 두 번째 글꼴이 있는지 보세요.
explanation: |
  정답은 **`Arial`**이에요.

  `font-family`는 앞에서부터 차례로 찾아 **쓸 수 있는 첫 번째 글꼴**을 써요. `"Pretendard"`는 기기에 없어서 건너뛰고, 다음 `Arial`이 있으니 Arial로 보여요.

  - `Pretendard`: CSS에 적었다고 그 글꼴이 보장되지는 않아요. 그래서 대안을 나열해요.
  - `sans-serif`: 앞의 글꼴이 모두 없을 때만 쓰이는 마지막 대안이에요.
  - 없는 글꼴이 있어도 규칙 전체가 무시되지는 않아요. 그 이름만 건너뛰어요.
origin: authored
