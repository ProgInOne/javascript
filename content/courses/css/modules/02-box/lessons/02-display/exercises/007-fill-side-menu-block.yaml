id: css.box.display.fill-side-menu-block
type: fill_blank
difficulty: 2
concepts:
  - { id: css.display.block-inline, weight: 1 }
tags: [display, block, menu]
estimatedSeconds: 90
prompt: |
  세로 메뉴를 만들려고 해요. 지금은 링크들이 한 줄에 이어져 있어요. 빈칸에 `display` 값을 채워 **링크마다 새 줄에서 시작하고, 메뉴 상자의 너비를 꽉 채우게** 하세요.
spec:
  mode: code
  lang: html
  template: |
    <style>
      .menu {
        width: 200px;
        background: #f3f4f6;
      }
      .menu a {
        display: {{blank:value}};
        padding: 8px 12px;
        color: #1f2937;
      }
    </style>
    <nav class="menu">
      <a id="home">홈</a>
      <a id="lessons">단원 목록</a>
      <a id="review">복습</a>
    </nav>
  blanks:
    - id: value
      accept: ["block"]
      width: 14
  checks:
    - kind: layout
      id: stacked
      description: 두 번째 링크가 첫 번째 링크의 아래에 있어야 합니다.
      requirement: 링크마다 새 줄
      visible: true
      a: "#lessons"
      b: "#home"
      relation: below
      tolerancePx: 1
    - kind: layout
      id: stacked-2
      description: 세 번째 링크가 두 번째 링크의 아래에 있어야 합니다.
      requirement: 링크마다 새 줄
      visible: true
      a: "#review"
      b: "#lessons"
      relation: below
      tolerancePx: 1
    - kind: layout
      id: full-width
      description: 링크가 메뉴 상자의 너비를 꽉 채워야 합니다.
      requirement: 메뉴 너비 채우기
      visible: true
      a: "#home"
      container: .menu
      relation: fills-width
      tolerancePx: 1
hints:
  - 지금 링크(a)는 어떤 종류의 요소라서 한 줄에 이어져 있을까요?
  - 새 줄에서 시작하고 부모 너비를 채우는 것은 어떤 종류의 요소였나요?
  - "`div`나 `p`의 기본 display 값을 떠올려 보세요."
explanation: |
  정답은 **`block`**이에요.

  링크(`a`)는 기본이 인라인이라 글자처럼 한 줄에 이어져요. `display: block`으로 바꾸면 블록처럼 링크마다 새 줄에서 시작하고, 너비를 정하지 않았으니 부모(`.menu`) 너비를 꽉 채워요. 덕분에 글자뿐 아니라 줄 전체가 링크 영역이 되고, 위아래 `padding`도 실제 높이에 들어가요.

  `inline-block`을 쓰면 위아래 padding은 들어가지만, 자리가 있는 한 같은 줄에 나란히 놓이고 너비도 글자만큼만 차지해서 요구사항을 만족하지 못해요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
