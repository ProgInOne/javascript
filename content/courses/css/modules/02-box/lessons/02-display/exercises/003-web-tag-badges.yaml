                }
              </style>
            </head>
            <body>
              <p>오늘은 박스 모델과 display를 배웠어요.</p>
              <div class="ruler"></div>
              <div>
                <span class="tag" id="t1">CSS</span>
                <span class="tag" id="t2">박스</span>
                <span class="tag" id="t3">display</span>
              </div>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>태그 배지</title>
              <style>
                .ruler {
                  width: 80px;
                  height: 6px;
                  background: #2563eb;
                }
                .tag {
                  width: 80px;
                  margin: 8px 4px;
                  padding: 4px 0;
                  text-align: center;
                  background: #dbeafe;
                  display: inline-block;
                }
              </style>
            </head>
            <body>
              <p>오늘은 박스 모델과 display를 배웠어요.</p>
              <div class="ruler"></div>
              <div>
                <span class="tag" id="t1">CSS</span>
                <span class="tag" id="t2">박스</span>
                <span class="tag" id="t3">display</span>
              </div>
            </body>
          </html>
  checks:
    - kind: layout
      id: width-t1
      description: 첫 번째 배지의 너비가 파란 안내선(80px)과 같아야 합니다.
      requirement: 배지 너비 80px
      visible: true
      a: "#t1"
      container: .ruler
      relation: fills-width
      tolerancePx: 1
      misconceptionIfFail: css.mc.width-on-inline
    - kind: layout
      id: width-t3
      description: 세 번째 배지의 너비가 파란 안내선(80px)과 같아야 합니다.
      requirement: 배지 너비 80px
      visible: true
      a: "#t3"
      container: .ruler
      relation: fills-width
      tolerancePx: 1
      misconceptionIfFail: css.mc.width-on-inline
    - kind: layout
      id: same-row-12
      description: 두 번째 배지가 첫 번째 배지보다 오른쪽에 있어야 합니다.
      requirement: 한 줄에 나란히
      visible: true
      a: "#t2"
      b: "#t1"
      relation: right-of
      tolerancePx: 1
      misconceptionIfFail: css.mc.inline-block-new-line
    - kind: layout
      id: same-row-23
      description: 세 번째 배지가 두 번째 배지보다 오른쪽에 있어야 합니다.
      requirement: 한 줄에 나란히
      visible: true
      a: "#t3"
      b: "#t2"
      relation: right-of
      tolerancePx: 1
      misconceptionIfFail: css.mc.inline-block-new-line
    - kind: layout
      id: same-row-13
      description: 첫 번째와 세 번째 배지가 같은 줄(같은 높이)에 있어야 합니다.
      requirement: 한 줄에 나란히
      a: "#t3"
      b: "#t1"
      relation: same-row
      tolerancePx: 1
      misconceptionIfFail: css.mc.inline-block-new-line
misconceptions: [css.mc.width-on-inline, css.mc.inline-block-new-line]
hints:
  - "`span`은 블록일까요, 인라인일까요? 그 종류의 요소에 width가 적용되나요?"
  - width를 받으려면 display를 바꿔야 해요. 그런데 block으로 바꾸면 배지가 각자 새 줄로 내려가요.
  - 줄 안에 나란히 있으면서 width도 받는 display 값이 있어요. 인라인과 블록의 이름을 합친 값이에요.
explanation: |
  예시 정답은 `.tag`에 **`display: inline-block;`**을 추가하는 거예요.

  `span`은 인라인 요소라 `width`가 무시되고 글자 길이만큼만 칠해졌어요. `inline-block`으로 바꾸면 안쪽은 블록처럼 `width: 80px`와 위아래 margin을 받고, 바깥은 인라인처럼 한 줄에 나란히 놓여요.

  - `display: block;`으로 바꾸면 너비는 80px이 되지만 배지마다 새 줄에서 시작해 세로로 쌓여요. "한 줄에 나란히" 체크가 실패해요.
  - `inline-block`이 블록처럼 혼자 한 줄을 차지한다고 생각했다면, 이름의 앞부분(inline)이 바깥 배치를 뜻한다는 점을 기억하세요.
origin: authored
review:
