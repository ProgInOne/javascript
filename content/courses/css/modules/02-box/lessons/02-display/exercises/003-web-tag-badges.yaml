id: css.box.display.web-tag-badges
type: web_task
difficulty: 3
concepts:
  - { id: css.display.inline-block, weight: 1 }
  - { id: css.display.block-inline, weight: 0.5 }
tags: [display, inline-block, web-task]
estimatedSeconds: 240
prompt: |
  글 아래에 태그 배지 세 개를 붙였어요. 배지는 모두 너비 `80px`(위의 파란 안내선과 같은 너비)가 되도록 CSS를 써 두었는데, 화면에서는 글자 길이만큼만 칠해지고 너비가 제각각이에요.

  `.tag` 규칙에 **선언 하나를 추가**해서 다음을 모두 만족시키세요.

  1. 배지마다 너비가 파란 안내선과 같은 `80px`가 되어야 해요.
  2. 세 배지는 지금처럼 **한 줄에 나란히** 있어야 해요.
spec:
  focus: css
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>태그 배지</title>
              <style>
                .ruler {
                  width: 80px;
                  height: 6px;
                  background: #2563eb;
                }
                .tag {
                  width: 80px;
                  margin: 8px 4px;
                  padding: 4px 0;
                  text-align: center;
                  background: #dbeafe;
