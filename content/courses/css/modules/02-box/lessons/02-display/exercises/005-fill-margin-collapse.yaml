id: css.box.display.fill-margin-collapse
type: fill_blank
difficulty: 2
concepts:
  - { id: css.display.normal-flow, weight: 1 }
  - { id: css.box.areas, weight: 0.3 }
tags: [normal-flow, margin, margin-collapse]
estimatedSeconds: 60
prompt: |
  두 `div`가 위아래로 차례로 놓여 있어요(따로 배치를 정하지 않았어요). 위 상자의 **테두리 아래쪽**과 아래 상자의 **테두리 위쪽** 사이는 몇 px인가요? 숫자만 써도 돼요.
code: |
  .top {
    margin-bottom: 24px;
  }
  .bottom {
    margin-top: 40px;
  }
spec:
  mode: text
  template: |
    두 상자 사이의 간격: {{blank:gap}}
  blanks:
    - id: gap
      accept: ["40px", "40"]
      acceptRegex: "40 ?(?:px)?"
      caseSensitive: false
      width: 8
      misconceptionMap:
        "64": css.mc.vertical-margins-add
        "64px": css.mc.vertical-margins-add
misconceptions: [css.mc.vertical-margins-add]
hints:
  - 두 상자는 블록이고 일반 흐름에서 위아래로 맞닿아 있어요. 이때 margin에 특별한 규칙이 있었어요.
  - 위아래로 맞닿은 margin은 더해지지 않고 겹쳐요.
  - 겹치면 두 값 중 어느 쪽이 남는지 떠올려 보세요.
explanation: |
  정답은 **40px**이에요.

  일반 흐름에서 위아래로 맞닿은 블록의 margin은 더해지지 않고 겹쳐서 **큰 값 하나**만 남아요(마진 상쇄). 24px과 40px 중 큰 40px이 실제 간격이에요.

  - `64`라고 답했다면 두 margin을 더한 거예요. 좌우 margin이나 Flexbox 아이템의 margin은 더해지지만, 일반 흐름의 위아래 margin은 겹쳐요.
  - `24`라고 답했다면 위 상자의 margin만 본 거예요. 겹칠 때는 작은 값이 아니라 큰 값이 남아요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
