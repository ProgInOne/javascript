id: css.box.model.try-width-for-ruler
type: web_task
difficulty: 2
usage: try
concepts:
  - { id: css.box.size, weight: 1 }
tags: [box-model, width, content-box, web-task]
estimatedSeconds: 240
prompt: |
  위의 초록 안내선은 정확히 `240px`이에요. 아래 분홍 상자에는 안쪽 여백 `15px`과 테두리 `5px`이 이미 있어요.

  `.box` 규칙에 **`width` 선언을 직접 써서**, 분홍 상자가 테두리까지 포함해 안내선과 똑같은 `240px`로 보이게 하세요.

  - `box-sizing`은 쓰지 말고(기본값 `content-box` 그대로), 계산으로 알맞은 `width` 값을 구하세요.
  - 안쪽 여백과 테두리는 그대로 두세요.
spec:
  focus: css
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>안내선에 맞추기</title>
              <style>
                .ruler {
                  width: 240px;
                  height: 8px;
                  background: #16a34a;
                }
                .box {
                  padding: 15px;
                  border: 5px solid #be185d;
                  background: #fce7f3;
                  /* 여기에 width를 써서 보이는 너비가 240px이 되게 하세요 */
                }
              </style>
            </head>
            <body>
              <div class="ruler"></div>
              <div class="box">테두리까지 240px</div>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>안내선에 맞추기</title>
              <style>
                .ruler {
                  width: 240px;
                  height: 8px;
                  background: #16a34a;
                }
                .box {
                  padding: 15px;
                  border: 5px solid #be185d;
                  background: #fce7f3;
                  width: 200px;
                }
              </style>
            </head>
            <body>
              <div class="ruler"></div>
              <div class="box">테두리까지 240px</div>
            </body>
          </html>
  checks:
    - kind: layout
      id: same-as-ruler
      description: 분홍 상자의 너비(테두리까지)가 초록 안내선과 같은 240px이어야 합니다.
      requirement: 안내선과 같은 너비
      visible: true
      a: .box
      container: .ruler
      relation: fills-width
      tolerancePx: 1
      misconceptionIfFail: css.mc.width-includes-padding
    - kind: css
      id: content-box-kept
      description: box-sizing은 기본값 content-box 그대로여야 합니다. width 값을 계산해서 맞춰 보세요.
      requirement: 계산으로 맞추기
      visible: true
      selector: .box
      expect:
        computed:
          box-sizing: { equals: content-box }
    - kind: css
      id: padding-border-kept
      description: 안쪽 여백 15px과 테두리 5px은 그대로 있어야 합니다.
      requirement: 계산으로 맞추기
      visible: true
      selector: .box
      expect:
        computed:
          padding-left: { px: { value: 15 } }
          padding-right: { px: { value: 15 } }
          border-left-width: { px: { value: 5 } }
          border-right-width: { px: { value: 5 } }
misconceptions: [css.mc.width-includes-padding]
hints:
  - content-box에서 `width`는 가장 안쪽 content의 너비예요. 보이는 너비에는 무엇이 더해지나요?
  - 보이는 너비 = width + padding × 2 + border × 2예요. 240에서 양쪽 padding과 양쪽 border를 빼 보세요.
  - "240 − 15 − 15 − 5 − 5 = 200이에요. `.box` 규칙에 `width: 200px;`을 써요."
explanation: |
  알맞은 값은 **`width: 200px;`** 이에요.

  ```text
  보이는 너비 = width + (padding × 2) + (border × 2)
  240 = width + 30 + 10
  width = 200
  ```

  기본값인 content-box에서 `width`는 content 영역만의 너비예요. 그래서 `width: 240px`를 쓰면 padding과 border가 더해져 280px로 보여요. 보이는 너비를 맞추려면 양쪽 padding과 border를 **두 번씩** 빼서 width를 정해요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
