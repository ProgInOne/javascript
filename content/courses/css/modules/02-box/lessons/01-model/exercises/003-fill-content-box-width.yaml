id: css.box.model.fill-content-box-width
type: fill_blank
difficulty: 2
concepts:
  - { id: css.box.size, weight: 1 }
  - { id: css.box.areas, weight: 0.3 }
tags: [box-model, width, content-box]
estimatedSeconds: 70
prompt: |
  아래 상자는 `box-sizing`을 따로 정하지 않았어요(기본값 `content-box`). 이 상자가 화면에서 **테두리까지 차지하는 너비**는 몇 px인가요? 숫자만 써도 돼요.
code: |
  .card {
    width: 200px;
    padding: 20px;
    border: 5px solid black;
    margin: 10px;
  }
spec:
  mode: text
  template: |
    화면에서 보이는 너비(테두리까지): {{blank:w}}
  blanks:
    - id: w
      accept: ["250px", "250"]
      acceptRegex: "250 ?(?:px)?"
      caseSensitive: false
      width: 8
      misconceptionMap:
        "200": css.mc.width-includes-padding
        "200px": css.mc.width-includes-padding
misconceptions: [css.mc.width-includes-padding]
hints:
  - 기본값 `content-box`에서 `width`는 어느 영역의 너비인지 떠올려 보세요.
  - "`width`(content)에 padding과 border를 더해요. 양쪽에 하나씩 있다는 점을 잊지 마세요. margin은 테두리 바깥이라 이 너비에 들어가지 않아요."
  - "식으로 쓰면 `200 + (20 × 2) + (5 × 2)`예요."
explanation: |
  정답은 **250px**이에요.

  `content-box`에서 `width: 200px`는 content 영역의 너비예요. 화면에서 테두리까지 보이는 너비는 여기에 양쪽 padding과 양쪽 border를 더해요.

  `200(content) + 20 + 20(padding) + 5 + 5(border) = 250px`

  - `200`이라고 답했다면 width가 padding·border를 포함한다고 생각한 거예요. 그건 `border-box`일 때의 이야기예요.
  - `220`, `225`, `230`처럼 답했다면 padding이나 border를 한쪽만 더했을 가능성이 커요. 양쪽에 하나씩 있으니 두 번 더해야 해요.
  - `270`이라고 답했다면 margin까지 더한 거예요. margin은 테두리 바깥의 간격이라 상자의 너비에 들어가지 않아요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
