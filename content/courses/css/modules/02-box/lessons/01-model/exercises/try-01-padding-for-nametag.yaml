id: css.box.model.try-padding-for-nametag
type: web_task
difficulty: 2
usage: try
concepts:
  - { id: css.box.size, weight: 1 }
tags: [box-model, padding, content-box, web-task]
estimatedSeconds: 240
prompt: |
  위의 보라 안내선은 정확히 `260px`이에요. 아래 이름표에는 `width: 200px`과 테두리 `6px`이 이미 있어요.

  `.nametag` 규칙에 **`padding` 선언을 직접 써서**, 이름표가 테두리까지 포함해 안내선과 똑같은 `260px`로 보이게 하세요. 안쪽 여백은 네 방향 모두 같은 값으로 주세요.

  - `box-sizing`은 쓰지 말고(기본값 `content-box` 그대로), 계산으로 알맞은 `padding` 값을 구하세요.
  - `width`와 테두리는 그대로 두세요.
spec:
  focus: css
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>이름표 여백 맞추기</title>
              <style>
                .ruler {
                  width: 260px;
                  height: 8px;
                  background: #7c3aed;
                }
                .nametag {
                  width: 200px;
                  border: 6px solid #0f766e;
                  background: #ccfbf1;
                  /* 여기에 padding을 써서 보이는 너비가 260px이 되게 하세요 */
                }
              </style>
            </head>
            <body>
              <div class="ruler"></div>
              <div class="nametag">안녕하세요, 저는 민지예요</div>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>이름표 여백 맞추기</title>
              <style>
                .ruler {
                  width: 260px;
                  height: 8px;
                  background: #7c3aed;
                }
                .nametag {
                  width: 200px;
                  border: 6px solid #0f766e;
                  background: #ccfbf1;
                  padding: 24px;
                }
              </style>
            </head>
            <body>
              <div class="ruler"></div>
              <div class="nametag">안녕하세요, 저는 민지예요</div>
            </body>
          </html>
  checks:
    - kind: layout
      id: same-as-ruler
      description: 이름표의 너비(테두리까지)가 보라 안내선과 같은 260px이어야 합니다.
      requirement: 안내선과 같은 너비
      visible: true
      a: .nametag
      container: .ruler
      relation: fills-width
      tolerancePx: 1
      misconceptionIfFail: css.mc.width-includes-padding
    - kind: css
      id: padding-all-sides
      description: 안쪽 여백(padding)이 네 방향 모두 같은 값이어야 합니다.
      requirement: 네 방향 같은 여백
      visible: true
      selector: .nametag
      expect:
        computed:
          padding-top: { px: { value: 24 } }
          padding-right: { px: { value: 24 } }
          padding-bottom: { px: { value: 24 } }
          padding-left: { px: { value: 24 } }
    - kind: css
      id: content-box-kept
      description: box-sizing은 기본값 content-box 그대로여야 합니다. padding 값을 계산해서 맞춰 보세요.
      requirement: 계산으로 맞추기
      visible: true
      selector: .nametag
      expect:
        computed:
          box-sizing: { equals: content-box }
    - kind: css
      id: width-border-kept
      description: width 200px과 테두리 6px은 그대로 있어야 합니다.
      requirement: 계산으로 맞추기
      visible: true
      selector: .nametag
      expect:
        computed:
          width: { px: { value: 200 } }
          border-left-width: { px: { value: 6 } }
          border-right-width: { px: { value: 6 } }
misconceptions: [css.mc.width-includes-padding]
hints:
  - content-box에서 보이는 너비는 width에 무엇과 무엇을 더한 값이었나요?
  - 보이는 너비 = width + padding × 2 + border × 2예요. 260에서 width와 양쪽 border를 빼면 양쪽 padding을 합친 값이 나와요.
  - "260 − 200 − 6 − 6 = 48이고, 양쪽으로 나누면 24예요. `.nametag` 규칙에 `padding: 24px;`을 써요."
explanation: |
  알맞은 값은 **`padding: 24px;`** 이에요.

  ```text
  보이는 너비 = width + (padding × 2) + (border × 2)
  260 = 200 + padding × 2 + 12
  padding × 2 = 48
  padding = 24
  ```

  기본값인 content-box에서 `width`는 content 영역만의 너비라서, padding과 border는 그 바깥 양쪽에 더해져요. 그래서 남는 48px을 왼쪽과 오른쪽 padding이 **반씩** 나눠 가져요. 48px을 그대로 `padding: 48px`로 쓰면 양쪽에 붙어 308px로 보여요.
