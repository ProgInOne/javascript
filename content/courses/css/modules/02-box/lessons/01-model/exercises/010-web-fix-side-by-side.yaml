id: css.box.model.web-fix-side-by-side
type: web_task
difficulty: 3
concepts:
  - { id: css.box.box-sizing, weight: 1 }
  - { id: css.box.size, weight: 0.5 }
tags: [box-sizing, border-box, debugging, web-task]
estimatedSeconds: 300
prompt: |
  카드 두 개를 한 줄에 나란히 놓으려고 둘 다 `width: 50%`를 줬어요. 그런데 오른쪽 카드가 아래 줄로 떨어졌어요.

  카드의 `width`와 `padding`은 바꾸지 말고, **`box-sizing`을 이용해** 두 카드가 한 줄에 나란히 놓이게 고치세요.

  (`.row`의 `display: flex; flex-wrap: wrap;`은 "자식들을 가로로 나란히 놓되, 자리가 모자라면 다음 줄로 넘긴다"는 뜻이에요. 레이아웃 모듈에서 배우니 지금은 그대로 두세요.)
spec:
  focus: css
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>나란히 놓인 카드</title>
              <style>
                .row {
                  display: flex;
                  flex-wrap: wrap;
                  width: 600px;
                  background: #e5e7eb;
                }
                .card {
                  width: 50%;
                  padding: 20px;
                  border: 2px solid #1f2937;
                  background: white;
                }
              </style>
            </head>
            <body>
              <div class="row">
                <div class="card" id="left">왼쪽 카드</div>
                <div class="card" id="right">오른쪽 카드</div>
              </div>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>나란히 놓인 카드</title>
              <style>
                .row {
                  display: flex;
                  flex-wrap: wrap;
                  width: 600px;
                  background: #e5e7eb;
                }
                .card {
                  box-sizing: border-box;
                  width: 50%;
                  padding: 20px;
                  border: 2px solid #1f2937;
                  background: white;
                }
              </style>
            </head>
            <body>
              <div class="row">
                <div class="card" id="left">왼쪽 카드</div>
                <div class="card" id="right">오른쪽 카드</div>
              </div>
            </body>
          </html>
  checks:
    - kind: layout
      id: side-by-side
      description: 오른쪽 카드가 왼쪽 카드의 오른쪽, 같은 줄에 있어야 합니다.
      requirement: 두 카드가 한 줄에
      visible: true
      a: "#right"
      b: "#left"
      relation: right-of
      tolerancePx: 1
      misconceptionIfFail: css.mc.width-includes-padding
    - kind: css
      id: uses-border-box
      description: 카드에 box-sizing으로 해결해야 합니다.
      requirement: box-sizing 사용
      visible: true
      selector: .card
      all: true
      expect:
        computed:
          box-sizing: { equals: border-box }
    - kind: css
      id: size-kept
      description: 카드의 너비(50%, 300px)와 안쪽 여백 20px은 그대로여야 합니다.
      requirement: width·padding 유지
      selector: .card
      all: true
      expect:
        computed:
          width: { px: { value: 300 } }
          padding-left: { px: { value: 20 } }
misconceptions: [css.mc.width-includes-padding]
hints:
  - 카드 하나가 화면에서 실제로 몇 px을 차지하는지 계산해 보세요. `.row`의 너비는 600px이에요.
  - "카드 하나의 width는 300px(600px의 50%)인데, 기본값 `content-box`라서 padding과 border가 더해져요. 두 카드를 합치면 600px을 넘어요."
  - width가 padding과 border까지 포함한 너비를 뜻하도록 `box-sizing`의 값을 바꿔 보세요.
explanation: |
  원인은 `content-box`의 크기 계산이에요. 카드 하나가 `300(width) + 40(padding) + 4(border) = 344px`을 차지해서, 두 카드를 합치면 688px로 `.row`의 600px을 넘어요. 그래서 오른쪽 카드가 다음 줄로 넘어갔어요.

  `.card`에 `box-sizing: border-box;`를 추가하면 width 300px 안에 padding과 border가 포함돼요. 카드 하나가 정확히 300px이 되어 두 카드가 600px 한 줄에 들어가요. 대신 글자가 들어가는 content 영역이 `300 − 40 − 4 = 256px`로 줄어들어요.

  `width`를 줄이거나 padding을 없애서 한 줄에 넣을 수도 있지만, 이 문제의 요구사항은 크기를 그대로 두고 `box-sizing`으로 고치는 거예요. 실무에서도 이런 이유로 모든 요소에 `border-box`를 적용하는 경우가 많아요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
