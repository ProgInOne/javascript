id: css.basics.intro.check-declaration-symbols
type: fill_blank
difficulty: 1
usage: check
concepts:
  - { id: css.intro.rule-structure, weight: 1 }
tags: [rule, declaration, syntax]
estimatedSeconds: 50
prompt: |
  선언 하나를 쓸 때 들어가는 기호를 떠올려 보세요. 빈칸에 기호 하나씩만 쓰세요.
spec:
  mode: text
  template: |
    속성과 값 사이에 쓰는 기호: {{blank:between}}   선언이 끝났다는 표시로 맨 끝에 쓰는 기호: {{blank:end}}
  blanks:
    - id: between
      accept: [":"]
      width: 4
    - id: end
      accept: [";"]
      width: 4
hints:
  - 선언은 늘 같은 모양이에요. `속성 ? 값 ?` 자리에 들어가는 기호를 떠올려 보세요.
  - 앞 기호는 "무엇을 → 어떻게"를 이어 주고, 뒤 기호는 "이 선언은 여기까지"를 알려 줘요.
  - "`color` 다음에 오는 기호와 `navy` 다음에 오는 기호를 원리 부분의 예제 규칙에서 찾아보세요."
explanation: |
  정답은 **콜론 `:`** 과 **세미콜론 `;`** 이에요.

  선언은 `속성: 값;` 모양이에요. 콜론은 속성과 값을 이어 주고, 세미콜론은 선언 하나가 끝났다는 표시예요. 줄을 바꾸는 것만으로는 선언이 나뉘지 않아서, 세미콜론이 빠지면 다음 선언까지 하나로 읽혀 둘 다 무시돼요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
