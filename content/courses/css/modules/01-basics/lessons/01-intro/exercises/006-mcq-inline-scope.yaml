id: css.basics.intro.mcq-inline-scope
type: mcq_single
difficulty: 2
concepts:
  - { id: css.intro.linking, weight: 1 }
tags: [inline-style, style-attribute]
estimatedSeconds: 50
prompt: |
  아래 HTML을 브라우저로 열면 **빨간색으로 보이는 문단은 몇 개**인가요? (다른 CSS는 없어요.)
code: |
  <p>회의는 3시에 시작해요.</p>
  <p style="color: red;">장소가 2층으로 바뀌었어요.</p>
  <p>노트북을 챙겨 오세요.</p>
spec:
  options:
    - id: a
      text: 1개 (두 번째 문단만)
    - id: b
      text: 3개 (모든 문단)
      misconception: css.mc.inline-applies-to-all
      rationale: style 속성은 그 속성을 쓴 요소 하나에만 적용돼요.
    - id: c
      text: 2개 (두 번째와 세 번째 문단)
      rationale: style 속성은 뒤에 오는 요소에 이어지지 않아요.
    - id: d
      text: 0개 (style 속성은 head에 써야 동작한다)
      rationale: style 속성은 요소의 여는 태그에 써요. head에 쓰는 것은 style 요소예요.
  correct: a
misconceptions: [css.mc.inline-applies-to-all]
hints:
  - "`style=\"...\"`가 어디에 쓰여 있는지 보세요."
  - style 속성에는 선택자가 없어요. 그럼 이 선언은 어떤 요소에 적용될까요?
  - style 속성의 대상은 그 속성을 가진 요소 자신뿐이에요.
explanation: |
  정답은 **1개(두 번째 문단만)** 예요.

  `style` 속성(인라인 스타일)에는 선택자가 없어요. 대상은 그 속성을 쓴 요소 자신이에요. 그래서 두 번째 문단만 빨간색이에요.

  - 모든 문단을 빨갛게 하려면 `style` 요소에 `p { color: red; }`처럼 선택자로 규칙을 써야 해요.
  - style 속성은 뒤에 오는 형제 요소로 이어지지 않아요.
  - style 속성은 head가 아니라 요소의 여는 태그에 쓰고, 그대로 동작해요.
origin: authored
review: { status: draft, draftedBy: ai:claude }
