id: css.basics.intro.fill-style-element
type: fill_blank
difficulty: 1
concepts:
  - { id: css.intro.linking, weight: 1 }
  - { id: css.intro.rule-structure, weight: 0.3 }
tags: [style-element, linking]
estimatedSeconds: 60
prompt: |
  `head` 안에 제목을 남색으로 바꾸는 규칙을 써 두었는데, 규칙을 감싸는 요소가 빠져 있어요. **이 페이지 한 장에만** 적용되는 CSS를 담는 요소의 여는 태그와 닫는 태그를 빈칸에 쓰세요.
spec:
  mode: code
  lang: html
  template: |
    <!doctype html>
    <html lang="ko">
      <head>
        <meta charset="utf-8" />
        <title>동아리 소개</title>
        {{blank:open}}
          h1 {
            color: navy;
          }
        {{blank:close}}
      </head>
      <body>
        <h1>사진 동아리</h1>
        <p>매주 토요일에 출사를 나가요.</p>
      </body>
    </html>
  blanks:
    - id: open
      accept: ["<style>"]
      width: 12
    - id: close
      accept: ["</style>"]
      width: 12
  checks:
    - kind: css
      id: title-navy
      description: 제목(h1)의 글자 색이 남색이어야 합니다.
      requirement: 규칙이 적용됨
      visible: true
      selector: h1
      expect:
        computed:
          color: { color: "#000080" }
      misconceptionIfFail: css.mc.link-uses-src
misconceptions: [css.mc.link-uses-src]
hints:
  - CSS를 연결하는 방법은 외부 파일 불러오기, 페이지 안에 직접 쓰기, 요소 하나에 직접 쓰기의 세 가지예요. 이 규칙은 페이지 안에 직접 썼어요.
  - 페이지 안에 규칙을 직접 쓸 때는 `head` 안에 그 규칙을 담는 요소를 둬요. `link`는 외부 파일을 불러올 때만 써요.
  - "여는 태그는 `<style>`이고, 닫는 태그는 이름 앞에 `/`를 붙여요."
explanation: |
  정답은 **`<style>`** 과 **`</style>`** 이에요.

  ```html
  <style>
    h1 {
      color: navy;
    }
  </style>
  ```

  - `style` 요소 안에 쓴 규칙은 이 페이지 한 장에 적용돼요. 그래서 제목이 남색이 돼요.
  - `link` 요소는 `href`로 **외부 CSS 파일**을 불러올 때 쓰고, 안에 규칙을 담지 않아요(닫는 태그도 없어요).
  - 감싸는 요소가 없으면 브라우저는 규칙을 CSS로 읽지 않아요. 제목 색도 바뀌지 않아요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
