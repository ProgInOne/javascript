id: css.basics.intro.mcq-missing-semicolon
type: mcq_single
difficulty: 2
concepts:
  - { id: css.intro.rule-structure, weight: 1 }
tags: [css-rule, semicolon, debugging]
estimatedSeconds: 60
prompt: |
  아래 규칙을 적용한 문단에서 **실제로 적용되는 선언**을 바르게 고른 것은 무엇인가요?
code: |
  .tip {
    font-size: 20px;
    color: white
    background-color: teal;
  }
spec:
  options:
    - id: a
      text: "`font-size`만 적용된다"
    - id: b
      text: 세 선언이 모두 적용된다
      misconception: css.mc.semicolon-optional
      rationale: 줄을 바꾼다고 선언이 나뉘지 않아요. 세미콜론이 빠진 곳에서 두 선언이 하나로 이어져요.
    - id: c
      text: "`font-size`와 `background-color`가 적용된다"
      misconception: css.mc.semicolon-optional
      rationale: 세미콜론이 빠진 선언과 그다음 선언이 하나로 읽혀서 둘 다 무시돼요.
    - id: d
      text: 규칙 전체가 무시되어 아무것도 적용되지 않는다
      rationale: 브라우저는 규칙 전체가 아니라 이해할 수 없는 선언만 무시해요.
  correct: a
misconceptions: [css.mc.semicolon-optional]
hints:
  - 선언마다 끝에 무엇이 있어야 하는지 확인해 보세요.
  - "`color: white` 끝에 세미콜론이 없어요. 브라우저는 다음 세미콜론이 나올 때까지를 한 선언으로 읽어요."
  - "`color`의 값이 `white background-color: teal`이 된다면, 그런 색이 있을까요?"
explanation: |
  정답은 **`font-size`만 적용된다**예요.

  `color: white` 끝에 세미콜론이 없어서 브라우저는 다음 세미콜론까지를 `color: white background-color: teal`이라는 하나의 선언으로 읽어요. 이런 색 값은 없으니 이 선언이 통째로 무시되고, 그 결과 `color`와 `background-color`가 **둘 다** 적용되지 않아요.

  - "세 선언이 모두 적용된다", "`background-color`는 적용된다"는 줄바꿈이 선언을 나눈다고 생각한 경우예요.
  - 브라우저는 잘못된 선언만 무시하고 나머지는 적용하므로, 규칙 전체가 무시되지도 않아요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
