id: css.basics.intro.mcq-link-element
type: mcq_single
difficulty: 1
concepts:
  - { id: css.intro.linking, weight: 1 }
tags: [link, stylesheet]
estimatedSeconds: 45
prompt: |
  같은 폴더에 있는 `style.css` 파일을 HTML 문서에 연결하려고 해요. `head` 안에 쓸 코드로 올바른 것은 무엇인가요?
spec:
  codeOptions: true
  options:
    - id: a
      text: '<link rel="stylesheet" href="style.css">'
    - id: b
      text: '<link src="style.css">'
      misconception: css.mc.link-uses-src
      rationale: link 요소는 주소를 `src`가 아니라 `href`에 써요. 파일 종류를 알리는 `rel`도 빠졌어요.
    - id: c
      text: '<script src="style.css"></script>'
      misconception: css.mc.link-uses-src
      rationale: script 요소는 JavaScript 파일을 불러올 때 써요. CSS는 연결되지 않아요.
    - id: d
      text: '<style href="style.css"></style>'
      rationale: style 요소는 안에 CSS를 직접 쓰는 요소예요. 외부 파일을 불러오지 않아요.
  correct: a
misconceptions: [css.mc.link-uses-src]
hints:
  - 외부 CSS 파일은 "연결한다"는 뜻의 이름을 가진 요소로 이어 줘요.
  - "`link` 요소에는 파일 종류를 알리는 속성과 주소를 쓰는 속성, 두 개가 필요해요."
  - 링크(`a`)처럼 주소는 `href`에 써요. 파일 종류는 `rel`로 알려요.
explanation: |
  정답은 **`<link rel="stylesheet" href="style.css">`**예요.

  - `rel="stylesheet"`: 이 파일이 스타일시트라는 뜻이에요.
  - `href="style.css"`: 연결할 파일의 경로예요.

  `src`는 이미지나 스크립트처럼 내용을 "끼워 넣는" 요소가 쓰는 속성이라 link 요소에서는 동작하지 않아요. `script` 요소는 JavaScript용이고, `style` 요소는 안에 CSS를 직접 쓸 때 써요.
origin: authored
review: { status: draft, draftedBy: ai:claude }
