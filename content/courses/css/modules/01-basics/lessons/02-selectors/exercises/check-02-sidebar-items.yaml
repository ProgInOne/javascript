id: css.basics.selectors.check-sidebar-items
type: mcq_single
difficulty: 1
usage: check
concepts:
  - { id: css.selectors.combinators, weight: 1 }
tags: [selector, descendant, group]
estimatedSeconds: 60
prompt: |
  페이지에 목록이 여러 개 있어요. 그중 **사이드바(`class="sidebar"`) 안에 있는 목록 항목(`li`)만** 작은 글씨로 바꾸려고 해요. 알맞은 선택자는 무엇인가요?
spec:
  options:
    - id: a
      text: "`.sidebar li`"
    - id: b
      text: "`.sidebar, li`"
      misconception: css.mc.descendant-vs-group
      rationale: 쉼표는 "그리고"라는 뜻이라 사이드바 전체와 페이지의 모든 li를 함께 골라요.
    - id: c
      text: "`li .sidebar`"
      rationale: 순서가 거꾸로예요. li 안에 있는 .sidebar 요소를 고르게 돼요.
    - id: d
      text: "`li`"
      rationale: 사이드바 밖의 목록 항목까지 페이지의 모든 li를 골라요.
  correct: a
misconceptions: [css.mc.descendant-vs-group]
hints:
  - "\"A 안에 있는 B\"를 고르는 선택자는 A와 B 사이에 무엇을 넣었나요?"
  - 공백은 "안에 있는", 쉼표는 "그리고"라는 뜻이에요.
  - 바깥 요소를 먼저, 안쪽 요소를 뒤에 써요.
explanation: |
  정답은 **`.sidebar li`** 예요.

  공백으로 이은 자손 선택자 `A B`는 "A 안에 있는 B"를 골라요. 바깥쪽 `.sidebar`를 먼저, 안쪽 `li`를 뒤에 써요.

  - `.sidebar, li`는 그룹 선택자라 사이드바와 모든 `li`를 **둘 다** 골라요.
  - `li .sidebar`는 순서가 뒤집혀서 "li 안의 .sidebar"가 돼요.
  - `li`만 쓰면 페이지의 모든 목록 항목이 바뀌어요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
