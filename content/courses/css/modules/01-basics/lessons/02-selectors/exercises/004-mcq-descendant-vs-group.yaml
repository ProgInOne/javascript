id: css.basics.selectors.mcq-descendant-vs-group
type: mcq_single
difficulty: 2
concepts:
  - { id: css.selectors.combinators, weight: 1 }
tags: [selector, descendant, group]
estimatedSeconds: 60
prompt: |
  아래 문서에 `nav, a { color: green; }` 규칙을 적용하면 **초록색 글자가 되는 것**을 바르게 고른 것은 무엇인가요?
code: |
  <nav>
    메뉴:
    <a href="#home">처음</a>
  </nav>
  <p>자세한 내용은 <a href="#more">여기</a>를 보세요.</p>
spec:
  options:
    - id: a
      text: "\"메뉴:\", \"처음\", \"여기\" 모두"
    - id: b
      text: nav 안의 "처음"만
      misconception: css.mc.descendant-vs-group
      rationale: "\"nav 안의 a\"는 공백을 쓴 `nav a`예요. 쉼표는 \"그리고\"라는 뜻이에요."
    - id: c
      text: "\"메뉴:\"와 \"처음\" (nav 안의 글자만)"
      rationale: 쉼표 뒤의 `a`는 nav 밖의 링크까지 페이지의 모든 a를 골라요.
    - id: d
      text: "\"처음\"과 \"여기\" (링크만)"
      rationale: 쉼표 앞의 `nav`도 따로 골라지므로 nav 안의 글자 "메뉴:"도 초록색이 돼요.
  correct: a
misconceptions: [css.mc.descendant-vs-group]
hints:
  - 선택자 사이의 기호가 공백인지 쉼표인지 보세요.
  - 쉼표로 이은 선택자는 "nav **그리고** a"라고 읽어요.
  - nav 요소 전체(안의 글자 포함)와, 페이지의 a 요소 전부가 각각 골라져요.
explanation: |
  정답은 **"메뉴:", "처음", "여기" 모두**예요.

  `nav, a`는 그룹 선택자예요. `nav`를 고르고, 따로 `a`도 모두 골라서 같은 규칙을 줘요.

  - nav가 골라지므로 nav 안의 글자 "메뉴:"가 초록색이 돼요.
  - `a`는 위치와 상관없이 모든 링크를 고르므로 "처음"과 "여기"가 초록색이 돼요.

  "nav 안의 링크만" 바꾸고 싶었다면 공백을 쓴 자손 선택자 `nav a`를 써야 해요. 공백은 "안에 있는", 쉼표는 "그리고"예요.
origin: authored
review: { status: draft, draftedBy: ai:claude }
