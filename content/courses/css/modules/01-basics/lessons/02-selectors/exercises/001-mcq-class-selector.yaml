id: css.basics.selectors.mcq-class-selector
type: mcq_single
difficulty: 1
concepts:
  - { id: css.selectors.basic, weight: 1 }
tags: [selector, class]
estimatedSeconds: 40
prompt: |
  아래 문단만 골라 글자를 빨간색으로 바꾸려고 해요. 빈칸 `???`에 들어갈 선택자로 알맞은 것은 무엇인가요?
code: |
  <!-- HTML -->
  <p class="price">12,000원</p>

  /* CSS */
  ??? { color: red; }
spec:
  codeOptions: true
  options:
    - id: a
      text: .price
    - id: b
      text: "#price"
      misconception: css.mc.selector-symbol-mixup
      rationale: "`#`은 id 속성으로 고르는 ID 선택자예요. 이 문단에는 id가 없어요."
    - id: c
      text: price
      misconception: css.mc.selector-symbol-mixup
      rationale: 기호 없이 쓰면 `<price>`라는 요소를 찾는 타입 선택자가 돼요.
    - id: d
      text: p.class
      rationale: "`p.class`는 \"class라는 이름의 클래스를 가진 p\"라는 뜻이에요. 클래스 이름은 price예요."
  correct: a
misconceptions: [css.mc.selector-symbol-mixup]
hints:
  - "`price`라는 이름이 HTML의 어느 속성에 들어 있는지 보세요."
  - class 속성의 값으로 고르는 선택자는 이름 앞에 기호 하나를 붙여요.
  - 클래스는 점, ID는 샵이에요.
explanation: |
  정답은 **`.price`**예요. 클래스 선택자는 클래스 이름 앞에 점을 붙여요.

  - `#price`는 `id="price"`인 요소를 찾는 ID 선택자예요.
  - `price`는 기호가 없어서 `<price>` 요소를 찾는 타입 선택자가 돼요. 그런 요소는 없어요.
  - `p.class`는 `class="class"`인 p를 찾아요. 점 뒤에는 실제 클래스 이름을 써요. (`p.price`라면 정답처럼 동작해요.)
origin: authored
review: { status: draft, draftedBy: ai:claude }
