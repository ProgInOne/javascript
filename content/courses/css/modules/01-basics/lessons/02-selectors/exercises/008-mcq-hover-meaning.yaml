id: css.basics.selectors.mcq-hover-meaning
type: mcq_single
difficulty: 1
concepts:
  - { id: css.selectors.pseudo-class, weight: 1 }
tags: [selector, pseudo-class, hover]
estimatedSeconds: 45
prompt: |
  아래 규칙이 버튼에 적용되려면 무엇이 필요한가요?
code: |
  .button:hover {
    background-color: navy;
  }
spec:
  options:
    - id: a
      text: "`class=\"button\"`인 요소 위에 마우스 포인터를 올리면 된다"
    - id: b
      text: 버튼에 `class="button hover"`처럼 hover 클래스도 붙여야 한다
      misconception: css.mc.pseudo-class-is-class
      rationale: 콜론으로 시작하는 의사 클래스는 HTML의 class와 상관없어요. 브라우저가 상태를 보고 스스로 골라요.
    - id: c
      text: 버튼을 클릭해서 다른 페이지로 이동해야 한다
      rationale: hover는 "마우스를 올려 둔 상태"예요. 클릭이나 이동은 필요 없어요.
    - id: d
      text: 버튼에 `id="hover"`를 붙여야 한다
      misconception: css.mc.pseudo-class-is-class
      rationale: id로 고르는 선택자는 `#`으로 시작해요. `:hover`는 상태를 나타내요.
  correct: a
misconceptions: [css.mc.pseudo-class-is-class]
hints:
  - 이름 앞의 기호가 점(`.`)인지 콜론(`:`)인지 보세요.
  - 콜론으로 시작하는 것은 의사 클래스예요. 요소의 "상태"나 "위치"를 나타내요.
  - hover는 "위에 떠 있다"는 뜻이에요. 무엇이 버튼 위에 떠 있을까요?
explanation: |
  정답은 **마우스 포인터를 올리면 된다**예요.

  `:hover`는 의사 클래스라서 HTML에 아무것도 붙이지 않아도 돼요. 브라우저가 "지금 마우스가 이 요소 위에 있다"는 상태를 보고 규칙을 적용하고, 마우스를 치우면 원래 모양으로 돌아가요.

  - `class="hover"`나 `id="hover"`는 필요 없어요. 점은 클래스, 샵은 ID, 콜론은 의사 클래스예요.
  - 클릭이나 페이지 이동과도 상관없어요.
origin: authored
