id: css.basics.cascade.fill-inherited-props
type: fill_blank
difficulty: 2
concepts:
  - { id: css.cascade.inheritance, weight: 1 }
tags: [cascade, inheritance]
estimatedSeconds: 90
prompt: |
  아래 코드에서 상자 **안쪽의 문단(`p`)** 에 실제로 적용되는 값을 빈칸에 쓰세요. `p`에 해당하는 규칙은 하나도 없어요(브라우저 기본 스타일은 무시하세요). 색은 이름으로, 길이는 px 값으로 쓰세요.
code: |
  <style>
    .box {
      color: green;
      border: 2px solid red;
      padding: 10px;
    }
  </style>
  <div class="box">
    <p>오늘은 비가 와요.</p>
  </div>
spec:
  mode: text
  template: |
    p의 글자 색: {{blank:color}}
    p의 테두리 두께: {{blank:border}}
    p의 안쪽 여백(padding): {{blank:pad}}
  blanks:
    - id: color
      accept: ["green"]
      caseSensitive: false
      width: 10
    - id: border
      accept: ["0", "0px", "없음"]
      acceptRegex: "0 ?(?:px)?"
      caseSensitive: false
      width: 8
      misconceptionMap:
        "2px": css.mc.all-props-inherit
        "2": css.mc.all-props-inherit
    - id: pad
      accept: ["0", "0px"]
      acceptRegex: "0 ?(?:px)?"
      caseSensitive: false
      width: 8
      misconceptionMap:
        "10px": css.mc.all-props-inherit
        "10": css.mc.all-props-inherit
misconceptions: [css.mc.all-props-inherit]
hints:
  - "`p`에는 규칙이 없으니, 값이 있다면 부모(`.box`)에게서 물려받은 것뿐이에요. 어떤 속성이 물려받아질까요?"
  - 글자 관련 속성은 상속되고, 상자 관련 속성은 상속되지 않아요.
  - "`color`는 글자 속성, `border`와 `padding`은 상자 속성이에요. 상속되지 않는 속성은 기본값(테두리 없음, 여백 0)이에요."
explanation: |
  정답은 **글자 색 `green`, 테두리 두께 `0`, 안쪽 여백 `0`** 이에요.

  - `color`는 글자 관련 속성이라 **상속돼요**. `p`에 규칙이 없어도 부모 `.box`의 `green`을 물려받아요.
  - `border`와 `padding`은 상자 관련 속성이라 **상속되지 않아요**. 테두리와 여백은 바깥 상자 `.box`에만 있고, 안쪽 `p`는 기본값(테두리 없음, 여백 0)이에요.

  상자 속성까지 상속된다면 안쪽 요소마다 빨간 테두리가 겹겹이 생길 거예요. 그래서 상자 속성은 물려받지 않도록 되어 있어요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
