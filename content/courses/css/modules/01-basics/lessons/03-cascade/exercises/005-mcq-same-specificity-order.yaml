id: css.basics.cascade.mcq-same-specificity-order
type: mcq_single
difficulty: 1
concepts:
  - { id: css.cascade.order, weight: 1 }
tags: [cascade, order]
estimatedSeconds: 40
prompt: |
  아래 CSS를 적용하면 `<h2 class="title">`의 글자 크기는 몇 px인가요?
code: |
  .title {
    font-size: 24px;
  }
  .title {
    font-size: 32px;
  }
spec:
  options:
    - id: a
      text: 32px
    - id: b
      text: 24px
      rationale: 두 규칙의 명시도가 같으면 먼저 쓴 쪽이 아니라 나중에 쓴 쪽이 이겨요.
    - id: c
      text: 56px
      rationale: 겹치는 값은 더해지지 않아요. 이긴 규칙 하나의 값만 쓰여요.
    - id: d
      text: 규칙이 충돌해서 두 값 모두 무시된다
      rationale: 충돌은 오류가 아니에요. 캐스케이드 규칙으로 이기는 값이 정해져요.
  correct: a
hints:
  - 두 선택자가 완전히 같아요. 명시도는 어떤가요?
  - 명시도가 같을 때 승부를 가르는 기준은 무엇이었나요?
  - CSS에서 더 아래에 있는 규칙을 보세요.
explanation: |
  정답은 **32px**이에요.

  두 규칙 모두 `.title` (0, 1, 0)이라 명시도가 같아요. 명시도가 같으면 CSS에서 나중에 쓴 규칙이 이기므로 32px이 적용돼요.

  - **24px**: 먼저 쓴 규칙이 이긴다고 생각한 경우예요.
  - **56px**: CSS는 값을 더하지 않아요.
  - **둘 다 무시**: 같은 속성이 여러 번 나오는 것은 흔한 일이고, 그때 캐스케이드가 하나를 골라요.
