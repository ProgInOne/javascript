id: html.semantics.landmarks.multi-article-candidates
type: mcq_multi
difficulty: 3
concepts:
  - { id: html.semantics.sectioning, weight: 1 }
  - { id: html.semantics.div-vs-semantic, weight: 0.3 }
tags: [semantic, article]
estimatedSeconds: 80
prompt: |
  요리 블로그 페이지에 아래 묶음들이 있어요. 이 중 **`article`로 감싸기에 알맞은 것**을 모두 고르세요.
spec:
  options:
    - id: a
      text: 레시피 글 한 편 (제목, 재료, 만드는 법)
    - id: b
      text: 레시피 글 아래에 달린 방문자 댓글 하나
    - id: c
      text: 사이트 맨 위의 "레시피 · 소개 · 문의" 메뉴 링크 묶음
      rationale: 사이트의 주요 메뉴는 nav예요. 독립된 글이 아니에요.
    - id: d
      text: 카드 세 개를 가로로 나란히 놓으려고 감싼 상자
      misconception: html.mc.div-is-wrong
      rationale: 배치만을 위한 묶음에는 뜻이 없어요. 이런 묶음에는 div가 맞아요.
    - id: e
      text: 레시피 글 안의 "재료" 소제목과 재료 목록
      misconception: html.mc.section-article-same
      rationale: 재료 부분만 떼어 내면 무슨 요리의 재료인지 알 수 없어요. 글 안의 주제별 구역이라 section이 어울려요.
  correct: [a, b]
misconceptions: [html.mc.section-article-same]
hints:
  - 각 묶음을 잘라서 다른 사이트에 붙였을 때 혼자서도 뜻이 통하는지 생각해 보세요.
  - 댓글 하나는 누가 무엇에 대해 쓴 글인지 혼자서도 읽혀요.
  - 메뉴는 nav, 배치용 상자는 div, 글 안의 소제목 구역은 section이에요.
explanation: |
  정답은 **레시피 글 한 편**과 **댓글 하나**예요.

  둘 다 따로 떼어 내도 뜻이 통하는 **독립된 글**이에요. 댓글은 레시피 글의 article 안에 또 article로 넣을 수 있어요.

  - 메뉴 링크 묶음: 사이트의 주요 메뉴라 `nav`예요.
  - 카드를 나란히 놓으려고 감싼 상자: 뜻 없이 배치만을 위한 묶음이라 `div`가 맞아요. div를 피하려고 article을 쓰면 화면 낭독기에 엉뚱한 글이 생겨요.
  - "재료" 부분: 레시피 안의 주제별 구역이라 `section`이 어울려요. 혼자 떼어 내면 무슨 요리인지 알 수 없어요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
