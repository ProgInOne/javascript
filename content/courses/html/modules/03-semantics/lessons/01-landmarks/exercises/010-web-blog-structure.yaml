id: html.semantics.landmarks.web-blog-structure
type: web_task
difficulty: 4
concepts:
  - { id: html.semantics.div-vs-semantic, weight: 1 }
  - { id: html.semantics.sectioning, weight: 0.5 }
  - { id: html.semantics.page-landmarks, weight: 0.3 }
tags: [semantic, div, article, main, web-task]
estimatedSeconds: 420
prompt: |
  블로그 첫 페이지가 모두 `div`로 되어 있어요. 각 `div`가 어떤 묶음인지 판단해서, **뜻이 있는 묶음만** 알맞은 시맨틱 요소로 바꾸세요.

  - `div class="page"`: 이 페이지의 핵심 내용 전체예요.
  - `div class="post"` 두 개: 각각 혼자서도 뜻이 통하는 글 한 편이에요.
  - `div class="post-row"`: 두 글을 CSS로 가로로 나란히 놓으려고 감싼 상자예요.

  뜻이 없는 묶음은 `div` 그대로 두세요. `class` 속성은 모두 그대로 두세요(CSS가 class로 모양을 정하고 있어요).
spec:
  focus: html
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>오늘의 기록</title>
              <style>
                .post-row {
                  display: flex;
                  gap: 12px;
                }
                .post {
                  border: 1px solid #9ca3af;
                  padding: 8px;
                }
              </style>
            </head>
            <body>
              <div class="page">
                <h1>오늘의 기록</h1>
                <div class="post-row">
                  <div class="post">
                    <h2>첫 화분</h2>
                    <p>방울토마토 씨앗을 심었어요.</p>
                  </div>
                  <div class="post">
                    <h2>싹이 났어요</h2>
                    <p>일주일 만에 초록 싹이 올라왔어요.</p>
                  </div>
                </div>
              </div>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>오늘의 기록</title>
              <style>
                .post-row {
                  display: flex;
                  gap: 12px;
                }
                .post {
                  border: 1px solid #9ca3af;
                  padding: 8px;
                }
              </style>
            </head>
            <body>
              <main class="page">
                <h1>오늘의 기록</h1>
                <div class="post-row">
                  <article class="post">
                    <h2>첫 화분</h2>
                    <p>방울토마토 씨앗을 심었어요.</p>
                  </article>
                  <article class="post">
                    <h2>싹이 났어요</h2>
                    <p>일주일 만에 초록 싹이 올라왔어요.</p>
                  </article>
                </div>
              </main>
            </body>
          </html>
  checks:
    - kind: dom
      id: page-main
      description: 페이지의 핵심 내용 전체(class="page")가 main 요소여야 합니다.
      requirement: 핵심 내용
      visible: true
      selector: main.page
      expect:
        count: 1
    - kind: dom
      id: posts-article
      description: 글 두 편(class="post")이 각각 독립된 글을 뜻하는 요소여야 합니다.
      requirement: 독립된 글
      visible: true
      selector: article.post
      expect:
        count: 2
      misconceptionIfFail: html.mc.section-article-same
    - kind: dom
      id: row-stays-div
      description: 배치만을 위한 상자(class="post-row")는 뜻이 없는 묶음 요소 그대로여야 합니다.
      requirement: 배치용 상자
      visible: true
      selector: div.post-row
      expect:
        count: 1
      misconceptionIfFail: html.mc.div-is-wrong
    - kind: dom
      id: structure
      description: 글 두 편은 배치용 상자 안에, 배치용 상자는 핵심 내용 안에 있어야 합니다.
      requirement: 구조 유지
      selector: main > div.post-row > article
      expect:
        count: 2
    - kind: layout
      id: still-side-by-side
      description: 두 글은 여전히 가로로 나란히 놓여 있어야 합니다.
      requirement: 구조 유지
      a: ".post:nth-child(2)"
      b: ".post:nth-child(1)"
      relation: right-of
      tolerancePx: 1
misconceptions: [html.mc.div-is-wrong, html.mc.section-article-same]
hints:
  - 세 종류의 묶음마다 "이 묶음에 붙일 이름(핵심 내용, 독립된 글)이 있는가?"를 물어보세요.
  - 핵심 내용 전체는 `main`, 혼자서도 뜻이 통하는 글은 `article`이에요. 배치만을 위한 상자에는 이름이 없어요.
  - "`div class=\"page\"`는 `main class=\"page\"`로, 두 `div class=\"post\"`는 `article class=\"post\"`로 바꾸고, `post-row`는 그대로 둬요. 닫는 태그도 짝을 맞추세요."
explanation: |
  예시 정답은 이래요.

  ```html
  <main class="page">
    <h1>오늘의 기록</h1>
    <div class="post-row">
      <article class="post">...</article>
      <article class="post">...</article>
    </div>
  </main>
  ```

  - **`page` → `main`**: 이 페이지의 핵심 내용 전체예요.
  - **`post` → `article`**: 글 한 편은 따로 떼어 내도 뜻이 통하는 독립된 글이에요. `section`은 문서 안의 주제별 구역이라 맞지 않아요.
  - **`post-row`는 `div` 그대로**: 두 글을 가로로 놓으려는 배치용 상자일 뿐 뜻이 없어요. 이 상자를 `section` 등으로 바꾸면 화면 낭독기에 이름 없는 구역이 생겨요. div를 없애야 좋은 HTML이 되는 것이 아니에요.

  `class`를 그대로 두었기 때문에 CSS도 그대로 적용되어, 화면은 바꾸기 전과 똑같아요. 시맨틱 요소는 뜻만 바꾸고 모양은 바꾸지 않아요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
