id: html.semantics.landmarks.fill-faq-section
type: fill_blank
difficulty: 2
concepts:
  - { id: html.semantics.sectioning, weight: 1 }
  - { id: html.text.headings, weight: 0.3 }
tags: [semantic, section]
estimatedSeconds: 70
prompt: |
  가게 소개 페이지의 본문 안에 "자주 묻는 질문"이라는 소제목이 붙은 **주제별 구역**이 있어요. 이 구역만 따로 떼어 내면 어느 가게의 질문인지 알 수 없어요.

  두 빈칸에 같은 요소 이름을 채워, 이 구역을 알맞은 시맨틱 요소로 감싸세요. (요소 이름만 쓰세요. 예: `div`)
spec:
  mode: code
  lang: html
  template: |
    <main>
      <h1>동네 꽃집</h1>
      <p>계절 꽃으로 꽃다발을 만들어요.</p>
      <{{blank:open}}>
        <h2>자주 묻는 질문</h2>
        <p>당일 배달이 되나요? 오후 3시 전 주문은 당일에 배달해요.</p>
      </{{blank:close}}>
    </main>
  blanks:
    - id: open
      accept: ["section"]
      width: 10
      misconceptionMap:
        "article": html.mc.section-article-same
    - id: close
      accept: ["section"]
      width: 10
      misconceptionMap:
        "article": html.mc.section-article-same
  checks:
    - kind: dom
      id: faq-section
      description: "\"자주 묻는 질문\" 소제목이 있는 구역이 main 안의 주제별 구역 요소여야 합니다."
      requirement: 주제별 구역
      visible: true
      selector: main > section > h2
      expect:
        count: 1
        text: { equals: 자주 묻는 질문 }
      misconceptionIfFail: html.mc.section-article-same
misconceptions: [html.mc.section-article-same]
hints:
  - 이 묶음은 혼자서도 뜻이 통하는 독립된 글일까요, 한 문서 안의 주제별 구역일까요?
  - 소제목이 붙는 주제별 구역을 뜻하는 요소가 있어요.
  - "\"자주 묻는 질문\"처럼 문서 안에서 주제별로 나눈 구역은 article이 아니라 그 짝이 되는 요소예요."
explanation: |
  정답은 두 빈칸 모두 **`section`**이에요.

  ```html
  <section>
    <h2>자주 묻는 질문</h2>
    <p>...</p>
  </section>
  ```

  "자주 묻는 질문"은 가게 소개 페이지 안에서 주제별로 나눈 구역이에요. 따로 떼어 내면 어느 가게의 이야기인지 알 수 없으니 독립된 글(`article`)이 아니라 `section`이 맞아요. section은 보통 이렇게 소제목(`h2`)을 함께 둬요.

  `div`도 브라우저에서는 똑같이 보이지만, "주제별 구역"이라는 뜻이 사라져요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
