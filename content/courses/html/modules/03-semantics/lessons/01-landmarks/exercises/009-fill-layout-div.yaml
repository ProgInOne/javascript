id: html.semantics.landmarks.fill-layout-div
type: fill_blank
difficulty: 2
concepts:
  - { id: html.semantics.div-vs-semantic, weight: 1 }
  - { id: html.semantics.sectioning, weight: 0.3 }
tags: [semantic, div]
estimatedSeconds: 60
prompt: |
  사진 일기 페이지예요. 글 두 편(`article`)을 CSS로 가로로 나란히 놓으려고 상자 하나로 감쌌어요. 이 상자에는 머리말, 주제별 구역, 독립된 글 같은 뜻이 없고, **배치만을 위한 묶음**이에요.

  두 빈칸에 같은 요소 이름을 채우세요. (요소 이름만 쓰세요.)
spec:
  mode: code
  lang: html
  template: |
    <style>
      .gallery { display: flex; gap: 12px; }
    </style>
    <main>
      <h1>여름 사진 일기</h1>
      <{{blank:open}} class="gallery">
        <article>
          <h2>바다</h2>
          <p>파도가 높았어요.</p>
        </article>
        <article>
          <h2>계곡</h2>
          <p>물이 차가웠어요.</p>
        </article>
      </{{blank:close}}>
    </main>
  blanks:
    - id: open
      accept: ["div"]
      width: 8
      misconceptionMap:
        "section": html.mc.div-is-wrong
        "article": html.mc.div-is-wrong
    - id: close
      accept: ["div"]
      width: 8
      misconceptionMap:
        "section": html.mc.div-is-wrong
        "article": html.mc.div-is-wrong
  checks:
    - kind: dom
      id: layout-box
      description: 배치만을 위한 상자(class="gallery")가 뜻이 없는 묶음 요소이고, 글 두 편이 그 바로 안에 있어야 합니다.
      requirement: 배치용 상자
      visible: true
      selector: main > div.gallery > article
      expect:
        count: 2
      misconceptionIfFail: html.mc.div-is-wrong
misconceptions: [html.mc.div-is-wrong]
hints:
  - 이 상자에 붙일 이름(머리말, 주제별 구역, 독립된 글)이 있나요?
  - 뜻이 있는 묶음에는 시맨틱 요소를 쓰고, 뜻 없이 모양이나 배치 때문에 묶을 때는 다른 요소를 써요.
  - 뜻이 없는 묶음 요소는 시맨틱 요소가 생기기 전부터 있던, 세 글자 이름의 요소예요.
explanation: |
  정답은 두 빈칸 모두 **`div`**예요.

  ```html
  <div class="gallery">
    <article>...</article>
    <article>...</article>
  </div>
  ```

  이 상자는 글 두 편을 가로로 놓기 위한(CSS의 `display: flex`) 배치용 묶음일 뿐 뜻이 없어요. 이런 묶음에는 `div`가 맞아요.

  - `section`으로 감싸면 "주제별 구역"이라는 틀린 뜻이 붙어요. 이 상자에는 소제목도 없어요.
  - `article`로 감싸면 글 두 편을 담은 또 하나의 "독립된 글"이라는 틀린 뜻이 붙어요. 이 상자는 떼어 내서 따로 읽을 글이 아니에요.

  div는 낡은 요소가 아니라, 뜻 없는 묶음을 위해 지금도 가장 많이 쓰는 요소예요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
