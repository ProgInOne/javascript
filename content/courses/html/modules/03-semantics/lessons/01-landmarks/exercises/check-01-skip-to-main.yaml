id: html.semantics.landmarks.check-skip-to-main
type: mcq_single
difficulty: 1
usage: check
concepts:
  - { id: html.semantics.page-landmarks, weight: 1 }
tags: [landmark, main, screen-reader]
estimatedSeconds: 45
prompt: |
  화면 낭독기 사용자가 날씨 사이트에서 메뉴와 로고를 건너뛰고 **"본문으로 바로 가기"**를 골랐어요. 오늘의 날씨 내용이 들어 있는 곳으로 가려면, 그 내용은 어떤 요소 안에 있어야 하나요?
spec:
  options:
    - id: a
      text: "`main`"
    - id: b
      text: "`header`"
      rationale: header는 사이트 이름이나 로고 같은 머리말 구역이에요. 사용자가 건너뛰려던 곳이에요.
    - id: c
      text: "`nav`"
      rationale: nav는 다른 페이지로 가는 주요 메뉴예요. 이 페이지의 핵심 내용이 아니에요.
    - id: d
      text: "`footer`"
      rationale: footer는 연락처나 저작권 같은 꼬리말이에요.
  correct: a
hints:
  - 페이지의 큰 구역 네 가지(머리말, 주요 메뉴, 핵심 내용, 꼬리말)를 떠올려 보세요.
  - 페이지마다 달라지는 핵심 내용이 들어가는 구역은 어디인가요?
  - 이 요소는 한 페이지에 하나만 써요. 바로 가기로 갈 곳이 하나여야 하니까요.
explanation: |
  정답은 **`main`**이에요.

  `main`은 이 페이지의 **핵심 내용**이 들어가는 랜드마크예요. 화면 낭독기는 `main`을 "본문"으로 알려 줘서, 사용자가 머리말과 메뉴를 건너뛰고 바로 갈 수 있어요. 갈 곳이 하나여야 하므로 `main`은 한 페이지에 하나만 써요.
origin: authored
review:
