id: html.semantics.review.mcq-profile-photo
type: mcq_single
difficulty: 2
concepts:
  - { id: html.content.images, weight: 1 }
tags: [img, alt, profile]
estimatedSeconds: 60
usage: assessment
prompt: |
  프로필 페이지 맨 위에 서윤이의 얼굴 사진(`seoyun.jpg`)을 넣으려고 해요. 화면 낭독기 사용자도 어떤 사진인지 알 수 있게, 가장 알맞게 쓴 코드는 무엇인가요?
spec:
  options:
    - id: a
      text: '`<img src="seoyun.jpg" alt="종이 시계를 들고 웃고 있는 한서윤의 얼굴 사진">`'
    - id: b
      text: '`<img src="seoyun.jpg">`'
      misconception: html.mc.alt-optional
      rationale: alt가 없으면 그림을 볼 수 없는 사람에게 사진의 내용이 전해지지 않아요.
    - id: c
      text: '`<img src="seoyun.jpg">한서윤의 얼굴 사진</img>`'
      misconception: html.mc.img-has-content
      rationale: img에는 닫는 태그가 없어서, 사이에 쓴 글자는 그림 옆에 그냥 글자로 보여요.
    - id: d
      text: '`<img src="seoyun.jpg" alt="seoyun.jpg">`'
      rationale: 파일 이름은 사진에 무엇이 담겼는지 알려 주지 않아요.
  correct: a
misconceptions: [html.mc.alt-optional, html.mc.img-has-content]
hints:
  - 그림을 볼 수 없는 사람에게 그림의 내용을 전하는 속성은 무엇이었나요?
  - "`img`는 닫는 태그가 없는 빈 요소예요. 설명은 속성으로 써요."
  - 그 속성의 값만 읽어도 사진에 누가, 어떤 모습으로 있는지 알 수 있어야 해요.
explanation: |
  정답은 **`<img src="seoyun.jpg" alt="종이 시계를 들고 웃고 있는 한서윤의 얼굴 사진">`**이에요.

  얼굴 사진은 페이지에서 뜻이 있는 그림이라, 사진의 내용을 설명하는 `alt`를 써야 해요. 화면 낭독기는 alt를 읽어 주고, 그림 파일이 열리지 않을 때도 alt 글자가 대신 보여요.

  - `alt` 없이 쓴 코드: alt는 장식용 선택 속성이 아니에요. 없으면 사진의 내용이 전해지지 않아요.
  - 태그 사이에 설명을 쓴 코드: `img`는 내용이 없는 빈 요소라 닫는 태그를 쓰지 않아요. 사이의 글자는 설명이 되지 못하고 그림 옆에 글자로 보일 뿐이에요.
  - `alt="seoyun.jpg"`: alt는 있지만 파일 이름이라 사진에 무엇이 담겼는지 알 수 없어요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
