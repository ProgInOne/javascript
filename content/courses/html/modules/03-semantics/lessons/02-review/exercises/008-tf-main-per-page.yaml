id: html.semantics.review.tf-main-per-page
type: true_false
difficulty: 2
concepts:
  - { id: html.semantics.page-landmarks, weight: 1 }
tags: [semantic, main, profile]
estimatedSeconds: 70
usage: assessment
prompt: |
  서윤이가 프로필 사이트를 `index.html`(자기소개 페이지)과 `works.html`(작품 모음 페이지) 두 파일로 나눴어요. 다음 설명이 맞는지 고르고, 그렇게 판단한 이유도 고르세요.
spec:
  statement: "`index.html`과 `works.html`에 각각 `main`을 하나씩 쓰는 것은 올바르다."
  answer: true
  requireReason: true
  reasons:
    - id: r1
      text: main은 문서(페이지) 하나마다 그 페이지의 핵심 내용 하나를 가리킨다
      correct: true
    - id: r2
      text: main은 많이 쓸수록 화면 낭독기가 본문을 더 잘 찾으므로, 페이지마다 여러 개 써도 좋다
      misconception: html.mc.many-mains
    - id: r3
      text: main은 사이트 전체에 하나뿐이어야 하지만, 파일이 다르면 검사하지 않으므로 괜찮다
hints:
  - main이 "하나"여야 하는 범위는 사이트 전체일까요, 페이지 하나일까요?
  - "\"본문으로 바로 가기\"는 지금 열려 있는 페이지 안에서 이동하는 기능이에요."
  - 두 파일은 서로 다른 페이지이고, 각 페이지에는 저마다의 핵심 내용이 있어요.
explanation: |
  정답은 **참**, 이유는 **main은 문서(페이지) 하나마다 그 페이지의 핵심 내용 하나를 가리킨다**예요.

  `index.html`과 `works.html`은 서로 다른 페이지예요. 자기소개 페이지의 핵심 내용과 작품 모음 페이지의 핵심 내용이 따로 있으니, 각 페이지에 `main`을 하나씩 쓰는 것이 맞아요. "한 페이지에 하나"라는 규칙은 지금 열린 페이지 안에서 "본문으로 바로 가기"가 갈 곳이 하나여야 하기 때문이에요.

  - "많이 쓸수록 좋다"는 이유는 틀렸어요. 한 페이지에 main이 여러 개면 바로 가기가 어디로 가야 할지 알 수 없어요. 본문 안의 여러 구역은 section이나 article로 나눠요.
  - "사이트 전체에 하나뿐인데 검사하지 않아서 괜찮다"는 이유도 틀렸어요. 규칙의 범위가 처음부터 페이지 하나이고, 두 번째 파일의 main은 규칙을 어긴 것이 아니에요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
