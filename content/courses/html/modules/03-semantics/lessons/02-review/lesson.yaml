id: html.semantics.review
title: "단원 평가: 프로필 페이지 만들기"
summary: HTML 핵심 과정에서 배운 시맨틱 구조, 제목 단계, 링크와 그림을 모아 프로필 페이지를 만들며 이해도를 확인합니다.
kind: assessment
importance: standard
estimatedMinutes: { read: 2, practice: 25 }
concepts:
  reviewed:
    - html.semantics.page-landmarks
    - html.semantics.sectioning
    - html.semantics.div-vs-semantic
    - html.text.headings
    - html.content.images
    - html.content.links
objectives:
  - 페이지의 큰 구역을 header·nav·main·footer로, main 안을 section·article로 나눌 수 있다.
  - 뜻이 있는 묶음과 배치만을 위한 묶음을 구분해 시맨틱 요소와 div를 고를 수 있다.
  - 제목 단계, 링크, 그림 설명(alt)이 들어간 프로필 페이지의 HTML 구조를 작성할 수 있다.
assessment:
  itemCount: 10
  passRatio: 0.8
practice:
  targetCount: 10
