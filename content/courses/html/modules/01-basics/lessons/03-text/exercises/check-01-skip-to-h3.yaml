id: html.basics.text.check-skip-to-h3
type: mcq_single
difficulty: 1
usage: check
concepts:
  - { id: html.text.headings, weight: 1 }
tags: [heading, h1, h2, h3]
estimatedSeconds: 60
prompt: |
  동아리 소개 페이지에서 `h1` "사진 동아리" 바로 다음의 장 제목 "활동 내용"을 `h3`로 썼어요. 이유를 물어보니 "`h2`는 글자가 너무 커서"라고 해요. 가장 알맞게 고친 것은 무엇인가요?
spec:
  options:
    - id: a
      text: "\"활동 내용\"을 `h2`로 바꾸고, 글자 크기는 CSS로 줄인다"
    - id: b
      text: 크기가 마음에 들면 `h3` 그대로 둬도 된다
      misconception: html.mc.heading-skip-levels
      rationale: h1 다음 장 제목을 h3로 쓰면 목차에서 h2 단계를 건너뛰어요. 화면 낭독기 사용자는 빠진 단계가 있다고 느껴요.
    - id: c
      text: "\"활동 내용\"을 `h6`으로 바꿔 더 작게 만든다"
      misconception: html.mc.heading-for-size
      rationale: 제목 단계는 크기가 아니라 목차의 단계로 골라요. h6은 단계를 더 많이 건너뛰어요.
    - id: d
      text: "\"활동 내용\"을 `p`로 바꿔서 제목이 아니게 만든다"
      rationale: 활동 내용은 실제로 장 제목이에요. 문단으로 바꾸면 목차에서 사라져요.
  correct: a
misconceptions: [html.mc.heading-skip-levels, html.mc.heading-for-size]
hints:
  - 제목 요소는 글자 크기와 목차의 단계 중 무엇을 기준으로 고르나요?
  - 페이지 제목이 h1이면, 그 바로 아래 장 제목은 몇 단계일까요?
  - 단계는 목차에 맞게 고르고, 모양(크기)은 다른 언어가 맡아요.
explanation: |
  정답은 **`h2`로 바꾸고 크기는 CSS로 줄이는 것**이에요.

  제목 요소는 **목차의 단계**로 골라요. 페이지 제목(`h1`) 바로 아래의 장 제목은 `h2`이고, 단계를 건너뛰면 화면 낭독기로 목차를 훑는 사람이 구조를 헷갈려요. 글자 크기가 마음에 들지 않으면 단계를 바꾸지 말고 CSS로 크기를 정해요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
