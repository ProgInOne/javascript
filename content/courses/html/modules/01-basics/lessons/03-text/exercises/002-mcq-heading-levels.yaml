id: html.basics.text.mcq-heading-levels
type: mcq_single
difficulty: 2
concepts:
  - { id: html.text.headings, weight: 1 }
tags: [headings, outline]
estimatedSeconds: 70
prompt: |
  요리 블로그 글의 목차가 아래와 같아요. 각 제목에 쓸 요소를 **바르게** 짝지은 것은 무엇인가요?

  - 김치볶음밥 만들기 (글 전체의 제목)
    - 재료 (장)
    - 만드는 법 (장)
      - 불 조절 요령 ("만드는 법"의 세부 내용)
spec:
  options:
    - id: a
      text: "김치볶음밥 만들기 `h1` / 재료 `h2` / 만드는 법 `h2` / 불 조절 요령 `h3`"
    - id: b
      text: "김치볶음밥 만들기 `h1` / 재료 `h2` / 만드는 법 `h2` / 불 조절 요령 `h5`"
      misconception: html.mc.heading-skip-levels
      rationale: h2 바로 아래 단계는 h3이에요. h5를 쓰면 h3, h4 단계를 건너뛰어요.
    - id: c
      text: "김치볶음밥 만들기 `h1` / 재료 `h2` / 만드는 법 `h3` / 불 조절 요령 `h4`"
      rationale: 재료와 만드는 법은 같은 단계의 장이라 같은 요소를 써야 해요.
    - id: d
      text: "김치볶음밥 만들기 `h1` / 재료 `h1` / 만드는 법 `h1` / 불 조절 요령 `h2`"
      rationale: 장 제목까지 h1으로 쓰면 글 전체의 제목과 장 제목의 단계가 구분되지 않아요.
  correct: a
misconceptions: [html.mc.heading-skip-levels]
hints:
  - 같은 단계의 제목에는 같은 요소를 써요.
  - 한 단계 내려갈 때마다 숫자가 하나씩 커져요.
  - 글 전체 제목이 h1이면, 장은 h2이고, 장 아래 세부 내용은 그다음 숫자예요.
explanation: |
  정답은 **h1 / h2 / h2 / h3**예요.

  - 글 전체의 제목은 `h1`이에요.
  - "재료"와 "만드는 법"은 같은 단계의 장이라 둘 다 `h2`예요.
  - "불 조절 요령"은 "만드는 법" 아래의 세부 내용이라 한 단계 아래인 `h3`이에요.

  `h5`를 고른 경우: 단계를 건너뛰었어요. 목차를 훑는 사람은 h3, h4가 빠졌다고 오해해요. 크기가 마음에 들지 않으면 단계는 그대로 두고 CSS로 크기를 바꿔요.
origin: authored
review:
