id: html.basics.text.web-library-notice
type: web_task
difficulty: 3
concepts:
  - { id: html.text.emphasis, weight: 1 }
  - { id: html.doc.nesting, weight: 0.3 }
tags: [strong, em, emphasis, web-task]
estimatedSeconds: 300
prompt: |
  도서관의 시험 기간 안내문에 뜻을 표시하려고 해요. 아래 네 군데에 어떤 뜻이 필요한지 판단해서, 알맞은 요소로 **해당 부분만** 감싸세요.

  1. 첫 번째 문단의 **"짐을 모두 챙기세요"**: 챙기지 않은 짐은 치워져서 잃어버릴 수 있어요. 꼭 지켜야 하는 내용이에요.
  1. 두 번째 문단의 **"12시"**: 많은 사람이 10시에 닫는다고 잘못 알고 있어요. 안내 방송에서 "10시가 아니라 12시"라고 이 낱말에 힘을 주어 읽어요.
  1. 세 번째 문단의 **"책을 빌릴 수 없어요"**: 모르고 왔다가 헛걸음하지 않도록 꼭 알아야 하는 내용이에요.
  1. 세 번째 문단의 **"읽기만"**: "빌리는 것이 아니라 읽기만"이라고 이 낱말에 힘을 주어 읽어요.

  문장의 글자는 바꾸지 말고, 마침표나 조사는 감싸지 마세요.
spec:
  focus: html
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>시험 기간 안내</title>
            </head>
            <body>
              <h1>시험 기간 도서관 안내</h1>
              <p>자리를 비울 때는 짐을 모두 챙기세요.</p>
              <p>열람실은 밤 10시가 아니라 12시까지 열어요.</p>
              <p>시험 기간에는 책을 빌릴 수 없어요. 열람실에서 읽기만 할 수 있어요.</p>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>시험 기간 안내</title>
            </head>
            <body>
              <h1>시험 기간 도서관 안내</h1>
              <p>자리를 비울 때는 <strong>짐을 모두 챙기세요</strong>.</p>
              <p>열람실은 밤 10시가 아니라 <em>12시</em>까지 열어요.</p>
              <p>시험 기간에는 <strong>책을 빌릴 수 없어요</strong>. 열람실에서 <em>읽기만</em> 할 수 있어요.</p>
            </body>
          </html>
  checks:
    - kind: dom
      id: first-strong
      description: "첫 번째 문단의 \"짐을 모두 챙기세요\"가 중요한 내용을 뜻하는 요소로 감싸져 있어야 합니다."
      requirement: 꼭 지켜야 하는 내용
      visible: true
      selector: p:nth-of-type(1) > strong
      expect:
        count: 1
        text: { equals: 짐을 모두 챙기세요 }
      misconceptionIfFail: html.mc.strong-is-bold
    - kind: dom
      id: second-em
      description: "두 번째 문단의 \"12시\"가 말의 강세를 뜻하는 요소로 감싸져 있어야 합니다."
      requirement: 힘을 주어 읽는 낱말
      visible: true
      selector: p:nth-of-type(2) > em
      expect:
        count: 1
        text: { equals: 12시 }
      misconceptionIfFail: html.mc.strong-is-bold
    - kind: dom
      id: third-strong
      description: "세 번째 문단의 \"책을 빌릴 수 없어요\"가 중요한 내용을 뜻하는 요소로 감싸져 있어야 합니다."
      requirement: 꼭 알아야 하는 내용
      visible: true
      selector: p:nth-of-type(3) > strong
      expect:
        count: 1
        text: { equals: 책을 빌릴 수 없어요 }
      misconceptionIfFail: html.mc.strong-is-bold
    - kind: dom
      id: third-em
      description: "세 번째 문단의 \"읽기만\"이 말의 강세를 뜻하는 요소로 감싸져 있어야 합니다."
      requirement: 힘을 주어 읽는 낱말
      visible: true
      selector: p:nth-of-type(3) > em
      expect:
        count: 1
        text: { equals: 읽기만 }
      misconceptionIfFail: html.mc.strong-is-bold
    - kind: dom
      id: strong-count
      description: 중요한 내용을 뜻하는 요소는 문서 전체에 두 개만 있어야 합니다.
      requirement: 해당 부분만 감싸기
      visible: true
      selector: body strong
      expect:
        count: 2
    - kind: dom
      id: em-count
      description: 강세를 뜻하는 요소는 문서 전체에 두 개만 있어야 합니다.
      requirement: 해당 부분만 감싸기
      visible: true
      selector: body em
      expect:
        count: 2
    - kind: dom
      id: paragraph-count
      description: 문단은 세 개 그대로여야 합니다.
      requirement: 문장 유지
      selector: body p
      expect:
        count: 3
    - kind: dom
      id: first-kept
      description: 첫 번째 문단의 문장은 그대로여야 합니다.
      requirement: 문장 유지
      selector: p:nth-of-type(1)
      expect:
        text: { equals: 자리를 비울 때는 짐을 모두 챙기세요. }
    - kind: dom
      id: second-kept
      description: 두 번째 문단의 문장은 그대로여야 합니다.
      requirement: 문장 유지
      selector: p:nth-of-type(2)
      expect:
        text: { equals: 열람실은 밤 10시가 아니라 12시까지 열어요. }
    - kind: dom
      id: third-kept
      description: 세 번째 문단의 문장은 그대로여야 합니다.
      requirement: 문장 유지
      selector: p:nth-of-type(3)
      expect:
        text: { equals: 시험 기간에는 책을 빌릴 수 없어요. 열람실에서 읽기만 할 수 있어요. }
misconceptions: [html.mc.strong-is-bold]
hints:
  - 네 군데에 붙일 뜻은 두 종류예요. "꼭 지켜야 하거나 꼭 알아야 하는 내용"과 "말할 때 힘을 주는 낱말"로 나눠 보세요.
  - 중요도는 `strong`, 말의 강세는 `em`이 나타내요. 세 번째 문단에는 두 종류가 모두 들어가요.
  - 지문의 설명에 "꼭 지켜야", "꼭 알아야"가 있는지, "~가 아니라"처럼 다른 것과 비교해 힘을 주어 읽는지 보고 나누세요. 감쌀 때는 각 부분의 바로 앞에 여는 태그, 바로 뒤에 닫는 태그를 쓰고, 뒤따르는 "까지", "할", 마침표는 밖에 남겨요.
explanation: |
  예시 정답은 이래요.

  ```html
  <p>자리를 비울 때는 <strong>짐을 모두 챙기세요</strong>.</p>
  <p>열람실은 밤 10시가 아니라 <em>12시</em>까지 열어요.</p>
  <p>시험 기간에는 <strong>책을 빌릴 수 없어요</strong>. 열람실에서 <em>읽기만</em> 할 수 있어요.</p>
  ```

  - **"짐을 모두 챙기세요"**, **"책을 빌릴 수 없어요"**: 놓치면 짐을 잃거나 헛걸음하는 **중요한 내용**이라 `strong`이에요.
  - **"12시"**, **"읽기만"**: 다른 것("10시", "빌리기")과 비교해 그 낱말에 **힘을 주어 말하는** 부분이라 `em`이에요. 강세를 다른 낱말에 두면 문장의 뜻이 달라져요.

  한 문단 안에 `strong`과 `em`이 함께 있어도 괜찮아요. 요소는 모양이 아니라 그 부분의 뜻에 맞춰 골라요. `strong`과 `em`을 바꿔 쓰거나 굵은 모양만 생각해서 모두 `strong`으로 감쌌다면, 화면 낭독기는 모양이 아니라 뜻을 전한다는 점을 떠올려 보세요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
