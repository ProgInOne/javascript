id: html.basics.text.fill-strong-warning
type: fill_blank
difficulty: 2
concepts:
  - { id: html.text.emphasis, weight: 1 }
  - { id: html.doc.nesting, weight: 0.3 }
tags: [strong, emphasis]
estimatedSeconds: 70
prompt: |
  안전 안내문에서 **"타지 마세요"** 부분이 중요한 내용이라는 것을 표시하려고 해요. 두 빈칸에 태그를 채워 "타지 마세요"만 중요한 내용을 뜻하는 요소로 감싸세요.
spec:
  mode: code
  lang: html
  template: |
    <p>불이 나면 엘리베이터를 {{blank:open}}타지 마세요{{blank:close}}.</p>
  blanks:
    - id: open
      accept: ["<strong>"]
      width: 10
      misconceptionMap:
        "<b>": html.mc.strong-is-bold
    - id: close
      accept: ["</strong>"]
      width: 10
      misconceptionMap:
        "</b>": html.mc.strong-is-bold
  checks:
    - kind: dom
      id: strong-text
      description: "\"타지 마세요\"가 중요한 내용을 뜻하는 요소로 감싸져 있어야 합니다."
      requirement: 중요한 내용 표시
      visible: true
      selector: p > strong
      expect:
        count: 1
        text: { equals: 타지 마세요 }
      misconceptionIfFail: html.mc.strong-is-bold
    - kind: dom
      id: sentence-kept
      description: 문단 전체 문장은 "불이 나면 엘리베이터를 타지 마세요."로 그대로여야 합니다.
      requirement: 문장 유지
      visible: true
      selector: p
      expect:
        text: { equals: 불이 나면 엘리베이터를 타지 마세요. }
misconceptions: [html.mc.strong-is-bold]
hints:
  - 중요하거나 위험한 내용을 표시하는 요소와, 말의 강세를 표시하는 요소 중 어느 쪽일까요?
  - 앞 빈칸에는 여는 태그, 뒤 빈칸에는 닫는 태그가 들어가요.
  - 중요한 내용은 `strong`으로 감싸요. 닫는 태그에는 `/`를 붙여요.
explanation: |
  정답은 **`<strong>`**과 **`</strong>`**이에요.

  ```html
  <p>불이 나면 엘리베이터를 <strong>타지 마세요</strong>.</p>
  ```

  "타지 마세요"는 지키지 않으면 위험한 중요한 내용이라 `strong`으로 표시해요. `strong` 요소는 `p` 안에 중첩되고, 마침표는 강조 밖에 남아요.

  - `<em>`으로 감싸면 "중요하다"가 아니라 "힘을 줘서 말한다"는 뜻이 돼요.
  - `<b>`는 뜻 없이 글자를 굵게만 보이게 하는 요소예요. 화면은 비슷해도 중요하다는 뜻이 전해지지 않아요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
