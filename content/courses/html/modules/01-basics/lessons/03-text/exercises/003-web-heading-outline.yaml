id: html.basics.text.web-heading-outline
type: web_task
difficulty: 3
concepts:
  - { id: html.text.headings, weight: 1 }
  - { id: html.text.paragraphs, weight: 0.3 }
tags: [headings, outline, web-task]
estimatedSeconds: 300
prompt: |
  여행 계획 페이지의 제목들이 모두 `p` 요소에 CSS로 크기만 키운 글자예요. 화면에서는 제목처럼 보이지만, 브라우저와 화면 낭독기는 목차를 알 수 없어요.

  아래 목차에 맞게 제목 글자들을 **제목 요소**로 바꾸세요.

  - 제주도 여행 계획 (페이지 전체의 제목)
    - 첫째 날
      - 점심 맛집 ("첫째 날"의 세부 내용)
    - 둘째 날

  제목이 아닌 문장 세 개는 문단(`p`)으로 그대로 두세요. `<style>`과 `class`는 지워도 되고 남겨 둬도 돼요.
spec:
  focus: html
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>여행 계획</title>
              <style>
                .title { font-size: 32px; font-weight: bold; }
                .chapter { font-size: 24px; font-weight: bold; }
                .small { font-size: 18px; font-weight: bold; }
              </style>
            </head>
            <body>
              <p class="title">제주도 여행 계획</p>
              <p class="chapter">첫째 날</p>
              <p>공항에 도착해서 렌터카를 빌려요.</p>
              <p class="small">점심 맛집</p>
              <p>공항 근처 국숫집에 가요.</p>
              <p class="chapter">둘째 날</p>
              <p>한라산 둘레길을 걸어요.</p>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>여행 계획</title>
            </head>
            <body>
              <h1>제주도 여행 계획</h1>
              <h2>첫째 날</h2>
              <p>공항에 도착해서 렌터카를 빌려요.</p>
              <h3>점심 맛집</h3>
              <p>공항 근처 국숫집에 가요.</p>
              <h2>둘째 날</h2>
              <p>한라산 둘레길을 걸어요.</p>
            </body>
          </html>
  checks:
    - kind: dom
      id: page-title
      description: 페이지 전체의 제목 "제주도 여행 계획"이 h1이어야 하고, h1은 하나여야 합니다.
      requirement: 페이지 제목
      visible: true
      selector: h1
      expect:
        count: 1
        text: { equals: 제주도 여행 계획 }
    - kind: dom
      id: chapters
      description: "\"첫째 날\"과 \"둘째 날\"은 같은 단계의 장 제목(h2)이어야 합니다."
      requirement: 장 제목
      visible: true
      selector: h2
      expect:
        count: 2
        text: { equals: 첫째 날 }
    - kind: dom
      id: sub-heading
      description: "\"점심 맛집\"은 장 제목 바로 아래 단계의 제목이어야 합니다."
      requirement: 세부 제목
      visible: true
      selector: h3
      expect:
        count: 1
        text: { equals: 점심 맛집 }
      misconceptionIfFail: html.mc.heading-skip-levels
    - kind: dom
      id: outline-order
      description: 제목이 목차 순서(페이지 제목 → 첫째 날 → 점심 맛집 → 둘째 날)대로 놓여야 합니다.
      requirement: 목차 순서
      selector: body
      expect:
        tag: body
        order: [h1, h2, h3, h2]
    - kind: dom
      id: paragraphs-kept
      description: 제목이 아닌 문장 세 개는 문단(p)으로 남아 있어야 합니다.
      requirement: 문단 유지
      selector: body > p
      expect:
        count: 3
misconceptions: [html.mc.heading-skip-levels]
hints:
  - 페이지 제목, 장 제목, 세부 제목은 목차에서 각각 몇 번째 단계인가요?
  - 단계가 하나 내려갈 때마다 제목 요소의 숫자가 하나씩 커져요. "첫째 날"과 "둘째 날"은 같은 단계예요.
  - "제목 글자를 감싼 `p`를 단계에 맞게 `h1`, `h2`, `h3`으로 바꾸세요. 여는 태그와 닫는 태그를 모두 바꿔야 해요."
explanation: |
  예시 정답은 제목 글자를 목차 단계에 맞는 요소로 바꾸는 거예요.

  ```html
  <h1>제주도 여행 계획</h1>
  <h2>첫째 날</h2>
  <p>공항에 도착해서 렌터카를 빌려요.</p>
  <h3>점심 맛집</h3>
  <p>공항 근처 국숫집에 가요.</p>
  <h2>둘째 날</h2>
  <p>한라산 둘레길을 걸어요.</p>
  ```

  - 페이지 전체의 제목은 `h1` 하나예요.
  - "첫째 날"과 "둘째 날"은 같은 단계의 장이라 둘 다 `h2`예요.
  - "점심 맛집"은 "첫째 날" 아래의 세부 내용이라 `h3`이에요. 시작 코드에서 가장 작은 글자였다고 `h4`나 `h5`를 쓰면 단계를 건너뛰어요.

  CSS로 크기만 키운 `p`는 화면에서 제목처럼 보여도 브라우저에게는 그냥 문단이에요. 제목 요소로 바꾸면 기본 스타일만으로도 크기가 단계별로 달라지고, 화면 낭독기가 목차를 읽을 수 있어요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
