id: html.basics.how-web-works.mcq-request-response
type: mcq_single
difficulty: 1
concepts:
  - { id: html.web.client-server, weight: 1 }
tags: [client-server, request, response]
estimatedSeconds: 40
prompt: |
  주소창에 처음 가 보는 사이트의 주소를 입력하고 Enter를 눌렀어요. 화면에 페이지가 나타나기까지 일어나는 일을 바르게 설명한 것은 무엇인가요?
spec:
  options:
    - id: a
      text: 브라우저가 그 주소의 서버에 파일을 요청하고, 서버가 보내 준 HTML을 받아 화면에 그린다
    - id: b
      text: 브라우저 프로그램 안에 저장되어 있던 그 사이트의 페이지를 꺼내 화면에 보여 준다
      misconception: html.mc.page-lives-in-browser
      rationale: 처음 가 보는 사이트의 페이지는 내 컴퓨터에 없어요. 서버에 요청해서 받아 와야 해요.
    - id: c
      text: 서버가 내 컴퓨터의 화면을 직접 원격으로 조종해서 페이지를 그린다
      rationale: 서버는 파일을 보내 줄 뿐이고, 화면에 그리는 일은 내 컴퓨터의 브라우저가 해요.
    - id: d
      text: 브라우저가 주소를 보고 페이지 내용을 스스로 지어내서 그린다
      rationale: 브라우저는 페이지 내용을 만들지 않아요. 서버에서 받은 HTML을 읽어 그려요.
  correct: a
misconceptions: [html.mc.page-lives-in-browser]
hints:
  - 웹 페이지 파일이 처음에 어디에 저장되어 있는지 떠올려 보세요.
  - 파일을 가진 쪽(서버)과 달라고 하는 쪽(브라우저)이 주고받는 두 단계가 있어요.
  - 레슨의 음식점 비유를 떠올려 보세요. 손님(브라우저)이 주문하면 주방(서버)이 음식을 내어 줘요.
explanation: |
  정답은 **브라우저가 서버에 파일을 요청하고, 받은 HTML을 화면에 그린다**예요.

  1. 브라우저가 주소를 보고 그 주소의 서버에 "이 파일을 보내 주세요"라고 **요청**해요.
  1. 서버가 HTML 파일을 **응답**으로 보내 줘요.
  1. 브라우저가 HTML을 읽고 화면에 그려요.

  - "브라우저 안에 저장되어 있던 페이지"는 틀렸어요. 처음 가 보는 사이트의 페이지는 내 컴퓨터에 없어서, 인터넷이 끊기면 열리지 않아요.
  - 서버는 화면을 조종하지 않고, 브라우저는 내용을 지어내지 않아요. 서버는 파일을 보내고, 브라우저는 받은 파일을 그려요.
origin: authored
