id: html.basics.how-web-works.try-weather-card
type: web_task
difficulty: 2
usage: try
concepts:
  - { id: html.web.three-languages, weight: 1 }
  - { id: html.web.rendering, weight: 0.3 }
tags: [html, css, style, web-task]
estimatedSeconds: 240
prompt: |
  날씨 페이지에 HTML과 CSS를 한 줄씩 직접 써 보세요. 주석이 있는 자리에 쓰면 돼요.

  1. **HTML**: 제목 아래에 문단(`p`)으로 "우산을 챙기세요."를 써요.
  1. **CSS**: `<style>` 안에 문단 글자를 초록색(`green`)으로 만드는 규칙을 써요. 두 번째 예제의 `h1` 규칙과 같은 모양이에요.

  화면에는 제목과 문단만 보이고, CSS 규칙은 글자로 보이면 안 돼요.
spec:
  focus: html
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>오늘의 날씨</title>
              <style>
                /* 여기에 문단(p)을 초록색으로 만드는 규칙을 쓰세요 */
              </style>
            </head>
            <body>
              <h1>오늘의 날씨</h1>
              <!-- 여기에 문단을 쓰세요 -->
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>오늘의 날씨</title>
              <style>
                p {
                  color: green;
                }
              </style>
            </head>
            <body>
              <h1>오늘의 날씨</h1>
              <p>우산을 챙기세요.</p>
            </body>
          </html>
  checks:
    - kind: dom
      id: paragraph
      description: 제목 아래에 문단(p) "우산을 챙기세요."가 하나 있어야 합니다.
      requirement: HTML 문단
      visible: true
      selector: body > h1 + p
      expect:
        count: 1
        text: { equals: 우산을 챙기세요. }
    - kind: dom
      id: only-heading-and-p
      description: 본문에는 제목과 문단만 있어야 합니다. CSS 규칙은 style 안에 써요.
      requirement: HTML 문단
      selector: body > p
      expect:
        count: 1
    - kind: css
      id: green-text
      description: 문단 글자가 초록색(green)으로 보여야 합니다.
      requirement: CSS 규칙
      visible: true
      selector: p
      expect:
        computed:
          color: { color: "#008000" }
    - kind: css
      id: heading-unchanged
      description: 제목은 초록색이 아니어야 합니다(규칙은 문단에만 적용해요).
      requirement: CSS 규칙
      selector: h1
      expect:
        computed:
          color: { color: "#000000" }
hints:
  - 문단은 HTML 자리(`body`)에, 색 규칙은 CSS 자리(`style`)에 써요. 각각 어느 언어의 몫인지 떠올려 보세요.
  - "문단은 `p` 태그로 글자를 감싸요. CSS 규칙은 `선택자 { 속성: 값; }` 모양이고, 글자 색 속성은 `color`예요."
  - "`body`의 주석 자리에 `<p>우산을 챙기세요.</p>`, `style`의 주석 자리에 `p { color: green; }`을 써 보세요."
explanation: |
  예시 답안은 이래요.

  ```html
  <style>
    p {
      color: green;
    }
  </style>
  ...
  <h1>오늘의 날씨</h1>
  <p>우산을 챙기세요.</p>
  ```

  - `p`는 HTML이에요. "여기에 문단이 있다"는 **내용과 구조**를 알려 줘요.
  - `p { color: green; }`은 CSS예요. 문단을 초록색으로 **보이게** 하는 모양 규칙이라 `style` 안에 써요.
  - 규칙을 `body`에 쓰면 브라우저가 내용(글자)으로 읽어서 화면에 그대로 보여요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
