id: html.basics.how-web-works.fill-three-languages
type: fill_blank
difficulty: 2
concepts:
  - { id: html.web.three-languages, weight: 1 }
tags: [html-css-js, roles]
estimatedSeconds: 70
prompt: |
  아래 페이지 코드는 세 언어로 쓰여 있어요. 각 부분이 어느 언어인지 빈칸에 쓰세요(HTML / CSS / JavaScript).
code: |
  <style>
    p {
      font-size: 20px;
    }
  </style>

  <p>오늘 할 일: <span id="todo">3</span>개</p>
  <button id="done">하나 끝냈어요</button>

  <script>
    let todo = 3;
    document.querySelector("#done").addEventListener("click", () => {
      todo = todo - 1;
      document.querySelector("#todo").textContent = todo;
    });
  </script>
spec:
  mode: text
  template: |
    문단의 글자를 20px 크기로 보이게 하는 부분: {{blank:style}}
    "하나 끝냈어요" 버튼이 페이지에 있다고 알려 주는 부분: {{blank:button}}
    버튼을 누르면 할 일 숫자를 1 줄이는 부분: {{blank:script}}
  blanks:
    - id: style
      accept: ["CSS"]
      caseSensitive: false
      width: 12
    - id: button
      accept: ["HTML"]
      caseSensitive: false
      width: 12
      misconceptionMap:
        "JavaScript": html.mc.html-is-programming
        "JS": html.mc.html-is-programming
    - id: script
      accept: ["JavaScript", "JS", "자바스크립트"]
      caseSensitive: false
      width: 12
      misconceptionMap:
        "HTML": html.mc.html-is-programming
misconceptions: [html.mc.html-is-programming]
hints:
  - 각 부분이 "내용과 구조", "모양", "동작" 중 무엇을 하는지 먼저 나눠 보세요.
  - "`<style>` 안은 모양을, `<script>` 안은 동작을 맡아요. 버튼 태그 자체는 \"여기에 버튼이 있다\"는 표시예요."
  - 글자 크기는 모양(CSS), 버튼이 있다는 표시는 구조(HTML), 누르면 숫자가 줄어드는 반응은 동작(JavaScript)이에요.
explanation: |
  정답은 차례로 **CSS**, **HTML**, **JavaScript**예요.

  | 부분 | 언어 | 하는 일 |
  |---|---|---|
  | `<style>` 안의 `font-size: 20px;` | CSS | 문단 글자를 20px로 **보이게** 해요 |
  | `<button>` | HTML | 버튼이 **있다**고 알려 줘요 |
  | `<script>` 안의 코드 | JavaScript | 누르면 숫자를 1 줄이는 **동작**을 해요 |

  버튼을 누를 때 숫자가 바뀌는 일을 HTML이 한다고 생각했다면, HTML은 버튼이 있다는 것까지만 표시한다는 점을 떠올려 보세요. `<script>`를 지우면 버튼은 그대로 있지만 눌러도 아무 일도 일어나지 않아요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
