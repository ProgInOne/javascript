id: html.basics.how-web-works.fill-render-result
type: fill_blank
difficulty: 2
concepts:
  - { id: html.web.rendering, weight: 1 }
tags: [rendering, tags]
estimatedSeconds: 60
prompt: |
  아래 HTML을 브라우저로 열었어요. 화면의 각 줄에 **보이는 글자를 그대로** 쓰세요.
code: |
  <h1>수요일 급식</h1>
  <p>오늘의 메뉴는 <strong>김치볶음밥</strong>이에요.</p>
spec:
  mode: text
  template: |
    첫째 줄(큰 제목): {{blank:title}}
    둘째 줄(문단): {{blank:para}}
  blanks:
    - id: title
      accept: ["수요일 급식"]
      width: 16
      misconceptionMap:
        "<h1>수요일 급식</h1>": html.mc.code-shown-as-is
        "h1 수요일 급식": html.mc.code-shown-as-is
    - id: para
      accept: ["오늘의 메뉴는 김치볶음밥이에요.", "오늘의 메뉴는 김치볶음밥이에요"]
      width: 30
      misconceptionMap:
        "오늘의 메뉴는 <strong>김치볶음밥</strong>이에요.": html.mc.code-shown-as-is
        "<p>오늘의 메뉴는 <strong>김치볶음밥</strong>이에요.</p>": html.mc.code-shown-as-is
misconceptions: [html.mc.code-shown-as-is]
hints:
  - 태그는 화면에 보이는 글자일까요, 브라우저에게 주는 표시일까요?
  - 브라우저는 태그를 감추고 태그 사이의 내용만 그려요. 문단 안의 `strong`도 마찬가지예요.
  - 각 줄에서 꺾쇠(`<`, `>`)로 둘러싸인 부분을 모두 지우고 남는 글자를 쓰세요.
explanation: |
  정답은 **수요일 급식**과 **오늘의 메뉴는 김치볶음밥이에요.**예요.

  브라우저는 태그의 뜻을 해석해서 그리고(렌더링), 태그 자체는 보여 주지 않아요.

  - `<h1>`은 "가장 큰 제목"이라서 "수요일 급식"이 크고 굵게 그려져요.
  - `<p>` 안의 `<strong>`도 태그라서 화면에 나오지 않아요. "김치볶음밥"은 중요한 내용이라는 뜻에 맞게 굵게 그려지지만, 글자는 문장 속에 그대로 이어져요.

  답에 `<h1>`이나 `<strong>`을 썼다면, 태그는 사람이 아니라 브라우저에게 주는 표시라는 점을 다시 떠올려 보세요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
