id: html.basics.how-web-works.multi-browser-jobs
type: mcq_multi
difficulty: 2
concepts:
  - { id: html.web.client-server, weight: 1 }
tags: [client-server, request, response]
estimatedSeconds: 70
prompt: |
  학교 소식 페이지 `news.html`에는 그림 파일 `school.jpg`가 하나 적혀 있어요. 주소창에 이 페이지의 주소를 입력했을 때, **브라우저(클라이언트)가 하는 일**을 모두 고르세요.
spec:
  options:
    - id: a
      text: 주소를 보고 그 주소의 서버에 `news.html`을 보내 달라고 요청한다
    - id: b
      text: 받은 HTML을 읽고 태그의 뜻에 맞게 화면에 그린다
    - id: c
      text: HTML을 읽다가 적혀 있는 `school.jpg`를 서버에 한 번 더 요청한다
    - id: d
      text: "`news.html`과 `school.jpg` 파일을 보관해 두었다가, 요청이 오면 꺼내 보내 준다"
      misconception: html.mc.page-lives-in-browser
      rationale: 웹 페이지 파일을 가지고 있다가 보내 주는 쪽은 서버예요. 브라우저 안에 사이트의 파일이 들어 있는 것이 아니에요.
    - id: e
      text: 요청받은 `news.html` 파일을 응답으로 보낸다
      rationale: 응답을 보내는 쪽은 서버예요. 브라우저는 요청을 보내고 응답을 받는 쪽이에요.
  correct: [a, b, c]
misconceptions: [html.mc.page-lives-in-browser]
hints:
  - 파일을 "달라고 하는 쪽"과 "가지고 있다가 보내 주는 쪽"을 먼저 나눠 보세요.
  - 레슨의 세 단계(요청, 응답, 그리기)에서 각 단계를 누가 하는지 떠올려 보세요. 그리기 단계의 설명 끝에 그림 파일 이야기도 있었어요.
  - 선택지마다 "파일을 달라고 하는 일", "파일을 보내 주는 일", "받은 것을 그리는 일" 중 무엇인지 붙여 보세요. 보내 주는 일은 파일을 가진 쪽만 할 수 있어요.
explanation: |
  정답은 **서버에 요청하기**, **받은 HTML을 그리기**, **그림 파일을 한 번 더 요청하기**예요.

  1. 브라우저가 주소를 보고 서버에 `news.html`을 **요청**해요.
  1. 서버가 `news.html`을 **응답**으로 보내요.
  1. 브라우저가 HTML을 읽고 그려요. 그러다 `school.jpg`가 적혀 있으면, 그 파일도 같은 방법으로 서버에 다시 요청해서 받아 와요.

  - "파일을 보관해 두었다가 보내 준다"는 서버가 하는 일이에요. 브라우저 안에 페이지 파일이 들어 있다고 생각했다면, 웹 페이지 파일은 서버에 있다는 점을 다시 떠올려 보세요.
  - "요청받은 파일을 응답으로 보낸다"도 서버의 일이에요. 브라우저는 요청을 보내는 쪽이에요.
