id: html.basics.how-web-works.mcq-tags-not-shown
type: mcq_single
difficulty: 1
concepts:
  - { id: html.web.rendering, weight: 1 }
tags: [rendering, tags]
estimatedSeconds: 50
prompt: |
  아래 HTML을 브라우저로 열면 화면에 어떻게 보이나요?
code: |
  <h1>동네 빵집</h1>
  <p>매일 아침 8시에 문을 열어요.</p>
spec:
  options:
    - id: a
      text: 크고 굵은 "동네 빵집" 아래에 보통 크기로 "매일 아침 8시에 문을 열어요."가 보인다
    - id: b
      text: "`<h1>동네 빵집</h1>`과 `<p>매일 아침 8시에 문을 열어요.</p>`가 코드 모양 그대로 보인다"
      misconception: html.mc.code-shown-as-is
      rationale: 브라우저는 태그를 해석해서 감추고, 내용만 뜻에 맞게 그려요.
    - id: c
      text: "\"h1 동네 빵집 p 매일 아침 8시에 문을 열어요.\"처럼 꺾쇠만 빠지고 태그 이름은 보인다"
      misconception: html.mc.code-shown-as-is
      rationale: 태그 이름도 화면에 나오지 않아요. 태그 전체가 브라우저에게 주는 표시예요.
    - id: d
      text: 두 줄이 같은 크기의 글자로 보인다
      rationale: "`h1`은 가장 큰 제목이라는 뜻이라서, 브라우저가 문단보다 크고 굵게 그려요."
  correct: a
misconceptions: [html.mc.code-shown-as-is]
hints:
  - 태그는 사람에게 보여 줄 글자일까요, 브라우저에게 주는 표시일까요?
  - "`h1`은 \"가장 큰 제목\", `p`는 \"문단\"이라는 뜻이에요. 브라우저는 이 뜻에 맞게 그려요."
  - 태그는 감춰지고, 태그 사이의 글자만 각자의 뜻에 맞는 모양으로 보여요.
explanation: |
  정답은 **크고 굵은 "동네 빵집" 아래에 보통 크기의 문단이 보인다**예요.

  브라우저는 HTML을 읽으면서 태그의 뜻을 해석하고(렌더링), 태그 자체는 화면에 보여 주지 않아요.

  - `<h1>`은 "가장 큰 제목"이라서 "동네 빵집"이 크고 굵게 그려져요.
  - `<p>`는 "문단"이라서 보통 크기의 글로 그려져요.

  코드가 그대로 보이거나 태그 이름이 남는다고 생각했다면, 태그가 브라우저에게 주는 표시라는 점을 다시 떠올려 보세요. 화면에는 태그 사이의 내용만 나와요.
origin: authored
review:
  status: approved
