id: html.basics.how-web-works.check-view-source
type: mcq_single
difficulty: 1
usage: check
concepts:
  - { id: html.web.rendering, weight: 1 }
  - { id: html.web.client-server, weight: 0.5 }
tags: [rendering, view-source, response]
estimatedSeconds: 50
prompt: |
  뉴스 사이트를 열고 빈 곳을 마우스 오른쪽 버튼으로 눌러 **페이지 소스 보기**를 골랐어요. 새로 열린 창에는 무엇이 보이나요?
spec:
  options:
    - id: a
      text: 서버가 응답으로 보내 준 HTML 코드가 태그까지 그대로 보인다
    - id: b
      text: 태그는 빠지고 기사 글자만 한 줄로 이어져 보인다
      rationale: 태그를 감추는 것은 브라우저가 화면에 그릴 때의 일이에요. 소스 보기는 그리기 전의 코드를 보여 줘요.
    - id: c
      text: 원래 화면과 똑같이 그려진 페이지가 한 번 더 보인다
      misconception: html.mc.code-shown-as-is
      rationale: 그려진 화면이 아니라, 화면을 만들기 위해 받은 코드가 보여요.
    - id: d
      text: 브라우저 프로그램 안에 미리 저장되어 있던 페이지 파일이 보인다
      misconception: html.mc.page-lives-in-browser
      rationale: 페이지 파일은 브라우저 안이 아니라 서버에 있어요. 브라우저는 요청해서 받은 것을 보여 줘요.
  correct: a
misconceptions: [html.mc.code-shown-as-is, html.mc.page-lives-in-browser]
hints:
  - 브라우저가 서버에서 받는 것은 그림이 아니라 무엇인가요?
  - 화면은 받은 코드를 브라우저가 해석해서 그린 결과예요. "소스"는 그 원본이에요.
  - 렌더링 전, 서버가 응답으로 보낸 파일의 모습을 떠올려 보세요.
explanation: |
  정답은 **서버가 보내 준 HTML 코드가 태그까지 그대로 보인다**예요.

  브라우저는 서버에 요청해서 HTML 파일을 **응답**으로 받고, 그 코드를 해석해 화면에 그려요(렌더링). 화면에서는 태그가 감춰지지만, 페이지 소스 보기는 그리기 전의 **원본 코드**를 보여 주기 때문에 태그가 모두 보여요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
