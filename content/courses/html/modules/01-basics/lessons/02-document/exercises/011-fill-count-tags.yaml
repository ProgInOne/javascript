id: html.basics.document.fill-count-tags
type: fill_blank
difficulty: 2
concepts:
  - { id: html.doc.elements, weight: 1 }
  - { id: html.doc.nesting, weight: 0.3 }
tags: [element, tag]
estimatedSeconds: 70
prompt: |
  아래 코드 한 줄에 **요소**와 **태그**가 각각 몇 개 있는지 세어 빈칸에 숫자로 쓰세요.
code: |
  <p>오늘은 <em>정말</em> 더워요.</p>
spec:
  mode: text
  template: |
    요소의 수: {{blank:elements}}개
    태그의 수(여는 태그와 닫는 태그를 모두 셈): {{blank:tags}}개
  blanks:
    - id: elements
      accept: ["2"]
      width: 3
      misconceptionMap:
        "4": html.mc.tag-is-element
    - id: tags
      accept: ["4"]
      width: 3
      misconceptionMap:
        "2": html.mc.tag-is-element
misconceptions: [html.mc.tag-is-element]
hints:
  - 태그는 꺾쇠로 감싼 표시 하나하나이고, 요소는 여는 태그부터 닫는 태그까지 전체예요.
  - "꺾쇠로 감싼 것을 모두 세어 보세요: `<p>`, `<em>`, … 그다음 여는 태그와 닫는 태그를 한 쌍씩 묶어 보세요."
  - "`<em>`과 `</em>`은 태그 두 개지만, 둘이 감싼 `<em>정말</em>` 전체는 요소 하나예요. `p`도 같은 방법으로 세어 보세요."
explanation: |
  정답은 **요소 2개**, **태그 4개**예요.

  - 태그: `<p>`, `<em>`, `</em>`, `</p>`로 4개예요.
  - 요소: 여는 태그부터 닫는 태그까지 한 덩어리가 요소예요. `<em>정말</em>`이 하나, 그것을 품은 `<p>…</p>` 전체가 또 하나라서 2개예요. `em` 요소는 `p` 요소 안에 중첩되어 있어요.

  요소를 4개로, 또는 태그를 2개로 셌다면 태그와 요소를 같은 것으로 본 거예요. 태그는 요소의 시작과 끝을 표시하는 부품이고, 요소는 태그와 그 사이의 내용을 모두 합친 것이에요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
