id: html.basics.document.tf-dom-is-source
type: true_false
difficulty: 2
concepts:
  - { id: html.doc.dom-tree, weight: 1 }
tags: [dom-tree]
estimatedSeconds: 60
prompt: |
  다음 설명이 맞는지 고르고, 그렇게 판단한 이유도 고르세요.
spec:
  statement: "HTML 코드에 `<html>`, `<head>`, `<body>`를 쓰지 않으면, 브라우저가 만든 DOM 트리에도 이 세 요소가 없다."
  answer: false
  misconceptionIfWrong: html.mc.dom-is-source
  requireReason: true
  reasons:
    - id: r1
      text: 브라우저는 HTML을 읽어 DOM 트리를 새로 만들면서 빠진 html·head·body를 스스로 채워 넣는다
      correct: true
    - id: r2
      text: DOM 트리는 HTML 코드를 글자 그대로 옮긴 것이라 코드에 없는 요소는 생기지 않는다
      misconception: html.mc.dom-is-source
    - id: r3
      text: 세 요소가 없으면 브라우저가 문서를 전혀 그리지 못하고 빈 화면을 보여 준다
hints:
  - 앞에서 `</p>`를 빠뜨린 예제를 실행했을 때 문단이 몇 개로 그려졌는지 떠올려 보세요.
  - DOM 트리는 내가 쓴 코드를 복사한 것일까요, 브라우저가 규칙에 따라 만든 것일까요?
  - 브라우저는 모든 문서의 DOM 트리를 html 아래 head와 body가 있는 모양으로 만들어요.
explanation: |
  정답은 **거짓**, 이유는 **브라우저가 DOM 트리를 새로 만들면서 빠진 html·head·body를 채워 넣는다**예요.

  레슨의 예제처럼 `<p>`만 쓴 코드도 잘 그려져요. 브라우저가 HTML을 읽으면서 html, head, body를 만들고 그 안에 p를 넣기 때문이에요. 닫지 않은 `</p>`도 규칙에 따라 닫아 줘요.

  - "글자 그대로 옮긴 것"은 틀렸어요. DOM 트리는 브라우저가 만든 구조라서 코드와 다를 수 있어요.
  - "빈 화면을 보여 준다"도 틀렸어요. 브라우저는 빠진 부분을 채우고 내용을 정상으로 그려요.

  그래도 뼈대는 직접 쓰는 것이 좋아요. `lang` 속성이나 `title`처럼 브라우저가 대신 채울 수 없는 정보가 있기 때문이에요.
