id: html.basics.document.try-lunch-notice
type: web_task
difficulty: 2
usage: try
concepts:
  - { id: html.doc.attributes, weight: 1 }
  - { id: html.doc.nesting, weight: 0.5 }
  - { id: html.doc.elements, weight: 0.3 }
tags: [attribute, title, nesting, strong, web-task]
estimatedSeconds: 240
prompt: |
  급식 안내 문단을 주석 자리에 직접 써 보세요.

  1. 문단(`p`) 하나에 "오늘 급식은 카레라이스예요."라고 써요.
  1. 문단 **안에서** "카레라이스"만 `strong`으로 감싸요.
  1. 문단에 마우스를 올리면 "3월 14일 점심"이라는 설명이 나타나도록, 문단에 `title` 속성을 주세요.

  설명 글자 "3월 14일 점심"은 화면에 보이면 안 돼요.
spec:
  focus: html
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>급식 안내</title>
            </head>
            <body>
              <h1>급식 안내</h1>
              <!-- 여기에 title 속성이 있는 문단을 쓰세요 -->
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>급식 안내</title>
            </head>
            <body>
              <h1>급식 안내</h1>
              <p title="3월 14일 점심">오늘 급식은 <strong>카레라이스</strong>예요.</p>
            </body>
          </html>
  checks:
    - kind: dom
      id: paragraph-text
      description: 문단 하나에 "오늘 급식은 카레라이스예요."가 보여야 합니다.
      requirement: 문단
      visible: true
      selector: body > p
      expect:
        count: 1
        text: { equals: 오늘 급식은 카레라이스예요. }
      misconceptionIfFail: html.mc.attribute-shown-on-page
    - kind: dom
      id: strong-inside
      description: 문단 안의 strong이 "카레라이스"만 감싸야 합니다.
      requirement: 중첩
      visible: true
      selector: body > p > strong
      expect:
        count: 1
        text: { equals: 카레라이스 }
      misconceptionIfFail: html.mc.overlapping-tags
    - kind: dom
      id: title-attr
      description: 문단에 title 속성 "3월 14일 점심"이 있어야 합니다.
      requirement: 속성
      visible: true
      selector: body > p
      expect:
        attr: { name: title, equals: 3월 14일 점심 }
misconceptions: [html.mc.attribute-shown-on-page, html.mc.overlapping-tags]
hints:
  - 화면에 보일 글자는 태그 사이의 내용에, 마우스를 올렸을 때 보일 설명은 속성에 써요.
  - "속성은 여는 태그 안에 `이름=\"값\"`으로 써요. strong은 p 안에서 열고, p보다 먼저 닫아요."
  - "`<p title=\"3월 14일 점심\">`으로 문단을 열고, 글자 중 카레라이스만 `<strong>`과 `</strong>`으로 감싼 뒤 `</p>`로 닫아요."
explanation: |
  예시 답안은 이래요.

  ```html
  <p title="3월 14일 점심">오늘 급식은 <strong>카레라이스</strong>예요.</p>
  ```

  - `title="3월 14일 점심"`은 **여는 태그 안**에 쓴 속성이에요. 속성 값은 화면에 글자로 나오지 않고, 마우스를 올리면 설명 상자로 보여요.
  - `strong`은 `p` 안에 중첩되어 있어요. 나중에 연 `strong`을 먼저 닫고, `p`를 마지막에 닫아요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
