id: html.basics.document.tf-attribute-shown
type: true_false
difficulty: 2
concepts:
  - { id: html.doc.attributes, weight: 1 }
tags: [attribute]
estimatedSeconds: 50
prompt: |
  다음 설명이 맞는지 고르고, 그렇게 판단한 이유도 고르세요.
spec:
  statement: "`<p lang=\"en\">Hello</p>`를 브라우저로 열면 화면에 \"Hello\"와 함께 \"en\"도 글자로 보인다."
  answer: false
  misconceptionIfWrong: html.mc.attribute-shown-on-page
  requireReason: true
  reasons:
    - id: r1
      text: 속성은 브라우저에게 주는 정보이고, 화면에 글자로 그려지는 것은 태그 사이의 내용이다
      correct: true
    - id: r2
      text: 속성 값은 화면에 보이지만, 내용보다 작은 글자로 그려진다
      misconception: html.mc.attribute-shown-on-page
    - id: r3
      text: lang 속성은 잘못 쓴 속성이라서 브라우저가 요소 전체를 무시한다
hints:
  - 화면에 보이는 글자는 코드의 어느 부분에 있는지 떠올려 보세요.
  - "`lang=\"en\"`은 여는 태그의 꺾쇠 안에 있어요. 꺾쇠 안은 브라우저에게 주는 표시였어요."
  - 속성은 "이 문단은 영어다" 같은 추가 정보예요. 브라우저는 이 정보를 쓰지만 글자로 그리지는 않아요.
explanation: |
  정답은 **거짓**, 이유는 **속성은 브라우저에게 주는 정보이고, 화면에는 태그 사이의 내용만 그려진다**예요.

  화면에는 "Hello"만 보여요. `lang="en"`은 "이 문단은 영어로 쓰였다"는 정보로, 화면 낭독기가 영어 발음으로 읽거나 브라우저가 번역 여부를 판단할 때 써요.

  - 속성 값이 작은 글자로 보이지는 않아요. 아예 그려지지 않아요.
  - `lang`은 올바른 속성이에요. 브라우저가 요소를 무시하지 않고 "Hello"를 정상으로 그려요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
