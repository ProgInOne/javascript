id: html.basics.document.web-skeleton
type: web_task
difficulty: 3
concepts:
  - { id: html.doc.skeleton, weight: 1 }
  - { id: html.doc.attributes, weight: 0.5 }
tags: [skeleton, head, title, lang, web-task, from-scratch]
estimatedSeconds: 300
prompt: |
  빈 파일에서 시작해 자기소개 페이지를 **처음부터 직접** 써 보세요. 레슨에서 배운 문서의 뼈대(doctype, `html`, `head`, `body`)를 모두 갖춰야 해요.

  1. 문서 전체가 **한국어**(`ko`)로 쓰였다는 정보를 가장 바깥 요소에 주세요.
  1. `head`에 글자 인코딩(`utf-8`)을 알려 주는 `meta` 요소를 넣으세요.
  1. 브라우저 탭에 **자기소개**라는 이름이 보여야 해요.
  1. 본문에는 가장 큰 제목 **안녕하세요**와 문단 **저는 웹 개발을 배우고 있어요.**를 차례로 넣으세요.

  doctype 선언은 미리보기 문서에서 확인할 수 없어 채점하지 않지만, 뼈대의 일부이니 맨 위에 꼭 써 주세요.
spec:
  focus: html
  starter:
    files:
      - path: index.html
        content: |
          <!-- 빈 파일이에요. 문서의 뼈대부터 직접 써 보세요. -->
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>자기소개</title>
            </head>
            <body>
              <h1>안녕하세요</h1>
              <p>저는 웹 개발을 배우고 있어요.</p>
            </body>
          </html>
  checks:
    - kind: dom
      id: lang-ko
      description: 가장 바깥 요소(html)에 한국어를 뜻하는 lang 속성이 있어야 합니다.
      requirement: 문서 언어
      visible: true
      selector: html
      expect:
        attr: { name: lang, equals: ko }
    - kind: dom
      id: charset
      description: head 안에 글자 인코딩을 utf-8로 알려 주는 meta 요소가 있어야 합니다.
      requirement: 글자 인코딩
      visible: true
      selector: 'head > meta[charset="utf-8" i]'
      expect:
        count: 1
    - kind: dom
      id: tab-title
      description: head 안에 탭 이름 "자기소개"를 정하는 요소가 있어야 합니다.
      requirement: 탭 이름
      visible: true
      selector: head > title
      expect:
        count: 1
        text: { equals: 자기소개 }
      misconceptionIfFail: html.mc.head-is-visible
    - kind: dom
      id: no-title-in-body
      description: 탭 이름을 정하는 요소는 본문(body)에 두지 않아야 합니다.
      requirement: 탭 이름
      selector: body title
      expect:
        count: 0
      misconceptionIfFail: html.mc.head-is-visible
    - kind: dom
      id: heading
      description: 본문에 가장 큰 제목 "안녕하세요"가 있어야 합니다.
      requirement: 본문
      visible: true
      selector: body > h1
      expect:
        count: 1
        text: { equals: 안녕하세요 }
    - kind: dom
      id: paragraph
      description: 본문에 문단 "저는 웹 개발을 배우고 있어요."가 제목 다음에 있어야 합니다.
      requirement: 본문
      visible: true
      selector: body > h1 + p
      expect:
        count: 1
        text: { equals: 저는 웹 개발을 배우고 있어요. }
misconceptions: [html.mc.head-is-visible]
hints:
  - 뼈대는 바깥에서 안쪽으로 써요. doctype 다음에 가장 바깥 요소가 오고, 그 안이 화면에 그리지 않는 문서 정보 부분과 화면에 보이는 본문 부분으로 나뉘어요.
  - "가장 바깥은 `html`, 그 안에 `head`와 `body`가 차례로 와요. 탭 이름(`title`)과 인코딩(`meta`)은 `head`에, 제목(`h1`)과 문단(`p`)은 `body`에 넣어요. 언어는 `html` 여는 태그의 `lang` 속성이에요."
  - "맨 위는 doctype 선언이고, 그 아래에서 `html`을 열어 `head`를 열고 닫은 뒤 `body`를 열고 닫아요. 마지막에 `html`을 닫아요. `meta`는 닫는 태그가 없는 요소이고, 인코딩 값은 `charset` 속성에 써요."
explanation: |
  예시 정답은 다음과 같아요.

  ```html
  <!doctype html>
  <html lang="ko">
    <head>
      <meta charset="utf-8" />
      <title>자기소개</title>
    </head>
    <body>
      <h1>안녕하세요</h1>
      <p>저는 웹 개발을 배우고 있어요.</p>
    </body>
  </html>
  ```

  - `<!doctype html>`은 이 문서가 HTML 표준을 따른다고 알려 줘요. 요소가 아니라서 DOM 체크로는 확인하지 않지만, 빠뜨리면 브라우저가 오래된 호환 방식으로 그려요.
  - `head`에는 화면에 그리지 않는 문서 정보를 넣어요. `meta charset`은 글자를 어떤 방식으로 읽을지, `title`은 탭에 보일 이름을 정해요. `title`을 body에 쓰면 탭 이름이 정해지지 않아요.
  - `body`에는 화면에 보이는 내용을 넣어요.
  - `lang="ko"`는 가장 바깥 요소 `html`에 줘요. 화면 낭독기는 이 정보를 보고 한국어 발음으로 읽어요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
