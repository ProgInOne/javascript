id: html.basics.document.fill-dom-repair
type: fill_blank
difficulty: 2
concepts:
  - { id: html.doc.dom-tree, weight: 1 }
tags: [dom-tree]
estimatedSeconds: 70
prompt: |
  아래 코드는 닫는 태그 `</p>`도, `html`·`head`·`body`도 쓰지 않았어요. 브라우저가 이 코드를 읽어 DOM 트리를 만들면 어떻게 될지 빈칸을 채우세요.
code: |
  <p>사과를 샀어요.
  <p>배를 샀어요.
  <p>귤을 샀어요.
spec:
  mode: text
  template: |
    body의 자식인 p 요소의 수: {{blank:count}}개
    DOM 트리에 body 요소가 있나요? (있다 / 없다): {{blank:body}}
  blanks:
    - id: count
      accept: ["3"]
      width: 3
      misconceptionMap:
        "1": html.mc.dom-is-source
    - id: body
      accept: ["있다", "있어요", "있음", "있습니다"]
      width: 6
      misconceptionMap:
        "없다": html.mc.dom-is-source
        "없어요": html.mc.dom-is-source
misconceptions: [html.mc.dom-is-source]
hints:
  - 레슨에서 `</p>`를 빠뜨린 예제를 실행했을 때 테두리가 그려진 문단이 몇 개였는지 떠올려 보세요.
  - 브라우저는 `p` 안에서 새 `<p>`를 만나면 앞 문단을 거기서 닫아요. 그러면 세 문단은 서로 안에 들어갈까요, 나란히 놓일까요?
  - DOM 트리는 코드를 글자 그대로 옮긴 것이 아니라 브라우저가 규칙에 따라 새로 만든 구조예요. 빠진 뼈대도 그 규칙에 들어 있어요.
explanation: |
  정답은 **3개**, **있다**예요. 브라우저가 만든 DOM 트리는 이래요. `p` 세 개가 모두 `body`의 자식이에요.

  ```text
  html
  ├── head
  └── body
      ├── p
      ├── p
      └── p
  ```

  - 브라우저는 `p` 안에서 새 `<p>`를 만나면 "문단 안에 문단은 들어갈 수 없다"는 규칙에 따라 앞 문단을 닫아요. 그래서 문단 세 개가 나란히 생겨요.
  - 코드에 없던 `html`, `head`, `body`도 브라우저가 스스로 채워 넣어요. 모든 문서의 DOM 트리에는 이 세 요소가 있어요.

  p가 body의 자식으로 1개뿐이고 나머지가 그 안에 들어간다고 생각했거나 body가 없다고 생각했다면, DOM 트리를 내가 쓴 코드와 똑같은 것으로 본 거예요. 그래도 브라우저가 늘 의도대로 고쳐 주지는 않으니, 닫는 태그와 뼈대는 직접 쓰는 것이 좋아요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
