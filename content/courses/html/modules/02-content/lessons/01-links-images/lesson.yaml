id: html.content.links-images
title: 링크와 이미지
summary: a와 href로 다른 페이지를 잇고, 절대·상대 경로로 파일 위치를 적으며, img와 alt로 누구나 내용을 알 수 있는 이미지를 넣습니다.
kind: lesson
importance: standard
estimatedMinutes: { read: 14, practice: 14 }
concepts:
  primary: [html.content.links, html.content.paths, html.content.images]
  practiced: [html.doc.attributes]
  reviewed: [html.doc.elements]
objectives:
  - a 요소와 href 속성으로 원하는 주소로 이동하는 링크를 만들 수 있다.
  - 폴더 구조를 보고 지금 문서에서 다른 파일까지의 상대 경로를 쓸 수 있다.
  - img 요소에 그림의 내용을 전하는 alt를 쓰고, 꾸미기용 그림과 구분할 수 있다.
practice:
  targetCount: 9
