id: html.content.links-images.fill-img-alt
type: fill_blank
difficulty: 2
concepts:
  - { id: html.content.images, weight: 1 }
  - { id: html.doc.attributes, weight: 0.3 }
tags: [img, alt, empty-element]
estimatedSeconds: 60
prompt: |
  친구가 그림 설명을 `<img src="dog.jpg">산책하는 강아지</img>`처럼 태그 사이에 썼어요. 그랬더니 "산책하는 강아지"가 그림 옆에 그냥 글자로 보여요.

  빈칸에 **속성 하나**를 채워, "산책하는 강아지"가 그림을 볼 수 없을 때 대신 전해지는 설명이 되도록 고치세요.
spec:
  mode: code
  lang: html
  template: |
    <p><img src="dog.jpg" {{blank:attr}} /></p>
  blanks:
    - id: attr
      accept: ['alt="산책하는 강아지"']
      width: 24
  checks:
    - kind: dom
      id: alt-text
      description: 그림의 대체 텍스트가 "산책하는 강아지"여야 합니다.
      requirement: 그림 설명
      visible: true
      selector: 'img[src="dog.jpg"]'
      expect:
        count: 1
        attr: { name: alt, equals: 산책하는 강아지 }
      misconceptionIfFail: html.mc.img-has-content
    - kind: dom
      id: no-loose-text
      description: 그림 옆에 설명 글자가 따로 보이면 안 됩니다.
      requirement: 그림 설명
      visible: true
      selector: p
      expect:
        text: { equals: "" }
misconceptions: [html.mc.img-has-content]
hints:
  - img가 화면에 보여 주는 내용은 글자가 아니라 그림 파일이에요. 그렇다면 설명은 태그 사이가 아니라 어디에 써야 할까요?
  - 그림을 볼 수 없을 때 대신 전할 설명은 속성으로 줘요. src는 파일 경로를 쓰는 속성이었어요.
  - 대체 텍스트 속성은 alternative(대체)의 줄임말이에요. `이름="값"` 형태로, 값에 설명을 그대로 쓰세요.
explanation: |
  정답은 **`alt="산책하는 강아지"`**예요.

  ```html
  <p><img src="dog.jpg" alt="산책하는 강아지" /></p>
  ```

  `img`는 내용이 없는 **빈 요소**라서 닫는 태그가 없어요. `</img>`를 쓰면 브라우저가 무시하고, 태그 사이에 쓴 글자는 그림 옆에 그냥 글자로 보여요. 그림의 설명은 `alt` 속성에 써야 화면 낭독기가 읽어 주고, 그림이 열리지 않을 때 그 자리에 보여요.

  `title`은 마우스를 올렸을 때 보이는 설명이라 `alt`를 대신하지 못해요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
