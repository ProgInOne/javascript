id: html.content.links-images.tf-img-content
type: true_false
difficulty: 2
concepts:
  - { id: html.content.images, weight: 1 }
  - { id: html.doc.elements, weight: 0.3 }
tags: [img, empty-element]
estimatedSeconds: 50
prompt: |
  다음 설명이 맞는지 고르고, 그렇게 판단한 이유도 고르세요.
spec:
  statement: "그림 설명은 `<img src=\"dog.jpg\">산책하는 강아지</img>`처럼 img의 여는 태그와 닫는 태그 사이에 쓴다."
  answer: false
  misconceptionIfWrong: html.mc.img-has-content
  requireReason: true
  reasons:
    - id: r1
      text: img는 내용이 없는 빈 요소라서 닫는 태그를 쓰지 않고, 그림 설명은 alt 속성에 쓴다
      correct: true
    - id: r2
      text: 그림 설명은 태그 사이가 아니라 src 속성에 파일 이름과 함께 쓴다
    - id: r3
      text: img에는 닫는 태그가 있지만, 그림 설명은 HTML에 쓸 방법이 없다
      misconception: html.mc.alt-optional
hints:
  - img 요소가 화면에 보여 주는 "내용"은 글자일까요, 그림 파일일까요?
  - 내용이 없어서 닫는 태그를 쓰지 않는 요소를 무엇이라고 불렀나요?
  - 그림의 설명은 속성으로 줘요. src는 파일 경로였어요.
explanation: |
  정답은 **거짓**, 이유는 **img는 빈 요소라서 닫는 태그가 없고, 그림 설명은 alt에 쓴다**예요.

  ```html
  <img src="dog.jpg" alt="산책하는 강아지" />
  ```

  `img`가 보여 주는 것은 `src`의 그림 파일이라 태그 사이에 넣을 내용이 없어요. 그래서 닫는 태그 없이 여는 태그 하나로 요소가 끝나요. `</img>`를 쓰면 브라우저가 무시하고, "산책하는 강아지"는 그림 옆에 그냥 글자로 보여요.

  - src에는 파일 경로만 써요.
  - 그림 설명을 쓸 방법은 있어요. 바로 `alt` 속성이에요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
