id: html.content.links-images.mcq-link-destination
type: mcq_single
difficulty: 1
concepts:
  - { id: html.content.links, weight: 1 }
tags: [link, href]
estimatedSeconds: 50
prompt: |
  아래 링크를 누르면 어디로 이동하나요?
code: |
  <a href="https://www.weather.go.kr">오늘의 날씨 보기</a>
spec:
  options:
    - id: a
      text: "`https://www.weather.go.kr`"
    - id: b
      text: "\"오늘의 날씨 보기\"라는 이름의 주소"
      misconception: html.mc.link-text-is-address
      rationale: 태그 사이의 글자는 화면에 보이는 링크 글자일 뿐이에요. 이동할 주소는 href에 있어요.
    - id: c
      text: 검색 사이트에서 "오늘의 날씨 보기"를 검색한 결과
      misconception: html.mc.link-text-is-address
      rationale: 브라우저는 링크 글자로 검색하지 않아요. href에 적힌 주소로 바로 이동해요.
    - id: d
      text: 아무 곳으로도 가지 않는다. a 요소는 글자에 밑줄만 긋는다
      rationale: a 요소는 href의 주소로 이동하는 링크를 만들어요. 밑줄은 링크의 기본 모양이에요.
  correct: a
misconceptions: [html.mc.link-text-is-address]
hints:
  - a 요소에는 화면에 보이는 부분과 브라우저에게 주는 정보가 있어요.
  - 이동할 주소는 속성에 있을까요, 태그 사이의 내용에 있을까요?
  - "`href` 속성의 값을 읽어 보세요."
explanation: |
  정답은 **`https://www.weather.go.kr`**이에요.

  a 요소에서 이동할 주소는 `href` 속성이 정해요. 태그 사이의 "오늘의 날씨 보기"는 화면에 보이는 링크 글자로, 사람에게 어디로 가는 링크인지 알려 주는 설명이에요.

  링크 글자가 주소라고 생각했다면, 속성(브라우저에게 주는 정보)과 내용(화면에 보이는 글자)을 다시 구분해 보세요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
