id: html.content.links-images.web-product-page-paths
type: web_task
difficulty: 3
concepts:
  - { id: html.content.paths, weight: 1 }
  - { id: html.content.links, weight: 0.3 }
tags: [path, relative-path, absolute-path, link, img, web-task]
estimatedSeconds: 300
prompt: |
  그릇 가게 사이트의 폴더가 아래와 같아요. 지금 고칠 문서는 **`products/mug.html`** 이에요(미리보기에는 이 문서만 보여요).

  ```text
  shop/
  ├── index.html
  ├── images/
  │   └── logo.png
  └── products/
      ├── cups.html
      └── mug.html   ← 지금 문서
  ```

  이 문서에 아래 네 가지를 만드세요.

  1. 로고 그림(`id="logo"`)이 `images` 폴더의 `logo.png`를 보여 주게 `src`를 쓰세요.
  1. "첫 페이지" 문단의 글자 전체를 `shop` 폴더의 `index.html`로 가는 링크로 만드세요.
  1. "컵 전체 보기" 문단의 글자 전체를 `products` 폴더의 `cups.html`로 가는 링크로 만드세요.
  1. "배송 안내" 문단의 글자 전체를 외부 사이트 `https://www.example.com/delivery`로 가는 링크로 만드세요.

  내 사이트 안의 파일은 **상대 경로**로 쓰세요. 글자와 `alt`는 바꾸지 마세요. (미리보기에는 그림 파일이 없어 깨진 그림으로 보이고, 링크를 눌러도 다른 페이지로 이동하지 않아요.)
spec:
  focus: html
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>하늘색 머그컵 - 동네 그릇 가게</title>
            </head>
            <body>
              <img id="logo" alt="동네 그릇 가게 로고" />
              <h1>하늘색 머그컵</h1>
              <p>350mL, 전자레인지에 쓸 수 있어요.</p>
              <p>첫 페이지</p>
              <p>컵 전체 보기</p>
              <p>배송 안내</p>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>하늘색 머그컵 - 동네 그릇 가게</title>
            </head>
            <body>
              <img id="logo" src="../images/logo.png" alt="동네 그릇 가게 로고" />
              <h1>하늘색 머그컵</h1>
              <p>350mL, 전자레인지에 쓸 수 있어요.</p>
              <p><a href="../index.html">첫 페이지</a></p>
              <p><a href="cups.html">컵 전체 보기</a></p>
              <p><a href="https://www.example.com/delivery">배송 안내</a></p>
            </body>
          </html>
  checks:
    - kind: dom
      id: logo-src
      description: 로고 그림의 src가 지금 문서(products 폴더)에서 images 폴더의 logo.png를 가리켜야 합니다.
      requirement: 로고 그림 경로
      visible: true
      selector: 'img#logo[src="../images/logo.png"], img#logo[src="./../images/logo.png"]'
      expect:
        count: 1
      misconceptionIfFail: html.mc.relative-path-base
    - kind: dom
      id: logo-alt-kept
      description: 로고 그림의 alt는 그대로여야 합니다.
      requirement: 로고 그림 경로
      selector: "#logo"
      expect:
        attr: { name: alt, equals: 동네 그릇 가게 로고 }
    - kind: dom
      id: home-link
      description: "\"첫 페이지\" 링크가 지금 문서에서 shop 폴더의 index.html을 가리켜야 합니다."
      requirement: 첫 페이지 링크
      visible: true
      selector: 'p > a[href="../index.html"], p > a[href="./../index.html"]'
      expect:
        count: 1
        text: { equals: 첫 페이지 }
      misconceptionIfFail: html.mc.relative-path-base
    - kind: dom
      id: cups-link
      description: "\"컵 전체 보기\" 링크가 지금 문서와 같은 폴더의 cups.html을 가리켜야 합니다."
      requirement: 컵 전체 보기 링크
      visible: true
      selector: 'p > a[href="cups.html"], p > a[href="./cups.html"]'
      expect:
        count: 1
        text: { equals: 컵 전체 보기 }
    - kind: dom
      id: delivery-link
      description: "\"배송 안내\" 링크가 https://www.example.com/delivery 로 이동해야 합니다."
      requirement: 배송 안내 링크
      visible: true
      selector: 'p > a[href="https://www.example.com/delivery"]'
      expect:
        count: 1
        text: { equals: 배송 안내 }
    - kind: dom
      id: link-count
      description: 링크는 모두 세 개여야 합니다.
      requirement: 링크 세 개
      selector: a
      expect:
        count: 3
misconceptions: [html.mc.relative-path-base]
hints:
  - 상대 경로의 출발점은 지금 문서 `mug.html`이 들어 있는 products 폴더예요. 가리킬 파일마다 그 폴더에서 어떻게 가는지 따져 보세요.
  - "cups.html은 mug.html과 같은 폴더에 있어요. index.html과 images 폴더는 products의 한 단계 위인 shop 폴더에 있어서 `../`로 나가야 해요."
  - 로고는 위로 한 번 나간 뒤 images 폴더로 들어가는 경로예요. 링크는 문단 안의 글자를 `a`로 감싸고, 외부 사이트는 `https://`로 시작하는 전체 주소를 그대로 써요.
explanation: |
  예시 정답은 이래요.

  ```html
  <img id="logo" src="../images/logo.png" alt="동네 그릇 가게 로고" />
  ...
  <p><a href="../index.html">첫 페이지</a></p>
  <p><a href="cups.html">컵 전체 보기</a></p>
  <p><a href="https://www.example.com/delivery">배송 안내</a></p>
  ```

  출발점은 지금 문서가 있는 **products 폴더**예요.

  - 로고: `../`로 shop 폴더로 나간 다음 `images/`로 들어가서 `logo.png`예요.
  - 첫 페이지: `../`로 shop 폴더로 나가서 `index.html`이에요.
  - 컵 전체 보기: `cups.html`은 같은 폴더에 있어서 파일 이름만 써요. `../cups.html`이라고 쓰면 shop 폴더에서 찾아서 실패해요.
  - 배송 안내: 다른 사이트라서 `https://`로 시작하는 절대 경로를 써요.

  `images/logo.png`나 `index.html`처럼 사이트 맨 위(shop) 폴더를 기준으로 썼다면, 그 경로는 shop 폴더의 문서에서만 맞아요. products 폴더의 문서에서는 products 안에서 찾으므로 그림과 페이지를 찾지 못해요.
origin: authored
