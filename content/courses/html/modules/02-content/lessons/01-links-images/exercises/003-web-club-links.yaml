id: html.content.links-images.web-club-links
type: web_task
difficulty: 2
concepts:
  - { id: html.content.links, weight: 1 }
  - { id: html.content.paths, weight: 0.5 }
tags: [link, href, path, web-task]
estimatedSeconds: 300
prompt: |
  동아리 사이트의 `index.html` 아래쪽에 "바로 가기" 문단 세 개가 있어요. 지금은 글자만 있고 눌러도 아무 데도 가지 않아요.

  각 문단의 글자 **전체**를 아래 주소로 이동하는 링크로 만드세요. 이 사이트의 파일은 모두 `index.html`과 같은 폴더에 있어요.

  | 링크 글자 | 이동할 곳 |
  |---|---|
  | 활동 사진 | 같은 폴더의 `photos.html` |
  | 가입 신청 | 같은 폴더의 `join.html` |
  | 사진 강좌 | 외부 사이트 `https://www.example.com/photo-class` |

  링크 글자는 바꾸지 마세요. (미리보기는 다른 페이지로 이동하지 않아요. 링크를 누른 뒤 미리보기 모양이 바뀌면 다시 실행하세요.)
spec:
  focus: html
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>사진 동아리</title>
            </head>
            <body>
              <h1>사진 동아리</h1>
              <p>매주 토요일, 동네를 걸으며 사진을 찍어요.</p>
              <h2>바로 가기</h2>
              <p>활동 사진</p>
              <p>가입 신청</p>
              <p>사진 강좌</p>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>사진 동아리</title>
            </head>
            <body>
              <h1>사진 동아리</h1>
              <p>매주 토요일, 동네를 걸으며 사진을 찍어요.</p>
              <h2>바로 가기</h2>
              <p><a href="photos.html">활동 사진</a></p>
              <p><a href="join.html">가입 신청</a></p>
              <p><a href="https://www.example.com/photo-class">사진 강좌</a></p>
            </body>
          </html>
  checks:
    - kind: dom
      id: photos
      description: "\"활동 사진\" 링크가 같은 폴더의 photos.html로 이동해야 합니다."
      requirement: 활동 사진 링크
      visible: true
      selector: 'p > a[href="photos.html"], p > a[href="./photos.html"]'
      expect:
        count: 1
        text: { equals: 활동 사진 }
      misconceptionIfFail: html.mc.link-text-is-address
    - kind: dom
      id: join
      description: "\"가입 신청\" 링크가 같은 폴더의 join.html로 이동해야 합니다."
      requirement: 가입 신청 링크
      visible: true
      selector: 'p > a[href="join.html"], p > a[href="./join.html"]'
      expect:
        count: 1
        text: { equals: 가입 신청 }
    - kind: dom
      id: class
      description: "\"사진 강좌\" 링크가 https://www.example.com/photo-class 로 이동해야 합니다."
      requirement: 사진 강좌 링크
      visible: true
      selector: 'p > a[href="https://www.example.com/photo-class"]'
      expect:
        count: 1
        text: { equals: 사진 강좌 }
    - kind: dom
      id: link-count
      description: 링크는 모두 세 개여야 합니다.
      requirement: 링크 세 개
      selector: a
      expect:
        count: 3
misconceptions: [html.mc.link-text-is-address]
hints:
  - 링크는 어떤 요소로 만들고, 이동할 주소는 어디에 쓰나요?
  - 문단 `p` 안에서 글자를 `a` 요소로 감싸고, 주소는 `href` 속성에 써요. 같은 폴더의 파일은 파일 이름만 쓰면 돼요.
  - "첫째 문단은 `<p><a href=\"photos.html\">활동 사진</a></p>`처럼 바꿔요. 외부 사이트는 `https://`로 시작하는 전체 주소를 써요."
explanation: |
  예시 정답은 세 문단의 글자를 각각 `a`로 감싸는 거예요.

  ```html
  <p><a href="photos.html">활동 사진</a></p>
  <p><a href="join.html">가입 신청</a></p>
  <p><a href="https://www.example.com/photo-class">사진 강좌</a></p>
  ```

  - `photos.html`과 `join.html`은 `index.html`과 **같은 폴더**에 있으니 상대 경로로 파일 이름만 써요(`./photos.html`도 같은 뜻이에요).
  - 사진 강좌는 다른 사이트에 있으니 `https://`로 시작하는 **절대 경로**를 써요.
  - 링크 글자는 태그 사이에 그대로 두고, 이동할 곳은 `href`가 정해요.

  `a`는 `p` 안에 넣어요. `<a><p>...</p></a>`처럼 문단 전체를 감싸도 링크는 되지만, 이 문제에서는 문단 안의 글자를 링크로 만드는 것이 요구사항이에요.
origin: authored
