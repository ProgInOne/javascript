id: html.content.links-images.web-club-links
type: web_task
difficulty: 3
concepts:
  - { id: html.content.links, weight: 1 }
  - { id: html.content.paths, weight: 0.5 }
tags: [link, href, path, web-task, from-scratch]
estimatedSeconds: 360
prompt: |
  사진 동아리 사이트의 첫 페이지 `index.html`을 빈 파일에서 **처음부터 직접** 써 보세요. 문서의 뼈대부터 쓰고 본문을 채우면 돼요. 이 사이트의 파일은 모두 `index.html`과 같은 폴더에 있어요.

  1. 본문 맨 위에 가장 큰 제목 **사진 동아리**를 넣으세요.
  1. 그 아래에 소제목(`h2`) **바로 가기**를 넣으세요.
  1. 소제목 아래에 문단 세 개를 두고, 각 문단의 글자 **전체**를 아래 주소로 이동하는 링크로 만드세요.

  | 링크 글자 | 이동할 곳 |
  |---|---|
  | 활동 사진 | 같은 폴더의 `photos.html` |
  | 가입 신청 | 같은 폴더의 `join.html` |
  | 사진 강좌 | 외부 사이트 `https://www.example.com/photo-class` |

  (미리보기는 다른 페이지로 이동하지 않아요. 링크를 누른 뒤 미리보기 모양이 바뀌면 다시 실행하세요.)
spec:
  focus: html
  starter:
    files:
      - path: index.html
        content: |
          <!-- 빈 파일이에요. 문서의 뼈대부터 직접 써 보세요. -->
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>사진 동아리</title>
            </head>
            <body>
              <h1>사진 동아리</h1>
              <h2>바로 가기</h2>
              <p><a href="photos.html">활동 사진</a></p>
              <p><a href="join.html">가입 신청</a></p>
              <p><a href="https://www.example.com/photo-class">사진 강좌</a></p>
            </body>
          </html>
  checks:
    - kind: dom
      id: headings
      description: 본문에 가장 큰 제목 "사진 동아리"와 소제목 "바로 가기"가 있어야 합니다.
      requirement: 제목
      visible: true
      selector: body > h1 + h2
      expect:
        count: 1
        text: { equals: 바로 가기 }
    - kind: dom
      id: photos
      description: "\"활동 사진\" 링크가 문단 안에서 같은 폴더의 photos.html로 이동해야 합니다."
      requirement: 활동 사진 링크
      visible: true
      selector: 'p > a[href="photos.html"], p > a[href="./photos.html"]'
      expect:
        count: 1
        text: { equals: 활동 사진 }
      misconceptionIfFail: html.mc.link-text-is-address
    - kind: dom
      id: join
      description: "\"가입 신청\" 링크가 문단 안에서 같은 폴더의 join.html로 이동해야 합니다."
      requirement: 가입 신청 링크
      visible: true
      selector: 'p > a[href="join.html"], p > a[href="./join.html"]'
      expect:
        count: 1
        text: { equals: 가입 신청 }
    - kind: dom
      id: class
      description: "\"사진 강좌\" 링크가 문단 안에서 https://www.example.com/photo-class 로 이동해야 합니다."
      requirement: 사진 강좌 링크
      visible: true
      selector: 'p > a[href="https://www.example.com/photo-class"]'
      expect:
        count: 1
        text: { equals: 사진 강좌 }
    - kind: dom
      id: link-count
      description: 링크는 모두 세 개여야 합니다.
      requirement: 링크 세 개
      selector: a
      expect:
        count: 3
    - kind: dom
      id: link-paragraphs
      description: 링크 세 개는 소제목 아래의 문단 세 개에 하나씩 들어 있어야 합니다.
      requirement: 링크 세 개
      visible: true
      selector: h2 ~ p:has(> a)
      expect:
        count: 3
    - kind: dom
      id: h1-text
      description: 가장 큰 제목은 "사진 동아리"여야 합니다.
      requirement: 제목
      selector: body > h1
      expect:
        count: 1
        text: { equals: 사진 동아리 }
misconceptions: [html.mc.link-text-is-address]
hints:
  - 문서의 뼈대를 먼저 쓰고, 본문에 제목 두 개와 문단 세 개를 차례로 넣어 보세요. 링크는 어떤 요소로 만들고, 이동할 주소는 어디에 쓰나요?
  - 문단 `p` 안에서 글자를 `a` 요소로 감싸고, 주소는 `href` 속성에 써요. 같은 폴더의 파일은 파일 이름만 쓰면 돼요.
  - "첫째 문단은 `<p><a href=\"photos.html\">활동 사진</a></p>`처럼 써요. 외부 사이트는 `https://`로 시작하는 전체 주소를 써요."
explanation: |
  예시 정답의 본문은 이래요.

  ```html
  <h1>사진 동아리</h1>
  <h2>바로 가기</h2>
  <p><a href="photos.html">활동 사진</a></p>
  <p><a href="join.html">가입 신청</a></p>
  <p><a href="https://www.example.com/photo-class">사진 강좌</a></p>
  ```

  - `photos.html`과 `join.html`은 `index.html`과 **같은 폴더**에 있으니 상대 경로로 파일 이름만 써요(`./photos.html`도 같은 뜻이에요).
  - 사진 강좌는 다른 사이트에 있으니 `https://`로 시작하는 **절대 경로**를 써요.
  - 링크 글자는 태그 사이에 쓰고, 이동할 곳은 `href`가 정해요. 링크 글자에 주소를 쓰는 것이 아니에요.

  `a`는 `p` 안에 넣어요. `<a><p>...</p></a>`처럼 문단 전체를 감싸도 링크는 되지만, 이 문제에서는 문단 안의 글자를 링크로 만드는 것이 요구사항이에요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
