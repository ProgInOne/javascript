id: html.content.lists-tables.multi-unordered-lists
type: mcq_multi
difficulty: 2
concepts:
  - { id: html.content.lists, weight: 1 }
tags: [list, ul, ol]
estimatedSeconds: 60
prompt: |
  다음 중 **`ul`(순서가 상관없는 목록)** 로 쓰기에 알맞은 내용을 모두 고르세요.
spec:
  options:
    - id: a
      text: 캠핑 준비물 (텐트, 침낭, 손전등)
    - id: b
      text: 이 가게에서 받는 결제 수단 (카드, 현금, 계좌 이체)
    - id: c
      text: 노래 경연 대회 최종 순위 (1위, 2위, 3위)
      rationale: 순위는 순서 자체가 뜻이에요. 순서를 바꾸면 내용이 틀려지니 ol이에요.
    - id: d
      text: 프린터 설치 과정 (상자 열기, 전원 연결, 드라이버 설치)
      rationale: 설치 과정은 순서대로 해야 하니 ol이에요.
  correct: [a, b]
hints:
  - 각 목록의 항목 순서를 섞었을 때 내용이 달라지는지 생각해 보세요.
  - 순위와 설치 과정은 순서를 바꾸면 뜻이 틀려져요.
  - 순서를 섞어도 뜻이 그대로인 목록이 ul이에요.
explanation: |
  정답은 **캠핑 준비물**과 **결제 수단**이에요.

  두 목록은 항목의 순서를 바꿔도 뜻이 같아요. 그래서 순서가 상관없는 목록인 `ul`로 써요.

  - 최종 순위는 1위가 맨 앞이라는 순서 자체가 정보예요.
  - 설치 과정은 순서대로 따라 해야 하는 단계예요.

  이 두 가지는 순서가 중요한 목록이라 `ol`로 써요. ul과 ol은 글머리 기호냐 번호냐는 모양이 아니라, 순서가 뜻을 가지는지로 골라요.
