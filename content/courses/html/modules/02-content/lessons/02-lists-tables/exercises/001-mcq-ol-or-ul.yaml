id: html.content.lists-tables.mcq-ol-or-ul
type: mcq_single
difficulty: 1
concepts:
  - { id: html.content.lists, weight: 1 }
tags: [list, ol, ul]
estimatedSeconds: 40
prompt: |
  "휴대폰 초기화 방법"을 단계별로 안내하려고 해요. 단계의 순서를 바꾸면 안 돼요. 단계들을 감쌀 요소로 가장 알맞은 것은 무엇인가요?
spec:
  options:
    - id: a
      text: "`ol`"
    - id: b
      text: "`ul`"
      rationale: ul은 순서가 상관없는 목록이에요. 순서가 중요한 단계에는 맞지 않아요.
    - id: c
      text: "`li`만 여러 개"
      misconception: html.mc.li-alone
      rationale: li는 항목일 뿐이고, 반드시 ul이나 ol 안에 넣어야 해요.
    - id: d
      text: "`p` 안에 \"1.\", \"2.\"처럼 번호를 직접 쓴다"
      rationale: 번호를 손으로 쓰면 브라우저와 화면 낭독기가 목록인지 알 수 없고, 단계를 끼워 넣을 때 번호를 모두 고쳐야 해요.
  correct: a
misconceptions: [html.mc.li-alone]
hints:
  - 이 목록은 항목의 순서가 뜻을 가지나요?
  - 순서가 상관없는 목록과 순서가 중요한 목록을 감싸는 요소가 따로 있어요.
  - "ordered list(순서 있는 목록)의 줄임말을 떠올려 보세요."
explanation: |
  정답은 **`ol`**이에요.

  초기화 단계는 순서를 바꾸면 안 되는 **순서가 중요한 목록**이에요. `ol`(ordered list)로 감싸고 각 단계를 `li`로 쓰면, 브라우저가 1, 2, 3 번호를 매겨 줘요.

  - `ul`은 장보기 목록처럼 순서가 상관없을 때 써요.
  - `li`만 쓰면 목록 상자가 없어서 잘못된 HTML이에요.
  - 번호를 직접 쓴 문단은 겉보기만 목록이고 목록이라는 뜻이 없어요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
