id: html.content.lists-tables.web-picnic-list
type: web_task
difficulty: 2
concepts:
  - { id: html.content.lists, weight: 1 }
tags: [ul, li, list, web-task]
estimatedSeconds: 180
prompt: |
  소풍 준비물을 한 문단 안에 쉼표로 이어 적었어요. 준비물을 **순서가 상관없는 목록**으로 바꾸세요.

  - "소풍 준비물"은 문단(`p`)으로 그대로 두세요.
  - 그 아래에 목록을 만들고, 준비물 세 개(도시락, 물, 돗자리)를 각각 항목 하나로 넣으세요.
  - 쉼표와 콜론(`:`)은 지우세요.
spec:
  focus: html
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>소풍</title>
            </head>
            <body>
              <h1>봄 소풍</h1>
              <p>소풍 준비물: 도시락, 물, 돗자리</p>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>소풍</title>
            </head>
            <body>
              <h1>봄 소풍</h1>
              <p>소풍 준비물</p>
              <ul>
                <li>도시락</li>
                <li>물</li>
                <li>돗자리</li>
              </ul>
            </body>
          </html>
  checks:
    - kind: dom
      id: intro-paragraph
      description: "문단에는 \"소풍 준비물\"만 남아 있어야 합니다."
      requirement: 안내 문단
      visible: true
      selector: body > p
      expect:
        count: 1
        text: { equals: 소풍 준비물 }
    - kind: dom
      id: unordered-list
      description: 순서가 상관없는 목록(ul) 바로 안에 항목이 세 개 있어야 합니다.
      requirement: 순서 없는 목록
      visible: true
      selector: ul > li
      expect:
        count: 3
    - kind: dom
      id: items-in-ul
      description: 모든 항목(li)은 목록 상자(ul 또는 ol) 바로 안에 있어야 합니다.
      requirement: 순서 없는 목록
      visible: true
      selector: li
      expect:
        count: 3
        parentSelector: "ul, ol"
      misconceptionIfFail: html.mc.li-alone
    - kind: dom
      id: item-text
      description: 항목은 차례로 도시락, 물, 돗자리여야 합니다.
      requirement: 항목 글자
      visible: true
      selector: ul
      expect:
        text: { equals: 도시락 물 돗자리 }
misconceptions: [html.mc.li-alone]
hints:
  - 준비물은 순서가 중요할까요? 순서가 중요한지에 따라 목록 요소가 달라져요.
  - 순서가 상관없는 목록은 `ul`, 그 안의 항목 하나하나는 `li`예요. `li`는 반드시 목록 상자 안에 넣어요.
  - 문단에는 "소풍 준비물"만 남기고, 그 아래에 목록 상자를 하나 만들어 준비물을 하나씩 항목으로 넣으세요. 쉼표와 콜론은 목록이 대신해요.
explanation: |
  예시 정답은 이래요.

  ```html
  <p>소풍 준비물</p>
  <ul>
    <li>도시락</li>
    <li>물</li>
    <li>돗자리</li>
  </ul>
  ```

  - 준비물은 어떤 순서로 챙겨도 되니 **순서 없는 목록** `ul`이에요. 브라우저가 항목마다 글머리 기호(•)를 붙여 줘요.
  - 항목 `li`는 항상 `ul`이나 `ol` 바로 안에 있어야 해요. `li`만 쓰면 목록 상자가 없어서 화면 낭독기가 "목록, 항목 3개"라고 알려 줄 수 없어요.

  쉼표로 이어 쓴 문장은 사람 눈에는 목록처럼 보여도, 브라우저와 화면 낭독기에게는 그냥 한 문장이에요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
