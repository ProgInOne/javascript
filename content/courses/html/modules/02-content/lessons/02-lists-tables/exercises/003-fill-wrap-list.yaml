id: html.content.lists-tables.fill-wrap-list
type: fill_blank
difficulty: 2
concepts:
  - { id: html.content.lists, weight: 1 }
  - { id: html.doc.nesting, weight: 0.3 }
tags: [list, ul, li]
estimatedSeconds: 60
prompt: |
  장보기 목록을 `li`만 써서 만들었더니 올바른 목록이 아니에요. 장보기는 어떤 순서로 사도 상관없어요.

  두 빈칸에 같은 요소 이름을 채워 세 항목을 알맞은 **목록 상자**로 감싸세요. (요소 이름만 쓰세요. 예: `div`)
spec:
  mode: code
  lang: html
  template: |
    <h2>장보기</h2>
    <{{blank:open}}>
      <li>우유</li>
      <li>달걀</li>
      <li>식빵</li>
    </{{blank:close}}>
  blanks:
    - id: open
      accept: ["ul"]
      width: 6
      misconceptionMap:
        "li": html.mc.li-alone
    - id: close
      accept: ["ul"]
      width: 6
      misconceptionMap:
        "li": html.mc.li-alone
  checks:
    - kind: dom
      id: unordered-list
      description: 항목 세 개가 순서가 상관없는 목록 상자 바로 안에 있어야 합니다.
      requirement: 순서 없는 목록
      visible: true
      selector: ul > li
      expect:
        count: 3
      misconceptionIfFail: html.mc.li-alone
misconceptions: [html.mc.li-alone]
hints:
  - li는 목록의 항목일 뿐이에요. 항목들을 담는 상자가 따로 있어야 해요.
  - 목록 상자는 순서가 중요한지에 따라 두 가지 중 하나를 골라요. 장보기 목록은 순서가 중요할까요?
  - 순서가 상관없는 목록은 unordered list의 줄임말이에요.
explanation: |
  정답은 두 빈칸 모두 **`ul`**이에요.

  ```html
  <ul>
    <li>우유</li>
    <li>달걀</li>
    <li>식빵</li>
  </ul>
  ```

  - `li`는 반드시 `ul`이나 `ol` 안에 넣는 항목이에요. 상자가 없으면 화면 낭독기가 "목록, 항목 3개"처럼 알려 주지 못하고, 브라우저가 대신 감싸 주지도 않아요.
  - 장보기는 순서를 바꿔도 뜻이 같아서 순서가 상관없는 목록인 `ul`이에요. `ol`을 쓰면 번호가 붙어서 "이 순서대로 사야 한다"는 뜻이 돼요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
