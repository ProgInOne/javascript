id: html.content.lists-tables.tf-li-alone
type: true_false
difficulty: 2
concepts:
  - { id: html.content.lists, weight: 1 }
  - { id: html.doc.nesting, weight: 0.3 }
tags: [list, li]
estimatedSeconds: 50
prompt: |
  다음 설명이 맞는지 고르고, 그렇게 판단한 이유도 고르세요.
spec:
  statement: "`<li>`는 목록의 항목이므로, `ul`이나 `ol`로 감싸지 않고 `<li>`만 여러 개 써도 올바른 목록이 된다."
  answer: false
  misconceptionIfWrong: html.mc.li-alone
  requireReason: true
  reasons:
    - id: r1
      text: li는 ul이나 ol 안에만 들어가는 항목이고, 감싸는 요소가 순서가 중요한 목록인지 아닌지를 알려 준다
      correct: true
    - id: r2
      text: li만 쓰면 브라우저가 자동으로 ol로 감싸서 번호를 매겨 준다
    - id: r3
      text: li는 표의 칸을 만드는 요소라서 목록과는 관계가 없다
hints:
  - 목록에는 "목록 상자"와 "항목" 두 가지 요소가 있었어요.
  - li만 있다면, 이 목록이 순서가 중요한 목록인지 아닌지 어떻게 알 수 있을까요?
  - 항목(li)은 반드시 목록 상자(ul 또는 ol) 안에 넣어요.
explanation: |
  정답은 **거짓**, 이유는 **li는 ul이나 ol 안에만 들어가는 항목이다**예요.

  목록은 목록 상자(`ul` 또는 `ol`)와 그 안의 항목(`li`)으로 이루어져요. 상자가 없으면 순서가 있는 목록인지 알 수 없고, 화면 낭독기도 "목록, 항목 3개"처럼 알려 주지 못해요.

  - 브라우저가 빠진 html·body는 채워 주지만, li를 ol로 감싸 주지는 않아요. 번호도 매겨지지 않아요.
  - 표의 칸은 th와 td예요.
origin: authored
