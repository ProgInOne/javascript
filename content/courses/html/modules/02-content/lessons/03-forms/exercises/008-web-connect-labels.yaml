id: html.content.forms.web-connect-labels
type: web_task
difficulty: 3
concepts:
  - { id: html.forms.labels, weight: 1 }
  - { id: html.doc.attributes, weight: 0.3 }
tags: [label, for, id, checkbox, web-task]
estimatedSeconds: 300
prompt: |
  댓글 폼에 `label`이 있지만 입력칸과 연결되어 있지 않아요. 그래서 작은 체크 상자 옆의 "비밀 댓글로 쓰기" 글자를 눌러도 체크되지 않고, 화면 낭독기는 입력칸의 이름을 알 수 없어요.

  두 `label`을 각각 알맞은 입력칸과 **연결**하세요.

  - "닉네임" → `id="nickname"`인 입력칸
  - "비밀 댓글로 쓰기" → `id="secret"`인 체크 상자

  연결 방법은 레슨에서 배운 두 가지 중 무엇을 써도 돼요. 입력칸의 `id`는 바꾸지 마세요.
spec:
  focus: html
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>댓글 쓰기</title>
            </head>
            <body>
              <h1>댓글 쓰기</h1>
              <form action="/comments">
                <p>
                  <label>닉네임</label>
                  <input id="nickname" name="nickname" type="text" />
                </p>
                <p>
                  <input id="secret" name="secret" type="checkbox" />
                  <label>비밀 댓글로 쓰기</label>
                </p>
                <button type="submit">등록</button>
              </form>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>댓글 쓰기</title>
            </head>
            <body>
              <h1>댓글 쓰기</h1>
              <form action="/comments">
                <p>
                  <label for="nickname">닉네임</label>
                  <input id="nickname" name="nickname" type="text" />
                </p>
                <p>
                  <input id="secret" name="secret" type="checkbox" />
                  <label for="secret">비밀 댓글로 쓰기</label>
                </p>
                <button type="submit">등록</button>
              </form>
            </body>
          </html>
  checks:
    - kind: dom
      id: nickname-label
      description: "\"닉네임\" label이 id가 nickname인 입력칸과 연결되어 있어야 합니다(for 또는 감싸기)."
      requirement: 닉네임 연결
      visible: true
      selector: 'label[for="nickname"], label:has(#nickname)'
      expect:
        count: { min: 1 }
        text: { includes: 닉네임 }
      misconceptionIfFail: html.mc.label-just-text
    - kind: dom
      id: secret-label
      description: "\"비밀 댓글로 쓰기\" label이 id가 secret인 체크 상자와 연결되어 있어야 합니다(for 또는 감싸기)."
      requirement: 체크 상자 연결
      visible: true
      selector: 'label[for="secret"], label:has(#secret)'
      expect:
        count: { min: 1 }
        text: { includes: 비밀 댓글로 쓰기 }
      misconceptionIfFail: html.mc.label-just-text
    - kind: dom
      id: ids-kept
      description: 두 입력칸의 id(nickname, secret)는 그대로 있어야 합니다.
      requirement: id 유지
      selector: "input#nickname, input#secret"
      expect:
        count: 2
misconceptions: [html.mc.label-just-text]
hints:
  - label은 쓰기만 해서는 그냥 글자예요. 어느 입력칸의 이름표인지 알려 줘야 해요.
  - "label의 `for` 속성에 연결할 입력칸의 `id` 값을 쓰면 돼요. 아니면 label 안에 input을 넣어도 돼요."
  - "첫째 label은 `<label for=\"nickname\">닉네임</label>`처럼 바꿔요. 체크 상자의 id는 `secret`이에요."
explanation: |
  예시 정답은 두 label에 `for`를 추가하는 거예요.

  ```html
  <label for="nickname">닉네임</label>
  <input id="nickname" name="nickname" type="text" />

  <input id="secret" name="secret" type="checkbox" />
  <label for="secret">비밀 댓글로 쓰기</label>
  ```

  `for`의 값이 input의 `id`와 같으면 둘이 연결돼요. 고친 뒤 미리보기에서 "비밀 댓글로 쓰기" 글자를 눌러 보세요. 작은 체크 상자를 정확히 누르지 않아도 체크돼요.

  label 안에 input을 넣는 방법도 정답이에요.

  ```html
  <label><input id="secret" name="secret" type="checkbox" /> 비밀 댓글로 쓰기</label>
  ```

  label이 input보다 뒤에 있어도 괜찮아요. 연결은 위치가 아니라 `for`와 `id`(또는 감싸기)로 정해져요.
origin: authored
review:
