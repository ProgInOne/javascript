id: html.content.forms.tf-button-submits
type: true_false
difficulty: 2
concepts:
  - { id: html.forms.buttons, weight: 1 }
tags: [button, type, submit]
estimatedSeconds: 50
prompt: |
  다음 설명이 맞는지 고르고, 그렇게 판단한 이유도 고르세요.
spec:
  statement: "form 안에 `type` 속성 없이 `<button>확인</button>`만 쓰면, 이 버튼은 눌러도 아무 일도 일어나지 않는다."
  answer: false
  misconceptionIfWrong: html.mc.button-does-nothing
  requireReason: true
  reasons:
    - id: r1
      text: form 안의 button은 type을 쓰지 않으면 submit이라서, 누르면 폼을 보낸다
      correct: true
    - id: r2
      text: type이 없는 button은 reset이라서, 누르면 입력값을 모두 지운다
    - id: r3
      text: button은 JavaScript를 연결해야만 동작하므로, type과 관계없이 아무 일도 하지 않는다
      misconception: html.mc.button-does-nothing
hints:
  - form 안의 button이 가질 수 있는 type 세 가지를 떠올려 보세요.
  - type을 쓰지 않았을 때 어떤 type으로 동작하나요?
  - 레슨의 "저장" 버튼 예제를 떠올려 보세요. type이 없었어요.
explanation: |
  정답은 **거짓**, 이유는 **form 안의 button은 type을 쓰지 않으면 submit이라서 누르면 폼을 보낸다**예요.

  type을 쓰지 않은 button은 기본값인 `submit`으로 동작해요. 누르면 폼이 보내지고 페이지가 새로 열리면서 입력한 내용이 사라져요.

  - 기본값은 reset이 아니에요. reset은 `type="reset"`이라고 써야 해요.
  - JavaScript가 없어도 submit 버튼은 폼을 보내요. 아무 일도 하지 않는 버튼을 만들려면 `type="button"`을 써야 해요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
