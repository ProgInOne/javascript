id: html.content.forms.tf-placeholder-label
type: true_false
difficulty: 2
concepts:
  - { id: html.forms.labels, weight: 1 }
tags: [label, placeholder]
estimatedSeconds: 50
prompt: |
  다음 설명이 맞는지 고르고, 그렇게 판단한 이유도 고르세요.
spec:
  statement: "입력칸에 `placeholder=\"이름\"`을 써서 칸 안에 \"이름\"이 흐리게 보이면, label은 쓰지 않아도 된다."
  answer: false
  misconceptionIfWrong: html.mc.placeholder-is-label
  requireReason: true
  reasons:
    - id: r1
      text: placeholder는 입력을 시작하면 사라지는 예시 글자라서, 입력칸의 이름표 역할을 대신하지 못한다
      correct: true
    - id: r2
      text: placeholder와 label은 같은 역할이지만, label이 더 크게 보여서 쓰는 것이 좋다
      misconception: html.mc.placeholder-is-label
    - id: r3
      text: placeholder는 form 안에서 쓸 수 없는 속성이다
hints:
  - 입력칸에 글자를 몇 개 쓰고 나면 placeholder는 어떻게 되나요?
  - 입력하는 도중에도 이 칸이 무엇을 쓰는 칸인지 알 수 있어야 해요.
  - placeholder는 입력 예시, label은 이름표예요.
explanation: |
  정답은 **거짓**, 이유는 **placeholder는 입력을 시작하면 사라지는 예시 글자라서 이름표를 대신하지 못한다**예요.

  placeholder는 글자를 입력하는 순간 사라져서, 입력하다 보면 무엇을 쓰는 칸이었는지 알 수 없어요. 흐린 색이라 잘 보이지 않기도 하고, 입력칸의 이름으로 쓰이지 않을 수도 있어요.

  - label은 크기 때문에 쓰는 것이 아니라, 입력칸과 연결되어 이름표 역할을 하기 때문에 써요.
  - placeholder는 form 안에서도 쓸 수 있어요. 다만 `예: 김하늘`처럼 입력 예시에 써요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
