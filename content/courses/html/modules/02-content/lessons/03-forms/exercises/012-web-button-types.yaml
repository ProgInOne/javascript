id: html.content.forms.web-button-types
type: web_task
difficulty: 2
concepts:
  - { id: html.forms.buttons, weight: 1 }
tags: [button, type, form, web-task]
estimatedSeconds: 200
prompt: |
  회원 가입 폼에 버튼이 세 개 있는데, 모두 `type`을 쓰지 않아서 어느 버튼을 눌러도 폼이 보내져요. 각 버튼이 이름에 맞는 일을 하도록 `type` 속성을 주세요.

  1. "가입하기"를 누르면 폼을 **보내야** 해요.
  1. "모두 지우기"를 누르면 입력값을 **처음으로 되돌려야** 해요.
  1. "도움말"은 나중에 JavaScript로 할 일을 붙일 버튼이라, 지금은 눌러도 **아무 일도 하지 않아야** 해요.

  버튼의 글자와 순서는 바꾸지 마세요.
spec:
  focus: html
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>회원 가입</title>
            </head>
            <body>
              <h1>회원 가입</h1>
              <form action="/signup">
                <label for="nickname">별명</label>
                <input id="nickname" name="nickname" type="text" />
                <button>가입하기</button>
                <button>모두 지우기</button>
                <button>도움말</button>
              </form>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>회원 가입</title>
            </head>
            <body>
              <h1>회원 가입</h1>
              <form action="/signup">
                <label for="nickname">별명</label>
                <input id="nickname" name="nickname" type="text" />
                <button type="submit">가입하기</button>
                <button type="reset">모두 지우기</button>
                <button type="button">도움말</button>
              </form>
            </body>
          </html>
  checks:
    - kind: dom
      id: three-buttons
      description: form 안에 버튼이 세 개 있어야 합니다.
      requirement: 버튼 유지
      selector: form button
      expect:
        count: 3
    - kind: dom
      id: submit-button
      description: "\"가입하기\" 버튼의 type이 폼을 보내는 값이어야 합니다."
      requirement: 가입하기는 보내기
      visible: true
      selector: form button:nth-of-type(1)
      expect:
        text: { equals: 가입하기 }
        attr: { name: type, equals: submit }
    - kind: dom
      id: reset-button
      description: "\"모두 지우기\" 버튼의 type이 입력값을 되돌리는 값이어야 합니다."
      requirement: 모두 지우기는 되돌리기
      visible: true
      selector: form button:nth-of-type(2)
      expect:
        text: { equals: 모두 지우기 }
        attr: { name: type, equals: reset }
    - kind: dom
      id: plain-button
      description: "\"도움말\" 버튼의 type이 아무 일도 하지 않는 값이어야 합니다."
      requirement: 도움말은 아무 일도 안 함
      visible: true
      selector: form button:nth-of-type(3)
      expect:
        text: { equals: 도움말 }
        attr: { name: type, equals: button }
      misconceptionIfFail: html.mc.button-does-nothing
misconceptions: [html.mc.button-does-nothing]
hints:
  - form 안의 `button`은 `type`에 따라 하는 일이 달라요. `type`을 안 쓰면 어떤 일을 하는지 레슨의 표를 떠올려 보세요.
  - "`type`의 값은 세 가지예요: 폼을 보내는 값, 입력값을 되돌리는 값, 아무 일도 하지 않는 값."
  - "세 값은 `submit`, `reset`, `button`이에요. 버튼 이름의 뜻(보내기, 되돌리기, 아무 일도 안 함)에 맞춰 각 버튼의 여는 태그 안에 `type=\"…\"`로 써요."
explanation: |
  예시 정답은 이래요.

  ```html
  <button type="submit">가입하기</button>
  <button type="reset">모두 지우기</button>
  <button type="button">도움말</button>
  ```

  | type | 누르면 |
  |---|---|
  | `submit` | 폼을 보내요(form 안에서 `type`을 안 쓰면 이것) |
  | `reset` | 입력값을 모두 처음으로 되돌려요 |
  | `button` | 아무 일도 하지 않아요. JavaScript로 할 일을 붙일 때 써요 |

  "가입하기"는 기본값으로도 폼을 보내지만, `type="submit"`을 적어 두면 코드를 읽는 사람이 바로 알 수 있어요. 반대로 "도움말"에 `type`을 쓰지 않으면 누를 때마다 폼이 보내지고 입력한 내용이 사라져요. form 안의 버튼은 아무 일도 하지 않을 거라고 생각하기 쉽지만, 기본값이 `submit`이라는 점을 꼭 기억하세요.
