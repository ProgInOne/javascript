id: html.content.forms.web-search-form
type: web_task
difficulty: 3
concepts:
  - { id: html.forms.form, weight: 1 }
  - { id: html.forms.inputs, weight: 0.3 }
tags: [form, action, name, web-task]
estimatedSeconds: 300
prompt: |
  도서관 사이트에 책 검색 칸을 만들고 있어요. 입력칸과 버튼은 있는데, 버튼을 눌러도 검색어가 아무 데도 보내지지 않아요.

  아래 요구사항에 맞게 고치세요.

  1. 입력칸과 버튼을 **폼**으로 묶어서, 폼을 보내면 검색어가 `/search` 주소로 가게 하세요.
  1. 서버가 검색어를 알아볼 수 있게, 입력칸의 값에 `q`라는 **이름**을 붙이세요.

  `label`, 입력칸의 `id`와 `type`, 버튼은 그대로 두세요. (고친 뒤 미리보기에서 검색 버튼을 누르면 폼이 보내지면서 빈 화면이 돼요. 실제 전송은 막혀 있으니 다시 실행하면 돼요.)
spec:
  focus: html
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>책 검색</title>
            </head>
            <body>
              <h1>우리 동네 도서관</h1>
              <label for="q">책 제목</label>
              <input id="q" type="search" />
              <button type="submit">검색</button>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>책 검색</title>
            </head>
            <body>
              <h1>우리 동네 도서관</h1>
              <form action="/search">
                <label for="q">책 제목</label>
                <input id="q" name="q" type="search" />
                <button type="submit">검색</button>
              </form>
            </body>
          </html>
  checks:
    - kind: dom
      id: form-action
      description: 보낼 주소가 /search인 폼이 하나 있어야 합니다.
      requirement: 폼으로 묶기
      visible: true
      selector: 'form[action="/search"]'
      expect:
        count: 1
    - kind: dom
      id: input-in-form
      description: 검색어 입력칸(#q)이 폼 안에 있어야 합니다.
      requirement: 폼으로 묶기
      visible: true
      selector: "form #q"
      expect:
        count: 1
        tag: input
    - kind: dom
      id: button-in-form
      description: 검색 버튼이 폼 안에 있어야 합니다.
      requirement: 폼으로 묶기
      visible: true
      selector: form button
      expect:
        count: 1
    - kind: dom
      id: input-name
      description: 입력칸의 값에 q라는 이름(name)이 붙어 있어야 합니다.
      requirement: 값의 이름
      visible: true
      selector: "#q"
      expect:
        attr: { name: name, equals: q }
    - kind: dom
      id: type-kept
      description: 입력칸의 type은 search 그대로여야 합니다.
      requirement: 그대로 두기
      selector: "#q"
      expect:
        attr: { name: type, equals: search }
hints:
  - 여러 입력 요소를 묶어서 한꺼번에 보내는 상자 요소가 있어요. 보낼 주소는 그 요소의 속성으로 정해요.
  - "`form` 요소로 label, input, button을 모두 감싸고, `action` 속성에 보낼 주소를 써요. 값의 이름은 input의 `name` 속성이에요."
  - "`<form action=\"/search\">`와 `</form>` 사이에 세 요소를 넣고, input에 `name=\"q\"`를 추가해 보세요."
explanation: |
  예시 정답은 이래요.

  ```html
  <form action="/search">
    <label for="q">책 제목</label>
    <input id="q" name="q" type="search" />
    <button type="submit">검색</button>
  </form>
  ```

  - **form으로 묶기**: 입력칸과 버튼이 form 안에 있어야 폼을 보낼 때 검색어가 함께 가요. form 밖의 버튼은 보낼 폼이 없어서 눌러도 아무 일이 일어나지 않아요.
  - **action**: 폼을 보낼 주소예요. "해리 포터"를 검색하면 브라우저는 `/search?q=해리 포터` 같은 주소로 이동해요(공백 같은 글자는 주소용 기호로 바뀌어 보내져요).
  - **name**: 보낼 때 값에 붙는 이름이에요. `id`는 HTML 안에서 요소를 찾을 때(label 연결 등) 쓰고, 서버로 보낼 때의 이름은 `name`이에요. 둘이 같은 값이어도 괜찮아요.
origin: authored
