id: html.content.forms.try-club-signup-form
type: web_task
difficulty: 2
usage: try
concepts:
  - { id: html.forms.labels, weight: 1 }
  - { id: html.forms.inputs, weight: 0.5 }
  - { id: html.forms.buttons, weight: 0.5 }
tags: [form, label, input, type, button, web-task]
estimatedSeconds: 360
prompt: |
  동아리 가입 신청 폼의 안쪽을 직접 써 보세요. `form`은 이미 있어요. 주석 자리에 쓰면 돼요.

  1. 이름표 **전화번호**와 전화번호 입력칸. 입력칸의 `id`는 `phone`이고, **전화번호를 받는** 종류(`type`)로 하세요.
  1. 이름표 **학년**과 학년 입력칸. 입력칸의 `id`는 `grade`이고, 숫자만 받는 종류로 하세요.
  1. 두 이름표는 `for`와 `id`로 각 입력칸에 연결하세요.
  1. 맨 아래에 **신청하기** 버튼. 누르면 폼을 보내도록 `type`을 직접 써 주세요.

  (미리보기는 폼을 실제로 전송하지 않아요. 버튼을 누른 뒤 모양이 바뀌면 다시 실행하세요.)
spec:
  focus: html
  starter:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>동아리 가입 신청</title>
            </head>
            <body>
              <h1>동아리 가입 신청</h1>
              <form action="/join">
                <!-- 1. 전화번호 이름표와 입력칸 (id: phone) -->

                <!-- 2. 학년 이름표와 입력칸 (id: grade) -->

                <!-- 3. 폼을 보내는 "신청하기" 버튼 -->
              </form>
            </body>
          </html>
  solution:
    files:
      - path: index.html
        content: |
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <title>동아리 가입 신청</title>
            </head>
            <body>
              <h1>동아리 가입 신청</h1>
              <form action="/join">
                <p>
                  <label for="phone">전화번호</label>
                  <input id="phone" name="phone" type="tel" />
                </p>
                <p>
                  <label for="grade">학년</label>
                  <input id="grade" name="grade" type="number" />
                </p>
                <button type="submit">신청하기</button>
              </form>
            </body>
          </html>
  checks:
    - kind: dom
      id: phone-type
      description: 폼 안에 id가 phone인 입력칸이 있고, 종류는 전화번호(tel)여야 합니다.
      requirement: 전화번호 칸
      visible: true
      selector: form input#phone
      expect:
        count: 1
        attr: { name: type, equals: tel }
      misconceptionIfFail: html.mc.input-type-looks-only
    - kind: dom
      id: phone-label
      description: 이름표 "전화번호"가 for="phone"으로 전화번호 칸에 연결되어야 합니다.
      requirement: 전화번호 칸
      visible: true
      selector: form label[for="phone"]
      expect:
        count: 1
        text: { equals: 전화번호 }
      misconceptionIfFail: html.mc.label-just-text
    - kind: dom
      id: grade-type
      description: 폼 안에 id가 grade인 입력칸이 있고, 종류는 숫자(number)여야 합니다.
      requirement: 학년 칸
      visible: true
      selector: form input#grade
      expect:
        count: 1
        attr: { name: type, equals: number }
      misconceptionIfFail: html.mc.input-type-looks-only
    - kind: dom
      id: grade-label
      description: 이름표 "학년"이 for="grade"로 학년 칸에 연결되어야 합니다.
      requirement: 학년 칸
      visible: true
      selector: form label[for="grade"]
      expect:
        count: 1
        text: { equals: 학년 }
      misconceptionIfFail: html.mc.label-just-text
    - kind: dom
      id: submit-button
      description: 폼 안에 type="submit"인 "신청하기" 버튼이 하나 있어야 합니다.
      requirement: 신청 버튼
      visible: true
      selector: form button
      expect:
        count: 1
        text: { equals: 신청하기 }
        attr: { name: type, equals: submit }
misconceptions: [html.mc.input-type-looks-only, html.mc.label-just-text]
hints:
  - 이름표는 `label`, 입력칸은 `input`, 버튼은 `button`이에요. 이름표와 입력칸은 어떤 두 속성으로 연결했었나요?
  - "`label`의 `for` 값과 `input`의 `id` 값을 같게 써요. 전화번호는 `type=\"tel\"`(휴대폰에서 숫자 자판이 떠요), 숫자만 받으려면 `type=\"number\"`예요."
  - "`<label for=\"phone\">전화번호</label>` 다음에 `<input id=\"phone\" type=\"tel\" />`을 써요. 학년도 같은 모양으로 쓰고, 마지막에 `<button type=\"submit\">신청하기</button>`을 써요."
explanation: |
  예시 답안의 폼 안쪽은 이래요.

  ```html
  <label for="phone">전화번호</label>
  <input id="phone" name="phone" type="tel" />

  <label for="grade">학년</label>
  <input id="grade" name="grade" type="number" />

  <button type="submit">신청하기</button>
  ```

  - `for`와 `id`를 같은 값으로 쓰면 이름표를 눌러도 입력칸에 커서가 들어가고, 화면 낭독기가 칸의 이름을 읽어 줘요.
  - `tel`은 휴대폰에서 숫자 자판을 띄우고, `number`는 숫자가 아닌 값을 거부해요. `type`은 모양만이 아니라 입력 방식과 검사까지 바꿔요.
  - `name`은 보낼 때 값에 붙는 이름이라 써 두면 좋아요(이 연습에서는 채점하지 않아요).
  - form 안의 버튼은 `type`을 안 써도 submit이지만, 직접 써 두면 뜻이 분명해요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
