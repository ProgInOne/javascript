id: html.content.forms.check-reset-button
type: mcq_single
difficulty: 1
usage: check
concepts:
  - { id: html.forms.buttons, weight: 1 }
tags: [button, type, reset]
estimatedSeconds: 45
prompt: |
  설문 폼에 답을 몇 개 쓴 뒤, 폼 안의 `<button type="reset">다시 쓰기</button>`을 눌렀어요. 어떻게 되나요?
spec:
  options:
    - id: a
      text: 입력한 답이 모두 처음 상태로 되돌아가고, 폼은 보내지지 않는다
    - id: b
      text: 입력한 답을 그대로 담아 폼을 보낸다
      rationale: 폼을 보내는 것은 submit 버튼이에요. reset은 입력값을 되돌려요.
    - id: c
      text: JavaScript를 붙이기 전이라 아무 일도 일어나지 않는다
      misconception: html.mc.button-does-nothing
      rationale: 아무 일도 하지 않는 버튼은 type="button"이에요. reset은 JavaScript 없이도 입력값을 되돌려요.
    - id: d
      text: 마지막으로 쓴 입력칸 하나만 지워진다
      rationale: reset은 폼 안의 모든 입력값을 한꺼번에 처음으로 되돌려요.
  correct: a
misconceptions: [html.mc.button-does-nothing]
hints:
  - form 안의 button은 type에 따라 하는 일이 달라요. 세 가지 type을 떠올려 보세요.
  - submit은 보내기, button은 아무 일도 안 하기예요. 남은 하나는요?
  - reset은 "처음으로 되돌리기"라는 뜻이에요.
explanation: |
  정답은 **입력한 답이 모두 처음 상태로 되돌아가고, 폼은 보내지지 않는다**예요.

  `type="reset"` 버튼은 폼 안의 입력값을 **모두 처음으로 되돌려요**. 폼을 보내는 것은 `submit`(type을 안 쓰면 이것), 아무 일도 하지 않는 것은 `type="button"`이에요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
