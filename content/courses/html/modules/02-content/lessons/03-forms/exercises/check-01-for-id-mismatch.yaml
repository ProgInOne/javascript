id: html.content.forms.check-for-id-mismatch
type: mcq_single
difficulty: 1
usage: check
concepts:
  - { id: html.forms.labels, weight: 1 }
tags: [label, for, id]
estimatedSeconds: 60
prompt: |
  배송 정보 폼에 아래처럼 썼어요. 화면에서 "사는 도시" 글자를 누르면 어떻게 되나요?
code: |
  <label for="city">사는 도시</label>
  <input id="town" type="text" />
spec:
  options:
    - id: a
      text: 입력칸에 커서가 들어가지 않는다. for와 id의 값이 달라서 연결되지 않았기 때문이다
    - id: b
      text: label 바로 다음에 있는 입력칸이라서 커서가 들어간다
      misconception: html.mc.label-just-text
      rationale: label은 위치가 아니라 for와 id의 값이 같을 때 연결돼요.
    - id: c
      text: 입력칸에 "사는 도시"라는 글자가 저절로 채워진다
      rationale: label은 입력칸의 이름표예요. 입력칸에 글자를 넣지 않아요.
    - id: d
      text: 브라우저가 오류를 띄우고 폼을 보여 주지 않는다
      rationale: 연결이 안 되어도 오류 없이 화면에 그려져요. 이름표 역할만 하지 못해요.
  correct: a
misconceptions: [html.mc.label-just-text]
hints:
  - label과 입력칸은 어떤 두 속성의 값으로 연결되나요?
  - label의 for 값과 input의 id 값을 나란히 비교해 보세요.
  - "`city`와 `town`은 같은 값인가요?"
explanation: |
  정답은 **커서가 들어가지 않는다**예요.

  `label`의 `for` 값과 입력칸의 `id` 값이 **같아야** 둘이 연결돼요. 여기서는 `city`와 `town`으로 달라서, 바로 옆에 있어도 연결되지 않은 그냥 글자예요. 그래서 글자를 눌러도 커서가 가지 않고, 화면 낭독기도 입력칸의 이름을 읽어 주지 못해요. 둘 중 하나를 고쳐 값을 맞추면 돼요.
origin: authored
review:
  status: approved
  draftedBy: ai:claude
  reviewedBy: ai:reviewer
