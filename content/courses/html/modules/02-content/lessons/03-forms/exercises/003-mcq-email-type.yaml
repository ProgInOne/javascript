id: html.content.forms.mcq-email-type
type: mcq_single
difficulty: 1
concepts:
  - { id: html.forms.inputs, weight: 1 }
tags: [input, type, email]
estimatedSeconds: 40
prompt: |
  뉴스레터 신청 폼에 **이메일 주소**를 입력받는 칸을 만들려고 해요. `@`가 빠진 주소는 브라우저가 보내기 전에 알려 주면 좋겠어요. 어떤 코드가 가장 알맞은가요?
spec:
  options:
    - id: a
      text: '`<input type="email" />`'
    - id: b
      text: '`<input type="text" />`'
      misconception: html.mc.input-type-looks-only
      rationale: text는 어떤 글자든 받아서, @가 없어도 검사하지 않아요.
    - id: c
      text: '`<input type="password" />`'
      rationale: password는 입력한 글자를 가리는 비밀번호 칸이에요. 이메일 형식을 검사하지 않아요.
    - id: d
      text: '`<email>이메일</email>`'
      rationale: HTML에는 email이라는 요소가 없어요. 입력칸은 input 요소에 type으로 종류를 정해요.
  correct: a
misconceptions: [html.mc.input-type-looks-only]
hints:
  - 입력칸은 어떤 요소로 만들고, 받을 값의 종류는 어디에 쓰나요?
  - type에 따라 브라우저가 입력값을 검사해 주기도 해요.
  - 받을 값의 종류 이름을 그대로 type 값으로 쓰는 경우가 많아요.
explanation: |
  정답은 **`<input type="email" />`**이에요.

  `type="email"`이면 브라우저가 폼을 보내기 전에 `@`가 있는 이메일 모양인지 검사하고, 휴대폰에서는 `@` 키가 있는 자판을 보여 줘요.

  - `type="text"`는 겉보기는 비슷하지만 아무 검사도 하지 않아요. type이 모양만 바꾼다고 생각하면 이 차이를 놓쳐요.
  - `type="password"`는 비밀번호용이라 글자를 가려요.
  - `<email>`이라는 요소는 없어요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
