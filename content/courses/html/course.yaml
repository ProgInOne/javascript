id: html
title: HTML 핵심
summary: 의미 있는 구조의 HTML 문서를 작성하고, 브라우저가 이를 DOM 트리로 해석한다는 것을 이해합니다.
language: html
level: intro
depth: core
status: published
objectives:
  - 브라우저가 서버에서 HTML을 받아 화면에 그리는 흐름과 HTML·CSS·JavaScript의 역할을 설명할 수 있다.
  - 요소·태그·속성을 구분하고, 올바르게 중첩된 HTML 문서의 뼈대를 작성할 수 있다.
  - 제목·문단·링크·이미지·목록·표·폼을 뜻에 맞는 요소로 작성할 수 있다.
  - 페이지를 header·nav·main·footer 같은 시맨틱 요소로 구조화하고, div와 구분해 쓸 수 있다.
modules: [basics, content, semantics]
