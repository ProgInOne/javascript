# JavaScript 개념
# 선수 관계는 직접 필요한 것만 적습니다(추이적 관계는 적지 않음).

# ── 모듈 1. 시작하기: first-program ──

- id: js.basics.statements
  title: 문장과 실행 순서
  importance: standard
  summary: 프로그램은 문장의 목록이고, 위에서 아래로 한 문장씩 차례대로 실행돼요. 문장 끝은 세미콜론(;)으로 표시해요.
  misconceptions: [js.mc.expression-prints-itself]
  mdn: Web/JavaScript/Reference/Statements

- id: js.basics.console-log
  title: console.log로 출력하기
  importance: standard
  summary: console.log(값)은 괄호 안의 값을 콘솔에 보여 줘요. 결과를 눈으로 확인하는 가장 기본적인 방법이에요.
  prerequisites: [js.basics.statements]
  misconceptions: [js.mc.log-prints-quotes, js.mc.quoted-expression-evaluates, js.mc.log-is-return]
  mdn: Web/API/console/log_static

- id: js.basics.comments
  title: 주석
  importance: minor
  summary: "// 뒤의 내용이나 /* */ 사이의 내용은 실행되지 않는 메모(주석)예요."
  prerequisites: [js.basics.statements]
  misconceptions: [js.mc.line-comment-multiline]
  mdn: Web/JavaScript/Guide/Grammar_and_types

# ── 모듈 1. 시작하기: reading-errors ──

- id: js.errors.error-messages
  title: 오류 메시지 읽기
  importance: standard
  summary: 오류 메시지는 종류, 설명, 위치(파일과 줄 번호)로 이루어져 있고, 실행 중 오류가 나면 프로그램은 그 자리에서 멈춰요.
  prerequisites: [js.basics.console-log]
  misconceptions: [js.mc.code-after-error-runs, js.mc.error-line-is-cause]
  mdn: Web/JavaScript/Reference/Errors

- id: js.errors.error-types
  title: 오류의 종류
  importance: standard
  summary: SyntaxError는 문법을 어겨 프로그램이 아예 시작되지 않는 오류, ReferenceError는 없는 이름을 쓴 오류, TypeError는 값을 할 수 없는 방식으로 쓴 오류예요.
  prerequisites: [js.errors.error-messages]
  misconceptions: [js.mc.syntax-error-partial-run, js.mc.typo-is-syntax-error]
  mdn: Web/JavaScript/Reference/Global_Objects/Error

# ── 모듈 2. 값과 변수: variables ──

- id: js.values.let
  title: let으로 변수 만들기
  importance: core
  summary: let 이름 = 값; 으로 값에 이름을 붙여 저장하고, 그 이름으로 값을 꺼내 써요. let 변수는 나중에 다른 값을 넣을 수 있어요.
  prerequisites: [js.basics.console-log]
  misconceptions: [js.mc.variable-name-in-quotes, js.mc.let-again-to-change, js.mc.let-needs-initial-value]
  mdn: Web/JavaScript/Reference/Statements/let

- id: js.values.assignment
  title: 대입
  importance: core
  summary: "=는 \"같다\"가 아니라 오른쪽 값을 계산해 왼쪽 변수에 넣는 대입이에요. 대입은 그 순간의 값을 복사할 뿐, 변수끼리 연결하지 않아요."
  prerequisites: [js.values.let]
  misconceptions: [js.mc.assign-is-equality, js.mc.assign-direction, js.mc.variable-remembers-formula]
  mdn: Web/JavaScript/Reference/Operators/Assignment

- id: js.values.const
  title: const로 상수 만들기
  importance: core
  summary: const로 만든 이름에는 처음 넣은 값 대신 다른 값을 다시 대입할 수 없어요. 선언할 때 반드시 값을 넣어야 해요.
  prerequisites: [js.values.assignment, { id: js.errors.error-types, strength: helpful }]
  misconceptions: [js.mc.const-can-reassign, js.mc.const-declare-later, js.mc.const-is-immutable]
  mdn: Web/JavaScript/Reference/Statements/const

- id: js.values.identifiers
  title: 변수 이름 규칙
  importance: standard
  summary: 이름은 글자·숫자·_·$로 쓰되 숫자로 시작할 수 없고, 공백·하이픈과 예약어는 쓸 수 없어요. 대문자와 소문자는 다른 글자로 구분해요.
  prerequisites: [js.values.let]
  misconceptions: [js.mc.identifier-case-insensitive, js.mc.identifier-invalid-chars]
  mdn: Web/JavaScript/Guide/Grammar_and_types

# ── 모듈 2. 값과 변수: data-types ──

- id: js.types.primitives
  title: 값의 종류(원시 자료형)
  importance: core
  summary: 모든 값에는 종류(자료형)가 있어요. 숫자 5와 글자 "5"는 겉모습이 비슷해도 자료형이 다른 값이에요. 자료형은 변수가 아니라 값에 붙어 있어서, 한 변수에 다른 자료형의 값을 다시 넣을 수 있어요.
  prerequisites: [js.values.assignment]
  misconceptions: [js.mc.quoted-number-is-number, js.mc.type-belongs-to-variable, js.mc.same-output-same-type]
  mdn: Web/JavaScript/Guide/Data_structures

- id: js.types.number
  title: 숫자(number)
  importance: standard
  summary: 정수와 소수는 모두 같은 number 자료형이에요. 숫자에는 따옴표를 붙이지 않고, 1,000처럼 쉼표로 자릿수를 나누지 않아요.
  prerequisites: [js.types.primitives]
  misconceptions: [js.mc.decimal-separate-type, js.mc.number-with-comma]
  mdn: Web/JavaScript/Reference/Global_Objects/Number

- id: js.types.string
  title: 문자열(string)
  importance: standard
  summary: 따옴표로 감싼 글자는 문자열이에요. 작은따옴표와 큰따옴표 중 무엇을 써도 같은 문자열이지만, 여는 따옴표와 닫는 따옴표는 같은 종류여야 해요.
  prerequisites: [js.types.primitives]
  misconceptions: [js.mc.quote-kinds-differ, js.mc.quotes-mismatch]
  mdn: Web/JavaScript/Reference/Global_Objects/String

- id: js.types.boolean
  title: 불리언(boolean)
  importance: standard
  summary: 불리언은 true(참)와 false(거짓) 두 값뿐인 자료형이에요. 소문자로, 따옴표 없이 써요.
  prerequisites: [js.types.primitives]
  misconceptions: [js.mc.quoted-boolean, js.mc.boolean-capitalized]
  mdn: Web/JavaScript/Reference/Global_Objects/Boolean

- id: js.types.typeof
  title: typeof로 자료형 확인하기
  importance: core
  summary: typeof 값은 그 값의 자료형 이름을 "number", "string" 같은 문자열로 알려 줘요. 단, typeof null은 오래된 설계 실수 때문에 "object"예요.
  prerequisites: [js.types.primitives]
  misconceptions: [js.mc.typeof-null-is-null, js.mc.typeof-reads-content, js.mc.typeof-result-not-string]
  mdn: Web/JavaScript/Reference/Operators/typeof

# ── 모듈 2. 값과 변수: null-undefined ──

- id: js.types.undefined
  title: undefined
  importance: standard
  summary: undefined는 "아직 값이 정해지지 않음"을 뜻하는 값이에요. 값 없이 만든 변수에는 JavaScript가 자동으로 undefined를 넣어요. 변수가 아예 없다는 오류(is not defined)와는 달라요.
  prerequisites: [js.types.primitives]
  misconceptions: [js.mc.undefined-is-error, js.mc.not-defined-is-undefined]
  mdn: Web/JavaScript/Reference/Global_Objects/undefined

- id: js.types.null
  title: "null"
  importance: standard
  summary: null은 프로그래머가 "값이 없음"을 일부러 표시할 때 넣는 값이에요. undefined와 비슷하지만 다른 값이고, 숫자 0이나 빈 문자열 ""과도 달라요.
  prerequisites: [js.types.undefined]
  misconceptions: [js.mc.null-undefined-same, js.mc.empty-value-is-zero]
  mdn: Web/JavaScript/Reference/Operators/null

# ── 모듈 2. 값과 변수: var-and-tdz ──

- id: js.values.var
  title: var로 변수 만들기
  importance: standard
  summary: var는 let 이전에 쓰던 변수 선언이에요. 선언 전에 써도 오류 없이 undefined가 나오고, 같은 이름으로 다시 선언해도 오류가 나지 않아서 실수를 숨겨요. 새 코드에서는 let과 const를 써요.
  prerequisites: [js.values.let, js.types.undefined]
  misconceptions: [js.mc.var-hoists-value, js.mc.var-redeclare-silent]
  mdn: Web/JavaScript/Reference/Statements/var

- id: js.values.tdz
  title: 선언 전 사용과 TDZ
  importance: standard
  summary: let과 const로 만든 변수는 선언하는 줄이 실행되기 전에는 쓸 수 없어요. 그 전에 쓰면 ReferenceError(Cannot access ... before initialization)가 나요. 이 구간을 TDZ(일시적 사각지대)라고 불러요.
  prerequisites: [js.values.const, js.values.var]
  misconceptions: [js.mc.let-before-declaration-undefined, js.mc.tdz-means-misspelled]
  mdn: Web/JavaScript/Reference/Statements/let
