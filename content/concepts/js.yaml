# JavaScript 개념
# 선수 관계는 직접 필요한 것만 적습니다(추이적 관계는 적지 않음).

# ── 모듈 1. 시작하기: first-program ──

- id: js.basics.statements
  title: 문장과 실행 순서
  importance: standard
  summary: 프로그램은 문장의 목록이고, 위에서 아래로 한 문장씩 차례대로 실행돼요. 문장 끝은 세미콜론(;)으로 표시해요.
  misconceptions: [js.mc.expression-prints-itself]
  mdn: Web/JavaScript/Reference/Statements

- id: js.basics.console-log
  title: console.log로 출력하기
  importance: standard
  summary: console.log(값)은 괄호 안의 값을 콘솔에 보여 줘요. 결과를 눈으로 확인하는 가장 기본적인 방법이에요.
  prerequisites: [js.basics.statements]
  misconceptions: [js.mc.log-prints-quotes, js.mc.quoted-expression-evaluates, js.mc.log-is-return]
  mdn: Web/API/console/log_static

- id: js.basics.comments
  title: 주석
  importance: minor
  summary: "// 뒤의 내용이나 /* */ 사이의 내용은 실행되지 않는 메모(주석)예요."
  prerequisites: [js.basics.statements]
  misconceptions: [js.mc.line-comment-multiline]
  mdn: Web/JavaScript/Guide/Grammar_and_types

# ── 모듈 1. 시작하기: reading-errors ──

- id: js.errors.error-messages
  title: 오류 메시지 읽기
  importance: standard
  summary: 오류 메시지는 종류, 설명, 위치(파일과 줄 번호)로 이루어져 있고, 실행 중 오류가 나면 프로그램은 그 자리에서 멈춰요.
  prerequisites: [js.basics.console-log]
  misconceptions: [js.mc.code-after-error-runs, js.mc.error-line-is-cause]
  mdn: Web/JavaScript/Reference/Errors

- id: js.errors.error-types
  title: 오류의 종류
  importance: standard
  summary: SyntaxError는 문법을 어겨 프로그램이 아예 시작되지 않는 오류, ReferenceError는 없는 이름을 쓴 오류, TypeError는 값을 할 수 없는 방식으로 쓴 오류예요.
  prerequisites: [js.errors.error-messages]
  misconceptions: [js.mc.syntax-error-partial-run, js.mc.typo-is-syntax-error]
  mdn: Web/JavaScript/Reference/Global_Objects/Error

# ── 모듈 2. 값과 변수: variables ──

- id: js.values.let
  title: let으로 변수 만들기
  importance: core
  summary: let 이름 = 값; 으로 값에 이름을 붙여 저장하고, 그 이름으로 값을 꺼내 써요. let 변수는 나중에 다른 값을 넣을 수 있어요.
  prerequisites: [js.basics.console-log]
  misconceptions: [js.mc.variable-name-in-quotes, js.mc.let-again-to-change, js.mc.let-needs-initial-value]
  mdn: Web/JavaScript/Reference/Statements/let

- id: js.values.assignment
  title: 대입
  importance: core
  summary: "=는 \"같다\"가 아니라 오른쪽 값을 계산해 왼쪽 변수에 넣는 대입이에요. 대입은 그 순간의 값을 복사할 뿐, 변수끼리 연결하지 않아요."
  prerequisites: [js.values.let]
  misconceptions: [js.mc.assign-is-equality, js.mc.assign-direction, js.mc.variable-remembers-formula]
  mdn: Web/JavaScript/Reference/Operators/Assignment

- id: js.values.const
  title: const로 상수 만들기
  importance: core
  summary: const로 만든 이름에는 처음 넣은 값 대신 다른 값을 다시 대입할 수 없어요. 선언할 때 반드시 값을 넣어야 해요.
  prerequisites: [js.values.assignment, { id: js.errors.error-types, strength: helpful }]
  misconceptions: [js.mc.const-can-reassign, js.mc.const-declare-later, js.mc.const-is-immutable]
  mdn: Web/JavaScript/Reference/Statements/const

- id: js.values.identifiers
  title: 변수 이름 규칙
  importance: standard
  summary: 이름은 글자·숫자·_·$로 쓰되 숫자로 시작할 수 없고, 공백·하이픈과 예약어는 쓸 수 없어요. 대문자와 소문자는 다른 글자로 구분해요.
  prerequisites: [js.values.let]
  misconceptions: [js.mc.identifier-case-insensitive, js.mc.identifier-invalid-chars]
  mdn: Web/JavaScript/Guide/Grammar_and_types

# ── 모듈 2. 값과 변수: data-types ──

- id: js.types.primitives
  title: 값의 종류(원시 자료형)
  importance: core
  summary: 모든 값에는 종류(자료형)가 있어요. 숫자 5와 글자 "5"는 겉모습이 비슷해도 자료형이 다른 값이에요. 자료형은 변수가 아니라 값에 붙어 있어서, 한 변수에 다른 자료형의 값을 다시 넣을 수 있어요.
  prerequisites: [js.values.assignment]
  misconceptions: [js.mc.quoted-number-is-number, js.mc.type-belongs-to-variable, js.mc.same-output-same-type]
  mdn: Web/JavaScript/Guide/Data_structures

- id: js.types.number
  title: 숫자(number)
  importance: standard
  summary: 정수와 소수는 모두 같은 number 자료형이에요. 숫자에는 따옴표를 붙이지 않고, 1,000처럼 쉼표로 자릿수를 나누지 않아요.
  prerequisites: [js.types.primitives]
  misconceptions: [js.mc.decimal-separate-type, js.mc.number-with-comma]
  mdn: Web/JavaScript/Reference/Global_Objects/Number

- id: js.types.string
  title: 문자열(string)
  importance: standard
  summary: 따옴표로 감싼 글자는 문자열이에요. 작은따옴표와 큰따옴표 중 무엇을 써도 같은 문자열이지만, 여는 따옴표와 닫는 따옴표는 같은 종류여야 해요.
  prerequisites: [js.types.primitives]
  misconceptions: [js.mc.quote-kinds-differ, js.mc.quotes-mismatch]
  mdn: Web/JavaScript/Reference/Global_Objects/String

- id: js.types.boolean
  title: 불리언(boolean)
  importance: standard
  summary: 불리언은 true(참)와 false(거짓) 두 값뿐인 자료형이에요. 소문자로, 따옴표 없이 써요.
  prerequisites: [js.types.primitives]
  misconceptions: [js.mc.quoted-boolean, js.mc.boolean-capitalized]
  mdn: Web/JavaScript/Reference/Global_Objects/Boolean

- id: js.types.typeof
  title: typeof로 자료형 확인하기
  importance: core
  summary: typeof 값은 그 값의 자료형 이름을 "number", "string" 같은 문자열로 알려 줘요. 단, typeof null은 오래된 설계 실수 때문에 "object"예요.
  prerequisites: [js.types.primitives]
  misconceptions: [js.mc.typeof-null-is-null, js.mc.typeof-reads-content, js.mc.typeof-result-not-string]
  mdn: Web/JavaScript/Reference/Operators/typeof

# ── 모듈 2. 값과 변수: null-undefined ──

- id: js.types.undefined
  title: undefined
  importance: standard
  summary: undefined는 "아직 값이 정해지지 않음"을 뜻하는 값이에요. 값 없이 만든 변수에는 JavaScript가 자동으로 undefined를 넣어요. 변수가 아예 없다는 오류(is not defined)와는 달라요.
  prerequisites: [js.types.primitives]
  misconceptions: [js.mc.undefined-is-error, js.mc.not-defined-is-undefined]
  mdn: Web/JavaScript/Reference/Global_Objects/undefined

- id: js.types.null
  title: "null"
  importance: standard
  summary: null은 프로그래머가 "값이 없음"을 일부러 표시할 때 넣는 값이에요. undefined와 비슷하지만 다른 값이고, 숫자 0이나 빈 문자열 ""과도 달라요.
  prerequisites: [js.types.undefined]
  misconceptions: [js.mc.null-undefined-same, js.mc.empty-value-is-zero]
  mdn: Web/JavaScript/Reference/Operators/null

# ── 모듈 2. 값과 변수: var-and-tdz ──

- id: js.values.var
  title: var로 변수 만들기
  importance: standard
  summary: var는 let 이전에 쓰던 변수 선언이에요. 선언 전에 써도 오류 없이 undefined가 나오고, 같은 이름으로 다시 선언해도 오류가 나지 않아서 실수를 숨겨요. 새 코드에서는 let과 const를 써요.
  prerequisites: [js.values.let, js.types.undefined]
  misconceptions: [js.mc.var-hoists-value, js.mc.var-redeclare-silent]
  mdn: Web/JavaScript/Reference/Statements/var

- id: js.values.tdz
  title: 선언 전 사용과 TDZ
  importance: standard
  summary: let과 const로 만든 변수는 선언하는 줄이 실행되기 전에는 쓸 수 없어요. 그 전에 쓰면 ReferenceError(Cannot access ... before initialization)가 나요. 이 구간을 TDZ(일시적 사각지대)라고 불러요.
  prerequisites: [js.values.const, js.values.var]
  misconceptions: [js.mc.let-before-declaration-undefined, js.mc.tdz-means-misspelled]
  mdn: Web/JavaScript/Reference/Statements/let

# ── 모듈 3. 연산자와 형 변환: arithmetic ──

- id: js.ops.arithmetic
  title: 산술 연산자
  importance: core
  summary: "+ - * / **로 숫자를 계산해요. 계산식은 새 값을 만들 뿐 변수를 바꾸지 않고, /는 나머지를 버리지 않고 소수까지 계산해요."
  prerequisites: [js.types.number, js.values.let]
  misconceptions: [js.mc.division-truncates, js.mc.caret-is-power, js.mc.expression-changes-variable]
  mdn: Web/JavaScript/Guide/Expressions_and_operators

- id: js.ops.precedence
  title: 연산자 우선순위
  importance: standard
  summary: "괄호 안을 가장 먼저, 그다음 거듭제곱(**), 곱셈·나눗셈·나머지(* / %), 덧셈·뺄셈(+ -) 순서로 계산해요. 순서가 같으면 왼쪽부터 계산해요(거듭제곱끼리만 오른쪽부터)."
  prerequisites: [js.ops.arithmetic]
  misconceptions: [js.mc.always-left-to-right, js.mc.multiply-before-divide]
  mdn: Web/JavaScript/Reference/Operators/Operator_precedence

- id: js.ops.remainder
  title: 나머지 연산자
  importance: standard
  summary: "a % b는 a를 b로 나눈 나머지예요. 짝수·홀수 판단이나 묶고 남는 개수를 구할 때 써요."
  prerequisites: [js.ops.arithmetic]
  misconceptions: [js.mc.remainder-is-percent, js.mc.remainder-is-quotient]
  mdn: Web/JavaScript/Reference/Operators/Remainder

- id: js.ops.compound-assignment
  title: 복합 대입 연산자
  importance: standard
  summary: "x += 5는 x = x + 5의 줄임말이에요. -=, *=, /=, %=, **=도 같은 방식으로, 오른쪽 전체를 먼저 계산한 뒤 연산해서 다시 넣어요."
  prerequisites: [js.ops.arithmetic, js.values.assignment]
  misconceptions: [js.mc.compound-operator-reversed, js.mc.compound-right-side-split]
  mdn: Web/JavaScript/Reference/Operators/Addition_assignment

- id: js.ops.increment
  title: 증가·감소 연산자
  importance: standard
  summary: "count++와 ++count는 모두 count를 1 늘려요. 식의 값은 다른데, count++는 늘리기 전 값, ++count는 늘린 뒤 값이에요."
  prerequisites: [js.ops.compound-assignment]
  misconceptions: [js.mc.postfix-prefix-same]
  mdn: Web/JavaScript/Reference/Operators/Increment

# ── 모듈 3. 연산자와 형 변환: comparison ──

- id: js.ops.strict-equality
  title: 일치 연산자 (===, !==)
  importance: core
  summary: "a === b는 자료형과 값이 모두 같으면 true, 아니면 false예요. !==는 그 반대예요. 비교 결과는 항상 true나 false예요."
  prerequisites: [js.types.boolean, js.types.primitives]
  misconceptions: [js.mc.strict-equality-ignores-type, js.mc.nan-equals-nan, js.mc.assign-as-compare]
  mdn: Web/JavaScript/Reference/Operators/Strict_equality

- id: js.ops.loose-equality
  title: 동등 연산자 (==, !=)
  importance: standard
  summary: "==는 자료형이 다르면 한쪽을 바꿔서 비교해요. 그래서 \"5\" == 5가 true예요. 결과를 예측하기 어려워서 보통 ===를 써요."
  prerequisites: [js.ops.strict-equality]
  misconceptions: [js.mc.loose-equals-like-strict]
  mdn: Web/JavaScript/Reference/Operators/Equality

- id: js.ops.relational
  title: 대소 비교 연산자
  importance: core
  summary: "< > <= >=로 크기를 비교해요. 숫자와 문자열을 비교하면 숫자로 바꿔 비교하지만, 문자열끼리는 사전 순서(글자 하나씩)로 비교해요."
  prerequisites: [js.ops.strict-equality, js.types.string]
  misconceptions: [js.mc.string-compare-numeric, js.mc.chained-comparison, js.mc.mixed-compare-as-string]
  mdn: Web/JavaScript/Reference/Operators/Less_than

# ── 모듈 3. 연산자와 형 변환: logical ──

- id: js.ops.logical-and-or-not
  title: 논리 연산자 (&&, ||, !)
  importance: core
  summary: "&&는 둘 다 참일 때, ||는 하나라도 참일 때 참이에요. !는 참과 거짓을 뒤집어요. 우선순위는 ! → && → || 순서예요."
  prerequisites: [js.ops.relational]
  misconceptions: [js.mc.or-is-exclusive, js.mc.and-or-same-precedence, js.mc.not-applies-to-whole]
  mdn: Web/JavaScript/Reference/Operators/Logical_AND

- id: js.ops.short-circuit
  title: 단락 평가
  importance: core
  summary: "&&와 ||는 왼쪽만 보고 결과가 정해지면 오른쪽을 계산하지 않아요. 결과도 true/false가 아니라 왼쪽이나 오른쪽 값 그 자체예요."
  prerequisites: [js.ops.logical-and-or-not]
  misconceptions: [js.mc.logical-returns-boolean, js.mc.right-side-always-runs, js.mc.or-default-keeps-zero]
  mdn: Web/JavaScript/Reference/Operators/Logical_OR

- id: js.ops.nullish
  title: null 병합 연산자 (??)
  importance: standard
  summary: "a ?? b는 a가 null이나 undefined일 때만 b예요. 0이나 빈 문자열은 그대로 두므로, 기본값을 정할 때 ||보다 안전해요."
  prerequisites: [js.ops.short-circuit, js.types.null]
  misconceptions: [js.mc.nullish-same-as-or]
  mdn: Web/JavaScript/Reference/Operators/Nullish_coalescing

# ── 모듈 3. 연산자와 형 변환: explicit-conversion ──

- id: js.conv.to-number
  title: 숫자로 바꾸기
  importance: standard
  summary: "Number(값)은 값 전체를 숫자로 바꾸고, 숫자로 읽을 수 없으면 NaN이에요. parseInt·parseFloat는 앞에서부터 읽을 수 있는 데까지만 숫자로 읽어요."
  prerequisites: [js.ops.arithmetic, js.types.string]
  misconceptions: [js.mc.number-parses-prefix, js.mc.empty-string-to-nan]
  mdn: Web/JavaScript/Reference/Global_Objects/Number/Number

- id: js.conv.to-string
  title: 문자열로 바꾸기
  importance: minor
  summary: "String(값)은 어떤 값이든 글자로 바꿔요. null은 \"null\", true는 \"true\"처럼 보이는 그대로 글자가 돼요."
  prerequisites: [js.types.string]
  misconceptions: [js.mc.string-of-null-empty]
  mdn: Web/JavaScript/Reference/Global_Objects/String/String

- id: js.conv.to-boolean
  title: 불리언으로 바꾸기
  importance: minor
  summary: "Boolean(값)이나 !!값은 값을 true나 false로 바꿔요. 글자의 내용은 보지 않으므로 \"false\"라는 글자도 true가 돼요."
  prerequisites: [js.ops.logical-and-or-not, js.types.boolean]
  misconceptions: [js.mc.boolean-reads-string-content]
  mdn: Web/JavaScript/Reference/Global_Objects/Boolean/Boolean

- id: js.conv.nan
  title: NaN
  importance: standard
  summary: "NaN은 \"숫자가 아님\"을 뜻하는 숫자 자료형의 값이에요. 변환이나 계산이 실패하면 오류 대신 NaN이 나오고, 확인은 Number.isNaN으로 해요."
  prerequisites: [js.conv.to-number]
  misconceptions: [js.mc.nan-type-not-number, js.mc.failed-conversion-throws]
  mdn: Web/JavaScript/Reference/Global_Objects/NaN

# ── 모듈 3. 연산자와 형 변환: implicit-coercion ──

- id: js.conv.truthy-falsy
  title: truthy와 falsy
  importance: core
  summary: "false, 0, \"\", null, undefined, NaN은 참·거짓이 필요한 곳에서 거짓(falsy)으로 취급돼요. 나머지 값은 \"0\"이나 \" \"까지 모두 참(truthy)이에요."
  prerequisites: [js.conv.to-boolean]
  misconceptions: [js.mc.string-zero-falsy, js.mc.empty-array-falsy, js.mc.space-string-falsy]
  mdn: Web/JavaScript/Reference/Global_Objects/Boolean

- id: js.conv.plus-concat
  title: + 연산자와 문자열 이어 붙이기
  importance: core
  summary: "+는 한쪽이라도 문자열이면 글자를 이어 붙여요. 왼쪽부터 하나씩 계산하므로 1 + 2 + \"3\"은 \"33\"이에요. - * /는 문자열을 숫자로 바꿔 계산해요."
  prerequisites: [js.ops.arithmetic, js.conv.to-number]
  misconceptions: [js.mc.plus-string-adds, js.mc.concat-whole-expression, js.mc.minus-string-fails]
  mdn: Web/JavaScript/Reference/Operators/Addition

- id: js.conv.equality-coercion
  title: ==의 형 변환 규칙
  importance: standard
  summary: "==는 문자열과 불리언을 숫자로 바꿔 비교해요. null은 null·undefined와만 같고, NaN은 무엇과도 같지 않아요."
  prerequisites: [js.ops.loose-equality, js.conv.to-number]
  misconceptions: [js.mc.null-loose-equals-zero, js.mc.loose-equality-uses-truthiness]
  mdn: Web/JavaScript/Reference/Operators/Equality

# ── 모듈 4. 조건문: if-else ──

- id: js.control.if
  title: if와 else
  importance: core
  summary: if (조건) { ... }은 조건이 참일 때만 블록을 실행하고, else { ... }는 조건이 거짓일 때 실행해요. 어느 쪽을 실행하든 조건문이 끝나면 다음 문장으로 넘어가요.
  prerequisites: [js.types.boolean, js.ops.strict-equality, js.ops.relational, { id: js.ops.logical-and-or-not, strength: helpful }, { id: js.conv.truthy-falsy, strength: helpful }]
  misconceptions: [js.mc.false-if-stops-program, js.mc.else-has-condition]
  mdn: Web/JavaScript/Reference/Statements/if...else

- id: js.control.else-if
  title: else if로 여러 갈래 나누기
  importance: core
  summary: if … else if … else 체인은 위에서부터 조건을 차례로 검사해, 처음으로 참인 블록 하나만 실행해요. 그래서 조건을 적는 순서가 결과를 바꿔요.
  prerequisites: [js.control.if]
  misconceptions: [js.mc.else-if-runs-all, js.mc.else-if-order-irrelevant, js.mc.separate-ifs-like-chain]
  mdn: Web/JavaScript/Reference/Statements/if...else

- id: js.control.block
  title: 블록과 중첩 조건문
  importance: standard
  summary: 중괄호 { }로 묶은 블록은 여러 문장을 하나로 묶어 조건에 딸리게 해요. 블록 안에 다른 if를 넣어 조건을 겹겹이 검사할 수도 있어요. 들여쓰기는 사람을 위한 표시일 뿐이에요.
  prerequisites: [js.control.if]
  misconceptions: [js.mc.indent-makes-block, js.mc.semicolon-after-if]
  mdn: Web/JavaScript/Reference/Statements/block

# ── 모듈 4. 조건문: switch ──

- id: js.control.switch
  title: switch 문
  importance: standard
  summary: switch (값)은 값과 ===로 같은 case를 찾아 그 자리부터 실행해요. 같은 case가 없으면 default를 실행해요. 한 값을 여러 후보와 비교할 때 else if 체인보다 읽기 쉬워요.
  prerequisites: [js.control.else-if, js.ops.strict-equality]
  misconceptions: [js.mc.switch-loose-compare, js.mc.switch-case-condition]
  mdn: Web/JavaScript/Reference/Statements/switch

- id: js.control.fallthrough
  title: break와 fall-through
  importance: standard
  summary: switch는 맞는 case에서 시작해 break를 만날 때까지 아래 case의 코드도 계속 실행해요(fall-through). 그래서 case마다 break를 쓰고, 여러 case가 같은 일을 할 때만 일부러 break를 빼요.
  prerequisites: [js.control.switch]
  misconceptions: [js.mc.switch-no-break-stops]
  mdn: Web/JavaScript/Reference/Statements/switch

# ── 모듈 4. 조건문: ternary ──

- id: js.control.ternary
  title: 조건 연산자(삼항 연산자)
  importance: standard
  summary: '조건 ? 값1 : 값2는 조건이 참이면 값1, 거짓이면 값2가 되는 식이에요. 두 값 중 하나를 골라 변수에 넣거나 바로 쓸 때 if-else보다 짧게 쓸 수 있어요.'
  prerequisites: [js.control.if, { id: js.ops.precedence, strength: helpful }, { id: js.conv.plus-concat, strength: helpful }]
  misconceptions: [js.mc.ternary-as-statement, js.mc.ternary-result-discarded, js.mc.ternary-precedence]
  mdn: Web/JavaScript/Reference/Operators/Conditional_operator

# ── 모듈 5. 반복문: while ──

- id: js.loops.while
  title: while 반복
  importance: standard
  summary: while (조건) { ... }은 조건이 참인 동안 블록을 되풀이해 실행해요. 조건은 본문을 시작하기 전에만 검사하고, 본문을 끝까지 실행한 뒤 다시 검사해요.
  prerequisites: [js.control.if, js.ops.increment]
  misconceptions: [js.mc.while-checks-mid-body, js.mc.while-runs-at-least-once]
  mdn: Web/JavaScript/Reference/Statements/while

- id: js.loops.do-while
  title: do...while 반복
  importance: minor
  summary: do { ... } while (조건);은 본문을 먼저 한 번 실행한 뒤 조건을 검사해요. 그래서 조건이 처음부터 거짓이어도 본문이 적어도 한 번은 실행돼요.
  prerequisites: [js.loops.while]
  misconceptions: [js.mc.do-while-checks-first]
  mdn: Web/JavaScript/Reference/Statements/do...while

- id: js.loops.infinite
  title: 무한 반복
  importance: standard
  summary: 반복 조건이 끝내 거짓이 되지 않으면 반복이 영원히 계속돼요(무한 반복). 본문 안에서 조건에 쓰인 변수를 끝나는 쪽으로 바꿔야 해요. JavaScript는 무한 반복을 오류로 알려 주지 않아요.
  prerequisites: [js.loops.while]
  misconceptions: [js.mc.while-auto-update, js.mc.infinite-loop-error]
  mdn: Web/JavaScript/Guide/Loops_and_iteration

# ── 모듈 5. 반복문: for ──

- id: js.loops.for
  title: for 반복
  importance: core
  summary: for (초기화; 조건; 갱신) { ... }은 초기화를 한 번 실행한 뒤, 조건 검사 → 본문 → 갱신을 조건이 거짓이 될 때까지 되풀이해요. 정해진 횟수만큼 반복할 때 써요.
  prerequisites: [js.loops.while]
  misconceptions: [js.mc.for-off-by-one, js.mc.for-update-before-body, js.mc.for-init-every-time]
  mdn: Web/JavaScript/Reference/Statements/for

- id: js.loops.loop-variable
  title: 반복 변수
  importance: standard
  summary: 반복 횟수를 세는 변수(i 같은 반복 변수)는 회차마다 값이 바뀌어 본문에서 계산에 쓸 수 있어요. for (let i ...)의 i는 반복 안에서만 쓸 수 있고, 반복이 끝난 뒤의 값은 조건을 거짓으로 만든 값이에요.
  prerequisites: [js.loops.for, js.control.block]
  misconceptions: [js.mc.loop-var-outside-for, js.mc.loop-var-final-value]
  mdn: Web/JavaScript/Reference/Statements/for

- id: js.loops.accumulator-pattern
  title: 누적 패턴
  importance: core
  summary: 합계·개수·이어 붙인 글자처럼 반복하며 값을 모을 때는 누적 변수를 반복 바깥에서 시작값(0이나 "")으로 만들고, 본문에서 += 같은 연산으로 조금씩 더해요.
  prerequisites: [js.loops.for, js.ops.compound-assignment]
  misconceptions: [js.mc.accumulator-reset-in-loop, js.mc.accumulator-overwrite, js.mc.accumulator-no-init]
  mdn: Web/JavaScript/Reference/Operators/Addition_assignment

# ── 모듈 5. 반복문: break-continue ──

- id: js.loops.break
  title: break로 반복 끝내기
  importance: standard
  summary: 반복 안에서 break를 만나면 그 반복을 바로 끝내고 반복 다음 문장으로 넘어가요. 찾던 것을 찾았을 때처럼 더 반복할 필요가 없을 때 써요. 반복이 겹쳐 있으면 가장 가까운 반복 하나만 끝내요.
  prerequisites: [js.loops.for]
  misconceptions: [js.mc.break-exits-all-loops, js.mc.break-ends-program]
  mdn: Web/JavaScript/Reference/Statements/break

- id: js.loops.continue
  title: continue로 건너뛰기
  importance: standard
  summary: continue를 만나면 이번 회차의 남은 본문을 건너뛰고 다음 회차로 넘어가요. for에서는 갱신식을 실행한 뒤 조건을 검사하고, while에서는 바로 조건을 검사해요. 반복 자체는 끝나지 않아요.
  prerequisites: [js.loops.for]
  misconceptions: [js.mc.continue-ends-loop, js.mc.continue-while-update]
  mdn: Web/JavaScript/Reference/Statements/continue

# ── 모듈 5. 반복문: nested-loops ──

- id: js.loops.nested
  title: 중첩 반복
  importance: standard
  summary: 반복 안에 반복을 넣으면 바깥 반복이 한 번 돌 때마다 안쪽 반복이 처음부터 끝까지 다시 돌아요. 그래서 안쪽 본문은 (바깥 횟수 × 안쪽 횟수)번 실행돼요. 표나 격자를 만들 때 써요.
  prerequisites: [js.loops.for, js.control.block]
  misconceptions: [js.mc.inner-var-not-reset, js.mc.nested-count-additive]
  mdn: Web/JavaScript/Guide/Loops_and_iteration

# ── 모듈 6. 함수: function-basics ──

- id: js.fn.declaration
  title: 함수 선언
  importance: core
  summary: function 이름(매개변수) { 본문 }으로 코드 묶음에 이름을 붙여 둬요. 선언은 함수를 만들어 두기만 하고, 본문은 호출하기 전까지 실행되지 않아요.
  prerequisites: [js.basics.statements, js.control.block]
  misconceptions: [js.mc.declaration-runs-function]
  mdn: Web/JavaScript/Reference/Statements/function

- id: js.fn.call
  title: 함수 호출
  importance: standard
  summary: 함수 이름 뒤에 괄호를 붙여(이름()) 부르면 본문이 처음부터 실행되고, 끝나면 부른 자리로 돌아와요. 같은 함수를 몇 번이든 다시 부를 수 있고, 괄호 없이 이름만 쓰면 실행되지 않아요.
  prerequisites: [js.fn.declaration]
  misconceptions: [js.mc.call-without-parens, js.mc.function-runs-once]
  mdn: Web/JavaScript/Guide/Functions

- id: js.fn.params-args
  title: 매개변수와 인수
  importance: core
  summary: 매개변수는 함수를 선언할 때 괄호 안에 적는 이름이고, 인수는 호출할 때 넘기는 값이에요. 인수는 이름이 아니라 순서대로 매개변수에 들어가고, 매개변수는 함수 안에서만 쓰는 변수처럼 동작해요.
  prerequisites: [js.fn.call, js.values.assignment]
  misconceptions: [js.mc.params-match-by-name, js.mc.param-redeclare-with-let]
  mdn: Web/JavaScript/Guide/Functions

- id: js.fn.return
  title: return으로 값 돌려주기
  importance: core
  summary: return 값;은 함수를 끝내고 그 값을 호출한 자리로 돌려줘요. 돌려받은 값은 변수에 담거나 계산에 바로 쓸 수 있어요. console.log는 화면에 보여 주기만 하고 값을 돌려주지 않아요.
  prerequisites: [js.fn.call]
  misconceptions: [js.mc.return-is-log, js.mc.return-value-auto-printed, js.mc.return-changes-outer-variable, js.mc.code-after-return-runs]
  mdn: Web/JavaScript/Reference/Statements/return

# ── 모듈 6. 함수: return-and-side-effects ──

- id: js.fn.side-effects
  title: 부수 효과
  importance: standard
  summary: 함수가 값을 돌려주는 것 말고 바깥에 남기는 흔적(콘솔 출력, 바깥 변수 바꾸기 등)을 부수 효과라고 해요. 부수 효과는 함수를 호출할 때만 일어나고, 반환값을 담은 변수를 쓴다고 다시 일어나지 않아요.
  prerequisites: [js.fn.return]
  misconceptions: [js.mc.function-cant-change-outer, js.mc.side-effect-repeats-on-reuse]
  mdn: Web/JavaScript/Guide/Functions

- id: js.fn.undefined-return
  title: 반환값이 없는 함수
  importance: standard
  summary: return이 없거나, return 뒤에 값이 없거나, 실행된 갈래에 return이 없으면 함수는 undefined를 반환해요. null이나 0이 아니에요.
  prerequisites: [js.fn.return, js.types.undefined]
  misconceptions: [js.mc.no-return-is-null, js.mc.return-in-if-covers-all]
  mdn: Web/JavaScript/Reference/Statements/return

- id: js.fn.pure
  title: 순수 함수
  importance: minor
  summary: 같은 인수를 넣으면 항상 같은 값을 돌려주고 부수 효과가 없는 함수를 순수 함수라고 해요. 바깥 변수에 기대거나 바깥 변수를 바꾸는 함수는 같은 인수여도 결과가 달라질 수 있어요.
  prerequisites: [js.fn.side-effects, js.fn.params-args]
  misconceptions: [js.mc.same-args-same-result-always]
  mdn: Web/JavaScript/Guide/Functions

# ── 모듈 6. 함수: expressions-and-arrows ──

- id: js.fn.expression
  title: 함수 표현식
  importance: standard
  summary: const 이름 = function (매개변수) { ... };처럼 함수를 값으로 만들어 변수에 담는 방법이에요. 담기만 할 뿐 실행되지는 않고, 변수 이름 뒤에 괄호를 붙여 호출해요.
  prerequisites: [js.fn.declaration, js.values.const]
  misconceptions: [js.mc.fn-expression-stores-result]
  mdn: Web/JavaScript/Reference/Operators/function

- id: js.fn.arrow
  title: 화살표 함수
  importance: core
  summary: (매개변수) => 식은 function 키워드 없이 함수를 짧게 쓰는 방법이에요. 중괄호 없이 식 하나만 쓰면 그 값이 자동으로 반환되고, 중괄호를 쓰면 일반 함수처럼 return을 직접 써야 해요.
  prerequisites: [js.fn.expression, js.fn.return]
  misconceptions: [js.mc.arrow-is-comparison, js.mc.arrow-braces-implicit-return, js.mc.arrow-concise-with-return]
  mdn: Web/JavaScript/Reference/Functions/Arrow_functions

- id: js.fn.hoisting
  title: 함수 호이스팅
  importance: standard
  summary: 함수 선언은 코드가 실행되기 전에 미리 만들어져서 선언보다 위에서 호출해도 돼요(호이스팅). const로 만든 함수 표현식과 화살표 함수는 그 줄이 실행된 뒤에야 쓸 수 있어서, 먼저 부르면 ReferenceError가 나요.
  prerequisites: [js.fn.expression, js.values.tdz]
  misconceptions: [js.mc.expression-hoisted, js.mc.declaration-not-hoisted]
  mdn: Web/JavaScript/Guide/Functions

# ── 모듈 6. 함수: default-and-rest ──

- id: js.fn.default-params
  title: 기본값 매개변수
  importance: standard
  summary: 인수를 덜 넘기면 남는 매개변수는 오류 없이 undefined가 돼요. function f(count = 1)처럼 기본값을 적어 두면 인수가 없거나 undefined일 때 그 값을 써요. null이나 0을 넘기면 기본값을 쓰지 않아요.
  prerequisites: [js.fn.params-args, js.types.undefined]
  misconceptions: [js.mc.missing-arg-error, js.mc.default-on-null]
  mdn: Web/JavaScript/Reference/Functions/Default_parameters

- id: js.fn.rest-params
  title: 나머지 매개변수
  importance: standard
  summary: function f(...nums)처럼 마지막 매개변수 앞에 점 세 개를 붙이면, 앞 매개변수가 받고 남은 인수를 모두 한 묶음(배열)으로 모아요. nums.length로 개수를, nums[0]처럼 위치 번호로 값을 꺼내요. 나머지 매개변수는 맨 끝에만 둘 수 있어요.
  prerequisites: [js.fn.params-args, js.loops.for]
  misconceptions: [js.mc.rest-not-last, js.mc.rest-includes-named]
  mdn: Web/JavaScript/Reference/Functions/rest_parameters

# ── 모듈 6. 함수: scope-basics ──

- id: js.scope.block
  title: 블록 스코프
  importance: core
  summary: 중괄호 블록 안에서 let이나 const로 만든 변수는 그 블록 안에서만 쓸 수 있어요(블록 스코프). 블록이 끝나면 사라지므로 블록 밖에서 쓰면 ReferenceError가 나고, 다른 블록에서 같은 이름을 다시 만들어도 부딪히지 않아요.
  prerequisites: [js.control.block, js.values.let]
  misconceptions: [js.mc.block-let-visible-outside, js.mc.var-is-block-scoped, js.mc.sibling-blocks-name-conflict]
  mdn: Web/JavaScript/Reference/Statements/block

- id: js.scope.function
  title: 함수 스코프
  importance: standard
  summary: 함수 안에서 만든 변수와 매개변수는 그 함수 안에서만 쓸 수 있어요. 호출할 때마다 새로 만들어지고 호출이 끝나면 사라지기 때문에, 다음 호출로 값이 이어지지 않아요.
  prerequisites: [js.fn.declaration, js.scope.block]
  misconceptions: [js.mc.function-local-visible-outside, js.mc.function-var-persists]
  mdn: Web/JavaScript/Reference/Statements/function

- id: js.scope.global
  title: 전역 변수
  importance: standard
  summary: 어떤 블록이나 함수에도 들어 있지 않은 맨 바깥의 변수는 프로그램 어디서나 읽고 바꿀 수 있어요. 함수 안에서도 바깥 변수를 쓸 수 있고, 호출이 끝나도 값이 남아요. 엄격 모드에서는 let 없이 대입해도 전역 변수가 생기지 않고 ReferenceError가 나요.
  prerequisites: [js.scope.function]
  misconceptions: [js.mc.inner-cant-read-outer, js.mc.undeclared-assign-creates-global]
  mdn: Web/JavaScript/Guide/Grammar_and_types

- id: js.scope.shadowing
  title: 섀도잉
  importance: core
  summary: 안쪽 스코프에서 바깥과 같은 이름의 변수나 매개변수를 만들면, 안쪽에서는 그 이름이 안쪽 변수를 가리키고 바깥 변수는 가려져요(섀도잉). 안쪽 변수를 바꿔도 바깥 변수는 그대로예요.
  prerequisites: [js.scope.global, js.fn.params-args]
  misconceptions: [js.mc.param-reassign-changes-outer, js.mc.shadow-changes-outer, js.mc.shadow-reads-outer-before-decl]
  mdn: Web/JavaScript/Reference/Statements/let

# ── 모듈 6. 함수: callbacks-intro ──

- id: js.fn.first-class
  title: 값으로서의 함수
  importance: standard
  summary: JavaScript에서 함수는 숫자나 문자열처럼 값이에요. 변수에 담고, 다른 함수의 인수로 넘기고, typeof로 "function"을 확인할 수 있어요. 함수 이름(greet)은 함수 자체이고, greet()는 함수를 실행한 결과예요.
  prerequisites: [js.fn.expression]
  misconceptions: [js.mc.function-not-a-value, js.mc.assign-call-result]
  mdn: Web/JavaScript/Guide/Functions

- id: js.fn.callback
  title: 콜백 함수
  importance: standard
  summary: 다른 함수에 인수로 넘겨서, 그 함수가 필요할 때 대신 불러 주는 함수를 콜백이라고 해요. 넘길 때는 괄호 없이 함수 자체를 넘기고, 언제·몇 번·어떤 인수로 부를지는 받은 함수가 정해요.
  prerequisites: [js.fn.first-class, js.fn.arrow]
  misconceptions: [js.mc.callback-called-when-passed, js.mc.callback-runs-at-pass-time]
  mdn: Web/JavaScript/Guide/Functions
