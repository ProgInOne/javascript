name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ vars.CI_RUNNER == 'self-hosted' && fromJSON('["self-hosted","proginone"]') || 'ubuntu-latest' }}
    timeout-minutes: 30 # same checks as CI on a possibly busy self-hosted Mac
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # Per-runner directory: two self-hosted runners on one Mac share $HOME (D-055).
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build app and content
        run: |
          pnpm build
          pnpm content:build

      - name: Bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="proginone-${version}"
          git archive --format=tar --prefix="${name}/" HEAD > "${name}.tar"
          # GNU tar (GitHub-hosted) and bsdtar (self-hosted macOS) spell the path prefix differently.
          if tar --version | grep -q GNU; then
            tar --append -f "${name}.tar" --transform "s,^,${name}/," apps/web/dist content/dist/content.db
          else
            tar -rf "${name}.tar" -s ",^,${name}/," apps/web/dist content/dist/content.db
          fi
          gzip -9 "${name}.tar"
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A SemVer pre-release (`1.0.0-rc.1`) is published as a GitHub pre-release (D-075).
          pre=()
          if [[ "$version" == *-* ]]; then pre=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --title "ProgInOne ${version}" --notes-file notes.md \
            "${pre[@]}" "proginone-${version}.tar.gz" "proginone-${version}.tar.gz.sha256"
