name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runner choice: the repository variable CI_RUNNER=self-hosted sends jobs to the self-hosted
  # macOS runner (labels self-hosted, proginone; D-055). Without it, GitHub-hosted runners.
  check:
    name: lint · typecheck · test · build
    runs-on: ${{ vars.CI_RUNNER == 'self-hosted' && fromJSON('["self-hosted","proginone"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Dependency rules
        run: pnpm check:deps

      - name: Token contrast
        run: pnpm check:contrast

      - name: Test
        run: pnpm test

      - name: Content check
        run: pnpm content:check

      - name: Build
        run: pnpm build

      - name: Docs links
        run: pnpm check:links

      - name: Audit (high+)
        run: pnpm audit --prod --audit-level high

  e2e:
    name: e2e · visual · a11y
    if: vars.CI_RUNNER != 'self-hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host --init
    env:
      HOME: /root # Firefox/Chromium expect a writable HOME when running as root
      PW_VISUAL: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Execution verification of the real content in the same runner (needs Chromium, which
      # this image has). --frozen: the committed predict answer keys must be up to date.
      - name: Content run check
        run: pnpm content:check:run --frozen

      - name: Playwright
        working-directory: e2e
        run: pnpm exec playwright test

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # Same checks on the self-hosted macOS runner: job containers need a Linux runner, so the
  # Playwright suite (with visual regression) runs in the same image through Docker instead.
  e2e-self-hosted:
    name: e2e · visual · a11y
    if: vars.CI_RUNNER == 'self-hosted'
    runs-on: [self-hosted, proginone]
    timeout-minutes: 45 # Docker image start + full suite on a shared Mac; ~30 min under load
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install chromium

      - run: pnpm build

      - name: Content run check
        run: pnpm content:check:run --frozen

      - name: Playwright (Docker, same image as GitHub-hosted CI)
        run: bash tools/e2e-docker.sh

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
